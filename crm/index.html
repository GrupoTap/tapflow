    casa([n.numero, n.numero_exibicao, n.cliente_nome, n.titulo, n.coluna, n.contato_nome,
          compDe(n).observacao_card].join(' '), busca)
    && (!fil || fil.has(String(n.id))));
  pintarFiltrosCom();
  LEAD_SC_DESENHADO = chaveLeadSC();   // S50 · item 3
  const total = vis.reduce((s,n) => s + Number(n.valor_propostas || n.valor_estimado || 0), 0);
  document.getElementById('cResumo').textContent =
    vis.length + (busca && vis.length !== negocios.length ? ' de ' + negocios.length : '')
    + ' negócio(s) · ' + BRL(total) + ' em jogo';
  const nc = document.getElementById('nCom');
  if (nc && !aplicarPendencias()) nc.textContent = negocios.length || '';

  q.innerHTML = '';
  // As colunas vêm da tabela, não das linhas: coluna vazia CONTINUA no quadro.
  // Coluna que some quando esvazia esconde justamente a etapa em que ninguém
  // está trabalhando — que costuma ser a que precisa de atenção.
  COLS_COM.forEach(col => {
    const doCol = vis.filter(n => n.coluna === col.nome);
    const el = document.createElement('div');
    el.className = 'colCom';
    el.innerHTML = '<div class="colTit"><b></b><span class="cnt"></span></div>'
                 + '<div class="colTot"></div>'
                 + '<div class="colSub"></div><div class="colBody"></div>';
    el.querySelector('b').textContent = col.nome;
    el.querySelector('.cnt').textContent = doCol.length;
    // ── ITEM 5 (S41): O TOTAL EM R$ DA COLUNA ─────────────────────────────
    // Soma o que os cards MOSTRAM (`valorDoCard`) — inclusive o estimado, que
    // o card já exibe com "(estimado)"; o title separa as parcelas. Sempre na
    // segunda linha, até quando é R$ 0,00: é o que mantém todos os cabeçalhos
    // com a mesma altura (pedido do Bruno). Soma os cards VISÍVEIS: com um
    // filtro rápido ou uma busca ligados, o total é o do que está na tela.
    {
      const partes = { proposta:0, recusada:0, estimado:0 };
      doCol.forEach(n => { const x = valorDoCard(n); if (x.tipo) partes[x.tipo] += x.v; });
      const tot = partes.proposta + partes.recusada + partes.estimado;
      const ct = el.querySelector('.colTot');
      ct.textContent = BRL(tot);
      if (!tot) ct.classList.add('zero');
      const det = [];
      if (partes.proposta) det.push(BRL(partes.proposta) + ' em propostas');
      if (partes.recusada) det.push(BRL(partes.recusada) + ' recusados');
      if (partes.estimado) det.push(BRL(partes.estimado) + ' estimados (ainda sem proposta)');
      ct.title = (det.length ? det.join(' + ') : 'Nenhum valor lançado nesta coluna')
        + ((BUSCA.com || FILTRO_COM.size) ? ' · só os cards visíveis (há busca ou filtro ligado)' : '');
    }
    el.querySelector('.colSub').textContent = col.descricao || '';
    const body = el.querySelector('.colBody');

    if (!doCol.length){
      const v = document.createElement('p');
      v.className = 'colVazia'; v.textContent = 'nada aqui';
      body.appendChild(v);
    }
    // ITEM 6 (S37): nas colunas de negócio EM ANDAMENTO, o mais parado vai
    // para o topo. A consulta já vinha `order=coluna_ordem,dias_parado.desc`,
    // mas a regra fica explícita aqui — é ela que a tela promete, e não pode
    // depender de a busca ou um refresh devolverem a lista na mesma ordem.
    // `sort` é estável: empate mantém a ordem do servidor.
    const comContador = colunaComContador(col.nome);
    const lista = comContador
      ? doCol.slice().sort((a, b) => Number(b.dias_parado || 0) - Number(a.dias_parado || 0))
      : doCol;
    lista.forEach(n => body.appendChild(cardNegocio(n, comContador)));
    q.appendChild(el);
  });

  carregarLogos(vis.map(n => n.cliente_id));
}

const _LOGOS = new Map();

let _logosPedindo = false;

function iniciaisCliente(nome){
  const partes = String(nome||'?').replace(/[^\p{L}\p{N}\s]/gu,' ').trim().split(/\s+/)
    // "Ltda", "S/A" e companhia não identificam ninguém: "Siderúrgica Exemplo Ltda"
    // tem que virar GA, não GL.
    .filter(p => !/^(de|da|do|das|dos|e|ltda|me|epp|eireli|sa|s|cia|com|ind)$/i.test(p));
  if (!partes.length) return '?';
  if (partes.length === 1) return partes[0].slice(0,2).toUpperCase();
  return (partes[0][0] + partes[1][0]).toUpperCase();
}

function matizDoNome(nome){
  let h = 0;
  const s = String(nome||'');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function nomeCliente(c){
  if (!c) return '';
  const rs = c.razao_social || c.nome || '';
  return c.nome_fantasia && c.nome_fantasia !== rs ? rs + ' (' + c.nome_fantasia + ')' : rs;
}

function logoHTML(clienteId, nome, classe){
  const cache = clienteId ? _LOGOS.get(clienteId) : null;
  const dentro = cache
    ? '<img alt="" src="' + esc(cache) + '">'
    : '<i>' + esc(iniciaisCliente(nome)) + '</i>';
  return '<span class="' + (classe || 'logo') + ' logoCli' + (cache ? ' comImg' : '') + '" data-logo="'
    + esc(clienteId || '') + '" style="--h:' + matizDoNome(nome) + '">' + dentro + '</span>';
}

async function carregarLogos(ids){
  const faltam = [...new Set((ids||[]).filter(id => id && !_LOGOS.has(id)))];
  if (!faltam.length || DEMO || _logosPedindo) return;
  _logosPedindo = true;
  try{
    // pedaços de 60: uma URL com 500 uuids estoura o limite de tamanho do GET
    for (let i = 0; i < faltam.length; i += 60){
      const lote = faltam.slice(i, i + 60);
      const r = await get('clientes_logo?select=cliente_id,thumb&cliente_id=in.('
                          + lote.join(',') + ')');
      lote.forEach(id => _LOGOS.set(id, null));            // quem não veio, não tem
      (r||[]).forEach(x => _LOGOS.set(x.cliente_id, x.thumb));
      pintarLogosNaTela();
    }
  }catch(e){
    // Falhar aqui não pode estragar o quadro: as iniciais continuam servindo.
    // Marcar como "sem logo" evita ficar pedindo de novo a cada repintura.
    faltam.forEach(id => { if (!_LOGOS.has(id)) _LOGOS.set(id, null); });
  }finally{ _logosPedindo = false; }
}

function pintarLogosNaTela(){
  document.querySelectorAll('[data-logo]').forEach(el => {
    const url = _LOGOS.get(el.dataset.logo);
    if (!url || el.querySelector('img')) return;
    const img = document.createElement('img');
    img.alt = ''; img.src = url;
    el.innerHTML = ''; el.appendChild(img);
    el.classList.add('comImg');
  });
}

function reduzirImagem(file, lado, qualidade, comFundo, rente){
  return new Promise((ok, erro) => {
    const desenhar = (fonte) => {
      const img = new Image();
      img.onerror = () => erro(new Error('Esse arquivo não é uma imagem que o navegador abra.'));
      img.onload = () => {
        const e = Math.min(1, lado / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * e)), h = Math.max(1, Math.round(img.height * e));
        const cv = document.createElement('canvas');
        cv.width  = rente ? w : lado;
        cv.height = rente ? h : lado;
        const cx = cv.getContext('2d');
        if (comFundo){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); }
        cx.drawImage(img, rente ? 0 : (lado - w) / 2, rente ? 0 : (lado - h) / 2, w, h);
        // JPEG só quando há fundo branco: PNG transparente virando JPEG ganha
        // fundo preto, e a logo do cliente aparece dentro de um quadrado preto.
        ok({ dados: cv.toDataURL(comFundo ? 'image/jpeg' : 'image/png', qualidade),
             largura: img.width, altura: img.height });
      };
      img.src = fonte;
    };
    // aceita File (envio) e data-URL (a regeração parte do `original` já
    // guardado, que não é arquivo nenhum)
    if (typeof file === 'string') return desenhar(file);
    const fr = new FileReader();
    fr.onerror = () => erro(new Error('Não deu para ler o arquivo.'));
    fr.onload  = () => desenhar(fr.result);
    fr.readAsDataURL(file);
  });
}

const LOGO_THUMB_GERACAO = 2;

const LOGO_THUMB_PX = 256;

async function enviarLogoCliente(clienteId, f){
  if (!f) return false;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type || '')) throw new Error('Use uma imagem PNG, JPG ou WEBP.');
  if (f.size > 8 * 1024 * 1024) throw new Error('Arquivo acima de 8 MB. Use um menor.');
  // S32 · item 1: 128 → 256. A miniatura passou a ser o que aparece na FAIXA
  // do card, não mais um quadradinho de 22px, e 128px numa faixa de tela
  // retina fica visivelmente macia. 256px de JPEG de logomarca (cores chapadas)
  // pesa poucos KB; o quadro continua carregando em lotes de 60.
  // S34: a miniatura sai RENTE — sem a tarja branca que fazia a logo ocupar
  // metade da faixa do card. O `original` continua quadrado? Não: ele nunca
  // foi para a tela, vai para o cabeçalho do .docx, e lá a célula do Word já
  // dimensiona. Rente também, por coerência.
  const thumb    = await reduzirImagem(f, LOGO_THUMB_PX, 0.82, true,  true);
  const original = await reduzirImagem(f, 600,           0.92, false, true);
  if (!DEMO) await rpc('tf_salvar_logo_cliente', { p_cliente_id: clienteId,
    p_thumb: thumb.dados, p_original: original.dados,
    p_largura: thumb.largura, p_altura: thumb.altura, p_bytes: f.size,
    p_thumb_geracao: LOGO_THUMB_GERACAO });
  _LOGOS.set(clienteId, thumb.dados);
  return true;
}

async function tirarLogoCliente(clienteId){
  if (!DEMO) await rpc('tf_remover_logo_cliente', { p_cliente_id: clienteId });
  _LOGOS.set(clienteId, null);
}

function repintarLogo(clienteId, nome){
  document.querySelectorAll('[data-logo="' + clienteId + '"]').forEach(el => {
    const url = _LOGOS.get(clienteId);
    el.innerHTML = '';
    el.classList.toggle('comImg', !!url);
    if (url){ const im = document.createElement('img'); im.alt = ''; im.src = url; el.appendChild(im); }
    else { const it = document.createElement('i'); it.textContent = iniciaisCliente(nome || el.dataset.nome || ''); el.appendChild(it); }
  });
}

async function ligarLogoEditavel(lado, clienteId, nome, temLogo){
  if (!lado || !clienteId || !podeEscritorio()) return;
  const quad = lado.querySelector('[data-logo]');
  if (quad) quad.dataset.nome = nome || '';
  if (temLogo == null){
    if (_LOGOS.has(clienteId)) temLogo = !!_LOGOS.get(clienteId);
    else if (DEMO) temLogo = false;
    else {
      try{ const r = await get('clientes?select=tem_logo&id=eq.' + clienteId); temLogo = !!(r && r[0] && r[0].tem_logo); }
      catch(e){ temLogo = false; }
    }
  }
  const cx = document.createElement('div');
  cx.className = 'logoEdit';
  lado.appendChild(cx);
  const desenhar = (tem) => {
    cx.innerHTML = '<input type="file" accept="image/png,image/jpeg,image/webp" hidden>'
      + '<button class="btn mini" type="button" data-a="enviar">' + (tem ? 'Trocar' : 'Logomarca') + '</button>'
      + (tem ? '<button class="btn mini" type="button" data-a="tirar">Tirar</button>' : '');
    const inp = cx.querySelector('input'), bEnv = cx.querySelector('[data-a="enviar"]');
    bEnv.title = 'Enviar a logomarca do cliente (ou arraste a imagem sobre o quadrado)';
    bEnv.addEventListener('click', () => inp.click());
    inp.addEventListener('change', () => enviar(inp.files && inp.files[0]));
    const bT = cx.querySelector('[data-a="tirar"]');
    if (bT) bT.addEventListener('click', () => _semDuploEnvio_(bT, async () => {
      try{ await tirarLogoCliente(clienteId); repintarLogo(clienteId, nome); desenhar(false);
           toast('Logomarca removida.','ok'); }
      catch(e){ toast(e.message,'err'); }
    }));
  };
  const enviar = async (f) => {
    if (!f) return;
    const bEnv = cx.querySelector('[data-a="enviar"]');
    bEnv.disabled = true; bEnv.textContent = 'Enviando…';
    try{
      await enviarLogoCliente(clienteId, f);
      repintarLogo(clienteId, nome); desenhar(true);
      toast('Logomarca gravada.','ok');
    }catch(e){ toast(e.message,'err'); desenhar(!!_LOGOS.get(clienteId)); }
  };
  desenhar(temLogo);
  // o extra: arrastar o arquivo em cima do quadrado
  if (quad){
    quad.classList.add('logoSolta');
    quad.title = 'Arraste a imagem da logomarca aqui';
    quad.addEventListener('dragover', ev => { ev.preventDefault(); quad.classList.add('arrastando'); });
    quad.addEventListener('dragleave', () => quad.classList.remove('arrastando'));
    quad.addEventListener('drop', ev => {
      ev.preventDefault(); quad.classList.remove('arrastando');
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      enviar(f);
    });
  }
}

const _tx = v => String(v == null ? '' : v).trim();

function cepBR(v){
  const d = _tx(v).replace(/\D/g, '');
  return d.length === 8 ? d.slice(0, 5) + '-' + d.slice(5) : _tx(v);
}

function enderecoCompleto(d){
  d = d || {};
  const rua = [_tx(d.endereco), _tx(d.numero)].filter(Boolean).join(', ');
  const cid = _tx(d.cidade) ? _tx(d.cidade) + (_tx(d.uf) ? '/' + _tx(d.uf) : '') : _tx(d.uf);
  return [rua, _tx(d.complemento), _tx(d.bairro), cid, _tx(d.cep) ? 'CEP ' + cepBR(d.cep) : '']
    .filter(Boolean).join(' · ');
}

const linkMapaBusca = txt => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(txt);

function blocoLocal(d){
  const linha = (rot, val, href, extra) => '<div class="lin"><span class="rot">' + rot + '</span>'
    + (val
        ? (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(val) + '</a>'
                : '<span>' + esc(val) + '</span>')
        : '<i class="falta">não preenchido</i>') + (extra || '') + '</div>';
  const mapa = d.localizacao || '';
  const completo = enderecoCompleto(d);
  // sem cidade, o fim da linha diz o que falta (o endereço sem cidade não leva ninguém a lugar nenhum)
  const faltaCid = completo && !_tx(d.cidade) ? ' <span class="faltaCid">· falta a cidade</span>' : '';
  // "No mapa": a localização gravada vale; sem ela, a busca pelo endereço completo
  const hrefMapa = mapa ? (/^https?:/i.test(mapa) ? mapa : null) : (completo ? linkMapaBusca(completo) : null);
  return '<div class="blocoLocal">'
    + linha('Endereço', completo, null, faltaCid)
    + linha('No mapa', (mapa || completo) ? 'abrir no mapa' : '', hrefMapa)
    + linha('Agendar com', d.contato_agenda)
    + '</div>';
}

const localIncompleto = d => !_tx(d.endereco) || !_tx(d.cidade) || !_tx(d.contato_agenda);

const COLS_SEM_CONTADOR = new Set(['Leads', 'Recusadas', 'Concluídos']);

const colunaComContador = nome => !COLS_SEM_CONTADOR.has(nome);

const DSI_AMARELO = 6, DSI_VERMELHO = 8;

const faixaDSI = d => (d >= DSI_VERMELHO ? 'vermelho' : (d >= DSI_AMARELO ? 'amarelo' : 'verde'));

function proximoPasso(n){
  if (!n) return '';
  switch (n.coluna){
    case 'Contato realizado':   return 'Marcar a visita.';
    case 'Visita agendada':     return 'Realizar a visita e anotar o resultado.';
    case 'Em conferência': {
      const c = compDe(n);
      const emitida = c.propostas_emitidas_sem_envio != null
        ? Number(c.propostas_emitidas_sem_envio) > 0
        : Number(n.propostas_pendentes) > 0;   // banco sem o 65: a melhor leitura possível
      return emitida ? 'Registrar o envio da proposta.' : 'Montar a proposta.';
    }
    case 'Proposta enviada':    return 'Registrar a resposta do cliente (a bola está com o cliente).';
    case 'Aprovadas':           return Number(n.oss) > 0
                                  ? 'Acompanhar a OS — o card anda sozinho até a entrega.'
                                  : 'Abrir a OS.';
    case 'Entrega / Pós venda': return 'Entregar a documentação e fazer o pós-venda.';
    default: return '';
  }
}

const DSI_CONTA = 'Conta como interação: anotações, agendamento de visita, envio da proposta e '
                + 'resposta do cliente. Gerar o documento não conta.';

function chipDiasSemInteracao(dias, n){
  const d = Math.max(0, Number(dias || 0));
  const txt = d === 0 ? 'interação hoje' : d + (d === 1 ? ' dia' : ' dias') + ' sem interação';
  const f = faixaDSI(d);
  const passo = proximoPasso(n);
  const dica = (passo ? 'Próximo passo: ' + passo + '\n' : '')
    + 'Dias desde a última interação registrada no Histórico. '
    + 'Verde: até 5 · amarelo: 6 e 7 · vermelho: 8 ou mais.\n' + DSI_CONTA;
  return '<span class="mini dsi ' + f + '" title="' + esc(dica) + '">' + txt + '</span>';
}

function idsLeadSemContato(){
  const m = (PEND && PEND.comercial && PEND.comercial.motivos) || {};
  return new Set(((m.lead_sem_contato || {}).ids || []).map(String));
}

let LEAD_SC_DESENHADO = '';

const chaveLeadSC = () => [...idsLeadSemContato()].sort().join(',');

function chipLeadSemContato(dias){
  const d = Math.max(0, Number(dias || 0));
  const m = (PEND && PEND.comercial && PEND.comercial.motivos && PEND.comercial.motivos.lead_sem_contato) || {};
  const dica = 'Lead sem nenhum contato registrado' + (m.dias ? ' há ' + m.dias + ' dias ou mais' : '')
    + ' (prazo em Configurações › Alertas).\nPróximo passo: fazer o primeiro contato e anotar no Histórico.';
  return '<span class="mini dsi fucsia" title="' + esc(dica) + '">' + d + (d === 1 ? ' dia' : ' dias') + ' sem contato</span>';
}

function cardNegocio(n, comContador){
  if (comContador === undefined) comContador = colunaComContador(n.coluna);
  const d = document.createElement('button');
  d.className = 'cardCom';
  const parado = Number(n.dias_parado || 0);
  // S38: a borda acompanha a faixa do crachá (amarelo 6–7, vermelho 8+)
  // S50 · item 3: o verde (0–5 dias) também ganha barra — antes mapeava para
  // vazio e o card em dia não tinha borda nenhuma.
  const alerta = !comContador ? '' : ({ vermelho:' parado', amarelo:' morno', verde:' emdia' })[faixaDSI(parado)];
  d.className += alerta;
  // S50 · item 3: o lead do alerta "Lead sem contato" — barra e selo fúcsia.
  // O conjunto é o de `tf_pendencias_menu`, o mesmo do número do menu e do
  // filtro rápido: os três nunca podem divergir.
  const leadSC = !comContador && idsLeadSemContato().has(String(n.id));
  if (leadSC) d.className += ' leadsc';

  // O espaço da logo é SEMPRE desenhado — com a imagem, se já veio; com as
  // iniciais, se ainda não. É isso que impede o quadro de refluir quando as
  // imagens chegam.
  //
  // ITEM 1 (S32): aqui ela também virou faixa no topo. O documento dizia que o
  // Comercial usa "o mesmo modelo de card" do print — não usa: este é o card
  // do NEGÓCIO, e a logo já vinha maior (34×26) e no canto. Mas o pedido é
  // reconhecer o cliente num relance, e isso vale igual nos dois quadros.
  // Lead ainda sem cliente cadastrado entra pelas iniciais do nome do lead.
  const logo = logoHTML(n.cliente_id, n.cliente_nome, 'logoFaixa');

  const chips = [];
  if (comContador) chips.push(chipDiasSemInteracao(parado, n));
  else if (leadSC) chips.push(chipLeadSemContato(parado));
  if (n.tarefas_atrasadas) chips.push('<span class="mini crit">' + n.tarefas_atrasadas + ' tarefa(s) atrasada(s)</span>');
  else if (n.tarefas_abertas) chips.push('<span class="mini">' + n.tarefas_abertas + ' tarefa(s)</span>');
  if (n.proxima_agenda) chips.push('<span class="mini ag">' + dataCurta(n.proxima_agenda) + '</span>');
  if (n.e_contrato) chips.push('<span class="mini ct">contrato</span>');

  if (Number(n.propostas_numeros) > 1)
    chips.push('<span class="mini">' + n.propostas_numeros + ' propostas</span>');
  // ITEM 10 (S28): o negócio está na entrega — qual OS
  if (n.pos_os_numero)
    chips.push('<span class="mini pos">entrega · ' + esc(n.pos_os_numero) + '</span>');
  // ITEM 11 (S36): lançado depois do fato — as datas são as reais
  if (n.retroativo) chips.push('<span class="mini" title="Proposta anterior ao TapHub, lançada depois">anterior ao TapHub</span>');
  if (n.concluido_fora_em) chips.push('<span class="mini">executado fora do TapHub</span>');
  // S39 · a venda adicional: de qual inspeção, e se o achado tira o vaso de operação
  const va = VA.porNeg[n.id];
  if (va || n.origem === 'venda_adicional'){
    if (va && va.impede_operar) chips.unshift('<span class="mini imp">⚠ impede operar</span>');
    chips.unshift('<span class="mini va">venda adicional' + (va ? ' · ' + esc(va.origem_numero) : '') + '</span>');
  }

  // ITEM 8 (S41): a observação curta do negócio, LOGO ABAIXO DA LOGOMARCA e
  // antes do número — é onde ela separa dois cards do mesmo cliente. Vazia,
  // não desenha nada (nem espaço, nem "sem observação").
  const obs = compDe(n).observacao_card;
  d.innerHTML = logo
    + (obs ? '<div class="obs"></div>' : '')
    + '<div class="num"></div><div class="cli"></div><div class="tit"></div>'
    + '<div class="valor"></div><div class="chips">' + chips.join('') + '</div>';
  if (obs){ const o = d.querySelector('.obs'); o.textContent = obs; o.title = obs; }
  // ⚠ `numero_exibicao` vem da view: é NEG-… até a proposta SAIR, e o número
  //    da proposta (com Rev., quando houver) dali em diante. A regra mora no
  //    banco de propósito — o quadro não escolhe qual número o cliente conhece.
  d.querySelector('.num').textContent = n.numero_exibicao || n.numero;
  if (n.numero_exibicao && n.numero_exibicao !== n.numero)
    d.querySelector('.num').title = n.numero;   // o NEG- continua alcançável
  d.querySelector('.cli').textContent = n.cliente_nome;
  d.querySelector('.tit').textContent = n.titulo;
  const vc = valorDoCard(n);   // S41 · item 5: o card e a soma da coluna leem daqui
  const ev = d.querySelector('.valor');
  ev.textContent = vc.v ? BRL(vc.v) + (vc.tipo === 'estimado' ? ' (estimado)'
                                     : vc.tipo === 'recusada' ? ' (recusada)' : '') : '';
  if (vc.tipo === 'recusada') ev.classList.add('rec');
  d.addEventListener('click', () => abrirNegocio(n));
  return d;
}

async function pintarNeg(){
  const b = document.getElementById('dBody');

function campoDuracaoVisita(id, valor){
  const v = Number(valor || 120);
  return '<div class="campo"><label for="' + id + '">Duração (minutos)</label>'
    + '<input id="' + id + '" type="number" min="5" max="1440" step="1" inputmode="numeric" value="' + v + '">'
    + '<small class="nota durLeitura" id="' + id + 'Txt">= ' + minHora(v) + '</small></div>';
}

function ligarDuracaoVisita(id){
  const i = document.getElementById(id), t = document.getElementById(id + 'Txt');
  if (!i || !t) return;
  i.addEventListener('input', () => {
    const m = Math.round(Number(i.value || 0));
    t.textContent = (m >= 5 && m <= 1440) ? '= ' + minHora(m) : 'entre 5 e 1440 minutos';
  });
}

function lerDuracaoVisita(id){
  const m = Math.round(Number((document.getElementById(id) || {}).value || 0));
  if (!(m >= 5 && m <= 1440)){ toast('A duração vai de 5 a 1440 minutos (o dia inteiro).','err'); return null; }
  return m;
}

function caixasPessoas(prefixo, marcados){

    + (m.indexOf(String(u.id)) >= 0 ? ' checked' : '') + '> <span>' + esc(u.nome) + '</span></label>').join('')
    + '</div>';
}

    if (!q){ toast('Escolha a data e a hora.','err'); return; }
    const quem = [...document.querySelectorAll('.agP:checked')].map(c => c.value);

    const dur = lerDuracaoVisita('agDur');
    if (dur === null) return;
    e.target.disabled = true;
    const ini = new Date(q);

      await pintarComercial();
      const at = negocios.find(x => x.id === n.id);
      if (at){ negAberto = at; pintarNeg(); }
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });
}

      +  '<th>Itens</th><th>Documento</th><th></th></tr></thead><tbody>'
      + props.map(p => '<tr>'
          + '<td class="mono">' + esc(p.numero_exibicao || rotuloProposta(p.numero, p.versao)) + '</td>'
          + '<td>' + esc(p.status) + (p.os ? ' · OS ' + esc(p.os) : '') + '</td>'
          + '<td class="num">' + BRL(p.valor_total) + '</td>'
          + '<td class="num">' + p.itens + '</td>'
          // S28: "Registrar envio" continua aparecendo sem documento (a proposta
          // pode ter sido feita no sistema de sempre) — mas a linha diz se o
          // TapFlow gerou o papel
          + '<td class="docCel">' + (p.documentos
              ? 'gerado ' + esc(rhDT(p.ultimo_documento_em).slice(0,10))
              : '<span class="nota">—</span>') + '</td>'
          + '<td class="acoesPropTd" data-p="' + esc(p.id) + '"></td></tr>').join('')
      + '</tbody></table></div>';
  } else {
    h += '<p class="nota">Nenhuma proposta ainda. Monte a primeira abaixo — ou, se este '
      +  'serviço precisa de levantamento em campo antes de orçar, abra a OS de '
      +  'fornecimento pela aba Ações.</p>';
  }

  // ── a OS nasce daqui ──
  if (aprovadaSemOS){
    h += '<div class="aviso ok"><b>' + esc(rotuloProposta(aprovadaSemOS.numero, aprovadaSemOS.versao)) + ' foi aprovada e ainda '
      +  'não virou OS.</b> Abrir a OS traz os ' + aprovadaSemOS.itens + ' item(ns) para '
      +  'dentro dela, já aprovados — ninguém redigita o que o cliente comprou.</div>'
      +  '<div class="campo"><label for="npTipo">Tipo de serviço</label>'
      +  '<select id="npTipo"></select></div>'
      +  '<button class="btn pri" id="npAbrirOS" style="width:100%;margin-bottom:20px">'
      +  'Abrir OS a partir desta proposta</button>';
  }

  // ── gerar o documento (item 4, S28) ──
  // Fechado por padrão: o gerador baixa o modelo (~450 KB) e busca a logo, e
  // quem abriu a aba para montar ou responder não precisa pagar por isso.
  if (props.length){
    const aberto = !!_msgGerNeg || _gerNegAberto === n.id;
    h += '<details class="gerDet" id="npGerDet"' + (aberto ? ' open' : '') + '>'
      +  '<summary><span class="secTit" style="margin:0">Gerar o documento (.docx)</span>'
      +  '<span class="nota">a partir da proposta registrada — com os dados e a logomarca do cliente</span></summary>'
      +  '<div id="npGer"><p class="nota">Carregando os modelos…</p></div></details>';
  }

  // ── montar uma nova ──
  h += '<div class="secTit">Montar uma proposta</div>'
    +  '<p class="nota">A proposta é feita no sistema de sempre; aqui se registra o número '
    +  'e o que foi ofertado. É esse escopo que a resposta do cliente aplica, item a item.</p>'
    +  '<div id="npMonta"></div>';

  b.innerHTML = h;
  ctrBlocoCriar(n, props, b).catch(() => {});   // C1 · "Criar contrato"

  // botões de ação por proposta
  b.querySelectorAll('[data-p]').forEach(td => {
    const p = props.find(x => x.id === td.dataset.p);
    if (!p) return;
    const ctx = { os_id: p.os_id, negocio_id: n.id, cliente_id: p.cliente_id,
                  numero: n.numero, cliente: p.cliente };
    // ITEM 5 (S29): os dois botões empilhados numa coluna, com a MESMA largura
    const pilha = document.createElement('div');
    pilha.className = 'acoesProp';
    if (p.status === 'emitida'){
      const b1 = document.createElement('button');
      b1.className = 'btn mini pri'; b1.type = 'button'; b1.textContent = 'Registrar envio';   // S45 · item 4
      b1.addEventListener('click', () => modalEnvioProposta(ctx, p));
      pilha.appendChild(b1);
    }
    if ((p.status === 'emitida' || p.status === 'enviada')){
      const b2 = document.createElement('button');
      b2.className = 'btn mini pri'; b2.type = 'button'; b2.textContent = 'Resposta do cliente';
      // S45 · item 4: sem o envio registrado, esmaecido e explicando por quê
      if (p.status === 'emitida' && !p.enviada_em) esmaecer(b2);
      else b2.addEventListener('click', () => modalAprovacao(ctx, null, p));
      pilha.appendChild(b2);
    }
    if (pilha.children.length) td.appendChild(pilha);
    else if (p.respondida){
      td.innerHTML = seloAprov(p.resposta);
    }
  });

  if (aprovadaSemOS){
    const selT = document.getElementById('npTipo');
    let tipos = [];
    try{ tipos = await get('tipos_os?select=id,nome&ativo=eq.true&order=nome'); }
    catch(e){ tipos = [{ id:'INSPECAO', nome:'Inspeção NR-13' }]; }
    tipos.forEach(t => { const o = document.createElement('option');
      o.value = t.id; o.textContent = t.nome;
      if (t.id === 'INSPECAO') o.selected = true;
      selT.appendChild(o); });

    const bA = document.getElementById('npAbrirOS');
    bA.addEventListener('click', () => _semDuploEnvio_(bA, async () => {
      try{
        const r = await rpc('tf_negocio_abrir_os_da_proposta',
          { p_negocio_id: n.id, p_tipo_os_id: selT.value,
            p_client_uid: 'prop-' + aprovadaSemOS.id });
        toast('OS ' + (r.numero||'') + ' aberta com ' + (r.itens||0) + ' item(ns).','ok');
        fecharDrawer(); await carregar();
      }catch(e){ toast(e.message,'err'); }
    }));
  }

  const cxGer = document.getElementById('npGer'), detGer = document.getElementById('npGerDet');
  if (cxGer && detGer){
    let montado = false;
    const monta = () => { if (montado || !detGer.open) return; montado = true;
                          _gerNegAberto = n.id; montarGeradorNegocio(cxGer, n, props); };
    detGer.addEventListener('toggle', () => { if (!detGer.open) _gerNegAberto = null; monta(); });
    monta();
  }
  await montarProposta(n, props);
}

async function montarGeradorNegocio(caixa, n, props){
  const elegiveis = (props || []).filter(p => !p.os_id
    && p.status !== 'vencida' && p.status !== 'reprovada');
  if (!n.cliente_id){
    caixa.innerHTML = '<p class="nota">O documento leva os dados do cadastro do cliente. '
      + 'Transforme o lead em cliente (aba Cliente) e monte a proposta abaixo.</p>';
    return;
  }
  if (!elegiveis.length){
    caixa.innerHTML = '<p class="nota">O documento sai de uma proposta registrada. Monte a '
      + 'proposta abaixo — depois é só voltar aqui e gerar o .docx.</p>';
    return;
  }
  const est = { prop: elegiveis[0], modelo: null, valores: null, itens: [], total: 0,
                logos: 0, logoCli: undefined, porLogo: true };

  caixa.innerHTML =
      '<div class="gerNeg">'
    + '<div class="dupla"><div class="campo"><label for="gnP">Proposta</label><select id="gnP"></select></div>'
    + '<div class="campo"><label for="gnM">Modelo</label><select id="gnM"></select></div></div>'
    + '<div class="dica" id="gnMd" style="margin:-8px 0 10px"></div>'
    + '<div class="campo"><label for="gnNat">Natureza do serviço</label>'
    + '<input id="gnNat" type="text" autocomplete="off" name="gnn_nofill"></div>'
    + '<div id="gnVals"></div><div id="gnTab"></div><div id="gnPlanos"></div><div id="gnLogo"></div><div id="gnAnexo"></div>'
    + '<button class="btn pri" id="gnOk" type="button" style="width:100%;padding:10px">Gerar e baixar o .docx</button>'
    + '<div class="dica" id="gnMsg" style="margin-top:8px"></div></div>';

  const selP = document.getElementById('gnP');
  selP.innerHTML = elegiveis.map(p => '<option value="' + esc(p.id) + '">'
    // ITEM 8 (S29): o valor saiu do texto — o menu escolhe QUAL proposta, e
    // o valor que vai no papel é o da tabela abaixo
    + esc((p.numero_exibicao || rotuloProposta(p.numero, p.versao)) + ' · ' + p.status
          + (p.documentos ? ' · documento já gerado' : '')) + '</option>').join('');
  const sel = document.getElementById('gnM');
  let modelos = [];
  try{ modelos = await listarModelos(); }
  catch(e){ caixa.innerHTML = '<p class="dica">Não consegui ler os modelos: ' + esc(e.message) + '</p>'; return; }
  if (!modelos.length){
    caixa.innerHTML = '<p class="dica">Nenhum modelo cadastrado. Rode o <b>23_gerador_modelos.sql</b> '
      + 'e suba os .docx no bucket <b>modelos</b>.</p>';
    return;
  }
  sel.innerHTML = modelos.map(m => '<option value="' + m.id + '">' + esc(m.titulo) + '</option>').join('');
  document.getElementById('gnNat').value = n.titulo || '';

  const pintarValores = () => {
    const el = document.getElementById('gnVals');
    const v = est.valores || {};
    const faltando = CHAVES_CRITICAS.filter(k => !String(v[k]||'').trim());
    el.innerHTML = '<div class="gerCaixa"><div class="gerCaixaT">Dados que vão no documento</div>'
      + '<div class="gGrid"></div>'
      + (faltando.length ? '<p class="gFalta">Vazio: ' + faltando.map(k => ROTULO_CHAVE[k]||k).join(', ')
          + '. Preencha aqui para esta proposta, e corrija no cadastro do cliente depois.</p>' : '')
      + '</div>';
    const g = el.querySelector('.gGrid');
    CHAVES_NA_TELA.forEach(k => {
      const d = document.createElement('div'); d.className = 'campo'; d.style.margin = '0';
      d.innerHTML = '<label></label><input type="text">';
      d.querySelector('label').textContent = ROTULO_CHAVE[k] || k;
      const i = d.querySelector('input');
      i.value = v[k] || '';
      if (!String(v[k]||'').trim() && CHAVES_CRITICAS.includes(k)) i.classList.add('vazio');
      i.addEventListener('input', () => { est.valores[k] = i.value; });
      g.appendChild(d);
    });
  };
  const pintarTabela = () => {
    const el = document.getElementById('gnTab');
    const m = est.modelo;
    if (!m || !m.tem_tabela){
      el.innerHTML = '<p class="dica" style="margin:0 0 14px">' + (m && m.e_contrato
        ? 'Minuta de contrato: sem tabela de itens.'
        : 'Este modelo não tem a tabela de 5 colunas — os valores são ajustados no Word.') + '</p>';
      return;
    }
    // S103: a prévia é a tabela do papel (agrupada, preço cheio, desconto no pé)
    el.innerHTML = est.ag ? htmlTabelaCliente(est.ag) : '';
  };
  const pintarLogo = () => {
    const el = document.getElementById('gnLogo');
    if (!el) return;
    el.innerHTML = htmlLogoGerador(est, 'gnLogoX');
    const c = document.getElementById('gnLogoX');
    if (c) c.addEventListener('change', () => { est.porLogo = c.checked; });
  };

  // ── S38 · item 2: o anexo por vaso ──
  const pintarAnexo = () => {
    const el = document.getElementById('gnAnexo');
    if (!el) return;
    el.innerHTML = htmlAnexoGerador(est, 'gnAnexoX');
    const c = document.getElementById('gnAnexoX');
    if (c) c.addEventListener('change', () => { est.porAnexo = c.checked; });
  };

  const trocar = async () => {
    est.prop = elegiveis.find(p => p.id === selP.value) || elegiveis[0];
    est.modelo = modelos.find(m => m.id === sel.value);
    document.getElementById('gnMd').textContent = (est.modelo && est.modelo.descricao) || '';
    const nat = document.getElementById('gnNat').value.trim();
    try{
      const [v, porVaso] = await Promise.all([
        rpc('tf_valores_proposta_doc', { p_proposta_id: est.prop.id, p_natureza: nat || null }),
        linhasPorVasoProposta(est.prop.id)
      ]);
      est.valores = v || {};
      // S103: as linhas por vaso, juntas como o cliente vê (a mesma função do card)
      est.ag = agruparParaCliente(porVaso || []);
      est.itens = linhasDoc(est.ag);
      est.total = est.ag.total;
    }catch(e){ toast('Não consegui montar os dados: ' + e.message, 'err'); est.valores = est.valores || {}; }
    pintarValores(); pintarTabela();
    est.anexo = undefined; pintarAnexo();
    est.anexo = await carregarAnexoVasos({ p_proposta_id: est.prop.id }); pintarAnexo();
    est.logos = 0; pintarLogo();
    est.temPlanos = false; est.idxPlano = 0;
    pintarPlanosGerador(document.getElementById('gnPlanos'), est, 'gnPlanoL');
    try{
      const path = est.modelo.storage_path || (est.modelo.id + '.docx');
      const b = await baixarModelo(path);
      est.logos = await logoDeClienteNoModelo(b);
      if (est.modelo.tem_tabela && await planosNoModelo(path, b)){
        est.planosPar = await carregarPlanos();
        est.temPlanos = true;
        est.idxPlano = linhaDoPlano(est.itens, est.planosPar);
      }
    }catch(e){ /* o erro de verdade aparece ao gerar */ }
    pintarLogo();
    pintarPlanosGerador(document.getElementById('gnPlanos'), est, 'gnPlanoL');
    if (est.logos && est.logoCli === undefined){
      est.logoCli = await prepararLogoCliente(n.cliente_id).catch(() => null);
      pintarLogo();
    }
  };
  sel.addEventListener('change', trocar);
  selP.addEventListener('change', trocar);
  document.getElementById('gnNat').addEventListener('change', () => {
    if (!est.valores) return;
    const nat = document.getElementById('gnNat').value.trim();
    est.valores['TítuloNatureza'] = nat; est.valores['Natureza_do_Serviço'] = nat;
  });
  await trocar();

  document.getElementById('gnOk').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const msg = document.getElementById('gnMsg');
      if (!est.modelo || !est.valores) return;
      msg.style.color = ''; msg.textContent = 'Baixando o modelo…';
      try{
        const bytes = await baixarModelo(est.modelo.storage_path || (est.modelo.id + '.docx'));
        msg.textContent = 'Montando o documento…';
        const usaItens = est.modelo.tem_tabela && est.itens.length;
        const planos = usaItens ? planosParaGerar(est) : null;
        const { blob, faltaram, logosPostas, planosEscritos, anexoVasos } = await docxGerar({
          bytes, valores: est.valores,
          tabela: usaItens ? est.itens : null,
          totalTexto: est.ag ? resumoDoc(est.ag) : BRL(est.total).replace(/\u00a0/g,' '),
          tirarLogoCliente: true,
          logoCliente: est.porLogo !== false ? est.logoCli : null,
          planos,
          anexo: anexoParaGerar(est)
        });
        const rot = est.valores['Nº_da_Proposta'] || est.prop.numero;
        const natu = document.getElementById('gnNat').value.trim();
        const nome = nomeArquivoProposta(rot, est.valores['Cliente'], natu, est.modelo);   // S41
        baixarBlob(blob, nome);
        msg.textContent = 'Registrando…';
        await rpc('tf_registrar_documento_proposta', {
          p_proposta_id: est.prop.id, p_modelo_id: est.modelo.id, p_valores: est.valores,
          // o registro guarda a tabela do PADRÃO, como saiu no papel
          p_itens: usaItens ? (planos ? planos.padrao.linhas : est.itens) : null,
          p_valor_total: usaItens ? est.total : null,
          p_nome_arquivo: nome, p_natureza: natu || null });
        toast('Documento da proposta ' + rot + ' gerado.', 'ok');
        _msgGerNeg = rot + ' gerada e baixada.'
          + (planosEscritos ? ' Os três planos preenchidos (Básico, Padrão e Premium).' : '')
          + (anexoVasos ? ' Situação dos vasos logo abaixo dos preços (' + anexoVasos + ' vaso(s)).' : '')
          + (logosPostas ? ' Logomarca do cliente no cabeçalho.' : '')
          + (faltaram.length ? ' ⚠ Ficaram sem valor no papel: ' + faltaram.join(', ') + '.' : '')
          + ' Confira o arquivo e use "Registrar envio" quando mandar ao cliente.';
        negPropostas(n, document.getElementById('dBody'));
      }catch(e){
        msg.style.color = 'var(--crit)'; msg.textContent = e.message;
      }
    });
  });
  if (_msgGerNeg){
    const m = document.getElementById('gnMsg');
    m.style.color = 'var(--ok)'; m.textContent = _msgGerNeg; _msgGerNeg = null;
  }
}

let _msgGerNeg = null;

let _gerNegAberto = null;

function blocoEquipamentosProposta(equip){
  const hoje = isoHoje();
  let nVenc = 0;

  const linhas = equip.map(e => {
    const servicos = SERVICOS_NR13.filter(sv => e[sv.campo]);

    if (e.tapweb_desativado_em){
      return '<div class="chk" style="opacity:.6"><b>' + esc(e.tag) + '</b> '
        + '<span class="nota">' + esc(e.nome || e.tipo || '—') + ' · '
        + '<b>desativado no TapWeb</b> em ' + esc(dataBR(e.tapweb_desativado_em))
        + ' — não entra como pendência</span></div>';
    }

    if (!servicos.length){
      const desc = 'Inspeção NR-13 — ' + e.tag + (e.tipo ? ' (' + e.tipo + ')' : '');
      return '<label class="chk"><input type="checkbox" data-eq="' + esc(e.equipamento_id) + '"'
        + ' data-desc="' + esc(desc) + '"> '
        + '<b>' + esc(e.tag) + '</b> <span class="nota">· ' + esc(e.nome || e.tipo || '—')
        + (e.localizacao ? ' · ' + esc(e.localizacao) : '')
        + (e.pmta ? ' · PMTA ' + e.pmta : '')
        + (e.ultima_data ? ' · última: ' + esc(dataBR(e.ultima_data)) : ' · nunca inspecionado')
        + ' · <b>sem vencimento do TapWeb</b></span></label>';
    }

    const itens = servicos.map(sv => {
      const d = String(e[sv.campo]).slice(0,10);
      const venceu = d <= hoje;
      if (venceu) nVenc++;
      const desc = sv.nome + ' — ' + e.tag;
      return '<label class="chk" style="margin-left:16px"><input type="checkbox" '
        + 'data-eq="' + esc(e.equipamento_id) + '" data-desc="' + esc(desc) + '"'
        + (venceu ? ' data-venc="1"' : '') + '> '
        + esc(sv.nome) + ' <span class="chip' + (venceu ? ' crit' : '') + '">'
        + (venceu ? 'venceu ' : 'vence ') + esc(dataBR(d)) + '</span></label>';
    }).join('');

    return '<div class="chk" style="padding-bottom:0"><b>' + esc(e.tag) + '</b> '
      + '<span class="nota">' + esc(e.nome || e.tipo || '—')
      + (e.localizacao ? ' · ' + esc(e.localizacao) : '')
      + (e.tapweb_em ? ' · TapWeb ' + esc(dataBR(e.tapweb_em)) : '') + '</span></div>'
      + itens;
  }).join('');

  return '<div class="secTit">Equipamentos deste cliente</div>'
    + '<p class="nota">Marque o que entra na proposta. A TAG, o nome e os vencimentos vêm '
    + 'do cadastro — o que o TapWeb já sabe não se digita de novo aqui.</p>'
    // ITEM 5 (S37): aqui continua um por vaso (é o que a OS da inspeção usa
    // para saber ONDE ir); o documento soma por tipo — ver `57_ajustes_s37`.
    // S38: até 3 linhas, e Interna + Externa do mesmo vaso é UMA inspeção
    // S103: o papel junta por serviço e preço — a vista "Como o cliente vê" mostra
    + '<p class="dica">No <b>documento</b> da proposta, o mesmo serviço com o mesmo preço vira '
    + '<b>uma linha</b>, com a quantidade somada (ex.: "Calibração de Manômetros", 2 × R$ 150,00). '
    + 'Marcar Interna e Externa do mesmo vaso vira uma linha só, com um preço. Logo abaixo dos '
    + 'preços sai a <b>situação dos vasos</b>, com os vencimentos do TapWeb. Aqui eles continuam '
    + 'um por vaso, porque é essa lista que a OS leva para o campo — a vista <b>Como o cliente vê</b> '
    + 'mostra o papel.</p>'
    + '<div class="listaItens eqProp">' + linhas + '</div>'
    + (nVenc
        ? '<button class="btn" id="npVenc" type="button" style="width:100%;margin:10px 0 0">'
          + 'Marcar os ' + nVenc + ' serviço(s) vencido(s)</button>'
        : '<p class="dica">Nenhum serviço vencido nesta lista. Se deveria haver, suba a '
          + 'planilha do TapWeb na ficha do cliente (Cadastros → Clientes → Vencimentos).</p>')
    + '<button class="btn" id="npAdd" style="width:100%;margin:8px 0 6px">'
    + 'Acrescentar os marcados</button>';
}

async function montarProposta(n, props){
  const alvo = document.getElementById('npMonta');
  if (!alvo) return;
  _propItens = [];

  if (!n.cliente_id){
    // A instrução antiga aqui mandava fazer o que não existia ("cadastre em
    // Cadastros e ligue o negócio a ele"). Desde o S22 existe, e é na aba ao
    // lado — então a mensagem aponta para o botão em vez de para o vazio.
    alvo.innerHTML = '<div class="aviso">Este negócio ainda é um <b>lead solto</b>, e '
      + 'proposta é coisa de cliente: é o cadastro dele que guarda os equipamentos '
      + 'que vão ser inspecionados, e é o contato dele que assina a aprovação.'
      + '<div style="margin-top:10px"><button class="btn pri" type="button" id="npIrCli">'
      + 'Ir para a aba Cliente e transformar em cliente</button></div></div>';
    const ir = document.getElementById('npIrCli');
    if (ir) ir.addEventListener('click', () => {
      abaNeg = 'cliente'; abrirNegocio(n);
    });
    return;
  }

  let equip = [];
  try{ equip = await rpc('tf_equipamentos_para_proposta', { p_cliente_id: n.cliente_id }); }
  catch(e){ equip = []; }
  _propEquip = equip || [];

  // ── ITEM 2 (S28): EDITAR A PROPOSTA ATUAL, EM VEZ DE REDIGITAR ─────────────
  // A montagem abria sempre vazia: dar 3% numa proposta de 10 linhas era
  // redigitar as 10. Agora ela abre com as linhas da proposta VIGENTE do
  // negócio — a mesma que o "Número da proposta" vazio vai revisar. Quem
  // decide se isso corrige no lugar ou vira versão nova continua sendo o banco
  // (regra do S27: enviada → v+1; não enviada → mesma versão).
  // Proposta aprovada não é carregada: montar por cima dela é recusado.
  const vig = (props || []).filter(p => !p.os_id)
    .sort((a, b) => String(b.emitida_em || '').localeCompare(String(a.emitida_em || ''))
                    || (b.versao || 0) - (a.versao || 0))[0] || null;
  let carregada = null;
  if (vig && ['rascunho','emitida','enviada'].includes(vig.status) && !_propLimpa){
    try{
      const its = await get('proposta_itens?select=descricao,quantidade,preco_unitario,desconto_pct,'
        + 'custo_unitario,e_servico,equipamento_id,ordem&proposta_id=eq.' + vig.id + '&order=ordem.nullslast,id');
      _propItens = (its || []).map(i => ({
        descricao: i.descricao, quantidade: Number(i.quantidade),

      toast('Não deu para carregar os itens da proposta ' + (vig.numero_exibicao || vig.numero)

    }
  }
  _propLimpa = false;

  // S104: a montagem (equipamentos, acrescentar, número, validade, Registrar)
  // fica em dois blocos, que somem para quem o banco recusa
  alvo.innerHTML = '<div id="npMontagem">'
    + (equip.length
        ? blocoEquipamentosProposta(equip)
        : '<div class="aviso">Este cliente não tem equipamento cadastrado. Dá para montar '
          + 'a proposta com linhas digitadas — e vale cadastrar os equipamentos em '
          + 'Cadastros → Clientes, porque no ano que vem eles já estarão aqui.</div>')
    + '<div class="secTit">Acrescentar uma linha</div>'
    // ── ITEM 5 (S31): A DESCRIÇÃO PUXA DO CATÁLOGO ────────────────────────
    // O Catálogo existe desde o S10, com preço cadastrado em todo item, e
    // este campo era texto livre sem ligação nenhuma com ele: o vendedor
    // redigitava "Emissão de ART" e o preço toda vez. Agora digitar busca no
    // catálogo e escolher preenche descrição e preço.
    //
    // Continua texto livre: item avulso se digita e pronto. E o que a
    // proposta guarda é o TEXTO escolhido, não um ponteiro para o catálogo —
    // a proposta congela o que foi ofertado, e renomear o item do catálogo
    // não pode reescrever o que o cliente recebeu.
    + '<div class="dupla"><div class="campo acWrap"><label for="npDesc">Descrição</label>'
    + '<input id="npDesc" type="text" placeholder="Ex.: Emissão de ART — ou digite para buscar no Catálogo" '
    +   'autocomplete="off" name="npd_nofill" role="combobox" aria-expanded="false" aria-autocomplete="list">'
    + '<div id="npDescAC"></div>'
    + '<div class="dica">Digite para buscar no <b>Catálogo</b>; escolher traz o preço junto. '
    +   'Para item avulso, escreva à vontade.</div></div>'
    // ── ITEM 5 (S27): QUANTIDADE É NÚMERO INTEIRO ─────────────────────────
    // Este campo estava `step="0.01" inputmode="decimal"`, copiado dos campos
    // de valor em reais ao lado — e aceitava 1,11. No processo isso não
    // existe: não se inspeciona meio vaso nem se emite 0,1 ART. O padrão certo
    // já estava no app de Campo (`#fQ`): step 1, mínimo 1, teclado numérico.
    // A trava do banco (`ck_ositens_qtd_inteira`) fecha os outros caminhos.
    + '<div class="campo"><label for="npQtd">Qtd.</label>'
    + '<input id="npQtd" type="number" step="1" min="1" inputmode="numeric" value="1"></div></div>'
    + '<div class="campo"><label for="npPreco">Preço unit. (R$)</label>'
    + '<input id="npPreco" type="number" step="0.01" min="0" inputmode="decimal" '
    +   'placeholder="vem do Catálogo quando você escolhe um item"></div>'
    + '<button class="btn" id="npAddLinha" style="width:100%;margin-bottom:8px">Acrescentar linha</button>'
    // ITEM 3 (S29): a linha do plano não se digita — vem de Configurações › Planos
    + '<button class="btn" id="npAddPlano" type="button" style="width:100%;margin-bottom:16px" '
    + 'title="Texto do Plano Padrão + faixa + trecho comum, como está em Configurações › Planos">'

    + '</div>'   // fim de #npMontagem
    + '<div class="secTit">A proposta</div>'
    + (carregada
        ? '<div class="aviso ok" id="npCarregada">Esta é a proposta <b>' + esc(carregada.numero_exibicao || carregada.numero)
          + '</b> (' + esc(carregada.status) + '), com as ' + _propItens.length + ' linha(s) dela. '
          + 'Mexa só no que muda — um desconto, uma quantidade, uma linha a mais ou a menos — e clique em '
          + '<b>Registrar</b>. ' + (carregada.enviada_em
            ? 'Como ela <b>já foi enviada</b>, o registro cria a <b>' + esc(rotuloProposta(carregada.numero, (carregada.versao||1) + 1))
              + '</b> e esta fica vencida.'
            : 'Como ela <b>ainda não foi enviada</b>, o registro corrige esta mesma versão.')
          + '<div style="margin-top:8px"><button class="btn mini" type="button" id="npLimpar" '
          + 'style="margin-left:0">Começar uma proposta vazia</button></div></div>'
        : '')
    // S103 · as duas vistas da mesma lista
    + '<div class="tog vistaProp" id="npVista"><button type="button" data-v="vaso">Por vaso</button>'
    + '<button type="button" data-v="cliente">Como o cliente vê</button></div>'
    + '<div id="npLista"></div>'
    // ── ITEM 4 (S27) ────────────────────────────────────────────────────────
    // `proposta_itens.desconto_pct` já existia e `tf_criar_proposta_negocio`
    // já o recebia no JSON dos itens — faltava só onde digitar. O geral é um
    // atalho de tela: ele preenche o percentual de cada item, e é o item que
    // vale. Assim o desconto fica registrado como desconto, e não escondido
    // dentro de um preço unitário baixado na marra.
    // S28: o bloco agora aceita também R$ e valor final (item 3) — ver

    + '<input id="npNum" type="text" placeholder="deixe vazio para o TapHub numerar" '
    + 'autocomplete="off" name="npn_nofill">'
    // ── ITEM 3 (S27): O QUE "VAZIO" PASSOU A SIGNIFICAR ────────────────────
    // Era "sai o próximo do ano" — e era por aí que o defeito do print
    // entrava: a segunda proposta do mesmo negócio saía como 26028 ao lado da
    // 26027, as duas em v1, e o card somava as duas. Agora vazio quer dizer
    // "revise a que já existe"; o contador só é consultado quando o negócio
    // ainda não tem proposta nenhuma.
    + '<div class="dica">Vazio: <b>revisa a proposta que este negócio já tem</b> '
    + '(ou puxa o próximo número do ano, se ainda não houver nenhuma). '
    + 'Digite um número novo só quando for <b>outra</b> proposta, de outro escopo.</div></div>'
    + '<div class="campo"><label for="npVal">Validade</label><input id="npVal" type="date"></div></div>'
    + '<button class="btn pri" id="npGravar" style="width:100%">'
    + (carregada ? 'Registrar a revisão de ' + esc(carregada.numero) : 'Registrar proposta') + '</button>'
    + '</div>';   // fim de #npFecho

  const bLimpa = document.getElementById('npLimpar');
  if (bLimpa) bLimpa.addEventListener('click', () => {
    _propLimpa = true;
    montarProposta(n, props);
  });

  // ── ITEM 2 (S34): UMA LINHA POR SERVIÇO, NÃO UMA POR EQUIPAMENTO ────────
  // Até o S33 cada equipamento marcado virava uma linha genérica "Inspeção
  // NR-13 — TAG", e qual dos quatro serviços tinha vencido ficava na cabeça
  // do vendedor (ou numa segunda janela, no TapWeb). Agora a tela mostra as
  // datas e cada serviço marcado vira a SUA linha.
  //
  // ⚠ A dedução de repetido mudou de chave. Era `equipamento_id`, o que
  // impedia um segundo serviço do MESMO vaso de entrar. Passa a ser
  // equipamento + descrição — e a descrição é o que sobrevive quando a
  // proposta é recarregada do banco, onde o "qual serviço" não existe como
  // campo (a proposta congela o TEXTO, não um ponteiro).
  const jaTem = (eqId, desc) => _propItens.some(i =>
    (i.equipamento_id || null) === (eqId || null) &&
    norm(String(i.descricao||'')).trim() === norm(desc).trim());

  const bMarcar = document.getElementById('npVenc');
  if (bMarcar) bMarcar.addEventListener('click', () => {
    const v = [...alvo.querySelectorAll('[data-eq][data-venc="1"]')];
    if (!v.length){ toast('Nenhum serviço vencido nesta lista.','err'); return; }
    v.forEach(c => { c.checked = true; });
    toast(v.length + ' serviço(s) vencido(s) marcado(s).','ok');
  });

  const bAdd = document.getElementById('npAdd');
  if (bAdd) bAdd.addEventListener('click', () => {
    const marcados = [...alvo.querySelectorAll('[data-eq]:checked')];
    if (!marcados.length){ toast('Marque ao menos um serviço.','err'); return; }
    let postos = 0, repetidos = 0, juntados = 0;
    // ── ITEM 2 (S38): INTERNA + EXTERNA DO MESMO VASO = UMA LINHA ────────
    // O papel conta UMA inspeção por vaso. Mas proposta não aceita linha a
    // zero, então duas linhas teriam dois preços e o vaso sairia cobrado duas
    // vezes dentro de "1 inspeção". Por isso a montagem já grava uma linha
    // só, "Inspeção Interna e Externa — TAG" — e a OS continua sabendo o vaso
    // e os dois serviços, que estão no texto.
    const tipoInsp = d => d.startsWith(INSP_INT) ? 'int' : d.startsWith(INSP_EXT) ? 'ext' : null;
    const tagDe = d => d.split(' — ').slice(1).join(' — ');
    const marcadosInsp = new Map();          // equipamento → {int, ext}
    marcados.forEach(c => { const k = tipoInsp(c.dataset.desc); if (!k) return;
      const m = marcadosInsp.get(c.dataset.eq) || {}; m[k] = c; marcadosInsp.set(c.dataset.eq, m); });
    marcados.forEach(c => {
      let desc = c.dataset.desc;
      const k = tipoInsp(desc);
      c.checked = false;
      if (k){
        const eq = c.dataset.eq, tag = tagDe(desc), amb = INSP_AMB + tag;
        const par = marcadosInsp.get(eq) || {};
        if (par.int && par.ext){
          if (k === 'ext') return;           // a linha já saiu pela Interna
          desc = amb;
        } else {
          // o outro serviço já está na proposta: vira a linha combinada, no lugar
          const outro = (k === 'int' ? INSP_EXT : INSP_INT) + tag;
          const ix = _propItens.findIndex(i => (i.equipamento_id || null) === eq
                       && norm(String(i.descricao||'')).trim() === norm(outro).trim());
          if (ix >= 0){ _propItens[ix].descricao = amb; juntados++; return; }
        }
        if (jaTem(eq, amb)){ repetidos++; return; }
      }
      if (jaTem(c.dataset.eq, desc)){ repetidos++; return; }
      _propItens.push({ equipamento_id: c.dataset.eq, descricao: desc,
        quantidade: 1, preco_unitario: null, desconto_pct: 0, e_servico: false });
      postos++;
    });
    if (repetidos) toast(repetidos + ' já estava(m) na proposta.','err');
    else if (juntados) toast(juntados + ' vaso(s) passaram a ter Interna e Externa numa linha só.','ok');
    pintarItensProposta();
  });

  // S31: o autocomplete do Catálogo neste campo
  autocompletarCatalogo(document.getElementById('npDesc'),
                        document.getElementById('npDescAC'),
                        item => { document.getElementById('npPreco').value =
                                    item.preco_referencia != null ? item.preco_referencia : ''; });

  document.getElementById('npAddLinha').addEventListener('click', () => {
    const d = document.getElementById('npDesc').value.trim();
    if (!d){ toast('Escreva a descrição da linha.','err'); return; }
    const q = Math.trunc(Number(document.getElementById('npQtd').value));
    if (!(q >= 1)){ toast('A quantidade é um número inteiro, a partir de 1.','err'); return; }
    const pr = parseFloat(document.getElementById('npPreco').value);
    _propItens.push({ equipamento_id: null, descricao: d,
      quantidade: q, preco_unitario: isFinite(pr) && pr > 0 ? pr : null,
      desconto_pct: 0, e_servico: true });
    document.getElementById('npDesc').value = '';
    document.getElementById('npQtd').value = '1';
    document.getElementById('npPreco').value = '';
    pintarItensProposta();
  });

  document.getElementById('npAddPlano').addEventListener('click', async () => {
    const pl = await carregarPlanos(true);
    if (!pl){ toast('Os parâmetros dos planos não vieram — falta rodar o 51_ajustes_s29.sql?','err'); return; }
    const desc = descricaoLinhaPlano(pl);
    if (_propItens.some(i => norm(i.descricao).trim() === norm(desc).trim())){
      toast('A linha do plano já está na proposta.','err'); return;
    }
    const q = Math.trunc(Number(document.getElementById('npQtd').value));
    const qtd = q >= 1 ? q : Math.max(1, alvo.querySelectorAll('[data-eq]').length || 1);
    _propItens.unshift({ equipamento_id: null, descricao: desc,
      quantidade: qtd, preco_unitario: null, desconto_pct: 0, e_servico: true });
    document.getElementById('npQtd').value = '1';
    pintarItensProposta();
    toast('Linha do plano no topo, com ' + qtd + ' vaso(s). Ponha o preço do Padrão.','ok');
  });

  _descNeg = montarDescontoGeral(document.getElementById('npDescBox'), {
    id: 'npDg',
    linhas: () => _propItens.map(i => ({ preco: Number(i.preco_unitario) || 0,
                                         qtd: Number(i.quantidade) || 0,
                                         desc: Number(i.desconto_pct) || 0 })),
    // S31: um percentual por linha, calculado a partir do total ATUAL da
    // proposta (itens 6 e 7). Continua sem gravar nada até "Registrar".
    aplicar: async (pcts) => {
      if (!_propItens.length){ toast('Acrescente as linhas primeiro.','err'); return; }
      let n = 0;
      _propItens.forEach((i, k) => {
        if (pcts[k] === null || pcts[k] === undefined) return;
        i.desconto_pct = pcts[k]; n++;
      });
      pintarItensProposta();
      toast(n + ' linha(s) com o desconto aplicado. Nada foi gravado ainda — '
            + 'confira e clique em Registrar.','ok');
    }
  });

  document.getElementById('npGravar').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const num = document.getElementById('npNum').value.trim();
      if (!_propItens.length){ toast('A proposta precisa de pelo menos um item.','err'); return; }
      const semPreco = _propItens.filter(i => !(Number(i.preco_unitario) > 0));
      if (semPreco.length){
        toast(semPreco.length + ' item(ns) sem preço. Proposta com item a zero é proposta '
              + 'que ninguém confere.','err');
        return;
      }
      try{
        const r = await rpc('tf_criar_proposta_negocio', { p_negocio_id: n.id,
          p_numero: num || null, p_itens: _propItens,
          p_validade: document.getElementById('npVal').value || null });
        toast('Proposta ' + (r.rotulo || r.numero) + ' '
              + (r.caso === 'corrigida' ? 'corrigida no lugar — '
               : r.caso === 'versao_nova' ? 'registrada como versão nova — '
               : 'registrada — ')
              + BRL(r.valor_total) + '.','ok');
        _propItens = [];
        negPropostas(n, document.getElementById('dBody'));
      }catch(e){ toast(e.message,'err'); }
    });
  });

  // S104 (recado do central, 27/10): quem não monta proposta não vê o que o banco
  // recusaria — marcar equipamentos, "Acrescentar…", número, validade e
  // "Registrar". Fica a proposta nas duas vistas, só para leitura (S103).
  if (!podeEditarPropostaNeg()){
    ['npMontagem', 'npFecho', 'npCarregada', 'npDescBox'].forEach(id => {
      const x = document.getElementById(id); if (x) x.hidden = true; });
    const av = document.createElement('p');
    av.className = 'nota'; av.id = 'npSoLeitura';
    av.textContent = 'Só leitura: quem monta proposta é o comercial, compras, o técnico administrativo ou o admin.';
    alvo.insertBefore(av, alvo.firstChild);
  }
  pintarItensProposta();
}

let _catalogoCache = null;

async function catalogoParaEscolha(){
  if (_catalogoCache) return _catalogoCache;
  if (DEMO){ _catalogoCache = []; return _catalogoCache; }
  try{
    const r = await get('v_catalogo?select=id,codigo,descricao,rotulo,unidade,preco_referencia'
                        + '&ativo=is.true&order=codigo&limit=1000');
    _catalogoCache = (r || []).map(x => Object.assign({}, x, {
      _busca: norm([x.codigo, x.descricao, x.rotulo].join(' ')) }));
  }catch(e){ _catalogoCache = []; }
  return _catalogoCache;
}

function autocompletarCatalogo(inp, caixa, aoEscolher){
  if (!inp || !caixa) return;
  let itens = [], marcado = -1, aberto = false;
  catalogoParaEscolha().then(c => { itens = c; });

  const fechar = () => {
    caixa.innerHTML = ''; aberto = false; marcado = -1;
    inp.setAttribute('aria-expanded','false');
  };
  const escolher = it => {
    inp.value = it.descricao || it.rotulo || '';
    fechar();
    if (aoEscolher) aoEscolher(it);
    inp.focus();
  };
  const pintar = () => {
    const termos = norm(inp.value).trim().split(/\s+/).filter(Boolean);
    if (!termos.length || !itens.length){ fechar(); return; }
    const achados = itens.filter(x => termos.every(w => x._busca.includes(w))).slice(0, 8);
    aberto = true;
    inp.setAttribute('aria-expanded','true');
    if (!achados.length){
      caixa.innerHTML = '<div class="acLista"><div class="acNada">'
        + 'Nada no Catálogo com isso — o texto que você digitou vale como linha avulsa.'
        + '</div></div>';
      return;
    }
    caixa.innerHTML = '<div class="acLista" role="listbox">'
      + achados.map((x, k) => '<button type="button" class="acItem' + (k === marcado ? ' on' : '')
          + '" role="option" data-k="' + k + '">'
          + '<span class="acC">' + esc(x.codigo || '') + '</span>'
          + '<span class="acD">' + esc(x.descricao || '')
          + (x.unidade ? ' <span class="acC">/' + esc(x.unidade) + '</span>' : '') + '</span>'
          + '<span class="acP">' + (x.preco_referencia != null ? BRL(x.preco_referencia) : 'sem preço')
          + '</span></button>').join('')
      + '</div>';
    caixa.querySelectorAll('.acItem').forEach(b =>
      // mousedown, não click: o blur do input fecharia a lista antes do clique
      b.addEventListener('mousedown', ev => { ev.preventDefault(); escolher(achados[Number(b.dataset.k)]); }));
    caixa._achados = achados;
  };

  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', pintar);
  inp.addEventListener('blur', () => setTimeout(fechar, 120));
  inp.addEventListener('keydown', ev => {
    const n = (caixa._achados || []).length;
    if (!aberto || !n) return;
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); marcado = (marcado + 1) % n; pintar(); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); marcado = (marcado - 1 + n) % n; pintar(); }
    else if (ev.key === 'Enter' && marcado >= 0){ ev.preventDefault(); escolher(caixa._achados[marcado]); }
    else if (ev.key === 'Escape'){ fechar(); }
  });
}

function totalItem(i){
  const bruto = (Number(i.preco_unitario)||0) * (Number(i.quantidade)||0);
  return Math.round(bruto * (1 - (Number(i.desconto_pct)||0)/100) * 100) / 100;
}

let _descNeg = null;

function pintarItensProposta(){
  const el = document.getElementById('npLista');
  if (!el) return;
  if (_descNeg) setTimeout(() => _descNeg && _descNeg.atualizar(), 0);
  // S103 · o seletor das vistas
  const vista = vistaProp();
  const tg = document.getElementById('npVista');
  if (tg){
    [...tg.children].forEach(b => {
      b.classList.toggle('on', b.dataset.v === vista);
      b.onclick = () => { guardarVistaProp(b.dataset.v); pintarItensProposta(); };
    });
  }
  // quantidade, desconto e "tirar" são só do "Por vaso"
  const dBox = document.getElementById('npDescBox');
  if (dBox) dBox.hidden = vista === 'cliente' || !podeEditarPropostaNeg();
  if (!_propItens.length){
    el.innerHTML = '<p class="nota">' + (podeEditarPropostaNeg()
      ? 'Nada ainda. Marque equipamentos ou acrescente uma linha.'
      : 'Nenhuma proposta em montagem.') + '</p>';
    return;
  }
  if (vista === 'cliente') return pintarPropostaCliente(el);
  const ro = !podeEditarPropostaNeg();
  // o mesmo cálculo que `proposta_itens.total` faz no banco — se as duas
  // contas divergirem, a tela mente sobre o que vai ser gravado
  const bruto = _propItens.reduce((s,i) =>
    s + (Number(i.preco_unitario)||0) * (Number(i.quantidade)||0), 0);
  const total = _propItens.reduce((s,i) => s + totalItem(i), 0);
  const descontado = bruto - total;
  el.innerHTML = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
    + '<th>Item</th><th>Qtd.</th><th class="num">Preço unit.</th><th class="num">Desc. %</th>'
    + '<th class="num">Total</th><th></th>'
    + '</tr></thead><tbody>'
    + _propItens.map((i, k) => '<tr>'
        + '<td>' + esc(i.descricao) + (i.equipamento_id ? '' : ' <span class="mini">digitado</span>') + '</td>'
        // ── ITEM 3 (S31): a quantidade vira campo ────────────────────────
        // O documento diz que QTD "ficou travada quando os outros foram
        // liberados". Não é o caso: ela NUNCA foi campo nesta tabela, nem em
        // rascunho — era texto. Por isso corrigir a quantidade custava apagar
        // a linha e digitar tudo de novo. O remédio é o mesmo: vira input,
        // dentro do mesmo mecanismo — nada é gravado até "Registrar", que é
        // quem cria a revisão seguinte.
        // Inteira, a partir de 1: é o `ck_propitens_qtd_inteira` (12/09).
        + '<td class="num"><input class="mini" style="width:64px;text-align:right" type="number"'
        +   ' step="1" min="1" inputmode="numeric" data-qtd="' + k + '" value="'
        +   (i.quantidade == null ? '' : i.quantidade) + '"' + (ro ? ' disabled' : '') + '></td>'
        + '<td class="num"><input class="mini" style="width:96px;text-align:right" type="number"'
        +   ' step="0.01" inputmode="decimal" data-preco="' + k + '" value="'

  }));

function paresInspecao(){
  const pares = new Map();
  _propItens.forEach((i, k) => {
    if (!i.equipamento_id) return;
    const d = String(i.descricao || '');
    const tipo = d.startsWith(INSP_INT) ? 'int' : d.startsWith(INSP_EXT) ? 'ext' : null;
    if (!tipo) return;
    const tag = d.split(' — ').slice(1).join(' — ');
    const ch = i.equipamento_id + '|' + norm(tag);
    const p = pares.get(ch) || { tag }; p[tipo] = k; pares.set(ch, p);
  });
  return [...pares.entries()].filter(([, p]) => p.int !== undefined && p.ext !== undefined);
}

function htmlParesInspecao(){
  const ps = paresInspecao();
  if (!ps.length) return '';
  return '<div class="aviso" style="margin:8px 0">'
    + '<b>' + ps.length + ' vaso(s) com Inspeção Interna e Externa em linhas separadas.</b> '
    + 'No documento cada vaso conta como <b>1 inspeção</b>, mas o valor é a <b>soma das duas linhas</b>. '
    + 'Se o preço é por vaso, junte numa linha e confira o preço:'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'
    + ps.map(([ch, p]) => '<button class="btn mini" type="button" style="margin-left:0" data-juntar="'
        + esc(ch) + '">juntar ' + esc(p.tag) + '</button>').join('')
    + '</div></div>';
}

function juntarParInspecao(ch){
  const par = paresInspecao().find(([c]) => c === ch);
  if (!par) return;
  const p = par[1];
  const a = _propItens[p.int], b = _propItens[p.ext];
  const bruto = [a, b].reduce((s, i) => s + (Number(i.preco_unitario) || 0) * (Number(i.quantidade) || 0), 0);
  const tot = totalItem(a) + totalItem(b);
  const novo = { equipamento_id: a.equipamento_id, descricao: INSP_AMB + p.tag, quantidade: 1,
    preco_unitario: bruto > 0 ? Math.round(bruto * 100) / 100 : null,
    desconto_pct: bruto > 0 ? Math.round((1 - tot / bruto) * 1e6) / 1e4 : 0,
    custo_unitario: a.custo_unitario ?? null, e_servico: !!a.e_servico };
  const primeiro = Math.min(p.int, p.ext), segundo = Math.max(p.int, p.ext);
  _propItens.splice(segundo, 1);
  _propItens.splice(primeiro, 1, novo);
  toast(p.tag + ': Interna e Externa numa linha só, com o mesmo total. Confira o preço.', 'ok');
}

async function virarCliente(n, confirmado){
  const nome = (document.getElementById('vcNome') || {}).value || '';
  if (!nome.trim()){ toast('Escreva a razão social do cliente.','err'); return; }
  try{
    const r = await rpc('tf_negocio_virar_cliente', {
      p_negocio_id: n.id, p_razao_social: nome.trim(),
      p_nome_fantasia: ((document.getElementById('vcFant') || {}).value || '').trim() || null,
      p_cnpj:   (document.getElementById('vcCnpj') || {}).value || null,
      p_cidade: (document.getElementById('vcCid')  || {}).value || null,
      p_uf:     (document.getElementById('vcUf')   || {}).value || null,
      p_confirmado: !!confirmado });

    if (r.status === 'parecidos'){
      avisarParecidosNoNegocio(n, r);
      return;
    }
    toast('Agora é cliente: ' + r.razao_social + '.','ok');
    await pintarComercial();
    const novo = (negocios || []).find(x => x.id === n.id);
    if (novo) abrirNegocio(novo);
  }catch(e){ toast(e.message,'err'); }
}

  b.querySelector('h3').textContent = n.cliente_nome;
  carregarLogos([n.cliente_id]);
  // ITEM 2 (S29): enviar a logomarca daqui mesmo — sem ir a Cadastros e voltar
  ligarLogoEditavel(b.querySelector('.fichaTopo .lado'), n.cliente_id, n.cliente_nome, null);
  ligarTrocarCliente(n, b);

  const bCad = document.getElementById('ngCad');
  if (bCad) bCad.addEventListener('click', () => {
    cadSel = n.cliente_id;
    fecharDrawer();
