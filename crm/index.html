  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule);cursor:pointer}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.linhaCli.off{opacity:.55}
.secTit{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule)}
.grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.linhaBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.linhaBtns .btn{flex:1 1 auto}
.btn.perigo{color:var(--crit);border-color:var(--crit)}
.btn.perigo:hover{background:var(--crit-soft)}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:12px;cursor:pointer}
.chk input{width:16px;height:16px;flex:0 0 auto}
.nota{font-size:12px;color:var(--ink-3);line-height:1.45;margin:8px 0 0}


/* ── configurações ────────────────────────────────── */
.cfgWrap{padding:18px;max-width:1100px}
.cfgWrap .chips{margin-bottom:14px}
.cfgWrap .cfgAcessos{margin:-6px 0 14px}
.linhaU{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:11px 13px;border:1px solid var(--rule);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.linhaU.off{opacity:.55}
.linhaU.pend{border-color:var(--warn);background:var(--warn-soft)}
.linhaU b{display:block;font-size:14.5px;font-weight:600}
.linhaU small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.acoesU{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* formulário de cadastro de pessoa: fica aberto, não escondido atrás de botão */
.formNovo{border:1px solid var(--rule);border-radius:4px;padding:14px;background:var(--bg)}
.formNovo .campo{margin-bottom:0}
.linhaSenha{display:flex;gap:6px;align-items:center}
.linhaSenha input{flex:1 1 auto;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;
  letter-spacing:.02em}
.linhaSenha .btn.mini{margin-left:0;flex:0 0 auto}
.listaHist{margin:10px 0 0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.aviso.ok .btn.mini{margin-left:8px;vertical-align:baseline}
.mini{font-size:13px;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;
  background:var(--surface);max-width:190px}
button.mini{padding:6px 12px;font-weight:600}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface-2);color:var(--ink-3);padding:1px 5px;border-radius:2px;vertical-align:middle}
.tag.adm{background:var(--accent-soft);color:var(--accent)}
.aviso{font-size:13px;line-height:1.5;padding:11px 13px;border-radius:3px;margin-bottom:14px;
  background:var(--warn-soft);color:var(--ink)}
.aviso.ok{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:7px 9px;border-bottom:1px solid var(--rule)}
.tab td{padding:8px 9px;border-bottom:1px solid var(--rule-2)}
.tab a{color:var(--accent);font-weight:600}


/* ── comercial ────────────────────────────────────── */
.comWrap{display:flex;flex-direction:column;height:100%;min-height:0}
.comBoard{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding-top:12px}
.barraCom{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.barraCom input{flex:1 1 240px;max-width:360px;font-family:inherit;font-size:13.5px;
  padding:8px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
.resumoCom{font-size:13px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.colCom{flex:0 0 268px;display:flex;flex-direction:column;min-height:0;height:100%}
.colTit{display:flex;align-items:baseline;gap:8px;padding:0 2px 3px}
.colTit b{font-size:13px;font-weight:700;letter-spacing:.01em}
.colTit .cnt{font-size:11.5px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border-radius:2px;padding:1px 6px}
.colSub{font-size:11px;color:var(--ink-3);line-height:1.35;padding:0 2px 8px;min-height:30px}
.colBody{display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding-bottom:20px}
.colVazia{font-size:12px;color:var(--ink-3);opacity:.6;padding:10px 2px;margin:0}
.cardCom{position:relative;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;padding:11px 12px;display:block;width:100%;cursor:pointer}
.cardCom:hover{border-color:var(--accent)}
.cardCom.morno{border-left:4px solid #F2B400}
.cardCom.parado{border-left:4px solid #D0201A}
/* S50 · item 3 (Bruno, 07/10): a barra também diz "em dia" e "lead esquecido".
   · verde — 0 a 5 dias sem interação, a mesma faixa do selo. O selo verde é
     fundo claro (#D9F2E1) com texto #135C2E; a 4 px o tom claro some na
     borda do card, então a barra usa o verde do sistema (--ok), entre os dois.
   · fúcsia — lead no alerta "Lead sem contato" (o MESMO conjunto do número do
     menu e do filtro rápido). Distinto do vermelho #D0201A, do amarelo
     #F2B400, do verde e do roxo da venda adicional #7A5AB8. Branco sobre
     #B3166F: 6,1:1 (AA). */
.cardCom.emdia{border-left:4px solid var(--ok)}
.cardCom.leadsc{border-left:4px solid #B3166F}
/* S41 · item 8: a observação curta do negócio, logo abaixo da logomarca.
   Uma linha, cortada com reticências — o texto inteiro vai no title e na aba
   Cliente. Menor e mais clara que o nome do cliente: complementa, não compete. */
.cardCom .obs{font-size:11.5px;line-height:1.3;color:var(--ink-3);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:-2px 0 4px}
/* S41 · item 5: o total da coluna, SEMPRE na segunda linha do cabeçalho —
   mesma altura em todas as colunas, com valor grande ou pequeno. */
.colTot{font-size:12.5px;font-weight:700;color:var(--accent-ink);padding:0 2px 3px;
  font-variant-numeric:tabular-nums;white-space:nowrap;height:18px;line-height:18px;overflow:hidden}
/* S41 · e a descrição da coluna passa a reservar TRÊS linhas: com duas, as
   colunas de texto mais longo ("Em conferência", "Entrega / Pós venda")
   empurravam os cards 8 px para baixo, e o topo dos cards não alinhava. */
.colCom .colSub{min-height:45px}
/* ⚠ a coluna é flex vertical com altura fixa: sem `flex:0 0 auto` o navegador
   ENCOLHE o cabeçalho quando a coluna tem muitos cards (medido: o total
   caía de 18 para 14 px e cortava o texto). Quem rola é só o corpo. */
.colCom .colTit,.colCom .colTot,.colCom .colSub{flex:0 0 auto}
.colCom .colBody{flex:1 1 auto;min-height:0}
.colTot.zero{color:var(--ink-3);font-weight:600}
.cardCom .valor.rec{color:var(--crit)}
/* S41 · item 7: a marca de reagendamento e o aviso de atrasadas */
.mini.reag,.chip.reag{background:#EEE7F7;color:#4B2E83}
.chip.atrasoDia{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.atrLista{display:flex;flex-direction:column;gap:9px;margin:4px 0 0}
.atrLin{border:1px solid var(--rule);border-left:4px solid #D0201A;border-radius:3px;padding:9px 11px}
.atrLin .t1{font-weight:600;font-size:13.5px}
.atrLin .t2{font-size:12px;color:var(--ink-3);margin-top:2px}
.atrLin.apoio{border-left-color:var(--ink-3);background:var(--surface-2)}   /* S42 · S9: só leitura */
.atrLin .t3{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.atrLin .t3 input[type=date]{font-family:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--rule);border-radius:3px}
.atrFaixa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FDECEA;
  border:1px solid #F3C1BC;border-radius:3px;padding:8px 11px;margin:0 0 10px;font-size:13px}
.atrFaixa b{color:#9E1B14}
.cardCom .logoFaixa{margin:-3px 0 7px}
/* O quadrado da logo: com imagem ou com as iniciais, o tamanho é o mesmo —
   é o que mantém o card do mesmo tamanho antes e depois de a foto chegar. */
.logoCli{display:grid;place-items:center;overflow:hidden;border-radius:3px;flex:0 0 auto;
  background:hsl(var(--h,210) 38% 93%);color:hsl(var(--h,210) 42% 30%)}
.logoCli i{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.02em}
.logoCli img{width:100%;height:100%;object-fit:contain;background:#fff}
.card .cli{display:flex;align-items:center;gap:7px}
.logoOS{width:22px;height:22px}
.logoOS i{font-size:9.5px}
.logoFicha{width:64px;height:64px;border-radius:4px}
.logoFicha i{font-size:22px}

/* ── ITEM 1 (S32): A LOGOMARCA COMO FAIXA NO TOPO DO CARD ────────────────────
   O pedido: a logo é o jeito mais rápido de reconhecer o cliente, e ela estava
   pequena demais (22px) ao lado do número para cumprir esse papel. Vira faixa
   na largura do card, com número e nome embaixo.

   ⚠ A MEDIDA É A ALTURA, EM PIXELS, E NUNCA EM PORCENTAGEM. Dentro de um
   grid com `place-items:center` a altura percentual NÃO RESOLVE: nem
   `height:100%` nem `max-height:100%`. A imagem volta ao tamanho natural, e
   uma logo quadrada de 128px vazava a faixa e saía CORTADA pelo
   `overflow:hidden` — metade da marca some, e o card fica pior do que estava
   antes deste item. Medido no navegador, não deduzido: com `max-height:100%`,
   uma imagem de 128×128 renderizava 128×128 dentro de uma caixa de 218×52.
   Por isso a altura mora em `--faixaH` e vai para os dois lugares em px.

   Com `max-height` em px e `width:auto`, a logo encolhe para caber na altura
   da faixa e NUNCA é ampliada. A miniatura que o quadro carrega tem 128px no
   maior lado (`enviarLogoCliente`) — é o que mantém a carga leve com dezenas
   de clientes de uma vez. Com a logo do print (NANSEN, ~2:1) ela vira 104×52:
   ainda uma REDUÇÃO, nítida. Esticar na LARGURA do card (~300px), como a
   palavra "faixa" do pedido sugeria, seria ampliar 2,3× uma imagem de 128px —
   e logo borrada identifica pior que logo pequena, que é justamente o defeito
   que este item veio corrigir.

   A partir do S32 a miniatura nova sai com 256px, que é o que deixa a faixa
   nítida também em tela retina; quem já tem logo cadastrada continua com a de
   128 até alguém reenviar pelo "Trocar" na ficha — e continua legível, só
   menos fina. */
.logoFaixa{
  --faixaH:88px;
  display:grid;place-items:center;height:var(--faixaH);width:100%;margin:-2px 0 8px;
  border-radius:3px;overflow:hidden;background:hsl(var(--h,210) 38% 93%);
  color:hsl(var(--h,210) 42% 30%)
}
.logoFaixa img{max-width:100%;max-height:var(--faixaH);width:auto;height:auto}
/* Com imagem, o fundo da faixa é BRANCO — a miniatura é JPEG de fundo branco
   (PNG transparente virando JPEG ganha fundo preto, por isso ela é assim
   desde o S17). Deixar o fundo azulado atrás dela punha um retângulo branco
   dentro de uma faixa colorida, que é o efeito de adesivo que o print do
   Trello não tem. Sem imagem, as iniciais mantêm a cor do cliente. */
.logoFaixa.comImg{background:#fff}
/* Sem logo, as iniciais ocupam a mesma faixa — o card não muda de altura
   quando a imagem chega, e não fica um buraco no topo de quem não tem.
   S34: com a faixa em 88px, as iniciais de 21px deixavam a caixa parecendo
   vazia (medido na tela, não suposto: duas letras de 21px dentro de 240×88).
   Crescem junto, mantendo a proporção que o S32 tinha desenhado. */
.logoFaixa i{font-style:normal;font-weight:700;font-size:34px;letter-spacing:.06em}
.card .cli{margin-top:0}
/* onde o cliente fica — mesmo desenho no card do negócio e na gaveta da OS */
/* a régua antes do botão que destrói: separação visual é o que impede o
   clique por inércia depois de dois botões inofensivos */
.listaItens{max-height:210px;overflow-y:auto;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
/* S34: a lista de equipamentos da proposta passou de UMA linha por vaso para
   até QUATRO (uma por serviço). Com 210px cabia um vaso e meio, e o segundo
   nascia fora da caixa — "campo que só aparece rolando" é o defeito do S24 se
   repetindo numa caixa menor. */
.listaItens.eqProp{max-height:340px}
.listaItens .chk{padding:4px 0}
.reguaPerigo{border:0;border-top:1px solid var(--rule);margin:22px 0 4px}
.blocoLocal{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;margin-bottom:16px;
  background:var(--bg)}
.blocoLocal .lin{display:flex;gap:10px;padding:5px 0;font-size:13px;line-height:1.4}
.blocoLocal .lin+.lin{border-top:1px solid var(--rule-2)}
.blocoLocal .rot{flex:0 0 92px;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.05em;font-weight:700;padding-top:2px}
.blocoLocal .falta{color:var(--ink-3);opacity:.75}
.tripla{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:10px}
@media(max-width:560px){.tripla{grid-template-columns:1fr}}
.mini.ag{background:var(--accent-soft);color:var(--accent)}
.mini.ok{background:var(--ok-soft);color:var(--ok)}
.fichaTopo{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.fichaTopo .lado{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.fichaTopo .lado .btn.mini{margin-left:0}
.logoEdit{display:flex;flex-direction:column;gap:4px;align-items:stretch;width:64px}
.logoEdit .btn.mini{margin-left:0;padding:2px 4px;text-align:center}
.logoSolta.arrastando{outline:2px dashed var(--accent);outline-offset:2px}
.fichaTopo .campos{flex:1 1 auto;min-width:0}
.linhaCt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.linhaCt .papeis{display:flex;gap:4px;flex-wrap:wrap}
.cardCom .num{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.cardCom .cli{font-size:14px;font-weight:600;line-height:1.25;margin:2px 0 1px;padding-right:40px}
.cardCom .tit{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.cardCom .valor{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:5px}
.cardCom .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.mini{font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.mini.crit{background:var(--crit-soft);color:var(--crit)}
.mini.warn{background:var(--warn-soft);color:var(--warn)}
/* S38 · item 3: as três faixas do "dias sem interação". O amarelo NÃO é o
   --warn (que é âmbar-terroso, lido como "marrom" ao lado do verde): é um
   amarelo de verdade, com texto escuro para passar no contraste. */
.mini.dsi.verde{background:var(--ok-soft);color:var(--ok)}
.mini.dsi.amarelo{background:#FBEFA6;color:#5E4A00}
.mini.dsi.vermelho{background:var(--crit-soft);color:var(--crit)}
/* S41 · item 3: o vermelho do S38 (o --crit-soft, salmão claro) ficou
   "desbotado" no print do Bruno — e era por construção: ele foi feito para
   AVISO discreto, não para chamar atenção. As três faixas agora têm peso
   visual crescente, e a ordem é a da urgência:
     verde    — fundo claro, texto escuro (em dia; não precisa gritar)
     amarelo  — fundo cheio, amarelo de verdade, texto quase preto
     vermelho — fundo CHEIO saturado e texto branco em negrito
   Contraste (WCAG): verde 6,9:1 · amarelo 10,8:1 · vermelho 5,2:1 — os três
   passam no AA para texto pequeno. A cor nunca vem sozinha: o texto continua
   dizendo quantos dias. */
.mini.dsi{font-weight:700;letter-spacing:.01em}
.mini.dsi.verde{background:#D9F2E1;color:#135C2E}
.mini.dsi.amarelo{background:#FFD23F;color:#3A2C00}
.mini.dsi.vermelho{background:#D0201A;color:#FFFFFF}
.mini.dsi.fucsia{background:#B3166F;color:#FFFFFF}
.mini.ag{background:var(--gestao-soft);color:var(--gestao)}
.mini.ct{background:var(--accent-soft);color:var(--accent)}

/* log do card */
.novaNota{background:var(--surface-2);border-radius:3px;padding:11px;margin-bottom:16px}
.novaNota textarea{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);resize:vertical}
.linhaNota{display:flex;gap:7px;margin-top:7px}
.linhaNota select{flex:1;font-family:inherit;font-size:13px;padding:7px 9px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
.linhaTempo{display:flex;flex-direction:column;gap:0}
.ev{border-left:2px solid var(--rule);padding:9px 0 9px 13px;margin-left:3px}
.ev.contato{border-left-color:var(--accent)}
.ev.decisao{border-left-color:var(--gestao)}
.ev.cobranca{border-left-color:var(--warn)}
.ev .quando{font-size:10.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev .txt{font-size:13.5px;line-height:1.45;margin:2px 0 3px;white-space:pre-wrap}
.ev .quem{font-size:11.5px;color:var(--ink-3)}

/* tarefas */
.tarefaC{display:grid;grid-template-columns:auto 1fr;gap:0 11px;align-items:start;
  padding:11px;border:1px solid var(--rule);border-radius:3px;margin-bottom:7px;background:var(--surface)}
.tarefaC.feita{opacity:.5}
.tarefaC.feita b{text-decoration:line-through}
.tarefaC.atrasada{border-color:var(--crit);background:var(--crit-soft)}
.tarefaC b{display:block;font-size:14px;font-weight:600}
.tarefaC small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.tarefaC .ck{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mk input{width:18px;height:18px}
.agItem{padding:10px 11px;border:1px solid var(--rule);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.agItem b{display:block;font-size:13.5px;font-weight:600}
.agItem small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}


/* ── pedidos de compra ────────────────────────────── */
.pedBox{border:1px solid var(--rule);border-radius:5px;padding:12px;margin-bottom:9px}
.pedBox.semforn{border-color:var(--warn);background:var(--warn-soft)}
.pedTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pedTopo .f{font-size:14.5px;font-weight:600}
.pedTopo .q{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pedSub{font-size:12px;color:var(--ink-3);margin:3px 0 9px}
.pedBox .btn{margin:0}
.pedFeito{display:flex;gap:10px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid var(--rule-2);font-size:13px}
.pedFeito .n{font-size:12px;color:var(--accent);font-weight:700;flex:0 0 auto}
.pedFeito .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedFeito .v{font-variant-numeric:tabular-nums}
.pedFeito .s{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.painelPed{padding:2px}

/* ── custos e cotações ────────────────────────────── */
.margemBox{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;margin-bottom:12px}
.mg{display:contents}
.mg span{padding:9px 12px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--rule-2)}
.mg b{padding:9px 12px;font-size:13.5px;font-weight:600;text-align:right;
  border-bottom:1px solid var(--rule-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mg.perde b{color:var(--crit)}
.mg.final span,.mg.final b{background:var(--accent-soft);color:var(--accent);font-weight:700;
  border-bottom:none;font-size:15px}
.mg.final b i{font-style:normal;font-size:12.5px;opacity:.8}
.aviso2{background:var(--crit-soft);color:var(--ink);padding:10px 12px;border-radius:3px}
.linhaCusto,.linhaCot,.linhaCompra{display:grid;grid-template-columns:1fr auto auto;gap:0 10px;
  align-items:center;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;
  margin-bottom:5px;background:var(--surface)}
.linhaCusto b,.linhaCot b,.linhaCompra b{display:block;font-size:13.5px;font-weight:600}
.linhaCusto small,.linhaCot small,.linhaCompra small{display:block;font-size:11.5px;
  color:var(--ink-3);margin-top:2px;line-height:1.35}
.linhaCusto .vl,.linhaCot .vl{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.linhaCusto .x{background:none;border:none;color:var(--ink-3);font-size:18px;
  line-height:1;padding:0 4px;cursor:pointer}
.linhaCusto .x:hover{color:var(--crit)}
.grupoCot{margin-bottom:12px}
.gcTit{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px}
.linhaCot.on{border-color:var(--accent);background:var(--accent-soft)}
.linhaCot.vencida{opacity:.6}
/* Certificado e lacre: uma linha por peça que exige, cada campo rotulado. Era
   coluna de tabela e nascia fora da largura da gaveta — ver pintarItens(). */
.linhaCal{display:grid;grid-template-columns:1fr 190px 150px;gap:10px;align-items:end;
  padding:9px 0;border-bottom:1px solid var(--rule)}
.linhaCal:last-child{border-bottom:0}
.linhaCal b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.linhaCal small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.linhaCal label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.linhaCal label input{display:block;width:100%;margin-top:3px;font:inherit;font-size:13px;
  padding:5px 7px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.linhaCal label input.falta{border-color:var(--warn);background:var(--warn-soft)}
.linhaCal .nao{font-size:11.5px;color:var(--ink-3);padding-bottom:6px}
@media (max-width:820px){ .linhaCal{grid-template-columns:1fr} }
.linhaCompra{grid-template-columns:1fr auto auto}
.linhaCompra .acaoCompra{display:flex;align-items:center;padding-left:4px}
.linhaCompra .acaoCompra .btn.mini{margin-left:0;padding:3px 9px;font-size:11.5px;white-space:nowrap}
.linhaCompra.recebido .acaoCompra .btn.mini{background:transparent;border-style:dashed}
.linhaCompra.recebido:hover{opacity:1}
.linhaCompra.atrasado{border-left:3px solid var(--crit);background:var(--crit-soft)}
.linhaCompra.chega-logo{border-left:3px solid var(--warn)}
.linhaCompra.recebido{opacity:.55}
.linhaCompra .dt{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.35}
.linhaCompra .dt b{font-size:13px;color:var(--ink);display:inline}
.linhaCompra .dt b.atr{color:var(--crit)}

/* ── gaveta ───────────────────────────────────────── */
/* ⚠ S26 — A PILHA. A barra do topo é `sticky` com z-index 40, e a gaveta era 5:
   desde pelo menos o S15 a barra cobria os primeiros 54 px da gaveta — o
   número da OS, o nome do cliente e o × de fechar nunca apareceram (no lugar
   do ×, quem recebia o clique era o botão "Atualizar"). O modal (9) e a tela
   de login (10) também ficavam por baixo da barra. A ordem agora é uma só:
   barra 40 · fita da busca 30 · menu lateral 60 (acima da gaveta, como era) ·
   gaveta 42/43 · modal 70/71 · aviso (toast) 80 · login 90 · menus 200. */
.scrim{position:fixed;inset:0;background:rgba(16,26,28,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:42}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);
  border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column;z-index:43;
}
.drawer.on{transform:none}
.d-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:10px}
.d-h .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.d-h h2{margin:2px 0 0;font-size:18px;font-weight:600;line-height:1.2}
.d-h .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink-3);line-height:1;padding:0 2px}
.d-b{flex:1;overflow-y:auto;padding:14px 16px}

.fase-h{
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 7px;display:flex;align-items:center;gap:8px;
}
.fase-h:first-child{margin-top:0}
.fase-h.atual{color:var(--accent)}
.fase-h::after{content:"";flex:1;height:1px;background:var(--rule-2)}

.tk{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule-2);align-items:flex-start;flex-wrap:wrap}
/* S114 · o "quem faz / dia / botões" desce para a linha de baixo, na largura toda.
   Até o S111 ele era a 3ª coluna da linha e espremia o nome da tarefa
   ("Emitir boleto / nota fiscal" quebrava palavra por palavra). */
.tk > .tkDes{flex:1 0 calc(100% - 30px);flex-wrap:wrap;margin-top:1px;padding-top:4px}
.tk > .tkDes > span:first-child{flex:1 1 auto;min-width:0}
.tk > .tkDes .btn.mini{margin-left:0}
.tk > .tkDes > span:first-child + .btn.mini{margin-left:auto}
/* S114 · a medição da OS comum (aba Medição) */
.omdSit{margin:0 0 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.omdS.ok{color:var(--ok)} .omdS.warn{color:var(--warn)}
.omdAvs{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.omdTab{border:1px solid var(--rule-2);border-radius:4px}
.omdH,.omdL{display:grid;grid-template-columns:1fr 70px 86px 96px;gap:8px;padding:8px 10px;align-items:start}
.omdH i{font-style:normal} .omdH i.sm{display:none}
.omdH{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule-2)}
.omdH span:not(:first-child),.omdL .n{text-align:right;font-family:var(--mono);font-size:12.5px}
.omdL{border-bottom:1px solid var(--rule-2);font-size:13px}
.omdL:last-child{border-bottom:0}
.omdL.mud{background:var(--warn-soft)}
.omdD small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
@media (max-width:520px){ .omdH,.omdL{grid-template-columns:1fr 40px 44px 84px;gap:6px;padding:8px} .omdH{letter-spacing:.02em} .omdH i.lg{display:none} .omdH i.sm{display:inline} }
.tk:last-child{border-bottom:0}
.tk .st{flex:0 0 17px;text-align:center;font-size:13px;line-height:1.4}
.tk .nm{flex:1;font-size:13.5px;line-height:1.35}
.tk .nm small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
/* S105 · a T16 que o TapFin concluiu ou reabriu */
.tk .nm .tkSis{display:inline-block;margin-top:3px;font-size:11.5px;padding:1px 7px;border-radius:9px;
  background:var(--ok-soft, #E7F5EC);color:var(--ok, #1E7B45);font-weight:600}
.tk .nm .tkSis.reab{background:var(--warn-soft, #FFF4DB);color:var(--warn, #8A5A00)}
.tk.res .nm{color:var(--ink-3)}
.tk.res .nm b{font-weight:400}
.tk.atual{background:var(--accent-soft);margin:0 -8px;padding:8px 6px;border-radius:5px;
  border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(27,111,169,.12)}
.tk.atual .nm{font-weight:600}

.acoes{border-top:1px solid var(--rule);padding:12px 16px;background:var(--surface-2)}
.acoes .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.acoes .row{display:flex;gap:8px;flex-wrap:wrap}
.acoes .hint{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.4}
/* S45 · item 2: a tarefa liberada em paralelo */
.acoes .hint.paralela{color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:6px 9px}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:min(520px,92vw);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--crit)}
.toast.ok{background:var(--ok)}

.vazio{padding:60px 20px;text-align:center;color:var(--ink-3)}

/* ── abas da gaveta ───────────────────────────────── */
/* S26: no celular (390 px) as sete abas da OS somam ~470 px e "Histórico"
   nascia fora da tela, sem rolagem — aba que não se alcança é aba que não
   existe. A faixa rola de lado; no computador nada muda (as abas se esticam). */
.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto;
  overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;
  padding:10px 6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.drawer{width:min(620px,100%)}

/* ── tabela de itens ──────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;

.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* S38 · item 2: a prévia do anexo por vaso pinta a célula vencida como o Word vai pintar */
.tbl td.venc{background:#FFF176;color:#3A3000;font-weight:600}
.anexoPrev{margin:0 0 14px}
/* S103 · proposta agrupada: as linhas de subtotal/desconto e a vista "Como o cliente vê" */
.blocoLocal .faltaCid{color:var(--ink-3);font-size:12.5px}   /* S104 */
.tbl tr.agSub td{color:var(--ink-3);border-bottom:0}
.tbl tr.agDesc td{color:var(--ink-3)}
.tbl tr.agTot td{font-weight:700;font-size:13.5px}
.tbl td .agTags{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.vistaProp{margin:0 0 10px}
.vistaProp button{min-width:0}
.agVasosT{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 4px}
.anexoPrev .tbl{font-size:12px}
.anexoPrev .tbl th,.anexoPrev .tbl td{white-space:nowrap}
.tbl input{width:100%;padding:6px 7px;border:1px solid var(--rule);border-radius:3px;
  font-size:13px;background:var(--surface);min-width:64px}
.tbl input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tbl input.falta,.tbl select.falta{border-color:var(--gestao);background:var(--gestao-soft)}
.tbl select{font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid var(--rule);
  border-radius:5px;background:var(--surface);color:var(--ink);max-width:190px}
.tbl select:disabled{opacity:.6}
/* S26: campo desabilitado tem que PARECER desabilitado — o inspetor via a aba
   Itens com caixas brancas que não aceitavam nada, e isso lê como defeito. */
.tbl input:disabled,.linhaCal input:disabled{background:var(--paper);color:var(--ink-2);cursor:not-allowed}
.tbl tr.fora{opacity:.55}
.tbl tr.fora td:first-child::after{content:" · fora do orçamento";font-size:10.5px;color:var(--ink-3)}
.tbl tr.fora.retirado td:first-child::after{content:none}

.tbl tr.fora.retirado td{color:var(--ink-3)}
.tbl .motivoRet{text-decoration:none;display:block;margin:2px 0 0;font-size:11.5px}
.btn.mini.tirarItem{margin:4px 0 0}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:14px}
.totais div{background:var(--surface);padding:9px 11px}
.totais .k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

  font-variant-numeric:tabular-nums;margin-top:2px}

/* ── cadastros ────────────────────────────────────── */
.cadWrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;height:100%;

  padding:16px 18px;box-shadow:var(--shadow)}

/* S59 · painel financeiro mensal */

.fpmTrilho{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.fpmTrilho .b{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.fpmTrilho .med{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.fpmGrupo{cursor:pointer}
.fpmGrupo .fpmNome::before{content:'▸ ';color:var(--ink-3)}
.fpmGrupo.aberto .fpmNome::before{content:'▾ '}
.fpmSub{padding-left:14px;font-size:12px;color:var(--ink-2)}
.fpmHoje{font-weight:400;color:var(--ink-3);font-size:12px}
.fpmTabela{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:8px}
.fpmTabela th,.fpmTabela td{padding:4px 6px;border-bottom:1px solid var(--rule-2);text-align:right}
.fpmTabela th:first-child,.fpmTabela td:first-child{text-align:left}
.fpmTabela tr.sel td{background:var(--accent-soft);font-weight:600}
.fpmSeg{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.fpmSeg span{display:block;height:100%;border-right:2px solid var(--surface)}
.fpmSeg span:last-child{border-right:0}
.fpmHach{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.75) 0 3px,transparent 3px 7px)}
.fpmFechL{display:grid;grid-template-columns:72px 1fr 100px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
.fpmFechL .fpmN{font-weight:600}
.fpmGrande{font-size:22px;font-weight:700;margin:10px 0 2px;font-variant-numeric:tabular-nums}

.fpmProg.cinza span{background:#B9C2C7}
.fpmNota{font-size:11.5px;color:var(--ink-3);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;margin-top:14px}
/* S66 · projeção das OS (hachurada, ao lado do lançado) e tela Ciclo da reserva */
.fpmProg2{display:flex;gap:2px;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:5px 0 3px}
.fpmProg2 span{display:block;height:100%}

@media (max-width:520px){.fpmFechL.larga{grid-template-columns:96px 1fr 84px}}

.fpmProjTab td:first-child,.fpmProjTab td:nth-child(n+3){white-space:nowrap}

.fpmProjTab td:nth-child(2),.fpmProjTab th:nth-child(2),.fpmProjTab td:nth-child(7),.fpmProjTab th:nth-child(7){text-align:left}
.fpmProjLin .fpmNome{font-weight:600}
.fpmChamada{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0 0;padding:10px 12px;border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;font-size:13px;background:var(--surface-2)}
.fcrTit{font-size:13.5px;font-weight:700;margin:4px 0 0}.fcrTit+.fcrFluxo{margin-top:8px}.fcrFluxo+.fcrTit{margin-top:16px}
.fcrFluxo{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:8px;align-items:stretch}
.fcrBox{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.fcrBox .r{font-size:11.5px;color:var(--ink-2);font-weight:600}.fcrBox .v{font-size:20px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums;color:var(--ink)}.fcrBox .e{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.fcrBox.res{background:var(--ok-soft)}.fcrBox.res .v{color:var(--ok)}.fcrBox.res.neg{background:var(--crit-soft)}.fcrBox.res.neg .v{color:var(--crit)}
.fcrSeta{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:20px}
@media (max-width:700px){.fcrFluxo{grid-template-columns:1fr;gap:4px}.fcrSeta{height:18px;transform:rotate(90deg)}}
/* S69 · Projeções */
.fpjTab th,.fpjTab td{white-space:nowrap}.fpjTab th small{display:block;font-weight:400;color:var(--ink-3)}
.fpjTab tr.fpjEst td,.fpjTab tr.fpjEst th,.fpjItem.fpjEst,.fpjEstTxt{font-style:italic;color:var(--ink-2)}
.fpjChips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:0 0 12px}
.fpjGrupo{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px solid var(--rule);padding:6px 0 3px;margin-top:4px}
.fpjGrupo.tot{border-top:1px solid var(--rule);border-bottom:0;margin-top:6px;font-weight:700}

.fpjItem span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}.fpjItem small{color:var(--ink-3)}

/* S71 · Projeções visuais */
.fpjG4 .fpmVal{font-size:20px}.fpjG4 .fpmExp{min-height:2.8em}
.fpjDet{margin-top:8px}.fpjDet>summary{cursor:pointer;font-size:12.5px;color:var(--accent);list-style:none;display:inline-block}.fpjDet>summary::before{content:'▸ ';color:var(--ink-3)}.fpjDet[open]>summary::before{content:'▾ '}.fpjDet>summary::-webkit-details-marker{display:none}
.fpjHachCss{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 2px,transparent 2px 5px)!important}
.fpjBH{display:grid;grid-template-columns:minmax(0,150px) 1fr 72px;gap:10px;align-items:center;padding:4px 0;font-size:12.5px}
@media (max-width:520px){.fpjBH{grid-template-columns:minmax(0,105px) 1fr 64px;gap:6px;font-size:12px}}
.fpjBH .r{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fpjBH .r small{color:var(--ink-3)}
.fpjBH .t{display:flex;height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}.fpjBH .t i{display:block;height:100%;border-right:2px solid var(--surface)}.fpjBH .t i:last-child{border-right:0}

.fpjSinal .i{font-size:12px;text-align:center}.fpjSinal.crit .i{color:var(--crit)}.fpjSinal.warn .i{color:var(--warn)}.fpjSinal.info .i{color:var(--accent)}.fpjSinal.ok .i{color:var(--ok)}

.fpmDelta{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:8px;margin-left:4px;vertical-align:1px}.fpmDelta.bom{background:var(--ok-soft);color:var(--ok)}.fpmDelta.ruim{background:var(--crit-soft);color:var(--crit)}.fpmDelta.neutro{background:var(--surface-2);color:var(--ink-3)}
.fpmMesBarra{margin:0 0 12px}.fpmMesBarra .t{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}.fpmMesBarra .t span{display:block;height:100%;background:var(--accent)}.fpmMesBarra .r{font-size:12px;color:var(--ink-3);margin-top:4px}

.lista{max-height:calc(100vh - 210px);overflow-y:auto;margin:-4px -6px;padding:4px 6px}

.tfPag{display:flex;gap:3px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tfPag button{min-width:28px;height:28px;border:1px solid var(--rule);background:var(--surface);
  border-radius:4px;font-size:12px;color:var(--ink-2);font-family:var(--mono);padding:0 6px}
.tfPag button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tfPag button.atual{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tfPag button:disabled{opacity:.35;cursor:default}
.tfEl{color:var(--ink-3);padding:0 2px}

/* `.tog` e `.chk` eram usadas pelo gerador de proposta e nunca existiram no
   CSS: os dois botões saíam nus, sem indicar qual estava escolhido. */
.tog{display:flex;gap:7px;flex-wrap:wrap}
.tog button{flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--rule);
  background:var(--surface);border-radius:4px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);font-family:inherit;transition:all var(--t)}
.tog button:hover{border-color:var(--accent);color:var(--accent)}
.tog button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--rule);
  border-radius:4px;font-size:13px;background:var(--surface);cursor:pointer;margin-bottom:9px}
.check input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}

.tfChips{display:none;gap:6px;align-items:center;flex-wrap:wrap;padding:0 0 9px}
.tfChips.on{display:flex}
.tfChip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  border:1px solid transparent;color:var(--accent-ink);border-radius:99px;padding:3px 10px;
  font-size:11.5px;font-weight:600}
.tfChip button{border:0;background:none;color:inherit;font-size:13px;line-height:1;padding:0}
.tfLimpa{border:0;background:none;color:var(--crit);font-size:11.5px;font-weight:700;
  font-family:inherit;text-decoration:underline;padding:0}

.vazio2{text-align:center;padding:34px 18px;color:var(--ink-3)}
.vazio2 b{display:block;font-size:14.5px;color:var(--ink-2);margin-bottom:5px}
.vazio2 p{font-size:12.5px;margin:0;line-height:1.5}

.tfMenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--rule);
  border-radius:6px;box-shadow:var(--sh-lift);width:250px;display:flex;flex-direction:column;overflow:hidden}
.tfmOrd{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rule-2)}
.tfmOrd button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
  padding:5px;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.tfmOrd button:hover{border-color:var(--accent);color:var(--accent)}
.tfmB{padding:8px 10px 4px}
.tfmB input{width:100%;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:6px 9px;font-size:12px;font-family:inherit;outline:none}
.tfmB input:focus{border-color:var(--accent);background:var(--surface)}
.tfmLista{max-height:230px;overflow:auto;padding:4px 0}
.tfmItem{display:flex;align-items:center;gap:8px;padding:4px 11px;font-size:12px;cursor:pointer}
.tfmItem:hover{background:var(--surface-2)}
.tfmItem input{accent-color:var(--accent);flex:0 0 auto}
.tfmItem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfmItem i{font-style:normal;font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.tfmMais{font-size:11px;color:var(--ink-3);padding:6px 11px;margin:0}
.tfmPe{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--rule-2)}
.tfmPe button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
  padding:5px;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.tfmPe button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* A fita da busca FLUTUA no pé do quadro. Até o S24 ela era `absolute` sem
   posição, dentro da fileira de colunas: nascia em cima do cabeçalho da
   primeira coluna, cobrindo o nome dela — e com o botão "Limpar a busca" do
   S25 o clique ia para a coluna, não para o botão. Embaixo ela não cobre
   nome de coluna nenhum, e continua dentro do #board: trocar de tela a apaga
   junto com o resto. */
.fitaBusca{position:fixed;z-index:30;bottom:30px;
  left:calc(var(--nav-w) + (100vw - var(--nav-w)) / 2);transform:translateX(-50%);
  background:var(--accent-soft);border:1px solid var(--accent);box-shadow:var(--sh-lift);
  color:var(--accent-ink);font-size:12px;font-weight:600;padding:6px 12px;border-radius:4px;
  white-space:nowrap;max-width:calc(100vw - var(--nav-w) - 24px);overflow:hidden;text-overflow:ellipsis}
.fitaLimpa{margin-left:10px;border:0;background:none;padding:0;font:inherit;font-weight:700;
  color:var(--accent);text-decoration:underline;cursor:pointer}
.conta{font-size:11.5px;font-weight:400;color:var(--ink-3);font-family:var(--mono);margin-left:6px}
.linhaCli.incompleto b::after{content:' · cadastro incompleto';font-size:10.5px;
  font-weight:600;color:var(--warn)}

/* ── telas de lista e relatório ───────────────────── */
.tela{max-width:1180px;min-width:0;padding-bottom:34px}
.board.livre{min-width:0;max-width:100%}
.telaCab{margin-bottom:16px}
.telaCab h2{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.telaCab p{font-size:13px;color:var(--ink-3);margin:0;line-height:1.5}
.forte{font-weight:700;color:var(--accent-ink)}
.btn.ocupado{opacity:.7;cursor:progress}

.relTipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-bottom:15px}
.relTipo{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  padding:11px 13px;transition:border-color var(--t),background var(--t)}
.relTipo:hover{border-color:var(--accent)}
.relTipo.on{border-color:var(--accent);background:var(--accent-soft)}
.relTipo b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.relTipo.on b{color:var(--accent-ink)}
.relTipo span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}

.relBarra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-bottom:16px}
.relBarra .rot{font-size:12px;color:var(--ink-3)}
.relBarra input[type=date]{height:30px;padding:0 7px;font-size:12.5px;border:1px solid var(--rule);
  border-radius:4px;background:var(--surface);font-family:inherit;color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:11.5px}
.relSaidas{display:inline-flex;gap:8px;flex:0 0 auto}

.relKpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:18px}
.relKpi{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px}
.relKpi b{display:block;font-size:21px;font-weight:700;color:var(--accent-ink);
  font-family:var(--mono);letter-spacing:-.02em;line-height:1.15}
.relKpi span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.relBloco{margin-bottom:22px}
.relBloco h3{font-size:14px;font-weight:600;margin:0 0 5px}
.relBloco .nota{margin:0 0 8px}
.tfThFixo{display:block;padding:8px 11px;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
th.num .tfThFixo{text-align:right}

/* ── login ────────────────────────────────────────── */
.login{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.login .box{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:26px;width:min(360px,100%);box-shadow:var(--sh-lift)}
.login h1{font-size:24px;margin:0 0 3px;letter-spacing:-.02em}
.login h1 span{color:var(--accent)}
.login p{font-size:13px;color:var(--ink-3);margin:0 0 18px}
.login label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.login input{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;font:inherit;margin-bottom:12px;background:var(--surface-2)}
.login input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.login .btn{width:100%;padding:10px;justify-content:center}
.login .erro{font-size:12.5px;color:var(--crit);margin:0 0 10px;min-height:16px}
/* Olho de ver a senha (S30). O botão mora DENTRO da caixa do campo, então a
   margem de baixo passa do input para a caixa — no input ela empurrava o olho
   para cima do rótulo seguinte. */
.login .cxSenha{position:relative;margin-bottom:12px}
.login .cxSenha input{margin-bottom:0;padding-right:42px}
.login .olho{position:absolute;top:0;right:0;bottom:0;width:40px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:0;background:none;color:var(--ink-3);cursor:pointer}
.login .olho:hover{color:var(--ink)}
.login .olho svg{width:19px;height:19px;display:block}
.login .olho .fechado{display:none}
.login .olho.ver .aberto{display:none}
.login .olho.ver .fechado{display:block}

@media (max-width:640px){
  header{padding:8px 11px;gap:9px}

  main{padding:9px}
  .col{flex-basis:246px}
  .who{display:none}
}

/* ── S28 ───────────────────────────────────────────────────────────────────── */
/* item 1: anotação anulada — continua visível, riscada, com o motivo */
.ev.anulada .txt{text-decoration:line-through;color:var(--ink-3)}
.ev.anulada{border-left-color:var(--crit-soft)}
.ev.auto .txt{color:var(--ink-2)}
.ev .quem{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .evAnular{margin-left:auto;color:var(--crit);border-color:var(--crit-soft)}
.anuladaMotivo{font-size:12px;color:var(--crit);margin-top:4px;line-height:1.4}
.anuladaMotivo b{letter-spacing:.06em;font-size:10.5px}
.ev.naOS{margin-left:0;border-left-width:2px}
.citaAnular{margin:10px 0;padding:8px 11px;border-left:3px solid var(--rule);
  background:var(--surface-2);font-size:13px;white-space:pre-wrap}
/* item 3: desconto geral — três caixas separadas, com a palavra que as distingue */
.descG{border:1px solid var(--rule);border-radius:6px;padding:12px;margin:6px 0 16px;background:var(--surface)}
.descGTit{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.descGTit span{text-transform:none;letter-spacing:0;font-weight:400}
.descGGrade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.descGCx{border-radius:5px;padding:9px 10px;border:1px solid var(--rule)}
.descGCx label{display:block;font-size:12.5px;font-weight:700;margin:0}
.descGCx small{display:block;font-size:11.5px;color:var(--ink-3);margin:1px 0 6px}
.descGCx.pct{background:var(--surface-2)}
.descGCx.sai{background:var(--crit-soft);border-color:transparent}
.descGCx.sai small b{color:var(--crit)}
.descGCx.fica{background:var(--ok-soft);border-color:transparent}
.descGCx.fica small b{color:var(--ok)}
.descGInp{display:flex;align-items:center;gap:6px}
.descGInp span{font-weight:700;font-size:13px;white-space:nowrap}
.descGInp input{flex:1;min-width:0;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--rule);
  border-radius:4px;text-align:right;font-variant-numeric:tabular-nums;background:#fff}
.descGInp input.calc{background:transparent;border-style:dashed;color:var(--ink-2)}
/* S34: valor que não é número não se apaga sozinho — fica na tela, marcado,
   até a pessoa arrumar. Campo que se limpa calado é campo que come o que foi
   digitado. */
.descGInp input.ruim{border-color:var(--crit);background:var(--crit-soft)}
.dica.erro{color:var(--crit);font-weight:600}
.dica.aviso{color:var(--warn);font-weight:600}
.descGPrev{margin:10px 0;font-size:13px;line-height:1.5;padding:9px 11px;border-radius:4px;background:var(--surface-2)}
.descGPrev.pronto{background:var(--accent-soft)}
.descGPrev.alto{background:var(--warn-soft)}
.descGPrev.erro{background:var(--crit-soft);color:var(--crit);font-weight:600}
.descGPrev .seta{margin:0 7px;color:var(--ink-3)}
.descGPrev b{font-variant-numeric:tabular-nums}
.descGNotas{font-size:12px;color:var(--ink-2);margin-top:4px}
.descGNotas:empty{display:none}
/* item 4: gerador no negócio */
.gerDet{border:1px solid var(--rule);border-radius:6px;margin:18px 0 6px;background:var(--surface)}
.gerDet>summary{cursor:pointer;padding:10px 12px;display:flex;flex-direction:column;gap:2px;list-style:none}
.gerDet>summary::-webkit-details-marker{display:none}
.gerDet>summary .secTit{border-top:0;padding-top:0}
.gerDet>summary .secTit:before{content:'▸ ';color:var(--accent)}
.gerDet[open]>summary .secTit:before{content:'▾ '}
.gerDet>summary .nota{margin:0;font-size:12px}
.gerDet>#npGer{padding:0 12px 12px}
.gerNeg{padding-top:4px}
.gerCaixa{border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 14px}
.gerCaixaT{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.docCel{font-size:12px;white-space:nowrap}
/* item 5: prévia da logo */
.logoGer{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:5px;
  padding:9px 11px;margin:0 0 14px}
.logoGer img{height:40px;max-width:120px;object-fit:contain}
/* item 7: rótulo da tarefa atual com o nome */
.acoes .lbl.lblAtual{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);cursor:pointer}
.acoes .lbl.lblAtual span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.acoes .lbl.lblAtual b{color:var(--accent-ink)}
/* item 9: compromisso avulso na agenda */
.agCabTopo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.agCabTopo #agComp{margin-left:auto}
.agT.agAv{background:var(--surface-2);border-radius:4px}
.agAv .agTn{display:flex;align-items:center;gap:7px}
.agAvChk{width:16px;height:16px;flex:0 0 auto}
/* S51: a linha do apoio do compromisso não tem checkbox — o espaço fica, para alinhar */
.agAvSem{width:16px;height:16px;flex:0 0 auto;margin:3px 3px 3px 4px;border:1px dashed var(--rule);border-radius:3px}
.acApN{color:var(--ink-3);font-size:12px}
.acHist{margin-top:10px;font-size:12px;color:var(--ink-2)}
.acHist summary{cursor:pointer;color:var(--ink-3)}
.acHist ul{margin:6px 0 0;padding-left:18px;max-height:140px;overflow-y:auto}
.acHist li{margin:2px 0;line-height:1.4}
.agAvB{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;cursor:pointer;color:inherit}
.agAvB:hover{text-decoration:underline}
.turnoTbl tr.turnoOff td{color:var(--ink-3)}
.turnoTbl input[type=time]{width:110px}
.chip.av{background:var(--gestao-soft,#eee);color:var(--gestao,#555);border-color:transparent}
/* S29 item 1: "Mostrar concluídos" na vista Dia */
.agConcBar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:0 0 12px}
.agConc{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.agConc input{position:absolute;opacity:0;width:1px;height:1px}
.agConcSw{width:32px;height:18px;border-radius:9px;background:var(--rule);position:relative;flex:0 0 auto;transition:background .15s}
.agConcSw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.agConc input:checked + .agConcSw{background:var(--accent)}
.agConc input:checked + .agConcSw::after{left:16px}
.agConc input:focus-visible + .agConcSw{outline:2px solid var(--accent);outline-offset:2px}
.agConcN{font-size:12px;color:var(--ink-3)}
.agConcLeg{font-size:12px;color:var(--ink-3);margin-left:auto}
/* S36 · resolvidos na Semana e no Mês; apoio e visita na linha do Dia */
.agResC{font-size:10.5px;color:var(--ok);margin-top:3px;font-weight:600}
.chip.apoio{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
/* S53 · ausências: uma cor por tipo, a mesma na Agenda e na tela de Ausências */
.chip.aus{border-color:transparent;font-weight:600}
.aus-ferias{background:#E3EEF7;color:#164C77}
.aus-folga{background:#E6F2EA;color:#1E5A33}
.aus-atestado,.aus-afastado{background:#F6E7E3;color:#8A2A1A}
.aus-recesso{background:#EEE8F6;color:#4B2D7F}
/* S54 · pedidos, conferência, mapa do ano e saldos */
.chip.ausPed{background:#FFF4DC;color:#7A4E00;border-color:transparent}
.ausLin.ped{background:#FFFBF1}
.ausErro{color:var(--crit)!important;font-weight:600}
.ausAviso{color:var(--warn)!important}
.aviso.ausAvErro{border-left-color:var(--crit)}
.chk.apagado{opacity:.45}
/* S57 · a regra `.campo label` (bloco, maiúscula, 10,5 px) e `.campo input`
   (largura 100%) vinham DEPOIS de `.chk` e venciam: na janela de ausência os
   botões de tipo ficavam centralizados numa linha e o texto embaixo, em
   maiúscula. Dentro de `.campo` o `.chk` volta a ser o `.chk`. */
.campo label.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:400;letter-spacing:normal;
  text-transform:none;color:var(--ink);margin:0 0 8px;cursor:pointer}
.campo .chk input{width:16px;height:16px;flex:0 0 auto;padding:0;margin:0;border:0}
.campo .chk input:focus{outline-offset:2px}
#auTipos{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px}
#auTipos .chk{margin:0}
.ausAbas{margin-top:10px}
.ausLeg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--ink-2);font-size:12px}
.ausLeg i{display:inline-block;width:20px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.ausLeg i.ausLegPed{background:repeating-linear-gradient(135deg,#1B6FA9 0 4px,#A9C9E3 4px 8px)}
.ausLeg i.ausLegChq{background:#fff;box-shadow:inset 0 0 0 2px var(--crit)}
.ausLeg i.ausLegVenc{width:2px;border-left:2px dashed var(--crit);border-radius:0}
.ausGrade{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.ausMapaT{border-collapse:collapse;width:100%;min-width:980px;table-layout:fixed}
.ausMapaT th,.ausMapaT td{padding:0;border-bottom:1px solid var(--rule)}
.ausMapaT .nome{padding:7px 10px;text-align:left;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ausMapaT thead th{height:24px;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.ausMapaT .trilho{position:relative;height:34px}
.ausMes{position:absolute;top:0;bottom:0;border-left:1px solid #EDF0F2}
.ausMesR{position:absolute;top:6px;margin-left:4px}
.ausHoje{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);opacity:.45}
.ausBar{position:absolute;top:7px;height:20px;border:0;border-radius:3px;font:600 10.5px/20px Inter,sans-serif;padding:0 4px;
  white-space:nowrap;overflow:hidden;text-align:left;cursor:pointer;min-width:3px}
.ausBar.aus-ferias{background:#1B6FA9;color:#fff}
.ausBar.aus-folga{background:#2E7D4F;color:#fff}
.ausBar.aus-recesso{background:#6A4BA8;color:#fff}
.ausBar.aus-atestado,.ausBar.aus-afastado{background:#B5533C;color:#fff}
.ausLeg i.aus-ferias{background:#1B6FA9}.ausLeg i.aus-folga{background:#2E7D4F}
.ausLeg i.aus-recesso{background:#6A4BA8}.ausLeg i.aus-atestado{background:#B5533C}
.ausBar.ped{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.65) 0 4px,transparent 4px 8px)}
.ausBar.chq{box-shadow:0 0 0 2px var(--crit)}
.ausVenc{position:absolute;top:2px;bottom:2px;border-left:2px dashed var(--crit)}
.ausSaldo{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:10px 12px;margin-bottom:10px}
.ausSaldoH{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:6px}

async function renovarToken(){

let EQUIPE = [];

const NOMES = {};

let TURNO = { capacidade_min: 540, dias_uteis: [1,2,3,4,5] };

async function carregarEquipe(){
  if (DEMO){
    EQUIPE = [{ id:'u1', nome:'Escritório 1', executa_em:'adm' },
              { id:'u2', nome:'Escritório 2', executa_em:'adm' },
              { id:'u3', nome:'Inspetor 1', executa_em:'campo' },
              { id:'u4', nome:'Inspetor 2', executa_em:'campo' }];
    EQUIPE.forEach(u => NOMES[u.id] = u.nome);
    return;
  }
  try{
    const [us, tn, td] = await Promise.all([
      get('usuarios?select=id,nome,perfil_id,perfis(executa_em)&ativo=is.true&order=nome'),
      get('parametros_turno?select=*&id=eq.GLOBAL').catch(() => []),
      // S29: o turno é POR DIA DA SEMANA. Sem a tabela (SQL 51 não rodou), a
      // tela cai no turno único de antes em vez de ficar sem capacidade.
      get('turno_dias?select=*&order=dia_semana').catch(() => null)
    ]);
    EQUIPE = (us || []).map(u => ({
      id:u.id, nome:u.nome, perfil:u.perfil_id,
      executa_em: (u.perfis && u.perfis.executa_em) || 'adm'
    }));
    EQUIPE.forEach(u => NOMES[u.id] = u.nome);
    if (tn && tn.length){
      const t = tn[0];
      const min = (h) => { const p = String(h||'').split(':'); return (+p[0]||0)*60 + (+p[1]||0); };
      TURNO = {
        capacidade_min: Math.max(0, min(t.turno_fim) - min(t.turno_inicio) - (t.intervalo_min||0)),
        dias_uteis: t.dias_uteis || [1,2,3,4,5],
        turno_inicio: t.turno_inicio, turno_fim: t.turno_fim, intervalo_min: t.intervalo_min
      };
    }
    if (td && td.length) aplicarTurnoDias(td);
  }catch(e){ console.warn('[equipe]', e.message); }
}

const _minDe = h => { const p = String(h||'').split(':'); return (+p[0]||0)*60 + (+p[1]||0); };

function aplicarTurnoDias(td){
  const dias = {};
  td.forEach(d => {
    const cap = Math.max(0, _minDe(d.fim) - _minDe(d.inicio) - (Number(d.intervalo_min) || 0));
    dias[Number(d.dia_semana)] = { ativo: !!d.ativo, cap: d.ativo ? cap : 0,
      inicio: d.inicio, fim: d.fim, intervalo_min: Number(d.intervalo_min) || 0 };
  });
  const uteis = Object.keys(dias).map(Number).filter(k => dias[k].ativo).sort((a,b) => a-b);
  const freq = {};
  uteis.forEach(k => { freq[dias[k].cap] = (freq[dias[k].cap] || 0) + 1; });
  const tipico = Object.keys(freq).map(Number)
    .sort((a,b) => (freq[b] - freq[a]) || (b - a))[0];
  TURNO = Object.assign({}, TURNO, { dias, dias_uteis: uteis.length ? uteis : [1,2,3,4,5],
                                     capacidade_min: tipico || TURNO.capacidade_min || 480,
                                     porDia: true });
}

function minHora(m){
  m = Number(m || 0);
  if (!m) return '—';
  const h = Math.floor(m / 60), r = m % 60;
  return h ? (h + 'h' + (r ? String(r).padStart(2,'0') + 'min' : '')) : (r + 'min');
}

function idsFiltroCom(){

  const u = new Set();

}

function pintarFiltrosCom(){
  const box = document.getElementById('cFiltros');
  if (!box) return;
  box.innerHTML = '';
  _filtrosComDef().forEach(([k, rot, ids]) => {
    // filtro de alerta sem nenhum card some — menos ruído na barra; o que
    // está LIGADO continua, para a pessoa poder desligar
    if (!ids.size && !FILTRO_COM.has(k) && k !== 'venda_adicional' && k !== 'meus') return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'fchip' + (FILTRO_COM.has(k) ? ' on' : '');
    b.innerHTML = esc(rot) + '<span class="n">' + ids.size + '</span>';
    b.setAttribute('aria-pressed', FILTRO_COM.has(k) ? 'true' : 'false');
    b.addEventListener('click', () => {
      if (FILTRO_COM.has(k)) FILTRO_COM.delete(k); else FILTRO_COM.add(k);
      try{ localStorage.setItem(K_FCOM, JSON.stringify([...FILTRO_COM])); }catch(e){}
      desenharCom();
    });
    box.appendChild(b);
  });
  if (FILTRO_COM.size){
    const l = document.createElement('button');
    l.type = 'button'; l.className = 'btn mini'; l.textContent = 'limpar';
    l.addEventListener('click', () => { FILTRO_COM.clear();
      try{ localStorage.removeItem(K_FCOM); }catch(e){} desenharCom(); });
    box.appendChild(l);
  }
}
