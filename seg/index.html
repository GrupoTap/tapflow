<!-- ── favicon ────────────────────────────────────────────────────────────────────────
     O "E" da Engetap DENTRO do arquivo, como data-URI. Por que embutido e não
     apontando para icons/: o ícone por caminho só aparece se a pasta icons/ for
     junto e se o nível de pasta bater — e o Hub apontava para field/icons/, que
     existe no PUBLICAR e não existe em app/hub/. Embutido, a aba mostra o ícone
     no GitHub Pages, no duplo clique e em qualquer pasta. É SVG: fica nítido em
     tela retina. Os PNG de icons/ continuam existindo — o app instalado (PWA)
     precisa de arquivo de verdade e usa aqueles. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect width=%22512%22 height=%22512%22 rx=%22104%22 fill=%22%231B6FA9%22/%3E%3Cg transform=%22translate(0,512) scale(1,-1) translate(256,256.5) scale(1.3) translate(-256,-256.5)%22 fill=%22%23fff%22 stroke=%22%23fff%22 stroke-width=%2222%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M117 414 l-1 0 0 -121 0 -120 19 0 19 0 0 -37 0 -38 121 0 121 0 -45 45 -44 45 -69 0 -69 0 0 12 0 11 90 0 89 0 0 1 0 1 -44 44 -45 44 -45 0 -45 0 0 12 0 11 99 0 99 0 0 1 0 0 -45 45 -44 45 -81 0 -80 0 0 -1z m184 -44 l30 -29 0 -1 0 -1 -88 0 -89 0 0 -75 0 -76 -11 0 -12 0 0 105 0 106 1 0 0 1 70 0 69 0 30 -30z m-19 -113 l30 -29 0 -1 0 -1 -67 0 -67 0 0 30 0 30 1 0 0 1 37 0 36 0 30 -30z m47 -114 l30 -29 0 -1 0 0 -95 0 -95 0 0 30 0 30 65 0 66 0 29 -30z%22/%3E%3C/g%3E%3C/svg%3E">
<!-- ── manifesto (PWA) ───────────────────────────────────────────────────────
     O MESMO manifesto do hub, um nível acima. Não é cópia: apontar para o
     arquivo do hub faz do Manager parte do app TapFlow (id "/tapflow/") em vez
     de um atalho avulso. Sem isto, o Chrome dava esta página ao ProperHub, que
     declara "scope": "/" e reivindica o grupotap.github.io inteiro — o título
     da janela saía «ProperHub - TapFlow Manager». A história completa está no
     comentário do hub (PUBLICAR/index.html). — S35, 21/09/2026
-->
<link rel="manifest" href="../manifest.webmanifest">
<!-- ── S45 · item 1 (PWA): o ícone do iPhone ─────────────────────────────────
     O Safari do iPhone NÃO lê os ícones do manifesto para o "Adicionar à Tela
     de Início": sem esta linha a tela inicial ganhava um print da página. É o
     mesmo PNG do Field (o monograma branco sobre o azul da Engetap), um nível
     acima — publicado em PUBLICAR/field/icons/. As duas metas seguintes fazem o
     app abrir sem a barra do Safari e com o nome curto embaixo do ícone. -->
<link rel="apple-touch-icon" href="../field/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TapHub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<!-- ═══════════════════════════════════════════════════════════════════════════
     TAPFLOW MANAGER — TFM_S3
     Engetap Engenharia · quadros, cadastros, abertura de OS e itens da OS

     S2 acrescentou: cadastros, abertura de OS, aba de ITENS e registro da
     proposta externa.
     S3 acrescenta: upload do PDF da proposta para o Google Drive, geração de
     PDF (levantamento e resumo da OS) e a aba ARQUIVOS.

     ARQUIVO ÚNICO, SEM BUILD. Abre com duplo clique ou hospeda no GitHub Pages.

     ── COMO LIGAR NO SUPABASE ─────────────────────────────────────────────────
     Enquanto SUPABASE_URL estiver vazio, o app roda em MODO DEMO com dados de
     mentira — dá para ver os quadros funcionando sem instalar nada.
     Para ligar de verdade, preencha as duas constantes logo abaixo com o que
     está em Supabase → Settings → API.

     ── O QUE ESTE APP NÃO FAZ, DE PROPÓSITO ───────────────────────────────────
     Não existe arrastar o card. A coluna é a fase da primeira tarefa não
     resolvida, calculada pelo banco na view v_os_kanban. O card se move quando
     uma tarefa fecha — e só assim. O banco recusa UPDATE direto em
     pipeline_tarefas, então nem um bug daqui conseguiria burlar isso.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
/* ════════════════════════════════════════════════════════════════════════════
   TOKENS — a cor sai da logomarca da Engetap, não de escolha minha.
   O monograma é um gradiente de #1D4E80 a #2596D5, o texto é #515252 e o
   subtítulo é #0087CC. Até o S9 o app era verde, que eu tinha inventado.
   ════════════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#1B6FA9; --accent-hover:#155A8A; --accent-ink:#164C77;
  --accent-soft:#E3EEF7; --accent-alt:#0087CC;
  --sidebar-bg:#102438; --sidebar-fg:#9DB2C6; --sidebar-fg-active:#F5F9FC;
  --sidebar-hover:rgba(255,255,255,.05); --sidebar-active:rgba(255,255,255,.08);
  --sidebar-group:#6E8399;

  --paper:#F1F3F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#14181B; --ink-2:#515252; --ink-3:#78838A;
  --rule:#DBE0E3; --rule-2:#EBEFF1;

  --campo:#1B6FA9;  --campo-soft:#E3EEF7;
  --gestao:#8A5A12; --gestao-soft:#F6EBD9;
  /* O quarto quadro (Técnico Administrativa) precisa de faixa própria: com
     a mesma cor da gestão, quem olha de longe não distingue os dois. */
  --tecadm:#1E7A42; --tecadm-soft:#E1F0E7;
  /* O quinto (Fornecimento de Produtos, S25) também: é um FLUXO, não uma
     equipe, e quem alterna entre ele e a Administrativa precisa saber de
     relance em qual dos dois está. */
  --forn:#6B4FA0;   --forn-soft:#EEE9F6;
  --crit:#A62D18;   --crit-soft:#F7E4DF;
  --warn:#96601A;   --warn-soft:#F8EEDC;
  --ok:#1E7A42;     --ok-soft:#DFF0E6;

  --nav-w:220px; --header-h:54px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,26,28,.06), 0 6px 18px -12px rgba(16,26,28,.3);
  --sh-lift:0 2px 4px rgba(16,26,28,.08), 0 12px 28px -14px rgba(16,26,28,.42);
  --t:120ms ease;
}

/* ── foco visível em todo lugar ────────────────────────────────────────────
   O PCM tem UM :focus-visible no arquivo inteiro. Quem navega por teclado —
   ou quem tem o mouse ruim — fica sem saber onde está. Aqui é global. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.nav-item:focus-visible{outline-offset:-2px}

/* ════════════════════════════════════════════════════════════════════════════
   SHELL — barra lateral fixa + header + conteúdo
   ════════════════════════════════════════════════════════════════════════════ */
.nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);background:var(--mod-escuro, var(--sidebar-bg));
  color:var(--sidebar-fg);display:flex;flex-direction:column;padding:14px 0 10px;z-index:60;
  border-right:1px solid rgba(255,255,255,.05)}
.nav-brand{padding:0 16px 13px;display:flex;align-items:baseline;gap:7px;
  border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:10px}
.nav-brand b{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.02em}
.nav-brand b span{color:var(--mod-claro, var(--accent-alt))}
.nav-brand .v{font-family:var(--mono);font-size:10.5px;color:var(--sidebar-group);letter-spacing:.04em}
.nav-groups{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-groups::-webkit-scrollbar{width:6px}
.nav-groups::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.nav-group{display:flex;flex-direction:column}
.nav-group.fim{margin-top:auto}
.nav-gtoggle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;
  cursor:pointer;user-select:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  color:var(--sidebar-group);padding:9px 16px 4px;transition:color var(--t)}
.nav-gtoggle:hover{color:var(--sidebar-fg-active)}
.nav-car{display:inline-block;width:9px;font-size:9px;line-height:1;transition:transform var(--t);opacity:.75}
.nav-group.fechado .nav-car{transform:rotate(-90deg)}
.nav-gn{margin-left:auto;font-size:9px;opacity:0;transition:opacity var(--t)}
.nav-group.fechado .nav-gn{opacity:.6}
/* S44 · Bruno pediu pra recolher por completo (28/09/2026): antes o grupo
   fechado escondia tudo MENOS o item ativo, pra não perder a própria posição
   — só que isso deixava o grupo aberto sempre "vazando" uma linha e os outros
   fechados de verdade, inconsistente. A posição atual já aparece no caminho
   (breadcrumb) lá em cima, então agora fechado é fechado mesmo. */
.nav-group.fechado .nav-item{display:none}

.nav-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;
  padding:8px 16px;font-size:13px;color:var(--sidebar-fg);cursor:pointer;
  border-left:2px solid transparent;transition:background var(--t),color var(--t)}
.nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-fg-active)}
.nav-item.on{background:var(--sidebar-active);color:var(--sidebar-fg-active);border-left-color:var(--mod-claro, var(--accent-alt))}
.nav-item svg{width:16px;height:16px;flex:0 0 auto}
/* Duas linhas em vez de reticências. "Equipe Técnico A…" não identifica quadro
   nenhum, e identificar o quadro é a única coisa que este item precisa fazer.
   O ícone e o contador ficam alinhados ao topo para a linha não dançar. */
.nav-item .rot{flex:1;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.nav-item{align-items:flex-start}
.nav-item svg,.nav-item .nav-n{margin-top:1px}
.nav-n{margin-left:auto;background:rgba(255,255,255,.12);color:var(--sidebar-fg-active);
  font-size:10px;font-weight:700;line-height:1;padding:2px 6px;border-radius:9px;min-width:16px;text-align:center}
.nav-n:empty{display:none}
.nav-n.alerta{background:var(--crit);color:#fff}

.app{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:40;
  /* S82 · H10, opção A: a faixa de 4 px na cor do módulo da área aberta (só a moldura muda) */
  box-shadow:inset 0 4px 0 var(--mod, transparent)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.tbBusca{width:250px;height:32px;padding:0 10px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--rule);border-radius:4px;outline:none;font-family:inherit;color:var(--ink);
  transition:border-color var(--t),background var(--t)}
.tbBusca:focus{border-color:var(--accent);background:var(--surface)}
.tbBusca::placeholder{color:var(--ink-3)}

/* A regra base vem ANTES da media query: declarada depois, ela vencia por
   ordem de cascata e o botão do menu ficava invisível também no celular. */
.navBurger{display:none;align-items:center;justify-content:center;width:32px;height:32px;
  border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:15px}

@media (max-width:900px){
  :root{--nav-w:0px}
  .nav{transform:translateX(-100%);transition:transform .2s;width:220px;box-shadow:var(--sh-lift)}
  body.navAberta .nav{transform:none}
  body.navAberta .navScrim{display:block}
  .navScrim{display:none;position:fixed;inset:0;background:rgba(16,26,28,.4);z-index:55}
  .navBurger{display:flex}
  .app{margin-left:0}
  .tbBusca{width:auto;flex:1;min-width:90px}
  .topbar{gap:8px;padding:0 10px}
  .crumb{display:none}
  .who{display:none}
  #btnRefresh{display:none}          /* puxar para recarregar já existe no navegador */
  #connTxt{display:none}             /* o ponto continua: é o sinal, o texto é enfeite */
  #btnNovaOS{padding:6px 9px;font-size:12px}
  .tela{padding-bottom:24px}
  main{padding:12px 10px}
}

*{box-sizing:border-box}
/* `hidden` tem que vencer o display dos elementos abaixo — sem isto o overlay
   de login continua na frente do app mesmo com o atributo hidden. */
[hidden]{display:none !important}
html,body{height:100%}
/* A gaveta fechada fica em translateX(100%): a caixa continua existindo fora da
   tela e esticava a largura rolável em 390px. Cortar aqui é mais barato do que
   animar `right`, que dispara layout a cada quadro. */
html{overflow-x:hidden}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ── topo ─────────────────────────────────────────── */
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.off{background:var(--crit)}
.dot.sync{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  background:var(--surface);border:1px solid var(--rule);padding:6px 12px;
  border-radius:3px;font-size:13px;font-weight:600;color:var(--ink-2);
}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
/* S78 · o "Abrir a preparação" é um link (vai para doc/) com cara de botão */
a.btn{display:inline-block;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* S45 · item 4: o botão que ainda não vale — branco, letra cinza, não grava.
   NÃO é `disabled`: botão desabilitado não recebe o toque, e no celular (sem
   "passar o mouse") é o toque que mostra o porquê. */
.btn.esmaecido,.btn.esmaecido:hover{background:var(--surface);border-color:var(--rule);color:var(--ink-3);
  cursor:not-allowed;filter:none;font-weight:500}
.who{font-size:12.5px;color:var(--ink-3)}
.who b{color:var(--ink);font-weight:600}
/* S56 · fila item 3: a barra do topo numa janela de 1000–1440 px (menu lateral
   à mostra, barra com ~780 px). Antes, "+ Nova OS" quebrava em 3 linhas, o
   crachá vazava da barra e, logado, "Atualizar" saía da tela. Regra: nada
   quebra linha; quem encolhe é a busca (até um mínimo) e o caminho do topo;
   os botões ficam inteiros. Na faixa estreita sobram só o essencial:
   o ponto da conexão (texto no balão), o primeiro nome (o resto no balão),
   o ícone de "Trocar de app" e "+ OS". */
.topbar>*{flex-shrink:0;white-space:nowrap}
.topbar .crumb{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1 1 0;min-width:0}
.crachaEu{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.whoResto{font-weight:400}
.tbIco{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;vertical-align:-2px;display:none}
#btnHub:not([hidden]){display:inline-flex;align-items:center;gap:6px}
@media (min-width:901px){
  .topbar .tbBusca{flex:0 1 250px;width:250px;min-width:120px}
}
/* até 1439 px (inclui o celular, onde o nome já some): ícone e ponto */
@media (max-width:1439px){
  #connTxt{display:none}
  .whoResto{display:none}
  #btnHub .tbTxt{display:none}
  #btnHub .tbIco{display:inline}
  #btnHub{padding:6px 9px}
}
@media (min-width:901px) and (max-width:1439px){
  .topbar{gap:9px;padding:0 14px}
  #crumbGrupo,#crumbGrupo+span{display:none}
}
@media (min-width:901px) and (max-width:1099px){
  .tbNova{display:none}
  #btnNovaOS{padding:6px 10px}
}
/* S32 · item 3: a tela "Meu perfil". Painel único e estreito de propósito —
   são quatro linhas de leitura e um botão; espalhar isso na largura da tela
   faria a pessoa procurar onde está o conteúdo. */
.euWrap{max-width:560px}
.euTopo{display:flex;gap:16px;align-items:flex-start;margin:14px 0 16px}
.euDados{flex:1;min-width:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.euLin{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:baseline;
  padding:9px 12px;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.euLin:last-child{border-bottom:0}
.euRot{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.euVal{font-weight:600;overflow-wrap:anywhere}
.euNota{color:var(--ink-3);font-size:11px;white-space:nowrap}
/* S40 · Conta corrente Proper. Lista em LINHAS, não tabela: no celular a
   coluna "Estornar" nasceria fora da tela (regra "campo que só aparece
   rolando para o lado é campo que não existe", §7). */
.ccWrap{max-width:980px;padding-bottom:40px}
.ccTopo{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:0 0 14px}
.ccSaldo{flex:1 1 260px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.ccSaldo .rot{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.ccSaldo .v{font:600 26px/1.2 'JetBrains Mono',monospace;margin:4px 0 2px}
.ccSaldo .q{font-size:12.5px;color:var(--ink-2)}
.ccAcoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ccSec{font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ccSec .nota{font-weight:400;margin:0}
.ccLista{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.ccLin{display:grid;grid-template-columns:86px minmax(0,1fr) 120px 120px 92px;gap:10px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:13px}
.ccLin:last-child{border-bottom:0}
.ccLin.cab{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;background:var(--surface-2)}
.ccLin .d{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-2)}
.ccLin .t{overflow-wrap:anywhere}
.ccLin .t small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.ccLin .n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap}
.ccLin .mais{color:var(--crit)} .ccLin .menos{color:var(--ok)}
.ccLin.riscada .ccData,.ccLin.riscada .ccDesc,.ccLin.riscada .ccNome,.ccLin.riscada .n.v{text-decoration:line-through;color:var(--ink-3)}
.ccLin .a{text-align:right}
/* S46 · As listas de Contas a Receber, Contas a Pagar e Recorrentes têm SEIS
   pedaços por linha (data · nome · descrição · valor · chips · botões), e o
   .ccLin base só declara cinco colunas. O sexto — os botões — caía numa linha
   de grade nova, sozinho na 1ª coluna (86px), e cada botão ficava numa linha:
   visto no inspector em 29/09 (grid-template-rows 19.5px 78px). A classe é
   própria em vez de mexer no .ccLin, porque ele serve a várias telas com 3, 4
   e 5 colunas que hoje estão certas. Os botões são um grupo flex: quebram
   JUNTOS se faltar espaço, nunca um por linha. */
.ccLin.fin6{grid-template-columns:86px minmax(0,1fr) minmax(0,1.4fr) 112px minmax(0,.9fr) var(--acoes,280px)}
/* Cada linha é uma grade própria: coluna de botões com largura "do conteúdo"
   desalinhava a lista (linha com 4 botões empurrava a descrição para a
   esquerda). Largura FIXA por lista, do tamanho da linha mais cheia dela. */
#finreLista{--acoes:330px} #finpgLista{--acoes:280px} #finrecLista{--acoes:170px}
.ccLin.fin6 .a{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.finAnul{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;vertical-align:middle}
.finAnul input{width:auto;margin:0}
/* ════════════════════════════════════════════════════════════════════════════
   S48 · LISTAS DO FINANCEIRO (Contas a Pagar, Contas a Receber, Recorrentes)
   Tudo aqui é .finLista / .fin6.finL: o .ccLin base serve a outras telas de
   3, 4 e 5 colunas que estão certas e não mudam.
   ════════════════════════════════════════════════════════════════════════════ */
.finTopo{margin-bottom:10px}
.finBarra{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.finFiltros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.finSel{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.finSel select,.finPerBtn{height:30px;padding:0 8px;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;
  border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);font-family:inherit;max-width:240px}
.finPerBtn{display:inline-flex;align-items:center;white-space:nowrap;cursor:pointer}
.finPerBtn:hover,.finSel select:hover{border-color:var(--accent)}
.finFiltrosBtn{display:none}
.finHistNota{color:var(--ink-3)}
.finHistNota button{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.finTags{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.finTags.on{display:flex}
.finResumo{font-size:12.5px;color:var(--ink-2);margin:0 0 6px;min-height:18px}
.finResumo b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* A lista vira um cartão branco SEM o padding do .lista: assim o cabeçalho
   gruda no topo exato da área que rola, sem fresta por onde as linhas
   apareceriam (item 1). A altura desconta a barra de filtros e o resumo. */
.lista.finLista{max-height:calc(100vh - 300px);margin:0;padding:0;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px}
.finLista .ccLin.fin6.cab{position:sticky;top:0;z-index:3;background:var(--surface-2);
  border-bottom:1px solid var(--rule);box-shadow:0 1px 0 var(--rule)}
.finOrd{border:0;background:none;padding:2px 3px;margin:-2px -3px;font:inherit;color:inherit;letter-spacing:inherit;
  text-transform:inherit;cursor:pointer;border-radius:3px;display:inline-flex;gap:4px;align-items:center}
.finOrd:hover{background:var(--accent-soft);color:var(--accent-ink)}
.finOrd.on{color:var(--accent-ink);font-weight:700}
.finOrd i{font-style:normal;font-size:9px;min-width:8px;margin-left:1px}
/* o título do mês gruda logo abaixo do cabeçalho das colunas (--cabH vem do JS) */
.finMes{position:sticky;top:var(--cabH,30px);z-index:2;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  padding:6px 12px;background:var(--accent-soft);color:var(--accent-ink);border-bottom:1px solid var(--rule);font-size:12px}
.finMes b{font-size:12.5px}
.finMes span{color:var(--ink-2);font-family:var(--mono);font-size:11.5px}

/* item 3: listras, destaque ao passar o mouse, separador visível, altura
   mínima e a faixa de cor da situação (reforço — o chip é quem informa) */
.finLista .ccLin.fin6.finL{background:var(--surface);border-bottom:1px solid var(--rule);min-height:44px}
.finLista .ccLin.fin6.finL.par{background:var(--paper)}
.finLista .ccLin.fin6.finL:hover{background:var(--accent-soft)}
.finLista .ccLin.fin6.finL:last-child{border-bottom:0}
.ccLin.finL.st-venc{box-shadow:inset 4px 0 0 var(--crit)}
.ccLin.finL.st-breve{box-shadow:inset 4px 0 0 #C99A06}
.ccLin.finL.st-paga{box-shadow:inset 4px 0 0 var(--ok)}
.ccLin.finL.st-anul{box-shadow:inset 4px 0 0 #AEB7BD}
.chip.fCrit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.fAtn{background:#FBF1CF;color:#7A5A00;border-color:transparent}
.chip.fOk{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.finApoio{color:var(--ink-3);font-style:italic}
.finSaldo{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);font-weight:400}
/* item 3.6: só dois controles por linha — a coluna de ações encolhe e a sobra
   vai para fornecedor/descrição */
#finreLista{--acoes:178px} #finpgLista{--acoes:124px} #finrecLista{--acoes:118px}
/* "VENCIMENTO ▲" não cabia nos 86px da 1ª coluna e invadia a do nome */
.finLista .ccLin.fin6{grid-template-columns:98px minmax(0,1fr) minmax(0,1.4fr) 116px minmax(0,.9fr) var(--acoes,280px)}
@media (max-width:1100px) and (min-width:701px){
  .finLista .ccLin.fin6{grid-template-columns:96px minmax(0,1fr) minmax(0,1.3fr) 108px var(--acoes,280px)}
}
.finPri{padding:3px 10px;font-size:12px}
.finMais{padding:2px 9px;font-size:15px;line-height:1;min-width:32px;letter-spacing:1px}
.finMenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--sh-lift);min-width:150px;padding:4px 0;display:flex;flex-direction:column}
.finMenu button{border:0;background:none;text-align:left;padding:8px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.finMenu button:hover,.finMenu button:focus{background:var(--accent-soft);outline:none}
.finMenu button.perigo{color:var(--crit)}
.finTrava{display:block;margin-top:3px;font-size:11.5px;color:var(--warn);line-height:1.35}
.campo input:disabled,.campo select:disabled{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.finHist{margin-top:10px;border-top:1px solid var(--rule-2);padding-top:8px;font-size:12.5px}
.finHist summary{cursor:pointer;color:var(--accent-ink);font-weight:600}
.finHistLin{display:flex;flex-direction:column;padding:5px 0;border-bottom:1px solid var(--rule-2)}
.finHistLin .q{font-size:11px;color:var(--ink-3)}
.relPerBtn{font-size:12.5px;padding:5px 10px}
.ccLin.finPul{grid-template-columns:86px minmax(0,1fr) 110px}
/* S59 · Prazos de Recebimento: cliente · prazo · quem alterou · botão */
.ccLin.prz{grid-template-columns:minmax(0,1.6fr) 90px minmax(0,1fr) 90px}
.ccLin.prz .t b{font-weight:600}
.przDias{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.przDias input{width:90px}
.przDias .btn{padding:4px 10px;font-size:12.5px}
.przFil{margin:6px 0 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--rule-2);border-radius:4px;font-size:12.5px;max-height:180px;overflow:auto}
.przFil div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.przFil small{color:var(--ink-3)}
.przVenc{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.przVenc a{cursor:pointer;text-decoration:underline}
@media (max-width:700px){ .ccLin.prz{grid-template-columns:minmax(0,1fr) auto auto;row-gap:2px} .ccLin.prz.cab{display:none}
  .ccLin.prz .quem{order:5;grid-column:1 / -1;font-size:12px;color:var(--ink-3)} }
@media (max-width:700px){ .ccLin.finPul{grid-template-columns:78px minmax(0,1fr) auto} .ccLin.finPul.cab{display:none} }
.finSelSolto{height:30px;padding:0 8px;font-size:12.5px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);font-family:inherit;max-width:260px}

@media (max-width:700px){
  /* no celular a barra recolhe num botão "Filtros" e não toma a tela */
  .finFiltrosBtn{display:inline-flex}
  .finFiltros{display:none;width:100%}
  .finBarra.aberta .finFiltros{display:flex}
  .finSel{flex:1 1 140px}
  .finSel select,.finPerBtn{max-width:none;width:100%;height:36px}
  .lista.finLista{max-height:none!important}
  /* a grade de 6 colunas da janela larga (98px…) é mais específica que a do
     celular do S46 — sem repetir aqui, nome e valor se sobrepunham */
  .finLista .ccLin.fin6{grid-template-columns:82px minmax(0,1fr) auto}
  .finMes{top:0}
  .finMais{min-width:40px;min-height:36px}
  .finPri{min-height:36px}
  .ccLin.fin6.finL .a{justify-content:flex-end}
}
/* Janela média: os botões continuam numa fila só (max-content) e são os
   chips que descem para baixo do nome/descrição — espremer a coluna dos
   botões trazia de volta o "um embaixo do outro" que o item 3 veio tirar. */
@media (max-width:1100px) and (min-width:701px){
  .ccLin.fin6{grid-template-columns:80px minmax(0,1fr) minmax(0,1.3fr) 104px var(--acoes,280px);row-gap:4px}
  .ccLin.fin6 > span:nth-child(5){grid-column:2 / 5;grid-row:2}
  .ccLin.fin6 .a{grid-column:5;grid-row:1 / span 2}
  .ccLin.fin6.cab > span:nth-child(5){display:none}
}
.ccTipo{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-2);margin-right:6px;text-transform:uppercase;letter-spacing:.3px}
.ccTipo.abatimento{background:var(--ok-soft);color:var(--ok)}
.ccTipo.estorno{background:var(--warn-soft);color:var(--warn)}
.ccPed{display:grid;grid-template-columns:minmax(0,1.3fr) 110px 110px 110px 190px;gap:10px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:13px}
.ccPed:last-child{border-bottom:0}
.ccPed.cab{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;background:var(--surface-2)}
.ccPed .n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.ccPed select{width:100%}
.ccPrev{max-height:260px;overflow:auto;border:1px solid var(--rule);border-radius:4px;margin:8px 0}
.ccPrev .ccLin{grid-template-columns:86px minmax(0,1fr) 110px}
.ccPrev .ruim{background:var(--crit-soft)}
@media (max-width:700px){
  .ccLin{grid-template-columns:78px minmax(0,1fr) auto;row-gap:2px}
  .ccLin .s{grid-column:2;text-align:left;font-size:11.5px;color:var(--ink-3)}
  .ccLin .s::before{content:'saldo '}
  .ccLin .a{grid-column:3}
  .ccLin.cab{display:none}
  /* S46 · no celular a linha de seis vira quatro faixas: data · nome · valor
     em cima; descrição; chips; e os botões em fila, de ponta a ponta. */
  .ccLin.fin6{grid-template-columns:78px minmax(0,1fr) auto}
  .ccLin.fin6 .n.v{grid-column:3;grid-row:1}
  .ccLin.fin6 .ccDesc{grid-column:2 / -1}
  .ccLin.fin6 > span:nth-child(5){grid-column:2 / -1}
  .ccLin.fin6 .a{grid-column:1 / -1;justify-content:flex-start;margin-top:4px}
  .finAnul{margin-left:10px}
  .ccPed{grid-template-columns:minmax(0,1fr) auto}
  .ccPed.cab{display:none}
  .ccPed .rec,.ccPed .val{display:none}
  .ccPed .sel{grid-column:1 / -1}
}
.euLin .falta{color:var(--ink-3);font-weight:400}
@media(max-width:560px){
  .euTopo{flex-direction:column;align-items:center}
  .euLin{grid-template-columns:1fr;gap:2px}
  .euNota{white-space:normal}
}

/* S32 · item 3: o crachá virou o atalho para "Meu perfil". Ele continua
   parecendo texto — só o hover e o foco dizem que é clicável. Botão desenhado
   como botão aqui competiria com "Nova OS" e "Atualizar", que são as ações da
   barra; este é um caminho, não uma ação. */
.crachaEu{font:inherit;color:inherit;background:transparent;border:1px solid transparent;
  border-radius:3px;padding:3px 7px;cursor:pointer}
.crachaEu:hover{background:var(--accent-soft);border-color:var(--rule);color:var(--accent-ink)}
.crachaEu:hover b{color:var(--accent-ink)}

.demo{
  background:var(--warn-soft);color:var(--warn);
  padding:6px 18px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--rule);
}

/* ── quadro ───────────────────────────────────────── */
/* O quadro kanban rola na horizontal; as telas de lista rolam na vertical.
   Por isso a altura é calculada, não 100%: com `height:100%` numa página que
   agora rola, o quadro ficava com a altura da janela e as colunas cortadas. */
main{flex:1;overflow-x:auto;padding:16px 18px;min-height:calc(100vh - var(--header-h))}
main.rolaY{overflow-y:auto}
.board{display:flex;gap:10px;align-items:stretch;min-width:min-content;
  height:calc(100vh - var(--header-h) - 32px)}
.board.livre{display:block;height:auto;min-width:0}

/* ── S25: nos QUADROS a página não rola; quem rola é o <main>, e só de lado ──
   Até o S24 a altura do quadro era a conta `100vh − 54 − 32`. A conta fechava
   exata — e mesmo assim sobrava: a barra de rolagem HORIZONTAL do <main> (15 a
   17 px no Windows) é somada POR FORA dela. A página ganhava 15 px de rolagem
   vertical e a barra ficava logo abaixo da borda da janela: para rolar para o
   lado, era preciso primeiro rolar para baixo (item 1). E a roda do mouse
   subia a página inteira esses 15 px, levando o cabeçalho das colunas junto
   (item 2) — os cards já rolavam dentro da coluna, era a página que se mexia.
   Nos quatro quadros, Comercial incluído.
   ⚠ Não dá para ver no Chromium automático: ele esconde as barras. O parecer
   de 09/09 mediu assim e concluiu que cabia. Medir com as barras VISÍVEIS.
   Agora, em modo quadro (`body.emQuadro`, posto pelo irPara): o app tem a
   altura exata da janela, o <main> ocupa o que sobra DEPOIS do topo (e da
   faixa de demo, se houver) e a barra horizontal mora dentro dele — sempre
   no pé da janela, sempre visível. `flex:1 1 0` com a altura do pai definida
   é o que torna a altura do <main> "definida" para o `height:100%` do quadro;
   com o `min-height:100vh` antigo no .app ela não era, e o quadro caía para
   a altura do conteúdo. As telas de lista não entram aqui. */
body.emQuadro .app{height:100vh;height:100dvh;min-height:0}
body.emQuadro main{flex:1 1 0;min-height:0;overflow-x:auto;overflow-y:hidden}
body.emQuadro .board:not(.livre){height:100%}
.col{
  flex:0 0 264px; display:flex; flex-direction:column; height:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:4px;
}
.col.vazia{opacity:.62}
.col-h{
  padding:9px 11px; border-bottom:1px solid var(--rule); display:flex;
  align-items:baseline; gap:8px; position:sticky; top:0;
}
.col-h .t{font-size:12.5px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.col-h .c{
  margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--rule);border-radius:99px;padding:1px 7px;
}
.col.campo{border-top:3px solid var(--campo)}
.col.gestao{border-top:3px solid var(--gestao)}
.col.tecadm{border-top:3px solid var(--tecadm)}
.col.forn{border-top:3px solid var(--forn)}

/* ── aviso de cliente parecido / revisão de duplicados ───────────────── */
.parecidos{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.parecidoLinha{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px;flex-wrap:wrap}
.parecidoLinha .pn{font-weight:600;font-size:13.5px}
.parecidoLinha .pd{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-3)}
.parecidoLinha .chip{margin-left:auto}
.dupGrupo{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:12px 14px;margin-bottom:10px}
.dupGrupo>h4{margin:0 0 2px;font-size:14.5px}
.dupGrupo .sub{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.dupTab{width:100%;border-collapse:collapse;font-size:12.5px}
.dupTab th{text-align:left;font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);
  text-transform:uppercase;border-bottom:1px solid var(--rule);padding:4px 6px}
.dupTab td{padding:5px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.dupTab td.num{font-family:'JetBrains Mono',monospace;text-align:right}
.dupTab tr.vazio td{color:var(--ink-3)}
.dupAcoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* S101 · Duplicados: os já revisados numa seção recolhida */
.dupArq{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px}
.dupArq>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);list-style:none;padding:4px 0}
.dupArq>summary::-webkit-details-marker{display:none}
.dupArq>summary::before{content:'▸ ';color:var(--ink-3)}
.dupArq[open]>summary::before{content:'▾ '}
.dupArq>.sub{font-size:12px;color:var(--ink-3);margin:4px 0 12px}
.dupMotivo{font-size:12px;color:var(--ink-3);margin:-4px 0 10px}
/* S101 · ficha do cliente e item do catálogo para quem é de campo: só leitura.
   Esconder os botões é a tela não OFERECER o que o banco recusa (RLS: escritório). */
#cadDet.soLeitura button,#catDet.soLeitura button,#cadDet.soLeitura input[type=file],#catDet.soLeitura input[type=file]{display:none!important}
#cadDet.soLeitura input,#cadDet.soLeitura select,#cadDet.soLeitura textarea,#catDet.soLeitura input,#catDet.soLeitura select,#catDet.soLeitura textarea{pointer-events:none}
.opcoes{display:flex;flex-direction:column;gap:2px}
.linhaOpc{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:3px;
  font-size:13px;line-height:1.4;cursor:pointer;border:1px solid transparent}
.linhaOpc:hover{background:var(--surface-2)}
.linhaOpc:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.linhaOpc input{margin-top:3px;flex:0 0 auto}
.selo{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;white-space:nowrap}
.selo.seguro{background:var(--ok-soft);color:var(--ok)}
.selo.filial{background:var(--accent-soft);color:var(--accent-ink)}
.selo.risco{background:var(--warn-soft);color:var(--warn)}
.selo.grave{background:var(--crit-soft);color:var(--crit)}
/* S29 itens 5 e 7 */
.selo.aprov{background:var(--accent-soft);color:var(--accent-ink)}
.planoCfg{border-left:3px solid var(--rule);padding:4px 0 2px 12px;margin:0 0 14px}
.planoCfg.padrao{border-left-color:var(--accent)}
.planoCfgT{font-weight:700;margin-bottom:6px}
.planoCfg label .nota{font-weight:400;text-transform:none;letter-spacing:0}
.planosGer{border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 14px;background:var(--surface-2)}
.planosGerT{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.planosTbl td.pd{font-size:12px;color:var(--ink-2);min-width:180px}
.planosTbl tr.padrao td{background:var(--accent-soft)}
.selo.naoaprov{background:var(--crit-soft);color:var(--crit)}
.apTipos .chk{align-items:center}
.acoesPropTd{width:1%;vertical-align:middle}
.acoesProp{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:128px}
.acoesProp .btn.mini{margin-left:0;width:100%;text-align:center;justify-content:center;white-space:nowrap}
.col-b{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-vazia{font-size:12px;color:var(--ink-3);text-align:center;padding:14px 6px;font-style:italic}

/* ── card ─────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;
  border-left:3px solid var(--rule); text-align:left; width:100%; display:block;
}
.card:hover{box-shadow:var(--sh-lift);border-left-color:var(--accent)}
.card.travada{border-left-color:var(--crit)}
.card.atrasada{border-left-color:var(--warn)}
.card .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.card .cli{font-size:14px;font-weight:600;line-height:1.25;margin:3px 0 6px}
.card .tar{font-size:12px;color:var(--ink-2);line-height:1.35;display:flex;gap:5px}
.card .tar .ic{flex:0 0 auto;opacity:.75}
.card .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.chip{
  font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2);white-space:nowrap;
}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.travada{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* Atraso é vermelho, risco é âmbar. Eram idênticos, e no card "5d de atraso"
   ficava com a mesma cor de "faltam 2d" — dois fatos diferentes, um só sinal.
   O Field usa as mesmas duas cores para os mesmos dois fatos. */
.chip.atras{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.lock{background:var(--gestao-soft);color:var(--gestao);border-color:transparent}
.chip.urg{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.altaP{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.risco{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* S34: serviço do NR-13 já vencido. A mesma cor de atraso, pelo mesmo motivo:
   é prazo que passou, não risco de passar. */
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* A borda esquerda diz a SITUAÇÃO (o pior dos dois relógios). A urgência é
   chip, não borda: se as duas coisas usassem a mesma cor, uma OS urgente no
   prazo ficaria igual a uma OS normal atrasada — e são problemas diferentes. */
.card.sit-atrasada{border-left-color:var(--crit)}
.card.sit-risco{border-left-color:var(--warn)}
/* ⚠ Estas DUAS últimas vêm depois de propósito: `travada` e `atrasada` são
   estados mais graves que "risco de prazo", e como a especificidade é a mesma
   quem estiver por último no arquivo vence. Antes, uma OS TRAVADA com prazo a
   dois dias ficava âmbar — a borda mentia. */
.card.atrasada{border-left-color:var(--warn)}
.card.travada{border-left-color:var(--crit)}
.card.urgente{box-shadow:inset 3px 0 0 -1px var(--crit), var(--shadow)}

/* ── faixa de prazo e prioridade na gaveta ─────────────────────────────── */
.faixaPz{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:9px 11px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.fpLinha{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.fpRot{color:var(--ink-3);min-width:74px;font-size:12px}
.fpVal{font-weight:600}
.fpVal.crit{color:var(--crit)} .fpVal.warn{color:var(--warn)}
.fpDe{font-size:10.5px;color:var(--ink-3);background:var(--surface);border:1px solid var(--rule-2);
  border-radius:2px;padding:1px 5px}
.btn.mini{padding:2px 7px;font-size:11px;margin-left:auto}
.tkDes{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);
  margin:5px 0 0 30px;padding-top:5px;border-top:1px dashed var(--rule-2)}
.tkDes i{color:var(--ink-3);opacity:.75}
.histL{display:flex;flex-direction:column;gap:2px}
.histI{border-left:2px solid var(--rule);padding:8px 0 8px 11px;position:relative}
.histI:before{content:'';position:absolute;left:-4px;top:13px;width:6px;height:6px;
  border-radius:50%;background:var(--accent)}
.histT{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);
  font-weight:700}
.histD{font-size:13px;margin-top:1px;line-height:1.4}
.histQ{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ── agenda da equipe ──────────────────────────────────────────────────── */
/* O ribbon: quatro vistas, cada uma com a tela inteira. "Sem dia" é vista
   irmã, não rodapé — no S14 ela empurrava a grade para fora da tela. */
.agRibbon{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--rule)}
.agTab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;
  font:600 13px var(--sans);color:var(--ink-3);cursor:pointer;display:flex;align-items:center;gap:6px}
.agTab:hover{color:var(--ink)}
.agTab.on{color:var(--accent);border-bottom-color:var(--accent)}
.agTabN{background:var(--accent-soft);color:var(--accent-ink);border-radius:9px;
  padding:0 6px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
.agTab.on .agTabN{background:var(--accent);color:#fff}

/* vista DIA */
.agDia{background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:14px 16px;margin-bottom:12px}
.agDiaH{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.agDiaH b{font-size:15px}
.agTar{display:flex;flex-direction:column;gap:1px;margin-top:12px}
.agT{display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--rule-2);padding:9px 2px;cursor:pointer;
  font:inherit;color:inherit}
.agT:hover{background:var(--surface-2)}
.agTn{font-size:13.5px;font-weight:600}
.agTs{font-size:12px;color:var(--ink-3);grid-column:1}
/* S29: sem coluna explícita, a posição de linha do .agTm fazia o grid colocá-lo
   PRIMEIRO — o tempo ia para a esquerda e o nome da tarefa para a direita */
.agTn{grid-column:1}
.agTm{font-size:12px;color:var(--ink-3);grid-row:1/3;grid-column:2;align-self:center;
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* vista MÊS */
.agMes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  background:var(--rule-2);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.agMesH{background:var(--surface-2);padding:7px 8px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-3);font-weight:700;text-align:center}
.agMesD{background:var(--surface);min-height:82px;padding:6px 8px;display:flex;
  flex-direction:column;gap:2px}
.agMesD.fora{background:var(--surface-2);opacity:.5}
.agMesD.naoUtil{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,
  var(--surface-2) 6px,var(--surface-2) 12px)}
.agMesD.hoje .agMesN{background:var(--accent);color:#fff;border-radius:3px;padding:0 5px}
.agMesD.temItens{cursor:pointer}
.agMesD.temItens:hover{background:var(--accent-soft)}
.agMesD.temItens:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.agMesN{font-size:11.5px;color:var(--ink-3);font-weight:700;align-self:flex-start}
.agMesH2{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.agMesD.cheio .agMesH2{color:var(--crit)}
.agMesD.quase .agMesH2{color:var(--warn)}
.agMesP{font-size:10.5px;color:var(--ink-3);line-height:1.25}
.agLeg{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.45}

/* vista SEM DIA */
.agFiltros{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;
  background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:11px 13px}
.agF{display:flex;flex-direction:column;gap:3px;min-width:130px;flex:1 1 130px}
.agF span{font-size:11px;font-weight:600;color:var(--ink-2)}
.agF select{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;font:inherit;
  background:var(--surface);max-width:100%}
.agFiltros .btn.mini{margin-left:0}
.agFn{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.agGrupo{border:1px solid var(--rule);border-radius:5px;background:var(--surface);
  margin-bottom:10px;overflow:hidden}
.agGrupoH{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);
  padding:9px 13px;border-bottom:1px solid var(--rule-2);font-size:13px}
.agGrupoH span{color:var(--ink-3)}
.agGrupoN{margin-left:auto;font-size:11.5px}
.agLinha{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:12px;align-items:center;
  padding:8px 13px;border-top:1px solid var(--rule-2);font-size:13px}
.agLinha:first-of-type{border-top:0}
.agLt{font-weight:600}
.agLe,.agLq,.agLm{color:var(--ink-3);font-size:12.5px}
/* "Quem" é um botão desde o S22 (item 8): clicar escolhe o responsável. Ele
   se veste de texto para a linha não virar uma fileira de botões — o que a
   deixaria pesada e esconderia qual é a ação principal, que é marcar o dia. */
.agLinha .btn.mini.agLq{background:transparent;border:1px dashed var(--rule);
  color:var(--ink-3);font-weight:500;text-align:left;padding:3px 8px;
  justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agLinha .btn.mini.agLq:hover{background:var(--accent-soft);border-color:var(--accent);
  border-style:solid;color:var(--accent-ink)}
.agLm{font-variant-numeric:tabular-nums;text-align:right}
.agLinha .btn.mini{margin-left:0}
@media(max-width:860px){
  .agLinha{grid-template-columns:1fr auto;gap:4px 10px}
  .agLe,.agLq{font-size:11.5px}
  .agLm{grid-row:1;text-align:right}
}

/* ── S31 ─────────────────────────────────────────────────────────────────── */
/* Seleção em lote na vista "Sem dia" (item 2). A caixinha só existe na linha
   que ESTA pessoa consegue assumir — oferecer onde o servidor vai recusar é o
   defeito que o projeto persegue desde o parecer do TapControl. */
.agLinha{grid-template-columns:auto 2fr 1fr 1fr auto auto}
.agCk{display:flex;align-items:center;justify-content:center}
.agCk input{width:15px;height:15px;cursor:pointer}
.agCkVazio{width:15px}
.agLote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;
  padding:9px 12px;border:1px solid var(--accent);border-radius:5px;
  background:var(--accent-soft);font-size:13px}
.agLote b{color:var(--accent-ink)}
.agLote .btn{margin-left:auto}
.agGrupoH .agCkT{margin-right:2px}
@media(max-width:860px){ .agLinha{grid-template-columns:auto 1fr auto} }

/* Tarefas por perfil (item 1) */
.tpTab td,.tpTab th{vertical-align:middle}
.tpTab tr.tpOn{background:var(--accent-soft)}
.tpTab .tpDim{color:var(--ink-3);font-size:12px}
.tpTab input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.tpTab .mono{color:var(--ink-3);font-size:11px}
/* S36 · a matriz de perfis */
.tpModo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.tpMatriz{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;max-width:100%}
.tpMx{margin:0;min-width:100%}
.tpMx th,.tpMx td{padding:6px 8px}
.tpMx .tpMx1{position:sticky;left:0;background:var(--surface);z-index:1;min-width:200px;max-width:260px}
.tpMx .tpMxP{text-align:center;font-size:11px;white-space:normal;min-width:74px;max-width:96px}
.tpMx .tpMxC{text-align:center}
.tpMx td.tpOn{background:var(--accent-soft)}
.tpMx .tpMxSec td{background:var(--surface-2);font-weight:600;font-size:12px;position:sticky;left:0}
.tpSim{color:var(--ok);font-weight:700}
.tpNao{color:var(--ink-3)}

/* Autocomplete do Catálogo na linha da proposta (item 5) */
.acWrap{position:relative}
.acLista{position:absolute;z-index:200;left:0;right:0;top:100%;margin-top:2px;
  background:var(--surface);border:1px solid var(--accent);border-radius:5px;
  box-shadow:0 8px 24px rgba(16,36,56,.16);max-height:260px;overflow-y:auto}
.acItem{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:7px 10px;border:0;background:transparent;cursor:pointer;font:inherit;
  border-bottom:1px solid var(--rule-2)}
.acItem:last-child{border-bottom:0}
.acItem:hover,.acItem.on{background:var(--accent-soft)}
.acItem .acD{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acItem .acC{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}
.acItem .acP{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.acNada{padding:8px 10px;color:var(--ink-3);font-size:12.5px}

/* Consulta do CNPJ no cadastro do cliente (item 8) */
.cnpjLinha{display:flex;gap:8px;align-items:flex-end}
.cnpjLinha .campo{flex:1;margin-bottom:0}
.cnpjCx{margin:8px 0 14px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;background:var(--surface-2);font-size:12.5px;line-height:1.55}
.cnpjCx b{color:var(--ink)}
.cnpjCx.erro{border-color:var(--crit);background:var(--crit-soft)}
.cnpjCx .btn.mini{margin-left:0;margin-top:6px}

.agGrade{overflow-x:auto;border:1px solid var(--rule);border-radius:5px;background:var(--surface)}
.agGrade table{border-collapse:collapse;width:100%;min-width:820px;font-size:12.5px}
.agGrade th,.agGrade td{border-bottom:1px solid var(--rule-2);padding:7px 9px;text-align:left;
  vertical-align:top}
.agGrade thead th{background:var(--surface-2);position:sticky;top:0;font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);white-space:nowrap}
.agGrade thead th.hoje{color:var(--accent)}
.agGrade td.pessoa{font-weight:600;color:var(--ink);white-space:nowrap;background:var(--surface-2)}
.agCel{min-width:88px}
.agBar{height:4px;border-radius:2px;background:var(--rule-2);overflow:hidden;margin-top:4px}
.agBar i{display:block;height:100%;background:var(--accent)}
.agBar i.cheio{background:var(--crit)} .agBar i.quase{background:var(--warn)}
.agN{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.agH.cheio{color:var(--crit);font-weight:600} .agH.quase{color:var(--warn)}
.agGrade thead th.extra{color:var(--warn)}
.agCel.cheio .agBar i{background:var(--crit)}
.agCel.quase .agBar i{background:var(--warn)}
.agH{font-variant-numeric:tabular-nums}
.agCel.cheio .agH{color:var(--crit);font-weight:600}
.agCel.quase .agH{color:var(--warn)}
.agSem{font-size:10.5px;color:var(--warn)}
.agCel.temItens{cursor:pointer}
.agCel.temItens:hover{background:var(--accent-soft)}
.agCel.temItens:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.agNav{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.agNav .btn.mini{margin-left:0}
.agNav span{font-size:12.5px;color:var(--ink-3)}

/* ── foto do item de catálogo ──────────────────────────────────────────── */
.fotoCat{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--rule);
  background:var(--surface-2);flex:0 0 auto}
.fotoVazia{width:56px;height:56px;border-radius:4px;border:1px dashed var(--rule);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:9.5px;text-align:center;line-height:1.2;flex:0 0 auto}
.bar{height:3px;background:var(--rule-2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}


/* ── S42 · RECURSOS HUMANOS ─────────────────────────────────────────────────
   Listas em LINHAS (como a conta corrente), nunca tabela larga: no celular a
   coluna de ação nasceria fora da tela (§7). */
.modal.largo{width:min(920px,calc(100% - 28px))}
.rhTela{max-width:1180px}
.rhAtalhos,.rhBarra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.rhSec{margin:14px 0}
.rhSecT{font-size:13px;font-weight:700;margin:0 0 7px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rhSecT .nota{font-weight:400;margin:0}
.rhN{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--crit);color:#fff;
  font:700 11px/18px var(--mono);text-align:center}
.rhLin{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;
  border-bottom:1px solid var(--rule-2);font-size:13px}
.rhLin:last-child{border-bottom:0}
.rhLin .t{min-width:0;overflow-wrap:anywhere;flex:1}
.rhLin .t small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.rhLin .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.rhLin .a .btn.mini{margin-left:0}
.rhLin.velha{background:var(--crit-soft)}
.rhLin.riscada .ccDesc,.rhLin.riscada > .t > b{text-decoration:line-through;color:var(--ink-3)}
.rhSt{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;
  letter-spacing:.3px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px}
.rhSt.aguardando{background:var(--warn-soft);color:var(--warn)}
.rhSt.confirmado{background:var(--ok-soft);color:var(--ok)}
.rhSt.nao_recebido,.rhSt.anulada{background:var(--crit-soft);color:var(--crit)}
.rhSt.cancelada{background:var(--surface-2);color:var(--ink-3)}
.rhSt.separado{background:var(--accent-soft);color:var(--accent-ink)}
/* S44 · R4 — a linha da devolução: o item e o destino (reuso / descarte / não devolvido) */
.rhDevL{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;
  border:1px solid var(--rule);border-radius:5px;margin:0 0 6px;background:var(--surface)}
.rhDevL .chk small{display:block;color:var(--ink-3);font-size:11.5px;margin-left:22px}
.rhDevOp{display:flex;gap:4px;flex-wrap:wrap}
.rhDevOp label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--rule);border-radius:4px;padding:4px 9px;
  font-size:12.5px;cursor:pointer;background:var(--surface-2)}
.rhDevOp label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rhDevOp label:has(input:disabled){opacity:.45;cursor:not-allowed}
.rhCa{font:600 11.5px var(--mono);color:var(--ink-2)}
.rhCa.falta{color:var(--crit)}
.rhSem{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;background:var(--ink-3);
  box-shadow:0 0 0 2px var(--surface)}
.rhSem.verde{background:var(--ok)} .rhSem.amarelo{background:#E0B20F} .rhSem.vermelho{background:var(--crit)}
.rhGradeF{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.rhCartao{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:10px 12px;
  display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;cursor:pointer;font:inherit}
.rhCartao:hover{border-color:var(--accent)}
.rhCartao b{font-size:13.5px} .rhCartao small{grid-column:2;font-size:11.5px;color:var(--ink-3)}
.rhCartao small.mot{color:var(--ink-2)}
.rhSplit{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.rhEsq{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:10px;
  max-height:calc(100vh - var(--header-h) - 150px);overflow:auto}
.rhDir{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:14px 16px;min-width:0}
.rhPes{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;
  border-radius:4px;padding:7px 8px;cursor:pointer;font:inherit;color:inherit}
.rhPes:hover{background:var(--surface-2)} .rhPes.on{background:var(--accent-soft);border-color:var(--accent)}
.rhPes.off{opacity:.6}
.rhPes .n{flex:1;min-width:0} .rhPes b{display:block;font-size:13.5px}
.rhMarco{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:9px;background:var(--warn-soft);color:var(--warn);margin-left:4px;vertical-align:1px}
.rhMarco.m7{background:var(--crit);color:#fff}
.rhPes small{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rhFichaCab{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.rhFichaCab b{font-size:17px;display:block} .rhFichaCab small{font-size:12px;color:var(--ink-3)}
.rhFichaCab .rhVolta{display:none;margin-left:0}
.rhMotivos{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:6px 9px;margin:0 0 8px}
.rhTabs{margin:6px -16px 12px;overflow-x:auto;background:none}
.rhTamGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 12px}
.rhPrev{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--rule-2)}
.rhPrev .lnk{font-size:12px;margin-left:auto}
.rhPassos{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.6}
.rhTxt{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 10px}
.rhTxt textarea{font-size:13px;line-height:1.45}

.s49St.aberto{background:var(--warn-soft);color:var(--warn)} .s49St.fechado{background:var(--ok-soft);color:var(--ok)}
.s49Tab{background:var(--surface);border:1px solid var(--rule);border-radius:5px;overflow:hidden}

.s49Ref{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin:0 0 3px}

/* S50 · item 2 — selo e caixa dos anulados nas Diárias */

.s49CL .ac{display:flex;flex-direction:column;gap:5px}

.rotulo{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin:4px 0 6px}

.rhVidG input{width:100%;min-width:0}
.rhOrig{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.rhKitG{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:18px;align-items:start}

  background:var(--surface);border:1px solid var(--rule);border-radius:5px}

/* ── catálogo ─────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
