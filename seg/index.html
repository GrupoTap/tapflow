    const st = d.status === 'cancelada' ? 'cancelada' : espAval ? 'aguardando avaliação' : d.avaliacao ? (d.avaliacao === 'aprovado' ? 'aprovado para reuso' : 'reprovado — descarte')
             : RH_DEV_ST[d.status] || d.status;
    const cls = d.status === 'cancelada' ? 'cancelada' : d.status === 'contestada' ? 'nao_recebido' : (d.status === 'aguardando' || espAval) ? 'aguardando' : 'confirmado';
    const sub = [RH_DESTINO[d.destino], 'em ' + dataBR(d.data), d.contexto === 'desligamento' ? 'desligamento' : 'avulsa',
      d.fabricacao ? 'fab. ' + rhMes(d.fabricacao) : '', d.serie_lote ? 'série ' + d.serie_lote : '',
      d.status === 'confirmada' ? 'confirmada no celular em ' + rhDT(d.confirmado_em) : '',
      d.status === 'sem_confirmacao' ? 'sem a confirmação dele — ' + (d.sem_conf_motivo || '') : '',
      d.status === 'contestada' ? 'não concordou: "' + (d.contestado_obs || '') + '"' : '',
      d.status === 'cancelada' ? 'cancelada: ' + (d.cancelado_motivo || '') : '',
      d.avaliacao ? 'avaliado por ' + (d.avaliado_por_nome || '?') + ' em ' + rhDT(d.avaliado_em) + (d.avaliacao_obs ? ' — ' + d.avaliacao_obs : '') : '',
      d.pecas_trocadas ? 'peças: ' + d.pecas_trocadas.map(x => x.nome + (x.baixou ? '' : ' (sem baixa)')).join(', ') : '',
      d.reutilizada_por ? 'entregue de novo a ' + d.reutilizada_por : ''].filter(Boolean);
    div.innerHTML = '<span class="t"><span class="rhSt ' + cls + '">' + esc(st) + '</span> <b>' + esc(d.funcionario) + '</b> — '
      + '<span class="ccDesc">' + esc(d.epi_nome) + (d.quantidade > 1 ? ' ×' + d.quantidade : '') + (d.tamanho ? ' (' + esc(d.tamanho) + ')' : '')
      + '</span><small>' + esc(sub.join(' · ')) + '</small></span><span class="a"></span>';
    const a = div.querySelector('.a');
    const bt = (rot, fn, pri) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn mini' + (pri ? ' pri' : '');
      b.textContent = rot; b.addEventListener('click', fn); a.appendChild(b); };
    if (espAval) bt('Avaliar', () => rhAvaliar(d, pintarRHSeguranca), true);
    if (d.status === 'aguardando' && d.celular){ const w = document.createElement('a'); w.className = 'btn mini'; w.target = '_blank'; w.rel = 'noopener';
      w.href = rhWhatsDev(d.celular, d.funcionario, d.epi_nome); w.textContent = 'WhatsApp'; a.appendChild(w); }
    if (d.status === 'aguardando' || d.status === 'contestada') bt('Sem a confirmação dele', () => rhDevSemConfirmacao(d.lote, pintarRHSeguranca));
    if ((d.status === 'aguardando' || d.status === 'contestada' || d.status === 'sem_confirmacao') && !d.avaliacao)
      bt('Cancelar', () => rhDevCancelar(d.lote, pintarRHSeguranca));
    el.appendChild(div);
  });
  const er = document.getElementById('rhDR');
  er.innerHTML = reap.length ? reap.map(u => '<div class="rhLin"><span class="t"><b>' + esc(u.epi_nome) + '</b>' + (u.sob_encomenda ? ' — armação graduada' : '')
      + '<small>' + esc(rhRotuloUnidade(u) + (u.limite_em ? ' · limite ' + rhMes(u.limite_em) : '')) + '</small></span></div>').join('')
    : '<p class="nota" style="padding:8px 12px">Nenhuma. Aparecem aqui depois de aprovadas na avaliação; na entrega, escolha a unidade em "Condição: reaproveitado".</p>';
}

async function rhDesligamento(uid, depois){
  let f, posse;
  try{ [f, posse] = await Promise.all([rpc('tf_rh_funcionario', { p_usuario: uid }), rpc('tf_rh_em_posse', { p_usuario: uid })]); }
  catch(e){ toast(e.message, 'err'); return; }
  const abertas = (f.entregas || []).filter(e => e.status === 'separado' || e.status === 'aguardando');
  const devP = (f.devolucoes || []).filter(d => d.status === 'aguardando' || d.status === 'contestada');
  const lotes = {}; devP.forEach(d => { (lotes[d.lote] = lotes[d.lote] || []).push(d); });
  const p1 = !abertas.length, p2 = !devP.length && !posse.length;
  const ok = '<span class="rhSt confirmado">feito</span> ', falta = '<span class="rhSt aguardando">falta</span> ';
  let h = '<p style="margin-top:0">Na ordem do documento: o que está com ' + esc(f.usuario.nome.split(' ')[0]) + ' volta (ou fica registrado que não voltou), '
    + 'ele confirma no celular com o PIN, e só então o desligamento — que desativa o PIN e apaga a receita de óculos. '
    + 'Ficha, termo, entregas e devoluções ficam guardados (guarda legal). O login do sistema não muda: desative em Configurações › Usuários, se for o caso.</p>'
    + '<div class="secTit">' + (p1 ? ok : falta) + '1 · Entregas em aberto</div>'
    + (p1 ? '<p class="nota" style="margin:0">Nenhuma entrega separada ou esperando confirmação.</p>'
          : abertas.map(e => '<div class="rhLin"><span class="t">' + esc(e.epi_nome) + '<small>' + esc(RH_STATUS[e.status]) + '</small></span>'
              + '<span class="a"><button class="btn mini" type="button" data-canc="' + esc(e.id) + '">Cancelar</button></span></div>').join('')
            + '<p class="nota">Peça a confirmação dele ou cancele — entrega aberta não deixa desligar.</p>')
    + '<div class="secTit">' + (p2 ? ok : falta) + '2 · Devolução dos EPIs</div>';
  if (devP.length){
    h += Object.keys(lotes).map(k => { const L = lotes[k], c = L[0].status === 'contestada';
      return '<div class="rhLin' + (c ? ' velha' : '') + '"><span class="t">' + esc(L.map(d => d.epi_nome + ' (' + RH_DESTINO_CURTO[d.destino] + ')').join(', '))
        + '<small>' + (c ? 'NÃO CONCORDOU: "' + esc(L[0].contestado_obs || '') + '"' : 'aguardando a confirmação dele no celular desde ' + esc(rhDT(L[0].lancado_em))) + '</small></span>'
        + '<span class="a">' + (!c && f.ficha.celular ? '<a class="btn mini" target="_blank" rel="noopener" href="' + esc(rhWhatsDev(f.ficha.celular, f.usuario.nome,
            L.map(d => d.epi_nome).join(', '))) + '">WhatsApp</a>' : '')
        + '<button class="btn mini" type="button" data-sem="' + esc(k) + '">Sem a confirmação dele</button>'
        + '<button class="btn mini" type="button" data-dcanc="' + esc(k) + '">Cancelar e refazer</button></span></div>'; }).join('');
  }
  if (posse.length) h += '<div class="rhLin"><span class="t">' + posse.length + ' item(ns) com a pessoa sem devolução registrada<small>'
      + esc(posse.map(x => x.epi_nome).join(', ')) + '</small></span><span class="a"><button class="btn mini pri" type="button" id="dsReg">Registrar a devolução…</button></span></div>';
  if (p2) h += '<p class="nota" style="margin:0">' + ((f.devolucoes || []).some(d => d.status !== 'cancelada') ? 'Devolução registrada e resolvida.' : 'Nada com a pessoa.') + '</p>';
  h += '<div class="secTit">' + ((p1 && p2) ? '' : falta) + '3 · Desligar</div>'
    + '<div class="dupla"><div class="campo"><label for="dD">Data do desligamento</label><input id="dD" type="date" value="' + isoHoje() + '"></div>'
    + '<div class="campo"><label for="dM">Motivo (opcional)</label><input id="dM" type="text" maxlength="200"></div></div>'
    + ((p1 && p2) ? '' : '<p class="nota">Libera depois dos passos 1 e 2.</p>')
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>';
  abrirModal('Desligar ' + f.usuario.nome, h,
    [ { label:'Fechar', onClick: () => { fecharModal(); depois && depois(); } },
      { label:'Desligar', pri:true, onClick: async () => {
          if (!(p1 && p2)){ document.getElementById('rhMsg').textContent = 'Faça antes os passos 1 e 2.'; return; }
          try{ const r = await rpc('tf_rh_desligar', { p_usuario: uid, p_data: document.getElementById('dD').value,
                 p_motivo: document.getElementById('dM').value });
               fecharModal(); contarRH();
               toast('Desligado.' + (r.receitas_apagadas ? ' Receita apagada.' : '') + (r.pedidos_cancelados ? ' Pedido do Field cancelado.' : ''), 'ok');
               depois && depois(); }
          catch(e){ document.getElementById('rhMsg').textContent = e.message; }
      } } ]);
  rhModalLargo();
  const m = document.getElementById('modal');
  m.querySelectorAll('[data-canc]').forEach(b => b.addEventListener('click', () => { fecharModal(); rhCancelar(b.dataset.canc, () => rhDesligamento(uid, depois)); }));
  m.querySelectorAll('[data-sem]').forEach(b => b.addEventListener('click', () => { fecharModal(); rhDevSemConfirmacao(b.dataset.sem, () => rhDesligamento(uid, depois)); }));
  m.querySelectorAll('[data-dcanc]').forEach(b => b.addEventListener('click', () => { fecharModal(); rhDevCancelar(b.dataset.dcanc, () => rhDesligamento(uid, depois)); }));
  const br = document.getElementById('dsReg');
  if (br) br.addEventListener('click', () => { fecharModal(); rhRegistrarDevolucao(uid, 'desligamento', () => rhDesligamento(uid, depois)); });
}

async function rhEstoque(corpo){
  const E = RH.estoque = await rpc('tf_rh_estoque', {});
  corpo.innerHTML = '<div class="rhBarra">'
    + '<button class="btn pri" type="button" id="esEnt">Entrada (compra)</button>'
    + '<button class="btn" type="button" id="esCont">Contagem / inventário</button>'
    + '<button class="btn" type="button" id="esSai">Reabastecer caixa / saída avulsa</button>'
    + '<button class="btn" type="button" id="esMov">Movimentos</button></div>'
    + '<p class="nota" style="margin-top:0">O saldo é a soma dos movimentos, por tamanho. A entrega dá baixa sozinha (a do '
    + 'pedido, ao separar) e <b>sem saldo não sai</b> — dê entrada ou faça a contagem antes; "não recebi" devolve. Item que nunca teve '
    + 'movimento está <b>sem controle</b> — a entrega dele segue sem baixa até a primeira contagem. O <b>reaproveitado</b> vem da devolução '
    + 'avaliada (aba Devoluções). <b>Usam</b> = quantas pessoas ativas têm o EPI previsto naquele tamanho.</p>'
    + '<div id="esL"></div>';
  document.getElementById('esEnt').addEventListener('click', () => rhEntradaEstoque(null, pintarRHSeguranca));
  document.getElementById('esCont').addEventListener('click', () => rhContagem(pintarRHSeguranca));
  document.getElementById('esSai').addEventListener('click', () => rhSaidaEstoque(pintarRHSeguranca));
  document.getElementById('esMov').addEventListener('click', () => rhMovimentos(null));
  const el = document.getElementById('esL');
  E.filter(e => e.ativo || e.controlado).forEach(e => {
    const d = document.createElement('div'); d.className = 'rhEst';
    const tipo = e.livre_acesso ? 'livre acesso' : e.componente ? 'peça de reposição' : '';
    let lin = '';
    if (!e.controlado && !(e.linhas || []).some(l => l.usam)){
      lin = '<p class="nota" style="margin:2px 0 0">sem controle de estoque — faça a contagem para começar</p>';
    } else {
      lin = '<div class="rhEstGrade">' + (e.linhas || []).map(l => {
        const tot = Number(l.novo) + Number(l.reaproveitado);
        const baixo = l.minimo != null && tot < l.minimo;
        const falta = l.usam > tot;
        const cls = tot < 0 ? 'neg' : baixo || falta ? 'baixo' : '';
        return '<div class="rhEstC ' + cls + '" title="' + esc(l.quem ? 'Usam: ' + l.quem : '') + '"><b>' + esc(l.tamanho || 'un.') + '</b>'
          + '<span class="q">' + l.novo + '</span>' + (Number(l.reaproveitado) ? '<small>+' + l.reaproveitado + ' reapr.</small>' : '')
          + (l.minimo != null ? '<small>mín ' + l.minimo + '</small>' : '')
          + (l.usam ? '<small class="' + (falta ? 'falta' : '') + '">usam ' + l.usam + '</small>' : '') + '</div>';
      }).join('') + '</div>';
      const sug = (e.linhas || []).filter(l => l.usam > Number(l.novo) + Number(l.reaproveitado));
      if (!e.controlado) lin += '<p class="nota" style="margin:2px 0 0">ainda sem contagem — o 0 é "nada lançado", não "caixa vazia"; a entrega segue sem baixa até a primeira contagem</p>';
      if (sug.length) lin += '<p class="nota rhSug">Sugestão de compra: ' + sug.map(l => l.usam + ' pessoa(s) usam '
        + (e.tem_tamanho ? e.nome.split(' ')[0].toLowerCase() + ' ' + l.tamanho : e.nome.toLowerCase()) + ' e há '
        + (Number(l.novo) + Number(l.reaproveitado))).map(esc).join(' · ') + '</p>';
    }
    d.innerHTML = '<div class="rhEstCab"><b>' + esc(e.nome) + '</b> <span class="rhCa">' + esc(e.ca ? 'CA ' + e.ca : tipo) + '</span>'
      + (tipo && e.ca ? ' <span class="nota" style="margin:0">' + esc(tipo) + '</span>' : '')
      + '<span class="a"><button class="btn mini" type="button" data-e="ent">Entrada</button>'
      + '<button class="btn mini" type="button" data-e="min">Mínimo</button>'
      + '<button class="btn mini" type="button" data-e="mov">Movimentos</button></span></div>' + lin;
    d.querySelector('[data-e=ent]').addEventListener('click', () => rhEntradaEstoque(e.epi_id, pintarRHSeguranca));
    d.querySelector('[data-e=min]').addEventListener('click', () => rhMinimo(e, pintarRHSeguranca));
    d.querySelector('[data-e=mov]').addEventListener('click', () => rhMovimentos(e.epi_id));
    el.appendChild(d);
  });
}

async function rhEpisCat(){ if (!RH.epis){ const r = await rpc('tf_rh_epis', {}); RH.epis = r.epis; RH.trein = r.treinamentos; } return RH.epis; }

async function rhEntradaEstoque(epiId, depois){
  let epis; try{ epis = (await rhEpisCat()).filter(e => e.ativo); }catch(e){ toast(e.message, 'err'); return; }
  abrirModal('Entrada de estoque (compra)',
    '<div class="campo"><label for="enE">Item</label><select id="enE"><option value="">— escolha —</option>'

    + '<div class="campo"><label for="enCA">CA da compra</label><input id="enCA" type="text" inputmode="numeric" maxlength="9"></div></div>'

    + '<div class="campo"><label for="enO">Observação (opcional)</label><input id="enO" type="text" maxlength="200"></div>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Gravar entrada', pri:true, onClick: async () => {
          const g = id => document.getElementById(id); const msg = g('rhMsg'); msg.textContent = '';
          const e = epis.find(x => x.id === g('enE').value);
          if (!e){ msg.textContent = 'Escolha o item.'; return; }
          const itens = [...document.querySelectorAll('#enQ input[data-t]')].map(i => ({ tamanho: i.dataset.t, quantidade: i.value }))
                          .filter(i => Number(i.quantidade) > 0);
          if (!itens.length){ msg.textContent = 'Informe a quantidade.'; return; }
          try{
            const nf = await rhArqDoInput(g('enNF'), false);
            const r = await rpc('tf_rh_estoque_entrada', { p_dados: { epi_id: e.id, data: g('enD').value, ca: g('enCA').value,
              fornecedor: g('enF').value, valor_unitario: g('enV').value, observacao: g('enO').value, itens,
              confirmar_ca_vencido: !!(g('enCaOk') && g('enCaOk').checked) }, p_nf: nf });
            fecharModal(); toast('Entrada gravada: ' + r.unidades + ' un.' + (r.ca_vencido ? ' (CA vencido na compra, registrado)' : ''), 'ok');
            depois && depois();
          }catch(er){ msg.textContent = er.message; }
      } } ]);
  rhModalLargo();
  const sel = document.getElementById('enE');
  const acerta = () => {
    const e = epis.find(x => x.id === sel.value);

    q.innerHTML = e.tem_tamanho
      ? '<label class="rotulo">Quantidade por tamanho</label><div class="rhTamGrade">' + (e.tamanhos || []).map(t =>
          '<div class="campo"><label for="enT_' + esc(t) + '">' + esc(t) + '</label><input id="enT_' + esc(t) + '" data-t="' + esc(t)
          + '" type="number" min="0" max="9999" inputmode="numeric" placeholder="0"></div>').join('') + '</div>'
      : '<div class="campo"><label for="enT_">Quantidade</label><input id="enT_" data-t="" type="number" min="0" max="9999" inputmode="numeric" value="1"></div>';
    document.getElementById('enCA').value = e.ca || '';
    caAv();
  };
  const caAv = () => {
    const e = epis.find(x => x.id === sel.value), av = document.getElementById('enCaAv');
    const ca = document.getElementById('enCA').value.replace(/\D/g, ''), dt = document.getElementById('enD').value;
    if (e && !e.componente && !e.livre_acesso && ca && ca === e.ca && e.ca_validade && dt && e.ca_validade < dt){
      av.innerHTML = '<div class="aviso" style="background:var(--crit-soft);color:var(--crit);border-color:var(--crit)">'
        + '<b>CA ' + esc(ca) + ' venceu em ' + esc(dataBR(e.ca_validade)) + ', antes da data da compra.</b> O que vale é o CA válido '
        + 'na data da compra — confira a nota e a embalagem.<label class="chk" style="margin:8px 0 0"><input type="checkbox" id="enCaOk"> '
        + 'Confirmo: gravar mesmo assim (fica marcado "CA vencido")</label></div>';
    } else av.innerHTML = e && !e.ca && !e.componente && !e.livre_acesso
      ? '<p class="nota">Este EPI está sem CA no catálogo. Digite o CA da embalagem; para entregar, o catálogo precisa do CA.</p>' : '';
  };
  sel.addEventListener('change', acerta);
  document.getElementById('enD').addEventListener('change', caAv);
  document.getElementById('enCA').addEventListener('input', caAv);
  if (epiId){ sel.value = epiId; acerta(); }
}

      + '<div class="rhTamGrade">' + (e.tem_tamanho ? (e.tamanhos || []) : ['']).map(t =>
        '<div class="campo"><label for="ct_' + esc(e.epi_id) + '_' + esc(t) + '">' + esc(t || 'Quantidade')
        + ' <span class="nota" style="margin:0">sistema: ' + saldo(e, t, 'novo') + '</span></label><input id="ct_' + esc(e.epi_id) + '_' + esc(t)
        + '" data-epi="' + esc(e.epi_id) + '" data-t="' + esc(t) + '" data-c="novo" type="number" min="0" max="9999" inputmode="numeric"></div>'
        + (saldo(e, t, 'reaproveitado') ? '<div class="campo"><label>' + esc(t) + ' reaproveitado <span class="nota" style="margin:0">sistema: '

            + '" data-c="reaproveitado" type="number" min="0" inputmode="numeric" aria-label="' + esc(e.nome + ' ' + t) + ' reaproveitado"></div>' : '')).join('')
      + '</div></div>').join('')
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Gravar contagem', pri:true, onClick: async () => {
          const linhas = [...document.querySelectorAll('#mBody input[data-epi]')].filter(i => i.value !== '')
            .map(i => ({ epi_id: i.dataset.epi, tamanho: i.dataset.t, condicao: i.dataset.c, contado: Number(i.value) }));
          if (!linhas.length){ document.getElementById('rhMsg').textContent = 'Nada contado.'; return; }
          try{ const r = await rpc('tf_rh_estoque_contagem', { p_data: document.getElementById('ctD').value, p_linhas: linhas,
                   p_motivo: document.getElementById('ctM').value || null });
               fecharModal(); toast('Contagem gravada: ' + r.linhas + ' linha(s) · ' + r.inventario + ' de inventário · ' + r.ajustes + ' ajuste(s).', 'ok');
               contarRH(); depois && depois(); }
          catch(e){ document.getElementById('rhMsg').textContent = e.message; }
      } } ]);
  rhModalLargo();
}

async function rhAbrirSessao(id){
  let s, lista;
  try{ [s, lista] = await Promise.all([rpc('tf_rh_sessao', { p_sessao: id }), RH.lista ? Promise.resolve(RH.lista) : rpc('tf_rh_funcionarios', {})]); }
  catch(e){ toast(e.message, 'err'); return; }

  const part = s.participantes || [];
  const algumConf = part.some(p => p.status === 'confirmado');
  abrirModal(s.tema,
    '<p style="margin-top:0">' + esc(dataBR(s.data)) + (s.horario ? ' · ' + esc(s.horario) : '') + (s.carga_horaria_h ? ' · ' + esc(String(s.carga_horaria_h).replace('.', ',')) + 'h' : '')
    + ' · instrutor: ' + esc(s.instrutor_nome || '—') + (s.cancelada_em ? '<br><b style="color:var(--crit)">Cancelada em ' + esc(rhDT(s.cancelada_em)) + ': ' + esc(s.cancelada_motivo || '') + '</b>' : '') + '</p>'
    + '<div class="ccLista">' + part.map(p => '<div class="rhLin' + (p.status === 'retirado' ? ' riscada' : '') + '"><span class="t"><span class="rhSt '
      + (p.status === 'confirmado' ? 'confirmado' : p.status === 'retirado' ? 'cancelada' : 'aguardando') + '">'
      + esc(p.status === 'confirmado' ? 'confirmou' : p.status === 'retirado' ? 'tirado da lista' : 'aguardando') + '</span> <b>' + esc(p.nome) + '</b>'
      + '<small>' + esc([p.funcao, p.confirmado_em ? 'confirmado no celular em ' + rhDT(p.confirmado_em) : '',
        s.tem_videos && p.status === 'confirmado' ? 'vídeos ' + (p.videos_vistos || 0) + '/' + (p.videos_total || 0) : ''].filter(Boolean).join(' · '))
      + '</small></span><span class="a">' + (p.status === 'aguardando' && !s.cancelada_em
        ? (cel[p.usuario_id] ? '<a class="btn mini" target="_blank" rel="noopener" href="' + esc(rhWhatsLista(cel[p.usuario_id], p.nome, s)) + '">WhatsApp</a>' : '')
          + '<button class="btn mini" type="button" data-tirar="' + esc(p.usuario_id) + '">Tirar</button>' : '') + '</span></div>').join('') + '</div>'
    + (s.cancelada_em ? '' : '<div class="rhBarra" style="margin-top:10px"><select id="asInc" class="mini" style="max-width:240px"><option value="">+ incluir participante…</option>'
      + (lista || []).filter(f => f.tem_ficha && f.situacao === 'ativo' && !part.some(p => p.usuario_id === f.usuario_id && p.status !== 'retirado'))
          .map(f => '<option value="' + esc(f.usuario_id) + '">' + esc(f.nome) + '</option>').join('') + '</select></div>')
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Fechar', onClick: () => { fecharModal(); if (visao === 'rhs') pintarRHSeguranca(); } },
      ...(!s.cancelada_em && !algumConf ? [{ label:'Cancelar a lista', onClick: async () => {
          const m = prompt('Por que cancelar a lista? (fica registrado)'); if (m == null) return;
          try{ await rpc('tf_rh_cancelar_sessao', { p_sessao: s.id, p_motivo: m }); fecharModal(); toast('Lista cancelada.', 'ok'); if (visao === 'rhs') pintarRHSeguranca(); }
          catch(e){ document.getElementById('rhMsg').textContent = e.message; } } }] : []),
      { label:'Lista em PDF', pri:true, onClick: () => rhBaixarLista(s.id, null) } ]);
  rhModalLargo();
  document.querySelectorAll('#mBody [data-tirar]').forEach(b => b.addEventListener('click', async () => {
    try{ await rpc('tf_rh_sessao_participantes', { p_sessao: s.id, p_incluir: null, p_tirar: [b.dataset.tirar] }); rhAbrirSessao(s.id); }
    catch(e){ document.getElementById('rhMsg').textContent = e.message; }
  }));
  const inc = document.getElementById('asInc');
  if (inc) inc.addEventListener('change', async () => {
    if (!inc.value) return;
    try{ await rpc('tf_rh_sessao_participantes', { p_sessao: s.id, p_incluir: [inc.value], p_tirar: null }); rhAbrirSessao(s.id); }
    catch(e){ document.getElementById('rhMsg').textContent = e.message; }
  });
}

async function rhListaDoc(jsPDF, sessaoId, soUsuarios, soConfirmados){
  const s = await rpc('tf_rh_sessao', { p_sessao: sessaoId });
  let part = (s.participantes || []).filter(p => p.status !== 'retirado');
  if (soUsuarios) part = part.filter(p => soUsuarios.includes(p.usuario_id));
  if (soConfirmados) part = part.filter(p => p.status === 'confirmado');
  const ids = part.map(p => p.usuario_id).concat(s.instrutor_usuario_id ? [s.instrutor_usuario_id] : []);
  const ass = ids.length ? await rpc('tf_rh_assinaturas', { p_usuarios: ids }) : {};
  const dims = {}; for (const k of Object.keys(ass || {})) dims[k] = await rhDimImg(ass[k]);
  let rodapeTxt = '';
  try{ rodapeTxt = ((RH.textos || await rpc('tf_rh_textos', {})).rodape_ficha || {}).texto || ''; }catch(e){}
  const doc = new jsPDF({ unit:'mm', format:'a4' }); doc._sessao = s;
  const M = 12, W = 210 - 2 * M; let y = 10, pag = 1;
  const img = (uid, x, yy, w, h) => { const u = ass && ass[uid], d = dims[uid]; if (!u || !d) return false;
    const e = Math.min(w / d.w, h / d.h); try{ doc.addImage(u, 'PNG', x + (w - d.w * e) / 2, yy + (h - d.h * e) / 2, d.w * e, d.h * e); return true; }catch(er){ return false; } };
  const rod = () => { doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(90);
    doc.text('Lista gerada em ' + rhDT(new Date().toISOString()).replace(' ', ' às ') + ' pelo TapFlow, com as presenças confirmadas no celular de cada participante.', M, 285);
    if (rodapeTxt) doc.text(doc.splitTextToSize(rodapeTxt, W - 16), M, 289);
    doc.text('pág. ' + pag, 210 - M, 289, { align:'right' }); doc.setTextColor(0); };
  try{ doc.addImage(LOGO_ENGETAP, 'JPEG', M, y, 44, 10.7); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.text('LISTA DE PRESENÇA EM TREINAMENTO', 210 - M, y + 5, { align:'right' });
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text('Registro eletrônico — TapFlow', 210 - M, y + 9.5, { align:'right' });
  y += 15; doc.setDrawColor(170); doc.line(M, y, 210 - M, y); y += 5;
  const campo = (k, v, x, yy, w) => { doc.setFont('helvetica','bold'); doc.setFontSize(8.3); doc.text(k, x, yy);
    const kw = doc.getTextWidth(k) + 1.5; doc.setFont('helvetica','normal');
    const t = doc.splitTextToSize(String(v || '—'), w - kw); doc.text(t, x + kw, yy); return t.length; };
  campo('Local:', s.local || 'Engetap Inspeções em Caldeiras e Vasos de Pressão Ltda', M, y, W); y += 5;
  campo('Setor:', s.setor || 'Produção / Administrativo', M, y, 90); campo('Data:', dataBR(s.data), 110, y, 40);
  campo('Horário:', s.horario || '—', 150, y, 48); y += 5;
  campo('Carga horária:', s.carga_horaria_h ? String(s.carga_horaria_h).replace('.', ',') + ' h' : '—', M, y, 90); y += 5;
  const nt = campo('Tema do curso/treinamento:', s.tema, M, y, W); y += 5 * nt + 1;
  if (s.declaracao){ doc.setFont('helvetica','bold'); doc.setFontSize(8.3); doc.text('Declaração do participante:', M, y); y += 4;
    doc.setFont('helvetica','italic'); doc.setFontSize(8); const t = doc.splitTextToSize('"' + s.declaracao + '"', W); doc.text(t, M, y); y += t.length * 3.5 + 2; }
  if (s.conteudo){ doc.setFont('helvetica','bold'); doc.setFontSize(8.3); doc.text('Conteúdo programático:', M, y); y += 4;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.8);
    String(s.conteudo).split('\n').forEach(l => { const t = doc.splitTextToSize(l, W - 4); doc.text(t, M + 2, y); y += t.length * 3.4; }); y += 2; }
  const col = [ { t:'Nome', w:58 }, { t:'Função', w:36 }, { t:'Data', w:20 }, { t:'Assinatura', w:W - 114 } ];
  const cab = () => { doc.setFillColor(227, 238, 247); doc.rect(M, y, W, 6.5, 'F'); doc.setFont('helvetica','bold'); doc.setFontSize(7.8);
    let x = M; col.forEach(c => { doc.text(c.t, x + 1.2, y + 4.3); x += c.w; }); y += 6.5; };
  cab();
  if (!part.length){ doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Nenhum participante confirmado.', M + 2, y + 6); y += 10; }
  part.forEach(p => {
    const H = 16;
    if (y + H > 250){ rod(); doc.addPage(); pag++; y = 14; cab(); }
    doc.setDrawColor(215); doc.rect(M, y, W, H);
    let x = M; col.reduce((acc, c) => { if (acc > M) doc.line(acc, y, acc, y + H); return acc + c.w; }, M);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text(doc.splitTextToSize(p.nome, col[0].w - 2.4).slice(0, 2), x + 1.2, y + 4.5);
    if (s.tem_videos && p.status === 'confirmado'){
      doc.setFont('helvetica','normal'); doc.setFontSize(6.4);
      doc.text(doc.splitTextToSize('Módulos em vídeo assistidos' + (p.videos_em ? ' em ' + dataBR(p.videos_em) : '') + ' ('
        + (p.videos_vistos || 0) + '/' + (p.videos_total || 0) + ')', col[0].w - 2.4), x + 1.2, y + 11);
    }
    x += col[0].w; doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
    doc.text(doc.splitTextToSize(p.funcao || '—', col[1].w - 2.4).slice(0, 3), x + 1.2, y + 4.5); x += col[1].w;
    doc.text(dataBR(s.data), x + 1.2, y + 4.5); x += col[2].w;
    if (p.status === 'confirmado'){
      img(p.usuario_id, x + 1, y + 0.8, col[3].w - 2, 8.4);
      doc.setFontSize(5.8);
      doc.text(doc.splitTextToSize('Confirmado no celular do funcionário em ' + rhDT(p.confirmado_em) + (p.confirmado_metodo === 'pin' ? ' (PIN)' : ''),
        col[3].w - 2), x + 1, y + 12);
    } else { doc.setFontSize(7.4); doc.setTextColor(140); doc.text('aguardando a confirmação no celular', x + 1.5, y + 8); doc.setTextColor(0); }
    y += H;
  });
  // o instrutor, com a qualificação COMPLETA (regra do Bruno)
  const q = doc.splitTextToSize(s.instrutor_qualificacao || '', W - 62);
  const hI = Math.max(22, q.length * 3.2 + 12);
  if (y + hI + 6 > 280){ rod(); doc.addPage(); pag++; y = 14; }
  y += 5; doc.setFont('helvetica','bold'); doc.setFontSize(8.3); doc.text('Instrutor:', M, y);
  doc.setFont('helvetica','normal'); doc.text(s.instrutor_nome || '—', M + 15, y);
  if (s.instrutor_usuario_id && img(s.instrutor_usuario_id, 210 - M - 55, y - 3, 55, 12)){
    doc.setFontSize(6); doc.text('Rubrica do instrutor', 210 - M - 27.5, y + 11, { align:'center' });
  }
  y += 4; doc.setFontSize(7.2); doc.text(q, M, y);
  rod();
  return doc;
}

function rhNovoDocEmpresa(depois){
  const tipos = [...new Set(RH_DOCS_SUGERIDOS.concat((RH.docs || []).map(d => d.tipo)))];
  abrirModal('Novo documento da empresa',
    '<div class="dupla"><div class="campo"><label for="dcT">Documento</label><input id="dcT" type="text" maxlength="40" list="dcTL" placeholder="PGR, PCMSO…">'
    + '<datalist id="dcTL">' + tipos.map(t => '<option value="' + esc(t) + '">').join('') + '</datalist></div>'
    + '<div class="campo"><label for="dcD">Descrição (opcional)</label><input id="dcD" type="text" maxlength="160" placeholder="ex.: revisão 2026, elaborado por…"></div></div>'
    + '<div class="dupla"><div class="campo"><label for="dcI">Início da vigência (opcional)</label><input id="dcI" type="date"></div>'
    + '<div class="campo"><label for="dcV">Válido até</label><input id="dcV" type="date"></div></div>'
    // S45 · item 6: o prazo de aviso DESTE documento — número livre; sem ele
    // digitado, a tela sugere pelo ciclo (início → validade) e o banco usa a
    // mesma conta
    + '<div class="campo"><label for="dcAv">Avisar com quantos dias de antecedência</label>'
    + '<input id="dcAv" type="number" min="0" max="730" step="1" inputmode="numeric" placeholder="preencha as datas — o TapFlow sugere">'
    + '<small class="nota" id="dcAvN" style="display:block;margin-top:3px"></small></div>'
    + '<div class="campo"><label for="dcA">Arquivo (PDF de preferência; até 15 MB)</label><input id="dcA" type="file" accept="application/pdf,image/*"></div>'
    + '<div id="dcEsc"></div><p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Gravar', pri:true, onClick: async () => {
          const g = id => document.getElementById(id);
          try{
            const f = g('dcA').files && g('dcA').files[0];
            if (!f) throw new Error('Escolha o arquivo.');
            const esc_ = await rhPdfEscaneado(f);
            const arq = await rhArqDoInput(g('dcA'), true);
            const av = g('dcAv').value.trim();
            if (av !== '' && (!/^\d+$/.test(av) || Number(av) > 730)) throw new Error('O aviso vai de 0 a 730 dias.');
            await rpc('tf_rh_lancar_doc_empresa', { p_dados: { tipo: g('dcT').value, descricao: g('dcD').value,
              vigencia_inicio: g('dcI').value, validade: g('dcV').value, escaneado: esc_,
              aviso_dias: av === '' ? null : Number(av) }, p_arquivo: arq });
            fecharModal(); toast('Documento gravado.', 'ok'); contarRH(); depois && depois();
          }catch(e){ g('rhMsg').textContent = e.message; }
      } } ]);
  // S45 · item 6: a sugestão preenche enquanto a pessoa não digitou o dela
  let avTocado = false;
  const sugerir = () => {
    const n = document.getElementById('dcAvN'), i = document.getElementById('dcAv');
    const sg = rhAvisoSugerido(document.getElementById('dcI').value, document.getElementById('dcV').value);
    if (sg == null){ n.textContent = ''; return; }
    if (!avTocado) i.value = sg;
    n.textContent = 'Sugestão pelo ciclo do documento: ' + sg + ' dias (mensal 5 · anual 15 · bienal 30). Pode digitar outro número.';
  };
  document.getElementById('dcI').addEventListener('change', sugerir);
  document.getElementById('dcV').addEventListener('change', sugerir);
  document.getElementById('dcAv').addEventListener('input', () => { avTocado = document.getElementById('dcAv').value !== ''; });

async function rhArqParaPdf(jsPDF, arquivoId){
  const a = await rpc('tf_rh_arquivo', { p_id: arquivoId });
  if (a.mime === 'application/pdf') return new Uint8Array(await (await fetch(a.conteudo)).arrayBuffer());
  return rhImgParaPdf(jsPDF, a.conteudo, a.mime);
}

async function rhImgParaPdf(jsPDF, dataUrl, mime){
  const d = await rhDimImg(dataUrl);
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const e = Math.min(190 / d.w, 277 / d.h);
  doc.addImage(dataUrl, mime === 'image/png' ? 'PNG' : 'JPEG', (210 - d.w * e) / 2, 10, d.w * e, d.h * e);
  return new Uint8Array(doc.output('arraybuffer'));
}

async function rhKitBytes(jsPDF, i){
  if (!i.storage_path) return rhArqParaPdf(jsPDF, i.arquivo_id);
  const r = await rhfdFetch(rhfdUrl(i.storage_path), {});
  if (!r.ok) throw new Error('Não consegui baixar o RG/CNH do armazenamento (HTTP ' + r.status + ').');
  const blob = await r.blob();
  if (i.mime === 'application/pdf') return new Uint8Array(await blob.arrayBuffer());
  const url = await new Promise((ok, er) => { const fr = new FileReader(); fr.onload = () => ok(fr.result);
    fr.onerror = () => er(new Error('Não deu para ler o RG/CNH.')); fr.readAsDataURL(blob); });
  return rhImgParaPdf(jsPDF, url, i.mime);
}

async function rhKitArquivos(jsPDF, k){
  const out = [];
  const nomeTreino = t => String(t).replace(/\s+—.*$/, '');
  for (const p of (k.pessoas || [])){
    const pasta = rhNomeArq(p.nome);
    for (const i of p.itens){
      if (i.doc === 'alerta') continue;
      if (i.doc === 'ficha_epi'){
        const ficha = await rpc('tf_rh_ficha', { p_usuario: p.usuario_id, p_completa: false });
        const ids = [p.usuario_id].concat((ficha.linhas || []).map(l => l.lancado_por)).filter((v, n, a) => v && a.indexOf(v) === n);
        const ass = await rpc('tf_rh_assinaturas', { p_usuarios: ids });
        const doc = await rhFichaPDF(jsPDF, ficha, ass);
        out.push({ pasta, nome: rhNomeArq('Ficha de EPI - ' + p.nome + ' - ' + rhDataArq(isoHoje())) + '.pdf',
                   bytes: new Uint8Array(doc.output('arraybuffer')), copia: { usuario_id: p.usuario_id }, cor: i.cor });
      } else if (i.doc === 'treinamento' && i.sessao_id){
        const doc = await rhListaDoc(jsPDF, i.sessao_id, [p.usuario_id], true);
        out.push({ pasta, nome: rhNomeArq('Lista de Treinamento - ' + nomeTreino(i.rotulo) + ' - ' + p.nome + ' - ' + rhDataArq(i.data)) + '.pdf',
                   bytes: new Uint8Array(doc.output('arraybuffer')), copia: { usuario_id: p.usuario_id }, cor: i.cor });
      } else if (i.arquivo_id || i.storage_path){
        const rot = i.doc === 'aso' ? 'ASO' : i.doc === 'doc_pessoal' ? 'Documento pessoal' : 'Certificado ' + nomeTreino(i.rotulo);
        out.push({ pasta, nome: rhNomeArq(rot + ' - ' + p.nome + (i.validade ? ' - val ' + rhDataArq(i.validade) : '')) + '.pdf',
                   bytes: await rhKitBytes(jsPDF, i), validade: i.validade || null, cor: i.cor });
      }
    }
  }
  for (const e of (k.empresa || [])){
    if (!e.arquivo_id) continue;
    out.push({ pasta: 'Empresa', nome: rhNomeArq(e.tipo + ' - Engetap' + (e.validade ? ' - val ' + rhDataArq(e.validade) : '')) + '.pdf',
               bytes: await rhArqParaPdf(jsPDF, e.arquivo_id), validade: e.validade || null, cor: e.cor });
  }
  return out;
}

async function rhKitEmpacotar(jsPDF, arquivos, formato, titulo){
  if (formato === 'pdf'){
    const PDFLib = await carregarPdfLib();
    const partes = [];
    for (const a of arquivos){ const d = await PDFLib.PDFDocument.load(a.bytes, { ignoreEncryption: true }); partes.push({ a, d, n: d.getPageCount() }); }
    // o índice primeiro, com a página de início de cada documento. Monta uma
    // vez para saber quantas páginas o PRÓPRIO índice ocupa, e numera de novo
    // se passou de uma (senão todo "pág." sairia deslocado).
    const montaIdx = inicio => {
      const idx = new jsPDF({ unit:'mm', format:'a4' });
      try{ idx.addImage(LOGO_ENGETAP, 'JPEG', 12, 10, 44, 10.7); }catch(e){}
      idx.setFont('helvetica','bold'); idx.setFontSize(12.5); idx.text('ÍNDICE', 198, 15, { align:'right' });
      idx.setFontSize(10); idx.text(idx.splitTextToSize(titulo, 186), 12, 30);
      let pg = inicio, y = 42; idx.setFont('helvetica','normal'); idx.setFontSize(9);
      // o nome inteiro, quebrando em linhas (cortar tirava justamente a data)
      partes.forEach(p => { const L = idx.splitTextToSize(p.a.pasta + ' › ' + p.a.nome.replace(/\.pdf$/i, ''), 165);
        if (y + (L.length - 1) * 4.2 > 282){ idx.addPage(); y = 15; }
        idx.text(L, 12, y); idx.text('pág. ' + pg, 198, y, { align:'right' }); pg += p.n; y += 6 + (L.length - 1) * 4.2; });
      return idx;
    };
    let idx = montaIdx(2);
    if (idx.getNumberOfPages() > 1) idx = montaIdx(idx.getNumberOfPages() + 1);
    const tot = await PDFLib.PDFDocument.create();
    const di = await PDFLib.PDFDocument.load(new Uint8Array(idx.output('arraybuffer')));
    (await tot.copyPages(di, di.getPageIndices())).forEach(pp => tot.addPage(pp));
    for (const p of partes) (await tot.copyPages(p.d, p.d.getPageIndices())).forEach(pp => tot.addPage(pp));
    return new Blob([await tot.save()], { type: 'application/pdf' });
  }
  const JSZipLib = await carregarJSZip();
  const zip = new JSZipLib();
  const usados = new Set();
  arquivos.forEach(a => {
    let caminho = a.pasta + '/' + a.nome, n = 2;
    while (usados.has(caminho)){ caminho = a.pasta + '/' + a.nome.replace(/\.pdf$/, '') + ' (' + n++ + ').pdf'; }
    usados.add(caminho); zip.file(caminho, a.bytes);
  });
  return zip.generateAsync({ type: 'blob' });
}

async function rhKitGerar(k, destinatario, obs){
  try{
    const jsPDF = await carregarJsPDF();          // ANTES de registrar (§7)
    if (RH.kit.formato === 'pdf') await carregarPdfLib(); else await carregarJSZip();
    toast('Montando o kit…', 'ok');
    const arqs = await rhKitArquivos(jsPDF, k);
    if (!arqs.length){ toast('Nenhum documento com arquivo para montar o kit.', 'err'); return; }
    const titulo = 'Documentos para ' + k.cliente + ' — visita de ' + dataBR(k.data_visita);
    const blob = await rhKitEmpacotar(jsPDF, arqs, RH.kit.formato, titulo);
    // registra ANTES de entregar o arquivo: kit sem registro não existe.
    // S59: registro leve — só o nome, a pasta, a cor e a validade de cada
    // documento. Nenhuma cópia é guardada (o kit é sempre montado de novo).
    const lista = arqs.map(a => ({ pasta: a.pasta, nome: a.nome, cor: a.cor, validade: a.validade || null,
                                   origem: a.copia ? 'gerado' : 'guardado' }));
    await rpc('tf_rh_registrar_envio', { p_dados: { cliente_id: k.cliente_id, data_visita: k.data_visita,
      funcionarios: (k.pessoas || []).map(p => p.usuario_id), formato: RH.kit.formato, destinatario, observacao: obs,
      conferencia: { cor: k.cor, pessoas: (k.pessoas || []).map(p => ({ nome: p.nome, cor: p.cor })), empresa: (k.empresa || []).map(e => ({ tipo: e.tipo, cor: e.cor })) },
      arquivos: lista }, p_copias: [] });
    rhBaixarBlob(blob, rhNomeArq('Kit ' + k.cliente + ' - ' + rhDataArq(k.data_visita)) + (RH.kit.formato === 'pdf' ? '.pdf' : '.zip'));

    + '<span class="nota" style="margin:0">Periodicidade do PCMSO para esta pessoa: <b>' + esc(f.ficha.aso_periodicidade_meses) + ' meses</b> (mude na ficha do RH, em Dados).</span></div>'
    + (v ? '<div class="aviso' + (v.valido && rhDiasAte(v.validade) > 30 ? ' ok' : '') + '" style="margin:0 0 10px">ASO vigente: <b>' + esc(RH_TIPO_ASO[v.tipo] || v.tipo)
      + '</b> de ' + esc(dataBR(v.data_exame)) + ' — ' + (v.resultado === 'inapto' ? '<b>INAPTO</b>' : 'apto')
      + (v.validade ? ' · ' + esc(rhDiasTxt(rhDiasAte(v.validade))) + ' (' + esc(dataBR(v.validade)) + ')' : '')
      + ' · altura: ' + (v.apto_altura ? 'apto' : 'não') + ' · espaço confinado: ' + (v.apto_confinado ? 'apto' : 'não')

    + '<div class="ccLista" id="asL"></div>'

      + (a.resultado === 'inapto' ? '<b style="color:var(--crit)">INAPTO</b>' : 'apto')
      + '<small>' + esc([a.validade ? 'validade ' + dataBR(a.validade) + ' (' + a.periodicidade_meses + ' meses)' : 'sem validade',
        a.apto_altura ? 'apto para altura' : '', a.apto_confinado ? 'apto para espaço confinado' : '', a.medico, a.observacao,
        a.arquivo_id ? '' : 'SEM PDF', 'lançado por ' + (a.lancado_por_nome || '?') + ' em ' + rhDT(a.lancado_em),
        a.anulado_em ? 'ANULADO em ' + rhDT(a.anulado_em) + ' por ' + (a.anulado_por_nome || '?') + ': ' + a.anulado_motivo : ''].filter(Boolean).join(' · '))

function rhBotaoAnexar(registro, id){
  const l = document.createElement('label'); l.className = 'btn mini'; l.style.cursor = 'pointer'; l.textContent = 'Anexar PDF';
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/pdf,image/*'; i.hidden = true; l.appendChild(i);
  i.addEventListener('change', async () => {
    try{ const a = await rhArqDoInput(i, false); await rpc('tf_rh_anexar_pdf', { p_registro: registro, p_id: id, p_arquivo: a });
         toast('PDF anexado.', 'ok'); rhRecarregar(); }
    catch(e){ toast(e.message, 'err'); }
  });
  return l;
}

function rhNovoAso(f){
  abrirModal('Novo ASO — ' + f.usuario.nome,
    '<div class="dupla"><div class="campo"><label for="aT">Tipo</label><select id="aT">' + Object.keys(RH_TIPO_ASO).map(k => '<option value="' + k + '">'
      + esc(RH_TIPO_ASO[k]) + '</option>').join('') + '</select></div>'
    + '<div class="campo"><label for="aD">Data do exame</label><input id="aD" type="date" max="' + isoHoje() + '"></div></div>'
    + '<div class="dupla"><div class="campo"><label for="aR">Resultado</label><select id="aR"><option value="apto">Apto</option><option value="inapto">Inapto</option></select></div>'
    + '<div class="campo"><label for="aM">Médico (opcional)</label><input id="aM" type="text" maxlength="120"></div></div>'
    + '<label class="chk"><input type="checkbox" id="aAl"> Apto para trabalho em altura (NR-35)</label>'
    + '<label class="chk"><input type="checkbox" id="aCo"> Apto para espaço confinado (NR-33)</label>'
    + '<div class="campo"><label for="aO">Observação (opcional)</label><input id="aO" type="text" maxlength="200"></div>'
    + '<div class="campo"><label for="aF">PDF do ASO</label><input id="aF" type="file" accept="application/pdf,image/*"></div>'
    + '<p class="nota" id="aVal">A validade é calculada: data do exame + ' + esc(f.ficha.aso_periodicidade_meses) + ' meses (a periodicidade do PCMSO para esta pessoa). Demissional não tem validade.</p>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Gravar ASO', pri:true, onClick: async () => {
          const g = id => document.getElementById(id);
          try{
            const arq = await rhArqDoInput(g('aF'), false);
            if (!arq && !(await confirmar('ASO sem PDF', '<p>Gravar sem o PDF? O kit do cliente vai mostrar este ASO em vermelho até alguém anexar.</p>', 'Gravar sem PDF'))) return;
            const r = await rpc('tf_rh_lancar_aso', { p_usuario: f.usuario.id, p_dados: { tipo: g('aT').value, data_exame: g('aD').value,
              resultado: g('aR').value, apto_altura: g('aAl').checked, apto_confinado: g('aCo').checked, medico: g('aM').value, observacao: g('aO').value },
              p_arquivo: arq });
            fecharModal(); toast('ASO gravado' + (r.validade ? ' — validade ' + dataBR(r.validade) : '') + '.', 'ok'); contarRH(); rhRecarregar();
          }catch(e){ g('rhMsg').textContent = e.message; }
      } } ]);

  const ac = () => { if (t.value === 'demissional'){ v.textContent = 'Demissional não tem validade e não conta como ASO vigente.'; return; }

    v.textContent = 'Validade: ' + dataBR(isoHoje(x)) + ' (exame + ' + f.ficha.aso_periodicidade_meses + ' meses do PCMSO).'; };
  d.addEventListener('change', ac); t.addEventListener('change', ac);
}

function rhFTrein(c, f){
  const T = f.treinamentos || [], prev = (f.previstos || []).filter(p => p.treinamento_id);
  const pend = (f.listas || []).filter(l => l.status === 'aguardando' && !l.cancelada_em);
  c.innerHTML = '<div class="rhBarra"><button class="btn pri" type="button" id="trNovo">Registrar treinamento externo</button>'
    + '<button class="btn" type="button" id="trLista">Incluir numa lista interna</button></div>'
    + '<div class="secTit" style="margin-top:4px">Previstos</div>'
    + (prev.length ? '<div class="ccLista">' + prev.map(p => { const r = p.treinamento; const dd = r && r.validade ? rhDiasAte(r.validade) : null;
        const cor = p.nao_se_aplica ? 'cinza' : !r ? 'vermelho' : !r.valido ? 'vermelho' : rhCorDias(dd);
        return '<div class="rhLin"><span class="t">' + rhSemaforo({ cor }) + ' <b>' + esc(p.nome) + '</b><small>'
          + esc(p.nao_se_aplica ? 'não se aplica — ' + (p.motivo || '') : !r ? 'sem registro' : 'de ' + dataBR(r.data)
            + (r.validade ? ' · ' + rhDiasTxt(dd) + ' (' + dataBR(r.validade) + ')' : ' · sem validade')) + '</small></span></div>'; }).join('') + '</div>'
      : '<p class="nota">Nenhum treinamento previsto (aba Previstos).</p>')
    + (pend.length ? '<div class="aviso" style="margin:10px 0">Aguardando a confirmação dele no Field: ' + pend.map(l => esc(l.tema + ' de ' + dataBR(l.data))).join(' · ') + '</div>' : '')
    + '<div class="secTit">Registros</div><div class="ccLista" id="trL"></div>';
  document.getElementById('trNovo').addEventListener('click', () => rhNovoTreinamento(f));
  document.getElementById('trLista').addEventListener('click', () => { RH.aba = 'trein'; RH.trAba = 'listas'; irPara('rhs'); });
  const el = document.getElementById('trL');
  if (!T.length){ el.innerHTML = '<p class="nota" style="padding:12px">Nenhum treinamento registrado.</p>'; return; }
  T.forEach(t => {
    const d = document.createElement('div'); d.className = 'rhLin' + (t.anulado_em ? ' riscada' : '');
    d.innerHTML = '<span class="t"><b>' + esc(t.nome) + '</b> — ' + esc(dataBR(t.data))
      + '<small>' + esc([t.validade ? 'validade ' + dataBR(t.validade) : 'sem validade', t.carga_horaria_h ? String(t.carga_horaria_h).replace('.', ',') + 'h' : '',
        t.entidade, t.sessao_id ? 'lista de presença confirmada no celular' : t.certificado_arquivo_id ? '' : 'SEM CERTIFICADO', t.observacao,
        t.anulado_em ? 'ANULADO em ' + rhDT(t.anulado_em) + ' por ' + (t.anulado_por_nome || '?') + ': ' + t.anulado_motivo : ''].filter(Boolean).join(' · '))
      + '</small></span><span class="a"></span>';
    const x = d.querySelector('.a');
    const bt = (rot, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn mini'; b.textContent = rot; b.addEventListener('click', fn); x.appendChild(b); };
    if (t.sessao_id) bt('Lista (PDF)', () => rhBaixarLista(t.sessao_id, [f.usuario.id]));
    else if (t.certificado_arquivo_id) bt('Certificado', () => rhAbrirArquivo(t.certificado_arquivo_id));
    else if (!t.anulado_em) x.appendChild(rhBotaoAnexar('treinamento', t.id));
    if (!t.anulado_em) bt('Anular', () => rhAnularRegistro('treinamento', t.id, t.nome + ' de ' + dataBR(t.data), rhRecarregar));
    el.appendChild(d);
  });
}

async function rhNovoTreinamento(f){
  try{ if (!RH.trein){ const r = await rpc('tf_rh_epis', {}); RH.trein = r.treinamentos; RH.epis = r.epis; } }catch(e){ toast(e.message, 'err'); return; }
  const tipos = RH.trein.filter(t => t.ativo);
  abrirModal('Registrar treinamento — ' + f.usuario.nome,
    '<div class="campo"><label for="rtT">Treinamento</label><select id="rtT">' + tipos.map(t => '<option value="' + esc(t.id) + '">' + esc(t.nome)
      + (t.interno ? ' (interno)' : '') + '</option>').join('') + '</select></div>'
    + '<div class="dupla"><div class="campo"><label for="rtD">Data</label><input id="rtD" type="date" max="' + isoHoje() + '"></div>'
    + '<div class="campo"><label for="rtV">Validade (vazio = a padrão do tipo)</label><input id="rtV" type="date"></div></div>'
    + '<div class="dupla"><div class="campo"><label for="rtE">Entidade / instrutor</label><input id="rtE" type="text" maxlength="160"></div>'
    + '<div class="campo"><label for="rtC">Carga horária (h)</label><input id="rtC" type="text" inputmode="decimal" maxlength="6"></div></div>'
    + '<div class="campo"><label for="rtF">Certificado (PDF ou foto)</label><input id="rtF" type="file" accept="application/pdf,image/*"></div>'
    + '<p class="nota" id="rtAv"></p><p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Gravar', pri:true, onClick: async () => {
          const g = id => document.getElementById(id);
          try{
            const arq = await rhArqDoInput(g('rtF'), false);
            const r = await rpc('tf_rh_lancar_treinamento', { p_usuario: f.usuario.id, p_dados: { tipo_id: g('rtT').value, data: g('rtD').value,
              validade: g('rtV').value, entidade: g('rtE').value, carga_horaria_h: g('rtC').value }, p_arquivo: arq });
            fecharModal(); toast('Treinamento registrado' + (r.validade ? ' — validade ' + dataBR(r.validade) : '') + '.', 'ok'); contarRH(); rhRecarregar();
          }catch(e){ g('rhMsg').textContent = e.message; }
      } } ]);
  const s = document.getElementById('rtT');
  const ac = () => { const t = tipos.find(x => x.id === s.value); document.getElementById('rtAv').textContent = t
      ? (t.validade_meses ? 'Validade padrão: ' + t.validade_meses + ' meses a partir da data.' : 'Sem validade.')
        + (t.interno ? ' Interno: o normal é a lista de presença (Treinamentos › Listas); registre aqui só o que foi antes do sistema, com a lista de papel escaneada.' : '')
      : ''; };
  s.addEventListener('change', ac); ac();
}

async function iniciar(){
  await carregarRH();
  montarNav();
  pintarCracha();
  // links de fora: `?ir=rhs|rhf`, `?aba=<aba>`, `?func=<pessoa>`, `?nova=1` (nova entrega), `?cli=<cliente>` (kit)
  let nova = false, cli = null, acao = null;
  try{
    const prm = new URLSearchParams(location.search);
    const ir = prm.get('ir'), aba = prm.get('aba'), func = prm.get('func');
    if (ir && NAV.some(g => (g.itens || []).some(i => i.v === ir && !i.link))) visao = ir;
    if (aba && RH_ABAS.some(([k]) => k === aba)){ RH.aba = aba; visao = 'rhs'; }
    if (func){ RH.sel = func; visao = 'rhf'; const fa = prm.get('fa'); RH.fichaAba = fa || 'tam'; }
    nova = prm.get('nova') === '1';
    cli = prm.get('cli'); acao = prm.get('acao');
    if (location.search) history.replaceState(null, '', location.pathname);
  }catch(e){}
  if (!conectado && !DEMO) setConn('ok', 'Conectado');
  if (DEMO) setConn('', 'Demonstração');
  irPara(visao);
  contarRH().catch(() => {});
  if (RH_AUT && nova) rhNovaEntrega(RH.sel || null);
  if (RH_AUT && cli) segKitDoCliente(cli, acao).catch(e => toast(e.message, 'err'));
}
