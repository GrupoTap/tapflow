const rhfdUrl = path => SUPABASE_URL + '/storage/v1/object/rh-docs/' + String(path).split('/').map(encodeURIComponent).join('/');

/** fetch no Storage com a sessão (bucket privado: sem token não abre). Token
 *  vencido: uma chamada barata pelo núcleo renova a sessão, e repete uma vez. */
async function rhfdFetch(url, opts){
  const vai = () => fetch(url, Object.assign({}, opts, { headers: Object.assign({ apikey: SUPABASE_ANON_KEY },
    sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {}, (opts && opts.headers) || {}) }));
  let r = await vai();
  if ((r.status === 401 || r.status === 403) && sessao.refresh){
    const antes = sessao.token;
    try{ await Nucleo.api.rpc('tf_rh_autorizado', {}); }catch(e){}
    if (sessao.token && sessao.token !== antes) r = await vai();
  }
  return r;
}


const RH_ABAS = [ ['painel','Painel'], ['entregas','Entregas'], ['pedidos','Pedidos'], ['estoque','Estoque'], ['devol','Devoluções'],
  ['trein','Treinamentos'], ['docs','Documentos da empresa'], ['kit','Kit do cliente'],
  ['epis','Catálogo de EPI'], ['textos','Textos e termo'], ['quem','Quem vê'] ];

async function pintarRHSeguranca(){
  visao = 'rhs';
  const board = document.getElementById('board');
  if (DEMO) return rhDemo(board, 'Segurança do Trabalho');
  board.innerHTML = '<div class="tela rhTela"><div class="telaCab"><h2>Segurança do Trabalho</h2>'
    + '<p>EPI, estoque, devolução, ASO, treinamentos e o kit de documentos para os clientes — tudo confirmado pelo funcionário no celular. '
    + 'Vistoria bimestral (R3) e confirmação por digital (R7) chegam nas próximas fases.</p></div>'
    + '<div class="chips" id="rhAbas"></div><div id="rhCorpo"><p class="nota">Carregando…</p></div></div>';
  const ab = document.getElementById('rhAbas');
  RH_ABAS.forEach(([k, r]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'fchip' + (RH.aba === k ? ' on' : ''); b.textContent = r;
    b.addEventListener('click', () => { RH.aba = k; pintarRHSeguranca(); });
    ab.appendChild(b);
  });
  const corpo = document.getElementById('rhCorpo');
  try{
    if (RH.aba === 'painel')   return await rhPainel(corpo);
    if (RH.aba === 'entregas') return await rhEntregas(corpo);
    if (RH.aba === 'epis')     return await rhCatalogo(corpo);
    if (RH.aba === 'trein')    return await rhTreinHub(corpo);
    if (RH.aba === 'pedidos')  return await rhPedidos(corpo);
    if (RH.aba === 'estoque')  return await rhEstoque(corpo);
    if (RH.aba === 'devol')    return await rhDevolucoes(corpo);
    if (RH.aba === 'docs')     return await rhDocsEmpresa(corpo);
    if (RH.aba === 'kit')      return await rhKit(corpo);
    if (RH.aba === 'textos')   return await rhTextos(corpo);
    if (RH.aba === 'quem')     return await rhQuemVe(corpo);
  }catch(e){ rhFalha(corpo, e.message, pintarRHSeguranca); }
}

function rhAbrirFicha(uid){ RH.sel = uid; RH.fichaAba = 'dados'; irPara('rhf'); }

const RH_ENT_FILTROS = [ ['abertas','Abertas'], ['confirmado','Confirmadas'], ['cancelada','Canceladas'], ['todas','Todas'] ];

async function rhEntregas(corpo){
  RH.entregas = await rpc('tf_rh_entregas', { p_status: RH.entFiltro === 'todas' ? null : RH.entFiltro, p_limite: 500 });
  corpo.innerHTML = '<div class="rhBarra"><div class="chips" id="rhEF"></div>'
    + '<button class="btn pri" type="button" id="rhNova">Nova entrega de EPI</button></div>'
    + '<div class="ccLista" id="rhEL"></div>';
  const f = document.getElementById('rhEF');
  RH_ENT_FILTROS.forEach(([k, r]) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'fchip' + (RH.entFiltro === k ? ' on' : ''); b.textContent = r;
    b.addEventListener('click', () => { RH.entFiltro = k; pintarRHSeguranca(); });
    f.appendChild(b);
  });
  document.getElementById('rhNova').addEventListener('click', () => rhNovaEntrega(null));
  rhListaEntregas(document.getElementById('rhEL'), RH.entregas, true, pintarRHSeguranca);
}

function rhListaEntregas(el, L, comNome, depois){
  if (!L || !L.length){ el.innerHTML = '<p class="nota" style="padding:12px">Nenhuma entrega aqui.</p>'; return; }
  el.innerHTML = '';
  L.forEach(e => {
    const d = document.createElement('div');
    const anul = !!e.anulado_em;
    d.className = 'rhLin' + (anul || e.status === 'cancelada' ? ' riscada' : '') + (e.status === 'nao_recebido' ? ' velha' : '');
    const st = anul ? 'anulada' : RH_STATUS[e.status] || e.status;
    const sub = [];
    sub.push('entregue em ' + dataBR(e.data_entrega) + (e.anterior_ao_sistema ? ' (anterior ao sistema)' : ''));
    sub.push('CA ' + e.ca);
    if (e.fabricacao) sub.push('fab. ' + rhMes(e.fabricacao) + (e.limite_em ? ' · limite ' + rhMes(e.limite_em) : ''));
    if (e.serie_lote) sub.push('série/lote ' + e.serie_lote);
    if (e.condicao === 'reaproveitado') sub.push('reaproveitado');
    sub.push(RH_MOTIVO[e.motivo] || e.motivo);
    if (e.status === 'confirmado') sub.push('confirmada no celular em ' + rhDT(e.confirmado_em)
      + (e.confirmado_aparelho ? ' (' + rhAparelho(e.confirmado_aparelho) + ')' : ''));
    if (e.status === 'separado') sub.push('separado por ' + (e.lancado_por_nome || '?') + ' em ' + rhDT(e.lancado_em) + ' — falta clicar "Entreguei"');
    if (e.status === 'aguardando') sub.push(e.entregue_em ? 'entregue por ' + (e.entregue_por_nome || '?') + ' em ' + rhDT(e.entregue_em)
                                                          : 'lançada por ' + (e.lancado_por_nome || '?') + ' em ' + rhDT(e.lancado_em));
    if (e.origem_avaliado_em) sub.push('unidade avaliada em ' + rhDT(e.origem_avaliado_em).slice(0,10));
    if (e.devolucao) sub.push((rhDevVale(e.devolucao) ? RH_DESTINO[e.devolucao.destino] + ' em ' + dataBR(e.devolucao.data)
      : 'devolução ' + (RH_DEV_ST[e.devolucao.status] || e.devolucao.status)) + (e.devolucao.status === 'sem_confirmacao' ? ' (sem a confirmação dele)' : ''));
    if (e.status === 'nao_recebido') sub.push('"não recebi" em ' + rhDT(e.nao_recebido_em) + (e.nao_recebido_obs ? ': ' + e.nao_recebido_obs : ''));
    if (e.status === 'cancelada') sub.push('cancelada por ' + (e.cancelado_por_nome || '?') + ': ' + (e.cancelado_motivo || ''));
    if (anul) sub.push('ANULADA em ' + rhDT(e.anulado_em) + ' por ' + (e.anulado_por_nome || '?') + ': ' + (e.anulado_motivo || ''));
    if (e.pedido_id) sub.push('pedido pelo Field');
    if (e.estoque === 'estornado') sub.push('voltou ao estoque');
    d.innerHTML = '<span class="t"><span class="rhSt ' + esc(anul ? 'anulada' : e.status) + '">' + esc(st) + '</span> '
      + (comNome ? '<b>' + esc(e.funcionario || '') + '</b> — ' : '') + '<span class="ccDesc">' + esc(e.epi_nome) + ' ×' + e.quantidade
      + (e.tamanho ? ' (' + esc(e.tamanho) + ')' : '') + '</span><small>' + esc(sub.join(' · ')) + '</small></span><span class="a"></span>';
    const a = d.querySelector('.a');
    const bt = (rot, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn mini';
      b.textContent = rot; b.addEventListener('click', fn); a.appendChild(b); };
    if (e.status === 'aguardando' && e.celular){
      const w = document.createElement('a'); w.className = 'btn mini'; w.target = '_blank'; w.rel = 'noopener';
      w.href = rhWhats(e.celular, e.funcionario, e.epi_nome); w.textContent = 'WhatsApp'; a.appendChild(w);
    }
    if (e.status === 'separado') bt('Entreguei', () => rhEntreguei([e.id], depois));
    if (e.status === 'separado' || e.status === 'aguardando' || e.status === 'nao_recebido') bt('Cancelar', () => rhCancelar(e.id, depois));
    if (e.status === 'confirmado' && !anul) bt('Anular', () => rhAnular(e, depois));
    el.appendChild(d);
  });
}

function rhCancelar(id, depois){
  abrirModal('Cancelar entrega',
    '<p style="margin-top:0">Use para entrega que <b>não vai ser confirmada</b>: lançada no nome errado, '
    + '"não recebi" procedente, funcionário que saiu antes de confirmar. Ela continua no histórico, riscada.</p>'
    + '<div class="campo"><label for="rhMot">Motivo</label><input id="rhMot" type="text" maxlength="200" placeholder="ex.: lançada em duplicidade"></div>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Voltar', onClick: fecharModal },
      { label:'Cancelar a entrega', onClick: async () => {
          const m = document.getElementById('rhMot').value.trim();
          try{ await rpc('tf_rh_cancelar_entrega', { p_id: id, p_motivo: m });
               fecharModal(); toast('Entrega cancelada.', 'ok'); contarRH(); depois(); }
          catch(e){ document.getElementById('rhMsg').textContent = e.message; }
      } } ]);
}

function rhAnular(e, depois){
  abrirModal('Anular entrega confirmada',
    '<p style="margin-top:0"><b>' + esc(e.epi_nome) + '</b>, entregue em ' + esc(dataBR(e.data_entrega))
    + ' e confirmada em ' + esc(rhDT(e.confirmado_em)) + '.</p><p>A entrega <b>não some</b>: sai da ficha que vai ao cliente '
    + 'e aparece RISCADA na ficha completa, com a data, quem anulou e o motivo.</p>'
    + '<div class="campo"><label for="rhMot">Motivo</label><input id="rhMot" type="text" maxlength="200" placeholder="ex.: lançada no nome errado"></div>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Voltar', onClick: fecharModal },
      { label:'Anular', onClick: async () => {
          const m = document.getElementById('rhMot').value.trim();
          try{ await rpc('tf_rh_anular_entrega', { p_id: e.id, p_motivo: m });
               fecharModal(); toast('Entrega anulada.', 'ok'); depois(); }
          catch(er){ document.getElementById('rhMsg').textContent = er.message; }
      } } ]);
}

async function rhEntreguei(ids, depois){
  try{
    const r = await rpc('tf_rh_entreguei', { p_ids: ids });
    contarRH();
    const w = rhWhats(r.celular, r.funcionario, r.itens);
    abrirModal('Entregue',
      '<p style="margin-top:0"><b>' + esc(r.itens) + '</b> — agora no celular de <b>' + esc(r.funcionario)
      + '</b>, aguardando a confirmação dele com o PIN.</p>'
      + '<p class="nota">Os 2 dias do "sem confirmação" contam de agora.</p>'
      + (w ? '<p><a class="btn pri" target="_blank" rel="noopener" href="' + esc(w) + '">Avisar pelo WhatsApp</a></p>'
           : '<p class="nota">Cadastre o celular na ficha para avisar pelo WhatsApp com um toque.</p>'),
      [ { label:'Fechar', onClick: () => { fecharModal(); depois && depois(); } } ]);
  }catch(e){ toast(e.message, 'err'); }
}

function rhRotuloUnidade(u){
  return [u.tamanho ? 'tam. ' + u.tamanho : '', u.fabricacao ? 'fab. ' + rhMes(u.fabricacao) : '',
    u.serie_lote ? 'série ' + u.serie_lote : '', 'de ' + (u.de || '?'),
    'avaliado em ' + rhDT(u.avaliado_em).slice(0,10)].filter(Boolean).join(' · ');
}

async function rhNovaEntrega(uid){
  let lista, cat, ficha = null, est = [], reap = [];
  try{
    [lista, cat, est, reap] = await Promise.all([rpc('tf_rh_funcionarios', {}), rpc('tf_rh_epis', {}),
      rpc('tf_rh_estoque', {}).catch(() => []),        // S43 · sem o 63: sem saldo, sem erro
      rpc('tf_rh_reaproveitados', {}).catch(() => [])]);   // S44 · sem o 64: sem unidades
    if (uid) ficha = await rpc('tf_rh_funcionario', { p_usuario: uid });
  }catch(e){ toast(e.message, 'err'); return; }
  const pessoas = lista.filter(f => f.tem_ficha && f.situacao === 'ativo');
  if (!pessoas.length){ toast('Abra a ficha de RH de alguém antes (Funcionários).', 'err'); irPara('rhf'); return; }
  const epis = (cat.epis || []).filter(e => e.ativo && !e.componente && !e.livre_acesso);
  const optEpi = '<option value="">— escolha o EPI —</option>' + epis.map(e => '<option value="' + esc(e.id) + '">'
    + esc(e.nome) + (e.ca ? ' · CA ' + esc(e.ca) : ' · SEM CA') + '</option>').join('');
  abrirModal('Nova entrega de EPI',
      '<div class="campo"><label for="rhNF">Funcionário</label><select id="rhNF">'
    + '<option value="">— escolha —</option>' + pessoas.map(f => '<option value="' + esc(f.usuario_id) + '">' + esc(f.nome)
      + (f.funcao ? ' · ' + esc(f.funcao) : '') + (f.tem_pin ? '' : ' (ainda sem PIN)') + '</option>').join('') + '</select></div>'
    + '<div id="rhNPrev"></div><div id="rhNLinhas"></div>'
    + '<button class="btn" type="button" id="rhNMais">+ outro EPI</button>'
    + '<p class="nota">A entrega fica <b>aguardando</b> até o funcionário confirmar no celular dele (Field › Minha Segurança), '
    + 'com o PIN. Só depois ela entra na ficha. Vários EPIs lançados juntos se confirmam com um PIN só.</p>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Lançar entrega', pri:true, onClick: () => rhGravarEntrega(epis) } ]);
  rhModalLargo();
  const sel = document.getElementById('rhNF');
  const linhas = document.getElementById('rhNLinhas');
  let tamanhos = {}, previstos = [];
  const addLinha = (epiId) => {
    const d = document.createElement('div'); d.className = 'rhNL';
    d.innerHTML = '<div class="rhNLg">'
      + '<div class="campo c2"><label>EPI</label><select class="nE">' + optEpi + '</select></div>'
      + '<div class="campo"><label>Qtd.</label><input class="nQ" type="number" min="1" max="99" step="1" value="1" inputmode="numeric"></div>'
      + '<div class="campo nTamC" hidden><label>Tamanho</label><select class="nT"></select></div>'
      + '<div class="campo"><label>Motivo</label><select class="nM">' + Object.keys(RH_MOTIVO).map(k =>
          '<option value="' + k + '">' + esc(RH_MOTIVO[k]) + '</option>').join('') + '</select></div>'
      + '<div class="campo"><label>Condição</label><select class="nC"><option value="novo">Novo</option>'
      + '<option value="reaproveitado">Reaproveitado</option></select></div>'
      + '<div class="campo c2 nUniC" hidden><label>Unidade reaproveitada (avaliada)</label><select class="nUni"></select></div>'
      + '<div class="campo nFabC" hidden><label>Fabricação (mês/ano)</label><input class="nFab" type="month"></div>'
      + '<div class="campo nSerC" hidden><label>Nº de série / lote</label><input class="nSer" type="text" maxlength="60"></div>'
      + '<div class="campo nIniC" hidden><label>Data em que recebeu</label><input class="nData" type="date" max="' + isoHoje() + '"></div>'
      + '<div class="campo nIniC" hidden><label>CA gravado na peça</label><input class="nCA" type="text" inputmode="numeric" maxlength="9"></div>'
      + '</div><p class="nota nAv"></p><button class="lnk nTirar" type="button">tirar esta linha</button>';
    linhas.appendChild(d);
    const e = d.querySelector('.nE');
    const acerta = () => {
      const x = epis.find(y => y.id === e.value);
      const ini = d.querySelector('.nM').value === 'entrega_inicial';
      d.querySelector('.nTamC').hidden = !(x && x.tem_tamanho);
      if (x && x.tem_tamanho){
        const t = d.querySelector('.nT'); const v = t.value || tamanhos[x.id] || '';
        t.innerHTML = '<option value="">—</option>' + (x.tamanhos || []).map(s => '<option>' + esc(s) + '</option>').join('');
        t.value = v;
      }
      d.querySelector('.nFabC').hidden = !(x && (x.pede_fabricacao || x.limite_meses));
      d.querySelector('.nSerC').hidden = !(x && x.pede_serie);
      d.querySelectorAll('.nIniC').forEach(c => c.hidden = !ini);
      const av = [];
      if (x && !x.ca) av.push('Este EPI está SEM CA no catálogo — o banco não deixa entregar. Preencha em Catálogo de EPI.');
      if (x && x.ca_validade && x.ca_validade < isoHoje()) av.push('O CA ' + x.ca + ' venceu em ' + dataBR(x.ca_validade)
        + '. EPI comprado com CA válido segue em uso; o aviso é para a próxima compra.');
      if (x && x.sob_encomenda) av.push('Item sob encomenda (óculos graduado): confira a receita na ficha antes de entregar.');
      if (ini) av.push('Entrega inicial: o que o funcionário JÁ tinha antes do sistema. Informe a data e o CA gravado na peça, se forem outros.');
      // S44 · R4 — a unidade avaliada (casco, cinto, abafador, perneira; e a armação do óculos graduado)
      const uns = x ? (reap || []).filter(u => u.epi_id === x.id) : [];
      const uniC = d.querySelector('.nUniC'), uni = d.querySelector('.nUni');
      const condSel = d.querySelector('.nC');
      const mostraUni = !!(x && uns.length && !ini && (condSel.value === 'reaproveitado' || x.sob_encomenda));
      uniC.hidden = !mostraUni;
      if (mostraUni && uni.dataset.epi !== x.id){
        uni.dataset.epi = x.id;
        uni.innerHTML = '<option value="">' + (x.sob_encomenda ? '— armação nova (lente e armação) —' : '— sem escolher a unidade —') + '</option>'
          + uns.map(u => '<option value="' + esc(u.devolucao_id) + '">' + esc(rhRotuloUnidade(u)) + '</option>').join('');
      }
      if (!mostraUni){ uni.value = ''; uni.dataset.epi = ''; }
      const u = mostraUni && uni.value ? uns.find(y => y.devolucao_id === uni.value) : null;
      if (u){
        condSel.value = 'reaproveitado';
        if (u.fabricacao && !d.querySelector('.nFab').value) d.querySelector('.nFab').value = String(u.fabricacao).slice(0,7);
        if (u.serie_lote && !d.querySelector('.nSer').value) d.querySelector('.nSer').value = u.serie_lote;
        if (u.tamanho && x.tem_tamanho) d.querySelector('.nT').value = u.tamanho;
      }
      if (x && x.sob_encomenda && uns.length && !ini) av.push('Há ' + uns.length + ' armação(ões) graduada(s) reaproveitada(s), avaliada(s) e aprovada(s): se servir no rosto dele, escolha abaixo e encomende só as lentes.');
      // S43 · o saldo da caixa (a entrega dá baixa; a inicial não) — S44: SEM SALDO, TRAVA (Q4)
      d.dataset.semSaldo = '';
      const es = x && (est || []).find(y => y.epi_id === x.id);
      const cond = condSel.value;
      const ctrl = es && (cond === 'reaproveitado' ? (es.controlado_reap ?? es.controlado) : (es.controlado_novo ?? es.controlado));
      const armacao = !!(u && x.sob_encomenda);
      if (ctrl && !ini && !armacao){
        const t = x.tem_tamanho ? d.querySelector('.nT').value : '';
        const l = (es.linhas || []).find(y => y.tamanho === t);
        const n = l ? Number(cond === 'reaproveitado' ? l.reaproveitado : l.novo) : 0;
        const q = Number(d.querySelector('.nQ').value || 1);
        if (x.tem_tamanho && !t) av.push('Estoque: escolha o tamanho.');
        else if (n < q){
          d.dataset.semSaldo = '1';
          av.push('SEM SALDO: o estoque' + (t ? ' do ' + t : '') + (cond === 'reaproveitado' ? ' (reaproveitado)' : '') + ' tem ' + Math.max(n, 0)
            + ' e sairiam ' + q + ' — o sistema não deixa lançar. Dê entrada da compra (Estoque › Entrada) ou, se a caixa tem, faça a contagem.');
        } else av.push('Estoque' + (t ? ' ' + t : '') + (cond === 'reaproveitado' ? ' (reaproveitado)' : '') + ': ' + n + '.');
      }
      const avEl = d.querySelector('.nAv');
      avEl.textContent = av.join(' ');
      avEl.style.color = d.dataset.semSaldo ? 'var(--crit)' : '';
    };
    e.addEventListener('change', acerta);
    d.querySelector('.nM').addEventListener('change', acerta);
    d.querySelector('.nT').addEventListener('change', acerta);
    d.querySelector('.nC').addEventListener('change', acerta);
    d.querySelector('.nQ').addEventListener('input', acerta);
    d.querySelector('.nUni').addEventListener('change', acerta);
    d.querySelector('.nTirar').addEventListener('click', () => d.remove());
    if (epiId){ e.value = epiId; }
    acerta();
  };
  const trocaPessoa = async () => {
    linhas.innerHTML = ''; document.getElementById('rhNPrev').innerHTML = '';
    tamanhos = {}; previstos = [];
    if (!sel.value) return;
    let f = ficha && ficha.usuario.id === sel.value ? ficha : null;
    try{ if (!f) f = await rpc('tf_rh_funcionario', { p_usuario: sel.value }); }catch(e){ toast(e.message,'err'); return; }
    (f.tamanhos || []).forEach(t => { if (t.tamanho) tamanhos[t.epi_id] = t.tamanho; });
    previstos = (f.previstos || []).filter(p => p.epi_id && !p.nao_se_aplica && !p.tem_entrega);
    const cx = document.getElementById('rhNPrev');
    if (previstos.length){
      cx.innerHTML = '<p class="nota" style="margin:0 0 6px">Previstos para esta pessoa ainda sem entrega — toque para acrescentar:</p><div class="chips"></div>';
      previstos.forEach(p => { const b = document.createElement('button'); b.type = 'button'; b.className = 'fchip';
        b.textContent = '+ ' + p.nome; b.addEventListener('click', () => { addLinha(p.epi_id); b.remove(); });
        cx.querySelector('.chips').appendChild(b); });
    }
    const ag = (f.entregas || []).filter(x => x.status === 'aguardando').length;
    if (ag) cx.insertAdjacentHTML('beforeend', '<p class="nota">' + ag + ' entrega(s) desta pessoa já aguardam confirmação.</p>');
    if (!(f.pin && f.pin.ativo)) cx.insertAdjacentHTML('beforeend', '<p class="nota" style="color:var(--warn)">Esta pessoa ainda não criou o PIN: '

async function rhGravarEntrega(epis){
  const msg = document.getElementById('rhMsg'); msg.textContent = '';
  const uid = document.getElementById('rhNF').value;
  if (!uid){ msg.textContent = 'Escolha o funcionário.'; return; }
  const itens = [];
  for (const d of document.querySelectorAll('#rhNLinhas .rhNL')){
    const epi = d.querySelector('.nE').value;
    if (!epi) continue;
    const x = epis.find(y => y.id === epi) || {};
    itens.push({ epi_id: epi, quantidade: Number(d.querySelector('.nQ').value || 1),
      tamanho: x.tem_tamanho ? d.querySelector('.nT').value : null,
      motivo: d.querySelector('.nM').value, condicao: d.querySelector('.nC').value,
      fabricacao: d.querySelector('.nFab').value || null, serie_lote: d.querySelector('.nSer').value || null,
      data_entrega: d.querySelector('.nM').value === 'entrega_inicial' ? (d.querySelector('.nData').value || null) : null,
      ca: d.querySelector('.nM').value === 'entrega_inicial' ? (d.querySelector('.nCA').value || null) : null,
      devolucao_id: d.querySelector('.nUni').value || null });   // S44 · a unidade avaliada
  }
  if (!itens.length){ msg.textContent = 'Escolha ao menos um EPI.'; return; }
  if (document.querySelector('#rhNLinhas .rhNL[data-sem-saldo="1"]')){
    msg.textContent = 'Há item sem saldo no estoque (em vermelho). Dê entrada ou faça a contagem antes — ou tire a linha.'; return;
  }
  try{
    const r = await rpc('tf_rh_lancar_entregas', { p_usuario: uid, p_itens: itens });
    const f = await rpc('tf_rh_funcionario', { p_usuario: uid });
    fecharModal(); contarRH();
    const nomes = itens.map(i => (epis.find(e => e.id === i.epi_id) || {}).nome).join(', ');
    const w = rhWhats((f.ficha || {}).celular, f.usuario.nome, nomes);
    abrirModal('Entrega lançada',
      '<p style="margin-top:0"><b>' + r.n + ' item(ns)</b> para <b>' + esc(f.usuario.nome) + '</b>, aguardando a confirmação dele.</p>'
      + ((r.avisos || []).length ? '<div class="aviso">' + r.avisos.map(esc).join('<br>') + '</div>' : '')
      + '<p>Peça para ele abrir o <b>TapFlow Field › Minha Segurança</b>, conferir e confirmar com o PIN. '
      + 'Sem confirmação em 2 dias, a entrega fica vermelha no painel.</p>'
      + (w ? '<p><a class="btn pri" target="_blank" rel="noopener" href="' + esc(w) + '">Avisar pelo WhatsApp</a></p>'
           : '<p class="nota">Cadastre o celular na ficha para avisar pelo WhatsApp com um toque.</p>'),
      [ { label:'Fechar', onClick: () => { fecharModal(); if (visao === 'rhs') pintarRHSeguranca(); else if (visao === 'rhf') pintarRHFuncionarios(); } } ]);
  }catch(e){ msg.textContent = e.message; }
}

async function rhLerArquivo(file, lado){
  if (file.type === 'application/pdf'){
    if (file.size > 5 * 1024 * 1024) throw new Error('PDF grande demais (máx. 5 MB). Escaneie com resolução menor.');
    const dados = await new Promise((ok, er) => { const fr = new FileReader(); fr.onload = () => ok(fr.result);
      fr.onerror = () => er(new Error('Não deu para ler o arquivo.')); fr.readAsDataURL(file); });
    return { mime:'application/pdf', dados };
  }
  if (!/^image\//.test(file.type)) throw new Error('Use foto (JPG/PNG) ou PDF.');
  const r = await reduzirImagem(file, lado || 1800, 0.85, true, true);
  return { mime:'image/jpeg', dados: r.dados };
}

async function rhAbrirArquivo(id){
  try{
    const a = await rpc('tf_rh_arquivo', { p_id: id });
    const w = window.open('', '_blank');
    if (!w){ toast('O navegador bloqueou a janela nova — libere pop-ups para o TapFlow.', 'err'); return; }
    const blob = await (await fetch(a.conteudo)).blob();
    w.location.href = URL.createObjectURL(blob);
  }catch(e){ toast(e.message, 'err'); }
}

const RH_QUADRO = { x:45, y:218, w:120, h:38 };

async function rhImprimirTermo(f){
  let textos = RH.textos;
  try{ if (!textos) textos = RH.textos = await rpc('tf_rh_textos', {}); }catch(e){ toast(e.message,'err'); return; }
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const nome = f ? f.usuario.nome : '______________________________________';
  const funcao = f && f.ficha && f.ficha.funcao ? f.ficha.funcao : '______________________';
  const empresa = (textos.empresa || {}).texto || 'Engetap';
  const corpo = String((textos.termo_adesao || {}).texto || '').replace(/\{NOME\}/g, nome)
    .replace(/\{FUNCAO\}/g, funcao).replace(/\{EMPRESA\}/g, empresa);
  try{ doc.addImage(LOGO_ENGETAP, 'JPEG', 15, 12, 52, 12.6); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
  doc.text('TERMO DE ADESÃO AO REGISTRO ELETRÔNICO DE EPI', 195, 17, { align:'right' });
  doc.setFontSize(9.5); doc.setFont('helvetica','normal');
  doc.text('e autorização de uso da imagem da assinatura', 195, 22, { align:'right' });
  doc.setDrawColor(190); doc.line(15, 29, 195, 29);
  // o texto tem que caber ACIMA do quadro: encolhe a letra até caber
  let fs = 10.5, linhas, alt;
  for (; fs >= 7.5; fs -= 0.25){
    doc.setFontSize(fs);
    linhas = []; String(corpo).split('\n').forEach(p => { if (!p.trim()) { linhas.push(''); return; }
      doc.splitTextToSize(p, 180).forEach(l => linhas.push(l)); });
    alt = linhas.length * fs * 0.42;
    if (36 + alt < RH_QUADRO.y - 18) break;
  }
  doc.setFontSize(fs); doc.text(linhas, 15, 37, { lineHeightFactor: 1.2 });
  const cidade = 'Divinópolis/MG, _____ de ____________________ de ________';
  doc.text(cidade, 15, RH_QUADRO.y - 8);
  // o quadro: borda firme + marcas de canto (ajudam o recorte a achar)
  const q = RH_QUADRO;
  doc.setDrawColor(0); doc.setLineWidth(0.7); doc.rect(q.x, q.y, q.w, q.h);
  doc.setLineWidth(1.4);
  [[q.x, q.y, 1, 1], [q.x + q.w, q.y, -1, 1], [q.x, q.y + q.h, 1, -1], [q.x + q.w, q.y + q.h, -1, -1]].forEach(([x, y, dx, dy]) => {
    doc.line(x - dx * 3, y, x + dx * 6, y); doc.line(x, y - dy * 3, x, y + dy * 6);
  });
  doc.setLineWidth(0.2); doc.setFontSize(7.5); doc.setTextColor(120);
  doc.text('Assine DENTRO do quadro, sem encostar nas bordas, com caneta azul ou preta.', 105, q.y - 2, { align:'center' });
  doc.setTextColor(0); doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text(nome, 105, q.y + q.h + 6, { align:'center' });
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text('Assinatura do(a) funcionário(a) · ' + funcao, 105, q.y + q.h + 10.5, { align:'center' });
  doc.setFontSize(7); doc.setTextColor(130);
  // S43 · a versão do texto no pé: é ela que diz, depois, qual termo cada um assinou
  doc.text(empresa + ' · TapFlow · termo gerado em ' + rhDT(new Date().toISOString()) + ' · texto versão '
    + ((textos.termo_adesao || {}).versao || 1), 105, 290, { align:'center' });
  doc.save('Termo de adesão EPI - ' + (f ? f.usuario.nome : 'em branco') + '.pdf');
}

let _pdfjs = null;

function carregarPdfJs(){
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((ok, err) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); }
      catch(e){ err(new Error('A leitura de PDF não inicializou.')); } };
    s.onerror = () => { _pdfjs = null; err(new Error('Não consegui baixar o leitor de PDF. Sem internet? Envie uma FOTO do termo.')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}

async function rhPaginaEmCanvas(file, arq){
  let url, pdf = false;
  if (arq){ url = arq.conteudo; pdf = arq.mime === 'application/pdf'; }
  else { pdf = file.type === 'application/pdf';
         url = await new Promise((ok, er) => { const fr = new FileReader(); fr.onload = () => ok(fr.result);
           fr.onerror = () => er(new Error('Não deu para ler o arquivo.')); fr.readAsDataURL(file); }); }
  const cv = document.createElement('canvas');
  if (pdf){
    const lib = await carregarPdfJs();
    const bin = atob(url.split(',')[1]); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const d = await lib.getDocument({ data: u8 }).promise;
    const pg = await d.getPage(1);
    const vp1 = pg.getViewport({ scale: 1 });
    const vp = pg.getViewport({ scale: Math.min(3, 2200 / Math.max(vp1.width, vp1.height)) });
    cv.width = vp.width; cv.height = vp.height;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    await pg.render({ canvasContext: cx, viewport: vp }).promise;
  } else {
    const img = await new Promise((ok, er) => { const i = new Image(); i.onload = () => ok(i);
      i.onerror = () => er(new Error('Esse arquivo não é uma imagem que o navegador abra.')); i.src = url; });
    const e = Math.min(1, 2400 / Math.max(img.width, img.height));
    cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.drawImage(img, 0, 0, cv.width, cv.height);
  }
  return { cv, url, pdf };
}

function rhAcharQuadro(cv){
  const W = cv.width, H = cv.height;
  const esp = { x: W * RH_QUADRO.x / 210, y: H * RH_QUADRO.y / 297, w: W * RH_QUADRO.w / 210, h: H * RH_QUADRO.h / 297 };
  const x0 = Math.max(0, Math.round(esp.x - esp.w * 0.35)), x1 = Math.min(W, Math.round(esp.x + esp.w * 1.35));
  const y0 = Math.max(0, Math.round(esp.y - esp.h * 1.2)),  y1 = Math.min(H, Math.round(esp.y + esp.h * 2.2));
  const d = cv.getContext('2d').getImageData(x0, y0, x1 - x0, y1 - y0).data, w = x1 - x0, h = y1 - y0;
  const esc_ = (i) => { const l = 0.3 * d[i] + 0.59 * d[i+1] + 0.11 * d[i+2]; return l < 110; };
  const lin = new Array(h).fill(0), col = new Array(w).fill(0);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (esc_((y * w + x) * 4)){ lin[y]++; col[x]++; }
  const pico = (arr, de, ate, min) => { let b = -1, v = min; for (let i = Math.max(0,de); i < Math.min(arr.length,ate); i++) if (arr[i] > v){ v = arr[i]; b = i; } return b; };
  const top = pico(lin, 0, Math.round(h * 0.55), esp.w * 0.55);
  const bot = pico(lin, Math.round(h * 0.45), h, esp.w * 0.55);
  const esq = pico(col, 0, Math.round(w * 0.5), esp.h * 0.5);
  const dir = pico(col, Math.round(w * 0.5), w, esp.h * 0.5);
  if (top < 0 || bot < 0 || esq < 0 || dir < 0 || bot - top < esp.h * 0.5 || dir - esq < esp.w * 0.5)
    return { achou:false, r:esp };
  return { achou:true, r:{ x: x0 + esq, y: y0 + top, w: dir - esq, h: bot - top } };
}

function rhTirarFundo(cv, r, sens){
  const m = Math.max(4, Math.round(Math.min(r.w, r.h) * 0.06));   // foge da borda do quadro
  const x = Math.round(r.x + m), y = Math.round(r.y + m), w = Math.round(r.w - 2 * m), h = Math.round(r.h - 2 * m);
  if (w < 20 || h < 10) return null;
  const src = cv.getContext('2d').getImageData(x, y, w, h), d = src.data;
  const lim = sens;                 // luminância abaixo disto é tinta
  let mx0 = w, my0 = h, mx1 = -1, my1 = -1;
  for (let i = 0, p = 0; i < d.length; i += 4, p++){
    const l = 0.3 * d[i] + 0.59 * d[i+1] + 0.11 * d[i+2];
    let a = l >= lim ? 0 : Math.min(255, Math.round(255 * (lim - l) / (lim * 0.45)));
    if (a < 35) a = 0;
    d[i+3] = a;
    if (a){ // tinta um pouco mais escura, mantendo a cor (azul continua azul)
      d[i] = Math.round(d[i] * 0.75); d[i+1] = Math.round(d[i+1] * 0.75); d[i+2] = Math.round(d[i+2] * 0.8);
      const px = p % w, py = (p - px) / w;
      if (px < mx0) mx0 = px; if (px > mx1) mx1 = px; if (py < my0) my0 = py; if (py > my1) my1 = py;
    }
  }
  if (mx1 < 0) return null;
  const pad = 6;
  mx0 = Math.max(0, mx0 - pad); my0 = Math.max(0, my0 - pad); mx1 = Math.min(w - 1, mx1 + pad); my1 = Math.min(h - 1, my1 + pad);
  const t = document.createElement('canvas'); t.width = w; t.height = h; t.getContext('2d').putImageData(src, 0, 0);
  const cw = mx1 - mx0 + 1, ch = my1 - my0 + 1, e = Math.min(1, 700 / cw);
  const o = document.createElement('canvas'); o.width = Math.round(cw * e); o.height = Math.round(ch * e);
  o.getContext('2d').drawImage(t, mx0, my0, cw, ch, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

async function rhRecorte(f, file, arq){
  let pg;
  try{ pg = await rhPaginaEmCanvas(file, arq); }catch(e){ toast(e.message, 'err'); return; }
  const achado = rhAcharQuadro(pg.cv);
  let R = Object.assign({}, achado.r), sens = 170;
  abrirModal('Recortar a assinatura',
      '<p class="nota" style="margin-top:0">' + (achado.achou
        ? 'Achei o quadro da assinatura (em azul). Ajuste arrastando o retângulo ou os cantos, se precisar.'
        : 'Não achei as bordas do quadro com certeza — marquei onde ele deveria estar. Arraste o retângulo e os cantos até cobrir o quadro.') + '</p>'
    + '<div class="rhRecWrap"><div class="rhRecTela" id="rcTela"><canvas id="rcCv"></canvas><div class="rhRecQ" id="rcQ">'
    + '<i data-c="nw"></i><i data-c="ne"></i><i data-c="sw"></i><i data-c="se"></i></div></div>'
    + '<div class="rhRecLado"><div class="secTit" style="margin-top:0">Resultado</div><div class="rhXadrez"><img id="rcRes" alt="Prévia da assinatura"></div>'
    + '<div class="campo" style="margin-top:10px"><label for="rcSens">Sensibilidade (mais tinta ↔ menos fundo)</label>'
    + '<input id="rcSens" type="range" min="90" max="235" value="' + sens + '"></div>'
    + '<div class="campo"><label for="rcData">Data em que o termo foi assinado</label><input id="rcData" type="date" max="' + isoHoje() + '" value="' + isoHoje() + '"></div>'
    + '</div></div><p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Gravar termo e assinatura', pri:true, onClick: async () => {
          const msg = document.getElementById('rhMsg');
          const png = rhTirarFundo(pg.cv, R, sens);
          if (!png){ msg.textContent = 'Não achei tinta dentro do quadro. Ajuste o retângulo ou a sensibilidade.'; return; }
          let termo = null;
          if (!arq){
            // o termo guardado: o PDF como veio (até 5 MB) ou a foto reduzida
            termo = pg.pdf ? { nome: file.name, mime:'application/pdf', conteudo: pg.url }
                           : { nome: file.name, mime:'image/jpeg', conteudo: pg.cv.toDataURL('image/jpeg', 0.82) };
            if (termo.conteudo.length > 6800000) { msg.textContent = 'Arquivo grande demais. Envie uma foto ou um PDF menor.'; return; }
          }
          try{ await rpc('tf_rh_enviar_termo', { p_usuario: f.usuario.id, p_termo: termo, p_assinatura: { conteudo: png },
                 p_assinado_em: document.getElementById('rcData').value });
               fecharModal(); toast('Termo e assinatura gravados.', 'ok'); rhRecarregar(); }
          catch(e){ msg.textContent = e.message; }
      } } ]);
  rhModalLargo();
  const tela = document.getElementById('rcTela'), cv = document.getElementById('rcCv'), q = document.getElementById('rcQ');
  // a página inteira, reduzida para caber
  const larg = Math.max(240, Math.min(560, window.innerWidth - 90));
  const esc2 = Math.min(1, larg / pg.cv.width, 640 / pg.cv.height);
  cv.width = Math.round(pg.cv.width * esc2); cv.height = Math.round(pg.cv.height * esc2);
  cv.getContext('2d').drawImage(pg.cv, 0, 0, cv.width, cv.height);
  const mostra = () => {
    q.style.left = (R.x * esc2) + 'px'; q.style.top = (R.y * esc2) + 'px';
    q.style.width = (R.w * esc2) + 'px'; q.style.height = (R.h * esc2) + 'px';
    const png = rhTirarFundo(pg.cv, R, sens);
    const im = document.getElementById('rcRes'); if (png) im.src = png; else im.removeAttribute('src');
  };
  let arr = null;
  q.addEventListener('pointerdown', ev => {
    ev.preventDefault(); q.setPointerCapture(ev.pointerId);
    arr = { c: ev.target.dataset.c || 'mover', x: ev.clientX, y: ev.clientY, R: Object.assign({}, R) };
  });
  q.addEventListener('pointermove', ev => {
    if (!arr) return;
    const dx = (ev.clientX - arr.x) / esc2, dy = (ev.clientY - arr.y) / esc2, o = arr.R;
    if (arr.c === 'mover'){ R.x = o.x + dx; R.y = o.y + dy; }
    else {
      if (arr.c.includes('w')){ R.x = o.x + dx; R.w = o.w - dx; } else R.w = o.w + dx;
      if (arr.c.includes('n')){ R.y = o.y + dy; R.h = o.h - dy; } else R.h = o.h + dy;
    }
    R.w = Math.max(40, R.w); R.h = Math.max(20, R.h);
    R.x = Math.max(0, Math.min(pg.cv.width - R.w, R.x)); R.y = Math.max(0, Math.min(pg.cv.height - R.h, R.y));
    q.style.left = (R.x * esc2) + 'px'; q.style.top = (R.y * esc2) + 'px';
    q.style.width = (R.w * esc2) + 'px'; q.style.height = (R.h * esc2) + 'px';
  });
  const solta = () => { if (arr){ arr = null; mostra(); } };
  q.addEventListener('pointerup', solta); q.addEventListener('pointercancel', solta);
  document.getElementById('rcSens').addEventListener('input', ev => { sens = Number(ev.target.value); mostra(); });
  mostra();
}

async function rhFichaPDF(jsPDF, ficha, ass){
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const M = 12, W = 210 - 2 * M;
  const F = ficha.funcionario;
  const col = [ { t:'Equipamento', w:56 }, { t:'CA', w:16 }, { t:'Entrega', w:19 }, { t:'Devolução', w:19 },
                { t:'Assinatura do funcionário', w:40 }, { t:'Visto da empresa', w:36 } ];
  let pagina = 1, y;
  const dims = {};
  for (const k of Object.keys(ass || {})) dims[k] = await rhDimImg(ass[k]);
  const cab = () => {
    try{ doc.addImage(LOGO_ENGETAP, 'JPEG', M, 10, 44, 10.7); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('FICHA DE CONTROLE DE ENTREGA DE EPI', 210 - M, 14, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text(ficha.completa ? 'Versão completa (auditoria) — inclui entregas anuladas' : 'NR-06 · registro eletrônico (item 6.5.1 "d")', 210 - M, 18.5, { align:'right' });
    doc.setDrawColor(170); doc.line(M, 23, 210 - M, 23);
    doc.setFontSize(8.5);
    const dado = (k, v, x, yy) => { doc.setFont('helvetica','bold'); doc.text(k, x, yy); const kw = doc.getTextWidth(k) + 1.5;
      doc.setFont('helvetica','normal'); doc.text(String(v || '—'), x + kw, yy); };
    dado('Empresa:', ficha.empresa, M, 28);
    dado('Nome:', F.nome, M, 33); dado('Setor:', F.setor, 120, 33);
    dado('Função:', F.funcao, M, 38); dado('Admissão:', F.admissao ? dataBR(F.admissao) : '—', 120, 38);
    if (F.situacao === 'desligado') dado('Desligamento:', dataBR(F.desligado_em), 165, 38);
    y = 43;
    if (pagina === 1){
      doc.setFontSize(7.6);
      const tx = doc.splitTextToSize(ficha.texto || '', W);
      doc.text(tx, M, y + 1.5, { lineHeightFactor:1.15 }); y += tx.length * 7.6 * 0.405 + 4;
    }
    // cabeçalho da tabela
    doc.setFillColor(227, 238, 247); doc.rect(M, y, W, 7, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    let x = M; col.forEach(c => { doc.text(c.t, x + 1.2, y + 4.6); x += c.w; });
    y += 7;
  };
  const rodape = () => {
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(90);
    doc.text('Ficha gerada em ' + rhDT(ficha.gerada_em).replace(' ', ' às ') + ', contendo entregas confirmadas até esta data.', M, 284);
    doc.text(doc.splitTextToSize(ficha.rodape || '', W - 20), M, 288);
    doc.text('pág. ' + pagina, 210 - M, 288, { align:'right' });
    doc.setTextColor(0);
  };
  const img = (uid, x, yy, w, h) => {
    const u = ass && ass[uid], d = dims[uid];
    if (!u || !d) return false;
    const e = Math.min(w / d.w, h / d.h);
    const iw = d.w * e, ih = d.h * e;
    try{ doc.addImage(u, 'PNG', x + (w - iw) / 2, yy + (h - ih) / 2, iw, ih); return true; }catch(er){ return false; }
  };
  cab();
  const L = ficha.linhas || [];
  if (!L.length){ doc.setFontSize(9); doc.text('Nenhuma entrega confirmada até esta data.', M + 2, y + 8); y += 12; }
  const HROW = 17;
  L.forEach(l => {
    const anul = !!l.anulado_em;
    const altura = HROW + (anul ? 5 : 0);
    if (y + altura > 278){ rodape(); doc.addPage(); pagina++; cab(); }
    let x = M;
    doc.setDrawColor(215); doc.rect(M, y, W, altura);
    col.reduce((acc, c) => { if (acc > M) doc.line(acc, y, acc, y + altura); return acc + c.w; }, M);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.6);
    const eq = [l.epi_nome + ' ×' + l.quantidade + (l.tamanho ? ' (' + l.tamanho + ')' : '')];
    const det = [];
    if (l.condicao === 'reaproveitado') det.push('reaproveitado' + (l.origem_avaliado_em ? ' — avaliado em ' + rhDT(l.origem_avaliado_em).slice(0,10) : ''));
    if (l.fabricacao) det.push('fab. ' + rhMes(l.fabricacao) + (l.limite_em ? ' · limite ' + rhMes(l.limite_em) : ''));
    if (l.serie_lote) det.push('série ' + l.serie_lote);
    if (l.anterior_ao_sistema) det.push('anterior ao sistema');
    det.push(RH_MOTIVO[l.motivo] || l.motivo);
    doc.setFont('helvetica','bold');
    const eqL = doc.splitTextToSize(eq[0], col[0].w - 2.4).slice(0, 2);
    doc.text(eqL, x + 1.2, y + 4);
    doc.setFont('helvetica','normal'); doc.setFontSize(6.6);
    doc.text(doc.splitTextToSize(det.join(' · '), col[0].w - 2.4).slice(0, 3), x + 1.2, y + 4 + eqL.length * 3.2);
    x += col[0].w;
    doc.setFontSize(7.6); doc.text(String(l.ca), x + 1.2, y + 5); x += col[1].w;
    doc.text(dataBR(l.data_entrega), x + 1.2, y + 5); x += col[2].w;
    // devolução (S44 · R4): a que VALE — confirmada no celular ou registrada sem a confirmação dele
    if (rhDevVale(l.devolucao)){
      doc.text(dataBR(l.devolucao.data), x + 1.2, y + 5);
      doc.setFontSize(5.6);
      doc.text(doc.splitTextToSize(RH_DESTINO_CURTO[l.devolucao.destino] + (l.devolucao.status === 'sem_confirmacao'
        ? ' · sem confirmação do funcionário' : ' · confirmada no celular'), col[3].w - 2), x + 1.2, y + 8.4);
      doc.setFontSize(7.6);
    } else doc.text('—', x + 1.2, y + 5);
    x += col[3].w;
    // assinatura do funcionário: rubrica + selo, sempre juntos
    img(F.usuario_id, x + 1, y + 0.8, col[4].w - 2, 8.6);
    doc.setFontSize(5.6);
    doc.text(doc.splitTextToSize('Confirmado no celular do funcionário em ' + rhDT(l.confirmado_em)
      + (l.confirmado_metodo === 'pin' ? ' (PIN)' : ''), col[4].w - 2), x + 1, y + 11.6);
    x += col[4].w;
    img(l.lancado_por, x + 1, y + 0.8, col[5].w - 2, 8.6);
    doc.text(doc.splitTextToSize('Lançado por ' + (l.lancado_por_nome || '?') + ' em ' + rhDT(l.lancado_em), col[5].w - 2), x + 1, y + 11.6);
    if (anul){
      doc.setDrawColor(166, 45, 24); doc.setLineWidth(0.4);
      doc.line(M + 1, y + HROW / 2, 210 - M - 1, y + HROW / 2);
      doc.setLineWidth(0.2); doc.setTextColor(166, 45, 24); doc.setFontSize(6.8);
      doc.text(doc.splitTextToSize('ANULADA em ' + rhDT(l.anulado_em) + ' por ' + (l.anulado_por_nome || '?') + ' — ' + (l.anulado_motivo || ''), W - 3)[0],
               M + 1.5, y + HROW + 3.5);
      doc.setTextColor(0);
    }
    y += altura;
  });
  rodape();
  return doc;
}

  d = Number(d);
  if (d < 0) return 'venceu há ' + (-d) + (d === -1 ? ' dia' : ' dias');
  if (d === 0) return 'vence hoje';
  return 'vence em ' + d + (d === 1 ? ' dia' : ' dias');
}

function rhAvisoSugerido(ini, val){

  return dias <= 40 ? 5 : dias <= 699 ? 15 : 30;
}

async function rhLerArquivoGrande(file){
  if (file.type === 'application/pdf'){
    if (file.size > 15 * 1024 * 1024) throw new Error('PDF grande demais (máx. 15 MB). Reduza o arquivo (ex.: "Imprimir como PDF" com qualidade menor).');
    const dados = await new Promise((ok, er) => { const fr = new FileReader(); fr.onload = () => ok(fr.result);
      fr.onerror = () => er(new Error('Não deu para ler o arquivo.')); fr.readAsDataURL(file); });
    return { mime:'application/pdf', dados };
  }
  return rhLerArquivo(file, 2200);
}

async function rhPdfEscaneado(file){
  try{
    if (file.type !== 'application/pdf') return true;
    const txt = new TextDecoder('latin1').decode(new Uint8Array(await file.arrayBuffer()));
    return !/\/Font\b/.test(txt);
  }catch(e){ return null; }
}

async function rhArqDoInput(inp, grande){
  const f = inp && inp.files && inp.files[0];
  if (!f) return null;
  const a = grande ? await rhLerArquivoGrande(f) : await rhLerArquivo(f, 2200);
  return { nome: f.name, mime: a.mime, conteudo: a.dados };
}

let _pdflib = null;

function carregarPdfLib(){
  if (_pdflib) return _pdflib;
  _pdflib = new Promise((ok, err) => {
    if (window.PDFLib) return ok(window.PDFLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = () => window.PDFLib ? ok(window.PDFLib) : err(new Error('A biblioteca de juntar PDF não inicializou.'));
    s.onerror = () => { _pdflib = null; err(new Error('Não consegui baixar a biblioteca de juntar PDF. Sem internet? Gere em ZIP.')); };
    document.head.appendChild(s);
  });
  return _pdflib;
}

function rhContarPainel(p){
  const velhas = (p.aguardando || []).filter(e => Number(e.dias_aguardando) > 2).length;
  const vencidos = (p.docs_vencendo || []).filter(x => Number(x.dias) < 0).length;
  // S44: as separadas (falta o "entreguei"), a devolução contestada e o que espera avaliação
  const contest = (p.devolucoes_pendentes || []).filter(x => x.status === 'contestada').length;
  return velhas + (p.nao_recebidas || []).length + (p.avisos || []).length + (p.pedidos || []).length
       + (p.duvidas_abertas || []).length + vencidos
       + (p.separadas || []).length + contest + (p.aguardando_avaliacao || []).length;
}

function rhAgrupado(lista, rotuloItem, botao){
  const g = {};
  (lista || []).forEach(x => { (g[x.usuario_id] = g[x.usuario_id] || { nome: x.funcionario, itens: [] }).itens.push(rotuloItem(x)); });
  return Object.entries(g).sort((a, b) => b[1].itens.length - a[1].itens.length || a[1].nome.localeCompare(b[1].nome))
    .map(([uid, v]) => '<div class="rhLin rhGrpLin"><details class="t"><summary><b>' + esc(v.nome) + '</b> — '
      + v.itens.length + (v.itens.length === 1 ? ' item' : ' itens') + '</summary><small>' + v.itens.map(esc).join(' · ')
      + '</small></details><span class="a">' + (botao ? botao(uid) : '')
      + '<button class="btn mini" type="button" data-ficha="' + esc(uid) + '">Abrir ficha</button></span></div>').join('');
}

async function rhPainel(corpo){
  const [p, lista] = await Promise.all([rpc('tf_rh_painel', {}), rpc('tf_rh_funcionarios', {})]);
  RH.painel = p; RH.lista = lista;
  contador('nRh', rhContarPainel(p) || '');
  // 1.2 do prompt: Catálogo de EPI e Textos e termo moram SÓ nas abas de cima;
  // aqui ficam as AÇÕES (o que o item 16 chama de atalhos) que não são aba.
  let h = '<div class="rhAtalhos">'
    + '<button class="btn pri" type="button" data-at="entrega">Nova entrega de EPI</button>'
    + '<button class="btn" type="button" data-at="entrada">Entrada de estoque</button>'
    + '<button class="btn" type="button" data-at="kit">Montar kit</button>'
    + '<button class="btn" type="button" data-at="lista">Nova lista de treinamento</button>'
    + '<button class="btn" type="button" data-at="func">Funcionários</button></div>';
  const sec = (tit, n, html, nota) => n ? '<div class="rhSec"><div class="rhSecT">' + tit + ' <span class="rhN">' + n
    + '</span>' + (nota ? '<span class="nota">' + nota + '</span>' : '') + '</div><div class="ccLista">' + html + '</div></div>' : '';
  let blocos = '';
  // 1 · documentos vencidos ou vencendo — S45: o documento da empresa pelo
  //     prazo de aviso DELE; ASO e treinamento continuam com 30 dias
  const dv = (p.docs_vencendo || []);
  blocos += sec('Documentos vencidos ou vencendo', dv.length, dv.map(x =>
    '<div class="rhLin' + (Number(x.dias) < 0 ? ' velha' : '') + '"><span class="t">' + rhSemaforo({ cor: rhCorDias(x.dias, x.aviso_dias) })
    + ' <b>' + esc(x.funcionario || 'Empresa') + '</b> — ' + esc(x.nome) + rhMarco(x.dias) + '<small>' + esc(rhDiasTxt(x.dias))
    + ' · validade ' + esc(dataBR(x.validade))
    + (x.tipo === 'doc_empresa' && x.aviso_dias != null ? ' · aviso ' + x.aviso_dias + ' dia(s) antes' : '') + '</small></span><span class="a">'
    + (x.usuario_id ? '<button class="btn mini" type="button" data-ficha="' + esc(x.usuario_id) + '">Abrir ficha</button>'
                    : '<button class="btn mini" type="button" data-aba="docs">Documentos da empresa</button>') + '</span></div>').join(''),
    'ASO e treinamento: 30 dias antes · documento da empresa: o prazo de aviso de cada um');
  // 2 · pedidos feitos pelo Field
  const pd = (p.pedidos || []);
  blocos += sec('Pedidos de EPI feitos pelo Field', pd.length, pd.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.funcionario) + '</b> — ' + esc(x.epi) + (x.tamanho ? ' (' + esc(x.tamanho) + ')' : '')
    + ' ×' + x.quantidade + '<small>' + esc(RH_MOT_PED[x.motivo] || x.motivo) + ' · pedido em ' + esc(rhDT(x.criado_em)) + '</small></span>'
    + '<span class="a"><button class="btn mini pri" type="button" data-separar="' + esc(x.id) + '">Separar</button></span></div>').join(''));
  // S44 · Q3 — separadas, falta deixar na mesa ("Entreguei")
  const sp = (p.separadas || []);
  blocos += sec('Separados — falta entregar', sp.length, sp.map(e =>
    '<div class="rhLin' + (Number(e.dias_separado) > 1 ? ' velha' : '') + '"><span class="t"><b>' + esc(e.funcionario) + '</b> — ' + esc(e.epi_nome)
    + ' ×' + e.quantidade + (e.tamanho ? ' (' + esc(e.tamanho) + ')' : '') + '<small>separado em ' + esc(rhDT(e.lancado_em))
    + (Number(e.dias_separado) > 0 ? ' · há ' + e.dias_separado + ' dia(s)' : '') + ' · o estoque já baixou · só aparece no celular dele depois do "Entreguei"</small></span>'
    + '<span class="a"><button class="btn mini pri" type="button" data-entreguei="' + esc(e.id) + '">Entreguei</button>'
    + '<button class="btn mini" type="button" data-cancelar="' + esc(e.id) + '">Cancelar</button></span></div>').join(''),
    'deixou na mesa? clique Entreguei');
  // 3 · entregas aguardando (as de +2 dias em vermelho), "não recebi", avisos
  const ag = (p.aguardando || []);
  blocos += sec('Entregas aguardando a confirmação do funcionário', ag.length, ag.map(e =>
    '<div class="rhLin' + (Number(e.dias_aguardando) > 2 ? ' velha' : '') + '" data-ent="' + esc(e.id) + '">'
    + '<span class="t"><b>' + esc(e.funcionario) + '</b> — ' + esc(e.epi_nome) + ' ×' + e.quantidade
    + (e.tamanho ? ' (' + esc(e.tamanho) + ')' : '') + '<small>' + (e.entregue_em ? 'entregue em ' + esc(rhDT(e.entregue_em)) : 'lançada em ' + esc(rhDT(e.lancado_em)))
    + ' · há ' + e.dias_aguardando + ' dia(s)' + (Number(e.dias_aguardando) > 2 ? ' — passou de 2 dias' : '')
    + (e.pedido_id ? ' · pedido pelo Field' : '') + '</small></span>'
    + '<span class="a">' + (e.celular ? '<a class="btn mini" target="_blank" rel="noopener" href="'
      + esc(rhWhats(e.celular, e.funcionario, e.epi_nome)) + '">WhatsApp</a>' : '<span class="nota" title="Cadastre o celular na ficha">sem celular</span>')
    + '<button class="btn mini" type="button" data-cancelar="' + esc(e.id) + '">Cancelar</button></span></div>').join(''));
  const nr = (p.nao_recebidas || []);
  blocos += sec('"Não recebi" — o funcionário diz que não chegou', nr.length, nr.map(e =>
    '<div class="rhLin velha"><span class="t"><b>' + esc(e.funcionario) + '</b> — ' + esc(e.epi_nome)
    + '<small>respondeu em ' + esc(rhDT(e.nao_recebido_em)) + (e.nao_recebido_obs ? ' · "' + esc(e.nao_recebido_obs) + '"' : '')
    + (e.estoque === 'estornado' ? ' · o item voltou ao estoque' : '')
    + '</small></span><span class="a"><button class="btn mini" type="button" data-cancelar="' + esc(e.id)
    + '">Cancelar a entrega</button><button class="btn mini" type="button" data-ficha="' + esc(e.usuario_id)
    + '">Abrir ficha</button></span></div>').join(''));
  // S44 · R4 — a devolução que espera o funcionário (ou que ele contestou)
  const dp = (p.devolucoes_pendentes || []);
  blocos += sec('Devolução de EPI aguardando o funcionário', dp.length, dp.map(x =>
    '<div class="rhLin' + (x.status === 'contestada' ? ' velha' : '') + '"><span class="t"><b>' + esc(x.funcionario) + '</b> — ' + esc(x.itens)
    + '<small>' + (x.status === 'contestada' ? 'NÃO CONCORDOU: "' + esc(x.contestado_obs || '') + '"'
      : 'registrada em ' + esc(rhDT(x.lancado_em)) + (Number(x.dias) > 0 ? ' · há ' + x.dias + ' dia(s)' : '') + (x.tem_pin ? '' : ' · ele ainda não tem PIN'))
    + (x.contexto === 'desligamento' ? ' · desligamento' : '') + '</small></span><span class="a">'
    + (x.status === 'aguardando' && x.celular ? '<a class="btn mini" target="_blank" rel="noopener" href="' + esc(rhWhatsDev(x.celular, x.funcionario, x.itens)) + '">WhatsApp</a>' : '')
    + '<button class="btn mini" type="button" data-devsem="' + esc(x.lote) + '">Sem a confirmação dele</button>'
    + '<button class="btn mini" type="button" data-devcanc="' + esc(x.lote) + '">Cancelar</button>'
    + '<button class="btn mini" type="button" data-ficha="' + esc(x.usuario_id) + '">Abrir ficha</button></span></div>').join(''));
  // S44 · R4 — item 7 do painel: devolvidos para reuso aguardando avaliação
  const aa = (p.aguardando_avaliacao || []);
  blocos += sec('Devolvidos para reuso aguardando avaliação', aa.length, aa.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.epi_nome) + (x.tamanho ? ' (' + esc(x.tamanho) + ')' : '') + '</b> — devolvido por ' + esc(x.funcionario)
    + '<small>' + esc([dataBR(x.data), x.fabricacao ? 'fab. ' + rhMes(x.fabricacao) : '', x.serie_lote ? 'série ' + x.serie_lote : '',
        x.sob_encomenda ? 'armação do óculos graduado' : ''].filter(Boolean).join(' · ')) + '</small></span>'
    + '<span class="a"><button class="btn mini pri" type="button" data-avaliar="' + esc(x.id) + '">Avaliar</button></span></div>').join(''),
    'aprovado volta ao estoque como reaproveitado');
  const av = (p.avisos || []);
  blocos += sec('Avisos do Field (tamanho, receita, devolução)', av.length, av.map(a =>
    '<div class="rhLin"><span class="t">' + esc(a.texto) + '<small>' + esc(rhDT(a.criado_em)) + '</small></span>'
    + '<span class="a"><button class="btn mini" type="button" data-ficha="' + esc(a.usuario_id) + '">Abrir ficha</button>'
    + '<button class="btn mini" type="button" data-visto="' + esc(a.id) + '">Visto</button></span></div>').join(''));
  // 5 · estoque abaixo do mínimo e o que ficou negativo
  const eb = (p.estoque_baixo || []), en = (p.estoque_negativo || []);
  blocos += sec('Estoque abaixo do mínimo', eb.length, eb.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.epi) + (x.tamanho ? ' ' + esc(x.tamanho) : '') + '</b><small>há '
    + x.saldo + ' · mínimo ' + x.minimo + '</small></span><span class="a"><button class="btn mini" type="button" data-aba="estoque">Estoque</button></span></div>').join(''));
  blocos += sec('Estoque NEGATIVO — a contagem não bate', en.length, en.map(x =>
    '<div class="rhLin velha"><span class="t"><b>' + esc(x.epi) + (x.tamanho ? ' ' + esc(x.tamanho) : '') + '</b><small>sistema: '
    + x.saldo + (x.condicao === 'reaproveitado' ? ' (reaproveitado)' : '') + ' — saiu mais do que o sistema tinha; conte a caixa</small></span>'
    + '<span class="a"><button class="btn mini" type="button" data-contar="1">Contagem</button></span></div>').join(''));
  // 6 · EPIs e treinamentos previstos ainda não cumpridos — AGRUPADOS por pessoa (1.3)
  const pp = (p.previstos_pendentes || []);
  const nPes = new Set(pp.map(x => x.usuario_id)).size;
  blocos += sec('EPIs previstos ainda sem entrega', pp.length,
    rhAgrupado(pp, x => x.epi, uid => '<button class="btn mini" type="button" data-entregar="' + esc(uid) + '">Lançar entrega</button>'),
    nPes + (nPes === 1 ? ' pessoa' : ' pessoas') + ' · quem tem mais pendências primeiro · toque no nome para ver os itens');
  const tp = (p.treinamentos_pendentes || []);
  blocos += sec('Treinamentos previstos sem registro', tp.length, rhAgrupado(tp, x => x.treinamento));
  const sa = (p.sem_aso || []);
  blocos += sec('Sem ASO registrado', sa.length, sa.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.funcionario) + '</b></span><span class="a"><button class="btn mini" type="button" data-ficha="'
    + esc(x.usuario_id) + '" data-fa="aso">Lançar ASO</button></span></div>').join(''));
  const lf = (p.limite_fabricante || []);
  blocos += sec('Limite do fabricante vencido ou vencendo em 60 dias', lf.length, lf.map(x =>
    '<div class="rhLin' + (x.limite_em <= isoHoje() ? ' velha' : '') + '"><span class="t"><b>' + esc(x.funcionario) + '</b> — '
    + esc(x.epi) + '<small>fabricado em ' + esc(rhMes(x.fabricacao)) + ' · limite ' + esc(rhMes(x.limite_em)) + '</small></span>'
    + '<span class="a"><button class="btn mini" type="button" data-entregar="' + esc(x.usuario_id) + '">Trocar</button></span></div>').join(''));
  // 8 · CA
  const ca = (p.ca_problema || []);
  blocos += sec('Catálogo: EPI sem CA ou com CA vencido', ca.length, ca.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.nome) + '</b><small>' + (x.problema === 'sem CA'
      ? 'sem CA — não pode ser entregue até preencher'
      : 'CA ' + esc(x.ca) + ' venceu em ' + esc(dataBR(x.ca_validade)) + ' — orienta a PRÓXIMA compra; o que foi comprado com CA válido segue em uso')
    + '</small></span><span class="a"><button class="btn mini" type="button" data-epi="' + esc(x.id) + '">Editar</button></span></div>').join(''));
  // 9 · admissões incompletas
  const ai = (p.admissoes_incompletas || []);
  blocos += sec('Admissões incompletas (checklist)', ai.length, ai.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.funcionario) + '</b> — ' + x.feitos + '/' + x.total
    + '<small>falta: ' + esc((x.falta || []).join(' · ')) + '</small></span><span class="a"><button class="btn mini" type="button" data-ficha="'
    + esc(x.usuario_id) + '" data-fa="adm">Abrir checklist</button></span></div>').join(''));
  // 10 · dúvidas
  const du = (p.duvidas_abertas || []);
  blocos += sec('Dúvidas enviadas pelo Field aguardando resposta', du.length, du.map(x =>
    '<div class="rhLin"><span class="t">"' + esc(x.pergunta) + '"<small>' + esc(x.autor || '?') + ' · ' + esc(rhDT(x.criada_em))
    + '</small></span><span class="a"><button class="btn mini" type="button" data-duvidas="1">Responder</button></span></div>').join(''));
  const pr = (p.presencas_pendentes || []);
  blocos += sec('Presença em treinamento ainda sem confirmação', pr.length, rhAgrupado(pr.map(x =>
    Object.assign({}, x, { rot: x.tema + ' de ' + dataBR(x.data) })), x => x.rot));
  const fi = (p.fichas_incompletas || []);
  blocos += sec('Fichas incompletas', fi.length, fi.map(x =>
    '<div class="rhLin"><span class="t"><b>' + esc(x.funcionario) + '</b><small>falta: ' + esc((x.falta || []).join(', ')) + '</small></span>'
    + '<span class="a"><button class="btn mini" type="button" data-ficha="' + esc(x.usuario_id) + '">Abrir ficha</button></span></div>').join(''));
  if (!blocos) blocos = '<div class="aviso ok">Nenhuma pendência.</div>';

  const ativos = (lista || []).filter(f => f.tem_ficha && f.situacao === 'ativo');
  const sem = (lista || []).filter(f => !f.tem_ficha && f.usuario_ativo).length;
  h += blocos + '<div class="rhSec"><div class="rhSecT">Visão por funcionário <span class="nota">🟢 em dia · 🟡 vencendo ou ficha incompleta · 🔴 pendente ou vencido'
    + (sem ? ' · ' + sem + ' usuário(s) sem ficha de RH' : '') + '</span></div><div class="rhGradeF">'
    + (ativos.length ? ativos.map(f => '<button type="button" class="rhCartao" data-ficha="' + esc(f.usuario_id) + '">'
      + rhSemaforo(f.semaforo) + '<b>' + esc(f.nome) + '</b><small>' + esc(f.funcao || f.perfil || '')
      + '</small><small class="mot">' + esc(((f.semaforo || {}).motivos || []).slice(0,2).join(' · ') || 'tudo em dia') + '</small></button>').join('')
      : '<p class="nota">Nenhuma ficha de RH aberta ainda. Comece em <b>Funcionários</b>.</p>')
    + '</div></div>';
  corpo.innerHTML = h;
  corpo.querySelectorAll('[data-at]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.at;
    if (k === 'entrega') return rhNovaEntrega(null);
    if (k === 'entrada') return rhEntradaEstoque(null, pintarRHSeguranca);
    if (k === 'lista') return rhNovaSessao(pintarRHSeguranca);
    if (k === 'kit'){ RH.aba = 'kit'; return pintarRHSeguranca(); }
    if (k === 'func') return irPara('rhf');
  }));
  corpo.querySelectorAll('[data-ficha]').forEach(b => b.addEventListener('click', () => {
    RH.sel = b.dataset.ficha; RH.fichaAba = b.dataset.fa || 'dados'; irPara('rhf');
  }));
  corpo.querySelectorAll('[data-aba]').forEach(b => b.addEventListener('click', () => { RH.aba = b.dataset.aba; pintarRHSeguranca(); }));
  corpo.querySelectorAll('[data-contar]').forEach(b => b.addEventListener('click', () => rhContagem(pintarRHSeguranca)));
  corpo.querySelectorAll('[data-duvidas]').forEach(b => b.addEventListener('click', () => { RH.aba = 'trein'; RH.trAba = 'duvidas'; pintarRHSeguranca(); }));
  corpo.querySelectorAll('[data-separar]').forEach(b => b.addEventListener('click', async () => {
    try{ const L = await rpc('tf_rh_pedidos', { p_status: 'pedido' });
         const x = L.find(y => y.id === b.dataset.separar); if (x) rhSepararPedido(x, pintarRHSeguranca); }
    catch(e){ toast(e.message, 'err'); }
  }));
  corpo.querySelectorAll('[data-entregar]').forEach(b => b.addEventListener('click', () => rhNovaEntrega(b.dataset.entregar)));
  corpo.querySelectorAll('[data-cancelar]').forEach(b => b.addEventListener('click', () => rhCancelar(b.dataset.cancelar, pintarRHSeguranca)));
  // S44
  corpo.querySelectorAll('[data-entreguei]').forEach(b => b.addEventListener('click', () => _semDuploEnvio_(b, () => rhEntreguei([b.dataset.entreguei], pintarRHSeguranca))));
  corpo.querySelectorAll('[data-devsem]').forEach(b => b.addEventListener('click', () => rhDevSemConfirmacao(b.dataset.devsem, pintarRHSeguranca)));
  corpo.querySelectorAll('[data-devcanc]').forEach(b => b.addEventListener('click', () => rhDevCancelar(b.dataset.devcanc, pintarRHSeguranca)));
  corpo.querySelectorAll('[data-avaliar]').forEach(b => b.addEventListener('click', () => rhAvaliarPorId(b.dataset.avaliar, pintarRHSeguranca)));
  corpo.querySelectorAll('[data-epi]').forEach(b => b.addEventListener('click', async () => {
    const r = await rpc('tf_rh_epis', {}); RH.epis = r.epis; RH.trein = r.treinamentos;
    rhEditarEpi(RH.epis.find(e => e.id === b.dataset.epi), pintarRHSeguranca);
  }));
  corpo.querySelectorAll('[data-visto]').forEach(b => b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
    try{ await rpc('tf_rh_aviso_visto', { p_id: b.dataset.visto }); pintarRHSeguranca(); }
    catch(e){ toast(e.message, 'err'); }
  })));
}

const RH_PED_FILTROS = [ ['pedido','Abertos'], ['separado','Separados'], ['recusado','Recusados'], ['cancelado','Cancelados pelo funcionário'] ];

async function rhPedidos(corpo){
  RH.pedFiltro = RH.pedFiltro || 'pedido';
  const L = await rpc('tf_rh_pedidos', { p_status: RH.pedFiltro });
  corpo.innerHTML = '<p class="nota" style="margin-top:0">O funcionário pede pelo Field (Minha Segurança › Pedir EPI), com o tamanho da ficha. '
    + 'Dois passos: <b>Separar</b> é pegar na caixa (o estoque baixa; sem saldo, não deixa); <b>Entreguei</b> é deixar na mesa dele — '
    + 'só aí a entrega aparece no celular para confirmar com o PIN, e só depois entra na ficha. O pedido sozinho não baixa nada.</p>'
    + '<div class="rhBarra"><div class="chips" id="rhPF"></div></div><div class="ccLista" id="rhPL"></div>';
  const f = document.getElementById('rhPF');
  RH_PED_FILTROS.forEach(([k, r]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'fchip' + (RH.pedFiltro === k ? ' on' : '');
    b.textContent = r; b.addEventListener('click', () => { RH.pedFiltro = k; pintarRHSeguranca(); }); f.appendChild(b);
  });
  const el = document.getElementById('rhPL');
  if (!L.length){ el.innerHTML = '<p class="nota" style="padding:12px">Nenhum pedido aqui.</p>'; return; }
  const ST = { pedido:'aguardando separar', separado:'separado', recusado:'recusado', cancelado:'cancelado' };
  L.forEach(x => {
    const d = document.createElement('div'); d.className = 'rhLin';
    const ctrlN = x.controlado_novo ?? x.controlado;
    const est = x.controlado ? 'estoque ' + (x.tamanho ? x.tamanho + ': ' : '') + x.saldo + (x.saldo_reap ? ' + ' + x.saldo_reap + ' reaproveitado(s)' : '')
                               + (ctrlN && x.saldo < x.quantidade && !(x.saldo_reap >= x.quantidade) ? ' — SEM SALDO para separar' : '')
                             : 'sem controle de estoque';
    d.innerHTML = '<span class="t"><span class="rhSt ' + (x.status === 'pedido' ? 'aguardando' : x.status === 'separado' ? 'confirmado' : 'cancelada')
      + '">' + esc(ST[x.status] || x.status) + '</span> <b>' + esc(x.funcionario) + '</b> — ' + esc(x.epi)
      + (x.tamanho ? ' (' + esc(x.tamanho) + ')' : '') + ' ×' + x.quantidade + '<small>' + esc([RH_MOT_PED[x.motivo] || x.motivo,
        'pedido em ' + rhDT(x.criado_em) + (x.status === 'pedido' ? ' (há ' + x.dias + ' dia(s))' : ''),
        x.observacao ? '"' + x.observacao + '"' : '',
        x.status === 'pedido' ? est : '',
        x.status === 'separado' ? 'separado por ' + (x.separado_por_nome || '?') + ' em ' + rhDT(x.separado_em)
          + (x.entregue_em ? ' · entregue em ' + rhDT(x.entregue_em) : '')
          + ' · ' + (RH_STATUS[x.entrega_status] || x.entrega_status || '') : '',
        x.encerrado_motivo && x.status !== 'separado' ? x.encerrado_motivo : ''].filter(Boolean).join(' · ')) + '</small></span><span class="a"></span>';
    const a = d.querySelector('.a');
    if (x.status === 'separado' && x.entrega_status === 'separado'){
      const be = document.createElement('button'); be.type = 'button'; be.className = 'btn mini pri'; be.textContent = 'Entreguei';

              catch(e){ document.getElementById('rhMsg').textContent = e.message; }

  });
}

async function rhSepararPedido(x, depois){

  abrirModal('Separar o pedido',
    '<p style="margin-top:0"><b>' + esc(x.funcionario) + '</b> pediu <b>' + esc(x.epi) + (x.tamanho ? ' ' + esc(x.tamanho) : '')
    + '</b> ×' + x.quantidade + ' — ' + esc(RH_MOT_PED[x.motivo] || x.motivo) + (x.observacao ? ' ("' + esc(x.observacao) + '")' : '') + '.</p>'

    + '<div class="campo"><label for="spQ">Quantidade</label><input id="spQ" type="number" min="1" max="10" value="' + x.quantidade + '"></div>'
    + '<div class="campo"><label for="spC">Condição</label><select id="spC"><option value="novo">Novo (' + (ctrlN ? x.saldo : 'sem controle') + ' em estoque)</option>'
    + '<option value="reaproveitado">Reaproveitado (' + (ctrlR ? x.saldo_reap : 'sem controle') + ')</option></select></div></div>'
    + (reap.length ? '<div class="campo" id="spUC" hidden><label for="spU">Unidade reaproveitada (avaliada)</label><select id="spU"><option value="">— sem escolher a unidade —</option>'
      + reap.map(u => '<option value="' + esc(u.devolucao_id) + '">' + esc(rhRotuloUnidade(u)) + '</option>').join('') + '</select></div>' : '')
    + (precisaFab ? '<div class="campo"><label for="spF">Fabricação (mês/ano, gravada na peça)</label><input id="spF" type="month"></div>' : '')
    + (x.pede_serie ? '<div class="campo"><label for="spS">Nº de série / lote</label><input id="spS" type="text" maxlength="60"></div>' : '')
    + '<p class="nota" id="spAv"></p>'
    + '<p class="nota">Separar é o <b>primeiro passo</b>: o estoque baixa agora. Quando deixar na mesa dele, clique <b>Entreguei</b> — '
    + 'só então a entrega aparece no celular para ele confirmar com o PIN.</p>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Voltar', onClick: fecharModal },
      { label:'Separar', pri:true, onClick: async () => {
          const g = id => document.getElementById(id);
          try{
            const r = await rpc('tf_rh_separar_pedido', { p_id: x.id, p_dados: {
              tamanho: g('spT') ? g('spT').value : null, quantidade: g('spQ').value, condicao: g('spC').value,
              devolucao_id: g('spU') && g('spC').value === 'reaproveitado' ? (g('spU').value || null) : null,
              fabricacao: g('spF') ? g('spF').value : null, serie_lote: g('spS') ? g('spS').value : null } });
            fecharModal(); contarRH();
            abrirModal('Separado da caixa',
              '<p style="margin-top:0"><b>' + esc(x.epi) + '</b> de <b>' + esc(x.funcionario) + '</b> saiu do estoque.</p>'
              + '<p>Ainda <b>não</b> aparece no celular dele. Quando deixar na mesa, clique <b>Entreguei</b> — aqui, no painel ou na aba Pedidos.</p>',
              [ { label:'Depois', onClick: () => { fecharModal(); depois && depois(); } },
                { label:'Entreguei agora', pri:true, onClick: () => { fecharModal(); rhEntreguei([r.entrega_id], depois); } } ]);
          }catch(e){ g('rhMsg').textContent = e.message; }
      } } ]);
  const acerta = () => {
    const g = id => document.getElementById(id);
    const cond = g('spC').value, q = Number(g('spQ').value || 1);
    if (g('spUC')) g('spUC').hidden = cond !== 'reaproveitado';
    const u = g('spU') && cond === 'reaproveitado' && g('spU').value ? reap.find(y => y.devolucao_id === g('spU').value) : null;
    if (u){ if (g('spF') && u.fabricacao && !g('spF').value) g('spF').value = String(u.fabricacao).slice(0,7);
            if (g('spS') && u.serie_lote && !g('spS').value) g('spS').value = u.serie_lote; }
    const ctrl = cond === 'reaproveitado' ? ctrlR : ctrlN, n = cond === 'reaproveitado' ? x.saldo_reap : x.saldo;

}

function rhWhatsDev(celular, nome, itens){
  if (!celular) return null;
  const campo = new URL('../field/', location.href).href;
  const txt = 'Olá, ' + String(nome || '').split(' ')[0] + '! Registramos a devolução dos seus EPIs no TapFlow: ' + itens
    + '. Abra o TapFlow Field (Minha Segurança), confira e confirme com o seu PIN. Se algo não confere, toque em "Não concordo". ' + campo;
  return 'https://wa.me/' + celular + '?text=' + encodeURIComponent(txt);
}

async function rhRegistrarDevolucao(uid, contexto, depois){
  let posse, f;
  try{ [posse, f] = await Promise.all([rpc('tf_rh_em_posse', { p_usuario: uid, p_todas: true }), rpc('tf_rh_funcionario', { p_usuario: uid })]); }
  catch(e){ toast(e.message, 'err'); return; }
  const desl = contexto === 'desligamento';
  const noSeu = posse.filter(x => x.em_posse), antigos = posse.filter(x => !x.em_posse);
  if (!posse.length){ toast('Nada com esta pessoa para devolver (nenhuma entrega confirmada sem devolução).', 'err'); return; }
  const linha = x => '<div class="rhDevL" data-e="' + esc(x.id) + '"><label class="chk" style="margin:0"><input type="checkbox" class="dvInc"'
    + ((desl && x.em_posse) ? ' checked' : '') + '> <b>' + esc(x.epi_nome) + (x.tamanho ? ' (' + esc(x.tamanho) + ')' : '') + '</b>'
    + (x.quantidade > 1 ? ' ×' + x.quantidade : '') + '<small>' + esc(['entregue em ' + dataBR(x.data_entrega), x.fabricacao ? 'fab. ' + rhMes(x.fabricacao) : '',
        x.serie_lote ? 'série ' + x.serie_lote : '', x.condicao === 'reaproveitado' ? 'reaproveitado' : ''].filter(Boolean).join(' · ')) + '</small></label>'
    + '<div class="rhDevOp" role="radiogroup" aria-label="Destino de ' + esc(x.epi_nome) + '">'
    + ['reuso','descarte','nao_devolvido'].map(k => '<label><input type="radio" name="dv_' + esc(x.id) + '" value="' + k + '"'
        + (k === x.destino_sugerido ? ' checked' : '') + (k === 'reuso' && x.destino_sugerido !== 'reuso' ? ' disabled' : '') + '> '
        + esc(RH_DESTINO_CURTO[k]) + '</label>').join('') + '</div></div>';
  abrirModal((desl ? 'Devolução no desligamento — ' : 'Registrar devolução — ') + f.usuario.nome,
    '<p style="margin-top:0">' + (desl ? 'Tudo o que está com ' + esc(f.usuario.nome.split(' ')[0]) + ' hoje. Marque o destino de cada item.'
        : 'Marque o que voltou e o destino.') + ' Voltam para <b>reuso</b> (só os reaproveitáveis): capacete — só o casco —, cinto paraquedista, '
    + 'abafador tipo concha, perneira de bidim e a armação do óculos graduado. O restante é descarte. O reuso passa por avaliação antes de voltar ao estoque.</p>'
    + '<div class="campo" style="max-width:220px"><label for="dvD">Data da devolução</label><input id="dvD" type="date" max="' + isoHoje() + '" value="' + isoHoje() + '"></div>'
    + (noSeu.length ? '<div class="secTit" style="margin-top:6px">Com a pessoa (' + noSeu.length + ')</div>' + noSeu.map(linha).join('')
                    : '<p class="nota">Nada em uso — só entregas antigas, já substituídas.</p>')
    + (antigos.length ? '<details style="margin-top:8px"><summary class="nota" style="cursor:pointer">Entregas antigas, já substituídas por uma mais nova ('
        + antigos.length + ') — marque só se voltaram</summary>' + antigos.map(linha).join('') + '</details>' : '')
    + '<div class="campo"><label for="dvO">Observação (opcional)</label><input id="dvO" type="text" maxlength="200"></div>'
    + '<p class="nota">A devolução vai para o celular dele confirmar com o PIN. A data entra na ficha de EPI depois da confirmação '
    + '(ou quando o RH registrar "sem a confirmação dele").</p>'
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Registrar e pedir a confirmação', pri:true, onClick: async () => {
          const itens = [];
          document.querySelectorAll('.rhDevL').forEach(d => {
            if (!d.querySelector('.dvInc').checked) return;
            const r = d.querySelector('input[type=radio]:checked');
            itens.push({ entrega_id: d.dataset.e, destino: r ? r.value : null });
          });
          const msg = document.getElementById('rhMsg');
          if (!itens.length){ msg.textContent = 'Marque ao menos um item.'; return; }
          if (desl && itens.filter(i => noSeu.some(x => x.id === i.entrega_id)).length < noSeu.length){
            msg.textContent = 'No desligamento, todo item que está com a pessoa precisa de destino (mesmo que "não devolvido").'; return;
          }
          try{
            const r = await rpc('tf_rh_registrar_devolucao', { p_usuario: uid, p_dados: { contexto, data: document.getElementById('dvD').value,
              observacao: document.getElementById('dvO').value, itens } });
            fecharModal(); contarRH();
            const w = rhWhatsDev(r.celular, r.funcionario, r.itens);
            abrirModal('Devolução registrada',
              '<p style="margin-top:0"><b>' + r.n + ' item(ns)</b>: ' + esc(r.itens) + '.</p>'
              + '<p>Agora é com <b>' + esc(r.funcionario) + '</b>: abrir o <b>TapFlow Field › Minha Segurança</b> e confirmar com o PIN.</p>'
              + (r.tem_pin ? '' : '<div class="aviso">Ele ainda não tem PIN. Se não for criar, use <b>"Sem a confirmação dele"</b> (no painel ou na aba Devoluções).</div>')
              + (w ? '<p><a class="btn pri" target="_blank" rel="noopener" href="' + esc(w) + '">Avisar pelo WhatsApp</a></p>' : ''),
              [ { label:'Fechar', onClick: () => { fecharModal(); depois && depois(); } } ]);
          }catch(e){ msg.textContent = e.message; }
      } } ]);
  rhModalLargo();
}

function rhChecklistAval(d){
  const n = String(d.epi_nome || '').toLowerCase();
  if (d.sob_encomenda) return ['Hastes e dobradiças íntegras', 'Proteções laterais presentes', 'Higienizada',
                               'A lente vai para descarte (encomendar só as lentes novas)'];
  if (n.includes('capacete')) return ['Casco sem trinca, deformação ou desgaste', 'Casco higienizado',
                                      'Suspensão e jugular antigas descartadas (vai suspensão nova)'];
  if (n.includes('cinto')) return ['Costuras íntegras', 'Fitas sem corte, desfiado ou queimadura',
                                   'Fivelas e argolas sem trinca ou ferrugem', 'Etiqueta legível (CA, fabricação, série)'];
  if (n.includes('abafador')) return ['Conchas e haste íntegras', 'Kit higiene (almofadas) trocado', 'Higienizado'];
  if (n.includes('perneira')) return ['Higienizada', 'Sem rasgo; fechos funcionando'];
  return ['Íntegro', 'Higienizado'];
}
