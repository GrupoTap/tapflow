// ITEM 4 (S28) — O GERADOR DE DOCUMENTO NO NEGÓCIO
// ----------------------------------------------------------------------------
// O documento sai de uma proposta JÁ REGISTRADA ("Montar uma proposta"). Esta
// tela não pede número: número, versão e itens já foram decididos no registro
// — é o que impede a terceira regra de numeração que o documento temia.
// Mesmo motor do gerador da OS (modelos, tabela, logomarca); os dados do
// cliente vêm do negócio, e a tabela vem dos itens da proposta, na ordem.
async function montarGeradorNegocio(caixa, n, props){
  const elegiveis = (props || []).filter(p => !p.os_id
    && p.status !== 'vencida' && p.status !== 'reprovada');
  if (!n.cliente_id){
    caixa.innerHTML = '<p class="nota">O documento leva os dados do cadastro do cliente. '
      + 'Transforme o lead em cliente (aba Cliente) e monte a proposta abaixo.</p>';
    return;
  }
  if (!elegiveis.length){
    caixa.innerHTML = '<p class="nota">O documento sai de uma proposta registrada. Monte a '
      + 'proposta abaixo — depois é só voltar aqui e gerar o .docx.</p>';
    return;
  }
  const est = { prop: elegiveis[0], modelo: null, valores: null, itens: [], total: 0,
                logos: 0, logoCli: undefined, porLogo: true };

  caixa.innerHTML =
      '<div class="gerNeg">'
    + '<div class="dupla"><div class="campo"><label for="gnP">Proposta</label><select id="gnP"></select></div>'
    + '<div class="campo"><label for="gnM">Modelo</label><select id="gnM"></select></div></div>'
    + '<div class="dica" id="gnMd" style="margin:-8px 0 10px"></div>'
    + '<div class="campo"><label for="gnNat">Natureza do serviço</label>'
    + '<input id="gnNat" type="text" autocomplete="off" name="gnn_nofill"></div>'
    + '<div id="gnVals"></div><div id="gnTab"></div><div id="gnPlanos"></div><div id="gnLogo"></div><div id="gnAnexo"></div>'
    + '<button class="btn pri" id="gnOk" type="button" style="width:100%;padding:10px">Gerar e baixar o .docx</button>'
    + '<div class="dica" id="gnMsg" style="margin-top:8px"></div></div>';

  const selP = document.getElementById('gnP');
  selP.innerHTML = elegiveis.map(p => '<option value="' + esc(p.id) + '">'
    // ITEM 8 (S29): o valor saiu do texto — o menu escolhe QUAL proposta, e
    // o valor que vai no papel é o da tabela abaixo
    + esc((p.numero_exibicao || rotuloProposta(p.numero, p.versao)) + ' · ' + p.status
          + (p.documentos ? ' · documento já gerado' : '')) + '</option>').join('');
  const sel = document.getElementById('gnM');
  let modelos = [];
  try{ modelos = await listarModelos(); }
  catch(e){ caixa.innerHTML = '<p class="dica">Não consegui ler os modelos: ' + esc(e.message) + '</p>'; return; }
  if (!modelos.length){
    caixa.innerHTML = '<p class="dica">Nenhum modelo cadastrado. Rode o <b>23_gerador_modelos.sql</b> '
      + 'e suba os .docx no bucket <b>modelos</b>.</p>';
    return;
  }
  sel.innerHTML = modelos.map(m => '<option value="' + m.id + '">' + esc(m.titulo) + '</option>').join('');
  document.getElementById('gnNat').value = n.titulo || '';

  const pintarValores = () => {
    const el = document.getElementById('gnVals');
    const v = est.valores || {};
    const faltando = CHAVES_CRITICAS.filter(k => !String(v[k]||'').trim());
    el.innerHTML = '<div class="gerCaixa"><div class="gerCaixaT">Dados que vão no documento</div>'
      + '<div class="gGrid"></div>'
      + (faltando.length ? '<p class="gFalta">Vazio: ' + faltando.map(k => ROTULO_CHAVE[k]||k).join(', ')
          + '. Preencha aqui para esta proposta, e corrija no cadastro do cliente depois.</p>' : '')
      + '</div>';
    const g = el.querySelector('.gGrid');
    CHAVES_NA_TELA.forEach(k => {
      const d = document.createElement('div'); d.className = 'campo'; d.style.margin = '0';
      d.innerHTML = '<label></label><input type="text">';
      d.querySelector('label').textContent = ROTULO_CHAVE[k] || k;
      const i = d.querySelector('input');
      i.value = v[k] || '';
      if (!String(v[k]||'').trim() && CHAVES_CRITICAS.includes(k)) i.classList.add('vazio');
      i.addEventListener('input', () => { est.valores[k] = i.value; });
      g.appendChild(d);
    });
  };
  const pintarTabela = () => {
    const el = document.getElementById('gnTab');
    const m = est.modelo;
    if (!m || !m.tem_tabela){
      el.innerHTML = '<p class="dica" style="margin:0 0 14px">' + (m && m.e_contrato
        ? 'Minuta de contrato: sem tabela de itens.'
        : 'Este modelo não tem a tabela de 5 colunas — os valores são ajustados no Word.') + '</p>';
      return;
    }
    el.innerHTML = '<div style="overflow-x:auto;margin:0 0 14px"><table class="tbl"><thead><tr>'
      + '<th>#</th><th>Item — na ordem da proposta</th><th class="num">Qtd</th><th class="num">Unitário</th>'
      + '<th class="num">Total</th></tr></thead><tbody></tbody><tfoot><tr><td colspan="4" '
      + 'style="text-align:right;font-weight:700">Total</td><td class="num" style="font-weight:700"></td>'
      + '</tr></tfoot></table></div>';
    const tb = el.querySelector('tbody');
    est.itens.forEach((it, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="mono"></td><td></td><td class="num"></td><td class="num"></td><td class="num"></td>';
      [i + 1, it.descricao, it.qtd, it.unitario, it.total].forEach((x, k) => tr.children[k].textContent = x);
      tb.appendChild(tr);
    });
    el.querySelector('tfoot .num').textContent = BRL(est.total);
  };
  const pintarLogo = () => {
    const el = document.getElementById('gnLogo');
    if (!el) return;
    el.innerHTML = htmlLogoGerador(est, 'gnLogoX');
    const c = document.getElementById('gnLogoX');
    if (c) c.addEventListener('change', () => { est.porLogo = c.checked; });
  };

  // ── S38 · item 2: o anexo por vaso ──
  const pintarAnexo = () => {
    const el = document.getElementById('gnAnexo');
    if (!el) return;
    el.innerHTML = htmlAnexoGerador(est, 'gnAnexoX');
    const c = document.getElementById('gnAnexoX');
    if (c) c.addEventListener('change', () => { est.porAnexo = c.checked; });
  };

  const trocar = async () => {
    est.prop = elegiveis.find(p => p.id === selP.value) || elegiveis[0];
    est.modelo = modelos.find(m => m.id === sel.value);
    document.getElementById('gnMd').textContent = (est.modelo && est.modelo.descricao) || '';
    const nat = document.getElementById('gnNat').value.trim();
    try{
      const [v, itens] = await Promise.all([
        rpc('tf_valores_proposta_doc', { p_proposta_id: est.prop.id, p_natureza: nat || null }),
        rpc('tf_itens_proposta_doc',   { p_proposta_id: est.prop.id })
      ]);
      est.valores = v || {}; est.itens = itens || [];
      est.total = est.itens.reduce((s, i) => s + (Number(i.valor_total_num) || 0), 0);
    }catch(e){ toast('Não consegui montar os dados: ' + e.message, 'err'); est.valores = est.valores || {}; }
    pintarValores(); pintarTabela();
    est.anexo = undefined; pintarAnexo();
    est.anexo = await carregarAnexoVasos({ p_proposta_id: est.prop.id }); pintarAnexo();
    est.logos = 0; pintarLogo();
    est.temPlanos = false; est.idxPlano = 0;
    pintarPlanosGerador(document.getElementById('gnPlanos'), est, 'gnPlanoL');
    try{
      const path = est.modelo.storage_path || (est.modelo.id + '.docx');
      const b = await baixarModelo(path);
      est.logos = await logoDeClienteNoModelo(b);
      if (est.modelo.tem_tabela && await planosNoModelo(path, b)){
        est.planosPar = await carregarPlanos();
        est.temPlanos = true;
        est.idxPlano = linhaDoPlano(est.itens, est.planosPar);
      }
    }catch(e){ /* o erro de verdade aparece ao gerar */ }
    pintarLogo();
    pintarPlanosGerador(document.getElementById('gnPlanos'), est, 'gnPlanoL');
    if (est.logos && est.logoCli === undefined){
      est.logoCli = await prepararLogoCliente(n.cliente_id).catch(() => null);
      pintarLogo();
    }
  };
  sel.addEventListener('change', trocar);
  selP.addEventListener('change', trocar);
  document.getElementById('gnNat').addEventListener('change', () => {
    if (!est.valores) return;
    const nat = document.getElementById('gnNat').value.trim();
    est.valores['TítuloNatureza'] = nat; est.valores['Natureza_do_Serviço'] = nat;
  });
  await trocar();

  document.getElementById('gnOk').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const msg = document.getElementById('gnMsg');
      if (!est.modelo || !est.valores) return;
      msg.style.color = ''; msg.textContent = 'Baixando o modelo…';
      try{
        const bytes = await baixarModelo(est.modelo.storage_path || (est.modelo.id + '.docx'));
        msg.textContent = 'Montando o documento…';
        const usaItens = est.modelo.tem_tabela && est.itens.length;
        const planos = usaItens ? planosParaGerar(est) : null;
        const { blob, faltaram, logosPostas, planosEscritos, anexoVasos } = await docxGerar({
          bytes, valores: est.valores,
          tabela: usaItens ? est.itens : null,
          totalTexto: BRL(est.total).replace(/\u00a0/g,' '),
          tirarLogoCliente: true,
          logoCliente: est.porLogo !== false ? est.logoCli : null,
          planos,
          anexo: anexoParaGerar(est)
        });
        const rot = est.valores['Nº_da_Proposta'] || est.prop.numero;
        const natu = document.getElementById('gnNat').value.trim();
        const nome = nomeSeguro(rot + ' - ' + (est.valores['Cliente'] || 'Cliente')
          + ' - ' + (natu || est.modelo.titulo)) + '.docx';
        baixarBlob(blob, nome);
        msg.textContent = 'Registrando…';
        await rpc('tf_registrar_documento_proposta', {
          p_proposta_id: est.prop.id, p_modelo_id: est.modelo.id, p_valores: est.valores,
          // o registro guarda a tabela do PADRÃO, como saiu no papel
          p_itens: usaItens ? (planos ? planos.padrao.linhas : est.itens) : null,
          p_valor_total: usaItens ? est.total : null,
          p_nome_arquivo: nome, p_natureza: natu || null });
        toast('Documento da proposta ' + rot + ' gerado.', 'ok');
        _msgGerNeg = rot + ' gerada e baixada.'
          + (planosEscritos ? ' Os três planos preenchidos (Básico, Padrão e Premium).' : '')
          + (anexoVasos ? ' Anexo por vaso no fim (' + anexoVasos + ' vaso(s)).' : '')
          + (logosPostas ? ' Logomarca do cliente no cabeçalho.' : '')
          + (faltaram.length ? ' ⚠ Ficaram sem valor no papel: ' + faltaram.join(', ') + '.' : '')
          + ' Confira o arquivo e use "Registrar envio" quando mandar ao cliente.';
        negPropostas(n, document.getElementById('dBody'));
      }catch(e){
        msg.style.color = 'var(--crit)'; msg.textContent = e.message;
      }
    });
  });
  if (_msgGerNeg){
    const m = document.getElementById('gnMsg');
    m.style.color = 'var(--ok)'; m.textContent = _msgGerNeg; _msgGerNeg = null;
  }
}
let _msgGerNeg = null;
let _gerNegAberto = null;   // o gerador continua aberto depois de repintar a aba



// ════════════════════════════════════════════════════════════════════════════
// DESCONTO GERAL — %, R$ OU VALOR FINAL
// Item 3 do S28; itens 6 e 7 do S31 (17/09) refizeram a conta por dentro.
// ----------------------------------------------------------------------------
// O cliente negocia em reais ("fecha por R$ 500?", "me dá R$ 50?"), e o campo
// só aceitava percentual. São três caminhos para o MESMO número: o percentual
// por item (`desconto_pct`) continua sendo a fonte única.
//
// ── O QUE MUDOU NO S31, E POR QUÊ ──────────────────────────────────────────
//
// ITEM 7 · A BASE ERA O PREÇO CHEIO. A caixa dizia "Total atual: R$ 600,00"
// numa proposta cuja linha já tinha 25% e valia R$ 450,00 — o total real,
// aliás impresso duas linhas acima, na própria tela. Pior que o rótulo: o
// desconto de R$ 50,00 era calculado sobre os 600 e SUBSTITUÍA o desconto da
// linha, devolvendo ≈ R$ 550,00 onde o Bruno esperava R$ 400,00.
//   Agora a base é o total ATUAL (já com o desconto de cada linha), e o
//   desconto geral ACUMULA sobre ele: R$ 450,00 − R$ 50,00 = R$ 400,00. Cada
//   linha encolhe na mesma proporção, então quem tinha desconto próprio
//   continua com mais desconto que os vizinhos — o que não acontecia quando
//   todas eram igualadas no mesmo percentual.
//
// ITEM 6 · O CENTAVO. "Desconto em R$: 50" sobre R$ 600,00 devolvia R$ 49,98.
// O documento atribuiu isso a arredondamento em cascata na tela; não era. A
// tela já calculava com o valor exato e já AVISAVA na prévia ("com o
// percentual em duas casas, o desconto fica R$ 49,98"). O arredondamento
// estava na COLUNA: `desconto_pct numeric(5,2)` não guarda 8,3333…%, e sobre
// uma linha de R$ 600,00 o passo do percentual vale 6 centavos — R$ 550,00
// era inalcançável. O `52_ajustes_s31.sql` levou a coluna para quatro casas;
// esta tela passou a distribuir o valor exato entre as linhas e a devolver o
// centavo que sobra para a maior delas.
//
// O resto do desenho continua: os três em caixas separadas, com a palavra que
// os distingue em destaque (SAI / FECHAR); a prévia mostra os três números
// ANTES de aplicar; aplicar é um clique à parte; acima de 30% pergunta de novo.
const DESC_ALERTA_PCT = 30;

function _numBR(v){
  let s = String(v == null ? '' : v).trim().replace(/[R$\s]/g, '');
  if (!s) return null;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
const _c2 = n => Math.round(n * 100) / 100;                 // centavos inteiros
const _pctBR = p => (Math.round(p * 100) / 100).toLocaleString('pt-BR',
  { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + '%';
/** O percentual como ele vai para o campo da linha: até 4 casas, sem zero à
 *  toa. 8,3333 aparece inteiro; 25 aparece como 25. */
const _descCurto = p => {
  const n = Math.round(Number(p) * 10000) / 10000;
  return String(n);
};

/** cfg: { id, linhas: () => [{preco, qtd, desc}], aplicar: async pcts => {} }
 *  `aplicar` recebe um ARRAY alinhado com `linhas()`: o percentual novo de
 *  cada linha, ou null nas que ficam de fora (sem preço ou sem quantidade).
 *  Até o S30 recebia um percentual só, igual para todas — o que era a própria
 *  causa do item 7. Devolve { atualizar } para a tela chamar quando as linhas
 *  mudarem. */
function montarDescontoGeral(alvo, cfg){
  const P = cfg.id;
  alvo.innerHTML =
      '<div class="descG">'
    + '<div class="descGTit">Desconto geral <span>— preencha <b>um</b> dos três; os outros dois se calculam</span></div>'
    + '<div class="descGGrade">'
    +   '<div class="descGCx pct"><label for="' + P + 'Pct">Desconto em percentual</label>'
    +     '<small>sobre o total <b>atual</b> da proposta</small>'
    +     '<div class="descGInp"><input id="' + P + 'Pct" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 3"><span>%</span></div></div>'
    +   '<div class="descGCx sai"><label for="' + P + 'Rs">Desconto em R$</label>'
    +     '<small>quanto <b>SAI</b> do total atual</small>'
    +     '<div class="descGInp"><span>− R$</span><input id="' + P + 'Rs" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 50,00"></div></div>'
    +   '<div class="descGCx fica"><label for="' + P + 'Fim">Valor final da proposta</label>'
    +     '<small>quanto a proposta deve <b>FECHAR</b></small>'
    +     '<div class="descGInp"><span>= R$</span><input id="' + P + 'Fim" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 500,00"></div></div>'
    + '</div>'
    + '<div class="descGPrev" id="' + P + 'Prev" aria-live="polite"></div>'
    + '<button class="btn" type="button" id="' + P + 'Ok" disabled>Aplicar em todas as linhas</button>'
    + '<button class="btn mini" type="button" id="' + P + 'Zero" hidden '
    +   'style="margin-left:0;margin-top:8px">Tirar todos os descontos</button>'
    + '</div>';

  const $ = s => document.getElementById(P + s);
  const campos = { Pct: $('Pct'), Rs: $('Rs'), Fim: $('Fim') };
  let alvoTotal = null;   // quanto a proposta deve fechar (o número exato pedido)
  let origem = null;      // qual dos três campos foi preenchido

  /** As linhas que entram na conta, com o total de cada uma como o banco o
   *  calcula (`round(preco*qtd*(1-desc/100), 2)`). Se as duas contas
   *  divergirem, a tela mente sobre o que vai ser gravado. */
  const conta = () => {
    const todas = cfg.linhas();
    const ls = [];
    todas.forEach((l, i) => {
      const preco = Number(l.preco) || 0, qtd = Number(l.qtd) || 0;
      if (preco > 0 && qtd > 0)
        ls.push({ i, bruto: _c2(preco * qtd),
                  total: _c2(preco * qtd * (1 - (Number(l.desc) || 0) / 100)),
                  desc: Number(l.desc) || 0 });
    });
    return { n: todas.length, ls,
             bruto: _c2(ls.reduce((s, l) => s + l.bruto, 0)),
             atual: _c2(ls.reduce((s, l) => s + l.total, 0)),
             semPreco: todas.length - ls.length,
             comDesconto: ls.filter(l => l.desc > 0).length };
  };

  /** Distribui o total pedido entre as linhas, proporcionalmente ao que cada
   *  uma vale HOJE, e devolve o percentual de cada uma com quatro casas.
   *  O centavo que sobra da divisão vai para a maior linha — em algum lugar
   *  ele tem que cair, e na maior é onde menos distorce. */
  const distribuir = (c, N) => {
    const f = c.atual > 0 ? N / c.atual : 0;
    const alvos = c.ls.map(l => _c2(l.total * f));
    let sobra = _c2(N - alvos.reduce((s, v) => s + v, 0));
    if (Math.abs(sobra) >= 0.005 && alvos.length){
      let maior = 0;
      c.ls.forEach((l, k) => { if (l.total > c.ls[maior].total) maior = k; });
      alvos[maior] = _c2(Math.min(c.ls[maior].bruto, Math.max(0, alvos[maior] + sobra)));
    }
    // O percentual de uma linha, dado o total que ela deve ter. Duas coisas
    // acontecem aqui, e as duas por causa do item 6:
    //   · o percentual tem quatro casas (é o que a coluna guarda desde o S31),
    //     e entre o "para baixo" e o "para cima" ganha o que chega mais perto
    //     do centavo pedido — arredondar sempre para o mais próximo erra por
    //     um centavo em linha grande;
    //   · entre dois percentuais que dão O MESMO centavo, ganha o mais
    //     simples. "3%" sobre R$ 1.234,56 dá exatamente o mesmo total que
    //     3,0003%, e ninguém que digitou 3 quer ver 3,0003 gravado na linha.
    const pctPara = (bruto, alvo) => {
      if (!(bruto > 0)) return 0;
      const ex = (1 - alvo / bruto) * 100;
      // `Number(q.toFixed(4))` não é estética: a coluna tem QUATRO casas e
      // arredonda o que passar disso. Mandar 33.333299999999994 faria o banco
      // gravar outro número do que esta tela mostrou.
      const cand = [Math.floor(ex * 10000) / 10000, Math.ceil(ex * 10000) / 10000,
                    Math.round(ex), Math.round(ex * 10) / 10, Math.round(ex * 100) / 100]
        .map(q => Number(q.toFixed(4)))
        .filter(q => q >= 0 && q <= 100);
      let melhor = 0, erro = Infinity;
      cand.forEach(q => {
        const e = Math.abs(_c2(bruto * (1 - q / 100)) - alvo);
        // empate: fica com o percentual de menos casas (o texto mais curto)
        if (e < erro - 1e-9 || (Math.abs(e - erro) < 1e-9 && String(q).length < String(melhor).length)){
          erro = e; melhor = q;
        }
      });
      return melhor;
    };

    const pcts = new Array(c.n).fill(null);
    let reais = c.ls.map((l, k) => {
      const p = pctPara(l.bruto, alvos[k]);
      pcts[l.i] = p;
      return _c2(l.bruto * (1 - p / 100));    // o que o banco vai gravar
    });
    // Sobrou centavo depois de tudo? Ele cabe numa linha só — e a linha certa
    // é a MENOR, não a maior. Com quatro casas, dois percentuais vizinhos
    // mudam o total de uma linha em 0,000001 do valor dela: numa linha de
    // R$ 15.000 isso já é um centavo e meio, e nenhum percentual acerta o
    // centavo pedido. Numa linha de R$ 2.000 o passo vale 0,2 centavo e
    // sempre acerta. Por isso a correção desce da menor para a maior e para
    // na primeira que fecha.
    let real = _c2(reais.reduce((s, v) => s + v, 0));
    if (Math.abs(real - N) >= 0.005 && c.ls.length){
      const ordem = c.ls.map((l, k) => k).sort((a, b) => c.ls[a].bruto - c.ls[b].bruto);
      for (const k of ordem){
        const alvo2 = _c2(Math.min(c.ls[k].bruto, Math.max(0, reais[k] + (N - real))));
        const p2 = pctPara(c.ls[k].bruto, alvo2);
        const novo = _c2(c.ls[k].bruto * (1 - p2 / 100));
        const depois = _c2(real - reais[k] + novo);
        if (Math.abs(depois - N) < Math.abs(real - N)){
          pcts[c.ls[k].i] = p2; reais[k] = novo; real = depois;
        }
        if (Math.abs(real - N) < 0.005) break;
      }
    }
    return { pcts, real };
  };

  const prever = () => {
    const pv = $('Prev'), ok = $('Ok'), zero = $('Zero');
    const c = conta();
    ok.disabled = true; ok.classList.remove('pri');
    zero.hidden = !c.comDesconto;

    if (!c.ls.length){
      pv.className = 'descGPrev'; pv.textContent = 'Ponha preço nas linhas para calcular o desconto.';
      return;
    }
    if (alvoTotal === null){
      pv.className = 'descGPrev';
      pv.textContent = (c.comDesconto
          ? 'Total atual: ' + BRL(c.atual) + ' (sem desconto seriam ' + BRL(c.bruto) + '). '
          : 'Total atual: ' + BRL(c.atual) + '. ')
        + 'O desconto geral sai daqui. Nada muda até você clicar em "Aplicar".';
      return;
    }
    if (isNaN(alvoTotal) || alvoTotal < 0 || alvoTotal > c.atual){
      pv.className = 'descGPrev erro';
      pv.textContent = origem === 'Fim' && alvoTotal > c.atual
        ? 'O valor final (' + BRL(alvoTotal) + ') é MAIOR que o total atual ('
          + BRL(c.atual) + ') — isso não é desconto.'
        : 'Esse desconto não cabe: ele precisa ficar entre zero e o total atual da proposta ('
          + BRL(c.atual) + ').';
      return;
    }

    const d = distribuir(c, alvoTotal);
    const sai  = _c2(c.atual - d.real);
    const pctG = c.atual > 0 ? (sai / c.atual) * 100 : 0;
    const alto = pctG > DESC_ALERTA_PCT;
    pv.className = 'descGPrev' + (alto ? ' alto' : ' pronto');
    pv.innerHTML = '<span>Total atual: <b></b></span><span class="seta">→</span>'
      + '<span>Desconto: <b class="s"></b></span><span class="seta">→</span>'
      + '<span>Novo total: <b class="n"></b></span>'
      + '<div class="descGNotas"></div>';
    pv.querySelector('b').textContent = BRL(c.atual);
    pv.querySelector('b.s').textContent = '− ' + BRL(sai) + ' (' + _pctBR(pctG) + ')';
    pv.querySelector('b.n').textContent = BRL(d.real);

    const notas = [];
    if (c.comDesconto)
      notas.push('A base é o total atual, ' + BRL(c.atual) + ' — o preço cheio soma '
        + BRL(c.bruto) + ', e o desconto que já existe nas linhas continua valendo.');
    if (Math.abs(d.real - alvoTotal) >= 0.005)
      notas.push('O total possível mais próximo é ' + BRL(d.real) + ', '
        + BRL(Math.abs(d.real - alvoTotal)) + (d.real > alvoTotal ? ' acima' : ' abaixo')
        + ' do que você pediu.');
    if (c.semPreco) notas.push(c.semPreco + ' linha(s) sem preço ficam fora da conta.');
    if (alto) notas.push('Desconto acima de ' + DESC_ALERTA_PCT + '%. Confira se o valor foi digitado no campo certo.');
    pv.querySelector('.descGNotas').textContent = notas.join(' ');
    ok.disabled = false; ok.classList.add('pri');
    ok.textContent = 'Aplicar − ' + BRL(sai) + ' nas ' + c.ls.length + ' linha(s)';
  };

  /** Digitou num campo: o valor DELE é o exato; os outros dois viram leitura.
   *  Era aqui que o documento achava que morava o defeito — e é aqui que a
   *  regra fica explícita: o número que manda é o que a pessoa digitou. */
  const ao = (k) => () => {
    const c = conta();
    const v = _numBR(campos[k].value);
    origem = k;
    Object.keys(campos).forEach(o => campos[o].classList.toggle('calc', o !== k && v !== null));
    if (v === null){
      alvoTotal = null;
      Object.keys(campos).forEach(o => { if (o !== k) campos[o].value = ''; campos[o].classList.remove('calc'); });
      return prever();
    }
    if (isNaN(v) || c.atual <= 0){ alvoTotal = NaN; return prever(); }
    if (k === 'Pct') alvoTotal = _c2(c.atual * (1 - v / 100));
    if (k === 'Rs')  alvoTotal = _c2(c.atual - v);
    if (k === 'Fim') alvoTotal = _c2(v);

    if (alvoTotal >= 0 && alvoTotal <= c.atual){
      // os campos calculados mostram o que vai SAIR, já com a conta do banco
      const d = distribuir(c, alvoTotal);
      const fmt = x => x.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const pctG = c.atual > 0 ? (c.atual - d.real) / c.atual * 100 : 0;
      if (k !== 'Pct') campos.Pct.value = String(Math.round(pctG * 100) / 100).replace('.', ',');
      if (k !== 'Rs')  campos.Rs.value  = fmt(_c2(c.atual - d.real));
      if (k !== 'Fim') campos.Fim.value = fmt(d.real);
    }
    prever();
  };
  Object.keys(campos).forEach(k => campos[k].addEventListener('input', ao(k)));

  const limpar = () => {
    Object.values(campos).forEach(c => { c.value = ''; c.classList.remove('calc'); });
    alvoTotal = null; origem = null;
    prever();
  };

  $('Ok').addEventListener('click', function(){
    if (alvoTotal === null || isNaN(alvoTotal)) return;
    const c = conta();
    const d = distribuir(c, alvoTotal);
    const sai = _c2(c.atual - d.real);
    const pctG = c.atual > 0 ? (sai / c.atual) * 100 : 0;
    const vai = async () => { await cfg.aplicar(d.pcts); limpar(); };
    if (pctG > DESC_ALERTA_PCT){
      abrirModal('Desconto de ' + _pctBR(pctG) + '?',
          '<div class="aviso">É um desconto alto. O erro mais comum aqui é digitar o '
        + '<b>valor final</b> no campo do <b>desconto em R$</b> (ou o contrário).</div>'
        + '<p>Total atual <b>' + esc(BRL(c.atual)) + '</b> → desconto <b>' + esc(BRL(sai))
        + '</b> → novo total <b>' + esc(BRL(d.real)) + '</b>.</p>',
        [{ label:'Voltar e conferir', onClick: () => fecharModal() },
         { label:'Sim, aplicar', pri:true, onClick: async () => { fecharModal(); await vai(); } }]);
      return;
    }
    _semDuploEnvio_(this, vai);
  });

  // Zerar deixou de ser "aplicar 0%": com a base no total atual, 0% quer dizer
  // "não tire mais nada", e não "apague o desconto que já existe". Quem apaga
  // é este botão, que só aparece quando há o que apagar.
  $('Zero').addEventListener('click', function(){
    const c = conta();
    _semDuploEnvio_(this, async () => {
      await cfg.aplicar(new Array(c.n).fill(null).map((_, i) =>
        c.ls.some(l => l.i === i) ? 0 : null));
      limpar();
    });
  });

  prever();
  return { atualizar: prever };
}

/* ── ITEM 2 (S34): OS SERVIÇOS VENCIDOS, POR EQUIPAMENTO ────────────────────
   O cenário que o item descreve: o cliente liga perguntando de inspeção
   vencida, e o vendedor precisa saber QUAL dos quatro serviços venceu naquele
   vaso. Até o S33 essa informação não existia no TapFlow e a lista aqui só
   oferecia "Inspeção NR-13 — TAG", genérica.

   Três desenhos, e o motivo de cada um:

   · Equipamento sem NENHUMA data continua com a linha genérica. A importação
     do TapWeb é sob demanda — a maior parte da base ainda não passou por ela,
     e uma tela que só funciona depois do upload seria uma tela quebrada para
     quem ainda não importou.

   · Vaso DESATIVADO no TapWeb aparece, dito e sem caixa para marcar. Sumir
     seria a segunda lei do ProperFlow ao contrário: quem procura a TAG e não
     a acha conclui que o cadastro está errado, não que o vaso saiu de
     operação.

   · Nada vem pré-marcado, nem o que está vencido. Quem escolhe o que entra na
     proposta é o vendedor; o botão "marcar os vencidos" existe para isso ser
     um clique, não para acontecer sozinho. */
function blocoEquipamentosProposta(equip){
  const hoje = isoHoje();
  let nVenc = 0;

  const linhas = equip.map(e => {
    const servicos = SERVICOS_NR13.filter(sv => e[sv.campo]);

    if (e.tapweb_desativado_em){
      return '<div class="chk" style="opacity:.6"><b>' + esc(e.tag) + '</b> '
        + '<span class="nota">' + esc(e.nome || e.tipo || '—') + ' · '
        + '<b>desativado no TapWeb</b> em ' + esc(dataBR(e.tapweb_desativado_em))
        + ' — não entra como pendência</span></div>';
    }

    if (!servicos.length){
      const desc = 'Inspeção NR-13 — ' + e.tag + (e.tipo ? ' (' + e.tipo + ')' : '');
      return '<label class="chk"><input type="checkbox" data-eq="' + esc(e.equipamento_id) + '"'
        + ' data-desc="' + esc(desc) + '"> '
        + '<b>' + esc(e.tag) + '</b> <span class="nota">· ' + esc(e.nome || e.tipo || '—')
        + (e.localizacao ? ' · ' + esc(e.localizacao) : '')
        + (e.pmta ? ' · PMTA ' + e.pmta : '')
        + (e.ultima_data ? ' · última: ' + esc(dataBR(e.ultima_data)) : ' · nunca inspecionado')
        + ' · <b>sem vencimento do TapWeb</b></span></label>';
    }

    const itens = servicos.map(sv => {
      const d = String(e[sv.campo]).slice(0,10);
      const venceu = d <= hoje;
      if (venceu) nVenc++;
      const desc = sv.nome + ' — ' + e.tag;
      return '<label class="chk" style="margin-left:16px"><input type="checkbox" '
        + 'data-eq="' + esc(e.equipamento_id) + '" data-desc="' + esc(desc) + '"'
        + (venceu ? ' data-venc="1"' : '') + '> '
        + esc(sv.nome) + ' <span class="chip' + (venceu ? ' crit' : '') + '">'
        + (venceu ? 'venceu ' : 'vence ') + esc(dataBR(d)) + '</span></label>';
    }).join('');

    return '<div class="chk" style="padding-bottom:0"><b>' + esc(e.tag) + '</b> '
      + '<span class="nota">' + esc(e.nome || e.tipo || '—')
      + (e.localizacao ? ' · ' + esc(e.localizacao) : '')
      + (e.tapweb_em ? ' · TapWeb ' + esc(dataBR(e.tapweb_em)) : '') + '</span></div>'
      + itens;
  }).join('');

  return '<div class="secTit">Equipamentos deste cliente</div>'
    + '<p class="nota">Marque o que entra na proposta. A TAG, o nome e os vencimentos vêm '
    + 'do cadastro — o que o TapWeb já sabe não se digita de novo aqui.</p>'
    // ITEM 5 (S37): aqui continua um por vaso (é o que a OS da inspeção usa
    // para saber ONDE ir); o documento soma por tipo — ver `57_ajustes_s37`.
    // S38: até 3 linhas, e Interna + Externa do mesmo vaso é UMA inspeção
    + '<p class="dica">No <b>documento</b> da proposta os serviços marcados saem '
    + '<b>somados por tipo</b> — até 3 linhas: <b>Inspeções</b> (conta os vasos: Interna e Externa '
    + 'do mesmo vaso são <b>uma</b> inspeção), <b>Calibração de Manômetros</b> e <b>Calibração de '
    + 'Válvulas</b>. Marcar Interna e Externa do mesmo vaso vira uma linha só, com um preço. '
    + 'No fim do documento sai um <b>anexo por vaso</b>, com os vencimentos do TapWeb. '
    + 'Aqui eles continuam um por vaso, porque é essa lista que a OS leva para o campo.</p>'
    + '<div class="listaItens eqProp">' + linhas + '</div>'
    + (nVenc
        ? '<button class="btn" id="npVenc" type="button" style="width:100%;margin:10px 0 0">'
          + 'Marcar os ' + nVenc + ' serviço(s) vencido(s)</button>'
        : '<p class="dica">Nenhum serviço vencido nesta lista. Se deveria haver, suba a '
          + 'planilha do TapWeb na ficha do cliente (Cadastros → Clientes → Vencimentos).</p>')
    + '<button class="btn" id="npAdd" style="width:100%;margin:8px 0 6px">'
    + 'Acrescentar os marcados</button>';
}

// ── o formulário de montagem ────────────────────────────────────────────────
async function montarProposta(n, props){
  const alvo = document.getElementById('npMonta');
  if (!alvo) return;
  _propItens = [];

  if (!n.cliente_id){
    // A instrução antiga aqui mandava fazer o que não existia ("cadastre em
    // Cadastros e ligue o negócio a ele"). Desde o S22 existe, e é na aba ao
    // lado — então a mensagem aponta para o botão em vez de para o vazio.
    alvo.innerHTML = '<div class="aviso">Este negócio ainda é um <b>lead solto</b>, e '
      + 'proposta é coisa de cliente: é o cadastro dele que guarda os equipamentos '
      + 'que vão ser inspecionados, e é o contato dele que assina a aprovação.'
      + '<div style="margin-top:10px"><button class="btn pri" type="button" id="npIrCli">'
      + 'Ir para a aba Cliente e transformar em cliente</button></div></div>';
    const ir = document.getElementById('npIrCli');
    if (ir) ir.addEventListener('click', () => {
      abaNeg = 'cliente'; abrirNegocio(n);
    });
    return;
  }

  let equip = [];
  try{ equip = await rpc('tf_equipamentos_para_proposta', { p_cliente_id: n.cliente_id }); }
  catch(e){ equip = []; }

  // ── ITEM 2 (S28): EDITAR A PROPOSTA ATUAL, EM VEZ DE REDIGITAR ─────────────
  // A montagem abria sempre vazia: dar 3% numa proposta de 10 linhas era
  // redigitar as 10. Agora ela abre com as linhas da proposta VIGENTE do
  // negócio — a mesma que o "Número da proposta" vazio vai revisar. Quem
  // decide se isso corrige no lugar ou vira versão nova continua sendo o banco
  // (regra do S27: enviada → v+1; não enviada → mesma versão).
  // Proposta aprovada não é carregada: montar por cima dela é recusado.
  const vig = (props || []).filter(p => !p.os_id)
    .sort((a, b) => String(b.emitida_em || '').localeCompare(String(a.emitida_em || ''))
                    || (b.versao || 0) - (a.versao || 0))[0] || null;
  let carregada = null;
  if (vig && ['rascunho','emitida','enviada'].includes(vig.status) && !_propLimpa){

      const its = await get('proposta_itens?select=descricao,quantidade,preco_unitario,desconto_pct,'

      _propItens = (its || []).map(i => ({
        descricao: i.descricao, quantidade: Number(i.quantidade),

    + '<div class="secTit">Acrescentar uma linha</div>'
    // ── ITEM 5 (S31): A DESCRIÇÃO PUXA DO CATÁLOGO ────────────────────────
    // O Catálogo existe desde o S10, com preço cadastrado em todo item, e
    // este campo era texto livre sem ligação nenhuma com ele: o vendedor

    //
    // Continua texto livre: item avulso se digita e pronto. E o que a

    + '<div class="dupla"><div class="campo acWrap"><label for="npDesc">Descrição</label>'
    + '<input id="npDesc" type="text" placeholder="Ex.: Emissão de ART — ou digite para buscar no Catálogo" '

    // ── ITEM 5 (S27): QUANTIDADE É NÚMERO INTEIRO ─────────────────────────
    // Este campo estava `step="0.01" inputmode="decimal"`, copiado dos campos
    // de valor em reais ao lado — e aceitava 1,11. No processo isso não

        : '')
    + '<div id="npLista"></div>'
    // ── ITEM 4 (S27) ────────────────────────────────────────────────────────
    // `proposta_itens.desconto_pct` já existia e `tf_criar_proposta_negocio`

    + (carregada ? 'Registrar a revisão de ' + esc(carregada.numero) : 'Registrar proposta') + '</button>';

  const bLimpa = document.getElementById('npLimpar');
  if (bLimpa) bLimpa.addEventListener('click', () => {
    _propLimpa = true;

  // ── ITEM 2 (S34): UMA LINHA POR SERVIÇO, NÃO UMA POR EQUIPAMENTO ────────
  // Até o S33 cada equipamento marcado virava uma linha genérica "Inspeção
  // NR-13 — TAG", e qual dos quatro serviços tinha vencido ficava na cabeça
  // do vendedor (ou numa segunda janela, no TapWeb). Agora a tela mostra as
  // datas e cada serviço marcado vira a SUA linha.
  //
  // ⚠ A dedução de repetido mudou de chave. Era `equipamento_id`, o que
  // impedia um segundo serviço do MESMO vaso de entrar. Passa a ser
  // equipamento + descrição — e a descrição é o que sobrevive quando a
  // proposta é recarregada do banco, onde o "qual serviço" não existe como
  // campo (a proposta congela o TEXTO, não um ponteiro).
  const jaTem = (eqId, desc) => _propItens.some(i =>
    (i.equipamento_id || null) === (eqId || null) &&
    norm(String(i.descricao||'')).trim() === norm(desc).trim());

  const bMarcar = document.getElementById('npVenc');
  if (bMarcar) bMarcar.addEventListener('click', () => {
    const v = [...alvo.querySelectorAll('[data-eq][data-venc="1"]')];
    if (!v.length){ toast('Nenhum serviço vencido nesta lista.','err'); return; }
    v.forEach(c => { c.checked = true; });
    toast(v.length + ' serviço(s) vencido(s) marcado(s).','ok');
  });

  const bAdd = document.getElementById('npAdd');
  if (bAdd) bAdd.addEventListener('click', () => {
    const marcados = [...alvo.querySelectorAll('[data-eq]:checked')];
    if (!marcados.length){ toast('Marque ao menos um serviço.','err'); return; }
    let postos = 0, repetidos = 0, juntados = 0;
    // ── ITEM 2 (S38): INTERNA + EXTERNA DO MESMO VASO = UMA LINHA ────────
    // O papel conta UMA inspeção por vaso. Mas proposta não aceita linha a
    // zero, então duas linhas teriam dois preços e o vaso sairia cobrado duas
    // vezes dentro de "1 inspeção". Por isso a montagem já grava uma linha
    // só, "Inspeção Interna e Externa — TAG" — e a OS continua sabendo o vaso
    // e os dois serviços, que estão no texto.
    const tipoInsp = d => d.startsWith(INSP_INT) ? 'int' : d.startsWith(INSP_EXT) ? 'ext' : null;
    const tagDe = d => d.split(' — ').slice(1).join(' — ');
    const marcadosInsp = new Map();          // equipamento → {int, ext}
    marcados.forEach(c => { const k = tipoInsp(c.dataset.desc); if (!k) return;
      const m = marcadosInsp.get(c.dataset.eq) || {}; m[k] = c; marcadosInsp.set(c.dataset.eq, m); });
    marcados.forEach(c => {
      let desc = c.dataset.desc;
      const k = tipoInsp(desc);
      c.checked = false;
      if (k){
        const eq = c.dataset.eq, tag = tagDe(desc), amb = INSP_AMB + tag;
        const par = marcadosInsp.get(eq) || {};
        if (par.int && par.ext){
          if (k === 'ext') return;           // a linha já saiu pela Interna
          desc = amb;
        } else {
          // o outro serviço já está na proposta: vira a linha combinada, no lugar
          const outro = (k === 'int' ? INSP_EXT : INSP_INT) + tag;
          const ix = _propItens.findIndex(i => (i.equipamento_id || null) === eq
                       && norm(String(i.descricao||'')).trim() === norm(outro).trim());
          if (ix >= 0){ _propItens[ix].descricao = amb; juntados++; return; }
        }
        if (jaTem(eq, amb)){ repetidos++; return; }
      }
      if (jaTem(c.dataset.eq, desc)){ repetidos++; return; }
      _propItens.push({ equipamento_id: c.dataset.eq, descricao: desc,
        quantidade: 1, preco_unitario: null, desconto_pct: 0, e_servico: false });
      postos++;
    });
    if (repetidos) toast(repetidos + ' já estava(m) na proposta.','err');
    else if (juntados) toast(juntados + ' vaso(s) passaram a ter Interna e Externa numa linha só.','ok');
    pintarItensProposta();
  });

  // S31: o autocomplete do Catálogo neste campo
  autocompletarCatalogo(document.getElementById('npDesc'),
                        document.getElementById('npDescAC'),
                        item => { document.getElementById('npPreco').value =
                                    item.preco_referencia != null ? item.preco_referencia : ''; });

  document.getElementById('npAddLinha').addEventListener('click', () => {
    const d = document.getElementById('npDesc').value.trim();

  document.getElementById('npAddPlano').addEventListener('click', async () => {

    const desc = descricaoLinhaPlano(pl);

      toast('A linha do plano já está na proposta.','err'); return;
    }
    const q = Math.trunc(Number(document.getElementById('npQtd').value));
    const qtd = q >= 1 ? q : Math.max(1, alvo.querySelectorAll('[data-eq]').length || 1);
    _propItens.unshift({ equipamento_id: null, descricao: desc,
      quantidade: qtd, preco_unitario: null, desconto_pct: 0, e_servico: true });
    document.getElementById('npQtd').value = '1';
    pintarItensProposta();
    toast('Linha do plano no topo, com ' + qtd + ' vaso(s). Ponha o preço do Padrão.','ok');
  });

  _descNeg = montarDescontoGeral(document.getElementById('npDescBox'), {
    id: 'npDg',
    linhas: () => _propItens.map(i => ({ preco: Number(i.preco_unitario) || 0,
                                         qtd: Number(i.quantidade) || 0,
                                         desc: Number(i.desconto_pct) || 0 })),
    // S31: um percentual por linha, calculado a partir do total ATUAL da
    // proposta (itens 6 e 7). Continua sem gravar nada até "Registrar".
    aplicar: async (pcts) => {
      if (!_propItens.length){ toast('Acrescente as linhas primeiro.','err'); return; }
      let n = 0;
      _propItens.forEach((i, k) => {
        if (pcts[k] === null || pcts[k] === undefined) return;
        i.desconto_pct = pcts[k]; n++;
      });

      toast(n + ' linha(s) com o desconto aplicado. Nada foi gravado ainda — '
            + 'confira e clique em Registrar.','ok');
    }
  });

  document.getElementById('npGravar').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const num = document.getElementById('npNum').value.trim();
      if (!_propItens.length){ toast('A proposta precisa de pelo menos um item.','err'); return; }
      const semPreco = _propItens.filter(i => !(Number(i.preco_unitario) > 0));
      if (semPreco.length){

              + 'que ninguém confere.','err');
        return;
      }
      try{
        const r = await rpc('tf_criar_proposta_negocio', { p_negocio_id: n.id,
          p_numero: num || null, p_itens: _propItens,

        toast('Proposta ' + (r.rotulo || r.numero) + ' '
              + (r.caso === 'corrigida' ? 'corrigida no lugar — '

               : 'registrada — ')
              + BRL(r.valor_total) + '.','ok');
        _propItens = [];
        negPropostas(n, document.getElementById('dBody'));
      }catch(e){ toast(e.message,'err'); }
    });
  });

  pintarItensProposta();
}

// ── ITEM 5 (S31): O AUTOCOMPLETE DO CATÁLOGO ────────────────────────────────
// O catálogo é pequeno (dezenas de itens) e muda pouco: carrega uma vez por
// sessão e a busca acontece na memória, sem ida ao servidor por tecla. Se a
// carga falhar, o campo continua sendo texto livre — um autocomplete que não
// abriu não pode impedir ninguém de digitar a linha e seguir com a proposta.
let _catalogoCache = null;
async function catalogoParaEscolha(){
  if (_catalogoCache) return _catalogoCache;
  if (DEMO){ _catalogoCache = []; return _catalogoCache; }
  try{
    const r = await get('v_catalogo?select=id,codigo,descricao,rotulo,unidade,preco_referencia'
                        + '&ativo=is.true&order=codigo&limit=1000');
    _catalogoCache = (r || []).map(x => Object.assign({}, x, {
      _busca: norm([x.codigo, x.descricao, x.rotulo].join(' ')) }));
  }catch(e){ _catalogoCache = []; }
  return _catalogoCache;
}

/** Liga um input de texto ao Catálogo. `aoEscolher` recebe o item inteiro —
 *  quem decide o que fazer com o preço é a tela que chamou.
 *  Teclado: ↓/↑ andam, Enter escolhe, Esc fecha. Sem isso é um menu que só
 *  existe para quem usa mouse. */
function autocompletarCatalogo(inp, caixa, aoEscolher){
  if (!inp || !caixa) return;
  let itens = [], marcado = -1, aberto = false;
  catalogoParaEscolha().then(c => { itens = c; });

  const fechar = () => {
    caixa.innerHTML = ''; aberto = false; marcado = -1;
    inp.setAttribute('aria-expanded','false');
  };
  const escolher = it => {
    inp.value = it.descricao || it.rotulo || '';
    fechar();
    if (aoEscolher) aoEscolher(it);
    inp.focus();
  };
  const pintar = () => {
    const termos = norm(inp.value).trim().split(/\s+/).filter(Boolean);
    if (!termos.length || !itens.length){ fechar(); return; }
    const achados = itens.filter(x => termos.every(w => x._busca.includes(w))).slice(0, 8);
    aberto = true;
    inp.setAttribute('aria-expanded','true');
    if (!achados.length){
      caixa.innerHTML = '<div class="acLista"><div class="acNada">'
        + 'Nada no Catálogo com isso — o texto que você digitou vale como linha avulsa.'
        + '</div></div>';
      return;
    }
    caixa.innerHTML = '<div class="acLista" role="listbox">'
      + achados.map((x, k) => '<button type="button" class="acItem' + (k === marcado ? ' on' : '')
          + '" role="option" data-k="' + k + '">'
          + '<span class="acC">' + esc(x.codigo || '') + '</span>'
          + '<span class="acD">' + esc(x.descricao || '')
          + (x.unidade ? ' <span class="acC">/' + esc(x.unidade) + '</span>' : '') + '</span>'
          + '<span class="acP">' + (x.preco_referencia != null ? BRL(x.preco_referencia) : 'sem preço')
          + '</span></button>').join('')
      + '</div>';
    caixa.querySelectorAll('.acItem').forEach(b =>
      // mousedown, não click: o blur do input fecharia a lista antes do clique
      b.addEventListener('mousedown', ev => { ev.preventDefault(); escolher(achados[Number(b.dataset.k)]); }));
    caixa._achados = achados;
  };

  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', pintar);
  inp.addEventListener('blur', () => setTimeout(fechar, 120));
  inp.addEventListener('keydown', ev => {
    const n = (caixa._achados || []).length;
    if (!aberto || !n) return;
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); marcado = (marcado + 1) % n; pintar(); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); marcado = (marcado - 1 + n) % n; pintar(); }
    else if (ev.key === 'Enter' && marcado >= 0){ ev.preventDefault(); escolher(caixa._achados[marcado]); }
    else if (ev.key === 'Escape'){ fechar(); }
  });
}

/** O total de uma linha, com desconto — espelho de `proposta_itens.total`
 *  (`preco * qtd * (1 - desconto/100)`, arredondado em 2 casas). */
function totalItem(i){
  const bruto = (Number(i.preco_unitario)||0) * (Number(i.quantidade)||0);
  return Math.round(bruto * (1 - (Number(i.desconto_pct)||0)/100) * 100) / 100;
}

let _descNeg = null;
function pintarItensProposta(){
  const el = document.getElementById('npLista');
  if (!el) return;
  if (_descNeg) setTimeout(() => _descNeg && _descNeg.atualizar(), 0);
  if (!_propItens.length){
    el.innerHTML = '<p class="nota">Nada ainda. Marque equipamentos ou acrescente uma linha.</p>';
    return;
  }
  // o mesmo cálculo que `proposta_itens.total` faz no banco — se as duas
  // contas divergirem, a tela mente sobre o que vai ser gravado
  const bruto = _propItens.reduce((s,i) =>
    s + (Number(i.preco_unitario)||0) * (Number(i.quantidade)||0), 0);
  const total = _propItens.reduce((s,i) => s + totalItem(i), 0);
  const descontado = bruto - total;
  el.innerHTML = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
    + '<th>Item</th><th>Qtd.</th><th class="num">Preço unit.</th><th class="num">Desc. %</th>'
    + '<th class="num">Total</th><th></th>'
    + '</tr></thead><tbody>'
    + _propItens.map((i, k) => '<tr>'
        + '<td>' + esc(i.descricao) + (i.equipamento_id ? '' : ' <span class="mini">digitado</span>') + '</td>'
        // ── ITEM 3 (S31): a quantidade vira campo ────────────────────────
        // O documento diz que QTD "ficou travada quando os outros foram
        // liberados". Não é o caso: ela NUNCA foi campo nesta tabela, nem em
        // rascunho — era texto. Por isso corrigir a quantidade custava apagar
        // a linha e digitar tudo de novo. O remédio é o mesmo: vira input,
        // dentro do mesmo mecanismo — nada é gravado até "Registrar", que é
        // quem cria a revisão seguinte.
        // Inteira, a partir de 1: é o `ck_propitens_qtd_inteira` (12/09).
        + '<td class="num"><input class="mini" style="width:64px;text-align:right" type="number"'
        +   ' step="1" min="1" inputmode="numeric" data-qtd="' + k + '" value="'
        +   (i.quantidade == null ? '' : i.quantidade) + '"></td>'
        + '<td class="num"><input class="mini" style="width:96px;text-align:right" type="number"'
        +   ' step="0.01" inputmode="decimal" data-preco="' + k + '" value="'
        +   (i.preco_unitario == null ? '' : i.preco_unitario) + '"></td>'
        // S31: quatro casas. O desconto geral, quando parte de um valor em
        // R$, grava percentual quebrado (8,3333%) — é o que faz o centavo
        // fechar. Mostrar só duas aqui esconderia o número que está gravado.
        + '<td class="num"><input class="mini" style="width:78px;text-align:right" type="number"'
        +   ' step="0.0001" min="0" max="100" inputmode="decimal" data-desc="' + k + '" value="'
        +   (Number(i.desconto_pct) ? _descCurto(i.desconto_pct) : '') + '" placeholder="0"></td>'
        + '<td class="num">' + BRL(totalItem(i)) + '</td>'
        + '<td><button class="btn mini" type="button" data-tira="' + k + '">tirar</button></td>'
        + '</tr>').join('')
    + '</tbody></table></div>'
    + htmlParesInspecao()
    + '<p class="nota" style="text-align:right;font-size:14px">'
    +   (descontado > 0 ? '<span style="color:var(--ink-3)">Sem desconto: ' + BRL(bruto)
                          + ' · desconto: −' + BRL(descontado) + '</span><br>' : '')
    +   '<b>Total: ' + BRL(total) + '</b></p>';

  el.querySelectorAll('[data-qtd]').forEach(inp => inp.addEventListener('change', () => {
    const q = Math.trunc(Number(inp.value));
    if (!(q >= 1)){ toast('A quantidade é um número inteiro, a partir de 1.','err');
                    pintarItensProposta(); return; }
    _propItens[Number(inp.dataset.qtd)].quantidade = q;
    pintarItensProposta();
  }));
  el.querySelectorAll('[data-preco]').forEach(inp => inp.addEventListener('change', () => {
    _propItens[Number(inp.dataset.preco)].preco_unitario = parseFloat(inp.value) || null;
    pintarItensProposta();
  }));
  el.querySelectorAll('[data-desc]').forEach(inp => inp.addEventListener('change', () => {
    const v = inp.value.trim() === '' ? 0 : Number(inp.value);
    if (!(v >= 0 && v <= 100)){ toast('O desconto vai de 0 a 100%.','err'); pintarItensProposta(); return; }
    _propItens[Number(inp.dataset.desc)].desconto_pct = v;
    pintarItensProposta();
  }));
  el.querySelectorAll('[data-tira]').forEach(b => b.addEventListener('click', () => {
    _propItens.splice(Number(b.dataset.tira), 1); pintarItensProposta();
  }));
  el.querySelectorAll('[data-juntar]').forEach(b => b.addEventListener('click', () => {
    juntarParInspecao(b.dataset.juntar); pintarItensProposta();
  }));
}

/* ── ITEM 2 (S38): PROPOSTA QUE JÁ TEM INTERNA E EXTERNA SEPARADAS ─────────
   Proposta montada até o S37 tem as duas linhas, cada uma com preço. No papel
   o vaso conta UMA inspeção, mas o valor continua sendo a soma — o que pode
   ser exatamente o que se quer (preços diferentes para cada serviço), ou uma
   cobrança dobrada. A tela não decide: avisa e oferece juntar. Juntar preserva
   o total (preço = soma, com o desconto equivalente); o preço se corrige na
   própria linha depois. */
function paresInspecao(){
  const pares = new Map();
  _propItens.forEach((i, k) => {
    if (!i.equipamento_id) return;
    const d = String(i.descricao || '');
    const tipo = d.startsWith(INSP_INT) ? 'int' : d.startsWith(INSP_EXT) ? 'ext' : null;
    if (!tipo) return;
    const tag = d.split(' — ').slice(1).join(' — ');
    const ch = i.equipamento_id + '|' + norm(tag);
    const p = pares.get(ch) || { tag }; p[tipo] = k; pares.set(ch, p);
  });
  return [...pares.entries()].filter(([, p]) => p.int !== undefined && p.ext !== undefined);
}
function htmlParesInspecao(){
  const ps = paresInspecao();
  if (!ps.length) return '';
  return '<div class="aviso" style="margin:8px 0">'
    + '<b>' + ps.length + ' vaso(s) com Inspeção Interna e Externa em linhas separadas.</b> '
    + 'No documento cada vaso conta como <b>1 inspeção</b>, mas o valor é a <b>soma das duas linhas</b>. '
    + 'Se o preço é por vaso, junte numa linha e confira o preço:'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'
    + ps.map(([ch, p]) => '<button class="btn mini" type="button" style="margin-left:0" data-juntar="'
        + esc(ch) + '">juntar ' + esc(p.tag) + '</button>').join('')
    + '</div></div>';
}
function juntarParInspecao(ch){
  const par = paresInspecao().find(([c]) => c === ch);
  if (!par) return;
  const p = par[1];
  const a = _propItens[p.int], b = _propItens[p.ext];
  const bruto = [a, b].reduce((s, i) => s + (Number(i.preco_unitario) || 0) * (Number(i.quantidade) || 0), 0);
  const tot = totalItem(a) + totalItem(b);
  const novo = { equipamento_id: a.equipamento_id, descricao: INSP_AMB + p.tag, quantidade: 1,
    preco_unitario: bruto > 0 ? Math.round(bruto * 100) / 100 : null,
    desconto_pct: bruto > 0 ? Math.round((1 - tot / bruto) * 1e6) / 1e4 : 0,
    custo_unitario: a.custo_unitario ?? null, e_servico: !!a.e_servico };
  const primeiro = Math.min(p.int, p.ext), segundo = Math.max(p.int, p.ext);
  _propItens.splice(segundo, 1);
  _propItens.splice(primeiro, 1, novo);
  toast(p.tag + ': Interna e Externa numa linha só, com o mesmo total. Confira o preço.', 'ok');
}

// ── cliente ─────────────────────────────────────────────────────────────────
// Onde o cliente fica e com quem se agenda, dentro do card — que era o pedido:
// hoje isso vive no card do Trello e some quando o negócio entra no TapFlow.
//
// Aqui é só LEITURA com um atalho para editar. A edição de verdade é na tela
// de Cadastros, e o botão leva para lá: manter dois formulários para o mesmo
// cliente é como os dois passam a discordar.
/** Cria o cliente a partir do lead. O aviso de parecidos vem do banco e NÃO
    bloqueia: mostra quem já existe e devolve as duas saídas. */
async function virarCliente(n, confirmado){
  const nome = (document.getElementById('vcNome') || {}).value || '';
  if (!nome.trim()){ toast('Escreva a razão social do cliente.','err'); return; }
  try{
    const r = await rpc('tf_negocio_virar_cliente', {
      p_negocio_id: n.id, p_razao_social: nome.trim(),
      p_nome_fantasia: ((document.getElementById('vcFant') || {}).value || '').trim() || null,
      p_cnpj:   (document.getElementById('vcCnpj') || {}).value || null,
      p_cidade: (document.getElementById('vcCid')  || {}).value || null,
      p_uf:     (document.getElementById('vcUf')   || {}).value || null,
      p_confirmado: !!confirmado });

    if (r.status === 'parecidos'){
      avisarParecidosNoNegocio(n, r);
      return;
    }
    toast('Agora é cliente: ' + r.razao_social + '.','ok');
    await pintarComercial();
    const novo = (negocios || []).find(x => x.id === n.id);
    if (novo) abrirNegocio(novo);
  }catch(e){ toast(e.message,'err'); }
}

/** O mesmo aviso do cadastro (S21), agora no caminho do negócio: quem já existe,
    e as duas saídas — aproveitar ou criar assim mesmo. */
function avisarParecidosNoNegocio(n, r){
  const rot = { mesmo:'mesmo cliente', muito_parecido:'muito parecido', parecido:'parecido' };

    + 'confira se não é um destes. Aproveitar o cadastro mantém equipamentos e '
    + 'histórico no mesmo lugar — e é o que evita duas fichas da mesma empresa.</p>'
    + '<div class="parecidos">' + (r.semelhantes || []).map(c =>
        '<button class="btn parecidoLinha" type="button" data-lig="' + esc(c.id) + '">'
      + '<span class="pn">' + esc(nomeCliente(c)) + '</span>'
      + '<span class="pd">' + esc(c.cnpj || 'sem CNPJ')
      +   (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>'
      + '<span class="chip">' + esc(rot[c.forca] || c.forca)
      +   (c.parece_filial ? ' · outra filial' : '') + '</span></button>').join('')
    + '</div>'
    + '<p class="nota">Se for outra empresa — ou outra filial, que tem CNPJ, endereço '
    + 'e vasos próprios —, criar de novo é o certo.</p>',
    [ { label:'Criar assim mesmo', onClick: () => { fecharModal(); virarCliente(n, true); } },
      { label:'Cancelar', pri:true, onClick: () => fecharModal() } ]);

  document.querySelectorAll('[data-lig]').forEach(bt =>
    bt.addEventListener('click', async () => {
      fecharModal();
      await ligarClienteAoNegocio(n, bt.dataset.lig);
    }));
}

async function buscarClienteParaNegocio(n, termo){
  const alvo = document.getElementById('vcLista');
  if (!alvo) return;
  if (termo.length < 2){ alvo.innerHTML = ''; return; }
  try{
    const r = await rpc('tf_buscar_cliente', { p_termo: termo, p_limite: 8 });
    alvo.innerHTML = (r && r.length)
      ? '<div class="parecidos">' + r.map(c =>
          '<button class="btn parecidoLinha" type="button" data-lig2="' + esc(c.id) + '">'
        + '<span class="pn">' + esc(nomeCliente(c)) + '</span>'
        + '<span class="pd">' + esc(c.cnpj || 'sem CNPJ')
        +   (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>'
        + '<span class="chip">' + c.equipamentos + ' equip. · ' + c.oss + ' OS</span>'
        + '</button>').join('') + '</div>'
      : '<p class="nota">Nenhum cliente com esse nome ou CNPJ.</p>';

    alvo.innerHTML = '<p class="nota"></p>';
    alvo.querySelector('p').textContent = 'Não deu para buscar: ' + e.message;
  }
}

        ? '<label class="chk"><input type="checkbox" id="lnT" checked> Corrigir também no título: '

     { label:'Gravar', pri:true, onClick: async () => {

/* ── ITEM 1 (S34): TROCAR OU DESLIGAR O CLIENTE DO NEGÓCIO ──────────────────
   Até o S33 o vínculo era de mão única: ligou, ligou. Se fosse o cliente
   errado — e com "Belgo Mineira" e "Belgo Bekaert" na mesma base isso
   acontece — não havia conserto em tela nenhuma.

   Três decisões de desenho, todas do mesmo motivo (este é o único lugar da
   aba que DESFAZ alguma coisa):

   1. Vem dentro de um `<details>` FECHADO, depois de uma régua. Abrir é o ato
      de querer mexer. Os dois botões que já estavam ali em cima — "Trocar" e
      "Tirar" — são da LOGOMARCA, e ficam a dois dedos daqui; um terceiro
      botão solto com o mesmo verbo seria o engano pronto. Por isso os rótulos
      daqui dizem a palavra inteira: "Trocar o cliente", "Desligar do cliente".

   2. A tela descobre ANTES o que o banco vai recusar (OS aberta, proposta
      enviada) e explica no lugar de oferecer o botão para ele recusar depois.
      É a regra do S16, e o S24 provou o que custa ignorá-la.

   3. Quem não pode gravar não vê nada disso (`podeEscritorio`), do mesmo jeito
      que o botão da logomarca. */
function blocoTrocarCliente(n){
  if (!podeEscritorio()) return '';

  const travaOS   = Number(n.oss) > 0;
  const travaProp = Number(n.propostas_enviadas) > 0 || Number(n.aprovacoes) > 0;

  return '<hr class="reguaPerigo">'
    + '<details class="trocaCli"><summary><span class="secTit" style="margin:0">'
    + 'Está ligado ao cliente errado?</span></summary>'
    + '<p class="nota">Os botões <b>Trocar</b> e <b>Tirar</b> logo acima, embaixo do '
    + 'quadrado, são da <b>logomarca</b>. O vínculo do negócio com o cliente se '
    + 'mexe aqui.</p>'
    + (travaOS
        ? '<div class="aviso">Este negócio já gerou <b>' + n.oss + ' OS</b>, e a OS tem '
          + 'cliente próprio — ela é quem vai para o faturamento. Trocar aqui deixaria o '
          + 'quadro dizendo uma empresa e a OS cobrando de outra. Corrija (ou cancele) a '
          + 'OS primeiro.</div></details>'
      : travaProp
        ? '<div class="aviso">A proposta <b>' + esc(n.proposta_rotulo || '') + '</b> já '
          + 'saiu para o cliente: o número está com ele. Registre a perda deste negócio e '
          + 'abra um novo para a empresa certa — é o que mantém o funil honesto.</div></details>'
        : '<div class="campo"><label for="tcBusca">Trocar por outro cliente</label>'
          + '<input id="tcBusca" type="text" placeholder="razão social, nome fantasia ou CNPJ" '
          + 'autocomplete="off" name="tcb_nofill" data-lpignore="true" data-1p-ignore '
          + 'readonly onfocus="this.removeAttribute(\'readonly\')"></div>'
          + '<div id="tcLista"></div>'
          + '<div class="secTit">Ou desligar</div>'
          + '<p class="nota">O negócio volta a ser <b>lead solto</b>, com o nome da empresa '
          + 'como estava antes. Nada do histórico se perde — a passagem pelo cliente fica '
          + 'registrada.</p>'
          + '<button class="btn perigo" id="tcDesligar" style="width:100%">Desligar do cliente</button>'
          + '</details>');
}

function ligarTrocarCliente(n, b){
  const cx = b.querySelector('#tcBusca');
  if (cx){
    let t = null;
    cx.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => buscarTrocaCliente(n, cx.value.trim()), 200);
    });
  }
  const bd = b.querySelector('#tcDesligar');
  if (bd) bd.addEventListener('click', async () => {
    const ok = await confirmar('Desligar do cliente',
      '<p style="margin-top:0">O negócio <b>' + esc(n.numero) + '</b> deixa de estar ligado a '
      + '<b>' + esc(n.cliente_nome) + '</b> e volta para a coluna de leads, com esse nome.</p>'
      + '<p class="nota">Para <b>orçar</b> ele vai precisar de cliente de novo — é o cadastro '
      + 'que guarda os vasos e o contato que assina a aprovação.</p>'
      + '<div class="campo"><label for="tcMot">Por quê? (opcional, vai para o histórico)</label>'
      + '<input id="tcMot" type="text" placeholder="Ex.: era outra empresa do grupo"></div>',
      'Desligar', true, 'tcMot');
    if (!ok) return;
    await definirClienteDoNegocio(n, null, ok.texto);
  });
}

async function buscarTrocaCliente(n, termo){
  const alvo = document.getElementById('tcLista');
  if (!alvo) return;
  if (termo.length < 2){ alvo.innerHTML = ''; return; }
  try{
    const r = DEMO ? [] : await rpc('tf_buscar_cliente', { p_termo: termo, p_limite: 8 });
    const outros = (r || []).filter(c => c.id !== n.cliente_id);
    alvo.innerHTML = outros.length
      ? '<div class="parecidos">' + outros.map(c =>
          '<button class="btn parecidoLinha" type="button" data-troca="' + esc(c.id) + '">'
        + '<span class="pn">' + esc(nomeCliente(c)) + '</span>'
        + '<span class="pd">' + esc(c.cnpj || 'sem CNPJ')
        +   (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>'
        + '<span class="chip">' + c.equipamentos + ' equip. · ' + c.oss + ' OS</span>'
        + '</button>').join('') + '</div>'
      : '<p class="nota">Nenhum outro cliente com esse nome ou CNPJ.</p>';
    alvo.querySelectorAll('[data-troca]').forEach(bt =>
      bt.addEventListener('click', async () => {
        const nome = bt.querySelector('.pn').textContent;
        const ok = await confirmar('Trocar o cliente do negócio',
          '<p style="margin-top:0">O negócio <b>' + esc(n.numero) + '</b> passa de '
          + '<b>' + esc(n.cliente_nome) + '</b> para <b>' + esc(nome) + '</b>.</p>'
          + '<p class="nota">Se houver proposta em rascunho aqui, as linhas continuam com o '
          + 'texto que têm (a proposta congela o que foi ofertado), mas perdem o vínculo com '
          + 'os equipamentos do cliente anterior — eles não são desta empresa.</p>'
          + '<div class="campo"><label for="tcMot">Por quê? (opcional, vai para o histórico)</label>'
          + '<input id="tcMot" type="text" placeholder="Ex.: conferi o CNPJ, é a Bekaert"></div>',
          'Trocar', true, 'tcMot');
        if (!ok) return;
        await definirClienteDoNegocio(n, bt.dataset.troca, ok.texto);
      }));
  }catch(e){
    alvo.innerHTML = '<p class="nota"></p>';
    alvo.querySelector('p').textContent = 'Não deu para buscar: ' + e.message;
  }
}

async function definirClienteDoNegocio(n, clienteId, motivo){

async function negAcoes(n, b){
  const perdido = !!n.perdido_em;

  b.innerHTML =
      (perdido
        ? '<div class="aviso"><b>Este negócio está marcado como perdido</b> desde '
          + esc(dataBR(n.perdido_em)) + '. Ele fica em “Recusadas” e continua contando no funil.</div>'
          + '<div class="secTit" style="margin-top:0">Reabrir</div>'
          + '<p class="nota">O cliente pode voltar. Reabrir devolve o negócio ao fluxo — a coluna '
          + 'volta a ser calculada pelos fatos, como em qualquer outro card. A passagem pela perda '
          + '<b>não</b> é apagada: ela fica no histórico.</p>'
          + '<div class="campo"><label for="ngRM">O que mudou (opcional)</label>'
          + '<input id="ngRM" type="text" placeholder="Ex.: cliente voltou a procurar"></div>'
          + '<button class="btn pri" id="ngReabre" style="width:100%;margin-bottom:18px">Reabrir negócio</button>'
        : '<div class="secTit" style="margin-top:0">Transformar em OS</div>'
          + '<p class="nota">Abre a OS já ligada a este negócio. Se ainda é lead, o cliente é '
          + 'criado agora — é quando ele deixa de ser “alguém que ligou”.</p>'
          + (n.oss ? '<p class="nota"><b>' + n.oss + ' OS</b> já aberta(s) neste negócio.</p>' : '')
          + '<div class="campo"><label for="ngTipo">Tipo de serviço</label>'
          + '<select id="ngTipo"></select></div>'
          + '<button class="btn pri" id="ngOS" style="width:100%;margin-bottom:18px">Abrir OS</button>'
          + '<div class="secTit">Marcar como perdido</div>'
          + '<div class="campo"><label for="ngM">Motivo</label><select id="ngM"></select></div>'
          + '<div class="campo"><label for="ngMO">Observação (opcional)</label>'
          + '<input id="ngMO" type="text" placeholder="Ex.: fechou com o concorrente"></div>'
          + '<button class="btn perigo" id="ngPerde" style="width:100%">Registrar perda</button>'
          + '<p class="nota">Perder não apaga: o negócio vai para “Recusadas” com o motivo, e é '
          + 'isso que alimenta o funil depois.</p>')
      // ── excluir ──
      // Separado por uma régua e no fim, porque é o único botão desta tela que
      // destrói. E a diferença para "perder" está escrita: card de teste que
      // vira "perdido" conta como negócio que a Engetap não fechou, e a taxa de
      // conversão passa a mentir para sempre.
    + '<hr class="reguaPerigo">'
    + '<div class="secTit">Excluir este negócio</div>'
    + '<p class="nota"><b>Não é o mesmo que perder.</b> Perder é desfecho de negócio real e '
    + 'continua no funil. Excluir é para lixo — card de teste, duplicado, criado por engano — '
    + 'e some de todos os relatórios, inclusive das perdas.</p>'
    // ITEM 11 (S36): o lançamento retroativo tem volta própria enquanto nada
    // foi feito em cima dele — o "Excluir" recusaria, porque a proposta "saiu"
    + (n.retroativo && !n.oss
        ? '<div class="aviso">Este negócio foi <b>lançado depois do fato</b> (proposta anterior ao TapFlow)'
          + '<span id="ngRetroQuem"></span>. '
          + 'Se o lançamento foi um engano, dá para desfazer — enquanto ninguém anotou, agendou ou abriu OS nele.</div>'
          + '<button class="btn perigo" id="ngDesfRetro" style="width:100%">Desfazer o lançamento</button>'
        : n.oss
        ? '<div class="aviso">Este negócio já gerou <b>' + n.oss + ' OS</b>, então não é lixo: '
          + 'há trabalho preso a ele. Se a OS também for de teste, exclua a OS primeiro.</div>'
        // S26: a mesma trava do banco (48_brasilia_e_exclusao). Proposta que SAIU
        // é história — o número está com o cliente. Até o S25 o botão aparecia
        // e a exclusão morria na chave estrangeira, com o texto cru do Postgres.
        : (Number(n.propostas_enviadas) > 0 || Number(n.aprovacoes) > 0)
        ? '<div class="aviso">A proposta <b>' + esc(n.proposta_rotulo || '') + '</b> já foi '
          + 'enviada ao cliente, então não é lixo: o número está com ele. '
          + 'Use “Marcar como perdido”.</div>'
        : '<button class="btn perigo" id="ngExcluir" style="width:100%">Excluir negócio</button>');

  // quem lançou e quando: está no negócio, não na view do quadro
  const rq = document.getElementById('ngRetroQuem');
  if (rq && !DEMO) get('negocios?select=retroativo_lancado_em,retroativo_lancado_por&id=eq.' + n.id)
    .then(r => { const x = r && r[0]; if (!x || !x.retroativo_lancado_em) return;
      rq.textContent = ' — lançado em ' + dataBR(x.retroativo_lancado_em)
        + (x.retroativo_lancado_por ? ' por ' + (NOMES[x.retroativo_lancado_por] || 'alguém que saiu do time') : ''); })
    .catch(() => {});
  const bDR = document.getElementById('ngDesfRetro');
  if (bDR) bDR.addEventListener('click', () => abrirModal('Desfazer o lançamento de ' + (n.numero_exibicao || n.numero),
      '<p>O negócio e a proposta lançados somem do quadro. O registro fica no livro das exclusões '
    + '(Configurações › Exclusões), com o número da proposta.</p>'
    + '<div class="campo"><label for="drM">Por quê?</label><input id="drM" type="text" autocomplete="off" '
    + 'name="drm_nofill" placeholder="ex.: número digitado errado"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Desfazer', pri:true, onClick: async () => {
        try{
          await rpc('tf_desfazer_lancamento_retroativo', { p_negocio_id: n.id,
            p_motivo: document.getElementById('drM').value.trim() });
          fecharModal(); fecharDrawer(); toast('Lançamento desfeito.','ok'); pintarComercial();
        }catch(e){ toast(e.message,'err'); }
     }}]));

  // ── reabrir ──
  const bR = document.getElementById('ngReabre');
  if (bR) bR.addEventListener('click', () => _semDuploEnvio_(bR, async () => {
    try{
      if (!DEMO) await rpc('tf_reabrir_negocio',
        { p_id:n.id, p_motivo: (document.getElementById('ngRM')||{}).value || null });
      toast('Negócio reaberto.','ok'); fecharDrawer(); pintarComercial();
    }catch(e){ toast(e.message,'err'); }
  }));

  // ── abrir OS ──
  // O tipo escolhe o checklist, e os dois são bem diferentes: o fornecimento
  // manda o inspetor levantar antes de orçar; a inspeção começa depois do "sim"
  // do cliente, no administrativo. Escolher errado é uma OS inteira com o
  // roteiro do outro serviço.
  const selT = document.getElementById('ngTipo');
  if (selT){
    let tipos = [];
    try{ tipos = DEMO ? demoTipos() : await get('tipos_os?select=id,nome&ativo=eq.true&order=nome'); }
    catch(e){ tipos = [{ id:'FORNECIMENTO', nome:'Fornecimento de acessórios NR-13' }]; }
    tipos.forEach(t => { const o = document.createElement('option');
      o.value = t.id; o.textContent = t.nome; selT.appendChild(o); });
  }

  const bO = document.getElementById('ngOS');
  if (bO) bO.addEventListener('click', () => _semDuploEnvio_(bO, async () => {
    try{
      const r = DEMO ? {numero:'OS-DEMO'} : await rpc('tf_negocio_abrir_os',
        { p_negocio_id:n.id, p_tipo_os_id: (selT && selT.value) || 'FORNECIMENTO',
          p_client_uid: 'neg-' + n.id + '-' + Date.now() });
      toast('OS ' + (r.numero||'') + ' aberta.','ok');
      fecharDrawer(); carregar();
    }catch(e){ toast(e.message,'err'); }
  }));

  // ── perder ──
  const sel = document.getElementById('ngM');
  if (sel){
    let motivos = [];
    try{ motivos = DEMO ? [{id:'preco',nome:'Preço'}]
        : await get('motivos_perda?select=*&ativo=is.true&order=nome'); }catch(e){}
    motivos.forEach(m => { const o = document.createElement('option');
      o.value = m.id; o.textContent = m.nome; sel.appendChild(o); });

    const bP = document.getElementById('ngPerde');
    bP.addEventListener('click', () => {
      if (!sel.value){ toast('Escolha o motivo da perda.','err'); return; }
      abrirModal('Marcar ' + n.numero + ' como perdido?',
        '<p class="nota">O card vai para “Recusadas” com o motivo <b>'
        + esc(sel.options[sel.selectedIndex].textContent) + '</b> e continua contando no funil. '
        + 'Dá para reabrir depois, se o cliente voltar.</p>',
        [{ label:'Cancelar', onClick: fecharModal },
         { label:'Registrar perda', pri:true, onClick: async () => {
            try{
              // passa por função, não por gravação direta na tabela: é ela que
              // exige o motivo e escreve a perda no histórico do card
              if (!DEMO) await rpc('tf_marcar_negocio_perdido', { p_id:n.id,
                p_motivo_id: sel.value,
                p_observacao: (document.getElementById('ngMO')||{}).value || null });
              fecharModal(); toast('Registrado como perdido.','ok');
              fecharDrawer(); pintarComercial();
            }catch(e){ toast(e.message,'err'); }
         }}]);
    });
  }

  // ── excluir ──
  const bX = document.getElementById('ngExcluir');
  if (bX) bX.addEventListener('click', () => {
    abrirModal('Excluir ' + n.numero + '?',
        '<p class="nota">' + esc(n.titulo || n.numero) + ' — '
      + esc(n.cliente_nome) + '.</p>'
      + '<div class="aviso"><b>Isso não tem como desfazer.</b> O card, o histórico e as tarefas '
      + 'dele são apagados. Fica registrado no livro das exclusões quem apagou e quando.'
      + (Number(n.propostas) > 0
          ? ' A(s) <b>' + Number(n.propostas) + ' proposta(s)</b> que nunca saíram para o cliente '
            + 'vão junto — os números ficam anotados no livro, e é isso que explica o buraco na '
            + 'numeração.'
          : '')
      + '</div>'
      + '<div class="campo"><label for="ngXM">Por quê? (fica no registro)</label>'
      + '<input id="ngXM" type="text" placeholder="Ex.: card de teste"></div>',
      [{ label:'Cancelar', onClick: fecharModal },
       { label:'Excluir de vez', pri:true, onClick: async () => {
          try{
            if (!DEMO) await rpc('tf_excluir_negocio',
              { p_id:n.id, p_motivo: (document.getElementById('ngXM')||{}).value || null });
            fecharModal(); toast(n.numero + ' excluído.','ok');
            fecharDrawer(); pintarComercial();
          }catch(e){ toast(e.message,'err'); }
       }}]);
  });
}

// ── ITEM 11 (S36): LANÇAR UMA PROPOSTA ANTIGA ─────────────────────────────────
// Para a proposta que a Engetap emitiu ANTES do TapFlow. Nasce no estágio
// certo (a coluna continua sendo calculada pelos fatos — o que o formulário
// grava são os fatos: envio, aprovação, recusa) e com as datas reais, que é o
// que põe a proposta no mês certo do relatório comercial. Duas coisas que o
// documento não previu e que a tela resolve:
//   · "Aprovada e já executada" — sem isso, a proposta antiga aprovada ficaria
//     em "Aprovadas" para sempre, e essa coluna quer dizer "falta abrir a OS".
//   · Número antigo no formato do TapFlow, à frente do contador: a prévia avisa
//     que o contador vai pular, senão o TapFlow emitiria o mesmo número depois.
async function formPropostaAntiga(){
  let motivos = [];
  try{ motivos = await get('motivos_perda?select=id,nome&ativo=is.true&order=nome'); }catch(e){}

  document.getElementById('dNum').textContent = 'Proposta antiga';
  document.getElementById('dCli').textContent = '';
  document.getElementById('dSub').textContent = 'Emitida antes do TapFlow — entra com a data e o número reais';
  document.getElementById('dTabs').innerHTML = '';
  document.getElementById('dAcoes').innerHTML = '';
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');

  const hoje = isoHoje();
  document.getElementById('dBody').innerHTML =
      '<div class="campo"><label for="paBusca">Cliente</label>'
    + '<input id="paBusca" type="text" placeholder="razão social, nome fantasia ou CNPJ" autocomplete="off" '
    + 'name="pab_nofill" data-lpignore="true" data-1p-ignore readonly onfocus="this.removeAttribute(\'readonly\')"></div>'
    + '<div id="paCliLista"></div><div id="paCliSel" class="nota" style="margin:-4px 0 12px"></div>'
    + '<div class="dupla"><div class="campo"><label for="paNum">Número da proposta</label>'
    +   '<input id="paNum" type="text" autocomplete="off" name="pan_nofill" placeholder="como está no papel, ex.: 25087"></div>'
    + '<div class="campo"><label for="paEm">Emitida em</label><input id="paEm" type="date" max="' + hoje + '"></div></div>'
    + campoDinheiro('paVal', 'Valor total', null)
    + '<div class="campo"><label for="paDesc">O que foi ofertado</label>'
    +   '<input id="paDesc" type="text" autocomplete="off" name="pad_nofill" placeholder="ex.: inspeção de 3 vasos e calibração"></div>'
    + '<div class="campo"><label for="paTit">Título do negócio (opcional)</label>'
    +   '<input id="paTit" type="text" autocomplete="off" name="pat_nofill" placeholder="vazio = “Proposta NNN (anterior ao TapFlow)”"></div>'
    + '<fieldset class="grupoOpc"><legend>O que aconteceu com ela</legend>'
    + [['enviada','Enviada, ainda sem resposta','vai para “Proposta enviada”'],
       ['aprovada','Aprovada — o serviço ainda está por fazer','vai para “Aprovadas”; dali abre a OS'],
       ['executada','Aprovada e já executada fora do TapFlow','vai para “Concluídos”'],
       ['recusada','Recusada pelo cliente','vai para “Recusadas”, com o motivo']].map(([v,r,d], i) =>
        '<label class="linhaOpc"><input type="radio" name="paSit" value="' + v + '"' + (i === 0 ? ' checked' : '') + '> '
      + '<span><b>' + r + '</b><br><small style="color:var(--ink-3)">' + d + '</small></span></label>').join('')
    + '</fieldset>'
    + '<div id="paResp" hidden>'
    +   '<div class="campo"><label for="paRespEm">Data da resposta do cliente</label><input id="paRespEm" type="date" max="' + hoje + '"></div>'
    +   '<div class="campo" id="paCtBox"><label for="paCt">Quem aprovou</label><select id="paCt"><option value="">— escolha o cliente primeiro —</option></select></div>'
    +   '<div class="campo" id="paMotBox" hidden><label for="paMot">Motivo da recusa</label><select id="paMot"><option value="">—</option>'
    +     (motivos || []).map(m => '<option value="' + esc(m.id) + '">' + esc(m.nome) + '</option>').join('') + '</select></div>'
    + '</div>'
    + '<div class="campo"><label for="paObs">Observação (opcional)</label><input id="paObs" type="text" autocomplete="off" name="pao_nofill"></div>'
    + '<div id="paAviso"></div>'
    + '<button class="btn pri" id="paOk" style="width:100%">Conferir e lançar</button>'
    + '<p class="nota">O histórico do negócio registra as datas reais e diz que o lançamento foi feito hoje, e por quem. '
    + 'O relatório comercial conta a proposta no mês em que ela foi emitida.</p>';
  ligarCampoDinheiro('paVal');

  let cliente = null;
  const escolher = async c => {
    cliente = c;
    document.getElementById('paCliLista').innerHTML = '';
    document.getElementById('paBusca').value = nomeCliente(c);
    document.getElementById('paCliSel').textContent = 'Cliente: ' + nomeCliente(c) + (c.cnpj ? ' · ' + c.cnpj : '');
    const sel = document.getElementById('paCt');
    sel.innerHTML = '<option value="">carregando…</option>';
