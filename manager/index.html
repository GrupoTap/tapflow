const arquivoParaBase64 = f => new Promise((ok, err) => {
  const r = new FileReader();
  r.onerror = () => err(new Error('Não consegui ler o arquivo.'));
  r.onload  = () => ok(r.result);
  r.readAsDataURL(f);
});

/**
 * Sobe para o Drive e registra o anexo. Sem cabeçalho customizado de propósito:
 * é o que evita o preflight OPTIONS, que o Apps Script não responde.
 */
async function subirArquivo(dataUrl, meta){
  if (DEMO){ demoAnexo(meta.os_id, meta.categoria, meta.nome);
             return { url:'https://drive.google.com/demo', file_id:'demo' }; }
  if (!driveLigado())
    throw Object.assign(new Error('O Google Drive ainda não foi configurado — veja o Passo 8 do guia.'),
                        { negocio:true });

  const r = await fetch(PARAM.drive_url, {
    method:'POST', redirect:'follow', signal: sinal(true),
    body: JSON.stringify({
      chave: PARAM.drive_chave, token: sessao.token,
      client_uid: meta.client_uid, cliente: meta.cliente, os_numero: meta.os_numero,
      categoria: meta.categoria, nome: meta.nome,
      mime: meta.mime || 'application/octet-stream', base64: dataUrl
    })
  });
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('O serviço de arquivos não respondeu como esperado.');
  if (j.status !== 'ok')
    throw Object.assign(new Error(j.mensagem || 'Falha ao gravar no Drive'),
                        { negocio: j.codigo === 'CHAVE' || j.codigo === 'TOKEN' });

  await rpc('tf_registrar_anexo', {
    p_os_id: meta.os_id, p_categoria: meta.categoria, p_nome: meta.nome,
    p_client_uid: meta.client_uid, p_drive_file_id: j.file_id, p_drive_url: j.url,
    p_mime: meta.mime, p_bytes: j.bytes || null
  });
  return j;
}

// ── jsPDF sob demanda ───────────────────────────────────────────────────────
// Carregado só quando alguém clica em "gerar PDF". Deixar no <head> custaria
// ~350 KB de download e parse em toda abertura do app, para uma função que a
// maioria das sessões nem usa.
let _jspdf = null;
function carregarJsPDF(){
  if (_jspdf) return _jspdf;
  _jspdf = new Promise((ok, err) => {
    if (window.jspdf && window.jspdf.jsPDF) return ok(window.jspdf.jsPDF);
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s2.onload  = () => (window.jspdf && window.jspdf.jsPDF)
      ? ok(window.jspdf.jsPDF)
      : err(new Error('A biblioteca de PDF carregou, mas não inicializou.'));
    s2.onerror = () => err(new Error('Não consegui baixar a biblioteca de PDF. Sem internet?'));
    document.head.appendChild(s2);
  });
  return _jspdf;
}

/* `new Date('2026-09-04')` é meia-noite UTC; em Brasília isso é 03/09 às 21h, e
   a data saía um dia atrás no PDF, na planilha e na tela. Data pura ganha meio-dia
   antes de virar Date; timestamp com hora passa direto. */
const dataBR = d => {
  if (!d) return new Date().toLocaleDateString('pt-BR');
  const t = String(d);
  return new Date(/^\d{4}-\d{2}-\d{2}$/.test(t) ? t + 'T12:00' : t).toLocaleDateString('pt-BR');
};
/* E o contrário: "hoje" em ISO. `toISOString()` depois das 21h já virou o dia
   seguinte, e o período do relatório terminava amanhã. */
const isoHoje = (d) => { const x = d || new Date();
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0')
       + '-' + String(x.getDate()).padStart(2,'0'); };

/**
 * Gera o PDF da OS.
 *   tipo 'levantamento' → sem valores. É o que se mostra ao cliente e à planta.
 *   tipo 'resumo'       → com custo, preço e margem. USO INTERNO.
 * A separação é deliberada: proposta ao cliente leva valor fechado; o cálculo
 * fica em documento interno.
 */
async function gerarPDF(tipo, card, itens){
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const interno = (tipo === 'resumo');
  const M = 15;
  let y = M;

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('ENGETAP ENGENHARIA', M, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text(interno ? 'Resumo da ordem de serviço — uso interno'
                   : 'Levantamento de acessórios · NR-13', M, y); y += 8;
  doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 7;

  doc.setFontSize(10);
  const linha = (k, v) => { doc.setFont('helvetica','bold'); doc.text(k, M, y);
    doc.setFont('helvetica','normal'); doc.text(String(v||'—'), M+32, y); y += 5.5; };
  linha('OS:', card.numero);
  linha('Cliente:', card.cliente);
  linha('Etapa:', card.coluna);
  linha('Emitido em:', dataBR());
  y += 4;

  const elegiveis = itens.filter(i => i.elegivel);
  const cols = interno
    ? [{t:'Item',x:M,w:76},{t:'Qtd',x:M+78,w:10,r:1},{t:'Custo un.',x:M+96,w:20,r:1},
       {t:'Preço un.',x:M+124,w:20,r:1},{t:'Total',x:M+152,w:22,r:1}]
    : [{t:'Item',x:M,w:112},{t:'Qtd',x:M+118,w:12,r:1},{t:'Calibração',x:M+140,w:24},
       {t:'Lacre',x:M+166,w:14}];

  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  cols.forEach(c => doc.text(c.t, c.r ? c.x + c.w : c.x, y, c.r ? {align:'right'} : undefined));
  y += 2; doc.setDrawColor(210); doc.line(M, y, 210-M, y); y += 4.5;

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  (interno ? elegiveis : itens).forEach(it => {
    if (y > 265){ doc.addPage(); y = M; }
    // até duas linhas: cortar a descrição do acessório em uma linha esconde
    // justamente a parte que identifica a peça (escala, bitola, rosca)
    const nome = doc.splitTextToSize(String(it.descricao||''), cols[0].w).slice(0, 2);
    doc.text(nome, cols[0].x, y);
    doc.text(String(Number(it.quantidade)), cols[1].x + cols[1].w, y, {align:'right'});
    if (interno){
      doc.text(BRL(it.custo_unitario||0), cols[2].x + cols[2].w, y, {align:'right'});
      doc.text(BRL(it.preco_unitario||0), cols[3].x + cols[3].w, y, {align:'right'});
      doc.text(BRL(it.total_venda||0),    cols[4].x + cols[4].w, y, {align:'right'});
    } else {
      doc.text(it.requer_calibracao ? 'sim' : '—', cols[2].x, y);
      doc.text(it.requer_lacre ? 'sim' : '—', cols[3].x, y);
      if (!it.elegivel){ doc.setFontSize(7.5); doc.setTextColor(120);
        doc.text('instalado em campo', cols[0].x + 2, y + 3.4 + (nome.length-1)*4.2);
        doc.setFontSize(9); doc.setTextColor(0); y += 3.4; }
    }
    y += 5.4 + (nome.length - 1) * 4.2;
  });

  y += 2; doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 6;

  if (interno){
    const c = elegiveis.reduce((a,i)=>a+Number(i.total_custo||0),0);
    const v = elegiveis.reduce((a,i)=>a+Number(i.total_venda||0),0);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Custo total:', M, y);  doc.text(BRL(c), M+60, y, {align:'right'}); y += 5.5;
    doc.text('Venda total:', M, y);  doc.text(BRL(v), M+60, y, {align:'right'}); y += 5.5;
    doc.text('Margem:', M, y);       doc.text(BRL(v-c) + (v>0 ? '   ('+Math.round((v-c)/v*100)+'%)' : ''),
                                              M+60, y, {align:'right'}); y += 9;
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('Documento interno — não enviar ao cliente.', M, y);
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Total de itens levantados: ' + itens.length, M, y); y += 14;
    doc.setDrawColor(140);
    doc.line(M, y, M+70, y); doc.line(120, y, 195, y); y += 4.5;
    doc.setFontSize(8); doc.setTextColor(110);
    doc.text('Inspetor Engetap', M, y);
    doc.text('Responsável pela planta', 120, y);
  }

  const nome = (interno ? 'resumo-' : 'levantamento-') + card.numero + '.pdf';
  return { blob: doc.output('datauristring'), nome };
}

// ABA ITENS — a tela de trabalho do Vinícius e do Glênio
// ----------------------------------------------------------------------------
// Digitar custo aqui é o que faz o gateway de agregação andar. Por isso, depois
// de cada gravação, o quadro é relido: se aquele foi o último item que faltava,
// o card muda de coluna na frente de quem digitou.
// ════════════════════════════════════════════════════════════════════════════
const BRL = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

async function pintarItens(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  document.getElementById('dAcoes').innerHTML = '';
  body.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando itens…</p>';

  let itens;
  try{
    itens = DEMO ? demoItens(card.os_id)
      : await get('os_itens?select=id,descricao,tipo_acessorio,quantidade,elegivel,fornecedor,'
        + 'custo_unitario,preco_unitario,total_custo,total_venda,margem_valor,aprovado,'
        + 'requer_calibracao,recebido_em,certificado_num'
        + '&os_id=eq.' + card.os_id + '&order=created_at');
  }catch(e){ body.innerHTML=''; const p=document.createElement('p');
             p.style.color='var(--crit)'; p.textContent=e.message; body.appendChild(p); return; }

  if (!itens.length){
    body.innerHTML = '<div class="vazio" style="padding:40px 10px"><h3>Nenhum item ainda</h3>'
      + '<p>Os itens entram pelo TapFlow Field, quando o inspetor envia o levantamento.</p></div>';
    return;
  }

  body.innerHTML = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
    + '<th>Item</th><th>Qtd</th><th>Fornecedor</th><th>Custo un.</th><th>Preço un.</th><th>Margem</th>'
    + '</tr></thead><tbody></tbody></table></div>';
  const tb = body.querySelector('tbody');

  itens.forEach(it => {
    const tr = document.createElement('tr');
    if (!it.elegivel) tr.className = 'fora';
    tr.innerHTML = '<td class="d"></td><td class="num q"></td>'
      + '<td><input class="f" type="text" placeholder="—"></td>'
      + '<td><input class="c" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></td>'
      + '<td><input class="p" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></td>'
      + '<td class="num m"></td>';
    tr.querySelector('.d').textContent = it.descricao;
    tr.querySelector('.q').textContent = Number(it.quantidade);
    const fi = tr.querySelector('.f'), ci = tr.querySelector('.c'), pi = tr.querySelector('.p');
    fi.value = it.fornecedor || '';
    ci.value = it.custo_unitario != null ? it.custo_unitario : '';
    pi.value = it.preco_unitario != null ? it.preco_unitario : '';
    if (it.elegivel && !(Number(it.custo_unitario) > 0)) ci.classList.add('falta');
    if (it.elegivel && !(Number(it.preco_unitario) > 0)) pi.classList.add('falta');
    tr.querySelector('.m').textContent = it.margem_valor != null ? BRL(it.margem_valor) : '—';
    if (!it.elegivel){ [fi,ci,pi].forEach(x => x.disabled = true); }

    const grava = (campo, el, numerico) => el.addEventListener('change', async () => {
      const bruto = el.value.trim();
      const valor = numerico ? (bruto === '' ? null : Number(bruto)) : (bruto || null);
      if (numerico && bruto !== '' && !(valor >= 0)){ toast('Valor inválido.','err'); return; }
      el.disabled = true;
      try{
        if (DEMO) demoGravarItem(card.os_id, it.id, campo, valor);
        else await patch('os_itens', 'id=eq.' + it.id, { [campo]: valor });
        const colAntes = card.coluna;
        await carregar({silencioso:true});
        const novo = cards.find(x => x.os_id === card.os_id);
        if (novo && novo.coluna !== colAntes){
          toast('Etapa concluída — o card foi para "' + novo.coluna + '".', 'ok');
          osAberta.card = novo;
          document.getElementById('dSub').textContent =
            novo.coluna + ' · quadro ' + (novo.quadro === 'campo' ? 'do campo' : 'da gestão');
        }
        pintarItens();
      }catch(e){ toast(e.message,'err'); el.disabled = false; }
    });
    grava('fornecedor', fi, false);
    grava('custo_unitario', ci, true);
    grava('preco_unitario', pi, true);
    tb.appendChild(tr);
  });

  const el = itens.filter(i => i.elegivel);
  const somaC = el.reduce((s,i)=>s+Number(i.total_custo||0),0);
  const somaV = el.reduce((s,i)=>s+Number(i.total_venda||0),0);
  const somaM = somaV - somaC;
  const t = document.createElement('div'); t.className = 'totais';
  t.innerHTML = '<div><div class="k">Custo</div><div class="v"></div></div>'
              + '<div><div class="k">Venda</div><div class="v"></div></div>'
              + '<div><div class="k">Margem</div><div class="v ' + (somaM>=0?'pos':'neg') + '"></div></div>';
  t.querySelectorAll('.v')[0].textContent = BRL(somaC);
  t.querySelectorAll('.v')[1].textContent = BRL(somaV);
  t.querySelectorAll('.v')[2].textContent = BRL(somaM) + (somaV>0 ? '  ·  ' + Math.round(somaM/somaV*100) + '%' : '');
  body.appendChild(t);

  const falta = el.filter(i => !(Number(i.custo_unitario)>0)).length;
  const faltaP = el.filter(i => !(Number(i.preco_unitario)>0)).length;
  const n = document.createElement('p');
  n.style.cssText = 'font-size:12.5px;color:var(--ink-3);margin:12px 0 0;line-height:1.5';
  n.textContent = falta ? falta + ' item(ns) ainda sem custo — a etapa de cotação só fecha no último.'
    : faltaP ? faltaP + ' item(ns) sem preço de venda — a etapa de precificação fecha quando todos tiverem.'
    : 'Todos os itens elegíveis têm custo e preço.';
  body.appendChild(n);
}

// ════════════════════════════════════════════════════════════════════════════
// GERADOR DE PROPOSTA — o motor .docx dentro do TapFlow
// ----------------------------------------------------------------------------
// Portado do gerador que você já usava, com duas mudanças que só fazem sentido
// aqui dentro:
//
//  1. Os DADOS DO CLIENTE não são digitados: vêm da OS. Era o passo em que
//     mais se erra — proposta com o endereço do cliente anterior.
//  2. A TABELA DE ITENS pode ser reescrita com os itens da OS, e não só
//     editada linha a linha. O modelo vem com os itens da última proposta que
//     alguém salvou; hoje isso é apagado à mão toda vez.
//
// O motor continua o mesmo por dentro: substitui «Chave» dentro do XML do
// .docx, achata os campos de mala direta do Word e reescreve a tabela de
// 5 colunas. Nada sai do navegador — o arquivo é montado aqui e baixado.
// ════════════════════════════════════════════════════════════════════════════

let _jszip = null;
function carregarJSZip(){
  if (_jszip) return _jszip;
  _jszip = new Promise((ok, err) => {
    if (window.JSZip) return ok(window.JSZip);
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s2.onload  = () => window.JSZip ? ok(window.JSZip)
      : err(new Error('A biblioteca de .docx carregou, mas não inicializou.'));
    s2.onerror = () => err(new Error('Não consegui baixar a biblioteca de .docx. Sem internet?'));
    document.head.appendChild(s2);
  });
  return _jszip;
}

// ── o modelo vem do Storage, e fica na memória ──────────────────────────────
// 450 KB por modelo. Baixar de novo a cada geração seria desperdício óbvio
// para quem emite três propostas seguidas do mesmo tipo.
const _modelosCache = {};
/** Quantos cabeçalhos deste modelo trazem logomarca de cliente. */
async function logoDeClienteNoModelo(bytes){
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(bytes);
  let n = 0;
  for (const nome of Object.keys(zip.files)){
    if (!/^word\/header\d*\.xml$/.test(nome)) continue;
    const t = await zip.file(nome).async('string');
    if ((t.match(/r:embed="/g) || []).length >= 2) n++;
  }
  return n;
}

async function baixarModelo(path){
  if (_modelosCache[path]) return _modelosCache[path];
  const url = SUPABASE_URL + '/storage/v1/object/modelos/' + encodeURIComponent(path);
  const pega = async () => fetch(url, { headers: Object.assign(
    { apikey: SUPABASE_ANON_KEY },
    sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {}) });
  let r = await pega();
  if (r.status === 401 && sessao.refresh && await renovarToken()) r = await pega();
  if (r.status === 400 || r.status === 404)
    throw new Error('O modelo "' + path + '" não está no bucket `modelos`. '
      + 'Suba o arquivo pelo painel do Supabase (Storage → modelos).');
  if (r.status === 403)
    throw new Error('Sem permissão para ler o bucket `modelos`. '
      + 'Falta a política de leitura — veja o fim do 23_gerador_modelos.sql.');
  if (!r.ok) throw new Error('Não consegui baixar o modelo (HTTP ' + r.status + ').');
  const b = await r.arrayBuffer();
  _modelosCache[path] = b;
  return b;
}

// ── utilidades do XML do Word ───────────────────────────────────────────────
const _xmlEsc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const _semAcento = s => String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();

function _tags(xml, tag){
  return xml.match(new RegExp('<' + tag + '(?:\\s[^>]*)?>[\\s\\S]*?<\\/' + tag + '>','g')) || [];
}
function _textoCelula(tc){
  return [...tc.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m => m[1]).join('').trim();
}
/** Escreve no PRIMEIRO <w:t> da célula e esvazia os outros — assim o texto
 *  novo herda a formatação do primeiro trecho e não sobra resto do antigo. */
function _escreveCelula(tc, txt){
  let n = 0;
  const nova = tc.replace(/(<w:t[^>]*>)([^<]*)(<\/w:t>)/g, (m,a,b,c) => {
    n++; return n === 1 ? a + _xmlEsc(txt) + c : a + c;
  });
  // célula sem nenhum <w:t> (parágrafo vazio): não dá para escrever, devolve como está
  return n ? nova : tc;
}

/**
 * Acha a tabela de itens: 5 colunas, com "Valor Unit..." e "Valor Total" no
 * cabeçalho. É o mesmo reconhecimento do gerador antigo — os modelos 24, 29 e
 * 30 têm; os outros não, e isso está registrado em `modelos_proposta.tem_tabela`.
 */
function acharTabelaItens(xml){
  for (const tbl of _tags(xml,'w:tbl')){
    const linhas = _tags(tbl,'w:tr');
    if (linhas.length < 2) continue;
    const cabec = _tags(linhas[0],'w:tc').map(_textoCelula);
    const n = cabec.map(_semAcento);
    if (cabec.length === 5
        && n.some(h => h.includes('valor unit'))
        && n.some(h => h.includes('valor') && h.includes('total'))){
      const dados = linhas.slice(1);
      let linhaTotal = null, linhasItem = dados;
      if (dados.length && _tags(dados[dados.length-1],'w:tc').length < 5){
        linhaTotal = dados[dados.length-1];
        linhasItem = dados.slice(0,-1);
      }
      if (!linhasItem.length) continue;
      return {
        tabela: tbl,
        antes: tbl.slice(0, tbl.indexOf(linhas[0])),
        cabecalho: linhas[0],
        molde: linhasItem[0],          // a fôrma para as linhas novas
        linhasItem, linhaTotal,
        itens: linhasItem.map(tr => {
          const cs = _tags(tr,'w:tc');
          return { seq:_textoCelula(cs[0]), descricao:_textoCelula(cs[1]),
                   qtd:_textoCelula(cs[2]), unitario:_textoCelula(cs[3]),
                   total:_textoCelula(cs[4]) };
        })
      };
    }
  }
  return null;
}

/**
 * Reescreve a tabela com as linhas dadas — quantas forem. O gerador antigo só
 * conseguia editar as linhas que já existiam no modelo; aqui a primeira linha
 * vira fôrma e a tabela cresce ou encolhe conforme a OS.
 */
function reescreverTabela(t, linhas, totalTexto){
  const novas = linhas.map((it, i) => {
    let tr = t.molde;
    const cs = _tags(tr,'w:tc');
    const vals = [String(i+1), it.descricao, it.qtd, it.unitario, it.total];
    cs.forEach((c, idx) => { tr = tr.replace(c, _escreveCelula(c, vals[idx])); });
    return tr;
  });
  let rodape = t.linhaTotal;
  if (rodape){
    const cs = _tags(rodape,'w:tc');
    const ult = cs[cs.length-1];
    rodape = rodape.replace(ult, _escreveCelula(ult, totalTexto));
  }
  return t.antes + t.cabecalho + novas.join('') + (rodape || '') + '</w:tbl>';
}

// ── A LOGOMARCA DO CLIENTE ANTERIOR ─────────────────────────────────────────
// Todo modelo .docx da Engetap guarda, no canto direito do cabeçalho, a
// logomarca do cliente para quem ele foi usado da última vez. Conferi os oito:
// tem CEFET-MG, Atlas, Sibelco, Setormec, PH e Servitec. Quem gera a proposta
// hoje precisa lembrar de apagar isso no Word — e uma proposta que sai com a
// marca de outro cliente é um constrangimento caro.
//
// O cabeçalho é [ logo Engetap | texto | logo do cliente ]. A logomarca do
// cliente é sempre a ÚLTIMA imagem do cabeçalho, e só existe quando o
// cabeçalho tem duas. Com uma só, é a da Engetap e não se toca em nada.

function contarImagensCabecalho(nome, xml){
  return (nome.startsWith('word/header') ? (xml.match(/r:embed="/g) || []).length : 0);
}

/** Tira a última imagem do cabeçalho, apagando o <w:r> inteiro que a contém. */
function removerLogoCliente(xml){
  const ult = xml.lastIndexOf('r:embed="');
  if (ult < 0) return xml;
  const ini = xml.lastIndexOf('<w:r ', ult) >= 0
    ? Math.max(xml.lastIndexOf('<w:r ', ult), xml.lastIndexOf('<w:r>', ult))
    : xml.lastIndexOf('<w:r>', ult);
  if (ini < 0) return xml;
  const fim = xml.indexOf('</w:r>', ult);
  if (fim < 0) return xml;
  return xml.slice(0, ini) + xml.slice(fim + 6);
}


// ── mala direta do Word ─────────────────────────────────────────────────────
// Os modelos vieram de mala direta. Se os campos MERGEFIELD ficarem, o Word
// abre o arquivo tentando reconectar a fonte de dados e pede a planilha antiga.
function _achatarMailMerge(xml){
  const re = /<w:r\b[^>]*>[\s\S]*?<\/w:r>/g;
  let out = [], estado = 'normal', ultimo = 0, m;
  while ((m = re.exec(xml)) !== null){
    out.push(xml.slice(ultimo, m.index)); ultimo = re.lastIndex;
    const run = m[0];
    if (run.indexOf('fldCharType="begin"') !== -1){ estado = 'codigo'; continue; }
    if (run.indexOf('fldCharType="separate"') !== -1){ estado = 'valor'; continue; }
    if (run.indexOf('fldCharType="end"') !== -1){ estado = 'normal'; continue; }
    if (estado === 'codigo') continue;
    out.push(run);
  }
  out.push(xml.slice(ultimo));
  return out.join('').replace(
    /<w:fldSimple\s+w:instr="[^"]*MERGEFIELD[^"]*"[^>]*>([\s\S]*?)<\/w:fldSimple>/g, '$1');
}

/** O Word quebra «Chave» em vários trechos (corretor, revisões). Junta antes de trocar. */
function _juntarPlaceholders(xml){
  return xml.replace(/«([\s\S]{0,600}?)»/g, (todo, dentro) => {
    if (dentro.indexOf('<') === -1) return todo;
    if (dentro.indexOf('</w:p>') !== -1) return todo;
    if (dentro.indexOf('«') !== -1) return todo;
    return '«' + dentro.replace(/<[^>]+>/g,'') + '»';
  });
}

/** Monta o .docx final. Devolve { blob, faltaram } — `faltaram` são as chaves
 *  que ficaram no papel sem valor, para a tela poder avisar em vez de entregar
 *  uma proposta com «Cliente» impresso no meio do texto. */
async function docxGerar({ bytes, valores, tabela, totalTexto, tirarLogoCliente }){
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(bytes);
  const alvos = Object.keys(zip.files).filter(n => /^word\/.*\.xml$/.test(n) && !zip.files[n].dir);
  const faltaram = new Set();
  let logosTiradas = 0;

  for (const nome of alvos){
    let t = await zip.file(nome).async('string');
    let mexeu = false;

    if (tirarLogoCliente && contarImagensCabecalho(nome, t) >= 2){
      t = removerLogoCliente(t); mexeu = true; logosTiradas++;
    }

    if (t.indexOf('«') !== -1){
      const j = _juntarPlaceholders(t);
      if (j !== t){ t = j; mexeu = true; }
      for (const k in valores){
        const tag = '«' + k + '»';
        if (t.indexOf(tag) !== -1){ t = t.split(tag).join(_xmlEsc(valores[k] ?? '')); mexeu = true; }
      }
      // o que sobrou com « » é chave que ninguém preencheu
      for (const m of t.matchAll(/«([^«»]{1,60})»/g)) faltaram.add(m[1].trim());
    }
    if (t.indexOf('MERGEFIELD') !== -1){ t = _achatarMailMerge(t); mexeu = true; }
    if (nome === 'word/settings.xml' && t.indexOf('mailMerge') !== -1){
      t = t.replace(/<w:mailMerge>[\s\S]*?<\/w:mailMerge>/g,''); mexeu = true;
    }
    if (nome === 'word/document.xml' && tabela && tabela.length){
      const achada = acharTabelaItens(t);
      if (achada){ t = t.replace(achada.tabela, reescreverTabela(achada, tabela, totalTexto)); mexeu = true; }
    }
    if (mexeu) zip.file(nome, t);
  }

  const blob = await zip.generateAsync({ type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  return { blob, faltaram: [...faltaram], logosTiradas };
}

const nomeSeguro = s => String(s||'').replace(/[/\\:*?"<>|]/g,'').replace(/\s+/g,' ').trim();

function baixarBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

// ── A TELA ──────────────────────────────────────────────────────────────────
// Fica no topo da aba Proposta, acima do registro manual, que continua ali
// para a proposta que vier de fora.

let _modelos = null;
// O resultado da geração precisa sobreviver ao redesenho da aba: sem isto, a
// mensagem some no mesmo instante em que aparece, junto com o aviso das chaves
// que ficaram vazias — que é justamente o que a pessoa precisa ler.
let _msgGerador = null;
async function listarModelos(){
  if (_modelos) return _modelos;
  _modelos = DEMO
    ? [{id:'24',titulo:'Inspeção NR-13 — básico 2024.2',tem_tabela:true,e_contrato:false,storage_path:'24.docx'},
       {id:'26',titulo:'Minuta de contrato de inspeção',tem_tabela:false,e_contrato:true,storage_path:'26.docx'}]
    : await get('modelos_proposta?select=id,titulo,descricao,tem_tabela,e_contrato,storage_path'
                + '&ativo=eq.true&order=ordem');
  return _modelos;
}

// as chaves que, vazias, estragam a proposta na frente do cliente
const CHAVES_CRITICAS = ['Cliente','Endereço_Cliente','Cidade','Contato'];
const ROTULO_CHAVE = {
  'Cliente':'Cliente', 'CNPJ_Cliente':'CNPJ', 'Endereço_Cliente':'Endereço',
  'Nº_Cliente':'Número', 'Bairro_Cliente':'Bairro', 'Cidade':'Cidade',
  'CEP_Cliente':'CEP', 'Contato':'Contato', 'Telefone_do_Contato':'Telefone',
  'Autor':'Autor (quem assina)', 'TítuloNatureza':'Natureza do serviço'
};
const CHAVES_NA_TELA = ['Cliente','CNPJ_Cliente','Endereço_Cliente','Nº_Cliente',
  'Bairro_Cliente','Cidade','CEP_Cliente','Contato','Telefone_do_Contato','Autor'];

async function montarGerador(caixa){
  const { card } = osAberta;
  const est = { modelo:null, valores:null, itens:[], fonte:'os', total:0, tirarLogo:true, logos:0 };

  caixa.innerHTML =
    '<h3 style="font-size:15px;margin:0 0 4px">Gerar proposta</h3>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.5">' +
      'O documento sai com os dados desta OS já preenchidos. Confira antes de gerar — ' +
      'o que estiver vazio aqui sai vazio no papel.</p>' +
    '<div class="campo"><label for="gM">Modelo</label><select id="gM"></select>' +
      '<div class="dica" id="gMd"></div></div>' +
    '<div class="campo"><label for="gNat">Natureza do serviço</label>' +
      '<input id="gNat" type="text" placeholder="ex.: Inspeção em vasos de pressão"></div>' +
    '<div id="gVals"></div>' +
    '<div id="gTab"></div>' +
    '<div id="gLogo"></div>' +
    '<button class="btn pri" id="gOk" style="width:100%;padding:11px">Gerar e baixar o .docx</button>' +
    '<div class="dica" id="gMsg" style="margin-top:8px"></div>';

  if (_msgGerador){
    const m0 = caixa.querySelector('#gMsg');
    m0.style.color = _msgGerador.cor; m0.textContent = _msgGerador.texto;
    _msgGerador = null;
  }

  const sel = document.getElementById('gM');
  let modelos = [];
  try{ modelos = await listarModelos(); }
  catch(e){ caixa.innerHTML = '<p class="dica">Não consegui ler os modelos: ' + esc(e.message) + '</p>'; return; }
  if (!modelos.length){
    caixa.innerHTML = '<h3 style="font-size:15px;margin:0 0 4px">Gerar proposta</h3>' +
      '<p class="dica">Nenhum modelo cadastrado. Rode o <b>23_gerador_modelos.sql</b> e suba os ' +
      '.docx no bucket <b>modelos</b>.</p>';
    return;
  }
  sel.innerHTML = modelos.map(m => '<option value="'+m.id+'">'+esc(m.titulo)+'</option>').join('');
  document.getElementById('gNat').value = card.descricao || '';

  // ── os valores que vão para o documento ──
  const pintarValores = () => {
    const el = document.getElementById('gVals');
    const v = est.valores || {};
    const faltando = CHAVES_CRITICAS.filter(k => !String(v[k]||'').trim());
    el.innerHTML =
      '<div style="border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 14px">' +
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;' +
      'color:var(--ink-3);margin-bottom:9px">Dados que vão no documento</div>' +
      '<div class="gGrid"></div>' +
      (faltando.length
        ? '<p class="gFalta">Vazio: ' + faltando.map(k => ROTULO_CHAVE[k]||k).join(', ') +
          '. Preencha aqui para esta proposta, e corrija no cadastro do cliente depois.</p>'
        : '') +
      '</div>';
    const g = el.querySelector('.gGrid');
    CHAVES_NA_TELA.forEach(k => {
      const d = document.createElement('div'); d.className = 'campo'; d.style.margin = '0';
      d.innerHTML = '<label></label><input type="text">';
      d.querySelector('label').textContent = ROTULO_CHAVE[k] || k;
      const i = d.querySelector('input');
      i.value = v[k] || '';
      if (!String(v[k]||'').trim() && CHAVES_CRITICAS.includes(k)) i.classList.add('vazio');
      i.addEventListener('input', () => {
        est.valores[k] = i.value;
        i.classList.toggle('vazio', !i.value.trim() && CHAVES_CRITICAS.includes(k));
      });
      g.appendChild(d);
    });
  };

  // ── a tabela de itens ──
  const pintarTabela = () => {
    const el = document.getElementById('gTab');
    const m = est.modelo;
    if (!m || !m.tem_tabela){
      el.innerHTML = m && m.e_contrato
        ? '<p class="dica" style="margin:0 0 14px">Minuta de contrato: sem tabela de itens.</p>'
        : '<p class="dica" style="margin:0 0 14px">Este modelo não tem a tabela de 5 colunas que o ' +
          'motor reescreve — os valores continuam sendo ajustados no Word, como antes.</p>';
      return;
    }
    const daOS = est.itens || [];
    el.innerHTML =
      '<div class="campo"><label>Itens da tabela</label>' +
      '<div class="tog" id="gFonte">' +
        '<button type="button" data-v="os">Itens da OS (' + daOS.length + ')</button>' +
        '<button type="button" data-v="modelo">Itens do modelo</button>' +
      '</div></div>' +
      '<div id="gPrev"></div>';
    const tg = document.getElementById('gFonte');
    const pinta = () => {
      [...tg.children].forEach(b => b.classList.toggle('on', b.dataset.v === est.fonte));
      const p = document.getElementById('gPrev');
      if (est.fonte === 'modelo'){
        p.innerHTML = '<p class="dica" style="margin:0 0 14px">A tabela sai como está no modelo — ' +
          'com os itens da última proposta salva nele. Ajuste no Word depois de baixar.</p>';
        return;
      }
      if (!daOS.length){
        p.innerHTML = '<p class="dica" style="margin:0 0 14px;color:var(--warn)">Esta OS ainda não tem ' +
          'itens aprovados. Sem itens, escolha "Itens do modelo".</p>';
        return;
      }
      p.innerHTML = '<div style="overflow-x:auto;margin:0 0 14px"><table class="tbl"><thead><tr>' +
        '<th>#</th><th>Item</th><th class="num">Qtd</th><th class="num">Unitário</th><th class="num">Total</th>' +
        '</tr></thead><tbody></tbody><tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">Total</td>' +
        '<td class="num" style="font-weight:700" id="gTot"></td></tr></tfoot></table></div>';
      const tb = p.querySelector('tbody');
      daOS.forEach((it, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="mono"></td><td class="d"></td><td class="num q"></td>' +
                       '<td class="num u"></td><td class="num t"></td>';
        tr.children[0].textContent = i+1;
        tr.querySelector('.d').textContent = it.descricao;
        tr.querySelector('.q').textContent = it.qtd;
        tr.querySelector('.u').textContent = it.unitario;
        tr.querySelector('.t').textContent = it.total;
        tb.appendChild(tr);
      });
      document.getElementById('gTot').textContent = BRL(est.total);
    };
    [...tg.children].forEach(b => b.addEventListener('click', () => { est.fonte = b.dataset.v; pinta(); }));
    pinta();
  };

  // ── a logomarca do cliente anterior ──
  const pintarLogo = () => {
    const el = document.getElementById('gLogo');
    if (!est.logos){ el.innerHTML = ''; return; }
    el.innerHTML =
      '<div style="background:var(--warn-soft);border-radius:5px;padding:11px 12px;margin:0 0 14px">' +
      '<p style="font-size:12.5px;color:var(--warn);margin:0 0 9px;line-height:1.45;font-weight:600">' +
      'Este modelo tem a logomarca de OUTRO cliente no cabeçalho — sobra da última vez ' +
      'que ele foi usado.</p>' +
      '<label class="check" style="margin:0"><input type="checkbox" id="gLogoX">' +
      '<span>Tirar a logomarca do cabeçalho</span></label></div>';
    const c = document.getElementById('gLogoX');
    c.checked = est.tirarLogo;
    c.addEventListener('change', () => { est.tirarLogo = c.checked; });
  };

  // ── trocar de modelo recarrega tudo ──
  const trocar = async () => {
    est.modelo = modelos.find(m => m.id === sel.value);
    document.getElementById('gMd').textContent = (est.modelo && est.modelo.descricao) || '';
    const nat = document.getElementById('gNat').value.trim();
    try{
      const [v, itens] = DEMO
        ? [demoValores(card), []]
        : await Promise.all([
            rpc('tf_valores_proposta', { p_os_id: card.os_id, p_numero: '(ao gerar)', p_natureza: nat || null }),
            rpc('tf_itens_proposta',   { p_os_id: card.os_id })
          ]);
      est.valores = v || {};
      est.itens = itens || [];
      est.total = est.itens.reduce((s,i) => s + (Number(i.valor_total_num)||0), 0);
      est.fonte = est.itens.length ? 'os' : 'modelo';
    }catch(e){ toast('Não consegui montar os dados: ' + e.message, 'err'); est.valores = est.valores || {}; }
    pintarValores(); pintarTabela();
    // o modelo é baixado aqui só para saber se tem logomarca de cliente. Vale a
    // pena: é o defeito mais caro de todos, e descobrir depois de enviar não
    // adianta. Fica em cache para a hora de gerar.
    est.logos = 0; pintarLogo();
    try{
      const b = await baixarModelo(est.modelo.storage_path || (est.modelo.id + '.docx'));
      est.logos = await logoDeClienteNoModelo(b);
    }catch(e){ /* se não der para baixar agora, o erro aparece ao gerar */ }
    pintarLogo();
  };
  sel.addEventListener('change', trocar);
  document.getElementById('gNat').addEventListener('change', () => {
    if (!est.valores) return;
    const nat = document.getElementById('gNat').value.trim();
    est.valores['TítuloNatureza'] = nat;
    est.valores['Natureza_do_Serviço'] = nat;
  });
  await trocar();

  // ── gerar ──
  document.getElementById('gOk').addEventListener('click', async () => {
    const b = document.getElementById('gOk');
    const msg = document.getElementById('gMsg');
    if (!est.modelo || !est.valores) return;
    b.disabled = true; msg.style.color = ''; msg.textContent = 'Reservando o número…';
    let numero = null;
    try{
      // 1. o número primeiro: ele precisa ir DENTRO do arquivo
      numero = DEMO ? 'PROP-2026-0099' : await rpc('tf_reservar_numero_proposta', {});
      est.valores['Nº_da_Proposta'] = numero;

      msg.textContent = 'Baixando o modelo…';
      const bytes = await baixarModelo(est.modelo.storage_path || (est.modelo.id + '.docx'));

      msg.textContent = 'Montando o documento…';
      const usaOS = est.modelo.tem_tabela && est.fonte === 'os' && est.itens.length;
      const { blob, faltaram, logosTiradas } = await docxGerar({
        bytes, valores: est.valores,
        tabela: usaOS ? est.itens : null,
        totalTexto: BRL(est.total).replace(/ /g,' '),
        tirarLogoCliente: est.tirarLogo
      });

      const nome = nomeSeguro(numero + ' - ' + (est.valores['Cliente']||'Cliente')
        + ' - ' + (document.getElementById('gNat').value.trim() || est.modelo.titulo)) + '.docx';
      baixarBlob(blob, nome);

      msg.textContent = 'Registrando na OS…';
      if (!DEMO) await rpc('tf_registrar_documento_gerado', {
        p_os_id: card.os_id, p_modelo_id: est.modelo.id, p_numero: numero,
        p_valores: est.valores, p_itens: usaOS ? est.itens : null,
        p_valor_total: usaOS ? est.total : null,
        p_nome_arquivo: nome,
        p_natureza: document.getElementById('gNat').value.trim() || null
      });

      const antes = card.coluna;
      if (!DEMO) await carregar({silencioso:true});
      const novo = cards.find(x => x.os_id === card.os_id);
      if (novo) osAberta.card = novo;

      _msgGerador = { cor:'var(--ok)', texto: numero + ' gerada e baixada.'
        + (logosTiradas ? ' Logomarca do cliente anterior removida do cabeçalho.' : '')
        + (faltaram.length ? ' ⚠ Ficaram sem valor no papel: ' + faltaram.join(', ') + '.' : '')
        + (novo && novo.coluna !== antes ? ' O card foi para "' + novo.coluna + '".' : '') };
      toast('Proposta ' + numero + ' gerada.', 'ok');
      pintarProposta();
    }catch(e){
      msg.style.color = 'var(--crit)';
      msg.textContent = e.message + (numero ? ' (o número ' + numero + ' foi queimado — não é problema.)' : '');
      b.disabled = false;
    }
  });
}

// ABA PROPOSTA — gerar aqui, ou registrar a que veio de fora
// ════════════════════════════════════════════════════════════════════════════
async function pintarProposta(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  document.getElementById('dAcoes').innerHTML = '';
  body.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando…</p>';

  let props = [], falhouProp = null;
  try{
    props = DEMO ? (demoPropostas(card.os_id) || [])
      : await get('v_propostas?select=*&os_id=eq.' + card.os_id + '&order=versao.desc');
  }catch(e){
    // "não consegui ler" ≠ "não existe". Sem esta distinção, alguém emite a
    // segunda proposta achando que a primeira nunca saiu.
    falhouProp = e.message;
  }

  body.innerHTML = '';
  if (falhouProp){
    const w = document.createElement('div');
    w.className = 'vazio2'; w.style.cssText = 'padding:18px 10px;text-align:left';
    w.innerHTML = '<b>Não deu para ler as propostas desta OS</b><p class="mt"></p>';
    w.querySelector('.mt').textContent = falhouProp
      + ' — pode existir proposta emitida que não está aparecendo aqui.';
    body.appendChild(w);
  }
  if (props.length){
    const w = document.createElement('div'); w.style.marginBottom = '18px';
    w.innerHTML = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
      + '<th>Número</th><th>V.</th><th>Status</th><th>Valor</th><th>Parada</th>'
      + '</tr></thead><tbody></tbody></table></div>';
    const tb = w.querySelector('tbody');
    props.forEach(pr => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="mono n"></td><td class="num v"></td><td class="s"></td>'
                   + '<td class="num t"></td><td class="num d"></td>';
      tr.querySelector('.n').textContent = pr.numero;
      tr.querySelector('.v').textContent = pr.versao;
      tr.querySelector('.s').textContent = pr.status;
      tr.querySelector('.t').textContent = BRL(pr.valor_total);
      tr.querySelector('.d').textContent = pr.dias_sem_resposta != null ? pr.dias_sem_resposta + 'd' : '—';
      tb.appendChild(tr);
    });
    body.appendChild(w);
  }

  // ── gerar a proposta aqui dentro ──
  const g = document.createElement('div');
  g.style.cssText = 'border:1px solid var(--rule);border-radius:6px;padding:15px;margin-bottom:20px';
  g.innerHTML = '<p class="dica" style="margin:0">Carregando os modelos…</p>';
  body.appendChild(g);
  montarGerador(g).catch(e => { g.innerHTML = '<p class="dica"></p>';
    g.querySelector('p').textContent = 'Gerador indisponível: ' + e.message; });

  const f = document.createElement('div');
  f.style.cssText = 'border-top:1px solid var(--rule-2);padding-top:18px';
  f.innerHTML =
    '<h3 style="font-size:15px;margin:0 0 4px">Registrar proposta feita fora</h3>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.5">' +
      'Para a proposta que não saiu daqui — só o número entra, e é esse registro ' +
      'que fecha a etapa e move o card.</p>' +
    '<div class="campo"><label for="pN">Número da proposta</label>' +
      '<input id="pN" type="text" placeholder="ex.: ORC-8842"></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label for="pV">Valor total</label>' +
        '<input id="pV" type="number" step="0.01" min="0" inputmode="decimal" placeholder="deixe vazio p/ usar o da OS"></div>' +
      '<div class="campo"><label for="pD">Validade</label><input id="pD" type="date"></div>' +
    '</div>' +
    '<div class="campo"><label for="pF">PDF da proposta</label>' +
      '<input id="pF" type="file" accept="application/pdf">' +
      '<div class="dica" id="pFd"></div></div>' +
    '<button class="btn pri" id="pOk" style="width:100%;padding:11px">Registrar e mover o card</button>';
  body.appendChild(f);

  const dicaF = document.getElementById('pFd');
  dicaF.textContent = driveLigado()
    ? 'O arquivo vai para o Drive da Engetap, na pasta do cliente e da OS.'
    : 'O Google Drive ainda não foi configurado — dá para registrar o número sem o arquivo.';
  document.getElementById('pF').disabled = !driveLigado();

  const d = new Date(); d.setDate(d.getDate() + 15);
  document.getElementById('pD').value = d.toISOString().slice(0,10);

  document.getElementById('pOk').addEventListener('click', async () => {
    const num = document.getElementById('pN').value.trim();
    if (!num){ toast('Informe o número da proposta.','err'); return; }
    const b = document.getElementById('pOk'); b.disabled = true;
    const arq = (document.getElementById('pF').files || [])[0];
    try{
      // O arquivo sobe ANTES do registro: se o Drive recusar, nada é gravado e
      // o número continua livre para tentar de novo. O contrário deixaria uma
      // proposta registrada apontando para um PDF que não existe.
      let url = null;
      if (arq){
        if (arq.size > 18 * 1024 * 1024) throw new Error('PDF acima de 18 MB — comprima antes de subir.');
        b.textContent = 'Enviando o PDF…';
        const j = await subirArquivo(await arquivoParaBase64(arq), {
          os_id: card.os_id, cliente: card.cliente, os_numero: card.numero,
          categoria: 'proposta', nome: num + '.pdf', mime: 'application/pdf',
          client_uid: 'prop-' + card.os_id + '-' + num
        });
        url = j.url;
        b.textContent = 'Registrando…';
      }
      if (DEMO) demoProposta(card.os_id, num);
      else await rpc('tf_registrar_proposta_externa', {
        p_os_id: card.os_id, p_numero: num,
        p_valor_total: document.getElementById('pV').value ? Number(document.getElementById('pV').value) : null,
        p_validade: document.getElementById('pD').value || null,
        p_arquivo_url: url
      });
      const antes = card.coluna;
      await carregar({silencioso:true});
      const novo = cards.find(x => x.os_id === card.os_id);
      if (novo){ osAberta.card = novo;
        toast(novo.coluna !== antes ? 'Registrada — o card foi para "' + novo.coluna + '".' : 'Proposta registrada.', 'ok');
      } else toast('Proposta registrada.','ok');
      pintarProposta();
    }catch(e){ toast(e.message,'err'); b.disabled = false; b.textContent = 'Registrar e mover o card'; }
  });
}

// ABA ARQUIVOS — o que está no Drive desta OS
// ════════════════════════════════════════════════════════════════════════════
const CAT_ROTULO = {
  foto_item:'Foto de item', foto_tarefa:'Foto de etapa', assinatura:'Aceite do cliente',
  proposta:'Proposta', pedido_compra:'Pedido de compra', certificado:'Certificado',
  relatorio:'Relatório', outro:'Outro'
};

async function pintarArquivos(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  document.getElementById('dAcoes').innerHTML = '';
  body.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando…</p>';

  let anexos = [], falhouAnx = null;
  try{
    anexos = DEMO ? (demoAnexos(card.os_id) || [])
      : await get('anexos?select=id,categoria,nome,drive_url,criado_em,bytes'
                  + '&os_id=eq.' + card.os_id + '&ativo=eq.true&order=criado_em.desc');
  }catch(e){ falhouAnx = e.message; }

  body.innerHTML = '';

  // ── gerar PDF ──
  const g = document.createElement('div');
  g.innerHTML =
    '<h3 style="font-size:15px;margin:0 0 4px">Gerar documento</h3>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 12px;line-height:1.5">' +
      'O PDF é montado aqui e guardado no Drive, na pasta desta OS.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" id="gLev" style="flex:1;min-width:150px;padding:10px">Levantamento (sem valores)</button>' +
      '<button class="btn" id="gRes" style="flex:1;min-width:150px;padding:10px">Resumo interno (com margem)</button>' +
    '</div>' +
    '<p style="font-size:12px;color:var(--ink-3);margin:9px 0 20px;line-height:1.45">' +
      'O <b>levantamento</b> é o que se mostra à planta: lista de acessórios, sem preço. ' +
      'O <b>resumo interno</b> traz custo, preço e margem — não é para sair da empresa.</p>';
  body.appendChild(g);

  const gerar = async (tipo, btn) => {
    const rotulo = btn.textContent;
    btn.disabled = true; btn.textContent = 'Montando…';
    try{
      const itens = DEMO ? demoItens(card.os_id)
        : await get('os_itens?select=descricao,quantidade,elegivel,custo_unitario,preco_unitario,'
            + 'total_custo,total_venda,requer_calibracao,requer_lacre'
            + '&os_id=eq.' + card.os_id + '&order=created_at');
      if (!itens.length) throw new Error('Esta OS ainda não tem itens.');
      const { blob, nome } = await gerarPDF(tipo, card, itens);
      btn.textContent = 'Enviando…';
      await subirArquivo(blob, {
        os_id: card.os_id, cliente: card.cliente, os_numero: card.numero,
        categoria: 'relatorio', nome, mime: 'application/pdf',
        client_uid: 'pdf-' + card.os_id + '-' + tipo + '-' + Date.now()
      });
      toast('PDF gerado e guardado no Drive.', 'ok');
      pintarArquivos();
    }catch(e){ toast(e.message, 'err'); btn.disabled = false; btn.textContent = rotulo; }
  };
  document.getElementById('gLev').addEventListener('click', e => gerar('levantamento', e.target));
  document.getElementById('gRes').addEventListener('click', e => gerar('resumo', e.target));

  // ── lista do que já está no Drive ──
  const h = document.createElement('div');
  h.style.cssText = 'font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;'
                  + 'color:var(--ink-3);margin:0 0 8px';
  h.textContent = 'No Drive';
  body.appendChild(h);

  if (!anexos.length){
    const p2 = document.createElement('p');
    p2.style.cssText = 'font-size:13px;margin:0;line-height:1.5;color:'
      + (falhouAnx ? 'var(--crit)' : 'var(--ink-3)');
    // pasta que parece vazia porque a leitura falhou é pior do que pasta vazia:
    // a pessoa reenvia a foto que já estava lá
    p2.textContent = falhouAnx
      ? 'Não deu para listar os arquivos: ' + falhouAnx
        + ' — pode haver arquivo no Drive que não está aparecendo aqui.'
      : (driveLigado()
        ? 'Nada ainda. As fotos do campo e os PDFs aparecem aqui assim que subirem.'
        : 'O Google Drive ainda não foi configurado — veja o Passo 8 do guia de instalação.');
    body.appendChild(p2);
    return;
  }

  anexos.forEach(a => {
    const r = document.createElement('div');
    r.style.cssText = 'display:flex;gap:10px;align-items:baseline;padding:8px 0;'
                    + 'border-bottom:1px solid var(--rule-2);font-size:13.5px';
    r.innerHTML = '<span class="chip" style="flex:0 0 auto"></span>'
      + '<a target="_blank" rel="noopener" style="flex:1;min-width:0;overflow:hidden;'
      + 'text-overflow:ellipsis;white-space:nowrap"></a>'
      + '<span style="flex:0 0 auto;font-size:11.5px;color:var(--ink-3)"></span>';
    r.querySelector('.chip').textContent = CAT_ROTULO[a.categoria] || a.categoria;
    const link = r.querySelector('a');
    link.textContent = a.nome; link.href = a.drive_url || '#';
    r.querySelector('span:last-child').textContent = dataBR(a.criado_em);
    body.appendChild(r);
  });
}

let _focoAntesDoModal = null;
function abrirModal(titulo, corpoHtml, botoes){
  _focoAntesDoModal = document.activeElement;
  document.getElementById('mTit').textContent = titulo;
  document.getElementById('mBody').innerHTML = corpoHtml;
  const f = document.getElementById('mFoot'); f.innerHTML = '';
  (botoes||[]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.pri ? ' pri' : '');
    el.textContent = b.label;
    // toda ação de modal passa pela trava de duplo envio: modal é onde se grava
    el.addEventListener('click', () => _semDuploEnvio_(el, () => b.onClick(el)));
    f.appendChild(el);
  });
  document.getElementById('mScrim').hidden = false;
  document.getElementById('modal').hidden = false;
  // foco no primeiro campo: quem chega de teclado não deveria ter que caçar
  requestAnimationFrame(() => {
    const alvo = document.querySelector('#mBody input,#mBody select,#mBody textarea')
              || document.querySelector('#mFoot .btn');
    if (alvo) alvo.focus();
  });
}
function fecharModal(){
  document.getElementById('mScrim').hidden = true;
  document.getElementById('modal').hidden = true;
  // devolve o foco a quem abriu — sem isto ele volta para o começo da página
  if (_focoAntesDoModal && document.body.contains(_focoAntesDoModal)){
    try{ _focoAntesDoModal.focus(); }catch(e){}
  }
  _focoAntesDoModal = null;
}

// CUSTOS E COTAÇÕES — a aba que mostra para onde foi a margem
// ----------------------------------------------------------------------------
// Frete NÃO é item da proposta. Item é o que o cliente compra; frete é o que
// custa entregar. Aqui ele aparece como custo da OS: reduz a margem, entra no
// resumo interno, e não aparece no documento que vai ao cliente.
// ════════════════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════════════════
// PEDIDO DE COMPRA — um por fornecedor
// ----------------------------------------------------------------------------
// Uma OS quase sempre compra de mais de um lugar: o manômetro na Wika, a
// válvula na Famabras, o purgador na Proper. Cada um recebe o SEU pedido, com
// os SEUS itens e o SEU prazo. Emitir um pedido só, com tudo dentro, era o
// defeito que estava aqui antes — e o fornecedor receberia peça que não vende.
//
// A escolha de quem fornece já foi feita na cotação, item a item. Esta tela só
// agrupa o resultado e emite.
// ════════════════════════════════════════════════════════════════════════════

/** O PDF que vai para o fornecedor. Sem preço de venda e sem margem: o que ele
 *  precisa é descrição, quantidade e para onde entregar. */
async function gerarPDFPedido({ numero, fornecedor, card, itens, obs, prazo }){
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const M = 15;
  let y = M;

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('ENGETAP ENGENHARIA', M, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text('Pedido de compra ' + numero, M, y); y += 8;
  doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 7;

  doc.setFontSize(10);
  const linha = (k, v) => { doc.setFont('helvetica','bold'); doc.text(k, M, y);
    doc.setFont('helvetica','normal'); doc.text(String(v||'—'), M+34, y); y += 5.5; };
  linha('Fornecedor:', fornecedor);
  linha('Emitido em:', dataBR());
  if (prazo) linha('Entrega prevista:', prazo);
  linha('Nossa OS:', card.numero);
  linha('Destino:', 'Engetap Engenharia · Divinópolis/MG');
  y += 4;

  const cols = [{t:'Item',x:M,w:104},{t:'Qtd',x:M+108,w:12,r:1},
                {t:'Unitário',x:M+128,w:22,r:1},{t:'Total',x:M+156,w:24,r:1}];
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  cols.forEach(c => doc.text(c.t, c.r ? c.x + c.w : c.x, y, c.r ? {align:'right'} : undefined));
  y += 2; doc.setDrawColor(210); doc.line(M, y, 210-M, y); y += 4.5;

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  let total = 0;
  itens.forEach(it => {
    if (y > 258){ doc.addPage(); y = M; }
    const q = Number(it.quantidade) || 0;
    const u = Number(it.custo_unitario) || 0;
    total += q * u;
    const nome = doc.splitTextToSize(String(it.descricao||''), cols[0].w).slice(0, 2);
    doc.text(nome, cols[0].x, y);
    doc.text(String(q), cols[1].x + cols[1].w, y, {align:'right'});
    doc.text(u ? BRL(u) : '—', cols[2].x + cols[2].w, y, {align:'right'});
    doc.text(u ? BRL(q*u) : '—', cols[3].x + cols[3].w, y, {align:'right'});
    y += 5.4 + (nome.length - 1) * 4.2;
  });

  y += 2; doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 6;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Total do pedido:', M, y);
  doc.text(total ? BRL(total) : 'a combinar', M+70, y, {align:'right'}); y += 9;

  if (obs){
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const t = doc.splitTextToSize('Observações: ' + obs, 180);
    doc.text(t, M, y); y += t.length * 4.4 + 4;
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
  doc.text('Confirme o recebimento deste pedido e o prazo de entrega.', M, y);

  return { blob: doc.output('datauristring'), nome: numero + ' - ' + nomeSeguro(fornecedor) + '.pdf' };
}

/** Bloco "Pedidos de compra" dentro da aba Custos. */
async function montarPedidos(caixa){
  const { card } = osAberta;
  caixa.innerHTML = '<p class="nota">Carregando os pedidos…</p>';

  let pend = [], feitos = [];
  try{
    [pend, feitos] = DEMO ? [demoPedPend(), demoPedFeitos()]
      : await Promise.all([
          get('v_pedidos_pendentes?select=*&os_id=eq.' + card.os_id + '&order=fornecedor'),
          get('v_pedidos_compra?select=*&os_id=eq.' + card.os_id + '&order=numero')
        ]);
  }catch(e){ caixa.innerHTML = '<p class="nota"></p>';
             caixa.querySelector('p').textContent = 'Não consegui ler os pedidos: ' + e.message; return; }

  caixa.innerHTML = '<div class="secTit" style="margin-top:0">Pedidos de compra</div>';

  if (!pend.length && !feitos.length){
    caixa.insertAdjacentHTML('beforeend',
      '<p class="nota">Nada a pedir nesta OS. Itens entram aqui quando a origem é ' +
      '“comprar” e o cliente aprovou.</p>');
    return;
  }

  // ── o que falta pedir ──
  pend.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pedBox' + (p.sem_fornecedor ? ' semforn' : '');
    d.innerHTML =
      '<div class="pedTopo"><b class="f"></b><span class="q"></span></div>' +
      '<div class="pedSub"></div>' +
      (p.sem_fornecedor
        ? '<p class="nota" style="margin:8px 0 0;color:var(--warn)">Estes itens ainda não têm ' +
          'fornecedor escolhido. Decida a cotação antes de emitir — pedido sem fornecedor ' +
          'não tem para quem ir.</p>'
        : '<button class="btn sm" type="button">Emitir pedido</button>');
    d.querySelector('.f').textContent = p.fornecedor;
    d.querySelector('.q').textContent = p.itens + ' item(ns) · ' + BRL(p.custo);
    d.querySelector('.pedSub').textContent =
      (p.pecas ? Number(p.pecas) + ' peça(s)' : '') +
      (p.maior_prazo ? ' · prazo de ' + p.maior_prazo + ' dias' : ' · sem prazo informado');
    caixa.appendChild(d);
    const b = d.querySelector('button');
    if (b) b.addEventListener('click', () => emitirPedido(p, caixa));
  });

  // ── os já emitidos ──
  if (feitos.length){
    const h = document.createElement('div');
    h.className = 'nota'; h.style.cssText = 'margin:14px 0 6px;font-weight:600';
    h.textContent = 'Emitidos';
    caixa.appendChild(h);
    feitos.forEach(p => {
      const d = document.createElement('div');
      d.className = 'pedFeito';
      d.innerHTML = '<span class="n mono"></span><span class="f"></span>' +
                    '<span class="v num"></span><span class="s"></span>';
      d.querySelector('.n').textContent = p.numero;
      d.querySelector('.f').textContent = p.fornecedor || '—';
      d.querySelector('.v').textContent = BRL(p.valor);
      d.querySelector('.s').textContent = p.recebidos >= p.itens && p.itens > 0
        ? 'recebido'
        : (p.previsto_para ? 'chega ' + dataBR(p.previsto_para) : 'sem previsão');
      caixa.appendChild(d);
    });
  }
}

async function emitirPedido(p, caixa){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  const antes = body.innerHTML;

  // ── conferência antes de emitir ──
  const cx = document.createElement('div');
  cx.className = 'painelPed';
  cx.innerHTML =
    '<div class="secTit" style="margin-top:0">Emitir pedido — ' + esc(p.fornecedor) + '</div>' +
    '<p class="nota" style="margin:0 0 12px">Vão neste pedido os ' + p.itens + ' item(ns) desta OS ' +
      'cotados com ' + esc(p.fornecedor) + '. Os outros fornecedores recebem pedidos separados.</p>' +
    '<div id="pdItens"></div>' +
    '<div class="campo"><label for="pdObs">Observação para o fornecedor</label>' +
      '<input id="pdObs" type="text" placeholder="opcional — ex.: entregar aos cuidados do Túlio"></div>' +
    '<button class="btn pri" id="pdOk" style="width:100%;padding:11px">Emitir e baixar o PDF</button>' +
    '<button class="btn" id="pdCa" style="width:100%;margin-top:8px">Voltar</button>' +
    '<div class="nota" id="pdMsg" style="margin-top:8px"></div>';
  body.innerHTML = ''; body.appendChild(cx);

  let itens = [];
  try{
    itens = DEMO ? demoPedItens(p.fornecedor)
      : await get('os_itens?select=id,descricao,quantidade,custo_unitario,prazo_entrega_dias'
          + '&os_id=eq.' + card.os_id + '&aprovado=is.true&origem=eq.compra'
          + '&pedido_numero=is.null'
          + (p.sem_fornecedor ? '&fornecedor=is.null' : '&fornecedor=eq.' + encodeURIComponent(p.fornecedor))
          + '&order=descricao');
  }catch(e){ document.getElementById('pdMsg').textContent = e.message; }

  const el = document.getElementById('pdItens');
  el.innerHTML = '<div style="overflow-x:auto;margin:0 0 14px"><table class="tbl"><thead><tr>' +
    '<th>Item</th><th class="num">Qtd</th><th class="num">Unitário</th><th class="num">Total</th>' +
    '</tr></thead><tbody></tbody></table></div>';
  const tb = el.querySelector('tbody');
  let total = 0;
  itens.forEach(i => {
    const q = Number(i.quantidade)||0, u = Number(i.custo_unitario)||0;
    total += q*u;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="d"></td><td class="num q"></td><td class="num u"></td><td class="num t"></td>';
    tr.querySelector('.d').textContent = i.descricao;
    tr.querySelector('.q').textContent = q;
    tr.querySelector('.u').textContent = u ? BRL(u) : '—';
    tr.querySelector('.t').textContent = u ? BRL(q*u) : '—';
    tb.appendChild(tr);
  });
  if (!itens.some(i => Number(i.custo_unitario) > 0)){
    el.insertAdjacentHTML('beforeend',
      '<p class="nota" style="color:var(--warn);margin:0 0 12px">Nenhum item tem custo lançado. ' +
      'O pedido sai sem valores — o fornecedor cota de novo, e você perde a referência da cotação.</p>');
  }

  document.getElementById('pdCa').addEventListener('click', () => { body.innerHTML = antes; pintarCustos(); });

  document.getElementById('pdOk').addEventListener('click', async () => {
    const b = document.getElementById('pdOk'), msg = document.getElementById('pdMsg');
    b.disabled = true; msg.style.color = ''; msg.textContent = 'Preparando…';
    try{
      // A biblioteca de PDF vem ANTES de emitir. Se ela não carregar — rede da
      // planta, CDN bloqueada — nada foi registrado e a pessoa tenta de novo.
      // Emitir primeiro deixaria um pedido no sistema sem o papel para enviar,
      // e o número já queimado.
      await carregarJsPDF();
      msg.textContent = 'Emitindo…';
      const r = DEMO
        ? { numero:'PC-2026-0099', fornecedor:p.fornecedor, itens:itens.length, valor:total }
        : await rpc('tf_emitir_pedido_compra', {
            p_os_id: card.os_id,
            p_fornecedor: p.sem_fornecedor ? null : p.fornecedor,
            p_itens: p.sem_fornecedor ? itens.map(i => i.id) : null,
            p_observacao: document.getElementById('pdObs').value.trim() || null
          });

      msg.textContent = 'Montando o PDF…';
      const prazo = p.maior_prazo
        ? dataBR(new Date(Date.now() + p.maior_prazo*86400000).toISOString().slice(0,10)) : null;
      const { blob, nome } = await gerarPDFPedido({
        numero: r.numero, fornecedor: p.fornecedor, card, itens,
        obs: document.getElementById('pdObs').value.trim(), prazo
      });

      // o PDF vai para o Drive quando ele estiver ligado; sempre baixa também,
      // porque quem manda para o fornecedor é a pessoa, do computador dela
      baixarDataUrl(blob, nome);
      if (!DEMO && driveLigado()){
        try{
          await subirArquivo(blob, { os_id: card.os_id, cliente: card.cliente,
            os_numero: card.numero, categoria: 'pedido_compra', nome,
            mime:'application/pdf', client_uid:'pc-' + r.numero });
        }catch(e){ /* o pedido já existe; o arquivo é o acessório */ }
      }

      const antesCol = card.coluna;
      if (!DEMO) await carregar({silencioso:true});
      const novo = cards.find(x => x.os_id === card.os_id);
      if (novo) osAberta.card = novo;

      toast(r.numero + ' emitido para ' + p.fornecedor + '.', 'ok');
      _msgPedido = r.numero + ' emitido — ' + r.itens + ' item(ns), ' + BRL(r.valor) + '.'
        + (novo && novo.coluna !== antesCol ? ' O card foi para "' + novo.coluna + '".' : '');
      pintarCustos();
    }catch(e){
      msg.style.color = 'var(--crit)'; msg.textContent = e.message;
      b.disabled = false;
    }
  });
}

let _msgPedido = null;

function baixarDataUrl(dataUrl, nome){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => a.remove(), 3000);
}

async function pintarCustos(){
  const b = document.getElementById('dBody');
  const { card } = osAberta;
  b.innerHTML = '<p class="nota">Carregando…</p>';

  let m = null, custos = [], cots = [], itens = [];
  try{
    if (DEMO){ m = demoMargem(); custos = demoCustos(); cots = demoCots(); itens = demoItens(card.os_id); }
    else {
      const [a,c,q,i] = await Promise.all([
        get('v_os_margem?select=*&os_id=eq.' + card.os_id),
        get('custos_os?select=*&os_id=eq.' + card.os_id + '&order=quando'),
        get('v_cotacoes?select=*&os_id=eq.' + card.os_id),
        get('os_itens?select=id,descricao,quantidade&os_id=eq.' + card.os_id + '&elegivel=is.true&order=descricao')
      ]);
      m = a[0]; custos = c; cots = q; itens = i;
    }
  }catch(e){ b.innerHTML=''; toast(e.message,'err'); return; }

  const bruta = Number((m&&m.margem_bruta)||0), real = Number((m&&m.margem_real)||0);
  const extras = Number((m&&m.custos_extras)||0);
  const some = bruta - real;

  b.innerHTML =
    '<div class="margemBox">'
    + '<div class="mg"><span>Venda</span><b>' + BRL((m&&m.venda)||0) + '</b></div>'
    + '<div class="mg"><span>Custo dos itens</span><b>' + BRL((m&&m.custo_itens)||0) + '</b></div>'
    + '<div class="mg"><span>Margem bruta</span><b>' + BRL(bruta) + '</b></div>'
    + '<div class="mg ' + (some > 0 ? 'perde' : '') + '"><span>Frete e outros</span><b>−'
    +   BRL(extras) + '</b></div>'
    + '<div class="mg final"><span>Margem real</span><b>' + BRL(real)
    +   ((m&&m.margem_pct) != null ? ' <i>' + m.margem_pct + '%</i>' : '') + '</b></div>'
    + '</div>'
    + (some > 0
        ? '<p class="nota aviso2">O que não é item comeu <b>' + BRL(some) + '</b> — '
          + ((m&&m.extras_pct)||0) + '% da venda. Este é o número que somia quando o frete '
          + 'ficava no WhatsApp.</p>'
        : '<p class="nota">Nenhum custo fora dos itens lançado ainda. Se houve frete ou '
          + 'deslocamento e ele não está aqui, a margem acima está otimista.</p>')

    + '<div class="secTit">Custos que não são item</div>'
    + '<div id="cuLista"></div>'
    + '<div class="grelha" style="margin-top:10px">'
    +  '<div class="campo"><label for="cuT">Tipo</label><select id="cuT">'
    +   [['frete','Frete'],['deslocamento','Deslocamento'],['hospedagem','Hospedagem'],
        ['terceiro','Serviço de terceiro'],['calibracao','Calibração'],['taxa','Taxa'],
        ['outro','Outro']].map(([v,l]) => '<option value="' + v + '">' + l + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="cuD">Descrição</label><input id="cuD" type="text" '
    +   'placeholder="ex.: entrega em Itaúna"></div>'
    +  '<div class="campo"><label for="cuF">Fornecedor</label><input id="cuF" type="text"></div>'
    +  '<div class="campo"><label for="cuV">Valor</label><input id="cuV" type="number" step="0.01"></div>'
    + '</div>'
    + '<button class="btn pri" id="cuAdd" style="width:100%">Lançar custo</button>'

    + '<div class="secTit">Cotações</div>'
    + '<p class="nota">A conversa continua no WhatsApp. O que fica aqui é a resposta: quem, '
    + 'quanto, prazo. <b>Compare pelo total</b> — o mais barato por peça nem sempre é o mais '
    + 'barato com frete.</p>'
    + '<div id="coLista"></div>'
    + '<div class="grelha" style="margin-top:10px">'
    +  '<div class="campo"><label for="coI">Item</label><select id="coI">'
    +   '<option value="">— cotação geral —</option>'
    +   itens.map(i => '<option value="' + i.id + '">' + esc(i.descricao).slice(0,44) + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="coF">Fornecedor</label><input id="coF" type="text"></div>'
    +  '<div class="campo"><label for="coV">Valor unitário</label><input id="coV" type="number" step="0.01"></div>'
    +  '<div class="campo"><label for="coFr">Frete</label><input id="coFr" type="number" step="0.01"></div>'
    +  '<div class="campo"><label for="coP">Prazo (dias)</label><input id="coP" type="number"></div>'
    +  '<div class="campo"><label for="coC">Canal</label><select id="coC">'
    +   ['whatsapp','telefone','email','presencial','site'].map(c =>
        '<option value="' + c + '">' + c + '</option>').join('') + '</select></div>'
    + '</div>'
    + '<button class="btn" id="coAdd" style="width:100%">Registrar cotação</button>';

  // custos lançados
  const CL = document.getElementById('cuLista');
  if (!custos.length) CL.innerHTML = '<p class="nota">Nada lançado.</p>';
  custos.forEach(c => {
    const el = document.createElement('div');
    el.className = 'linhaCusto';
    el.innerHTML = '<div><b></b><small></small></div><div class="vl"></div>'
      + '<button class="x" aria-label="Remover">×</button>';
    el.querySelector('b').textContent = c.descricao;
    el.querySelector('small').textContent = (c.fornecedor ? c.fornecedor + ' · ' : '')
      + new Date(c.quando+'T12:00').toLocaleDateString('pt-BR')
      + (c.realizado ? ' · realizado' : ' · previsto');
    el.querySelector('.vl').textContent = BRL(c.valor);
    el.querySelector('.x').addEventListener('click', async () => {
      if (!confirm('Remover "' + c.descricao + '"?')) return;
      try{
        if (!DEMO) await req('/rest/v1/custos_os?id=eq.' + c.id, { method:'DELETE' });
        toast('Removido.','ok'); pintarCustos();
      }catch(e){ toast(e.message,'err'); }
    });
    CL.appendChild(el);
  });

  // cotações agrupadas por item
  const QL = document.getElementById('coLista');
  if (!cots.length) QL.innerHTML = '<p class="nota">Nenhuma cotação registrada.</p>';
  const porItem = {};
  cots.forEach(q => { (porItem[q.os_item_id || 'geral'] = porItem[q.os_item_id || 'geral'] || []).push(q); });
  Object.keys(porItem).forEach(k => {
    const g = porItem[k].slice().sort((a,b) => (a.total_estimado||0) - (b.total_estimado||0));
    const box = document.createElement('div');
    box.className = 'grupoCot';
    box.innerHTML = '<div class="gcTit"></div>';
    box.querySelector('.gcTit').textContent = g[0].item || 'Cotação geral';
    g.forEach((q, idx) => {
      const el = document.createElement('div');
      el.className = 'linhaCot' + (q.escolhida ? ' on' : '') + (q.vencida ? ' vencida' : '');
      el.innerHTML = '<div><b></b><small></small></div><div class="vl"></div>'
        + (q.os_item_id && !q.escolhida ? '<button class="btn mini">Escolher</button>' : '');
      el.querySelector('b').textContent = q.fornecedor
        + (idx === 0 && g.length > 1 ? '  ← menor total' : '');
      el.querySelector('small').textContent =
        BRL(q.valor_unitario) + ' un'
        + (Number(q.valor_frete) ? ' + ' + BRL(q.valor_frete) + ' frete' : '')
        + (q.prazo_dias ? ' · ' + q.prazo_dias + 'd' : '')
        + (q.vencida ? ' · VENCIDA' : '')
        + (q.escolhida ? ' · escolhida' : '');
      el.querySelector('.vl').textContent = BRL(q.total_estimado);
      const bt = el.querySelector('.btn');
      if (bt) bt.addEventListener('click', () => _semDuploEnvio_(bt, async () => {
        try{
          if (!DEMO) await rpc('tf_escolher_cotacao', { p_cotacao_id: q.id });
          toast('Cotação escolhida — custo e prazo do item preenchidos.','ok');
          pintarCustos();
        }catch(e){ toast(e.message,'err'); }
      }));
      box.appendChild(el);
    });
    QL.appendChild(box);
  });

  document.getElementById('cuAdd').addEventListener('click', async (e) => {
    const v = document.getElementById('cuV').value;
    if (v === '' || Number(v) < 0){ toast('Informe o valor.','err'); return; }
    e.target.disabled = true;
    try{
      if (!DEMO) await rpc('tf_salvar_custo', { p_os_id: card.os_id,
        p_tipo: document.getElementById('cuT').value,
        p_descricao: document.getElementById('cuD').value.trim() || null,
        p_fornecedor: document.getElementById('cuF').value.trim() || null,
        p_valor: Number(v) });
      toast('Custo lançado — a margem já mudou.','ok'); pintarCustos();
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });

  // ── pedidos de compra, depois das cotações: a ordem é a do trabalho —
  //    cota, escolhe, pede ──
  const cxPed = document.createElement('div');
  cxPed.style.marginTop = '22px';
  b.appendChild(cxPed);
  montarPedidos(cxPed).then(() => {
    if (_msgPedido){
      const m = document.createElement('p');
      m.className = 'nota'; m.style.cssText = 'color:var(--ok);font-weight:600;margin-top:10px';
      m.textContent = _msgPedido; _msgPedido = null;
      cxPed.appendChild(m);
    }
  }).catch(() => {});

  document.getElementById('coAdd').addEventListener('click', async (e) => {
    const f = document.getElementById('coF').value.trim();
    if (!f){ toast('Diga com quem você cotou.','err'); return; }
    e.target.disabled = true;
    const n = id => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
    try{
      if (!DEMO) await rpc('tf_registrar_cotacao', { p_os_id: card.os_id,
        p_fornecedor: f,
        p_os_item_id: document.getElementById('coI').value || null,
        p_valor_unitario: n('coV'), p_valor_frete: n('coFr'),
        p_prazo_dias: n('coP'), p_canal: document.getElementById('coC').value });
      toast('Cotação registrada.','ok'); pintarCustos();
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });
}
