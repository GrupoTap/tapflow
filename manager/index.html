<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TapFlow Manager · S13</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<!-- ═══════════════════════════════════════════════════════════════════════════
     TAPFLOW MANAGER — TFM_S3
     Engetap Engenharia · quadros, cadastros, abertura de OS e itens da OS

     S2 acrescentou: cadastros, abertura de OS, aba de ITENS e registro da
     proposta externa.
     S3 acrescenta: upload do PDF da proposta para o Google Drive, geração de
     PDF (levantamento e resumo da OS) e a aba ARQUIVOS.

     ARQUIVO ÚNICO, SEM BUILD. Abre com duplo clique ou hospeda no GitHub Pages.

     ── COMO LIGAR NO SUPABASE ─────────────────────────────────────────────────
     Enquanto SUPABASE_URL estiver vazio, o app roda em MODO DEMO com dados de
     mentira — dá para ver os quadros funcionando sem instalar nada.
     Para ligar de verdade, preencha as duas constantes logo abaixo com o que
     está em Supabase → Settings → API.

     ── O QUE ESTE APP NÃO FAZ, DE PROPÓSITO ───────────────────────────────────
     Não existe arrastar o card. A coluna é a fase da primeira tarefa não
     resolvida, calculada pelo banco na view v_os_kanban. O card se move quando
     uma tarefa fecha — e só assim. O banco recusa UPDATE direto em
     pipeline_tarefas, então nem um bug daqui conseguiria burlar isso.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
/* ════════════════════════════════════════════════════════════════════════════
   TOKENS — a cor sai da logomarca da Engetap, não de escolha minha.
   O monograma é um gradiente de #1D4E80 a #2596D5, o texto é #515252 e o
   subtítulo é #0087CC. Até o S9 o app era verde, que eu tinha inventado.
   ════════════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#1B6FA9; --accent-hover:#155A8A; --accent-ink:#164C77;
  --accent-soft:#E3EEF7; --accent-alt:#0087CC;
  --sidebar-bg:#102438; --sidebar-fg:#9DB2C6; --sidebar-fg-active:#F5F9FC;
  --sidebar-hover:rgba(255,255,255,.05); --sidebar-active:rgba(255,255,255,.08);
  --sidebar-group:#6E8399;

  --paper:#F1F3F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#14181B; --ink-2:#515252; --ink-3:#78838A;
  --rule:#DBE0E3; --rule-2:#EBEFF1;

  --campo:#1B6FA9;  --campo-soft:#E3EEF7;
  --gestao:#8A5A12; --gestao-soft:#F6EBD9;
  --crit:#A62D18;   --crit-soft:#F7E4DF;
  --warn:#96601A;   --warn-soft:#F8EEDC;
  --ok:#1E7A42;     --ok-soft:#DFF0E6;

  --nav-w:220px; --header-h:54px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,26,28,.06), 0 6px 18px -12px rgba(16,26,28,.3);
  --sh-lift:0 2px 4px rgba(16,26,28,.08), 0 12px 28px -14px rgba(16,26,28,.42);
  --t:120ms ease;
}

/* ── foco visível em todo lugar ────────────────────────────────────────────
   O PCM tem UM :focus-visible no arquivo inteiro. Quem navega por teclado —
   ou quem tem o mouse ruim — fica sem saber onde está. Aqui é global. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.nav-item:focus-visible{outline-offset:-2px}

/* ════════════════════════════════════════════════════════════════════════════
   SHELL — barra lateral fixa + header + conteúdo
   ════════════════════════════════════════════════════════════════════════════ */
.nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);background:var(--sidebar-bg);
  color:var(--sidebar-fg);display:flex;flex-direction:column;padding:14px 0 10px;z-index:60;
  border-right:1px solid rgba(255,255,255,.05)}
.nav-brand{padding:0 16px 13px;display:flex;align-items:baseline;gap:7px;
  border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:10px}
.nav-brand b{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.02em}
.nav-brand b span{color:var(--accent-alt)}
.nav-brand .v{font-family:var(--mono);font-size:10.5px;color:var(--sidebar-group);letter-spacing:.04em}
.nav-groups{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-groups::-webkit-scrollbar{width:6px}
.nav-groups::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.nav-group{display:flex;flex-direction:column}
.nav-group.fim{margin-top:auto}
.nav-gtoggle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;
  cursor:pointer;user-select:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  color:var(--sidebar-group);padding:9px 16px 4px;transition:color var(--t)}
.nav-gtoggle:hover{color:var(--sidebar-fg-active)}
.nav-car{display:inline-block;width:9px;font-size:9px;line-height:1;transition:transform var(--t);opacity:.75}
.nav-group.fechado .nav-car{transform:rotate(-90deg)}
.nav-gn{margin-left:auto;font-size:9px;opacity:0;transition:opacity var(--t)}
.nav-group.fechado .nav-gn{opacity:.6}
/* grupo fechado esconde tudo MENOS onde você está — barra que esconde a sua
   própria posição troca 4 pixels por desorientação */
.nav-group.fechado .nav-item:not(.on){display:none}

.nav-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;
  padding:8px 16px;font-size:13px;color:var(--sidebar-fg);cursor:pointer;
  border-left:2px solid transparent;transition:background var(--t),color var(--t)}
.nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-fg-active)}
.nav-item.on{background:var(--sidebar-active);color:var(--sidebar-fg-active);border-left-color:var(--accent-alt)}
.nav-item svg{width:16px;height:16px;flex:0 0 auto}
.nav-item .rot{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-n{margin-left:auto;background:rgba(255,255,255,.12);color:var(--sidebar-fg-active);
  font-size:10px;font-weight:700;line-height:1;padding:2px 6px;border-radius:9px;min-width:16px;text-align:center}
.nav-n:empty{display:none}
.nav-n.alerta{background:var(--crit);color:#fff}

.app{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:40}
.crumb{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.tbBusca{width:250px;height:32px;padding:0 10px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--rule);border-radius:4px;outline:none;font-family:inherit;color:var(--ink);
  transition:border-color var(--t),background var(--t)}
.tbBusca:focus{border-color:var(--accent);background:var(--surface)}
.tbBusca::placeholder{color:var(--ink-3)}

/* A regra base vem ANTES da media query: declarada depois, ela vencia por
   ordem de cascata e o botão do menu ficava invisível também no celular. */
.navBurger{display:none;align-items:center;justify-content:center;width:32px;height:32px;
  border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:15px}

@media (max-width:900px){
  :root{--nav-w:0px}
  .nav{transform:translateX(-100%);transition:transform .2s;width:220px;box-shadow:var(--sh-lift)}
  body.navAberta .nav{transform:none}
  body.navAberta .navScrim{display:block}
  .navScrim{display:none;position:fixed;inset:0;background:rgba(16,26,28,.4);z-index:55}
  .navBurger{display:flex}
  .app{margin-left:0}
  .tbBusca{width:auto;flex:1;min-width:90px}
  .topbar{gap:8px;padding:0 10px}
  .crumb{display:none}
  .who{display:none}
  #btnRefresh{display:none}          /* puxar para recarregar já existe no navegador */
  #connTxt{display:none}             /* o ponto continua: é o sinal, o texto é enfeite */
  #btnNovaOS{padding:6px 9px;font-size:12px}
  .tela{padding-bottom:24px}
  main{padding:12px 10px}
}

*{box-sizing:border-box}
/* `hidden` tem que vencer o display dos elementos abaixo — sem isto o overlay
   de login continua na frente do app mesmo com o atributo hidden. */
[hidden]{display:none !important}
html,body{height:100%}
/* A gaveta fechada fica em translateX(100%): a caixa continua existindo fora da
   tela e esticava a largura rolável em 390px. Cortar aqui é mais barato do que
   animar `right`, que dispara layout a cada quadro. */
html{overflow-x:hidden}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ── topo ─────────────────────────────────────────── */
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.off{background:var(--crit)}
.dot.sync{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  background:var(--surface);border:1px solid var(--rule);padding:6px 12px;
  border-radius:3px;font-size:13px;font-weight:600;color:var(--ink-2);
}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{font-size:12.5px;color:var(--ink-3)}
.who b{color:var(--ink);font-weight:600}

.demo{
  background:var(--warn-soft);color:var(--warn);
  padding:6px 18px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--rule);
}

/* ── quadro ───────────────────────────────────────── */
/* O quadro kanban rola na horizontal; as telas de lista rolam na vertical.
   Por isso a altura é calculada, não 100%: com `height:100%` numa página que
   agora rola, o quadro ficava com a altura da janela e as colunas cortadas. */
main{flex:1;overflow-x:auto;padding:16px 18px;min-height:calc(100vh - var(--header-h))}
main.rolaY{overflow-y:auto}
.board{display:flex;gap:10px;align-items:stretch;min-width:min-content;
  height:calc(100vh - var(--header-h) - 32px)}
.board.livre{display:block;height:auto;min-width:0}
.col{
  flex:0 0 264px; display:flex; flex-direction:column; height:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:4px;
}
.col.vazia{opacity:.62}
.col-h{
  padding:9px 11px; border-bottom:1px solid var(--rule); display:flex;
  align-items:baseline; gap:8px; position:sticky; top:0;
}
.col-h .t{font-size:12.5px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.col-h .c{
  margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--rule);border-radius:99px;padding:1px 7px;
}
.col.campo{border-top:3px solid var(--campo)}
.col.gestao{border-top:3px solid var(--gestao)}
.col-b{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-vazia{font-size:12px;color:var(--ink-3);text-align:center;padding:14px 6px;font-style:italic}

/* ── card ─────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;
  border-left:3px solid var(--rule); text-align:left; width:100%; display:block;
}
.card:hover{box-shadow:var(--sh-lift);border-left-color:var(--accent)}
.card.travada{border-left-color:var(--crit)}
.card.atrasada{border-left-color:var(--warn)}
.card .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.card .cli{font-size:14px;font-weight:600;line-height:1.25;margin:3px 0 6px}
.card .tar{font-size:12px;color:var(--ink-2);line-height:1.35;display:flex;gap:5px}
.card .tar .ic{flex:0 0 auto;opacity:.75}
.card .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.chip{
  font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2);white-space:nowrap;
}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.travada{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.atras{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.lock{background:var(--gestao-soft);color:var(--gestao);border-color:transparent}
.chip.urg{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.altaP{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.risco{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* A borda esquerda diz a SITUAÇÃO (o pior dos dois relógios). A urgência é
   chip, não borda: se as duas coisas usassem a mesma cor, uma OS urgente no
   prazo ficaria igual a uma OS normal atrasada — e são problemas diferentes. */
.card.sit-atrasada{border-left-color:var(--crit)}
.card.sit-risco{border-left-color:var(--warn)}
.card.urgente{box-shadow:inset 3px 0 0 -1px var(--crit), var(--shadow)}

/* ── faixa de prazo e prioridade na gaveta ─────────────────────────────── */
.faixaPz{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:9px 11px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.fpLinha{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.fpRot{color:var(--ink-3);min-width:74px;font-size:12px}
.fpVal{font-weight:600}
.fpVal.crit{color:var(--crit)} .fpVal.warn{color:var(--warn)}
.fpDe{font-size:10.5px;color:var(--ink-3);background:var(--surface);border:1px solid var(--rule-2);
  border-radius:2px;padding:1px 5px}
.btn.mini{padding:2px 7px;font-size:11px;margin-left:auto}
.tkDes{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);
  margin:5px 0 0 30px;padding-top:5px;border-top:1px dashed var(--rule-2)}
.tkDes i{color:var(--ink-3);opacity:.75}

/* ── agenda da equipe ──────────────────────────────────────────────────── */
.agGrade{overflow-x:auto;border:1px solid var(--rule);border-radius:5px;background:var(--surface)}
.agGrade table{border-collapse:collapse;width:100%;min-width:820px;font-size:12.5px}
.agGrade th,.agGrade td{border-bottom:1px solid var(--rule-2);padding:7px 9px;text-align:left;
  vertical-align:top}
.agGrade thead th{background:var(--surface-2);position:sticky;top:0;font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);white-space:nowrap}
.agGrade thead th.hoje{color:var(--accent)}
.agGrade td.pessoa{font-weight:600;color:var(--ink);white-space:nowrap;background:var(--surface-2)}
.agCel{min-width:88px}
.agBar{height:4px;border-radius:2px;background:var(--rule-2);overflow:hidden;margin-top:4px}
.agBar i{display:block;height:100%;background:var(--accent)}
.agCel.cheio .agBar i{background:var(--crit)}
.agCel.quase .agBar i{background:var(--warn)}
.agH{font-variant-numeric:tabular-nums}
.agCel.cheio .agH{color:var(--crit);font-weight:600}
.agCel.quase .agH{color:var(--warn)}
.agSem{font-size:10.5px;color:var(--warn)}

/* ── foto do item de catálogo ──────────────────────────────────────────── */
.fotoCat{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--rule);
  background:var(--surface-2);flex:0 0 auto}
.fotoVazia{width:56px;height:56px;border-radius:4px;border:1px dashed var(--rule);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:9.5px;text-align:center;line-height:1.2;flex:0 0 auto}
.bar{height:3px;background:var(--rule-2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}


/* ── catálogo ─────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.fchip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule);cursor:pointer}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.linhaCli.off{opacity:.55}
.secTit{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule)}
.grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.linhaBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.linhaBtns .btn{flex:1 1 auto}
.btn.perigo{color:var(--crit);border-color:var(--crit)}
.btn.perigo:hover{background:var(--crit-soft)}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:12px;cursor:pointer}
.chk input{width:16px;height:16px;flex:0 0 auto}
.nota{font-size:12px;color:var(--ink-3);line-height:1.45;margin:8px 0 0}


/* ── configurações ────────────────────────────────── */
.cfgWrap{padding:18px;max-width:1100px}
.cfgWrap .chips{margin-bottom:14px}
.linhaU{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:11px 13px;border:1px solid var(--rule);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.linhaU.off{opacity:.55}
.linhaU.pend{border-color:var(--warn);background:var(--warn-soft)}
.linhaU b{display:block;font-size:14.5px;font-weight:600}
.linhaU small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.acoesU{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini{font-size:13px;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;
  background:var(--surface);max-width:190px}
button.mini{padding:6px 12px;font-weight:600}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface-2);color:var(--ink-3);padding:1px 5px;border-radius:2px;vertical-align:middle}
.tag.adm{background:var(--accent-soft);color:var(--accent)}
.aviso{font-size:13px;line-height:1.5;padding:11px 13px;border-radius:3px;margin-bottom:14px;
  background:var(--warn-soft);color:var(--ink)}
.aviso.ok{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:7px 9px;border-bottom:1px solid var(--rule)}
.tab td{padding:8px 9px;border-bottom:1px solid var(--rule-2)}
.tab a{color:var(--accent);font-weight:600}


/* ── comercial ────────────────────────────────────── */
.comWrap{display:flex;flex-direction:column;height:100%;min-height:0}
.comBoard{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding-top:12px}
.barraCom{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.barraCom input{flex:1 1 240px;max-width:360px;font-family:inherit;font-size:13.5px;
  padding:8px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
.resumoCom{font-size:13px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.colCom{flex:0 0 268px;display:flex;flex-direction:column;min-height:0;height:100%}
.colTit{display:flex;align-items:baseline;gap:8px;padding:0 2px 3px}
.colTit b{font-size:13px;font-weight:700;letter-spacing:.01em}
.colTit .cnt{font-size:11.5px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border-radius:2px;padding:1px 6px}
.colSub{font-size:11px;color:var(--ink-3);line-height:1.35;padding:0 2px 8px;min-height:30px}
.colBody{display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding-bottom:20px}
.colVazia{font-size:12px;color:var(--ink-3);opacity:.6;padding:10px 2px;margin:0}
.cardCom{position:relative;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;padding:11px 12px;display:block;width:100%;cursor:pointer}
.cardCom:hover{border-color:var(--accent)}
.cardCom.morno{border-left:3px solid var(--warn)}
.cardCom.parado{border-left:3px solid var(--crit)}
.cardCom .logo{position:absolute;top:9px;right:9px;width:34px;height:22px;object-fit:contain;opacity:.9}
.cardCom .num{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.cardCom .cli{font-size:14px;font-weight:600;line-height:1.25;margin:2px 0 1px;padding-right:40px}
.cardCom .tit{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.cardCom .valor{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:5px}
.cardCom .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.mini{font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.mini.crit{background:var(--crit-soft);color:var(--crit)}
.mini.warn{background:var(--warn-soft);color:var(--warn)}
.mini.ag{background:var(--gestao-soft);color:var(--gestao)}
.mini.ct{background:var(--accent-soft);color:var(--accent)}

/* log do card */
.novaNota{background:var(--surface-2);border-radius:3px;padding:11px;margin-bottom:16px}
.novaNota textarea{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);resize:vertical}
.linhaNota{display:flex;gap:7px;margin-top:7px}
.linhaNota select{flex:1;font-family:inherit;font-size:13px;padding:7px 9px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
.linhaTempo{display:flex;flex-direction:column;gap:0}
.ev{border-left:2px solid var(--rule);padding:9px 0 9px 13px;margin-left:3px}
.ev.contato{border-left-color:var(--accent)}
.ev.decisao{border-left-color:var(--gestao)}
.ev.cobranca{border-left-color:var(--warn)}
.ev .quando{font-size:10.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev .txt{font-size:13.5px;line-height:1.45;margin:2px 0 3px;white-space:pre-wrap}
.ev .quem{font-size:11.5px;color:var(--ink-3)}

/* tarefas */
.tarefaC{display:grid;grid-template-columns:auto 1fr;gap:0 11px;align-items:start;
  padding:11px;border:1px solid var(--rule);border-radius:3px;margin-bottom:7px;background:var(--surface)}
.tarefaC.feita{opacity:.5}
.tarefaC.feita b{text-decoration:line-through}
.tarefaC.atrasada{border-color:var(--crit);background:var(--crit-soft)}
.tarefaC b{display:block;font-size:14px;font-weight:600}
.tarefaC small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.tarefaC .ck{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mk input{width:18px;height:18px}
.agItem{padding:10px 11px;border:1px solid var(--rule);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.agItem b{display:block;font-size:13.5px;font-weight:600}
.agItem small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}


/* ── pedidos de compra ────────────────────────────── */
.pedBox{border:1px solid var(--rule);border-radius:5px;padding:12px;margin-bottom:9px}
.pedBox.semforn{border-color:var(--warn);background:var(--warn-soft)}
.pedTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pedTopo .f{font-size:14.5px;font-weight:600}
.pedTopo .q{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pedSub{font-size:12px;color:var(--ink-3);margin:3px 0 9px}
.pedBox .btn{margin:0}
.pedFeito{display:flex;gap:10px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid var(--rule-2);font-size:13px}
.pedFeito .n{font-size:12px;color:var(--accent);font-weight:700;flex:0 0 auto}
.pedFeito .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedFeito .v{font-variant-numeric:tabular-nums}
.pedFeito .s{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.painelPed{padding:2px}

/* ── custos e cotações ────────────────────────────── */
.margemBox{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;margin-bottom:12px}
.mg{display:contents}
.mg span{padding:9px 12px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--rule-2)}
.mg b{padding:9px 12px;font-size:13.5px;font-weight:600;text-align:right;
  border-bottom:1px solid var(--rule-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mg.perde b{color:var(--crit)}
.mg.final span,.mg.final b{background:var(--accent-soft);color:var(--accent);font-weight:700;
  border-bottom:none;font-size:15px}
.mg.final b i{font-style:normal;font-size:12.5px;opacity:.8}
.aviso2{background:var(--crit-soft);color:var(--ink);padding:10px 12px;border-radius:3px}
.linhaCusto,.linhaCot,.linhaCompra{display:grid;grid-template-columns:1fr auto auto;gap:0 10px;
  align-items:center;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;
  margin-bottom:5px;background:var(--surface)}
.linhaCusto b,.linhaCot b,.linhaCompra b{display:block;font-size:13.5px;font-weight:600}
.linhaCusto small,.linhaCot small,.linhaCompra small{display:block;font-size:11.5px;
  color:var(--ink-3);margin-top:2px;line-height:1.35}
.linhaCusto .vl,.linhaCot .vl{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.linhaCusto .x{background:none;border:none;color:var(--ink-3);font-size:18px;
  line-height:1;padding:0 4px;cursor:pointer}
.linhaCusto .x:hover{color:var(--crit)}
.grupoCot{margin-bottom:12px}
.gcTit{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px}
.linhaCot.on{border-color:var(--accent);background:var(--accent-soft)}
.linhaCot.vencida{opacity:.6}
.linhaCompra{grid-template-columns:1fr auto}
.linhaCompra.atrasado{border-left:3px solid var(--crit);background:var(--crit-soft)}
.linhaCompra.chega-logo{border-left:3px solid var(--warn)}
.linhaCompra.recebido{opacity:.55}
.linhaCompra .dt{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.35}
.linhaCompra .dt b{font-size:13px;color:var(--ink);display:inline}
.linhaCompra .dt b.atr{color:var(--crit)}

/* ── gaveta ───────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(16,26,28,.42);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);
  border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column;z-index:5;
}
.drawer.on{transform:none}
.d-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:10px}
.d-h .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.d-h h2{margin:2px 0 0;font-size:18px;font-weight:600;line-height:1.2}
.d-h .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink-3);line-height:1;padding:0 2px}
.d-b{flex:1;overflow-y:auto;padding:14px 16px}

.fase-h{
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 7px;display:flex;align-items:center;gap:8px;
}
.fase-h:first-child{margin-top:0}
.fase-h.atual{color:var(--accent)}
.fase-h::after{content:"";flex:1;height:1px;background:var(--rule-2)}

.tk{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule-2);align-items:flex-start}
.tk:last-child{border-bottom:0}
.tk .st{flex:0 0 17px;text-align:center;font-size:13px;line-height:1.4}
.tk .nm{flex:1;font-size:13.5px;line-height:1.35}
.tk .nm small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.tk.res .nm{color:var(--ink-3)}
.tk.res .nm b{font-weight:400}
.tk.atual{background:var(--accent-soft);margin:0 -8px;padding:8px;border-radius:3px;border-bottom:0}
.tk.atual .nm{font-weight:600}

.acoes{border-top:1px solid var(--rule);padding:12px 16px;background:var(--surface-2)}
.acoes .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.acoes .row{display:flex;gap:8px;flex-wrap:wrap}
.acoes .hint{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.4}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:9;max-width:min(520px,92vw);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--crit)}
.toast.ok{background:var(--ok)}

.vazio{padding:60px 20px;text-align:center;color:var(--ink-3)}
.vazio h3{font-size:17px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.vazio p{font-size:13.5px;margin:0;line-height:1.5}

/* ── abas da gaveta ───────────────────────────────── */
.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;
  padding:10px 6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.drawer{width:min(620px,100%)}

/* ── tabela de itens ──────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 5px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:6px 5px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl input{width:100%;padding:6px 7px;border:1px solid var(--rule);border-radius:3px;
  font-size:13px;background:var(--surface);min-width:64px}
.tbl input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tbl input.falta{border-color:var(--gestao);background:var(--gestao-soft)}
.tbl tr.fora{opacity:.55}
.tbl tr.fora td:first-child::after{content:" · fora do orçamento";font-size:10.5px;color:var(--ink-3)}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:14px}
.totais div{background:var(--surface);padding:9px 11px}
.totais .k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.totais .v{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:18px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:2px}
.totais .v.pos{color:var(--ok)} .totais .v.neg{color:var(--crit)}

/* ── cadastros ────────────────────────────────────── */
.cadWrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;height:100%;
  align-items:start;min-width:min-content}
.painel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:16px 18px;box-shadow:var(--shadow)}
.painel h3{margin:0 0 12px;font-size:17px}
.lista{max-height:calc(100vh - 210px);overflow-y:auto;margin:-4px -6px;padding:4px 6px}
.linhaCli{width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;padding:10px 12px;margin-bottom:6px;display:block}
.linhaCli.on{border-color:var(--accent);background:var(--accent-soft)}
.linhaCli b{display:block;font-size:14.5px;font-weight:600}
.linhaCli small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

/* ── formulários ──────────────────────────────────── */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);
  border-radius:3px;font-size:14px;background:var(--surface);font-family:inherit}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.campo .dica{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.dica{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.gGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.gGrid .campo label{font-size:11px}
.gGrid .campo input{padding:7px 9px;font-size:13px}
.gGrid .campo input.vazio{border-color:var(--warn);background:var(--warn-soft)}
.gFalta{font-size:12.5px;color:var(--warn);margin:11px 0 0;line-height:1.45;font-weight:600}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── modal ────────────────────────────────────────── */
.mScrim{position:fixed;inset:0;background:rgba(16,26,28,.45);z-index:8}
.modal{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(480px,calc(100% - 28px));max-height:86vh;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;box-shadow:var(--sh-lift);
  display:flex;flex-direction:column}
.m-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.m-h h3{margin:0;font-size:17px;flex:1}
.m-b{padding:16px;overflow-y:auto}
.m-f{padding:12px 16px;border-top:1px solid var(--rule);background:var(--surface-2);
  display:flex;gap:8px;justify-content:flex-end}

/* ── TF · motor de tabela ─────────────────────────── */
.tfWrap{border:1px solid var(--rule);border-radius:5px;overflow:auto;background:var(--surface);
  max-height:calc(100vh - var(--header-h) - 200px)}
.tfTab{width:100%;border-collapse:collapse}
.tfTab thead th{position:sticky;top:0;z-index:5;background:var(--surface-2);padding:0;
  border-bottom:1px solid var(--rule);white-space:nowrap;text-align:left}
.tfTab thead th.num{text-align:right}
.tfTh{display:flex;align-items:center;gap:5px;width:100%;padding:8px 11px;background:none;
  border:0;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);transition:background var(--t),color var(--t);text-align:left;font-family:inherit}
.tfTh:hover{background:var(--rule-2);color:var(--ink)}
th.num .tfTh{justify-content:flex-end}
.tfOrd{font-size:8px;color:var(--accent)}
.tfFun{font-size:10px;opacity:.35;margin-left:auto}
th.num .tfFun{margin-left:4px}
.tfTh:hover .tfFun{opacity:.8}
th.filtrada .tfTh{color:var(--accent)}
th.filtrada .tfFun{opacity:1}
.tfTab td{padding:7px 11px;border-bottom:1px solid var(--rule-2);vertical-align:top;font-size:12.5px}
.tfTab td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tfTab tbody tr:nth-child(even) td{background:var(--surface-2)}
.tfTab tbody tr:hover td{background:var(--accent-soft)}
.tfTab tbody tr.clicavel{cursor:pointer}
.tfTab tbody tr.atrasada td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.tfTab tbody tr:last-child td{border-bottom:0}

.tfRodape{display:flex;align-items:center;gap:12px;padding:9px 2px 2px;flex-wrap:wrap}
.tfConta{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.tfConta b{color:var(--ink)}
.tfPag{display:flex;gap:3px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tfPag button{min-width:28px;height:28px;border:1px solid var(--rule);background:var(--surface);
  border-radius:4px;font-size:12px;color:var(--ink-2);font-family:var(--mono);padding:0 6px}
.tfPag button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tfPag button.atual{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tfPag button:disabled{opacity:.35;cursor:default}
.tfEl{color:var(--ink-3);padding:0 2px}

/* `.tog` e `.chk` eram usadas pelo gerador de proposta e nunca existiram no
   CSS: os dois botões saíam nus, sem indicar qual estava escolhido. */
.tog{display:flex;gap:7px;flex-wrap:wrap}
.tog button{flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--rule);
  background:var(--surface);border-radius:4px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);font-family:inherit;transition:all var(--t)}
.tog button:hover{border-color:var(--accent);color:var(--accent)}
.tog button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--rule);
  border-radius:4px;font-size:13px;background:var(--surface);cursor:pointer;margin-bottom:9px}
.check input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}

.tfChips{display:none;gap:6px;align-items:center;flex-wrap:wrap;padding:0 0 9px}
.tfChips.on{display:flex}
.tfChip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  border:1px solid transparent;color:var(--accent-ink);border-radius:99px;padding:3px 10px;
  font-size:11.5px;font-weight:600}
.tfChip button{border:0;background:none;color:inherit;font-size:13px;line-height:1;padding:0}
.tfLimpa{border:0;background:none;color:var(--crit);font-size:11.5px;font-weight:700;
  font-family:inherit;text-decoration:underline;padding:0}

.vazio2{text-align:center;padding:34px 18px;color:var(--ink-3)}
.vazio2 b{display:block;font-size:14.5px;color:var(--ink-2);margin-bottom:5px}
.vazio2 p{font-size:12.5px;margin:0;line-height:1.5}

.tfMenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--rule);
  border-radius:6px;box-shadow:var(--sh-lift);width:250px;display:flex;flex-direction:column;overflow:hidden}
.tfmOrd{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rule-2)}
.tfmOrd button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
  padding:5px;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.tfmOrd button:hover{border-color:var(--accent);color:var(--accent)}
.tfmB{padding:8px 10px 4px}
.tfmB input{width:100%;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:6px 9px;font-size:12px;font-family:inherit;outline:none}
.tfmB input:focus{border-color:var(--accent);background:var(--surface)}
.tfmLista{max-height:230px;overflow:auto;padding:4px 0}
.tfmItem{display:flex;align-items:center;gap:8px;padding:4px 11px;font-size:12px;cursor:pointer}
.tfmItem:hover{background:var(--surface-2)}
.tfmItem input{accent-color:var(--accent);flex:0 0 auto}
.tfmItem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfmItem i{font-style:normal;font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.tfmMais{font-size:11px;color:var(--ink-3);padding:6px 11px;margin:0}
.tfmPe{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--rule-2)}
.tfmPe button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
  padding:5px;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.tfmPe button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.fitaBusca{flex:0 0 auto;align-self:flex-start;background:var(--accent-soft);
  color:var(--accent-ink);font-size:12px;font-weight:600;padding:5px 11px;border-radius:4px;

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
// CONFIGURAÇÃO — preencha as duas linhas abaixo para ligar no Supabase.
// Estão em: Supabase → seu projeto → Settings → API
// Deixe vazio para rodar em modo demo.
// ════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL      = 'https://ewthwgkgwzgutvxkwqfd.supabase.co';   // ex.: 'https://xxxxxxxx.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_W987XKBK3Oo2aQ7FJyq9_w_qWrSg_E4';   // a "Publishable key" (sb_publishable_...)
                                // Serve também a antiga "anon public" (eyJ...),
                                // mas ela será desligada pelo Supabase no fim
                                // de 2026 — prefira a Publishable.

const APP_VERSION = 'S13';
// o crachá lê a constante: escrever a versão à mão no HTML já deixou o app
// dizendo S6 rodando S7, e é o número que eu peço quando algo dá errado
try{ document.getElementById('verBadge').textContent = 'MANAGER · ' + APP_VERSION; }catch(e){}
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;

// ════════════════════════════════════════════════════════════════════════════
// CAMADA DE REDE
// ----------------------------------------------------------------------------
// Transplantada do ProperCare (achados DAT-02 e DAT-05 do parecer). Três coisas
// que o TapControl não tinha e custaram dado:
//   · AbortSignal DE VERDADE — 30 s leitura, 45 s escrita. Promise.race rejeita
//     a promessa mas deixa o fetch vivo, e o retry em cima disso é o que
//     duplicava escrita.
//   · Sinal NOVO a cada tentativa: um AbortSignal já disparado continua
//     disparado, e reusá-lo faria o retry abortar na hora.
//   · Erro de rede que sobrevive ao retry DERRUBA o indicador. O verde não
//     mente: melhor recusar alto do que fingir que gravou.
// ════════════════════════════════════════════════════════════════════════════

let conectado = false;
let reconTimer = null, reconPasso = 0;
const BACKOFF = [5000, 10000, 20000, 40000, 60000];

function setConn(estado, texto){
  const d = document.getElementById('dot');
  d.className = 'dot' + (estado ? ' ' + estado : '');
  document.getElementById('connTxt').textContent = texto;
  conectado = (estado === 'ok');
}

function sinal(escrita){
  try{
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
      return AbortSignal.timeout(escrita ? 45000 : 30000);
  }catch(e){}
  return undefined;
}
const ehTimeout = e => !!e && (e.name === 'TimeoutError' || e.name === 'AbortError'
  || /timed out|timeout|aborted/i.test(String(e.message||'')));

function pararRecon(){ if(reconTimer){clearTimeout(reconTimer);reconTimer=null;} reconPasso=0; }
function agendarRecon(){
  if (reconTimer || DEMO) return;
  const espera = BACKOFF[Math.min(reconPasso, BACKOFF.length-1)];
  reconPasso++;
  setConn('off', 'Reconectando em ' + Math.round(espera/1000) + 's');
  reconTimer = setTimeout(async () => {
    reconTimer = null;
    try { await carregar({silencioso:true}); } catch(e){}
  }, espera);
}
function falhaDeRede(e){
  setConn('off', 'Sem conexão');
  console.warn('[rede] conexão marcada OFF:', e && e.message);
  agendarRecon();
}

async function req(caminho, opts = {}, tentativas = 2){
  const escrita = (opts.method || 'GET').toUpperCase() !== 'GET';
  let ultimo, jaRenovou = false;
  for (let i = 0; i <= tentativas; i++){
    try{
      const s = sinal(escrita);
      const r = await fetch(SUPABASE_URL + caminho, Object.assign({}, opts, {
        signal: s,
        // A chave vai SEMPRE no cabeçalho `apikey`. O `Authorization` só entra
        // quando existe sessão de verdade — as chaves novas do Supabase
        // (sb_publishable_...) NÃO são JWT, e mandá-las como Bearer faz a
        // verificação falhar. Assim o app funciona com a chave nova e com a
        // antiga (anon), sem depender de qual delas foi colada acima.
        headers: Object.assign(
          { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {},
          opts.headers || {})
      }));
      const txt = await r.text();
      if (txt.trim().startsWith('<'))
        throw new Error('O servidor devolveu HTML — verifique a URL do projeto');
      let corpo = null;
      if (txt) { try { corpo = JSON.parse(txt); } catch(e){ throw new Error('Resposta inválida: ' + txt.slice(0,80)); } }
      if (!r.ok){
        // erro de NEGÓCIO (o banco recusou): não retenta e não derruba o verde
        const msg = (corpo && (corpo.message || corpo.error_description || corpo.error || corpo.hint)) || ('HTTP ' + r.status);
        const err = new Error(msg); err.negocio = (r.status >= 400 && r.status < 500); err.status = r.status;

        // token vencido não é erro de negócio nem de rede: é sessão velha.
        // Renova UMA vez e repete a chamada — o usuário não percebe nada.
        // Sessão vencida. A ordem importa: tenta renovar UMA vez; se não der —
        // ou se nem existe refresh_token guardado (sessão antiga, de antes da
        // renovação automática) — manda para o login com recado claro. Antes,
        // este caso caía direto no `throw` e a pessoa ficava com o quadro vazio
        // e um "JWT expired" vermelho na tela: parece perda de dados, e não é.
        if (tokenVencido(err)){
          if (!jaRenovou && sessao.refresh){
            jaRenovou = true;
            if (await renovarToken()){ i--; continue; }
          }
          sessaoExpirou();
          throw Object.assign(new Error('Sua sessão expirou. Entre de novo — nada se perdeu.'),
                              { negocio:true, sessaoMorta:true });
        }
        throw err;
      }
      return corpo;
    }catch(e){
      ultimo = e;
      if (ehTimeout(e)){
        ultimo = new Error('O servidor não respondeu em ' + (escrita ? '45' : '30') + 's'
          + (escrita ? ' — a operação pode NÃO ter sido gravada.' : '.'));
      }
      const transitorio = ehTimeout(e) || !e.negocio && (
        /Failed to fetch|NetworkError|Load failed/i.test(e.message) ||
        /devolveu HTML/.test(e.message) || /^HTTP 5\d\d$/.test(e.message));
      // ESCRITA NÃO SE REPETE SOZINHA. Um POST que chegou ao servidor e estourou
      // o prazo do cliente já foi commitado lá: o AbortSignal aborta o navegador,
      // não desfaz a transação no banco. Reenviar cria o segundo registro — e só
      // `tf_abrir_os` e o envio de arquivo mandam `client_uid` para se defender.
      if (!transitorio || i === tentativas || (escrita && !opts.idempotente)){
        if (transitorio) falhaDeRede(ultimo);
        throw ultimo;
      }
      await new Promise(r => setTimeout(r, 600 * (i+1)));
    }
  }
  throw ultimo;
}

const get  = (q)      => req('/rest/v1/' + q);
/* `p_client_uid` é a chave de idempotência: o banco recusa o segundo envio com
   o mesmo uid, então ESSAS podem ser retentadas. As outras, não. */
const rpc  = (f, p)   => req('/rest/v1/rpc/' + f,
  { method:'POST', body: JSON.stringify(p||{}),
    idempotente: !!(p && (p.p_client_uid || p.p_uid)) });
const post = (t, o)   => req('/rest/v1/' + t, { method:'POST', body: JSON.stringify(o),
                             headers:{ Prefer:'return=representation' } });
const patch= (t, f, o)=> req('/rest/v1/' + t + '?' + f, { method:'PATCH', body: JSON.stringify(o),
                             headers:{ Prefer:'return=representation' } });

window.addEventListener('online',  () => { pararRecon(); if(!conectado) carregar({silencioso:true}); });
window.addEventListener('offline', () => { setConn('off','Sem conexão'); agendarRecon(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !conectado && !DEMO) { pararRecon(); carregar({silencioso:true}); }
});

// ════════════════════════════════════════════════════════════════════════════
// SESSÃO
// ════════════════════════════════════════════════════════════════════════════
// A chave é UMA para os três arquivos. Até o S11 eram duas ('tapflow_sessao'
// aqui, 'tff_sessao' no Field), o que obrigava o time a logar duas vezes — e
// nunca foi necessário: o GitHub Pages serve os dois do MESMO endereço, então
// para o navegador manager/ e field/ são o mesmo lugar. A separação era minha.
const SESSAO_KEY  = 'tf_sessao';
const SESSAO_VELHA = 'tapflow_sessao';   // aceita por um tempo, para ninguém cair no dia da virada

// O login agora mora no hub. Só faz sentido mandar para lá quando isto está
// sendo SERVIDO: aberto por duplo clique (file://) não existe hub nenhum.
const NO_SERVIDOR = location.protocol === 'http:' || location.protocol === 'https:';
function irParaHub(recado){
  try{ sessionStorage.setItem('tf_recado', recado || ''); }catch(e){}
  location.href = '../?para=manager';
}

let sessao = { token:null, refresh:null, nome:null, email:null, perfil:null,
               perfil_nome:null, admin:false, modulos:[], executa_em:null };

// ── RENOVAÇÃO DO TOKEN ──────────────────────────────────────────────────────
// O token de acesso do Supabase vale cerca de 1 hora. Sem renovar, o app morre
// no meio do expediente com "JWT expired" — e, pior, com os quadros vazios, que
// parece perda de dado. O refresh_token existe justamente para isso: uma
// chamada troca o token vencido por um novo, sem pedir senha de novo.
//
// A promessa é memoizada: se cinco requisições vencerem ao mesmo tempo, todas
// esperam a MESMA renovação em vez de dispararem cinco.
let renovando = null;

async function renovarToken(){
  if (!sessao.refresh) return false;
  if (renovando) return renovando;
  renovando = (async () => {
    try{
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST',
        headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: sessao.refresh }),
        signal: sinal(true)
      });
      const j = await r.json().catch(()=>null);
      if (!r.ok || !j || !j.access_token) return false;
      sessao.token = j.access_token;
      if (j.refresh_token) sessao.refresh = j.refresh_token;
      salvarSessao();
      return true;
    }catch(e){ return false; }
    finally{ setTimeout(() => { renovando = null; }, 0); }
  })();
  return renovando;
}

const tokenVencido = e =>
  e && (e.status === 401 || /jwt expired|invalid jwt|token.*expired|not authenticated/i.test(e.message||''));

function salvarSessao(){ try{ localStorage.setItem(SESSAO_KEY, JSON.stringify(sessao)); }catch(e){} }

// Renovar falhou (refresh também venceu, ou a senha mudou): não adianta
// insistir. Volta para o login dizendo o que houve, em vez de deixar a tela
// vazia parecendo que os dados sumiram.
function sessaoExpirou(){
  sessao = { token:null, refresh:null, nome:null, email:null, perfil:null,
             perfil_nome:null, admin:false, modulos:[], executa_em:null };
  try{ localStorage.removeItem(SESSAO_KEY); }catch(e){}
  if (NO_SERVIDOR){ irParaHub('Sua sessão expirou. Entre de novo.'); return; }
  const lg = document.getElementById('login');
  if (lg){
    lg.hidden = false;
    const m = document.getElementById('lgErro');
    if (m) m.textContent = 'Sua sessão expirou. Entre de novo.';
  }
}
function lerSessao(){
  try{
    let r = localStorage.getItem(SESSAO_KEY);
    if (!r){
      // adoção: quem já estava logado no S11 não é expulso pela troca de chave
      const v = localStorage.getItem(SESSAO_VELHA);
      if (v){ r = v; localStorage.setItem(SESSAO_KEY, v); localStorage.removeItem(SESSAO_VELHA); }
    }
    if (r) sessao = Object.assign(sessao, JSON.parse(r));
  }catch(e){}
}

/** Quem sou eu — o SERVIDOR responde (tf_meu_acesso), numa chamada só, e traz
 *  os módulos junto. Antes era um select com embed e o `modulos` nem vinha:
 *  cada tela decidia por conta própria o que mostrar, que é como duas telas
 *  passam a discordar. Ver sql/26_acesso.sql. */
async function quemSou(){
  const a = await rpc('tf_meu_acesso', {});
  if (!a || !a.perfil)
    throw new Error('Login existe, mas você não está na tabela usuarios — veja o Passo 3b do guia.');
  Object.assign(sessao, {
    nome:a.nome, email:a.email, perfil:a.perfil, perfil_nome:a.perfil_nome,
    admin:!!a.admin, modulos:a.modulos || [], executa_em:a.executa_em
  });
  salvarSessao();
  return a;
}

async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password: senha }),
    signal: sinal(true)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'E-mail ou senha inválidos');
  sessao.token = j.access_token;
  sessao.refresh = j.refresh_token || null;
  await quemSou();
}

// ════════════════════════════════════════════════════════════════════════════
// DADOS
// ════════════════════════════════════════════════════════════════════════════
let cards = [];      // linhas de v_os_kanban
let falhaCarga = null;   // motivo do último erro, para a tela vazia não mentir
let quadro = 'campo';
let visao  = 'campo';    // a chave do item de menu — ver NAV
let abaDrawer = 'tarefas';
let cadSel = null;       // cliente selecionado nos cadastros
let osAberta = null; // { card, tarefas }

async function carregar(opt){
  opt = opt || {};
  if (DEMO){ cards = demoCards(); pintar(); setConn('ok','Modo demo'); return; }
  if (!opt.silencioso) setConn('sync','Carregando…');
  try{
    cards = await get('v_os_kanban?select=*&order=coluna_ordem,numero');
    falhaCarga = null;
    pararRecon();
    setConn('ok','Conectado');
    if (visao === 'campo' || visao === 'adm') pintar();
  }catch(e){
    // Guarda o MOTIVO: quadro vazio por erro não pode ser desenhado como
    // "nada para fazer". Foi assim que um "JWT expired" virou susto.
    falhaCarga = e.message || 'não deu para carregar';
    if (e.negocio && !e.sessaoMorta){ setConn('off','Erro'); toast(e.message, 'err'); }
    if (visao === 'campo' || visao === 'adm') pintar();
    throw e;
  }
}

// ════════════════════════════════════════════════════════════════════════════
// PINTURA DOS QUADROS
// ----------------------------------------------------------------------------
// As colunas saem dos próprios dados: cada `coluna` distinta do quadro vira uma.
// Nada é fixo no código — renomear uma fase no banco renomeia a coluna aqui.
// ════════════════════════════════════════════════════════════════════════════

/** Escreve um contador do menu, se ele estiver no menu desta pessoa. */
function contador(id, n){
  const el = document.getElementById(id);
  if (el) el.textContent = n;
}

function pintar(){
  const noQuadro = cards.filter(c => c.coluna && (c.quadro === quadro || c.quadro === 'ambos'));
  const q = BUSCA[quadro] || '';
  const doQuadro = !q ? noQuadro : noQuadro.filter(c => casa(
    [c.numero, c.cliente, c.coluna, c.tarefa_atual, c.descricao].join(' '), q));

  // Os contadores vivem no menu, e desde os privilégios o menu pode não ter o
  // item — o perfil comercial não vê Campo. Escrever direto estourava a tela
  // inteira num TypeError. O contador que não existe simplesmente não é escrito.
  contador('nCampo', cards.filter(c => c.coluna && (c.quadro === 'campo' || c.quadro === 'ambos')).length);
  contador('nAdm',   cards.filter(c => c.coluna && (c.quadro === 'adm'   || c.quadro === 'ambos')).length);

  const board = document.getElementById('board');
  board.innerHTML = '';

  // Lista vazia por ERRO não pode ser desenhada como "nada para fazer" — foi
  // assim que um "JWT expired" virou susto de perda de dados.
  if (!noQuadro.length && falhaCarga){
    board.innerHTML = '<div class="vazio"><h3>Não deu para carregar o quadro</h3><p class="mt"></p>'
      + '<button class="btn" id="bRetentar" style="margin-top:14px">Tentar de novo</button></div>';
    board.querySelector('.mt').textContent = falhaCarga
      + ' — isto NÃO quer dizer que não há OS abertas.';
    document.getElementById('bRetentar').addEventListener('click',
      () => carregar().catch(()=>{}));
    return;
  }

  if (!doQuadro.length){
    board.innerHTML = q
      ? '<div class="vazio"><h3>Nenhuma OS com essa busca</h3><p class="mt2"></p>'
        + '<button class="btn" id="bLimpaB" style="margin-top:14px">Limpar a busca</button></div>'
      : '<div class="vazio"><h3>Nenhuma OS neste quadro</h3>' +
        '<p>' + (quadro === 'campo'
          ? 'Nada depende do campo agora. Veja o quadro da gestão.'
          : 'Nada parado no escritório. Veja o quadro do campo.') + '</p></div>';
    if (q){
      board.querySelector('.mt2').textContent =
        noQuadro.length + ' OS neste quadro não casam com "' + q + '".';
      document.getElementById('bLimpaB').addEventListener('click', () => {
        BUSCA[quadro] = ''; document.getElementById('tbBusca').value = ''; pintar();
      });
    }
    return;
  }

  // As colunas do quadro vêm do TEMPLATE, não só das OS que existem hoje.
  // Coluna vazia continua na tela: é assim que se enxerga o fluxo inteiro e se
  // percebe que ninguém está em "Calibração" — some a coluna, some a informação.
  const mapa = new Map();
  COLUNAS.filter(k => k.quadro === quadro)
         .forEach(k => mapa.set(k.fase, { ordem:k.ordem, itens:[] }));

  doQuadro.forEach(c => {
    if (!mapa.has(c.coluna)) mapa.set(c.coluna, { ordem: c.coluna_ordem, itens: [] });
    mapa.get(c.coluna).itens.push(c);
  });
  const colunas = [...mapa.entries()].sort((a,b) => a[1].ordem - b[1].ordem);

  if (q){
    const fita = document.createElement('div');
    fita.className = 'fitaBusca';
    fita.textContent = doQuadro.length + ' de ' + noQuadro.length + ' OS batem com "' + q + '"';
    board.appendChild(fita);
  }

  colunas.forEach(([nome, dados]) => {
    const col = document.createElement('div');
    col.className = 'col ' + (quadro === 'campo' ? 'campo' : 'gestao')
                  + (dados.itens.length ? '' : ' vazia');
    col.innerHTML =
      '<div class="col-h"><span class="t"></span><span class="c">' + dados.itens.length + '</span></div>' +
      '<div class="col-b"></div>';
    col.querySelector('.t').textContent = nome;
    const body = col.querySelector('.col-b');
    if (!dados.itens.length){
      const v = document.createElement('div'); v.className = 'col-vazia'; v.textContent = 'vazia';
      body.appendChild(v);
    }
    // mais crítico primeiro: travada, depois atrasada, depois mais tempo parada
    dados.itens.sort(ordemFila);
    dados.itens.forEach(c => body.appendChild(cardEl(c)));
    board.appendChild(col);
  });
}

// ── registro de colunas ─────────────────────────────────────────────────────
// Lido uma vez do template ativo. O quadro de cada coluna é o executa_em do
// perfil responsável pela primeira tarefa dela.
let COLUNAS = [];

async function carregarColunas(){
  try{
    let tarefas, perfis;
    if (DEMO){
      if (!DEMO_DB) demoSeed();
      tarefas = Object.values(DEMO_DB)[0].tarefas;
      perfis  = Object.entries(EXECUTOR).map(([id, ex]) => ({ id, executa_em: ex }));
    } else {
      const tpl = await get('pipeline_templates?select=tarefas&ativo=eq.true&limit=1');
      if (!tpl || !tpl.length) return;
      tarefas = tpl[0].tarefas || [];
      perfis  = await get('perfis?select=id,executa_em');
    }
    const ex = {}; perfis.forEach(p => ex[p.id] = p.executa_em);
    const vistas = new Map();
    tarefas.forEach(t => {
      const fase = t.fase, ordem = t.fase_ordem;
      if (!fase || vistas.has(fase)) return;
      const p1 = (t.perfis_responsaveis || [])[0];
      vistas.set(fase, { fase, ordem, quadro: ex[p1] || 'adm' });
    });
    COLUNAS = [...vistas.values()].sort((a,b) => a.ordem - b.ordem);
  }catch(e){ console.warn('[colunas] não foi possível ler o template:', e.message); }
}

const atrasado = c => c.alerta_dias && c.dias_na_coluna != null && c.dias_na_coluna >= c.alerta_dias;

/* ── A ORDEM DA FILA ────────────────────────────────────────────────────────
   Quem sobe é o que está apodrecendo, não o que foi marcado como importante.

   1. URGENTE fura a fila. Só ele. `alta` é desempate lá embaixo — e isso não é
      timidez: no ProperCare qualquer nível furava, e em pouco tempo "alta"
      virou o padrão de quem quer atenção, ou seja, parou de significar algo.
   2. Depois, a SITUAÇÃO — o pior dos dois relógios (etapa e prazo), que vem
      calculada do banco, não daqui.
   3. Depois, travada.
   4. Depois, quem está parado há mais tempo na coluna.
   5. E só então a prioridade digitada desempata.                              */
const SIT_PESO = { atrasada:3, risco:2, ok:1, sem_meta:0, concluida:0 };
const peso = c => (c.travada ? 2 : 0) + (atrasado(c) ? 1 : 0);
const rankPrio = c => Number(c.prioridade_rank || 1);
const furaFila = c => c.fura_fila === true || rankPrio(c) >= 3;

function ordemFila(a, b){
  const fa = furaFila(a) ? 1 : 0, fb = furaFila(b) ? 1 : 0;
  if (fa !== fb) return fb - fa;
  const sa = SIT_PESO[a.situacao] ?? 0, sb = SIT_PESO[b.situacao] ?? 0;
  if (sa !== sb) return sb - sa;
  const pa = peso(a), pb = peso(b);
  if (pa !== pb) return pb - pa;
  const da = a.dias_na_coluna || 0, db = b.dias_na_coluna || 0;
  if (da !== db) return db - da;
  return rankPrio(b) - rankPrio(a);
}

const PRIO_ROT = { urgente:'urgente', alta:'alta', normal:'' };

/** O chip de prazo com PROCEDÊNCIA — o title diz de onde veio o número.
 *  Prazo sem procedência vira crença: ninguém sabe se aquele 05/08 é promessa
 *  de alguém ou meta de contrato, e os dois se discute de um jeito diferente. */
function chipPrazo(c){
  if (!c.prazo_saida || c.dias_restantes == null) return '';
  const d = Number(c.dias_restantes);
  const de = c.prazo_origem === 'digitado' ? 'prazo digitado por alguém do escritório'
           : c.prazo_origem === 'meta_do_tipo' ? 'meta do tipo de OS (não foi digitado)'
           : 'sem procedência';
  const cls = d < 0 ? ' atras' : d <= 2 ? ' risco' : '';
  const txt = d < 0 ? Math.abs(d) + 'd de atraso' : d === 0 ? 'vence hoje' : 'faltam ' + d + 'd';
  return '<span class="chip' + cls + '" title="' + esc(dataBR(c.prazo_saida) + ' — ' + de) + '">📅 ' + txt + '</span>';
}

function cardEl(c){
  const el = document.createElement('button');
  el.className = 'card'
    + (c.travada ? ' travada' : atrasado(c) ? ' atrasada' : '')
    + (c.situacao ? ' sit-' + c.situacao : '')
    + (furaFila(c) ? ' urgente' : '');
  el.type = 'button';

  const total = c.tarefas_na_coluna || 0, feitas = c.resolvidas_na_coluna || 0;
  const pct = total ? Math.round(feitas / total * 100) : 0;

  const chips = [];
  if (furaFila(c)) chips.push('<span class="chip urg">🔴 urgente</span>');
  else if (rankPrio(c) === 2) chips.push('<span class="chip altaP">alta</span>');
  const cp = chipPrazo(c); if (cp) chips.push(cp);
  if (total > 1) chips.push('<span class="chip prog">' + feitas + ' de ' + total + '</span>');
  if (c.travada) chips.push('<span class="chip travada">travada</span>');
  else if (atrasado(c)) chips.push('<span class="chip atras">' + c.dias_na_coluna + 'd · meta ' + c.alerta_dias + 'd</span>');
  else if (c.dias_na_coluna != null) chips.push('<span class="chip">' + c.dias_na_coluna + 'd na coluna</span>');
  if (c.tarefa_atual_lock) chips.push('<span class="chip lock">assumida</span>');

  el.innerHTML =
    '<div class="num mono"></div>' +
    '<div class="cli"></div>' +
    '<div class="tar"><span class="ic">' + icone(c.tarefa_atual_status, c.tarefa_atual_tipo) + '</span><span class="tn"></span></div>' +
    (total > 1 ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '') +
    '<div class="foot">' + chips.join('') + '</div>';

  el.querySelector('.num').textContent = c.numero;
  el.querySelector('.cli').textContent = c.cliente;
  el.querySelector('.tn').textContent  = c.tarefa_atual || '—';
  el.addEventListener('click', () => abrirOS(c));
  return el;
}

function icone(status, tipo){
  if (status === 'completo')   return '✓';
  if (status === 'dispensado') return '–';
  if (status === 'bloqueado')  return '\u2298';
  if (status === 'condicional')return '◇';
  if (status === 'com_pendencia' || status === 'incompleto') return '!';
  if (tipo === 'decisao')      return '?';
  if (String(tipo||'').startsWith('auto:agregacao')) return '∑';
  if (String(tipo||'').startsWith('auto:documento')) return '§';
  if (String(tipo||'').startsWith('auto:'))          return '⟳';
  if (status === 'em_andamento') return '▸';
  return '○';
}

// GAVETA DA OS

function fecharDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  osAberta = null;
  // sem isto, o último negócio continuava vivo e ressuscitava quando alguém
  // clicava numa aba que sobrou de outra tela
  negAberto = null;
}
document.getElementById('dClose').addEventListener('click', fecharDrawer);
document.getElementById('scrim').addEventListener('click', fecharDrawer);
/* Escape resolve por prioridade, de cima para baixo. Antes ele fechava sempre a
   gaveta: com o modal aberto, fechava a gaveta invisível por baixo e deixava o
   modal na tela; e digitando uma anotação, fechava a gaveta e perdia o texto. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (_tfMenuEl){ tfFecharMenu(); return; }
  const modal = document.getElementById('modal');
  if (modal && !modal.hidden){ fecharModal(); return; }
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')
      && a.closest('#drawer')){ a.blur(); return; }   // primeiro Esc sai do campo
  fecharDrawer();
});

async function abrirOS(c){
  document.getElementById('dNum').textContent = c.numero;
  document.getElementById('dCli').textContent = c.cliente;
  document.getElementById('dSub').textContent =
    c.coluna + ' · quadro ' + (c.quadro === 'campo' ? 'do campo' : 'da gestão');
  document.getElementById('dBody').innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando…</p>';
  document.getElementById('dAcoes').innerHTML = '';
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  montarTabsOS();

  let tarefas;
  try{
    tarefas = DEMO ? demoTarefas(c.os_id)
      : await get('pipeline_tarefas?select=tarefa_id,nome,tipo,fase,fase_ordem,ordem,status,opcoes,'
                  + 'perfis_responsaveis,lock_por,executor,usuario_designado,data_prevista,tempo_estimado_min'
                  + '&os_id=eq.' + c.os_id + '&ativo=eq.SIM&order=camada,fase_ordem,ordem');
  }catch(e){ document.getElementById('dBody').innerHTML = '<p style="color:var(--crit);font-size:13px"></p>';
             document.getElementById('dBody').querySelector('p').textContent = e.message; return; }

  osAberta = { card:c, tarefas };
  pintarDrawer();
}

/** As abas da OS. Precisa ser função porque a gaveta é compartilhada com o
 *  Comercial, que troca o conteúdo do #dTabs pelas abas dele. */
function montarTabsOS(){
  const t = document.getElementById('dTabs');
  t.innerHTML = [['tarefas','Tarefas'],['itens','Itens'],['proposta','Proposta'],
                 ['custos','Custos'],['arquivos','Arquivos']]
    .map(([k,r]) => '<button type="button" data-t="' + k + '"'
      + (abaDrawer === k ? ' class="on"' : '') + '>' + r + '</button>').join('');
}

function pintarDrawer(){
  if (abaDrawer === 'itens')    return pintarItens();
  if (abaDrawer === 'proposta') return pintarProposta();
  if (abaDrawer === 'custos')   return pintarCustos();
  if (abaDrawer === 'arquivos') return pintarArquivos();
  const { card, tarefas } = osAberta;
  const body = document.getElementById('dBody');
  body.innerHTML = '';
  body.appendChild(faixaPrazo(card));

  let faseAtual = null;
  tarefas.forEach(t => {
    if (t.fase !== faseAtual){
      faseAtual = t.fase;
      const h = document.createElement('div');
      h.className = 'fase-h' + (t.fase === card.coluna ? ' atual' : '');
      h.textContent = t.fase;
      body.appendChild(h);
    }
    const resolvida = (t.status === 'completo' || t.status === 'dispensado');
    const eAtual = (t.tarefa_id === card.tarefa_atual_id);
    const el = document.createElement('div');
    el.className = 'tk' + (resolvida ? ' res' : '') + (eAtual ? ' atual' : '');
    el.innerHTML = '<div class="st">' + icone(t.status, t.tipo) + '</div><div class="nm"><b></b><small></small></div>';
    el.querySelector('b').textContent = t.nome;
    el.querySelector('small').textContent =
      t.status + (t.perfis_responsaveis && t.perfis_responsaveis.length
        ? ' · ' + t.perfis_responsaveis.join(', ') : '');
    // Designação: só faz sentido no que ainda não foi resolvido, e só para o
    // escritório. Quem já está resolvido não vai para a agenda de ninguém.
    if (!resolvida && !DEMO && podeVer('os')){
      const d = document.createElement('div');
      d.className = 'tkDes';
      const quem = t.usuario_designado ? (NOMES[t.usuario_designado] || 'designada') : null;
      d.innerHTML = '<span>' + (quem
          ? esc(quem) + (t.data_prevista ? ' · ' + dataBR(t.data_prevista) : ' · sem dia')
            + (t.tempo_estimado_min ? ' · ' + minHora(t.tempo_estimado_min) : '')
          : '<i>ninguém designado</i>') + '</span>'
        + '<button class="btn mini" type="button">' + (quem ? 'trocar' : 'designar') + '</button>';
      d.querySelector('button').addEventListener('click', ev => {
        ev.stopPropagation(); modalDesignar(card, t);
      });
      el.appendChild(d);
    }
    body.appendChild(el);
  });

  pintarAcoes();
}

// Excluir OS fica junto das ações, mas discreto e só para admin: é a única
// exclusão do sistema que apaga histórico de verdade, e existe para tirar OS de
// teste. Fica registrado no livro de exclusões quem apagou o quê.
function botaoExcluirOS(cx, card){
  if (!sessao.admin) return;
  const w = document.createElement('div');
  w.style.cssText = 'margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)';
  w.innerHTML = '<button class="btn perigo" id="osDel" style="width:100%">Excluir esta OS</button>';
  cx.appendChild(w);
  document.getElementById('osDel').addEventListener('click', async () => {
    const motivo = prompt('Excluir ' + card.numero + ' definitivamente.\n\n'
      + 'Some com tarefas, itens, levantamentos, propostas e anexos. '
      + 'Os arquivos no Drive NÃO são apagados.\n\nPor quê? (fica registrado)');
    if (motivo === null) return;
    try{
      if (!DEMO) await rpc('tf_excluir_os', { p_os_id: card.os_id, p_motivo: motivo || null });
      toast(card.numero + ' excluída.','ok');
      fecharDrawer(); carregar();
    }catch(e){ toast(e.message,'err'); }
  });
}

// O wrapper garante que o botão de excluir apareça em QUALQUER caminho de
// pintarAcoes — e ela tem seis `return` diferentes.
function pintarAcoes(){
  pintarAcoes_(); 
  botaoExcluirOS(document.getElementById('dAcoes'), osAberta.card);
}

function pintarAcoes_(){
  const { card, tarefas } = osAberta;
  const cx = document.getElementById('dAcoes');
  const t = tarefas.find(x => x.tarefa_id === card.tarefa_atual_id);
  cx.innerHTML = '';
  if (!t){ cx.innerHTML = '<div class="hint">OS sem tarefa aberta.</div>'; return; }

  const podeAgir = sessao.admin || !t.perfis_responsaveis || !t.perfis_responsaveis.length
                   || t.perfis_responsaveis.includes(sessao.perfil);

  const lbl = document.createElement('div');
  lbl.className = 'lbl'; lbl.textContent = 'Tarefa atual · ' + t.tarefa_id;
  cx.appendChild(lbl);

  const row = document.createElement('div'); row.className = 'row'; cx.appendChild(row);
  const hint = document.createElement('div'); hint.className = 'hint'; cx.appendChild(hint);

  if (!podeAgir){
    hint.textContent = 'Esta tarefa é de ' + t.perfis_responsaveis.join(' ou ')
      + '. Ela aparece aqui para você saber por que a OS está parada — mas quem conclui é o perfil responsável.';
    return;
  }

  if (t.status === 'bloqueado' || t.status === 'condicional'){
    hint.textContent = 'Esta tarefa ainda não está liberada. Ela abre sozinha quando as anteriores fecharem.';
    return;
  }

  if (String(t.tipo||'').startsWith('auto:agregacao')){
    hint.textContent = 'Esta etapa fecha sozinha quando todos os itens estiverem preenchidos — '
      + 'não há botão. O contador no card mostra quanto falta.';
    return;
  }
  if (String(t.tipo||'').startsWith('auto:documento')){
    hint.textContent = 'Esta etapa fecha quando o documento for emitido. Emitir é o que move o card.';
    return;
  }
  if (String(t.tipo||'').startsWith('auto:')){
    hint.textContent = 'Esta etapa fecha com o envio do app de campo.';
    return;
  }

  if (t.tipo === 'decisao'){
    (t.opcoes || []).forEach(o => {
      const b = document.createElement('button');
      b.className = 'btn' + (o.valor === 'reprovado' ? '' : ' pri');
      b.textContent = o.label || o.valor;
      b.addEventListener('click', () => agir('decisao', t, o.valor));
      row.appendChild(b);
    });
    hint.textContent = 'A resposta do cliente. Registre também contato, canal e data no módulo de propostas.';
    return;
  }

  if (t.status === 'pendente' && !t.lock_por){
    const b = document.createElement('button');
    b.className = 'btn pri'; b.textContent = 'Assumir';
    b.addEventListener('click', () => agir('assumir', t));
    row.appendChild(b);
  }
  const bc = document.createElement('button');
  bc.className = 'btn' + (t.status === 'em_andamento' ? ' pri' : '');
  bc.textContent = 'Concluir';
  bc.addEventListener('click', () => agir('concluir', t));
  row.appendChild(bc);
  hint.textContent = 'Concluir esta tarefa move o card — a próxima coluna é consequência, não escolha.';
}

async function agir(acao, t, valor){
  const { card } = osAberta;
  document.querySelectorAll('#dAcoes .btn').forEach(b => b.disabled = true);
  try{
    if (DEMO){ demoAgir(card, t, acao, valor); toast('Modo demo: ' + acao + ' aplicado', 'ok'); }
    else if (acao === 'assumir')  await rpc('tf_assumir_tarefa',  { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id });
    else if (acao === 'concluir') await rpc('tf_concluir_tarefa', { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id });
    else if (acao === 'decisao')  await rpc('tf_resolver_decisao',{ p_os_id: card.os_id, p_tarefa_id: t.tarefa_id, p_valor: valor });

    await carregar({silencioso:true});
    const novo = cards.find(x => x.os_id === card.os_id);
    if (!novo || !novo.coluna){ fecharDrawer(); toast('OS concluída — saiu do quadro.', 'ok'); return; }
    if (novo.coluna !== card.coluna) toast('Card foi para "' + novo.coluna + '".', 'ok');
    await abrirOS(novo);
  }catch(e){
    toast(e.message, 'err');
    pintarAcoes();
  }
}

// TOAST
// ════════════════════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(msg, tipo){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (tipo ? ' ' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 4200);
}

  const T = (id,nome,tipo,fase,fo,ord,status,perfis,opcoes) =>

       perfis_responsaveis:perfis||[], opcoes:opcoes||[], lock_por:null });

    T('T03','Fechar levantamento com o cliente','manual','Concluída em campo',30,1,'bloqueado',['inspetor']),
    T('T04','Conferir levantamento','manual','Orçamento',40,1,'bloqueado',['tecnico_adm','compras','comercial']),
    T('T05','Cotar com fornecedores','auto:agregacao','Orçamento',40,2,'bloqueado',['compras']),
    T('T06','Precificar','auto:agregacao','Orçamento',40,3,'bloqueado',['comercial','admin']),
    T('T07','Emitir proposta','auto:documento:proposta','Orçamento',40,4,'bloqueado',['comercial']),
    T('T08','Enviar ao cliente','manual','Orçamento',40,5,'bloqueado',['comercial']),
    T('T09','Cliente aprovou?','decisao','Aguardando aprovação',50,1,'bloqueado',['comercial','admin'],
      [{valor:'aprovado_total',label:'Aprovou tudo'},{valor:'aprovado_parcial',label:'Aprovou em parte'},{valor:'reprovado',label:'Não aprovou'}]),
    T('T11','Emitir pedido de compra','auto:documento:pedido_compra','Compra',60,1,'condicional',['compras']),
    T('T12','Receber material','auto:agregacao','Compra',60,2,'condicional',['compras']),
    T('T13','Calibrar e lacrar','auto:agregacao','Calibração',70,1,'condicional',['tecnico_adm']),
    T('T14','Agendar retorno','manual','Retorno p/ instalação',80,1,'condicional',['tecnico_adm','comercial']),

    T('T16','Encerrar OS','manual','Encerramento',90,2,'bloqueado',['admin','tecnico_adm'])
  ];

  // avança um pipeline até uma tarefa alvo, resolvendo o que vem antes
  const ate = (ts, alvo, dispensar) => {
    const idx = ts.findIndex(t => t.tarefa_id === alvo);
    ts.forEach((t,i) => {
      if (i < idx) t.status = 'completo';
      else if (i === idx) t.status = 'pendente';
    });
    (dispensar||[]).forEach(id => { const t = ts.find(x=>x.tarefa_id===id); if(t) t.status='dispensado'; });
    return ts;
  };

  const os = [
    { os_id:'d1', numero:'OS-2026-101', cliente:'Gerdau — Divinópolis', alvo:'T01', dias:1,  alerta:2 },

  DEMO_DB = {};
  os.forEach(o => {
    DEMO_DB[o.os_id] = { meta:o, tarefas: ate(modelo(), o.alvo, o.dispensar) };
  });
  // a OS-098 está travada: a única tarefa aberta da camada está bloqueada
  DEMO_DB.d3.travada = true;
  // a OS-095 está com a decisão parada há 12 dias — atrasada

function demoAgir(card, t, acao, valor){

  if (prox && !db.tarefas.some(x => x.status === 'pendente' || x.status === 'em_andamento'))
    prox.status = 'pendente';
  db.meta.dias = 0;

/** 90 → "1h30". Minuto puro em barra de carga não se lê. */
function minHora(m){
  m = Number(m || 0);
  if (!m) return '—';
  const h = Math.floor(m / 60), r = m % 60;
  return h ? (h + 'h' + (r ? String(r).padStart(2,'0') : '')) : (r + 'min');
}
