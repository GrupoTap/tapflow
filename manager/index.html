 *
 *  ── ITEM 1 (S31) ───────────────────────────────────────────────────────────
 *  Duas coisas mudaram aqui, e as duas vêm do caso do documento de 17/09.
 *
 *  1) A LISTA. Até o S30 ela era filtrada só pelo LADO da tarefa (campo ou
 *     escritório) — a mesma conta grossa que o banco fazia. Por isso dava para
 *     designar alguém cujo PERFIL não está entre os responsáveis: a pessoa
 *     entrava no sistema e não achava botão nenhum, só o aviso "esta tarefa é
 *     de tecnico_adm". Agora quem monta a lista é `tf_pessoas_para_tarefa`, a
 *     mesma função que a Agenda já usava desde o S22 — a regra mora num lugar
 *     só. Quem está fora do perfil responsável aparece num grupo à parte.
 *
 *  2) O AVISO. O pedido do Bruno é explícito: avisar, não bloquear. Escolher
 *     alguém de fora abre uma confirmação que diz o que vai acontecer (a
 *     pessoa pode não conseguir agir) e deixa passar. Bloqueio aqui seria
 *     mentir sobre o que o banco faz — ele aceita.
 *
 *  Para quem NÃO é admin isto vira outra tela: a única pessoa da lista é ela
 *  mesma. O modal continua existindo para o "marcar dia" da Agenda, que é de
 *  todo o escritório — é `tf_designar_tarefa` que recusa mexer na tarefa
 *  dos outros. */
async function modalDesignar(card, t, aposGravar){
  const souAdmin = !!sessao.admin;
  const eu = meuId();
  let pessoas = null, erro = null;
  if (!DEMO){
    try{
      pessoas = await rpc('tf_pessoas_para_tarefa',
        { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id, p_todos: souAdmin });
    }catch(e){ erro = e.message; }
  }
  // Sem servidor (demo) ou sem resposta: cai no filtro antigo, pelo lado da
  // tarefa. Lista vazia numa tela de atribuição parece tela quebrada.
  if (!pessoas){
    const cabe = u => t.executor === 'ambos' || u.executa_em === 'ambos' || u.executa_em === t.executor;
    pessoas = EQUIPE.filter(cabe).map(u => ({ usuario_id:u.id, nome:u.nome,
      perfil:u.perfil || u.perfil_id, por_perfil:true }));
  }
  // Quem não é admin só se designa a si mesmo — é o que o banco aceita.
  if (!souAdmin) pessoas = pessoas.filter(u => String(u.usuario_id) === String(eu));

  const aptos = pessoas.filter(u => u.por_perfil !== false);
  const fora  = pessoas.filter(u => u.por_perfil === false);
  const opt = u => '<option value="' + esc(u.usuario_id) + '"'
      + (String(u.usuario_id) === String(t.usuario_designado) ? ' selected' : '')
      + ' data-fora="' + (u.por_perfil === false ? '1' : '') + '">'
      + esc(u.nome) + (u.perfil ? ' — ' + esc(u.perfil) : '') + '</option>';

  // ── ITEM 7 (S36): QUEM VAI JUNTO ─────────────────────────────────────────
  // O apoio não muda o dono: prazo, conclusão e histórico continuam lendo
  // "Quem faz". Cada apoio vê a tarefa na própria Agenda e ela conta na carga
  // dele. Só aparece para o admin — pôr outra pessoa numa tarefa é designar.
  const apoiosAtuais = (t.apoios || []).map(String);
  const caixaApoio = u => '<label class="linhaOpc apoioOpc" data-u="' + esc(u.usuario_id) + '">'
      + '<input type="checkbox" class="mdAp" value="' + esc(u.usuario_id) + '"'
      + (apoiosAtuais.indexOf(String(u.usuario_id)) >= 0 ? ' checked' : '')
      + ' data-fora="' + (u.por_perfil === false ? '1' : '') + '"> '
      + '<span>' + esc(u.nome) + (u.perfil ? ' <small style="color:var(--ink-3)">— ' + esc(u.perfil)
      + (u.por_perfil === false ? ' · fora do perfil' : '') + '</small>' : '') + '</span></label>';
  const blocoApoio = souAdmin && !DEMO
    ? '<details class="mdApoio"' + (apoiosAtuais.length ? ' open' : '') + '><summary><b>Quem vai junto</b> '
      + '<span class="nota" style="margin:0">(apoio — serviço em dupla)</span></summary>'
      + '<p class="nota" style="margin:6px 0">Cada pessoa marcada vê esta tarefa na própria Agenda, '
      + 'no mesmo dia, e ela ocupa o tempo dela. O dono continua sendo o de cima — é o nome dele que '
      + 'vale para prazo e histórico. Concluir segue a regra de sempre: quem tem o perfil da tarefa.</p>'
      + '<div id="mdApLista" class="apoioLista">' + pessoas.map(caixaApoio).join('') + '</div></details>'
    : (apoiosAtuais.length ? '<p class="nota">Apoio: <b>' + esc(apoiosAtuais.map(id => NOMES[id] || '?').join(', '))
      + '</b> — quem muda é o administrador.</p>' : '');

  abrirModal('Designar · ' + t.nome,
    '<div class="campo"><label for="mdU">Quem faz</label><select id="mdU">' +
      '<option value="">— ninguém —</option>' +
      (aptos.length ? '<optgroup label="Perfil responsável por esta tarefa">'
                      + aptos.map(opt).join('') + '</optgroup>' : '') +
      (fora.length  ? '<optgroup label="Fora do perfil responsável — o TapFlow avisa antes">'
                      + fora.map(opt).join('') + '</optgroup>' : '') +
    '</select>' + (pessoas.length ? '' : (erro
      // "não achei ninguém" e "não consegui perguntar" são coisas diferentes.
      ? '<small style="color:var(--crit)">Não consegui carregar o time — ' +
        'recarregue a página antes de mexer em perfil.</small>'
      : '<small style="color:var(--crit)">Ninguém do time executa em ' +
        esc(t.executor || '?') + '. Confira os perfis.</small>')) + '</div>' +
    (souAdmin ? '' :
      '<p style="font-size:12px;color:var(--ink-3);margin:-4px 0 0;line-height:1.45">' +
      'Designar tarefa para <b>outra pessoa</b> é do administrador. Aqui você marca ' +
      'o <b>seu</b> dia' + (t.usuario_designado && String(t.usuario_designado) !== String(eu) && possoAssumir(t)
        ? ' — ou usa <b>Assumir</b>, aqui embaixo, para pegar a tarefa de <b>'
          + esc(NOMES[t.usuario_designado] || 'quem está com ela') + '</b> (ela sai da tarefa; a troca fica no histórico da OS).'
        : ' — ou usa <b>Assumir</b>, na OS, para pegar a tarefa para você.') + '</p>') +
    '<div class="campo"><label for="mdD">Em que dia</label>' +
      '<input id="mdD" type="date" value="' + esc(t.data_prevista || isoHoje()) + '"></div>' +
    '<p style="font-size:12px;color:var(--ink-3);margin:-4px 0 0;line-height:1.45">' +
      'Escolher <b>— ninguém —</b> devolve a tarefa para "Sem dia marcado", com dia e tudo. ' +
      'Deixar o dia vazio guarda só o responsável — a tarefa continua em "Sem dia", com o nome dele.</p>' +
    '<div class="campo"><label for="mdM">Quanto tempo (minutos)</label>' +
      '<input id="mdM" type="number" min="5" max="1440" step="5" value="' +
      esc(t.tempo_estimado_min || '') + '" placeholder="deixe vazio para usar a estimativa do template"></div>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.5">' +
      'O dia é o que põe esta tarefa no roteiro de alguém. Os minutos são o que ' +
      'monta a barra de carga na Agenda — tarefa sem minuto não some, mas também ' +
      'não entra na conta.</p>' + blocoApoio,
    [{ label:'Cancelar', onClick: fecharModal },
     // ── ITEM 1 (S38): ASSUMIR PELA AGENDA ────────────────────────────────
     // A Agenda é de todos (S36) e é onde o inspetor VÊ a tarefa do colega. A
     // OS, não: o card mora no quadro da fase atual (Administrativa, Técnico
     // Adm.), que o perfil de campo não abre. Sem este botão, o "assumir" do
     // S38 só existiria para quem já consegue abrir a OS. Aparece para quem
     // não é admin, quando a tarefa é de OUTRA pessoa e o perfil bate.
     ...(!souAdmin && !DEMO && t.usuario_designado && possoAssumir(t) ? [{
       label:'Assumir (passar para mim)', onClick: async () => {
         fecharModal();
         try{
           const r = await rpc('tf_assumir_tarefa', { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id, p_forcar: true });
           if (r && r.status === 'recusado') throw new Error(r.motivo === 'perfil_nao_autorizado'
             ? 'Esta tarefa é de ' + ((r.perfis || []).join(' ou ') || 'outro perfil') + '. O seu perfil não a assume.'
             : 'O servidor recusou: ' + (r.motivo || '?') + (r.status_atual ? ' (a tarefa está ' + r.status_atual + ')' : '') + '.');
           toast('Assumida — ' + (r && r.so_designacao
             ? 'o seu nome já está nela; ela continua bloqueada até a etapa anterior fechar.'
             : 'agora a tarefa é sua em todas as telas.'), 'ok');
           if (aposGravar) await aposGravar();
         }catch(e){ toast(e.message, 'err'); }
       } }] : []),
     { label:'Gravar', pri:true, onClick: async () => {
        const sel  = document.getElementById('mdU');
        const op   = sel.options[sel.selectedIndex];
        const quem = sel.value || null;
        // S36: os apoios marcados (sem o dono, que não é apoio de si mesmo)
        const lista = document.getElementById('mdApLista');
        const apoios = lista ? [...lista.querySelectorAll('.mdAp:checked')].map(c => c.value)
                                 .filter(v => v !== quem) : null;
        const foraAp = lista ? [...lista.querySelectorAll('.mdAp:checked')]
                                 .filter(c => c.dataset.fora === '1' && c.value !== quem)
                                 .map(c => c.closest('label').textContent.split(' — ')[0].trim()) : [];
        t._apoiosNovos = apoios;
        // o aviso do ponto 3: explica o risco e deixa o admin decidir
        if ((quem && op && op.dataset.fora === '1') || foraAp.length){
          const lista = (t.perfis_responsaveis || []).join(', ');
          const nomes = (quem && op && op.dataset.fora === '1' ? [op.textContent] : []).concat(foraAp);
          abrirModal('Designar mesmo assim?',
              '<div class="aviso"><b>' + esc(nomes.join(', ')) + '</b> não '
            + (nomes.length > 1 ? 'estão' : 'está') + ' entre os perfis '
            + 'responsáveis por <b>' + esc(t.nome) + '</b>'
            + (lista ? ' (' + esc(lista) + ')' : '') + '.</div>'
            + '<p class="nota">A tarefa vai para a agenda dele, mas quando ele entrar pode não '
            + 'achar botão para concluir — é exatamente o que aconteceu na OS-26038. '
            + 'Se for para ele fazer mesmo, o caminho certo é '
            + '<b>Configurações › Tarefas por perfil</b>, que muda a regra para valer.</p>',
            [{ label:'Voltar', onClick: () => { fecharModal(); modalDesignar(card, t, aposGravar); } },
             { label:'Designar assim mesmo', pri:true,
               onClick: () => gravarDesignacao(card, t, quem, aposGravar) }]);
          return;
        }
        await gravarDesignacao(card, t, quem, aposGravar);
     }}]);
  mdEsconderDonoDoApoio();
}

/** S36: o dono não aparece na lista de apoio — ele não é apoio de si mesmo.
 *  Chamado logo depois de abrir o modal, e a cada troca de "Quem faz". */
function mdEsconderDonoDoApoio(){
  const sel = document.getElementById('mdU'), lista = document.getElementById('mdApLista');
  if (!sel || !lista) return;
  const aplica = () => lista.querySelectorAll('.apoioOpc').forEach(l => {
    const dono = l.dataset.u === sel.value;
    l.hidden = dono;
    if (dono){ const c = l.querySelector('input'); if (c) c.checked = false; }
  });
  sel.addEventListener('change', aplica);
  aplica();
}

/** O que grava, separado do formulário porque a confirmação do aviso reentra
 *  por aqui depois de fechar o modal. */
async function gravarDesignacao(card, t, quem, aposGravar){
  try{
    const m   = (document.getElementById('mdM') || {}).value;
    const dia = (document.getElementById('mdD') || {}).value || null;
    // ⚠ Até o S21 a tela recusava "dono sem dia" aqui, porque o banco
    //    recusava. A regra caiu no S22: dono sem dia continua na vista
    //    "Sem dia", com o nome. O que segue proibido é DIA SEM DONO —
    //    esse sim some das três listas, e quem recusa é o banco.
    if (DEMO) throw new Error('Modo demonstração: designação não é gravada.');
    await rpc('tf_designar_tarefa', {
      p_os_id: card.os_id, p_tarefa_id: t.tarefa_id,
      p_usuario: quem, p_data: dia, p_minutos: m ? Number(m) : null });
    // S36 · item 7: os apoios vêm DEPOIS do dono (o banco recusa apoio sem
    // dono). Sem dono, o próprio banco já limpou os apoios — nada a mandar.
    let msgAp = '';
    const novos = t._apoiosNovos;
    if (quem && Array.isArray(novos)){
      const antes = (t.apoios || []).map(String).filter(v => v !== quem).sort().join(',');
      if (novos.slice().sort().join(',') !== antes){
        const r = await rpc('tf_definir_apoios', { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id,
                                                   p_usuarios: novos });
        msgAp = r && r.nomes ? ' Apoio: ' + r.nomes + '.' : ' Sem apoio.';
      }
    } else if (!quem && (t.apoios || []).length) msgAp = ' O apoio saiu junto.';
    fecharModal(); toast('Designação gravada.' + msgAp,'ok');
    if (aposGravar) await aposGravar();
    else await abrirOSPorId(card.os_id);
  }catch(e){ toast(e.message,'err'); }
}

const arquivoParaBase64 = f => new Promise((ok, err) => {
  const r = new FileReader();
  r.onerror = () => err(new Error('Não consegui ler o arquivo.'));
  r.onload  = () => ok(r.result);
  r.readAsDataURL(f);
});

/**
 * Sobe para o Drive e registra o anexo. Sem cabeçalho customizado de propósito:
 * é o que evita o preflight OPTIONS, que o Apps Script não responde.
 */
async function subirArquivo(dataUrl, meta){
  if (DEMO){ demoAnexo(meta.os_id, meta.categoria, meta.nome);
             return { url:'https://drive.google.com/demo', file_id:'demo' }; }
  if (!driveLigado())
    throw Object.assign(new Error('O Google Drive ainda não foi configurado — veja o Passo 8 do guia.'),
                        { negocio:true });

  const r = await fetch(PARAM.drive_url, {
    method:'POST', redirect:'follow', signal: sinal(true),
    body: JSON.stringify({
      chave: PARAM.drive_chave, token: sessao.token,
      client_uid: meta.client_uid, cliente: meta.cliente, os_numero: meta.os_numero,
      categoria: meta.categoria, nome: meta.nome,
      mime: meta.mime || 'application/octet-stream', base64: dataUrl
    })
  });
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('O serviço de arquivos não respondeu como esperado.');
  if (j.status !== 'ok')
    throw Object.assign(new Error(j.mensagem || 'Falha ao gravar no Drive'),
                        { negocio: j.codigo === 'CHAVE' || j.codigo === 'TOKEN' });

  await rpc('tf_registrar_anexo', {
    p_os_id: meta.os_id, p_categoria: meta.categoria, p_nome: meta.nome,
    p_client_uid: meta.client_uid, p_drive_file_id: j.file_id, p_drive_url: j.url,
    p_mime: meta.mime, p_bytes: j.bytes || null
  });
  return j;
}

// ── jsPDF sob demanda ───────────────────────────────────────────────────────
// Carregado só quando alguém clica em "gerar PDF". Deixar no <head> custaria
// ~350 KB de download e parse em toda abertura do app, para uma função que a
// maioria das sessões nem usa.
let _jspdf = null;
function carregarJsPDF(){
  if (_jspdf) return _jspdf;
  _jspdf = new Promise((ok, err) => {
    if (window.jspdf && window.jspdf.jsPDF) return ok(window.jspdf.jsPDF);
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s2.onload  = () => (window.jspdf && window.jspdf.jsPDF)
      ? ok(window.jspdf.jsPDF)
      : err(new Error('A biblioteca de PDF carregou, mas não inicializou.'));
    s2.onerror = () => err(new Error('Não consegui baixar a biblioteca de PDF. Sem internet?'));
    document.head.appendChild(s2);
  });
  return _jspdf;
}

/* `new Date('2026-09-04')` é meia-noite UTC; em Brasília isso é 03/09 às 21h, e
   a data saía um dia atrás no PDF, na planilha e na tela. Data pura ganha meio-dia
   antes de virar Date; timestamp com hora passa direto. */
const dataBR = d => {
  if (!d) return new Date().toLocaleDateString('pt-BR');
  const t = String(d);
  return new Date(/^\d{4}-\d{2}-\d{2}$/.test(t) ? t + 'T12:00' : t).toLocaleDateString('pt-BR');
};
/* E o contrário: "hoje" em ISO. `toISOString()` depois das 21h já virou o dia
   seguinte, e o período do relatório terminava amanhã.
   ⚠ S26: seis lugares ainda montavam "hoje" com `toISOString()` — entre eles o
   PADRÃO dos campos "Quando" do registro de envio e da resposta do cliente.
   Como a tela sempre manda a data, era ESTE padrão, e não o `current_date` do
   banco, que gravava amanhã depois das 21h. Data de hoje é `isoHoje()`. */
/* ── S34 · item 2: OS QUATRO SERVIÇOS DO NR-13 ──────────────────────────────
   Uma lista só, usada pela ficha do cliente e pela montagem da proposta. Duas
   listas seriam dois rótulos para o mesmo serviço no dia em que alguém
   mudasse um deles — e é o rótulo que vai para dentro da proposta do cliente. */
const SERVICOS_NR13 = [
  { chave:'interna',   campo:'venc_insp_interna',    nome:'Inspeção Interna',        curto:'Int.'  },
  { chave:'externa',   campo:'venc_insp_externa',    nome:'Inspeção Externa',        curto:'Ext.'  },
  { chave:'manometro', campo:'venc_calib_manometro', nome:'Calibração de Manômetro', curto:'Man.'  },
  { chave:'valvula',   campo:'venc_calib_valvula',   nome:'Calibração de Válvula',   curto:'Válv.' }
];
/* S38 · os três começos de linha de inspeção que o papel soma como "Inspeções"
   (ver `tf__grupo_servico_nr13` no 58_). Mudar aqui é mudar lá também. */
const INSP_INT = 'Inspeção Interna — ', INSP_EXT = 'Inspeção Externa — ',
      INSP_AMB = 'Inspeção Interna e Externa — ';
/** Vencido = a data já passou, medida contra o HOJE DE BRASÍLIA (`isoHoje`).
    Comparação de texto ISO, que é o que evita fuso na conta. */
const vencido = d => !!d && String(d).slice(0,10) <= isoHoje();

const isoHoje = (d) => { const x = d || new Date();
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0')
       + '-' + String(x.getDate()).padStart(2,'0'); };

/**
 * Gera o PDF da OS.
 *   tipo 'levantamento' → sem valores. É o que se mostra ao cliente e à planta.
 *   tipo 'resumo'       → com custo, preço e margem. USO INTERNO.
 * A separação é deliberada: proposta ao cliente leva valor fechado; o cálculo
 * fica em documento interno.
 */
async function gerarPDF(tipo, card, itens){
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const interno = (tipo === 'resumo');
  const M = 15;
  let y = M;

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('ENGETAP ENGENHARIA', M, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text(interno ? 'Resumo da ordem de serviço — uso interno'
                   : 'Levantamento de acessórios · NR-13', M, y); y += 8;
  doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 7;

  doc.setFontSize(10);
  const linha = (k, v) => { doc.setFont('helvetica','bold'); doc.text(k, M, y);
    doc.setFont('helvetica','normal'); doc.text(String(v||'—'), M+32, y); y += 5.5; };
  linha('OS:', card.numero);
  linha('Cliente:', card.cliente);
  linha('Etapa:', rotuloCol(card));
  linha('Emitido em:', dataBR());
  y += 4;

  const elegiveis = itens.filter(i => i.elegivel);
  const cols = interno
    ? [{t:'Item',x:M,w:76},{t:'Qtd',x:M+78,w:10,r:1},{t:'Custo un.',x:M+96,w:20,r:1},
       {t:'Preço un.',x:M+124,w:20,r:1},{t:'Total',x:M+152,w:22,r:1}]
    : [{t:'Item',x:M,w:112},{t:'Qtd',x:M+118,w:12,r:1},{t:'Calibração',x:M+140,w:24},
       {t:'Lacre',x:M+166,w:14}];

  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  cols.forEach(c => doc.text(c.t, c.r ? c.x + c.w : c.x, y, c.r ? {align:'right'} : undefined));
  y += 2; doc.setDrawColor(210); doc.line(M, y, 210-M, y); y += 4.5;

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  (interno ? elegiveis : itens).forEach(it => {
    if (y > 265){ doc.addPage(); y = M; }
    // até duas linhas: cortar a descrição do acessório em uma linha esconde
    // justamente a parte que identifica a peça (escala, bitola, rosca)
    const nome = doc.splitTextToSize(String(it.descricao||''), cols[0].w).slice(0, 2);
    doc.text(nome, cols[0].x, y);
    doc.text(String(Number(it.quantidade)), cols[1].x + cols[1].w, y, {align:'right'});
    if (interno){
      doc.text(BRL(it.custo_unitario||0), cols[2].x + cols[2].w, y, {align:'right'});
      doc.text(BRL(it.preco_unitario||0), cols[3].x + cols[3].w, y, {align:'right'});
      doc.text(BRL(it.total_venda||0),    cols[4].x + cols[4].w, y, {align:'right'});
    } else {
      doc.text(it.requer_calibracao ? 'sim' : '—', cols[2].x, y);
      doc.text(it.requer_lacre ? 'sim' : '—', cols[3].x, y);
      if (!it.elegivel){ doc.setFontSize(7.5); doc.setTextColor(120);
        doc.text('instalado em campo', cols[0].x + 2, y + 3.4 + (nome.length-1)*4.2);
        doc.setFontSize(9); doc.setTextColor(0); y += 3.4; }
    }
    y += 5.4 + (nome.length - 1) * 4.2;
  });

  y += 2; doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 6;

  if (interno){
    const c = elegiveis.reduce((a,i)=>a+Number(i.total_custo||0),0);
    const v = elegiveis.reduce((a,i)=>a+Number(i.total_venda||0),0);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Custo total:', M, y);  doc.text(BRL(c), M+60, y, {align:'right'}); y += 5.5;
    doc.text('Venda total:', M, y);  doc.text(BRL(v), M+60, y, {align:'right'}); y += 5.5;
    doc.text('Margem:', M, y);       doc.text(BRL(v-c) + (v>0 ? '   ('+Math.round((v-c)/v*100)+'%)' : ''),
                                              M+60, y, {align:'right'}); y += 9;
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('Documento interno — não enviar ao cliente.', M, y);
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Total de itens levantados: ' + itens.length, M, y); y += 14;
    doc.setDrawColor(140);
    doc.line(M, y, M+70, y); doc.line(120, y, 195, y); y += 4.5;
    doc.setFontSize(8); doc.setTextColor(110);
    doc.text('Inspetor Engetap', M, y);
    doc.text('Responsável pela planta', 120, y);
  }

  const nome = (interno ? 'resumo-' : 'levantamento-') + card.numero + '.pdf';
  return { blob: doc.output('datauristring'), nome };
}

// ════════════════════════════════════════════════════════════════════════════
// ABA ITENS — a tela de trabalho do Vinícius e do Glênio
// ----------------------------------------------------------------------------
// Digitar custo aqui é o que faz o gateway de agregação andar. Por isso, depois
// de cada gravação, o quadro é relido: se aquele foi o último item que faltava,
// o card muda de coluna na frente de quem digitou.
// ════════════════════════════════════════════════════════════════════════════
const BRL = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

/* ── S34 · item 5: campo de dinheiro ────────────────────────────────────────
   O valor VAI para o campo sem o "R$", porque o "R$" é o prefixo ao lado —
   `BRL(v)` inteiro ali dentro daria "R$ R$ 1.190,00". Quem lê de volta é o
   `_numBR`, que já trata ponto de milhar e vírgula decimal. */
const _dinBR = v => (v == null || v === '') ? ''
  : Number(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });

function campoDinheiro(id, rotulo, valor){
  return '<div class="campo"><label for="' + id + '">' + esc(rotulo) + '</label>'
    + '<div class="descGInp"><span>R$</span>'
    + '<input id="' + id + '" type="text" inputmode="decimal" autocomplete="off" '
    +   'name="' + id + '_nofill" data-lpignore="true" data-1p-ignore '
    +   'placeholder="0,00" value="' + esc(_dinBR(valor == null ? null : valor)) + '"></div></div>';
}

/** Deixa o campo bonito quando a pessoa sai dele, e devolve o número.
    Valor impossível NÃO vira silêncio: `Number(NaN)` viraria `null` no JSON e
    apagaria o preço sem ninguém ver. */
function ligarCampoDinheiro(id){
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('blur', () => {
    const n = _numBR(el.value);
    if (n === null){ el.value = ''; return; }
    if (!isFinite(n)){ el.classList.add('ruim'); return; }
    el.classList.remove('ruim');
    el.value = _dinBR(n);
  });
}
function lerCampoDinheiro(id, rotulo){
  const el = document.getElementById(id);
  const n = _numBR(el.value);
  if (n === null) return null;
  if (!isFinite(n)) throw new Error(rotulo + ': "' + el.value + '" não é um valor. Use 1.190,00.');
  if (n < 0) throw new Error(rotulo + ' não pode ser negativo.');
  return n;
}

/** Tirar (ou devolver) um item da OS — S29. */
function modalTirarItem(it, depois){
  const tirar = !!it.elegivel;
  abrirModal(tirar ? 'Tirar "' + it.descricao + '" da OS' : 'Devolver "' + it.descricao + '" à OS',
    tirar
      ? '<p class="nota" style="margin-top:0">Use quando o cliente não quer este item. Ele deixa de entrar '
        + 'na proposta, no pedido de compra e nos totais da OS, e continua na lista, esmaecido, com o motivo.</p>'
        + '<p class="nota"><b>Depois de tirar</b>, gere a revisão da proposta na aba <b>Proposta</b>: '
        + 'ela sai só com o que ficou, e o cliente aprova essa inteira.</p>'
        + '<div class="campo"><label for="tiM">Por que sai?</label>'
        + '<input id="tiM" type="text" maxlength="200" autocomplete="off" name="tim_nofill" '
        + 'placeholder="ex.: cliente não quis o purgador"></div>'
        + '<div class="dica" id="tiMsg" style="color:var(--crit)"></div>'
      : '<p class="nota" style="margin-top:0">O item volta para a OS e entra de novo na próxima proposta.</p>'
        + (it.retirado_motivo ? '<p class="nota">Tinha saído por: <b>' + esc(it.retirado_motivo) + '</b></p>' : '')
        + '<p class="nota">Confira custo e preço dele na lista — etapa que já andou sem ele não volta sozinha.</p>'
        + '<div class="dica" id="tiMsg" style="color:var(--crit)"></div>',
    [{ label:'Voltar', onClick: () => fecharModal() },
     { label: tirar ? 'Tirar da OS' : 'Devolver à OS', pri:true, onClick: async () => {
        const msg = document.getElementById('tiMsg');
        const motivo = tirar ? document.getElementById('tiM').value.trim() : null;
        if (tirar && motivo.length < 3){ msg.textContent = 'Escreva por que o item sai.'; return; }
        try{
          await rpc('tf_tirar_item_os', { p_item_id: it.id, p_tirar: tirar, p_motivo: motivo });
          fecharModal();
          toast(tirar ? 'Item tirado da OS. Agora gere a revisão da proposta.' : 'Item devolvido à OS.', 'ok');
          if (depois) await depois();
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

async function pintarItens(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  document.getElementById('dAcoes').innerHTML = '';
  body.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando itens…</p>';

  let itens;
  try{
    itens = DEMO ? demoItens(card.os_id)
      : await get('os_itens?select=id,descricao,tipo_acessorio,quantidade,elegivel,fornecedor,'
        + 'custo_unitario,preco_unitario,desconto_pct,total_custo,total_venda,margem_valor,aprovado,'
        + 'requer_calibracao,recebido_em,certificado_num,calibrado_em,'
        + 'requer_lacre,lacre_num,origem,e_servico,retirado_em,retirado_motivo'
        + '&os_id=eq.' + card.os_id + '&order=ordem');
  }catch(e){ body.innerHTML=''; const p=document.createElement('p');
             p.style.color='var(--crit)'; p.textContent=e.message; body.appendChild(p); return; }

  if (!itens.length){
    body.innerHTML = '<div class="vazio" style="padding:40px 10px"><h3>Nenhum item ainda</h3>'
      + '<p>Os itens entram pelo TapFlow Field, quando o inspetor envia o levantamento.</p></div>';
    return;
  }

  // ── ORIGEM ────────────────────────────────────────────────────────────────
  // "De onde vem cada peça" é uma etapa do pipeline (T04B, gateway de agregação
  // do 17_origem.sql) e até o S23 ela NÃO TINHA TELA em lugar nenhum: nem aqui,
  // nem no Field, nem em Compras. A palavra "viatura" não existia em nenhum dos
  // três apps. Resultado: toda OS de fornecimento parava ali para sempre, porque
  // o gateway só fecha quando todo item tem origem — e metade do faturamento da
  // Engetap passa por esse fluxo. Achado operando o sistema, não lendo código.
  //
  // A resposta é do escritório (a tarefa é de admin/compras/tecnico_adm), e é
  // ela que decide se o item vira pedido de compra ou é instalado direto.
  const ORIGENS = [['viatura','Já está na viatura'], ['estoque','Estoque da Engetap'],
                   ['proper','Proper Compressores'], ['compra','Comprar'],
                   ['servico','Serviço']];

  // Perfil de campo VÊ a aba inteira, mas não grava: o RLS de `os_itens` é do
  // escritório, e a tela não oferece o que ele recusaria (S26, item 5).
  const soLeitura = !podeEscritorio();
  // ── ITEM 4 (S27): O DESCONTO PASSA A TER ONDE SER DIGITADO ──────────────
  // `os_itens.desconto_pct` existe desde o 01_schema, e `total_venda` já é
  // calculado com ele pelo banco — mas nenhuma tela oferecia o campo. Na
  // prática o desconto virava preço unitário baixado na marra, com o valor
  // negociado ocupando o lugar do preço de tabela: depois não havia como
  // saber quanto se deu de desconto, nem em qual item.
  //
  // O "desconto geral" NÃO é um valor guardado à parte: é um atalho que
  // preenche o percentual de todos os itens de uma vez. O campo por item
  // continua sendo a fonte única — duas fontes de verdade para a mesma conta
  // é como as duas discordam no fim do mês.
  body.innerHTML = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
    + '<th>Item</th><th>Qtd</th><th>De onde vem</th><th>Fornecedor</th>'
    + '<th>Custo un.</th><th>Preço un.</th><th>Desc. %</th><th>Margem</th>'
    + '</tr></thead><tbody></tbody></table></div>';
  const tb = body.querySelector('tbody');

  // ── O REFRESCO DEPOIS DE GRAVAR, EM UM LUGAR SÓ ───────────────────────
  // ⚠ Isto já esteve duplicado e a cópia esqueceu metade: a gravação de
  //   certificado atualizava o card mas NÃO relia `osAberta.tarefas`, então a
  //   aba Tarefas continuava mostrando a etapa velha, sem botão, como se a OS
  //   tivesse travado. É exatamente o defeito que o comentário abaixo conta,
  //   reintroduzido por cópia — por isso agora é uma função só.
  const refrescar = async () => {
    const colAntes = card.coluna;
    const tarAntes = card.tarefa_atual;
    await carregar({silencioso:true});
    const novo = cards.find(x => x.os_id === card.os_id);
    if (!novo) return;
    // ⚠ Preencher origem, custo, preço ou certificado fecha etapas DENTRO da
    //   mesma coluna (Orçamento tem seis). Até o S23 o card só era atualizado
    //   quando a COLUNA mudava — então a pessoa preenchia o último preço,
    //   três etapas fechavam, e a aba Tarefas continuava mostrando a anterior
    //   até fechar e reabrir a OS. O card se atualiza sempre; o aviso é que
    //   distingue "mudou de coluna" de "andou dentro dela".
    osAberta.card = novo;
    document.getElementById('dSub').textContent =
      rotuloCol(novo) + ' · ' + nomeQuadros(novo);
    if (novo.coluna !== colAntes)
      toast('Etapa concluída — o card foi para "' + rotuloCol(novo) + '".', 'ok');
    else if (novo.tarefa_atual !== tarAntes)
      toast('Etapa concluída — agora é "' + novo.tarefa_atual + '".', 'ok');
    if (novo.tarefa_atual !== tarAntes && !DEMO){
      // a lista de tarefas foi carregada quando a OS abriu; se uma etapa
      // fechou agora, ela está velha — e tarefa velha vem sem botão
      try{
        osAberta.tarefas = await get('pipeline_tarefas?select=tarefa_id,nome,tipo,fase,'
          + 'fase_ordem,ordem,status,opcoes,perfis_responsaveis,lock_por,executor,'
          + 'usuario_designado,data_prevista,tempo_estimado_min,acao_terminal,apoios'
          + '&os_id=eq.' + card.os_id + '&ativo=eq.SIM&order=camada,fase_ordem,ordem');
      }catch(e){}
    }
  };

  itens.forEach(it => {
    const tr = document.createElement('tr');
    if (!it.elegivel) tr.className = it.retirado_em ? 'fora retirado' : 'fora';
    tr.innerHTML = '<td class="d"></td><td class="num q"></td>'
      + '<td><select class="o">'
      +   '<option value="">— responder —</option>'
      +   ORIGENS.map(([v,r]) => '<option value="' + v + '">' + r + '</option>').join('')
      + '</select></td>'
      + '<td><input class="f" type="text" placeholder="—"></td>'
      + '<td><input class="c" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></td>'
      + '<td><input class="p" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></td>'
      + '<td><input class="dsc" style="width:62px;text-align:right" type="number" step="0.01" min="0" max="100" inputmode="decimal" placeholder="0"></td>'
      + '<td class="num m"></td>';
    tr.querySelector('.d').textContent = it.descricao;
    // ── "TIRAR DA OS" (S29) ────────────────────────────────────────────────
    // Sem "aprovou em parte", o que o cliente não quer sai por uma REVISÃO da
    // proposta — e a revisão do fornecimento é montada com os itens da OS.
    // Tirar aqui = `elegivel` falso (fora da proposta, do pedido e dos totais),
    // com motivo; só enquanto o cliente não respondeu pelo item. O que o
    // levantamento deixou de fora não se devolve por aqui.
    if (!soLeitura && !DEMO && it.aprovado == null && (it.elegivel || it.retirado_em)){
      const bt = document.createElement('button');
      bt.type = 'button'; bt.className = 'btn mini tirarItem';
      bt.textContent = it.elegivel ? 'tirar da OS' : 'devolver à OS';
      if (!it.elegivel && it.retirado_motivo) bt.title = 'Tirado: ' + it.retirado_motivo;
      bt.addEventListener('click', () => modalTirarItem(it, async () => { await refrescar(); pintarItens(); }));
      tr.querySelector('.d').appendChild(document.createElement('br'));
      tr.querySelector('.d').appendChild(bt);
    }
    if (!it.elegivel && it.retirado_motivo){
      const m = document.createElement('div'); m.className = 'nota motivoRet';
      m.textContent = 'Tirado da OS: ' + it.retirado_motivo;
      tr.querySelector('.d').appendChild(m);
    }
    tr.querySelector('.q').textContent = Number(it.quantidade);
    const oi = tr.querySelector('.o');
    const fi = tr.querySelector('.f'), ci = tr.querySelector('.c'), pi = tr.querySelector('.p');
    oi.value = it.origem || '';
    // serviço não é peça: a origem dele é decidida pelo banco e não se edita
    if (it.e_servico) oi.disabled = true;
    if (it.elegivel && !it.origem && !it.e_servico) oi.classList.add('falta');
    fi.value = it.fornecedor || '';
    ci.value = it.custo_unitario != null ? it.custo_unitario : '';
    pi.value = it.preco_unitario != null ? it.preco_unitario : '';
    const di = tr.querySelector('.dsc');
    di.value = Number(it.desconto_pct) ? it.desconto_pct : '';
    if (it.elegivel && !(Number(it.custo_unitario) > 0)) ci.classList.add('falta');
    if (it.elegivel && !(Number(it.preco_unitario) > 0)) pi.classList.add('falta');
    tr.querySelector('.m').textContent = it.margem_valor != null ? BRL(it.margem_valor) : '—';
    if (!it.elegivel || soLeitura){ [oi,fi,ci,pi,di].forEach(x => x.disabled = true); }

    const grava = (campo, el, numerico) => el.addEventListener('change', async () => {
      const bruto = el.value.trim();
      const valor = numerico ? (bruto === '' ? null : Number(bruto)) : (bruto || null);
      if (numerico && bruto !== '' && !(valor >= 0)){ toast('Valor inválido.','err'); return; }
      el.disabled = true;
      try{
        if (DEMO) demoGravarItem(card.os_id, it.id, campo, valor);
        else await patch('os_itens', 'id=eq.' + it.id, { [campo]: valor });
        await refrescar();
        pintarItens();
      }catch(e){ toast(e.message,'err'); el.disabled = false; }
    });
    grava('origem', oi, false);
    grava('fornecedor', fi, false);
    grava('custo_unitario', ci, true);
    grava('preco_unitario', pi, true);
    // vazio = 0: o banco tem `not null default 0` com check de 0 a 100, e
    // mandar null daria erro de constraint na cara de quem apagou o campo
    di.addEventListener('change', async () => {
      const v = di.value.trim() === '' ? 0 : Number(di.value);
      if (!(v >= 0 && v <= 100)){ toast('O desconto vai de 0 a 100%.','err'); return; }
      di.disabled = true;
      try{
        if (DEMO) demoGravarItem(card.os_id, it.id, 'desconto_pct', v);
        else await patch('os_itens', 'id=eq.' + it.id, { desconto_pct: v });
        await refrescar(); pintarItens();
      }catch(e){ toast(e.message,'err'); di.disabled = false; }
    });
    tb.appendChild(tr);
  });

  const el = itens.filter(i => i.elegivel);
  const somaC = el.reduce((s,i)=>s+Number(i.total_custo||0),0);
  const somaV = el.reduce((s,i)=>s+Number(i.total_venda||0),0);
  const somaM = somaV - somaC;
  const t = document.createElement('div'); t.className = 'totais';
  t.innerHTML = '<div><div class="k">Custo</div><div class="v"></div></div>'
              + '<div><div class="k">Venda</div><div class="v"></div></div>'
              + '<div><div class="k">Margem</div><div class="v ' + (somaM>=0?'pos':'neg') + '"></div></div>';
  t.querySelectorAll('.v')[0].textContent = BRL(somaC);
  t.querySelectorAll('.v')[1].textContent = BRL(somaV);
  t.querySelectorAll('.v')[2].textContent = BRL(somaM) + (somaV>0 ? '  ·  ' + Math.round(somaM/somaV*100) + '%' : '');
  body.appendChild(t);

  // ── ITEM 4 · o desconto geral, que é o caso comum ───────────────────────
  // "3% pedidos, 3% concedidos" é um número só, sobre tudo. Digitá-lo item a
  // item é onde se esquece uma linha e o total sai errado. O ajuste fino
  // continua existindo: depois de aplicado, cada item ainda se edita.
  if (el.length && !soLeitura){
    // S28: o mesmo bloco do negócio (item 3) — %, R$ ou valor final
    const dg = document.createElement('div');
    dg.style.marginTop = '14px';
    body.appendChild(dg);
    montarDescontoGeral(dg, {
      id: 'dgOs',
      linhas: () => el.map(i => ({ preco: Number(i.preco_unitario) || 0,
                                   qtd: Number(i.quantidade) || 0,
                                   desc: Number(i.desconto_pct) || 0 })),
      // S31: chega um percentual POR LINHA (null nas que ficam de fora). O
      // desconto geral parte do total atual e cada linha encolhe na mesma
      // proporção — quem já tinha desconto próprio continua com mais.
      aplicar: async (pcts) => {
        try{
          let n = 0;
          for (let k = 0; k < el.length; k++){
            const p = pcts[k];
            if (p === null || p === undefined) continue;
            const i = el[k];
            if (DEMO) demoGravarItem(card.os_id, i.id, 'desconto_pct', p);
            else await patch('os_itens', 'id=eq.' + i.id, { desconto_pct: p });
            n++;
          }
          await refrescar();
          toast(n + ' item(ns) com o desconto gravado.', 'ok');
          pintarItens();
        }catch(e){ toast(e.message,'err'); }
      }
    });
  }

  // Atalho do caso comum: numa OS de fornecimento a maioria das peças é para
  // comprar. Responder quatro selects um a um para depois cotar é atrito que a
  // etapa não precisa ter — e é atrito que faz o campo parar de responder.
  const semOrigem = el.filter(i => !i.origem && !i.e_servico);
  if (semOrigem.length > 1 && !DEMO && !soLeitura){
    const bo = document.createElement('button');
    bo.className = 'btn'; bo.type = 'button';
    bo.style.cssText = 'width:100%;margin-top:12px';
    bo.textContent = 'Marcar as ' + semOrigem.length + ' peças sem resposta como "Comprar"';
    bo.addEventListener('click', function(){
      _semDuploEnvio_(this, async () => {
        try{
          for (const i of semOrigem)
            await patch('os_itens', 'id=eq.' + i.id, { origem: 'compra' });
          const colAntes = card.coluna;
          await carregar({silencioso:true});
          const novo = cards.find(x => x.os_id === card.os_id);
          if (novo){ osAberta.card = novo;
            toast(novo.coluna !== colAntes
              ? 'Etapa concluída — o card foi para "' + rotuloCol(novo) + '".'
              : 'Origem definida.', 'ok'); }
          pintarItens();
        }catch(e){ toast(e.message,'err'); }
      });
    });
    body.appendChild(bo);
  }

  // ── CERTIFICADO E LACRE, EM SEÇÃO PRÓPRIA ─────────────────────────────────
  // A T13 ("Calibrar e lacrar") é agregação sobre `certificado_num`, e até o
  // S24 o ÚNICO lugar do sistema que gravava essa coluna era o app de campo —
  // numa tarefa cujo executor é `adm`, ou seja, que o campo nem enxerga. A OS
  // de fornecimento morria aqui, uma etapa depois de "Receber material".
  //
  // ⚠ A primeira versão disto eram duas COLUNAS na tabela acima. Com nove
  //   colunas, elas nasciam fora da largura da gaveta: existiam, roláveis, e
  //   ninguém veria. Campo que só aparece se a pessoa rolar para o lado é o
  //   mesmo que campo nenhum — e foi assim que a etapa ia continuar "travada".
  //   Vira seção própria, embaixo, listando SÓ quem exige.
  //
  // A seção só cobra o que o cliente aprovou: item recusado não vai ser
  // instalado, e pedir certificado dele prenderia a OS por nada.
  const apr = el.filter(i => i.aprovado === true);
  const exigem = apr.filter(i => i.requer_calibracao || i.requer_lacre);
  const faltaC = apr.filter(i => i.requer_calibracao && !i.certificado_num).length;
  const faltaL = apr.filter(i => i.requer_lacre && !i.lacre_num).length;

  if (exigem.length){
    const cx = document.createElement('div');
    cx.style.cssText = 'margin-top:20px;border-top:1px solid var(--rule);padding-top:14px';
    cx.innerHTML = '<div class="secTit" style="margin:0 0 4px">Certificado e lacre</div>'
      + '<p class="nota" style="margin:0 0 10px">O escritório lança aqui o número do '
      + 'certificado de calibração e o do lacre. É isto que fecha a etapa '
      + '<b>Calibrar e lacrar</b>. Deixar o campo vazio apaga o número — é assim que '
      + 'se corrige um dígito errado.</p>';
    exigem.forEach(it => {
      const l = document.createElement('div');
      l.className = 'linhaCal';
      l.innerHTML = '<div><b></b><small></small></div>'
        + (it.requer_calibracao
            ? '<label>Nº do certificado<input class="cert" type="text" maxlength="40" placeholder="como está no certificado"></label>'
            : '<span class="nao">não exige calibração</span>')
        + (it.requer_lacre
            ? '<label>Nº do lacre<input class="lac" type="text" maxlength="40" placeholder="—"></label>'
            : '<span class="nao">não exige lacre</span>');
      l.querySelector('b').textContent = it.descricao;
      l.querySelector('small').textContent = 'Qtd ' + Number(it.quantidade)
        + (it.calibrado_em
            ? ' · calibrado em ' + new Date(it.calibrado_em + 'T12:00').toLocaleDateString('pt-BR')
            : '');
      const cei = l.querySelector('.cert'), lai = l.querySelector('.lac');
      if (soLeitura) [cei, lai].forEach(x => { if (x) x.disabled = true; });
      if (cei){ cei.value = it.certificado_num || '';
                if (!it.certificado_num) cei.classList.add('falta'); }
      if (lai){ lai.value = it.lacre_num || '';
                if (!it.lacre_num) lai.classList.add('falta'); }

      // Certificado e lacre NÃO são `patch` direto como os campos da tabela:
      // passam por `tf_registrar_calibracao`, que carimba a data, registra no
      // histórico e RECUSA número em peça que não exige. Certificado é o papel
      // que o cliente mostra na fiscalização — não é campo de anotação.
      const gravaCal = (elc, chave) => elc && elc.addEventListener('change', async () => {
        const v = elc.value.trim();
        elc.disabled = true;
        try{
          if (DEMO) throw new Error('Modo demonstração: calibração não é gravada.');
          await rpc('tf_registrar_calibracao', { p_os_item_id: it.id, [chave]: v });
          await refrescar();
          pintarItens();
        }catch(e){ toast(e.message,'err'); elc.disabled = false; }
      });
      gravaCal(cei, 'p_certificado');
      gravaCal(lai, 'p_lacre');
      cx.appendChild(l);
    });
    body.appendChild(cx);
  }

  const falta = el.filter(i => !(Number(i.custo_unitario)>0)).length;
  const faltaP = el.filter(i => !(Number(i.preco_unitario)>0)).length;
  const faltaO = semOrigem.length;
  const n = document.createElement('p');
  n.style.cssText = 'font-size:12.5px;color:var(--ink-3);margin:12px 0 0;line-height:1.5';
  n.textContent = faltaO ? faltaO + ' item(ns) sem responder de onde vêm — é esta resposta que '
      + 'decide se a peça vira pedido de compra, e a etapa só fecha no último.'
    : falta ? falta + ' item(ns) ainda sem custo — a etapa de cotação só fecha no último.'
    : faltaP ? faltaP + ' item(ns) sem preço de venda — a etapa de precificação fecha quando todos tiverem.'
    : faltaC ? faltaC + ' item(ns) aprovado(s) ainda sem número de certificado — '
             + 'a etapa "Calibrar e lacrar" fecha quando todos tiverem.'
    : faltaL ? faltaL + ' item(ns) aprovado(s) ainda sem número de lacre.'
    : 'Todos os itens elegíveis têm origem, custo e preço.';
  body.appendChild(n);
  if (soLeitura) avisoSoLeitura(body);
}

// ════════════════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════════════════
// GERADOR DE PROPOSTA — o motor .docx dentro do TapFlow
// ----------------------------------------------------------------------------
// Portado do gerador que você já usava, com duas mudanças que só fazem sentido
// aqui dentro:
//
//  1. Os DADOS DO CLIENTE não são digitados: vêm da OS. Era o passo em que
//     mais se erra — proposta com o endereço do cliente anterior.
//  2. A TABELA DE ITENS pode ser reescrita com os itens da OS, e não só
//     editada linha a linha. O modelo vem com os itens da última proposta que
//     alguém salvou; hoje isso é apagado à mão toda vez.
//
// O motor continua o mesmo por dentro: substitui «Chave» dentro do XML do
// .docx, achata os campos de mala direta do Word e reescreve a tabela de
// 5 colunas. Nada sai do navegador — o arquivo é montado aqui e baixado.
// ════════════════════════════════════════════════════════════════════════════

let _jszip = null;
function carregarJSZip(){
  if (_jszip) return _jszip;
  _jszip = new Promise((ok, err) => {
    if (window.JSZip) return ok(window.JSZip);
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s2.onload  = () => window.JSZip ? ok(window.JSZip)
      : err(new Error('A biblioteca de .docx carregou, mas não inicializou.'));
    s2.onerror = () => err(new Error('Não consegui baixar a biblioteca de .docx. Sem internet?'));
    document.head.appendChild(s2);
  });
  return _jszip;
}

// ── o modelo vem do Storage, e fica na memória ──────────────────────────────
// 450 KB por modelo. Baixar de novo a cada geração seria desperdício óbvio
// para quem emite três propostas seguidas do mesmo tipo.
const _modelosCache = {};
/** Quantos cabeçalhos deste modelo trazem logomarca de cliente. */
async function logoDeClienteNoModelo(bytes){
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(bytes);
  let n = 0;
  for (const nome of Object.keys(zip.files)){
    if (!/^word\/header\d*\.xml$/.test(nome)) continue;
    const t = await zip.file(nome).async('string');
    if ((t.match(/r:embed="/g) || []).length >= 2) n++;
  }
  return n;
}

async function baixarModelo(path){
  if (_modelosCache[path]) return _modelosCache[path];
  const url = SUPABASE_URL + '/storage/v1/object/modelos/' + encodeURIComponent(path);
  const pega = async () => fetch(url, { headers: Object.assign(
    { apikey: SUPABASE_ANON_KEY },
    sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {}) });
  let r = await pega();
  if (r.status === 401 && sessao.refresh && await renovarToken()) r = await pega();
  if (r.status === 400 || r.status === 404)
    throw new Error('O modelo "' + path + '" não está no bucket `modelos`. '
      + 'Suba o arquivo pelo painel do Supabase (Storage → modelos).');
  if (r.status === 403)
    throw new Error('Sem permissão para ler o bucket `modelos`. '
      + 'Falta a política de leitura — veja o fim do 23_gerador_modelos.sql.');
  if (!r.ok) throw new Error('Não consegui baixar o modelo (HTTP ' + r.status + ').');
  const b = await r.arrayBuffer();
  _modelosCache[path] = b;
  return b;
}

// ── utilidades do XML do Word ───────────────────────────────────────────────
const _xmlEsc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const _semAcento = s => String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();

function _tags(xml, tag){
  return xml.match(new RegExp('<' + tag + '(?:\\s[^>]*)?>[\\s\\S]*?<\\/' + tag + '>','g')) || [];
}
function _textoCelula(tc){
  return [...tc.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(m => m[1]).join('').trim();
}
/** Escreve no PRIMEIRO <w:t> da célula e esvazia os outros — assim o texto
 *  novo herda a formatação do primeiro trecho e não sobra resto do antigo. */
function _escreveCelula(tc, txt){
  let n = 0;
  const nova = tc.replace(/(<w:t[^>]*>)([^<]*)(<\/w:t>)/g, (m,a,b,c) => {
    n++; return n === 1 ? a + _xmlEsc(txt) + c : a + c;
  });
  // célula sem nenhum <w:t> (parágrafo vazio): não dá para escrever, devolve como está
  return n ? nova : tc;
}

/**
 * Acha a tabela de itens: 5 colunas, com "Valor Unit..." e "Valor Total" no
 * cabeçalho. É o mesmo reconhecimento do gerador antigo — os modelos 24, 29 e
 * 30 têm; os outros não, e isso está registrado em `modelos_proposta.tem_tabela`.
 */
function acharTabelaItens(xml){
  for (const tbl of _tags(xml,'w:tbl')){
    const linhas = _tags(tbl,'w:tr');
    if (linhas.length < 2) continue;
    const cabec = _tags(linhas[0],'w:tc').map(_textoCelula);
    const n = cabec.map(_semAcento);
    if (cabec.length === 5
        && n.some(h => h.includes('valor unit'))
        && n.some(h => h.includes('valor') && h.includes('total'))){
      const dados = linhas.slice(1);
      let linhaTotal = null, linhasItem = dados;
      if (dados.length && _tags(dados[dados.length-1],'w:tc').length < 5){
        linhaTotal = dados[dados.length-1];
        linhasItem = dados.slice(0,-1);
      }
      if (!linhasItem.length) continue;
      return {
        tabela: tbl,
        antes: tbl.slice(0, tbl.indexOf(linhas[0])),
        cabecalho: linhas[0],
        molde: linhasItem[0],          // a fôrma para as linhas novas
        linhasItem, linhaTotal,
        itens: linhasItem.map(tr => {
          const cs = _tags(tr,'w:tc');
          return { seq:_textoCelula(cs[0]), descricao:_textoCelula(cs[1]),
                   qtd:_textoCelula(cs[2]), unitario:_textoCelula(cs[3]),
                   total:_textoCelula(cs[4]) };
        })
      };
    }
  }
  return null;
}

// ── ITEM 3 (S29): OS TRÊS PLANOS ────────────────────────────────────────────
// O modelo 24 tem três tabelas iguais (7.1 Básico, 7.2 Padrão, 7.3 Premium) e
// `acharTabelaItens` parava na PRIMEIRA — o app preenchia justo o Básico, o
// plano que a Engetap não quer vender. Agora o motor acha TODAS e diz qual é
// qual. Híbrido, na ordem: o título logo acima da tabela ("Plano Básico"), o
// rodapé da própria tabela ("Total Geral · Plano Básico"), e só então a ordem
// no documento (1ª/2ª/3ª) quando são exatamente três. Casar pelo texto
// sobrevive a alguém reordenar as seções; a ordem sobrevive a alguém reescrever
// o título. Só há "modo planos" quando os TRÊS são reconhecidos; com uma tabela
// só (o modelo 30, o 29) o comportamento é o de sempre.
const _PLANOS_ID = ['basico','padrao','premium'];
function _planoDoTexto(t){
  const n = _semAcento(t);
  if (/plano\s*basico/.test(n)) return 'basico';
  if (/plano\s*padrao/.test(n)) return 'padrao';
  if (/plano\s*premium/.test(n)) return 'premium';
  return null;
}
function acharTabelasItens(xml){
  const out = [];
  const re = /<w:tbl>[\s\S]*?<\/w:tbl>/g;
  let m;
  while ((m = re.exec(xml)) !== null){
    const t = acharTabelaItens(m[0]);
    if (!t) continue;
    // o último parágrafo com texto antes da tabela (até 6 mil caracteres atrás)
    const antes = xml.slice(Math.max(0, m.index - 6000), m.index);
    const ps = antes.match(/<w:p[ >][\s\S]*?<\/w:p>/g) || [];
    let titulo = '';
    for (let k = ps.length - 1; k >= 0; k--){
      const tx = [...ps[k].matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(x => x[1]).join('').trim();
      if (tx){ titulo = tx; break; }
    }
    const rod = t.linhaTotal ? [...t.linhaTotal.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(x => x[1]).join('') : '';
    t.inicio = m.index; t.fim = m.index + m[0].length;
    t.titulo = titulo;
    t.plano = _planoDoTexto(titulo) || _planoDoTexto(rod);
    out.push(t);
  }
  const ids = out.map(t => t.plano);
  if (out.length === 3 && !_PLANOS_ID.every(p => ids.includes(p)))
    out.forEach((t, k) => { t.plano = _PLANOS_ID[k]; t.pelaOrdem = true; });
  return out;
}
/** O modelo tem os três planos? (é o que decide mostrar a prévia) */
function modeloTemPlanos(tabelas){
  const ids = (tabelas || []).map(t => t.plano);
  return _PLANOS_ID.every(p => ids.filter(x => x === p).length === 1);
}
const _modelosPlanos = {};
async function planosNoModelo(path, bytes){
  if (path in _modelosPlanos) return _modelosPlanos[path];
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(bytes);
  const f = zip.file('word/document.xml');
  const xml = f ? await f.async('string') : '';
  return (_modelosPlanos[path] = modeloTemPlanos(acharTabelasItens(xml)));
}

/** A célula da linha do plano: o texto do plano (azul, no modelo), a faixa de
 *  itens (vermelha) e o trecho comum (preto, na linha de baixo). As cores são
 *  do MODELO: cada pedaço herda a formatação do trecho do Word que já tinha
 *  aquela cor. Se a célula não tiver algum dos três, usa a do Padrão. */
function _runsDaCelula(tc){
  return (tc.match(/<w:r[ >][\s\S]*?<\/w:r>/g) || []).filter(r => /<w:t[ >]/.test(r)).map(r => ({
    rPr: (r.match(/<w:rPr>[\s\S]*?<\/w:rPr>/) || [''])[0],
    cor: ((r.match(/<w:color w:val="([^"]+)"/) || [])[1] || '').toUpperCase(),
    txt: [...r.matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(x => x[1]).join('')
  }));
}
function _estiloPlano(tc){
  const rs = _runsDaCelula(tc);
  if (!rs.length) return null;
  const faixa = rs.find(r => /itens?\s*3\./i.test(r.txt)) || rs.find(r => r.cor === 'FF0000');
  const texto = rs.find(r => r !== faixa && r.cor && r.cor !== 'FF0000' && r.txt.trim()) || rs[0];
  const trecho = rs.find(r => /vasos/i.test(r.txt)) || null;
  const ps = tc.match(/<w:p[ >][\s\S]*?<\/w:p>/g) || [];
  const pPr = ps.length ? ((ps[0].match(/<w:pPr>[\s\S]*?<\/w:pPr>/) || [''])[0]) : '';
  const tcPr = (tc.match(/<w:tcPr>[\s\S]*?<\/w:tcPr>/) || [''])[0];
  return { texto: texto && texto.rPr, faixa: faixa && faixa.rPr, trecho: trecho && trecho.rPr, pPr, tcPr };
}
function _escreveCelulaPlano(tc, pecas, moldePadrao){
  const e = _estiloPlano(tc) || {};
  const m = moldePadrao || {};
  const rPrTexto  = e.texto  || m.texto  || '';
  const rPrFaixa  = e.faixa  || m.faixa  || rPrTexto;
  const rPrTrecho = e.trecho || m.trecho || rPrTexto.replace(/<w:color [^>]*\/>/, '');
  const pPr = e.pPr || m.pPr || '';
  const run = (rPr, t) => '<w:r>' + rPr + '<w:t xml:space="preserve">' + _xmlEsc(t) + '</w:t></w:r>';
  let corpo = '<w:p>' + pPr + run(rPrTexto, pecas.texto) + (pecas.faixa ? run(rPrFaixa, ' ' + pecas.faixa) : '') + '</w:p>';
  if (pecas.trecho) corpo += '<w:p>' + pPr + run(rPrTrecho, pecas.trecho) + '</w:p>';
  const tcPr = e.tcPr || '';
  return '<w:tc>' + tcPr + corpo + '</w:tc>';
}

/** Espelho de `tf__preco_plano` (51_): percentual sobre o unitário do Padrão,
 *  arredondado ao múltiplo de `arred` (meio sobe). A conta passa por centavos
 *  inteiros — 1000 × 1,085 em ponto flutuante dá 1084,9999… e arredondaria
 *  para baixo, discordando do banco. */
function precoPlano(unit, pct, arred){
  const cent = Math.round(Math.round(Number(unit) * 100) * (100 + Number(pct)) / 100);
  const a = Math.round(Number(arred || 0) * 100);
  return a > 0 ? Math.round(cent / a) * a / 100 : cent / 100;
}
const _brlDoc = v => BRL(v).replace(/ /g, ' ');

let PLANOS = null;
const PLANOS_DEMO = {
  basico_texto:'Todos os requisitos da NR-13 + acesso ao TapWeb + Documentação TapWeb', basico_faixa:'Itens 3.3 ao 3.10',
  padrao_texto:'Todos os requisitos da NR-13 + acesso ao TapWeb + Documentação TapWeb + Agenda + Acompanhamento', padrao_faixa:'Itens 3.3 ao 3.12',
  premium_texto:'Tudo do Plano Padrão + Localização + Treinamento NR-13 e TapWeb + Check-list de Compressores –', premium_faixa:'Itens 3.3 ao 3.16',
  trecho_comum:'(Vasos Cat. III, IV e V)', basico_pct:-9, premium_pct:34, arredondar:10 };
async function carregarPlanos(forcar){
  if (PLANOS && !forcar) return PLANOS;
  if (DEMO) return (PLANOS = Object.assign({}, PLANOS_DEMO));
  try{
    const r = await get('parametros_planos?select=*&id=eq.GLOBAL');
    PLANOS = (r && r[0]) || null;
  }catch(e){ PLANOS = null; }
  return PLANOS;
}
/** A descrição da linha do plano como ela vai para o banco (a do Padrão). */
const descricaoLinhaPlano = pl => [pl.padrao_texto, pl.padrao_faixa, pl.trecho_comum]
  .map(x => String(x || '').trim()).filter(Boolean).join(' ');
/** Qual linha é a do plano: a que começa com o texto do Padrão; senão, a 1ª. */
function linhaDoPlano(itens, pl){
  if (!pl || !itens || !itens.length) return 0;
  const alvo = norm(pl.padrao_texto).trim();
  const k = alvo ? itens.findIndex(i => norm(i.descricao).trim().startsWith(alvo)) : -1;
  return k >= 0 ? k : 0;
}
/** As três tabelas a partir dos itens do Padrão. Devolve null se faltar número. */
function montarPlanos(itens, idx, pl){
  if (!pl || !itens || !itens.length) return null;
  const base = itens[idx];
  if (!base || base.unitario_num == null || base.qtd_num == null) return null;
  const qtd = Number(base.qtd_num), unit = Number(base.unitario_num);
  const out = {};
  _PLANOS_ID.forEach(pid => {
    const pct = pid === 'basico' ? Number(pl.basico_pct) : pid === 'premium' ? Number(pl.premium_pct) : 0;
    const u = pid === 'padrao' ? unit : precoPlano(unit, pct, pl.arredondar);
    const tot1 = pid === 'padrao' ? Number(base.valor_total_num) : Math.round(u * qtd * 100) / 100;
    const linhas = itens.map((it, k) => k !== idx ? it : Object.assign({}, it, {
      descricao: [pl[pid + '_texto'], pl[pid + '_faixa'], pl.trecho_comum].filter(Boolean).join(' '),
      pecas: { texto: String(pl[pid + '_texto'] || ''), faixa: String(pl[pid + '_faixa'] || ''),
               trecho: String(pl.trecho_comum || '') },
      unitario: _brlDoc(u), total: _brlDoc(tot1), valor_total_num: tot1, unitario_num: u }));
    const total = Math.round(linhas.reduce((s, l) => s + (Number(l.valor_total_num) || 0), 0) * 100) / 100;
    out[pid] = { linhas, total, unit: u, pct };
  });
  return out;
}

/**
 * Reescreve a tabela com as linhas dadas — quantas forem. O gerador antigo só
 * conseguia editar as linhas que já existiam no modelo; aqui a primeira linha
 * vira fôrma e a tabela cresce ou encolhe conforme a OS.
 */
function reescreverTabela(t, linhas, totalTexto){
  const novas = linhas.map((it, i) => {
    // a linha do plano usa como fôrma a PRÓPRIA linha 1 do modelo (é ela que
    // tem as três cores); as outras, a fôrma de sempre
    let tr = it.pecas ? t.linhasItem[0] : t.molde;
    const cs = _tags(tr,'w:tc');
    const vals = [String(i+1), it.descricao, it.qtd, it.unitario, it.total];
    cs.forEach((c, idx) => {
      tr = tr.replace(c, idx === 1 && it.pecas
        ? _escreveCelulaPlano(c, it.pecas, t.moldePlano)
        : _escreveCelula(c, vals[idx]));
    });
    return tr;
  });
  let rodape = t.linhaTotal;
  if (rodape){
    const cs = _tags(rodape,'w:tc');
    const ult = cs[cs.length-1];
    rodape = rodape.replace(ult, _escreveCelula(ult, totalTexto));
  }
  return t.antes + t.cabecalho + novas.join('') + (rodape || '') + '</w:tbl>';
}

// ── A LOGOMARCA DO CLIENTE ANTERIOR ─────────────────────────────────────────
// Todo modelo .docx da Engetap guarda, no canto direito do cabeçalho, a
// logomarca do cliente para quem ele foi usado da última vez. Conferi os oito:
// tem CEFET-MG, Atlas, Sibelco, Setormec, PH e Servitec. Quem gera a proposta
// hoje precisa lembrar de apagar isso no Word — e uma proposta que sai com a
// marca de outro cliente é um constrangimento caro.
//
// O cabeçalho é [ logo Engetap | texto | logo do cliente ]. A logomarca do
// cliente é sempre a ÚLTIMA imagem do cabeçalho, e só existe quando o
// cabeçalho tem duas. Com uma só, é a da Engetap e não se toca em nada.

function contarImagensCabecalho(nome, xml){
  return (nome.startsWith('word/header') ? (xml.match(/r:embed="/g) || []).length : 0);
}

/** Tira a última imagem do cabeçalho, apagando o <w:r> inteiro que a contém. */
function removerLogoCliente(xml){
  const ult = xml.lastIndexOf('r:embed="');
  if (ult < 0) return xml;
  const ini = xml.lastIndexOf('<w:r ', ult) >= 0
    ? Math.max(xml.lastIndexOf('<w:r ', ult), xml.lastIndexOf('<w:r>', ult))
    : xml.lastIndexOf('<w:r>', ult);
  if (ini < 0) return xml;
  const fim = xml.indexOf('</w:r>', ult);
  if (fim < 0) return xml;
  return xml.slice(0, ini) + xml.slice(fim + 6);
}


// ── ITEM 5 (S28): A LOGOMARCA DO CLIENTE, NO LUGAR DA DO CLIENTE ANTERIOR ───
// Os oito modelos JÁ têm a célula da logo no cabeçalho — é a segunda imagem do
// cabeçalho de duas imagens (conferido arquivo por arquivo). O gerador tirava
// a logo antiga e deixava a célula em branco. Agora ele TROCA: a relação da
// imagem passa a apontar para um arquivo novo dentro do .docx, e o tamanho do
// desenho é refeito para caber na mesma caixa sem deformar (a caixa é do
// modelo; a proporção é da logo).
//
// A logo vem de `clientes_logo.original` — a versão de 600 px com fundo
// transparente que o cadastro guarda desde o S17 exatamente para isto. Até o
// S33 ela era QUADRADA (a logo centralizada, com sobra); desde o S34 sai
// rente. O recorte abaixo continua: ele é o que salva as logos antigas, e
// numa imagem já rente ele simplesmente não acha o que cortar.

/** Busca a logo do cliente e devolve PNG já recortado: {bytes, largura, altura}
 *  — ou null se o cliente não tem logo (ou se ela não abre). */
async function prepararLogoCliente(clienteId){
  if (!clienteId || DEMO) return null;
  let url = null;
  try{
    const r = await get('clientes_logo?select=original,thumb&cliente_id=eq.' + clienteId);
    url = r && r[0] ? (r[0].original || r[0].thumb) : null;
  }catch(e){ return null; }
  if (!url) return null;
  const img = await new Promise(ok => {
    const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = url;
  });
  if (!img) return null;
  const cv = document.createElement('canvas');
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const cx = cv.getContext('2d');
  cx.drawImage(img, 0, 0);
  const px = cx.getImageData(0, 0, cv.width, cv.height).data;
  // "vazio" = transparente, ou branco quase puro (a miniatura antiga é JPEG com fundo branco)
  const vazio = k => px[k+3] < 12 || (px[k] > 247 && px[k+1] > 247 && px[k+2] > 247);
  let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
  for (let y = 0; y < cv.height; y++){
    for (let x = 0; x < cv.width; x++){
      if (!vazio((y * cv.width + x) * 4)){
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return null;                               // imagem toda vazia
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(cv, x0, y0, w, h, 0, 0, w, h);
  const blob = await new Promise(ok => out.toBlob(ok, 'image/png'));
  if (!blob) return null;
  return { bytes: new Uint8Array(await blob.arrayBuffer()), largura: w, altura: h,
           dataUrl: out.toDataURL('image/png') };
}

/** Troca a ÚLTIMA imagem do cabeçalho pela logo. Mexe em três lugares: a
 *  relação da imagem (para onde ela aponta), o arquivo de mídia, e o tamanho
 *  do desenho dentro daquele <w:r>. Devolve o XML novo, ou null se não achou
 *  como trocar (aí quem chamou cai no "tirar", que é o comportamento antigo). */
async function trocarLogoCliente(zip, nomeHeader, xml, logo){
  const ult = xml.lastIndexOf('r:embed="');
  if (ult < 0) return null;
  const rid = xml.slice(ult + 9, xml.indexOf('"', ult + 9));
  const relNome = nomeHeader.replace(/^word\//, 'word/_rels/') + '.rels';
  const relF = zip.file(relNome);
  if (!relF) return null;
  let rels = await relF.async('string');
  const reRel = new RegExp('<Relationship\\b[^>]*\\bId="' + rid + '"[^>]*/>');
  const m = rels.match(reRel);
  if (!m) return null;
  const alvoMidia = 'media/tf_logo_cliente_' + nomeHeader.replace(/\D/g,'') + '.png';
  rels = rels.replace(m[0], m[0].replace(/Target="[^"]*"/, 'Target="' + alvoMidia + '"'));
  zip.file(relNome, rels);
  zip.file('word/' + alvoMidia, logo.bytes);

  // o <w:r> que contém a imagem — os mesmos limites do "tirar"
  const ini = Math.max(xml.lastIndexOf('<w:r ', ult), xml.lastIndexOf('<w:r>', ult));
  const fim = xml.indexOf('</w:r>', ult);
  if (ini < 0 || fim < 0) return xml;
  let run = xml.slice(ini, fim);
  const ext = run.match(/<wp:extent cx="(\d+)" cy="(\d+)"\/>/);
  if (ext){
    const W = Number(ext[1]), H = Number(ext[2]);
    const prop = logo.largura / logo.altura;
    let cx = W, cy = Math.round(W / prop);
    if (cy > H){ cy = H; cx = Math.round(H * prop); }
    run = run.replace(/<wp:extent cx="\d+" cy="\d+"\/>/, '<wp:extent cx="' + cx + '" cy="' + cy + '"/>')
             .replace(/<a:ext cx="\d+" cy="\d+"\/>/, '<a:ext cx="' + cx + '" cy="' + cy + '"/>');
    // imagem ancorada: centraliza na caixa original deslocando a posição
    const dx = Math.round((W - cx) / 2), dy = Math.round((H - cy) / 2);
    run = run.replace(/(<wp:positionH\b[^>]*>\s*<wp:posOffset>)(-?\d+)(<\/wp:posOffset>)/,
                      (t, a, v, b) => a + (Number(v) + dx) + b)
             .replace(/(<wp:positionV\b[^>]*>\s*<wp:posOffset>)(-?\d+)(<\/wp:posOffset>)/,
                      (t, a, v, b) => a + (Number(v) + dy) + b);
  }
  return xml.slice(0, ini) + run + xml.slice(fim);
}

// ── mala direta do Word ─────────────────────────────────────────────────────
// Os modelos vieram de mala direta. Se os campos MERGEFIELD ficarem, o Word
// abre o arquivo tentando reconectar a fonte de dados e pede a planilha antiga.
function _achatarMailMerge(xml){
  const re = /<w:r\b[^>]*>[\s\S]*?<\/w:r>/g;
  let out = [], estado = 'normal', ultimo = 0, m;
  while ((m = re.exec(xml)) !== null){
    out.push(xml.slice(ultimo, m.index)); ultimo = re.lastIndex;
    const run = m[0];
    if (run.indexOf('fldCharType="begin"') !== -1){ estado = 'codigo'; continue; }
    if (run.indexOf('fldCharType="separate"') !== -1){ estado = 'valor'; continue; }
    if (run.indexOf('fldCharType="end"') !== -1){ estado = 'normal'; continue; }
    if (estado === 'codigo') continue;
    out.push(run);
  }
  out.push(xml.slice(ultimo));
  return out.join('').replace(
    /<w:fldSimple\s+w:instr="[^"]*MERGEFIELD[^"]*"[^>]*>([\s\S]*?)<\/w:fldSimple>/g, '$1');
}

/** O Word quebra «Chave» em vários trechos (corretor, revisões). Junta antes de trocar. */
function _juntarPlaceholders(xml){
  return xml.replace(/«([\s\S]{0,600}?)»/g, (todo, dentro) => {
    if (dentro.indexOf('<') === -1) return todo;
    if (dentro.indexOf('</w:p>') !== -1) return todo;
    if (dentro.indexOf('«') !== -1) return todo;
    return '«' + dentro.replace(/<[^>]+>/g,'') + '»';
  });
}

/** Monta o .docx final. Devolve { blob, faltaram } — `faltaram` são as chaves
 *  que ficaram no papel sem valor, para a tela poder avisar em vez de entregar
 *  uma proposta com «Cliente» impresso no meio do texto. */
/* ── ITEM 2 (S38): O ANEXO POR VASO ─────────────────────────────────────────
   Uma página no fim do documento com os vasos DAQUELA proposta e as colunas
   A–G da planilha do TapWeb (Tag, Status, Data Desativação, Inspeção
   Externa, Inspeção Interna, Calibração Manômetro, Calibração Válvula). As
   linhas vêm prontas de `tf_anexo_vasos` (58_): o banco decide o que está
   vencido, a tela só desenha. A célula vencida é amarela UMA POR UMA — no
   VP-13 do exemplo, a Externa vencida acende e a Interna em dia não.

   O XML é escrito com formatação própria (fonte 8,5 pt, bordas cinza) em vez
   de copiar um estilo do modelo: os 8 modelos têm estilos diferentes, e a
   tabela de itens de cada um tem 5 colunas, não 7. */
const ANEXO_COLS = [
  ['tag',        'Tag',                  1300],
  ['status',     'Status',               1250],
  ['desativado', 'Data Desativação',     1350],
  ['externa',    'Inspeção Externa',     1350],
  ['interna',    'Inspeção Interna',     1350],
  ['manometro',  'Calibração Manômetro', 1450],
  ['valvula',    'Calibração Válvula',   1450]
];
function _anexoVasosXml(a){
  const run = (t, b, sz) => '<w:r><w:rPr>' + (b ? '<w:b/><w:bCs/>' : '')
    + '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/></w:rPr>'
    + '<w:t xml:space="preserve">' + _xmlEsc(t) + '</w:t></w:r>';
  const par = (t, o) => { o = o || {};
    return '<w:p><w:pPr><w:spacing w:before="' + (o.antes || 0) + '" w:after="' + (o.depois || 0) + '"/>'
      + (o.jc ? '<w:jc w:val="' + o.jc + '"/>' : '') + '</w:pPr>' + run(t, o.b, o.sz || 20) + '</w:p>'; };
  const cel = (t, w, o) => { o = o || {};
    return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>'
      + (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : '')
      + '<w:vAlign w:val="center"/></w:tcPr>' + par(t, { b: o.b, sz: 17, jc: 'center' }) + '</w:tc>'; };
  const borda = ['top','left','bottom','right','insideH','insideV']
    .map(k => '<w:' + k + ' w:val="single" w:sz="4" w:space="0" w:color="808080"/>').join('');
  const cab = '<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'
    + ANEXO_COLS.map(c => cel(c[1], c[2], { b: true, fill: 'D9E2EC' })).join('') + '</w:tr>';
  const linhas = (a.linhas || []).map(l => '<w:tr><w:trPr><w:cantSplit/></w:trPr>'
    + ANEXO_COLS.map(([k, , w]) => cel(l[k] || '', w,
        { b: k === 'tag', fill: (l.venc && l.venc[k]) ? 'FFFF00' : null })).join('') + '</w:tr>').join('');
  return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>'
    + par('ANEXO — SITUAÇÃO DOS VASOS DE PRESSÃO', { b: true, sz: 24, depois: 80 })
    + par('Vencimentos conforme o TapWeb' + (a.tapweb_em ? ' (atualizado em ' + a.tapweb_em + ')' : '')
          + '. Em amarelo, os serviços vencidos em ' + a.hoje + '.', { sz: 18, depois: 160 })
    + '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:jc w:val="center"/>'
    + '<w:tblBorders>' + borda + '</w:tblBorders><w:tblLayout w:type="fixed"/>'
    + '<w:tblCellMar><w:left w:w="60" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar>'
    + '</w:tblPr><w:tblGrid>' + ANEXO_COLS.map(c => '<w:gridCol w:w="' + c[2] + '"/>').join('')
    + '</w:tblGrid>' + cab + linhas + '</w:tbl><w:p/>';
}
/** Entra ANTES do `<w:sectPr>` final do corpo (que tem de ser o último filho
 *  do body). Se o último sectPr é de parágrafo — há `</w:p>` depois dele —,
 *  o corpo não tem sectPr próprio e o anexo entra logo antes de `</w:body>`. */
function inserirAnexoVasos(xml, a){
  const fim = xml.lastIndexOf('</w:body>');
  if (fim < 0 || !a || !(a.linhas || []).length) return xml;
  let pos = xml.lastIndexOf('<w:sectPr', fim);
  if (pos < 0 || xml.lastIndexOf('</w:p>', fim) > pos || xml.lastIndexOf('</w:tbl>', fim) > pos) pos = fim;
  return xml.slice(0, pos) + _anexoVasosXml(a) + xml.slice(pos);
}

/** A prévia e a escolha, comum aos dois geradores (OS e negócio). */
async function carregarAnexoVasos(args){
  if (DEMO) return null;
  try{ return await rpc('tf_anexo_vasos', args); }
  catch(e){ return { erro: e.message }; }
}
function htmlAnexoGerador(est, idChk){
  const m = est.modelo;
  if (!m || !m.tem_tabela) return '';
  const a = est.anexo;
  if (a === undefined) return '<p class="dica" style="margin:0 0 14px">Conferindo os vasos da proposta…</p>';
  if (!a) return '';
  if (a.erro) return '<div class="aviso" style="margin:0 0 14px">O anexo por vaso não pôde ser montado: '
    + esc(a.erro) + (/tf_anexo_vasos/.test(a.erro) ? ' — falta rodar o <b>58_ajustes_s38.sql</b> no Supabase.' : '')
    + ' O documento sai sem ele.</div>';
  const ls = a.linhas || [];
  if (!ls.length) return '<p class="dica" style="margin:0 0 14px">Sem anexo por vaso: nenhum vaso desta '
    + 'proposta tem dados do TapWeb.</p>';
  return '<div class="anexoPrev"><label class="check" style="margin:0 0 6px"><input type="checkbox" id="' + idChk + '"'
    + (est.porAnexo !== false ? ' checked' : '') + '><span>Pôr no fim do documento o <b>anexo por vaso</b> — '
    + ls.length + ' vaso(s)' + (Number(a.vencidos) ? ', ' + a.vencidos + ' serviço(s) vencido(s) em amarelo' : '')
    + '</span></label>'
    + '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
    + ANEXO_COLS.map(c => '<th>' + esc(c[1]) + '</th>').join('') + '</tr></thead><tbody>'
    + ls.map(l => '<tr>' + ANEXO_COLS.map(([k]) => '<td' + (l.venc && l.venc[k] ? ' class="venc"' : '') + '>'
        + esc(l[k] || '') + '</td>').join('') + '</tr>').join('')
    + '</tbody></table></div></div>';
}
/** O que vai para o `docxGerar`: só com modelo de proposta, com linha, e marcado. */
const anexoParaGerar = est => (est.modelo && est.modelo.tem_tabela && est.porAnexo !== false
  && est.anexo && !est.anexo.erro && (est.anexo.linhas || []).length) ? est.anexo : null;

async function docxGerar({ bytes, valores, tabela, totalTexto, tirarLogoCliente, logoCliente, planos, anexo }){
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(bytes);
  const alvos = Object.keys(zip.files).filter(n => /^word\/.*\.xml$/.test(n) && !zip.files[n].dir);
  const faltaram = new Set();
  let logosTiradas = 0, logosPostas = 0, planosEscritos = 0, anexoVasos = 0;

  for (const nome of alvos){
    let t = await zip.file(nome).async('string');
    let mexeu = false;

    // ITEM 5 (S28): com a logo do cliente em mãos, TROCA; sem ela, tira a antiga
    if ((logoCliente || tirarLogoCliente) && contarImagensCabecalho(nome, t) >= 2){
      const trocado = logoCliente ? await trocarLogoCliente(zip, nome, t, logoCliente) : null;
      if (trocado){ t = trocado; logosPostas++; }
      else { t = removerLogoCliente(t); logosTiradas++; }
      mexeu = true;
    }

    if (t.indexOf('«') !== -1){
      const j = _juntarPlaceholders(t);
      if (j !== t){ t = j; mexeu = true; }
      for (const k in valores){
        const tag = '«' + k + '»';
        if (t.indexOf(tag) !== -1){ t = t.split(tag).join(_xmlEsc(valores[k] ?? '')); mexeu = true; }
      }
      // o que sobrou com « » é chave que ninguém preencheu
      for (const m of t.matchAll(/«([^«»]{1,60})»/g)) faltaram.add(m[1].trim());
    }
    if (t.indexOf('MERGEFIELD') !== -1){ t = _achatarMailMerge(t); mexeu = true; }
    if (nome === 'word/settings.xml' && t.indexOf('mailMerge') !== -1){
      t = t.replace(/<w:mailMerge>[\s\S]*?<\/w:mailMerge>/g,''); mexeu = true;
    }
    if (nome === 'word/document.xml' && tabela && tabela.length){
      const tabs = acharTabelasItens(t);
      if (planos && modeloTemPlanos(tabs)){
        // ITEM 3 (S29): as três, de trás para frente (os índices não andam)
        const pad = tabs.find(x => x.plano === 'padrao');
        const moldePlano = _estiloPlano(_tags(pad.linhasItem[0], 'w:tc')[1] || '');
        tabs.slice().sort((a, b) => b.inicio - a.inicio).forEach(tb => {
          tb.moldePlano = moldePlano;
          const pl = planos[tb.plano];
          t = t.slice(0, tb.inicio) + reescreverTabela(tb, pl.linhas, _brlDoc(pl.total)) + t.slice(tb.fim);
        });
        planosEscritos = 3;
        mexeu = true;
      } else if (tabs.length){
        const achada = tabs[0];
        t = t.slice(0, achada.inicio) + reescreverTabela(achada, tabela, totalTexto) + t.slice(achada.fim);
        mexeu = true;
      }
    }
    // S38 · item 2: o anexo por vaso, no fim do corpo
    if (nome === 'word/document.xml' && anexo && (anexo.linhas || []).length){
      const antes = t.length;
      t = inserirAnexoVasos(t, anexo);
      if (t.length !== antes){ anexoVasos = anexo.linhas.length; mexeu = true; }
    }
    if (mexeu) zip.file(nome, t);
  }

  const blob = await zip.generateAsync({ type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  return { blob, faltaram: [...faltaram], logosTiradas, logosPostas, planosEscritos, anexoVasos };
}

/** Espelho de `tf__proposta_rotulo`: v1 é o número puro; v2 é "Rev. 01". */

const nomeSeguro = s => String(s||'').replace(/[/\\:*?"<>|]/g,'').replace(/\s+/g,' ').trim();

function baixarBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

      + 'Sem eles, o documento sai só com a primeira tabela preenchida.</div>';

  if (!est.itens.length){ el.innerHTML = ''; return; }
  const P = montarPlanos(est.itens, est.idxPlano, pl);
  if (!P){
    el.innerHTML = '<div class="aviso" style="margin:0 0 14px">Os itens vieram sem os números que a conta '
      + 'dos planos precisa. Falta rodar o <b>51_ajustes_s29.sql</b>.</div>';
    return;
  }
  const qtd = est.itens[est.idxPlano].qtd;
  const rot = { basico:'Básico', padrao:'Padrão', premium:'Premium' };
  const pctTxt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + String(Math.abs(v)).replace('.', ',') + '%';
