// COMPRAS — a lista que substitui "acompanhar de memória"
// ════════════════════════════════════════════════════════════════════════════
async function pintarCompras(){
  const board = document.getElementById('board');
  board.innerHTML = '<div class="comWrap"><div class="barraCom">'
    + '<b style="font-size:15px">Compras em andamento</b>'
    + '<span class="resumoCom" id="cprResumo"></span></div>'
    + '<div class="comBoard" style="overflow:auto"><div id="cprLista" '
    + 'style="max-width:1000px;padding-bottom:30px"></div></div></div>';

  let todos = [];
  try{ todos = DEMO ? demoCompras() : await get('v_compras?select=*'); }
  catch(e){ toast(e.message,'err'); return; }

  REPINTA.cpr = () => desenharCompras(todos);
  desenharCompras(todos);
}

function desenharCompras(todos){
  const q = BUSCA.cpr || '';
  const itens = !q ? todos : todos.filter(i => casa(
    // era `i.os_numero`, que a view não devolve: virava a string "undefined" e
    // buscar pelo número da OS nunca achava nada — justo o que o placeholder promete
    [i.descricao, i.os, i.cliente, i.fornecedor, i.pedido_numero, i.situacao].join(' '), q));

  const atras = itens.filter(i => i.situacao === 'atrasado');
  // o contador da lateral mostra o que dói: atrasado, não o total
  const nCpr = document.getElementById('nCpr');
  if (nCpr){
    const nAtr = todos.filter(i => i.situacao === 'atrasado').length;
    nCpr.textContent = nAtr || '';
    nCpr.classList.toggle('alerta', nAtr > 0);
  }
  const elRes = document.getElementById('cprResumo');
  if (!elRes) return;    // a pessoa trocou de tela durante o carregamento
  elRes.innerHTML = itens.length
    ? itens.length + ' item(ns) · ' + (atras.length
        ? '<b style="color:var(--crit)">' + atras.length + ' atrasado(s)</b>' : 'nenhum atrasado')
    : '';

  const L = document.getElementById('cprLista');
  if (!itens.length){
    L.innerHTML = q
      ? '<div class="vazio2"><b>Nada com essa busca</b><p>' + todos.length
        + ' item(ns) em compra não casam com o que você digitou.</p></div>'
      : '<p class="nota">Nada em compra. Itens entram aqui quando a origem é '
        + '“comprar” e o cliente aprovou.</p>';
    return;
  }

  // atrasados primeiro: é o que precisa de telefonema hoje
  const ordem = { 'atrasado':0, 'chega logo':1, 'no prazo':2, 'sem previsão':3, 'recebido':4 };
  // situação fora do mapa dava `undefined - undefined` = NaN, e comparador que
  // devolve NaN embaralha a lista — o agrupamento por seção repetia cabeçalho
  itens.sort((a,b) => ((ordem[a.situacao] ?? 99) - (ordem[b.situacao] ?? 99))
                   || ((Number(b.dias_atraso)||0) - (Number(a.dias_atraso)||0)));

  let sit = null;
  itens.forEach(i => {
    if (i.situacao !== sit){
      sit = i.situacao;
      const h = document.createElement('div');
      h.className = 'secTit';
      h.textContent = ({atrasado:'Atrasados', 'chega logo':'Chegam nos próximos 3 dias',
        'no prazo':'No prazo', 'sem previsão':'Sem previsão de entrega',
        recebido:'Recebidos'})[sit] || sit;
      L.appendChild(h);
    }
    const el = document.createElement('div');
    el.className = 'linhaCompra ' + i.situacao.replace(/\s/g,'-');
    el.innerHTML = '<div><b></b><small></small></div><div class="dt"></div>'
                 + '<div class="acaoCompra"></div>';
    el.querySelector('b').textContent = i.descricao;
    el.querySelector('small').textContent = i.os + ' · ' + i.cliente
      + (i.fornecedor ? ' · ' + i.fornecedor : ' · sem fornecedor')
      // pedido interno da Proper não tem PC: dizer "sem pedido" ali seria falso
      + (i.pedido_numero ? ' · ' + i.pedido_numero
                         : (i.origem === 'proper' ? ' · pedido interno' : ''));
    el.querySelector('.dt').innerHTML = i.recebido_em
      ? 'recebido<br><b>' + new Date(i.recebido_em+'T12:00').toLocaleDateString('pt-BR') + '</b>'
      : (i.previsto_para
          ? (i.dias_atraso > 0 ? '<b class="atr">' + i.dias_atraso + ' dias<br>de atraso</b>'
                               : 'previsto<br><b>' + new Date(i.previsto_para+'T12:00').toLocaleDateString('pt-BR') + '</b>')
          : '<span class="nota">sem data</span>');

    // ── A AÇÃO QUE FALTAVA ATÉ O S24 ────────────────────────────────────────
    // `recebido_em` era lido em quatro lugares e escrito em ZERO: a T12 é
    // agregação sobre este campo, então toda OS de fornecimento parava aqui
    // para sempre. O botão abaixo é o caminho que não existia.
    const cx = el.querySelector('.acaoCompra');
    const bt = document.createElement('button');
    bt.className = 'btn mini' + (i.recebido_em ? '' : ' pri');
    bt.textContent = i.recebido_em ? 'desfazer' : 'Recebi';
    bt.addEventListener('click', () => i.recebido_em
      ? _semDuploEnvio_(bt, () => desfazerRecebimento(i))
      : modalReceber(i, todos));
    cx.appendChild(bt);
    L.appendChild(el);
  });
}

/**
 * RECEBER — uma data, e a opção de levar o resto do pedido junto.
 *
 * O caminhão chega com o pedido inteiro, não com uma peça. Marcar item a item
 * é como se marca metade e esquece o resto — e o resto é justamente o que
 * segura a T12. Por isso o modal já vem com "o pedido todo" marcado quando há
 * mais de um item pendente no mesmo pedido.
 *
 * A lista vai para `tf_receber_itens`, que recusa OS misturada. Como pedido é
 * por OS, agrupar por pedido nunca mistura — e o item da Proper, que não tem
 * PC, agrupa pela OS mesmo.
 */
function modalReceber(i, todos){
  const mesmoLote = x => !x.recebido_em && x.item_id !== i.item_id && x.os_id === i.os_id
    && (i.pedido_numero ? x.pedido_numero === i.pedido_numero
                        : (!x.pedido_numero && x.origem === i.origem));
  const irmaos = (todos || []).filter(mesmoLote);
  const lote = i.pedido_numero || (i.origem === 'proper' ? 'pedido interno da Proper' : 'esta OS');

  abrirModal('Recebi · ' + i.descricao,
    '<div class="campo"><label for="rcD">Quando chegou</label>'
    + '<input id="rcD" type="date" max="' + esc(isoHoje()) + '" value="' + esc(isoHoje()) + '"></div>'
    + (irmaos.length
        ? '<label class="chk" style="display:flex;gap:8px;align-items:flex-start;margin:2px 0 8px">'
          + '<input type="checkbox" id="rcTodos" checked style="margin-top:2px">'
          + '<span>Marcar também os outros <b>' + irmaos.length + '</b> item(ns) de '
          + esc(lote) + '<br><small style="color:var(--ink-3)">'
          + esc(irmaos.map(x => x.descricao).join(' · ')) + '</small></span></label>'
        : '')
    + '<p style="font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.5">'
    + 'É este registro que fecha a etapa <b>Receber material</b> e libera a '
    + 'calibração. Enquanto faltar um item do pedido, a OS continua aqui.</p>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Registrar recebimento', pri:true, onClick: async () => {
        const d = document.getElementById('rcD').value || isoHoje();
        const leva = irmaos.length && document.getElementById('rcTodos').checked;
        const ids = [i.item_id].concat(leva ? irmaos.map(x => x.item_id) : []);
        try{
          if (DEMO) throw new Error('Modo demonstração: recebimento não é gravado.');
          const r = await rpc('tf_receber_itens', { p_os_item_ids: ids, p_data: d });
          fecharModal();
          toast((r && r.itens ? r.itens : ids.length) + ' item(ns) marcado(s) como recebido(s).','ok');
          pintarCompras(); carregar();
        }catch(e){ toast(e.message,'err'); }
     }}]);
}

async function desfazerRecebimento(i){
  try{
    if (DEMO) throw new Error('Modo demonstração: recebimento não é gravado.');
    const r = await rpc('tf_desfazer_recebimento', { p_os_item_id: i.item_id });
    toast(r && r.reabriu
      ? 'Recebimento desfeito — a etapa "Receber material" voltou a ficar aberta.'
      : 'Recebimento desfeito.', 'ok');
    pintarCompras(); carregar();
  }catch(e){ toast(e.message,'err'); }
}

// ════════════════════════════════════════════════════════════════════════════
// COMERCIAL — o quadro que substitui o Trello
// ----------------------------------------------------------------------------
// Oito colunas, e a coluna é DERIVADA dos fatos, igual ao quadro das OS.
// Não existe arrastar aqui também: registrar um contato move o card de "Leads"
// para "Contato realizado", e nada mais move.
//
// No Trello dá para puxar um card para "Proposta enviada" sem ter enviado nada.
// A partir daí o quadro mente — e quadro que mente é pior que quadro nenhum,
// porque as decisões passam a ser tomadas em cima dele.
// ════════════════════════════════════════════════════════════════════════════
let COLS_COM = [];
let negocios = [];
let negAberto = null;
let abaNeg = 'log';

async function pintarComercial(){
  visao = 'com';
  const board = document.getElementById('board');
  // `main` já rola na horizontal e não rola na vertical. A barra precisa ficar
  // FORA desse rolamento, senão ela sai da tela junto com as colunas.
  board.innerHTML = '<div class="comWrap">'
    + '<div class="barraCom">'
    +   '<button class="btn pri" id="cNovo">+ Novo negócio</button>'
    // ITEM 11 (S36): a proposta que existiu antes do TapFlow entra por aqui,
    // com a data e o número de verdade — e não pelo "Novo negócio", que nasce
    // hoje e em "Leads".
    +   (podeEscritorio() && !DEMO
          ? '<button class="btn" id="cAntiga" title="Registrar uma proposta emitida antes do TapFlow, com a data e o número reais">'
            + 'Lançar proposta antiga</button>' : '')
    +   '<span class="resumoCom" id="cResumo"></span></div>'
    + '<div class="comBoard"><div class="board" id="qCom"></div></div></div>';

  document.getElementById('cNovo').addEventListener('click', formNegocio);
  const bAnt = document.getElementById('cAntiga');
  if (bAnt) bAnt.addEventListener('click', formPropostaAntiga);
  REPINTA.com = desenharCom;

  try{
    if (DEMO){ COLS_COM = demoColsCom(); negocios = demoNegocios(); }
    else {
      const [c, n] = await Promise.all([
        get('colunas_comercial?select=*&order=ordem'),
        get('v_negocios_kanban?select=*&order=coluna_ordem,dias_parado.desc')
      ]);
      COLS_COM = c; negocios = n;
    }
  }catch(e){ toast(e.message,'err'); return; }
  desenharCom();
}

function desenharCom(){
  const q = document.getElementById('qCom');
  if (!q) return;
  const busca = BUSCA.com || '';
  const vis = negocios.filter(n =>
    casa([n.numero, n.numero_exibicao, n.cliente_nome, n.titulo, n.coluna, n.contato_nome].join(' '), busca));
  const total = vis.reduce((s,n) => s + Number(n.valor_propostas || n.valor_estimado || 0), 0);
  document.getElementById('cResumo').textContent =
    vis.length + (busca && vis.length !== negocios.length ? ' de ' + negocios.length : '')
    + ' negócio(s) · ' + BRL(total) + ' em jogo';
  const nc = document.getElementById('nCom');
  if (nc) nc.textContent = negocios.length || '';

  q.innerHTML = '';
  // As colunas vêm da tabela, não das linhas: coluna vazia CONTINUA no quadro.
  // Coluna que some quando esvazia esconde justamente a etapa em que ninguém
  // está trabalhando — que costuma ser a que precisa de atenção.
  COLS_COM.forEach(col => {
    const doCol = vis.filter(n => n.coluna === col.nome);
    const el = document.createElement('div');
    el.className = 'colCom';
    el.innerHTML = '<div class="colTit"><b></b><span class="cnt"></span></div>'
                 + '<div class="colSub"></div><div class="colBody"></div>';
    el.querySelector('b').textContent = col.nome;
    el.querySelector('.cnt').textContent = doCol.length;
    el.querySelector('.colSub').textContent = col.descricao || '';
    const body = el.querySelector('.colBody');

    if (!doCol.length){
      const v = document.createElement('p');
      v.className = 'colVazia'; v.textContent = 'nada aqui';
      body.appendChild(v);
    }
    // ITEM 6 (S37): nas colunas de negócio EM ANDAMENTO, o mais parado vai
    // para o topo. A consulta já vinha `order=coluna_ordem,dias_parado.desc`,
    // mas a regra fica explícita aqui — é ela que a tela promete, e não pode
    // depender de a busca ou um refresh devolverem a lista na mesma ordem.
    // `sort` é estável: empate mantém a ordem do servidor.
    const comContador = colunaComContador(col.nome);
    const lista = comContador
      ? doCol.slice().sort((a, b) => Number(b.dias_parado || 0) - Number(a.dias_parado || 0))
      : doCol;
    lista.forEach(n => body.appendChild(cardNegocio(n, comContador)));
    q.appendChild(el);
  });

  carregarLogos(vis.map(n => n.cliente_id));
}

// ── A LOGOMARCA DO CLIENTE NO CARD ──────────────────────────────────────────
// Duas regras, as duas herdadas do S13 (fotos do catálogo), e as duas valem
// mais aqui do que lá — são 519 clientes contra 300 itens:
//
// 1. A LISTA NUNCA ESPERA PELA IMAGEM. O card é desenhado inteiro com o
//    espaço da logo já reservado (`.cardCom .logo` sempre existe, com ou sem
//    imagem), mostrando as iniciais. A foto entra depois, por cima, sem
//    mexer no tamanho de nada. Quadro que reflui quando as imagens chegam é
//    quadro em que se clica no card errado.
// 2. A IMAGEM NÃO VIAJA COM A LISTA. `v_negocios_kanban` traz `tem_logo`, que
//    são 4 bytes; o base64 é buscado em UMA consulta separada, só para os
//    clientes que apareceram na tela, e fica em memória pela sessão.
//
// Cliente sem logo não é buraco: as iniciais num quadrado colorido. A cor sai
// do NOME, sempre a mesma para o mesmo cliente — é o que faz "aquele card
// verde" significar alguma coisa depois de uma semana de uso.

const _LOGOS = new Map();          // cliente_id → data URI, ou null (não tem)
let _logosPedindo = false;

function iniciaisCliente(nome){
  const partes = String(nome||'?').replace(/[^\p{L}\p{N}\s]/gu,' ').trim().split(/\s+/)
    // "Ltda", "S/A" e companhia não identificam ninguém: "Gerdau Aços Ltda"
    // tem que virar GA, não GL.
    .filter(p => !/^(de|da|do|das|dos|e|ltda|me|epp|eireli|sa|s|cia|com|ind)$/i.test(p));
  if (!partes.length) return '?';
  if (partes.length === 1) return partes[0].slice(0,2).toUpperCase();
  return (partes[0][0] + partes[1][0]).toUpperCase();
}

/** Mesmo nome, mesma cor, sempre. Sem isso a identificação visual não se forma. */
function matizDoNome(nome){
  let h = 0;
  const s = String(nome||'');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

/** ITEM 12 (S28): a coluna virou `razao_social`, e existe `nome_fantasia`.
 *  Nas listas de ESCOLHA (selects, parecidos, busca) as duas aparecem — é pelo
 *  apelido que a pessoa reconhece; no documento e na ficha, a razão social. */
function nomeCliente(c){
  if (!c) return '';
  const rs = c.razao_social || c.nome || '';
  return c.nome_fantasia && c.nome_fantasia !== rs ? rs + ' (' + c.nome_fantasia + ')' : rs;
}

function logoHTML(clienteId, nome, classe){
  const cache = clienteId ? _LOGOS.get(clienteId) : null;
  const dentro = cache
    ? '<img alt="" src="' + esc(cache) + '">'
    : '<i>' + esc(iniciaisCliente(nome)) + '</i>';
  return '<span class="' + (classe || 'logo') + ' logoCli' + (cache ? ' comImg' : '') + '" data-logo="'
    + esc(clienteId || '') + '" style="--h:' + matizDoNome(nome) + '">' + dentro + '</span>';
}

/** Busca as que faltam e pinta por cima. Nada aqui bloqueia o desenho da tela. */
async function carregarLogos(ids){
  const faltam = [...new Set((ids||[]).filter(id => id && !_LOGOS.has(id)))];
  if (!faltam.length || DEMO || _logosPedindo) return;
  _logosPedindo = true;
  try{
    // pedaços de 60: uma URL com 500 uuids estoura o limite de tamanho do GET
    for (let i = 0; i < faltam.length; i += 60){
      const lote = faltam.slice(i, i + 60);
      const r = await get('clientes_logo?select=cliente_id,thumb&cliente_id=in.('
                          + lote.join(',') + ')');
      lote.forEach(id => _LOGOS.set(id, null));            // quem não veio, não tem
      (r||[]).forEach(x => _LOGOS.set(x.cliente_id, x.thumb));
      pintarLogosNaTela();
    }
  }catch(e){
    // Falhar aqui não pode estragar o quadro: as iniciais continuam servindo.
    // Marcar como "sem logo" evita ficar pedindo de novo a cada repintura.
    faltam.forEach(id => { if (!_LOGOS.has(id)) _LOGOS.set(id, null); });
  }finally{ _logosPedindo = false; }
}

function pintarLogosNaTela(){
  document.querySelectorAll('[data-logo]').forEach(el => {
    const url = _LOGOS.get(el.dataset.logo);
    if (!url || el.querySelector('img')) return;
    const img = document.createElement('img');
    img.alt = ''; img.src = url;
    el.innerHTML = ''; el.appendChild(img);
    el.classList.add('comImg');
  });
}

// ── REDUZIR A IMAGEM ANTES DE SUBIR ─────────────────────────────────────────
// Ninguém vai pedir ao cliente uma logo em 96px: cada um manda o que tem, e o
// que ele tem costuma ser um PNG de 4000px que veio da agência. A redução é
// aqui, no navegador, antes de qualquer coisa subir — é o mesmo `reduzirFoto`
// do Field, com dois destinos em vez de um.
//
// `contain`, nunca `cover`: a logo cabe inteira no quadrado, com o que sobrar
// em branco. Cortar a logomarca de um cliente é o tipo de detalhe que ele nota
// na primeira reunião.
/* ── S34 · item 4: A CAUSA QUE A NOTA DO DOCUMENTO NÃO TINHA VISTO ──────────
   A nota culpava a miniatura de 128px. É parte da história — mas o canvas
   aqui era `lado × lado`, SEMPRE QUADRADO, com a imagem centralizada dentro.
   Uma logo 2:1 virava um quadrado com metade de TARJA BRANCA.

   Na faixa do card, que limita pela ALTURA, o que se via era a logo ocupando
   METADE da altura, cercada de branco — e isso não muda por aumentar
   `--faixaH`: aumentar a faixa aumenta a tarja junto. É a diferença que o
   print do Trello mostra e que "só mexer no CSS" não fecharia.

   Por isso existe o modo RENTE (`rente = true`): o canvas passa a ter o
   tamanho da imagem JÁ REDUZIDA, sem moldura. Aí `max-height:88px;
   width:auto` mostra a logo na altura inteira da faixa.

   O modo quadrado continua existindo porque a foto do CATÁLOGO ainda o usa:
   lá a lista tem um espaço fixo reservado, e miniatura de proporção variável
   faria a lista pular a cada foto que chega. */
function reduzirImagem(file, lado, qualidade, comFundo, rente){
  return new Promise((ok, erro) => {
    const desenhar = (fonte) => {
      const img = new Image();
      img.onerror = () => erro(new Error('Esse arquivo não é uma imagem que o navegador abra.'));
      img.onload = () => {
        const e = Math.min(1, lado / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * e)), h = Math.max(1, Math.round(img.height * e));
        const cv = document.createElement('canvas');
        cv.width  = rente ? w : lado;
        cv.height = rente ? h : lado;
        const cx = cv.getContext('2d');
        if (comFundo){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); }
        cx.drawImage(img, rente ? 0 : (lado - w) / 2, rente ? 0 : (lado - h) / 2, w, h);
        // JPEG só quando há fundo branco: PNG transparente virando JPEG ganha
        // fundo preto, e a logo do cliente aparece dentro de um quadrado preto.
        ok({ dados: cv.toDataURL(comFundo ? 'image/jpeg' : 'image/png', qualidade),
             largura: img.width, altura: img.height });
      };
      img.src = fonte;
    };
    // aceita File (envio) e data-URL (a regeração parte do `original` já
    // guardado, que não é arquivo nenhum)
    if (typeof file === 'string') return desenhar(file);
    const fr = new FileReader();
    fr.onerror = () => erro(new Error('Não deu para ler o arquivo.'));
    fr.onload  = () => desenhar(fr.result);
    fr.readAsDataURL(file);
  });
}

// A geração da miniatura da logomarca. 0 = quadrada com tarja (até o S33),
// 2 = rente (S34). O banco guarda em `clientes_logo.thumb_geracao` e é isso
// que a view `v_logos_a_regerar` usa para saber quem ainda falta.
const LOGO_THUMB_GERACAO = 2;
const LOGO_THUMB_PX = 256;

// ── ITEM 2 (S29): A LOGOMARCA SE ENVIA DE ONDE ELA APARECE ──────────────────
// O quadrado da logo é o mesmo em três lugares (Cadastros, aba Cliente do
// negócio, aba Cliente da OS), mas só Cadastros sabia gravar. O envio virou
// UMA função: o limite de 8 MB, as DUAS reduções (miniatura de 128 px com
// fundo, para o card; 600 px com transparência, que o gerador põe no
// cabeçalho do .docx) e o `_LOGOS.set()` são os mesmos nos três — se
// divergissem, a logo do card e a do documento virariam coisas diferentes.
// Quem vê o botão é quem o BANCO deixa gravar (`tf_pode_escritorio`), não quem
// tem o módulo Cadastros: o perfil Comercial grava logo e não tem o módulo.
async function enviarLogoCliente(clienteId, f){
  if (!f) return false;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type || '')) throw new Error('Use uma imagem PNG, JPG ou WEBP.');
  if (f.size > 8 * 1024 * 1024) throw new Error('Arquivo acima de 8 MB. Use um menor.');
  // S32 · item 1: 128 → 256. A miniatura passou a ser o que aparece na FAIXA
  // do card, não mais um quadradinho de 22px, e 128px numa faixa de tela
  // retina fica visivelmente macia. 256px de JPEG de logomarca (cores chapadas)
  // pesa poucos KB; o quadro continua carregando em lotes de 60.
  // S34: a miniatura sai RENTE — sem a tarja branca que fazia a logo ocupar
  // metade da faixa do card. O `original` continua quadrado? Não: ele nunca
  // foi para a tela, vai para o cabeçalho do .docx, e lá a célula do Word já
  // dimensiona. Rente também, por coerência.
  const thumb    = await reduzirImagem(f, LOGO_THUMB_PX, 0.82, true,  true);
  const original = await reduzirImagem(f, 600,           0.92, false, true);
  if (!DEMO) await rpc('tf_salvar_logo_cliente', { p_cliente_id: clienteId,
    p_thumb: thumb.dados, p_original: original.dados,
    p_largura: thumb.largura, p_altura: thumb.altura, p_bytes: f.size,
    p_thumb_geracao: LOGO_THUMB_GERACAO });
  _LOGOS.set(clienteId, thumb.dados);
  return true;
}
async function tirarLogoCliente(clienteId){
  if (!DEMO) await rpc('tf_remover_logo_cliente', { p_cliente_id: clienteId });
  _LOGOS.set(clienteId, null);
}
// (o gerador busca a logo de novo cada vez que a aba Proposta é desenhada)

/** Troca, no lugar, todos os quadrados daquele cliente que estão na tela. */
function repintarLogo(clienteId, nome){
  document.querySelectorAll('[data-logo="' + clienteId + '"]').forEach(el => {
    const url = _LOGOS.get(clienteId);
    el.innerHTML = '';
    el.classList.toggle('comImg', !!url);
    if (url){ const im = document.createElement('img'); im.alt = ''; im.src = url; el.appendChild(im); }
    else { const it = document.createElement('i'); it.textContent = iniciaisCliente(nome || el.dataset.nome || ''); el.appendChild(it); }
  });
}

/** Põe "Logomarca" / "Trocar" + "Tirar" embaixo do quadrado, e aceita o
 *  arquivo arrastado em cima dele. `temLogo` pode vir null (não se sabe):
 *  aí pergunta ao banco antes de decidir o rótulo. */
async function ligarLogoEditavel(lado, clienteId, nome, temLogo){
  if (!lado || !clienteId || !podeEscritorio()) return;
  const quad = lado.querySelector('[data-logo]');
  if (quad) quad.dataset.nome = nome || '';
  if (temLogo == null){
    if (_LOGOS.has(clienteId)) temLogo = !!_LOGOS.get(clienteId);
    else if (DEMO) temLogo = false;
    else {
      try{ const r = await get('clientes?select=tem_logo&id=eq.' + clienteId); temLogo = !!(r && r[0] && r[0].tem_logo); }
      catch(e){ temLogo = false; }
    }
  }
  const cx = document.createElement('div');
  cx.className = 'logoEdit';
  lado.appendChild(cx);
  const desenhar = (tem) => {
    cx.innerHTML = '<input type="file" accept="image/png,image/jpeg,image/webp" hidden>'
      + '<button class="btn mini" type="button" data-a="enviar">' + (tem ? 'Trocar' : 'Logomarca') + '</button>'
      + (tem ? '<button class="btn mini" type="button" data-a="tirar">Tirar</button>' : '');
    const inp = cx.querySelector('input'), bEnv = cx.querySelector('[data-a="enviar"]');
    bEnv.title = 'Enviar a logomarca do cliente (ou arraste a imagem sobre o quadrado)';
    bEnv.addEventListener('click', () => inp.click());
    inp.addEventListener('change', () => enviar(inp.files && inp.files[0]));
    const bT = cx.querySelector('[data-a="tirar"]');
    if (bT) bT.addEventListener('click', () => _semDuploEnvio_(bT, async () => {
      try{ await tirarLogoCliente(clienteId); repintarLogo(clienteId, nome); desenhar(false);
           toast('Logomarca removida.','ok'); }
      catch(e){ toast(e.message,'err'); }
    }));
  };
  const enviar = async (f) => {
    if (!f) return;
    const bEnv = cx.querySelector('[data-a="enviar"]');
    bEnv.disabled = true; bEnv.textContent = 'Enviando…';
    try{
      await enviarLogoCliente(clienteId, f);
      repintarLogo(clienteId, nome); desenhar(true);
      toast('Logomarca gravada.','ok');
    }catch(e){ toast(e.message,'err'); desenhar(!!_LOGOS.get(clienteId)); }
  };
  desenhar(temLogo);
  // o extra: arrastar o arquivo em cima do quadrado
  if (quad){
    quad.classList.add('logoSolta');
    quad.title = 'Arraste a imagem da logomarca aqui';
    quad.addEventListener('dragover', ev => { ev.preventDefault(); quad.classList.add('arrastando'); });
    quad.addEventListener('dragleave', () => quad.classList.remove('arrastando'));
    quad.addEventListener('drop', ev => {
      ev.preventDefault(); quad.classList.remove('arrastando');
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      enviar(f);
    });
  }
}

// ── O BLOCO "ONDE FICA E COM QUEM SE FALA" ──────────────────────────────────
// Aparece no card do negócio e na gaveta da OS. É o mesmo desenho nos dois
// lugares de propósito: quem procura o endereço não deveria ter que aprender
// duas telas.
function blocoLocal(d){
  const linha = (rot, val, href) => '<div class="lin"><span class="rot">' + rot + '</span>'
    + (val
        ? (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(val) + '</a>'
                : '<span>' + esc(val) + '</span>')
        : '<i class="falta">não preenchido</i>') + '</div>';
  const mapa = d.localizacao || '';
  return '<div class="blocoLocal">'
    + linha('Endereço', d.endereco)
    + linha('No mapa', mapa ? 'abrir no mapa' : '', /^https?:/i.test(mapa) ? mapa : null)
    + linha('Agendar com', d.contato_agenda)
    + '</div>';
}

/* ── ITEM 6 (S37): DIAS SEM INTERAÇÃO EM TODO CARD EM ANDAMENTO ───────────
   O número já existia (`dias_parado`, da view) e aparecia só a partir de 7
   dias, como "Nd parado". Agora aparece SEMPRE nas colunas de negócio em
   andamento — de "Contato realizado" a "Entrega / Pós venda" —, e ordena a
   coluna. Conta a interação mais recente de qualquer tipo, digitada ou do
   sistema (confirmado pelo Bruno); sem nenhuma, conta da criação do negócio.
   As cores de 7 e 14 dias continuam: o número diz quanto, a cor diz se já é
   para se preocupar.

   Ficam de fora, sem contador e sem a borda de alerta:
   · Leads — ainda não houve conversa, o número mediria só a idade do lead;
   · Concluídos — negócio encerrado;
   · Recusadas — também encerrado (perdido, com motivo). O pedido não citou
     esta coluna; ficou fora pelo mesmo motivo dos Concluídos. Decisão minha,
     e se reverte tirando o nome da lista abaixo. */
const COLS_SEM_CONTADOR = new Set(['Leads', 'Recusadas', 'Concluídos']);
const colunaComContador = nome => !COLS_SEM_CONTADOR.has(nome);

/* ── ITEM 3 (S38): A COR DIZ SE JÁ É PARA SE PREOCUPAR ─────────────────────
   Faixas confirmadas pelo Bruno em 24/09: verde até 5 dias, amarelo 6 e 7,
   vermelho a partir de 8. Até o S37 o crachá era cinza até 6 e só mudava de
   cor em 7 e 14 — o número estava lá, mas era preciso LER cada card.
   Um lugar só decide a faixa: o crachá e a borda do card leem daqui.
   A cor nunca vem sozinha — o texto continua dizendo quantos dias (quem não
   distingue verde de vermelho lê o número). */
const DSI_AMARELO = 6, DSI_VERMELHO = 8;
const faixaDSI = d => (d >= DSI_VERMELHO ? 'vermelho' : (d >= DSI_AMARELO ? 'amarelo' : 'verde'));
function chipDiasSemInteracao(dias){
  const d = Math.max(0, Number(dias || 0));
  const txt = d === 0 ? 'interação hoje' : d + (d === 1 ? ' dia' : ' dias') + ' sem interação';
  const f = faixaDSI(d);
  return '<span class="mini dsi ' + f + '" '
    + 'title="Dias desde a última interação registrada no Histórico (anotação ou registro do sistema). '
    + 'Verde: até 5 · amarelo: 6 e 7 · vermelho: 8 ou mais.">'
    + txt + '</span>';
}

function cardNegocio(n, comContador){
  if (comContador === undefined) comContador = colunaComContador(n.coluna);
  const d = document.createElement('button');
  d.className = 'cardCom';
  const parado = Number(n.dias_parado || 0);
  // S38: a borda acompanha a faixa do crachá (amarelo 6–7, vermelho 8+)
  const alerta = !comContador ? '' : ({ vermelho:' parado', amarelo:' morno', verde:'' })[faixaDSI(parado)];
  d.className += alerta;

  // O espaço da logo é SEMPRE desenhado — com a imagem, se já veio; com as
  // iniciais, se ainda não. É isso que impede o quadro de refluir quando as
  // imagens chegam.
  //
  // ITEM 1 (S32): aqui ela também virou faixa no topo. O documento dizia que o
  // Comercial usa "o mesmo modelo de card" do print — não usa: este é o card
  // do NEGÓCIO, e a logo já vinha maior (34×26) e no canto. Mas o pedido é
  // reconhecer o cliente num relance, e isso vale igual nos dois quadros.
  // Lead ainda sem cliente cadastrado entra pelas iniciais do nome do lead.
  const logo = logoHTML(n.cliente_id, n.cliente_nome, 'logoFaixa');

  const chips = [];
  if (comContador) chips.push(chipDiasSemInteracao(parado));
  if (n.tarefas_atrasadas) chips.push('<span class="mini crit">' + n.tarefas_atrasadas + ' tarefa(s) atrasada(s)</span>');
  else if (n.tarefas_abertas) chips.push('<span class="mini">' + n.tarefas_abertas + ' tarefa(s)</span>');
  if (n.proxima_agenda) chips.push('<span class="mini ag">' + dataCurta(n.proxima_agenda) + '</span>');
  if (n.e_contrato) chips.push('<span class="mini ct">contrato</span>');

  if (Number(n.propostas_numeros) > 1)
    chips.push('<span class="mini">' + n.propostas_numeros + ' propostas</span>');
  // ITEM 10 (S28): o negócio está na entrega — qual OS
  if (n.pos_os_numero)
    chips.push('<span class="mini pos">entrega · ' + esc(n.pos_os_numero) + '</span>');
  // ITEM 11 (S36): lançado depois do fato — as datas são as reais
  if (n.retroativo) chips.push('<span class="mini" title="Proposta anterior ao TapFlow, lançada depois">anterior ao TapFlow</span>');
  if (n.concluido_fora_em) chips.push('<span class="mini">executado fora do TapFlow</span>');

  d.innerHTML = logo
    + '<div class="num"></div><div class="cli"></div><div class="tit"></div>'
    + '<div class="valor"></div><div class="chips">' + chips.join('') + '</div>';
  // ⚠ `numero_exibicao` vem da view: é NEG-… até a proposta SAIR, e o número
  //    da proposta (com Rev., quando houver) dali em diante. A regra mora no
  //    banco de propósito — o quadro não escolhe qual número o cliente conhece.
  d.querySelector('.num').textContent = n.numero_exibicao || n.numero;
  if (n.numero_exibicao && n.numero_exibicao !== n.numero)
    d.querySelector('.num').title = n.numero;   // o NEG- continua alcançável
  d.querySelector('.cli').textContent = n.cliente_nome;
  d.querySelector('.tit').textContent = n.titulo;
  const v = Number(n.valor_propostas || 0) || Number(n.valor_estimado || 0);
  d.querySelector('.valor').textContent = v
    ? BRL(v) + (Number(n.valor_propostas) ? '' : ' (estimado)') : '';
  d.addEventListener('click', () => abrirNegocio(n));
  return d;
}

const dataCurta = s => {
  try{ return new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
  catch(e){ return ''; }
};

// ── a gaveta do negócio ─────────────────────────────────────────────────────
async function abrirNegocio(n){
  negAberto = n;
  document.getElementById('dNum').textContent = n.numero_exibicao || n.numero;
  document.getElementById('dCli').textContent = n.cliente_nome;
  document.getElementById('dSub').textContent = n.coluna
    + (n.numero_exibicao && n.numero_exibicao !== n.numero ? ' · ' + n.numero : '')
    + (n.dias_parado && colunaComContador(n.coluna) ? ' · ' + n.dias_parado + ' dia(s) sem interação' : '');
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('dTabs').innerHTML =
    ['log','cliente','proposta','tarefas','agenda','acoes'].map(t =>
      '<button data-nt="' + t + '"' + (abaNeg===t?' class="on"':'') + '>'
      + ({log:'Histórico',cliente:'Cliente',proposta:'Proposta',tarefas:'Tarefas',
          agenda:'Agenda',acoes:'Ações'})[t]
      + '</button>').join('');
  document.querySelectorAll('#dTabs [data-nt]').forEach(b =>
    b.addEventListener('click', () => { abaNeg = b.dataset.nt; abrirNegocio(negAberto); }));
  document.getElementById('dAcoes').innerHTML = '';
  pintarNeg();
}

async function pintarNeg(){
  const b = document.getElementById('dBody');
  b.innerHTML = '<p class="nota">Carregando…</p>';
  const n = negAberto;
  if (abaNeg === 'log')     return negLog(n, b);
  if (abaNeg === 'cliente')  return negCliente(n, b);
  if (abaNeg === 'proposta') return negPropostas(n, b);
  if (abaNeg === 'tarefas') return negTarefas(n, b);
  if (abaNeg === 'agenda')  return negAgenda(n, b);
  return negAcoes(n, b);
}

// ── ITEM 1 (S28): ANULAR UMA ANOTAÇÃO ───────────────────────────────────────
// O histórico continua sem editar e sem apagar. O que passa a existir é um
// jeito VISÍVEL de dizer "isto estava errado, e o motivo é este": a linha
// fica riscada, com o motivo, quem anulou e quando embaixo.
//
// O botão só aparece onde o banco vai aceitar (`tf_anular_interacao`):
// anotação digitada (não registro do sistema), ainda não anulada, e quem
// está olhando é o autor ou admin. Anotação anulada deixa de contar no card
// — o "Contato realizado" que só existia por causa dela volta para "Leads".
function meuId(){
  try{
    const p = String(sessao.token || '').split('.')[1] || '';
    return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))).sub || null;
  }catch(e){ return null; }
}

function linhaAnotacao(i, depois){
  const el = document.createElement('div');
  el.className = 'ev ' + (i.tipo || '') + (i.anulada ? ' anulada' : '')
               + (i.automatica ? ' auto' : '');
  el.innerHTML = '<div class="quando"></div><div class="txt"></div><div class="quem"></div>';
  el.querySelector('.quando').textContent =
    new Date(i.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    + (i.automatica ? ' · registro do sistema' : '');
  el.querySelector('.txt').textContent = i.texto;
  el.querySelector('.quem').textContent = i.quem + (i.canal ? ' · ' + i.canal : '');
  if (i.anulada){
    const a = document.createElement('div');
    a.className = 'anuladaMotivo';
    a.innerHTML = '<b>ANULADA</b> <span></span>';
    a.querySelector('span').textContent = '— ' + (i.anulado_motivo || '') + ' · '
      + (i.anulado_por_nome || '') + ', '
      + new Date(i.anulado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    el.appendChild(a);
  } else if (!i.automatica && !DEMO && (sessao.admin || (i.quem_id && i.quem_id === meuId()))){
    const b = document.createElement('button');
    b.className = 'btn mini evAnular'; b.type = 'button'; b.textContent = 'anular';
    b.title = 'Marcar esta anotação como errada — ela continua aqui, riscada, com o motivo';
    b.addEventListener('click', () => modalAnular(i, depois));
    el.querySelector('.quem').appendChild(b);
  }
  return el;
}

function modalAnular(i, depois){
  abrirModal('Anular anotação',
      '<div class="aviso">A anotação <b>não some</b>: fica no histórico, riscada, com o '
    + 'motivo, o seu nome e a hora. Não dá para desfazer — se a anulação for o engano, '
    + 'escreva uma anotação nova dizendo isso.</div>'
    + '<blockquote class="citaAnular"></blockquote>'
    + '<div class="campo"><label for="anMot">Por que ela está errada?</label>'
    + '<textarea id="anMot" rows="3" placeholder="ex.: falei com o João, não com o Pedro"></textarea></div>'
    + '<div class="dica" id="anMsg" style="color:var(--crit)"></div>',
    [{ label:'Cancelar', onClick: () => fecharModal() },
     { label:'Anular', pri:true, onClick: async () => {
        const mot = (document.getElementById('anMot').value || '').trim();
        const msg = document.getElementById('anMsg');
        if (mot.length < 5){ msg.textContent = 'Escreva o motivo — ele fica visível junto da anotação.'; return; }
        try{
          await rpc('tf_anular_interacao', { p_id: i.id || i.interacao_id, p_motivo: mot });
          fecharModal();
          toast('Anotação anulada. Ela continua no histórico, riscada.','ok');
          if (typeof pintarComercial === 'function' && visao === 'com') await pintarComercial();
          if (depois) depois();
        }catch(e){ msg.textContent = e.message; }
     }}]);
  document.querySelector('#modal .citaAnular').textContent = i.texto;
}

// ── agenda ──────────────────────────────────────────────────────────────────
// ── ITEM 7 (S36): QUEM VAI NA VISITA ────────────────────────────────────────
// Até o S35 o campo era só "Equipe" (Administrativa / Inspeção 1 / Inspeção 2),
// e a visita não aparecia na agenda de ninguém. A lista de PESSOAS já existia
// na tabela (`agendamentos.responsaveis`, desde o 19_) e ninguém a preenchia.
// Agora a tela preenche, e a Agenda da equipe lê: cada pessoa marcada vê a
// visita no dia dela, e a duração entra na carga. A equipe ficou como campo
// opcional — é o que o aviso de choque de horário por grupo ainda usa.
// ITEM 3 (S37): a duração da visita era uma lista fechada de horas (30 min,
// 1h, 1h30, 2h…) e uma visita de 96 minutos não tinha opção. Agora é o mesmo
// campo das tarefas — minutos digitados —, com a leitura "1h36min" ao lado
// para quem pensa em horas. Passo de 1 minuto (a tarefa usa 5): 96 é um
// número real que o Bruno citou, e o navegador recusaria com passo 5.
function campoDuracaoVisita(id, valor){
  const v = Number(valor || 120);
  return '<div class="campo"><label for="' + id + '">Duração (minutos)</label>'
    + '<input id="' + id + '" type="number" min="5" max="1440" step="1" inputmode="numeric" value="' + v + '">'
    + '<small class="nota durLeitura" id="' + id + 'Txt">= ' + minHora(v) + '</small></div>';
}
function ligarDuracaoVisita(id){
  const i = document.getElementById(id), t = document.getElementById(id + 'Txt');
  if (!i || !t) return;
  i.addEventListener('input', () => {
    const m = Math.round(Number(i.value || 0));
    t.textContent = (m >= 5 && m <= 1440) ? '= ' + minHora(m) : 'entre 5 e 1440 minutos';
  });
}
/** Lê e confere o campo. Devolve null (com o aviso) quando não serve. */
function lerDuracaoVisita(id){
  const m = Math.round(Number((document.getElementById(id) || {}).value || 0));
  if (!(m >= 5 && m <= 1440)){ toast('A duração vai de 5 a 1440 minutos (o dia inteiro).','err'); return null; }
  return m;
}

function caixasPessoas(prefixo, marcados){
  const m = (marcados || []).map(String);
  return '<div class="apoioLista pessoasVis">' + (EQUIPE || []).map(u =>
      '<label class="linhaOpc apoioOpc"><input type="checkbox" class="' + prefixo + '" value="' + esc(u.id) + '"'
    + (m.indexOf(String(u.id)) >= 0 ? ' checked' : '') + '> <span>' + esc(u.nome) + '</span></label>').join('')
    + '</div>';
}

async function negAgenda(n, b){
  let itens = [];
  try{
    itens = DEMO ? demoAgenda(n.id)
      : await get('agendamentos?select=*&negocio_id=eq.' + n.id + '&cancelado_em=is.null&order=inicio');
  }catch(e){ toast(e.message,'err'); }

  b.innerHTML = '<div class="campo"><label for="agT">Título</label>'
    +   '<input id="agT" type="text" value="Visita técnica — ' + esc(n.cliente_nome) + '"></div>'
    + '<div class="dupla"><div class="campo"><label for="agD">Quando</label>'
    +   '<input id="agD" type="datetime-local"></div>'
    + campoDuracaoVisita('agDur', 120) + '</div>'
    + '<fieldset class="grupoOpc"><legend>Quem vai</legend>' + caixasPessoas('agP', [])
    +   '<small class="nota">A visita entra na Agenda de cada pessoa marcada e ocupa o tempo dela.</small></fieldset>'
    // ITEM 2 (S37): o campo "Equipe (opcional)" saiu. Era o resto de antes do
    // "Quem vai" por pessoa (S36) e deixava marcar pessoas de verdade e, ao
    // lado, uma categoria genérica sem relação nenhuma. A coluna
    // `agendamentos.equipe_id` continua no banco: as visitas antigas, que só
    // tinham equipe, seguem aparecendo — só não se cria mais visita nova assim.
    + '<div class="campo"><label for="agL">Local</label><input id="agL" type="text"></div>'
    + '<button class="btn pri" id="agOk" style="width:100%">Agendar</button>'
    + '<p class="nota">O compromisso fica preso a este negócio. A agenda do Google continua '
    + 'sendo a do celular — o espelho para lá entra numa próxima rodada.</p>'
    + '<div class="secTit">Já agendado</div><div id="agLista"></div>';

  ligarDuracaoVisita('agDur');
  const L = document.getElementById('agLista');
  if (!itens.length) L.innerHTML = '<p class="nota">Nada marcado.</p>';
  itens.forEach(a => {
    const el = document.createElement('div');
    el.className = 'agItem';
    el.innerHTML = '<b></b><small></small><small class="agQuem"></small>'
      + (podeEscritorio() && !DEMO ? '<button class="btn mini" type="button">quem vai</button>' : '');
    el.querySelector('b').textContent = a.titulo;
    const fimTxt = a.fim ? ' até ' + new Date(a.fim).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
    el.querySelectorAll('small')[0].textContent =
      new Date(a.inicio).toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
      + fimTxt + (a.local ? ' · ' + a.local : '');
    const nomes = (a.responsaveis || []).map(id => NOMES[id] || '?');
    el.querySelector('.agQuem').textContent = nomes.length ? 'Vão: ' + nomes.join(', ')
      : 'Ninguém marcado — não aparece na agenda de ninguém';
    const bt = el.querySelector('button');
    if (bt) bt.addEventListener('click', () => modalPessoasVisita(a, n));
    L.appendChild(el);
  });

  document.getElementById('agOk').addEventListener('click', async (e) => {
    const q = document.getElementById('agD').value;
    if (!q){ toast('Escolha a data e a hora.','err'); return; }
    const quem = [...document.querySelectorAll('.agP:checked')].map(c => c.value);
    if (!quem.length){ toast('Marque quem vai.','err'); return; }
    const dur = lerDuracaoVisita('agDur');
    if (dur === null) return;
    e.target.disabled = true;
    const ini = new Date(q);
    const fim = new Date(ini.getTime() + dur * 60000);
    try{
      const r = DEMO ? {conflitos:[]} : await rpc('tf_agendar', {
        p_titulo: document.getElementById('agT').value.trim() || 'Visita',
        p_inicio: ini.toISOString(), p_fim: fim.toISOString(),
        p_equipe_id: null, p_negocio_id: n.id,
        p_local: document.getElementById('agL').value.trim() || null,
        p_responsaveis: quem });
      const c = (r && r.conflitos) || [];
      const quemChoca = [...new Set(c.map(x => x.quem).filter(Boolean))].join(', ');
      toast(c.length
        ? 'Agendado — atenção: ' + (quemChoca || 'a equipe') + ' já tem compromisso nesse horário.'
        : 'Agendado.', c.length ? 'err' : 'ok');
      AGENDA.chave = null;   // a Agenda da equipe precisa ler de novo
      await pintarComercial();
      const at = negocios.find(x => x.id === n.id);
      if (at){ negAberto = at; pintarNeg(); }
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });
}

/** Trocar quem vai numa visita já marcada (as de antes do S36 só tinham equipe). */
function modalPessoasVisita(a, n){
  const durAtual = a.fim ? Math.round((new Date(a.fim) - new Date(a.inicio)) / 60000) : 60;
  abrirModal('Quem vai · ' + a.titulo,
      caixasPessoas('mpv', a.responsaveis || [])
    + '<div style="margin-top:10px">' + campoDuracaoVisita('mpvDur', durAtual) + '</div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Gravar', pri:true, onClick: async () => {
        const quem = [...document.querySelectorAll('.mpv:checked')].map(c => c.value);
        const dur = lerDuracaoVisita('mpvDur');
        if (dur === null) return;
        try{
          const r = await rpc('tf_agendamento_pessoas', { p_id: a.id, p_responsaveis: quem,
            p_fim: new Date(new Date(a.inicio).getTime() + dur * 60000).toISOString() });
          fecharModal();
          toast(r.nomes ? 'Vão: ' + r.nomes + '.' : 'Ninguém marcado na visita.', 'ok');
          AGENDA.chave = null;
          pintarNeg();
        }catch(e){ toast(e.message,'err'); }
     }}]);
  ligarDuracaoVisita('mpvDur');
}

// ── A PROPOSTA MONTADA NO NEGÓCIO ───────────────────────────────────────────
// Fecha o caminho da inspeção: o comercial monta a proposta antes de existir
// OS, o cliente responde, e só então a OS de execução nasce — já com os itens
// que ele comprou dentro.
//
// De onde vêm os itens: dos EQUIPAMENTOS já cadastrados do cliente (é a fonte
// boa — o cadastro tem TAG, tipo e PMTA, e o vaso inspecionado ano passado é o
// mesmo deste ano) e de LINHAS DIGITADAS, para cliente novo, equipamento ainda
// não cadastrado, ou serviço que não é equipamento. As duas na mesma tela: só
// a primeira trava quem ainda não cadastrou, só a segunda joga fora um cadastro
// de 519 clientes.
let _propItens = [];       // o que está sendo montado agora
let _propLimpa = false;    // "começar vazia": a próxima montagem não carrega a vigente

async function negPropostas(n, b){
  b.innerHTML = '<p class="nota">Carregando…</p>';
  if (DEMO){
    b.innerHTML = '<div class="aviso">No modo demonstração esta aba não monta proposta — '
      + 'ela depende dos equipamentos cadastrados do cliente no banco real.</div>'
      + '<p class="nota">O que ela faz: você marca os equipamentos do cliente, acrescenta '
      + 'linhas digitadas se precisar, põe o preço de cada um e registra o número da '
      + 'proposta. Depois o cliente responde aqui mesmo, e a OS nasce com os itens dentro.</p>';
    return;
  }

  let props = [];
  try{ props = await get('v_propostas_negocio?select=*&negocio_id=eq.' + n.id
                         + '&order=emitida_em.desc'); }
  catch(e){
    b.innerHTML = '<div class="aviso"><b>Não deu para carregar as propostas.</b><br>'
      + esc(e.message) + '</div>'; return;
  }

  const aprovadaSemOS = props.find(p =>
    (p.status === 'aprovada' || p.status === 'aprovada_parcial') && !p.os_id);

  let h = '';
  if (props.length){
    h += '<div class="secTit" style="margin-top:0">Propostas deste negócio</div>'
      +  '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
      +  '<th>Número</th><th>Status</th><th class="num">Valor</th>'
      +  '<th>Itens</th><th>Documento</th><th></th></tr></thead><tbody>'
      + props.map(p => '<tr>'
          + '<td class="mono">' + esc(p.numero_exibicao || rotuloProposta(p.numero, p.versao)) + '</td>'
          + '<td>' + esc(p.status) + (p.os ? ' · OS ' + esc(p.os) : '') + '</td>'
          + '<td class="num">' + BRL(p.valor_total) + '</td>'
          + '<td class="num">' + p.itens + '</td>'
          // S28: "Registrar envio" continua aparecendo sem documento (a proposta
          // pode ter sido feita no sistema de sempre) — mas a linha diz se o
          // TapFlow gerou o papel
          + '<td class="docCel">' + (p.documentos
              ? 'gerado ' + esc(dataBR(String(p.ultimo_documento_em || '').slice(0,10)))
              : '<span class="nota">—</span>') + '</td>'
          + '<td class="acoesPropTd" data-p="' + esc(p.id) + '"></td></tr>').join('')
      + '</tbody></table></div>';
  } else {
    h += '<p class="nota">Nenhuma proposta ainda. Monte a primeira abaixo — ou, se este '
      +  'serviço precisa de levantamento em campo antes de orçar, abra a OS de '
      +  'fornecimento pela aba Ações.</p>';
  }

  // ── a OS nasce daqui ──
  if (aprovadaSemOS){
    h += '<div class="aviso ok"><b>' + esc(rotuloProposta(aprovadaSemOS.numero, aprovadaSemOS.versao)) + ' foi aprovada e ainda '
      +  'não virou OS.</b> Abrir a OS traz os ' + aprovadaSemOS.itens + ' item(ns) para '
      +  'dentro dela, já aprovados — ninguém redigita o que o cliente comprou.</div>'
      +  '<div class="campo"><label for="npTipo">Tipo de serviço</label>'
      +  '<select id="npTipo"></select></div>'
      +  '<button class="btn pri" id="npAbrirOS" style="width:100%;margin-bottom:20px">'
      +  'Abrir OS a partir desta proposta</button>';
  }

  // ── gerar o documento (item 4, S28) ──
  // Fechado por padrão: o gerador baixa o modelo (~450 KB) e busca a logo, e
  // quem abriu a aba para montar ou responder não precisa pagar por isso.
  if (props.length){
    const aberto = !!_msgGerNeg || _gerNegAberto === n.id;
    h += '<details class="gerDet" id="npGerDet"' + (aberto ? ' open' : '') + '>'
      +  '<summary><span class="secTit" style="margin:0">Gerar o documento (.docx)</span>'
      +  '<span class="nota">a partir da proposta registrada — com os dados e a logomarca do cliente</span></summary>'
      +  '<div id="npGer"><p class="nota">Carregando os modelos…</p></div></details>';
  }

  // ── montar uma nova ──
  h += '<div class="secTit">Montar uma proposta</div>'
    +  '<p class="nota">A proposta é feita no sistema de sempre; aqui se registra o número '
    +  'e o que foi ofertado. É esse escopo que a resposta do cliente aplica, item a item.</p>'
    +  '<div id="npMonta"></div>';

  b.innerHTML = h;

  // botões de ação por proposta
  b.querySelectorAll('[data-p]').forEach(td => {
    const p = props.find(x => x.id === td.dataset.p);
    if (!p) return;
    const ctx = { os_id: p.os_id, negocio_id: n.id, cliente_id: p.cliente_id,
                  numero: n.numero, cliente: p.cliente };
    // ITEM 5 (S29): os dois botões empilhados numa coluna, com a MESMA largura
    const pilha = document.createElement('div');
    pilha.className = 'acoesProp';
    if (p.status === 'emitida'){
      const b1 = document.createElement('button');
      b1.className = 'btn mini'; b1.type = 'button'; b1.textContent = 'Registrar envio';
      b1.addEventListener('click', () => modalEnvioProposta(ctx, p));
      pilha.appendChild(b1);
    }
    if ((p.status === 'emitida' || p.status === 'enviada')){
      const b2 = document.createElement('button');
      b2.className = 'btn mini pri'; b2.type = 'button'; b2.textContent = 'Resposta do cliente';
      b2.addEventListener('click', () => modalAprovacao(ctx, null, p));
      pilha.appendChild(b2);
    }
    if (pilha.children.length) td.appendChild(pilha);
    else if (p.respondida){
      td.innerHTML = seloAprov(p.resposta);
    }
  });

  if (aprovadaSemOS){
    const selT = document.getElementById('npTipo');
    let tipos = [];
    try{ tipos = await get('tipos_os?select=id,nome&ativo=eq.true&order=nome'); }
    catch(e){ tipos = [{ id:'INSPECAO', nome:'Inspeção NR-13' }]; }
    tipos.forEach(t => { const o = document.createElement('option');
      o.value = t.id; o.textContent = t.nome;
      if (t.id === 'INSPECAO') o.selected = true;
      selT.appendChild(o); });

    const bA = document.getElementById('npAbrirOS');
    bA.addEventListener('click', () => _semDuploEnvio_(bA, async () => {
      try{
        const r = await rpc('tf_negocio_abrir_os_da_proposta',
          { p_negocio_id: n.id, p_tipo_os_id: selT.value,
            p_client_uid: 'prop-' + aprovadaSemOS.id });
        toast('OS ' + (r.numero||'') + ' aberta com ' + (r.itens||0) + ' item(ns).','ok');
        fecharDrawer(); await carregar();
      }catch(e){ toast(e.message,'err'); }
    }));
  }

  const cxGer = document.getElementById('npGer'), detGer = document.getElementById('npGerDet');
  if (cxGer && detGer){
    let montado = false;
    const monta = () => { if (montado || !detGer.open) return; montado = true;
                          _gerNegAberto = n.id; montarGeradorNegocio(cxGer, n, props); };
    detGer.addEventListener('toggle', () => { if (!detGer.open) _gerNegAberto = null; monta(); });
    monta();
  }
  await montarProposta(n, props);
}
