// COMPRAS — a lista que substitui "acompanhar de memória"
// ════════════════════════════════════════════════════════════════════════════
async function pintarCompras(){
  const board = document.getElementById('board');
  board.innerHTML = '<div class="comWrap"><div class="barraCom">'
    + '<b style="font-size:15px">Compras em andamento</b>'
    + '<span class="resumoCom" id="cprResumo"></span></div>'
    + '<div class="comBoard" style="overflow:auto"><div id="cprLista" '
    + 'style="max-width:1000px;padding-bottom:30px"></div></div></div>';

  let todos = [];
  try{ todos = DEMO ? demoCompras() : await get('v_compras?select=*'); }
  catch(e){ toast(e.message,'err'); return; }

  REPINTA.cpr = () => desenharCompras(todos);
  desenharCompras(todos);
}

function desenharCompras(todos){
  const q = BUSCA.cpr || '';
  const itens = !q ? todos : todos.filter(i => casa(
    // era `i.os_numero`, que a view não devolve: virava a string "undefined" e
    // buscar pelo número da OS nunca achava nada — justo o que o placeholder promete
    [i.descricao, i.os, i.cliente, i.fornecedor, i.pedido_numero, i.situacao].join(' '), q));

  const atras = itens.filter(i => i.situacao === 'atrasado');
  // o contador da lateral mostra o que dói: atrasado, não o total
  const nCpr = document.getElementById('nCpr');
  if (nCpr){
    const nAtr = todos.filter(i => i.situacao === 'atrasado').length;
    nCpr.textContent = nAtr || '';
    nCpr.classList.toggle('alerta', nAtr > 0);
  }
  const elRes = document.getElementById('cprResumo');
  if (!elRes) return;    // a pessoa trocou de tela durante o carregamento
  elRes.innerHTML = itens.length
    ? itens.length + ' item(ns) · ' + (atras.length
        ? '<b style="color:var(--crit)">' + atras.length + ' atrasado(s)</b>' : 'nenhum atrasado')
    : '';

  const L = document.getElementById('cprLista');
  if (!itens.length){
    L.innerHTML = q
      ? '<div class="vazio2"><b>Nada com essa busca</b><p>' + todos.length
        + ' item(ns) em compra não casam com o que você digitou.</p></div>'
      : '<p class="nota">Nada em compra. Itens entram aqui quando a origem é '
        + '“comprar” e o cliente aprovou.</p>';
    return;
  }

  // atrasados primeiro: é o que precisa de telefonema hoje
  const ordem = { 'atrasado':0, 'chega logo':1, 'no prazo':2, 'sem previsão':3, 'recebido':4 };
  // situação fora do mapa dava `undefined - undefined` = NaN, e comparador que
  // devolve NaN embaralha a lista — o agrupamento por seção repetia cabeçalho
  itens.sort((a,b) => ((ordem[a.situacao] ?? 99) - (ordem[b.situacao] ?? 99))
                   || ((Number(b.dias_atraso)||0) - (Number(a.dias_atraso)||0)));

  let sit = null;
  itens.forEach(i => {
    if (i.situacao !== sit){
      sit = i.situacao;
      const h = document.createElement('div');
      h.className = 'secTit';
      h.textContent = ({atrasado:'Atrasados', 'chega logo':'Chegam nos próximos 3 dias',
        'no prazo':'No prazo', 'sem previsão':'Sem previsão de entrega',
        recebido:'Recebidos'})[sit] || sit;
      L.appendChild(h);
    }
    const el = document.createElement('div');
    el.className = 'linhaCompra ' + i.situacao.replace(/\s/g,'-');
    el.innerHTML = '<div><b></b><small></small></div><div class="dt"></div>';
    el.querySelector('b').textContent = i.descricao;
    el.querySelector('small').textContent = i.os + ' · ' + i.cliente
      + (i.fornecedor ? ' · ' + i.fornecedor : ' · sem fornecedor')
      + (i.pedido_numero ? ' · ' + i.pedido_numero : '');
    el.querySelector('.dt').innerHTML = i.recebido_em
      ? 'recebido<br><b>' + new Date(i.recebido_em+'T12:00').toLocaleDateString('pt-BR') + '</b>'
      : (i.previsto_para
          ? (i.dias_atraso > 0 ? '<b class="atr">' + i.dias_atraso + ' dias<br>de atraso</b>'
                               : 'previsto<br><b>' + new Date(i.previsto_para+'T12:00').toLocaleDateString('pt-BR') + '</b>')
          : '<span class="nota">sem data</span>');
    L.appendChild(el);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// COMERCIAL — o quadro que substitui o Trello
// ----------------------------------------------------------------------------
// Oito colunas, e a coluna é DERIVADA dos fatos, igual ao quadro das OS.
// Não existe arrastar aqui também: registrar um contato move o card de "Leads"
// para "Contato realizado", e nada mais move.
//
// No Trello dá para puxar um card para "Proposta enviada" sem ter enviado nada.
// A partir daí o quadro mente — e quadro que mente é pior que quadro nenhum,
// porque as decisões passam a ser tomadas em cima dele.
// ════════════════════════════════════════════════════════════════════════════
let COLS_COM = [];
let negocios = [];
let negAberto = null;
let abaNeg = 'log';

async function pintarComercial(){
  visao = 'com';
  const board = document.getElementById('board');
  // `main` já rola na horizontal e não rola na vertical. A barra precisa ficar
  // FORA desse rolamento, senão ela sai da tela junto com as colunas.
  board.innerHTML = '<div class="comWrap">'
    + '<div class="barraCom">'
    +   '<button class="btn pri" id="cNovo">+ Novo negócio</button>'
    +   '<span class="resumoCom" id="cResumo"></span></div>'
    + '<div class="comBoard"><div class="board" id="qCom"></div></div></div>';

  document.getElementById('cNovo').addEventListener('click', formNegocio);
  REPINTA.com = desenharCom;

  try{
    if (DEMO){ COLS_COM = demoColsCom(); negocios = demoNegocios(); }
    else {
      const [c, n] = await Promise.all([
        get('colunas_comercial?select=*&order=ordem'),
        get('v_negocios_kanban?select=*&order=coluna_ordem,dias_parado.desc')
      ]);
      COLS_COM = c; negocios = n;
    }
  }catch(e){ toast(e.message,'err'); return; }
  desenharCom();
}

function desenharCom(){
  const q = document.getElementById('qCom');
  if (!q) return;
  const busca = BUSCA.com || '';
  const vis = negocios.filter(n =>
    casa([n.numero, n.cliente_nome, n.titulo, n.coluna, n.contato_nome].join(' '), busca));
  const total = vis.reduce((s,n) => s + Number(n.valor_propostas || n.valor_estimado || 0), 0);
  document.getElementById('cResumo').textContent =
    vis.length + (busca && vis.length !== negocios.length ? ' de ' + negocios.length : '')
    + ' negócio(s) · ' + BRL(total) + ' em jogo';
  const nc = document.getElementById('nCom');
  if (nc) nc.textContent = negocios.length || '';

  q.innerHTML = '';
  // As colunas vêm da tabela, não das linhas: coluna vazia CONTINUA no quadro.
  // Coluna que some quando esvazia esconde justamente a etapa em que ninguém
  // está trabalhando — que costuma ser a que precisa de atenção.
  COLS_COM.forEach(col => {
    const doCol = vis.filter(n => n.coluna === col.nome);
    const el = document.createElement('div');
    el.className = 'colCom';
    el.innerHTML = '<div class="colTit"><b></b><span class="cnt"></span></div>'
                 + '<div class="colSub"></div><div class="colBody"></div>';
    el.querySelector('b').textContent = col.nome;
    el.querySelector('.cnt').textContent = doCol.length;
    el.querySelector('.colSub').textContent = col.descricao || '';
    const body = el.querySelector('.colBody');

    if (!doCol.length){
      const v = document.createElement('p');
      v.className = 'colVazia'; v.textContent = 'nada aqui';
      body.appendChild(v);
    }
    doCol.forEach(n => body.appendChild(cardNegocio(n)));
    q.appendChild(el);
  });
}

function cardNegocio(n){
  const d = document.createElement('button');
  d.className = 'cardCom';
  const parado = Number(n.dias_parado || 0);
  const alerta = parado >= 14 ? ' parado' : (parado >= 7 ? ' morno' : '');
  d.className += alerta;

  let logo = '';
  if (n.logomarca_url) logo = '<img class="logo" alt="" src="' + esc(n.logomarca_url) + '">';

  const chips = [];
  if (n.tarefas_atrasadas) chips.push('<span class="mini crit">' + n.tarefas_atrasadas + ' tarefa(s) atrasada(s)</span>');
  else if (n.tarefas_abertas) chips.push('<span class="mini">' + n.tarefas_abertas + ' tarefa(s)</span>');
  if (n.proxima_agenda) chips.push('<span class="mini ag">' + dataCurta(n.proxima_agenda) + '</span>');
  if (n.e_contrato) chips.push('<span class="mini ct">contrato</span>');
  if (parado >= 7) chips.push('<span class="mini ' + (parado>=14?'crit':'warn') + '">' + parado + 'd parado</span>');

  d.innerHTML = logo
    + '<div class="num"></div><div class="cli"></div><div class="tit"></div>'
    + '<div class="valor"></div><div class="chips">' + chips.join('') + '</div>';
  d.querySelector('.num').textContent = n.numero;
  d.querySelector('.cli').textContent = n.cliente_nome;
  d.querySelector('.tit').textContent = n.titulo;
  const v = Number(n.valor_propostas || 0) || Number(n.valor_estimado || 0);
  d.querySelector('.valor').textContent = v
    ? BRL(v) + (Number(n.valor_propostas) ? '' : ' (estimado)') : '';
  d.addEventListener('click', () => abrirNegocio(n));
  return d;
}

const dataCurta = s => {
  try{ return new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }
  catch(e){ return ''; }
};

// ── a gaveta do negócio ─────────────────────────────────────────────────────
async function abrirNegocio(n){
  negAberto = n;
  document.getElementById('dNum').textContent = n.numero;
  document.getElementById('dCli').textContent = n.cliente_nome;
  document.getElementById('dSub').textContent = n.coluna
    + (n.dias_parado ? ' · ' + n.dias_parado + ' dia(s) sem novidade' : '');
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('dTabs').innerHTML =
    ['log','tarefas','agenda','acoes'].map(t =>
      '<button data-nt="' + t + '"' + (abaNeg===t?' class="on"':'') + '>'
      + ({log:'Histórico',tarefas:'Tarefas',agenda:'Agenda',acoes:'Ações'})[t] + '</button>').join('');
  document.querySelectorAll('#dTabs [data-nt]').forEach(b =>
    b.addEventListener('click', () => { abaNeg = b.dataset.nt; abrirNegocio(negAberto); }));
  document.getElementById('dAcoes').innerHTML = '';
  pintarNeg();
}

async function pintarNeg(){
  const b = document.getElementById('dBody');
  b.innerHTML = '<p class="nota">Carregando…</p>';
  const n = negAberto;
  if (abaNeg === 'log')     return negLog(n, b);
  if (abaNeg === 'tarefas') return negTarefas(n, b);
  if (abaNeg === 'agenda')  return negAgenda(n, b);
  return negAcoes(n, b);
}

// ── histórico: o log que o Bruno pediu ──────────────────────────────────────
async function negLog(n, b){
  let itens = [];
  try{ itens = DEMO ? demoLog(n.id)
      : await get('v_interacoes?select=*&negocio_id=eq.' + n.id + '&order=quando.desc&limit=100'); }
  catch(e){ toast(e.message,'err'); }

  b.innerHTML =
    '<div class="novaNota">'
    + '<textarea id="ntTexto" rows="2" placeholder="O que aconteceu? Ex.: falei com o João Carlos, vamos aguardar a Gerdau."></textarea>'
    + '<div class="linhaNota">'
    +   '<select id="ntTipo">'
    +     '<option value="nota">Anotação</option><option value="contato">Contato</option>'
    +     '<option value="visita">Visita</option><option value="cobranca">Cobrança</option></select>'
    +   '<select id="ntCanal"><option value="">— canal —</option>'
    +     ['telefone','whatsapp','email','presencial','video'].map(c =>
          '<option value="' + c + '">' + c + '</option>').join('') + '</select>'
    +   '<button class="btn pri" id="ntSalvar">Registrar</button>'
    + '</div></div>'
    + '<div class="linhaTempo" id="ltl"></div>';

  const ltl = document.getElementById('ltl');
  if (!itens.length){
    ltl.innerHTML = '<p class="nota">Nada registrado ainda. A primeira anotação move o card '
      + 'de “Leads” para “Contato realizado”.</p>';
  } else {
    itens.forEach(i => {
      const el = document.createElement('div');
      el.className = 'ev ' + i.tipo;
      el.innerHTML = '<div class="quando"></div><div class="txt"></div><div class="quem"></div>';
      el.querySelector('.quando').textContent =
        new Date(i.quando).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      el.querySelector('.txt').textContent = i.texto;
      el.querySelector('.quem').textContent = i.quem + (i.canal ? ' · ' + i.canal : '');
      ltl.appendChild(el);
    });
  }

  document.getElementById('ntSalvar').addEventListener('click', async (e) => {
    const t = document.getElementById('ntTexto').value.trim();
    if (!t){ toast('Escreva o que aconteceu.','err'); return; }
    e.target.disabled = true;
    try{
      if (!DEMO) await rpc('tf_registrar_interacao', { p_negocio_id:n.id, p_texto:t,
        p_tipo: document.getElementById('ntTipo').value,
        p_canal: document.getElementById('ntCanal').value || null });
      toast('Registrado.','ok');
      await pintarComercial();
      const at = negocios.find(x => x.id === n.id);
      if (at) abrirNegocio(at); else fecharDrawer();
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });
}

// ── tarefas ─────────────────────────────────────────────────────────────────
async function negTarefas(n, b){
  let itens = [];
  try{ itens = DEMO ? demoTarefasCom(n.id)
      : await get('tarefas_comerciais?select=*&negocio_id=eq.' + n.id + '&order=concluida_em.nullsfirst,prazo'); }
  catch(e){ toast(e.message,'err'); }

  b.innerHTML = '<button class="btn pri" id="tcNova" style="width:100%;margin-bottom:14px">'
    + 'Nova tarefa</button><div id="tcLista"></div>';
  const L = document.getElementById('tcLista');

      + (!t.concluida_em && t.prazo && t.prazo < new Date().toISOString().slice(0,10) ? ' atrasada' : '');

    const feitos = ck.filter(x => x.ok).length;

      (t.prazo ? 'até ' + new Date(t.prazo+'T12:00').toLocaleDateString('pt-BR') : 'sem prazo')
      + (t.descricao ? ' · ' + t.descricao : '');
    el.querySelector('input').addEventListener('change', async (ev) => {
      try{
        if (!DEMO) await rpc('tf_concluir_tarefa_comercial', { p_id:t.id, p_concluir: ev.target.checked });
        toast(ev.target.checked ? 'Tarefa concluída.' : 'Tarefa reaberta.','ok');

      }catch(err){ toast(err.message,'err'); ev.target.checked = !ev.target.checked; }

let abaCfg = 'usuarios';

async function pintarConfig(){
  visao = 'cfg';
  const board = document.getElementById('board');
  if (!sessao.admin){
    board.innerHTML = '<div class="painel"><h3>Configurações</h3>'
      + '<p class="nota">Esta área é do perfil admin. Fale com o Fernando ou o Bruno.</p></div>';
    return;
  }
  board.innerHTML = '<div class="cfgWrap">'
    + '<div class="chips" id="cfgTabs"></div>'
    + '<div id="cfgCorpo"></div></div>';

  const abas = [['usuarios','Usuários'],['perfis','Perfis'],
                ['docs','Documentos'],['param','Google Drive'],['exc','Exclusões']];
  const t = document.getElementById('cfgTabs');
  abas.forEach(([id,rot]) => {
    const b = document.createElement('button');
    b.className = 'fchip' + (abaCfg === id ? ' on' : '');
    b.textContent = rot;
    b.addEventListener('click', () => { abaCfg = id; pintarConfig(); });
    t.appendChild(b);
  });

  if (abaCfg === 'usuarios') return cfgUsuarios();
  if (abaCfg === 'perfis')   return cfgPerfis();
  if (abaCfg === 'docs')     return cfgDocumentos();
  if (abaCfg === 'param')    return cfgParametros();
  if (abaCfg === 'exc')      return cfgExclusoes();
}

// ── USUÁRIOS ────────────────────────────────────────────────────────────────
async function cfgUsuarios(){
  const c = document.getElementById('cfgCorpo');
  c.innerHTML = '<p class="nota">Carregando…</p>';

  let users = [], perfis = [], pendentes = [];
  try{
    if (DEMO){ users = demoUsuarios(); perfis = demoPerfis(); pendentes = []; }
    else [users, perfis, pendentes] = await Promise.all([
      get('v_usuarios?select=*&order=ativo.desc,nome'),
      get('v_perfis?select=*&ativo=is.true&order=id'),
      rpc('tf_logins_sem_perfil', {})
    ]);
  }catch(e){ c.innerHTML = ''; toast(e.message,'err'); return; }

  let h = '<div class="painel"><h3>Quem usa o TapFlow</h3>';

  // logins criados no Supabase que ainda não têm perfil
  if (pendentes && pendentes.length){
    h += '<div class="aviso"><b>' + pendentes.length + ' login(s) sem perfil.</b> '
      + 'Foram criados na Authentication do Supabase mas ainda não entram no sistema — '
      + 'quem manda no acesso é esta lista, não o login.</div>';
    pendentes.forEach(p => {
      h += '<div class="linhaU pend"><div><b>' + esc(p.email) + '</b>'
        + '<small>' + (p.confirmado ? 'e-mail confirmado' : '⚠ e-mail NÃO confirmado — não consegue entrar') + '</small></div>'
        + '<div class="acoesU">'
        +   '<input class="mini" id="nm_' + p.auth_id + '" placeholder="Nome da pessoa">'
        +   '<select class="mini" id="pf_' + p.auth_id + '">'
        +     perfis.map(x => '<option value="' + x.id + '">' + esc(x.nome) + '</option>').join('')
        +   '</select>'
        +   '<button class="btn pri mini" data-vinc="' + p.auth_id + '">Dar acesso</button>'
        + '</div></div>';
    });
  }

  h += '<div class="secTit">Com acesso</div>';
  users.forEach(u => {
    h += '<div class="linhaU' + (u.ativo ? '' : ' off') + '">'
      + '<div><b>' + esc(u.nome) + (u.sou_eu ? ' <span class="tag">você</span>' : '')
      +   (u.is_admin ? ' <span class="tag adm">admin</span>' : '') + '</b>'
      + '<small>' + esc(u.email||'') + ' · ' + esc(u.perfil||'sem perfil')
      +   (u.tarefas_concluidas ? ' · ' + u.tarefas_concluidas + ' tarefa(s) concluída(s)' : '')
      +   (u.ativo ? '' : ' · DESATIVADO') + '</small></div>'
      + '<div class="acoesU">'
      +   '<select class="mini" data-perfil="' + u.id + '" data-antes="' + esc(u.perfil_id||'') + '"'
      +     ' aria-label="Perfil de ' + esc(u.nome) + '">'
      +     perfis.map(x => '<option value="' + x.id + '"' + (x.id===u.perfil_id?' selected':'') + '>'
              + esc(x.nome) + '</option>').join('') + '</select>'
      +   (u.sou_eu ? '' : '<button class="btn mini" data-ativo="' + u.id + '" data-v="'
              + (u.ativo?'0':'1') + '">' + (u.ativo ? 'Desativar' : 'Reativar') + '</button>')
      + '</div></div>';
  });

  h += '<div class="secTit">Adicionar alguém</div>'
    +  '<p class="nota">O login é criado uma vez, no painel do Supabase: <b>Authentication → '
    +  'Users → Add user</b>, com <b>Auto Confirm User</b> marcado. Assim que existir, ele '
    +  'aparece aqui em cima para você dar o perfil.<br>'
    +  'Desativar aqui fecha o acesso na hora e mantém o histórico com o nome da pessoa — '
    +  'é o que se usa quando alguém sai, não apagar.</p>'
    +  '</div>';

  c.innerHTML = h;

  c.querySelectorAll('[data-vinc]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.vinc;
    const nome = (document.getElementById('nm_'+id)||{}).value || '';
    if (!nome.trim()){ toast('Escreva o nome da pessoa.','err'); return; }
    b.disabled = true;
    try{
      await rpc('tf_vincular_usuario', { p_auth_id:id, p_nome:nome.trim(),
        p_perfil_id: document.getElementById('pf_'+id).value });
      toast('Acesso liberado para ' + nome.trim() + '.','ok'); cfgUsuarios();
    }catch(e){ toast(e.message,'err'); b.disabled = false; }
  }));

  c.querySelectorAll('[data-perfil]').forEach(sel => sel.addEventListener('change', async () => {
    const antes = sel.dataset.antes || '';
    sel.disabled = true;
    try{
      if (!DEMO) await patch('usuarios', 'id=eq.' + sel.dataset.perfil, { perfil_id: sel.value });
      sel.dataset.antes = sel.value;
      toast('Perfil alterado.','ok');
    }catch(e){
      // devolve o <select> ao valor antigo: deixá-lo mostrando o perfil novo
      // depois de a gravação falhar é o app mentindo sobre a permissão da pessoa
      sel.value = antes;
      toast(e.message,'err');
    }
    finally{ sel.disabled = false; }
  }));

  c.querySelectorAll('[data-ativo]').forEach(b => b.addEventListener('click',
    () => _semDuploEnvio_(b, async () => {
      try{
        if (!DEMO) await rpc('tf_usuario_ativo', { p_id:b.dataset.ativo, p_ativo: b.dataset.v === '1' });
        toast(b.dataset.v === '1' ? 'Reativado.' : 'Acesso encerrado.','ok'); cfgUsuarios();
      }catch(e){ toast(e.message,'err'); }
    })));
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };

/* ── FOTO DO ITEM DE CATÁLOGO ───────────────────────────────────────────────
   Duas imagens por item, e a divisão importa:
     · a MINIATURA (data URI, ≤ 60 KB) vive na tabela e desce para o celular —
       é ela que o técnico vê na lista, e precisa funcionar sem sinal;
     · a foto CHEIA fica no bucket privado, e só abre com internet.
   Ninguém precisa de 2 MB para escolher uma peça numa lista.

   A redução acontece AQUI, no navegador, antes de subir. Sem isso alguém sobe
   uma foto de 6 MB do celular e o catálogo inteiro para de sincronizar em campo. */
const FOTO_CACHE = {};   // item_id → data URI, para a lista não repetir consulta

async function fotoDoItem(id){
  if (FOTO_CACHE[id] !== undefined) return FOTO_CACHE[id];
  if (DEMO){ FOTO_CACHE[id] = null; return null; }
  try{
    const r = await get('catalogo_fotos?select=thumb&item_id=eq.' + id + '&limit=1');
    FOTO_CACHE[id] = (r && r[0] && r[0].thumb) || null;
  }catch(e){ FOTO_CACHE[id] = null; }
  return FOTO_CACHE[id];
}

/** Reduz para miniatura: 160px no maior lado. Tenta webp, cai para jpeg. */
function reduzirParaMiniatura(file){
  return new Promise((ok, err) => {
    const fr = new FileReader();
    fr.onerror = () => err(new Error('Não consegui ler a imagem.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => err(new Error('Arquivo não parece uma imagem.'));
      img.onload = () => {
        const max = 160;
        const esc_ = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * esc_));
        const h = Math.max(1, Math.round(img.height * esc_));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = '';
        try{ out = cv.toDataURL('image/webp', 0.8); }catch(e){}
        // Safari antigo devolve PNG quando não sabe webp — e PNG de foto é
        // enorme. Se não veio webp, força jpeg em vez de aceitar o que veio.
        if (!out || out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', 0.7);
        ok(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function montarFoto(item){
  const box = document.getElementById('fFotoBox');
  const inp = document.getElementById('fFotoIn');
  const del = document.getElementById('fFotoDel');
  if (!box || !inp) return;

  const desenhar = (src) => {
    box.innerHTML = '';
    if (src){
      const im = document.createElement('img');
      im.className = 'fotoCat'; im.style.width = '84px'; im.style.height = '84px';
      im.src = src; im.alt = 'Foto de ' + (item.descricao || '');
      box.appendChild(im);
    } else {
      const v = document.createElement('div');
      v.className = 'fotoVazia'; v.style.width = '84px'; v.style.height = '84px';
      v.textContent = 'sem foto';
      box.appendChild(v);
    }
    if (del) del.hidden = !src;
  };
  desenhar(null);
  fotoDoItem(item.id).then(desenhar).catch(() => desenhar(null));

  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)){ toast('Escolha uma imagem.','err'); inp.value=''; return; }
    try{
      const thumb = await reduzirParaMiniatura(f);
      if (thumb.length > 61440)
        throw new Error('Mesmo reduzida a imagem ficou grande demais. Tente uma foto mais simples.');
      await rpc('tf_salvar_foto_item', { p_item_id:item.id, p_thumb:thumb, p_bytes:f.size });
      FOTO_CACHE[item.id] = thumb;
      desenhar(thumb);
      toast('Foto gravada.','ok');
      listarCatalogo();
    }catch(e){ toast(e.message,'err'); }
    finally{ inp.value = ''; }
  });

  if (del) del.addEventListener('click', async () => {
    try{
      await rpc('tf_remover_foto_item', { p_item_id:item.id });
      FOTO_CACHE[item.id] = null; desenhar(null);
      toast('Foto removida.','ok'); listarCatalogo();
    }catch(e){ toast(e.message,'err'); }
  });
}

async function listarCatalogo(){
  const el = document.getElementById('catLista');
  if (!el) return;
  const termo = BUSCA.cat || '';

  // A família filtra no servidor; o texto filtra aqui. O catálogo tem centenas
  // de itens, não milhões — e filtrar aqui deixa a busca igual à do celular,
  // sem acento e por palavra solta.
  let itens = [];
  try{
    if (DEMO) itens = demoCatalogo(catFamSel, '');
    else {
      let q = 'v_catalogo?select=*&order=familia_ordem,codigo';
      if (catFamSel) q += '&familia_id=eq.' + catFamSel;
      itens = await get(q);
    }
  }catch(e){ toast(e.message,'err'); return; }

  const antes = itens.length;
  if (termo) itens = itens.filter(i => casa(
    [i.descricao, i.marca, i.modelo, i.codigo, i.familia,
     Object.values(i.especificacoes||{}).join(' ')].join(' '), termo));

  el.innerHTML = '';
  if (!itens.length){
    el.innerHTML = '<p style="font-size:13px;color:var(--ink-3)">'
      + (termo ? 'Nada encontrado para “' + esc(termo) + '” entre os ' + antes
                 + ' itens desta família.'
               : 'Nenhum item nesta família ainda.')
      + '</p>';
    return;
  }
  itens.forEach(i => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (catEdit && catEdit.id === i.id ? ' on' : '') + (i.ativo ? '' : ' off');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = (i.ativo ? '' : '📦 ') + i.descricao;
    const partes = [i.codigo];
    if (i.marca || i.modelo) partes.push([i.marca, i.modelo].filter(Boolean).join(' '));
    if (i.preco_referencia) partes.push(BRL(i.preco_referencia));
    if (i.vezes_usado) partes.push(i.vezes_usado + '× usado');
    if (!i.ativo) partes.push('arquivado');
    b.querySelector('small').textContent = partes.join(' · ');
    if (i.tem_foto){
      const im = document.createElement('img');
      im.className = 'fotoCat'; im.alt = ''; im.loading = 'lazy';
      // A lista NUNCA espera pela foto: ela é buscada depois, item a item, e
      // encaixa quando chega. Foto que atrasa lista é foto que atrapalha.
      fotoDoItem(i.id).then(src => { if (src) im.src = src; }).catch(()=>{});
      b.insertBefore(im, b.firstChild);
      b.style.display = 'flex'; b.style.gap = '10px'; b.style.alignItems = 'center';
    }
    b.addEventListener('click', () => formCatalogo(i));
    el.appendChild(b);
  });
}

function formCatalogo(item){
  catEdit = item;
  const d = document.getElementById('catDet');
  if (!d) return;

  const famId = item ? item.familia_id : (catFamSel || (CAT_FAM[0]||{}).id);
  const fam = CAT_FAM.find(f => f.id === famId) || { campos: [] };
  const espec = (item && item.especificacoes) || {};

  let h = '<h3>' + (item ? esc(item.codigo) + ' · editar' : 'Novo item de catálogo') + '</h3>';

  if (!item){
    h += '<div class="campo"><label for="fFam">Família</label><select id="fFam">'
      + CAT_FAM.map(f => '<option value="' + f.id + '"' + (f.id===famId?' selected':'') + '>'
          + esc(f.nome) + '</option>').join('') + '</select></div>';
  }

  if (item){
    h += '<div class="campo"><label>Foto</label>'
      +  '<div style="display:flex;gap:10px;align-items:flex-start">'
      +    '<div id="fFotoBox"></div>'
      +    '<div style="flex:1">'
      +      '<input id="fFotoIn" type="file" accept="image/*" style="font-size:12px">'
      +      '<p style="font-size:11.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.45">'
      +        'A foto é <b>deste modelo</b>, não do tipo de peça. Se você trocar a marca '
      +        'ou o modelo, ela cai sozinha — foto de outro modelo na lista do técnico '
      +        'é pior que nenhuma, porque parece certa.<br>'
      +        'A imagem é reduzida aqui no navegador antes de subir.</p>'
      +      '<button class="btn mini" id="fFotoDel" type="button" style="margin-top:8px;margin-left:0">Remover foto</button>'
      +    '</div></div></div>';
  }

  h += '<div class="campo"><label for="fDesc">Descrição</label>'
    +  '<input id="fDesc" type="text" value="' + esc(item ? item.descricao : '') + '"></div>'
    +  '<div class="dupla">'
    +    '<div class="campo"><label for="fMarca">Marca</label><input id="fMarca" type="text" value="'
    +      esc(item ? (item.marca||'') : '') + '"></div>'
    +    '<div class="campo"><label for="fModelo">Modelo</label><input id="fModelo" type="text" value="'
    +      esc(item ? (item.modelo||'') : '') + '"></div></div>';

  // os campos técnicos da família
  if (fam.campos && fam.campos.length){
    h += '<div class="secTit">Detalhes técnicos</div><div class="grelha">';
    fam.campos.forEach(c => {
      const v = espec[c.chave];
      const id = 'esp_' + c.chave;
      h += '<div class="campo"><label for="' + id + '">' + esc(c.rotulo) + '</label>';
      if (c.tipo === 'lista'){
        h += '<select id="' + id + '" data-esp="' + esc(c.chave) + '"><option value=""></option>'
          + (c.opcoes||[]).map(o => '<option' + (v===o?' selected':'') + '>' + esc(o) + '</option>').join('')
          + '</select>';
      } else if (c.tipo === 'booleano'){
        h += '<label class="chk"><input type="checkbox" id="' + id + '" data-esp="' + esc(c.chave) + '"'
          + (v ? ' checked' : '') + '> sim</label>';
      } else {
        h += '<input id="' + id + '" data-esp="' + esc(c.chave) + '" data-tipo="' + esc(c.tipo||'texto')
          + '" type="' + (c.tipo==='numero'?'number':'text') + '" step="any" value="'
          + esc(v==null?'':v) + '">';
      }
      h += '</div>';
    });
    h += '</div>';
  }

  h += '<div class="secTit">Campo e orçamento</div>'
    +  '<div class="dupla">'
    +   '<label class="chk"><input type="checkbox" id="fCalib"'
    +     (item && item.requer_calibracao ? ' checked':'') + '> Requer calibração</label>'
    +   '<label class="chk"><input type="checkbox" id="fLacre"'
    +     (item && item.requer_lacre ? ' checked':'') + '> Requer lacre</label></div>'
    +  '<div class="campo"><label for="fForn">Fornecedor padrão</label><input id="fForn" type="text" value="'
    +    esc(item ? (item.fornecedor_padrao||'') : '') + '"></div>'
    +  '<div class="dupla">'
    +   '<div class="campo"><label for="fCusto">Custo de referência</label><input id="fCusto" type="number" '
    +     'step="0.01" value="' + (item && item.custo_referencia != null ? item.custo_referencia : '') + '"></div>'
    +   '<div class="campo"><label for="fPreco">Preço de referência</label><input id="fPreco" type="number" '
    +     'step="0.01" value="' + (item && item.preco_referencia != null ? item.preco_referencia : '') + '"></div>'
    +  '</div>'
    +  '<p class="nota">Estes valores entram preenchidos quando o item é lançado em campo — '
    +  'para o orçamento começar de algum lugar. Continuam editáveis em cada OS.</p>'
    +  '<div class="campo"><label for="fObs">Observações</label><input id="fObs" type="text" value="'
    +    esc(item ? (item.observacoes||'') : '') + '"></div>';

  h += '<div class="linhaBtns">'
    +  '<button class="btn pri" id="fSalvar">' + (item ? 'Salvar alterações' : 'Adicionar ao catálogo') + '</button>';
  if (item){
    h += '<button class="btn" id="fNovo">Novo item</button>'
      +  '<button class="btn" id="fArquivar">' + (item.ativo ? 'Arquivar' : 'Reativar') + '</button>'
      +  '<button class="btn perigo" id="fExcluir">Excluir</button>';
  }
  h += '</div>';

  if (item && item.vezes_usado){
    h += '<p class="nota">Já lançado em <b>' + item.vezes_usado + '</b> item(ns) de OS. '
      +  'Por isso não pode ser excluído — arquivar tira ele da lista do campo e mantém as OS antigas certas.</p>';
  }

  d.innerHTML = h;

  const fs = document.getElementById('fFam');
  if (fs) fs.addEventListener('change', () => { catFamSel = fs.value; formCatalogo(null); });

  document.getElementById('fSalvar').addEventListener('click', salvarCatalogo);
  if (item) montarFoto(item);
  const bn = document.getElementById('fNovo');
  if (bn) bn.addEventListener('click', () => formCatalogo(null));
  const ba = document.getElementById('fArquivar');
  if (ba) ba.addEventListener('click', () => arquivarCatalogo(item));
  const bx = document.getElementById('fExcluir');
  if (bx) bx.addEventListener('click', () => excluirCatalogo(item));
}

function lerEspecificacoes(){
  const o = {};
  document.querySelectorAll('[data-esp]').forEach(el => {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.dataset.tipo === 'numero') v = el.value === '' ? null : Number(el.value);
    else v = el.value.trim() || null;
    if (v !== null && v !== '' && v !== false) o[el.dataset.esp] = v;
  });
  return o;
}

async function salvarCatalogo(e){
  const desc = document.getElementById('fDesc').value.trim();
  if (!desc){ toast('A descrição é obrigatória.','err'); return; }
  e.target.disabled = true;
  const num = id => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
  const p = {
    p_id: catEdit ? catEdit.id : null,
    p_familia_id: catEdit ? catEdit.familia_id : document.getElementById('fFam').value,
    p_descricao: desc,
    p_marca:  document.getElementById('fMarca').value.trim()  || null,
    p_modelo: document.getElementById('fModelo').value.trim() || null,
    p_especificacoes: lerEspecificacoes(),
    p_requer_calibracao: document.getElementById('fCalib').checked,
    p_requer_lacre:      document.getElementById('fLacre').checked,
    p_fornecedor_padrao: document.getElementById('fForn').value.trim() || null,
    p_custo_referencia: num('fCusto'),
    p_preco_referencia: num('fPreco'),
    p_observacoes: document.getElementById('fObs').value.trim() || null
  };
  try{
    const r = DEMO ? demoSalvarCat(p) : await rpc('tf_salvar_item_catalogo', p);
    toast(catEdit ? 'Item atualizado.' : 'Item ' + (r.codigo||'') + ' adicionado.', 'ok');
    catEdit = null;
    await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
}

async function arquivarCatalogo(item){
  try{
    if (DEMO) demoArquivarCat(item); 
    else await rpc('tf_arquivar', { p_tabela:'catalogo_itens', p_id:item.id, p_ativo: !item.ativo });
    toast(item.ativo ? 'Item arquivado — sai da lista do campo.' : 'Item reativado.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function excluirCatalogo(item){
  if (!confirm('Excluir "' + item.descricao + '" do catálogo?\n\nIsso é definitivo. '
      + 'Se o item já foi usado em alguma OS, o sistema vai recusar e sugerir arquivar.')) return;
  try{
    const r = DEMO ? demoExcluirCat(item) : await rpc('tf_excluir_item_catalogo', { p_id: item.id });
    if (r && r.status === 'recusado'){ toast(r.mensagem, 'err'); return; }
    toast('Item excluído.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function pintarCadastros(){
  visao = 'cad';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="cadWrap">'
    + '<div class="painel"><h3>Clientes <span class="conta" id="cadConta"></span></h3>'
    +   '<div id="cadForm"></div><div class="lista" id="cadLista"></div></div>'
    + '<div class="painel" id="cadDet"><p style="color:var(--ink-3);font-size:13.5px;margin:0">'
    + 'Escolha um cliente à esquerda para ver contatos e equipamentos.</p></div></div>';

  document.getElementById('cadForm').innerHTML =
    '<div class="dupla"><div class="campo"><label for="cN">Nome</label><input id="cN" type="text"></div>' +
    '<div class="campo"><label for="cC">CNPJ</label><input id="cC" type="text" placeholder="opcional"></div></div>' +
    '<button class="btn pri" id="cAdd" style="width:100%;padding:9px;margin-bottom:14px">Adicionar cliente</button>';

  document.getElementById('cAdd').addEventListener('click', async (e) => {
    const nome = document.getElementById('cN').value.trim();
    if (!nome){ toast('Informe o nome do cliente.','err'); return; }
    e.target.disabled = true;
    try{
      const cnpj = document.getElementById('cC').value.trim() || null;
      if (DEMO) demoAddCliente(nome, cnpj); else await post('clientes', { nome, cnpj });
      toast('Cliente cadastrado.','ok');
      pintarCadastros();
    }catch(err){
      toast(/duplicate|unique|ux_clientes/i.test(err.message)
        ? 'Já existe um cliente com esse CNPJ.' : err.message, 'err');
      e.target.disabled = false;
    }
  });

  let todos = [];
  try{ todos = DEMO ? demoClientes()
      : await get('clientes?select=id,nome,cnpj,cidade,observacoes,contatos(count),equipamentos(count)'
                  + '&ativo=eq.true&order=nome&limit=2000'); }
  catch(e){
    // sem `return`, seguia com a lista vazia e escrevia "Nenhum cliente ainda"
    // em cima de uma falha de rede — com 516 clientes cadastrados
    const l = document.getElementById('cadLista');
    if (l){ l.innerHTML = '<div class="vazio2" style="padding:22px 8px;text-align:left">'
      + '<b>Não deu para carregar os clientes</b><p class="mt"></p>'
      + '<button class="btn" id="cadRetry" style="margin-top:12px">Tentar de novo</button></div>';
      l.querySelector('.mt').textContent = e.message;
      document.getElementById('cadRetry').addEventListener('click', pintarCadastros);
    }
    toast(e.message,'err');
    return;
  }

  // Com 516 clientes importados, listar todos era rolar por dois minutos até
  // achar um. A busca é o caminho normal aqui, não o atalho.
  REPINTA.cad = () => desenharClientes(todos);
  desenharClientes(todos);
}

function desenharClientes(todos){
  const lista = document.getElementById('cadLista');
  if (!lista) return;              // trocou de tela durante o carregamento
  const q = BUSCA.cad || '';
  const cli = !q ? todos : todos.filter(c => casa(
    [c.nome, c.cnpj, c.cidade, c.observacoes].join(' '), q));

  lista.innerHTML = '';
  const cab = document.getElementById('cadConta');
  if (cab) cab.textContent = q
    ? cli.length + ' de ' + todos.length + ' clientes'
    : todos.length + ' cliente(s)';

  if (!cli.length){
    lista.innerHTML = q
      ? '<div class="vazio2" style="padding:24px 10px"><b>Nada com essa busca</b>'
        + '<p>Nenhum dos ' + todos.length + ' clientes casa com o que você digitou.</p></div>'
      : '<p style="font-size:13px;color:var(--ink-3)">Nenhum cliente ainda.</p>';
    return;
  }

  // O corte é declarado, não escondido: dizer "há mais" é o que faz a pessoa
  // buscar em vez de concluir que o cliente sumiu.
  const CORTE = 120;
  const mostrar = cli.slice(0, CORTE);
  mostrar.forEach(c => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (cadSel === c.id ? ' on' : '');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = c.nome;
    const nc = (c.contatos && c.contatos[0] ? c.contatos[0].count : (c._contatos||0));
    const ne = (c.equipamentos && c.equipamentos[0] ? c.equipamentos[0].count : (c._equip||0));
    b.querySelector('small').textContent =
      (c.cnpj ? c.cnpj + ' · ' : '') + nc + ' contato(s) · ' + ne + ' equipamento(s)';
    if (c.observacoes && /incompleto/i.test(c.observacoes)) b.classList.add('incompleto');
    b.addEventListener('click', () => { cadSel = c.id; pintarCadastros(); detalheCliente(c); });
    lista.appendChild(b);
  });
  if (cli.length > CORTE){
    const p2 = document.createElement('p');
    p2.style.cssText = 'font-size:12px;color:var(--ink-3);padding:9px 2px;margin:0';
    p2.textContent = 'Mostrando os ' + CORTE + ' primeiros de ' + cli.length
      + '. Use a busca do topo para achar o resto.';
    lista.appendChild(p2);
  }
  const sel = cli.find(c => c.id === cadSel);
  if (sel) detalheCliente(sel);
}

async function detalheCliente(c){
  const d = document.getElementById('cadDet');
  d.innerHTML = '<h3></h3><p style="color:var(--ink-3);font-size:13px">Carregando…</p>';
  d.querySelector('h3').textContent = c.nome;

  let contatos = [], equips = [];
  try{
    [contatos, equips] = DEMO ? [demoContatos(c.id), demoEquips(c.id)] : await Promise.all([
      get('contatos?select=id,nome,email,telefone,papeis&cliente_id=eq.' + c.id + '&ativo=eq.true&order=nome'),
      get('equipamentos?select=id,tag,tipo,localizacao,pmta&cliente_id=eq.' + c.id + '&ativo=eq.true&order=tag')
    ]);
  }catch(e){ toast(e.message,'err'); }

  d.innerHTML = '';
  const h = document.createElement('h3'); h.textContent = c.nome; d.appendChild(h);

  const bloco = (titulo, linhas, vazio) => {
    const s = document.createElement('div'); s.style.marginBottom = '18px';
    s.innerHTML = '<div style="font-size:10.5px;font-weight:700;letter-spacing:.09em;'
      + 'text-transform:uppercase;color:var(--ink-3);margin:0 0 8px"></div>';
    s.firstChild.textContent = titulo;
    if (!linhas.length){
      const p = document.createElement('p');
      p.style.cssText='font-size:13px;color:var(--ink-3);margin:0'; p.textContent = vazio;
      s.appendChild(p);
    } else linhas.forEach(l => {
      const r = document.createElement('div');
      r.style.cssText='font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--rule-2)';
      r.innerHTML = '<b></b> <span style="color:var(--ink-3)"></span>';
      r.querySelector('b').textContent = l.b; r.querySelector('span').textContent = l.s;
      s.appendChild(r);
    });
    d.appendChild(s);
    return s;
  };

  bloco('Contatos', contatos.map(x => ({ b:x.nome,
    s: [x.email, x.telefone, (x.papeis||[]).join('/')].filter(Boolean).join(' · ') })),
    'Nenhum contato. O contato que APROVA proposta é obrigatório na hora de registrar a aprovação.');

  const fc = document.createElement('div');
  fc.innerHTML = '<div class="dupla"><div class="campo"><label>Nome</label><input id="ctN" type="text"></div>'
    + '<div class="campo"><label>Telefone / e-mail</label><input id="ctT" type="text"></div></div>'
    + '<label class="campo" style="display:flex;align-items:center;gap:8px;font-size:13.5px">'
    + '<input id="ctA" type="checkbox" style="width:18px;height:18px"> Este contato aprova propostas</label>'
    + '<button class="btn" id="ctAdd" style="width:100%;padding:9px;margin-bottom:20px">Adicionar contato</button>';
  d.appendChild(fc);
  document.getElementById('ctAdd').addEventListener('click', async (e) => {
    const nome = document.getElementById('ctN').value.trim();
    if (!nome){ toast('Informe o nome do contato.','err'); return; }
    e.target.disabled = true;
    const t = document.getElementById('ctT').value.trim();
    const obj = { cliente_id: c.id, nome,
      email: t.includes('@') ? t : null, telefone: t.includes('@') ? null : (t||null),
      papeis: document.getElementById('ctA').checked ? ['aprova'] : [] };
    try{ if (DEMO) demoAddContato(obj); else await post('contatos', obj);
         toast('Contato cadastrado.','ok'); detalheCliente(c); }
    catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });

  bloco('Equipamentos', equips.map(x => ({ b:x.tag,
    s: [x.tipo, x.localizacao, x.pmta ? 'PMTA ' + x.pmta : ''].filter(Boolean).join(' · ') })),
    'Nenhum equipamento. Sem TAG cadastrada, o inspetor lança o item sem vínculo com o vaso.');

  const fe = document.createElement('div');
  fe.innerHTML = '<div class="dupla"><div class="campo"><label>TAG</label><input id="eqT" type="text" placeholder="VP-01"></div>'
    + '<div class="campo"><label>Tipo</label><select id="eqK">'
    + '<option value="vaso">Vaso de pressão</option><option value="caldeira">Caldeira</option>'
    + '<option value="tanque">Tanque</option><option value="tubulacao">Tubulação</option>'
    + '<option value="outro">Outro</option></select></div></div>'
    + '<div class="dupla"><div class="campo"><label>Local</label><input id="eqL" type="text"></div>'
    + '<div class="campo"><label>PMTA</label><input id="eqP" type="number" step="0.01" inputmode="decimal"></div></div>'
    + '<button class="btn" id="eqAdd" style="width:100%;padding:9px">Adicionar equipamento</button>';
  d.appendChild(fe);
  document.getElementById('eqAdd').addEventListener('click', async (e) => {
    const tag = document.getElementById('eqT').value.trim();
    if (!tag){ toast('Informe a TAG.','err'); return; }
    e.target.disabled = true;
    const obj = { cliente_id: c.id, tag, tipo: document.getElementById('eqK').value,
      localizacao: document.getElementById('eqL').value.trim() || null,
      pmta: document.getElementById('eqP').value ? Number(document.getElementById('eqP').value) : null };
    try{ if (DEMO) demoAddEquip(obj); else await post('equipamentos', obj);
         toast('Equipamento cadastrado.','ok'); detalheCliente(c); }
    catch(err){ toast(/duplicate|ux_equip/i.test(err.message)
        ? 'Já existe essa TAG neste cliente.' : err.message,'err'); e.target.disabled = false; }
  });

  // ── arquivar / excluir ──
  // Dois botões diferentes de propósito. Arquivar é o que se usa quase sempre:
  // o cliente sai das listas e o histórico fica. Excluir só existe para o
  // cliente que você digitou para testar — e o banco recusa se houver OS.
  const fim = document.createElement('div');
  fim.className = 'linhaBtns';
  fim.style.borderTop = '1px solid var(--rule)';
  fim.style.paddingTop = '14px';
  fim.innerHTML = '<button class="btn" id="cliArq">Arquivar cliente</button>'
                + '<button class="btn perigo" id="cliDel">Excluir</button>';
  d.appendChild(fim);
  const nota = document.createElement('p');
  nota.className = 'nota';
  nota.textContent = 'Arquivar tira o cliente das listas e mantém o histórico. '
                   + 'Excluir só funciona enquanto ele não tem nenhuma OS.';
  d.appendChild(nota);

  document.getElementById('cliArq').addEventListener('click', async () => {
    if (!confirm('Arquivar "' + c.nome + '"?\n\nEle sai das listas de escolha. '
        + 'As OS existentes continuam como estão, e dá para reativar depois.')) return;
    try{
      if (!DEMO) await rpc('tf_arquivar', { p_tabela:'clientes', p_id:c.id, p_ativo:false });
      toast('Cliente arquivado.','ok'); cadSel = null; pintarCadastros();
    }catch(e){ toast(e.message,'err'); }
  });

  document.getElementById('cliDel').addEventListener('click', async () => {
    if (!confirm('Excluir "' + c.nome + '" definitivamente?\n\n'
        + 'Contatos e equipamentos vão junto. Se o cliente tiver OS, o sistema recusa.')) return;
    try{
      const r = DEMO ? {status:'ok'} : await rpc('tf_excluir_cliente', { p_id:c.id });
      if (r && r.status === 'recusado'){ toast(r.mensagem,'err'); return; }
      toast('Cliente excluído.','ok'); cadSel = null; pintarCadastros();
    }catch(e){ toast(e.message,'err'); }
  });
}

// TRAVA DE DUPLO ENVIO
// ----------------------------------------------------------------------------
// Duplo clique num botão que grava = dois registros. O remendo mora no
// `onclick`, não dentro da função de salvar: assim vale para todas sem obrigar
// a refatorar nenhuma.
//   uso: onclick="_semDuploEnvio_(this, salvarX)"  ou  (this, () => f(a,b))
// ════════════════════════════════════════════════════════════════════════════
async function _semDuploEnvio_(btn, fn){
  if (btn && btn.dataset.enviando === '1') return;      // o segundo clique morre aqui
  if (btn) btn.dataset.enviando = '1';
  const txt = btn ? btn.textContent : null;
  const desab = btn ? btn.disabled : false;
  if (btn){ btn.disabled = true; btn.classList.add('ocupado'); btn.textContent = 'Processando…'; }
  try{ return await fn(); }
  finally{
    if (btn){ btn.disabled = desab; btn.classList.remove('ocupado');
              btn.textContent = txt; delete btn.dataset.enviando; }
  }
}

// ════════════════════════════════════════════════════════════════════════════
// TF — o motor de tabela
// ----------------------------------------------------------------------------
// Ordenação por coluna, filtro por valor, paginação e cabeçalho fixo, com o
// estado guardado FORA do DOM. É isso que faz o filtro sobreviver ao re-render:
// no desenho antigo, qualquer atualização em segundo plano apagava o que a
// pessoa tinha filtrado, e ela reclamava que "o sistema volta sozinho".
//
// Cada tela declara as colunas e de onde vêm os dados; o motor faz o resto.
// ════════════════════════════════════════════════════════════════════════════
const TF = { inst: {} };

function tfReg(id, cfg){
  if (!TF.inst[id]) TF.inst[id] = { s:{ ordem:null, dir:1, filtros:{}, pag:1, porPag:50 } };
  TF.inst[id].cfg = cfg;
  return TF.inst[id];
}

const tfCasca = id =>
  '<div class="tfChips" id="tf_' + id + '_chips"></div>' +
  '<div class="tfWrap" id="tf_' + id + '_wrap"><table class="tfTab">' +
  '<thead><tr id="tf_' + id + '_head"></tr></thead>' +
  '<tbody id="tf_' + id + '_body"></tbody></table></div>' +
  '<div class="tfRodape"><div class="tfConta" id="tf_' + id + '_conta"></div>' +
  '<div class="tfPag" id="tf_' + id + '_pag"></div></div>';

function tfLinhas(id){
  const I = TF.inst[id]; if (!I || !I.cfg) return [];
  let d = I.cfg.dados() || [];
  // índice de busca memoizado na própria linha: sem isso são milhares de
  // normalizações por tecla digitada
  if (I.cfg.textoBusca) for (const r of d) if (r._tfBusca === undefined) r._tfBusca = norm(I.cfg.textoBusca(r));
  const q = I.cfg.consulta ? I.cfg.consulta() : '';
  if (q && I.cfg.textoBusca){
    const termos = norm(q).split(/\s+/).filter(Boolean);
    d = d.filter(r => termos.every(t => r._tfBusca.includes(t)));
  }
  for (const k in I.s.filtros){
    const vals = I.s.filtros[k];
    if (!vals || !vals.length) continue;
    const c = I.cfg.colunas.find(x => x.k === k); if (!c) continue;
    d = d.filter(r => vals.includes(String(tfValor(c, r) ?? '')));
  }
  if (I.s.ordem){
    const c = I.cfg.colunas.find(x => x.k === I.s.ordem);
    if (c) d = d.slice().sort((a,b) => {
      let va = tfValor(c,a), vb = tfValor(c,b);
      const ea = (va == null || va === ''), eb = (vb == null || vb === '');
      if (ea && eb) return 0;
      if (ea) return 1;            // vazio vai sempre para o fim, nos dois sentidos
      if (eb) return -1;
      if (c.tipo === 'num'){ va = Number(va)||0; vb = Number(vb)||0; }
      else { va = norm(va); vb = norm(vb); }
      return (va < vb ? -1 : va > vb ? 1 : 0) * I.s.dir;
    });
  }
  return d;
}
const tfValor = (c, r) => c.valor ? c.valor(r) : r[c.k];

function tfRender(id){
  const I = TF.inst[id]; if (!I || !I.cfg) return;
  const cab = document.getElementById('tf_' + id + '_head');
  const cor = document.getElementById('tf_' + id + '_body');
  if (!cab || !cor) return;

  cab.innerHTML = I.cfg.colunas.map(c => {
    const ord = I.s.ordem === c.k ? (I.s.dir > 0 ? '▲' : '▼') : '';
    const fil = (I.s.filtros[c.k] || []).length ? ' filtrada' : '';
    return '<th class="' + (c.tipo === 'num' ? 'num' : '') + fil + '"'
      + (c.larg ? ' style="width:' + c.larg + '"' : '') + '>'
      + '<button type="button" class="tfTh" data-k="' + c.k + '">'
      + '<span>' + esc(c.rot) + '</span><span class="tfOrd">' + ord + '</span>'
      + (c.filtro === false ? '' : '<span class="tfFun" aria-hidden="true">⌄</span>')
      + '</button></th>';
  }).join('');
  cab.querySelectorAll('.tfTh').forEach(b =>
    b.addEventListener('click', e => tfMenu(e, id, b.dataset.k)));

  const todas = tfLinhas(id);
  const tot = todas.length;
  const pp = I.s.porPag;
  const nPag = Math.max(1, Math.ceil(tot / pp));
  if (I.s.pag > nPag) I.s.pag = nPag;
  const ini = (I.s.pag - 1) * pp;
  const pagina = todas.slice(ini, ini + pp);

  if (!tot){
    const temFiltro = Object.values(I.s.filtros).some(v => v && v.length)
      || (I.cfg.consulta && I.cfg.consulta());
    cor.innerHTML = '<tr><td colspan="' + I.cfg.colunas.length + '">'
      + '<div class="vazio2"><b>' + (temFiltro ? 'Nada com esses filtros' : (I.cfg.vazio || 'Nada por aqui'))
      + '</b><p>' + (temFiltro
          ? 'Ajuste a busca ou <button type="button" class="tfLimpa" id="tf_' + id + '_limpa">limpe os filtros</button>.'
          : esc(I.cfg.vazioSub || '')) + '</p></div></td></tr>';
    const lb = document.getElementById('tf_' + id + '_limpa');
    if (lb) lb.addEventListener('click', () => tfLimpar(id));
  } else {
    cor.innerHTML = '';
    pagina.forEach(r => {
      const tr = document.createElement('tr');
      if (I.cfg.classeLinha){ const cl = I.cfg.classeLinha(r); if (cl) tr.className = cl; }
      tr.innerHTML = I.cfg.colunas.map(c =>
        '<td class="' + (c.tipo === 'num' ? 'num' : '') + '">'
        + (c.render ? c.render(r) : esc(tfValor(c, r) ?? '')) + '</td>').join('');
      if (I.cfg.aoClicar){ tr.classList.add('clicavel'); tr.addEventListener('click', () => I.cfg.aoClicar(r)); }
      cor.appendChild(tr);
    });
  }

  document.getElementById('tf_' + id + '_conta').innerHTML = tot
    ? '<b>' + (ini + 1) + '–' + Math.min(ini + pp, tot) + '</b> de <b>' + tot + '</b>'
      + (I.cfg.unidade ? ' ' + I.cfg.unidade : '')
    : '';
  tfPaginador(id, nPag);
  tfChips(id);
}

function tfPaginador(id, nPag){
  const I = TF.inst[id];
  const el = document.getElementById('tf_' + id + '_pag');
  if (nPag <= 1){ el.innerHTML = ''; return; }
  const p = I.s.pag;
  const nums = new Set([1, nPag, p, p-1, p+1, p-2, p+2]);
  const lista = [...nums].filter(n => n >= 1 && n <= nPag).sort((a,b) => a-b);
  let h = '<button type="button" aria-label="Página anterior" data-p="' + (p-1) + '"'
        + (p === 1 ? ' disabled' : '') + '>‹</button>';
  let ant = 0;
  lista.forEach(n => {
    if (n - ant > 1) h += '<span class="tfEl">…</span>';
    h += '<button type="button" data-p="' + n + '"' + (n === p ? ' class="atual" aria-current="page"' : '')
       + ' aria-label="Página ' + n + '">' + n + '</button>';
    ant = n;
  });
  h += '<button type="button" aria-label="Próxima página" data-p="' + (p+1) + '"'
     + (p === nPag ? ' disabled' : '') + '>›</button>';
  el.innerHTML = h;
  el.querySelectorAll('button[data-p]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.p);
    if (n >= 1 && n <= nPag){ I.s.pag = n; tfRender(id);
      const w = document.getElementById('tf_' + id + '_wrap'); if (w) w.scrollTop = 0; }
  }));
}

function tfChips(id){
  const I = TF.inst[id];
  const el = document.getElementById('tf_' + id + '_chips');
  const ativos = Object.entries(I.s.filtros).filter(([,v]) => v && v.length);
  if (!ativos.length){ el.className = 'tfChips'; el.innerHTML = ''; return; }
  el.className = 'tfChips on';
  el.innerHTML = ativos.map(([k, v]) => {
    const c = I.cfg.colunas.find(x => x.k === k);
    return '<span class="tfChip">' + esc((c && c.rot) || k) + ': '
      + esc(v.length > 2 ? v.length + ' valores' : v.map(x => x || '(vazio)').join(', '))
      + '<button type="button" data-k="' + k + '" aria-label="Tirar este filtro">×</button></span>';
  }).join('') + '<button type="button" class="tfLimpa" id="tf_' + id + '_limpatudo">limpar tudo</button>';
  el.querySelectorAll('.tfChip button').forEach(b => b.addEventListener('click', () => {
    delete I.s.filtros[b.dataset.k]; I.s.pag = 1; tfRender(id);
  }));
  document.getElementById('tf_' + id + '_limpatudo').addEventListener('click', () => tfLimpar(id));
}

function tfLimpar(id){
  const I = TF.inst[id];
  I.s.filtros = {}; I.s.pag = 1;
  if (I.cfg.limparConsulta) I.cfg.limparConsulta();
  tfRender(id);
}

// ── o menu da coluna: ordenar e filtrar por valor ───────────────────────────
let _tfMenuEl = null;
function tfFecharMenu(){ if (_tfMenuEl){ _tfMenuEl.remove(); _tfMenuEl = null; } }
document.addEventListener('click', e => {
  if (_tfMenuEl && !_tfMenuEl.contains(e.target) && !e.target.closest('.tfTh')) tfFecharMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') tfFecharMenu(); });

function tfMenu(ev, id, k){
  ev.stopPropagation();
  tfFecharMenu();
  const I = TF.inst[id];
  const c = I.cfg.colunas.find(x => x.k === k); if (!c) return;

  const m = document.createElement('div');
  m.className = 'tfMenu';
  const podeFiltrar = c.filtro !== false;

  // os valores da coluna, com quantas linhas cada um tem — a contagem é o que
  // transforma "filtrar" em "ver a distribuição"
  const conta = new Map();
  if (podeFiltrar) (I.cfg.dados() || []).forEach(r => {
    const v = String(tfValor(c, r) ?? '');
    conta.set(v, (conta.get(v) || 0) + 1);
  });
  const vals = [...conta.entries()].sort((a,b) => norm(a[0]) < norm(b[0]) ? -1 : 1);
  const sel = new Set(I.s.filtros[k] || []);

  m.innerHTML =
    '<div class="tfmOrd">' +
      '<button type="button" data-d="1">▲ Crescente</button>' +
      '<button type="button" data-d="-1">▼ Decrescente</button>' +
    '</div>' +
    (podeFiltrar && vals.length > 8
      ? '<div class="tfmB"><input type="text" placeholder="Filtrar valores…" id="tfmBusca"'
        + ' aria-label="Filtrar os valores desta coluna" autocomplete="off"></div>' : '') +
    (podeFiltrar
      ? '<div class="tfmLista" id="tfmLista"></div>' +
        '<div class="tfmPe"><button type="button" id="tfmTudo">Todos</button>' +
        '<button type="button" id="tfmNada">Nenhum</button>' +
        '<button type="button" class="pri" id="tfmOk">Aplicar</button></div>'
      : '');
  document.body.appendChild(m);
  _tfMenuEl = m;

  const r = ev.currentTarget.getBoundingClientRect();
  m.style.left = Math.min(r.left, window.innerWidth - m.offsetWidth - 12) + 'px';
  m.style.top  = Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 12) + 'px';

  m.querySelectorAll('.tfmOrd button').forEach(b => b.addEventListener('click', () => {
    I.s.ordem = k; I.s.dir = Number(b.dataset.d); I.s.pag = 1;
    tfFecharMenu(); tfRender(id);
  }));
  if (!podeFiltrar) return;

  const lista = m.querySelector('#tfmLista');
  const pinta = (q) => {
    const vis = vals.filter(([v]) => !q || norm(v).includes(norm(q)));
    lista.innerHTML = vis.slice(0, 300).map(([v, n]) =>
      '<label class="tfmItem"><input type="checkbox" value="' + esc(v) + '"'
      + (sel.size === 0 || sel.has(v) ? ' checked' : '') + '>'
      + '<span>' + esc(v || '(vazio)') + '</span><i>' + n + '</i></label>').join('')
      + (vis.length > 300 ? '<p class="tfmMais">' + vis.length + ' valores — refine a busca.</p>' : '');
  };
  pinta('');
  const bq = m.querySelector('#tfmBusca');
  if (bq){ bq.addEventListener('input', () => pinta(bq.value)); setTimeout(() => bq.focus(), 40); }
  m.querySelector('#tfmTudo').addEventListener('click',
    () => lista.querySelectorAll('input').forEach(i => i.checked = true));
  m.querySelector('#tfmNada').addEventListener('click',
    () => lista.querySelectorAll('input').forEach(i => i.checked = false));
  m.querySelector('#tfmOk').addEventListener('click', () => {
    const marcados = [...lista.querySelectorAll('input:checked')].map(i => i.value);
    // marcar tudo é o mesmo que não filtrar — guardar a lista inteira só faria
    // o chip mentir dizendo que há um filtro ativo
    if (marcados.length === vals.length || marcados.length === 0) delete I.s.filtros[k];
    else I.s.filtros[k] = marcados;
    I.s.pag = 1; tfFecharMenu(); tfRender(id);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// NAVEGAÇÃO — barra lateral por função
// ----------------------------------------------------------------------------
// A fita de abas no topo tinha sete botões em linha e não cabia mais nada. Pior:
// misturava QUADRO (Campo, Gestão) com CADASTRO (Catálogo) e com CONFIGURAÇÃO,
// como se fossem a mesma coisa. Agrupado na lateral, cada item tem um lugar que
// diz o que ele é, e ainda sobra espaço para crescer.
//
// Grupo fechado esconde tudo menos o item ativo. O estado fica no aparelho.
// ════════════════════════════════════════════════════════════════════════════
// `mod` é o módulo do perfil que abre este item — os nomes vêm de
// perfis.modulos, no banco. Quem muda o que alguém vê é um UPDATE naquela
// tabela, não uma versão nova deste arquivo.
//
// ⚠ Isto ESCONDE TELA, não é cofre. O 03_rls.sql decidiu, e está escrito lá,
// que numa empresa de nove pessoas todo mundo LÊ tudo e o que separa os papéis
// é a ESCRITA. Tirar Compras do menu do inspetor é para ele não se perder — a
// trava de verdade é o RLS.
const NAV = [
  { id:'quadros', rot:'QUADROS', itens:[
    { v:'campo', rot:'Campo',      ico:'campo',  cont:'nCampo', mod:'campo' },
    { v:'adm',   rot:'Gestão',     ico:'gestao', cont:'nAdm',   mod:'os' },
    { v:'com',   rot:'Comercial',  ico:'funil',  cont:'nCom',   mod:'comercial' },
  ]},
  { id:'operacao', rot:'OPERAÇÃO', itens:[
    { v:'age', rot:'Agenda',     ico:'agenda', cont:'nAge', mod:'os' },
    { v:'cpr', rot:'Compras',    ico:'caixa', cont:'nCpr', mod:'compras' },
    { v:'doc', rot:'Documentos', ico:'doc',                mod:'documentos' },
  ]},
  { id:'analise', rot:'ANÁLISE', itens:[
    { v:'rel', rot:'Relatórios', ico:'grafico', mod:'relatorios' },
  ]},
  { id:'cadastros', rot:'CADASTROS', itens:[
    { v:'cad', rot:'Clientes',  ico:'predio', mod:'cadastros' },
    { v:'cat', rot:'Catálogo',  ico:'tag',    mod:'cadastros' },
  ]},
  { id:'sistema', rot:'SISTEMA', fim:true, itens:[
    { v:'cfg',  rot:'Configurações', ico:'engrenagem', mod:'cadastros' },
    { v:'sair', rot:'Sair',          ico:'sair' },
  ]},
];

/** O perfil abre este módulo? Admin abre tudo — senão um erro de digitação em
 *  perfis.modulos tranca o dono do sistema para fora do próprio sistema.
 *  Perfil SEM nenhum módulo também vê tudo: app em branco parece quebrado, e
 *  quem tem que reclamar disso é o hub, que diz o motivo com todas as letras. */
function podeVer(mod){
  if (!mod || DEMO || sessao.admin) return true;
  const m = sessao.modulos || [];
  return m.length ? m.indexOf(mod) >= 0 : true;
}

/** Só os itens que esta pessoa abre, e só os grupos que sobraram com algo. */
function navVisivel(){
  return NAV.map(g => Object.assign({}, g, { itens: g.itens.filter(i => podeVer(i.mod)) }))
            .filter(g => g.itens.length);
}

const ICO = {
  campo:'<path d="M2 13l4-9 4 5 2-3 3 7z"/><circle cx="12.5" cy="3.5" r="1.5"/>',
  gestao:'<rect x="2" y="3" width="4" height="10" rx="1"/><rect x="7" y="3" width="4" height="7" rx="1"/><rect x="12" y="3" width="2" height="12" rx="1"/>',
  funil:'<path d="M2 3h12l-4.5 5.5V14L6.5 12V8.5z"/>',
  caixa:'<path d="M2 5l6-3 6 3v6l-6 3-6-3z"/><path d="M2 5l6 3 6-3M8 8v6"/>',
  doc:'<path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3M6 8h4M6 11h4"/>',
  grafico:'<path d="M2 14V8M6 14V4M10 14v-4M14 14V6"/>',
  agenda:'<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 2v2.5M10.5 2v2.5"/>',
  predio:'<rect x="3" y="3" width="10" height="11" rx="1"/><path d="M6 6h1M9 6h1M6 9h1M9 9h1M6 12h4"/>',
  tag:'<path d="M8 2H3v5l7 7 5-5z"/><circle cx="5.5" cy="4.5" r="1"/>',
  engrenagem:'<circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/>',
  sair:'<path d="M6 2H3v12h3"/><path d="M9 5l3 3-3 3M12 8H6"/>',
};
const svgIco = k => '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" '
  + 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + (ICO[k] || '') + '</svg>';

const K_NAVG = 'tfm_nav_grupos';
const navGLer = () => { try{ return JSON.parse(localStorage.getItem(K_NAVG) || '{}'); }catch(e){ return {}; } };
const navGGravar = o => { try{ localStorage.setItem(K_NAVG, JSON.stringify(o)); }catch(e){} };

function montarNav(){
  const el = document.getElementById('navGroups');
  const fechados = navGLer();
  el.innerHTML = '';
  navVisivel().forEach(g => {
    const d = document.createElement('div');
    d.className = 'nav-group' + (g.fim ? ' fim' : '') + (fechados[g.id] ? ' fechado' : '');
    d.dataset.g = g.id;
    const t = document.createElement('button');
    t.type = 'button'; t.className = 'nav-gtoggle';
    t.setAttribute('aria-expanded', fechados[g.id] ? 'false' : 'true');
    t.innerHTML = '<span class="nav-car" aria-hidden="true">▾</span><span>' + g.rot
                + '</span><span class="nav-gn" aria-hidden="true">' + g.itens.length + '</span>';
    t.addEventListener('click', () => {
      const f = navGLer(); f[g.id] = !f[g.id]; navGGravar(f);
      d.classList.toggle('fechado', !!f[g.id]);
      t.setAttribute('aria-expanded', f[g.id] ? 'false' : 'true');
    });
    d.appendChild(t);
    g.itens.forEach(i => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'nav-item'; b.dataset.v = i.v; b.id = 'nav_' + i.v;
      b.innerHTML = svgIco(i.ico) + '<span class="rot">' + i.rot + '</span>'
        + (i.cont ? '<span class="nav-n" id="' + i.cont + '"></span>' : '');
      b.addEventListener('click', () => irPara(i.v));
      d.appendChild(b);
    });
    el.appendChild(d);
  });
}

const ROTULO = { campo:'Campo', adm:'Gestão', com:'Comercial', cpr:'Compras', age:'Agenda',
  doc:'Documentos', rel:'Relatórios', cad:'Clientes', cat:'Catálogo', cfg:'Configurações' };
const GRUPO_DE = {};
NAV.forEach(g => g.itens.forEach(i => { GRUPO_DE[i.v] = g.rot; }));

/** O único caminho para trocar de tela. */
function irPara(v){
  if (v === 'sair'){ sairDaConta(); return; }
  // Estado guardado de outro login, ou endereço colado: cai na primeira tela
  // que a pessoa realmente abre, em vez de numa tela sem menu correspondente.
  const item = NAV.reduce((a,g) => a.concat(g.itens), []).find(i => i.v === v);
  if (item && !podeVer(item.mod)){
    const primeira = (navVisivel()[0] || { itens:[] }).itens[0];
    if (primeira && primeira.v !== v){ irPara(primeira.v); return; }
  }
  visao = v;
  document.querySelectorAll('.nav-item').forEach(b => {
    const ativo = b.dataset.v === v;
    b.classList.toggle('on', ativo);
    if (ativo) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const g = GRUPO_DE[v];
  document.getElementById('crumbGrupo').textContent =
    g ? g.charAt(0) + g.slice(1).toLowerCase() : 'TapFlow';
  document.getElementById('crumbAtual').textContent = ROTULO[v] || v;
  document.body.classList.remove('navAberta');

  // a busca é POR TELA: o texto de uma não pode vazar para a outra
  const bu = document.getElementById('tbBusca');
  bu.value = BUSCA[v] || '';
  bu.placeholder = PLACEHOLDER_BUSCA[v] || 'Buscar nesta tela…';
  bu.disabled = !PLACEHOLDER_BUSCA[v];
  bu.style.visibility = PLACEHOLDER_BUSCA[v] ? '' : 'hidden';

  // Quadro rola na horizontal e tem altura de janela; lista rola na vertical.
  // Misturar os dois foi o que deixava a tela de Compras cortada no rodapé.
  const eQuadro = (v === 'campo' || v === 'adm' || v === 'com');
  document.getElementById('board').classList.toggle('livre', !eQuadro);
  document.querySelector('main').classList.toggle('rolaY', !eQuadro);

  if (v === 'campo' || v === 'adm'){ quadro = v; REPINTA[v] = pintar; return pintar(); }
  if (v === 'com') return pintarComercial();
  if (v === 'age') return pintarAgenda();
  if (v === 'cpr') return pintarCompras();
  if (v === 'doc') return pintarDocumentos();
  if (v === 'rel') return pintarRelatorios();
  if (v === 'cad') return pintarCadastros();
  if (v === 'cat') return pintarCatalogo();
  if (v === 'cfg') return pintarConfig();
  return pintar();
}

// ════════════════════════════════════════════════════════════════════════════
// AGENDA DA EQUIPE — quem faz o quê, em que dia, e quanto já cabe
// ----------------------------------------------------------------------------
// A unidade aqui NÃO é a OS, é a TAREFA. Uma OS de fornecimento passa por
// campo, escritório, compras e campo de novo — designar "a OS" para alguém
// seria mentira em quatro quintos do caminho.
//
// A capacidade sai de `parametros_turno` (dado), e o esforço de
// `tempo_estimado_min` (dado, com chute inicial vindo do template). Sem os
// dois, "fulano está cheio" é opinião, e opinião não monta semana.
//
// A barra NUNCA bloqueia. Estourar o dia é aviso — atraso e adiantamento
// acontecem, e quem decide é quem está olhando a tela.
// ════════════════════════════════════════════════════════════════════════════

const AGENDA = { dias: 10, base: null, carga: [], pool: [] };

function agDias(){
  // Começa em HOJE e anda só por dia útil: mostrar sábado numa grade de
  // capacidade é gastar um sexto da tela com uma coluna que nunca enche.
  const uteis = TURNO.dias_uteis && TURNO.dias_uteis.length ? TURNO.dias_uteis : [1,2,3,4,5];
  const out = [];
  const d = AGENDA.base ? new Date(AGENDA.base + 'T12:00') : new Date();
  d.setHours(12,0,0,0);
  let guarda = 0;
  while (out.length < AGENDA.dias && guarda++ < 60){
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
              + '-' + String(d.getDate()).padStart(2,'0');
    const dow = d.getDay() === 0 ? 7 : d.getDay();
    if (uteis.indexOf(dow) >= 0) out.push(iso);
    d.setDate(d.getDate() + 1);
  }
  // ⚠ MAS: dia não útil que TEM trabalho marcado entra na grade assim mesmo.
  // Alguém marca um sábado de parada, a grade esconde a coluna, e o trabalho
  // some da tela sem erro nenhum. Filtro que apaga em silêncio deixa a tela
  // certa e a semana errada. (Achado pelo teste de tela, não por leitura.)
  if (out.length){
    const hoje = isoHoje(), fim = out[out.length - 1];
    const extras = new Set();
    (AGENDA.carga || []).forEach(c => {
      if (c.dia && c.dia >= hoje && c.dia <= fim && out.indexOf(c.dia) < 0) extras.add(c.dia);
    });
    if (extras.size) return out.concat([...extras]).sort();
  }
  return out;
}

function agPintarCorpo(){
  const cx = document.getElementById('agCorpo');
  if (!cx) return;
  const q = BUSCA.age || '';
  const dias = agDias();
  const cap = TURNO.capacidade_min || 540;

  // Só quem trabalha; e quem tem carga aparece mesmo sem estar na lista de
  // usuários (perfil pode ter mudado depois da designação).
  const pessoas = new Map();
  EQUIPE.forEach(u => pessoas.set(u.id, u.nome));
  AGENDA.carga.forEach(c => { if (!pessoas.has(c.usuario_id)) pessoas.set(c.usuario_id, c.usuario); });

  const porChave = {};
  AGENDA.carga.forEach(c => { porChave[c.usuario_id + '|' + c.dia] = c; });

  const linhas = [...pessoas.entries()]
    .filter(([id, nome]) => casa(nome, q))
    .sort((a,b) => a[1].localeCompare(b[1]));

  const hoje = isoHoje();
  let html = '<div class="agGrade"><table><thead><tr><th>Pessoa</th>'
    + dias.map(d => '<th class="' + (d === hoje ? 'hoje' : '') + '">'
        + esc(dataBR(d).slice(0,5)) + (d === hoje ? ' · hoje' : '') + '</th>').join('')
    + '</tr></thead><tbody>';

  if (!linhas.length){
    html += '<tr><td colspan="' + (dias.length+1) + '" style="color:var(--ink-3)">'
          + (q ? 'Ninguém bate com "' + esc(q) + '".' : 'Nenhuma pessoa ativa no time.')
          + '</td></tr>';
  }
  linhas.forEach(([id, nome]) => {
    html += '<tr><td class="pessoa">' + esc(nome) + '</td>';
    dias.forEach(d => {
      const c = porChave[id + '|' + d];
      const min = c ? Number(c.minutos || 0) : 0;
      const ocup = cap > 0 ? min / cap : 0;
      const cls = 'agCel' + (ocup > 1 ? ' cheio' : ocup > 0.7 ? ' quase' : '');
      html += '<td class="' + cls + '">'
        + (c ? '<span class="agH">' + minHora(min) + ' / ' + minHora(cap)
               + (ocup > 1 ? ' ⚠' : '') + '</span>'
               + '<div class="agBar"><i style="width:' + Math.min(100, Math.round(ocup*100)) + '%"></i></div>'
               + '<div style="font-size:10.5px;color:var(--ink-3);margin-top:3px">'
               + c.tarefas + ' tarefa' + (c.tarefas > 1 ? 's' : '') + '</div>'
               + (c.sem_estimativa
                  // Sem isto a barra mentiria: 4 tarefas sem minuto desenhariam
                  // um dia vazio, e alguém marcaria mais uma em cima.
                  ? '<div class="agSem">' + c.sem_estimativa + ' sem estimativa</div>' : '')
          : '<span style="color:var(--rule)">—</span>')
        + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  // ── o pool: designado sem dia, ou nem designado ──────────────────────────
  const pool = (AGENDA.pool || []).filter(t =>
    casa([t.os_numero, t.cliente, t.tarefa, t.usuario, t.fase].join(' '), q));
  html += '<h3 style="margin:22px 0 4px;font-size:14px">Sem dia marcado'
       + ' <span style="font-weight:400;color:var(--ink-3)">(' + pool.length + ')</span></h3>'
       + '<p style="margin:0 0 10px;font-size:12.5px;color:var(--ink-3)">'
       + 'Tarefa aberta que ninguém pôs num dia. Ela não entra em barra nenhuma — '
       + 'e é justamente por isso que precisa aparecer aqui.</p>';

  if (!pool.length){
    html += '<div class="vazio2"><b>Nada solto</b><p>Toda tarefa aberta tem dia marcado.</p></div>';
  } else {
    html += '<div class="agGrade"><table><thead><tr><th>OS</th><th>Cliente</th><th>Tarefa</th>'
          + '<th>Etapa</th><th>Quem</th><th>Prazo da OS</th><th></th></tr></thead><tbody>'
      + pool.map((t,i) =>
        '<tr><td class="mono">' + esc(t.os_numero || '') + (Number(t.prioridade_rank) >= 3
              ? ' <span class="chip urg">urgente</span>' : '') + '</td>'
        + '<td>' + esc(t.cliente || '') + '</td>'
        + '<td>' + esc(t.tarefa || '') + '</td>'
        + '<td>' + esc(t.fase || '') + '</td>'
        + '<td>' + esc(t.usuario || '—') + '</td>'
        + '<td>' + esc(t.prazo_saida ? dataBR(t.prazo_saida) : '—') + '</td>'
        + '<td><button class="btn mini" data-i="' + i + '">marcar dia</button></td></tr>').join('')
      + '</tbody></table></div>';
  }

  cx.innerHTML = html;
  // O contador da lateral mostra o que dói: tarefa sem dia, não o total.
  contador('nAge', (AGENDA.pool || []).length || '');
  cx.querySelectorAll('button[data-i]').forEach(b => {
    b.addEventListener('click', async () => {
      const t = pool[Number(b.dataset.i)];
      // A gaveta precisa do card para o modal saber o número da OS e recarregar.
      const card = cards.find(c => c.os_id === t.os_id)
                || { os_id:t.os_id, numero:t.os_numero, cliente:t.cliente };
      modalDesignar(card, {
        tarefa_id:t.tarefa_id, nome:t.tarefa, executor:t.executor,
        usuario_designado:t.usuario_designado, data_prevista:null,
        tempo_estimado_min:t.tempo_estimado_min
      }, pintarAgenda);
    });
  });
}

// ── busca por tela ──────────────────────────────────────────────────────────
// O estado vive aqui, não no DOM: sobrevive ao re-render e ao refresh em
// segundo plano. Foi assim que o PCM parou de perder o que a pessoa digitou.
const BUSCA = {};
/** Quem sabe repintar a própria tela a partir do que já está na memória. Cada
 *  `pintarX` registra a sua aqui; sem registro, a busca recarrega a tela. */
const REPINTA = {};
const PLACEHOLDER_BUSCA = {
  campo:'Buscar OS, cliente, etapa…', adm:'Buscar OS, cliente, etapa…',
  com:'Buscar negócio, cliente, contato…', cpr:'Buscar item, OS, fornecedor…',
  doc:'Buscar número, cliente, modelo…', cad:'Buscar cliente, CNPJ, cidade…',
  cat:'Buscar item, código, marca…',
  age:'Buscar pessoa, OS, cliente, tarefa…',
};
/** Multi-termo E: cada palavra digitada tem que aparecer no texto da linha.
 *  (`norm` já existe mais acima, no seletor de catálogo — é a mesma função.) */
function casa(texto, q){
  if (!q) return true;
  const t = norm(texto);
  return norm(q).split(/\s+/).filter(Boolean).every(p => t.includes(p));
}

let _buscaT = null;
function ligarBusca(){
  const el = document.getElementById('tbBusca');
  el.addEventListener('input', () => {
    BUSCA[visao] = el.value;
    clearTimeout(_buscaT);
    _buscaT = setTimeout(() => {
      const foco = document.activeElement === el;
      const pos = el.selectionStart;
      // repinta sem ir à rede quando a tela sabe filtrar sozinha
      if (REPINTA[visao]) REPINTA[visao]();
      else irPara(visao);
      if (foco){ requestAnimationFrame(() => {
        const n = document.getElementById('tbBusca');
        if (n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} }
      }); }
    }, 140);
  });
  // Esc limpa a busca sem tirar a mão do teclado
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape' && el.value){ e.stopPropagation(); el.value = ''; BUSCA[visao] = ''; irPara(visao); }
  });
}

/** Atalho: "/" foca a busca, como em toda ferramenta que se usa o dia inteiro. */
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
  const el = document.getElementById('tbBusca');
  if (el && !el.disabled){ e.preventDefault(); el.focus(); el.select(); }
});

/** Abre a gaveta da OS a partir do id, mesmo estando em outra tela. */
async function abrirOSPorId(osId){
  let c = cards.find(x => x.os_id === osId);

    // "não achei" e "não consegui perguntar" são coisas diferentes, e dizer

    try{ const r = await get('v_os_kanban?select=*&os_id=eq.' + osId); c = (r||[])[0]; }

// TELA: RELATÓRIOS
// ----------------------------------------------------------------------------
// Quatro relatórios, um período, três saídas. A regra que veio do ProperCare e
// que evita a divergência mais chata: **um modelo, três saídas**. A função
// `relModelo()` devolve { titulo, kpis, blocos }; tela, PDF e planilha leem o
// MESMO objeto. Montar o relatório duas vezes é como o número da tela passa a
// discordar do número do PDF.
//
// A tela mostra as primeiras 60 linhas de cada bloco e diz isso em voz alta —
// o PDF e a planilha levam todas.
// ════════════════════════════════════════════════════════════════════════════
const REL = {
  qual:'operacional',
  de:null, ate:null,
  dados:null,      // cache do que foi buscado, por período
  chave:null,
};
const REL_TIPOS = [
  ['operacional','Operacional', 'OS por período, etapa e responsável'],
  ['comercial',  'Comercial',   'Funil, propostas, aprovação e perdas'],
  ['financeiro', 'Financeiro',  'Margem por OS: venda, custo, frete'],
  ['compras',    'Compras',     'Pedidos por fornecedor e atrasos'],
];

function relIniciaPeriodo(){
  if (REL.de && REL.ate) return;
  const h = new Date();
  REL.ate = isoHoje(h);
  REL.de  = isoHoje(new Date(h.getFullYear(), h.getMonth(), 1));
}
function relAtalho(qual){
  const h = new Date();
  const iso = isoHoje;
  if (qual === 'mes'){ REL.de = iso(new Date(h.getFullYear(), h.getMonth(), 1)); REL.ate = iso(h); }
  if (qual === 'mespassado'){
    REL.de  = iso(new Date(h.getFullYear(), h.getMonth()-1, 1));
    REL.ate = iso(new Date(h.getFullYear(), h.getMonth(), 0));
  }
  if (qual === '90'){ REL.de = iso(new Date(h.getTime() - 90*864e5)); REL.ate = iso(h); }
  if (qual === 'ano'){ REL.de = iso(new Date(h.getFullYear(), 0, 1)); REL.ate = iso(h); }
  REL.dados = null;
  pintarRelatorios();
}

  relIniciaPeriodo();
  const board = document.getElementById('board');
  board.innerHTML =
    '<div class="tela"><div class="telaCab"><h2>Relatórios</h2>'

    + '</div>'
    + '<div id="relCorpo"><p class="nota">Carregando…</p></div></div>';

  const t = document.getElementById('relTipos');
  REL_TIPOS.forEach(([id, rot, sub]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'relTipo' + (REL.qual === id ? ' on' : '');

    b.addEventListener('click', () => { REL.qual = id; pintarRelatorios(); });

  document.getElementById('relDe').addEventListener('change', e => {
