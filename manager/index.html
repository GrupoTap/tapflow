<!-- ═══════════════════════════════════════════════════════════════════════════
     TAPFLOW MANAGER — TFM_S3
     Engetap Engenharia · quadros, cadastros, abertura de OS e itens da OS

     S2 acrescentou: cadastros, abertura de OS, aba de ITENS e registro da
     proposta externa.
     S3 acrescenta: upload do PDF da proposta para o Google Drive, geração de
     PDF (levantamento e resumo da OS) e a aba ARQUIVOS.

     ARQUIVO ÚNICO, SEM BUILD. Abre com duplo clique ou hospeda no GitHub Pages.

     ── COMO LIGAR NO SUPABASE ─────────────────────────────────────────────────
     Enquanto SUPABASE_URL estiver vazio, o app roda em MODO DEMO com dados de
     mentira — dá para ver os quadros funcionando sem instalar nada.
     Para ligar de verdade, preencha as duas constantes logo abaixo com o que
     está em Supabase → Settings → API.

     ── O QUE ESTE APP NÃO FAZ, DE PROPÓSITO ───────────────────────────────────
     Não existe arrastar o card. A coluna é a fase da primeira tarefa não
     resolvida, calculada pelo banco na view v_os_kanban. O card se move quando
     uma tarefa fecha — e só assim. O banco recusa UPDATE direto em
     pipeline_tarefas, então nem um bug daqui conseguiria burlar isso.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
/* ════════════════════════════════════════════════════════════════════════════
   TOKENS — a cor sai da logomarca da Engetap, não de escolha minha.
   O monograma é um gradiente de #1D4E80 a #2596D5, o texto é #515252 e o
   subtítulo é #0087CC. Até o S9 o app era verde, que eu tinha inventado.
   ════════════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#1B6FA9; --accent-hover:#155A8A; --accent-ink:#164C77;
  --accent-soft:#E3EEF7; --accent-alt:#0087CC;
  --sidebar-bg:#102438; --sidebar-fg:#9DB2C6; --sidebar-fg-active:#F5F9FC;
  --sidebar-hover:rgba(255,255,255,.05); --sidebar-active:rgba(255,255,255,.08);
  --sidebar-group:#6E8399;

  --paper:#F1F3F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#14181B; --ink-2:#515252; --ink-3:#78838A;
  --rule:#DBE0E3; --rule-2:#EBEFF1;

  --campo:#1B6FA9;  --campo-soft:#E3EEF7;
  --gestao:#8A5A12; --gestao-soft:#F6EBD9;
  /* O quarto quadro (Técnico Administrativa) precisa de faixa própria: com
     a mesma cor da gestão, quem olha de longe não distingue os dois. */
  --tecadm:#1E7A42; --tecadm-soft:#E1F0E7;
  /* O quinto (Fornecimento de Produtos, S25) também: é um FLUXO, não uma
     equipe, e quem alterna entre ele e a Administrativa precisa saber de
     relance em qual dos dois está. */
  --forn:#6B4FA0;   --forn-soft:#EEE9F6;
  --crit:#A62D18;   --crit-soft:#F7E4DF;
  --warn:#96601A;   --warn-soft:#F8EEDC;
  --ok:#1E7A42;     --ok-soft:#DFF0E6;

  --nav-w:220px; --header-h:54px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,26,28,.06), 0 6px 18px -12px rgba(16,26,28,.3);
  --sh-lift:0 2px 4px rgba(16,26,28,.08), 0 12px 28px -14px rgba(16,26,28,.42);
  --t:120ms ease;
}

/* ── foco visível em todo lugar ────────────────────────────────────────────
   O PCM tem UM :focus-visible no arquivo inteiro. Quem navega por teclado —
   ou quem tem o mouse ruim — fica sem saber onde está. Aqui é global. */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.nav-item:focus-visible{outline-offset:-2px}

/* ════════════════════════════════════════════════════════════════════════════
   SHELL — barra lateral fixa + header + conteúdo
   ════════════════════════════════════════════════════════════════════════════ */
.nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);background:var(--sidebar-bg);
  color:var(--sidebar-fg);display:flex;flex-direction:column;padding:14px 0 10px;z-index:60;
  border-right:1px solid rgba(255,255,255,.05)}
.nav-brand{padding:0 16px 13px;display:flex;align-items:baseline;gap:7px;
  border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:10px}
.nav-brand b{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.02em}
.nav-brand b span{color:var(--accent-alt)}
.nav-brand .v{font-family:var(--mono);font-size:10.5px;color:var(--sidebar-group);letter-spacing:.04em}
.nav-groups{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-groups::-webkit-scrollbar{width:6px}
.nav-groups::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.nav-group{display:flex;flex-direction:column}
.nav-group.fim{margin-top:auto}
.nav-gtoggle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;
  cursor:pointer;user-select:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  color:var(--sidebar-group);padding:9px 16px 4px;transition:color var(--t)}
.nav-gtoggle:hover{color:var(--sidebar-fg-active)}
.nav-car{display:inline-block;width:9px;font-size:9px;line-height:1;transition:transform var(--t);opacity:.75}
.nav-group.fechado .nav-car{transform:rotate(-90deg)}
.nav-gn{margin-left:auto;font-size:9px;opacity:0;transition:opacity var(--t)}
.nav-group.fechado .nav-gn{opacity:.6}
/* grupo fechado esconde tudo MENOS onde você está — barra que esconde a sua
   própria posição troca 4 pixels por desorientação */
.nav-group.fechado .nav-item:not(.on){display:none}

.nav-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;
  padding:8px 16px;font-size:13px;color:var(--sidebar-fg);cursor:pointer;
  border-left:2px solid transparent;transition:background var(--t),color var(--t)}
.nav-item:hover{background:var(--sidebar-hover);color:var(--sidebar-fg-active)}
.nav-item.on{background:var(--sidebar-active);color:var(--sidebar-fg-active);border-left-color:var(--accent-alt)}
.nav-item svg{width:16px;height:16px;flex:0 0 auto}
/* Duas linhas em vez de reticências. "Equipe Técnico A…" não identifica quadro
   nenhum, e identificar o quadro é a única coisa que este item precisa fazer.
   O ícone e o contador ficam alinhados ao topo para a linha não dançar. */
.nav-item .rot{flex:1;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.nav-item{align-items:flex-start}
.nav-item svg,.nav-item .nav-n{margin-top:1px}
.nav-n{margin-left:auto;background:rgba(255,255,255,.12);color:var(--sidebar-fg-active);
  font-size:10px;font-weight:700;line-height:1;padding:2px 6px;border-radius:9px;min-width:16px;text-align:center}
.nav-n:empty{display:none}
.nav-n.alerta{background:var(--crit);color:#fff}

.app{margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:40}
.crumb{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.tbBusca{width:250px;height:32px;padding:0 10px;font-size:12.5px;background:var(--surface-2);
  border:1px solid var(--rule);border-radius:4px;outline:none;font-family:inherit;color:var(--ink);
  transition:border-color var(--t),background var(--t)}
.tbBusca:focus{border-color:var(--accent);background:var(--surface)}
.tbBusca::placeholder{color:var(--ink-3)}

/* A regra base vem ANTES da media query: declarada depois, ela vencia por
   ordem de cascata e o botão do menu ficava invisível também no celular. */
.navBurger{display:none;align-items:center;justify-content:center;width:32px;height:32px;
  border:1px solid var(--rule);background:var(--surface);border-radius:4px;cursor:pointer;font-size:15px}

@media (max-width:900px){
  :root{--nav-w:0px}
  .nav{transform:translateX(-100%);transition:transform .2s;width:220px;box-shadow:var(--sh-lift)}
  body.navAberta .nav{transform:none}
  body.navAberta .navScrim{display:block}
  .navScrim{display:none;position:fixed;inset:0;background:rgba(16,26,28,.4);z-index:55}
  .navBurger{display:flex}
  .app{margin-left:0}
  .tbBusca{width:auto;flex:1;min-width:90px}
  .topbar{gap:8px;padding:0 10px}
  .crumb{display:none}
  .who{display:none}
  #btnRefresh{display:none}          /* puxar para recarregar já existe no navegador */
  #connTxt{display:none}             /* o ponto continua: é o sinal, o texto é enfeite */
  #btnNovaOS{padding:6px 9px;font-size:12px}
  .tela{padding-bottom:24px}
  main{padding:12px 10px}
}

*{box-sizing:border-box}
/* `hidden` tem que vencer o display dos elementos abaixo — sem isto o overlay
   de login continua na frente do app mesmo com o atributo hidden. */
[hidden]{display:none !important}
html,body{height:100%}
/* A gaveta fechada fica em translateX(100%): a caixa continua existindo fora da
   tela e esticava a largura rolável em 390px. Cortar aqui é mais barato do que
   animar `right`, que dispara layout a cada quadro. */
html{overflow-x:hidden}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* ── topo ─────────────────────────────────────────── */
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.ok{background:var(--ok)} .dot.off{background:var(--crit)}
.dot.sync{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{
  background:var(--surface);border:1px solid var(--rule);padding:6px 12px;
  border-radius:3px;font-size:13px;font-weight:600;color:var(--ink-2);
}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{font-size:12.5px;color:var(--ink-3)}
.who b{color:var(--ink);font-weight:600}
/* S32 · item 3: a tela "Meu perfil". Painel único e estreito de propósito —
   são quatro linhas de leitura e um botão; espalhar isso na largura da tela
   faria a pessoa procurar onde está o conteúdo. */
.euWrap{max-width:560px}
.euTopo{display:flex;gap:16px;align-items:flex-start;margin:14px 0 16px}
.euDados{flex:1;min-width:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.euLin{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:baseline;
  padding:9px 12px;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.euLin:last-child{border-bottom:0}
.euRot{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.euVal{font-weight:600;overflow-wrap:anywhere}
.euNota{color:var(--ink-3);font-size:11px;white-space:nowrap}
.euLin .falta{color:var(--ink-3);font-weight:400}
@media(max-width:560px){
  .euTopo{flex-direction:column;align-items:center}
  .euLin{grid-template-columns:1fr;gap:2px}
  .euNota{white-space:normal}
}

/* S32 · item 3: o crachá virou o atalho para "Meu perfil". Ele continua
   parecendo texto — só o hover e o foco dizem que é clicável. Botão desenhado
   como botão aqui competiria com "Nova OS" e "Atualizar", que são as ações da
   barra; este é um caminho, não uma ação. */
.crachaEu{font:inherit;color:inherit;background:transparent;border:1px solid transparent;
  border-radius:3px;padding:3px 7px;cursor:pointer}
.crachaEu:hover{background:var(--accent-soft);border-color:var(--rule);color:var(--accent-ink)}
.crachaEu:hover b{color:var(--accent-ink)}

.demo{
  background:var(--warn-soft);color:var(--warn);
  padding:6px 18px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--rule);
}

/* ── quadro ───────────────────────────────────────── */
/* O quadro kanban rola na horizontal; as telas de lista rolam na vertical.
   Por isso a altura é calculada, não 100%: com `height:100%` numa página que
   agora rola, o quadro ficava com a altura da janela e as colunas cortadas. */
main{flex:1;overflow-x:auto;padding:16px 18px;min-height:calc(100vh - var(--header-h))}
main.rolaY{overflow-y:auto}
.board{display:flex;gap:10px;align-items:stretch;min-width:min-content;
  height:calc(100vh - var(--header-h) - 32px)}
.board.livre{display:block;height:auto;min-width:0}

/* ── S25: nos QUADROS a página não rola; quem rola é o <main>, e só de lado ──
   Até o S24 a altura do quadro era a conta `100vh − 54 − 32`. A conta fechava
   exata — e mesmo assim sobrava: a barra de rolagem HORIZONTAL do <main> (15 a
   17 px no Windows) é somada POR FORA dela. A página ganhava 15 px de rolagem
   vertical e a barra ficava logo abaixo da borda da janela: para rolar para o
   lado, era preciso primeiro rolar para baixo (item 1). E a roda do mouse
   subia a página inteira esses 15 px, levando o cabeçalho das colunas junto
   (item 2) — os cards já rolavam dentro da coluna, era a página que se mexia.
   Nos quatro quadros, Comercial incluído.
   ⚠ Não dá para ver no Chromium automático: ele esconde as barras. O parecer
   de 09/09 mediu assim e concluiu que cabia. Medir com as barras VISÍVEIS.
   Agora, em modo quadro (`body.emQuadro`, posto pelo irPara): o app tem a
   altura exata da janela, o <main> ocupa o que sobra DEPOIS do topo (e da
   faixa de demo, se houver) e a barra horizontal mora dentro dele — sempre
   no pé da janela, sempre visível. `flex:1 1 0` com a altura do pai definida
   é o que torna a altura do <main> "definida" para o `height:100%` do quadro;
   com o `min-height:100vh` antigo no .app ela não era, e o quadro caía para
   a altura do conteúdo. As telas de lista não entram aqui. */
body.emQuadro .app{height:100vh;height:100dvh;min-height:0}
body.emQuadro main{flex:1 1 0;min-height:0;overflow-x:auto;overflow-y:hidden}
body.emQuadro .board:not(.livre){height:100%}
.col{
  flex:0 0 264px; display:flex; flex-direction:column; height:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:4px;
}
.col.vazia{opacity:.62}
.col-h{
  padding:9px 11px; border-bottom:1px solid var(--rule); display:flex;
  align-items:baseline; gap:8px; position:sticky; top:0;
}
.col-h .t{font-size:12.5px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.col-h .c{
  margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--rule);border-radius:99px;padding:1px 7px;
}
.col.campo{border-top:3px solid var(--campo)}
.col.gestao{border-top:3px solid var(--gestao)}
.col.tecadm{border-top:3px solid var(--tecadm)}
.col.forn{border-top:3px solid var(--forn)}

/* ── aviso de cliente parecido / revisão de duplicados ───────────────── */
.parecidos{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.parecidoLinha{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px;flex-wrap:wrap}
.parecidoLinha .pn{font-weight:600;font-size:13.5px}
.parecidoLinha .pd{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-3)}
.parecidoLinha .chip{margin-left:auto}
.dupGrupo{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:12px 14px;margin-bottom:10px}
.dupGrupo>h4{margin:0 0 2px;font-size:14.5px}
.dupGrupo .sub{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.dupTab{width:100%;border-collapse:collapse;font-size:12.5px}
.dupTab th{text-align:left;font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);
  text-transform:uppercase;border-bottom:1px solid var(--rule);padding:4px 6px}
.dupTab td{padding:5px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.dupTab td.num{font-family:'JetBrains Mono',monospace;text-align:right}
.dupTab tr.vazio td{color:var(--ink-3)}
.dupAcoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opcoes{display:flex;flex-direction:column;gap:2px}
.linhaOpc{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:3px;
  font-size:13px;line-height:1.4;cursor:pointer;border:1px solid transparent}
.linhaOpc:hover{background:var(--surface-2)}
.linhaOpc:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.linhaOpc input{margin-top:3px;flex:0 0 auto}
.selo{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;white-space:nowrap}
.selo.seguro{background:var(--ok-soft);color:var(--ok)}
.selo.filial{background:var(--accent-soft);color:var(--accent-ink)}
.selo.risco{background:var(--warn-soft);color:var(--warn)}
.selo.grave{background:var(--crit-soft);color:var(--crit)}
/* S29 itens 5 e 7 */
.selo.aprov{background:var(--accent-soft);color:var(--accent-ink)}
.planoCfg{border-left:3px solid var(--rule);padding:4px 0 2px 12px;margin:0 0 14px}
.planoCfg.padrao{border-left-color:var(--accent)}
.planoCfgT{font-weight:700;margin-bottom:6px}
.planoCfg label .nota{font-weight:400;text-transform:none;letter-spacing:0}
.planosGer{border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 14px;background:var(--surface-2)}
.planosGerT{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.planosTbl td.pd{font-size:12px;color:var(--ink-2);min-width:180px}
.planosTbl tr.padrao td{background:var(--accent-soft)}
.selo.naoaprov{background:var(--crit-soft);color:var(--crit)}
.apTipos .chk{align-items:center}
.acoesPropTd{width:1%;vertical-align:middle}
.acoesProp{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:128px}
.acoesProp .btn.mini{margin-left:0;width:100%;text-align:center;justify-content:center;white-space:nowrap}
.col-b{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-vazia{font-size:12px;color:var(--ink-3);text-align:center;padding:14px 6px;font-style:italic}

/* ── card ─────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;
  border-left:3px solid var(--rule); text-align:left; width:100%; display:block;
}
.card:hover{box-shadow:var(--sh-lift);border-left-color:var(--accent)}
.card.travada{border-left-color:var(--crit)}
.card.atrasada{border-left-color:var(--warn)}
.card .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.card .cli{font-size:14px;font-weight:600;line-height:1.25;margin:3px 0 6px}
.card .tar{font-size:12px;color:var(--ink-2);line-height:1.35;display:flex;gap:5px}
.card .tar .ic{flex:0 0 auto;opacity:.75}
.card .foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.chip{
  font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2);white-space:nowrap;
}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.travada{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* Atraso é vermelho, risco é âmbar. Eram idênticos, e no card "5d de atraso"
   ficava com a mesma cor de "faltam 2d" — dois fatos diferentes, um só sinal.
   O Field usa as mesmas duas cores para os mesmos dois fatos. */
.chip.atras{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.lock{background:var(--gestao-soft);color:var(--gestao);border-color:transparent}
.chip.urg{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.altaP{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.risco{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* S34: serviço do NR-13 já vencido. A mesma cor de atraso, pelo mesmo motivo:
   é prazo que passou, não risco de passar. */
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* A borda esquerda diz a SITUAÇÃO (o pior dos dois relógios). A urgência é
   chip, não borda: se as duas coisas usassem a mesma cor, uma OS urgente no
   prazo ficaria igual a uma OS normal atrasada — e são problemas diferentes. */
.card.sit-atrasada{border-left-color:var(--crit)}
.card.sit-risco{border-left-color:var(--warn)}
/* ⚠ Estas DUAS últimas vêm depois de propósito: `travada` e `atrasada` são
   estados mais graves que "risco de prazo", e como a especificidade é a mesma
   quem estiver por último no arquivo vence. Antes, uma OS TRAVADA com prazo a
   dois dias ficava âmbar — a borda mentia. */
.card.atrasada{border-left-color:var(--warn)}
.card.travada{border-left-color:var(--crit)}
.card.urgente{box-shadow:inset 3px 0 0 -1px var(--crit), var(--shadow)}

/* ── faixa de prazo e prioridade na gaveta ─────────────────────────────── */
.faixaPz{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:9px 11px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.fpLinha{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.fpRot{color:var(--ink-3);min-width:74px;font-size:12px}
.fpVal{font-weight:600}
.fpVal.crit{color:var(--crit)} .fpVal.warn{color:var(--warn)}
.fpDe{font-size:10.5px;color:var(--ink-3);background:var(--surface);border:1px solid var(--rule-2);
  border-radius:2px;padding:1px 5px}
.btn.mini{padding:2px 7px;font-size:11px;margin-left:auto}
.tkDes{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);
  margin:5px 0 0 30px;padding-top:5px;border-top:1px dashed var(--rule-2)}
.tkDes i{color:var(--ink-3);opacity:.75}
.histL{display:flex;flex-direction:column;gap:2px}
.histI{border-left:2px solid var(--rule);padding:8px 0 8px 11px;position:relative}
.histI:before{content:'';position:absolute;left:-4px;top:13px;width:6px;height:6px;
  border-radius:50%;background:var(--accent)}
.histT{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);
  font-weight:700}
.histD{font-size:13px;margin-top:1px;line-height:1.4}
.histQ{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ── agenda da equipe ──────────────────────────────────────────────────── */
/* O ribbon: quatro vistas, cada uma com a tela inteira. "Sem dia" é vista
   irmã, não rodapé — no S14 ela empurrava a grade para fora da tela. */
.agRibbon{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--rule)}
.agTab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;
  font:600 13px var(--sans);color:var(--ink-3);cursor:pointer;display:flex;align-items:center;gap:6px}
.agTab:hover{color:var(--ink)}
.agTab.on{color:var(--accent);border-bottom-color:var(--accent)}
.agTabN{background:var(--accent-soft);color:var(--accent-ink);border-radius:9px;
  padding:0 6px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
.agTab.on .agTabN{background:var(--accent);color:#fff}

/* vista DIA */
.agDia{background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:14px 16px;margin-bottom:12px}
.agDiaH{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.agDiaH b{font-size:15px}
.agTar{display:flex;flex-direction:column;gap:1px;margin-top:12px}
.agT{display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--rule-2);padding:9px 2px;cursor:pointer;
  font:inherit;color:inherit}
.agT:hover{background:var(--surface-2)}
.agTn{font-size:13.5px;font-weight:600}
.agTs{font-size:12px;color:var(--ink-3);grid-column:1}
/* S29: sem coluna explícita, a posição de linha do .agTm fazia o grid colocá-lo
   PRIMEIRO — o tempo ia para a esquerda e o nome da tarefa para a direita */
.agTn{grid-column:1}
.agTm{font-size:12px;color:var(--ink-3);grid-row:1/3;grid-column:2;align-self:center;
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* vista MÊS */
.agMes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
  background:var(--rule-2);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.agMesH{background:var(--surface-2);padding:7px 8px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-3);font-weight:700;text-align:center}
.agMesD{background:var(--surface);min-height:82px;padding:6px 8px;display:flex;
  flex-direction:column;gap:2px}
.agMesD.fora{background:var(--surface-2);opacity:.5}
.agMesD.naoUtil{background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 6px,
  var(--surface-2) 6px,var(--surface-2) 12px)}
.agMesD.hoje .agMesN{background:var(--accent);color:#fff;border-radius:3px;padding:0 5px}
.agMesD.temItens{cursor:pointer}
.agMesD.temItens:hover{background:var(--accent-soft)}
.agMesD.temItens:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.agMesN{font-size:11.5px;color:var(--ink-3);font-weight:700;align-self:flex-start}
.agMesH2{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.agMesD.cheio .agMesH2{color:var(--crit)}
.agMesD.quase .agMesH2{color:var(--warn)}
.agMesP{font-size:10.5px;color:var(--ink-3);line-height:1.25}
.agLeg{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.45}

/* vista SEM DIA */
.agFiltros{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;
  background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:11px 13px}
.agF{display:flex;flex-direction:column;gap:3px;min-width:130px;flex:1 1 130px}
.agF span{font-size:11px;font-weight:600;color:var(--ink-2)}
.agF select{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;font:inherit;
  background:var(--surface);max-width:100%}
.agFiltros .btn.mini{margin-left:0}
.agFn{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.agGrupo{border:1px solid var(--rule);border-radius:5px;background:var(--surface);
  margin-bottom:10px;overflow:hidden}
.agGrupoH{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);
  padding:9px 13px;border-bottom:1px solid var(--rule-2);font-size:13px}
.agGrupoH span{color:var(--ink-3)}
.agGrupoN{margin-left:auto;font-size:11.5px}
.agLinha{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:12px;align-items:center;
  padding:8px 13px;border-top:1px solid var(--rule-2);font-size:13px}
.agLinha:first-of-type{border-top:0}
.agLt{font-weight:600}
.agLe,.agLq,.agLm{color:var(--ink-3);font-size:12.5px}
/* "Quem" é um botão desde o S22 (item 8): clicar escolhe o responsável. Ele
   se veste de texto para a linha não virar uma fileira de botões — o que a
   deixaria pesada e esconderia qual é a ação principal, que é marcar o dia. */
.agLinha .btn.mini.agLq{background:transparent;border:1px dashed var(--rule);
  color:var(--ink-3);font-weight:500;text-align:left;padding:3px 8px;
  justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agLinha .btn.mini.agLq:hover{background:var(--accent-soft);border-color:var(--accent);
  border-style:solid;color:var(--accent-ink)}
.agLm{font-variant-numeric:tabular-nums;text-align:right}
.agLinha .btn.mini{margin-left:0}
@media(max-width:860px){
  .agLinha{grid-template-columns:1fr auto;gap:4px 10px}
  .agLe,.agLq{font-size:11.5px}
  .agLm{grid-row:1;text-align:right}
}

/* ── S31 ─────────────────────────────────────────────────────────────────── */
/* Seleção em lote na vista "Sem dia" (item 2). A caixinha só existe na linha
   que ESTA pessoa consegue assumir — oferecer onde o servidor vai recusar é o
   defeito que o projeto persegue desde o parecer do TapControl. */
.agLinha{grid-template-columns:auto 2fr 1fr 1fr auto auto}
.agCk{display:flex;align-items:center;justify-content:center}
.agCk input{width:15px;height:15px;cursor:pointer}
.agCkVazio{width:15px}
.agLote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;
  padding:9px 12px;border:1px solid var(--accent);border-radius:5px;
  background:var(--accent-soft);font-size:13px}
.agLote b{color:var(--accent-ink)}
.agLote .btn{margin-left:auto}
.agGrupoH .agCkT{margin-right:2px}
@media(max-width:860px){ .agLinha{grid-template-columns:auto 1fr auto} }

/* Tarefas por perfil (item 1) */
.tpTab td,.tpTab th{vertical-align:middle}
.tpTab tr.tpOn{background:var(--accent-soft)}
.tpTab .tpDim{color:var(--ink-3);font-size:12px}
.tpTab input[type=checkbox]{width:16px;height:16px;cursor:pointer}
.tpTab .mono{color:var(--ink-3);font-size:11px}
/* S36 · a matriz de perfis */
.tpModo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.tpMatriz{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;max-width:100%}
.tpMx{margin:0;min-width:100%}
.tpMx th,.tpMx td{padding:6px 8px}
.tpMx .tpMx1{position:sticky;left:0;background:var(--surface);z-index:1;min-width:200px;max-width:260px}
.tpMx .tpMxP{text-align:center;font-size:11px;white-space:normal;min-width:74px;max-width:96px}
.tpMx .tpMxC{text-align:center}
.tpMx td.tpOn{background:var(--accent-soft)}
.tpMx .tpMxSec td{background:var(--surface-2);font-weight:600;font-size:12px;position:sticky;left:0}
.tpSim{color:var(--ok);font-weight:700}
.tpNao{color:var(--ink-3)}

/* Autocomplete do Catálogo na linha da proposta (item 5) */
.acWrap{position:relative}
.acLista{position:absolute;z-index:200;left:0;right:0;top:100%;margin-top:2px;
  background:var(--surface);border:1px solid var(--accent);border-radius:5px;
  box-shadow:0 8px 24px rgba(16,36,56,.16);max-height:260px;overflow-y:auto}
.acItem{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:7px 10px;border:0;background:transparent;cursor:pointer;font:inherit;
  border-bottom:1px solid var(--rule-2)}
.acItem:last-child{border-bottom:0}
.acItem:hover,.acItem.on{background:var(--accent-soft)}
.acItem .acD{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acItem .acC{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3)}
.acItem .acP{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.acNada{padding:8px 10px;color:var(--ink-3);font-size:12.5px}

/* Consulta do CNPJ no cadastro do cliente (item 8) */
.cnpjLinha{display:flex;gap:8px;align-items:flex-end}
.cnpjLinha .campo{flex:1;margin-bottom:0}
.cnpjCx{margin:8px 0 14px;padding:10px 12px;border:1px solid var(--rule);
  border-radius:5px;background:var(--surface-2);font-size:12.5px;line-height:1.55}
.cnpjCx b{color:var(--ink)}
.cnpjCx.erro{border-color:var(--crit);background:var(--crit-soft)}
.cnpjCx .btn.mini{margin-left:0;margin-top:6px}

.agGrade{overflow-x:auto;border:1px solid var(--rule);border-radius:5px;background:var(--surface)}
.agGrade table{border-collapse:collapse;width:100%;min-width:820px;font-size:12.5px}
.agGrade th,.agGrade td{border-bottom:1px solid var(--rule-2);padding:7px 9px;text-align:left;
  vertical-align:top}
.agGrade thead th{background:var(--surface-2);position:sticky;top:0;font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);white-space:nowrap}
.agGrade thead th.hoje{color:var(--accent)}
.agGrade td.pessoa{font-weight:600;color:var(--ink);white-space:nowrap;background:var(--surface-2)}
.agCel{min-width:88px}
.agBar{height:4px;border-radius:2px;background:var(--rule-2);overflow:hidden;margin-top:4px}
.agBar i{display:block;height:100%;background:var(--accent)}
.agBar i.cheio{background:var(--crit)} .agBar i.quase{background:var(--warn)}
.agN{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.agH.cheio{color:var(--crit);font-weight:600} .agH.quase{color:var(--warn)}
.agGrade thead th.extra{color:var(--warn)}
.agCel.cheio .agBar i{background:var(--crit)}
.agCel.quase .agBar i{background:var(--warn)}
.agH{font-variant-numeric:tabular-nums}
.agCel.cheio .agH{color:var(--crit);font-weight:600}
.agCel.quase .agH{color:var(--warn)}
.agSem{font-size:10.5px;color:var(--warn)}
.agCel.temItens{cursor:pointer}
.agCel.temItens:hover{background:var(--accent-soft)}
.agCel.temItens:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.agNav{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.agNav .btn.mini{margin-left:0}
.agNav span{font-size:12.5px;color:var(--ink-3)}

/* ── foto do item de catálogo ──────────────────────────────────────────── */
.fotoCat{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--rule);
  background:var(--surface-2);flex:0 0 auto}
.fotoVazia{width:56px;height:56px;border-radius:4px;border:1px dashed var(--rule);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:9.5px;text-align:center;line-height:1.2;flex:0 0 auto}
.bar{height:3px;background:var(--rule-2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}


/* ── catálogo ─────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.fchip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule);cursor:pointer}
.fchip:hover{border-color:var(--accent)}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.linhaCli.off{opacity:.55}
.secTit{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--rule)}
.grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.linhaBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.linhaBtns .btn{flex:1 1 auto}
.btn.perigo{color:var(--crit);border-color:var(--crit)}
.btn.perigo:hover{background:var(--crit-soft)}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:12px;cursor:pointer}
.chk input{width:16px;height:16px;flex:0 0 auto}
.nota{font-size:12px;color:var(--ink-3);line-height:1.45;margin:8px 0 0}


/* ── configurações ────────────────────────────────── */
.cfgWrap{padding:18px;max-width:1100px}
.cfgWrap .chips{margin-bottom:14px}
.linhaU{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:11px 13px;border:1px solid var(--rule);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.linhaU.off{opacity:.55}
.linhaU.pend{border-color:var(--warn);background:var(--warn-soft)}
.linhaU b{display:block;font-size:14.5px;font-weight:600}
.linhaU small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.acoesU{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* formulário de cadastro de pessoa: fica aberto, não escondido atrás de botão */
.formNovo{border:1px solid var(--rule);border-radius:4px;padding:14px;background:var(--bg)}
.formNovo .campo{margin-bottom:0}
.linhaSenha{display:flex;gap:6px;align-items:center}
.linhaSenha input{flex:1 1 auto;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;
  letter-spacing:.02em}
.linhaSenha .btn.mini{margin-left:0;flex:0 0 auto}
.listaHist{margin:10px 0 0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.aviso.ok .btn.mini{margin-left:8px;vertical-align:baseline}
.mini{font-size:13px;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;
  background:var(--surface);max-width:190px}
button.mini{padding:6px 12px;font-weight:600}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface-2);color:var(--ink-3);padding:1px 5px;border-radius:2px;vertical-align:middle}
.tag.adm{background:var(--accent-soft);color:var(--accent)}
.aviso{font-size:13px;line-height:1.5;padding:11px 13px;border-radius:3px;margin-bottom:14px;
  background:var(--warn-soft);color:var(--ink)}
.aviso.ok{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:7px 9px;border-bottom:1px solid var(--rule)}
.tab td{padding:8px 9px;border-bottom:1px solid var(--rule-2)}
.tab a{color:var(--accent);font-weight:600}


/* ── comercial ────────────────────────────────────── */
.comWrap{display:flex;flex-direction:column;height:100%;min-height:0}
.comBoard{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding-top:12px}
.barraCom{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.barraCom input{flex:1 1 240px;max-width:360px;font-family:inherit;font-size:13.5px;
  padding:8px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}

.colCom{flex:0 0 268px;display:flex;flex-direction:column;min-height:0;height:100%}
.colTit{display:flex;align-items:baseline;gap:8px;padding:0 2px 3px}
.colTit b{font-size:13px;font-weight:700;letter-spacing:.01em}
.colTit .cnt{font-size:11.5px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border-radius:2px;padding:1px 6px}
.colSub{font-size:11px;color:var(--ink-3);line-height:1.35;padding:0 2px 8px;min-height:30px}
.colBody{display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding-bottom:20px}
.colVazia{font-size:12px;color:var(--ink-3);opacity:.6;padding:10px 2px;margin:0}
.cardCom{position:relative;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;padding:11px 12px;display:block;width:100%;cursor:pointer}
.cardCom:hover{border-color:var(--accent)}
.cardCom.morno{border-left:3px solid #E0B800}
.cardCom.parado{border-left:3px solid var(--crit)}
.cardCom .logoFaixa{margin:-3px 0 7px}
/* O quadrado da logo: com imagem ou com as iniciais, o tamanho é o mesmo —
   é o que mantém o card do mesmo tamanho antes e depois de a foto chegar. */
.logoCli{display:grid;place-items:center;overflow:hidden;border-radius:3px;flex:0 0 auto;
  background:hsl(var(--h,210) 38% 93%);color:hsl(var(--h,210) 42% 30%)}
.logoCli i{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.02em}
.logoCli img{width:100%;height:100%;object-fit:contain;background:#fff}
.card .cli{display:flex;align-items:center;gap:7px}
.logoOS{width:22px;height:22px}
.logoOS i{font-size:9.5px}
.logoFicha{width:64px;height:64px;border-radius:4px}
.logoFicha i{font-size:22px}

/* ── ITEM 1 (S32): A LOGOMARCA COMO FAIXA NO TOPO DO CARD ────────────────────
   O pedido: a logo é o jeito mais rápido de reconhecer o cliente, e ela estava
   pequena demais (22px) ao lado do número para cumprir esse papel. Vira faixa
   na largura do card, com número e nome embaixo.

   ⚠ A MEDIDA É A ALTURA, EM PIXELS, E NUNCA EM PORCENTAGEM. Dentro de um
   grid com `place-items:center` a altura percentual NÃO RESOLVE: nem
   `height:100%` nem `max-height:100%`. A imagem volta ao tamanho natural, e
   uma logo quadrada de 128px vazava a faixa e saía CORTADA pelo
   `overflow:hidden` — metade da marca some, e o card fica pior do que estava
   antes deste item. Medido no navegador, não deduzido: com `max-height:100%`,
   uma imagem de 128×128 renderizava 128×128 dentro de uma caixa de 218×52.
   Por isso a altura mora em `--faixaH` e vai para os dois lugares em px.

   Com `max-height` em px e `width:auto`, a logo encolhe para caber na altura
   da faixa e NUNCA é ampliada. A miniatura que o quadro carrega tem 128px no
   maior lado (`enviarLogoCliente`) — é o que mantém a carga leve com dezenas
   de clientes de uma vez. Com a logo do print (NANSEN, ~2:1) ela vira 104×52:
   ainda uma REDUÇÃO, nítida. Esticar na LARGURA do card (~300px), como a
   palavra "faixa" do pedido sugeria, seria ampliar 2,3× uma imagem de 128px —
   e logo borrada identifica pior que logo pequena, que é justamente o defeito
   que este item veio corrigir.

   A partir do S32 a miniatura nova sai com 256px, que é o que deixa a faixa
   nítida também em tela retina; quem já tem logo cadastrada continua com a de
   128 até alguém reenviar pelo "Trocar" na ficha — e continua legível, só
   menos fina. */
.logoFaixa{
  --faixaH:88px;
  display:grid;place-items:center;height:var(--faixaH);width:100%;margin:-2px 0 8px;
  border-radius:3px;overflow:hidden;background:hsl(var(--h,210) 38% 93%);
  color:hsl(var(--h,210) 42% 30%)
}
.logoFaixa img{max-width:100%;max-height:var(--faixaH);width:auto;height:auto}
/* Com imagem, o fundo da faixa é BRANCO — a miniatura é JPEG de fundo branco
   (PNG transparente virando JPEG ganha fundo preto, por isso ela é assim
   desde o S17). Deixar o fundo azulado atrás dela punha um retângulo branco
   dentro de uma faixa colorida, que é o efeito de adesivo que o print do
   Trello não tem. Sem imagem, as iniciais mantêm a cor do cliente. */
.logoFaixa.comImg{background:#fff}
/* Sem logo, as iniciais ocupam a mesma faixa — o card não muda de altura
   quando a imagem chega, e não fica um buraco no topo de quem não tem.
   S34: com a faixa em 88px, as iniciais de 21px deixavam a caixa parecendo
   vazia (medido na tela, não suposto: duas letras de 21px dentro de 240×88).
   Crescem junto, mantendo a proporção que o S32 tinha desenhado. */
.logoFaixa i{font-style:normal;font-weight:700;font-size:34px;letter-spacing:.06em}
.card .cli{margin-top:0}
/* onde o cliente fica — mesmo desenho no card do negócio e na gaveta da OS */
/* a régua antes do botão que destrói: separação visual é o que impede o
   clique por inércia depois de dois botões inofensivos */
.listaItens{max-height:210px;overflow-y:auto;border:1px solid var(--rule);border-radius:4px;padding:8px 10px}
/* S34: a lista de equipamentos da proposta passou de UMA linha por vaso para
   até QUATRO (uma por serviço). Com 210px cabia um vaso e meio, e o segundo
   nascia fora da caixa — "campo que só aparece rolando" é o defeito do S24 se
   repetindo numa caixa menor. */
.listaItens.eqProp{max-height:340px}
.listaItens .chk{padding:4px 0}
.reguaPerigo{border:0;border-top:1px solid var(--rule);margin:22px 0 4px}
.blocoLocal{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;margin-bottom:16px;
  background:var(--bg)}
.blocoLocal .lin{display:flex;gap:10px;padding:5px 0;font-size:13px;line-height:1.4}
.blocoLocal .lin+.lin{border-top:1px solid var(--rule-2)}
.blocoLocal .rot{flex:0 0 92px;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.05em;font-weight:700;padding-top:2px}
.blocoLocal .falta{color:var(--ink-3);opacity:.75}
.tripla{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:10px}
@media(max-width:560px){.tripla{grid-template-columns:1fr}}
.mini.ag{background:var(--accent-soft);color:var(--accent)}
.mini.ok{background:var(--ok-soft);color:var(--ok)}
.fichaTopo{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.fichaTopo .lado{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.fichaTopo .lado .btn.mini{margin-left:0}
.logoEdit{display:flex;flex-direction:column;gap:4px;align-items:stretch;width:64px}
.logoEdit .btn.mini{margin-left:0;padding:2px 4px;text-align:center}
.logoSolta.arrastando{outline:2px dashed var(--accent);outline-offset:2px}
.fichaTopo .campos{flex:1 1 auto;min-width:0}
.linhaCt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.linhaCt .papeis{display:flex;gap:4px;flex-wrap:wrap}
.cardCom .num{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.cardCom .cli{font-size:14px;font-weight:600;line-height:1.25;margin:2px 0 1px;padding-right:40px}
.cardCom .tit{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.cardCom .valor{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:5px}
.cardCom .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.mini{font-size:10px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.mini.crit{background:var(--crit-soft);color:var(--crit)}
.mini.warn{background:var(--warn-soft);color:var(--warn)}
/* S38 · item 3: as três faixas do "dias sem interação". O amarelo NÃO é o
   --warn (que é âmbar-terroso, lido como "marrom" ao lado do verde): é um
   amarelo de verdade, com texto escuro para passar no contraste. */
.mini.dsi.verde{background:var(--ok-soft);color:var(--ok)}
.mini.dsi.amarelo{background:#FBEFA6;color:#5E4A00}
.mini.dsi.vermelho{background:var(--crit-soft);color:var(--crit)}
.mini.ag{background:var(--gestao-soft);color:var(--gestao)}
.mini.ct{background:var(--accent-soft);color:var(--accent)}

/* log do card */
.novaNota{background:var(--surface-2);border-radius:3px;padding:11px;margin-bottom:16px}
.novaNota textarea{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink);resize:vertical}
.linhaNota{display:flex;gap:7px;margin-top:7px}
.linhaNota select{flex:1;font-family:inherit;font-size:13px;padding:7px 9px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
.linhaTempo{display:flex;flex-direction:column;gap:0}
.ev{border-left:2px solid var(--rule);padding:9px 0 9px 13px;margin-left:3px}
.ev.contato{border-left-color:var(--accent)}
.ev.decisao{border-left-color:var(--gestao)}
.ev.cobranca{border-left-color:var(--warn)}
.ev .quando{font-size:10.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev .txt{font-size:13.5px;line-height:1.45;margin:2px 0 3px;white-space:pre-wrap}
.ev .quem{font-size:11.5px;color:var(--ink-3)}

/* tarefas */
.tarefaC{display:grid;grid-template-columns:auto 1fr;gap:0 11px;align-items:start;
  padding:11px;border:1px solid var(--rule);border-radius:3px;margin-bottom:7px;background:var(--surface)}
.tarefaC.feita{opacity:.5}
.tarefaC.feita b{text-decoration:line-through}
.tarefaC.atrasada{border-color:var(--crit);background:var(--crit-soft)}
.tarefaC b{display:block;font-size:14px;font-weight:600}
.tarefaC small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.tarefaC .ck{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mk input{width:18px;height:18px}
.agItem{padding:10px 11px;border:1px solid var(--rule);border-radius:3px;margin-bottom:6px;background:var(--surface)}
.agItem b{display:block;font-size:13.5px;font-weight:600}
.agItem small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}


/* ── pedidos de compra ────────────────────────────── */
.pedBox{border:1px solid var(--rule);border-radius:5px;padding:12px;margin-bottom:9px}
.pedBox.semforn{border-color:var(--warn);background:var(--warn-soft)}
.pedTopo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pedTopo .f{font-size:14.5px;font-weight:600}
.pedTopo .q{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pedSub{font-size:12px;color:var(--ink-3);margin:3px 0 9px}
.pedBox .btn{margin:0}
.pedFeito{display:flex;gap:10px;align-items:baseline;padding:7px 2px;
  border-bottom:1px solid var(--rule-2);font-size:13px}
.pedFeito .n{font-size:12px;color:var(--accent);font-weight:700;flex:0 0 auto}
.pedFeito .f{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedFeito .v{font-variant-numeric:tabular-nums}
.pedFeito .s{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}
.painelPed{padding:2px}

/* ── custos e cotações ────────────────────────────── */
.margemBox{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;margin-bottom:12px}
.mg{display:contents}
.mg span{padding:9px 12px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--rule-2)}
.mg b{padding:9px 12px;font-size:13.5px;font-weight:600;text-align:right;
  border-bottom:1px solid var(--rule-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mg.perde b{color:var(--crit)}
.mg.final span,.mg.final b{background:var(--accent-soft);color:var(--accent);font-weight:700;
  border-bottom:none;font-size:15px}
.mg.final b i{font-style:normal;font-size:12.5px;opacity:.8}
.aviso2{background:var(--crit-soft);color:var(--ink);padding:10px 12px;border-radius:3px}
.linhaCusto,.linhaCot,.linhaCompra{display:grid;grid-template-columns:1fr auto auto;gap:0 10px;
  align-items:center;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;
  margin-bottom:5px;background:var(--surface)}
.linhaCusto b,.linhaCot b,.linhaCompra b{display:block;font-size:13.5px;font-weight:600}
.linhaCusto small,.linhaCot small,.linhaCompra small{display:block;font-size:11.5px;
  color:var(--ink-3);margin-top:2px;line-height:1.35}
.linhaCusto .vl,.linhaCot .vl{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.linhaCusto .x{background:none;border:none;color:var(--ink-3);font-size:18px;
  line-height:1;padding:0 4px;cursor:pointer}
.linhaCusto .x:hover{color:var(--crit)}
.grupoCot{margin-bottom:12px}
.gcTit{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:5px}
.linhaCot.on{border-color:var(--accent);background:var(--accent-soft)}
.linhaCot.vencida{opacity:.6}
/* Certificado e lacre: uma linha por peça que exige, cada campo rotulado. Era
   coluna de tabela e nascia fora da largura da gaveta — ver pintarItens(). */
.linhaCal{display:grid;grid-template-columns:1fr 190px 150px;gap:10px;align-items:end;
  padding:9px 0;border-bottom:1px solid var(--rule)}
.linhaCal:last-child{border-bottom:0}
.linhaCal b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.linhaCal small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.linhaCal label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.linhaCal label input{display:block;width:100%;margin-top:3px;font:inherit;font-size:13px;
  padding:5px 7px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.linhaCal label input.falta{border-color:var(--warn);background:var(--warn-soft)}
.linhaCal .nao{font-size:11.5px;color:var(--ink-3);padding-bottom:6px}
@media (max-width:820px){ .linhaCal{grid-template-columns:1fr} }
.linhaCompra{grid-template-columns:1fr auto auto}
.linhaCompra .acaoCompra{display:flex;align-items:center;padding-left:4px}
.linhaCompra .acaoCompra .btn.mini{margin-left:0;padding:3px 9px;font-size:11.5px;white-space:nowrap}
.linhaCompra.recebido .acaoCompra .btn.mini{background:transparent;border-style:dashed}
.linhaCompra.recebido:hover{opacity:1}
.linhaCompra.atrasado{border-left:3px solid var(--crit);background:var(--crit-soft)}
.linhaCompra.chega-logo{border-left:3px solid var(--warn)}
.linhaCompra.recebido{opacity:.55}
.linhaCompra .dt{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.35}
.linhaCompra .dt b{font-size:13px;color:var(--ink);display:inline}
.linhaCompra .dt b.atr{color:var(--crit)}

/* ── gaveta ───────────────────────────────────────── */
/* ⚠ S26 — A PILHA. A barra do topo é `sticky` com z-index 40, e a gaveta era 5:
   desde pelo menos o S15 a barra cobria os primeiros 54 px da gaveta — o
   número da OS, o nome do cliente e o × de fechar nunca apareceram (no lugar
   do ×, quem recebia o clique era o botão "Atualizar"). O modal (9) e a tela
   de login (10) também ficavam por baixo da barra. A ordem agora é uma só:
   barra 40 · fita da busca 30 · menu lateral 60 (acima da gaveta, como era) ·
   gaveta 42/43 · modal 70/71 · aviso (toast) 80 · login 90 · menus 200. */
.scrim{position:fixed;inset:0;background:rgba(16,26,28,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:42}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);
  border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column;z-index:43;
}
.drawer.on{transform:none}
.d-h{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:10px}
.d-h .num{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.d-h h2{margin:2px 0 0;font-size:18px;font-weight:600;line-height:1.2}
.d-h .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink-3);line-height:1;padding:0 2px}
.d-b{flex:1;overflow-y:auto;padding:14px 16px}

.fase-h{
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 7px;display:flex;align-items:center;gap:8px;
}
.fase-h:first-child{margin-top:0}
.fase-h.atual{color:var(--accent)}
.fase-h::after{content:"";flex:1;height:1px;background:var(--rule-2)}

.tk{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--rule-2);align-items:flex-start}
.tk:last-child{border-bottom:0}
.tk .st{flex:0 0 17px;text-align:center;font-size:13px;line-height:1.4}
.tk .nm{flex:1;font-size:13.5px;line-height:1.35}
.tk .nm small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.tk.res .nm{color:var(--ink-3)}
.tk.res .nm b{font-weight:400}
.tk.atual{background:var(--accent-soft);margin:0 -8px;padding:8px 6px;border-radius:5px;
  border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(27,111,169,.12)}
.tk.atual .nm{font-weight:600}

.acoes{border-top:1px solid var(--rule);padding:12px 16px;background:var(--surface-2)}
.acoes .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.acoes .row{display:flex;gap:8px;flex-wrap:wrap}
.acoes .hint{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.4}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:min(520px,92vw);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--crit)}
.toast.ok{background:var(--ok)}

.vazio{padding:60px 20px;text-align:center;color:var(--ink-3)}
.vazio h3{font-size:17px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.vazio p{font-size:13.5px;margin:0;line-height:1.5}

/* ── abas da gaveta ───────────────────────────────── */
/* S26: no celular (390 px) as sete abas da OS somam ~470 px e "Histórico"
   nascia fora da tela, sem rolagem — aba que não se alcança é aba que não
   existe. A faixa rola de lado; no computador nada muda (as abas se esticam). */
.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto;
  overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;
  padding:10px 6px;font-size:13px;font-weight:600;color:var(--ink-3)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.drawer{width:min(620px,100%)}

/* ── tabela de itens ──────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 5px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:6px 5px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* S38 · item 2: a prévia do anexo por vaso pinta a célula vencida como o Word vai pintar */
.tbl td.venc{background:#FFF176;color:#3A3000;font-weight:600}
.anexoPrev{margin:0 0 14px}
.anexoPrev .tbl{font-size:12px}
.anexoPrev .tbl th,.anexoPrev .tbl td{white-space:nowrap}
.tbl input{width:100%;padding:6px 7px;border:1px solid var(--rule);border-radius:3px;
  font-size:13px;background:var(--surface);min-width:64px}
.tbl input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tbl input.falta,.tbl select.falta{border-color:var(--gestao);background:var(--gestao-soft)}
.tbl select{font:inherit;font-size:12.5px;padding:5px 6px;border:1px solid var(--rule);
  border-radius:5px;background:var(--surface);color:var(--ink);max-width:190px}
.tbl select:disabled{opacity:.6}
/* S26: campo desabilitado tem que PARECER desabilitado — o inspetor via a aba
   Itens com caixas brancas que não aceitavam nada, e isso lê como defeito. */
.tbl input:disabled,.linhaCal input:disabled{background:var(--paper);color:var(--ink-2);cursor:not-allowed}
.tbl tr.fora{opacity:.55}
.tbl tr.fora td:first-child::after{content:" · fora do orçamento";font-size:10.5px;color:var(--ink-3)}
.tbl tr.fora.retirado td:first-child::after{content:none}
.tbl tr.fora.retirado{opacity:1}
.tbl tr.fora.retirado td{color:var(--ink-3)}
.tbl .motivoRet{text-decoration:none;display:block;margin:2px 0 0;font-size:11.5px}
.btn.mini.tirarItem{margin:4px 0 0}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:14px}
.totais div{background:var(--surface);padding:9px 11px}
.totais .k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.totais .v{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:18px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:2px}
.totais .v.pos{color:var(--ok)} .totais .v.neg{color:var(--crit)}

/* ── cadastros ────────────────────────────────────── */
.cadWrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;height:100%;
  align-items:start;min-width:min-content}
.painel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:16px 18px;box-shadow:var(--shadow)}
.painel h3{margin:0 0 12px;font-size:17px}
.lista{max-height:calc(100vh - 210px);overflow-y:auto;margin:-4px -6px;padding:4px 6px}
.linhaCli{width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;padding:10px 12px;margin-bottom:6px;display:block}
.linhaCli.on{border-color:var(--accent);background:var(--accent-soft)}
.linhaCli b{display:block;font-size:14.5px;font-weight:600}
.linhaCli small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

/* ── formulários ──────────────────────────────────── */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 11px;border:1px solid var(--rule);
  border-radius:3px;font-size:14px;background:var(--surface);font-family:inherit}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.campo .dica{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.dica{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.gGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.gGrid .campo label{font-size:11px}
.gGrid .campo input{padding:7px 9px;font-size:13px}
.gGrid .campo input.vazio{border-color:var(--warn);background:var(--warn-soft)}
.gFalta{font-size:12.5px;color:var(--warn);margin:11px 0 0;line-height:1.45;font-weight:600}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── modal ────────────────────────────────────────── */
.mScrim{position:fixed;inset:0;background:rgba(16,26,28,.45);z-index:70}
.modal{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(480px,calc(100% - 28px));max-height:86vh;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;box-shadow:var(--sh-lift);
  display:flex;flex-direction:column}
.m-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
.m-h h3{margin:0;font-size:17px;flex:1}
.m-b{padding:16px;overflow-y:auto}
.m-f{padding:12px 16px;border-top:1px solid var(--rule);background:var(--surface-2);
  display:flex;gap:8px;justify-content:flex-end}

/* ── TF · motor de tabela ─────────────────────────── */
.tfWrap{border:1px solid var(--rule);border-radius:5px;overflow:auto;background:var(--surface);
  max-height:calc(100vh - var(--header-h) - 200px)}
.tfTab{width:100%;border-collapse:collapse}
.tfTab thead th{position:sticky;top:0;z-index:5;background:var(--surface-2);padding:0;
  border-bottom:1px solid var(--rule);white-space:nowrap;text-align:left}
.tfTab thead th.num{text-align:right}
.tfTh{display:flex;align-items:center;gap:5px;width:100%;padding:8px 11px;background:none;
  border:0;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);transition:background var(--t),color var(--t);text-align:left;font-family:inherit}
.tfTh:hover{background:var(--rule-2);color:var(--ink)}
th.num .tfTh{justify-content:flex-end}
.tfOrd{font-size:8px;color:var(--accent)}
.tfFun{font-size:10px;opacity:.35;margin-left:auto}
th.num .tfFun{margin-left:4px}
.tfTh:hover .tfFun{opacity:.8}
th.filtrada .tfTh{color:var(--accent)}
th.filtrada .tfFun{opacity:1}
.tfTab td{padding:7px 11px;border-bottom:1px solid var(--rule-2);vertical-align:top;font-size:12.5px}
.tfTab td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tfTab tbody tr:nth-child(even) td{background:var(--surface-2)}
.tfTab tbody tr:hover td{background:var(--accent-soft)}
.tfTab tbody tr.clicavel{cursor:pointer}
.tfTab tbody tr.atrasada td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.tfTab tbody tr:last-child td{border-bottom:0}

.tfRodape{display:flex;align-items:center;gap:12px;padding:9px 2px 2px;flex-wrap:wrap}
.tfConta{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.tfConta b{color:var(--ink)}
.tfPag{display:flex;gap:3px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tfPag button{min-width:28px;height:28px;border:1px solid var(--rule);background:var(--surface);
  border-radius:4px;font-size:12px;color:var(--ink-2);font-family:var(--mono);padding:0 6px}
.tfPag button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tfPag button.atual{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tfPag button:disabled{opacity:.35;cursor:default}
.tfEl{color:var(--ink-3);padding:0 2px}

/* `.tog` e `.chk` eram usadas pelo gerador de proposta e nunca existiram no
   CSS: os dois botões saíam nus, sem indicar qual estava escolhido. */
.tog{display:flex;gap:7px;flex-wrap:wrap}
.tog button{flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--rule);
  background:var(--surface);border-radius:4px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);font-family:inherit;transition:all var(--t)}
.tog button:hover{border-color:var(--accent);color:var(--accent)}
.tog button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--rule);
  border-radius:4px;font-size:13px;background:var(--surface);cursor:pointer;margin-bottom:9px}
.check input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}

.tfChips{display:none;gap:6px;align-items:center;flex-wrap:wrap;padding:0 0 9px}
.tfChips.on{display:flex}
.tfChip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  border:1px solid transparent;color:var(--accent-ink);border-radius:99px;padding:3px 10px;
  font-size:11.5px;font-weight:600}
.tfChip button{border:0;background:none;color:inherit;font-size:13px;line-height:1;padding:0}
.tfLimpa{border:0;background:none;color:var(--crit);font-size:11.5px;font-weight:700;
  font-family:inherit;text-decoration:underline;padding:0}

.vazio2{text-align:center;padding:34px 18px;color:var(--ink-3)}
.vazio2 b{display:block;font-size:14.5px;color:var(--ink-2);margin-bottom:5px}
.vazio2 p{font-size:12.5px;margin:0;line-height:1.5}

.tfMenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--rule);
  border-radius:6px;box-shadow:var(--sh-lift);width:250px;display:flex;flex-direction:column;overflow:hidden}
.tfmOrd{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rule-2)}
.tfmOrd button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
  padding:5px;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.tfmOrd button:hover{border-color:var(--accent);color:var(--accent)}
.tfmB{padding:8px 10px 4px}
.tfmB input{width:100%;background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;
  padding:6px 9px;font-size:12px;font-family:inherit;outline:none}
.tfmB input:focus{border-color:var(--accent);background:var(--surface)}
.tfmLista{max-height:230px;overflow:auto;padding:4px 0}
.tfmItem{display:flex;align-items:center;gap:8px;padding:4px 11px;font-size:12px;cursor:pointer}
.tfmItem:hover{background:var(--surface-2)}
.tfmItem input{accent-color:var(--accent);flex:0 0 auto}
.tfmItem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfmItem i{font-style:normal;font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.tfmMais{font-size:11px;color:var(--ink-3);padding:6px 11px;margin:0}
.tfmPe{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--rule-2)}
.tfmPe button{flex:1;border:1px solid var(--rule);background:var(--surface);border-radius:4px;
  padding:5px;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.tfmPe button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* A fita da busca FLUTUA no pé do quadro. Até o S24 ela era `absolute` sem
   posição, dentro da fileira de colunas: nascia em cima do cabeçalho da
   primeira coluna, cobrindo o nome dela — e com o botão "Limpar a busca" do
   S25 o clique ia para a coluna, não para o botão. Embaixo ela não cobre
   nome de coluna nenhum, e continua dentro do #board: trocar de tela a apaga
   junto com o resto. */
.fitaBusca{position:fixed;z-index:30;bottom:30px;
  left:calc(var(--nav-w) + (100vw - var(--nav-w)) / 2);transform:translateX(-50%);
  background:var(--accent-soft);border:1px solid var(--accent);box-shadow:var(--sh-lift);
  color:var(--accent-ink);font-size:12px;font-weight:600;padding:6px 12px;border-radius:4px;
  white-space:nowrap;max-width:calc(100vw - var(--nav-w) - 24px);overflow:hidden;text-overflow:ellipsis}
.fitaLimpa{margin-left:10px;border:0;background:none;padding:0;font:inherit;font-weight:700;
  color:var(--accent);text-decoration:underline;cursor:pointer}
.conta{font-size:11.5px;font-weight:400;color:var(--ink-3);font-family:var(--mono);margin-left:6px}
.linhaCli.incompleto b::after{content:' · cadastro incompleto';font-size:10.5px;
  font-weight:600;color:var(--warn)}

/* ── telas de lista e relatório ───────────────────── */
.tela{max-width:1180px;min-width:0;padding-bottom:34px}
.board.livre{min-width:0;max-width:100%}
.telaCab{margin-bottom:16px}
.telaCab h2{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.telaCab p{font-size:13px;color:var(--ink-3);margin:0;line-height:1.5}
.forte{font-weight:700;color:var(--accent-ink)}
.btn.ocupado{opacity:.7;cursor:progress}

.relTipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-bottom:15px}
.relTipo{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  padding:11px 13px;transition:border-color var(--t),background var(--t)}
.relTipo:hover{border-color:var(--accent)}
.relTipo.on{border-color:var(--accent);background:var(--accent-soft)}
.relTipo b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.relTipo.on b{color:var(--accent-ink)}
.relTipo span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}

.relBarra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-bottom:16px}
.relBarra .rot{font-size:12px;color:var(--ink-3)}
.relBarra input[type=date]{height:30px;padding:0 7px;font-size:12.5px;border:1px solid var(--rule);
  border-radius:4px;background:var(--surface);font-family:inherit;color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:11.5px}
.relSaidas{display:inline-flex;gap:8px;flex:0 0 auto}

.relKpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:18px}
.relKpi{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px}
.relKpi b{display:block;font-size:21px;font-weight:700;color:var(--accent-ink);
  font-family:var(--mono);letter-spacing:-.02em;line-height:1.15}
.relKpi span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.relBloco{margin-bottom:22px}
.relBloco h3{font-size:14px;font-weight:600;margin:0 0 5px}
.relBloco .nota{margin:0 0 8px}
.tfThFixo{display:block;padding:8px 11px;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
th.num .tfThFixo{text-align:right}

/* ── login ────────────────────────────────────────── */
.login{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.login .box{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:26px;width:min(360px,100%);box-shadow:var(--sh-lift)}
.login h1{font-size:24px;margin:0 0 3px;letter-spacing:-.02em}
.login h1 span{color:var(--accent)}
.login p{font-size:13px;color:var(--ink-3);margin:0 0 18px}
.login label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.login input{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;font:inherit;margin-bottom:12px;background:var(--surface-2)}
.login input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.login .btn{width:100%;padding:10px;justify-content:center}
.login .erro{font-size:12.5px;color:var(--crit);margin:0 0 10px;min-height:16px}
/* Olho de ver a senha (S30). O botão mora DENTRO da caixa do campo, então a
   margem de baixo passa do input para a caixa — no input ela empurrava o olho
   para cima do rótulo seguinte. */
.login .cxSenha{position:relative;margin-bottom:12px}
.login .cxSenha input{margin-bottom:0;padding-right:42px}
.login .olho{position:absolute;top:0;right:0;bottom:0;width:40px;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:0;background:none;color:var(--ink-3);cursor:pointer}
.login .olho:hover{color:var(--ink)}
.login .olho svg{width:19px;height:19px;display:block}
.login .olho .fechado{display:none}
.login .olho.ver .aberto{display:none}
.login .olho.ver .fechado{display:block}

@media (max-width:640px){
  header{padding:8px 11px;gap:9px}

  main{padding:9px}
  .col{flex-basis:246px}
  .who{display:none}
}

/* ── S28 ───────────────────────────────────────────────────────────────────── */
/* item 1: anotação anulada — continua visível, riscada, com o motivo */
.ev.anulada .txt{text-decoration:line-through;color:var(--ink-3)}
.ev.anulada{border-left-color:var(--crit-soft)}
.ev.auto .txt{color:var(--ink-2)}
.ev .quem{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev .evAnular{margin-left:auto;color:var(--crit);border-color:var(--crit-soft)}
.anuladaMotivo{font-size:12px;color:var(--crit);margin-top:4px;line-height:1.4}
.anuladaMotivo b{letter-spacing:.06em;font-size:10.5px}
.ev.naOS{margin-left:0;border-left-width:2px}
.citaAnular{margin:10px 0;padding:8px 11px;border-left:3px solid var(--rule);
  background:var(--surface-2);font-size:13px;white-space:pre-wrap}
/* item 3: desconto geral — três caixas separadas, com a palavra que as distingue */
.descG{border:1px solid var(--rule);border-radius:6px;padding:12px;margin:6px 0 16px;background:var(--surface)}
.descGTit{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.descGTit span{text-transform:none;letter-spacing:0;font-weight:400}
.descGGrade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.descGCx{border-radius:5px;padding:9px 10px;border:1px solid var(--rule)}
.descGCx label{display:block;font-size:12.5px;font-weight:700;margin:0}
.descGCx small{display:block;font-size:11.5px;color:var(--ink-3);margin:1px 0 6px}
.descGCx.pct{background:var(--surface-2)}
.descGCx.sai{background:var(--crit-soft);border-color:transparent}
.descGCx.sai small b{color:var(--crit)}
.descGCx.fica{background:var(--ok-soft);border-color:transparent}
.descGCx.fica small b{color:var(--ok)}
.descGInp{display:flex;align-items:center;gap:6px}
.descGInp span{font-weight:700;font-size:13px;white-space:nowrap}
.descGInp input{flex:1;min-width:0;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--rule);
  border-radius:4px;text-align:right;font-variant-numeric:tabular-nums;background:#fff}
.descGInp input.calc{background:transparent;border-style:dashed;color:var(--ink-2)}
/* S34: valor que não é número não se apaga sozinho — fica na tela, marcado,
   até a pessoa arrumar. Campo que se limpa calado é campo que come o que foi
   digitado. */
.descGInp input.ruim{border-color:var(--crit);background:var(--crit-soft)}
.dica.erro{color:var(--crit);font-weight:600}
.dica.aviso{color:var(--warn);font-weight:600}
.descGPrev{margin:10px 0;font-size:13px;line-height:1.5;padding:9px 11px;border-radius:4px;background:var(--surface-2)}
.descGPrev.pronto{background:var(--accent-soft)}
.descGPrev.alto{background:var(--warn-soft)}
.descGPrev.erro{background:var(--crit-soft);color:var(--crit);font-weight:600}
.descGPrev .seta{margin:0 7px;color:var(--ink-3)}
.descGPrev b{font-variant-numeric:tabular-nums}
.descGNotas{font-size:12px;color:var(--ink-2);margin-top:4px}
.descGNotas:empty{display:none}
/* item 4: gerador no negócio */
.gerDet{border:1px solid var(--rule);border-radius:6px;margin:18px 0 6px;background:var(--surface)}
.gerDet>summary{cursor:pointer;padding:10px 12px;display:flex;flex-direction:column;gap:2px;list-style:none}
.gerDet>summary::-webkit-details-marker{display:none}
.gerDet>summary .secTit{border-top:0;padding-top:0}
.gerDet>summary .secTit:before{content:'▸ ';color:var(--accent)}
.gerDet[open]>summary .secTit:before{content:'▾ '}
.gerDet>summary .nota{margin:0;font-size:12px}
.gerDet>#npGer{padding:0 12px 12px}
.gerNeg{padding-top:4px}
.gerCaixa{border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 14px}
.gerCaixaT{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.docCel{font-size:12px;white-space:nowrap}
/* item 5: prévia da logo */
.logoGer{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:5px;
  padding:9px 11px;margin:0 0 14px}
.logoGer img{height:40px;max-width:120px;object-fit:contain}
/* item 7: rótulo da tarefa atual com o nome */
.acoes .lbl.lblAtual{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);cursor:pointer}
.acoes .lbl.lblAtual span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.acoes .lbl.lblAtual b{color:var(--accent-ink)}
/* item 9: compromisso avulso na agenda */
.agCabTopo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.agCabTopo #agComp{margin-left:auto}
.agT.agAv{background:var(--surface-2);border-radius:4px}
