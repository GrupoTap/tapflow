  if (!el) return;
  const comTapWeb = equips.filter(x => x.tapweb_em).length;
  let h = '<div class="secTit">Equipamentos</div>';
  if (!equips.length){
    h += '<p class="nota">Nenhum equipamento. Sem TAG cadastrada, o inspetor lança o item '
      +  'sem vínculo com o vaso.</p>';
  }
  equips.forEach(x => {
    const venc = SERVICOS_NR13.filter(sv => x[sv.campo]);
    h += '<div class="linhaCt"><div><b>' + esc(x.tag) + '</b>'
      + (x.nome ? ' <span class="nota">' + esc(x.nome) + '</span>' : '')
      + '<small style="display:block;color:var(--ink-3);font-size:12px">'
      + esc([x.tipo, x.localizacao, x.pmta ? 'PMTA ' + x.pmta : ''].filter(Boolean).join(' · '))
      + '</small>'
      + (x.tapweb_desativado_em
          ? '<small style="display:block;font-size:12px;color:var(--warn)">Desativado no TapWeb em '
            + esc(dataBR(x.tapweb_desativado_em)) + '</small>'
          : venc.length
            ? '<small style="display:block;font-size:12px">'
              + venc.map(sv => '<span class="chip' + (vencido(x[sv.campo]) ? ' crit' : '') + '">'
                  + esc(sv.curto) + ' ' + esc(dataBR(x[sv.campo])) + '</span>').join(' ')
              + '</small>'
            : '')
      + (x.tapweb_em
          ? '<small style="display:block;color:var(--ink-3);font-size:11.5px">'
            + 'TapWeb · ' + esc(dataBR(x.tapweb_em)) + '</small>'
          : '')
      + '</div></div>';
  });

  // ── ITEM 2 (S34): a porta do importador ─────────────────────────────────
  // Fica DENTRO da ficha de um cliente, nunca numa tela solta de importação:
  // a planilha do TapWeb não tem coluna que diga de quem ela é, e é o fluxo
  // que impede subir a do cliente errado.
  h += '<div class="secTit">Vencimentos (TapWeb)</div>'
    +  '<p class="nota">Suba aqui o relatório de equipamentos que o TapWeb gera para '
    +  '<b>' + esc(nomeCliente(cli)) + '</b>. Ele atualiza o nome e as quatro datas de '
    +  'vencimento — o resto (categoria, local, fluido, volume, PMTA) continua só no '
    +  'TapWeb, que é a fonte de verdade dos vasos. Nada é gravado antes de uma prévia.</p>'
    +  (comTapWeb
        ? '<p class="nota"><b>' + comTapWeb + '</b> de ' + equips.length
          + ' equipamento(s) já vieram de uma planilha do TapWeb.</p>' : '')
    +  '<input id="eqTW" type="file" accept=".xlsx,.csv,text/csv" style="font-size:12px">'
    +  '<p class="dica">Aceita <b>.xlsx</b> e <b>.csv</b>. Se o seu arquivo for .xls antigo, '
    +  'abra no Excel e salve como .xlsx.</p>';

  // ⚠ O campo "Nome" é digitável aqui, e não só importado, por uma razão
  // concreta: a planilha de referência do TapWeb NÃO TEM coluna de nome
  // (Tag, Status, Data Desativação, as quatro datas, Setor, Calibração
  // Válvula, Local, Categoria, Tipo Fluido, Volume, Unidade Medida, PMTA,
  // Unidade Medida PMTA, Observação). O item 2 pede o campo; o importador já
  // sabe lê-lo se um dia ele aparecer no relatório, e até lá quem preenche é
  // quem está aqui. Campo que só se preenche por um caminho que ainda não
  // existe é campo que nasce vazio para sempre.
  h += '<div class="secTit">Acrescentar um equipamento</div>'
    +  '<div class="campo"><label for="eqN">Nome (opcional)</label>'
    +  '<input id="eqN" type="text" placeholder="Ex.: Pulmão da linha 2"></div>'
    +  '<div class="dupla"><div class="campo"><label for="eqT">TAG</label>'
    +  '<input id="eqT" type="text" placeholder="VP-01"></div>'
    +  '<div class="campo"><label for="eqK">Tipo</label><select id="eqK">'
    +  '<option value="vaso">Vaso de pressão</option><option value="caldeira">Caldeira</option>'
    +  '<option value="tanque">Tanque</option><option value="tubulacao">Tubulação</option>'
    +  '<option value="outro">Outro</option></select></div></div>'
    +  '<div class="dupla"><div class="campo"><label for="eqL">Local</label>'
    +  '<input id="eqL" type="text"></div>'
    +  '<div class="campo"><label for="eqP">PMTA</label>'
    +  '<input id="eqP" type="number" step="0.01" inputmode="decimal"></div></div>'
    +  '<button class="btn" id="eqAdd" style="width:100%;padding:9px">Adicionar equipamento</button>';
  el.innerHTML = h;

  const tw = document.getElementById('eqTW');
  if (tw) tw.addEventListener('change', async () => {
    const f = tw.files && tw.files[0];
    tw.value = '';
    if (f) await importarTapWeb(cli, f, tw);
  });

  document.getElementById('eqAdd').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const tag = document.getElementById('eqT').value.trim();
      if (!tag){ toast('Informe a TAG.','err'); return; }
      const obj = { cliente_id: cli.id, tag, tipo: document.getElementById('eqK').value,
        nome: document.getElementById('eqN').value.trim() || null,
        localizacao: document.getElementById('eqL').value.trim() || null,
        pmta: parseFloat(document.getElementById('eqP').value) || null };
      try{
        if (DEMO) demoAddEquip(obj); else await post('equipamentos', obj);
        toast('Equipamento cadastrado.','ok'); detalheCliente(cli);
      }catch(err){
        toast(/duplicate|unique|ux_equip/i.test(err.message)
          ? 'Este cliente já tem um equipamento com essa TAG.' : err.message, 'err');
      }
    });
  });
}

function demoAgendaEquipe(){
  // Cobre o PERÍODO da vista atual, não uma janela fixa: senão a vista de mês
  // aparece vazia e a demonstração aprova um calendário que não desenha nada.
  const p = agPeriodo();
  const linhas = [];
  const gente = [['u3','Inspetor 1'],['u4','Inspetor 2'],['u1','Túlio'],['u2','Vinícius']];
  let i = 0;
  for (let dia = p.de; dia <= p.ate; dia = agSoma(dia, 1)){
    if (!agEhUtil(dia)) continue;
    i++;
    gente.forEach(([id, nome], gi) => {
      if ((i + gi) % 5 === 4) return;                    // nem todo mundo todo dia
      const min = [180, 420, 540, 610, 90, 300][(i + gi) % 6];
      const cap = agCap(dia) || 480;
      linhas.push({ usuario_id:id, usuario:nome, dia, tarefas: 1 + ((i + gi) % 3),
        minutos:min, sem_estimativa: (i + gi) % 4 === 0 ? 1 : 0,
        capacidade_min:cap, ocupacao: Math.round(min / cap * 100) / 100 });
    });
  }
  return linhas;
}

// TRAVA DE DUPLO ENVIO
// ----------------------------------------------------------------------------
// Duplo clique num botão que grava = dois registros. O remendo mora no
// `onclick`, não dentro da função de salvar: assim vale para todas sem obrigar
// a refatorar nenhuma.
//   uso: onclick="_semDuploEnvio_(this, salvarX)"  ou  (this, () => f(a,b))
// ════════════════════════════════════════════════════════════════════════════
async function _semDuploEnvio_(btn, fn){
  if (btn && btn.dataset.enviando === '1') return;      // o segundo clique morre aqui
  if (btn) btn.dataset.enviando = '1';
  const txt = btn ? btn.textContent : null;
  const desab = btn ? btn.disabled : false;
  if (btn){ btn.disabled = true; btn.classList.add('ocupado'); btn.textContent = 'Processando…'; }
  try{ return await fn(); }
  finally{
    if (btn){ btn.disabled = desab; btn.classList.remove('ocupado');
              btn.textContent = txt; delete btn.dataset.enviando; }
  }
}

// ════════════════════════════════════════════════════════════════════════════
// TF — o motor de tabela
// ----------------------------------------------------------------------------
// Ordenação por coluna, filtro por valor, paginação e cabeçalho fixo, com o
// estado guardado FORA do DOM. É isso que faz o filtro sobreviver ao re-render:
// no desenho antigo, qualquer atualização em segundo plano apagava o que a
// pessoa tinha filtrado, e ela reclamava que "o sistema volta sozinho".
//
// Cada tela declara as colunas e de onde vêm os dados; o motor faz o resto.
// ════════════════════════════════════════════════════════════════════════════
const TF = { inst: {} };

function tfReg(id, cfg){
  if (!TF.inst[id]) TF.inst[id] = { s:{ ordem:null, dir:1, filtros:{}, pag:1, porPag:50 } };
  TF.inst[id].cfg = cfg;
  return TF.inst[id];
}

const tfCasca = id =>
  '<div class="tfChips" id="tf_' + id + '_chips"></div>' +
  '<div class="tfWrap" id="tf_' + id + '_wrap"><table class="tfTab">' +
  '<thead><tr id="tf_' + id + '_head"></tr></thead>' +
  '<tbody id="tf_' + id + '_body"></tbody></table></div>' +
  '<div class="tfRodape"><div class="tfConta" id="tf_' + id + '_conta"></div>' +
  '<div class="tfPag" id="tf_' + id + '_pag"></div></div>';

function tfLinhas(id){
  const I = TF.inst[id]; if (!I || !I.cfg) return [];
  let d = I.cfg.dados() || [];
  // índice de busca memoizado na própria linha: sem isso são milhares de
  // normalizações por tecla digitada
  if (I.cfg.textoBusca) for (const r of d) if (r._tfBusca === undefined) r._tfBusca = norm(I.cfg.textoBusca(r));
  const q = I.cfg.consulta ? I.cfg.consulta() : '';
  if (q && I.cfg.textoBusca){
    const termos = norm(q).split(/\s+/).filter(Boolean);
    d = d.filter(r => termos.every(t => r._tfBusca.includes(t)));
  }
  for (const k in I.s.filtros){
    const vals = I.s.filtros[k];
    if (!vals || !vals.length) continue;
    const c = I.cfg.colunas.find(x => x.k === k); if (!c) continue;
    d = d.filter(r => vals.includes(String(tfValor(c, r) ?? '')));
  }
  if (I.s.ordem){
    const c = I.cfg.colunas.find(x => x.k === I.s.ordem);
    if (c) d = d.slice().sort((a,b) => {
      let va = tfValor(c,a), vb = tfValor(c,b);
      const ea = (va == null || va === ''), eb = (vb == null || vb === '');
      if (ea && eb) return 0;
      if (ea) return 1;            // vazio vai sempre para o fim, nos dois sentidos
      if (eb) return -1;
      if (c.tipo === 'num'){ va = Number(va)||0; vb = Number(vb)||0; }
      else { va = norm(va); vb = norm(vb); }
      return (va < vb ? -1 : va > vb ? 1 : 0) * I.s.dir;
    });
  }
  return d;
}
const tfValor = (c, r) => c.valor ? c.valor(r) : r[c.k];

function tfRender(id){
  const I = TF.inst[id]; if (!I || !I.cfg) return;
  const cab = document.getElementById('tf_' + id + '_head');
  const cor = document.getElementById('tf_' + id + '_body');
  if (!cab || !cor) return;

  cab.innerHTML = I.cfg.colunas.map(c => {
    const ord = I.s.ordem === c.k ? (I.s.dir > 0 ? '▲' : '▼') : '';
    const fil = (I.s.filtros[c.k] || []).length ? ' filtrada' : '';
    return '<th class="' + (c.tipo === 'num' ? 'num' : '') + fil + '"'
      + (c.larg ? ' style="width:' + c.larg + '"' : '') + '>'
      + '<button type="button" class="tfTh" data-k="' + c.k + '">'
      + '<span>' + esc(c.rot) + '</span><span class="tfOrd">' + ord + '</span>'
      + (c.filtro === false ? '' : '<span class="tfFun" aria-hidden="true">⌄</span>')
      + '</button></th>';
  }).join('');
  cab.querySelectorAll('.tfTh').forEach(b =>
    b.addEventListener('click', e => tfMenu(e, id, b.dataset.k)));

  const todas = tfLinhas(id);
  const tot = todas.length;
  const pp = I.s.porPag;
  const nPag = Math.max(1, Math.ceil(tot / pp));
  if (I.s.pag > nPag) I.s.pag = nPag;
  const ini = (I.s.pag - 1) * pp;
  const pagina = todas.slice(ini, ini + pp);

  if (!tot){
    const temFiltro = Object.values(I.s.filtros).some(v => v && v.length)
      || (I.cfg.consulta && I.cfg.consulta());
    cor.innerHTML = '<tr><td colspan="' + I.cfg.colunas.length + '">'
      + '<div class="vazio2"><b>' + (temFiltro ? 'Nada com esses filtros' : (I.cfg.vazio || 'Nada por aqui'))
      + '</b><p>' + (temFiltro
          ? 'Ajuste a busca ou <button type="button" class="tfLimpa" id="tf_' + id + '_limpa">limpe os filtros</button>.'
          : esc(I.cfg.vazioSub || '')) + '</p></div></td></tr>';
    const lb = document.getElementById('tf_' + id + '_limpa');
    if (lb) lb.addEventListener('click', () => tfLimpar(id));
  } else {
    cor.innerHTML = '';
    pagina.forEach(r => {
      const tr = document.createElement('tr');
      if (I.cfg.classeLinha){ const cl = I.cfg.classeLinha(r); if (cl) tr.className = cl; }
      tr.innerHTML = I.cfg.colunas.map(c =>
        '<td class="' + (c.tipo === 'num' ? 'num' : '') + '">'
        + (c.render ? c.render(r) : esc(tfValor(c, r) ?? '')) + '</td>').join('');
      if (I.cfg.aoClicar){ tr.classList.add('clicavel'); tr.addEventListener('click', () => I.cfg.aoClicar(r)); }
      cor.appendChild(tr);
    });
  }

  document.getElementById('tf_' + id + '_conta').innerHTML = tot
    ? '<b>' + (ini + 1) + '–' + Math.min(ini + pp, tot) + '</b> de <b>' + tot + '</b>'
      + (I.cfg.unidade ? ' ' + I.cfg.unidade : '')
    : '';
  tfPaginador(id, nPag);
  tfChips(id);
}

function tfPaginador(id, nPag){
  const I = TF.inst[id];
  const el = document.getElementById('tf_' + id + '_pag');
  if (nPag <= 1){ el.innerHTML = ''; return; }
  const p = I.s.pag;
  const nums = new Set([1, nPag, p, p-1, p+1, p-2, p+2]);
  const lista = [...nums].filter(n => n >= 1 && n <= nPag).sort((a,b) => a-b);
  let h = '<button type="button" aria-label="Página anterior" data-p="' + (p-1) + '"'
        + (p === 1 ? ' disabled' : '') + '>‹</button>';
  let ant = 0;
  lista.forEach(n => {
    if (n - ant > 1) h += '<span class="tfEl">…</span>';
    h += '<button type="button" data-p="' + n + '"' + (n === p ? ' class="atual" aria-current="page"' : '')
       + ' aria-label="Página ' + n + '">' + n + '</button>';
    ant = n;
  });
  h += '<button type="button" aria-label="Próxima página" data-p="' + (p+1) + '"'
     + (p === nPag ? ' disabled' : '') + '>›</button>';
  el.innerHTML = h;
  el.querySelectorAll('button[data-p]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.p);
    if (n >= 1 && n <= nPag){ I.s.pag = n; tfRender(id);
      const w = document.getElementById('tf_' + id + '_wrap'); if (w) w.scrollTop = 0; }
  }));
}

function tfChips(id){
  const I = TF.inst[id];
  const el = document.getElementById('tf_' + id + '_chips');
  const ativos = Object.entries(I.s.filtros).filter(([,v]) => v && v.length);
  if (!ativos.length){ el.className = 'tfChips'; el.innerHTML = ''; return; }
  el.className = 'tfChips on';
  el.innerHTML = ativos.map(([k, v]) => {
    const c = I.cfg.colunas.find(x => x.k === k);
    return '<span class="tfChip">' + esc((c && c.rot) || k) + ': '
      + esc(v.length > 2 ? v.length + ' valores' : v.map(x => x || '(vazio)').join(', '))
      + '<button type="button" data-k="' + k + '" aria-label="Tirar este filtro">×</button></span>';
  }).join('') + '<button type="button" class="tfLimpa" id="tf_' + id + '_limpatudo">limpar tudo</button>';
  el.querySelectorAll('.tfChip button').forEach(b => b.addEventListener('click', () => {
    delete I.s.filtros[b.dataset.k]; I.s.pag = 1; tfRender(id);
  }));
  document.getElementById('tf_' + id + '_limpatudo').addEventListener('click', () => tfLimpar(id));
}

function tfLimpar(id){
  const I = TF.inst[id];
  I.s.filtros = {}; I.s.pag = 1;
  if (I.cfg.limparConsulta) I.cfg.limparConsulta();
  tfRender(id);
}

// ── o menu da coluna: ordenar e filtrar por valor ───────────────────────────
let _tfMenuEl = null;
function tfFecharMenu(){ if (_tfMenuEl){ _tfMenuEl.remove(); _tfMenuEl = null; } }
document.addEventListener('click', e => {
  if (_tfMenuEl && !_tfMenuEl.contains(e.target) && !e.target.closest('.tfTh')) tfFecharMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') tfFecharMenu(); });

function tfMenu(ev, id, k){
  ev.stopPropagation();
  tfFecharMenu();
  const I = TF.inst[id];
  const c = I.cfg.colunas.find(x => x.k === k); if (!c) return;

  const m = document.createElement('div');
  m.className = 'tfMenu';
  const podeFiltrar = c.filtro !== false;

  // os valores da coluna, com quantas linhas cada um tem — a contagem é o que
  // transforma "filtrar" em "ver a distribuição"
  const conta = new Map();
  if (podeFiltrar) (I.cfg.dados() || []).forEach(r => {
    const v = String(tfValor(c, r) ?? '');
    conta.set(v, (conta.get(v) || 0) + 1);
  });
  const vals = [...conta.entries()].sort((a,b) => norm(a[0]) < norm(b[0]) ? -1 : 1);
  const sel = new Set(I.s.filtros[k] || []);

  m.innerHTML =
    '<div class="tfmOrd">' +
      '<button type="button" data-d="1">▲ Crescente</button>' +
      '<button type="button" data-d="-1">▼ Decrescente</button>' +
    '</div>' +
    (podeFiltrar && vals.length > 8
      ? '<div class="tfmB"><input type="text" placeholder="Filtrar valores…" id="tfmBusca"'
        + ' aria-label="Filtrar os valores desta coluna" autocomplete="off"></div>' : '') +
    (podeFiltrar
      ? '<div class="tfmLista" id="tfmLista"></div>' +
        '<div class="tfmPe"><button type="button" id="tfmTudo">Todos</button>' +
        '<button type="button" id="tfmNada">Nenhum</button>' +
        '<button type="button" class="pri" id="tfmOk">Aplicar</button></div>'
      : '');
  document.body.appendChild(m);
  _tfMenuEl = m;

  const r = ev.currentTarget.getBoundingClientRect();
  m.style.left = Math.min(r.left, window.innerWidth - m.offsetWidth - 12) + 'px';
  m.style.top  = Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 12) + 'px';

  m.querySelectorAll('.tfmOrd button').forEach(b => b.addEventListener('click', () => {
    I.s.ordem = k; I.s.dir = Number(b.dataset.d); I.s.pag = 1;
    tfFecharMenu(); tfRender(id);
  }));
  if (!podeFiltrar) return;

  const lista = m.querySelector('#tfmLista');
  const pinta = (q) => {
    const vis = vals.filter(([v]) => !q || norm(v).includes(norm(q)));
    lista.innerHTML = vis.slice(0, 300).map(([v, n]) =>
      '<label class="tfmItem"><input type="checkbox" value="' + esc(v) + '"'
      + (sel.size === 0 || sel.has(v) ? ' checked' : '') + '>'
      + '<span>' + esc(v || '(vazio)') + '</span><i>' + n + '</i></label>').join('')
      + (vis.length > 300 ? '<p class="tfmMais">' + vis.length + ' valores — refine a busca.</p>' : '');
  };
  pinta('');
  const bq = m.querySelector('#tfmBusca');
  if (bq){ bq.addEventListener('input', () => pinta(bq.value)); setTimeout(() => bq.focus(), 40); }
  m.querySelector('#tfmTudo').addEventListener('click',
    () => lista.querySelectorAll('input').forEach(i => i.checked = true));
  m.querySelector('#tfmNada').addEventListener('click',
    () => lista.querySelectorAll('input').forEach(i => i.checked = false));
  m.querySelector('#tfmOk').addEventListener('click', () => {
    const marcados = [...lista.querySelectorAll('input:checked')].map(i => i.value);
    // marcar tudo é o mesmo que não filtrar — guardar a lista inteira só faria
    // o chip mentir dizendo que há um filtro ativo
    if (marcados.length === vals.length || marcados.length === 0) delete I.s.filtros[k];
    else I.s.filtros[k] = marcados;
    I.s.pag = 1; tfFecharMenu(); tfRender(id);
  });
}

/** O perfil abre este módulo? Admin abre tudo — senão um erro de digitação em
 *  perfis.modulos tranca o dono do sistema para fora do próprio sistema.
 *  Perfil SEM nenhum módulo também vê tudo: app em branco parece quebrado, e
 *  quem tem que reclamar disso é o hub, que diz o motivo com todas as letras. */
function podeVer(mod){
  if (!mod || DEMO || sessao.admin) return true;
  const m = sessao.modulos || [];
  return m.length ? m.indexOf(mod) >= 0 : true;
}

}

/** O único caminho para trocar de tela. */
function irPara(v){
  if (v === 'sair'){ sairDaConta(); return; }
  // Estado guardado de outro login, ou endereço colado: cai na primeira tela
  // que a pessoa realmente abre, em vez de numa tela sem menu correspondente.
  const item = NAV.reduce((a,g) => a.concat(g.itens), []).find(i => i.v === v);
  if (item && !podeVer(item.mod)){
    const primeira = (navVisivel()[0] || { itens:[] }).itens[0];
    if (primeira && primeira.v !== v){ irPara(primeira.v); return; }
  }
  visao = v;
  document.querySelectorAll('.nav-item').forEach(b => {
    const ativo = b.dataset.v === v;
    b.classList.toggle('on', ativo);
    if (ativo) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const g = GRUPO_DE[v];
  document.getElementById('crumbGrupo').textContent =
    g ? g.charAt(0) + g.slice(1).toLowerCase() : 'TapFlow';
  document.getElementById('crumbAtual').textContent = ROTULO[v] || v;
  document.body.classList.remove('navAberta');

  // a busca é POR TELA: o texto de uma não pode vazar para a outra
  const bu = document.getElementById('tbBusca');
  bu.value = BUSCA[v] || '';
  bu.placeholder = PLACEHOLDER_BUSCA[v] || 'Buscar nesta tela…';
  bu.disabled = !PLACEHOLDER_BUSCA[v];
  bu.style.visibility = PLACEHOLDER_BUSCA[v] ? '' : 'hidden';

  // Quadro rola na horizontal e tem altura de janela; lista rola na vertical.
  // Misturar os dois foi o que deixava a tela de Compras cortada no rodapé.
  const eQuadro = eQuadroOS(v) || v === 'com';
  document.getElementById('board').classList.toggle('livre', !eQuadro);
  document.querySelector('main').classList.toggle('rolaY', !eQuadro);
  // S25: em quadro, a página tem a altura da janela e não rola — ver o CSS
  // de `body.emQuadro`. Sem isto a barra horizontal fica abaixo da janela.
  document.body.classList.toggle('emQuadro', eQuadro);

  // 'tec' é o item do menu; 'tecadm' é o valor que a tarefa carrega. Traduzir
  // aqui, num lugar só, evita espalhar dois nomes para a mesma coisa.
  if (eQuadroOS(v)){ quadro = v; REPINTA[v] = pintar; return pintar(); }
  if (v === 'com') return pintarComercial();
  if (v === 'dup') return pintarDuplicados();
  if (v === 'age') return pintarAgenda();
  if (v === 'cpr') return pintarCompras();
  if (v === 'doc') return pintarDocumentos();
  if (v === 'rel') return pintarRelatorios();
  if (v === 'cad') return pintarCadastros();
  if (v === 'cat') return pintarCatalogo();
  if (v === 'cfg') return pintarConfig();
  if (v === 'eu')  return pintarMeuPerfil();
  return pintar();
}

// AGENDA DA EQUIPE — quem faz o quê, em que dia, e quanto já cabe
// ----------------------------------------------------------------------------
// A unidade aqui NÃO é a OS, é a TAREFA. Uma OS de fornecimento passa por
// campo, escritório, compras e campo de novo — designar "a OS" para alguém
// seria mentira em quatro quintos do caminho.
//
// A capacidade sai de `parametros_turno` (dado) e o esforço de
// `tempo_estimado_min` (dado). Sem os dois, "fulano está cheio" é opinião.
//
// A barra NUNCA bloqueia. Estourar o dia é aviso — atraso e adiantamento
// acontecem, e quem decide é quem está olhando a tela.
//
// ── A ORGANIZAÇÃO DA TELA (S15) ─────────────────────────────────────────────
// No S14 a lista de tarefas sem dia ficava DENTRO da agenda, sem filtro e sem
// ordem: 69 linhas empurrando a grade para fora da tela. Era o mesmo defeito do
// ProperCare. Agora são quatro vistas, cada uma com a tela inteira:
//
//   Dia    — o que cada pessoa faz hoje, tarefa por tarefa
//   Semana — a grade de carga (a que existia, com o espaço que ela precisava)
//   Mês    — o calendário, para achar a semana que está apertada
//   Sem dia— o que ninguém pôs num dia, COM filtros e agrupado por OS
//
// "Sem dia" é uma vista irmã, não um rodapé: é dali que se monta a semana.
// ════════════════════════════════════════════════════════════════════════════

const AGENDA = {
  vista: 'semana',        // dia | semana | mes | pool
  base:  null,            // âncora do período; null = hoje
  carga: [], itens: [], pool: [],
  chave: null,            // período já carregado, para não repetir consulta
  filtros: { cliente:'', os:'', etapa:'', quem:'' },
  poolTudo: false,
  soMinhas: null          // S36 · item 5 — null = ainda não decidido (ver agMinhasPadrao)
};

// ── ITEM 5 (S36): "MINHAS TAREFAS" ──────────────────────────────────────────
// Um filtro, não uma tela: as quatro vistas continuam as mesmas, só que com a
// pessoa logada. "Minha" é o que está no MEU nome — como dono, como apoio
// (item 7) ou numa visita em que me marcaram. No "Sem dia", é o que tem o meu
// nome e ainda não tem dia.
//
// DECISÃO MINHA (o documento deixou para o Bruno): vem LIGADO para todo mundo
// menos o admin, que é quem acompanha a equipe inteira. Quem mexer na chave
// fica com a escolha dele naquele computador. A preferência mora no
// localStorage de propósito: é conveniência de quem olha, não dado do sistema.
const _AG_MINHAS_KEY = 'tf_agenda_minhas';
function agMinhasPadrao(){
  try{
    const v = localStorage.getItem(_AG_MINHAS_KEY);
    if (v === '1') return true;
    if (v === '0') return false;
  }catch(e){}
  return !(sessao && sessao.admin);
}
/** A linha é minha? `usuario_id` nas vistas por pessoa; no "Sem dia" a linha
 *  é da tarefa, então vale o dono OU estar entre os apoios. */
function agEhMinha(i){
  const eu = String(meuId() || '');
  if (!eu) return false;
  if (i.usuario_id != null) return String(i.usuario_id) === eu;
  return String(i.usuario_designado || '') === eu
      || (i.apoios || []).map(String).indexOf(eu) >= 0;
}

const agBase   = () => AGENDA.base || isoHoje();
const agData   = iso => new Date(iso + 'T12:00');
const agIso    = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
                    + '-' + String(d.getDate()).padStart(2,'0');
const agSoma   = (iso, n) => { const d = agData(iso); d.setDate(d.getDate() + n); return agIso(d); };
const agUteis  = () => (TURNO.dias_uteis && TURNO.dias_uteis.length ? TURNO.dias_uteis : [1,2,3,4,5]);
const agEhUtil = iso => agUteis().indexOf(agData(iso).getDay() === 0 ? 7 : agData(iso).getDay()) >= 0;

/** O período que a vista atual cobre. Uma função só: a consulta, o título e a
 *  navegação leem daqui, e assim nunca discordam entre si. */
function agPeriodo(){
  let b = agBase();
  if (AGENDA.vista === 'dia'){
    // Abrir a vista de Dia num sábado e ver uma tela vazia não ajuda ninguém:
    // sem navegação explícita, "hoje" cai no próximo dia útil. Se a pessoa
    // ANDOU até um sábado, respeita — pode ser parada programada.
    if (!AGENDA.base && !agEhUtil(b)){
      let g = 0;
      while (!agEhUtil(b) && g++ < 14) b = agSoma(b, 1);
    }
    return { de:b, ate:b };
  }
  if (AGENDA.vista === 'mes'){
    const d = agData(b);
    const p = new Date(d.getFullYear(), d.getMonth(), 1, 12);
    const u = new Date(d.getFullYear(), d.getMonth() + 1, 0, 12);
    return { de: agIso(p), ate: agIso(u) };
  }
  // semana: segunda a domingo da semana da âncora
  const d = agData(b);
  const dow = d.getDay() === 0 ? 7 : d.getDay();
  const seg = agSoma(b, 1 - dow);
  return { de: seg, ate: agSoma(seg, 6) };
}

/** As colunas da grade da semana: dias úteis, MAIS qualquer dia que tenha
 *  trabalho marcado. Sábado de parada não pode sumir da tela só porque não é
 *  dia útil — filtro que apaga em silêncio deixa a tela certa e a semana errada. */
function agColunas(){
  const p = agPeriodo();
  const comCarga = new Set((AGENDA.carga || []).filter(c => Number(c.minutos) > 0 || c.tarefas > 0)
                                               .map(c => c.dia));
  const out = [];
  for (let d = p.de; d <= p.ate; d = agSoma(d, 1))
    if (agEhUtil(d) || comCarga.has(d)) out.push(d);
  return out;
}

function montarNavAgenda(){
  const n = document.getElementById('agNavC');
  if (!n) return;
  if (AGENDA.vista === 'pool'){ n.innerHTML = ''; n.hidden = true; return; }
  n.hidden = false;
  const passo = AGENDA.vista === 'dia' ? 1 : AGENDA.vista === 'semana' ? 7 : 30;
  const rot   = AGENDA.vista === 'dia' ? 'dia' : AGENDA.vista === 'semana' ? 'semana' : 'mês';
  n.innerHTML = '<button class="btn mini" type="button" id="agAnt">‹ ' + rot + ' anterior</button>'
              + '<button class="btn mini" type="button" id="agHoje">hoje</button>'
              + '<button class="btn mini" type="button" id="agProx">' + rot + ' seguinte ›</button>'
              + '<span id="agPer"></span>';
  const anda = k => {
    if (AGENDA.vista === 'mes'){
      const d = agData(agBase()); d.setMonth(d.getMonth() + k);
      AGENDA.base = agIso(d);
    } else AGENDA.base = agSoma(agBase(), k * passo);
    pintarAgenda();
  };
  document.getElementById('agAnt').addEventListener('click', () => anda(-1));
  document.getElementById('agProx').addEventListener('click', () => anda(1));
  document.getElementById('agHoje').addEventListener('click', () => { AGENDA.base = null; pintarAgenda(); });
}

async function agCarregar(){
  await agCarregarBase();
  await agCarregarResolvidos();
}
async function agCarregarBase(){
  if (DEMO){
    AGENDA.carga = demoAgendaEquipe(); AGENDA.itens = demoAgendaItens();
    AGENDA.pool = demoAgendaEquipePool(); return;
  }
  const p = agPeriodo();
  const chave = AGENDA.vista + '|' + p.de + '|' + p.ate;
  const precisaPool = AGENDA.vista === 'pool' && !AGENDA.pool.length;
  if (AGENDA.chave === chave && !precisaPool) return;
  try{
    const [carga, itens, pool] = await Promise.all([
      get('v_agenda_carga?select=*&dia=gte.' + p.de + '&dia=lte.' + p.ate + '&order=usuario,dia'),
      get('v_agenda_itens?select=*&dia=gte.' + p.de + '&dia=lte.' + p.ate
          + '&order=dia,prioridade_rank.desc').catch(() => []),
      (AGENDA.pool.length && !precisaPool) ? Promise.resolve(AGENDA.pool)
        : get('v_agenda_pool?select=*&order=prioridade_rank.desc,prazo_saida.nullslast&limit=500')
          .catch(() => [])
    ]);
    AGENDA.carga = carga || []; AGENDA.itens = itens || []; AGENDA.pool = pool || [];
    AGENDA.chave = chave;
    AGENDA.chaveRes = null;   // S29: o período mudou ou recarregou — os resolvidos também
  }catch(e){
    const cx = document.getElementById('agCorpo');
    if (cx){
      cx.innerHTML = '<div class="vazio2"><b>Não deu para carregar a agenda</b><p></p></div>';
      cx.querySelector('p').textContent = e.message;
    }
    AGENDA.chave = null;
  }
}

/** Quem aparece na grade: o time ativo MAIS quem tem carga sem estar na lista
 *  (o perfil pode ter mudado depois da designação — e a tarefa continua lá). */
function agPessoas(){
  const m = new Map();
  EQUIPE.forEach(u => m.set(String(u.id), u.nome));
  (AGENDA.carga || []).forEach(c => { if (!m.has(String(c.usuario_id))) m.set(String(c.usuario_id), c.usuario); });
  return [...m.entries()].sort((a,b) => a[1].localeCompare(b[1]));
}

function agPintar(){
  const cx = document.getElementById('agCorpo');
  if (!cx) return;
  contador('nAge', (AGENDA.pool || []).length || '');
  const sub = document.getElementById('agSub');
  const per = document.getElementById('agPer');
  const p   = agPeriodo();
  if (per) per.textContent = AGENDA.vista === 'dia'
    ? dataBR(p.de) + (p.de === isoHoje() ? ' · hoje'
        : (!AGENDA.base ? ' · próximo dia útil' : ''))
    : dataBR(p.de) + ' a ' + dataBR(p.ate);
  if (sub) sub.textContent = {
    dia:    'O que cada pessoa faz neste dia, tarefa por tarefa.',
    semana: 'A carga de cada dia contra o turno. Clique numa célula para ver as tarefas.',
    mes:    'O mês inteiro. Clique num dia para abrir a vista de dia.',
    pool:   'Tarefa aberta que ninguém pôs num dia — ela não entra em barra nenhuma, e é por isso que precisa de tela própria.'
  }[AGENDA.vista] || '';

  if (AGENDA.vista === 'dia')    return agVistaDia(cx);
  if (AGENDA.vista === 'mes')    return agVistaMes(cx);
  if (AGENDA.vista === 'pool')   return agVistaPool(cx);
  return agVistaSemana(cx);
}

// ── VISTA: DIA ──────────────────────────────────────────────────────────────
// ── ITEM 1 (S29): "MOSTRAR CONCLUÍDOS" ──────────────────────────────────────
// A linha sumia assim que o trabalho acabava: o dia de quem fez tudo parecia o
// dia de quem não fez nada, e o compromisso marcado por engano não tinha como
// ser desmarcado (o checkbox ia embora junto). Com a chave ligada, o que já foi
// resolvido volta para a lista — esmaecido, abaixo do que falta:
//   · tarefa de OS concluída (✓) ou dispensada (—, lei 2: sai de cena, não some);
//   · compromisso feito, com o checkbox MARCADO — desmarcar devolve à agenda;
//   · compromisso cancelado, com o motivo.
// A BARRA não muda de sentido: continua somando só o que falta. As linhas
// resolvidas vêm de outra view (`v_agenda_resolvidos`), carregada só com a
// chave ligada — as vistas Semana e Mês não sabem que ela existe.
const _AG_CONC_KEY = 'tf_agenda_concluidos';
try{ AGENDA.concluidos = localStorage.getItem(_AG_CONC_KEY) === '1'; }catch(e){ AGENDA.concluidos = false; }
AGENDA.resolvidos = []; AGENDA.chaveRes = null; AGENDA.erroRes = null;

// ITEM 10 (S36): a chave vale nas TRÊS vistas com data, e o estado é um só
// (`AGENDA.concluidos`, lembrado no localStorage): ligar no Dia e trocar para a
// Semana continua ligado. A consulta passou a ser pelo PERÍODO da vista — o
// dia, a semana ou o mês —, e a Semana e o Mês mostram a contagem de
// resolvidos por célula; o clique leva ao Dia, que abre a lista.
async function agCarregarResolvidos(){
  if (AGENDA.vista === 'pool' || !AGENDA.concluidos){ return; }
  const p = agPeriodo();
  const chave = p.de + '|' + p.ate;
  if (DEMO){ AGENDA.resolvidos = demoAgendaResolvidos(p.de); AGENDA.chaveRes = chave; return; }
  if (AGENDA.chaveRes === chave) return;
  try{
    AGENDA.resolvidos = await get('v_agenda_resolvidos?select=*&dia=gte.' + p.de + '&dia=lte.' + p.ate
                                  + '&order=resolvido_em.asc.nullslast') || [];
    AGENDA.chaveRes = chave; AGENDA.erroRes = null;
  }catch(e){
    // sem o SQL 51 a view não existe — a tela diz isso em vez de fingir que não há nada
    AGENDA.resolvidos = []; AGENDA.chaveRes = null; AGENDA.erroRes = e.message;
  }
}

const _hhmm = ts => { if (!ts) return ''; const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' }); };
const _diaDe = ts => { if (!ts) return ''; const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleDateString('sv-SE', { timeZone:'America/Sao_Paulo' }); };

/** As chaves do topo da agenda (S36): "Minhas tarefas" nas quatro vistas e
 *  "Mostrar concluídos" nas três que têm data. Uma função só, para as quatro
 *  vistas não desenharem a mesma chave de quatro jeitos. */
function agChavesHTML(nRes){
  const comConc = AGENDA.vista !== 'pool';
  return '<div class="agConcBar">'
    + '<label class="agConc" title="Só o que está no seu nome — como responsável, como apoio ou numa visita">'
    + '<input type="checkbox" id="agMinhasChk"' + (AGENDA.soMinhas ? ' checked' : '') + '>'
    + '<span class="agConcSw" aria-hidden="true"></span><span>Minhas tarefas</span></label>'
    + (comConc
        ? '<label class="agConc"><input type="checkbox" id="agConcChk"' + (AGENDA.concluidos ? ' checked' : '') + '>'
          + '<span class="agConcSw" aria-hidden="true"></span><span>Mostrar concluídos</span></label>'
          + '<span class="agConcN" id="agConcN">' + (AGENDA.concluidos
              ? (AGENDA.erroRes ? 'não deu para carregar os concluídos'
                 : nRes ? nRes + ' resolvido' + (nRes > 1 ? 's' : '') + (AGENDA.vista === 'dia' ? ' neste dia' : ' no período')
                 : 'nada resolvido ' + (AGENDA.vista === 'dia' ? 'neste dia' : 'no período') + ' ainda')
              : 'o que já foi feito fica escondido') + '</span>'
          + '<span class="agConcLeg">A barra conta só o que ainda falta.</span>'
        : '')
    + '</div>'
    + (comConc && AGENDA.concluidos && AGENDA.erroRes
        ? '<div class="aviso">Os concluídos não vieram: ' + esc(AGENDA.erroRes)
          + (/v_agenda_resolvidos/.test(AGENDA.erroRes) ? ' — falta rodar o <b>51_ajustes_s29.sql</b>.' : '') + '</div>'
        : '');
}
function agLigarChaves(){
  const m = document.getElementById('agMinhasChk');
  if (m) m.addEventListener('change', () => {
    AGENDA.soMinhas = m.checked;
    try{ localStorage.setItem(_AG_MINHAS_KEY, m.checked ? '1' : '0'); }catch(e){}
    LOTE.clear();
    agPintar();
  });
  const c = document.getElementById('agConcChk');
  if (c) c.addEventListener('change', async () => {
    AGENDA.concluidos = c.checked;
    try{ localStorage.setItem(_AG_CONC_KEY, c.checked ? '1' : '0'); }catch(e){}
    AGENDA.chaveRes = null;
    await agCarregarResolvidos();
    agPintar();
  });
}
/** Os resolvidos do período, já com o filtro "Minhas" aplicado. */
const agResolvidosVisiveis = () => AGENDA.concluidos
  ? (AGENDA.resolvidos || []).filter(i => !AGENDA.soMinhas || agEhMinha(i)) : [];

function agVistaDia(cx){
  const dia = agPeriodo().de;
  const q   = BUSCA.age || '';
  const cap = agCap(dia);
  const doDia = (AGENDA.itens || []).filter(i => i.dia === dia && (!AGENDA.soMinhas || agEhMinha(i)));
  const res   = agResolvidosVisiveis().filter(i => i.dia === dia);

  const porPessoa = {}, resPessoa = {};
  doDia.forEach(i => { (porPessoa[i.usuario_id] = porPessoa[i.usuario_id] || []).push(i); });
  res.forEach(i => { (resPessoa[i.usuario_id] = resPessoa[i.usuario_id] || []).push(i); });
  // quem só tem resolvido também aparece (com a chave ligada)
  const pessoas = agPessoas().filter(([id]) => !AGENDA.soMinhas || id === String(meuId()));
  res.forEach(i => { if (!pessoas.some(([id]) => id === String(i.usuario_id)))
                        pessoas.push([String(i.usuario_id), i.usuario || '(sem nome)']); });

  const texto = i => [i.os_numero, i.negocio_numero, i.cliente, i.tarefa, i.fase, i.categoria,
                       i.descricao, i.principal, i.apoios_nomes].join(' ');
  const linhas = pessoas.filter(([id, nome]) =>
    ((porPessoa[id] || []).length || (resPessoa[id] || []).length)
    && casa(nome + ' ' + (porPessoa[id]||[]).concat(resPessoa[id]||[]).map(texto).join(' '), q));

  const chave = agChavesHTML(res.length);
  const ligarChave = agLigarChaves;

  if (!agEhUtil(dia) && !doDia.length && !res.length){
    cx.innerHTML = chave + '<div class="vazio2"><b>' + esc(dataBR(dia)) + ' não é dia útil</b>'
      + '<p>E não há nada marcado. Mude o turno em Configurações › Turno se deveria ser.</p></div>';
    ligarChave();
    return;
  }
  if (!linhas.length){
    cx.innerHTML = chave + '<div class="vazio2"><b>' + (q ? 'Nada bate com “' + esc(q) + '”'
      : (AGENDA.soMinhas
          ? (AGENDA.concluidos ? 'Nada seu marcado nem resolvido em ' : 'Nada pendente no seu nome em ')
          : (AGENDA.concluidos ? 'Nada marcado nem resolvido em ' : 'Ninguém com tarefa pendente em '))
        + esc(dataBR(dia))) + '</b>'
      + (AGENDA.soMinhas && !q ? '<p>A chave <b>Minhas tarefas</b> está ligada — desligue para ver a equipe.</p>' : '')
      + '<p>' + (AGENDA.concluidos || q ? '' : 'Se o dia já foi feito, ligue <b>Mostrar concluídos</b>. ')
      + 'Use a vista <b>Sem dia</b> para escolher o que entra neste dia.</p></div>';
    ligarChave();
    return;
  }

  const linhaRes = (i, id, k) => {
    const quando = _hhmm(i.resolvido_em), outroDia = i.resolvido_em && _diaDe(i.resolvido_em) !== dia;
    const selo = i.situacao === 'cancelado' ? '<span class="chip canc">cancelado</span>'
               : i.situacao === 'dispensada' ? '<span class="chip disp">dispensada</span>'
               : '<span class="chip feito">✓ ' + (i.origem === 'avulso' ? 'feito' : 'concluída') + '</span>';
    const carimbo = (i.situacao === 'cancelado' ? 'cancelado' : i.situacao === 'dispensada' ? 'dispensada' : 'concluída')
      + (quando ? (outroDia ? ' em ' + dataBR(_diaDe(i.resolvido_em)) + ' às ' : ' às ') + quando : '')
      + (i.resolvido_por ? ' por ' + i.resolvido_por : '');
    if (i.origem === 'avulso'){
      return '<div class="agT agAv agRes ' + esc(i.situacao) + '">'
        + '<span class="agTn">'
        + (i.situacao === 'concluida'
            ? '<input type="checkbox" class="agAvChk" checked title="Desmarcar — volta para a agenda" '
              + 'aria-label="Feito (desmarque para devolver à agenda)" data-cc="' + esc(i.compromisso_id) + '"> '
            : '<span class="agResX" aria-hidden="true">✕</span> ')
        + '<button type="button" class="agAvB agResB" data-u="' + esc(id) + '" data-k="' + k + '"></button> '
        + selo + '</span>'
        + '<span class="agTs"></span>'
        + '<span class="agTm">' + (i.tempo_estimado_min ? minHora(i.tempo_estimado_min) : '') + '</span>'
        + '</div>';
    }
    return '<button class="agT agRes ' + esc(i.situacao) + '" type="button" data-res="1" data-u="' + esc(id) + '" data-k="' + k + '">'
      + '<span class="agTn"><span class="agResT"></span> ' + selo
      + (i.papel === 'apoio' ? ' <span class="chip apoio">apoio de ' + esc(i.principal || '?') + '</span>' : '') + '</span>'
      + '<span class="agTs"></span>'
      + '<span class="agTm">' + (i.tempo_estimado_min ? minHora(i.tempo_estimado_min) : '') + '</span>'
      + '</button>';
  };

  cx.innerHTML = chave + linhas.map(([id, nome]) => {
    const its = porPessoa[id] || [];
    const rs  = resPessoa[id] || [];
    const min = its.reduce((s,i) => s + Number(i.tempo_estimado_min || 0), 0);
    const sem = its.filter(i => !i.tempo_estimado_min).length;
    const oc  = cap > 0 ? min / cap : (min > 0 ? 2 : 0);
    return '<div class="agDia">'
      + '<div class="agDiaH"><b>' + esc(nome) + '</b>'
      +   '<span class="agH' + (oc > 1 ? ' cheio' : oc > .7 ? ' quase' : '') + '">'
      +     minHora(min) + ' / ' + (cap > 0 ? minHora(cap) : 'fora do turno') + (oc > 1 ? ' ⚠ estourou' : '') + '</span>'
      +   (sem ? '<span class="agSem">' + sem + ' sem estimativa</span>' : '')
      +   (rs.length ? '<span class="agResN">' + rs.length + ' resolvido' + (rs.length > 1 ? 's' : '') + '</span>' : '')
      + '</div>'
      + '<div class="agBar"><i style="width:' + Math.min(100, Math.round(oc*100)) + '%"'
      +   (oc > 1 ? ' class="cheio"' : oc > .7 ? ' class="quase"' : '') + '></i></div>'
      + '<div class="agTar">' + (its.length ? '' : '<p class="nota agNadaPend">Nada pendente neste dia.</p>')
      + its.map((i,k) => i.origem === 'visita'
        // ITEM 7 (S36): a visita do negócio, na agenda de cada pessoa marcada.
        // Não tem "feito": é um compromisso com hora, e passa com o dia.
        ? '<button class="agT agVis" type="button" data-vis="1" data-u="' + esc(id) + '" data-k="' + k + '">'
          + '<span class="agTn">' + esc(i.tarefa || 'Visita')
          +   ' <span class="chip vis">visita' + (i.hora ? ' · ' + esc(i.hora) : '') + '</span></span>'
          + '<span class="agTs">' + esc([i.negocio_numero || i.os_numero, i.cliente, i.descricao,
                                         i.apoios_nomes ? 'com ' + i.apoios_nomes : ''].filter(Boolean).join(' · ')) + '</span>'
          + '<span class="agTm">' + minHora(i.tempo_estimado_min) + '</span>'
          + '</button>'
        : i.origem === 'avulso'
        // ITEM 9 (S28): compromisso avulso — checkbox de feito e ícone próprio
        ? '<div class="agT agAv">'
          + '<span class="agTn"><input type="checkbox" class="agAvChk" title="Marcar como feito" '
          +   'aria-label="Feito" data-cc="' + esc(i.compromisso_id) + '"> '
          +   '<button type="button" class="agAvB" data-u="' + esc(id) + '" data-k="' + k + '"></button>'
          +   ' <span class="chip av">compromisso</span></span>'
          + '<span class="agTs"></span>'
          + '<span class="agTm">' + (i.tempo_estimado_min ? minHora(i.tempo_estimado_min) : 'sem estimativa') + '</span>'
          + '</div>'
        : '<button class="agT" type="button" data-u="' + esc(id) + '" data-k="' + k + '">'
        + '<span class="agTn">' + esc(i.tarefa || '')
        + (Number(i.prioridade_rank) >= 3 ? ' <span class="chip urg">urgente</span>' : '')
        // ITEM 7 (S36): quem é dono e quem vai junto, dito na linha
        + (i.papel === 'apoio' ? ' <span class="chip apoio">apoio de ' + esc(i.principal || '?') + '</span>' : '')
        + '</span>'
        + '<span class="agTs">' + esc([i.os_numero, i.cliente, i.fase_rotulo || i.fase,
                                       i.papel !== 'apoio' && i.apoios_nomes ? 'apoio: ' + i.apoios_nomes : ''].filter(Boolean).join(' · ')) + '</span>'
        + '<span class="agTm">' + (i.tempo_estimado_min ? minHora(i.tempo_estimado_min) : 'sem estimativa') + '</span>'
        + '</button>').join('')
      + (rs.length ? '<div class="agResSep">Já resolvido</div>' + rs.map((i,k) => linhaRes(i, id, k)).join('') : '')
      + '</div></div>';
  }).join('');
  ligarChave();

  cx.querySelectorAll('button.agT:not([data-res]), .agAvB:not(.agResB)').forEach(b => b.addEventListener('click', () => {
    const its = porPessoa[b.dataset.u] || [];
    const i = its[Number(b.dataset.k)];
    if (i && i.origem === 'visita') return agAbrirVisita(i);
    agAbrirTarefa(i);
  }));
  // resolvido: a tarefa de OS abre a OS (designar não faz sentido); o compromisso abre a ficha
  cx.querySelectorAll('button.agT[data-res], .agResB').forEach(b => b.addEventListener('click', () => {
    const i = (resPessoa[b.dataset.u] || [])[Number(b.dataset.k)];
    if (!i) return;
    if (i.origem === 'avulso') return modalCompromisso(i);
    if (DEMO) return toast('Modo demonstração: a OS não abre daqui.', 'err');
    abrirOSPorId(i.os_id);
  }));
  // textos digitados por textContent
  cx.querySelectorAll('.agAvB').forEach(b => {
    const fonte = b.classList.contains('agResB') ? resPessoa : porPessoa;
    const i = (fonte[b.dataset.u] || [])[Number(b.dataset.k)] || {};
    b.textContent = i.tarefa || '';
    b.closest('.agAv').querySelector('.agTs').textContent = b.classList.contains('agResB')
      ? [i.categoria || 'sem categoria',
         i.situacao === 'cancelado' ? 'motivo: ' + (i.cancelado_motivo || '—') : i.descricao,
         carimboRes(i, dia)].filter(Boolean).join(' · ')
      : [i.categoria || 'sem categoria', i.descricao].filter(Boolean).join(' · ');
  });
  cx.querySelectorAll('button.agT[data-res]').forEach(b => {
    const i = (resPessoa[b.dataset.u] || [])[Number(b.dataset.k)] || {};
    b.querySelector('.agResT').textContent = i.tarefa || '';
    b.querySelector('.agTs').textContent =
      [i.os_numero, i.cliente, i.fase_rotulo || i.fase, carimboRes(i, dia)].filter(Boolean).join(' · ');
  });
  cx.querySelectorAll('.agAvChk').forEach(c => c.addEventListener('change', async () => {
    c.disabled = true;
    try{
      await rpc('tf_concluir_compromisso', { p_id: c.dataset.cc, p_feito: c.checked });
      toast(c.checked
        ? (AGENDA.concluidos ? 'Feito — saiu da barra do dia.' : 'Feito — saiu da barra do dia. Para ver, ligue "Mostrar concluídos".')
        : 'Voltou para a agenda.', 'ok');
      await recarregarAgenda();
    }catch(e){ toast(e.message,'err'); c.checked = !c.checked; c.disabled = false; }
  }));
}

function carimboRes(i, dia){
  const quando = _hhmm(i.resolvido_em), d = _diaDe(i.resolvido_em);
  return (i.situacao === 'cancelado' ? 'cancelado' : i.situacao === 'dispensada' ? 'dispensada' : 'concluída')
    + (quando ? (d && d !== dia ? ' em ' + dataBR(d) + ' às ' : ' às ') + quando : '')
    + (i.resolvido_por ? ' por ' + i.resolvido_por : '');
}

// ── VISTA: SEMANA ───────────────────────────────────────────────────────────
// S36: as duas chaves do topo valem aqui também. "Minhas tarefas" deixa só a
// sua linha; "Mostrar concluídos" põe, em cada célula, quantos já foram
// resolvidos naquele dia — e a célula que só tem resolvido também abre o Dia.
function agVistaSemana(cx){
  const q = BUSCA.age || '';
  const dias = agColunas();
  const eu = String(meuId() || '');
  // S29: capacidade por dia — ver agCap()
  const porChave = {};
  (AGENDA.carga || []).forEach(c => { porChave[c.usuario_id + '|' + c.dia] = c; });
  const res = agResolvidosVisiveis();
  const resChave = {};
  res.forEach(r => { const k = r.usuario_id + '|' + r.dia; resChave[k] = (resChave[k] || 0) + 1; });
  const pessoas = agPessoas();
  // quem só tem resolvido na semana também ganha linha (com a chave ligada)
  res.forEach(r => { if (!pessoas.some(([id]) => id === String(r.usuario_id)))
                        pessoas.push([String(r.usuario_id), r.usuario || '(sem nome)']); });
  const linhas = pessoas.filter(([id, nome]) => (!AGENDA.soMinhas || id === eu) && casa(nome, q));
  const hoje = isoHoje();

  let html = agChavesHTML(res.filter(r => dias.indexOf(r.dia) >= 0).length)
    + '<div class="agGrade"><table><thead><tr><th>Pessoa</th>'
    + dias.map(d => '<th class="' + (d === hoje ? 'hoje' : '') + (agEhUtil(d) ? '' : ' extra') + '">'
        + esc(['dom','seg','ter','qua','qui','sex','sáb'][agData(d).getDay()]) + ' '
        + esc(dataBR(d).slice(0,5)) + (d === hoje ? ' · hoje' : agEhUtil(d) ? '' : ' · fora do turno')
        + '</th>').join('')
    + '</tr></thead><tbody>';

  if (!linhas.length){
    html += '<tr><td colspan="' + (dias.length+1) + '" style="color:var(--ink-3)">'
          + (q ? 'Ninguém bate com “' + esc(q) + '”.'
               : AGENDA.soMinhas ? 'Seu usuário não está no time ativo.' : 'Nenhuma pessoa ativa no time.') + '</td></tr>';
  }
  linhas.forEach(([id, nome]) => {
    html += '<tr><td class="pessoa">' + esc(nome) + '</td>';
    dias.forEach(d => {
      const c = porChave[id + '|' + d];
      const nr = resChave[id + '|' + d] || 0;
      const min = c ? Number(c.minutos || 0) : 0;
      // S29: a capacidade é a do DIA (a view já manda a dela; a tela confere)
      const cap = c && c.capacidade_min != null ? Number(c.capacidade_min) : agCap(d);
      const oc = cap > 0 ? min / cap : (min > 0 ? 2 : 0);
      const clicavel = c || nr;
      html += '<td class="agCel' + (oc > 1 ? ' cheio' : oc > .7 ? ' quase' : '')
            + (clicavel ? ' temItens" data-u="' + esc(id) + '" data-d="' + esc(d)
                 + '" tabindex="0" role="button" title="Ver as tarefas deste dia' : '"') + '">'
        + (c ? '<span class="agH">' + minHora(min) + ' / ' + (cap > 0 ? minHora(cap) : 'fora do turno') + (oc > 1 ? ' ⚠' : '') + '</span>'
             + '<div class="agBar"><i style="width:' + Math.min(100, Math.round(oc*100)) + '%"></i></div>'
             + '<div class="agN">' + c.tarefas + ' tarefa' + (c.tarefas > 1 ? 's' : '') + '</div>'
             + (c.sem_estimativa ? '<div class="agSem">' + c.sem_estimativa + ' sem estimativa</div>' : '')
             : (nr ? '' : '<span style="color:var(--rule)">—</span>'))
        + (nr ? '<div class="agResC">✓ ' + nr + ' resolvido' + (nr > 1 ? 's' : '') + '</div>' : '')
        + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  cx.innerHTML = html;
  agLigarChaves();

  const abrir = td => { AGENDA.vista = 'dia'; AGENDA.base = td.dataset.d; pintarAgenda(); };
  cx.querySelectorAll('td.temItens').forEach(td => {
    td.addEventListener('click', () => abrir(td));
    td.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abrir(td); }
    });
  });
}

// ── VISTA: MÊS ──────────────────────────────────────────────────────────────
// S36: com "Minhas tarefas" a barra do dia compara com o SEU turno, não com o
// do time inteiro — senão 8h suas num dia apareceriam como 7% de ocupação.
function agVistaMes(cx){
  const p = agPeriodo();
  const cap = TURNO.capacidade_min || 540;
  const porDia = {};
  (AGENDA.carga || []).filter(c => !AGENDA.soMinhas || agEhMinha(c)).forEach(c => {
    const o = porDia[c.dia] = porDia[c.dia] || { min:0, tarefas:0, gente:new Set() };
    o.min += Number(c.minutos || 0); o.tarefas += Number(c.tarefas || 0);
    o.gente.add(String(c.usuario_id));
  });
  const res = agResolvidosVisiveis();
  const resDia = {};
  res.forEach(r => { resDia[r.dia] = (resDia[r.dia] || 0) + 1; });
  // A capacidade do DIA no mês é a do time todo: um dia com 4 pessoas cabe 4×.
  // S29: e cada dia da semana tem a sua (a sexta é mais curta).
  const time = AGENDA.soMinhas ? 1 : Math.max(1, agPessoas().length);
  const capDia = d => agCap(d) * time;

  const prim = agData(p.de);
  const inicio = 1 - (prim.getDay() === 0 ? 7 : prim.getDay());  // recua até segunda
  const cels = [];
  for (let k = 0; k < 42; k++){
    const d = agSoma(p.de, inicio + k);
    if (k >= 35 && d > p.ate) break;
    cels.push(d);
  }
  const hoje = isoHoje(), mes = agData(p.de).getMonth();

  cx.innerHTML = agChavesHTML(res.length) + '<div class="agMes">'
    + ['seg','ter','qua','qui','sex','sáb','dom'].map(r => '<div class="agMesH">' + r + '</div>').join('')
    + cels.map(d => {
        const o = porDia[d];
        const nr = resDia[d] || 0;
        const oc = o ? (capDia(d) > 0 ? o.min / capDia(d) : 2) : 0;
        const fora = agData(d).getMonth() !== mes;
        const clicavel = o || nr;
        return '<div class="agMesD' + (fora ? ' fora' : '') + (d === hoje ? ' hoje' : '')
             + (clicavel ? ' temItens' : '') + (agEhUtil(d) ? '' : ' naoUtil')
             + (oc > 1 ? ' cheio' : oc > .7 ? ' quase' : '') + '"'
             + (clicavel ? ' data-d="' + esc(d) + '" tabindex="0" role="button"' : '') + '>'
          + '<span class="agMesN">' + agData(d).getDate() + '</span>'
          + (o ? '<span class="agMesH2">' + minHora(o.min) + '</span>'
               + '<span class="agMesP">' + (AGENDA.soMinhas ? '' : o.gente.size + ' pessoa' + (o.gente.size > 1 ? 's' : '') + ' · ')
               + o.tarefas + ' tarefa' + (o.tarefas > 1 ? 's' : '') + '</span>'
               + '<div class="agBar"><i style="width:' + Math.min(100, Math.round(oc*100)) + '%"></i></div>'
             : '')
          + (nr ? '<span class="agResC">✓ ' + nr + ' resolvido' + (nr > 1 ? 's' : '') + '</span>' : '')
          + '</div>';
      }).join('')
    + '</div>'
    + '<p class="agLeg">' + (AGENDA.soMinhas
        ? 'Com <b>Minhas tarefas</b>, a barra do mês compara com o <b>seu</b> turno naquele dia '
          + '(no dia típico, ' + minHora(cap) + '). '
        : 'A barra do mês compara com a capacidade do <b>time inteiro</b> naquele dia '
          + '(o turno daquele dia da semana × ' + time + ' pessoa' + (time > 1 ? 's' : '') + '; '
          + 'no dia típico, ' + minHora(cap) + ' × ' + time + '). ')
    + 'Dia fora do turno aparece hachurado.</p>';
  agLigarChaves();

  const abrir = el => { AGENDA.vista = 'dia'; AGENDA.base = el.dataset.d; pintarAgenda(); };
  cx.querySelectorAll('.agMesD.temItens').forEach(el => {
    el.addEventListener('click', () => abrir(el));
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); abrir(el); }
    });
  });
}

// a chave de uma linha da agenda: OS|tarefa, ou av|id do compromisso
const chaveAg = t => t.origem === 'avulso' ? 'av|' + t.compromisso_id : t.os_id + '|' + t.tarefa_id;

// ── ITEM 2 (S31): O LOTE DA VISTA "SEM DIA" ─────────────────────────────────
// A seleção vive numa variável de módulo, não no DOM: a lista se repinta a
// cada filtro e a cada refresh em segundo plano, e seleção guardada no
// checkbox some junto. É a mesma regra que vale para busca e paginação aqui.
const LOTE = new Set();

/** Esta pessoa consegue assumir esta linha? A conta é a MESMA de
 *  `tf_assumir_tarefa`: sem dono, ainda aberta, e o perfil entre os
 *  responsáveis (ou a tarefa sem perfil nomeado, ou quem olha é admin).
 *  A caixinha só aparece onde a resposta é sim — marcar em massa o que o
 *  servidor vai recusar é prometer o que ele nega. */
function agPossoAssumir(t){
  if (!t) return false;
  if (DEMO) return !t.usuario_designado && !t.usuario_id;   // só para a tela ser vista
  if (t.origem === 'avulso'){
    // compromisso avulso tem função própria (`tf_assumir_compromisso`), sem
    // perfil responsável: qualquer um do time pega o que está solto
    return !t.usuario_designado && !t.usuario_id;
  }
  if (t.usuario_designado) return false;               // já tem dono: nada a assumir em lote
  if (!['pendente','em_andamento'].includes(t.status || 'pendente')) return false;
  if (sessao.admin) return true;
  const ps = t.perfis_responsaveis || [];
  return !ps.length || ps.includes(sessao.perfil);
}

/** Por que a caixinha não está ali. Vai no title, para a linha sem caixinha
 *  não parecer um esquecimento. */
function agPorQueNao(t){
  if (!t) return '';
  if (t.usuario_designado || t.usuario_id)
    return 'Já está com ' + (t.usuario || 'alguém') + ' — use "Assumir" na OS para tomar a tarefa.';
  const ps = t.perfis_responsaveis || [];
  if (ps.length) return 'Esta tarefa é de ' + ps.join(' ou ') + '.';
  return 'Esta tarefa não pode ser assumida agora.';
}

/** Assume a leva, uma chamada por tarefa, e conta o que aconteceu.
 *
 *  NÃO é tudo ou nada, de propósito: se uma das trinta não bater com o perfil,
 *  recusar as trinta faria a pessoa procurar qual é, uma a uma — exatamente o
 *  trabalho que este botão existe para tirar. O que passou, passou; o que
 *  falhou volta nomeado, com o motivo do servidor.
 *
 *  `tf_assumir_tarefa` não levanta exceção quando recusa: devolve
 *  {status:'recusado'}. Ignorar o retorno era o verde mentindo do S18. */
async function agAssumirLote(itens){
  if (!itens || !itens.length) return;
  if (DEMO){ toast('Modo demonstração: nada é assumido de verdade.','err'); return; }
  const falhas = [];
  let ok = 0;
  for (const t of itens){
    try{
      if (t.origem === 'avulso'){
        await rpc('tf_assumir_compromisso', { p_id: t.compromisso_id, p_forcar: false });
        ok++;
        continue;
      }
      const r = await rpc('tf_assumir_tarefa',
        { p_os_id: t.os_id, p_tarefa_id: t.tarefa_id, p_forcar: false });
      if (r && r.status === 'recusado'){
        falhas.push({ t, motivo: r.motivo === 'perfil_nao_autorizado'
          ? 'é de ' + ((r.perfis || []).join(' ou ') || 'outro perfil')
          : (r.motivo || 'recusada') + (r.status_atual ? ' (está ' + r.status_atual + ')' : '') });
      } else if (r && r.status === 'locked'){
        falhas.push({ t, motivo: (r.locked_nome || 'outra pessoa') + ' assumiu agora há pouco' });
      } else ok++;
    }catch(e){ falhas.push({ t, motivo: e.message }); }
  }
  LOTE.clear();
  AGENDA.chave = null; AGENDA.pool = [];
  await pintarAgenda();

  if (!falhas.length){
    toast(ok + ' tarefa(s) assumida(s) — agora são suas, ainda sem dia marcado.', 'ok');
    return;
  }
  abrirModal(ok ? ok + ' assumida(s), ' + falhas.length + ' não' : 'Nenhuma foi assumida',
      (ok ? '<p class="nota" style="margin-top:0">As que deram certo já estão com você, em '
            + '<b>Sem dia</b>. Use <b>marcar dia</b> para pôr na semana.</p>' : '')
    + '<div class="aviso"><b>Estas ficaram de fora:</b><ul style="margin:6px 0 0;padding-left:18px">'
    + falhas.map(f => '<li>' + esc(f.t.os_numero || '') + ' · ' + esc(f.t.tarefa || '')
        + ' — ' + esc(f.motivo) + '</li>').join('')
    + '</ul></div>',
    [{ label:'Entendi', pri:true, onClick: fecharModal }]);
}

// ── VISTA: SEM DIA (o antigo "pool", agora com filtros) ─────────────────────
function agVistaPool(cx){
  const q = BUSCA.age || '';
  const F = AGENDA.filtros;
  // S36 · item 5: "Minhas" no Sem dia = o que já tem o meu nome e falta o dia
  const todos = (AGENDA.pool || []).filter(t => !AGENDA.soMinhas || agEhMinha(t));

  const unicos = (campo, rot) => {
    const m = new Map();
    todos.forEach(t => { const v = t[campo]; if (v) m.set(String(v), String(rot ? t[rot] : v)); });
    return [...m.entries()].sort((a,b) => a[1].localeCompare(b[1]));
  };
  const clientes = unicos('cliente');
  const oss      = unicos('os_numero');
  const etapas   = unicos('fase');

  const passa = t =>
       (!F.cliente || String(t.cliente)    === F.cliente)
    && (!F.os      || String(t.os_numero)  === F.os)
    && (!F.etapa   || String(t.fase)       === F.etapa)
    && (!F.quem    || (F.quem === '__nin' ? !t.usuario_designado
                                          : String(t.usuario_designado) === F.quem))
    && casa([t.os_numero, t.cliente, t.tarefa, t.usuario, t.fase, t.apoios_nomes].join(' '), q);

  const lista = todos.filter(passa);
  const sel = (id, rot, opts, val) =>
    '<label class="agF"><span>' + rot + '</span><select id="' + id + '">'
    + '<option value="">todos</option>'
    + opts.map(([v,r]) => '<option value="' + esc(v) + '"' + (val === v ? ' selected' : '') + '>'
        + esc(r) + '</option>').join('')
    + '</select></label>';

  // ── ITEM 2 (S31): ASSUMIR EM LOTE ────────────────────────────────────────
  // 36 tarefas sem dono, uma por vez. A caixinha só aparece onde ESTA pessoa
  // consegue assumir (sem dono e com o perfil responsável batendo) — o resto
  // da linha continua clicável, é só a marcação em massa que não se oferece
  // onde o servidor recusaria. O lote não é tudo-ou-nada: o que passar, passa,
  // e o que falhar volta com o motivo.
  const assumiveis = lista.filter(agPossoAssumir);
  // marcação de tarefa que saiu do filtro não pode ficar pendurada
  const validas = new Set(assumiveis.map(chaveAg));
  [...LOTE].forEach(k => { if (!validas.has(k)) LOTE.delete(k); });

  let html = agChavesHTML(0) + '<div class="agFiltros">'
    + sel('fCli','Cliente', clientes, F.cliente)
    + sel('fOs','OS', oss, F.os)
    + sel('fEt','Etapa', etapas, F.etapa)
    + sel('fQm','Quem', [['__nin','— ninguém —']].concat(
        EQUIPE.map(u => [String(u.id), u.nome])), F.quem)
    + '<button class="btn mini" type="button" id="fLimpar">limpar filtros</button>'
    + '<span class="agFn">' + lista.length + ' de ' + todos.length + '</span>'
    + '</div>';

  if (assumiveis.length){
    html += '<div class="agLote">'
      + '<label class="chk" style="margin:0"><input type="checkbox" id="agTodas"'
      + (LOTE.size === assumiveis.length ? ' checked' : '') + '> '
      + 'marcar as ' + assumiveis.length + ' que são do seu perfil</label>'
      + '<span>' + (LOTE.size ? '<b>' + LOTE.size + '</b> selecionada'
                                + (LOTE.size > 1 ? 's' : '')
                              : 'nenhuma selecionada') + '</span>'
      + '<button class="btn pri" type="button" id="agAssumir"'
      + (LOTE.size ? '' : ' disabled') + '>Assumir selecionadas</button>'
      + '</div>';
  }

  if (!lista.length){
    html += '<div class="vazio2"><b>' + (todos.length ? 'Nada bate com o filtro'
              : AGENDA.soMinhas ? 'Nada no seu nome sem dia' : 'Nada solto')
          + '</b><p>' + (todos.length ? 'Limpe os filtros para ver as ' + todos.length + ' tarefas.'
              : AGENDA.soMinhas ? 'Desligue <b>Minhas tarefas</b> para ver as tarefas sem dono.'
              : 'Toda tarefa aberta tem dia marcado.') + '</p></div>';
  } else {
    // Agrupado por OS: 69 linhas soltas é uma lista; agrupada, é uma decisão
    // por OS — que é como se monta a semana de verdade.
    const grupos = new Map();
    lista.forEach(t => {
      const k = t.origem === 'avulso' ? 'Compromissos avulsos' : (t.os_numero || '(sem OS)');
      if (!grupos.has(k)) grupos.set(k, { cliente:t.cliente, prazo:t.prazo_saida,
                                          rank:Number(t.prioridade_rank||1), itens:[] });
      const g = grupos.get(k);
      g.itens.push(t);
      g.rank = Math.max(g.rank, Number(t.prioridade_rank||1));
    });
    const ordenados = [...grupos.entries()].sort((a,b) =>
      (b[1].rank - a[1].rank)
      || String(a[1].prazo || '9999').localeCompare(String(b[1].prazo || '9999')));

    const LIM = 12;
    const mostrar = AGENDA.poolTudo ? ordenados : ordenados.slice(0, LIM);
    html += mostrar.map(([os, g]) =>
        '<div class="agGrupo">'
      + '<div class="agGrupoH"><b class="mono">' + esc(os) + '</b>'
      +   '<span>' + esc(g.cliente || '') + '</span>'
      +   (g.rank >= 3 ? '<span class="chip urg">urgente</span>' : '')
      +   (g.prazo ? '<span class="chip">prazo ' + esc(dataBR(g.prazo)) + '</span>' : '')
      +   '<span class="agGrupoN">' + g.itens.length + ' tarefa'
      +     (g.itens.length > 1 ? 's' : '') + ' sem dia</span></div>'
      + g.itens.map(t =>
          '<div class="agLinha">'
        + (agPossoAssumir(t)
            ? '<span class="agCk"><input type="checkbox" data-lote="' + esc(chaveAg(t))
              + '"' + (LOTE.has(chaveAg(t)) ? ' checked' : '')
              + ' aria-label="Assumir ' + esc(t.tarefa || '') + '"></span>'
            : '<span class="agCk agCkVazio" title="' + esc(agPorQueNao(t)) + '"></span>')
        + '<span class="agLt">' + esc(t.tarefa || '')
        + (t.apoios_nomes ? ' <span class="chip apoio">apoio: ' + esc(t.apoios_nomes) + '</span>' : '') + '</span>'
        + '<span class="agLe">' + esc(t.fase || '') + '</span>'
        + '<button class="btn mini agLq" type="button" data-quem="'
        + esc(chaveAg(t)) + '">'
        + esc(t.usuario || '— ninguém —') + '</button>'
        + '<span class="agLm">' + (t.tempo_estimado_min ? minHora(t.tempo_estimado_min) : '—') + '</span>'
        + '<button class="btn mini" type="button" data-id="' + esc(chaveAg(t)) + '">'
        + 'marcar dia</button></div>').join('')
      + '</div>').join('');

    if (!AGENDA.poolTudo && ordenados.length > LIM)
      html += '<button class="btn" type="button" id="agMais" style="width:100%;margin-top:12px">'
            + 'Mostrar as outras ' + (ordenados.length - LIM) + ' OS</button>';
  }
  cx.innerHTML = html;
  agLigarChaves();

  const troca = (id, campo) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => { AGENDA.filtros[campo] = el.value; agPintar(); });
  };
  troca('fCli','cliente'); troca('fOs','os'); troca('fEt','etapa'); troca('fQm','quem');
  const lim = document.getElementById('fLimpar');
  if (lim) lim.addEventListener('click', () => {
    AGENDA.filtros = { cliente:'', os:'', etapa:'', quem:'' }; agPintar();
  });
  const mais = document.getElementById('agMais');
  if (mais) mais.addEventListener('click', () => { AGENDA.poolTudo = true; agPintar(); });

  cx.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => {
    const t = todos.find(x => chaveAg(x) === b.dataset.id);
    if (t) agAbrirTarefa(t, true);
  }));

  // ITEM 2 (S31): a marcação vive FORA do DOM (em `LOTE`), como o resto do
  // estado desta tela — senão o refresh em segundo plano apagaria a seleção
  // no meio da escolha.
  cx.querySelectorAll('[data-lote]').forEach(ck => ck.addEventListener('change', () => {
    if (ck.checked) LOTE.add(ck.dataset.lote); else LOTE.delete(ck.dataset.lote);
    agPintar();
  }));
  const todasCk = document.getElementById('agTodas');
  if (todasCk) todasCk.addEventListener('change', () => {
    LOTE.clear();
    if (todasCk.checked) assumiveis.forEach(t => LOTE.add(chaveAg(t)));
    agPintar();
  });
  const bLote = document.getElementById('agAssumir');
  if (bLote) bLote.addEventListener('click', function(){
    _semDuploEnvio_(this, () => agAssumirLote(assumiveis.filter(t => LOTE.has(chaveAg(t)))));
  });

  // "Quem" é o outro caminho: escolher o responsável AGORA e o dia depois.
  cx.querySelectorAll('button[data-quem]').forEach(b => b.addEventListener('click', () => {
    const t = todos.find(x => chaveAg(x) === b.dataset.quem);
    if (!t) return;
    if (t.origem === 'avulso') modalCompromisso(t); else modalQuem(t);
  }));
}

/* ── ESCOLHER QUEM FAZ, SEM MARCAR O DIA ────────────────────────────────────
   O pedido: clicar em "— ninguém —" abre a lista das pessoas APTAS àquela
   tarefa, filtrada pelos perfis responsáveis dela.

   Quem monta essa lista é o BANCO (`tf_pessoas_para_tarefa`), não esta tela.
   É o mesmo motivo pelo qual "quem é você" é `tf_meu_acesso()`: uma segunda
   regra escrita aqui é uma regra a mais para divergir da primeira. O admin vem
   na lista marcado como admin — ele passa em tudo por definição, e escondê-lo
   trancaria o dono do sistema para fora de uma tarefa do próprio sistema.

   O dia fica de fora de propósito: a tarefa continua no "Sem dia", agora com
   dono. Era o estado que o banco recusava até o S22 — e a justificativa
   ("some das três listas") valia para o contrário, dia sem dono. */
async function modalQuem(t){
  if (DEMO){ toast('Modo demonstração: designação não é gravada.','err'); return; }
  let pessoas;
  try{
    pessoas = await rpc('tf_pessoas_para_tarefa',
      { p_os_id: t.os_id, p_tarefa_id: t.tarefa_id });
  }catch(e){ toast(e.message,'err'); return; }

  // S31: escolher OUTRA pessoa é do admin. Para os demais perfis a lista fica
  // com uma opção só — eles mesmos —, que é o que `tf_designar_tarefa` aceita.
  // Some da lista é melhor que aparecer e o servidor recusar depois.
  if (!sessao.admin){
    const eu = String(meuId());
    pessoas = (pessoas || []).filter(u => String(u.usuario_id) === eu);
  }
  const atual = t.usuario_designado || '';
  const linha = u =>
      '<label class="linhaOpc"><input type="radio" name="qmU" value="' + esc(u.usuario_id) + '"'
    + (String(u.usuario_id) === String(atual) ? ' checked' : '') + '> '
    + '<span><b>' + esc(u.nome) + '</b>'
    + '<br><small style="color:var(--ink-3)">' + esc(u.perfil || u.perfil_id)
    + (u.por_perfil ? '' : ' · entra por ser admin') + '</small></span></label>';

  abrirModal('Quem faz · ' + t.tarefa,
      '<p class="nota" style="margin-top:0">' + esc(t.os_numero) + ' · '

/* ── ITEM 9 (S28): COMPROMISSO AVULSO ───────────────────────────────────────
   O que não é de OS nenhuma — lavar o carro, buscar instrumento, conferir EPI
   — e que fazia a agenda mostrar gente "livre" que não estava. Entra na mesma
   barra de ocupação do dia; não tem fase, quadro nem dependência.

   Quem cria e designa é o escritório (a mesma regra de designar tarefa de
   OS). O "Assumir" passa a designação (item 8). Concluir é o checkbox da
   lista do dia; lançado errado, cancela-se com motivo — não some do banco. */
async function modalCompromisso(c, padrao){
  if (DEMO){ toast('Modo demonstração: compromisso não é gravado.','err'); return; }
  const pode = podeEscritorio();
  let cats = [], d = null;
  try{ cats = await get('v_compromissos_categorias?select=categoria&limit=60'); }catch(e){ cats = []; }
  if (c && c.compromisso_id){
    try{ d = ((await get('compromissos_avulsos?select=*&id=eq.' + c.compromisso_id)) || [])[0] || null; }
    catch(e){ toast(e.message,'err'); return; }
    if (!d){ toast('Esse compromisso não existe mais.','err'); return; }
  }
  const v = d || Object.assign({ usuario_designado: null, data_prevista: null }, padrao || {});
  const eu = meuId();
  // S29: com "Mostrar concluídos" o compromisso feito/cancelado também abre —
  // só para leitura (o banco recusa editar), com o caminho de volta do feito
  const fechado = !!(d && (d.status === 'completo' || d.status === 'cancelado'));
  const dis = pode && !fechado ? '' : ' disabled';

  abrirModal(d ? 'Compromisso' : 'Novo compromisso na agenda',
      (d ? '' : '<p class="nota" style="margin-top:0">Para o que <b>não pertence a OS nenhuma</b> '
        + 'e ocupa o dia de alguém. Entra na barra de ocupação da agenda, ao lado das tarefas das OS.</p>')
    + (fechado
        ? '<div class="aviso">' + (d.status === 'completo'
            ? '<b>Feito</b>' + (d.concluido_em ? ' em ' + esc(dataBR(_diaDe(d.concluido_em))) + ' às ' + esc(_hhmm(d.concluido_em)) : '')
              + (d.concluido_por ? ' por ' + esc(NOMES[d.concluido_por] || 'alguém do time') : '')
              + '. Se foi marcado por engano, use <b>Devolver à agenda</b>.'
            : '<b>Cancelado</b>' + (d.cancelado_em ? ' em ' + esc(dataBR(_diaDe(d.cancelado_em))) : '')
              + (d.cancelado_por ? ' por ' + esc(NOMES[d.cancelado_por] || 'alguém do time') : '')
              + '.<br>Motivo: ' + esc(d.cancelado_motivo || '—'))
          + '</div>'
        : pode ? '' : '<div class="aviso">Só o escritório cria e muda compromissos. Você pode assumir '
        + 'e marcar como feito.</div>')
    + '<div class="campo"><label for="acT">O que é</label><input id="acT" type="text" maxlength="120"'
    +   ' autocomplete="off" name="act_nofill" placeholder="ex.: Levar a Strada para lavar"' + dis + '></div>'
    + '<div class="campo"><label for="acDs">Detalhes (opcional)</label>'
    +   '<textarea id="acDs" rows="2" placeholder="onde, com quem, o que levar"' + dis + '></textarea></div>'
    + '<div class="dupla"><div class="campo"><label for="acC">Categoria</label>'
    +   '<input id="acC" type="text" list="acCats" maxlength="40" autocomplete="off" name="acc_nofill"'
    +   ' placeholder="ex.: Veículos, Laboratório, EPI"' + dis + '>'
    +   '<datalist id="acCats">' + (cats || []).map(x => '<option value="' + esc(x.categoria) + '">').join('')
    +   '</datalist><small style="color:var(--ink-3)">Escreva ou escolha uma já usada.</small></div>'
    + '<div class="campo"><label for="acM">Quanto tempo (minutos)</label>'
    +   '<input id="acM" type="number" min="5" max="1440" step="5" placeholder="ex.: 60"' + dis + '></div></div>'
    + '<div class="dupla"><div class="campo"><label for="acU">Quem</label><select id="acU"' + dis + '>'
    +   '<option value="">— ninguém ainda —</option>'
    +   EQUIPE.map(u => '<option value="' + esc(u.id) + '">' + esc(u.nome) + '</option>').join('')
    + '</select></div>'
    + '<div class="campo"><label for="acDia">Em que dia</label><input id="acDia" type="date"' + dis + '></div></div>'
    + '<p style="font-size:12px;color:var(--ink-3);margin:-4px 0 0;line-height:1.45">Dia sem '
    +   'pessoa não é aceito — sem dono, o compromisso não entra na barra de ninguém. Pessoa sem '
    +   'dia fica em <b>Sem dia</b>.</p>'
    + (d && d.lock_por && d.lock_por !== eu
        ? '<p class="nota">Assumido por <b>' + esc(NOMES[d.lock_por] || 'outra pessoa') + '</b>.</p>' : '')
    + '<div class="dica" id="acMsg" style="color:var(--crit)"></div>',
    fechado
    ? [ { label:'Fechar', onClick: () => fecharModal() } ]
      .concat(d.status === 'completo' && (pode || d.usuario_designado === eu || d.concluido_por === eu)
        ? [{ label:'Devolver à agenda', pri:true, onClick: async () => {
            try{
              await rpc('tf_concluir_compromisso', { p_id: d.id, p_feito: false });
              fecharModal(); toast('Voltou para a agenda.','ok');
              await recarregarAgenda();
            }catch(e){ document.getElementById('acMsg').textContent = e.message; }
          } }] : [])
    : [ { label:'Fechar', onClick: () => fecharModal() } ]
      .concat(d && pode ? [{ label:'Cancelar compromisso', onClick: () => cancelarCompromisso(d) }] : [])
      .concat(d && d.usuario_designado !== eu ? [{ label:'Assumir', onClick: async () => {
          try{
            const r = await rpc('tf_assumir_compromisso', { p_id: d.id, p_forcar: !!(d.lock_por && d.lock_por !== eu) });
            if (r && r.status !== 'ok') throw new Error(r.status === 'locked'
              ? (r.locked_nome || 'Outra pessoa') + ' assumiu agora há pouco.' : 'O servidor recusou.');
            fecharModal(); toast('Assumido — agora é seu, na agenda de todo mundo.','ok');
            await recarregarAgenda();
          }catch(e){ document.getElementById('acMsg').textContent = e.message; }
        } }] : [])
      .concat(pode ? [{ label: d ? 'Gravar' : 'Lançar', pri:true, onClick: async () => {
          const msg = document.getElementById('acMsg');
          const tit = document.getElementById('acT').value.trim();
          const quem = document.getElementById('acU').value || null;
          const dia = document.getElementById('acDia').value || null;
          const min = document.getElementById('acM').value;
          if (tit.length < 3){ msg.textContent = 'Escreva o que é o compromisso.'; return; }
          if (dia && !quem){ msg.textContent = 'Escolha quem — compromisso com dia precisa de dono.'; return; }
          try{
            await rpc('tf_salvar_compromisso', { p_id: d ? d.id : null, p_titulo: tit,
              p_descricao: document.getElementById('acDs').value.trim() || null,
              p_categoria: document.getElementById('acC').value.trim() || null,
              p_usuario: quem, p_data: dia, p_minutos: min ? Number(min) : null });
            fecharModal(); toast(d ? 'Compromisso atualizado.' : 'Compromisso lançado na agenda.','ok');
            await recarregarAgenda();
          }catch(e){ msg.textContent = e.message; }
        } }] : []));

  document.getElementById('acT').value  = v.titulo || '';
  document.getElementById('acDs').value = v.descricao || '';
  document.getElementById('acC').value  = v.categoria || '';
  document.getElementById('acM').value  = v.tempo_estimado_min || '';
  document.getElementById('acU').value  = v.usuario_designado || '';
  document.getElementById('acDia').value = v.data_prevista || '';
}

// ── busca por tela ──────────────────────────────────────────────────────────
// O estado vive aqui, não no DOM: sobrevive ao re-render e ao refresh em
// segundo plano. Foi assim que o PCM parou de perder o que a pessoa digitou.
const BUSCA = {};
/** Quem sabe repintar a própria tela a partir do que já está na memória. Cada
 *  `pintarX` registra a sua aqui; sem registro, a busca recarrega a tela. */
const REPINTA = {};
const PLACEHOLDER_BUSCA = {
  campo:'Buscar OS, cliente, etapa…', adm:'Buscar OS, cliente, etapa…',
  tec:'Buscar OS, cliente, etapa…', forn:'Buscar OS, cliente, etapa…', dup:'Buscar nome ou CNPJ…',
  com:'Buscar negócio, cliente, contato…', cpr:'Buscar item, OS, fornecedor…',
  doc:'Buscar número, cliente, modelo…', cad:'Buscar cliente, CNPJ, cidade…',
  cat:'Buscar item, código, marca…',
  age:'Buscar pessoa, OS, cliente, tarefa…',
};
/** Multi-termo E: cada palavra digitada tem que aparecer no texto da linha.
 *  (`norm` já existe mais acima, no seletor de catálogo — é a mesma função.) */
function casa(texto, q){
  if (!q) return true;
  const t = norm(texto);
  return norm(q).split(/\s+/).filter(Boolean).every(p => t.includes(p));
}

let _buscaT = null;
function ligarBusca(){
  const el = document.getElementById('tbBusca');
  el.addEventListener('input', () => {
    BUSCA[visao] = el.value;
    clearTimeout(_buscaT);
    _buscaT = setTimeout(() => {
      const foco = document.activeElement === el;
      const pos = el.selectionStart;
      // repinta sem ir à rede quando a tela sabe filtrar sozinha
      if (REPINTA[visao]) REPINTA[visao]();
      else irPara(visao);
      if (foco){ requestAnimationFrame(() => {
        const n = document.getElementById('tbBusca');
        if (n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} }
      }); }
    }, 140);
  });
  // Esc limpa a busca sem tirar a mão do teclado
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape' && el.value){ e.stopPropagation(); el.value = ''; BUSCA[visao] = ''; irPara(visao); }
  });
}

/** Atalho: "/" foca a busca, como em toda ferramenta que se usa o dia inteiro. */
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
  const el = document.getElementById('tbBusca');
  if (el && !el.disabled){ e.preventDefault(); el.focus(); el.select(); }
});
