<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
// CONFIGURAÇÃO — preencha as duas linhas abaixo para ligar no Supabase.
// Estão em: Supabase → seu projeto → Settings → API
// Deixe vazio para rodar em modo demo.
// ════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL      = 'https://ewthwgkgwzgutvxkwqfd.supabase.co';   // ex.: 'https://xxxxxxxx.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_W987XKBK3Oo2aQ7FJyq9_w_qWrSg_E4';   // a "Publishable key" (sb_publishable_...)
                                // Serve também a antiga "anon public" (eyJ...),
                                // mas ela será desligada pelo Supabase no fim
                                // de 2026 — prefira a Publishable.

const APP_VERSION = 'S38';
// o crachá lê a constante: escrever a versão à mão no HTML já deixou o app
// dizendo S6 rodando S7, e é o número que eu peço quando algo dá errado
try{ document.getElementById('verBadge').textContent = 'MANAGER · ' + APP_VERSION; }catch(e){}
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;

// ════════════════════════════════════════════════════════════════════════════
// CAMADA DE REDE
// ----------------------------------------------------------------------------
// Transplantada do ProperCare (achados DAT-02 e DAT-05 do parecer). Três coisas
// que o TapControl não tinha e custaram dado:
//   · AbortSignal DE VERDADE — 30 s leitura, 45 s escrita. Promise.race rejeita
//     a promessa mas deixa o fetch vivo, e o retry em cima disso é o que
//     duplicava escrita.
//   · Sinal NOVO a cada tentativa: um AbortSignal já disparado continua
//     disparado, e reusá-lo faria o retry abortar na hora.
//   · Erro de rede que sobrevive ao retry DERRUBA o indicador. O verde não
//     mente: melhor recusar alto do que fingir que gravou.
// ════════════════════════════════════════════════════════════════════════════

let conectado = false;
let reconTimer = null, reconPasso = 0;
const BACKOFF = [5000, 10000, 20000, 40000, 60000];

function setConn(estado, texto){
  const d = document.getElementById('dot');
  d.className = 'dot' + (estado ? ' ' + estado : '');
  document.getElementById('connTxt').textContent = texto;
  conectado = (estado === 'ok');
}

function sinal(escrita){
  try{
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
      return AbortSignal.timeout(escrita ? 45000 : 30000);
  }catch(e){}
  return undefined;
}
const ehTimeout = e => !!e && (e.name === 'TimeoutError' || e.name === 'AbortError'
  || /timed out|timeout|aborted/i.test(String(e.message||'')));

function pararRecon(){ if(reconTimer){clearTimeout(reconTimer);reconTimer=null;} reconPasso=0; }
function agendarRecon(){
  if (reconTimer || DEMO) return;
  const espera = BACKOFF[Math.min(reconPasso, BACKOFF.length-1)];
  reconPasso++;
  setConn('off', 'Reconectando em ' + Math.round(espera/1000) + 's');
  reconTimer = setTimeout(async () => {
    reconTimer = null;
    try { await carregar({silencioso:true}); } catch(e){}
  }, espera);
}
function falhaDeRede(e){
  setConn('off', 'Sem conexão');
  console.warn('[rede] conexão marcada OFF:', e && e.message);
  agendarRecon();
}

async function req(caminho, opts = {}, tentativas = 2){
  const escrita = (opts.method || 'GET').toUpperCase() !== 'GET';
  let ultimo, jaRenovou = false;
  for (let i = 0; i <= tentativas; i++){
    try{
      const s = sinal(escrita);
      const r = await fetch(SUPABASE_URL + caminho, Object.assign({}, opts, {
        signal: s,
        // A chave vai SEMPRE no cabeçalho `apikey`. O `Authorization` só entra
        // quando existe sessão de verdade — as chaves novas do Supabase
        // (sb_publishable_...) NÃO são JWT, e mandá-las como Bearer faz a
        // verificação falhar. Assim o app funciona com a chave nova e com a
        // antiga (anon), sem depender de qual delas foi colada acima.
        headers: Object.assign(
          { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {},
          opts.headers || {})
      }));
      const txt = await r.text();
      if (txt.trim().startsWith('<'))
        throw new Error('O servidor devolveu HTML — verifique a URL do projeto');
      let corpo = null;
      if (txt) { try { corpo = JSON.parse(txt); } catch(e){ throw new Error('Resposta inválida: ' + txt.slice(0,80)); } }
      if (!r.ok){
        // erro de NEGÓCIO (o banco recusou): não retenta e não derruba o verde
        const msg = (corpo && (corpo.message || corpo.error_description || corpo.error || corpo.hint)) || ('HTTP ' + r.status);
        const err = new Error(msg); err.negocio = (r.status >= 400 && r.status < 500); err.status = r.status;

        // token vencido não é erro de negócio nem de rede: é sessão velha.
        // Renova UMA vez e repete a chamada — o usuário não percebe nada.
        // Sessão vencida. A ordem importa: tenta renovar UMA vez; se não der —
        // ou se nem existe refresh_token guardado (sessão antiga, de antes da
        // renovação automática) — manda para o login com recado claro. Antes,
        // este caso caía direto no `throw` e a pessoa ficava com o quadro vazio
        // e um "JWT expired" vermelho na tela: parece perda de dados, e não é.
        if (tokenVencido(err)){
          if (!jaRenovou && sessao.refresh){
            jaRenovou = true;
            if (await renovarToken()){ i--; continue; }
          }
          sessaoExpirou();
          throw Object.assign(new Error('Sua sessão expirou. Entre de novo — nada se perdeu.'),
                              { negocio:true, sessaoMorta:true });
        }
        throw err;
      }
      return corpo;
    }catch(e){
      ultimo = e;
      if (ehTimeout(e)){
        ultimo = new Error('O servidor não respondeu em ' + (escrita ? '45' : '30') + 's'
          + (escrita ? ' — a operação pode NÃO ter sido gravada.' : '.'));
      }
      const transitorio = ehTimeout(e) || !e.negocio && (
        /Failed to fetch|NetworkError|Load failed/i.test(e.message) ||
        /devolveu HTML/.test(e.message) || /^HTTP 5\d\d$/.test(e.message));
      // ESCRITA NÃO SE REPETE SOZINHA. Um POST que chegou ao servidor e estourou
      // o prazo do cliente já foi commitado lá: o AbortSignal aborta o navegador,
      // não desfaz a transação no banco. Reenviar cria o segundo registro — e só
      // `tf_abrir_os` e o envio de arquivo mandam `client_uid` para se defender.
      if (!transitorio || i === tentativas || (escrita && !opts.idempotente)){
        if (transitorio) falhaDeRede(ultimo);
        throw ultimo;
      }
      await new Promise(r => setTimeout(r, 600 * (i+1)));
    }
  }
  throw ultimo;
}

const get  = (q)      => req('/rest/v1/' + q);
/* `p_client_uid` é a chave de idempotência: o banco recusa o segundo envio com
   o mesmo uid, então ESSAS podem ser retentadas. As outras, não. */
const rpc  = (f, p)   => req('/rest/v1/rpc/' + f,
  { method:'POST', body: JSON.stringify(p||{}),
    idempotente: !!(p && (p.p_client_uid || p.p_uid)) });
/* ESCRITA QUE NÃO GRAVOU NADA É FALHA (S26).
   Quando o RLS barra um UPDATE ou DELETE, o PostgREST NÃO devolve erro:
   devolve 200 com a lista vazia — nenhuma linha passou pela regra. Até o S25
   o app lia isso como sucesso: o inspetor digitava o preço na aba Itens, o
   valor sumia no repaint, e o atalho "Marcar como Comprar" dizia "Origem
   definida." em verde sem ter gravado nada.
   Toda escrita direta deste arquivo mira UMA linha (id ou chave), então lista
   vazia só pode ser "sem permissão" ou "a linha já não existe" — as duas são
   falha, e falha aparece. Por isso `post`, `patch` e `del` pedem a linha de
   volta (`return=representation`) e conferem. INSERT barrado já vinha como
   erro de verdade; entra na mesma regra por uniformidade.
   ⚠ Escrita direta nova vai por estas três. `req(..., {method:'DELETE'})`
   solto devolve 204 sem corpo e não há como saber se apagou. */
function exigirLinha(corpo, acao){
  if (Array.isArray(corpo) && corpo.length === 0){
    const e = new Error('Nada foi gravado: seu perfil não tem permissão para ' + acao
      + ', ou o registro já não existe. Recarregue a tela; se continuar, fale com o administrador.');
    e.negocio = true; e.semLinha = true;
    throw e;
  }
  return corpo;
}
const post = (t, o)   => req('/rest/v1/' + t, { method:'POST', body: JSON.stringify(o),
                             headers:{ Prefer:'return=representation' } })
                           .then(c => exigirLinha(c, 'gravar isto'));
const patch= (t, f, o)=> req('/rest/v1/' + t + '?' + f, { method:'PATCH', body: JSON.stringify(o),
                             headers:{ Prefer:'return=representation' } })
                           .then(c => exigirLinha(c, 'alterar isto'));
const del  = (t, f)   => req('/rest/v1/' + t + '?' + f, { method:'DELETE',
                             headers:{ Prefer:'return=representation' } })
                           .then(c => exigirLinha(c, 'remover isto'));

/* Quem grava direto nas tabelas do escritório (`os_itens`, `custos_os`): o
   mesmo corte do banco — `tf_pode_escritorio()` é perfil que executa em
   'adm' ou 'ambos'. O RLS é a trava; isto é só a tela não OFERECER o que ele
   vai recusar. Perfil de campo não ganha a porta da Gestão no hub, mas chega
   aqui digitando o endereço — e desde o S25 enxerga os cards do fornecimento.
   Só trava quando SABE que é campo: sessão antiga sem `executa_em` não pode
   trancar o escritório para fora — nesse caso quem responde é o banco, e a
   recusa agora aparece (ver `exigirLinha`). */
const podeEscritorio = () => DEMO || !!sessao.admin || sessao.executa_em !== 'campo';
const AVISO_SO_LEITURA = 'Só leitura: estes valores são lançados pelo escritório. '
  + 'Seu perfil executa em campo — o banco não aceitaria a gravação.';
function travarSoLeitura(cx){
  cx.querySelectorAll('input,select,textarea,button').forEach(x => {
    x.disabled = true; x.title = AVISO_SO_LEITURA; });
}
function avisoSoLeitura(cx){
  const a = document.createElement('div');
  a.className = 'aviso'; a.style.marginBottom = '12px';
  a.textContent = AVISO_SO_LEITURA;
  cx.insertBefore(a, cx.firstChild);
}

window.addEventListener('online',  () => { pararRecon(); if(!conectado) carregar({silencioso:true}); });
window.addEventListener('offline', () => { setConn('off','Sem conexão'); agendarRecon(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !conectado && !DEMO) { pararRecon(); carregar({silencioso:true}); }
});

// ════════════════════════════════════════════════════════════════════════════
// SESSÃO
// ════════════════════════════════════════════════════════════════════════════
// A chave é UMA para os três arquivos. Até o S11 eram duas ('tapflow_sessao'
// aqui, 'tff_sessao' no Field), o que obrigava o time a logar duas vezes — e
// nunca foi necessário: o GitHub Pages serve os dois do MESMO endereço, então
// para o navegador manager/ e field/ são o mesmo lugar. A separação era minha.
const SESSAO_KEY  = 'tf_sessao';
const SESSAO_VELHA = 'tapflow_sessao';   // aceita por um tempo, para ninguém cair no dia da virada

// O login agora mora no hub. Só faz sentido mandar para lá quando isto está
// sendo SERVIDO: aberto por duplo clique (file://) não existe hub nenhum.
const NO_SERVIDOR = location.protocol === 'http:' || location.protocol === 'https:';
function irParaHub(recado){
  try{ sessionStorage.setItem('tf_recado', recado || ''); }catch(e){}
  location.href = '../?para=manager';
}

let sessao = { token:null, refresh:null, nome:null, email:null, perfil:null,
               perfil_nome:null, admin:false, modulos:[], executa_em:null };

// ── RENOVAÇÃO DO TOKEN ──────────────────────────────────────────────────────
// O token de acesso do Supabase vale cerca de 1 hora. Sem renovar, o app morre
// no meio do expediente com "JWT expired" — e, pior, com os quadros vazios, que
// parece perda de dado. O refresh_token existe justamente para isso: uma
// chamada troca o token vencido por um novo, sem pedir senha de novo.
//
// A promessa é memoizada: se cinco requisições vencerem ao mesmo tempo, todas
// esperam a MESMA renovação em vez de dispararem cinco.
let renovando = null;

async function renovarToken(){
  if (!sessao.refresh) return false;
  if (renovando) return renovando;
  renovando = (async () => {
    try{
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST',
        headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: sessao.refresh }),
        signal: sinal(true)
      });
      const j = await r.json().catch(()=>null);
      if (!r.ok || !j || !j.access_token) return false;
      sessao.token = j.access_token;
      if (j.refresh_token) sessao.refresh = j.refresh_token;
      salvarSessao();
      return true;
    }catch(e){ return false; }
    finally{ setTimeout(() => { renovando = null; }, 0); }
  })();
  return renovando;
}

const tokenVencido = e =>
  e && (e.status === 401 || /jwt expired|invalid jwt|token.*expired|not authenticated/i.test(e.message||''));

function salvarSessao(){ try{ localStorage.setItem(SESSAO_KEY, JSON.stringify(sessao)); }catch(e){} }

// Renovar falhou (refresh também venceu, ou a senha mudou): não adianta
// insistir. Volta para o login dizendo o que houve, em vez de deixar a tela
// vazia parecendo que os dados sumiram.
function sessaoExpirou(){
  sessao = { token:null, refresh:null, nome:null, email:null, perfil:null,
             perfil_nome:null, admin:false, modulos:[], executa_em:null };
  try{ localStorage.removeItem(SESSAO_KEY); }catch(e){}
  if (NO_SERVIDOR){ irParaHub('Sua sessão expirou. Entre de novo.'); return; }
  const lg = document.getElementById('login');
  if (lg){

    const m = document.getElementById('lgErro');
    if (m) m.textContent = 'Sua sessão expirou. Entre de novo.';
  }
}
function lerSessao(){

    if (!r){
      // adoção: quem já estava logado no S11 não é expulso pela troca de chave
      const v = localStorage.getItem(SESSAO_VELHA);
      if (v){ r = v; localStorage.setItem(SESSAO_KEY, v); localStorage.removeItem(SESSAO_VELHA); }
    }

/** Quem sou eu — o SERVIDOR responde (tf_meu_acesso), numa chamada só, e traz
 *  os módulos junto. Antes era um select com embed e o `modulos` nem vinha:
 *  cada tela decidia por conta própria o que mostrar, que é como duas telas
 *  passam a discordar. Ver sql/26_acesso.sql. */
async function quemSou(){
  const a = await rpc('tf_meu_acesso', {});
  if (!a || !a.perfil)
    throw new Error('Login existe, mas você não está na tabela usuarios — veja o Passo 3b do guia.');
  Object.assign(sessao, {
    nome:a.nome, email:a.email, perfil:a.perfil, perfil_nome:a.perfil_nome,
    admin:!!a.admin, modulos:a.modulos || [], executa_em:a.executa_em
  });
  salvarSessao();
  return a;
}

async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password: senha }),
    signal: sinal(true)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'E-mail ou senha inválidos');
  sessao.token = j.access_token;
  sessao.refresh = j.refresh_token || null;
  await quemSou();
}

// ════════════════════════════════════════════════════════════════════════════
// PINTURA DOS QUADROS
// ----------------------------------------------------------------------------
// As colunas saem dos próprios dados: cada `coluna` distinta do quadro vira uma.
// Nada é fixo no código — renomear uma fase no banco renomeia a coluna aqui.
// ════════════════════════════════════════════════════════════════════════════

/* Em quais quadros este card aparece.
   A view do S21 traz `quadros`. Contra um banco anterior — ou no modo demo de
   uma versão velha — só existe `quadro`, e traduzir é melhor que mostrar um
   quadro vazio e deixar a pessoa achar que não há OS. */
function quadrosDe(c){
  if (Array.isArray(c.quadros) && c.quadros.length) return c.quadros;
  return c.quadro === 'campo' ? ['campo']
       : c.quadro === 'ambos' ? ['campo','adm']
       : ['adm'];
}

/** O nome do quadro como a pessoa o lê no menu. Escrever "da gestão" no drawer
    enquanto o menu diz "Equipe Administrativa" é como uma tela começa a
    discordar da outra. */
const NOME_QUADRO = { campo:'Equipes de Inspeção', adm:'Equipe Administrativa',
                      tecadm:'Equipe Técnico Administrativa',
                      fornecimento:'Fornecimento de Produtos' };

/** O nome da coluna como a pessoa a lê. `coluna` continua sendo a FASE — é o
    que o motor usa para dependência e ponteiro — e `coluna_rotulo` é o texto.
    Um só lugar lê os dois: a gaveta dizendo "Encerramento" enquanto o quadro
    diz "Faturamento e Expedição" é como duas telas começam a discordar. */
const rotuloCol = c => (c && (c.coluna_rotulo || c.coluna)) || '';

/* O menu chama o quarto quadro de 'tec' (a chave do item, que a BUSCA e o
   REPINTA usam) e a tarefa o chama de 'tecadm' (o valor que o banco grava).
   A tradução mora AQUI, num lugar só — dois nomes para a mesma coisa espalhados
   pelo arquivo é como a busca de uma tela deixa de filtrar a outra. */
const QUADRO_DA_VISAO = { campo:'campo', adm:'adm', tec:'tecadm', forn:'fornecimento' };
/* Os itens do menu que são quadro de OS. Até o S24 isto estava escrito à mão
   em quatro lugares (`v === 'campo' || v === 'adm' || v === 'tec'`); o quinto
   quadro teria de ser lembrado em todos, e o que ficasse para trás seria uma
   tela que não repinta. Agora a lista é a chave do QUADRO_DA_VISAO. */
const eQuadroOS = v => Object.prototype.hasOwnProperty.call(QUADRO_DA_VISAO, v);
/* A faixa de cor da coluna, por quadro. */
const CLASSE_COL = { campo:'campo', adm:'gestao', tecadm:'tecadm', fornecimento:'forn' };
const nomeQuadros = c => quadrosDe(c).map(q => NOME_QUADRO[q] || q).join(' e ');

/** Escreve um contador do menu, se ele estiver no menu desta pessoa. */
function contador(id, n){
  const el = document.getElementById(id);
  if (el) el.textContent = n;
}

function pintar(){
  // `quadros` (plural) é a lista de quadros da tarefa atual, vinda da view.
  // `quadro` (singular) continua sendo onde a tarefa se EXECUTA — é o que o
  // Field usa. Um banco anterior ao S21 não manda `quadros`; o fallback traduz
  // o singular, para o app novo não desenhar quadro vazio contra banco velho.
  const alvo = QUADRO_DA_VISAO[quadro] || quadro;
  const noQuadro = cards.filter(c => c.coluna && quadrosDe(c).indexOf(alvo) >= 0);
  const q = BUSCA[quadro] || '';
  const doQuadro = !q ? noQuadro : noQuadro.filter(c => casa(
    [c.numero, c.cliente, c.coluna, c.coluna_rotulo, c.tarefa_atual, c.descricao].join(' '), q));

  // Os contadores vivem no menu, e desde os privilégios o menu pode não ter o
  // item — o perfil comercial não vê Campo. Escrever direto estourava a tela
  // inteira num TypeError. O contador que não existe simplesmente não é escrito.
  Object.keys(CONTADOR_QUADRO).forEach(qq => contador(CONTADOR_QUADRO[qq],
    cards.filter(c => c.coluna && quadrosDe(c).indexOf(qq) >= 0).length));

  const board = document.getElementById('board');
  board.innerHTML = '';

  // Lista vazia por ERRO não pode ser desenhada como "nada para fazer" — foi
  // assim que um "JWT expired" virou susto de perda de dados. É a ÚNICA
  // situação em que o quadro não desenha as colunas: colunas "vazia" em cima
  // de uma carga que falhou seriam o quadro mentindo.
  if (!noQuadro.length && falhaCarga){
    board.innerHTML = '<div class="vazio"><h3>Não deu para carregar o quadro</h3><p class="mt"></p>'
      + '<button class="btn" id="bRetentar" style="margin-top:14px">Tentar de novo</button></div>';
    board.querySelector('.mt').textContent = falhaCarga
      + ' — isto NÃO quer dizer que não há OS abertas.';
    document.getElementById('bRetentar').addEventListener('click',
      () => carregar().catch(()=>{}));
    return;
  }

  // ── S25: AS COLUNAS SAEM SEMPRE, MESMO COM O QUADRO INTEIRO VAZIO ─────────
  // Até o S24 a pintura saía cedo com "Nenhuma OS neste quadro" antes de
  // desenhar coluna nenhuma. Coluna vazia só aparecia quando uma VIZINHA
  // tinha card — nas Equipes de Inspeção isso "funcionava" porque sempre havia
  // card do fornecimento lá. Com o fornecimento no quadro próprio, a Inspeção
  // passaria a mostrar a mensagem justamente no quadro citado como exemplo do
  // comportamento certo. Agora: colunas sempre, com "vazia" embaixo do rótulo.
  //
  // As colunas do quadro vêm do TEMPLATE, não só das OS que existem hoje.
  // Coluna vazia continua na tela: é assim que se enxerga o fluxo inteiro e se
  // percebe que ninguém está em "Calibração" — some a coluna, some a informação.
  // A ORDEM é a do COLUNAS, não a do `fase_ordem` sozinho: os dois templates
  // numeram as fases de 10 em 10, e ordenar só pelo número intercalaria as
  // colunas de um fluxo com as do outro — desenhando um caminho que não
  // existe. Fase que só aparece porque um card está nela entra no fim, e não
  // no meio de um fluxo a que ela não pertence.
  const mapa = new Map();
  const porFase = new Map();     // atalho para o card que não sabe o template
  COLUNAS.filter(k => k.quadro === alvo).forEach((k, i) => {
    const ch = chaveCol(k.template_id, k.fase);
    mapa.set(ch, { seq:i, rotulo:k.rotulo, itens:[] });
    if (!porFase.has(k.fase)) porFase.set(k.fase, ch);
  });

  doQuadro.forEach(c => {
    // Um banco anterior ao S22 não manda `template_id`; nesse caso o card cai
    // na primeira coluna com aquele nome de fase, que é o comportamento antigo.
    let ch = chaveCol(c.template_id, c.coluna);
    if (!mapa.has(ch)) ch = porFase.get(c.coluna) || ch;
    if (!mapa.has(ch)) mapa.set(ch, { seq: 1000 + (c.coluna_ordem || 0),
                                      rotulo: c.coluna_rotulo || c.coluna, itens: [] });
    mapa.get(ch).itens.push(c);
  });

  // Sem coluna nenhuma para desenhar. Com o registro carregado isto não
  // acontece (todo quadro tem fase no template); acontece quando o REGISTRO
  // não veio — e aí tela em branco, ou "nenhuma OS", seria mentir de novo.
  if (!mapa.size){
    if (q){
      board.innerHTML = '<div class="vazio"><h3>Nenhuma OS com essa busca</h3><p class="mt2"></p>'
        + '<button class="btn" id="bLimpaB" style="margin-top:14px">Limpar a busca</button></div>';
      board.querySelector('.mt2').textContent =
        noQuadro.length + ' OS neste quadro não casam com "' + q + '".';
      document.getElementById('bLimpaB').addEventListener('click', limparBuscaQuadro);
      return;
    }
    board.innerHTML = '<div class="vazio"><h3>Não deu para ler as colunas deste quadro</h3>'
      + '<p class="mt"></p><button class="btn" id="bRetentar" style="margin-top:14px">Tentar de novo</button></div>';
    board.querySelector('.mt').textContent = (falhaColunas || 'o registro de colunas veio vazio')
      + ' — isto NÃO quer dizer que não há OS neste quadro.';
    document.getElementById('bRetentar').addEventListener('click',
      () => carregarColunas().then(() => carregar()).catch(()=>{}));
    return;
  }
  const colunas = [...mapa.entries()].sort((a,b) => a[1].seq - b[1].seq);

  // A busca sem resultado também deixa de apagar o quadro: as colunas ficam,
  // e a fita diz quantas OS a busca escondeu — com o botão de desfazer.
  if (q){
    const fita = document.createElement('div');
    fita.className = 'fitaBusca';
    const t = document.createElement('span');
    t.textContent = doQuadro.length + ' de ' + noQuadro.length + ' OS batem com "' + q + '"';
    fita.appendChild(t);
    const bl = document.createElement('button');
    bl.type = 'button'; bl.className = 'fitaLimpa'; bl.textContent = 'Limpar a busca';
    bl.addEventListener('click', limparBuscaQuadro);
    fita.appendChild(bl);
    board.appendChild(fita);
  }

  colunas.forEach(([, dados]) => {
    const col = document.createElement('div');
    col.className = 'col ' + (CLASSE_COL[alvo] || 'gestao')
                  + (dados.itens.length ? '' : ' vazia');
    col.innerHTML =
      '<div class="col-h"><span class="t"></span><span class="c">' + dados.itens.length + '</span></div>' +
      '<div class="col-b"></div>';
    col.querySelector('.t').textContent = dados.rotulo;
    const body = col.querySelector('.col-b');
    if (!dados.itens.length){
      const v = document.createElement('div'); v.className = 'col-vazia';
      // com busca ligada a coluna não está vazia: a busca é que escondeu
      v.textContent = q ? 'nenhuma com a busca' : 'vazia';
      body.appendChild(v);
    }
    // mais crítico primeiro: travada, depois atrasada, depois mais tempo parada
    dados.itens.sort(ordemFila);
    dados.itens.forEach(c => body.appendChild(cardEl(c)));
    board.appendChild(col);
  });

  // ── Onde o quadro começa a rolar ────────────────────────────────────────
  // Nasceu no S22, quando a Equipe Administrativa tinha NOVE colunas (seis do
  // fornecimento e três da inspeção) e uma OS de inspeção nascia fora da tela,
  // atrás de cinco colunas vazias. Desde o S25 o fornecimento tem quadro
  // próprio e os quadros de equipe cabem na tela — mas o Fornecimento de
  // Produtos tem nove colunas, e a regra continua valendo lá: coluna vazia
  // continua na tela (é lei), mas a ROLAGEM começa na primeira que tem card.
  // ⚠ quem rola na horizontal é o <main>, não o #board — mexer no scrollLeft do
  //   #board não move nada. `scrollIntoView` acha o pai certo sozinho.
  const cheia = colunas.findIndex(([, d]) => d.itens.length);
  if (cheia > 0){
    const alvoCol = board.children[cheia + (q ? 1 : 0)];   // a fita da busca conta
    if (alvoCol) alvoCol.scrollIntoView({ inline: 'start', block: 'nearest' });
  }

  // depois de a tela estar pronta, nunca antes
  carregarLogos(doQuadro.map(c => c.cliente_id));
}

/* O contador do menu de cada quadro (valor do banco → id do elemento). */
const CONTADOR_QUADRO = { campo:'nCampo', adm:'nAdm', tecadm:'nTec', fornecimento:'nForn' };

/* O item de menu do primeiro quadro em que o card aparece. */
function visaoDoCard(c){
  const q = c ? quadrosDe(c)[0] : 'campo';
  return Object.keys(QUADRO_DA_VISAO).find(v => QUADRO_DA_VISAO[v] === q) || 'campo';
}

function limparBuscaQuadro(){
  BUSCA[quadro] = ''; document.getElementById('tbBusca').value = ''; pintar();
}

// ── registro de colunas ─────────────────────────────────────────────────────
// Lido do template ativo. A partir do S21 o quadro de cada fase vem DECLARADO
// no template (`quadros`); só quando ele não declara é que se deriva do perfil,
// que é o caso do template de fornecimento e continua funcionando igual.
//
// E lê TODOS os templates ativos, não o primeiro: com dois tipos de OS, ler só
// um deixava as colunas do outro invisíveis enquanto nenhuma OS estivesse nelas
// — que é justamente quando ver a coluna vazia importa.
let COLUNAS = [];
let falhaColunas = null;   // por que o registro não veio — o quadro sem colunas diz o motivo

/* O rótulo da coluna na demonstração. No banco isso é a tabela
   `colunas_quadro`; aqui é uma cópia, e é a única cópia aceitável — a demo
   roda sem servidor nenhum. */
const ROTULO_DEMO = {
  'Administrativo inicial':    'Entrada e Registro',
  'Agendamento':               'Agendamento de Serviço',
  'Documentação pré-inspeção': 'Preparação Documental Inicial',
  'Inspeção em campo':         'Execução em Campo',
  'Processamento e revisão':   'Engenharia e Laudos',
  'Encerramento':              'Faturamento e Expedição',
  'Entrega e pós-venda':       'Entrega / Pós venda',
};

/* A chave de uma coluna é (template, fase) — NÃO a fase sozinha.
   "Encerramento" é o nome da última fase nos DOIS templates: no fornecimento
   ela reúne "registrar motivo de perda" e "encerrar OS"; na inspeção, placas,
   boleto e entrega. Agrupar pelo nome punha as duas na mesma coluna, e a
   partir do S22 — em que a da inspeção se chama "Faturamento e Expedição" —
   isso passaria a ser um rótulo descrevendo metade do que está embaixo dele. */
const chaveCol = (tpl, fase) => (tpl || '') + '\u0000' + fase;

/* fase → rótulo, montado do mesmo registro de colunas. Existe para a gaveta
   poder nomear as fases que NÃO são a atual do card (a atual vem pronta na
   view, em `coluna_rotulo`). */
const ROTULOS_FASE = {};

async function carregarColunas(){
  try{
    if (DEMO){
      // Mesma derivação de antes, agora carregando template e rótulo.
      const vistas = new Map();
      Object.values(DEMO_DB || (demoSeed(), DEMO_DB)).forEach(o => {
        const tpl = o.meta.insp ? 'INSPECAO_NR13' : 'ACESSORIOS_NR13';
        o.tarefas.forEach(t => {
          const qs = quadrosDemo(tpl, t.fase, t.perfis_responsaveis, t.quadros);
          qs.forEach(q => vistas.set(chaveCol(tpl, t.fase) + '\u0000' + q, {
            template_id: tpl, fase: t.fase, ordem: t.fase_ordem, quadro: q,
            rotulo: (tpl === 'INSPECAO_NR13' && ROTULO_DEMO[t.fase]) || t.fase,
            tplOrdem: o.meta.insp ? 1 : 0 }));
        });
      });
      COLUNAS = [...vistas.values()].sort((a,b) => (a.tplOrdem - b.tplOrdem) || (a.ordem - b.ordem));
      COLUNAS.forEach(k => ROTULOS_FASE[chaveCol(k.template_id, k.fase)] = k.rotulo);
      return;
    }
    // Fora da demo, quem monta o registro é o BANCO (`v_colunas_quadro`): ele
    // já junta template, fase, quadro e rótulo na ordem do fluxo. Derivar isso
    // aqui de novo seria a segunda versão da mesma regra — e é assim que uma
    // tela passa a discordar da outra.
    const c = await get('v_colunas_quadro?select=*&order=template_ordem,fase_ordem,quadro');
    COLUNAS = (c || []).map(x => ({
      template_id: x.template_id, fase: x.fase, ordem: x.fase_ordem,
      quadro: x.quadro, rotulo: x.rotulo || x.fase, tplOrdem: x.template_ordem
    }));
    COLUNAS.forEach(k => ROTULOS_FASE[chaveCol(k.template_id, k.fase)] = k.rotulo);
    falhaColunas = null;
  }catch(e){
    falhaColunas = e.message || 'não deu para ler o registro de colunas';
    console.warn('[colunas] não foi possível ler o registro:', e.message);
  }
}

/** A mesma leitura do `tf__executor_de` do banco, para a demonstração: o perfil
    admin NÃO vota (é 'ambos' por definição e faria toda fase virar 'ambos'). */
function derivarQuadroDemo(perfisResp){
  const p = (perfisResp || []).filter(x => EXECUTOR[x] && x !== 'admin');
  const temCampo = p.some(x => EXECUTOR[x] === 'campo' || EXECUTOR[x] === 'ambos');
  const temAdm   = p.some(x => EXECUTOR[x] === 'adm'   || EXECUTOR[x] === 'ambos');
  return temCampo && temAdm ? ['campo','adm'] : temCampo ? ['campo'] : ['adm'];
}

const atrasado = c => c.alerta_dias && c.dias_na_coluna != null && c.dias_na_coluna >= c.alerta_dias;

/* ── A ORDEM DA FILA ────────────────────────────────────────────────────────
   Quem sobe é o que está apodrecendo, não o que foi marcado como importante.

   1. URGENTE fura a fila. Só ele. `alta` é desempate lá embaixo — e isso não é
      timidez: no ProperCare qualquer nível furava, e em pouco tempo "alta"
      virou o padrão de quem quer atenção, ou seja, parou de significar algo.
   2. Depois, a SITUAÇÃO — o pior dos dois relógios (etapa e prazo), que vem
      calculada do banco, não daqui.
   3. Depois, travada.
   4. Depois, quem está parado há mais tempo na coluna.
   5. E só então a prioridade digitada desempata.                              */
const SIT_PESO = { atrasada:3, risco:2, ok:1, sem_meta:0, concluida:0 };
const peso = c => (c.travada ? 2 : 0) + (atrasado(c) ? 1 : 0);
const rankPrio = c => Number(c.prioridade_rank || 1);
const furaFila = c => c.fura_fila === true || rankPrio(c) >= 3;

function ordemFila(a, b){
  const fa = furaFila(a) ? 1 : 0, fb = furaFila(b) ? 1 : 0;
  if (fa !== fb) return fb - fa;
  const sa = SIT_PESO[a.situacao] ?? 0, sb = SIT_PESO[b.situacao] ?? 0;
  if (sa !== sb) return sb - sa;
  const pa = peso(a), pb = peso(b);
  if (pa !== pb) return pb - pa;
  const da = a.dias_na_coluna || 0, db = b.dias_na_coluna || 0;
  if (da !== db) return db - da;
  return rankPrio(b) - rankPrio(a);
}

const PRIO_ROT = { urgente:'urgente', alta:'alta', normal:'' };

/** O chip de prazo com PROCEDÊNCIA — o title diz de onde veio o número.
 *  Prazo sem procedência vira crença: ninguém sabe se aquele 05/08 é promessa
 *  de alguém ou meta de contrato, e os dois se discute de um jeito diferente. */
function chipPrazo(c){
  // Sem prazo NENHUM não é silêncio: a OS aparece marcada "sem meta", e o chip
  // aponta para o que falta cadastrar. Card mudo faz o problema passar batido.
  if (!c.prazo_saida || c.dias_restantes == null){
    if (c.encerrada) return '';
    return '<span class="chip" title="Sem data prevista e sem meta no tipo de OS">sem meta</span>';
  }
  const d = Number(c.dias_restantes);
  // ⚠ A procedência e a data ficam NO TEXTO, não só no `title`: celular não tem
  // hover, e é no celular que a fila é varrida. O título continua, para quem
  // usa mouse — mas ele nunca é o único lugar onde a informação existe.
  const de = c.prazo_origem === 'digitado' ? 'digitado' : 'meta';
  const cls = d < 0 ? ' atras' : d <= 2 ? ' risco' : '';
  const txt = d < 0 ? Math.abs(d) + 'd de atraso' : d === 0 ? 'vence hoje' : 'faltam ' + d + 'd';
  const dica = c.prazo_origem === 'digitado' ? 'prazo digitado por alguém do escritório'
             : 'meta do tipo de OS — ninguém digitou esta data';
  return '<span class="chip' + cls + '" title="' + esc(dataBR(c.prazo_saida) + ' — ' + dica) + '">📅 '
       + esc(dataBR(c.prazo_saida).slice(0,5)) + ' · ' + txt + ' · ' + de + '</span>';
}

function cardEl(c){
  const el = document.createElement('button');
  el.className = 'card'
    + (c.travada ? ' travada' : atrasado(c) ? ' atrasada' : '')
    + (c.situacao ? ' sit-' + c.situacao : '')
    + (furaFila(c) ? ' urgente' : '');
  el.type = 'button';

  const total = c.tarefas_na_coluna || 0, feitas = c.resolvidas_na_coluna || 0;
  const pct = total ? Math.round(feitas / total * 100) : 0;

  const chips = [];
  if (furaFila(c)) chips.push('<span class="chip urg">🔴 urgente</span>');
  else if (rankPrio(c) === 2) chips.push('<span class="chip altaP">alta</span>');
  const cp = chipPrazo(c); if (cp) chips.push(cp);
  if (total > 1) chips.push('<span class="chip prog">' + feitas + ' de ' + total + '</span>');
  if (c.travada) chips.push('<span class="chip travada">travada</span>');
  else if (atrasado(c)) chips.push('<span class="chip atras">' + c.dias_na_coluna + 'd · meta ' + c.alerta_dias + 'd</span>');
  else if (c.dias_na_coluna != null) chips.push('<span class="chip">' + c.dias_na_coluna + 'd na coluna</span>');
  if (c.tarefa_atual_lock) chips.push('<span class="chip lock">assumida</span>');

  // ITEM 1 (S32): a logo sobe para o topo, na largura do card, e o número e o
  // nome passam a vir debaixo dela. A hierarquia se inverte de propósito: a
  // marca se reconhece num relance, o nome se lê.
  el.innerHTML =
    logoHTML(c.cliente_id, c.cliente, 'logoFaixa') +
    '<div class="num mono"></div>' +
    '<div class="cli"><span class="nm"></span></div>' +
    '<div class="tar"><span class="ic">' + icone(c.tarefa_atual_status, c.tarefa_atual_tipo) + '</span><span class="tn"></span></div>' +
    (total > 1 ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '') +
    '<div class="foot">' + chips.join('') + '</div>';

  el.querySelector('.num').textContent = c.numero;
  el.querySelector('.cli .nm').textContent = c.cliente;
  el.querySelector('.tn').textContent  = c.tarefa_atual || '—';
  el.addEventListener('click', () => abrirOS(c));
  return el;
}

function icone(status, tipo){
  if (status === 'completo')   return '✓';
  if (status === 'dispensado') return '–';
  if (status === 'bloqueado')  return '\u2298';
  if (status === 'condicional')return '◇';
  if (status === 'com_pendencia' || status === 'incompleto') return '!';
  if (tipo === 'decisao')      return '?';
  if (String(tipo||'').startsWith('auto:agregacao')) return '∑';
  if (String(tipo||'').startsWith('auto:documento')) return '§';
  if (String(tipo||'').startsWith('auto:'))          return '⟳';
  if (status === 'em_andamento') return '▸';
  return '○';
}

  document.getElementById('scrim').classList.remove('on');
  osAberta = null;

  negAberto = null;
}

/* Escape resolve por prioridade, de cima para baixo. Antes ele fechava sempre a
   gaveta: com o modal aberto, fechava a gaveta invisível por baixo e deixava o
   modal na tela; e digitando uma anotação, fechava a gaveta e perdia o texto. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (_tfMenuEl){ tfFecharMenu(); return; }
  const modal = document.getElementById('modal');
  if (modal && !modal.hidden){ fecharModal(); return; }
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')
      && a.closest('#drawer')){ a.blur(); return; }   // primeiro Esc sai do campo
  fecharDrawer();
});

function pintarDrawer(){
  if (abaDrawer === 'cliente')  return pintarClienteOS();
  if (abaDrawer === 'hist')     return pintarHistorico();
  if (abaDrawer === 'itens')    return pintarItens();
  if (abaDrawer === 'proposta') return pintarProposta();
  if (abaDrawer === 'custos')   return pintarCustos();
  if (abaDrawer === 'arquivos') return pintarArquivos();
  const { card, tarefas } = osAberta;
  const body = document.getElementById('dBody');
  body.innerHTML = '';
  body.appendChild(faixaPrazo(card));

  let faseAtual = null;
  tarefas.forEach(t => {
    if (t.fase !== faseAtual){
      faseAtual = t.fase;
      const h = document.createElement('div');
      h.className = 'fase-h' + (t.fase === card.coluna ? ' atual' : '');
      // o mesmo nome do quadro: a fase é a chave, o rótulo é o texto
      h.textContent = (t.fase === card.coluna ? rotuloCol(card) : null)
                   || (ROTULOS_FASE[chaveCol(card.template_id, t.fase)] || t.fase);
      body.appendChild(h);
    }
    const resolvida = (t.status === 'completo' || t.status === 'dispensado');
    const eAtual = (t.tarefa_id === card.tarefa_atual_id);
    const el = document.createElement('div');
    el.className = 'tk' + (resolvida ? ' res' : '') + (eAtual ? ' atual' : '');
    el.dataset.tid = t.tarefa_id;
    el.innerHTML = '<div class="st">' + icone(t.status, t.tipo) + '</div><div class="nm"><b></b><small></small></div>';
    el.querySelector('b').textContent = t.nome;
    // ITEM 1 (S31): "bloqueado · tecnico_adm" colava dois fatos diferentes
    // com um ponto do meio — o estado da tarefa e QUEM a executa. Foi essa
    // leitura que fez o documento de 17/09 dizer que duas tarefas sem dono
    // estavam "travadas para o Vinícius". O "quem faz:" separa os dois.
    el.querySelector('small').textContent =
      t.status + (t.perfis_responsaveis && t.perfis_responsaveis.length
        ? ' · quem faz: ' + t.perfis_responsaveis.join(', ') : '');
    // ── ITEM 9 (S27): DESFAZER UMA CONCLUSÃO FEITA POR ENGANO ───────────
    // Até o S26 a tarefa concluída aparecia só com o "✓" e não havia nada a
    // clicar — nem para admin. O Bruno concluiu "Anexar pedido de compra" por
    // engano e não houve como voltar.
    //
    // O botão só existe onde o banco vai aceitar: admin, tarefa que NÃO fecha
    // fase nem OS, e que não é decisão. Oferecer onde `tf_reabrir_tarefa`
    // recusaria seria a tela prometendo o que o servidor nega — o defeito que
    // este projeto persegue desde o parecer do TapControl.
    if (resolvida && !DEMO && sessao.admin
        && !(t.acao_terminal || '') && t.tipo !== 'decisao'){
      const d = document.createElement('div');
      d.className = 'tkDes';
      d.innerHTML = '<span class="nota">concluída por engano?</span>'
        + '<button class="btn mini" type="button">reabrir</button>';
      d.querySelector('button').addEventListener('click', ev => {
        ev.stopPropagation(); modalReabrir(card, t);
      });
      el.appendChild(d);
    }

    // Designação: só faz sentido no que ainda não foi resolvido, e — desde o
    // S31 — TROCAR é só do ADMIN. Atribuir tarefa a outra pessoa virou ação do
    // Bruno; os demais perfis continuam com "Assumir", que pega a tarefa para
    // si e já confere o perfil. A trava de verdade é `tf_designar_tarefa`;
    // o botão some para a tela não oferecer o que o banco vai recusar.
    //
    // ITEM 1 (S37): até o S36 a MESMA condição (`sessao.admin`) escondia o
    // botão E a informação — quem faz, que dia, quanto tempo. O inspetor abria
    // a OS e via a coluna em branco. Saber quem faz o quê não é sensível (a
    // Agenda, que é de todos desde o S36, já mostra isso), então a linha
    // aparece para todo mundo que abre a OS; só o "trocar" é do admin.
    if (!resolvida && !DEMO){
      const podeTrocar = podeVer('os') && sessao.admin;
      const d = document.createElement('div');
      d.className = 'tkDes';
      const quem = t.usuario_designado ? (NOMES[t.usuario_designado] || 'designada') : null;
      const apoio = (t.apoios || []).map(id => NOMES[id] || '?').join(', ');
      d.innerHTML = '<span>' + (quem
          ? esc(quem) + (apoio ? ' <span class="chip apoio">+ ' + esc(apoio) + '</span>' : '')
            + (t.data_prevista ? ' · ' + dataBR(t.data_prevista) : ' · sem dia')
            + (t.tempo_estimado_min ? ' · ' + minHora(t.tempo_estimado_min) : '')
          : '<i>ninguém designado</i>') + '</span>'
        + (podeTrocar ? '<button class="btn mini" type="button">' + (quem ? 'trocar' : 'designar') + '</button>' : '');
      if (podeTrocar) d.querySelector('button').addEventListener('click', ev => {
        ev.stopPropagation(); modalDesignar(card, t);
      });
      // ── ITEM 1 (S38): "ASSUMIR" EM TODA TAREFA DO MEU PERFIL ──────────
      // Atribuir continua do admin (o "trocar" acima). Assumir — pegar para
      // si o que o seu perfil faz — é de quem está em "quem faz", e vale
      // também para a tarefa BLOQUEADA: a troca de pessoa acontece hoje, no
      // telefone, para a inspeção de amanhã. Numa bloqueada o banco muda SÓ
      // o responsável (58_ajustes_s38); quem destrava continua sendo o motor.
      //
      // Não aparece: para o admin (ele já tem o "trocar"), na tarefa que já é
      // minha, e na tarefa ATUAL — essa tem o botão grande lá embaixo, com a
      // fechadura, e dois botões para a mesma coisa confundem.
      if (!podeTrocar && !eAtual && possoAssumir(t)){
        const ba = document.createElement('button');
        ba.className = 'btn mini'; ba.type = 'button'; ba.textContent = 'assumir';
        ba.title = t.usuario_designado
          ? 'Passa a tarefa de ' + (NOMES[t.usuario_designado] || 'outra pessoa') + ' para você.'
          : 'Esta tarefa não tem responsável. Assumir põe o seu nome nela.';
        ba.addEventListener('click', ev => {
          ev.stopPropagation();
          confirmarAssumir(t, t.usuario_designado ? (NOMES[t.usuario_designado] || 'outra pessoa') : null, false);
        });
        d.appendChild(ba);
      }
      el.appendChild(d);
    }
    body.appendChild(el);
  });

  pintarAcoes();
  rolarParaTarefaAtual(body);
}

/** ITEM 7 (S28): a lista abria sempre do topo — ao abrir o card E depois de
 *  concluir uma tarefa (que reabre a gaveta). A tarefa atual já tinha fundo
 *  azul claro; ganhou borda, e a lista rola até ela. `block:'nearest'` não
 *  serve: com a tarefa abaixo da dobra, ela pararia colada no rodapé. A conta
 *  é feita no próprio #dBody para a PÁGINA não rolar junto. */
function rolarParaTarefaAtual(body){
  const alvo = body && body.querySelector('.tk.atual');
  if (!alvo) return;
  requestAnimationFrame(() => {
    const cx = body.getBoundingClientRect(), el = alvo.getBoundingClientRect();
    const meio = (el.top - cx.top) + body.scrollTop - (body.clientHeight - el.height) / 3;
    body.scrollTop = Math.max(0, meio);
  });
}

// ── ABA CLIENTE DA OS ───────────────────────────────────────────────────────
// Decisão do Fernando (08/09): se a fase comercial não preencheu endereço,
// localização e contato de agendamento, quem está executando a OS completa por
// aqui. Sem isso, o inspetor liga para o escritório do portão errado.
//
// O caminho NÃO é dar ao campo a escrita em `clientes` — isso lhe daria também
// renomear cliente e mexer em CNPJ. É `tf_completar_dados_cliente`, que recebe
// a OS e toca em TRÊS campos.
//
// E campo já preenchido não vira caixa de texto: vira texto com um "corrigir"
// ao lado. Sobrescrever o endereço que o comercial conferiu tem que ser um ato
// deliberado, não o efeito de alguém tabular por cima de um formulário no
// celular, com pressa, na portaria.
async function pintarClienteOS(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  body.innerHTML = '<p class="nota">Carregando…</p>';

  let cli = null, contatos = [];
  try{
    if (DEMO){
      cli = (demoClientes().find(x => x.id === card.cliente_id)) || { razao_social: card.cliente };
      contatos = demoContatos(card.cliente_id);
    } else {
      const [f, ct] = await Promise.all([
        get('clientes?select=id,razao_social,nome_fantasia,cnpj,endereco,cidade,uf,localizacao,tem_logo&id=eq.' + card.cliente_id),
        get('contatos?select=id,nome,telefone,email,papeis&cliente_id=eq.' + card.cliente_id
            + '&ativo=eq.true&order=nome')
      ]);
      cli = (f && f[0]) || { razao_social: card.cliente }; contatos = ct || [];
    }
  }catch(e){
    body.innerHTML = '<div class="aviso"><b>Não deu para carregar o cliente.</b><br>'
      + esc(e.message) + '</div>';
    return;
  }

  const agenda = contatos.find(x => (x.papeis||[]).includes('agenda'));
  const agendaTxt = agenda
    ? agenda.nome + (agenda.telefone || agenda.email ? ' · ' + (agenda.telefone || agenda.email) : '')
    : null;

  body.innerHTML =
      '<div class="fichaTopo">'
    +   '<div class="lado">' + logoHTML(cli.id, cli.razao_social, 'logoFicha') + '</div>'
    +   '<div class="campos"><h3 style="margin:0 0 4px"></h3>'
    +     (cli.nome_fantasia ? '<p class="nota" style="margin:0 0 2px">' + esc(cli.nome_fantasia) + '</p>' : '')
    +     '<p class="nota" style="margin:0">' + esc([cli.cnpj, cli.cidade, cli.uf].filter(Boolean).join(' · ') || 'sem CNPJ') + '</p>'
    +   '</div></div>'
    + blocoLocal({ endereco: cli.endereco, localizacao: cli.localizacao, contato_agenda: agendaTxt })
    + '<div id="osCliEdit"></div>';
  body.querySelector('h3').textContent = cli.razao_social;
  carregarLogos([cli.id]);
  // ITEM 2 (S29): enviar a logomarca daqui mesmo
  if (cli.id) ligarLogoEditavel(body.querySelector('.fichaTopo .lado'), cli.id, cli.razao_social,
                                cli.tem_logo == null ? null : !!cli.tem_logo);

  const falta = !cli.endereco || !cli.localizacao || !agenda;
  const alvo = document.getElementById('osCliEdit');

  const desenharForm = (sobrescrever) => {
    alvo.innerHTML =
        '<div class="secTit">' + (sobrescrever ? 'Corrigir' : 'Completar o que falta') + '</div>'
      + (sobrescrever
          ? '<div class="aviso">Você está <b>corrigindo dados já preenchidos</b>. O que você '
            + 'gravar substitui o que está lá.</div>'
          : '<p class="nota">Só o que está em branco é preenchido — o que já existe não é '
            + 'tocado. Para mudar algo já preenchido, use “Corrigir”.</p>')
      + (sobrescrever || !cli.endereco
          ? '<div class="campo"><label for="ocEnd">Endereço</label><input id="ocEnd" type="text"'
            + ' value="' + (sobrescrever ? esc(cli.endereco||'') : '') + '"'
            + ' placeholder="Rua, número, bairro" autocomplete="off" name="oce_nofill"></div>' : '')
      + (sobrescrever || !cli.localizacao
          ? '<div class="campo"><label for="ocLoc">Localização no mapa</label><input id="ocLoc" type="text"'
            + ' value="' + (sobrescrever ? esc(cli.localizacao||'') : '') + '"'
            + ' placeholder="Cole o link do Google Maps" autocomplete="off" name="ocl_nofill"></div>' : '')
      + (contatos.length
          ? '<div class="campo"><label for="ocCt">Quem se procura para agendar</label>'
            + '<select id="ocCt"><option value="">— não mexer —</option>'
            + contatos.map(x => '<option value="' + esc(x.id) + '"'
                + (agenda && agenda.id === x.id ? ' selected' : '') + '>' + esc(x.nome)
                + (x.telefone ? ' · ' + esc(x.telefone) : '') + '</option>').join('')
            + '</select></div>'
          : '<p class="nota">Este cliente ainda não tem contato cadastrado — quem cadastra é o '
            + 'escritório, em Cadastros → Clientes.</p>')
      + '<button class="btn pri" id="ocSalvar" style="width:100%">Gravar</button>'
      + (sobrescrever ? '' : '<button class="btn" id="ocCorrigir" style="width:100%;margin-top:8px">Corrigir dados já preenchidos</button>');

    const bc = document.getElementById('ocCorrigir');
    if (bc) bc.addEventListener('click', () => desenharForm(true));

    document.getElementById('ocSalvar').addEventListener('click', function(){
      _semDuploEnvio_(this, async () => {
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const end = v('ocEnd'), loc = v('ocLoc'), ct = v('ocCt');
        if (!end && !loc && !ct){ toast('Não há nada para gravar.','err'); return; }
        try{
          if (!DEMO) await rpc('tf_completar_dados_cliente', {
            p_os_id: card.os_id, p_endereco: end || null, p_localizacao: loc || null,
            p_contato_agenda_id: ct || null, p_sobrescrever: !!sobrescrever });
          toast('Dados do cliente atualizados.','ok');
          pintarClienteOS();
        }catch(e){ toast(e.message,'err'); }
      });
    });
  };

  desenharForm(!falta);
}

// lê `v_os_linha_tempo` (eventos + anotações) e ganha o mesmo campo de
// anotação do negócio. Anotação anulada fica riscada, com o motivo.
async function pintarHistorico(){

  const body = document.getElementById('dBody');

    linhas = DEMO ? demoHistorico()
      : await get('v_os_linha_tempo?select=*&os_id=eq.' + card.os_id
                  + '&order=ocorrido_em.desc&limit=300');
  }catch(e){
    body.innerHTML = '<div class="vazio2"><b>Não deu para ler o histórico</b><p></p></div>';
    body.querySelector('p').textContent = e.message;
    pintarAcoes();
    return;
  }
  body.innerHTML = (DEMO ? '' :
      '<div class="novaNota">'
    + '<textarea id="hoTexto" rows="2" placeholder="Anotar nesta OS. Ex.: a portaria pediu o ASO do inspetor."></textarea>'
    + '<div class="linhaNota"><span class="nota" style="margin:0;flex:1">Fica no histórico com o seu nome. '
    + 'Não se edita — se sair errado, dá para anular com o motivo.</span>'
    + '<button class="btn pri" id="hoSalvar" type="button">Registrar</button></div></div>')
    + (linhas.length ? '<div class="histL" id="hoLista"></div>'
       : '<div class="vazio2"><b>Sem histórico</b><p>Nada foi registrado nesta OS ainda.</p></div>');
  const lista = document.getElementById('hoLista');
  linhas.forEach(l => {
    if (l.tipo === 'anotacao' || l.tipo === 'registro'){
      const ev = linhaAnotacao({ id: l.interacao_id, tipo: 'nota', texto: l.descricao,
        quando: l.ocorrido_em, quem: l.quem, automatica: l.automatica, anulada: l.anulada,
        anulado_em: l.anulado_em, anulado_por_nome: l.anulado_por_nome,
        anulado_motivo: l.anulado_motivo, quem_id: l.quem_id }, () => pintarHistorico());
      ev.classList.add('naOS');
      lista.appendChild(ev);
      return;
    }
    const d = document.createElement('div');
    d.className = 'histI';
    d.innerHTML = '<div class="histT"></div><div class="histD"></div><div class="histQ"></div>';
    d.querySelector('.histT').textContent = HIST_ROT[l.tipo] || l.tipo;
    d.querySelector('.histD').textContent = l.descricao || '';
    d.querySelector('.histQ').textContent = (l.quem || '') + ' · '
      + new Date(l.ocorrido_em).toLocaleString('pt-BR');
    lista.appendChild(d);
  });
  const bs = document.getElementById('hoSalvar');
  if (bs) bs.addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const t = document.getElementById('hoTexto').value.trim();
      if (!t){ toast('Escreva o que aconteceu.','err'); return; }
      try{
        await rpc('tf_registrar_interacao', { p_os_id: card.os_id, p_texto: t, p_tipo: 'nota' });
        toast('Anotado na ' + card.numero + '.','ok');
        pintarHistorico();
      }catch(e){ toast(e.message,'err'); }
    });
  });
  pintarAcoes();
}

function demoHistorico(){
  const agora = new Date();
  const menos = m => new Date(agora.getTime() - m*60000).toISOString();
  return [
    { tipo:'prioridade', descricao:'Prioridade: normal → urgente', quem:'Fernando Sousa', ocorrido_em:menos(30) },
    { tipo:'prazo', descricao:'Prazo: (sem prazo) → 2026-09-12', quem:'Fernando Sousa', ocorrido_em:menos(95) },
    { tipo:'designacao', descricao:'Designada a Inspetor 1 para 2026-09-08', quem:'Túlio', ocorrido_em:menos(240) },
    { tipo:'os_aberta', descricao:'OS aberta', quem:'Túlio', ocorrido_em:menos(3000) },
  ];
}

// Excluir OS fica junto das ações, mas discreto e só para admin: é a única
// exclusão do sistema que apaga histórico de verdade, e existe para tirar OS de
// teste. Fica registrado no livro de exclusões quem apagou o quê.
function botaoExcluirOS(cx, card){
  if (!sessao.admin) return;
  const w = document.createElement('div');
  w.style.cssText = 'margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)';
  w.innerHTML = '<button class="btn perigo" id="osDel" style="width:100%">Excluir esta OS</button>';
  cx.appendChild(w);
  document.getElementById('osDel').addEventListener('click', async () => {
    const motivo = prompt('Excluir ' + card.numero + ' definitivamente.\n\n'
      + 'Some com tarefas, itens, levantamentos, propostas e anexos. '
      + 'Os arquivos no Drive NÃO são apagados.\n\nPor quê? (fica registrado)');
    if (motivo === null) return;
    try{
      if (!DEMO) await rpc('tf_excluir_os', { p_os_id: card.os_id, p_motivo: motivo || null });
      toast(card.numero + ' excluída.','ok');
      fecharDrawer(); carregar();
    }catch(e){ toast(e.message,'err'); }
  });
}

// O wrapper garante que o botão de excluir apareça em QUALQUER caminho de
// pintarAcoes — e ela tem seis `return` diferentes.
function pintarAcoes(){
  pintarAcoes_(); 
  botaoExcluirOS(document.getElementById('dAcoes'), osAberta.card);
}

function pintarAcoes_(){
  const { card, tarefas } = osAberta;
  const cx = document.getElementById('dAcoes');
  const t = tarefas.find(x => x.tarefa_id === card.tarefa_atual_id);
  cx.innerHTML = '';
  if (!t){ cx.innerHTML = '<div class="hint">OS sem tarefa aberta.</div>'; return; }

  const podeAgir = sessao.admin || !t.perfis_responsaveis || !t.perfis_responsaveis.length
                   || t.perfis_responsaveis.includes(sessao.perfil);

  // ITEM 7 (S28): o NOME, não o código. "T05" não diz nada a quem não
  // decorou o template; o código fica no título do elemento, para quem precisa.
  const lbl = document.createElement('div');
  lbl.className = 'lbl lblAtual';
  lbl.title = 'Código ' + t.tarefa_id + ' — clique para achar na lista';
  lbl.innerHTML = '<span>Tarefa atual:</span> <b></b>';
  lbl.querySelector('b').textContent = t.nome;
  lbl.addEventListener('click', () => rolarParaTarefaAtual(document.getElementById('dBody')));
  cx.appendChild(lbl);

  const row = document.createElement('div'); row.className = 'row'; cx.appendChild(row);
  const hint = document.createElement('div'); hint.className = 'hint'; cx.appendChild(hint);

  if (!podeAgir){
    hint.textContent = 'Esta tarefa é de ' + t.perfis_responsaveis.join(' ou ')
      + '. Ela aparece aqui para você saber por que a OS está parada — mas quem conclui é o perfil responsável.';
    return;
  }

  if (t.status === 'bloqueado' || t.status === 'condicional'){
    hint.textContent = 'Esta tarefa ainda não está liberada. Ela abre sozinha quando as anteriores fecharem.';
    return;
  }

  if (String(t.tipo||'').startsWith('auto:agregacao')){
    hint.textContent = 'Esta etapa fecha sozinha quando todos os itens estiverem preenchidos — '
      + 'não há botão. O contador no card mostra quanto falta.';
    return;
  }
  if (String(t.tipo||'').startsWith('auto:documento')){
    hint.textContent = 'Esta etapa fecha quando o documento for emitido. Emitir é o que move o card.';
    return;
  }
  if (String(t.tipo||'').startsWith('auto:')){
    hint.textContent = 'Esta etapa fecha com o envio do app de campo.';
    return;
  }

  if (t.tipo === 'decisao'){
    // A resposta do CLIENTE é uma decisão especial: ela precisa de evidência.
    // Reconhecida pelas opções, não pelo id da tarefa — id muda quando o
    // template muda, e a regra tem que sobreviver a isso.
    const ehAprovacao = (t.opcoes || []).some(o => o.valor === 'aprovado_total');
    // S29: "em parte" não é mais resposta — se o SQL 51 ainda não rodou e a
    // opção veio do banco, a tela não a oferece
    (t.opcoes || []).filter(o => !(ehAprovacao && o.valor === 'aprovado_parcial')).forEach(o => {
      const b = document.createElement('button');
      b.className = 'btn' + (o.valor === 'reprovado' ? '' : ' pri');
      b.textContent = o.label || o.valor;
      // Até o S17 estes botões chamavam `tf_resolver_decisao` direto: o card
      // andava e não sobrava evidência de quem aprovou, por onde, em que dia.
      // Era o buraco COM-05 do TapControl de volta, e a dica embaixo pedia à
      // pessoa que lembrasse de fazer um segundo passo que não existia em tela
      // nenhuma. Agora abrem o formulário, que grava as duas coisas juntas.
      b.addEventListener('click', () => ehAprovacao
        ? modalAprovacao({ os_id: card.os_id, cliente_id: card.cliente_id,
                           numero: card.numero }, o.valor)
        : agir('decisao', t, o.valor));
      row.appendChild(b);
    });
    hint.textContent = ehAprovacao
      ? 'A resposta do cliente. Contato, canal e data são pedidos junto — é o que faz '
        + '"o cliente aprovou" ser conferível daqui a seis meses.'
      : 'Escolher move o card. A opção fica registrada no histórico.';
    return;
  }

  // ITEM 8 (S28): assumir PASSA A DESIGNAÇÃO — quem assume vira o dono em
  // todas as telas. E quando a tarefa já está com outra pessoa (o caso do
  // telefonema: "não vou conseguir, assume você"), o botão diz de quem ela
  // está e pede confirmação antes de tomar o lugar.
  const eu = meuId();
  const lockVivo = t.lock_por && (!t.lock_expira || new Date(t.lock_expira) > new Date());
  // ── ITEM 4 (S31): não se assume o que já é seu ─────────────────────────
  // A tarefa estava designada ao Bruno, e o Bruno logado via "Assumir" ao
  // lado de "Concluir" — um botão que, no melhor caso, não faz nada visível.
  // Some só nesse caso: sem dono, ou com OUTRA pessoa, "Assumir" continua
  // (é o caminho de tomar a tarefa de um colega, com a confirmação).
  //
  // O que se perde, e é de propósito: quem já é dono não passa mais pelo
  // `tf_assumir_tarefa`, então a tarefa fica em `pendente` em vez de
  // `em_andamento` e ninguém trava a fechadura de 8 horas. Nada depende
  // disso para concluir — e quem for tomar a tarefa continua vendo o nome do
  // dono e a confirmação antes.
  const jaEMinha = t.usuario_designado && String(t.usuario_designado) === String(eu);
  // S38: também em "em andamento" cuja fechadura de 8 h já venceu. Até o S37
  // o botão só existia em `pendente`: quem assumiu ontem e não foi deixava a
  // tarefa em andamento, sem fechadura viva, e sem botão para ninguém tomar.
  if ((t.status === 'pendente' || t.status === 'em_andamento') && !lockVivo && !jaEMinha){
    const b = document.createElement('button');
    b.className = 'btn pri'; b.textContent = 'Assumir';
    const dono = t.usuario_designado && t.usuario_designado !== eu
      ? (NOMES[t.usuario_designado] || 'outra pessoa') : null;
    if (dono) b.title = 'Está designada a ' + dono + '. Assumir passa a tarefa para você.';
    b.addEventListener('click', () => dono
      ? confirmarAssumir(t, dono, false)
      : agir('assumir', t));
    row.appendChild(b);
  } else if (lockVivo && t.lock_por !== eu && (t.status === 'pendente' || t.status === 'em_andamento')){
    const quem = NOMES[t.lock_por] || 'outra pessoa';
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = 'Assumir no lugar de ' + quem;
    b.addEventListener('click', () => confirmarAssumir(t, quem, true));
    row.appendChild(b);
  }
  const bc = document.createElement('button');
  bc.className = 'btn' + (t.status === 'em_andamento' ? ' pri' : '');
  bc.textContent = 'Concluir';
  // ── ITEM 9, SEGUNDA FRENTE (S27): CONFIRMAR ONDE NÃO SE PODE VOLTAR ──────
  // A tarefa que fecha a fase ou a OS é justamente a que NÃO ganha o botão
  // "reabrir" — desfazê-la é devolver o que ela fechou, e isso continua sendo
  // feito no banco. Então o cuidado vem antes: um clique a mais onde o erro
  // custa caro, e nenhum onde não custa.
  const fecha = t.acao_terminal || '';
  bc.addEventListener('click', () => {
    if (!fecha) return agir('concluir', t);
    abrirModal('Confirmar conclusão',
        '<p>Confirma que <b>' + esc(t.nome) + '</b> foi realmente feito?</p>'
      + '<div class="aviso">Concluir esta tarefa <b>'
      + (fecha === 'fechar_os' ? 'encerra a OS inteira' : 'fecha a fase') + '</b>. '
      + 'Ela não pode ser reaberta pela tela depois — se for engano, a correção passa pelo Fernando.</div>',
      [{ label:'Cancelar', onClick: () => fecharModal() },
       { label:'Sim, foi feito', pri:true, onClick: async () => {
           fecharModal(); await agir('concluir', t); }}]);
  });
  row.appendChild(bc);
  hint.textContent = fecha
    ? 'Esta tarefa ' + (fecha === 'fechar_os' ? 'encerra a OS' : 'fecha a fase')
      + ' — o TapFlow pede confirmação antes.'
    : 'Concluir esta tarefa move o card — a próxima coluna é consequência, não escolha.';
}

/** S38 · a MESMA conta de `tf_assumir_tarefa`: não resolvida, não é minha,
 *  e o meu perfil está em "quem faz" (ou a tarefa não nomeia perfil, ou sou
 *  admin). O botão só aparece onde o banco vai aceitar. */
function possoAssumir(t){
  if (!t || DEMO) return false;
  if (t.status === 'completo' || t.status === 'dispensado') return false;
  if (t.usuario_designado && String(t.usuario_designado) === String(meuId())) return false;
  if (sessao.admin) return true;
  const ps = t.perfis_responsaveis || [];
  return !ps.length || ps.includes(sessao.perfil);
}

function confirmarAssumir(t, quem, forcar){
  const bloqueada = !(t.status === 'pendente' || t.status === 'em_andamento');
  const souApoio = (t.apoios || []).some(a => String(a) === String(meuId()));
  const outros = (t.apoios || []).filter(a => String(a) !== String(meuId()))
                   .map(a => NOMES[a] || '?');
  abrirModal('Assumir "' + t.nome + '"',
      (quem
        ? '<p>Esta tarefa está ' + (forcar ? 'sendo feita por' : 'com') + ' <b>' + esc(quem) + '</b>.</p>'
        : '<p>Esta tarefa ainda não tem responsável.</p>')
    + '<div class="aviso">Ao assumir, <b>você passa a ser o responsável</b> — na agenda, no card e '
    + 'nas telas de todo mundo'
    + (quem ? (souApoio
        ? ', e <b>' + esc(quem) + ' passa a ser o apoio</b> (vocês trocam de papel)'
        : ' — <b>' + esc(quem) + ' sai da tarefa</b>') : '')
    + '. O dia marcado continua o mesmo. A troca fica no histórico da OS.'
    + (outros.length && !souApoio ? '<br>O apoio (' + esc(outros.join(', ')) + ') continua.' : '')
    + (bloqueada ? '<br><b>A tarefa continua bloqueada</b> até a etapa anterior fechar — '
        + 'assumir agora só deixa o seu nome nela.' : '')
    + '</div>',
    [{ label:'Cancelar', onClick: () => fecharModal() },
     { label:'Assumir', pri:true, onClick: async () => { fecharModal(); await agir('assumir', t, null, forcar); } }]);
}

/** ITEM 9 · o formulário do desfazer. O motivo é OBRIGATÓRIO e vai para o
 *  histórico da OS: reabertura sem motivo é o mesmo buraco que a aprovação
 *  sem evidência tinha até o S18 — o card anda e ninguém sabe por quê. */
function modalReabrir(card, t){
  abrirModal('Reabrir "' + t.nome + '"',
      '<div class="aviso">Isto devolve a tarefa para <b>pendente</b>. O que já foi feito '
    + 'por causa dela não é desfeito — só a tarefa volta a pedir conclusão.</div>'
    + '<div class="campo"><label for="rbMot">Por que está reabrindo?</label>'
    + '<textarea id="rbMot" rows="3" placeholder="ex.: marquei como concluída sem ter anexado o pedido"></textarea>'
    + '<div class="dica">Fica registrado no histórico, com o seu nome e a hora.</div></div>'
    + '<div class="dica" id="rbMsg" style="color:var(--crit)"></div>',
    [{ label:'Cancelar', onClick: () => fecharModal() },
     { label:'Reabrir', pri:true, onClick: async () => {
        const mot = (document.getElementById('rbMot').value || '').trim();
        const msg = document.getElementById('rbMsg');
        if (mot.length < 5){ msg.textContent = 'Escreva o motivo — ele fica no histórico.'; return; }
        try{
          await rpc('tf_reabrir_tarefa',
                    { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id, p_motivo: mot });
          fecharModal();
          toast('"' + t.nome + '" foi reaberta.', 'ok');
          await carregar({silencioso:true});
          const novo = cards.find(x => x.os_id === card.os_id) || card;
          await abrirOS(novo);
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

async function agir(acao, t, valor, forcar){
  const { card } = osAberta;
  document.querySelectorAll('#dAcoes .btn').forEach(b => b.disabled = true);
  try{
    if (DEMO){ demoAgir(card, t, acao, valor); toast('Modo demo: ' + acao + ' aplicado', 'ok'); }
    else if (acao === 'assumir'){
      // `tf_assumir_tarefa` NÃO levanta exceção quando recusa: ela devolve
      // {status:'recusado'} ou {status:'locked'}. Até o S18 o app ignorava o
      // retorno e dizia "OS assumida" de qualquer jeito — inclusive quando o
      // servidor tinha acabado de negar. É o verde mentindo, que é o defeito
      // que este projeto persegue desde o parecer do TapControl.
      const r = await rpc('tf_assumir_tarefa', { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id,
                                                  p_forcar: !!forcar });
      if (r && r.status === 'recusado'){
        throw new Error(r.motivo === 'perfil_nao_autorizado'
          ? 'Esta tarefa é de ' + ((r.perfis||[]).join(' ou ') || 'outro perfil')
            + '. O seu perfil não a assume.'
          : 'O servidor recusou: ' + (r.motivo || 'motivo não informado')
            + (r.status_atual ? ' (a tarefa está ' + r.status_atual + ')' : '') + '.');
      }
      if (r && r.status === 'locked'){
        throw new Error((r.locked_nome || 'Outra pessoa') + ' assumiu esta tarefa agora há pouco. '
          + 'Use "Assumir no lugar de" se foi combinado com ela.');
      }
    }
    else if (acao === 'concluir') await rpc('tf_concluir_tarefa', { p_os_id: card.os_id, p_tarefa_id: t.tarefa_id });
    else if (acao === 'decisao')  await rpc('tf_resolver_decisao',{ p_os_id: card.os_id, p_tarefa_id: t.tarefa_id, p_valor: valor });
    if (acao === 'assumir') toast(t.status === 'pendente' || t.status === 'em_andamento'
      ? 'Assumida — agora a tarefa é sua em todas as telas.'
      : 'Assumida — o seu nome já está nela; ela continua bloqueada até a etapa anterior fechar.', 'ok');

    await carregar({silencioso:true});
    const novo = cards.find(x => x.os_id === card.os_id);
    if (!novo || !novo.coluna){ fecharDrawer(); toast('OS concluída — saiu do quadro.', 'ok'); return; }
    if (novo.coluna !== card.coluna) toast('Card foi para "' + rotuloCol(novo) + '".', 'ok');
    await abrirOS(novo);
  }catch(e){
    toast(e.message, 'err');
    pintarAcoes();
  }
}

let toastTimer = null;
function toast(msg, tipo){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (tipo ? ' ' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 4200);
}

let DEMO_MODELOS = null;

function demoSeed(){

    T('T07','Emitir proposta','auto:documento:proposta','Orçamento',40,4,'bloqueado',['comercial']),
    T('T08','Enviar ao cliente','manual','Orçamento',40,5,'bloqueado',['comercial']),
    T('T09','Cliente aprovou?','decisao','Aguardando aprovação',50,1,'bloqueado',['comercial','admin'],
      [{valor:'aprovado_total',label:'Aprovado'},{valor:'reprovado',label:'Não aprovado'}]),
    T('T11','Emitir pedido de compra','auto:documento:pedido_compra','Compra',60,1,'condicional',['compras']),
    T('T12','Receber material','auto:agregacao','Compra',60,2,'condicional',['compras']),

    T('T14','Agendar retorno','manual','Retorno p/ instalação',80,1,'condicional',['tecnico_adm','comercial']),
    T('T15','Instalar em campo','auto:levantamento_f2','Retorno p/ instalação',80,2,'condicional',['inspetor','auxiliar']),
    T('T10','Registrar motivo de perda','manual','Encerramento',90,1,'condicional',['comercial','admin']),
    T('T16','Encerrar OS','manual','Encerramento',90,2,'bloqueado',['admin','tecnico_adm'])
  ];

  // A inspeção NR-13, que é o fluxo que atravessa os QUATRO quadros. Sem ela a

  // Técnico Administrativo existiria e nunca teria um card dentro. Demo que só

// ── ITEM 10 (S29): O TURNO POR DIA DA SEMANA ────────────────────────────────
// A sexta da Engetap termina uma hora antes. Com um horário só, a barra
// mentia em pelo menos um dia da semana, qualquer que fosse o número gravado.
// `TURNO.dias[1..7]` guarda a capacidade de cada dia; `agCap(iso)` é quem as
// telas perguntam. `capacidade_min` continua existindo como "o dia típico"
// (o que o mês usa para explicar a conta) — espelho de
// `tf_capacidade_diaria_min()` sem argumento.
const _minDe = h => { const p = String(h||'').split(':'); return (+p[0]||0)*60 + (+p[1]||0); };
function aplicarTurnoDias(td){
  const dias = {};
  td.forEach(d => {
    const cap = Math.max(0, _minDe(d.fim) - _minDe(d.inicio) - (Number(d.intervalo_min) || 0));
    dias[Number(d.dia_semana)] = { ativo: !!d.ativo, cap: d.ativo ? cap : 0,
      inicio: d.inicio, fim: d.fim, intervalo_min: Number(d.intervalo_min) || 0 };
  });
  const uteis = Object.keys(dias).map(Number).filter(k => dias[k].ativo).sort((a,b) => a-b);
  const freq = {};
  uteis.forEach(k => { freq[dias[k].cap] = (freq[dias[k].cap] || 0) + 1; });
  const tipico = Object.keys(freq).map(Number)
    .sort((a,b) => (freq[b] - freq[a]) || (b - a))[0];
  TURNO = Object.assign({}, TURNO, { dias, dias_uteis: uteis.length ? uteis : [1,2,3,4,5],
                                     capacidade_min: tipico || TURNO.capacidade_min || 480,
                                     porDia: true });
}
/** Capacidade (min) do dia `iso`. Dia fora do turno = 0. */
function agCap(iso){
  const dow = (d => d === 0 ? 7 : d)(new Date(iso + 'T12:00').getDay());
  if (TURNO.porDia && TURNO.dias && TURNO.dias[dow]) return TURNO.dias[dow].cap;
  return TURNO.capacidade_min || 540;
}

/** 90 → "1h30min". Minuto puro em barra de carga não se lê.
 *  ITEM 9 (S36): até o S35 era "1h30" — o minuto perdia o sufixo só quando
 *  vinha junto da hora, e "10min" ao lado de "1h20" parecia outra unidade.
 *  A MESMA função existe no Field; as duas mudaram juntas. */
function minHora(m){
  m = Number(m || 0);
  if (!m) return '—';
  const h = Math.floor(m / 60), r = m % 60;
  return h ? (h + 'h' + (r ? String(r).padStart(2,'0') + 'min' : '')) : (r + 'min');
}
