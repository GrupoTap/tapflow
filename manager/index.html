    + '<div class="planosGerT">Os três planos da proposta</div>'
    + '<div class="campo" style="margin:0 0 8px"><label for="' + idSel + '">Linha do plano</label>'
    + '<select id="' + idSel + '">' + est.itens.map((it, k) => '<option value="' + k + '"'
        + (k === est.idxPlano ? ' selected' : '') + '>' + (k + 1) + ' — ' + esc(String(it.descricao || '').slice(0, 70))
        + '</option>').join('') + '</select>'
    + '<small>É a linha que muda de plano para plano. As outras saem iguais nas três tabelas.</small></div>'
    + '<table class="tbl planosTbl"><thead><tr><th>Plano</th><th>Linha do plano</th><th class="num">Unitário</th>'
    + '<th class="num">Total geral</th></tr></thead><tbody>'
    + _PLANOS_ID.map(pid => '<tr class="' + pid + '"><td><b>' + rot[pid] + '</b>'
        + (pid === 'padrao' ? ' <span class="selo aprov">o que vale</span>'
                            : ' <span class="nota">' + pctTxt(P[pid].pct) + '</span>') + '</td>'
        + '<td class="pd"></td><td class="num">' + esc(qtd) + ' × ' + esc(BRL(P[pid].unit)) + '</td>'
        + '<td class="num"><b>' + esc(BRL(P[pid].total)) + '</b></td></tr>').join('')
    + '</tbody></table>'
    + '<p class="nota" style="margin:6px 0 0">O valor da proposta (no card, no quadro e no «Valor_Total» do '
    + 'papel) é o do <b>Padrão</b>. Básico e Premium existem só no documento. Textos, percentuais e '
    + 'arredondamento: Configurações › Planos.</p></div>';
  el.querySelectorAll('.planosTbl tbody tr').forEach(tr => {
    const pid = tr.className;
    tr.querySelector('.pd').textContent = [pl[pid + '_texto'], pl[pid + '_faixa'], pl.trecho_comum].filter(Boolean).join(' ');
  });
  const sel = document.getElementById(idSel);
  if (sel) sel.addEventListener('change', () => { est.idxPlano = Number(sel.value) || 0; pintarPlanosGerador(el, est, idSel); });
}
/** O que o docxGerar recebe no modo planos (ou null). */
function planosParaGerar(est){
  if (!est.temPlanos || !est.planosPar || !est.itens.length) return null;
  return montarPlanos(est.itens, est.idxPlano, est.planosPar);
}

async function montarGerador(caixa, props){
  const { card } = osAberta;
  const est = { modelo:null, valores:null, itens:[], fonte:'os', total:0, tirarLogo:true, logos:0,
                logoCli: undefined, porLogo: true };

  // ── ITEM 3 (S27): GERAR DE NOVO É REVISÃO, E A TELA DIZ ISSO ANTES ───────
  // Até o S26 cada clique em "Gerar" emitia um número NOVO: a OS-26025 saía
  // com as propostas 26025 e 26026, as duas em v1, e o cliente recebia dois
  // números para o mesmo trabalho. Agora repetir é versão — e o que muda
  // depende de a proposta já ter saído ou não:
  //   · nunca gerada            → nasce a v1
  //   · gerada e NÃO enviada    → o TapFlow corrige a mesma versão no lugar
  //   · já enviada ao cliente   → nasce a v2, e a anterior fica vencida
  //   · já aprovada             → o banco recusa (e diz o que fazer)
  // A tela avisa qual dos quatro é ANTES do clique: descobrir depois, pelo
  // número impresso no .docx, é tarde.
  const viva = (props || []).filter(x => x.status !== 'vencida' && x.status !== 'reprovada')
                            .sort((a,b) => (b.versao||0) - (a.versao||0))[0] || null;
  const aviso = !viva
    ? ''
    : (viva.status === 'aprovada' || viva.status === 'aprovada_parcial')
      ? '<div class="aviso">A proposta <b>' + esc(rotuloProposta(viva.numero, viva.versao))
        + '</b> já foi <b>aprovada</b> pelo cliente. Gerar por cima dela é recusado — '
        + 'marque a caixa abaixo se isto é outra proposta, de outro escopo.</div>'
      : viva.enviada_em
        ? '<div class="aviso">Esta OS já tem a proposta <b>' + esc(rotuloProposta(viva.numero, viva.versao))
          + '</b>, <b>já enviada</b> ao cliente. Gerar agora cria a <b>'
          + esc(rotuloProposta(viva.numero, (viva.versao || 1) + 1))
          + '</b>, e a anterior fica marcada como vencida.</div>'
        : '<div class="aviso">Esta OS já tem a proposta <b>' + esc(rotuloProposta(viva.numero, viva.versao))
          + '</b>, que <b>ainda não foi enviada</b>. Gerar agora <b>corrige esta mesma versão</b> '
          + 'no lugar — não cria número nem versão nova.</div>';

  caixa.innerHTML =
    '<h3 style="font-size:15px;margin:0 0 4px">Gerar proposta</h3>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.5">' +
      'O documento sai com os dados desta OS já preenchidos. Confira antes de gerar — ' +
      'o que estiver vazio aqui sai vazio no papel.</p>' +
    '<div class="campo"><label for="gM">Modelo</label><select id="gM"></select>' +
      '<div class="dica" id="gMd"></div></div>' +
    '<div class="campo"><label for="gNat">Natureza do serviço</label>' +
      '<input id="gNat" type="text" placeholder="ex.: Inspeção em vasos de pressão"></div>' +
    '<div id="gVals"></div>' +
    '<div id="gTab"></div>' +
    '<div id="gPlanos"></div>' +
    '<div id="gLogo"></div>' +
    '<div id="gAnexo"></div>' +
    aviso +
    (viva
      ? '<label class="chk" style="margin:0 0 10px"><input type="checkbox" id="gNovo"> '
        + '<span>É <b>outra</b> proposta, com número próprio</span></label>'
        + '<div class="dica" style="margin:-6px 0 12px">Marque só quando for outro escopo — '
        + 'não para corrigir a que já existe. O caso comum é deixar desmarcado.</div>'
      : '') +
    '<button class="btn pri" id="gOk" style="width:100%;padding:11px">Gerar e baixar o .docx</button>' +
    '<div class="dica" id="gMsg" style="margin-top:8px"></div>';

  if (_msgGerador){
    const m0 = caixa.querySelector('#gMsg');
    m0.style.color = _msgGerador.cor; m0.textContent = _msgGerador.texto;
    _msgGerador = null;
  }

  const sel = document.getElementById('gM');
  let modelos = [];
  try{ modelos = await listarModelos(); }
  catch(e){ caixa.innerHTML = '<p class="dica">Não consegui ler os modelos: ' + esc(e.message) + '</p>'; return; }
  if (!modelos.length){
    caixa.innerHTML = '<h3 style="font-size:15px;margin:0 0 4px">Gerar proposta</h3>' +
      '<p class="dica">Nenhum modelo cadastrado. Rode o <b>23_gerador_modelos.sql</b> e suba os ' +
      '.docx no bucket <b>modelos</b>.</p>';
    return;
  }
  sel.innerHTML = modelos.map(m => '<option value="'+m.id+'">'+esc(m.titulo)+'</option>').join('');
  document.getElementById('gNat').value = card.descricao || '';

  // ── os valores que vão para o documento ──
  const pintarValores = () => {
    const el = document.getElementById('gVals');
    const v = est.valores || {};
    const faltando = CHAVES_CRITICAS.filter(k => !String(v[k]||'').trim());
    el.innerHTML =
      '<div style="border:1px solid var(--rule);border-radius:5px;padding:12px;margin:0 0 14px">' +
      '<div style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;' +
      'color:var(--ink-3);margin-bottom:9px">Dados que vão no documento</div>' +
      '<div class="gGrid"></div>' +
      (faltando.length
        ? '<p class="gFalta">Vazio: ' + faltando.map(k => ROTULO_CHAVE[k]||k).join(', ') +
          '. Preencha aqui para esta proposta, e corrija no cadastro do cliente depois.</p>'
        : '') +
      '</div>';
    const g = el.querySelector('.gGrid');
    CHAVES_NA_TELA.forEach(k => {
      const d = document.createElement('div'); d.className = 'campo'; d.style.margin = '0';
      d.innerHTML = '<label></label><input type="text">';
      d.querySelector('label').textContent = ROTULO_CHAVE[k] || k;
      const i = d.querySelector('input');
      i.value = v[k] || '';
      if (!String(v[k]||'').trim() && CHAVES_CRITICAS.includes(k)) i.classList.add('vazio');
      i.addEventListener('input', () => {
        est.valores[k] = i.value;
        i.classList.toggle('vazio', !i.value.trim() && CHAVES_CRITICAS.includes(k));
      });
      g.appendChild(d);
    });
  };

  // ── a tabela de itens ──
  const pintarTabela = () => {
    const el = document.getElementById('gTab');
    const m = est.modelo;
    if (!m || !m.tem_tabela){
      el.innerHTML = m && m.e_contrato
        ? '<p class="dica" style="margin:0 0 14px">Minuta de contrato: sem tabela de itens.</p>'
        : '<p class="dica" style="margin:0 0 14px">Este modelo não tem a tabela de 5 colunas que o ' +
          'motor reescreve — os valores continuam sendo ajustados no Word, como antes.</p>';
      return;
    }
    const daOS = est.itens || [];
    el.innerHTML =
      '<div class="campo"><label>Itens da tabela</label>' +
      '<div class="tog" id="gFonte">' +
        '<button type="button" data-v="os">Itens da OS (' + daOS.length + ')</button>' +
        '<button type="button" data-v="modelo">Itens do modelo</button>' +
      '</div></div>' +
      '<div id="gPrev"></div>';
    const tg = document.getElementById('gFonte');
    const pinta = () => {
      [...tg.children].forEach(b => b.classList.toggle('on', b.dataset.v === est.fonte));
      const p = document.getElementById('gPrev');
      if (est.fonte === 'modelo'){
        p.innerHTML = '<p class="dica" style="margin:0 0 14px">A tabela sai como está no modelo — ' +
          'com os itens da última proposta salva nele. Ajuste no Word depois de baixar.</p>';
        return;
      }
      if (!daOS.length){
        p.innerHTML = '<p class="dica" style="margin:0 0 14px;color:var(--warn)">Esta OS ainda não tem ' +
          'itens aprovados. Sem itens, escolha "Itens do modelo".</p>';
        return;
      }
      p.innerHTML = '<div style="overflow-x:auto;margin:0 0 14px"><table class="tbl"><thead><tr>' +
        '<th>#</th><th>Item</th><th class="num">Qtd</th><th class="num">Unitário</th><th class="num">Total</th>' +
        '</tr></thead><tbody></tbody><tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">Total</td>' +
        '<td class="num" style="font-weight:700" id="gTot"></td></tr></tfoot></table></div>';
      const tb = p.querySelector('tbody');
      daOS.forEach((it, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td class="mono"></td><td class="d"></td><td class="num q"></td>' +
                       '<td class="num u"></td><td class="num t"></td>';
        tr.children[0].textContent = i+1;
        tr.querySelector('.d').textContent = it.descricao;
        tr.querySelector('.q').textContent = it.qtd;
        tr.querySelector('.u').textContent = it.unitario;
        tr.querySelector('.t').textContent = it.total;
        tb.appendChild(tr);
      });
      document.getElementById('gTot').textContent = BRL(est.total);
    };
    [...tg.children].forEach(b => b.addEventListener('click', () => {
      est.fonte = b.dataset.v; pinta();
      // "itens do modelo" deixa a tabela como está — sem planos a calcular
      pintarPlanosGerador(document.getElementById('gPlanos'), est, 'gPlanoL', est.fonte !== 'os');
    }));
    pinta();
  };

  // ── a logomarca: a do cliente entra, a do anterior sai (item 5, S28) ──
  const pintarLogo = () => {
    const el = document.getElementById('gLogo');
    if (!el) return;
    el.innerHTML = htmlLogoGerador(est, 'gLogoX');
    const c = document.getElementById('gLogoX');
    if (c) c.addEventListener('change', () => { est.porLogo = c.checked; });
  };

  // ── S38 · item 2: o anexo por vaso ──
  const pintarAnexo = () => {
    const el = document.getElementById('gAnexo');
    if (!el) return;
    el.innerHTML = htmlAnexoGerador(est, 'gAnexoX');
    const c = document.getElementById('gAnexoX');
    if (c) c.addEventListener('change', () => { est.porAnexo = c.checked; });
  };

  // ── trocar de modelo recarrega tudo ──
  const trocar = async () => {
    est.modelo = modelos.find(m => m.id === sel.value);
    document.getElementById('gMd').textContent = (est.modelo && est.modelo.descricao) || '';
    const nat = document.getElementById('gNat').value.trim();
    try{
      const [v, itens] = DEMO
        ? [demoValores(card), []]
        : await Promise.all([
            rpc('tf_valores_proposta', { p_os_id: card.os_id, p_numero: '(ao gerar)', p_natureza: nat || null }),
            rpc('tf_itens_proposta',   { p_os_id: card.os_id })
          ]);
      est.valores = v || {};
      est.itens = itens || [];
      est.total = est.itens.reduce((s,i) => s + (Number(i.valor_total_num)||0), 0);
      est.fonte = est.itens.length ? 'os' : 'modelo';
    }catch(e){ toast('Não consegui montar os dados: ' + e.message, 'err'); est.valores = est.valores || {}; }
    pintarValores(); pintarTabela();
    est.anexo = undefined; pintarAnexo();
    est.anexo = await carregarAnexoVasos({ p_os_id: card.os_id }); pintarAnexo();
    // o modelo é baixado aqui só para saber se tem logomarca de cliente. Vale a
    // pena: é o defeito mais caro de todos, e descobrir depois de enviar não
    // adianta. Fica em cache para a hora de gerar.
    est.logos = 0; pintarLogo();
    est.temPlanos = false; est.idxPlano = 0; pintarPlanosGerador(document.getElementById('gPlanos'), est, 'gPlanoL');
    // Em modo demo não há Storage: `SUPABASE_URL` é vazio, então a URL virava
    // `file:///storage/...` e o navegador registrava um erro de CORS no console
    // a cada abertura da aba. Erro de console em demonstração é ruído que
    // esconde erro de verdade — e aqui não havia o que baixar mesmo.
    if (DEMO){ pintarLogo(); return; }
    try{
      const path = est.modelo.storage_path || (est.modelo.id + '.docx');
      const b = await baixarModelo(path);
      est.logos = await logoDeClienteNoModelo(b);
      if (est.modelo.tem_tabela && await planosNoModelo(path, b)){
        est.planosPar = await carregarPlanos();
        est.temPlanos = true;
        est.idxPlano = linhaDoPlano(est.itens, est.planosPar);
      }
    }catch(e){ /* se não der para baixar agora, o erro aparece ao gerar */ }
    pintarLogo();
    pintarPlanosGerador(document.getElementById('gPlanos'), est, 'gPlanoL', est.fonte !== 'os');
    if (est.logos && est.logoCli === undefined){
      est.logoCli = await prepararLogoCliente(card.cliente_id).catch(() => null);
      pintarLogo();
    }
  };
  sel.addEventListener('change', trocar);
  document.getElementById('gNat').addEventListener('change', () => {
    if (!est.valores) return;
    const nat = document.getElementById('gNat').value.trim();
    est.valores['TítuloNatureza'] = nat;
    est.valores['Natureza_do_Serviço'] = nat;
  });
  await trocar();

  // ── gerar ──
  document.getElementById('gOk').addEventListener('click', async () => {
    const b = document.getElementById('gOk');
    const msg = document.getElementById('gMsg');
    if (!est.modelo || !est.valores) return;
    b.disabled = true; msg.style.color = ''; msg.textContent = 'Reservando o número…';
    let numero = null;
    try{
      // 1. o número primeiro: ele precisa ir DENTRO do arquivo
      // ⚠ com o `p_os_id`: quando a OS já tem referência (o caso do
      //   fornecimento, em que a OS nasce antes), a proposta REAPROVEITA o
      //   número dela em vez de puxar outro. Um trabalho, um número.
      const forcarNovo = !!(document.getElementById('gNovo')
                            && document.getElementById('gNovo').checked);
      numero = DEMO ? '26099' : await rpc('tf_reservar_numero_proposta',
                                          { p_os_id: card.os_id, p_forcar_novo: forcarNovo });
      // S28: o papel diz a REVISÃO. Até o S27 a v2 saía impressa "Proposta
      // 26030" — igual à v1 que o cliente já tinha. A versão que vai nascer é
      // previsível pela regra do S27: já enviada → v+1; não enviada → a mesma.
      let versaoPrevista = 1;
      if (!forcarNovo && viva && viva.numero === numero)
        versaoPrevista = viva.enviada_em ? (viva.versao || 1) + 1 : (viva.versao || 1);
      est.valores['Nº_da_Proposta'] = rotuloProposta(numero, versaoPrevista);

      msg.textContent = 'Baixando o modelo…';
      const bytes = await baixarModelo(est.modelo.storage_path || (est.modelo.id + '.docx'));

      msg.textContent = 'Montando o documento…';
      const usaOS = est.modelo.tem_tabela && est.fonte === 'os' && est.itens.length;
      const planos = usaOS ? planosParaGerar(est) : null;
      const { blob, faltaram, logosTiradas, logosPostas, planosEscritos, anexoVasos } = await docxGerar({
        bytes, valores: est.valores,
        tabela: usaOS ? est.itens : null,
        totalTexto: BRL(est.total).replace(/ /g,' '),
        tirarLogoCliente: true,
        logoCliente: est.porLogo !== false ? est.logoCli : null,
        planos,
        anexo: anexoParaGerar(est)
      });

      const nome = nomeSeguro(numero + ' - ' + (est.valores['Cliente']||'Cliente')
        + ' - ' + (document.getElementById('gNat').value.trim() || est.modelo.titulo)) + '.docx';
      baixarBlob(blob, nome);

      msg.textContent = 'Registrando na OS…';
      let reg = null;
      if (!DEMO) reg = await rpc('tf_registrar_documento_gerado', {
        p_os_id: card.os_id, p_modelo_id: est.modelo.id, p_numero: numero,
        p_valores: est.valores, p_itens: usaOS ? est.itens : null,
        p_valor_total: usaOS ? est.total : null,
        p_nome_arquivo: nome,
        p_natureza: document.getElementById('gNat').value.trim() || null
      });

      const antes = card.coluna;
      if (!DEMO) await carregar({silencioso:true});
      const novo = cards.find(x => x.os_id === card.os_id);
      if (novo) osAberta.card = novo;

      // o que o banco DE FATO fez: nasceu, corrigiu ou versionou. Dizer
      // "gerada" nos três casos é como alguém descobre, semanas depois, que
      // a v1 que mandou para o cliente foi sobrescrita.
      const rot = (reg && reg.rotulo) || numero;
      const oque = !reg ? 'gerada e baixada.'
        : reg.caso === 'corrigida'  ? 'corrigida no lugar e baixada — a versão não mudou, porque ela ainda não tinha sido enviada.'
        : reg.caso === 'versao_nova'? 'gerada e baixada — versão nova; a anterior ficou marcada como vencida.'
        : 'gerada e baixada.';
      _msgGerador = { cor:'var(--ok)', texto: rot + ' ' + oque
        + (planosEscritos ? ' Os três planos preenchidos (Básico, Padrão e Premium).' : '')
        + (anexoVasos ? ' Anexo por vaso no fim (' + anexoVasos + ' vaso(s)).' : '')
        + (logosPostas ? ' Logomarca do cliente no cabeçalho.' : '')
        + (logosTiradas ? ' Logomarca do cliente anterior removida do cabeçalho.' : '')
        + (reg && reg.rotulo && reg.rotulo !== est.valores['Nº_da_Proposta']
           ? ' ⚠ O papel saiu como "' + est.valores['Nº_da_Proposta'] + '" e o sistema registrou "'
             + reg.rotulo + '" — confira antes de enviar.' : '')
        + (faltaram.length ? ' ⚠ Ficaram sem valor no papel: ' + faltaram.join(', ') + '.' : '')
        + (novo && novo.coluna !== antes ? ' O card foi para "' + rotuloCol(novo) + '".' : '') };
      toast('Proposta ' + rot + ' ' + ((reg && reg.caso === 'corrigida') ? 'corrigida.' : 'gerada.'), 'ok');
      pintarProposta();
    }catch(e){
      msg.style.color = 'var(--crit)';
      // ⚠ Desde o S27 o número reservado costuma ser o que a OS JÁ usa — nesse
      //   caso nada foi queimado, e dizer que foi assusta à toa. Só o número
      //   realmente novo (primeira proposta, ou "outra proposta") some.
      const novoNum = !viva || (document.getElementById('gNovo')
                                && document.getElementById('gNovo').checked);
      msg.textContent = e.message
        + (numero && novoNum ? ' (o número ' + numero + ' foi queimado — não é problema.)' : '');
      b.disabled = false;
    }
  });
}

// ════════════════════════════════════════════════════════════════════════════
// ABA PROPOSTA — gerar aqui, ou registrar a que veio de fora
// ════════════════════════════════════════════════════════════════════════════
// ── REGISTRAR A RESPOSTA DO CLIENTE ─────────────────────────────────────────
// A maior lacuna do TapFlow até o S18: existia `tf_aprovar_proposta` no banco,
// completa, e não existia tela. Na prática a aprovação era registrada pelo SQL
// Editor — ou não era registrada, e alguém clicava direto em "Aprovou tudo" no
// quadro, que movia o card SEM evidência nenhuma.
//
// Isso é o buraco COM-05 do TapControl voltando: lá o responsável pela
// aprovação era a string 'ADM' e não havia com quem conferir. A decisão 7 de
// 04/09 diz o contrário — contato, canal e data são obrigatórios. Esta tela é
// onde essa decisão passa a existir de verdade.
//
// Duas portas para o mesmo lugar, de propósito:
//   · os botões da tarefa "Cliente aprovou?" no rodapé da gaveta;
//   · o botão na linha da proposta, na aba Proposta.
// Quem está olhando o quadro chega pela primeira; quem está olhando a proposta
// chega pela segunda. As duas abrem o MESMO formulário e gravam pela MESMA
// função — que faz evidência e pipeline juntos, sem meio-caminho.

// ── ITENS 6 e 7 (S29) ───────────────────────────────────────────────────────
// A resposta é tudo ou nada: o que o cliente cortou vira uma revisão da
// proposta, aprovada por inteiro. Sobram duas respostas, escritas como estado
// ("Aprovado" / "Não aprovado") e com fundo esmaecido nas cores que o app já
// usa — azul da Engetap e vermelho de alerta. O botão da tarefa "Cliente
// aprovou?" (que vem do template) fica neutro: ali é escolha, não resposta.
// `aprovado_parcial` continua no mapa só para mostrar o HISTÓRICO.
const APROV_ROT = { aprovado_total:'Aprovado', reprovado:'Não aprovado',
                    aprovado_parcial:'Aprovado em parte (antigo)' };
function seloAprov(tipo){
  const cls = tipo === 'reprovado' ? 'naoaprov' : 'aprov';
  return '<span class="selo ' + cls + '">' + esc(APROV_ROT[tipo] || tipo || '') + '</span>';
}

/** A proposta desta OS que está esperando resposta. */
function propostaEmJogo(props){
  const vivas = (props||[]).filter(p => p.status === 'emitida' || p.status === 'enviada');
  if (!vivas.length) return null;
  // a de maior versão; empate resolve pela mais recente
  return vivas.sort((a,b) => (b.versao||0) - (a.versao||0))[0];
}

async function modalAprovacao(ctx, tipoInicial, prForcada){
  if (DEMO){
    abrirModal('Registrar resposta do cliente',
      '<div class="aviso">No modo demonstração esta tela não grava — ela depende de '
      + 'proposta emitida e de contato cadastrado no banco real.</div>'
      + '<p class="nota">O que ela pede: a resposta (aprovado ou não aprovado), quem respondeu, '
      + 'por qual canal e em que dia.</p>',
      [{ label:'Fechar', onClick: fecharModal }]);
    return;
  }

  let props = [], contatos = [], motivos = [];
  try{
    [props, contatos, motivos] = await Promise.all([
      // a proposta do negócio já vem escolhida pela lista; a da OS é procurada
      prForcada ? Promise.resolve([prForcada])
                : get('v_propostas?select=*&os_id=eq.' + ctx.os_id + '&order=versao.desc'),
      get('contatos?select=id,nome,telefone,email,papeis&cliente_id=eq.' + ctx.cliente_id
          + '&ativo=eq.true&order=nome'),
      get('motivos_perda?select=id,nome&ativo=is.true&order=nome')
    ]);
  }catch(e){ toast(e.message,'err'); return; }

  const pr = prForcada || propostaEmJogo(props);
  if (!pr){
    // Recusar explicando o que falta vale mais que um formulário que não grava.
    abrirModal('Ainda não há proposta para responder',
      '<p class="nota">A resposta do cliente é a resposta a uma PROPOSTA — e este negócio ainda '
      + 'não tem nenhuma emitida' + (props.length ? ' e não respondida' : '') + '.</p>'
      + '<p class="nota">Registre a proposta na aba <b>Proposta</b> primeiro. É ela que '
      + 'congela o que foi ofertado, e é sobre esse escopo que a aprovação se aplica, '
      + 'item a item.</p>',
      [{ label:'Entendi', onClick: fecharModal }]);
    return;
  }

  let dados = null;
  try{ dados = await rpc('tf_proposta_para_decidir', { p_proposta_id: pr.id }); }
  catch(e){ toast(e.message,'err'); return; }

  // já respondida: mostra o que foi, não oferece formulário
  if (dados && dados.ja_decidida){
    const d = dados.decisao || {};
    abrirModal('A proposta ' + rotuloProposta(pr.numero, pr.versao) + ' já foi respondida',
      '<div class="aviso">' + seloAprov(d.tipo) + ' em '
      + esc(dataBR(d.quando)) + (d.contato ? ', por ' + esc(d.contato) : '')
      + (d.canal ? ' (' + esc(d.canal) + ')' : '') + '.</div>'
      + '<p class="nota">Registrado por ' + esc(d.quem || '—') + '.'
      + (d.observacao ? '<br>' + esc(d.observacao) : '') + '</p>'
      + '<p class="nota">Se o cliente mudou de ideia — ou quer só uma parte —, emita uma <b>revisão</b> da proposta e '
      + 'registre a resposta nela: os itens são corrigidos e as duas respostas ficam no '
      + 'histórico. O card <b>não</b> volta nem anda de novo — ele já passou por esta etapa, '
      + 'e quadro que desanda deixa de ser confiável.</p>',
      [{ label:'Fechar', onClick: fecharModal }]);
    return;
  }

  // quem aprova a proposta é papel de contato: esse vem primeiro na lista
  const ordenados = contatos.slice().sort((a,b) =>
    ((b.papeis||[]).includes('aprova') ? 1 : 0) - ((a.papeis||[]).includes('aprova') ? 1 : 0));

  const corpo =
      '<p class="nota">Proposta <b>' + esc(rotuloProposta(pr.numero, pr.versao)) + '</b>'
    + ' · ' + BRL(pr.valor_total) + (pr.enviada_em ? ' · enviada ' + esc(dataBR(pr.enviada_em)) : '')
    + '</p>'
    + '<div class="secTit" style="margin-top:0">O que o cliente respondeu</div>'
    + '<div class="grelha apTipos">'
    + ['aprovado_total','reprovado'].map(v =>
        '<label class="chk"><input type="radio" name="apTipo" value="' + v + '"'
        + (v === tipoInicial ? ' checked' : '') + '> ' + seloAprov(v) + '</label>').join('')
    + '</div>'
    + '<p class="nota" style="margin:-2px 0 14px">Aprovou só uma parte? Registre a revisão da proposta '
    + 'com o que ficou e responda <b>Aprovado</b> nela.</p>'
    + (ordenados.length
        ? '<div class="campo"><label for="apCt">Quem respondeu</label><select id="apCt">'
          + ordenados.map(x => '<option value="' + esc(x.id) + '">' + esc(x.nome)
              + ((x.papeis||[]).includes('aprova') ? ' · aprova propostas' : '')
              + '</option>').join('') + '</select></div>'
        : '<div class="aviso"><b>Este cliente não tem contato cadastrado.</b> A resposta '
          + 'precisa ter um nome — cadastre o contato em Cadastros → Clientes antes.</div>')
    + '<div class="dupla">'
    +  '<div class="campo"><label for="apCanal">Por onde</label><select id="apCanal">'
    +   ['email','whatsapp','telefone','presencial','outro'].map(k =>
         '<option value="' + k + '">' + ({email:'E-mail',whatsapp:'WhatsApp',
           telefone:'Telefone',presencial:'Presencial',outro:'Outro'})[k] + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="apData">Quando</label><input id="apData" type="date" value="'
    +   isoHoje() + '"></div></div>'
    + '<div id="apParcial"></div>'
    + '<div class="campo"><label for="apEv">Link da evidência (opcional)</label>'
    + '<input id="apEv" type="text" placeholder="E-mail, pedido de compra, print no Drive…"'
    + ' autocomplete="off" name="apev_nofill"></div>'
    + '<div class="campo"><label for="apObs">Observação (opcional)</label>'
    + '<input id="apObs" type="text" autocomplete="off" name="apobs_nofill"></div>'
    + '<p class="nota">Contato, canal e data são obrigatórios de propósito. É o que '
    + 'transforma “o cliente aprovou” em algo que se confere daqui a seis meses.</p>';

  abrirModal('Resposta do cliente · ' + (ctx.numero || ''), corpo,
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Registrar resposta', pri:true, onClick: async () => {
        const tipo = (document.querySelector('input[name="apTipo"]:checked')||{}).value;
        if (!tipo){ toast('Marque o que o cliente respondeu.','err'); return; }
        const ct = (document.getElementById('apCt')||{}).value;
        if (!ct){ toast('A resposta precisa ter um contato. Cadastre um antes.','err'); return; }
        const data = (document.getElementById('apData')||{}).value;
        if (!data){ toast('Informe a data da resposta.','err'); return; }

        let motivo = null;
        if (tipo === 'reprovado'){
          motivo = (document.getElementById('apMot')||{}).value;
          if (!motivo){ toast('Escolha o motivo da perda.','err'); return; }
        }
        try{
          const r = await rpc('tf_aprovar_proposta', { p_proposta_id: pr.id, p_tipo: tipo,
            p_contato_id: ct, p_canal: document.getElementById('apCanal').value,
            p_decidido_em: data, p_itens_aprovados: null,
            p_motivo_perda: motivo,
            p_evidencia_url: (document.getElementById('apEv')||{}).value.trim() || null,
            p_observacao: (document.getElementById('apObs')||{}).value.trim() || null });
          fecharModal();
          // "o card andou" só é verdade quando andou. A função devolve o que
          // aconteceu com o pipeline; sem OS ainda, nada andou — a OS nasce
          // depois, a partir da proposta aprovada.
          toast(r && r.pipeline === 'movido'
            ? 'Resposta registrada. O card andou.'
            : 'Resposta registrada.', 'ok');
          // Mesmo motivo do registro de envio: vindo da gaveta do NEGÓCIO,
          // `carregar()` recarrega os cards de OS e o quadro comercial fica
          // como estava — parado na coluna anterior à resposta que acabou de
          // ser registrada.
          if (ctx && ctx.negocio_id){
            await pintarComercial();
            const n = (negocios || []).find(x => x.id === ctx.negocio_id);
            if (n){ abaNeg = 'proposta'; abrirNegocio(n); }
          } else {
            await carregar();
            fecharDrawer();
          }
        }catch(e){ toast(e.message,'err'); }
     }}]);

  // ── o motivo só aparece para "Não aprovado" ──
  // S29: a escolha item a item ("o que o cliente aprovou") saiu junto com a
  // opção "em parte". "Aprovado" aprova todos os itens da proposta; "Não
  // aprovado" marca todos como perdidos, com este motivo.
  const pintarMotivo = () => {
    const tipo = (document.querySelector('input[name="apTipo"]:checked')||{}).value;
    const alvo = document.getElementById('apParcial');
    if (!alvo) return;
    if (tipo !== 'reprovado'){ alvo.innerHTML = ''; return; }
    alvo.innerHTML =
        '<div class="campo"><label for="apMot">Motivo da perda</label>'
      + '<select id="apMot"><option value="">— escolha —</option>' + motivos.map(m =>
          '<option value="' + esc(m.id) + '">' + esc(m.nome) + '</option>').join('')
      + '</select></div>';
  };
  document.querySelectorAll('input[name="apTipo"]').forEach(r =>
    r.addEventListener('change', pintarMotivo));
  pintarMotivo();
}

// ── REGISTRAR O ENVIO DA PROPOSTA ───────────────────────────────────────────
// É o passo que faltava para o quadro comercial andar. Exige contato e canal
// de propósito: "enviada" sem dizer para quem e por onde é o mesmo buraco do
// TapControl, onde o responsável era a string 'ADM' e não havia evidência de
// nada. Daqui também sai o relógio do follow-up ("11 dias sem resposta").
// `ctx` em vez do card da OS: desde o S20 a proposta pode viver só no negócio,
// e o formulário é o mesmo. O que ele precisa saber é de qual CLIENTE são os
// contatos — não de qual OS.
function modalEnvioProposta(ctx, pr){
  abrirModal('Registrar envio de ' + rotuloProposta(pr.numero, pr.versao),
      '<p class="nota">Isto não envia nada — registra que VOCÊ enviou, para o '
    + 'quadro comercial andar e o follow-up começar a contar.</p>'
    + '<div class="campo"><label for="epC">Para quem</label>'
    + '<select id="epC"><option value="">carregando…</option></select></div>'
    + '<div class="campo"><label for="epK">Por onde</label><select id="epK">'
    +   ['email','whatsapp','telefone','presencial','outro'].map(k =>
        '<option value="' + k + '">' + ({email:'E-mail',whatsapp:'WhatsApp',
          telefone:'Telefone',presencial:'Presencial',outro:'Outro'})[k] + '</option>').join('')
    + '</select></div>'
    + '<div class="campo"><label for="epD">Quando</label><input id="epD" type="date" value="'
    +   isoHoje() + '"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Registrar envio', pri:true, onClick: async () => {
        const ct = document.getElementById('epC').value;
        if (!ct){ toast('Escolha para quem a proposta foi.','err'); return; }
        try{
          await rpc('tf_registrar_envio_proposta', { p_proposta_id: pr.id,
            p_contato_id: ct, p_canal: document.getElementById('epK').value,
            p_quando: document.getElementById('epD').value || null });
          fecharModal(); toast('Envio registrado.','ok');
          // ⚠ Este modal é chamado de DOIS lugares: da aba Proposta da OS e da
          //   gaveta do NEGÓCIO. Até o S22 ele repintava sempre a aba da OS e
          //   recarregava só os cards de OS — então, vindo do negócio, a pessoa
          //   registrava o envio, lia "Envio registrado" e via o card parado em
          //   "Em conferência" até apertar Atualizar. O quadro mentia justo no
          //   passo em que ele deveria andar.
          if (ctx && ctx.negocio_id){
            await pintarComercial();
            const n = (negocios || []).find(x => x.id === ctx.negocio_id);
            if (n){ abaNeg = 'proposta'; abrirNegocio(n); }
          } else {
            pintarProposta(); carregar({silencioso:true});
          }
        }catch(e){ toast(e.message,'err'); }
     }}]);

  // os contatos chegam depois; o modal já está na tela
  get('contatos?select=id,nome,email,telefone&cliente_id=eq.' + ctx.cliente_id
      + '&ativo=eq.true&order=nome').then(cts => {
    const sel = document.getElementById('epC');
    if (!sel) return;
    if (!cts || !cts.length){
      sel.innerHTML = '<option value="">— este cliente não tem contato cadastrado —</option>';
      return;
    }
    sel.innerHTML = cts.map(x => '<option value="' + esc(x.id) + '">' + esc(x.nome)
      + (x.email || x.telefone ? ' · ' + esc(x.email || x.telefone) : '') + '</option>').join('');
  }).catch(e => {
    const sel = document.getElementById('epC');
    if (sel) sel.innerHTML = '<option value="">não deu para carregar os contatos</option>';
  });
}

async function pintarProposta(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  document.getElementById('dAcoes').innerHTML = '';
  body.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando…</p>';

  let props = [], falhouProp = null;
  try{
    props = DEMO ? (demoPropostas(card.os_id) || [])
      : await get('v_propostas?select=*&os_id=eq.' + card.os_id + '&order=versao.desc');
  }catch(e){
    // "não consegui ler" ≠ "não existe". Sem esta distinção, alguém emite a
    // segunda proposta achando que a primeira nunca saiu.
    falhouProp = e.message;
  }

  body.innerHTML = '';
  if (falhouProp){
    const w = document.createElement('div');
    w.className = 'vazio2'; w.style.cssText = 'padding:18px 10px;text-align:left';
    w.innerHTML = '<b>Não deu para ler as propostas desta OS</b><p class="mt"></p>';
    w.querySelector('.mt').textContent = falhouProp
      + ' — pode existir proposta emitida que não está aparecendo aqui.';
    body.appendChild(w);
  }
  if (props.length){
    const w = document.createElement('div'); w.style.marginBottom = '18px';
    w.innerHTML = '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
      + '<th>Número</th><th>Status</th><th>Valor</th><th>Parada</th><th></th>'
      + '</tr></thead><tbody></tbody></table></div>';
    const tb = w.querySelector('tbody');
    props.forEach(pr => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="mono n"></td><td class="s"></td>'
                   + '<td class="num t"></td><td class="num d"></td>';
      // ITEM 4 (S29): até o S28 esta coluna mostrava o número PURO, e a
      // revisão só aparecia na coluna "V." (o contador interno: 2 = Rev. 01)
      tr.querySelector('.n').textContent = rotuloProposta(pr.numero, pr.versao);
      tr.querySelector('.s').textContent = pr.status;
      tr.querySelector('.t').textContent = BRL(pr.valor_total);
      tr.querySelector('.d').textContent = pr.dias_sem_resposta != null ? pr.dias_sem_resposta + 'd' : '—';
      // ── registrar o envio ──
      // `tf_registrar_envio_proposta` existe no banco desde o 05_propostas e
      // NENHUMA tela a chamava. Consequência: `propostas.enviada_em` ficava
      // sempre nulo, e como a coluna "Proposta enviada" do quadro comercial é
      // derivada dele, ela NUNCA enchia — nem ela nem as depois dela. O quadro
      // parecia ter cinco colunas e parar ali. Foi a auditoria inversa desta
      // rodada (coluna que o banco tem e nenhuma tela lê) que apontou.
      const td = document.createElement('td');
      td.className = 'acoesPropTd';
      const pilha = document.createElement('div');   // ITEM 5 (S29): mesma largura, empilhados
      pilha.className = 'acoesProp';
      if (pr.status === 'emitida' && !DEMO){
        const b = document.createElement('button');
        b.className = 'btn mini'; b.type = 'button'; b.textContent = 'Registrar envio';
        b.addEventListener('click', () => modalEnvioProposta(
          { os_id: card.os_id, cliente_id: card.cliente_id, numero: card.numero }, pr));
        pilha.appendChild(b);
      }
      // A segunda porta para o formulário de aprovação. A primeira são os
      // botões da tarefa "Cliente aprovou?"; esta serve a quem está olhando a
      // proposta e não o quadro — e a quem precisa registrar a resposta antes
      // de o card chegar naquela etapa.
      if ((pr.status === 'emitida' || pr.status === 'enviada') && !DEMO){
        const b2 = document.createElement('button');
        b2.className = 'btn mini pri'; b2.type = 'button'; b2.textContent = 'Resposta do cliente';
        b2.addEventListener('click', () => modalAprovacao(
          { os_id: card.os_id, cliente_id: card.cliente_id, numero: card.numero }, null));
        pilha.appendChild(b2);
      }
      if (pilha.children.length) td.appendChild(pilha);
      else if (pr.decisao){
        td.innerHTML = seloAprov(pr.decisao);
      } else {
        td.className = 'nota';
        td.style.whiteSpace = 'nowrap';
        td.textContent = pr.enviada_em ? 'enviada ' + dataBR(pr.enviada_em) : '';
      }
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    body.appendChild(w);
  }

  // ── gerar a proposta aqui dentro ──
  const g = document.createElement('div');
  g.style.cssText = 'border:1px solid var(--rule);border-radius:6px;padding:15px;margin-bottom:20px';
  g.innerHTML = '<p class="dica" style="margin:0">Carregando os modelos…</p>';
  body.appendChild(g);
  montarGerador(g, props).catch(e => { g.innerHTML = '<p class="dica"></p>';
    g.querySelector('p').textContent = 'Gerador indisponível: ' + e.message; });

  const f = document.createElement('div');
  f.style.cssText = 'border-top:1px solid var(--rule-2);padding-top:18px';
  f.innerHTML =
    '<h3 style="font-size:15px;margin:0 0 4px">Registrar proposta feita fora</h3>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.5">' +
      'Para a proposta que não saiu daqui — só o número entra, e é esse registro ' +
      'que fecha a etapa e move o card.</p>' +
    '<div class="campo"><label for="pN">Número da proposta</label>' +
      '<input id="pN" type="text" placeholder="deixe vazio para o TapFlow numerar">' +
      '<div class="dica">Vazio, sai o próximo número do ano (' +
      'ex.: <span class="mono">' + esc(new Date().getFullYear().toString().slice(2)) +
      '001</span>). Preenchido com um número que já existe nesta OS, entra como ' +
      '<b>revisão</b> dele.</div></div>' +
    '<div class="dupla">' +
      '<div class="campo"><label for="pV">Valor total</label>' +
        '<input id="pV" type="number" step="0.01" min="0" inputmode="decimal" placeholder="deixe vazio p/ usar o da OS"></div>' +
      '<div class="campo"><label for="pD">Validade</label><input id="pD" type="date"></div>' +
    '</div>' +
    '<div class="campo"><label for="pF">PDF da proposta</label>' +
      '<input id="pF" type="file" accept="application/pdf">' +
      '<div class="dica" id="pFd"></div></div>' +
    '<button class="btn pri" id="pOk" style="width:100%;padding:11px">Registrar e mover o card</button>';
  body.appendChild(f);

  const dicaF = document.getElementById('pFd');
  dicaF.textContent = driveLigado()
    ? 'O arquivo vai para o Drive da Engetap, na pasta do cliente e da OS.'
    : 'O Google Drive ainda não foi configurado — dá para registrar o número sem o arquivo.';
  document.getElementById('pF').disabled = !driveLigado();

  const d = new Date(); d.setDate(d.getDate() + 15);
  document.getElementById('pD').value = isoHoje(d);

  document.getElementById('pOk').addEventListener('click', async () => {
    let num = document.getElementById('pN').value.trim();
    const b = document.getElementById('pOk'); b.disabled = true;
    const arq = (document.getElementById('pF').files || [])[0];
    try{
      // O número tem que existir ANTES do upload: é ele que nomeia o arquivo no
      // Drive. Reservar aqui pode deixar um buraco na sequência se o Drive
      // recusar depois — e buraco na sequência é doutrina antiga deste projeto
      // (13_exclusoes), preferível a um arquivo com nome que não bate.
      if (!num && !DEMO){ b.textContent = 'Reservando o número…';
        num = await rpc('tf_reservar_numero_proposta', { p_os_id: card.os_id }); }
      if (!num) num = '26099';
      // O arquivo sobe ANTES do registro: se o Drive recusar, nada é gravado e
      // o número continua livre para tentar de novo. O contrário deixaria uma
      // proposta registrada apontando para um PDF que não existe.
      let url = null;
      if (arq){
        if (arq.size > 18 * 1024 * 1024) throw new Error('PDF acima de 18 MB — comprima antes de subir.');
        b.textContent = 'Enviando o PDF…';
        const j = await subirArquivo(await arquivoParaBase64(arq), {
          os_id: card.os_id, cliente: card.cliente, os_numero: card.numero,
          categoria: 'proposta', nome: num + '.pdf', mime: 'application/pdf',
          client_uid: 'prop-' + card.os_id + '-' + num
        });
        url = j.url;
        b.textContent = 'Registrando…';
      }
      if (DEMO) demoProposta(card.os_id, num);
      else await rpc('tf_registrar_proposta_externa', {
        p_os_id: card.os_id, p_numero: num || null,
        p_valor_total: document.getElementById('pV').value ? Number(document.getElementById('pV').value) : null,
        p_validade: document.getElementById('pD').value || null,
        p_arquivo_url: url
      });
      const antes = card.coluna;
      await carregar({silencioso:true});
      const novo = cards.find(x => x.os_id === card.os_id);
      if (novo){ osAberta.card = novo;
        toast(novo.coluna !== antes ? 'Registrada — o card foi para "' + rotuloCol(novo) + '".' : 'Proposta registrada.', 'ok');
      } else toast('Proposta registrada.','ok');
      pintarProposta();
    }catch(e){ toast(e.message,'err'); b.disabled = false; b.textContent = 'Registrar e mover o card'; }
  });
}

};

async function pintarArquivos(){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  document.getElementById('dAcoes').innerHTML = '';
  body.innerHTML = '<p style="color:var(--ink-3);font-size:13px">Carregando…</p>';

  let anexos = [], falhouAnx = null;
  try{
    anexos = DEMO ? (demoAnexos(card.os_id) || [])
      : await get('anexos?select=id,categoria,nome,drive_url,criado_em,bytes'
                  + '&os_id=eq.' + card.os_id + '&ativo=eq.true&order=criado_em.desc');
  }catch(e){ falhouAnx = e.message; }

  body.innerHTML = '';

  // ── gerar PDF ──
  const g = document.createElement('div');
  g.innerHTML =
    '<h3 style="font-size:15px;margin:0 0 4px">Gerar documento</h3>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0 0 12px;line-height:1.5">' +
      'O PDF é montado aqui e guardado no Drive, na pasta desta OS.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" id="gLev" style="flex:1;min-width:150px;padding:10px">Levantamento (sem valores)</button>' +
      '<button class="btn" id="gRes" style="flex:1;min-width:150px;padding:10px">Resumo interno (com margem)</button>' +
    '</div>' +
    '<p style="font-size:12px;color:var(--ink-3);margin:9px 0 20px;line-height:1.45">' +
      'O <b>levantamento</b> é o que se mostra à planta: lista de acessórios, sem preço. ' +
      'O <b>resumo interno</b> traz custo, preço e margem — não é para sair da empresa.</p>';
  body.appendChild(g);

  const gerar = async (tipo, btn) => {
    const rotulo = btn.textContent;
    btn.disabled = true; btn.textContent = 'Montando…';
    try{
      const itens = DEMO ? demoItens(card.os_id)
        : await get('os_itens?select=descricao,quantidade,elegivel,custo_unitario,preco_unitario,'
            + 'total_custo,total_venda,requer_calibracao,requer_lacre'
            + '&os_id=eq.' + card.os_id + '&order=ordem');
      if (!itens.length) throw new Error('Esta OS ainda não tem itens.');
      const { blob, nome } = await gerarPDF(tipo, card, itens);
      btn.textContent = 'Enviando…';
      await subirArquivo(blob, {
        os_id: card.os_id, cliente: card.cliente, os_numero: card.numero,
        categoria: 'relatorio', nome, mime: 'application/pdf',
        client_uid: 'pdf-' + card.os_id + '-' + tipo + '-' + Date.now()
      });
      toast('PDF gerado e guardado no Drive.', 'ok');
      pintarArquivos();
    }catch(e){ toast(e.message, 'err'); btn.disabled = false; btn.textContent = rotulo; }
  };
  document.getElementById('gLev').addEventListener('click', e => gerar('levantamento', e.target));
  document.getElementById('gRes').addEventListener('click', e => gerar('resumo', e.target));

  // ── lista do que já está no Drive ──
  const h = document.createElement('div');
  h.style.cssText = 'font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;'
                  + 'color:var(--ink-3);margin:0 0 8px';
  h.textContent = 'No Drive';
  body.appendChild(h);

  if (!anexos.length){
    const p2 = document.createElement('p');
    p2.style.cssText = 'font-size:13px;margin:0;line-height:1.5;color:'
      + (falhouAnx ? 'var(--crit)' : 'var(--ink-3)');
    // pasta que parece vazia porque a leitura falhou é pior do que pasta vazia:
    // a pessoa reenvia a foto que já estava lá
    p2.textContent = falhouAnx
      ? 'Não deu para listar os arquivos: ' + falhouAnx
        + ' — pode haver arquivo no Drive que não está aparecendo aqui.'
      : (driveLigado()
        ? 'Nada ainda. As fotos do campo e os PDFs aparecem aqui assim que subirem.'
        : 'O Google Drive ainda não foi configurado — veja o Passo 8 do guia de instalação.');
    body.appendChild(p2);
    return;
  }

  anexos.forEach(a => {
    const r = document.createElement('div');
    r.style.cssText = 'display:flex;gap:10px;align-items:baseline;padding:8px 0;'
                    + 'border-bottom:1px solid var(--rule-2);font-size:13.5px';
    r.innerHTML = '<span class="chip" style="flex:0 0 auto"></span>'
      + '<a target="_blank" rel="noopener" style="flex:1;min-width:0;overflow:hidden;'
      + 'text-overflow:ellipsis;white-space:nowrap"></a>'
      + '<span style="flex:0 0 auto;font-size:11.5px;color:var(--ink-3)"></span>';
    r.querySelector('.chip').textContent = CAT_ROTULO[a.categoria] || a.categoria;
    const link = r.querySelector('a');
    link.textContent = a.nome; link.href = a.drive_url || '#';
    r.querySelector('span:last-child').textContent = dataBR(a.criado_em);
    body.appendChild(r);
  });
}

let _focoAntesDoModal = null;
function abrirModal(titulo, corpoHtml, botoes){
  _focoAntesDoModal = document.activeElement;
  document.getElementById('mTit').textContent = titulo;
  document.getElementById('mBody').innerHTML = corpoHtml;
  const f = document.getElementById('mFoot'); f.innerHTML = '';
  (botoes||[]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.pri ? ' pri' : '');
    el.textContent = b.label;
    // toda ação de modal passa pela trava de duplo envio: modal é onde se grava
    el.addEventListener('click', () => _semDuploEnvio_(el, () => b.onClick(el)));
    f.appendChild(el);
  });
  document.getElementById('mScrim').hidden = false;
  document.getElementById('modal').hidden = false;
  // foco no primeiro campo: quem chega de teclado não deveria ter que caçar
  requestAnimationFrame(() => {
    const alvo = document.querySelector('#mBody input,#mBody select,#mBody textarea')
              || document.querySelector('#mFoot .btn');
    if (alvo) alvo.focus();
  });
}
/** Um `abrirModal` que devolve sim/não — para a confirmação que não grava
    nada por conta própria, só responde. Existe porque `confirm()` do
    navegador não se estiliza, não fecha com ESC pela nossa pilha e some atrás
    de outro modal. */
function confirmar(titulo, corpoHtml, rotuloSim, perigo){
  return new Promise(ok => {
    abrirModal(titulo, corpoHtml, [
      { label:'Cancelar', onClick: () => { fecharModal(); ok(false); } },
      { label: rotuloSim || 'Confirmar', pri: !perigo,
        onClick: () => { fecharModal(); ok(true); } }
    ]);
  });
}

function fecharModal(){
  document.getElementById('mScrim').hidden = true;
  document.getElementById('modal').hidden = true;
  // devolve o foco a quem abriu — sem isto ele volta para o começo da página
  if (_focoAntesDoModal && document.body.contains(_focoAntesDoModal)){
    try{ _focoAntesDoModal.focus(); }catch(e){}
  }
  _focoAntesDoModal = null;
}

async function modalNovaOS(){
  let clientes = [];
  try{ clientes = DEMO ? demoClientes() : await get('clientes?select=id,razao_social,nome_fantasia&ativo=eq.true&order=razao_social'); }
  catch(e){ toast(e.message,'err'); return; }
  if (!clientes.length){
    toast('Cadastre um cliente antes de abrir OS.','err');
    irPara('cad');
    return;
  }
  // O TIPO decide o checklist inteiro: fornecimento e inspeção têm fluxos
  // diferentes, e o pipeline é copiado do template na hora da abertura. Com um
  // tipo só, o campo não precisava existir; com dois, escolher errado significa
  // uma OS inteira com o roteiro do outro serviço.
  let tipos = [];
  try{ tipos = DEMO ? demoTipos() : await get('tipos_os?select=id,nome&ativo=eq.true&order=nome'); }
  catch(e){ tipos = []; }
  if (!tipos.length) tipos = [{ id:'FORNECIMENTO', nome:'Fornecimento de acessórios NR-13' }];

  abrirModal('Nova ordem de serviço',
    '<div class="campo"><label for="oC">Cliente</label><select id="oC">' +
      clientes.map(c => '<option value="'+c.id+'">'+esc(nomeCliente(c))+'</option>').join('') +
    '</select></div>' +
    (tipos.length > 1
      ? '<div class="campo"><label for="oT">Tipo de serviço</label><select id="oT">' +
          tipos.map(t => '<option value="'+esc(t.id)+'">'+esc(t.nome)+'</option>').join('') +
        '</select></div>'
      : '') +
    '<div class="campo"><label for="oD">Descrição</label>' +
      '<input id="oD" type="text" placeholder="ex.: Acessórios NR-13 — parada anual"></div>' +
    '<div class="campo"><label for="oP">Data prevista (opcional)</label><input id="oP" type="date"></div>' +
    '<div class="campo"><label for="oPr">Prioridade</label><select id="oPr">' +
      '<option value="normal">Normal</option>' +
      '<option value="alta">Alta — sobe no desempate</option>' +
      '<option value="urgente">Urgente — passa na frente de todas</option>' +
    '</select></div>' +
    '<p style="font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.5">' +
      'O número é gerado automaticamente e o checklist do tipo escolhido já nasce ' +
      'junto. O fornecimento começa no campo, esperando um inspetor aceitar; a ' +
      'inspeção NR-13 começa no administrativo, com as duas perguntas de escopo.<br>' +
      'Sem data prevista, o prazo vem da meta do tipo de OS. <b>Urgente é o único ' +
      'nível que fura a fila</b> — use pouco, senão ele deixa de significar alguma coisa.</p>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Abrir OS', pri:true, onClick: async (btn) => {
        // o disabled e o texto "Processando…" agora são do _semDuploEnvio_
        try{
          const r = DEMO
            ? demoNovaOS(document.getElementById('oC').value, document.getElementById('oD').value,
                         (document.getElementById('oT')||{}).value || 'FORNECIMENTO',
                         document.getElementById('oP').value || null,
                         document.getElementById('oPr').value)
            : await rpc('tf_abrir_os', {
                p_cliente_id: document.getElementById('oC').value,
                p_tipo_os_id: (document.getElementById('oT')||{}).value || 'FORNECIMENTO',
                p_descricao: document.getElementById('oD').value.trim() || null,
                p_data_prevista: document.getElementById('oP').value || null,
                p_client_uid: 'os-' + Date.now() + '-' + Math.random().toString(36).slice(2,8)
              });
          // A prioridade é um ato separado, e de propósito: ela fica registrada
          // em `eventos` com quem decidiu e quando. Daqui a três meses, "sempre
          // foi urgente" precisa ter dono.
          const pr = document.getElementById('oPr').value;
          if (!DEMO && pr && pr !== 'normal' && r && r.os_id){
            try{ await rpc('tf_definir_prioridade', { p_os_id: r.os_id, p_prioridade: pr }); }
            catch(e){ toast('OS aberta, mas a prioridade não gravou: ' + e.message, 'err'); }
          }
          fecharModal();
          toast('OS ' + r.numero + ' aberta.', 'ok');
          await carregar();
          // Vai para o quadro onde a OS NASCEU, não para um fixo. Até o S24 era
          // sempre 'campo' — e a inspeção nasce na Administrativa. Com o
          // fornecimento no quadro próprio (S25), as duas nasceriam longe da tela.
          irPara(visaoDoCard(cards.find(c => c.os_id === (r && r.os_id))));
        }catch(e){ toast(e.message,'err'); }
     }}]);
}

// CUSTOS E COTAÇÕES — a aba que mostra para onde foi a margem
// ----------------------------------------------------------------------------
// Frete NÃO é item da proposta. Item é o que o cliente compra; frete é o que
// custa entregar. Aqui ele aparece como custo da OS: reduz a margem, entra no
// resumo interno, e não aparece no documento que vai ao cliente.
// ════════════════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════════════════
// PEDIDO DE COMPRA — um por fornecedor
// ----------------------------------------------------------------------------
// Uma OS quase sempre compra de mais de um lugar: o manômetro na Wika, a
// válvula na Famabras, o purgador na Proper. Cada um recebe o SEU pedido, com
// os SEUS itens e o SEU prazo. Emitir um pedido só, com tudo dentro, era o
// defeito que estava aqui antes — e o fornecedor receberia peça que não vende.
//
// A escolha de quem fornece já foi feita na cotação, item a item. Esta tela só
// agrupa o resultado e emite.
// ════════════════════════════════════════════════════════════════════════════

/** O PDF que vai para o fornecedor. Sem preço de venda e sem margem: o que ele
 *  precisa é descrição, quantidade e para onde entregar. */
async function gerarPDFPedido({ numero, fornecedor, card, itens, obs, prazo }){
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const M = 15;
  let y = M;

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('ENGETAP ENGENHARIA', M, y); y += 6;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
  doc.text('Pedido de compra ' + numero, M, y); y += 8;
  doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 7;

  doc.setFontSize(10);
  const linha = (k, v) => { doc.setFont('helvetica','bold'); doc.text(k, M, y);
    doc.setFont('helvetica','normal'); doc.text(String(v||'—'), M+34, y); y += 5.5; };
  linha('Fornecedor:', fornecedor);
  linha('Emitido em:', dataBR());
  if (prazo) linha('Entrega prevista:', prazo);
  linha('Nossa OS:', card.numero);
  linha('Destino:', 'Engetap Engenharia · Divinópolis/MG');
  y += 4;

  const cols = [{t:'Item',x:M,w:104},{t:'Qtd',x:M+108,w:12,r:1},
                {t:'Unitário',x:M+128,w:22,r:1},{t:'Total',x:M+156,w:24,r:1}];
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  cols.forEach(c => doc.text(c.t, c.r ? c.x + c.w : c.x, y, c.r ? {align:'right'} : undefined));
  y += 2; doc.setDrawColor(210); doc.line(M, y, 210-M, y); y += 4.5;

  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  let total = 0;
  itens.forEach(it => {
    if (y > 258){ doc.addPage(); y = M; }
    const q = Number(it.quantidade) || 0;
    const u = Number(it.custo_unitario) || 0;
    total += q * u;
    const nome = doc.splitTextToSize(String(it.descricao||''), cols[0].w).slice(0, 2);
    doc.text(nome, cols[0].x, y);
    doc.text(String(q), cols[1].x + cols[1].w, y, {align:'right'});
    doc.text(u ? BRL(u) : '—', cols[2].x + cols[2].w, y, {align:'right'});
    doc.text(u ? BRL(q*u) : '—', cols[3].x + cols[3].w, y, {align:'right'});
    y += 5.4 + (nome.length - 1) * 4.2;
  });

  y += 2; doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 6;
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Total do pedido:', M, y);
  doc.text(total ? BRL(total) : 'a combinar', M+70, y, {align:'right'}); y += 9;

  if (obs){
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    const t = doc.splitTextToSize('Observações: ' + obs, 180);
    doc.text(t, M, y); y += t.length * 4.4 + 4;
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120);
  doc.text('Confirme o recebimento deste pedido e o prazo de entrega.', M, y);

  return { blob: doc.output('datauristring'), nome: numero + ' - ' + nomeSeguro(fornecedor) + '.pdf' };
}

/** Bloco "Pedidos de compra" dentro da aba Custos. */
async function montarPedidos(caixa){
  const { card } = osAberta;
  caixa.innerHTML = '<p class="nota">Carregando os pedidos…</p>';

  let pend = [], feitos = [];
  try{
    [pend, feitos] = DEMO ? [demoPedPend(), demoPedFeitos()]
      : await Promise.all([
          get('v_pedidos_pendentes?select=*&os_id=eq.' + card.os_id + '&order=fornecedor'),
          get('v_pedidos_compra?select=*&os_id=eq.' + card.os_id + '&order=numero')
        ]);
  }catch(e){ caixa.innerHTML = '<p class="nota"></p>';
             caixa.querySelector('p').textContent = 'Não consegui ler os pedidos: ' + e.message; return; }

  caixa.innerHTML = '<div class="secTit" style="margin-top:0">Pedidos de compra</div>';

  if (!pend.length && !feitos.length){
    caixa.insertAdjacentHTML('beforeend',
      '<p class="nota">Nada a pedir nesta OS. Itens entram aqui quando a origem é ' +
      '“comprar” e o cliente aprovou.</p>');
    return;
  }

  // ── o que falta pedir ──
  pend.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pedBox' + (p.sem_fornecedor ? ' semforn' : '');
    d.innerHTML =
      '<div class="pedTopo"><b class="f"></b><span class="q"></span></div>' +
      '<div class="pedSub"></div>' +
      (p.sem_fornecedor
        ? '<p class="nota" style="margin:8px 0 0;color:var(--warn)">Estes itens ainda não têm ' +
          'fornecedor escolhido. Decida a cotação antes de emitir — pedido sem fornecedor ' +
          'não tem para quem ir.</p>'
        : '<button class="btn sm" type="button">Emitir pedido</button>');
    d.querySelector('.f').textContent = p.fornecedor;
    d.querySelector('.q').textContent = p.itens + ' item(ns) · ' + BRL(p.custo);
    d.querySelector('.pedSub').textContent =
      (p.pecas ? Number(p.pecas) + ' peça(s)' : '') +
      (p.maior_prazo ? ' · prazo de ' + p.maior_prazo + ' dias' : ' · sem prazo informado');
    caixa.appendChild(d);
    const b = d.querySelector('button');
    if (b) b.addEventListener('click', () => emitirPedido(p, caixa));
  });

  // ── os já emitidos ──
  if (feitos.length){
    const h = document.createElement('div');
    h.className = 'nota'; h.style.cssText = 'margin:14px 0 6px;font-weight:600';
    h.textContent = 'Emitidos';
    caixa.appendChild(h);
    feitos.forEach(p => {
      const d = document.createElement('div');
      d.className = 'pedFeito';
      d.innerHTML = '<span class="n mono"></span><span class="f"></span>' +
                    '<span class="v num"></span><span class="s"></span>';
      d.querySelector('.n').textContent = p.numero;
      d.querySelector('.f').textContent = p.fornecedor || '—';
      d.querySelector('.v').textContent = BRL(p.valor);
      d.querySelector('.s').textContent = p.recebidos >= p.itens && p.itens > 0
        ? 'recebido'
        : (p.previsto_para ? 'chega ' + dataBR(p.previsto_para) : 'sem previsão');
      caixa.appendChild(d);
    });
  }
}

async function emitirPedido(p, caixa){
  const { card } = osAberta;
  const body = document.getElementById('dBody');
  const antes = body.innerHTML;

  // ── conferência antes de emitir ──
  const cx = document.createElement('div');
  cx.className = 'painelPed';
  cx.innerHTML =
    '<div class="secTit" style="margin-top:0">Emitir pedido — ' + esc(p.fornecedor) + '</div>' +
    '<p class="nota" style="margin:0 0 12px">Vão neste pedido os ' + p.itens + ' item(ns) desta OS ' +
      'cotados com ' + esc(p.fornecedor) + '. Os outros fornecedores recebem pedidos separados.</p>' +
    '<div id="pdItens"></div>' +
    '<div class="campo"><label for="pdObs">Observação para o fornecedor</label>' +
      '<input id="pdObs" type="text" placeholder="opcional — ex.: entregar aos cuidados do Túlio"></div>' +
    '<button class="btn pri" id="pdOk" style="width:100%;padding:11px">Emitir e baixar o PDF</button>' +
    '<button class="btn" id="pdCa" style="width:100%;margin-top:8px">Voltar</button>' +
    '<div class="nota" id="pdMsg" style="margin-top:8px"></div>';
  body.innerHTML = ''; body.appendChild(cx);

  let itens = [];
  try{
    itens = DEMO ? demoPedItens(p.fornecedor)
      : await get('os_itens?select=id,descricao,quantidade,custo_unitario,prazo_entrega_dias'
          + '&os_id=eq.' + card.os_id + '&aprovado=is.true&origem=eq.compra'
          + '&pedido_numero=is.null'
          + (p.sem_fornecedor ? '&fornecedor=is.null' : '&fornecedor=eq.' + encodeURIComponent(p.fornecedor))
          + '&order=descricao');
  }catch(e){ document.getElementById('pdMsg').textContent = e.message; }

  const el = document.getElementById('pdItens');
  el.innerHTML = '<div style="overflow-x:auto;margin:0 0 14px"><table class="tbl"><thead><tr>' +
    '<th>Item</th><th class="num">Qtd</th><th class="num">Unitário</th><th class="num">Total</th>' +
    '</tr></thead><tbody></tbody></table></div>';
  const tb = el.querySelector('tbody');
  let total = 0;
  itens.forEach(i => {
    const q = Number(i.quantidade)||0, u = Number(i.custo_unitario)||0;
    total += q*u;
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="d"></td><td class="num q"></td><td class="num u"></td><td class="num t"></td>';
    tr.querySelector('.d').textContent = i.descricao;
    tr.querySelector('.q').textContent = q;
    tr.querySelector('.u').textContent = u ? BRL(u) : '—';
    tr.querySelector('.t').textContent = u ? BRL(q*u) : '—';
    tb.appendChild(tr);
  });
  if (!itens.some(i => Number(i.custo_unitario) > 0)){
    el.insertAdjacentHTML('beforeend',
      '<p class="nota" style="color:var(--warn);margin:0 0 12px">Nenhum item tem custo lançado. ' +
      'O pedido sai sem valores — o fornecedor cota de novo, e você perde a referência da cotação.</p>');
  }

  document.getElementById('pdCa').addEventListener('click', () => { body.innerHTML = antes; pintarCustos(); });

  document.getElementById('pdOk').addEventListener('click', async () => {
    const b = document.getElementById('pdOk'), msg = document.getElementById('pdMsg');
    b.disabled = true; msg.style.color = ''; msg.textContent = 'Preparando…';
    try{
      // A biblioteca de PDF vem ANTES de emitir. Se ela não carregar — rede da
      // planta, CDN bloqueada — nada foi registrado e a pessoa tenta de novo.
      // Emitir primeiro deixaria um pedido no sistema sem o papel para enviar,
      // e o número já queimado.
      await carregarJsPDF();
      msg.textContent = 'Emitindo…';
      const r = DEMO
        ? { numero:'PC-2026-0099', fornecedor:p.fornecedor, itens:itens.length, valor:total }
        : await rpc('tf_emitir_pedido_compra', {
            p_os_id: card.os_id,
            p_fornecedor: p.sem_fornecedor ? null : p.fornecedor,
            p_itens: p.sem_fornecedor ? itens.map(i => i.id) : null,
            p_observacao: document.getElementById('pdObs').value.trim() || null
          });

      msg.textContent = 'Montando o PDF…';
      const prazo = p.maior_prazo
        ? dataBR(isoHoje(new Date(Date.now() + p.maior_prazo*86400000))) : null;
      const { blob, nome } = await gerarPDFPedido({
        numero: r.numero, fornecedor: p.fornecedor, card, itens,
        obs: document.getElementById('pdObs').value.trim(), prazo
      });

      // o PDF vai para o Drive quando ele estiver ligado; sempre baixa também,
      // porque quem manda para o fornecedor é a pessoa, do computador dela
      baixarDataUrl(blob, nome);
      if (!DEMO && driveLigado()){
        try{
          await subirArquivo(blob, { os_id: card.os_id, cliente: card.cliente,
            os_numero: card.numero, categoria: 'pedido_compra', nome,
            mime:'application/pdf', client_uid:'pc-' + r.numero });
        }catch(e){ /* o pedido já existe; o arquivo é o acessório */ }
      }

      const antesCol = card.coluna;
      if (!DEMO) await carregar({silencioso:true});
      const novo = cards.find(x => x.os_id === card.os_id);
      if (novo) osAberta.card = novo;

      toast(r.numero + ' emitido para ' + p.fornecedor + '.', 'ok');
      _msgPedido = r.numero + ' emitido — ' + r.itens + ' item(ns), ' + BRL(r.valor) + '.'
        + (novo && novo.coluna !== antesCol ? ' O card foi para "' + rotuloCol(novo) + '".' : '');
      pintarCustos();
    }catch(e){
      msg.style.color = 'var(--crit)'; msg.textContent = e.message;
      b.disabled = false;
    }
  });
}

let _msgPedido = null;

function baixarDataUrl(dataUrl, nome){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => a.remove(), 3000);
}

async function pintarCustos(){
  const b = document.getElementById('dBody');
  const { card } = osAberta;
  b.innerHTML = '<p class="nota">Carregando…</p>';

  let m = null, custos = [], cots = [], itens = [];
  try{
    if (DEMO){ m = demoMargem(); custos = demoCustos(); cots = demoCots(); itens = demoItens(card.os_id); }
    else {
      const [a,c,q,i] = await Promise.all([
        get('v_os_margem?select=*&os_id=eq.' + card.os_id),
        get('custos_os?select=*&os_id=eq.' + card.os_id + '&order=quando'),
        get('v_cotacoes?select=*&os_id=eq.' + card.os_id),
        get('os_itens?select=id,descricao,quantidade&os_id=eq.' + card.os_id + '&elegivel=is.true&order=descricao')
      ]);
      m = a[0]; custos = c; cots = q; itens = i;
    }
  }catch(e){ b.innerHTML=''; toast(e.message,'err'); return; }

  const bruta = Number((m&&m.margem_bruta)||0), real = Number((m&&m.margem_real)||0);
  const extras = Number((m&&m.custos_extras)||0);
  const some = bruta - real;

  b.innerHTML =
    '<div class="margemBox">'
    + '<div class="mg"><span>Venda</span><b>' + BRL((m&&m.venda)||0) + '</b></div>'
    + '<div class="mg"><span>Custo dos itens</span><b>' + BRL((m&&m.custo_itens)||0) + '</b></div>'
    + '<div class="mg"><span>Margem bruta</span><b>' + BRL(bruta) + '</b></div>'
    + '<div class="mg ' + (some > 0 ? 'perde' : '') + '"><span>Frete e outros</span><b>−'
    +   BRL(extras) + '</b></div>'
    + '<div class="mg final"><span>Margem real</span><b>' + BRL(real)
    +   ((m&&m.margem_pct) != null ? ' <i>' + m.margem_pct + '%</i>' : '') + '</b></div>'
    + '</div>'
    + (some > 0
        ? '<p class="nota aviso2">O que não é item comeu <b>' + BRL(some) + '</b> — '
          + ((m&&m.extras_pct)||0) + '% da venda. Este é o número que somia quando o frete '
          + 'ficava no WhatsApp.</p>'
        : '<p class="nota">Nenhum custo fora dos itens lançado ainda. Se houve frete ou '
          + 'deslocamento e ele não está aqui, a margem acima está otimista.</p>')

    + '<div class="secTit">Custos que não são item</div>'
    + '<div id="cuLista"></div>'
    + '<div class="grelha" style="margin-top:10px">'
    +  '<div class="campo"><label for="cuT">Tipo</label><select id="cuT">'
    +   [['frete','Frete'],['deslocamento','Deslocamento'],['hospedagem','Hospedagem'],
        ['terceiro','Serviço de terceiro'],['calibracao','Calibração'],['taxa','Taxa'],
        ['outro','Outro']].map(([v,l]) => '<option value="' + v + '">' + l + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="cuD">Descrição</label><input id="cuD" type="text" '
    +   'placeholder="ex.: entrega em Itaúna"></div>'
    +  '<div class="campo"><label for="cuF">Fornecedor</label><input id="cuF" type="text"></div>'
    +  '<div class="campo"><label for="cuV">Valor</label><input id="cuV" type="number" step="0.01"></div>'
    + '</div>'
    + '<button class="btn pri" id="cuAdd" style="width:100%">Lançar custo</button>'

    + '<div class="secTit">Cotações</div>'
    + '<p class="nota">A conversa continua no WhatsApp. O que fica aqui é a resposta: quem, '
    + 'quanto, prazo. <b>Compare pelo total</b> — o mais barato por peça nem sempre é o mais '
    + 'barato com frete.</p>'
    + '<div id="coLista"></div>'
    + '<div class="grelha" style="margin-top:10px">'
    +  '<div class="campo"><label for="coI">Item</label><select id="coI">'
    +   '<option value="">— cotação geral —</option>'
    +   itens.map(i => '<option value="' + i.id + '">' + esc(i.descricao).slice(0,44) + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="coF">Fornecedor</label><input id="coF" type="text"></div>'
    +  '<div class="campo"><label for="coV">Valor unitário</label><input id="coV" type="number" step="0.01"></div>'
    +  '<div class="campo"><label for="coFr">Frete</label><input id="coFr" type="number" step="0.01"></div>'
    +  '<div class="campo"><label for="coP">Prazo (dias)</label><input id="coP" type="number"></div>'
    +  '<div class="campo"><label for="coC">Canal</label><select id="coC">'
    +   ['whatsapp','telefone','email','presencial','site'].map(c =>
        '<option value="' + c + '">' + c + '</option>').join('') + '</select></div>'
    + '</div>'
    + '<button class="btn" id="coAdd" style="width:100%">Registrar cotação</button>';

  // custos lançados
  const CL = document.getElementById('cuLista');
  if (!custos.length) CL.innerHTML = '<p class="nota">Nada lançado.</p>';
  custos.forEach(c => {
    const el = document.createElement('div');
    el.className = 'linhaCusto';
    el.innerHTML = '<div><b></b><small></small></div><div class="vl"></div>'
      + '<button class="x" aria-label="Remover">×</button>';
    el.querySelector('b').textContent = c.descricao;
    el.querySelector('small').textContent = (c.fornecedor ? c.fornecedor + ' · ' : '')
      + new Date(c.quando+'T12:00').toLocaleDateString('pt-BR')
      + (c.realizado ? ' · realizado' : ' · previsto');
    el.querySelector('.vl').textContent = BRL(c.valor);
    el.querySelector('.x').addEventListener('click', async () => {
      if (!confirm('Remover "' + c.descricao + '"?')) return;
      try{
        if (!DEMO) await del('custos_os', 'id=eq.' + c.id);
        toast('Removido.','ok'); pintarCustos();
      }catch(e){ toast(e.message,'err'); }
    });
    CL.appendChild(el);
  });

  // cotações agrupadas por item
  const QL = document.getElementById('coLista');
  if (!cots.length) QL.innerHTML = '<p class="nota">Nenhuma cotação registrada.</p>';
  const porItem = {};
  cots.forEach(q => { (porItem[q.os_item_id || 'geral'] = porItem[q.os_item_id || 'geral'] || []).push(q); });
  Object.keys(porItem).forEach(k => {
    const g = porItem[k].slice().sort((a,b) => (a.total_estimado||0) - (b.total_estimado||0));
    const box = document.createElement('div');
    box.className = 'grupoCot';
    box.innerHTML = '<div class="gcTit"></div>';
    box.querySelector('.gcTit').textContent = g[0].item || 'Cotação geral';
    g.forEach((q, idx) => {
      const el = document.createElement('div');
      el.className = 'linhaCot' + (q.escolhida ? ' on' : '') + (q.vencida ? ' vencida' : '');
      el.innerHTML = '<div><b></b><small></small></div><div class="vl"></div>'
        + (q.os_item_id && !q.escolhida ? '<button class="btn mini">Escolher</button>' : '');
      el.querySelector('b').textContent = q.fornecedor
        + (idx === 0 && g.length > 1 ? '  ← menor total' : '');
      el.querySelector('small').textContent =
        BRL(q.valor_unitario) + ' un'
        + (Number(q.valor_frete) ? ' + ' + BRL(q.valor_frete) + ' frete' : '')
        + (q.prazo_dias ? ' · ' + q.prazo_dias + 'd' : '')
        + (q.vencida ? ' · VENCIDA' : '')
        + (q.escolhida ? ' · escolhida' : '');
      el.querySelector('.vl').textContent = BRL(q.total_estimado);
      const bt = el.querySelector('.btn');
      if (bt) bt.addEventListener('click', () => _semDuploEnvio_(bt, async () => {
        try{
          if (!DEMO) await rpc('tf_escolher_cotacao', { p_cotacao_id: q.id });
          toast('Cotação escolhida — custo e prazo do item preenchidos.','ok');
          pintarCustos();
        }catch(e){ toast(e.message,'err'); }
      }));
      box.appendChild(el);
    });
    QL.appendChild(box);
  });

  document.getElementById('cuAdd').addEventListener('click', async (e) => {
    const v = document.getElementById('cuV').value;
    if (v === '' || Number(v) < 0){ toast('Informe o valor.','err'); return; }
    e.target.disabled = true;
    try{
      if (!DEMO) await rpc('tf_salvar_custo', { p_os_id: card.os_id,
        p_tipo: document.getElementById('cuT').value,
        p_descricao: document.getElementById('cuD').value.trim() || null,
        p_fornecedor: document.getElementById('cuF').value.trim() || null,
        p_valor: Number(v) });
      toast('Custo lançado — a margem já mudou.','ok'); pintarCustos();
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });

  // ── pedidos de compra, depois das cotações: a ordem é a do trabalho —
  //    cota, escolhe, pede ──
  const cxPed = document.createElement('div');
  cxPed.style.marginTop = '22px';
  b.appendChild(cxPed);
  const pedidosProntos = montarPedidos(cxPed);
  pedidosProntos.then(() => {
    if (_msgPedido){
      const m = document.createElement('p');
      m.className = 'nota'; m.style.cssText = 'color:var(--ok);font-weight:600;margin-top:10px';
      m.textContent = _msgPedido; _msgPedido = null;
      cxPed.appendChild(m);
    }
  }).catch(() => {});

  document.getElementById('coAdd').addEventListener('click', async (e) => {
    const f = document.getElementById('coF').value.trim();
    if (!f){ toast('Diga com quem você cotou.','err'); return; }
    e.target.disabled = true;
    const n = id => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
    try{
      if (!DEMO) await rpc('tf_registrar_cotacao', { p_os_id: card.os_id,
        p_fornecedor: f,
        p_os_item_id: document.getElementById('coI').value || null,
        p_valor_unitario: n('coV'), p_valor_frete: n('coFr'),
        p_prazo_dias: n('coP'), p_canal: document.getElementById('coC').value });
      toast('Cotação registrada.','ok'); pintarCustos();
    }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
  });

  // Perfil de campo vê a margem e os pedidos, mas não lança: custo, cotação e
  // pedido são do escritório (S26, item 5). A caixa dos pedidos pinta depois
  // (é assíncrona), então trava de novo quando ela chega.
  if (!podeEscritorio()){
    travarSoLeitura(b);
    avisoSoLeitura(b);
    pedidosProntos.then(() => travarSoLeitura(cxPed)).catch(() => {});
  }
}
