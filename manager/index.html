/* ── S34 · item 6: o campo de código ────────────────────────────────────────
   Três coisas: a sugestão automática para item novo, o aviso de duplicado e o
   aviso de fora do padrão.

   ⚠ CORREÇÃO DA NOTA DO DOCUMENTO. Ela dizia para conferir o duplicado em
   memória, "porque a tela já carrega a lista inteira do catálogo". NÃO
   CARREGA: `listarCatalogo` pede `v_catalogo?familia_id=eq.<família aberta>`.
   O código é único no CATÁLOGO INTEIRO (`ux_catalogo_codigo`), então um
   VAL-0007 digitado num item de Serviço passaria batido aqui e morreria no
   23505 lá. A conferência é uma consulta por código — uma linha, sem lista —
   e o banco continua sendo a palavra final (ele traduz o 23505). */
let _catCodFora = false;      // fora do padrão da família: avisa, não bloqueia

function ligarCampoCatalogo(item, fam){
  const el = document.getElementById('fCod');
  const dica = document.getElementById('fCodDica');
  if (!el) return;
  _catCodFora = false;

  el.addEventListener('input', () => { el.value = el.value.toUpperCase(); });

  if (!item){
    // a sugestão vem de `tf_proximo_codigo_catalogo`, que é quem sabe contar —
    // reimplementar a contagem aqui é como as duas pontas passam a discordar
    (async () => {
      let sug = '';
      try{
        sug = DEMO ? demoProximoCodigo(fam) : await rpc('tf_proximo_codigo_catalogo', { p_familia: fam.id });
      }catch(e){ sug = ''; }
      if (document.getElementById('fCod') !== el) return;   // trocou de família
      el.placeholder = sug || 'ex.: ' + ((fam && fam.prefixo) || 'SRV') + '-0001';
      if (!el.value) el.value = sug || '';
    })();
  }

  const conferir = async () => {
    const cod = el.value.trim().toUpperCase();
    dica.className = 'dica';
    if (!cod){
      dica.textContent = 'Vazio: o TapFlow numera sozinho, como sempre fez.';
      _catCodFora = false; return;
    }
    if (/\s/.test(cod)){
      dica.className = 'dica erro';
      dica.textContent = 'O código não pode ter espaço.'; return;
    }
    // fora do padrão da família — aviso, nunca trava
    const pref = (fam && fam.prefixo) || '';
    _catCodFora = !!pref && !new RegExp('^' + pref + '-\\d{4}$').test(cod);

    let dono = null;
    if (!DEMO){
      try{
        const r = await get('v_catalogo?select=codigo,descricao,familia&codigo=eq.'
                            + encodeURIComponent(cod) + '&limit=1');
        if (r && r[0] && (!item || r[0].codigo !== item.codigo)) dono = r[0];
      }catch(e){ /* sem rede: o banco recusa no salvar, com mensagem */ }
    } else {
      const r = (D_CAT||[]).find(x => x.codigo === cod && (!item || x.id !== item.id));
      if (r) dono = { familia:r.familia, descricao:r.descricao };
    }
    if (dono){
      dica.className = 'dica erro';
      dica.textContent = 'Este código já é de outro item: ' + dono.familia + ' · ' + dono.descricao
                       + '. Códigos não se repetem — escolha outro.';
      return;
    }
    if (_catCodFora){
      dica.className = 'dica aviso';
      dica.textContent = 'Fora do padrão ' + pref + '-0000 desta família. Dá para salvar assim — '
                       + 'só confirme na hora de gravar.';
      return;
    }
    dica.textContent = 'Código livre.';
  };
  el.addEventListener('blur', conferir);
}

const demoProximoCodigo = fam => {
  const pref = (fam && fam.prefixo) || 'SRV';
  const n = (D_CAT||[]).filter(x => x.familia_id === (fam||{}).id)
    .map(x => parseInt(String(x.codigo||'').replace(/^[A-Z]+-/, ''), 10) || 0);
  return pref + '-' + String((n.length ? Math.max.apply(null, n) : 0) + 1).padStart(4, '0');
};

function lerEspecificacoes(){
  const o = {};
  document.querySelectorAll('[data-esp]').forEach(el => {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.dataset.tipo === 'numero') v = el.value === '' ? null : Number(el.value);
    else v = el.value.trim() || null;
    if (v !== null && v !== '' && v !== false) o[el.dataset.esp] = v;
  });
  return o;
}

async function salvarCatalogo(e){
  const desc = document.getElementById('fDesc').value.trim();
  if (!desc){ toast('A descrição é obrigatória.','err'); return; }

  // S34 · item 5: o valor é lido pelo `_numBR`, e valor impossível PARA aqui.
  // `Number('mil')` é NaN, e NaN no JSON vira `null` — o preço sumiria sem
  // uma linha de erro em lugar nenhum.
  let custo, preco;
  try{
    custo = lerCampoDinheiro('fCusto', 'Custo de referência');
    preco = lerCampoDinheiro('fPreco', 'Preço de referência');
  }catch(err){ toast(err.message,'err'); return; }

  // S34 · item 6: fora do padrão avisa e deixa passar — mas com um "sim" no
  // meio, que é a diferença entre escolher e escapar sem perceber
  const cod = (document.getElementById('fCod')||{}).value;
  const codigo = (cod || '').trim().toUpperCase() || null;
  if (codigo && _catCodFora){
    const fam = CAT_FAM.find(f => f.id === (catEdit ? catEdit.familia_id
                                                    : document.getElementById('fFam').value)) || {};
    const ok = await confirmar('Código fora do padrão',
      '<p style="margin-top:0">O código <b>' + esc(codigo) + '</b> não segue o padrão '
      + '<b>' + esc((fam.prefixo||'') + '-0000') + '</b> desta família.</p>'
      + '<p class="nota">Isso é permitido — a numeração automática dos próximos itens '
      + 'ignora o que não bate com o padrão, então a sequência da família não quebra. '
      + 'Só confirme que é mesmo o que você quer.</p>', 'Usar assim mesmo');
    if (!ok) return;
  }

  e.target.disabled = true;
  const p = {
    p_id: catEdit ? catEdit.id : null,
    p_familia_id: catEdit ? catEdit.familia_id : document.getElementById('fFam').value,
    p_descricao: desc,
    p_marca:  document.getElementById('fMarca').value.trim()  || null,
    p_modelo: document.getElementById('fModelo').value.trim() || null,
    p_especificacoes: lerEspecificacoes(),
    p_requer_calibracao: document.getElementById('fCalib').checked,
    p_requer_lacre:      document.getElementById('fLacre').checked,
    p_fornecedor_padrao: document.getElementById('fForn').value.trim() || null,
    p_custo_referencia: custo,
    p_preco_referencia: preco,
    p_observacoes: document.getElementById('fObs').value.trim() || null,
    p_codigo: codigo
  };
  try{
    const r = DEMO ? demoSalvarCat(p) : await rpc('tf_salvar_item_catalogo', p);
    const criou = !catEdit;
    toast(catEdit ? 'Item atualizado.' : 'Item ' + (r.codigo||'') + ' adicionado.', 'ok');
    catEdit = null;
    await listarCatalogo();
    // Item novo volta ABERTO, não para um formulário em branco: é onde está o
    // campo de foto, e mandar a pessoa achar o item na lista sem avisar era o
    // caminho morto que a revisão pegou.
    if (criou && r && r.id){
      const novo = await get('v_catalogo?select=*&id=eq.' + r.id + '&limit=1').catch(() => []);
      if (novo && novo[0]) return formCatalogo(novo[0]);
    }
    formCatalogo(null);
  }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
}

async function arquivarCatalogo(item){
  try{
    if (DEMO) demoArquivarCat(item); 
    else await rpc('tf_arquivar', { p_tabela:'catalogo_itens', p_id:item.id, p_ativo: !item.ativo });
    toast(item.ativo ? 'Item arquivado — sai da lista do campo.' : 'Item reativado.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function excluirCatalogo(item){
  if (!confirm('Excluir "' + item.descricao + '" do catálogo?\n\nIsso é definitivo. '
      + 'Se o item já foi usado em alguma OS, o sistema vai recusar e sugerir arquivar.')) return;
  try{
    const r = DEMO ? demoExcluirCat(item) : await rpc('tf_excluir_item_catalogo', { p_id: item.id });
    if (r && r.status === 'recusado'){ toast(r.mensagem, 'err'); return; }
    toast('Item excluído.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}


// ════════════════════════════════════════════════════════════════════════════
// DUPLICADOS — a revisão do cadastro de clientes (S21)
// ----------------------------------------------------------------------------
// Esta tela NÃO funde nada sozinha, e essa é a decisão central dela.
//
// A varredura na base real mostrou que os documentos vieram contaminados da
// planilha do gerador antigo: 26 raízes de CNPJ aparecem sob mais de um nome de
// empresa (a raiz do SENAI está em 8 cadastros e só 3 se chamam SENAI). Onde o
// documento não identifica ninguém, fundir por nome produz UM cadastro
// carregando UM dos documentos errados — e o erro fica invisível, porque sobrou
// um registro de aparência limpa. Vinte cadastros obviamente quebrados são
// melhores que um cadastro discretamente errado.
//
// Por isso cada grupo chega classificado, e o botão de mesclar só é a ação
// primária no grupo `seguro`. Nos outros a tela mostra o que não bate e espera.
// ════════════════════════════════════════════════════════════════════════════

let DUPS = [];
let VAZIOS = [];              // v_clientes_vazios
const VAZIOS_MARCADOS = new Set();
let vaziosAberto = false;

const DUP_CLASSE = {
  seguro: { selo:'seguro', rot:'seguro',
    txt:'Um documento só (ou nenhum) no grupo. É o caso em que mesclar não perde nada.' },
  filial: { selo:'filial', rot:'filiais da mesma empresa',
    txt:'Mesma raiz de CNPJ, filiais diferentes — são estabelecimentos distintos, '
      + 'com endereço, nota, ART e vasos próprios. NÃO mesclar.' },
  raizes_divergentes: { selo:'risco', rot:'CNPJs incompatíveis',
    txt:'Mesmo nome, raízes de CNPJ diferentes. Ou é erro de digitação, ou são '
      + 'empresas homônimas. Confira antes de decidir.' },
  doc_nao_confiavel: { selo:'grave', rot:'documento não confiável',
    txt:'A raiz de CNPJ deste grupo também aparece sob OUTRO nome de empresa — '
      + 'herança da carga da planilha. O documento aqui não prova identidade: '
      + 'mesclar cimentaria um CNPJ que pode ser de outra empresa.' },
};

async function pintarDuplicados(){
  visao = 'dup';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="painel" style="max-width:1040px">'
    + '<h3>Cadastros repetidos <span class="conta" id="dupConta"></span></h3>'
    + '<div id="vaziosCx"></div>'
    + '<div id="dupCorpo"><p class="nota">Procurando…</p></div></div>';

  if (DEMO){
    document.getElementById('dupCorpo').innerHTML =
      '<p class="nota">A revisão de duplicados lê o banco. No modo de '
      + 'demonstração não há base de clientes para varrer.</p>';
    return;
  }

  // A lista dos vazios é INDEPENDENTE da dos repetidos: um cadastro vazio com
  // nome único não entra em grupo nenhum e mesmo assim é lixo. Se uma falhar, a
  // outra continua desenhando.
  get('v_clientes_vazios?select=*&order=created_at&limit=500')
    .then(v => { VAZIOS = v || []; desenharVazios(); })
    .catch(e => { VAZIOS = null; desenharVazios(e.message); });

  try{
    DUPS = await get('v_clientes_duplicados?select=*&order=registros.desc,chave');
  }catch(e){
    // Lista vazia por erro nunca pode ser desenhada como "está tudo limpo":
    // seria a tela dizendo que a faxina acabou quando ela nem começou.
    document.getElementById('dupCorpo').innerHTML =
      '<div class="aviso"><b>Não deu para varrer o cadastro.</b><p class="mt"></p></div>'
      + '<button class="btn" id="dupRetry">Tentar de novo</button>';
    document.querySelector('#dupCorpo .mt').textContent =
      e.message + ' — isto NÃO quer dizer que não há repetidos.';
    document.getElementById('dupRetry').addEventListener('click', pintarDuplicados);
    return;
  }
  // a busca da tela filtra as DUAS listas — a dos vazios e a dos grupos
  REPINTA.dup = () => { desenharVazios(); desenharDuplicados(); };
  desenharDuplicados();
}

/* ── OS CADASTROS VAZIOS ────────────────────────────────────────────────────
   A varredura do S21 achou 116 cadastros sem nada dentro — clique perdido em
   "Adicionar cliente". O Bruno pediu o botão de lote DEPOIS de olhar a lista
   uma vez, e é por isso que a seção nasce FECHADA com o número na frente:
   abrir é o ato de olhar, e nada é excluído sem alguém marcar.

   Nada é pré-marcado. Marcar tudo por padrão transformaria "excluir os
   marcados" em "excluir todos", que é exatamente o clique que ninguém quer
   dar sem querer. */
function desenharVazios(erro){
  const cx = document.getElementById('vaziosCx');
  if (!cx) return;

  if (erro){
    cx.innerHTML = '<div class="aviso" style="margin-bottom:14px"><b>Não deu para '
      + 'listar os cadastros vazios.</b><p class="mtv"></p></div>';
    cx.querySelector('.mtv').textContent = erro + ' — isto NÃO quer dizer que não há.';
    return;
  }
  if (!VAZIOS || !VAZIOS.length){
    cx.innerHTML = '';
    contador('nVaz', '');
    return;
  }
  contador('nVaz', VAZIOS.length);

  if (!vaziosAberto){
    cx.innerHTML = '<div class="aviso" style="margin-bottom:14px">'
      + '<b>' + VAZIOS.length + ' cadastro(s) sem nada dentro.</b> '
      + 'Sem CNPJ, endereço, contato, equipamento, negócio ou OS — o rastro de '
      + 'um "Adicionar cliente" que não foi concluído.'
      + '<div style="margin-top:10px"><button class="btn" type="button" id="vzAbrir">'
      + 'Ver a lista</button></div></div>';
    document.getElementById('vzAbrir').addEventListener('click', () => {
      vaziosAberto = true; desenharVazios();
    });
    return;
  }

  const q = BUSCA.dup || '';
  const lista = !q ? VAZIOS : VAZIOS.filter(v => casa(v.razao_social + ' ' + (v.nome_fantasia||'') + ' ' + (v.cidade||''), q));
  const marcados = VAZIOS.filter(v => VAZIOS_MARCADOS.has(v.id)).length;

  cx.innerHTML =
      '<div class="dupGrupo" style="margin-bottom:16px">'
    + '<h4>Cadastros vazios <span class="selo seguro">' + VAZIOS.length + '</span></h4>'
    + '<p class="sub">Marque o que pode sair. A exclusão confere cada um no banco '
    + 'de novo — quem tiver ganhado histórico desde que esta lista foi montada é '
    + 'recusado, não apagado.</p>'
    + '<div style="max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:6px">'
    + '<table class="dupTab"><thead><tr><th style="width:34px"></th><th>Cadastro</th>'
    +   '<th>Cidade</th><th class="num">Criado há</th></tr></thead><tbody>'
    + lista.map(v =>
        '<tr><td><input type="checkbox" data-vz="' + esc(v.id) + '"'
      + (VAZIOS_MARCADOS.has(v.id) ? ' checked' : '') + '></td>'
      + '<td>' + esc(nomeCliente(v)) + '</td><td>' + esc(v.cidade || '—') + '</td>'
      + '<td class="num">' + (v.dias != null ? v.dias + ' d' : '—') + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="dupAcoes">'
    +   '<button class="btn" type="button" id="vzTodos">Marcar os ' + lista.length + ' da lista</button>'
    +   '<button class="btn" type="button" id="vzNenhum">Desmarcar</button>'
    +   '<button class="btn' + (marcados ? ' pri' : '') + '" type="button" id="vzExcluir"'
    +     (marcados ? '' : ' disabled') + '>Excluir os ' + marcados + ' marcados</button>'
    +   '<button class="btn" type="button" id="vzFechar">Fechar a lista</button>'
    + '</div></div>';

  cx.querySelectorAll('[data-vz]').forEach(b => b.addEventListener('change', () => {
    if (b.checked) VAZIOS_MARCADOS.add(b.dataset.vz); else VAZIOS_MARCADOS.delete(b.dataset.vz);
    desenharVazios();
  }));
  document.getElementById('vzTodos').addEventListener('click', () => {
    lista.forEach(v => VAZIOS_MARCADOS.add(v.id)); desenharVazios();
  });
  document.getElementById('vzNenhum').addEventListener('click', () => {
    VAZIOS_MARCADOS.clear(); desenharVazios();
  });
  document.getElementById('vzFechar').addEventListener('click', () => {
    vaziosAberto = false; desenharVazios();
  });
  const bx = document.getElementById('vzExcluir');
  if (bx && marcados) bx.addEventListener('click', () => excluirVazios());
}

function excluirVazios(){
  const ids = VAZIOS.filter(v => VAZIOS_MARCADOS.has(v.id)).map(v => v.id);
  if (!ids.length) return;
  const nomes = VAZIOS.filter(v => VAZIOS_MARCADOS.has(v.id)).slice(0, 8).map(v => v.razao_social);

  abrirModal('Excluir ' + ids.length + ' cadastro(s)?',
      '<p class="nota" style="margin-top:0">Isto apaga de vez. Cada exclusão fica '
    + 'registrada no livro (quem, quando, o que havia dentro) — mas o cadastro '
    + 'não volta.</p>'
    + '<div class="opcoes" style="max-height:180px;overflow:auto">'
    + nomes.map(n => '<div class="linhaOpc"><span>' + esc(n) + '</span></div>').join('')
    + (ids.length > nomes.length
       ? '<div class="linhaOpc"><span>… e mais ' + (ids.length - nomes.length) + '</span></div>' : '')
    + '</div>',
    [ { label:'Excluir', pri:true, onClick: async function(){
          const b = this;
          try{
            if (DEMO) throw new Error('Modo demonstração: nada é excluído.');
            let ok = 0, nao = [];
            // ⚠ Em lotes de 200, que é o teto da função. Em série, e não em
            //    paralelo: se o terceiro lote falhar, os dois primeiros já
            //    saíram e a tela precisa mostrar o que sobrou.
            for (let i = 0; i < ids.length; i += 200){
              const r = await rpc('tf_excluir_clientes_vazios',
                { p_ids: ids.slice(i, i + 200), p_motivo: 'faxina de cadastros vazios' });
              ok += Number(r.excluidos || 0);
              nao = nao.concat(r.detalhe || []);
            }
            fecharModal();
            VAZIOS_MARCADOS.clear();
            toast(ok + ' cadastro(s) excluído(s)'
              + (nao.length ? ' · ' + nao.length + ' recusado(s)' : '') + '.',
              nao.length ? 'err' : 'ok');
            if (nao.length) console.warn('[faxina] recusados:', nao);
            pintarDuplicados();
          }catch(e){ toast(e.message,'err'); if (b) b.disabled = false; }
        } },
      { label:'Cancelar', onClick: () => fecharModal() } ]);
}

function desenharDuplicados(){
  const corpo = document.getElementById('dupCorpo');
  if (!corpo) return;                      // trocou de tela durante a carga
  const q = BUSCA.dup || '';
  const lista = !q ? DUPS : DUPS.filter(g => casa(
    (g.registros_json || []).map(r => r.razao_social + ' ' + (r.nome_fantasia || '') + ' ' + (r.cnpj || '')).join(' '), q));

  contador('nDup', DUPS.filter(g => !g.dispensado && g.classe !== 'filial').length);
  const cab = document.getElementById('dupConta');
  if (cab) cab.textContent = q ? lista.length + ' de ' + DUPS.length + ' grupos'
                               : DUPS.length + ' grupo(s)';

  if (!DUPS.length){
    corpo.innerHTML = '<p class="nota">Nenhum nome repetido no cadastro. '
      + 'O aviso na hora de cadastrar é o que mantém assim.</p>';
    return;
  }
  if (!lista.length){
    corpo.innerHTML = '<p class="nota">Nenhum grupo casa com essa busca.</p>';
    return;
  }

  // O resumo por classe fica no topo porque é ele que diz onde começar: 
  // os grupos `seguro` são a faxina de meia hora, o resto é decisão.
  const conta = c => DUPS.filter(g => g.classe === c).length;
  corpo.innerHTML =
      '<div class="parecidos" style="margin-bottom:14px">'
    + ['seguro','raizes_divergentes','doc_nao_confiavel','filial']
        .filter(c => conta(c))
        .map(c => '<div class="parecidoLinha" style="cursor:default">'
             + '<span class="selo ' + DUP_CLASSE[c].selo + '">' + conta(c) + ' · '
             + esc(DUP_CLASSE[c].rot) + '</span>'
             + '<span class="pd" style="flex:1">' + esc(DUP_CLASSE[c].txt) + '</span></div>')
        .join('')
    + '</div>'
    + '<div id="dupGrupos"></div>';

  const alvo = document.getElementById('dupGrupos');
  lista.forEach(g => alvo.appendChild(cartaoDuplicado(g)));
}

function cartaoDuplicado(g){
  const meta = DUP_CLASSE[g.classe] || { selo:'risco', rot:g.classe, txt:'' };
  const regs = g.registros_json || [];
  const el = document.createElement('div');
  el.className = 'dupGrupo';

  const linha = r =>
      '<tr' + (r.vazio ? ' class="vazio"' : '') + '>'
    + '<td><b>' + esc(r.razao_social) + '</b>'
    +   (r.nome_fantasia ? ' <small style="color:var(--ink-3)">(' + esc(r.nome_fantasia) + ')</small>' : '')
    +   (r.vazio ? ' <span class="chip">cadastro vazio</span>' : '')
    +   (r.doc_suspeito ? ' <span class="selo grave">CNPJ suspeito</span>' : '') + '</td>'
    + '<td class="num">' + esc(r.cnpj || '—') + '</td>'
    + '<td>' + esc(r.cidade || '—') + '</td>'
    + '<td class="num">' + r.contatos + '</td>'
    + '<td class="num">' + r.equipamentos + '</td>'
    + '<td class="num">' + (r.negocios + r.oss + r.propostas) + '</td>'
    + '<td><button class="btn mini" data-abrir="' + esc(r.id) + '" '
    +     'data-nome="' + esc(r.razao_social) + '" type="button">Abrir</button></td>'
    + '</tr>';

  el.innerHTML =
      '<h4>' + esc(regs.length ? regs[0].razao_social : g.chave)
    +   ' <span class="selo ' + meta.selo + '">' + esc(meta.rot) + '</span>'
    +   (g.dispensado ? ' <span class="chip">já revisado</span>' : '') + '</h4>'
    + '<p class="sub">' + g.registros + ' cadastros · ' + esc(meta.txt) + '</p>'
    + '<div style="overflow-x:auto"><table class="dupTab"><thead><tr>'
    +   '<th>Cadastro</th><th>CNPJ</th><th>Cidade</th>'
    +   '<th>Cont.</th><th>Equip.</th><th>Histórico</th><th></th>'
    + '</tr></thead><tbody>' + regs.map(linha).join('') + '</tbody></table></div>'
    + '<div class="dupAcoes">'
    +   (g.classe === 'filial' ? ''
        : '<button class="btn' + (g.classe === 'seguro' ? ' pri' : '') + '" '
          + 'data-mesclar="1" type="button">Mesclar…</button>')
    +   (g.dispensado
        ? '<button class="btn" data-reabrir="1" type="button">Voltar a revisar</button>'
        : '<button class="btn" data-dispensar="1" type="button">Não é duplicado</button>')
    + '</div>';

  el.querySelectorAll('[data-abrir]').forEach(b =>
    b.addEventListener('click', async () => {
      cadSel = b.dataset.abrir;
      await irPara('cad');
      const cx = document.getElementById('tbBusca');
      if (cx){ BUSCA.cad = b.dataset.nome; cx.value = b.dataset.nome;
               if (REPINTA.cad) REPINTA.cad(); }
      const l = document.querySelector('[data-cli="' + b.dataset.abrir + '"]');
      if (l) l.click();
    }));

  const bM = el.querySelector('[data-mesclar]');
  if (bM) bM.addEventListener('click', () => modalMesclar(g));

  const bD = el.querySelector('[data-dispensar]');
  if (bD) bD.addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const motivo = prompt('Por que este grupo não é duplicado?\n'
        + '(fica registrado, para ninguém revisar de novo)') || '';
      try{
        await rpc('tf_marcar_nao_duplicado', { p_chave: g.chave, p_motivo: motivo });
        toast('Grupo marcado como revisado.','ok');
        pintarDuplicados();
      }catch(e){ toast(e.message,'err'); }
    });
  });

  const bR = el.querySelector('[data-reabrir]');
  if (bR) bR.addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      try{
        await rpc('tf_desmarcar_nao_duplicado', { p_chave: g.chave });
        pintarDuplicados();
      }catch(e){ toast(e.message,'err'); }
    });
  });

  return el;
}

/** Escolher o sobrevivente é o ato inteiro. A tela mostra o que cada cadastro
 *  carrega e NÃO sugere nada nos grupos de risco: sugestão em tela de decisão
 *  vira o padrão que ninguém questiona. */
function modalMesclar(g){
  const regs = g.registros_json || [];
  const seguro = g.classe === 'seguro';
  const opc = regs.map((r,i) =>
      '<label class="linhaOpc"><input type="radio" name="mSobrev" value="' + esc(r.id) + '"'
    + (seguro && i === 0 ? ' checked' : '') + '> '
    + '<span><b>' + esc(r.razao_social) + '</b> — ' + esc(r.cnpj || 'sem CNPJ')
    + (r.cidade ? ' · ' + esc(r.cidade) : '')
    + '<br><small style="color:var(--ink-3)">' + r.contatos + ' contato(s) · '
    + r.equipamentos + ' equipamento(s) · '
    + (r.negocios + r.oss + r.propostas) + ' no histórico'
    + (r.doc_suspeito ? ' · ⚠ CNPJ que aparece sob outro nome' : '')
    + '</small></span></label>').join('');

  abrirModal('Qual cadastro fica?',
      '<p class="nota" style="margin-top:0">Os outros viram sombra: saem das listas, '
    + 'entregam contatos, equipamentos, negócios e OS ao escolhido, e continuam '
    + 'existindo com a seta apontando para cá. Nada é apagado.</p>'
    + (seguro ? '' :
       '<div class="aviso" style="margin-bottom:10px"><b>' + esc(DUP_CLASSE[g.classe].rot)
       + '.</b> ' + esc(DUP_CLASSE[g.classe].txt)
       + ' Confira o CNPJ do escolhido na ficha depois de mesclar.</div>')
    + '<div class="opcoes">' + opc + '</div>',
    [ { label:'Mesclar', pri:true, onClick: async () => {
          const sel = document.querySelector('input[name="mSobrev"]:checked');
          if (!sel){ toast('Escolha qual cadastro fica.','err'); return; }
          const fica = sel.value;
          const saem = regs.filter(r => r.id !== fica);
          try{
            // Um a um, e em série: se o terceiro falhar, os dois primeiros já
            // migraram e a tela mostra o que sobrou — melhor que um lote que
            // volta atrás pela metade sem ninguém saber quais foram.
            for (const r of saem){
              await rpc('tf_mesclar_cliente',
                { p_sobrevivente: fica, p_perdedor: r.id, p_motivo: 'cadastro repetido' });
            }
            fecharModal();
            toast(saem.length + ' cadastro(s) mesclado(s).','ok');
            pintarDuplicados();
          }catch(e){ toast(e.message,'err'); }
        } },
      { label:'Cancelar', onClick: () => fecharModal() } ]);
}

// CADASTROS
// ----------------------------------------------------------------------------
// O aviso de cliente parecido (S21) é o item que impede a base voltar a
// acumular repetido. Ele é DELIBERADAMENTE sensível — o Fernando pediu que
// prefira alarme falso a duplicado novo — e por isso nunca bloqueia: uma
// interrupção que trava viraria o "cadastrar assim mesmo" reflexo, e aí o
// aviso deixa de ser lido.
// ════════════════════════════════════════════════════════════════════════════

/** Grava o cliente novo. Separado do clique porque o aviso também chama. */
async function criarCliente(nome, cnpj, botao, fantasia){
  try{
    // passa por tf_salvar_cliente e não por um POST: é a mesma função que a
    // ficha usa, com a mesma checagem de CNPJ repetido. Dois caminhos de
    // gravação para o mesmo registro é como duas telas passam a discordar.
    let novo = null;
    if (DEMO) demoAddCliente(nome, cnpj);
    else novo = await rpc('tf_salvar_cliente', { p_id:null, p_razao_social:nome, p_cnpj:cnpj,
                                                 p_nome_fantasia: fantasia || null });
    toast('Cliente cadastrado. Complete o endereço ao lado.','ok');
    if (novo && novo.id) cadSel = novo.id;
    pintarCadastros();
  }catch(err){
    toast(/duplicate|unique|ux_clientes/i.test(err.message)
      ? 'Já existe um cliente com esse CNPJ.' : err.message, 'err');
    if (botao) botao.disabled = false;
  }
}

/** A interrupção: quem já existe, e as duas saídas. */
function avisarParecidos(nome, cnpj, lista, fantasia){
  const rot = { mesmo:'mesmo cliente', muito_parecido:'muito parecido', parecido:'parecido' };
  const linhas = lista.map(c =>
      '<button class="btn parecidoLinha" data-id="' + esc(c.id) + '" '
    +   'data-nome="' + esc(c.razao_social) + '" type="button">'
    +   '<span class="pn">' + esc(nomeCliente(c)) + '</span>'
    +   '<span class="pd">' + esc(c.cnpj || 'sem CNPJ')
    +     (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>'
    +   '<span class="chip">' + esc(rot[c.forca] || c.forca)
    +     (c.parece_filial ? ' · outra filial' : '') + '</span>'
    + '</button>').join('');

  abrirModal('Já existe cliente parecido',
      '<p class="nota" style="margin-top:0">Antes de criar <b>' + esc(nome) + '</b>, '
    + 'confira se não é um destes. Reaproveitar o cadastro mantém contatos, '
    + 'equipamentos e histórico no mesmo lugar.</p>'
    + '<div class="parecidos">' + linhas + '</div>'
    + '<p class="nota">Se for outra empresa — ou outra filial, que tem CNPJ, '
    + 'endereço e vasos próprios —, cadastrar de novo é o certo.</p>',
    [ { label:'Cadastrar mesmo assim', onClick: () => {
          fecharModal(); criarCliente(nome, cnpj, document.getElementById('cAdd'), fantasia); } },
      { label:'Cancelar', pri:true, onClick: () => fecharModal() } ]);

  document.querySelectorAll('.parecidoLinha').forEach(b => {
    b.addEventListener('click', async () => {
      fecharModal();
      cadSel = b.dataset.id;
      await pintarCadastros();
      // Com 516 clientes a lista corta em 120: o escolhido pode não estar
      // desenhado. Buscar pelo nome primeiro é o que garante que ele apareça.
      const cx = document.getElementById('tbBusca');
      if (cx){ BUSCA.cad = b.dataset.nome || ''; cx.value = BUSCA.cad;
               if (REPINTA.cad) REPINTA.cad(); }
      const alvo = document.querySelector('[data-cli="' + b.dataset.id + '"]');
      if (alvo) alvo.click();
      else toast('Cliente aberto na lista — use a busca para achá-lo.','ok');
    });
  });
}

async function pintarCadastros(){
  visao = 'cad';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="cadWrap">'
    + '<div class="painel"><h3>Clientes <span class="conta" id="cadConta"></span></h3>'
    +   '<div id="cadForm"></div><div class="lista" id="cadLista"></div></div>'
    + '<div class="painel" id="cadDet"><p style="color:var(--ink-3);font-size:13.5px;margin:0">'
    + 'Escolha um cliente à esquerda para ver contatos e equipamentos.</p></div></div>';

  document.getElementById('cadForm').innerHTML =
    '<div class="campo"><label for="cN">Razão social</label><input id="cN" type="text" autocomplete="off" name="cn_nofill"></div>' +
    '<div class="dupla"><div class="campo"><label for="cF">Nome fantasia</label><input id="cF" type="text" placeholder="opcional" autocomplete="off" name="cf_nofill"></div>' +
    '<div class="campo"><label for="cC">CNPJ</label><input id="cC" type="text" placeholder="opcional" autocomplete="off" name="cc_nofill"></div></div>' +
    '<button class="btn pri" id="cAdd" style="width:100%;padding:9px;margin-bottom:10px">Adicionar cliente</button>' +
    // ITEM 2 (S32): sem esta caixinha, arquivar seria porta de mão única — a
    // lista pede `ativo=eq.true` e o cliente arquivado sumiria com a ficha
    // junto, sem caminho de volta para o "Reativar".
    '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="cArq"' +
    (_cadArquivados ? ' checked' : '') + '> mostrar os arquivados</label>';

  document.getElementById('cAdd').addEventListener('click', async (e) => {
    const nome = document.getElementById('cN').value.trim();
    if (!nome){ toast('Informe a razão social do cliente.','err'); return; }
    const cnpj = document.getElementById('cC').value.trim() || null;
    const fantasia = document.getElementById('cF').value.trim() || null;
    e.target.disabled = true;

    // ── o aviso de parecido, ANTES de gravar ──────────────────────────────
    // É o que impede o cadastro repetido de nascer, e por isso ele NUNCA
    // bloqueia: mostra quem já existe, oferece abrir a ficha, e deixa cadastrar
    // assim mesmo — porque às vezes é mesmo outra empresa ou outra filial.
    // Falha na consulta não pode travar o cadastro: quem não conseguiu avisar
    // segue em frente em silêncio, e a pessoa cadastra como cadastrava antes.
    let parecidos = [];
    if (!DEMO){
      try{ parecidos = await rpc('tf_clientes_semelhantes',
             { p_razao_social: nome, p_cnpj: cnpj, p_excluir: null }) || []; }
      catch(err){ parecidos = []; }
      // o apelido também é conferido: "Ergolife" já pode estar na base com a
      // razão social da Adequar
      if (!parecidos.length && fantasia){
        try{ parecidos = await rpc('tf_clientes_semelhantes',
               { p_razao_social: fantasia, p_cnpj: cnpj, p_excluir: null }) || []; }
        catch(err){ parecidos = []; }
      }
    }
    if (parecidos.length){
      e.target.disabled = false;
      return avisarParecidos(nome, cnpj, parecidos, fantasia);
    }
    criarCliente(nome, cnpj, e.target, fantasia);
  });

  const cArq = document.getElementById('cArq');
  if (cArq) cArq.addEventListener('change', () => {
    _cadArquivados = cArq.checked; cadSel = null; pintarCadastros();
  });

  let todos = [];
  try{ todos = DEMO ? demoClientes()
      : await get('clientes?select=id,razao_social,nome_fantasia,cnpj,cidade,endereco,localizacao,tem_logo,observacoes,ativo,'
                  + 'contatos(count),equipamentos(count)'
                  + (_cadArquivados ? '' : '&ativo=eq.true')
                  + '&order=razao_social&limit=2000'); }
  catch(e){
    // sem `return`, seguia com a lista vazia e escrevia "Nenhum cliente ainda"
    // em cima de uma falha de rede — com 516 clientes cadastrados
    const l = document.getElementById('cadLista');
    if (l){ l.innerHTML = '<div class="vazio2" style="padding:22px 8px;text-align:left">'
      + '<b>Não deu para carregar os clientes</b><p class="mt"></p>'
      + '<button class="btn" id="cadRetry" style="margin-top:12px">Tentar de novo</button></div>';
      l.querySelector('.mt').textContent = e.message;
      document.getElementById('cadRetry').addEventListener('click', pintarCadastros);
    }
    toast(e.message,'err');
    return;
  }

  // Com 516 clientes importados, listar todos era rolar por dois minutos até
  // achar um. A busca é o caminho normal aqui, não o atalho.
  REPINTA.cad = () => desenharClientes(todos);
  desenharClientes(todos);
}

function desenharClientes(todos){
  const lista = document.getElementById('cadLista');
  if (!lista) return;              // trocou de tela durante o carregamento
  const q = BUSCA.cad || '';
  const cli = !q ? todos : todos.filter(c => casa(
    [c.razao_social, c.nome_fantasia, c.cnpj, c.cidade, c.observacoes].join(' '), q));

  lista.innerHTML = '';
  const cab = document.getElementById('cadConta');
  if (cab) cab.textContent = q
    ? cli.length + ' de ' + todos.length + ' clientes'
    : todos.length + ' cliente(s)';

  if (!cli.length){
    lista.innerHTML = q
      ? '<div class="vazio2" style="padding:24px 10px"><b>Nada com essa busca</b>'
        + '<p>Nenhum dos ' + todos.length + ' clientes casa com o que você digitou.</p></div>'
      : '<p style="font-size:13px;color:var(--ink-3)">Nenhum cliente ainda.</p>';
    return;
  }

  // O corte é declarado, não escondido: dizer "há mais" é o que faz a pessoa
  // buscar em vez de concluir que o cliente sumiu.
  const CORTE = 120;
  const mostrar = cli.slice(0, CORTE);
  mostrar.forEach(c => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (cadSel === c.id ? ' on' : '') + (c.ativo === false ? ' off' : '');
    b.dataset.cli = c.id;      // o aviso de parecido e a tela de Duplicados
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = c.razao_social
      + (c.ativo === false ? '  (arquivado)' : '');
    const nc = (c.contatos && c.contatos[0] ? c.contatos[0].count : (c._contatos||0));
    const ne = (c.equipamentos && c.equipamentos[0] ? c.equipamentos[0].count : (c._equip||0));
    // "sem endereço" aparece na lista de propósito: dado que falta e não
    // aparece em lugar nenhum é dado que nunca vai ser preenchido.
    b.querySelector('small').textContent =
      (c.nome_fantasia ? c.nome_fantasia + ' · ' : '')
      + (c.cnpj ? c.cnpj + ' · ' : '') + nc + ' contato(s) · ' + ne + ' equipamento(s)'
      + (c.endereco ? '' : ' · sem endereço');
    if (c.observacoes && /incompleto/i.test(c.observacoes)) b.classList.add('incompleto');
    if (!c.endereco) b.classList.add('incompleto');
    b.addEventListener('click', () => { cadSel = c.id; pintarCadastros(); detalheCliente(c); });
    lista.appendChild(b);
  });
  if (cli.length > CORTE){
    const p2 = document.createElement('p');
    p2.style.cssText = 'font-size:12px;color:var(--ink-3);padding:9px 2px;margin:0';
    p2.textContent = 'Mostrando os ' + CORTE + ' primeiros de ' + cli.length
      + '. Use a busca do topo para achar o resto.';
    lista.appendChild(p2);
  }
  const sel = cli.find(c => c.id === cadSel);
  if (sel) detalheCliente(sel);
}

// ── A FICHA DO CLIENTE ──────────────────────────────────────────────────────
// Até o S16 esta tela LIA o cliente e não deixava mudar nada dele: dava para
// acrescentar contato e equipamento, e não dava para corrigir o nome, o CNPJ
// nem o endereço. E `endereco`, `cidade`, `uf` e `cep` existem no banco desde
// a primeira migration — estavam lá, sem tela.
//
// Foi o terceiro caso do mesmo tipo em duas rodadas (o módulo `documentos`, as
// colunas Aprovadas/Recusadas do Comercial, e agora isto). Por isso a auditoria
// desta rodada passou a acusar coluna que o banco tem e nenhuma tela lê.
async function detalheCliente(c){
  const d = document.getElementById('cadDet');
  d.innerHTML = '<h3></h3><p style="color:var(--ink-3);font-size:13px">Carregando…</p>';
  d.querySelector('h3').textContent = c.razao_social;

  let cli = c, contatos = [], equips = [];
  try{
    if (DEMO){ contatos = demoContatos(c.id); equips = demoEquips(c.id); }
    else {
      const [f, ct, eq] = await Promise.all([
        get('clientes?select=*&id=eq.' + c.id),
        get('contatos?select=id,nome,email,telefone,cargo,papeis&cliente_id=eq.' + c.id
            + '&ativo=eq.true&order=nome'),
        get('equipamentos?select=id,tag,tipo,localizacao,pmta,nome,venc_insp_interna,'
            + 'venc_insp_externa,venc_calib_manometro,venc_calib_valvula,tapweb_em,'
            + 'tapweb_desativado_em&cliente_id=eq.' + c.id + '&ativo=eq.true&order=tag')
      ]);
      cli = (f && f[0]) || c; contatos = ct; equips = eq;
    }
  }catch(e){
    d.innerHTML = '<h3></h3><div class="aviso"><b>Não deu para carregar este cliente.</b><br>'
      + esc(e.message) + '</div><button class="btn" id="clRetry">Tentar de novo</button>';
    d.querySelector('h3').textContent = c.razao_social;
    document.getElementById('clRetry').addEventListener('click', () => detalheCliente(c));
    return;
  }

  const cp = (id, rot, val, ph, tipo) =>
    '<div class="campo"><label for="' + id + '">' + rot + '</label>'
    + '<input id="' + id + '" type="' + (tipo||'text') + '" value="' + esc(val||'') + '"'
    + ' autocomplete="off" name="' + id + '_nofill"'
    + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>';

  d.innerHTML =
      '<div class="fichaTopo">'
    +   '<div class="lado">' + logoHTML(cli.id, cli.razao_social, 'logoFicha')
    +     '<input type="file" id="clLogoF" accept="image/png,image/jpeg,image/webp" hidden>'
    +     '<button class="btn mini" type="button" id="clLogoB">'
    +       (cli.tem_logo ? 'Trocar' : 'Logomarca') + '</button>'
    +     (cli.tem_logo ? '<button class="btn mini" type="button" id="clLogoX">Tirar</button>' : '')
    +   '</div>'
    +   '<div class="campos">'
    +     cp('clNome','Razão social', cli.razao_social)
    // ── ITEM 8 (S31): BUSCAR DADOS DO CNPJ ──────────────────────────────
    // Não é busca automática: o botão é o ato. Digitar o CNPJ e ver a ficha
    // se reescrever sozinha assusta — e às vezes o que está na tela é mais
    // novo que o que está na Receita.
    +     '<div class="dupla">' + cp('clFant','Nome fantasia', cli.nome_fantasia, 'como é conhecido — opcional')
    +     '<div class="cnpjLinha">' + cp('clCnpj','CNPJ', cli.cnpj, 'opcional')
    +       '<button class="btn" type="button" id="clCnpjB" '
    +       'title="Consulta os dados públicos deste CNPJ e preenche o formulário">'
    +       'Buscar dados do CNPJ</button></div></div>'
    +     '<div id="clCnpjMsg"></div>'
    +   '</div>'
    + '</div>'
    + '<div class="secTit" style="margin-top:0">Onde fica</div>'
    + cp('clEnd','Endereço', cli.endereco, 'Rua e complemento — o que vai no documento')
    + '<div class="tripla">' + cp('clNum','Número', cli.numero) + cp('clBai','Bairro', cli.bairro)
    +   cp('clCompl','Complemento', cli.complemento, 'sala, galpão, bloco') + '</div>'
    + '<div class="tripla">' + cp('clCid','Cidade', cli.cidade) + cp('clUf','UF', cli.uf)
    +   cp('clCep','CEP', cli.cep) + '</div>'
    + cp('clLoc','Localização no mapa', cli.localizacao, 'Cole aqui o link do Google Maps')
    + '<p class="nota">O endereço é para o documento; a localização é para chegar lá. '
    + 'Metade das plantas não tem número que o GPS ache — é o link do mapa que evita o '
    + 'inspetor ligando do portão errado.</p>'
    // Os campos da Receita. Ficam juntos e por último porque quase nunca se
    // digitam à mão: ou vieram da consulta, ou estão vazios. Editáveis assim
    // mesmo — cadastro da Receita atrasa, e quem sabe o de hoje é o vendedor.
    + '<div class="secTit">Na Receita Federal</div>'
    + '<div class="tripla">' + cp('clSit','Situação cadastral', cli.situacao_cadastral, 'ATIVA, BAIXADA…')
    +   cp('clNat','Natureza jurídica', cli.natureza_juridica)
    +   cp('clAber','Data de abertura', cli.data_abertura, null, 'date') + '</div>'
    + '<div class="dupla">' + cp('clCnae','CNAE', cli.cnae)
    +   cp('clCnaeD','Atividade principal', cli.cnae_descricao) + '</div>'
    + (cli.dados_cnpj_em
        ? '<p class="nota">Consultado pelo CNPJ em '
          + esc(new Date(cli.dados_cnpj_em).toLocaleDateString('pt-BR'))
          + '. Vale conferir antes de emitir documento: a Receita muda e não avisa.</p>'
        : '')
    + '<div class="campo"><label for="clObs">Observações</label>'
    + '<textarea id="clObs" rows="2">' + esc(cli.observacoes||'') + '</textarea></div>'
    + '<button class="btn pri" id="clSalvar" style="width:100%;margin-bottom:20px">Salvar cliente</button>'
    + '<div id="clContatos"></div><div id="clEquips"></div>'
    // ── ITEM 2 (S32): ARQUIVAR E EXCLUIR ──────────────────────────────────
    // O documento pediu só o "Excluir cliente". Entregar só ele deixaria a
    // tela num beco: `tf_excluir_cliente` RECUSA quem tem OS, negócio ou
    // proposta, e a mensagem da recusa (que vem do banco) manda ARQUIVAR o
    // cliente — um botão que não existia em lugar nenhum. É o mesmo defeito
    // que a T12 teve no S24: a recusa apontava para um "receber" que ninguém
    // tinha escrito. Então vêm os dois, e arquivar tem volta (a lista ganhou
    // "mostrar arquivados"), senão seria porta de mão única.
    //
    // Excluir é do ADMIN — `tf_is_admin()` na primeira linha da função —, e o
    // documento não dizia isso. Oferecer o botão para quem o banco vai recusar
    // é a armadilha que este projeto persegue desde o parecer do TapControl.
    + '<hr class="reguaPerigo">'
    + '<div class="linhaBtns">'
    +   (podeEscritorio()
        ? '<button class="btn" type="button" id="clArquivar">'
          + (cli.ativo === false ? 'Reativar cliente' : 'Arquivar cliente') + '</button>' : '')
    +   (sessao.admin && cli.ativo !== false
        ? '<button class="btn" type="button" id="clExcluir">Excluir cliente</button>' : '')
    + '</div>'
    + '<p class="nota">' + (cli.ativo === false
        ? '<b>Este cliente está arquivado</b> — ele não aparece na lista nem nas escolhas de '
          + 'novo negócio. O histórico continua inteiro. Reativar devolve ele às listas.'
        : '<b>Arquivar</b> tira o cliente das listas e mantém tudo o que já aconteceu — é a '
          + 'saída para quem tem OS, proposta ou negócio. <b>Excluir</b> apaga de vez, e só '
          + 'funciona em cadastro sem nenhum histórico'
          + (sessao.admin ? '' : ' (e é do administrador)') + '.')
    + '</p>';

  // ── gravar a ficha ──
  document.getElementById('clSalvar').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const v = id => (document.getElementById(id)||{}).value || '';
      if (!v('clNome').trim()){ toast('A razão social do cliente é obrigatória.','err'); return; }
      try{
        if (DEMO) demoSalvarCliente(cli.id, v('clNome').trim(), v('clCnpj').trim(), v('clFant').trim());
        else await rpc('tf_salvar_cliente', { p_id: cli.id, p_razao_social: v('clNome').trim(),
          p_nome_fantasia: v('clFant').trim() || null,
          p_cnpj: v('clCnpj').trim() || null, p_endereco: v('clEnd').trim() || null,
          p_cidade: v('clCid').trim() || null, p_uf: v('clUf').trim() || null,
          p_cep: v('clCep').trim() || null, p_localizacao: v('clLoc').trim() || null,
          p_observacoes: v('clObs').trim() || null,
          // S31 · item 8
          p_numero: v('clNum').trim() || null, p_bairro: v('clBai').trim() || null,
          p_complemento: v('clCompl').trim() || null,
          p_situacao_cadastral: v('clSit').trim() || null,
          p_cnae: v('clCnae').trim() || null, p_cnae_descricao: v('clCnaeD').trim() || null,
          p_natureza_juridica: v('clNat').trim() || null,
          p_data_abertura: v('clAber') || null,
          // só carimba quando a consulta aconteceu nesta sessão de edição:
          // salvar à mão não pode fazer dado velho parecer recém-conferido
          p_dados_cnpj_em: _cnpjConsultado || null });
        toast('Cliente salvo.','ok');
        pintarCadastros();
      }catch(e){ toast(e.message,'err'); }
    });
  });

  // ── arquivar / reativar / excluir (item 2, S32) ──
  const bArq = document.getElementById('clArquivar');
  if (bArq) bArq.addEventListener('click', function(){
    const volta = (cli.ativo === false);
    _semDuploEnvio_(this, async () => {
      try{
        if (DEMO) throw new Error('Modo demonstração: nada é arquivado.');
        await rpc('tf_arquivar', { p_tabela:'clientes', p_id: cli.id, p_ativo: volta });
        toast(volta ? 'Cliente reativado — voltou para as listas.'
                    : 'Cliente arquivado — saiu das listas, o histórico ficou.', 'ok');
        cadSel = null;
        await pintarCadastros();
      }catch(e){ toast(e.message,'err'); }
    });
  });
  const bExc = document.getElementById('clExcluir');
  if (bExc) bExc.addEventListener('click', () => modalExcluirCliente(cli, contatos, equips));

  // ── o botão da consulta do CNPJ ──
  _cnpjConsultado = null;
  const bCnpj = document.getElementById('clCnpjB');
  if (bCnpj) bCnpj.addEventListener('click', () => buscarDadosCnpj(bCnpj));

  // ── logomarca ──
  const bLogo = document.getElementById('clLogoB');
  const fLogo = document.getElementById('clLogoF');
  bLogo.addEventListener('click', () => fLogo.click());
  fLogo.addEventListener('change', async () => {
    const f = fLogo.files && fLogo.files[0];
    if (!f) return;
    bLogo.disabled = true; bLogo.textContent = 'Enviando…';
    try{
      // S29: o mesmo envio das gavetas do negócio e da OS (enviarLogoCliente)
      await enviarLogoCliente(cli.id, f);
      toast('Logomarca gravada.','ok');
      cli.tem_logo = true;
      detalheCliente(cli);
    }catch(e){ toast(e.message,'err'); }
    finally{ bLogo.disabled = false; bLogo.textContent = 'Trocar'; fLogo.value = ''; }
  });
  const xLogo = document.getElementById('clLogoX');
  if (xLogo) xLogo.addEventListener('click', () => _semDuploEnvio_(xLogo, async () => {
    try{
      await tirarLogoCliente(cli.id); cli.tem_logo = false;
      toast('Logomarca removida.','ok'); detalheCliente(cli);
    }catch(e){ toast(e.message,'err'); }
  }));

  pintarContatos(cli, contatos);
  pintarEquipamentos(cli, equips);
}

/** ITEM 2 (S32): o modal de excluir cliente.
 *
 *  Mesmo desenho do `modalExcluirUsuario`: dizer ANTES o que vai junto, pedir o
 *  motivo, e — quando o servidor recusa — mostrar a recusa como TEXTO na
 *  própria caixa, com a saída ao lado, em vez de um toast vermelho que some.
 *
 *  ⚠ `tf_excluir_cliente` não levanta exceção quando recusa: devolve
 *  {status:'recusado', mensagem}. Ignorar o retorno e comemorar é o "verde
 *  mentindo" que mordeu o assumir no S18. Aqui o retorno é lido. */
function modalExcluirCliente(cli, contatos, equips){
  const nC = (contatos || []).length, nE = (equips || []).length;
  const junto = [];
  if (nC) junto.push(nC + (nC > 1 ? ' contatos' : ' contato'));
  if (nE) junto.push(nE + (nE > 1 ? ' equipamentos' : ' equipamento'));

  abrirModal('Excluir "' + (cli.razao_social || '') + '"?',
      '<div class="aviso"><b>Isto apaga o cadastro de vez</b>'
    + (junto.length ? ', e leva junto <b>' + esc(junto.join(' e ')) + '</b>' : '')
    + '. Não tem como desfazer.</div>'
    + '<p class="nota">Se o cliente tiver OS, negócio ou proposta, o TapFlow vai recusar — '
    + 'nesse caso o caminho é <b>Arquivar</b>, que tira ele das listas e mantém o histórico.</p>'
    + '<div class="campo"><label for="xcMot">Por que está excluindo?</label>'
    + '<input id="xcMot" type="text" autocomplete="off" name="xc_nofill" '
    + 'placeholder="ex.: cadastro repetido, criado por engano"></div>'
    + '<div class="dica" id="xcMsg" style="color:var(--crit)"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Excluir cliente', pri:true, onClick: async () => {
        const msg = document.getElementById('xcMsg');
        const mot = (document.getElementById('xcMot').value || '').trim();
        if (mot.length < 4){ msg.textContent = 'Escreva o motivo — ele fica no livro das exclusões.'; return; }
        try{
          if (DEMO) throw new Error('Modo demonstração: nada é excluído.');
          const r = await rpc('tf_excluir_cliente', { p_id: cli.id, p_motivo: mot });
          if (r && r.status === 'recusado'){
            // a recusa vem explicada pelo banco, e ela manda ARQUIVAR —
            // então o botão de arquivar aparece aqui mesmo, não duas telas atrás
            msg.innerHTML = '';
            const cx = document.createElement('div');
            cx.className = 'aviso';
            cx.textContent = r.mensagem || 'O TapFlow recusou a exclusão.';
            const b = document.createElement('button');
            b.className = 'btn'; b.type = 'button';
            b.style.cssText = 'margin-top:10px';
            b.textContent = 'Arquivar em vez de excluir';
            b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
              try{
                await rpc('tf_arquivar', { p_tabela:'clientes', p_id: cli.id, p_ativo: false });
                fecharModal();
                toast('Cliente arquivado — saiu das listas, o histórico ficou.','ok');
                cadSel = null; await pintarCadastros();
              }catch(e){ msg.textContent = e.message; }
            }));
            cx.appendChild(document.createElement('br'));
            cx.appendChild(b);
            msg.appendChild(cx);
            return;
          }
          fecharModal();
          toast('Cliente excluído. O motivo ficou no livro das exclusões.','ok');
          cadSel = null;
          await pintarCadastros();
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

// ── ITEM 8 (S31): OS DADOS PÚBLICOS DO CNPJ ─────────────────────────────────
// Metade da ficha de um cliente novo é digitação de coisa que já está pública
// no cartão CNPJ. O botão consulta e preenche; o vendedor confere e salva.
//
// TRÊS DECISÕES:
//
//  · O SERVIÇO é a BrasilAPI (`brasilapi.com.br`). O Bruno não tem preferência
//    e a escolha ficou comigo: é gratuita, não pede cadastro nem chave (chave
//    num arquivo que vai para o GitHub Pages seria chave pública), responde
//    com CORS liberado — sem isso o navegador nem tenta — e lê da base da
//    Receita. Se um dia ela sair do ar, trocar é mexer só em `_CNPJ_URL` e no
//    `_cnpjMapear` aqui embaixo.
//
//  · NADA É APAGADO POR CAMPO VAZIO. O que a consulta não trouxer fica como
//    estava na tela. Consulta incompleta não pode limpar o endereço que
//    alguém conferiu por telefone.
//
//  · TELEFONE E E-MAIL NÃO ENTRAM NA FICHA. Eles moram em Contatos, que tem
//    nome e papel (quem aprova, quem agenda, quem recebe a nota) — o telefone
//    da Receita é o da portaria. A tela mostra o que veio, para o vendedor
//    cadastrar o contato com aquilo à mão.
const _CNPJ_URL = 'https://brasilapi.com.br/api/cnpj/v1/';
let _cnpjConsultado = null;   // quando a consulta rodou; vai no salvar

const _soDigitos = v => String(v || '').replace(/\D/g, '');

/** O que a resposta vira na ficha. Isolado porque é o único ponto que sabe o
 *  formato do serviço — trocar de fornecedor é reescrever só isto. */
function _cnpjMapear(j){
  const rua = [j.descricao_tipo_de_logradouro, j.logradouro]
    .filter(x => x && String(x).trim()).join(' ').trim();
  return {
    razao_social: j.razao_social,
    nome_fantasia: j.nome_fantasia,
    endereco: rua || null,
    numero: j.numero,
    complemento: j.complemento,
    bairro: j.bairro,
    cidade: j.municipio,
    uf: j.uf,
    cep: _soDigitos(j.cep).replace(/^(\d{5})(\d{3})$/, '$1-$2') || null,
    situacao_cadastral: j.descricao_situacao_cadastral,
    cnae: j.cnae_fiscal ? String(j.cnae_fiscal) : null,
    cnae_descricao: j.cnae_fiscal_descricao,
    natureza_juridica: j.natureza_juridica,
    data_abertura: j.data_inicio_atividade || null,
    _telefone: j.ddd_telefone_1 || null,
    _email: j.email || null
  };
}

async function buscarDadosCnpj(botao){
  const inp = document.getElementById('clCnpj');
  const msg = document.getElementById('clCnpjMsg');
  const doc = _soDigitos(inp && inp.value);
  const dizer = (html, erro) => {
    if (!msg) return;
    msg.innerHTML = '<div class="cnpjCx' + (erro ? ' erro' : '') + '">' + html + '</div>';
  };
  if (doc.length !== 14){
    dizer('Digite o CNPJ completo (14 números) antes de buscar.', true); return;
  }
  botao.disabled = true;
  const rot = botao.textContent;
  botao.textContent = 'Buscando…';
  dizer('Consultando a Receita…');
  try{
    const r = await fetch(_CNPJ_URL + doc, { headers: { 'Accept': 'application/json' } });
    if (r.status === 404) throw new Error('A Receita não tem esse CNPJ. Confira os números.');
    if (r.status === 429) throw new Error('O serviço de consulta pediu para esperar um pouco. Tente de novo em um minuto.');
    if (!r.ok) throw new Error('O serviço de consulta respondeu ' + r.status + '.');
    const j = await r.json();
    const d = _cnpjMapear(j);

    // preenche o que veio; o que não veio fica como está
    const por = { clNome:'razao_social', clFant:'nome_fantasia', clEnd:'endereco',
                  clNum:'numero', clBai:'bairro', clCompl:'complemento',
                  clCid:'cidade', clUf:'uf', clCep:'cep', clSit:'situacao_cadastral',
                  clCnae:'cnae', clCnaeD:'cnae_descricao', clNat:'natureza_juridica',
                  clAber:'data_abertura' };
    let n = 0;
    Object.keys(por).forEach(id => {
      const v = d[por[id]];
      const el = document.getElementById(id);
      if (el && v != null && String(v).trim() !== ''){ el.value = String(v).trim(); n++; }
    });
    // o CNPJ volta formatado, como no cartão
    if (inp) inp.value = doc.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    _cnpjConsultado = new Date().toISOString();

    const alerta = d.situacao_cadastral && !/ativa/i.test(d.situacao_cadastral)
      ? '<br><b style="color:var(--crit)">Atenção: a situação cadastral é '
        + esc(d.situacao_cadastral) + '.</b> Vale confirmar antes de emitir proposta ou nota.'
      : '';
    const contato = (d._telefone || d._email)
      ? '<br>Veio também ' + [d._telefone ? '<b>' + esc(d._telefone) + '</b>' : null,
                             d._email ? '<b>' + esc(d._email) + '</b>' : null]
          .filter(Boolean).join(' e ')
        + '. Telefone e e-mail moram em <b>Contatos</b>, aqui embaixo, porque pertencem a uma '
        + '<i>pessoa</i> — copie para lá se forem de alguém.'
      : '';
    dizer(n + ' campo(s) preenchido(s) pela consulta. <b>Confira e clique em Salvar cliente</b> — '
      + 'nada foi gravado ainda, e tudo continua editável.' + alerta + contato);
  }catch(e){
    dizer('Não deu para consultar: ' + esc(e.message)
      + '<br>Dá para preencher à mão normalmente — a consulta é um atalho, não um caminho obrigatório.', true);
  }finally{
    botao.disabled = false; botao.textContent = rot;
  }
}

// ── CONTATOS ────────────────────────────────────────────────────────────────
// ITEM 11 (S28): a tela mostra TODOS os papéis — os quatro que existiam, o
// "agenda" do S17 (que é o "Resp. Agendamento" pedido no documento) e os três
// novos. Como agora nada fica escondido, a lista inteira vai para
// `tf_gravar_contato`. A regra do S17 continua valendo ("tela que não mostra
// um dado não pode apagá-lo") — ela só deixou de ser necessária aqui.
// A ordem da lista é a ordem em que aparecem na ficha e no formulário.
const PAPEIS_CONTATO = [
  ['aprova','Aprova propostas','aprova proposta'],
  ['agenda','Resp. Agendamento','agendamento'],
  ['comercial','Comercial (emite o pedido)','comercial'],
  ['financeiro','Financeiro','financeiro'],
  ['paga','Paga','paga'],
  ['recebe','Recebe','recebe'],
  ['seg_trabalho','Seg. Trabalho','seg. trabalho'],
  ['tecnico','Técnico','técnico'],
];
const _PAPEL_ROT = Object.fromEntries(PAPEIS_CONTATO.map(p => [p[0], p[2]]));

function pintarContatos(cli, contatos){
  const el = document.getElementById('clContatos');
  if (!el) return;
  let h = '<div class="secTit">Contatos</div>';
  if (!contatos.length){
    h += '<p class="nota">Nenhum contato. O contato que APROVA é obrigatório na hora de '
      +  'registrar a aprovação; o responsável pelo AGENDAMENTO é quem o campo procura para marcar a visita.</p>';
  }
  contatos.forEach(x => {
    const ordem = PAPEIS_CONTATO.map(p => p[0]);
    const ps = (x.papeis||[]).slice().sort((a,b) => ordem.indexOf(a) - ordem.indexOf(b)).map(p =>
      '<span class="mini' + (p==='aprova'?' ok':(p==='agenda'?' ag':'')) + '">'
      + esc(_PAPEL_ROT[p] || p) + '</span>').join('');
    h += '<div class="linhaCt"><div><b>' + esc(x.nome) + '</b>'
      + '<small style="display:block;color:var(--ink-3);font-size:12px">'
      + esc([x.cargo, x.telefone, x.email].filter(Boolean).join(' · ') || 'sem telefone nem e-mail')
      + '</small></div>'
      + '<div class="papeis">' + ps
      + '<button class="btn mini" type="button" data-ct="' + esc(x.id) + '">Editar</button></div></div>';
  });
  h += '<button class="btn" id="ctNovo" style="width:100%;padding:9px;margin:12px 0 20px">'
    +  'Adicionar contato</button>';
  el.innerHTML = h;

  el.querySelectorAll('[data-ct]').forEach(b => b.addEventListener('click',
    () => modalContato(cli, contatos.find(x => x.id === b.dataset.ct))));
  document.getElementById('ctNovo').addEventListener('click', () => modalContato(cli, null));
}

function modalContato(cli, ct){
  const p = (ct && ct.papeis) || [];
  // papel que o banco tem e esta tela não conhece (um dia pode existir) não
  // some ao salvar: vai junto, do jeito que veio
  const conhecidos = PAPEIS_CONTATO.map(x => x[0]);
  const outros = p.filter(x => !conhecidos.includes(x));
  abrirModal(ct ? 'Contato de ' + nomeCliente(cli) : 'Novo contato de ' + nomeCliente(cli),
      '<div class="campo"><label for="ctN">Nome</label><input id="ctN" type="text" value="'
    +   esc(ct ? ct.nome : '') + '" autocomplete="off" name="ctn_nofill"></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="ctT">Telefone</label><input id="ctT" type="text" value="'
    +   esc(ct ? ct.telefone : '') + '" autocomplete="off" name="ctt_nofill"></div>'
    +  '<div class="campo"><label for="ctE">E-mail</label><input id="ctE" type="text" value="'
    +   esc(ct ? ct.email : '') + '" autocomplete="off" name="cte_nofill"></div></div>'
    + '<div class="campo"><label for="ctC">Cargo</label><input id="ctC" type="text" value="'
    +   esc(ct ? ct.cargo : '') + '" autocomplete="off" name="ctc_nofill"></div>'
    + '<div class="secTit">O que esta pessoa faz</div>'
    + '<p class="nota" style="margin-top:-4px">Pode marcar mais de um.</p>'
    + '<div class="papeisGrade">' + PAPEIS_CONTATO.map(([k, rot]) =>
        '<label class="chk"><input type="checkbox" data-papel="' + k + '"'
        + (p.includes(k) ? ' checked' : '') + '> ' + esc(rot) + '</label>').join('') + '</div>'
    + (outros.length
        ? '<p class="nota">Esta pessoa também é: <b>' + esc(outros.join(', '))
          + '</b>. Isso não se edita por aqui e <b>não</b> se perde ao salvar.</p>'
        : ''),
    [{ label:'Cancelar', onClick: fecharModal },
     { label: ct ? 'Salvar' : 'Adicionar', pri:true, onClick: async () => {
        const v = id => (document.getElementById(id)||{}).value.trim();
        if (!v('ctN')){ toast('O nome do contato é obrigatório.','err'); return; }
        const marcados = [...document.querySelectorAll('#modal [data-papel]:checked')]
                           .map(x => x.dataset.papel).concat(outros);
        try{
          if (DEMO) demoSalvarContato(cli.id, ct && ct.id, v('ctN'), marcados);
          else await rpc('tf_gravar_contato', { p_id: ct ? ct.id : null, p_cliente_id: cli.id,
            p_nome: v('ctN'), p_email: v('ctE') || null, p_telefone: v('ctT') || null,
            p_cargo: v('ctC') || null, p_papeis: marcados });
          fecharModal(); toast('Contato salvo.','ok'); detalheCliente(cli);
        }catch(e){ toast(e.message,'err'); }
     }}]);
}

/* ════════════════════════════════════════════════════════════════════════════
   ITEM 2 (S34) · IMPORTAR OS VENCIMENTOS DO TAPWEB
   ----------------------------------------------------------------------------
   O TapWeb continua sendo a fonte de verdade dos vasos. Isto aqui traz para o
   TapFlow só o que a PROPOSTA precisa saber: o nome do equipamento e as quatro
   datas. Sob demanda, quando o vendedor vai orçar — não há sincronização
   periódica, e é de propósito: um segundo cadastro de vasos para manter em dia
   é exatamente o que esta decisão evita.

   ⚠ POR QUE O UPLOAD ENTRA PELA FICHA DE UM CLIENTE, E NUNCA SOLTO
   A planilha do TapWeb NÃO TEM nenhuma coluna com nome ou CNPJ da empresa
   (conferido na planilha de referência: Tag, Status, Data Desativação, as
   quatro datas, Setor, Local, Categoria, Tipo Fluido, Volume, Unidade Medida,
   PMTA, Unidade Medida PMTA, Observação). Não existe como o sistema conferir
   sozinho que o arquivo é daquele cliente. A segurança vem do FLUXO: quem
   importa já está dentro da ficha de um cliente específico — e a prévia diz o
   nome dele em cima, antes de qualquer gravação.

   ⚠ E POR QUE O LEITOR É ESCRITO AQUI, SEM BIBLIOTECA NOVA
   O TapFlow já ESCREVE .xlsx à mão, com o JSZip, nos relatórios (`relXLSX`).
   Ler é o mesmo caminho ao contrário: descompactar, pegar a primeira planilha
   e a tabela de textos compartilhados. Uma biblioteca de leitura de planilha
   a mais no CDN seria ~400 KB para fazer o que 60 linhas fazem — e uma
   dependência a mais para cair no dia em que o Fernando precisar importar.
   ════════════════════════════════════════════════════════════════════════════ */

/** Os nomes de coluna que o TapWeb usa hoje, e os sinônimos que já vi. A
    comparação é sem acento, sem caixa e sem pontuação: "Inspeção Interna",
    "INSPECAO INTERNA" e "Inspecao_Interna" são a mesma coluna. */
const TW_COLUNAS = {
  tag:        ['tag', 'tag equipamento', 'tag do equipamento'],
  nome:       ['nome', 'nome equipamento', 'nome do equipamento', 'equipamento', 'descricao'],
  interna:    ['inspecao interna', 'insp interna', 'inspecao int'],
  externa:    ['inspecao externa', 'insp externa', 'inspecao ext'],
  manometro:  ['calibracao manometro', 'calib manometro', 'calibracao de manometro'],
  valvula:    ['calibracao valvula', 'calib valvula', 'calibracao de valvula',
               'calibracao valvula de seguranca'],
  desativado: ['data desativacao', 'desativacao', 'data de desativacao']
};
const TW_DATAS = ['interna', 'externa', 'manometro', 'valvula', 'desativado'];

const _twNorm = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

/** Número de série do Excel → AAAA-MM-DD. O epoch é 30/12/1899 por causa do
    ano bissexto de 1900 que o Lotus inventou e o Excel copiou — usar
    31/12/1899 erra um dia em tudo que vier depois de fevereiro de 1900. */
function _twSerialParaISO(n){
  const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
  if (!isFinite(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

/** Aceita serial do Excel, "AAAA-MM-DD", "DD/MM/AAAA" e célula vazia.
    Data que não se entende NÃO vira nulo calado: devolve undefined, e quem
    chama conta a linha como problema. */
function _twData(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' || /^\d+([.,]\d+)?$/.test(String(v).trim())){
    const n = Number(String(v).replace(',', '.'));
    // 20000 ≈ 1954, 80000 ≈ 2119: fora disso não é data, é outra coisa
    if (n >= 20000 && n <= 80000) return _twSerialParaISO(n);
    return undefined;
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m){
    const a = m[3].length === 2 ? '20' + m[3] : m[3];
    return a + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
  }
  return undefined;
}

/* Desescapa o texto do XML. ⚠ Isto NÃO é firula: a planilha que veio do
   TapWeb foi escrita por um gerador de servidor, e geradores assim escrevem
   acento como REFERÊNCIA NUMÉRICA (`&#231;`), não como UTF-8 cru. Sem
   decodificar, "Inspeção Externa" chega como "Inspe&#231;&#227;o Externa" e
   NENHUMA coluna de vencimento é reconhecida — a leitura "funciona", acha a
   Tag, e recusa dizendo que é outro relatório. Foi exatamente o que aconteceu
   no primeiro teste desta rodada, com um .xlsx de verdade.
   O `&amp;` vem por último, senão "&amp;lt;" viraria "<". */
const _xmlTexto = t => String(t == null ? '' : t)
  .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
  .replace(/&#(\d+);/g,          (_, d) => String.fromCodePoint(parseInt(d, 10)))
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
  .replace(/&amp;/g, '&');

/** .xlsx → matriz de linhas (array de arrays de string/number). */
async function _lerXLSX(file){
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(file);

  const textoDe = async nome => {
    const f = zip.file(nome);
    return f ? f.async('string') : null;
  };
  // os textos compartilhados: o .xlsx guarda cada string uma vez e referencia
  const ssXml = await textoDe('xl/sharedStrings.xml');
  const compart = [];
  if (ssXml){
    (ssXml.match(/<si>[\s\S]*?<\/si>/g) || []).forEach(si => {
      compart.push(_xmlTexto((si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [])
        .map(t => t.replace(/<[^>]+>/g, '')).join('')));
    });
  }

  // a PRIMEIRA planilha, pela ordem das relações do workbook — não por
  // "sheet1.xml", que nem sempre é a primeira aba
  const wbXml  = await textoDe('xl/workbook.xml');
  const relXml = await textoDe('xl/_rels/workbook.xml.rels');
  let alvo = 'xl/worksheets/sheet1.xml';
  if (wbXml && relXml){
    const rid = (wbXml.match(/<sheet[^>]*r:id="([^"]+)"/) || [])[1];
    if (rid){
      const re = new RegExp('<Relationship[^>]*Id="' + rid + '"[^>]*Target="([^"]+)"');
      const alvoRel = (relXml.match(re) || [])[1];
      if (alvoRel) alvo = 'xl/' + alvoRel.replace(/^\/?xl\//, '').replace(/^\//, '');
    }
  }
  const wsXml = await textoDe(alvo) || await textoDe('xl/worksheets/sheet1.xml');
  if (!wsXml) throw new Error('Não achei nenhuma planilha dentro do arquivo.');

  const colDe = ref => {
    let n = 0;
    for (const ch of String(ref).replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };
  const linhas = [];
  (wsXml.match(/<row[\s\S]*?<\/row>|<row[^>]*\/>/g) || []).forEach(row => {
    const cels = [];
    (row.match(/<c[\s\S]*?<\/c>|<c[^>]*\/>/g) || []).forEach(c => {
      const ref = (c.match(/ r="([A-Z]+\d+)"/) || [])[1];
      const tipo = (c.match(/ t="([^"]+)"/) || [])[1];
      let v = null;
      if (tipo === 'inlineStr'){
        v = _xmlTexto((c.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1] || '');
      } else {
        const bruto = (c.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
        if (bruto == null) v = null;
        else if (tipo === 's') v = compart[Number(bruto)] != null ? compart[Number(bruto)] : '';
        else v = /^-?\d+(\.\d+)?$/.test(bruto) ? Number(bruto) : bruto;
      }
      cels[ref ? colDe(ref) : cels.length] = v;
    });
    linhas.push(cels);
  });
  return linhas;
}

/** .csv → matriz de linhas. Separador descoberto pela primeira linha (o Excel
    brasileiro salva com ponto-e-vírgula), aspas tratadas, BOM removido. */
function _lerCSV(texto){
  const t = texto.replace(/^﻿/, '');
  const prim = (t.split(/\r?\n/)[0] || '');
  const sep = (prim.split(';').length > prim.split(',').length) ? ';' : ',';
  const linhas = [];
  let campo = '', linha = [], aspas = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (aspas){
      if (ch === '"' && t[i+1] === '"'){ campo += '"'; i++; }
      else if (ch === '"') aspas = false;
      else campo += ch;
    } else if (ch === '"') aspas = true;
    else if (ch === sep){ linha.push(campo); campo = ''; }
    else if (ch === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if (ch !== '\r') campo += ch;
  }
  if (campo !== '' || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas;
}

/** O arquivo inteiro → { itens, problemas }. Recusa ANTES de mandar qualquer
    coisa ao banco quando falta a coluna da TAG ou as quatro datas. */
async function lerPlanilhaTapWeb(file){
  const nome = (file.name || '').toLowerCase();
  let linhas;
  if (nome.endsWith('.csv') || nome.endsWith('.txt')){
    linhas = _lerCSV(await file.text());
  } else if (nome.endsWith('.xlsx')){
    linhas = await _lerXLSX(file);
  } else {
    throw new Error('Use o arquivo como o TapWeb exporta: .xlsx ou .csv. '
                  + '(.xls antigo não abre aqui — salve como .xlsx no Excel.)');
  }

  // o cabeçalho pode não estar na primeira linha: o relatório do TapWeb às
  // vezes sai com título e uma linha em branco antes
  let iCab = -1, mapa = null;
  for (let i = 0; i < Math.min(linhas.length, 12); i++){
    const m = {};
    (linhas[i] || []).forEach((cel, j) => {
      const n = _twNorm(cel);
      if (!n) return;
      for (const chave of Object.keys(TW_COLUNAS)){
        if (m[chave] == null && TW_COLUNAS[chave].includes(n)) m[chave] = j;
      }
    });
    if (m.tag != null){ iCab = i; mapa = m; break; }
  }
  if (iCab < 0){
    throw new Error('Não achei a coluna "Tag" na planilha. É ela que casa cada linha '
                  + 'com o equipamento do cadastro — sem ela não dá para importar.');
  }
  const faltando = ['interna','externa','manometro','valvula']
    .filter(k => mapa[k] == null)
    .map(k => ({ interna:'Inspeção Interna', externa:'Inspeção Externa',
                 manometro:'Calibração Manômetro', valvula:'Calibração Válvula' })[k]);
  if (faltando.length === 4){
    throw new Error('A planilha tem a Tag, mas nenhuma das quatro colunas de vencimento '
                  + '(Inspeção Interna, Inspeção Externa, Calibração Manômetro, '
                  + 'Calibração Válvula). É outro relatório do TapWeb?');
  }

  const itens = [], problemas = [];
  for (let i = iCab + 1; i < linhas.length; i++){
    const l = linhas[i] || [];
    const tag = String(l[mapa.tag] == null ? '' : l[mapa.tag]).trim();
    if (!tag) continue;
    const it = { tag };
    if (mapa.nome != null){
      const nm = String(l[mapa.nome] == null ? '' : l[mapa.nome]).trim();
      if (nm) it.nome = nm;
    }
    TW_DATAS.forEach(k => {
      if (mapa[k] == null) return;
      const d = _twData(l[mapa[k]]);
      if (d === undefined){
        problemas.push('Linha ' + (i + 1) + ' (' + tag + '): não entendi a data "'
                     + l[mapa[k]] + '".');
      } else if (d) it[k] = d;
    });
    itens.push(it);
  }
  if (!itens.length){
    throw new Error('A planilha foi lida, mas nenhuma linha tem TAG preenchida.');
  }
  return { itens, problemas, faltando };
}

/** A prévia e a gravação — as duas pela MESMA função do banco. */
async function importarTapWeb(cli, file, botao){
  let lido;
  try{ lido = await lerPlanilhaTapWeb(file); }
  catch(e){ toast(e.message, 'err'); return; }

  let p;
  try{ p = await rpc('tf_importar_equipamentos_tapweb',
         { p_cliente_id: cli.id, p_itens: lido.itens, p_confirmado: false }); }
  catch(e){ toast(e.message, 'err'); return; }

  // ── quando pedir uma segunda confirmação, mais explícita ─────────────────
  // O documento pede "em upload que muda uma fração grande do cadastro" e não
  // define a fração. Duas situações, e a segunda é a que importa mais:
  //   · zera as datas de mais de um terço do que o cliente tem cadastrado;
  //   · NENHUMA TAG da planilha bate com o cadastro e o cliente já tem 3 ou
  //     mais equipamentos — o sinal clássico de planilha da empresa errada.
  const jaTem = Number(p.ja_cadastrados) || 0;
  const forte = (Number(p.zerados) > jaTem / 3 && jaTem >= 3)
             || (Number(p.atualizados) === 0 && jaTem >= 3);

  const lista = (p.sem_planilha || []).map(x =>
    '<div class="lin"><span>' + esc(x.tag) + (x.nome ? ' · ' + esc(x.nome) : '') + '</span></div>').join('');

  const corpo =
      '<p style="margin-top:0">Planilha lida para <b>' + esc(p.cliente) + '</b>.</p>'
    + (forte
        ? '<div class="aviso"><b>Confira o cliente antes de continuar.</b> '
          + (Number(p.atualizados) === 0
              ? 'Nenhuma das TAGs desta planilha existe no cadastro de <b>' + esc(p.cliente)
                + '</b>, que já tem ' + jaTem + ' equipamento(s). Isso costuma ser planilha '
                + 'de outra empresa.'
              : 'Este upload zera as datas de <b>' + p.zerados + '</b> dos ' + jaTem
                + ' equipamentos cadastrados.')
          + '</div>'
        : '')
    + '<div class="blocoLocal">'
    +   '<div class="lin"><span class="rot">Linhas na planilha</span><span>' + p.linhas + '</span></div>'
    +   '<div class="lin"><span class="rot">Equipamentos novos</span><span>' + p.novos + '</span></div>'
    +   '<div class="lin"><span class="rot">Já existem, vão ser atualizados</span><span>' + p.atualizados + '</span></div>'
    +   '<div class="lin"><span class="rot">Desativados no TapWeb</span><span>' + p.desativados + '</span></div>'
    +   '<div class="lin"><span class="rot">Somem da planilha e perdem as datas</span><span>' + p.zerados + '</span></div>'
    + '</div>'
    + (lista
        ? '<div class="secTit">Não vieram nesta planilha</div>'
          + '<p class="nota">Estes perdem as quatro datas e <b>deixam de aparecer como '
          + 'pendência</b> na montagem da proposta. O registro continua ativo, com todo o '
          + 'histórico — o importador não arquiva nem exclui ninguém. Arquivar continua '
          + 'sendo decisão sua, aqui na ficha.</p>'
          + '<div class="listaItens">' + lista + '</div>'
        : '')
    + (lido.faltando && lido.faltando.length
        ? '<p class="dica aviso">A planilha não traz a(s) coluna(s): '
          + esc(lido.faltando.join(', ')) + '. Esse(s) vencimento(s) ficam em branco.</p>'
        : '')
    + (lido.problemas.length
        ? '<div class="secTit">Datas que não entendi</div>'
          + '<p class="nota">Estas ficam em branco; o resto da linha entra normalmente.</p>'
          + '<div class="listaItens">' + lido.problemas.slice(0, 20).map(t =>
              '<div class="lin"><span>' + esc(t) + '</span></div>').join('') + '</div>'
        : '')
    + '<p class="nota">A coluna <b>Status</b> (Vencido/Em dia) da planilha é ignorada: '
    + 'ela existe no TapWeb para o cliente ver. Aqui vencido e em dia saem das datas.</p>'
    + (forte
        ? '<div class="campo"><label for="twOk">Para continuar, digite <b>CONFIRMO</b></label>'
          + '<input id="twOk" type="text" autocomplete="off" placeholder="CONFIRMO"></div>'
        : '');

  const r = await confirmar('Importar do TapWeb', corpo,
              'Atualizar ' + p.linhas + ' equipamento(s)', forte, forte ? 'twOk' : null);
  if (!r) return;
  if (forte && _twNorm(r.texto) !== 'confirmo'){
    toast('Não importei: a confirmação não foi digitada.', 'err'); return;
  }

  try{
    const g = await rpc('tf_importar_equipamentos_tapweb',
      { p_cliente_id: cli.id, p_itens: lido.itens, p_confirmado: true });
    toast(g.novos + ' novo(s), ' + g.atualizados + ' atualizado(s), '
        + g.zerados + ' sem data.', 'ok');
    detalheCliente(cli);
  }catch(e){ toast(e.message, 'err'); }
}

function pintarEquipamentos(cli, equips){
