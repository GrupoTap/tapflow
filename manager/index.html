// CATÁLOGO
// ----------------------------------------------------------------------------
// O formulário NÃO é escrito aqui. Ele é montado a partir de
// `catalogo_familias.campos`, que vem do banco. Acrescentar um campo em
// válvulas — ou uma família inteira — é um UPDATE no banco, e a tela passa a
// mostrar. Sem app novo, sem esperar por mim.
// ════════════════════════════════════════════════════════════════════════════
// Busca sem acento e sem caixa: em campo ninguém digita "válvula" com acento,
// e o item não pode sumir por causa disso.
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let CAT_FAM = [];          // famílias, com a descrição dos campos
let catFamSel = null;      // família aberta na tela
let catEdit = null;        // item em edição (null = novo)

async function carregarFamilias(){
  if (CAT_FAM.length) return CAT_FAM;
  CAT_FAM = DEMO ? demoFamilias()
    : await get('catalogo_familias?select=*&ativo=eq.true&order=ordem');
  return CAT_FAM;
}

async function pintarCatalogo(){
  visao = 'cat';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="cadWrap">'
    + '<div class="painel"><h3>Catálogo</h3>'
    +   '<div id="catFams" class="chips"></div>'
    +   '<div class="campo" style="margin:10px 0 6px"><input id="catBusca" type="text" '
    +     'placeholder="Buscar por descrição, marca, modelo ou código"></div>'
    +   '<div class="lista" id="catLista"></div></div>'
    + '<div class="painel" id="catDet"></div></div>';

  await carregarFamilias();

  const chips = document.getElementById('catFams');
  chips.innerHTML = '';
  const todas = [{ id:null, nome_plural:'Todas', icone:'' }].concat(CAT_FAM);
  todas.forEach(f => {
    const b = document.createElement('button');
    b.className = 'fchip' + (catFamSel === f.id ? ' on' : '');
    b.textContent = (f.icone ? f.icone + ' ' : '') + f.nome_plural;
    b.addEventListener('click', () => { catFamSel = f.id; pintarCatalogo(); });
    chips.appendChild(b);
  });

  document.getElementById('catBusca').addEventListener('input', debounce(listarCatalogo, 250));
  await listarCatalogo();
  formCatalogo(null);
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };

async function listarCatalogo(){
  const el = document.getElementById('catLista');
  if (!el) return;
  const termo = (document.getElementById('catBusca')||{}).value || '';

  // A família filtra no servidor; o texto filtra aqui. O catálogo tem centenas
  // de itens, não milhões — e filtrar aqui deixa a busca igual à do celular,
  // sem acento e por palavra solta.
  let itens = [];
  try{
    if (DEMO) itens = demoCatalogo(catFamSel, '');
    else {
      let q = 'v_catalogo?select=*&order=familia_ordem,codigo';
      if (catFamSel) q += '&familia_id=eq.' + catFamSel;
      itens = await get(q);
    }
  }catch(e){ toast(e.message,'err'); return; }

  const termos = norm(termo).trim().split(/\s+/).filter(Boolean);
  if (termos.length){
    itens = itens.filter(i => {
      const alvo = norm([i.descricao, i.marca, i.modelo, i.codigo, i.familia,
        Object.values(i.especificacoes||{}).join(' ')].join(' '));
      return termos.every(w => alvo.includes(w));
    });
  }

  el.innerHTML = '';
  if (!itens.length){
    el.innerHTML = '<p style="font-size:13px;color:var(--ink-3)">'
      + (termo ? 'Nada encontrado para “' + esc(termo) + '”.' : 'Nenhum item nesta família ainda.')
      + '</p>';
    return;
  }
  itens.forEach(i => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (catEdit && catEdit.id === i.id ? ' on' : '') + (i.ativo ? '' : ' off');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = (i.ativo ? '' : '📦 ') + i.descricao;
    const partes = [i.codigo];
    if (i.marca || i.modelo) partes.push([i.marca, i.modelo].filter(Boolean).join(' '));
    if (i.preco_referencia) partes.push(BRL(i.preco_referencia));
    if (i.vezes_usado) partes.push(i.vezes_usado + '× usado');
    if (!i.ativo) partes.push('arquivado');
    b.querySelector('small').textContent = partes.join(' · ');
    b.addEventListener('click', () => formCatalogo(i));
    el.appendChild(b);
  });
}

// ── formulário: os campos vêm da família ────────────────────────────────────
function formCatalogo(item){
  catEdit = item;
  const d = document.getElementById('catDet');
  if (!d) return;

  const famId = item ? item.familia_id : (catFamSel || (CAT_FAM[0]||{}).id);
  const fam = CAT_FAM.find(f => f.id === famId) || { campos: [] };
  const espec = (item && item.especificacoes) || {};

  let h = '<h3>' + (item ? esc(item.codigo) + ' · editar' : 'Novo item de catálogo') + '</h3>';

  if (!item){
    h += '<div class="campo"><label for="fFam">Família</label><select id="fFam">'
      + CAT_FAM.map(f => '<option value="' + f.id + '"' + (f.id===famId?' selected':'') + '>'
          + esc(f.nome) + '</option>').join('') + '</select></div>';
  }

  h += '<div class="campo"><label for="fDesc">Descrição</label>'
    +  '<input id="fDesc" type="text" value="' + esc(item ? item.descricao : '') + '"></div>'
    +  '<div class="dupla">'
    +    '<div class="campo"><label for="fMarca">Marca</label><input id="fMarca" type="text" value="'
    +      esc(item ? (item.marca||'') : '') + '"></div>'
    +    '<div class="campo"><label for="fModelo">Modelo</label><input id="fModelo" type="text" value="'
    +      esc(item ? (item.modelo||'') : '') + '"></div></div>';

  // os campos técnicos da família
  if (fam.campos && fam.campos.length){
    h += '<div class="secTit">Detalhes técnicos</div><div class="grelha">';
    fam.campos.forEach(c => {
      const v = espec[c.chave];
      const id = 'esp_' + c.chave;
      h += '<div class="campo"><label for="' + id + '">' + esc(c.rotulo) + '</label>';
      if (c.tipo === 'lista'){
        h += '<select id="' + id + '" data-esp="' + esc(c.chave) + '"><option value=""></option>'
          + (c.opcoes||[]).map(o => '<option' + (v===o?' selected':'') + '>' + esc(o) + '</option>').join('')
          + '</select>';
      } else if (c.tipo === 'booleano'){
        h += '<label class="chk"><input type="checkbox" id="' + id + '" data-esp="' + esc(c.chave) + '"'
          + (v ? ' checked' : '') + '> sim</label>';
      } else {
        h += '<input id="' + id + '" data-esp="' + esc(c.chave) + '" data-tipo="' + esc(c.tipo||'texto')
          + '" type="' + (c.tipo==='numero'?'number':'text') + '" step="any" value="'
          + esc(v==null?'':v) + '">';
      }
      h += '</div>';
    });
    h += '</div>';
  }

  h += '<div class="secTit">Campo e orçamento</div>'
    +  '<div class="dupla">'
    +   '<label class="chk"><input type="checkbox" id="fCalib"'
    +     (item && item.requer_calibracao ? ' checked':'') + '> Requer calibração</label>'
    +   '<label class="chk"><input type="checkbox" id="fLacre"'
    +     (item && item.requer_lacre ? ' checked':'') + '> Requer lacre</label></div>'
    +  '<div class="campo"><label for="fForn">Fornecedor padrão</label><input id="fForn" type="text" value="'
    +    esc(item ? (item.fornecedor_padrao||'') : '') + '"></div>'
    +  '<div class="dupla">'
    +   '<div class="campo"><label for="fCusto">Custo de referência</label><input id="fCusto" type="number" '
    +     'step="0.01" value="' + (item && item.custo_referencia != null ? item.custo_referencia : '') + '"></div>'
    +   '<div class="campo"><label for="fPreco">Preço de referência</label><input id="fPreco" type="number" '
    +     'step="0.01" value="' + (item && item.preco_referencia != null ? item.preco_referencia : '') + '"></div>'
    +  '</div>'
    +  '<p class="nota">Estes valores entram preenchidos quando o item é lançado em campo — '
    +  'para o orçamento começar de algum lugar. Continuam editáveis em cada OS.</p>'
    +  '<div class="campo"><label for="fObs">Observações</label><input id="fObs" type="text" value="'
    +    esc(item ? (item.observacoes||'') : '') + '"></div>';

  h += '<div class="linhaBtns">'
    +  '<button class="btn pri" id="fSalvar">' + (item ? 'Salvar alterações' : 'Adicionar ao catálogo') + '</button>';
  if (item){
    h += '<button class="btn" id="fNovo">Novo item</button>'
      +  '<button class="btn" id="fArquivar">' + (item.ativo ? 'Arquivar' : 'Reativar') + '</button>'
      +  '<button class="btn perigo" id="fExcluir">Excluir</button>';
  }
  h += '</div>';

  if (item && item.vezes_usado){
    h += '<p class="nota">Já lançado em <b>' + item.vezes_usado + '</b> item(ns) de OS. '
      +  'Por isso não pode ser excluído — arquivar tira ele da lista do campo e mantém as OS antigas certas.</p>';
  }

  d.innerHTML = h;

  const fs = document.getElementById('fFam');
  if (fs) fs.addEventListener('change', () => { catFamSel = fs.value; formCatalogo(null); });

  document.getElementById('fSalvar').addEventListener('click', salvarCatalogo);
  const bn = document.getElementById('fNovo');
  if (bn) bn.addEventListener('click', () => formCatalogo(null));
  const ba = document.getElementById('fArquivar');
  if (ba) ba.addEventListener('click', () => arquivarCatalogo(item));
  const bx = document.getElementById('fExcluir');
  if (bx) bx.addEventListener('click', () => excluirCatalogo(item));
}

function lerEspecificacoes(){
  const o = {};
  document.querySelectorAll('[data-esp]').forEach(el => {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.dataset.tipo === 'numero') v = el.value === '' ? null : Number(el.value);
    else v = el.value.trim() || null;
    if (v !== null && v !== '' && v !== false) o[el.dataset.esp] = v;
  });
  return o;
}

async function salvarCatalogo(e){
  const desc = document.getElementById('fDesc').value.trim();
  if (!desc){ toast('A descrição é obrigatória.','err'); return; }
  e.target.disabled = true;
  const num = id => { const v = document.getElementById(id).value; return v === '' ? null : Number(v); };
  const p = {
    p_id: catEdit ? catEdit.id : null,
    p_familia_id: catEdit ? catEdit.familia_id : document.getElementById('fFam').value,
    p_descricao: desc,
    p_marca:  document.getElementById('fMarca').value.trim()  || null,
    p_modelo: document.getElementById('fModelo').value.trim() || null,
    p_especificacoes: lerEspecificacoes(),
    p_requer_calibracao: document.getElementById('fCalib').checked,
    p_requer_lacre:      document.getElementById('fLacre').checked,
    p_fornecedor_padrao: document.getElementById('fForn').value.trim() || null,
    p_custo_referencia: num('fCusto'),
    p_preco_referencia: num('fPreco'),
    p_observacoes: document.getElementById('fObs').value.trim() || null
  };
  try{
    const r = DEMO ? demoSalvarCat(p) : await rpc('tf_salvar_item_catalogo', p);
    toast(catEdit ? 'Item atualizado.' : 'Item ' + (r.codigo||'') + ' adicionado.', 'ok');
    catEdit = null;
    await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
}

async function arquivarCatalogo(item){
  try{
    if (DEMO) demoArquivarCat(item); 
    else await rpc('tf_arquivar', { p_tabela:'catalogo_itens', p_id:item.id, p_ativo: !item.ativo });
    toast(item.ativo ? 'Item arquivado — sai da lista do campo.' : 'Item reativado.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function excluirCatalogo(item){
  if (!confirm('Excluir "' + item.descricao + '" do catálogo?\n\nIsso é definitivo. '
      + 'Se o item já foi usado em alguma OS, o sistema vai recusar e sugerir arquivar.')) return;
  try{
    const r = DEMO ? demoExcluirCat(item) : await rpc('tf_excluir_item_catalogo', { p_id: item.id });
    if (r && r.status === 'recusado'){ toast(r.mensagem, 'err'); return; }
    toast('Item excluído.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function pintarCadastros(){
  visao = 'cad';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="cadWrap">'
    + '<div class="painel"><h3>Clientes</h3><div id="cadForm"></div><div class="lista" id="cadLista"></div></div>'
    + '<div class="painel" id="cadDet"><p style="color:var(--ink-3);font-size:13.5px;margin:0">'
    + 'Escolha um cliente à esquerda para ver contatos e equipamentos.</p></div></div>';

  document.getElementById('cadForm').innerHTML =
    '<div class="dupla"><div class="campo"><label for="cN">Nome</label><input id="cN" type="text"></div>' +
    '<div class="campo"><label for="cC">CNPJ</label><input id="cC" type="text" placeholder="opcional"></div></div>' +
    '<button class="btn pri" id="cAdd" style="width:100%;padding:9px;margin-bottom:14px">Adicionar cliente</button>';

  document.getElementById('cAdd').addEventListener('click', async (e) => {
    const nome = document.getElementById('cN').value.trim();
    if (!nome){ toast('Informe o nome do cliente.','err'); return; }
    e.target.disabled = true;
    try{
      const cnpj = document.getElementById('cC').value.trim() || null;
      if (DEMO) demoAddCliente(nome, cnpj); else await post('clientes', { nome, cnpj });
      toast('Cliente cadastrado.','ok');
      pintarCadastros();
    }catch(err){
      toast(/duplicate|unique|ux_clientes/i.test(err.message)
        ? 'Já existe um cliente com esse CNPJ.' : err.message, 'err');
      e.target.disabled = false;
    }
  });

  let cli = [];
  try{ cli = DEMO ? demoClientes()
      : await get('clientes?select=id,nome,cnpj,contatos(count),equipamentos(count)&ativo=eq.true&order=nome'); }
  catch(e){ toast(e.message,'err'); }

  const lista = document.getElementById('cadLista');
  lista.innerHTML = '';
  if (!cli.length){
    lista.innerHTML = '<p style="font-size:13px;color:var(--ink-3)">Nenhum cliente ainda.</p>';
    return;
  }
  cli.forEach(c => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (cadSel === c.id ? ' on' : '');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = c.nome;
    const nc = (c.contatos && c.contatos[0] ? c.contatos[0].count : (c._contatos||0));
    const ne = (c.equipamentos && c.equipamentos[0] ? c.equipamentos[0].count : (c._equip||0));
    b.querySelector('small').textContent =
      (c.cnpj ? c.cnpj + ' · ' : '') + nc + ' contato(s) · ' + ne + ' equipamento(s)';
    b.addEventListener('click', () => { cadSel = c.id; pintarCadastros(); detalheCliente(c); });
    lista.appendChild(b);
  });
  const sel = cli.find(c => c.id === cadSel);
  if (sel) detalheCliente(sel);
}

      s.appendChild(r);

      papeis: document.getElementById('ctA').checked ? ['aprova'] : [] };

    catch(err){ toast(err.message,'err'); e.target.disabled = false; }

  bloco('Equipamentos', equips.map(x => ({ b:x.tag,
    s: [x.tipo, x.localizacao, x.pmta ? 'PMTA ' + x.pmta : ''].filter(Boolean).join(' · ') })),

    + '<button class="btn" id="eqAdd" style="width:100%;padding:9px">Adicionar equipamento</button>';

      pmta: document.getElementById('eqP').value ? Number(document.getElementById('eqP').value) : null };

        + 'As OS existentes continuam como estão, e dá para reativar depois.')) return;
    try{

      toast('Cliente arquivado.','ok'); cadSel = null; pintarCadastros();
    }catch(e){ toast(e.message,'err'); }

  document.getElementById('cliDel').addEventListener('click', async () => {
    if (!confirm('Excluir "' + c.nome + '" definitivamente?\n\n'

    try{

      toast('Cliente excluído.','ok'); cadSel = null; pintarCadastros();
    }catch(e){ toast(e.message,'err'); }
  });
}

  D_CAT = D_CAT.filter(y => y.id !== it.id);
  return {status:'ok'};
}
