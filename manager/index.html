// TELA: DOCUMENTOS — tudo que o TapFlow emitiu
// ----------------------------------------------------------------------------
// Antes, para achar uma proposta era preciso lembrar de qual OS ela saiu, abrir
// a OS e ir na aba. Aqui é uma lista só, com busca e filtro por tipo, cliente e
// mês. É a pergunta "que proposta eu mandei para a Gerdau em agosto?".
// ════════════════════════════════════════════════════════════════════════════
async function pintarDocumentos(){
  const board = document.getElementById('board');
  board.innerHTML = '<div class="tela"><div class="telaCab"><h2>Documentos</h2>'
    + '<p>Propostas e pedidos de compra emitidos pelo TapFlow.</p></div>'
    + '<div id="docTab"><p class="nota">Carregando…</p></div></div>';

  let props = [], peds = [];
  try{
    // era `demoDocs()`, que é a fixture da aba Configurações → Documentos e tem
    // outro formato: a tabela saía com número vazio e valor "—"
    [props, peds] = DEMO ? [demoDocsGerados(), demoPedidosDoc()] : await Promise.all([
      get('v_documentos_gerados?select=*&order=created_at.desc&limit=500'),
      get('v_pedidos_compra?select=*&order=emitido_em.desc&limit=500')
    ]);
  }catch(e){
    document.getElementById('docTab').innerHTML = '<div class="vazio2"><b>Não deu para carregar</b><p></p></div>';
    document.querySelector('#docTab p').textContent = e.message; return;
  }

  const linhas = []
    .concat((props||[]).map(d => ({
      tipo:'Proposta', numero:d.numero, cliente:d.cliente || '', os:d.os || '',
      quando:d.created_at, valor:d.valor_total, quem:d.quem || '',
      detalhe:d.modelo_titulo || d.natureza || '', os_id:d.os_id })))
    .concat((peds||[]).map(d => ({
      tipo:'Pedido de compra', numero:d.numero, cliente:d.cliente || '', os:d.os_numero || '',
      quando:d.emitido_em, valor:d.valor, quem:d.emitido_por_nome || '',
      detalhe:d.fornecedor || '', os_id:d.os_id })));
  linhas.sort((a,b) => String(b.quando||'').localeCompare(String(a.quando||'')));

  tfReg('doc', {
    unidade:'documentos',
    dados: () => linhas,
    consulta: () => BUSCA.doc || '',
    limparConsulta: () => { BUSCA.doc = ''; const i = document.getElementById('tbBusca'); if (i) i.value = ''; },
    textoBusca: r => [r.tipo, r.numero, r.cliente, r.os, r.detalhe, r.quem].join(' '),
    vazio:'Nenhum documento emitido ainda',
    vazioSub:'Propostas e pedidos aparecem aqui assim que forem gerados.',
    aoClicar: r => { if (r.os_id) abrirOSPorId(r.os_id); },
    colunas:[
      { k:'numero',  rot:'Número', larg:'130px', render:r => '<span class="mono forte">' + esc(r.numero) + '</span>' },
      { k:'tipo',    rot:'Tipo',   larg:'120px' },
      { k:'cliente', rot:'Cliente' },
      { k:'detalhe', rot:'Modelo / fornecedor' },
      { k:'os',      rot:'OS', larg:'120px', render:r => '<span class="mono">' + esc(r.os) + '</span>' },
      { k:'quem',    rot:'Emitido por', larg:'130px' },
      // sem `tipo:'num'`: Number('2026-09-04T…') é NaN, virava 0 em todas as
      // linhas e clicar em ordenar não mexia em nada. Texto ISO ordena certo.
      { k:'quando',  rot:'Data', larg:'92px', filtro:false, classe:'num',
        render:r => r.quando ? dataBR(r.quando) : '—' },
      { k:'valor',   rot:'Valor', larg:'104px', tipo:'num', filtro:false,
        render:r => r.valor != null ? BRL(r.valor) : '—' },
    ]
  });
  const elDoc = document.getElementById('docTab');
  if (!elDoc) return;                 // trocou de tela durante o carregamento
  elDoc.innerHTML = tfCasca('doc');
  REPINTA.doc = () => tfRender('doc');
  tfRender('doc');
}

/** Abre a gaveta da OS a partir do id, mesmo estando em outra tela. */
async function abrirOSPorId(osId){
  let c = cards.find(x => x.os_id === osId);
  if (!c){
    // "não achei" e "não consegui perguntar" são coisas diferentes, e dizer
    // "OS encerrada" quando a rede caiu manda a pessoa procurar o problema errado
    try{ const r = await get('v_os_kanban?select=*&os_id=eq.' + osId); c = (r||[])[0]; }
    catch(e){ toast(e.message, 'err'); return; }
  }
  if (!c){ toast('Esta OS já foi encerrada e saiu do quadro.','err'); return; }
  abrirOS(c);
}

const REL_TIPOS = [
  ['operacional','Operacional', 'OS por período, etapa e responsável'],
  ['comercial',  'Comercial',   'Funil, propostas, aprovação e perdas'],
  ['financeiro', 'Financeiro',  'Margem por OS: venda, custo, frete'],
  ['compras',    'Compras',     'Pedidos por fornecedor e atrasos'],
];

function relIniciaPeriodo(){
  if (REL.de && REL.ate) return;
  const h = new Date();
  REL.ate = isoHoje(h);
  REL.de  = isoHoje(new Date(h.getFullYear(), h.getMonth(), 1));
}
function relAtalho(qual){
  const h = new Date();
  const iso = isoHoje;
  if (qual === 'mes'){ REL.de = iso(new Date(h.getFullYear(), h.getMonth(), 1)); REL.ate = iso(h); }
  if (qual === 'mespassado'){
    REL.de  = iso(new Date(h.getFullYear(), h.getMonth()-1, 1));
    REL.ate = iso(new Date(h.getFullYear(), h.getMonth(), 0));
  }
  if (qual === '90'){ REL.de = iso(new Date(h.getTime() - 90*864e5)); REL.ate = iso(h); }
  if (qual === 'ano'){ REL.de = iso(new Date(h.getFullYear(), 0, 1)); REL.ate = iso(h); }
  REL.dados = null;
  pintarRelatorios();
}

async function pintarRelatorios(){
  relIniciaPeriodo();
  const board = document.getElementById('board');
  board.innerHTML =
    '<div class="tela"><div class="telaCab"><h2>Relatórios</h2>'
    + '<p>Um período, quatro recortes. O que aparece na tela é o que sai no PDF e na planilha.</p></div>'
    + '<div class="relTipos" id="relTipos"></div>'
    + '<div class="relBarra">'
    +   '<span class="rot">Período</span>'
    +   '<input type="date" id="relDe" aria-label="Início do período" value="' + esc(REL.de) + '">'
    +   '<span class="rot">até</span>'
    +   '<input type="date" id="relAte" aria-label="Fim do período" value="' + esc(REL.ate) + '">'
    +   '<button class="btn sm" data-a="mes">Este mês</button>'
    +   '<button class="btn sm" data-a="mespassado">Mês passado</button>'
    +   '<button class="btn sm" data-a="90">90 dias</button>'
    +   '<button class="btn sm" data-a="ano">Este ano</button>'
    +   '<span style="flex:1"></span>'
    +   '<span class="relSaidas"><button class="btn" id="relPDF">⬇ PDF</button>'
    +   '<button class="btn" id="relXLS">⬇ Planilha</button></span>'
    + '</div>'
    + '<div id="relCorpo"><p class="nota">Carregando…</p></div></div>';

  const t = document.getElementById('relTipos');
  REL_TIPOS.forEach(([id, rot, sub]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'relTipo' + (REL.qual === id ? ' on' : '');
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = rot;
    b.querySelector('span').textContent = sub;
    b.addEventListener('click', () => { REL.qual = id; pintarRelatorios(); });
    t.appendChild(b);
  });

  document.getElementById('relDe').addEventListener('change', e => {
    REL.de = e.target.value; REL.dados = null; pintarRelatorios(); });
  document.getElementById('relAte').addEventListener('change', e => {
    REL.ate = e.target.value; REL.dados = null; pintarRelatorios(); });
  document.querySelectorAll('.relBarra button[data-a]').forEach(b =>
    b.addEventListener('click', () => relAtalho(b.dataset.a)));

  if (REL.de && REL.ate && REL.de > REL.ate){
    document.getElementById('relCorpo').innerHTML =
      '<div class="vazio2"><b>O início do período é depois do fim</b>'
      + '<p>Nenhuma OS cabe nesse intervalo. Ajuste as datas.</p></div>';
    return;
  }

  try{ await relCarregar(); }
  catch(e){
    document.getElementById('relCorpo').innerHTML = '<div class="vazio2"><b>Não deu para carregar</b><p></p></div>';
    document.querySelector('#relCorpo p').textContent = e.message;
    return;
  }

  const m = relModelo();
  relPintarCorpo(m);
  document.getElementById('relPDF').addEventListener('click', e => _semDuploEnvio_(e.target, () => relPDF(m)));
  document.getElementById('relXLS').addEventListener('click', e => _semDuploEnvio_(e.target, () => relXLSX(m)));
}

/** Busca os dados uma vez por período — trocar de relatório não vai ao banco. */
async function relCarregar(){
  const chave = REL.de + '|' + REL.ate;
  if (REL.dados && REL.chave === chave) return;
  if (DEMO){ REL.dados = demoRel(); REL.chave = chave; return; }
  const [os, itens, props, negs, peds, margens] = await Promise.all([
    // As colunas sao data_abertura (DATE) e encerrada_em (TIMESTAMPTZ) — conferidas
    // contra o information_schema, nao contra a memoria. Ver auditar_consultas.py.
    get('ordens_servico?select=id,numero,status,descricao,data_abertura,encerrada_em,cliente_id,modo_entrega'
        + '&data_abertura=gte.' + REL.de + '&data_abertura=lte.' + REL.ate + '&order=data_abertura'),
    get('os_itens?select=os_id,descricao,quantidade,custo_unitario,preco_unitario,total_custo,total_venda,'
        + 'elegivel,aprovado,origem,fornecedor,pedido_numero,pedido_em,previsto_para,recebido_em&limit=5000'),
    get('v_propostas?select=*&limit=2000'),
    get('v_negocios_kanban?select=*&limit=2000').catch(() => []),
    get('v_pedidos_compra?select=*&limit=2000').catch(() => []),
    get('v_os_margem?select=*&limit=2000').catch(() => []),
  ]);
  const cli = {};
  try{ (await get('clientes?select=id,razao_social&limit=2000')).forEach(c => cli[c.id] = c.razao_social); }catch(e){}
  REL.dados = { os, itens, props, negs, peds, margens, cli };
  REL.chave = chave;
}

const _dentro = (d) => !d ? false : (String(d).slice(0,10) >= REL.de && String(d).slice(0,10) <= REL.ate);

/**
 * O MODELO. Uma função, um objeto, três saídas.
 * { titulo, subtitulo, kpis:[{rot,val}], blocos:[{titulo,colunas,linhas,nota}] }
 */
function relModelo(){
  const D = REL.dados || {};
  const per = 'de ' + dataBR(REL.de) + ' a ' + dataBR(REL.ate);

  if (REL.qual === 'operacional'){
    const os = (D.os || []);
    const porOS = {};
    (D.itens || []).forEach(i => { (porOS[i.os_id] = porOS[i.os_id] || []).push(i); });
    const abertas = os.filter(o => o.status !== 'concluida' && o.status !== 'cancelada');
    const fechadas = os.filter(o => o.status === 'concluida');
    // Dia contra dia: encerrada_em e instante, data_abertura e data pura. Misturar os
    // dois em new Date() come um dia em Brasilia (o mesmo defeito do dataBR).
    const soDia = v => String(v || '').slice(0,10);
    const dias = fechadas.filter(o => o.encerrada_em && o.data_abertura)
      .map(o => (new Date(soDia(o.encerrada_em)+'T12:00') - new Date(soDia(o.data_abertura)+'T12:00')) / 864e5);
    const medio = dias.length ? (dias.reduce((a,b)=>a+b,0) / dias.length) : null;
    const colunaDe = {};
    cards.forEach(c => { colunaDe[c.os_id] = c.coluna; });
    const porColuna = {};
    abertas.forEach(o => { const c = colunaDe[o.id] || '(fora do quadro)';
      porColuna[c] = (porColuna[c] || 0) + 1; });
    return {
      titulo:'Relatório operacional', subtitulo:'OS abertas no período ' + per,
      kpis:[
        { rot:'OS abertas no período', val:String(os.length) },
        { rot:'Concluídas', val:String(fechadas.length) },
        { rot:'Em andamento', val:String(abertas.length) },
        { rot:'Tempo médio até fechar', val: medio == null ? '—' : medio.toFixed(1) + ' dias' },
      ],
      blocos:[
        { titulo:'Onde estão as OS em andamento',
          colunas:['Etapa','OS'],
          linhas:Object.entries(porColuna).sort((a,b)=>b[1]-a[1]).map(([k,v]) => [k, v]),
          numericas:[1],
          nota:'A etapa é derivada da primeira tarefa não resolvida — não é campo digitado.' },
        { titulo:'OS do período',
          colunas:['OS','Cliente','Descrição','Aberta em','Situação','Itens','Venda'],
          linhas:os.map(o => {
            const its = (porOS[o.id] || []).filter(i => i.elegivel);
            return [o.numero, D.cli[o.cliente_id] || '', o.descricao || '', dataBR(o.data_abertura),
              o.status === 'concluida' ? 'concluída' : (colunaDe[o.id] || 'aberta'),
              its.length, its.reduce((a,i)=>a+Number(i.total_venda||0),0)];
          }), numericas:[5,6], moeda:[6] },
      ]
    };
  }

  if (REL.qual === 'comercial'){
    const props = (D.props || []).filter(p => _dentro(p.emitida_em || p.created_at));
    const val = s => props.filter(p => p.status === s).reduce((a,p)=>a+Number(p.valor_total||0),0);
    const n = s => props.filter(p => p.status === s).length;
    const emitidas = props.length;
    const aprov = n('aprovada'), rep = n('reprovada');
    const conv = (aprov + rep) ? Math.round(aprov / (aprov + rep) * 100) : null;
    const porMotivo = {};
    props.filter(p => p.status === 'reprovada').forEach(p => {
      const m = p.motivo_perda || p.motivo_perda_id || '(não informado)';
      porMotivo[m] = (porMotivo[m] || 0) + 1;
    });
    const funil = {};
    (D.negs || []).forEach(x => { funil[x.coluna || '—'] = (funil[x.coluna || '—'] || 0) + 1; });
    return {
      titulo:'Relatório comercial', subtitulo:'Propostas emitidas ' + per,
      kpis:[
        { rot:'Propostas emitidas', val:String(emitidas) },
        { rot:'Valor emitido', val:BRL(props.reduce((a,p)=>a+Number(p.valor_total||0),0)) },
        { rot:'Aprovadas', val:aprov + (conv != null ? ' · ' + conv + '%' : '') },
        { rot:'Valor aprovado', val:BRL(val('aprovada')) },
      ],
      blocos:[
        { titulo:'Propostas do período',
          // S29: "Rev. NN" no número, sem a coluna do contador interno
          colunas:['Número','Cliente','OS','Status','Emitida em','Valor'],
          linhas:props.map(p => [rotuloProposta(p.numero, p.versao), p.cliente || '', p.os_numero || p.os || '',
            p.status, p.emitida_em ? dataBR(p.emitida_em) : '', Number(p.valor_total||0)]),
          numericas:[5], moeda:[5] },
        { titulo:'Por que se perde',
          colunas:['Motivo','Propostas'],
          linhas:Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]),
          numericas:[1],
          nota:!rep ? 'Nenhuma proposta reprovada no período.' : '' },
        { titulo:'Funil comercial hoje',
          colunas:['Etapa','Negócios'], linhas:Object.entries(funil), numericas:[1],
          nota:'Foto de agora, não do período — o funil é um estado, não um acumulado.' },
      ]
    };
  }

  if (REL.qual === 'financeiro'){
    const idsPeriodo = new Set((D.os || []).map(o => o.id));
    const m = (D.margens || []).filter(x => idsPeriodo.has(x.os_id));
    const soma = k => m.reduce((a,x) => a + Number(x[k]||0), 0);
    const venda = soma('venda'), custo = soma('custo_itens'), extras = soma('custos_extras');
    const real = soma('margem_real');
    return {
      titulo:'Relatório financeiro', subtitulo:'Margem das OS abertas ' + per,
      kpis:[
        { rot:'Venda', val:BRL(venda) },
        { rot:'Custo dos itens', val:BRL(custo) },
        { rot:'Frete e outros', val:'−' + BRL(extras) },
        { rot:'Margem real', val:BRL(real) + (venda ? ' · ' + Math.round(real/venda*100) + '%' : '') },
      ],
      blocos:[
        { titulo:'Margem por OS',
          colunas:['OS','Cliente','Venda','Custo itens','Frete e outros','Margem real','%'],
          linhas:m.map(x => [x.numero, x.cliente || '', Number(x.venda||0), Number(x.custo_itens||0),
            Number(x.custos_extras||0), Number(x.margem_real||0), x.margem_pct]),
          numericas:[2,3,4,5,6], moeda:[2,3,4,5],
          nota:'Margem real = venda − custo dos itens − o que não é item (frete, deslocamento, terceiro). '
             + 'É a conta que some quando o frete fica no WhatsApp.' },
      ]
    };
  }

  // compras
  const peds = (D.peds || []).filter(p => _dentro(p.emitido_em));
  const itens = (D.itens || []).filter(i => i.pedido_numero);
  const hoje = isoHoje();
  const atrasados = itens.filter(i => !i.recebido_em && i.previsto_para && i.previsto_para < hoje);
  const porForn = {};
  peds.forEach(p => {
    const f = p.fornecedor || '(sem fornecedor)';
    const o = porForn[f] = porForn[f] || { pedidos:0, valor:0, atrasados:0 };
    o.pedidos++; o.valor += Number(p.valor||0);
  });
  atrasados.forEach(i => {
    const f = i.fornecedor || '(sem fornecedor)';
    if (porForn[f]) porForn[f].atrasados++;
  });
  return {
    titulo:'Relatório de compras', subtitulo:'Pedidos emitidos ' + per,
    kpis:[
      { rot:'Pedidos emitidos', val:String(peds.length) },
      { rot:'Valor comprado', val:BRL(peds.reduce((a,p)=>a+Number(p.valor||0),0)) },
      { rot:'Fornecedores', val:String(Object.keys(porForn).length) },
      { rot:'Itens atrasados', val:String(atrasados.length) },
    ],
    blocos:[
      { titulo:'Por fornecedor',
        colunas:['Fornecedor','Pedidos','Valor','Itens atrasados'],
        linhas:Object.entries(porForn).sort((a,b)=>b[1].valor-a[1].valor)
          .map(([f,o]) => [f, o.pedidos, o.valor, o.atrasados]),
        numericas:[1,2,3], moeda:[2] },
      { titulo:'Pedidos do período',
        colunas:['Pedido','Fornecedor','Cliente','OS','Emitido','Previsto','Itens','Valor'],
        linhas:peds.map(p => [p.numero, p.fornecedor || '', p.cliente || '', p.os_numero || '',
          dataBR(p.emitido_em), p.previsto_para ? dataBR(p.previsto_para) : '—', p.itens, Number(p.valor||0)]),
        numericas:[6,7], moeda:[7] },
      { titulo:'O que está atrasado',
        colunas:['Item','Fornecedor','Pedido','Previsto para','Dias de atraso'],
        linhas:atrasados.map(i => [i.descricao, i.fornecedor || '', i.pedido_numero || '',
          dataBR(i.previsto_para),
          Math.round((new Date(hoje) - new Date(i.previsto_para)) / 864e5)]),
        numericas:[4],
        nota:!atrasados.length ? 'Nada atrasado. Esta é a linha que você quer ver vazia.' : '' },
    ]
  };
}

function relPintarCorpo(m){
  const el = document.getElementById('relCorpo');
  let h = '<div class="relKpis">' + m.kpis.map(k =>
    '<div class="relKpi"><b>' + esc(k.val) + '</b><span>' + esc(k.rot) + '</span></div>').join('') + '</div>';
  m.blocos.forEach(b => {
    const corte = b.linhas.slice(0, 60);
    h += '<div class="relBloco"><h3>' + esc(b.titulo) + '</h3>';
    if (b.nota) h += '<p class="nota">' + esc(b.nota) + '</p>';
    if (!b.linhas.length){
      h += '<p class="nota" style="color:var(--ink-3)">Nada no período.</p>';
    } else {
      h += '<div class="tfWrap" style="max-height:none"><table class="tfTab"><thead><tr>'
        + b.colunas.map((c,i) => '<th class="' + ((b.numericas||[]).includes(i) ? 'num' : '')
            + '"><span class="tfThFixo">' + esc(c) + '</span></th>').join('')
        + '</tr></thead><tbody>'
        + corte.map(l => '<tr>' + l.map((v,i) => {
            const num = (b.numericas||[]).includes(i);
            // contagem e dinheiro são os dois numéricos, e formatar pelo tipo do
            // valor erra: 1060 reais é inteiro e sairia "1060" na cara do leitor
            const txt = (b.moeda||[]).includes(i) ? BRL(Number(v)||0)
              : (num && typeof v === 'number' ? String(v) : esc(v ?? ''));
            return '<td class="' + (num ? 'num' : '') + '">' + txt + '</td>';
          }).join('') + '</tr>').join('')
        + '</tbody></table></div>';
      if (b.linhas.length > 60)
        h += '<p class="nota">Mostrando as 60 primeiras de ' + b.linhas.length
           + ' na tela — <b>o PDF e a planilha levam todas</b>.</p>';
    }
    h += '</div>';
  });
  el.innerHTML = h;
}

const relNomeArq = (m, ext) => {
  const lim = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return 'TapFlow_' + lim(m.titulo) + '_' + REL.de + '_a_' + REL.ate + '.' + ext;
};

async function relPDF(m){
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const M = 13; let y = M;
  const novaPag = (alt) => { if (y + (alt||6) > 283){ doc.addPage(); y = M; } };

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('ENGETAP ENGENHARIA', M, y); y += 5.5;
  doc.setFontSize(11); doc.text(m.titulo, M, y); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(m.subtitulo, M, y); y += 4.5;
  doc.text('Emitido em ' + dataBR() + (sessao.nome ? ' por ' + sessao.nome : ''), M, y);
  doc.setTextColor(0); y += 6;
  doc.setDrawColor(180); doc.line(M, y, 210-M, y); y += 7;

  const lk = (210 - 2*M) / m.kpis.length;
  m.kpis.forEach((k, i) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(String(k.val), M + i*lk, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(110);
    doc.text(doc.splitTextToSize(k.rot, lk - 3), M + i*lk, y + 4);
    doc.setTextColor(0);
  });
  y += 13;

  m.blocos.forEach(b => {
    if (!b.linhas.length && !b.nota) return;
    novaPag(14);
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(b.titulo, M, y); y += 5;
    if (b.nota){
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(110);
      const t = doc.splitTextToSize(b.nota, 210 - 2*M);
      doc.text(t, M, y); y += t.length * 3.2 + 2; doc.setTextColor(0);
    }
    if (!b.linhas.length){ y += 4; return; }

    // A largura sai do CONTEÚDO, não de um peso fixo: com peso fixo o "R$
    // 1.060,00" quebrava em duas linhas enquanto a coluna de data sobrava.
    const larg = 210 - 2*M;
    const txtDe = (v, i) => (b.moeda||[]).includes(i) ? BRL(Number(v)||0) : String(v ?? '');
    const amostra = b.linhas.slice(0, 200);
    const pesos = b.colunas.map((c, i) => {
      let mx = String(c).length;
      for (const l of amostra) mx = Math.max(mx, txtDe(l[i], i).length);
      // teto de 34: uma descrição longa não pode espremer as outras seis colunas
      return Math.min(Math.max(mx, 6), 34);
    });
    const somaP = pesos.reduce((a,x)=>a+x,0);
    const ws = pesos.map(p => p / somaP * larg);
    const xs = ws.reduce((acc,w,i) => { acc.push(i ? acc[i-1] + ws[i-1] : M); return acc; }, []);

    const cabecalho = () => {
      doc.setFont('helvetica','bold'); doc.setFontSize(7);
      b.colunas.forEach((c,i) => {
        const num = (b.numericas||[]).includes(i);
        doc.text(String(c), num ? xs[i] + ws[i] - 1 : xs[i], y, num ? {align:'right'} : undefined);
      });
      y += 1.6; doc.setDrawColor(210); doc.line(M, y, 210-M, y); y += 3.4;
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    };
    cabecalho();

    b.linhas.forEach(l => {
      if (y > 280){ doc.addPage(); y = M; cabecalho(); }
      let alt = 3.6;
      l.forEach((v,i) => {
        const num = (b.numericas||[]).includes(i);
        const txt = (b.moeda||[]).includes(i) ? BRL(Number(v)||0)
          : (num && typeof v === 'number' ? String(v) : String(v ?? ''));
        const linhas = doc.splitTextToSize(txt, ws[i] - 2).slice(0, 2);
        alt = Math.max(alt, linhas.length * 3.4);
        doc.text(linhas, num ? xs[i] + ws[i] - 1 : xs[i], y, num ? {align:'right'} : undefined);
      });
      y += alt + 0.8;
    });
    y += 5;
  });

  doc.save(relNomeArq(m, 'pdf'));
}

/**
 * A planilha sai sem biblioteca: um .xlsx é um ZIP com cinco XMLs, e escrever à
 * mão evita 900 KB de CDN para uma função que roda uma vez por semana. Número
 * vai como NÚMERO — planilha em que tudo é texto é um PDF com grade.
 */
async function relXLSX(m){
  const JSZipLib = await carregarJSZip();
  const zip = new JSZipLib();
  const esc_ = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const col = n => { let s = ''; n++; while (n > 0){ const r = (n-1) % 26; s = String.fromCharCode(65+r) + s; n = Math.floor((n-1)/26); } return s; };

  const abas = m.blocos.filter(b => b.linhas.length).map((b, bi) => ({
    nome: (b.titulo || ('Bloco ' + (bi+1))).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28),
    colunas: b.colunas,
    linhas: b.linhas,
    numericas: b.numericas || [],
    moeda: b.moeda || []
  }));
  if (!abas.length){ toast('Nada no período para exportar.','err'); return; }

  zip.file('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + abas.map((_,i) => '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + '</Types>');
  zip.folder('_rels').file('.rels',
    '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  const xl = zip.folder('xl');
  xl.file('workbook.xml',
    '<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
    + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + abas.map((a,i) => '<sheet name="'+esc_(a.nome)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')
    + '</sheets></workbook>');
  xl.folder('_rels').file('workbook.xml.rels',
    '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + abas.map((_,i) => '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')
    + '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  xl.file('styles.xml',
    '<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
    + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
    + '<borders count="1"><border/></borders>'
    + '<cellStyleXfs count="1"><xf/></cellStyleXfs>'
    + '<cellXfs count="2"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/></cellXfs></styleSheet>');

  const ws = xl.folder('worksheets');
  abas.forEach((a, i) => {
    const linhas = [a.colunas].concat(a.linhas);
    const xml = linhas.map((l, ri) =>
      '<row r="'+(ri+1)+'">' + l.map((v, ci) => {
        const ref = col(ci) + (ri+1);
        const num = ri > 0 && a.numericas.includes(ci) && typeof v === 'number' && isFinite(v);
        if (num) return '<c r="'+ref+'"><v>'+v+'</v></c>';
        return '<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+esc_(v)+'</t></is></c>';
      }).join('') + '</row>').join('');
    ws.file('sheet'+(i+1)+'.xml',
      '<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetData>' + xml + '</sheetData></worksheet>');
  });

  const blob = await zip.generateAsync({ type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  baixarBlob(blob, relNomeArq(m, 'xlsx'));
}

/* ── Olho de ver a senha (S30) ───────────────────────────────────────────────
   Senha digitada às cegas erra fácil, e o erro só aparece como "credenciais
   inválidas" — que é a mesma mensagem de senha errada de verdade. O botão só
   troca o `type` do campo: nada da senha é guardado, lido ou enviado a lugar
   nenhum, e ele volta a ficar oculto toda vez que a tela de login aparece.
   `tabindex="-1"` no botão de propósito: Tab vai do e-mail à senha e da senha
   ao Entrar, sem parar no olho. */
function olhoSenha(mostrar){
  const b = document.getElementById('lgOlho'), c = document.getElementById('lgSenha');
  if (!b || !c) return;
  c.type = mostrar ? 'text' : 'password';
  b.classList.toggle('ver', mostrar);
  const rot = mostrar ? 'Ocultar senha' : 'Mostrar senha';
  b.setAttribute('aria-label', rot);
  b.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
  b.title = rot;
}
try{
  document.getElementById('lgOlho').addEventListener('click', () => {
    const c = document.getElementById('lgSenha');
    olhoSenha(c.type === 'password');
    c.focus();
  });
}catch(e){}

async function iniciar(){
  // O menu é remontado AQUI, não só no carregamento do arquivo: quando o
  // script roda, a sessão ainda não foi lida, e o menu saía inteiro para todo
  // mundo. Foi o teste de tela que pegou — o perfil comercial via Compras.
  montarNav();
  pintarCracha();
  await carregarColunas();
  await carregarParametros();
  await carregarEquipe();
  carregar().catch(()=>{}).finally(() => irPara(visao));
}

  { const d = document.getElementById('demoBar');

  if (NO_SERVIDOR){ irParaHub(''); return; }

})();
