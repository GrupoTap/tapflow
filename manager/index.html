      const cts = await get('contatos?select=id,nome,cargo&cliente_id=eq.' + c.id + '&ativo=is.true&order=nome');
      sel.innerHTML = (cts && cts.length)
        ? '<option value="">—</option>' + cts.map(x => '<option value="' + esc(x.id) + '">' + esc(x.nome)
            + (x.cargo ? ' — ' + esc(x.cargo) : '') + '</option>').join('')
        : '<option value="">este cliente não tem contato cadastrado</option>';
    }catch(e){ sel.innerHTML = '<option value="">não deu para carregar</option>'; }
  };
  let tb = null;
  const inpB = document.getElementById('paBusca');
  inpB.addEventListener('input', () => {
    clearTimeout(tb);
    tb = setTimeout(async () => {
      const termo = inpB.value.trim(), alvo = document.getElementById('paCliLista');
      if (termo.length < 2){ alvo.innerHTML = ''; return; }
      try{
        const r = await rpc('tf_buscar_cliente', { p_termo: termo, p_limite: 8 });
        alvo.innerHTML = (r && r.length)
          ? '<div class="parecidos">' + r.map((c, i) =>
              '<button class="btn parecidoLinha" type="button" data-i="' + i + '">'
            + '<span class="pn">' + esc(nomeCliente(c)) + '</span>'
            + '<span class="pd">' + esc(c.cnpj || 'sem CNPJ') + (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>'
            + '</button>').join('') + '</div>'
          : '<p class="nota">Nenhum cliente com esse nome ou CNPJ. Proposta é de cliente cadastrado — cadastre em Clientes antes.</p>';
        alvo.querySelectorAll('[data-i]').forEach(bt => bt.addEventListener('click', () => escolher(r[Number(bt.dataset.i)])));
      }catch(e){ alvo.innerHTML = '<p class="nota"></p>'; alvo.querySelector('p').textContent = 'Não deu para buscar: ' + e.message; }
    }, 200);
  });

  const sit = () => (document.querySelector('input[name=paSit]:checked') || {}).value || 'enviada';
  const ajusta = () => {
    const v = sit();
    document.getElementById('paResp').hidden = v === 'enviada';
    document.getElementById('paCtBox').hidden = !(v === 'aprovada' || v === 'executada');
    document.getElementById('paMotBox').hidden = v !== 'recusada';
  };
  document.querySelectorAll('input[name=paSit]').forEach(r => r.addEventListener('change', ajusta));
  ajusta();

  const params = confirmado => ({
    p_cliente_id: cliente && cliente.id, p_titulo: document.getElementById('paTit').value.trim() || null,
    p_numero: document.getElementById('paNum').value.trim(), p_emitida_em: document.getElementById('paEm').value || null,
    p_valor: lerCampoDinheiro('paVal', 'Valor total'), p_descricao: document.getElementById('paDesc').value.trim() || null,
    p_situacao: sit(), p_resposta_em: sit() === 'enviada' ? null : (document.getElementById('paRespEm').value || null),
    p_contato_id: document.getElementById('paCt').value || null,
    p_motivo_perda_id: document.getElementById('paMot').value || null,
    p_observacao: document.getElementById('paObs').value.trim() || null, p_confirmado: confirmado });

  document.getElementById('paOk').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      if (!cliente) return toast('Escolha o cliente.','err');
      let pr;
      try{ pr = await rpc('tf_lancar_proposta_antiga', params(false)); }
      catch(e){ return toast(e.message,'err'); }
      const ROT = { enviada:'Proposta enviada', aprovada:'Aprovadas', executada:'Concluídos', recusada:'Recusadas' };
      abrirModal('Lançar a proposta ' + pr.numero + '?',
          '<p><b>' + esc(pr.cliente) + '</b> · emitida em ' + esc(dataBR(document.getElementById('paEm').value))
        + ' · ' + esc(BRL(params(false).p_valor)) + '</p>'
        + '<p>O card entra em <b>' + ROT[sit()] + '</b>.</p>'
        + (pr.contador_avanca_para
            ? '<div class="aviso">O número <b>' + esc(pr.numero) + '</b> está à frente da numeração do TapFlow. '
              + 'Para o TapFlow não emitir esse mesmo número mais tarde, o contador pula: a próxima proposta '
              + 'ou OS nova sai como <b>' + esc(pr.proximo_numero) + '</b>.</div>'
            : ''),
        [{ label:'Voltar', onClick: fecharModal },
         { label:'Lançar', pri:true, onClick: async () => {
            try{
              const r = await rpc('tf_lancar_proposta_antiga', params(true));
              fecharModal(); fecharDrawer();
              toast('Proposta ' + r.rotulo + ' lançada (' + r.negocio_numero + ').','ok');
              pintarComercial();
            }catch(e){ toast(e.message,'err'); }
         }}]);
    });
  });
}

    + '<h3>Meu perfil</h3>'
    + '<p class="nota">O que o TapFlow sabe sobre você. O <b>nome</b> é o que aparece no '
    + 'quadro, na agenda e nas designações — e é o único que você mesmo corrige aqui.</p>'
    + '<div class="euTopo">'
    +   '<span class="logoCli logoFicha" style="--h:' + matizDoNome(sessao.nome || '') + '">'
    +   '<i>' + esc(iniciaisCliente(sessao.nome || '?')) + '</i></span>'

    +     lin('Nome', sessao.nome, 'você corrige')
    +     lin('E-mail (login)', sessao.email, 'só o administrador')
    +     lin('Perfil', sessao.perfil_nome || sessao.perfil, 'só o administrador')
    +     lin('Onde executa', LADO[sessao.executa_em] || sessao.executa_em, 'vem do perfil')
    +   '</div>'
    + '</div>'
    + '<button class="btn pri" type="button" id="euNome" style="width:100%">Corrigir meu nome</button>'
    + '<p class="nota">Para trocar e-mail, senha ou perfil — seu ou de outra pessoa — fale com o '
    + 'administrador'
    + (sessao.admin ? ' (você é um: <b>Configurações › Usuários</b>).' : '.') + '</p>'
    + '</div></div>';

  const b = document.getElementById('euNome');
  if (b) b.addEventListener('click', () => {
    if (!eu && !DEMO){ toast('Sessão sem identificação — entre de novo.','err'); return; }
    modalNome(eu, sessao.nome || '', async () => pintarMeuPerfil());
  });
}

/** O crachá do topo. Vira botão quando há sessão: é o caminho mais curto até
 *  "Meu perfil", que é onde a pessoa procura o próprio nome. */
function pintarCracha(){
  const cx = document.getElementById('who');
  if (!cx) return;
  cx.innerHTML = '';

  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'crachaEu';
  b.title = 'Meu perfil';
  b.innerHTML = '<b></b> · ';

}

// pode, onde os arquivos estão e o que o sistema já gerou. Tudo só para admin.

let abaCfg = 'usuarios';

async function pintarConfig(){
  visao = 'cfg';
  const board = document.getElementById('board');
  if (!sessao.admin){
    board.innerHTML = '<div class="painel"><h3>Configurações</h3>'
      + '<p class="nota">Esta área é do perfil admin. Fale com o Fernando ou o Bruno.</p></div>';
    return;
  }
  board.innerHTML = '<div class="cfgWrap">'
    + '<div class="chips" id="cfgTabs"></div>'
    + '<div id="cfgCorpo"></div></div>';

  // S31: "Tarefas por perfil" fica ao LADO de Perfis, não dentro. São dois
  // controles diferentes e o documento pediu que não se fundissem: "O que
  // aparece na tela" decide por onde a pessoa navega; esta decide, tarefa por
  // tarefa, quem pode executá-la.
  const abas = [['usuarios','Usuários'],['perfis','Perfis'],['tarefas','Tarefas por perfil'],
                ['turno','Turno'],['planos','Planos'],
                ['docs','Documentos'],['param','Google Drive'],['exc','Exclusões']];
  const t = document.getElementById('cfgTabs');
  abas.forEach(([id,rot]) => {
    const b = document.createElement('button');
    b.className = 'fchip' + (abaCfg === id ? ' on' : '');
    b.textContent = rot;
    b.addEventListener('click', () => { abaCfg = id; pintarConfig(); });
    t.appendChild(b);
  });

  if (abaCfg === 'usuarios') return cfgUsuarios();
  if (abaCfg === 'perfis')   return cfgPerfis();
  if (abaCfg === 'tarefas')  return cfgTarefasPerfil();
  if (abaCfg === 'docs')     return cfgDocumentos();
  if (abaCfg === 'turno')    return cfgTurno();
  if (abaCfg === 'planos')   return cfgPlanos();
  if (abaCfg === 'param')    return cfgParametros();
  if (abaCfg === 'exc')      return cfgExclusoes();
}

// ── USUÁRIOS ────────────────────────────────────────────────────────────────
// Desde o S16 esta tela faz a gestão INTEIRA: cria o login, define a senha,
// troca o e-mail, muda o perfil, desativa e exclui. Nada disso passa mais pelo
// painel do Supabase — que era o único lugar onde a Engetap ainda dependia de
// alguém "que sabe mexer" para dar acesso a um funcionário novo.
//
// Quem faz o trabalho pesado é o servidor (31_admin_usuarios.sql). O app aqui
// só pergunta: a chave que ele carrega é a Publishable e ela, sozinha, não
// cria login nenhum. Cada função lá confere `tf_is_admin()` antes de mexer.
//
// Uma regra de tela que vale para tudo abaixo: quando uma ação é IMPOSSÍVEL, o
// app descobre ANTES e explica; não oferece o botão para o servidor recusar
// depois. Excluir é o exemplo — ele consulta o histórico primeiro e, se houver,
// nem chega a tentar: mostra onde está o rastro e oferece Desativar no lugar.

// Senha fácil de ditar no telefone. Sem 'l', '1', 'O' e '0', que geram o
// clássico "é ele minúsculo ou um?" e uma segunda ligação. Sílabas em vez de
// caracteres aleatórios porque quem recebe vai DIGITAR isso uma vez.
const _SIL = ['ba','be','bi','bo','ca','ce','co','da','de','do','fa','fe','fi','fo',
              'ga','ge','go','ja','je','ma','me','mi','mo','na','ne','ni','no',
              'pa','pe','pi','po','ra','re','ri','ro','sa','se','si','so',
              'ta','te','ti','to','va','ve','vi','zo'];
function senhaSugerida(){
  const r = n => Math.floor(Math.random() * n);
  const p = () => _SIL[r(_SIL.length)] + _SIL[r(_SIL.length)] + _SIL[r(_SIL.length)];
  return p() + '-' + p() + '-' + (100 + r(900));
}

// nomes de tabela → português, para a recusa da exclusão ser legível.
// O que não estiver aqui aparece com o nome cru, sem underline: melhor mostrar
// "os itens" do que esconder um lugar onde o nome da pessoa está gravado.
const _TABELA_PT = {
  pipeline_tarefas:'tarefas do quadro', eventos:'registros de histórico',
  aprovacoes:'aprovações de cliente', documentos:'documentos emitidos',
  ordens_servico:'ordens de serviço', levantamentos:'levantamentos de campo',
  anexos:'arquivos anexados', exclusoes:'exclusões registradas',
  os_itens:'itens de OS', propostas:'propostas', notificacoes:'notificações'
};
const _rotuloTabela = t => _TABELA_PT[t] || String(t||'').replace(/_/g,' ');

async function cfgUsuarios(){
  const c = document.getElementById('cfgCorpo');
  c.innerHTML = '<p class="nota">Carregando…</p>';

  let users = [], perfis = [], pendentes = [];
  try{
    if (DEMO){ users = demoUsuarios(); perfis = demoPerfis(); pendentes = demoPendentes(); }
    else [users, perfis, pendentes] = await Promise.all([
      get('v_usuarios?select=*&order=ativo.desc,nome'),
      get('v_perfis?select=*&ativo=is.true&order=id'),
      rpc('tf_logins_sem_perfil', {})
    ]);
  }catch(e){
    // Nunca deixar a tela vazia por causa de um erro: sem isto, um JWT vencido
    // vira "não tem ninguém cadastrado" e o susto é grande.
    c.innerHTML = '<div class="painel"><h3>Quem usa o TapFlow</h3>'
      + '<div class="aviso"><b>Não deu para carregar a lista.</b><br>' + esc(e.message) + '</div>'
      + '<button class="btn" id="uRetry">Tentar de novo</button></div>';
    document.getElementById('uRetry').addEventListener('click', cfgUsuarios);
    return;
  }

  const opcoesPerfil = (sel) => perfis.map(x =>
    '<option value="' + esc(x.id) + '"' + (x.id === sel ? ' selected' : '') + '>'
    + esc(x.nome) + '</option>').join('');

  let h = '<div class="painel"><h3>Quem usa o TapFlow</h3>';

  // ── logins criados por fora (painel do Supabase, versão antiga do sistema) ──
  // Continua existindo porque continua acontecendo: um login pode ter nascido
  // antes desta tela. Sem perfil ele não entra em lugar nenhum.
  if (pendentes && pendentes.length){
    h += '<div class="aviso"><b>' + pendentes.length + ' login(s) sem perfil.</b> '
      + 'Existem na Authentication do Supabase mas ainda não entram no sistema — '
      + 'quem manda no acesso é esta lista, não o login.</div>';
    pendentes.forEach(p => {
      h += '<div class="linhaU pend"><div><b>' + esc(p.email) + '</b>'
        + '<small>' + (p.confirmado ? 'e-mail confirmado'
                     : '⚠ e-mail NÃO confirmado — não consegue entrar') + '</small></div>'
        + '<div class="acoesU">'
        +   '<input class="mini" id="nm_' + esc(p.auth_id) + '" placeholder="Nome da pessoa"'
        +     ' aria-label="Nome de quem usa ' + esc(p.email) + '">'
        +   '<select class="mini" id="pf_' + esc(p.auth_id) + '"'
        +     ' aria-label="Perfil de ' + esc(p.email) + '">' + opcoesPerfil(null) + '</select>'
        +   '<button class="btn pri mini" data-vinc="' + esc(p.auth_id) + '">Dar acesso</button>'
        +   '<button class="btn mini" data-excl-login="' + esc(p.auth_id) + '"'
        +     ' data-nome="' + esc(p.email) + '">Excluir</button>'
        + '</div></div>';
    });
  }

  // ── quem já tem acesso ──
  h += '<div class="secTit">Com acesso</div>';
  users.forEach(u => {
    h += '<div class="linhaU' + (u.ativo ? '' : ' off') + '">'
      + '<div><b>' + esc(u.nome) + (u.sou_eu ? ' <span class="tag">você</span>' : '')
      +   (u.is_admin ? ' <span class="tag adm">admin</span>' : '') + '</b>'
      + '<small>' + esc(u.email||'sem e-mail') + ' · ' + esc(u.perfil||'sem perfil')
      +   (u.tarefas_concluidas ? ' · ' + u.tarefas_concluidas + ' tarefa(s) concluída(s)' : '')
      +   (u.ativo ? '' : ' · DESATIVADO') + '</small></div>'
      + '<div class="acoesU">'
      +   '<select class="mini" data-perfil="' + esc(u.id) + '" data-antes="' + esc(u.perfil_id||'') + '"'
      +     ' aria-label="Perfil de ' + esc(u.nome) + '">' + opcoesPerfil(u.perfil_id) + '</select>'
      // ITEM 3 (S32): o nome nunca foi editável — nem para o admin. "Bruno" e
      // "Vinícius" deviam ser "Bruno Santos" e "Vinícius Cortez", e a única
      // saída era mexer na tabela na marra. Vem primeiro na fileira porque é o
      // campo que mais se digita errado no cadastro.
      +   '<button class="btn mini" data-nomeu="' + esc(u.id) + '" data-nome="' + esc(u.nome) + '">Nome</button>'
      +   '<button class="btn mini" data-senha="' + esc(u.id) + '" data-nome="' + esc(u.nome) + '">Senha</button>'
      +   '<button class="btn mini" data-email="' + esc(u.id) + '" data-nome="' + esc(u.nome) + '"'
      +     ' data-atual="' + esc(u.email||'') + '">E-mail</button>'
      +   (u.sou_eu ? '' :
             '<button class="btn mini" data-ativo="' + esc(u.id) + '" data-v="' + (u.ativo?'0':'1') + '">'
           + (u.ativo ? 'Desativar' : 'Reativar') + '</button>'
           + '<button class="btn mini" data-excluir="' + esc(u.id) + '" data-nome="' + esc(u.nome) + '">Excluir</button>')
      + '</div></div>';
  });

  // ── cadastrar alguém, aqui mesmo ──
  // Formulário aberto, não escondido atrás de um botão: cadastrar gente é a
  // razão de esta aba existir, e um passo a menos é um esquecimento a menos.
  h += '<div class="secTit">Cadastrar uma pessoa nova</div>'
    +  '<div class="formNovo">'
    +   '<div class="dupla">'
    +    '<div class="campo"><label for="nuNome">Nome</label>'
    +     '<input id="nuNome" type="text" placeholder="Como aparece no quadro"'
    +      ' autocomplete="off" name="nu_nome_nofill"></div>'
    +    '<div class="campo"><label for="nuEmail">E-mail (é o login)</label>'
    +     '<input id="nuEmail" type="email" placeholder="nome@engetap.com.br"'
    +      ' autocomplete="off" name="nu_email_nofill"></div>'
    +   '</div>'
    +   '<div class="dupla">'
    +    '<div class="campo"><label for="nuPerfil">Perfil</label>'
    +     '<select id="nuPerfil">' + opcoesPerfil(null) + '</select></div>'
    +    '<div class="campo"><label for="nuSenha">Senha inicial</label>'
    +     '<div class="linhaSenha">'
    +      '<input id="nuSenha" type="text" autocomplete="off" name="nu_senha_nofill"'
    +       ' spellcheck="false" value="' + esc(senhaSugerida()) + '">'
    +      '<button class="btn mini" type="button" id="nuOutra" title="Sortear outra">Outra</button>'
    +      '<button class="btn mini" type="button" id="nuCopiar">Copiar</button>'
    +     '</div></div>'
    +   '</div>'
    +   '<p class="nota">A senha aparece à mostra de propósito: você precisa passá-la à '
    +   'pessoa. Ela entra com esse e-mail e essa senha, e o e-mail já nasce confirmado — '
    +   'não há link para clicar nem confirmação para esperar.</p>'
    +   '<button class="btn pri" id="nuCriar">Criar acesso</button>'
    +  '</div>';

  h += '<p class="nota" style="margin-top:14px">'
    +  '<b>Desativar</b> fecha o acesso na hora e mantém o histórico com o nome da pessoa — '
    +  'é o que se usa quando alguém sai da empresa. <b>Excluir</b> apaga o cadastro e só '
    +  'funciona para quem ainda não trabalhou no sistema (cadastro feito errado, pessoa que '
    +  'nunca chegou a usar).</p></div>';

  c.innerHTML = h;

  // ── criar ──
  const sortear = () => { document.getElementById('nuSenha').value = senhaSugerida(); };
  document.getElementById('nuOutra').addEventListener('click', sortear);
  document.getElementById('nuCopiar').addEventListener('click', () => {
    const v = document.getElementById('nuSenha').value;
    copiar(v, 'Senha copiada.');
  });
  document.getElementById('nuCriar').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const nome  = document.getElementById('nuNome').value.trim();
      const email = document.getElementById('nuEmail').value.trim();
      const senha = document.getElementById('nuSenha').value;
      const perfil= document.getElementById('nuPerfil').value;
      if (!nome)  { toast('Escreva o nome da pessoa.','err'); document.getElementById('nuNome').focus(); return; }
      if (!email) { toast('Escreva o e-mail — é com ele que a pessoa entra.','err');
                    document.getElementById('nuEmail').focus(); return; }
      if (senha.length < 8){ toast('A senha precisa de pelo menos 8 caracteres.','err'); return; }
      try{
        if (DEMO) demoCriarUsuario(nome, email, perfil);
        else await rpc('tf_criar_usuario',
          { p_nome:nome, p_email:email, p_perfil_id:perfil, p_senha:senha });
        // A senha some da tela junto com o formulário. Ela é mostrada de novo
        // aqui, no aviso, porque este é o único momento em que existe em texto:
        // depois disto só há hash, e nem o admin consegue ver.
        toast('Acesso criado para ' + nome + '.','ok');
        await cfgUsuarios();
        avisoNoTopo('Anote antes de sair desta tela: <b>' + esc(email) + '</b> · senha '
          + '<b>' + esc(senha) + '</b>. A partir de agora a senha não pode mais ser '
          + 'consultada — só trocada, no botão Senha.');
      }catch(e){ toast(e.message,'err'); }
    });
  });

  // ── trocar o perfil ──
  // Passa por `tf_definir_perfil` e não por um UPDATE direto: é a função que
  // recusa deixar o TapFlow sem nenhum admin, inclusive quando quem se rebaixa
  // é você mesmo. O <select> volta ao valor antigo quando a gravação falha —
  // deixá-lo mostrando o perfil novo seria o app mentindo sobre a permissão.
  c.querySelectorAll('[data-perfil]').forEach(sel => sel.addEventListener('change', async () => {
    const antes = sel.dataset.antes || '';
    sel.disabled = true;
    try{
      if (DEMO) demoDefinirPerfil(sel.dataset.perfil, sel.value);
      else await rpc('tf_definir_perfil', { p_id: sel.dataset.perfil, p_perfil_id: sel.value });
      sel.dataset.antes = sel.value;
      toast('Perfil alterado.','ok');
      cfgUsuarios();
    }catch(e){ sel.value = antes; toast(e.message,'err'); }
    finally{ sel.disabled = false; }
  }));

  // ── dar acesso a login que já existia ──
  c.querySelectorAll('[data-vinc]').forEach(b => b.addEventListener('click',
    () => _semDuploEnvio_(b, async () => {
      const id = b.dataset.vinc;
      const nome = (document.getElementById('nm_'+id)||{}).value || '';
      if (!nome.trim()){ toast('Escreva o nome da pessoa.','err'); return; }
      try{
        if (DEMO) demoVincular(id, nome.trim(), document.getElementById('pf_'+id).value);
        else await rpc('tf_vincular_usuario', { p_auth_id:id, p_nome:nome.trim(),
          p_perfil_id: document.getElementById('pf_'+id).value });
        toast('Acesso liberado para ' + nome.trim() + '.','ok'); cfgUsuarios();
      }catch(e){ toast(e.message,'err'); }
    })));

  // ── ativar / desativar ──
  c.querySelectorAll('[data-ativo]').forEach(b => b.addEventListener('click',
    () => _semDuploEnvio_(b, async () => {
      try{
        if (DEMO) demoAtivo(b.dataset.ativo, b.dataset.v === '1');
        else await rpc('tf_usuario_ativo', { p_id:b.dataset.ativo, p_ativo: b.dataset.v === '1' });
        toast(b.dataset.v === '1' ? 'Reativado.' : 'Acesso encerrado.','ok'); cfgUsuarios();
      }catch(e){ toast(e.message,'err'); }
    })));

  // ── senha ──
  c.querySelectorAll('[data-nomeu]').forEach(b => b.addEventListener('click',
    () => modalNome(b.dataset.nomeu, b.dataset.nome, cfgUsuarios)));
  c.querySelectorAll('[data-senha]').forEach(b => b.addEventListener('click',
    () => modalSenha(b.dataset.senha, b.dataset.nome)));

  // ── e-mail ──
  c.querySelectorAll('[data-email]').forEach(b => b.addEventListener('click',
    () => modalEmail(b.dataset.email, b.dataset.nome, b.dataset.atual)));

  // ── excluir ──

    () => modalExcluirUsuario(b.dataset.excluir, b.dataset.nome, false)));

    () => modalExcluirUsuario(b.dataset.exclLogin, b.dataset.nome, true)));
}

// Aviso que fica na tela até alguém fechar. Toast some em segundos, e a senha
// recém-criada é a única informação desta tela que não dá para recuperar
// depois — ela não pode depender de o Fernando estar olhando na hora certa.
function avisoNoTopo(html){
  const c = document.getElementById('cfgCorpo');
  if (!c) return;
  const d = document.createElement('div');
  d.className = 'aviso ok';
  d.innerHTML = html + ' <button class="btn mini" type="button">Entendi</button>';
  d.querySelector('button').addEventListener('click', () => d.remove());
  const painel = c.querySelector('.painel');
  if (painel) painel.insertBefore(d, painel.children[1] || null); else c.prepend(d);
  d.scrollIntoView({ block:'nearest' });
}

function copiar(texto, msgOk){
  const feito = () => toast(msgOk || 'Copiado.','ok');
  // navigator.clipboard não existe fora de https (o app aberto do disco, no
  // modo demo, cai aqui) — sem o plano B o botão simplesmente não faria nada.
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texto).then(feito, () => copiarVelho(texto, feito));
  } else copiarVelho(texto, feito);
}
function copiarVelho(texto, feito){
  try{
    const t = document.createElement('textarea');
    t.value = texto; t.setAttribute('readonly','');
    t.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove(); feito();
  }catch(e){ toast('Não deu para copiar — selecione e copie à mão.','err'); }
}

/** ITEM 3 (S32): corrigir o nome. Uma função de banco só (`tf_definir_nome`)
 *  atende os dois caminhos — o admin nesta tela, e cada pessoa em "Meu perfil"
 *  —, e é ela que decide quem pode o quê. A tela não repete a regra: se o
 *  próprio usuário abrir este modal, o servidor aceita; se for o de um colega
 *  sem ser admin, recusa com a frase certa. Uma regra escrita em dois lugares
 *  é uma regra a mais para divergir da primeira. */
function modalNome(id, nome, aposGravar){
  const souEu = String(id) === String(meuId());
  abrirModal('Nome de ' + nome,
      '<p class="nota" style="margin-top:0">É o nome que aparece no quadro, na agenda, '
    + 'nas designações e no rodapé dos relatórios. Trocar aqui muda em todos eles.</p>'
    + '<div class="campo"><label for="mnNome">Nome</label>'
    + '<input id="mnNome" type="text" autocomplete="off" name="mn_nofill" maxlength="80" value="'
    + esc(nome || '') + '" placeholder="ex.: Bruno Santos"></div>'
    + '<div class="dica">E-mail, senha e perfil continuam sendo do administrador — '
    + 'aqui é só o nome.</div>'
    + '<div class="dica" id="mnMsg" style="color:var(--crit)"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Gravar nome', pri:true, onClick: async () => {
        const msg = document.getElementById('mnMsg');
        const n = (document.getElementById('mnNome').value || '').replace(/\s+/g,' ').trim();
        if (n.length < 2){ msg.textContent = 'Escreva ao menos duas letras.'; return; }
        try{
          if (DEMO) throw new Error('Modo demonstração: o nome não é gravado.');
          await rpc('tf_definir_nome', { p_id: id, p_nome: n });
          fecharModal();
          toast('Nome gravado: ' + n, 'ok');
          // o próprio nome muda o crachá e a sessão; o de outra pessoa muda as
          // listas de quem faz o quê — as duas coisas se recarregam aqui
          if (souEu){ await quemSou(); pintarCracha(); }
          await carregarEquipe();
          if (aposGravar) await aposGravar();
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

// ── TAREFAS POR PERFIL (S31) ────────────────────────────────────────────────
// ITEM 1 do documento de 17/09. O TapFlow sempre teve, por tarefa, a lista de
// perfis que podem executá-la (`perfis_responsaveis`) — o que não existia era
// a tela para mexer nela. Mudar exigia rodar SQL, e a única saída prática era
// designar alguém de outro perfil, que é o defeito relatado: a pessoa recebe a
// tarefa e não acha botão nenhum.
//
// Três decisões desta tela, e por quê:
//
//  · O EIXO É O PERFIL, não a tarefa. O pedido foi "escolher um perfil e ver
//    quais tarefas ele pode fazer". Marcar e desmarcar uma coluna é mais
//    parecido com o raciocínio de quem contrata alguém ("o que o Vinícius vai
//    poder fazer?") do que abrir tarefa por tarefa.
//
//  · CADA MARCA GRAVA NA HORA, e o toast diz quantas OS abertas foram junto.
//    Botão "Salvar" no fim de 37 caixas é onde se perde metade do trabalho.
//
//  · O AVISO DE APP. `executor` (campo/escritório) é DERIVADO desses perfis, e
//    é ele que manda a tarefa para o aplicativo de Campo. Pôr "inspetor" em
//    "Emitir ART" não dá só permissão: faz a tarefa aparecer no celular do
//    inspetor. Por isso a tela pergunta antes quando a marca muda o lado.
let _cfgTpl = null;      // as tarefas dos moldes, como vieram do banco
let _cfgPerfilSel = null;
// ── ITEM 6 (S36): A MATRIZ ──────────────────────────────────────────────────
// A tela do S31 responde "o que ESTE perfil faz". A pergunta do documento de
// 23/09 é outra: "estes dois perfis fazem a mesma coisa?" — e ela só se
// responde vendo os perfis LADO A LADO. A matriz é a mesma lista de tarefas,
// com um perfil por coluna; cada caixa grava pela MESMA função
// (`tf_salvar_perfis_tarefa`), com o mesmo aviso de mudança de app. As telas
// (módulos) aparecem em cima só para leitura — elas se editam em Perfis, que
// grava o perfil inteiro de uma vez.
let _tpModo = 'perfil';   // 'perfil' | 'matriz'
let _tpPerfis = [];

async function cfgTarefasPerfil(){
  const c = document.getElementById('cfgCorpo');
  c.innerHTML = '<p class="nota">Carregando…</p>';
  let perfis = [], tarefas = [];
  try{
    [perfis, tarefas] = await Promise.all([
      DEMO ? demoPerfis() : get('v_perfis?select=*&ativo=is.true&order=id'),
      DEMO ? demoTarefasTemplate() : rpc('tf_tarefas_do_template', { p_template_id: null })
    ]);
  }catch(e){
    c.innerHTML = '<div class="painel"><h3>Tarefas por perfil</h3>'
      + '<div class="aviso"><b>Não deu para carregar os moldes.</b><br>' + esc(e.message)
      + '<br>Falta rodar o <b>52_ajustes_s31.sql</b>?</div>'
      + '<button class="btn" id="tpRetry">Tentar de novo</button></div>';
    document.getElementById('tpRetry').addEventListener('click', cfgTarefasPerfil);
    return;
  }
  _cfgTpl = tarefas;
  // o admin fica de fora da lista de escolha: ele passa em tudo por definição,
  // e marcar caixa para ele daria a impressão de que desmarcar tira algo
  const escolhiveis = perfis.filter(p => !p.is_admin);
  if (!_cfgPerfilSel || !escolhiveis.some(p => p.id === _cfgPerfilSel))
    _cfgPerfilSel = (escolhiveis[0] || {}).id || null;

  _tpPerfis = perfis;
  c.innerHTML = '<div class="painel"><h3>Quem pode fazer cada tarefa</h3>'
    + '<div class="tpModo"><div class="chips" id="tpModo">'
    + '<button type="button" class="fchip' + (_tpModo === 'perfil' ? ' on' : '') + '" data-m="perfil">Um perfil por vez</button>'
    + '<button type="button" class="fchip' + (_tpModo === 'matriz' ? ' on' : '') + '" data-m="matriz">Todos lado a lado</button>'
    + '</div><button type="button" class="btn" id="tpIgualar">Igualar um perfil a outro…</button></div>'
    + '<p class="nota">Esta lista é <b>diferente</b> do “O que aparece na tela”, ao lado em '
    + '<b>Perfis</b>: lá se decide por onde a pessoa navega; aqui, tarefa por tarefa, quem pode '
    + 'executá-la. Marcar vale <b>para sempre</b> — toda OS nova nasce com a regra — '
    + '<b>e para as OS já abertas</b> cuja tarefa ainda não foi resolvida. O que já foi '
    + 'concluído fica como está: é histórico.</p>'
    + '<div class="chips" id="tpPerfis"></div>'
    + '<div id="tpCorpo"></div></div>';

  document.querySelectorAll('#tpModo [data-m]').forEach(b => b.addEventListener('click', () => {
    _tpModo = b.dataset.m; cfgTarefasPerfil();
  }));
  document.getElementById('tpIgualar').addEventListener('click', () => modalIgualarPerfis(escolhiveis));
  const ch = document.getElementById('tpPerfis');
  if (_tpModo === 'matriz'){ ch.hidden = true; return tpPintarMatriz(perfis); }
  escolhiveis.forEach(p => {
    const b = document.createElement('button');
    b.className = 'fchip' + (p.id === _cfgPerfilSel ? ' on' : '');
    b.textContent = p.nome;
    b.addEventListener('click', () => { _cfgPerfilSel = p.id; cfgTarefasPerfil(); });
    ch.appendChild(b);
  });
  tpPintarTarefas(perfis);
}

function tpPintarTarefas(perfis){
  const cx = document.getElementById('tpCorpo');
  if (!cx) return;
  const perfil = (perfis || []).find(p => p.id === _cfgPerfilSel);
  if (!perfil || !(_cfgTpl || []).length){
    cx.innerHTML = '<p class="nota">Nenhum molde para mostrar.</p>';
    return;
  }
  const moldes = new Map();
  _cfgTpl.forEach(t => {
    if (!moldes.has(t.template_id)) moldes.set(t.template_id, { nome:t.template, itens:[] });
    moldes.get(t.template_id).itens.push(t);
  });

  const LADO = { campo:'app de Campo', adm:'escritório', ambos:'campo e escritório' };
  cx.innerHTML = [...moldes.entries()].map(([id, m]) =>
      '<div class="secTit">' + esc(m.nome) + '</div>'
    + '<table class="tab tpTab"><thead><tr>'
    +   '<th style="width:34px"></th><th>Tarefa</th><th>Etapa</th>'
    +   '<th>Quem faz hoje</th><th>Executa em</th><th class="num">OS abertas</th>'
    + '</tr></thead><tbody>'
    + m.itens.map(t => {
        const tem = (t.perfis_responsaveis || []).includes(perfil.id);
        return '<tr' + (tem ? ' class="tpOn"' : '') + '>'
        + '<td><input type="checkbox" data-tp="' + esc(t.template_id + '|' + t.tarefa_id) + '"'
        +   (tem ? ' checked' : '') + ' aria-label="' + esc(t.nome) + '"></td>'
        + '<td><b>' + esc(t.nome) + '</b> <span class="mono mini">' + esc(t.tarefa_id) + '</span></td>'
        + '<td>' + esc(t.fase || '') + '</td>'
        + '<td class="mini">' + esc((t.perfis_responsaveis || []).join(', ') || '—') + '</td>'
        + '<td class="mini">' + esc(LADO[t.executor] || t.executor || '') + '</td>'
        + '<td class="num">' + (t.abertas || 0) + '</td>'
        + '</tr>';
      }).join('')
    + '</tbody></table>').join('');

  cx.querySelectorAll('[data-tp]').forEach(ck => ck.addEventListener('change', () => {
    const [tpl, tid] = ck.dataset.tp.split('|');
    tpAlternar(tpl, tid, ck, perfis);
  }));
}

/** A matriz (S36): tarefas nas linhas, perfis nas colunas. */
function tpPintarMatriz(perfis){
  const cx = document.getElementById('tpCorpo');
  if (!cx) return;
  const cols = (perfis || []).filter(p => !p.is_admin);
  if (!cols.length || !(_cfgTpl || []).length){ cx.innerHTML = '<p class="nota">Nada para mostrar.</p>'; return; }
  const cab = '<th class="tpMx1">Tarefa</th>' + cols.map(p =>
      '<th class="tpMxP" title="' + esc(p.nome) + '">' + esc(p.nome) + '</th>').join('');
  const moldes = new Map();
  _cfgTpl.forEach(t => {
    if (!moldes.has(t.template_id)) moldes.set(t.template_id, { nome:t.template, itens:[] });
    moldes.get(t.template_id).itens.push(t);
  });
  // conta de diferenças entre colunas: é a resposta rápida para "são iguais?"
  const telas = MODULOS.map(([k, rot]) => '<tr><td class="tpMx1">' + esc(rot) + '</td>'
      + cols.map(p => {
          const m = p.modulos || [];
          const tem = !m.length || m.indexOf(k) >= 0;   // sem módulo nenhum = vê tudo (regra do S10)
          return '<td class="tpMxC">' + (tem ? '<span class="tpSim" aria-label="sim">✓</span>' : '<span class="tpNao" aria-label="não">—</span>') + '</td>';
        }).join('') + '</tr>').join('');
  cx.innerHTML = '<div class="tpMatriz"><table class="tab tpTab tpMx"><thead><tr>' + cab + '</tr></thead><tbody>'
    + '<tr class="tpMxSec"><td colspan="' + (cols.length + 1) + '">Telas que aparecem (só leitura — muda em <b>Perfis</b>)</td></tr>'
    + telas
    + [...moldes.entries()].map(([id, m]) =>
        '<tr class="tpMxSec"><td colspan="' + (cols.length + 1) + '">' + esc(m.nome) + '</td></tr>'
      + m.itens.map(t => '<tr><td class="tpMx1"><b>' + esc(t.nome) + '</b> <span class="mono mini">' + esc(t.tarefa_id) + '</span>'
          + '<br><span class="tpDim">' + esc(t.fase || '') + '</span></td>'
          + cols.map(p => {
              const tem = (t.perfis_responsaveis || []).includes(p.id);
              return '<td class="tpMxC' + (tem ? ' tpOn' : '') + '"><input type="checkbox" data-tp="'
                + esc(t.template_id + '|' + t.tarefa_id) + '" data-pf="' + esc(p.id) + '"' + (tem ? ' checked' : '')
                + ' aria-label="' + esc(p.nome + ' — ' + t.nome) + '"></td>';
            }).join('') + '</tr>').join('')).join('')
    + '</tbody></table></div>'
    + '<p class="nota">O administrador não tem coluna: ele passa em tudo por definição.</p>';
  cx.querySelectorAll('[data-tp]').forEach(ck => ck.addEventListener('change', () => {
    const [tpl, tid] = ck.dataset.tp.split('|');
    tpAlternar(tpl, tid, ck, perfis, ck.dataset.pf);
  }));
}
const tpRepintar = perfis => (_tpModo === 'matriz' ? tpPintarMatriz(perfis) : tpPintarTarefas(perfis));

/** "Igualar um perfil a outro" (S36): tudo que a ORIGEM faz, o DESTINO passa a
 *  fazer também — tarefas e, se marcado, telas. Só ACRESCENTA. Cópia pontual:
 *  tarefa criada depois marcando só um dos dois deixa o outro de fora, e a
 *  matriz é onde isso aparece. */
function modalIgualarPerfis(escolhiveis){
  if (DEMO) return toast('Modo demonstração: não iguala perfis.','err');
  const opts = sel => escolhiveis.map(p => '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>'
                                        + esc(p.nome) + '</option>').join('');
  abrirModal('Igualar um perfil a outro',
      '<div class="dupla"><div class="campo"><label for="igO">Tudo que este faz…</label><select id="igO">'
    + opts((escolhiveis[0] || {}).id) + '</select></div>'
    + '<div class="campo"><label for="igD">…este passa a fazer também</label><select id="igD">'
    + opts((escolhiveis[1] || escolhiveis[0] || {}).id) + '</select></div></div>'
    + '<label class="chk"><input type="checkbox" id="igT" checked> Tarefas (vale para OS nova e para as abertas não resolvidas)</label>'
    + '<label class="chk"><input type="checkbox" id="igM"> Telas que aparecem (módulos)</label>'
    + '<p class="nota">Só acrescenta: nada que o segundo perfil já faz é tirado. Antes de gravar, '
    + 'o TapFlow mostra o que muda.</p><div id="igPrev"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Ver o que muda', pri:true, onClick: async () => {
        const o = document.getElementById('igO').value, d = document.getElementById('igD').value;
        const t = document.getElementById('igT').checked, m = document.getElementById('igM').checked;
        let r;
        try{ r = await rpc('tf_igualar_perfil', { p_origem:o, p_destino:d, p_tarefas:t, p_modulos:m, p_confirmado:false }); }
        catch(e){ return toast(e.message,'err'); }
        const tar = r.tarefas || [], mods = r.modulos || [];
        const LADO = { campo:'app de Campo', adm:'escritório', ambos:'campo e escritório' };
        const nomeMod = k => (MODULOS.find(x => x[0] === k) || [k,k])[1];
        if (!tar.length && !mods.length){
          document.getElementById('igPrev').innerHTML = '<div class="aviso ok"><b>' + esc(r.destino)
            + '</b> já faz tudo que <b>' + esc(r.origem) + '</b> faz. Nada a igualar.</div>';
          return;
        }
        abrirModal('Confirmar: ' + r.origem + ' → ' + r.destino,
            (tar.length ? '<div class="secTit">' + tar.length + ' tarefa(s) passam a aceitar ' + esc(r.destino) + '</div>'
              + '<div class="listaItens">' + tar.map(x => '<div class="lin"><span>' + esc(x.nome)
                + ' <span class="mono mini">' + esc(x.tarefa_id) + '</span> <span class="nota">' + esc(x.template) + '</span></span>'
                + (x.executor_antes !== x.executor_depois
                    ? '<span class="chip urg">passa a ir também para ' + esc(LADO[x.executor_depois] || x.executor_depois) + '</span>' : '')
                + '</div>').join('') + '</div>' : '')
          + (mods.length ? '<div class="secTit">Telas acrescentadas</div><p>' + mods.map(k => esc(nomeMod(k))).join(', ') + '</p>' : '')
          + (Number(r.mudam_de_app) ? '<div class="aviso">' + r.mudam_de_app + ' tarefa(s) mudam de app — '
              + 'quem executa em campo passa a vê-las no celular, ou o contrário.</div>' : ''),
          [{ label:'Voltar', onClick: fecharModal },
           { label:'Igualar', pri:true, onClick: async () => {
              try{
                const g = await rpc('tf_igualar_perfil', { p_origem:o, p_destino:d, p_tarefas:t, p_modulos:m, p_confirmado:true });
                fecharModal(); fecharModal();
                toast(g.destino + ' igualado a ' + g.origem + ': ' + g.tarefas + ' tarefa(s)'
                  + ((g.modulos || []).length ? ', ' + g.modulos.length + ' tela(s)' : '')
                  + (g.os_afetadas ? ' — ' + g.os_afetadas + ' OS aberta(s) já valendo.' : '.'), 'ok');
                _tpModo = 'matriz'; cfgTarefasPerfil();
              }catch(e){ toast(e.message,'err'); }
           }}]);
     }}]);
}

/** Marca ou desmarca o perfil nesta tarefa. Grava na hora; se a mudança troca
 *  o LADO da tarefa (campo ↔ escritório), pergunta antes — é o que decide se
 *  ela aparece no aplicativo de Campo. S36: o perfil vem por parâmetro na
 *  matriz (uma coluna por perfil); na vista de um perfil, é o selecionado. */
function tpAlternar(tplId, tarefaId, ck, perfis, perfilId){
  const t = (_cfgTpl || []).find(x => x.template_id === tplId && x.tarefa_id === tarefaId);
  if (!t) return;
  const pf = perfilId || _cfgPerfilSel;
  const atuais = (t.perfis_responsaveis || []).slice();
  const marcar = ck.checked;
  const novos = marcar ? atuais.concat([pf]).filter((v,i,a) => a.indexOf(v) === i)
                       : atuais.filter(x => x !== pf);
  const voltar = () => { ck.checked = !marcar; };

  if (!novos.length){
    toast('Deixe ao menos um perfil: sem nenhum, a tarefa vira de escritório e some do app de Campo.','err');
    voltar(); return;
  }

  // o lado da tarefa é derivado dos perfis — conferido aqui só para AVISAR;
  // quem calcula de verdade é o banco (`tf__executor_de`), e é o número dele
  // que aparece no toast depois.
  const ladoDe = lista => {
    const ps = (perfis || []).filter(p => lista.includes(p.id) && !p.is_admin);
    const campo = ps.some(p => p.executa_em === 'campo' || p.executa_em === 'ambos');
    const adm   = ps.some(p => p.executa_em === 'adm'   || p.executa_em === 'ambos');
    return campo && adm ? 'ambos' : campo ? 'campo' : 'adm';
  };
  const LADO = { campo:'só no app de Campo', adm:'só no escritório', ambos:'no campo e no escritório' };
  const antes = t.executor || ladoDe(atuais), depois = ladoDe(novos);

  const gravar = async () => {
    if (DEMO){ toast('Modo demonstração: a mudança não é gravada.','err'); voltar(); return; }
    try{
      const r = await rpc('tf_salvar_perfis_tarefa',
        { p_template_id: tplId, p_tarefa_id: tarefaId, p_perfis: novos });
      t.perfis_responsaveis = novos;
      t.executor = r.executor_depois || depois;
      toast('“' + t.nome + '”: ' + novos.join(', ')
        + (Number(r.os_afetadas) ? ' — ' + r.os_afetadas + ' OS aberta(s) já valendo.'
                                 : ' — nenhuma OS aberta usava esta tarefa.'), 'ok');
      tpRepintar(perfis);
    }catch(e){ toast(e.message,'err'); voltar(); }
  };

  if (antes !== depois){
    abrirModal('Isto muda onde a tarefa aparece',
        '<p><b>' + esc(t.nome) + '</b> passa a ser executada <b>' + esc(LADO[depois] || depois)
      + '</b> (hoje é ' + esc(LADO[antes] || antes) + ').</p>'
      + '<div class="aviso">Isso não é só permissão: é o que faz a tarefa '
      + (depois === 'adm'
         ? '<b>sumir do aplicativo de Campo</b> de quem já a fazia no celular.'
         : '<b>aparecer no aplicativo de Campo</b>, no celular do inspetor.')
      + '</div>'
      + '<p class="nota">Vale para as OS abertas em que esta tarefa ainda não foi resolvida.</p>',
      [{ label:'Cancelar', onClick: () => { fecharModal(); voltar(); } },
       { label:'Mudar assim mesmo', pri:true, onClick: async () => { fecharModal(); await gravar(); } }]);
    return;
  }
  gravar();
}

async function cfgDocumentos(){
  const c = document.getElementById('cfgCorpo');
  c.innerHTML = '<div class="painel"><h3>Documentos e arquivos</h3>'
    + '<p class="nota">Tudo que o TapFlow gerou ou guardou, de todas as OS. '
    + 'Serve para achar “a proposta da Gerdau de agosto” sem lembrar em qual OS ela estava.</p>'
    + '<div class="campo"><input id="dBusca" type="text" placeholder="Buscar por cliente, OS, tipo ou nome"></div>'
    + '<div id="dLista"><p class="nota">Carregando…</p></div></div>';

  let docs = [];
  try{ docs = DEMO ? demoDocs() : await get('v_documentos?select=*&order=quando.desc&limit=300'); }
  catch(e){ document.getElementById('dLista').innerHTML=''; toast(e.message,'err'); return; }

  const ROTULO = { proposta:'Proposta', pedido_compra:'Pedido de compra', certificado:'Certificado',
    relatorio:'Relatório', foto_item:'Foto de item', foto_tarefa:'Foto', assinatura:'Aceite',
    outro:'Outro' };

  function lista(){
    const termos = norm((document.getElementById('dBusca')||{}).value||'').trim().split(/\s+/).filter(Boolean);
    const el = document.getElementById('dLista');

      if (!termos.length) return true;

      return termos.every(w => alvo.includes(w));

    el.innerHTML = '<table class="tab"><thead><tr><th>Quando</th><th>Tipo</th>'
      + '<th>Identificação</th><th>OS</th><th>Cliente</th><th>Quem</th><th></th></tr></thead><tbody>'

        + '<td>' + new Date(d.quando).toLocaleDateString('pt-BR') + '</td>'
        + '<td>' + esc(ROTULO[d.tipo] || d.tipo) + '</td>'
        + '<td>' + esc(d.identificacao||'—') + '</td>'

      + '</tbody></table>'
      + '<p class="nota">' + achados.length + ' de ' + docs.length + ' registro(s).</p>';
  }
  document.getElementById('dBusca').addEventListener('input', debounce(lista, 200));

// A capacidade do dia é DADO, e dado precisa de tela. Eu tinha escrito na nota
// de entrega "ajuste parametros_turno" sem dizer que isso era SQL na mão — o que
// é o mesmo que não ter entregue.
// ── ITEM 10 (S29): UM HORÁRIO POR DIA DA SEMANA ─────────────────────────────
// A Engetap trabalha 08–17 de segunda a quinta e 08–16 na sexta. A tela era um
// formulário só — não havia número que servisse para os dois. Agora são as sete
// linhas numa tabela: marcar/desmarcar o dia útil, horário e intervalo de cada
// um. "Copiar para os dias úteis" poupa redigitar quando só um dia é diferente.
// Grava as sete de uma vez (`tf_salvar_turno`, que valida no banco).
async function cfgTurno(){
  const c = document.getElementById('cfgCorpo');
  c.innerHTML = '<p class="nota">Carregando…</p>';
  const NOMES_D = ['','Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  let dias = null;
  try{
    if (DEMO) dias = [1,2,3,4,5,6,7].map(n => ({ dia_semana:n, ativo:n <= 5,
      inicio:'08:00:00', fim: n === 5 ? '16:00:00' : '17:00:00', intervalo_min: n <= 5 ? 60 : 0 }));
    else dias = await get('turno_dias?select=*&order=dia_semana');
  }catch(e){
    c.innerHTML = '<div class="painel"><h3>Turno</h3><div class="aviso"></div></div>';
    c.querySelector('.aviso').textContent = 'Não deu para ler o turno: ' + e.message
      + (/turno_dias/.test(e.message) ? ' — falta rodar o 51_ajustes_s29.sql no Supabase.' : '');
    return;
  }
  if (!dias || dias.length !== 7){
    c.innerHTML = '<div class="painel"><h3>Turno</h3><p class="nota">A tabela <code>turno_dias</code> '
      + 'não tem os sete dias. Rode o <code>51_ajustes_s29.sql</code>.</p></div>';
    return;
  }
  const hhmm = v => String(v || '').slice(0,5);
  c.innerHTML = '<div class="painel"><h3>Turno de trabalho</h3>'
    + '<p class="nota">É daqui que sai a <b>capacidade de cada dia</b> na Agenda da equipe e a conta '
    + 'dos prazos em dias úteis. Mudar aqui recalcula as barras na hora — nenhuma versão nova de app.</p>'
    + '<div style="overflow-x:auto"><table class="tbl turnoTbl"><thead><tr>'
    + '<th>Dia</th><th>Útil</th><th>Começa</th><th>Termina</th><th>Intervalo (min)</th>'
    + '<th class="num">Capacidade</th></tr></thead><tbody>'
    + dias.map(d => '<tr data-d="' + d.dia_semana + '">'
        + '<td><b>' + NOMES_D[d.dia_semana] + '</b></td>'
        + '<td><input type="checkbox" class="tuA" aria-label="' + NOMES_D[d.dia_semana] + ' é dia útil"'
        +   (d.ativo ? ' checked' : '') + '></td>'
        + '<td><input type="time" class="tuI" value="' + esc(hhmm(d.inicio)) + '" aria-label="Começa"></td>'
        + '<td><input type="time" class="tuF" value="' + esc(hhmm(d.fim)) + '" aria-label="Termina"></td>'
        + '<td><input type="number" class="tuP" min="0" max="599" step="5" style="width:80px" value="'
        +   esc(String(d.intervalo_min == null ? 60 : d.intervalo_min)) + '" aria-label="Intervalo"></td>'
        + '<td class="num tuC"></td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="linhaBtns" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px">'
    + '<button class="btn" type="button" id="tuCopia">Copiar o horário de segunda para os outros dias úteis</button></div>'
    + '<p class="nota" id="tuCap"></p>'
    + '<button class="btn pri" id="tuSalvar" type="button">Salvar turno</button></div>';

  const linhas = [...c.querySelectorAll('tr[data-d]')];
  const ler = tr => ({ dia_semana: Number(tr.dataset.d),
    ativo: tr.querySelector('.tuA').checked,
    inicio: tr.querySelector('.tuI').value, fim: tr.querySelector('.tuF').value,
    intervalo_min: Number(tr.querySelector('.tuP').value) || 0 });
  const capDe = x => Math.max(0, _minDe(x.fim) - _minDe(x.inicio) - x.intervalo_min);
  const conta = () => {
    let soma = 0, uteis = 0;
    linhas.forEach(tr => {
      const x = ler(tr);
      tr.classList.toggle('turnoOff', !x.ativo);
      ['.tuI','.tuF','.tuP'].forEach(k => tr.querySelector(k).disabled = !x.ativo);
      const cap = capDe(x);
      const ruim = x.ativo && (!x.inicio || !x.fim || x.fim <= x.inicio || cap <= 0);
      tr.querySelector('.tuC').textContent = !x.ativo ? 'não útil' : ruim ? 'horário inválido' : minHora(cap);
      tr.querySelector('.tuC').style.color = ruim ? 'var(--crit)' : '';
      if (x.ativo && !ruim){ soma += cap; uteis++; }
    });
    document.getElementById('tuCap').textContent = uteis
      ? uteis + ' dia(s) útil(eis) · ' + minHora(soma) + ' na semana, por pessoa.'
      : 'Nenhum dia útil marcado — a agenda ficaria vazia.';
  };
  c.querySelectorAll('input').forEach(el => el.addEventListener('input', conta));
  c.querySelectorAll('.tuA').forEach(el => el.addEventListener('change', conta));
  document.getElementById('tuCopia').addEventListener('click', () => {
    const seg = ler(linhas[0]);
    linhas.slice(1).forEach(tr => {
      if (!tr.querySelector('.tuA').checked) return;
      tr.querySelector('.tuI').value = seg.inicio;
      tr.querySelector('.tuF').value = seg.fim;
      tr.querySelector('.tuP').value = seg.intervalo_min;
    });
    conta();
    toast('Copiado. Ajuste o dia que for diferente e clique em Salvar.', 'ok');
  });
  conta();

  document.getElementById('tuSalvar').addEventListener('click', e =>
    _semDuploEnvio_(e.target, async () => {
      const todos = linhas.map(ler);
      if (!todos.some(x => x.ativo)) return toast('Marque pelo menos um dia útil — sem nenhum, a agenda fica vazia.','err');
      const ruim = todos.find(x => x.ativo && (!x.inicio || !x.fim || x.fim <= x.inicio || capDe(x) <= 0));
      if (ruim) return toast(NOMES_D[ruim.dia_semana] + ': o fim tem que ser depois do começo, e o intervalo tem que caber no turno.','err');
      if (DEMO) return toast('Modo demonstração: o turno não é gravado.','err');
      try{
        await rpc('tf_salvar_turno', { p_dias: todos });
        await carregarEquipe();
        AGENDA.chave = null;
        toast('Turno gravado. A Agenda já usa a capacidade de cada dia.','ok');
      }catch(err){ toast(err.message,'err'); }
    }));
}

// ── ITEM 3 (S29): OS TRÊS PLANOS DA PROPOSTA ────────────────────────────────
// Mesma receita do Turno: uma linha só no banco (`parametros_planos`), editada

    +   campo('pl_arred', 'Arredondar para múltiplo de (R$)', String(pl.arredondar).replace('.', ','), '10 = R$ 1.082,90 vira R$ 1.080,00 · 0 = não arredondar', ' inputmode="decimal"')

                     drive_chave: document.getElementById('drCh').value.trim(),
                     drive_raiz: document.getElementById('drRaiz').value.trim() || 'TapFlow' };

  });
}

  chips.innerHTML = '';
  const todas = [{ id:null, nome_plural:'Todas', icone:'' }].concat(CAT_FAM);
  todas.forEach(f => {
    const b = document.createElement('button');
    b.className = 'fchip' + (catFamSel === f.id ? ' on' : '');
    b.textContent = (f.icone ? f.icone + ' ' : '') + f.nome_plural;
    b.addEventListener('click', () => { catFamSel = f.id; pintarCatalogo(); });
    chips.appendChild(b);
  });

  REPINTA.cat = listarCatalogo;
  await listarCatalogo();
  formCatalogo(null);
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };

/* ── FOTO DO ITEM DE CATÁLOGO ───────────────────────────────────────────────
   Duas imagens por item, e a divisão importa:
     · a MINIATURA (data URI, ≤ 60 KB) vive na tabela e desce para o celular —
       é ela que o técnico vê na lista, e precisa funcionar sem sinal;
     · a foto CHEIA fica no bucket privado, e só abre com internet.
   Ninguém precisa de 2 MB para escolher uma peça numa lista.

   A redução acontece AQUI, no navegador, antes de subir. Sem isso alguém sobe
   uma foto de 6 MB do celular e o catálogo inteiro para de sincronizar em campo. */
/* O cache guarda a MINIATURA e a VERSÃO dela. Sem a versão, trocar o modelo
   (que derruba a foto no banco, por gatilho) deixava a foto do modelo VELHO na
   tela do formulário — exatamente o caso que o gatilho existe para evitar.
   E falha de rede NÃO vira "não tem foto": "não achei" e "não consegui
   perguntar" são coisas diferentes, e a segunda tem que poder tentar de novo. */
const FOTO_CACHE = {};   // item_id → { thumb, versao }

async function fotoDoItem(id, versao){
  const c = FOTO_CACHE[id];
  if (c && (versao === undefined || c.versao === versao)) return c.thumb;
  if (DEMO){ FOTO_CACHE[id] = { thumb:null, versao:versao || '' }; return null; }
  const r = await get('catalogo_fotos?select=thumb&item_id=eq.' + id + '&limit=1');
  const thumb = (r && r[0] && r[0].thumb) || null;
  FOTO_CACHE[id] = { thumb, versao: versao || '' };
  return thumb;
}

/** Reduz para miniatura: 160px no maior lado. Tenta webp, cai para jpeg. */
function reduzirParaMiniatura(file){
  return new Promise((ok, err) => {
    const fr = new FileReader();
    fr.onerror = () => err(new Error('Não consegui ler a imagem.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => err(new Error('Arquivo não parece uma imagem.'));
      img.onload = () => {
        const max = 160;
        const esc_ = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * esc_));
        const h = Math.max(1, Math.round(img.height * esc_));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = '';
        try{ out = cv.toDataURL('image/webp', 0.8); }catch(e){}
        // Safari antigo devolve PNG quando não sabe webp — e PNG de foto é
        // enorme. Se não veio webp, força jpeg em vez de aceitar o que veio.
        if (!out || out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', 0.7);
        ok(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** Sobe a foto CHEIA para o bucket privado `catalogo` e devolve o caminho.
 *  Devolve null (sem estourar) quando não dá: a miniatura, que é o que o
 *  técnico usa em campo, não pode ser perdida porque o Storage recusou. */
async function subirFotoCheia(item, file){
  try{
    const ext  = (file.type.split('/')[1] || 'jpg').replace('jpeg','jpg');
    const path = item.id + '.' + ext;
    const url  = SUPABASE_URL + '/storage/v1/object/catalogo/' + encodeURIComponent(path)
               + '?upsert=true';
    const envia = () => fetch(url, {
      method:'POST',
      headers: Object.assign({ apikey: SUPABASE_ANON_KEY, 'Content-Type': file.type,
                               'x-upsert':'true' },
        sessao.token ? { Authorization:'Bearer ' + sessao.token } : {}),
      body: file
    });
    let r = await envia();
    if (r.status === 401 && sessao.refresh && await renovarToken()) r = await envia();
    return r.ok ? path : null;
  }catch(e){ return null; }
}

/** Baixa a foto cheia (bucket privado: precisa do token, não abre por URL). */
async function verFotoCheia(path, titulo){
  try{
    const url = SUPABASE_URL + '/storage/v1/object/catalogo/' + encodeURIComponent(path);
    const r = await fetch(url, { headers: Object.assign({ apikey: SUPABASE_ANON_KEY },
      sessao.token ? { Authorization:'Bearer ' + sessao.token } : {}) });
    if (!r.ok) throw new Error('A foto cheia não está mais no bucket (HTTP ' + r.status + ').');
    const b = URL.createObjectURL(await r.blob());
    abrirModal(titulo || 'Foto',
      '<img src="' + b + '" alt="' + esc(titulo || '') + '" '
      + 'style="width:100%;height:auto;border-radius:5px;display:block">',
      [{ label:'Fechar', pri:true, onClick: () => { URL.revokeObjectURL(b); fecharModal(); } }]);
  }catch(e){ toast(e.message,'err'); }
}

function montarFoto(item){
  const box = document.getElementById('fFotoBox');
  const inp = document.getElementById('fFotoIn');
  const del = document.getElementById('fFotoDel');
  if (!box || !inp) return;

  const desenhar = (src, caminho) => {
    box.innerHTML = '';
    if (src){
      const im = document.createElement('img');
      im.className = 'fotoCat'; im.style.width = '84px'; im.style.height = '84px';
      im.src = src; im.alt = 'Foto de ' + (item.descricao || '');
      if (caminho){
        im.style.cursor = 'zoom-in';
        im.title = 'Ver a foto em tamanho real';
        im.addEventListener('click', () => verFotoCheia(caminho, item.descricao));
      }
      box.appendChild(im);
      if (caminho){
        const lk = document.createElement('button');
        lk.type = 'button'; lk.className = 'btn mini';
        lk.style.cssText = 'display:block;margin:6px 0 0';
        lk.textContent = 'ver em tamanho real';
        lk.addEventListener('click', () => verFotoCheia(caminho, item.descricao));
        box.appendChild(lk);
      }
    } else {
      const v = document.createElement('div');
      v.className = 'fotoVazia'; v.style.width = '84px'; v.style.height = '84px';
      v.textContent = 'sem foto';
      box.appendChild(v);
    }
    if (del) del.hidden = !src;
  };
  desenhar(null);
  // Busca miniatura e caminho juntos: a foto cheia só existe se alguém subiu.
  (async () => {
    try{
      const r = DEMO ? [] : await get('catalogo_fotos?select=thumb,path&item_id=eq.' + item.id + '&limit=1');
      const f = (r && r[0]) || null;
      FOTO_CACHE[item.id] = { thumb: f ? f.thumb : null, versao: item.foto_versao || '' };
      desenhar(f ? f.thumb : null, f ? f.path : null);
    }catch(e){
      box.innerHTML = '';
      const v = document.createElement('div');
      v.className = 'fotoVazia'; v.style.width = '84px'; v.style.height = '84px';
      v.textContent = 'não carregou';
      box.appendChild(v);
    }
  })();

  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)){ toast('Escolha uma imagem.','err'); inp.value=''; return; }
    try{
      const thumb = await reduzirParaMiniatura(f);
      if (thumb.length > 61440)
        throw new Error('Mesmo reduzida a imagem ficou grande demais. Tente uma foto mais simples.');
      if (DEMO) throw new Error('Modo demonstração: a foto não é gravada.');
      // A CHEIA vai para o bucket privado; a miniatura, para a tabela. Quem
      // escolhe peça numa lista não precisa de 2 MB — mas quem confere um
      // detalhe no escritório precisa, e é para isso que ela existe.
      const caminho = await subirFotoCheia(item, f);
      await rpc('tf_salvar_foto_item',
        { p_item_id:item.id, p_thumb:thumb, p_path:caminho, p_bytes:f.size });
      FOTO_CACHE[item.id] = { thumb, versao:'' };
      desenhar(thumb, caminho);
      toast(caminho ? 'Foto gravada.' : 'Miniatura gravada — a foto cheia não subiu.',
            caminho ? 'ok' : 'err');
      listarCatalogo();
    }catch(e){ toast(e.message,'err'); }
    finally{ inp.value = ''; }
  });

  if (del) del.addEventListener('click', async () => {
    // A miniatura só existe no banco: apagada, alguém tem que ir tirar outra.
    if (!confirm('Remover a foto de ' + (item.codigo || 'este item') + '? '
               + 'Não dá para desfazer — vai ser preciso tirar outra.')) return;
    try{
      if (DEMO) throw new Error('Modo demonstração: a foto não é alterada.');
      await rpc('tf_remover_foto_item', { p_item_id:item.id });
      FOTO_CACHE[item.id] = { thumb:null, versao:'' }; desenhar(null);
      toast('Foto removida.','ok'); listarCatalogo();
    }catch(e){ toast(e.message,'err'); }
  });
}

async function listarCatalogo(){
  const el = document.getElementById('catLista');
  if (!el) return;
  const termo = BUSCA.cat || '';

  // A família filtra no servidor; o texto filtra aqui. O catálogo tem centenas
  // de itens, não milhões — e filtrar aqui deixa a busca igual à do celular,
  // sem acento e por palavra solta.
  let itens = [];
  try{
    if (DEMO) itens = demoCatalogo(catFamSel, '');
    else {
      let q = 'v_catalogo?select=*&order=familia_ordem,codigo';
      if (catFamSel) q += '&familia_id=eq.' + catFamSel;
      itens = await get(q);
    }
  }catch(e){ toast(e.message,'err'); return; }

  const antes = itens.length;
  if (termo) itens = itens.filter(i => casa(
    [i.descricao, i.marca, i.modelo, i.codigo, i.familia,
     Object.values(i.especificacoes||{}).join(' ')].join(' '), termo));

  el.innerHTML = '';
  if (!itens.length){
    el.innerHTML = '<p style="font-size:13px;color:var(--ink-3)">'
      + (termo ? 'Nada encontrado para “' + esc(termo) + '” entre os ' + antes
                 + ' itens desta família.'
               : 'Nenhum item nesta família ainda.')
      + '</p>';
    return;
  }
  itens.forEach(i => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (catEdit && catEdit.id === i.id ? ' on' : '') + (i.ativo ? '' : ' off');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = (i.ativo ? '' : '📦 ') + i.descricao;
    const partes = [i.codigo];
    if (i.marca || i.modelo) partes.push([i.marca, i.modelo].filter(Boolean).join(' '));
    if (i.preco_referencia) partes.push(BRL(i.preco_referencia));
    if (i.vezes_usado) partes.push(i.vezes_usado + '× usado');
    if (!i.ativo) partes.push('arquivado');
    b.querySelector('small').textContent = partes.join(' · ');
    if (i.tem_foto){
      const im = document.createElement('img');
      im.className = 'fotoCat'; im.alt = ''; im.loading = 'lazy';
      // A lista NUNCA espera pela foto: ela é buscada depois, item a item, e
      // encaixa quando chega. Foto que atrasa lista é foto que atrapalha.
      fotoDoItem(i.id, i.foto_versao).then(src => { if (src) im.src = src; })
        .catch(() => { im.alt = 'foto não carregou'; });
      b.insertBefore(im, b.firstChild);
      b.style.display = 'flex'; b.style.gap = '10px'; b.style.alignItems = 'center';
    }
    b.addEventListener('click', () => formCatalogo(i));
    el.appendChild(b);
  });
}

  // mexia. O Bruno pretende usá-lo para dimensionar serviço por contrato, e

      +  '</div></div>';

    // Eram `type="number"` crus: 1190 na tela, sem "R$" e sem ponto de

    +    esc(item ? (item.observacoes||'') : '') + '"></div>';

    +  '<button class="btn pri" id="fSalvar">' + (item ? 'Salvar alterações' : 'Adicionar ao catálogo') + '</button>';

  d.innerHTML = h;

  ligarCampoDinheiro('fCusto');

  if (bn) bn.addEventListener('click', () => formCatalogo(null));

  const bx = document.getElementById('fExcluir');
