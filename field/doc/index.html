<!--
  TapDoc 4 · a coleta da inspeção no celular (R02a, R02b1, R03a e R03b)
  ─────────────────────────────────────────────────────────────────
  Mora em field/doc/ e é aberta pelo Field (botão "Abrir a inspeção" da
  T06 · Executar a inspeção). Usa o núcleo N2: a sessão, o PIN, a fila de envios
  sem sinal e as fotos.
  Banco: sql/400 (R02a), 401 (R02b1, preparação) e 402 (R03a: exame visual,
  acessórios, boroscopia, teste de pressão, fechamento e envio) e 403 (R03b:
  ultrassom, geometria dos componentes e a prévia do motor de cálculo).
  Desenhos: inspecao-nr13/rodadas/R02-field-coleta.md e R03-campo-final-desenho.md.
  Feito pelo chat central em 22/10/2026.

  COMO FUNCIONA SEM SINAL
   · Ao abrir com sinal, baixa o "pacote" da OS (tf_insp_pacote_os) e guarda
     no aparelho. Daí em diante tudo funciona sem sinal.
   · Cada gravação vira uma entrada da fila do núcleo (tipo 'insp', um grupo
     por vaso), com o id gerado AQUI. O banco aceita reenvio sem duplicar.
   · Vaso com envio pendente fica com a versão do aparelho; sem pendência,
     o pacote novo do servidor substitui.
  O endereço leva a OS depois do # (doc/#os=<id>&t=<id>): assim o service
  worker do Field acha a página guardada sem sinal.
-->
<style>

#salvo{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--ok);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}

#desfazer span{flex:1}#desfazer button{background:none;border:0;color:#9FD3FF;font-weight:700;font-size:14px}

<body>
<header>
  <button class="back" id="voltar" aria-label="Voltar">‹</button>

</header>
<div class="aviso demo" id="barDemo" hidden>Modo demonstração: nada vai para o servidor.</div>

<script>
'use strict';
const VERSAO = 'TapDoc 18';   // S145 · rodada E (A8): o aviso no Fechamento de que cada um confirma a participação no próprio celular (aba Eu)
// const VERSAO = 'TapDoc 17';   // S144 · rodada D2 (420): função do vaso e "sem placa" na plaqueta; prazo menor que o da norma no fechamento (item 70); sem o "modelo" do acessório (item 72); "aferição" também na válvula (item 74); aviso de válvula sem conexão (item 75); foto da aferição (item 69); a sigla da região pelo nome (item 78)
// const VERSAO = 'TapDoc 16';   // S142 · item 40 (418): quem não está na T06 vê um aviso com quem está
// const VERSAO = 'TapDoc 15';   // S141 · item 58 (motor R00.5): a tolerância do manômetro pela NBR 14105-1, classe B, com a regra na tela · item 42: o aviso da coleta anterior
// const VERSAO = 'TapDoc 14';   // S140 · lista de melhorias, itens 33, 44, 49 a 56, 59 e 60 (416): lugares das fotos, galeria, costado com regiões, cartões dos componentes, volume em litros, temperatura só acima de 200 °C, aferição sem pulos, o que se digita não se perde
// const VERSAO = 'TapDoc 13';   // S132: o sistema se chama TapHub nas telas (item #10 da lista) e "Relatar problema ou sugerir" no menu (núcleo N6, modulos M2)
// const VERSAO = 'TapDoc 12';   // S113 · 414: reabrir o que enviou (a equipe, até a revisão começar) · válvula com 3 ciclos (abertura + assentamento) ·   // S112 · 413: correções do teste de 29/10 (posição primeiro; aferição por ciclo e por escala; sem bancada, boroscopia, E e R em campo) · S107 · 412: as leituras não travam o envio (o CSV do medidor entra no escritório) ·   // S94 · 410 (R06a): o ambiente do vaso (local fechado ou céu aberto) na Localização, obrigatório no envio ·   // S86 · 407 (R04a): aferição de manômetro e teste de válvula em campo (TapDoc 7: material do escritório; 6: faixa)
// 405: uma linha curta com a faixa do material, para conferir com a plaqueta ou o certificado da chapa
function linhaFaixa(m){
  if (!m || m.resist_min_mpa == null) return '';
  const f = m.resist_max_mpa != null ? fmt(m.resist_min_mpa, 0) + ' a ' + fmt(m.resist_max_mpa, 0) + ' MPa' : 'mín. ' + fmt(m.resist_min_mpa, 0) + ' MPa';
  return 'Resistência ' + f + ' · S ' + fmt(m.s_mpa, 1) + ' MPa' + (m.conferido ? '' : ' · a conferir');
}
if (window.TapModulos) TapModulos.aplicar('tapdoc');
const CFG = window.TF_CONFIG || {};
const SUPA_URL = CFG.SUPABASE_URL || '', SUPA_ANON = CFG.SUPABASE_ANON_KEY || '';
const DEMO = !SUPA_URL || !SUPA_ANON;
const NO_SERVIDOR = /^https?:$/.test(location.protocol);
const N = window.Nucleo;
const $ = id => document.getElementById(id);

if (!N){
  document.getElementById('tela').innerHTML = '<div class="card vazio">Sem o núcleo do TapHub. Abra o Field uma vez com sinal e tente de novo.</div>';
  throw new Error('sem núcleo');
}
const U = N.util, esc = U.esc;

// ── utilitários ────────────────────────────────────────────────────────────
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
function uid(){
  try{ if (crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
/** "1,5" ou "1.5" → 1.5; vazio → null */
function num(s){
  if (s == null) return null;
  let t = String(s).trim().replace(/\s/g, '');
  if (!t) return null;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  const v = Number(t);
  return isFinite(v) ? v : NaN;
}
function fmt(v, casas){
  if (v == null || v === '' || !isFinite(Number(v))) return '';
  const c = casas == null ? 4 : casas;
  return String(Number(Number(v).toFixed(c))).replace('.', ',');
}
/** A janela do núcleo: botões {rotulo, classe:'pri', acao}. Sem acao, fecha.
 *  A acao que devolve false deixa a janela aberta (faltou preencher algo). */
function janela(tit, html, bts){
  N.janela.abrir(tit, html, (bts || []).map(b => ({ label:b.rotulo, pri:b.classe === 'pri',
    onClick:() => { const r = b.acao ? b.acao() : undefined; if (r !== false) N.janela.fechar(); } })));
}
// S140 · item 60: o que está adiado (debounce) é gravado na hora quando a pessoa sai da tela, troca de app
// ou fecha; e o campo com o foco grava antes de a tela ser trocada (o voltar do Android não dá "blur").
const ADIADOS = [];
function debounce(fn, ms){
  const t = {}, args = {};
  const d = (k, ...a) => { clearTimeout(t[k]); args[k] = a; t[k] = setTimeout(() => { delete t[k]; const x = args[k]; delete args[k]; fn(...x); }, ms); };
  d.agora = () => Object.keys(t).forEach(k => { clearTimeout(t[k]); delete t[k]; const x = args[k]; delete args[k]; if (x) fn(...x); });
  ADIADOS.push(d); return d;
}
function guardarFocado(){
  const el = document.activeElement, t = $('tela');
  if (!el || !t || !t.contains(el) || !/^(INPUT|TEXTAREA)$/.test(el.tagName) || el.type === 'file' || el.type === 'checkbox') return;
  if (el._v0 !== undefined && el._v0 !== el.value){ el._v0 = el.value; el.dispatchEvent(new Event('change', { bubbles:true })); }
}
function despejar(){
  try{ guardarFocado(); }catch(e){}
  ADIADOS.forEach(d => { try{ d.agora(); }catch(e){} });
  if (desfazer.pendente){ try{ desfazer.pendente(); }catch(e){} }
}
document.addEventListener('focusin', ev => {
  const el = ev.target; if (!el || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return;
  el._v0 = el.value;
  // item 55: com o teclado aberto, rola uma vez só, deixando o campo à vista
  setTimeout(() => {
    if (document.activeElement !== el || !window.visualViewport) return;
    const r = el.getBoundingClientRect(), vh = window.visualViewport.height;
    if (r.bottom > vh - 8 || r.top < 56) el.scrollIntoView({ block:'center' });
  }, 350);
});
document.addEventListener('change', ev => { const el = ev.target; if (el && el._v0 !== undefined) el._v0 = el.value; }, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') despejar(); });
window.addEventListener('pagehide', despejar);
function mostrarSalvo(){ const s = $('salvo'); if (!s) return; s.classList.add('on'); clearTimeout(mostrarSalvo.t); mostrarSalvo.t = setTimeout(() => s.classList.remove('on'), 1200); }
/** item 52: "Tirado. Desfazer" por alguns segundos; sem desfazer, a ação vale (também ao sair). */
function desfazer(texto, voltar, valer){
  if (desfazer.pendente) desfazer.pendente();
  const b = $('desfazer'); $('desfTx').textContent = texto; b.hidden = false;
  const fim = () => { clearTimeout(desfazer.t); desfazer.pendente = null; b.hidden = true; };

function encadear(lista){
  const els = Array.from(lista).filter(el => !el.disabled);
  els.forEach((el, k) => {
    el.setAttribute('enterkeyhint', k === els.length - 1 ? 'done' : 'next');
    el.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter') return;

function estLaudo(v){

  if (['em_conferencia','cliente_nao_tem','sem_laudo','conferido'].indexOf(s) >= 0) return 'ok';
  return fotosDe(v, 'laudo_anterior').length ? 'inc' : 'vazia';
}
function est(itens){ const n = itens.filter(Boolean).length; return n === 0 ? 'vazia' : n === itens.length ? 'ok' : 'inc'; }
const EST_ROT = { vazia:'vazia', inc:'incompleta', ok:'ok' };
function estados(v){ return [estPlaqueta(v), estOperacao(v), estComp(v), estLocal(v), estLaudo(v), estVisual(v), estAcess(v), estUltra(v), estTeste(v), estFech(v)]; }
const N_SECOES = 11;
function secoesOk(v){ return estados(v).filter(x => x === 'ok').length; }
function alertas(v){
  const a = [];
  if (!lugarOk(v, lugaresDe(v)[0])) a.push('Falta a foto da placa de fabricação.');
  const laSit = v.laudo_anterior && v.laudo_anterior.situacao;
  ativas(v).forEach(c => {
    const nm = ativas(v).length > 1 ? ' (' + c.nome + ')' : '';
    if (!c.pmta_plaqueta_mpa) a.push('PMTA de plaqueta não informada' + nm + '.');
    // S140 · item 33: vaso sem laudo anterior não tem "laudo a conferir" (decisão do Bruno, 10/11: trocar o texto)
    if (!c.pmta_vigente_mpa && laSit !== 'conferido') a.push(laSit === 'sem_laudo' ? 'Vaso sem laudo anterior' + nm + ': a PMTA sai da plaqueta e do cálculo.'
      : laSit === 'cliente_nao_tem' ? 'Sem o laudo anterior (o cliente não tem)' + nm + ': a PMTA sai da plaqueta e do cálculo.'
      : 'PMTA vigente desconhecida' + nm + ': o laudo anterior ainda não foi conferido.');
    if (c.pressao_externa && !c.pmta_externa_plaqueta_mpa) a.push('Opera com vácuo, sem PMTA externa de plaqueta' + nm + '.');
  });
  if (v.latitude == null) a.push('Sem GPS do vaso.');
  return a;
}

    const pend = pendDoVaso(v);
    const chips = [];

      const sit = v.inspecao.situacao;

      '<div class="tg">' + esc(v.tag) + '</div>' + (v.nome ? '<div class="nm">' + esc(v.nome) + '</div>' : '') +
      (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + '</div><span class="dir">›</span></button>';
  };
  let h = '';

  h += '<h2>Em inspeção nesta OS</h2>' + (com.filter(casa).map(linha).join('') || '<p class="muted" style="margin:0 2px 10px">Nenhum vaso começado ainda. Escolha um abaixo.</p>');
  h += '<h2>Vasos do cliente</h2>' + (sem.filter(casa).map(linha).join('') || '<p class="muted" style="margin:0 2px 10px">' + (f ? 'Nenhum vaso com essa TAG.' : 'Nenhum outro vaso cadastrado.') + '</p>');
  h += '<button class="btn sec" id="novoVaso">+ O vaso não está na lista</button>';
  h += '<p class="rodape">' + VERSAO + ' · pacote de ' + (E.baixado_em ? new Date(E.baixado_em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—') +
       (DEMO ? '' : ' · <a href="#" id="atual">atualizar</a>') + '</p>';
  $('tela').innerHTML = h;
  $('tela').querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => ir({ nome:'vaso', vaso:b.dataset.v })));

    '<label class="f">Nome (opcional)<input class="t" id="nvNome" placeholder="Ex.: Reservatório de ar"></label>',

/** C10: muda a posição do vaso e renomeia os tampos que ainda têm o nome padrão (superior/inferior ↔ esquerdo/direito). */
const NOME_TAMPO = { superior:'Tampo superior', inferior:'Tampo inferior', esquerdo:'Tampo esquerdo', direito:'Tampo direito' };
// S140 · itens 51 e 52 (decisões do Bruno, 10/11): o costado é UM componente, dividido em regiões de medição.
// Cada região é uma linha de vaso_componentes (tipo costado) da mesma câmara: as leituras ficam por região e a
// conta usa a menor leitura de todas (o resultado é o mesmo da conta por região: mesma geometria e material).
// Horizontal: Frontal (CF), Traseiro (CT), Superior (CS), Inferior (CI). Vertical: CF, CT, Lateral direita (CLD), Lateral esquerda (CLE).
const REGIOES = { frontal:['CF','Frontal'], traseiro:['CT','Traseiro'], superior:['CS','Superior'], inferior:['CI','Inferior'], direito:['CLD','Lateral direita'], esquerdo:['CLE','Lateral esquerda'] };
const REG_ORDEM = ['frontal','traseiro','superior','inferior','direito','esquerdo'];
const REG_PADRAO = { horizontal:['frontal','traseiro','superior','inferior'], vertical:['frontal','traseiro','direito','esquerdo'] };
const TIPO_CURTO = { eliptico:'elíptico', torisferico:'torisférico', hemisferico:'hemisférico', conico:'cônico', plano:'plano', janela:'janela de visita', costado:'cilíndrico' };
// S144 · item 78: o nome manda (no piloto, "CS" veio com a posição "inferior", gravada antes do TapDoc 14); sem sigla no nome, a posição
function siglaReg(c){
  const m = String(c.nome || '').match(/\b(CF|CT|CS|CI|CLD|CLE)\s*$/i);
  if (m) return m[1].toUpperCase();
  return REGIOES[c.posicao] ? REGIOES[c.posicao][0] : null;
}
function nomeReg(c){
  const sg = siglaReg(c), k = Object.keys(REGIOES).find(x => REGIOES[x][0] === sg);
  return k ? REGIOES[k][1] + ' (' + sg + ')' : (String(c.nome || '').replace(/^costado\s*/i, '').trim() || 'Costado inteiro');
}
const camIdDe = (v, c) => (camaraDe(v, c) || {}).id || null;
const ordReg = c => { const k = REG_ORDEM.indexOf(c.posicao); return k < 0 ? 50 + (c.ordem || 0) : k; };
const regioesDe = (v, camId) => compsAtivos(v).filter(c => c.tipo === 'costado' && camIdDe(v, c) === camId).sort((a, b) => ordReg(a) - ordReg(b));
const tampo = t => ['eliptico','torisferico','hemisferico','conico','plano'].indexOf(t) >= 0;
/** O nome sai sozinho do tipo e da posição (item 52: ninguém digita o nome). */
function nomeAuto(v, c){
  let n = c.tipo === 'costado' ? (siglaReg(c) ? 'Costado ' + siglaReg(c) : 'Costado')
    : c.tipo === 'janela' ? 'Janela de visita' + (c.posicao ? ' ' + c.posicao : '')
    : NOME_TAMPO[c.posicao] || ('Tampo' + (c.posicao ? ' ' + c.posicao : ''));
  const outros = compsAtivos(v).filter(x => x.id !== c.id).map(x => x.nome);
  if (outros.indexOf(n) >= 0){ let k = 2; while (outros.indexOf(n + ' (' + k + ')') >= 0) k++; n += ' (' + k + ')'; }
  return n;
}
/** O costado da câmara ganha as regiões padrão (vaso novo ou o costado único da preparação, ainda sem leitura). */
function garantirRegioes(v){
  const pos = v.posicao === 'vertical' ? 'vertical' : 'horizontal';
  ativas(v).forEach(k => {
    const rs = regioesDe(v, k.id);
    if (rs.length !== 1 || rs[0].posicao || siglaReg(rs[0]) || leiturasDe(v, rs[0].id).length) return;
    const base = rs[0], geo = pegar(base, ['r_mm','eficiencia_junta','material_id','camara_id']);
    REG_PADRAO[pos].forEach((p, n) => {
      const c = n === 0 ? base : Object.assign({ id:uid(), tipo:'costado', nao_medir:false, ativo:true, ordem:(base.ordem || 1) }, geo);
      c.posicao = p; c.nome = 'Costado ' + REGIOES[p][0];
      if (n > 0) v.componentes.push(c);
      gravarComp(v, c);
    });
  });
}
function aplicarPosicao(v, p){
  mudouVaso(v, 'posicao', p);
  const mapa = p === 'horizontal' ? { superior:'esquerdo', inferior:'direito' } : { esquerdo:'superior', direito:'inferior' };
  // a região do costado acompanha: horizontal CS/CI ↔ vertical CLD/CLE
  const mapaReg = p === 'horizontal' ? { direito:'superior', esquerdo:'inferior' } : { superior:'direito', inferior:'esquerdo' };
  compsAtivos(v).forEach(c => {
    const alvo = c.tipo === 'costado' ? mapaReg[c.posicao] : mapa[c.posicao];
    if (!alvo) return;
    if (tampo(c.tipo) && c.nome === NOME_TAMPO[c.posicao]){ mudouComp(v, c, 'posicao', alvo); mudouComp(v, c, 'nome', NOME_TAMPO[alvo]); }
    else if (c.tipo === 'costado' && c.nome === 'Costado ' + REGIOES[c.posicao][0] && !regioesDe(v, camIdDe(v, c)).some(x => x.posicao === alvo)){
      mudouComp(v, c, 'posicao', alvo); mudouComp(v, c, 'nome', 'Costado ' + REGIOES[alvo][0]);
    }
  });
}
/** Abre a inspeção do vaso (id do celular) e monta o mínimo: a câmara única e
 *  costado + dois tampos. A ordem na fila é a de dependência. */
function comecar(v){
  if (v.inspecao && v.inspecao.situacao !== 'em_preparo') return;
  // S77: o vaso preparado pelo escritório já tem a inspeção (em preparo): o
  // celular usa o MESMO id, e o banco a passa para "em campo" com a equipe
  const iid = v.inspecao ? v.inspecao.id : uid();
  v.inspecao = Object.assign(v.inspecao || { fotos:[], tipo:'periodica' }, { id:iid, situacao:'em_campo', pode_editar:true });
  v.inspecao.fotos = v.inspecao.fotos || [];
  salvar();
  enfileirar(v, 'abrir-' + iid, 'abrir a inspeção', { funcao:'tf_insp_abrir',
    payload:{ p_os_id:E.os.id, p_equip:v.id, p_tipo:'periodica', p_os_item_id:null, p_id:iid, p_motivo_extraordinaria:null } }, null, true);
  if (!ativas(v).length){
    const c = { id:uid(), tipo:'unica', nome:'Única', ordem:1, ativo:true, volume_desconhecido:false, pressao_externa:false };
    v.camaras.push(c); gravarCamara(v, c);
  }
  if (!compsAtivos(v).length){
    const cam = ativas(v)[0].id, hz = v.posicao === 'horizontal';
    [['costado','Costado',null], ['eliptico', hz ? 'Tampo esquerdo' : 'Tampo superior', hz ? 'esquerdo' : 'superior'],
     ['eliptico', hz ? 'Tampo direito' : 'Tampo inferior', hz ? 'direito' : 'inferior']].forEach((x, i) => {
      const c = { id:uid(), tipo:x[0], nome:x[1], posicao:x[2], camara_id:cam, nao_medir:false, ordem:i + 1, ativo:true };
      v.componentes.push(c);
      if (x[0] !== 'costado') gravarComp(v, c);
    });
  }
  garantirRegioes(v);   // S140 · item 51: o costado com as 4 regiões de medição
  salvar();
}

// ── tela 1 · painel do vaso ────────────────────────────────────────────────
function telaPainel(v){
  titulo(v.tag, (v.nome || '') + (v.provisorio ? ' · provisório' : ''));
  const ed = v.inspecao.pode_editar !== false && v.inspecao.situacao === 'em_campo';
  const al = alertas(v);
  let h = '';
  if (!ed) h += '<div class="alerta"><b>' + (v.inspecao.nao_inspecionado_motivo ? 'Vaso não inspecionado' : 'Inspeção ' + esc(String(v.inspecao.situacao).replace('_', ' '))) + '</b>' +
    (v.inspecao.nao_inspecionado_motivo ? esc(v.inspecao.nao_inspecionado_motivo) + '<br>' : '') + 'O campo não grava mais neste vaso.</div>' +
    (v.inspecao.situacao === 'enviada' ? cartaoReabrir(v) : '');
  if (v.inspecao.instrucoes_campo) h += '<div class="alerta" style="background:var(--accent-soft);color:var(--accent-ink)"><b>Instruções do escritório</b>' + esc(v.inspecao.instrucoes_campo) + '</div>';
  // S141 · item 42 (417): o escritório marcou o vaso de novo e escolheu começar do zero
  if (v.inspecao.coleta_anterior && ed) h += '<div class="alerta"><b>Existe uma coleta anterior deste vaso nesta OS</b>O escritório escolheu começar do zero: o que foi lançado antes ficou guardado e não aparece aqui. Lance tudo de novo.</div>';
  if (al.length && ed) h += '<div class="alerta"><b>Atenção</b><ul>' + al.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  const sec = (k, nome, sub, e) => '<button class="card secao" data-s="' + k + '"' + (ed ? '' : ' disabled') + '><span class="sn">' + nome +
    (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span><span class="est ' + e + '">' + EST_ROT[e] + '</span></button>';
  const cs = ativas(v);
  h += sec('plaqueta', 'Plaqueta', 'Foto, fabricante, série, ano, código, PMTA e PTH', estPlaqueta(v));
  h += sec('operacao', 'Operação e câmaras', cs.length + (cs.length === 1 ? ' câmara' : ' câmaras') + ': fluido, classe, pressão, volume', estOperacao(v));
  h += sec('componentes', 'Componentes', compsAtivos(v).length + ' na lista', estComp(v));
  h += sec('localizacao', 'Localização', 'Local, GPS e fotos do vaso', estLocal(v));
  const la = v.laudo_anterior && v.laudo_anterior.situacao;
  h += sec('laudo', 'Laudo anterior', la === 'conferido' ? 'Já conferido pelo escritório' : la === 'cliente_nao_tem' ? 'O cliente não tem' :
    la === 'sem_laudo' ? 'O vaso nunca teve laudo' : la === 'em_conferencia' ? 'Coletado, aguardando a conferência' : 'Fotos do laudo impresso, PDF ou "o cliente não tem"', estLaudo(v));
  // S79 · R03a
  const vis = v.inspecao.visual || [], nc = vis.filter(x => x.conforme === false).length;
  h += sec('visual', 'Exame visual', nc ? nc + ' não conforme' + (nc > 1 ? 's' : '') : 'Fotos dos tampos, conexões e base; costado, tampos, conexões, base e aterramento', estVisual(v));
  const acs = acessDe(v);
  h += sec('acessorios', 'Acessórios', acs.length ? acs.length + ' na lista' : 'Válvulas e manômetros, com lacre e foto', estAcess(v));
  const nMed = compsAtivos(v).filter(c => !c.nao_medir).length, nLid = compsAtivos(v).filter(c => !c.nao_medir && leiturasDe(v, c.id).length).length;
  h += sec('ultrassom', 'Ultrassom', nMed ? nLid + ' de ' + nMed + ' componentes medidos' : 'Medidor e espessuras por componente', estUltra(v));
  h += sec('teste', 'Teste de pressão', 'Realizado ou o motivo', estTeste(v));
  h += sec('fechamento', 'Fechamento e envio', 'Observações, foto de capa e enviar', estFech(v));
  h += '<h2>Cálculo</h2><button class="card secao" data-s="previa"><span class="sn">Prévia do cálculo<small>PMTA por câmara, categoria e prazos. Só informativa: o resultado oficial sai na revisão.</small></span><span class="est vazia">ver</span></button>';
  $('tela').innerHTML = h;
  $('tela').querySelectorAll('[data-s]').forEach(b => { if (b.dataset.s === 'previa') b.disabled = false; b.addEventListener('click', () => ir({ nome:b.dataset.s, vaso:v.id })); });
  if (!ed && v.inspecao.situacao === 'enviada') ligarReabrir(v);
}

// ── campos ─────────────────────────────────────────────────────────────────
function campoTexto(rot, id, valor, extra){
  return '<label class="f">' + rot + '<input class="t" id="' + id + '" value="' + esc(valor == null ? '' : valor) + '"' + SEM_AUTO + ' ' + (extra || '') + '></label>';
}
function campoNum(rot, id, valor, ajuda, extra){
  return '<label class="f">' + rot + (ajuda ? '<small>' + ajuda + '</small>' : '') +
    '<input class="t" id="' + id + '" inputmode="decimal" value="' + esc(valor == null ? '' : fmt(valor)) + '"' + SEM_AUTO + ' ' + (extra || '') + '></label>';

/** A data em que a foto foi tirada: o EXIF da câmera (DateTimeOriginal); sem ele, a data do arquivo. */
async function dataDaFoto(arq){
  try{
    const buf = await arq.slice(0, 131072).arrayBuffer(), d = new DataView(buf);
    if (d.byteLength > 4 && d.getUint16(0) === 0xFFD8){
      let o = 2;
      while (o + 10 < d.byteLength){
        const m = d.getUint16(o), len = d.getUint16(o + 2);
        if (m === 0xFFE1 && d.getUint32(o + 4) === 0x45786966){
          const t = o + 10, le = d.getUint16(t) === 0x4949, u16 = p => d.getUint16(p, le), u32 = p => d.getUint32(p, le);
          const ifd = (pos, tags) => { const n = u16(t + pos), r = {}; for (let k = 0; k < n; k++){ const e = t + pos + 2 + k * 12, g = u16(e); if (tags.indexOf(g) >= 0) r[g] = { cont:u32(e + 4), val:u32(e + 8), pos:e + 8 }; } return r; };
          const ascii = x => { let z = ''; const p = x.cont > 4 ? t + x.val : x.pos; for (let k = 0; k < x.cont - 1; k++) z += String.fromCharCode(d.getUint8(p + k)); return z; };
          const i0 = ifd(u32(t + 4), [0x8769, 0x0132]);
          let tx = null;
          if (i0[0x8769]){ const ex = ifd(i0[0x8769].val, [0x9003, 0x9004]); tx = ex[0x9003] ? ascii(ex[0x9003]) : ex[0x9004] ? ascii(ex[0x9004]) : null; }
          if (!tx && i0[0x0132]) tx = ascii(i0[0x0132]);
          const mm = tx && tx.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
          if (mm) return new Date(+mm[1], +mm[2] - 1, +mm[3], +mm[4], +mm[5], +mm[6]);
          break;
        }
        if ((m & 0xFF00) !== 0xFF00) break;
        o += 2 + len;
      }
    }
  }catch(e){}
  return arq.lastModified ? new Date(arq.lastModified) : null;
}
$('arqGal').addEventListener('change', async () => {

function miniatura(blob){
  return new Promise(ok => {
    const img = new Image(), u = URL.createObjectURL(blob);
    img.onload = () => {
      const l = 220, r = Math.min(1, l / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(u); ok(null); };
    img.src = u;
  });
}

// ── tela 4 · componentes ───────────────────────────────────────────────────
// S80 · R03b · a geometria de cada componente. Em branco vale o padrão da
// memória de cálculo (pendência 2, a validar pelo Fernando):
//   R = circunferência ÷ 2π (raio EXTERNO: conservador) · torisférico L = D ·
//   hemisférico L = R · tampo plano d = D, C = 0,33 · janela C = 0,33 ·
//   E = 0,70 no costado e no cone, 1,0 nos tampos (o inspetor escolhe).
const GEO_CAMPOS = { costado:['R'], eliptico:['R'], conico:['R','alfaGraus'], torisferico:['L'], hemisferico:['L'], plano:['d','C'], janela:['d','C'] };
const GEO_COL = { R:'r_mm', L:'l_mm', d:'d_mm', C:'fator_c', alfaGraus:'alfa_graus', E:'eficiencia_junta' };
const GEO_ROT = { R:'R · raio (mm)', L:'L · raio da coroa (mm)', d:'d · diâmetro (mm)', C:'C · fator', alfaGraus:'α · semiângulo (°)' };
function geoPadrao(v, c){
  const rx = v.circunferencia_mm > 0 ? v.circunferencia_mm / (2 * Math.PI) : null;
  const p = { E: (c.tipo === 'costado' || c.tipo === 'conico') ? 0.7 : 1 };
  if (rx){
    if (['costado','eliptico','conico'].indexOf(c.tipo) >= 0) p.R = rx;
    if (c.tipo === 'torisferico') p.L = 2 * rx;
    if (c.tipo === 'hemisferico') p.L = rx;
    if (c.tipo === 'plano') p.d = 2 * rx;
  }
  if (c.tipo === 'plano' || c.tipo === 'janela') p.C = 0.33;
  return p;
}
/** A geometria que o motor usa: o informado ou o padrão. `padrao` lista o que veio do padrão. */
function geoDe(v, c){
  const p = geoPadrao(v, c), g = { tipo:c.tipo, nome:c.nome, id:c.id, aparafusada:c.aparafusada === true, padrao:[] };
  (GEO_CAMPOS[c.tipo] || []).concat(['E']).forEach(k => {
    const x = c[GEO_COL[k]];
    // S112 · C1: o raio R sai SEMPRE da circunferência (ninguém o digita em campo); a eficiência E vem do escritório
    if (k !== 'R' && x != null && x !== '') g[k] = Number(x);
    else if (p[k] != null){ g[k] = p[k]; g.padrao.push(k); }
    else if (k === 'R' && x != null && x !== '') g[k] = Number(x);   // sem circunferência: o que já estava gravado
  });
  return g;
}
function campoGeo(v, c){
  const p = geoPadrao(v, c), id = esc(c.id);
  // S112 · C1: E (eficiência da junta) e R (raio) saem da tela de campo
  const campos = (GEO_CAMPOS[c.tipo] || []).filter(k => k !== 'R');
  let h = campos.length ? '<div class="lin">' : '';
  campos.forEach((k, n) => {
    if (n && n % 2 === 1) h += '</div><div class="lin">';
    const val = c[GEO_COL[k]];
    h += '<label class="f">' + GEO_ROT[k] + '<input class="t" inputmode="decimal" data-geo="' + id + '" data-g="' + k + '" value="' + esc(val == null ? '' : fmt(val, 3)) +
      '" placeholder="' + (p[k] != null ? 'padrão ' + fmt(p[k], k === 'C' ? 2 : 1) : (k === 'd' && c.tipo === 'janela' ? 'medir' : '—')) + '"></label>';
  });
  if (campos.length) h += '</div>';
  if (c.tipo === 'janela') h += '<div class="chk"><input type="checkbox" id="ap_' + id + '"' + (c.aparafusada ? ' checked' : '') + '><label for="ap_' + id + '">Tampa aparafusada</label></div>';
  if (c.tipo === 'conico' && !(c.alfa_graus > 0)) h += '<div class="conv" style="color:var(--warn)">O cone precisa do semiângulo α (até 30°).</div>';
  return h;
}
function ligarGeo(v){
  const lim = { R:[1, 20000], L:[1, 40000], d:[1, 40000], C:[0.1, 1], alfaGraus:[0.1, 30] };
  $('tela').querySelectorAll('[data-geo]').forEach(el => el.addEventListener('change', () => {
    const c = v.componentes.find(x => x.id === el.dataset.geo); if (!c) return;
    const k = el.dataset.g;
    if (k === 'E'){ mudouComp(v, c, 'eficiencia_junta', el.value ? Number(el.value) : null); return; }
    const x = numOuAviso(el, lim[k][0], lim[k][1], GEO_ROT[k].split(' ·')[0]);
    if (x !== undefined) mudouComp(v, c, GEO_COL[k], x);
  }));
  compsAtivos(v).forEach(c => ligar('ap_' + c.id, el => mudouComp(v, c, 'aparafusada', el.checked)));
}
function desenhoVaso(v, parte){
  const cor = p => p === parte ? 'var(--cor,var(--accent))' : '#DBE0E3', jan = parte === 'janela' ? 'var(--cor,var(--accent))' : '#C3CBD0';
  if (v.posicao === 'vertical') return '<svg viewBox="0 0 40 60" width="28" height="42" aria-hidden="true"><ellipse cx="20" cy="13" rx="12" ry="7" fill="' + cor('superior') + '"/>' +
    '<ellipse cx="20" cy="47" rx="12" ry="7" fill="' + cor('inferior') + '"/><rect x="8" y="13" width="24" height="34" fill="' + cor('costado') + '"/><circle cx="20" cy="30" r="4" fill="' + jan + '"/></svg>';
  return '<svg viewBox="0 0 60 40" width="44" height="30" aria-hidden="true"><ellipse cx="13" cy="20" rx="7" ry="12" fill="' + cor('esquerdo') + '"/>' +
    '<ellipse cx="47" cy="20" rx="7" ry="12" fill="' + cor('direito') + '"/><rect x="13" y="8" width="34" height="24" fill="' + cor('costado') + '"/><circle cx="30" cy="20" r="4" fill="' + jan + '"/></svg>';
}
const COR_COMP = c => c.tipo === 'costado' ? '#1B6FA9' : c.tipo === 'janela' ? '#78838A' : c.tipo === 'conico' ? '#8A5A12' : '#1E7A42';
/** Os cartões da tela: o costado de cada câmara (com as regiões) e cada outro componente. */
function cartoesComp(v){
  const fora = v._tirando || {}, cs = ativas(v), out = [];
  const comps = compsAtivos(v).filter(c => !fora[c.id]).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  cs.forEach(k => {
    const regs = comps.filter(c => c.tipo === 'costado' && camIdDe(v, c) === k.id).sort((a, b) => ordReg(a) - ordReg(b));
    if (regs.length) out.push({ chave:'costado:' + k.id, cam:k, c:regs[0], regs });
    comps.filter(c => c.tipo !== 'costado' && camIdDe(v, c) === k.id).forEach(c => out.push({ chave:c.id, cam:k, c }));
  });
  comps.filter(c => !camIdDe(v, c)).forEach(c => out.push({ chave:c.id, cam:null, c, regs:c.tipo === 'costado' ? [c] : null }));
  return out;
}

        });

      } else {

function novaRegiao(v, camId, pos, nome){
  const regs = regioesDe(v, camId), base = regs[0];
  // o costado único ainda sem região e sem leitura vira a primeira região escolhida

    mudouComp(v, base, 'posicao', pos); mudouComp(v, base, 'nome', nome || 'Costado ' + REGIOES[pos][0]); pintar(); return;
  }
  const c = Object.assign({ id:uid(), tipo:'costado', posicao:pos, nome:nome || 'Costado ' + REGIOES[pos][0], nao_medir:false, ordem:(base ? base.ordem : 1) || 1, ativo:true },
    base ? pegar(base, ['r_mm','eficiencia_junta','material_id']) : {}, { camara_id:camId || (ativas(v)[0] || {}).id });
  if (base && base.nao_medir) c.nao_medir = true;
  v.componentes.push(c); salvar(); gravarComp(v, c); pintar();
}
/** Tira o componente de vez: primeiro as leituras e o motivo (o banco só aceita leitura de componente ativo), depois as fotos e o componente. */
function apagarComp(v, c){
  const i = v.inspecao;
  if (leiturasDe(v, c.id).length){ i.leituras = i.leituras.filter(x => x.componente_id !== c.id); gravarLeituras(v, c); }
  if (semLeitura(v)[c.id] !== undefined){ const s2 = Object.assign({}, semLeitura(v)); delete s2[c.id]; i.ultrassom_sem_leitura = s2; gravarUS(v); }
  (i.fotos || []).filter(f => f.item_ref === c.id).forEach(f => {
    const ainda = N.fila.listar({ tipo:'insp', grupo:'insp|' + v.id }).find(e => e.id === 'foto~' + f.id);
    if (ainda) N.fila.descartar(ainda.assinatura); else enfileirar(v, 'fotorem-' + f.id, 'tirar foto', { funcao:'tf_insp_foto_remover', payload:{ p_id:f.id } }, null, true);
    delete MINI[f.id];
  });
  i.fotos = (i.fotos || []).filter(f => f.item_ref !== c.id);
  c.ativo = false; gravarComp(v, c);
}

function estVisual(v){
  const it = (v.inspecao && v.inspecao.visual) || [], det = lugaresDe(v).filter(l => l.secao !== 'plaqueta');   // S140 · item 49: as fotos de detalhe
  if ((!it.length || it.every(x => x.conforme == null)) && !det.some(l => lugarOk(v, l))) return 'vazia';
  const ok = it.length && it.every(x => x.conforme === true || (x.conforme === false && (x.anomalia || '').trim() && fotosDe(v, 'visual', x.item).length)) && det.every(l => lugarOk(v, l));

/** O que impede o envio: a mesma lista do servidor (tf__insp_faltas_envio). */
function faltasEnvio(v){
  const f = [], i = v.inspecao || {};
  // S140 · item 49 (416): cada lugar de foto tem a foto ou o motivo; primeiro as placas
  const lugs = lugaresDe(v), faltaLugar = l => f.push('Foto "' + l.rotulo + '": tire a foto ou diga por que não.');
  lugs.filter(l => l.secao === 'plaqueta' && !lugarOk(v, l)).forEach(faltaLugar);
  const vis = i.visual || [];
  if (!vis.length || vis.every(x => x.conforme == null)) f.push('Exame visual sem resposta.');
  else {
    vis.filter(x => x.conforme == null).forEach(x => f.push('Exame visual: "' + x.item + '" sem resposta.'));
    vis.filter(x => x.conforme === false && !(x.anomalia || '').trim()).forEach(x => f.push('Exame visual: "' + x.item + '" sem a descrição da anomalia.'));
    vis.filter(x => x.conforme === false && !fotosDe(v, 'visual', x.item).length).forEach(x => f.push('Exame visual: "' + x.item + '" não conforme sem foto.'));
  }
  lugs.filter(l => l.secao !== 'plaqueta' && !lugarOk(v, l)).forEach(faltaLugar);
  if (!i.acessorios_conferidos) f.push('Acessórios: confirme a lista (mesmo que o vaso não tenha nenhum).');
  acessDe(v).filter(a => !a.situacao).forEach(a => f.push('Acessório "' + (a.tag || a.marca || TIPOS_ACESS[a.tipo] || a.tipo) + '" sem a situação.'));
  const fAf = faltasAfericao(v);
  // S80 · R03b: o ultrassom (mesma ordem e texto do servidor)
  if (!i.medidor_id) f.push('Ultrassom: escolha o medidor de espessura.');
  // S107 · 412: as leituras não travam o envio — o CSV do medidor é anexado no escritório
  // S112 · 413: a boroscopia é lançada no escritório (o inspetor não a faz no celular): não trava o envio
  if (!testeValido(i.teste)) f.push('Teste de pressão sem resposta.');
  else if (i.teste.resultado === 'reprovado' && !fotosDe(v, 'teste').length) f.push('Teste de pressão reprovado sem foto.');
  fAf.forEach(x => f.push(x));   // S86 · R04a (mesma ordem do servidor: antes da capa)
  if (!i.ambiente) f.push('Localização: diga se o vaso fica em local fechado ou a céu aberto.');   // S94 · 410 (mesma ordem do servidor)
  if (!fotosDe(v, 'capa').length) f.push('Falta a foto de capa.');
  return f;
}
function avisosEnvio(v){
  const a = alertas(v).slice();
  try{ previa(v).avisos.forEach(x => a.push(x)); }catch(e){ a.push('Prévia do cálculo: ' + e.message); }
  avisosAcess(v).forEach(x => a.push(x));
  return a;
}

// ── gravar (fila) ──────────────────────────────────────────────────────────
function gravarVisual(v){
  // não conforme ainda sem a descrição vai como "sem resposta": o servidor

  const itens = (v.inspecao.visual || []).map((x, n) => ({ item:x.item, ordem:n + 1,
    conforme: x.conforme === false && !(x.anomalia || '').trim() ? null : x.conforme,
    anomalia: x.conforme === false ? (x.anomalia || '').trim() || null : null }));
  enfileirar(v, 'visual', 'exame visual', { funcao:'tf_insp_visual_gravar', payload:{ p_id:v.inspecao.id, p_itens:itens } });
}

function gravarAcess(v, a){

function gravarBoro(v){

const adiar2 = debounce((tipo, v, x) => {
  if (tipo === 'visual') gravarVisual(v); else if (tipo === 'acess') gravarAcess(v, x);

  else if (tipo === 'fech') enfileirar(v, 'fech', 'observações', { funcao:'tf_insp_fechamento_gravar', payload:{ p_id:v.inspecao.id, p_dados:{ observacao:v.inspecao.observacao || null } } });
}, 700);

// ── exame visual ───────────────────────────────────────────────────────────

  const pode = ed(v);
  // S140 · item 49: as 4 fotos de detalhe, com o lugar certo no laudo (obrigatórias: a foto ou o motivo)
  const lugV = lugaresDe(v).filter(l => l.secao !== 'plaqueta');
  let h = '<div class="card"><b>Fotos de detalhe</b><p class="muted" style="margin:2px 0 0">Vão no laudo logo depois do exame visual, com estes nomes.</p>' + lugV.map(l => blocoLugar(v, l)).join('') + '</div>';
  h += '<p class="muted" style="margin:0 2px 10px">Não conforme pede a descrição e pelo menos uma foto. A conclusão do exame sai sozinha.</p>';
  i.visual.forEach((x, k) => {
    h += '<div class="card"><div class="ct" style="display:flex;align-items:center;gap:8px"><b style="flex:1">' + esc(x.item) + '</b>' +
      (k >= ITENS_VISUAL.length && pode ? '<button class="btn peq perigo" data-vrm="' + k + '">Tirar</button>' : '') + '</div>' +
      '<div class="seg" data-vis="' + k + '"><button data-c="1" class="' + (x.conforme === true ? 'on' : '') + '">Conforme</button>' +
      '<button data-c="0" class="' + (x.conforme === false ? 'on' : '') + '">Não conforme</button></div>';
    if (x.conforme === false){
      h += '<label class="f">O que foi encontrado<small>Local, tamanho, tipo (corrosão, deformação, vazamento…)</small><textarea class="t" data-van="' + k + '">' + esc(x.anomalia || '') + '</textarea></label>';
      h += gradeFotos(v, 'visual', 7, null, x.item);
    }
    h += '</div>';
  });
  if (pode) h += '<button class="btn sec" id="visMais">+ outro item</button>';
  const nc = i.visual.filter(x => x.conforme === false).length;
  h += '<div class="card"><b>Conclusão</b><p class="info" style="margin:4px 0 0">' +
    (i.visual.some(x => x.conforme == null) ? 'Responda todos os itens.' : nc ? 'Com anomalias (' + nc + ' não conforme' + (nc > 1 ? 's' : '') + ').' : 'Sem anomalias.') + '</p></div>';
  $('tela').innerHTML = h;
  if (!pode){ $('tela').querySelectorAll('button,textarea').forEach(el => { el.disabled = true; }); somenteLeitura(); return; }
  ligarLugares(v, lugV);
  $('tela').querySelectorAll('[data-vis]').forEach(seg => seg.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
    const x = i.visual[Number(seg.dataset.vis)];
    x.conforme = b.dataset.c === '1'; if (x.conforme) x.anomalia = null;
    salvar(); adiar2('visual:' + v.id, 'visual', v); pintar();
  })));
  $('tela').querySelectorAll('[data-van]').forEach(el => el.addEventListener('input', () => {
    i.visual[Number(el.dataset.van)].anomalia = el.value; salvar(); adiar2('visual:' + v.id, 'visual', v);
  }));
  i.visual.filter(x => x.conforme === false).forEach(x => ligarFotos(v, 'visual', () => x.item, x.item));
  $('tela').querySelectorAll('[data-vrm]').forEach(b => b.addEventListener('click', () => {
    i.visual.splice(Number(b.dataset.vrm), 1); salvar(); gravarVisual(v); pintar();
  }));
  ligar('visMais', () => janela('Outro item do exame', '<label class="f">Nome do item<input class="t" id="viNome" placeholder="Ex.: Isolamento térmico"></label>',
    [{ rotulo:'Cancelar' }, { rotulo:'Acrescentar', classe:'pri', acao:() => {
      const n = ($('viNome').value || '').trim(); if (!n){ U.toast('Escreva o nome.', 'err'); return false; }
      if (i.visual.some(x => x.item.toUpperCase() === n.toUpperCase())){ U.toast('Esse item já está na lista.', 'err'); return false; }
      i.visual.push({ item:n, conforme:null, anomalia:null }); salvar(); gravarVisual(v); N.janela.fechar(); pintar();
    } }]), 'click');
}

// ── acessórios ─────────────────────────────────────────────────────────────
function pmtaVigenteCam(v, camId){
  const cs = ativas(v), c = cs.find(x => x.id === camId) || (cs.length === 1 ? cs[0] : null);
  if (c && c.pmta_vigente_mpa) return c.pmta_vigente_mpa;
  const la = v.laudo_anterior; return la && la.situacao === 'conferido' && cs.length <= 1 ? la.pmta_mpa : null;
}
function avisosAcess(v){
  const a = [], l = acessDe(v).filter(x => x.situacao !== 'retirado');
  l.filter(x => VALVULAS.includes(x.tipo) && x.pressao_ajuste_mpa != null).forEach(x => {
    const p = pmtaVigenteCam(v, x.camara_id);
    if (p && x.pressao_ajuste_mpa > p + 1e-9) a.push((TIPOS_ACESS[x.tipo]) + (x.lacre_num ? ' lacre ' + x.lacre_num : '') + ': ajuste ' + fmt(x.pressao_ajuste_mpa, 3) +
      ' MPa acima da PMTA vigente (' + fmt(p, 3) + ' MPa). NR-13 13.5.1.2 "a".');
  });
  // S144 · item 75: a conexão da válvula sai no 7.6 do laudo ("com conexão …")
  l.filter(x => VALVULAS.includes(x.tipo) && x.situacao !== 'ausente' && !(x.conexao || '').trim()).forEach(x => a.push(TIPOS_ACESS[x.tipo] + ': informe a conexão (bitola).'));
  const cs = ativas(v);
  cs.forEach(c => {
    const tem = l.some(x => x.tipo === 'valvula_seguranca' && (cs.length === 1 || x.camara_id === c.id));
    if (!tem && (v.inspecao && v.inspecao.acessorios_conferidos)) a.push('Sem válvula de segurança' + (cs.length > 1 ? ' na câmara ' + c.nome : '') + '.');
  });
  return a;
}

// S86 · R04a: AFERIÇÃO DE MANÔMETRO E TESTE DE VÁLVULA (banco: sql/407)
// A conta é a do motor R00.3; o servidor refaz e é ele quem vale.
// ════════════════════════════════════════════════════════════════════════════
const AFERIVEIS = ['manometro', 'manovacuometro', 'valvula_seguranca', 'valvula_alivio', 'quebra_vacuo'];
const UN_AF = ['bar', 'kgf/cm2', 'MPa', 'psi', 'kPa'];
const UN_AF_ROT = { 'bar':'bar', 'kgf/cm2':'kgf/cm²', 'MPa':'MPa', 'psi':'psi', 'kPa':'kPa' };
const tipoAf = a => VALVULAS.includes(a.tipo) ? 'valvula' : 'manometro';
const afDe = (v, a) => ((v.inspecao && v.inspecao.afericoes) || []).filter(x => x.acessorio_id === a.id && !x.cancelada_em).pop() || null;
const nomeAc = a => a.tag || a.marca || TIPOS_ACESS[a.tipo] || a.tipo;
/** O envio pede, para manômetro e válvula presentes, a aferição completa ou o motivo (o mesmo texto do servidor). */
function faltasAfericao(v){
  const f = [];
  acessDe(v).filter(a => AFERIVEIS.includes(a.tipo) && a.situacao !== 'ausente' && a.situacao !== 'retirado' && !(a.afericao_motivo || '').trim())
    .sort((x, y) => (x.ordem || 0) - (y.ordem || 0)).forEach(a => {
      const af = afDe(v, a), r = af ? resultadoAf(v, a, af) : null;
      if (!af) f.push('Acessório "' + nomeAc(a) + '": afira ou diga por que não.');
      else if (!r.completo) f.push('Acessório "' + nomeAc(a) + '": aferição incompleta.');
    });
  return f;
}
function padraoDe(id){ return (E.padroes || []).find(p => p.id === id) || null; }
/** A conta local (a mesma do servidor): o resultado, as faltas e os avisos. */
function resultadoAf(v, a, af){
  const M = window.MotorNR13, pad = padraoDe(af.padrao_id);
  let r;
  try{
    if (af.tipo === 'manometro'){
      const uPad = pad && pad.u_expandida != null && pad.unidade ? M.deMPa(M.paraMPa(Number(pad.u_expandida), pad.unidade), af.unidade || 'bar') : null;
      r = M.afericaoManometro({ faixaIni:af.faixa_ini, faixaFim:af.faixa_fim, resolucao:af.resolucao, uPadrao:uPad, kPadrao:pad && pad.k || 2,
        pontos:(af.leituras && af.leituras.pontos) || [] });
      r.aprovadaOk = r.aprovado;
    } else {
      r = M.testeValvula({ unidade:af.unidade || 'bar', ajuste:af.ajuste, aberturas:(af.leituras && af.leituras.aberturas) || [],
        assentamentos:(af.leituras && af.leituras.assentamentos) || [], assentamento:af.leituras && af.leituras.assentamento, pmtaMPa:pmtaVigenteCam(v, a.camara_id) });
      r.aprovadaOk = r.aprovada;
    }
  }catch(e){ r = { completo:false, faltas:[e.message], avisos:[], aprovadaOk:false }; }
  // S140 · item 33: vaso sem laudo anterior não tem PMTA vigente: a abertura é conferida no escritório, contra a PMTA adotada
  const laSit = v.laudo_anterior && v.laudo_anterior.situacao;
  if (laSit === 'sem_laudo' || laSit === 'cliente_nao_tem') r.avisos = (r.avisos || []).map(x => /^Sem a PMTA vigente/.test(x) ? 'Vaso sem laudo anterior: a abertura é conferida no escritório, contra a PMTA adotada nesta inspeção.' : x);
  if (!af.padrao_id) r.faltas.push('Escolha o manômetro padrão.');
  if (!(af.lacre_colocado || '').trim()) r.faltas.push('Informe o lacre colocado.');
  r.completo = !r.faltas.length;
  r.resultado = !r.completo ? 'incompleto' : r.aprovadaOk ? 'aprovado' : 'reprovado';
  return r;
}
function chipAf(res){ return res === 'aprovado' ? '<span class="chip ok">' + 'aprovado' + '</span>' : res === 'reprovado' ? '<span class="chip pend">reprovado</span>' : '<span class="chip inc">incompleta</span>'; }
function blocoAfericao(v, a, pode){

      + (r.grave ? '<p class="alerta" style="margin:6px 0 0">Abertura acima da PMTA vigente: grave.</p>' : '')
      + '<button class="btn sec" data-afabre="' + esc(a.id) + '" style="margin-top:6px">' + (pode ? 'Abrir a aferição' : 'Ver') + '</button>'

  } else if ((a.afericao_motivo || '').trim()){

      + (pode ? '<div style="display:flex;gap:8px;margin-top:6px"><button class="btn pri" data-afnovo="' + esc(a.id) + '">Aferir</button>'

const ultimoPad = () => LS.get('tfdoc_af_pad', null), ultimaBan = () => LS.get('tfdoc_af_ban', null);

const AF_OK = ['tipo','acessorio_id','padrao_id','unidade','faixa_ini','faixa_fim','resolucao','ajuste','leituras','lacre_retirado','lacre_colocado','realizada_em'];   // S140 · item 56: sem validade_meses

/** 5 pontos (0, 25, 50, 75, 100%) arredondados para o número mais perto do mostrador. */
function sugerirPontos(ini, fim){
  const passo = (fim - ini) / 4, mag = Math.pow(10, Math.floor(Math.log10(passo)));
  const arr = x => { const r = Math.round(x / (mag / 2)) * (mag / 2); return Number(r.toFixed(6)); };
  const out = [ini, arr(ini + passo), arr(ini + 2 * passo), arr(ini + 3 * passo), fim];
  return out.filter((x, k) => out.indexOf(x) === k);
}

  } else {

    aoDigitar('afIni', el => { af.faixa_ini = n(el.value); mudou(false); });

    }));

// ── S144 · item 70: prazo menor que o da norma (externo e interno separados), com a justificativa ──
const PRAZO_MOTIVOS = ['Atmosfera agressiva (corrosão acelerada)', 'Perda de espessura acima do esperado', 'Histórico de anomalias no vaso', 'Condições de operação severas'];
function cartaoPrazo(v){
  const i = v.inspecao, PR = i.prazo_red || null;
  let pz = null; try{ const r = previa(v); pz = r.vaso && !r.vaso.erro ? r.vaso.prazos : null; }catch(e){}
  const opc = (max, val) => '<option value="">da norma</option>' + Array.from({ length:Math.max(0, (max || 10) - 1) }, (_, k) => k + 1)
    .map(n => '<option value="' + n + '"' + (Number(val) === n ? ' selected' : '') + '>' + n + (n === 1 ? ' ano' : ' anos') + '</option>').join('');
  return '<div class="card"><div class="chk" style="margin-top:0"><input type="checkbox" id="przOn"' + (PR ? ' checked' : '') + '><label for="przOn">Prazo das próximas inspeções menor que o da norma</label></div>'
    + '<div id="przCx"' + (PR ? '' : ' hidden') + '><p class="muted" style="margin:4px 0 0">' + (pz ? 'Pela NR-13: externo ' + pz.externo + ' ano(s), interno ' + (pz.interno == null ? 'a critério do PLH' : pz.interno + ' anos') + '. ' : '')
    + 'Só menor, nunca maior. O escritório e o PLH veem antes de aprovar.</p>'
    + '<div class="lin"><label class="f">Exame externo<select class="t" id="przExt">' + opc(pz && pz.externo, PR && PR.externo) + '</select></label>'
    + '<label class="f">Exame interno<select class="t" id="przInt">' + opc(pz && pz.interno != null ? pz.interno : 10, PR && PR.interno) + '</select></label></div>'
    + '<label class="f">Por quê<select class="t" id="przMot"><option value="">—</option>' + PRAZO_MOTIVOS.map(m => '<option' + (PR && PR.just === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('')
    + '<option value="+"' + (PR && PR.just && PRAZO_MOTIVOS.indexOf(PR.just) < 0 ? ' selected' : '') + '>Outro (escrever)</option></select></label>'
    + '<label class="f" id="przOutroL"' + (PR && PR.just && PRAZO_MOTIVOS.indexOf(PR.just) < 0 ? '' : ' hidden') + '>Motivo<textarea class="t" id="przOutro">' + esc(PR && PRAZO_MOTIVOS.indexOf(PR.just) < 0 ? PR.just || '' : '') + '</textarea></label></div></div>';
}
function ligarPrazo(v){
  const i = v.inspecao;
  const gravar = () => {
    const on = $('przOn').checked, ext = on ? Number($('przExt').value) || null : null, int = on ? Number($('przInt').value) || null : null;
    const just = $('przMot').value === '+' ? ($('przOutro').value || '').trim() : $('przMot').value;
    if (on && (ext || int) && just.length < 5) return;   // grava quando o motivo estiver dito
    i.prazo_red = on && (ext || int) ? { externo:ext, interno:int, just, origem:'campo' } : null; salvar();
    enfileirar(v, 'prazo', 'prazo das próximas inspeções', { funcao:'tf_insp_prazo_reduzir', payload:{ p_id:i.id, p_dados:{ externo:ext, interno:int, justificativa:on ? just : null } } });
  };
  ligar('przOn', el => { $('przCx').hidden = !el.checked; if (!el.checked && i.prazo_red) gravar(); });
  ligar('przExt', gravar); ligar('przInt', gravar);
  ligar('przMot', el => { $('przOutroL').hidden = el.value !== '+'; if (el.value !== '+') gravar(); });
  ligar('przOutro', gravar);
}
function avisoPrazo(v){
  const i = v.inspecao, on = $('przOn') && $('przOn').checked;
  if (!on) return null;
  const ext = Number($('przExt').value) || null, int = Number($('przInt').value) || null, just = $('przMot').value === '+' ? ($('przOutro').value || '').trim() : $('przMot').value;
  if (!ext && !int) return 'Prazo menor: escolha o prazo do exame externo, do interno ou dos dois (ou desmarque).';
  if (just.length < 5) return 'Prazo menor: diga por quê.';
  return null;
}
function telaFechamento(v){

  h += '<div class="card"><b>Foto de capa</b><p class="muted" style="margin:2px 0 0">O vaso inteiro, de frente: vai na capa do laudo.</p>' + gradeFotos(v, 'capa', 1) + '</div>';
  h += cartaoPrazo(v);   // S144 · item 70
  h += '<button class="btn pri" id="fEnviar"' + (f.length ? ' disabled' : '') + '>Enviar a inspeção deste vaso</button>';
  h += '<p class="muted" style="text-align:center;margin-top:6px">Depois de enviar, você ainda pode reabrir para corrigir, até o escritório começar a revisão. Sem sinal, vai quando o sinal voltar.</p>'
     + '<p class="muted" style="text-align:center;margin-top:2px">Depois do envio, cada um da equipe confirma a participação no próprio celular, com a digital (aba Eu): o laudo traz o nome de quem participou.</p>';
  h += '<button class="btn perigo" id="fNao">Não foi possível inspecionar este vaso</button>';
  $('tela').innerHTML = h;
  ligarFotos(v, 'capa', () => 'Capa');
  ligar('fObs', el => { i.observacao = el.value.trim() || null; salvar(); adiar2('fech:' + v.id, 'fech', v); }, 'input');
  ligarPrazo(v);
  const fechar = (situ, motivo) => {
    i.situacao = 'enviada'; i.pode_editar = false; if (motivo) i.nao_inspecionado_motivo = motivo; salvar();
  };
  ligar('fEnviar', () => {
    const ap = avisoPrazo(v); if (ap){ U.toast(ap, 'err'); return; }
    N.janela.confirmar('Enviar a inspeção do ' + v.tag + '?', '<p>Depois de enviar, você ainda pode reabrir para corrigir, até o escritório começar a revisão.</p>', 'Enviar').then(s => {
      if (!s) return;
      if (i.observacao !== undefined) enfileirar(v, 'fech', 'observações', { funcao:'tf_insp_fechamento_gravar', payload:{ p_id:i.id, p_dados:{ observacao:i.observacao || null } } });
      enfileirar(v, 'enviar-' + i.id, 'enviar', { funcao:'tf_insp_enviar', payload:{ p_id:i.id } }, null, true);
      fechar('enviada'); U.toast(navigator.onLine === false ? 'Guardado: vai quando o sinal voltar.' : 'Enviando…');
      ir({ nome:'lista' });
    });
  }, 'click');
  ligar('fNao', () => janela('Não foi possível inspecionar', '<label class="f">Motivo<select class="t" id="niSel"><option value="">—</option>' +
      MOTIVOS_NAO_INSP.map(m => '<option>' + esc(m) + '</option>').join('') + '<option value="+">Outro…</option></select></label>' +
      '<label class="f">Detalhe<small>Obrigatório em "Outro". Ex.: o cliente pediu nova data.</small><textarea class="t" id="niTx"></textarea></label>',
    [{ rotulo:'Cancelar' }, { rotulo:'Confirmar', classe:'pri', acao:() => {
      const s = $('niSel').value, tx = ($('niTx').value || '').trim();
      const m = s && s !== '+' ? (tx ? s + ' ' + tx : s) : tx;
      if (!m){ U.toast('Informe o motivo.', 'err'); return false; }
      enfileirar(v, 'naoinsp-' + i.id, 'vaso não inspecionado', { funcao:'tf_insp_nao_inspecionado', payload:{ p_id:i.id, p_motivo:m } }, null, true);
      fechar('enviada', m); N.janela.fechar(); ir({ nome:'lista' });
    } }]), 'click');
}

// ════════════════════════════════════════════════════════════════════════════
// S80 · R03b · ULTRASSOM, CSV DO MEDIDOR E A PRÉVIA DO CÁLCULO
// ════════════════════════════════════════════════════════════════════════════
const MOTIVOS_US = ['Sem acesso ao componente.', 'Isolamento térmico no componente.', 'Revestimento ou pintura impede a leitura.'];
const MAX_PONTOS = 60;
const leiturasDe = (v, cid) => ((v.inspecao && v.inspecao.leituras) || []).filter(l => l.componente_id === cid);
const semLeitura = v => (v.inspecao && v.inspecao.ultrassom_sem_leitura) || {};
const compsMedir = v => compsAtivos(v).filter(c => !c.nao_medir).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
function estUltra(v){
  const i = v.inspecao || {}, cs = compsMedir(v);
  const feitos = cs.filter(c => leiturasDe(v, c.id).length || (semLeitura(v)[c.id] || '').trim()).length;
  if (!i.medidor_id && !feitos) return 'vazia';
  return i.medidor_id ? 'ok' : 'inc';   // S107 · 412: as leituras são opcionais aqui (o CSV entra no escritório)
}
function minimaDe(v, cid){
  const l = leiturasDe(v, cid); if (!l.length) return null;
  try{ return MotorNR13.minimaLeituras(l.map(x => x.valor_mm)); }catch(e){ return null; }
}
function materialDe(v, c){
  const id = (c && c.material_id) || v.material_id;
  return id ? (E.materiais || []).find(m => m.id === id) || null : null;
}
const camaraDe = (v, c) => v.camaras.find(k => k.id === c.camara_id) || ativas(v)[0] || null;

/** Espessura mínima requerida (com o mínimo de 1,5 mm e a corrosão), ou o motivo de não dar. */
function eMinDe(v, c){
  const k = camaraDe(v, c), m = materialDe(v, c);
  if (!k || k.p_operacao_max_mpa == null) return { erro:'sem a pressão de operação' };
  if (k.pressao_externa || k.p_operacao_max_mpa <= 0) return { erro:'pressão externa: calculada no escritório' };
  if (!m || !(m.s_mpa > 0)) return { erro:'sem o material' };
  try{
    const g = geoDe(v, c);
    const e = MotorNR13.espessuraMinima(g, k.p_operacao_max_mpa, Number(m.s_mpa), g.E);
    return { valor: Math.max(e, 1.5) + (Number(v.corrosao_mm) || 0), padrao:g.padrao };
  }catch(e){ return { erro:e.message }; }
}

// ── gravar ─────────────────────────────────────────────────────────────────
function gravarLeituras(v, c){
  const l = leiturasDe(v, c.id);
  const origem = l.length && l.every(x => x.origem === 'csv') ? 'csv' : 'digitado';
  enfileirar(v, 'leit-' + c.id, 'espessuras ' + c.nome, { funcao:'tf_insp_leituras_gravar',
    payload:{ p_id:v.inspecao.id, p_componente:c.id, p_leituras:l.map(x => ({ ponto:x.ponto, leitura:x.leitura, valor:x.valor_mm })), p_origem:origem } });
}
function gravarUS(v){
  const i = v.inspecao;
  enfileirar(v, 'us', 'ultrassom', { funcao:'tf_insp_ultrassom_gravar',
    payload:{ p_id:i.id, p_dados:{ medidor_id:i.medidor_id || null, pasta:i.ultrassom_pasta || null, sem_leitura:Object.assign({}, semLeitura(v)) } } });
}
const adiar3 = debounce((tipo, v, x) => { if (tipo === 'leit') gravarLeituras(v, x); else gravarUS(v); }, 900);
function porLeitura(v, cid, ponto, leitura, valor){
  const i = v.inspecao;
  i.leituras = (i.leituras || []).filter(x => !(x.componente_id === cid && x.ponto === ponto && x.leitura === leitura));
  if (valor != null) i.leituras.push({ componente_id:cid, ponto, leitura, valor_mm:valor, origem:'digitado' });
  i.leituras.sort((a, b) => a.componente_id < b.componente_id ? -1 : a.componente_id > b.componente_id ? 1 : (a.ponto - b.ponto) || (a.leitura - b.leitura));
  salvar();
}

// ── a tela ─────────────────────────────────────────────────────────────────
function rotMin(v, c){
  const t = minimaDe(v, c.id), e = eMinDe(v, c);
  let h = 'Mínima: <b>' + (t == null ? '—' : fmt(t, 2) + ' mm') + '</b>';

// ── o CSV do medidor (colunas Spot_No, Reading_No e Reading) ───────────────
function lerCsv(txt){
  const linhas = String(txt).replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  if (!linhas.length) throw new Error('Arquivo vazio.');
  const sep = [';', '\t', ','].find(c => linhas[0].indexOf(c) >= 0) || ',';
  const cab = linhas[0].split(sep).map(x => x.trim().replace(/^"|"$/g, '').toLowerCase());
  const iS = cab.indexOf('spot_no'), iN = cab.indexOf('reading_no'), iR = cab.indexOf('reading');
  if (iS < 0 || iR < 0) throw new Error('O arquivo não tem as colunas Spot_No e Reading.');
  const spots = [], por = {};
  linhas.slice(1).forEach((ln, n) => {
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const sp = c[iS], val = num(c[iR]);
    if (!sp) return;
    if (val == null || Number.isNaN(val) || val <= 0 || val > 300) throw new Error('Linha ' + (n + 2) + ': leitura inválida (' + (c[iR] || 'vazia') + ').');
    if (!por[sp]){ por[sp] = []; spots.push(sp); }
    por[sp].push({ n: iN >= 0 ? Number(c[iN]) || por[sp].length + 1 : por[sp].length + 1, val });
  });
  if (!spots.length) throw new Error('Nenhuma leitura no arquivo.');
  spots.forEach(sp => por[sp].sort((a, b) => a.n - b.n));
  return { spots, por };
}
function importarCsv(v){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try{ distribuirCsv(v, lerCsv(rd.result)); }catch(e){ U.toast(e.message, 'err'); } };
    rd.readAsText(f);
  });
  inp.click();
}
function distribuirCsv(v, d){
  const cs = compsMedir(v).filter(c => !(semLeitura(v)[c.id] || '').trim());
  const n = d.spots.length;
  // sugestão: divide os pontos do arquivo na ordem dos componentes, em partes iguais
  const passo = Math.max(1, Math.floor(n / Math.max(1, cs.length)));
  let h = '<p class="info" style="margin-top:0">O arquivo tem <b>' + n + ' ponto' + (n > 1 ? 's' : '') + '</b> (do ' + esc(d.spots[0]) + ' ao ' + esc(d.spots[n - 1]) +
    '). Diga quais pontos (pela ordem no arquivo, 1 a ' + n + ') vão para cada componente. Componente em branco fica como está.</p>';
  h += '<p class="muted">Substitui as leituras já digitadas do componente.</p>';
  cs.forEach((c, k) => {
    const de = k * passo + 1, ate = k === cs.length - 1 ? n : Math.min(n, (k + 1) * passo);
    h += '<div class="lin" style="align-items:flex-end"><div style="flex:2;font-weight:600;padding-bottom:12px">' + esc(c.nome) + '</div>' +
      '<label class="f">de<input class="t" inputmode="numeric" id="cd_' + esc(c.id) + '" value="' + (de <= n ? de : '') + '"></label>' +
      '<label class="f">até<input class="t" inputmode="numeric" id="ca_' + esc(c.id) + '" value="' + (de <= n ? ate : '') + '"></label></div>';
  });
  janela('Importar o CSV', h, [{ rotulo:'Cancelar' }, { rotulo:'Conferir', classe:'pri', acao:() => {
    const usados = new Set(), plano = [];
    for (const c of cs){
      const de = num($('cd_' + c.id).value), ate = num($('ca_' + c.id).value);
      if (de == null && ate == null) continue;
      if (!(de >= 1 && ate >= de && ate <= n && Number.isInteger(de) && Number.isInteger(ate))){ U.toast(c.nome + ': faixa inválida (1 a ' + n + ').', 'err'); return false; }
      if (ate - de + 1 > MAX_PONTOS){ U.toast(c.nome + ': no máximo ' + MAX_PONTOS + ' pontos.', 'err'); return false; }
      for (let p = de; p <= ate; p++){ if (usados.has(p)){ U.toast('O ponto ' + p + ' do arquivo está em dois componentes.', 'err'); return false; } usados.add(p); }
      plano.push({ c, de, ate });
    }
    if (!plano.length){ U.toast('Nenhuma faixa preenchida.', 'err'); return false; }
    setTimeout(() => conferirCsv(v, d, plano), 0);
  } }]);
}
function conferirCsv(v, d, plano){
  let corte = 0;
  const novo = plano.map(({ c, de, ate }) => {
    const l = [];
    for (let p = de; p <= ate; p++){
      const rs = d.por[d.spots[p - 1]];
      if (rs.length > 4) corte++;
      rs.slice(0, 4).forEach((r, k) => l.push({ componente_id:c.id, ponto:p - de + 1, leitura:k + 1, valor_mm:Math.round(r.val * 100) / 100, origem:'csv' }));
    }
    return { c, l };
  });
  const h = novo.map(({ c, l }) => {
    const mn = MotorNR13.minimaLeituras(l.map(x => x.valor_mm));
    return '<div class="fl"><b>' + esc(c.nome) + '</b>' + (l.length ? new Set(l.map(x => x.ponto)).size + ' pontos, ' + l.length + ' leituras · mínima ' + fmt(mn, 2) + ' mm' : '') + '</div>';
  }).join('') + (corte ? '<p class="alerta" style="margin-top:8px">' + corte + ' ponto(s) com mais de 4 leituras: ficaram as 4 primeiras.</p>' : '');
  janela('Conferir antes de gravar', h, [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:() => {
    const i = v.inspecao;
    novo.forEach(({ c, l }) => {
      i.leituras = (i.leituras || []).filter(x => x.componente_id !== c.id).concat(l);
      c._pontos = 0;
      gravarLeituras(v, c);
    });
    salvar(); U.toast('Leituras importadas.'); setTimeout(pintar, 0);
  } }]);
}

// ── a prévia do cálculo (motor no aparelho, sem sinal) ─────────────────────
const RISCO = { A:4, B:3, C:2, D:1 };
/** O nome da governante: no costado com regiões, "Costado (menor leitura no CS)" (item 51). */
function nomeGov(ck){
  const g = ck.governante; if (!g) return '';
  if (g.c.tipo === 'costado' && ck.comps.filter(x => x.c.tipo === 'costado').length > 1) return 'Costado (menor leitura no ' + (siglaReg(g.c) || nomeReg(g.c)) + ')';
  return g.c.nome;
}
function previa(v){
  const r = { camaras:[], vaso:null, avisos:[], detalhes:[] };
  const cs = ativas(v), u = unidadeDe(v);
  const m = materialDe(v, null);
  if (!m) r.avisos.push('Prévia: sem o material do costado (Operação e câmaras), a PMTA não sai.');
  else {
    if (!m.conferido) r.avisos.push('O material ' + m.especificacao + ' é da lista provisória, ainda não conferida pelo Fernando: a prévia é indicativa.');
    cs.forEach(k => { if (m.t_max_c != null && k.t_operacao_c != null && Number(k.t_operacao_c) > Number(m.t_max_c))
      r.avisos.push('Temperatura de operação' + (cs.length > 1 ? ' (' + k.nome + ')' : '') + ' acima de ' + fmt(m.t_max_c, 0) + ' °C: o S do material não vale.'); });
  }
  const padrao = new Set();
  cs.forEach(k => {
    const ck = { cam:k, comps:[], governante:null, erro:null };
    const P = k.p_operacao_max_mpa;
    if (P == null) ck.erro = 'Sem a pressão de operação.';
    else if (k.pressao_externa || P <= 0) ck.erro = 'Pressão externa (vácuo): a PMTA externa é do escritório (PLH).';
    else if (!m) ck.erro = 'Sem o material.';
    compsMedir(v).filter(c => camaraDe(v, c) === k).forEach(c => {
      const t = minimaDe(v, c.id), x = { c, tMin:t, eMin:null, pmta:null, erro:null, abaixo:false };
      if (!ck.erro){
        try{
          const g = geoDe(v, c), mc = materialDe(v, c);
          const res = MotorNR13.calcularVaso({ pOperacaoMPa:P, S:Number(mc.s_mpa), corrosaoMm:Number(v.corrosao_mm) || 0,
            componentes:[Object.assign({}, g, { leituras:leiturasDe(v, c.id).map(y => y.valor_mm) })] });
          const rc = res.componentes[0];
          x.eMin = rc.eMin; x.pmta = rc.pmtaMPa; x.abaixo = rc.abaixoDaMinima;
          g.padrao.forEach(p => padrao.add(c.nome));
        }catch(e){ x.erro = e.message; }
      }
      ck.comps.push(x);
    });
    const ok = ck.comps.filter(x => x.pmta != null);
    if (ok.length) ck.governante = ok.reduce((a, b) => b.pmta < a.pmta ? b : a);
    const nm = cs.length > 1 ? ' (' + k.nome + ')' : '';
    if (ck.governante && ck.governante.pmta < P) r.avisos.push('PMTA calculada' + nm + ' de ' + fmt(deMPa(ck.governante.pmta, u), 2) + ' ' + UNID_ROT[u] + ', abaixo da pressão de operação (' + nomeGov(ck) + ').');
    ck.comps.filter(x => x.abaixo).forEach(x => r.avisos.push(x.c.nome + ': espessura medida abaixo da mínima requerida.'));
    ck.comps.filter(x => x.erro).forEach(x => r.detalhes.push(x.c.nome + ': ' + x.erro));
    r.camaras.push(ck);
  });
  if (padrao.size) r.detalhes.push('Geometria padrão (a validar pelo Fernando) em: ' + [...padrao].join(', ') + '.');
  // a categoria do vaso pela conta única (pendência 20)
  try{
    if (!cs.length) throw new Error('Sem câmaras.');
    if (cs.some(k => k.p_operacao_max_mpa == null || !k.classe_fluido)) throw new Error('Falta a pressão de operação ou a classe do fluido.');
    if (cs.some(k => k.volume_desconhecido || !(k.volume_m3 > 0))) throw new Error('Volume desconhecido: o escritório informa o volume para a categoria.');
    const kP = cs.reduce((a, b) => Math.abs(b.p_operacao_max_mpa) > Math.abs(a.p_operacao_max_mpa) ? b : a);
    const V = cs.reduce((a, k) => a + Number(k.volume_m3), 0);
    const classe = cs.map(k => String(k.classe_fluido).toUpperCase()).reduce((a, b) => RISCO[b] > RISCO[a] ? b : a);
    const cat = MotorNR13.categoria(classe, kP.p_operacao_max_mpa, V);
    const pr = MotorNR13.prazos(cat.categoria, { semCodigoConstrucao:!!v.sem_codigo_construcao, temperaturaAbaixoDeZeroSemDeterioracao:!!v.abaixo_zero_sem_deterioracao });
    r.vaso = { P:kP.p_operacao_max_mpa, deCamara:kP, V, classe, pv:cat.pv, grupo:cat.grupo, categoria:cat.categoria, prazos:pr };
  }catch(e){ r.vaso = { erro:e.message }; }
  return r;
}
function telaPrevia(v){
  titulo('Prévia do cálculo', v.tag);
  const u = unidadeDe(v), pr = (x, c) => x == null ? '—' : fmt(deMPa(x, u), c == null ? 2 : c) + ' ' + UNID_ROT[u] + (u !== 'MPa' ? ' <span class="muted">(' + fmt(x, 3) + ' MPa)</span>' : '');
  let r;
  try{ r = previa(v); }catch(e){ $('tela').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; return; }
  const m = materialDe(v, null);
  let h = '<div class="alerta" style="background:var(--accent-soft);color:var(--accent-ink)"><b>Só informativa</b>O resultado oficial é calculado e gravado na revisão, no escritório.</div>';
  if (r.avisos.length) h += '<div class="alerta"><b>Avisos</b><ul>' + r.avisos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  h += '<div class="card"><b>Material</b><p class="info" style="margin:4px 0 0">' + (m ? esc(m.especificacao + (m.forma ? ' (' + m.forma + ')' : '')) + ' · S = ' + fmt(m.s_mpa, 1) + ' MPa' +
    (m.conferido ? '' : ' · <span class="chip inc">provisório</span>') : 'não informado') + (Number(v.corrosao_mm) ? ' · corrosão ' + fmt(v.corrosao_mm, 2) + ' mm' : '') + '</p></div>';
  r.camaras.forEach(ck => {
    h += '<div class="card cam"><div class="ct"><span>' + esc(ck.cam.nome) + '</span></div><div class="classe">Pressão de operação: ' + pr(ck.cam.p_operacao_max_mpa) + '</div>';
    if (ck.erro) h += '<p class="muted" style="margin:6px 0 0">' + esc(ck.erro) + '</p>';
    // S140 · item 51: o costado aparece uma vez (a menor leitura de todas as regiões), com as regiões embaixo
    const regs = ck.comps.filter(x => x.c.tipo === 'costado'), juntar = regs.length > 1;
    const linhaComp = (x, nome, gov) => '<div class="fl"' + (x.abaixo ? ' style="color:var(--crit)"' : '') + '><b>' + esc(nome) + (gov ? ' · governante' : '') + '</b>' +
        (x.erro ? '<span class="mot">' + esc(x.erro) + '</span>' : x.tMin == null && (semLeitura(v)[x.c.id] || '').trim() ? '<span class="muted">sem leitura: ' + esc(semLeitura(v)[x.c.id]) + '</span>' :
          'medida ' + (x.tMin == null ? '—' : fmt(x.tMin, 2) + ' mm') + ' · requerida ' + (x.eMin == null ? '—' : fmt(x.eMin, 2) + ' mm') + ' · PMTA ' + pr(x.pmta)) + '</div>';
    if (juntar){
      const comT = regs.filter(x => x.tMin != null), menor = comT.length ? comT.reduce((a, b) => b.tMin < a.tMin ? b : a) : regs[0];
      const gov = ck.governante && ck.governante.c.tipo === 'costado';
      h += linhaComp(Object.assign({}, menor, { abaixo:regs.some(x => x.abaixo) }), comT.length ? 'Costado (menor leitura no ' + (siglaReg(menor.c) || nomeReg(menor.c)) + ')' : 'Costado', gov);
      h += '<div class="muted" style="margin:-4px 0 6px 10px">' + regs.map(x => esc(siglaReg(x.c) || nomeReg(x.c)) + ' ' + (x.tMin == null ? '—' : fmt(x.tMin, 2) + ' mm')).join(' · ') + '</div>';
    }
    ck.comps.filter(x => !(juntar && x.c.tipo === 'costado')).forEach(x => { h += linhaComp(x, x.c.nome, ck.governante && ck.governante.c.id === x.c.id); });
    if (ck.governante) h += '<p style="margin:8px 0 0"><b>PMTA calculada: ' + pr(ck.governante.pmta) + '</b>' + (juntar && ck.governante.c.tipo === 'costado' ? ' <span class="muted">(' + esc(nomeGov(ck)) + ')</span>' : '') + '</p>';
    h += '</div>';
  });
  h += '<div class="card"><b>O vaso · categoria e prazos</b>';
  if (r.vaso.erro) h += '<p class="muted" style="margin:4px 0 0">' + esc(r.vaso.erro) + '</p>';
  else {
    const z = r.vaso;
    h += '<p class="info" style="margin:4px 0 0">P = ' + pr(z.P) + (ativas(v).length > 1 ? ' (de ' + esc(z.deCamara.nome) + ')' : '') + ' · V = ' + fmt(z.V, 3) + ' m³ · classe ' + z.classe + '</p>' +
      '<p class="info" style="margin:2px 0 0">P·V = ' + fmt(z.pv, 3) + ' · grupo ' + z.grupo + ' · <b>categoria ' + z.categoria + '</b></p>' +
      '<p class="info" style="margin:2px 0 0">Próximas: externa em ' + z.prazos.externo + ' ano' + (z.prazos.externo > 1 ? 's' : '') +
      ' · interna ' + (z.prazos.interno == null ? 'a critério do PLH' : 'em ' + z.prazos.interno + ' anos') + ' <span class="muted">· item ' + esc(z.prazos.regra) + ' da NR-13</span></p>';
    if (ativas(v).length > 1) h += '<p class="muted" style="margin:6px 0 0">Conta única: a maior pressão entre as câmaras, o volume total e o fluido de maior risco.</p>';
  }
  h += '</div>';
  if (r.detalhes.length) h += '<div class="card"><b>Observações do cálculo</b><ul style="margin:4px 0 0;padding-left:18px">' + r.detalhes.map(x => '<li class="info">' + esc(x) + '</li>').join('') + '</ul></div>';
  h += '<p class="rodape">Motor ' + esc(MotorNR13.versao || '') + '</p>';
  $('tela').innerHTML = h;
}
