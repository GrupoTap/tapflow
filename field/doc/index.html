<!--
  TapDoc 4 · a coleta da inspeção no celular (R02a, R02b1, R03a e R03b)
  ─────────────────────────────────────────────────────────────────
  Mora em field/doc/ e é aberta pelo Field (botão "Abrir a inspeção" da
  T06 · Executar a inspeção). Usa o núcleo N2: a sessão, o PIN, a fila de envios
  sem sinal e as fotos.
  Banco: sql/400 (R02a), 401 (R02b1, preparação) e 402 (R03a: exame visual,
  acessórios, boroscopia, teste de pressão, fechamento e envio) e 403 (R03b:
  ultrassom, geometria dos componentes e a prévia do motor de cálculo).
  Desenhos: inspecao-nr13/rodadas/R02-field-coleta.md e R03-campo-final-desenho.md.
  Feito pelo chat central em 22/10/2026.

  COMO FUNCIONA SEM SINAL
   · Ao abrir com sinal, baixa o "pacote" da OS (tf_insp_pacote_os) e guarda
     no aparelho. Daí em diante tudo funciona sem sinal.
   · Cada gravação vira uma entrada da fila do núcleo (tipo 'insp', um grupo
     por vaso), com o id gerado AQUI. O banco aceita reenvio sem duplicar.
   · Vaso com envio pendente fica com a versão do aparelho; sem pendência,
     o pacote novo do servidor substitui.
  O endereço leva a OS depois do # (doc/#os=<id>&t=<id>): assim o service
  worker do Field acha a página guardada sem sinal.
-->
<style>
:root{

<script>
'use strict';
const VERSAO = 'TapDoc 8';   // S86 · 407 (R04a): aferição de manômetro e teste de válvula em campo (TapDoc 7: material do escritório; 6: faixa)
// 405: uma linha curta com a faixa do material, para conferir com a plaqueta ou o certificado da chapa
function linhaFaixa(m){
  if (!m || m.resist_min_mpa == null) return '';
  const f = m.resist_max_mpa != null ? fmt(m.resist_min_mpa, 0) + ' a ' + fmt(m.resist_max_mpa, 0) + ' MPa' : 'mín. ' + fmt(m.resist_min_mpa, 0) + ' MPa';
  return 'Resistência ' + f + ' · S ' + fmt(m.s_mpa, 1) + ' MPa' + (m.conferido ? '' : ' · a conferir');
}
if (window.TapModulos) TapModulos.aplicar('tapdoc');
const CFG = window.TF_CONFIG || {};
const SUPA_URL = CFG.SUPABASE_URL || '', SUPA_ANON = CFG.SUPABASE_ANON_KEY || '';
const DEMO = !SUPA_URL || !SUPA_ANON;
const NO_SERVIDOR = /^https?:$/.test(location.protocol);
const N = window.Nucleo;
const $ = id => document.getElementById(id);

if (!N){
  document.getElementById('tela').innerHTML = '<div class="card vazio">Sem o núcleo do TapFlow. Abra o Field uma vez com sinal e tente de novo.</div>';
  throw new Error('sem núcleo');
}
const U = N.util, esc = U.esc;

// ── utilitários ────────────────────────────────────────────────────────────
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
function uid(){
  try{ if (crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
/** "1,5" ou "1.5" → 1.5; vazio → null */
function num(s){
  if (s == null) return null;
  let t = String(s).trim().replace(/\s/g, '');
  if (!t) return null;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  const v = Number(t);
  return isFinite(v) ? v : NaN;
}
function fmt(v, casas){
  if (v == null || v === '' || !isFinite(Number(v))) return '';
  const c = casas == null ? 4 : casas;
  return String(Number(Number(v).toFixed(c))).replace('.', ',');
}
/** A janela do núcleo: botões {rotulo, classe:'pri', acao}. Sem acao, fecha.
 *  A acao que devolve false deixa a janela aberta (faltou preencher algo). */
function janela(tit, html, bts){
  N.janela.abrir(tit, html, (bts || []).map(b => ({ label:b.rotulo, pri:b.classe === 'pri',
    onClick:() => { const r = b.acao ? b.acao() : undefined; if (r !== false) N.janela.fechar(); } })));
}
function debounce(fn, ms){ const t = {}; return (k, ...a) => { clearTimeout(t[k]); t[k] = setTimeout(() => fn(...a), ms); }; }

// unidades da plaqueta → MPa (manométrica)
const UNID = { 'bar':0.1, 'kgf/cm2':0.0980665, 'MPa':1, 'psi':0.00689476 };
const UNID_ROT = { 'bar':'bar', 'kgf/cm2':'kgf/cm²', 'MPa':'MPa', 'psi':'psi' };
const paraMPa = (v, u) => v == null ? null : Math.round(v * UNID[u] * 1e4) / 1e4;
const deMPa = (v, u) => v == null ? null : v / UNID[u];

const FLUIDOS = [['Ar comprimido','C'],['Vapor d’água','C'],['Água','D'],['Nitrogênio','C'],['CO₂','C'],
  ['Óleo térmico','B'],['GLP','A'],['Gás natural','A'],['Hidrogênio','A'],['Amônia','A']];
const CLASSES = {
  A:'Inflamável; combustível acima de 200 °C; tóxico com limite de tolerância ≤ 20 ppm; hidrogênio; acetileno.',
  B:'Combustível abaixo de 200 °C; tóxico com limite de tolerância > 20 ppm.',
  C:'Vapor de água, gases asfixiantes simples, ar comprimido.',
  D:'Qualquer outro fluido (água, por exemplo).'
};
const TIPOS_COMP = { costado:'Costado (cilindro)', eliptico:'Tampo elíptico', torisferico:'Tampo torisférico',
  hemisferico:'Tampo hemisférico', conico:'Tampo cônico', plano:'Tampo plano', janela:'Janela de visita' };
const POS_COMP = ['superior','inferior','esquerdo','direito','lateral','frontal','traseiro'];
const TIPOS_CAM = { unica:'Única', casco:'Casco', tubo:'Tubos', camisa:'Camisa' };
const CODIGOS = ['ASME VIII Div. 1','ASME VIII Div. 2','AD-Merkblätter','BS 5500 / PD 5500','EN 13445','NBR'];
const ROTEIRO_LAUDO = ['Folha de rosto (empresa, nº e data)','Conclusão (PMTA e categoria)',
  'Plaqueta e dados do vaso','Quadro de espessuras','Assinatura (PLH e CREA)'];

// ── parâmetros: depois do # (e ? por compatibilidade com o Field S34) ──────
const PAR = (() => {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  return { os: h.get('os') || q.get('os'), t: h.get('t') || h.get('tarefa') || q.get('tarefa') };
})();
const OS = PAR.os || (DEMO ? 'demo-os' : null);

// ── estado do aparelho ─────────────────────────────────────────────────────
const K_OS = 'tfd_os_' + OS, K_MINI = 'tfd_mini';
let E = LS.get(K_OS, null);           // { os, vasos, fabricantes, materiais, baixado_em }
let MINI = LS.get(K_MINI, {});        // miniaturas das fotos: id → dataURL (só para mostrar)
let telaAtual = { nome:'lista' };
function salvar(){
  if (!LS.set(K_OS, E)){ U.toast('O aparelho está sem espaço para guardar. Envie o que está pendente.', 'err'); }
}
function salvarMini(){
  const ks = Object.keys(MINI);
  if (ks.length > 180) ks.slice(0, ks.length - 180).forEach(k => delete MINI[k]);
  if (!LS.set(K_MINI, MINI)){ const ks2 = Object.keys(MINI); ks2.slice(0, Math.ceil(ks2.length / 2)).forEach(k => delete MINI[k]); LS.set(K_MINI, MINI); }
}
const vaso = id => (E && E.vasos || []).find(v => v.id === id);

function normVaso(sv){
  const v = Object.assign({}, sv);
  v.camaras = (sv.camaras || []).map(c => Object.assign({}, c));
  v.componentes = (sv.componentes || []).map(c => Object.assign({}, c));
  v.inspecao = sv.inspecao ? Object.assign({}, sv.inspecao, { fotos:(sv.inspecao.fotos || []).map(f => Object.assign({}, f)),
    // S79 · R03a: o resto da coleta
    visual:(sv.inspecao.visual || []).map(x => Object.assign({}, x)),
    acessorios:(sv.inspecao.acessorios || []).map(x => Object.assign({}, x)),
    boroscopia:sv.inspecao.boroscopia ? Object.assign({}, sv.inspecao.boroscopia) : null,
    teste:sv.inspecao.teste ? Object.assign({}, sv.inspecao.teste) : null,
    // S80 · R03b: o ultrassom
    leituras:(sv.inspecao.leituras || []).map(x => Object.assign({}, x)),
    ultrassom_sem_leitura:Object.assign({}, sv.inspecao.ultrassom_sem_leitura || {}),
    // S86 · R04a: as aferições
    afericoes:(sv.inspecao.afericoes || []).map(x => Object.assign({}, x, { leituras:JSON.parse(JSON.stringify(x.leituras || {})) })) }) : null;
  v.acessorios_anteriores = sv.acessorios_anteriores || [];
  v.laudo_anterior = sv.laudo_anterior || null;
  // 406: o material que o escritório definiu (a referência) e o motivo de uma troca em campo já gravada
  v._matEsc = (sv.inspecao && sv.inspecao.material_escritorio_id) || sv.material_id || null;
  v._matMotivo = (sv.inspecao && sv.inspecao.material_campo_motivo) || null;
  v._pv = {};
  return v;
}
/** Pacote novo do servidor: vaso com envio pendente fica com a versão do aparelho. */
function mesclar(p){
  const pend = new Set(N.fila.listar({ tipo:'insp' }).map(e => e.grupo));
  const velhos = {}; ((E && E.vasos) || []).forEach(v => { velhos[v.id] = v; });
  const vasos = (p.vasos || []).map(sv => (velhos[sv.id] && pend.has('insp|' + sv.id)) ? velhos[sv.id] : normVaso(sv));
  Object.values(velhos).forEach(v => {
    if (!vasos.some(x => x.id === v.id) && pend.has('insp|' + v.id)) vasos.push(v);
  });
  E = { os:p.os, vasos, fabricantes:p.fabricantes || [], materiais:p.materiais || [], medidores:p.medidores || [], padroes:p.padroes || [], bancadas:p.bancadas || [], baixado_em:p.gerado_em || new Date().toISOString() };
  salvar();
}

// ── a fila ─────────────────────────────────────────────────────────────────
/** Uma gravação = uma entrada. Sem sinal, a gravação seguinte do MESMO dado
 *  substitui a anterior no lugar (nada está sendo enviado); com sinal, cada
 *  uma ganha id próprio (a anterior pode estar a caminho). */
function enfileirar(v, chave, rotulo, rpc, fotos, fixo){
  const grupo = 'insp|' + v.id;
  let id = fixo ? chave : null;
  if (!id && navigator.onLine === false){
    const ex = N.fila.listar({ tipo:'insp', grupo }).filter(e => e.id.indexOf(chave + '~') === 0 && !e.parado).pop();
    if (ex) id = ex.id;
  }
  if (!id) id = chave + '~' + uid();
  N.fila.adicionar({ tipo:'insp', id, grupo, rotulo: v.tag + ' · ' + rotulo, rpc, fotos });
  pintarFila();
  return id;
}
const CAM_OK = ['id','tipo','nome','ordem','fluido','classe_fluido','p_operacao_max_mpa','t_operacao_c','volume_m3',
  'volume_desconhecido','pmta_plaqueta_mpa','pth_mpa','pressao_externa','pmta_externa_plaqueta_mpa','unidade_campo','ativo'];
function pegar(o, ks){ const r = {}; ks.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; }
function gravarCamara(v, c){
  enfileirar(v, 'cam-' + c.id, 'câmara ' + c.nome, { funcao:'tf_insp_camara_gravar', payload:{ p_equip:v.id, p_dados:pegar(c, CAM_OK) } });
}
function gravarComp(v, c){
  enfileirar(v, 'comp-' + c.id, 'componente ' + c.nome, { funcao:'tf_insp_componente_gravar',
    payload:{ p_equip:v.id, p_dados:pegar(c, ['id','tipo','nome','posicao','camara_id','nao_medir','ordem','ativo',
      'r_mm','l_mm','d_mm','alfa_graus','fator_c','aparafusada','eficiencia_junta','material_id']) } });
}
function gravarVaso(v){
  enfileirar(v, 'vaso', 'dados do vaso', { funcao:'tf_insp_vaso_gravar', payload:{ p_equip:v.id, p_dados:Object.assign({}, v._pv) } });
}
const adiar = debounce((tipo, v, x) => {
  if (tipo === 'vaso') gravarVaso(v); else if (tipo === 'cam') gravarCamara(v, x); else if (tipo === 'comp') gravarComp(v, x);
}, 700);
function mudouVaso(v, campo, valor){
  v[campo] = valor; v._pv[campo] = valor; salvar(); adiar('vaso:' + v.id, 'vaso', v);
}
function mudouCam(v, c, campo, valor){ c[campo] = valor; salvar(); adiar('cam:' + c.id, 'cam', v, c); }
function mudouComp(v, c, campo, valor){ c[campo] = valor; salvar(); adiar('comp:' + c.id, 'comp', v, c); }

function pendDoVaso(v){ return N.fila.listar({ tipo:'insp', grupo:'insp|' + v.id }); }
function pintarFila(){
  const l = N.fila.listar({ tipo:'insp' }).filter(e => (E && E.vasos || []).some(v => e.grupo === 'insp|' + v.id));
  const parados = l.filter(e => e.parado).length;
  const b = $('barFila');
  b.hidden = !l.length;
  b.classList.toggle('so', !parados);
  $('filaTx').textContent = l.length === 1 ? '1 envio aguardando' : l.length + ' envios aguardando';
  if (parados) $('filaTx').textContent += ' · ' + parados + ' parado' + (parados > 1 ? 's' : '');
}
$('filaJa').addEventListener('click', () => { N.fila.enviarAgora(); U.toast(navigator.onLine === false ? 'Sem sinal agora. Envia sozinho quando voltar.' : 'Enviando…'); });
$('filaVer').addEventListener('click', verFila);
function verFila(){
  const l = N.fila.listar({ tipo:'insp' }).filter(e => (E && E.vasos || []).some(v => e.grupo === 'insp|' + v.id));
  const grupos = [...new Set(l.filter(e => e.parado).map(e => e.grupo))];
  const html = l.length ? l.map(e => '<div class="fl"><b>' + esc(e.rotulo) + '</b>' +
      (e.fotos && e.fotos.length ? '<span class="muted">' + e.fotos.length + ' arquivo(s)</span>' : '') +
      (e.motivo ? '<div class="mot">' + esc(e.motivo) + '</div>' : '') + '</div>').join('')
    : '<p class="muted">Nada pendente.</p>';
  const bts = [{ rotulo:'Fechar' }];
  if (grupos.length) bts.unshift({ rotulo:'Tentar de novo os parados', classe:'pri', acao:() => { grupos.forEach(g => N.fila.retomar(g)); N.janela.fechar(); setTimeout(pintarFila, 600); } });
  janela('Envios desta OS', html + (grupos.length ? '<p class="muted" style="margin-top:10px">Parado = o servidor recusou. Corrija o dado na tela e tente de novo. As fotos continuam no aparelho.</p>' : ''), bts);
}
N.fila.aoMudar(ev => {
  pintarFila();
  if (ev && ev.situacao === 'recusado') U.toast('Um envio foi recusado: ' + (ev.erro || ''), 'err');
});

// ── conexão ────────────────────────────────────────────────────────────────
function pintarSinal(){
  const on = navigator.onLine !== false;
  $('dot').className = 'dot ' + (DEMO ? '' : on ? 'ok' : 'off');
  $('stx').textContent = DEMO ? 'demo' : on ? 'online' : 'sem sinal';
}
window.addEventListener('online', () => { pintarSinal(); baixar(true); });
window.addEventListener('offline', pintarSinal);

// ── o pacote ───────────────────────────────────────────────────────────────
let baixando = false;
async function baixar(silencioso){
  if (DEMO || baixando || navigator.onLine === false || !OS) return;
  baixando = true;
  try{
    const p = await N.api.rpc('tf_insp_pacote_os', { p_os_id: OS });
    mesclar(p);
    if (!silencioso) U.toast('Pacote da OS atualizado.');
    pintar();
  }catch(e){
    if (!E){ $('tela').innerHTML = '<div class="card vazio">' + esc(e.message || 'Não consegui baixar a OS.') + '</div>'; }
    else if (!silencioso) U.toast(e.message || 'Não consegui atualizar.', 'err');
  }finally{ baixando = false; }
}

// ── navegação ──────────────────────────────────────────────────────────────
function ir(t, substituir){
  telaAtual = t;
  try{ history[substituir ? 'replaceState' : 'pushState']({ t }, '', location.pathname + location.search + location.hash); }catch(e){}
  pintar(); $('tela').parentNode.scrollTop = 0;
}
window.addEventListener('popstate', ev => { telaAtual = (ev.state && ev.state.t) || { nome:'lista' }; pintar(); });
$('voltar').addEventListener('click', () => {
  if (telaAtual.nome === 'lista') location.href = '../';
  else history.back();
});

function titulo(t, s){ $('tTit').textContent = t; $('tSub').textContent = s || ''; }
function pintar(){
  pintarSinal(); pintarFila();
  if (!E){
    titulo('Inspeção', VERSAO);
    $('tela').innerHTML = '<div class="card vazio">' + (navigator.onLine === false
      ? 'Esta OS ainda não foi aberta neste aparelho. Abra uma vez com sinal: depois funciona sem.'
      : 'Baixando a OS…') + '</div>';
    return;
  }
  const v = telaAtual.vaso ? vaso(telaAtual.vaso) : null;
  if (telaAtual.nome !== 'lista' && !v){ telaAtual = { nome:'lista' }; }
  if (telaAtual.nome === 'lista') return telaLista();
  // S77: o vaso preparado pelo escritório (em preparo) mostra o cartão com as instruções até "Começar"
  if (telaAtual.nome === 'vaso') return (v.inspecao && v.inspecao.situacao !== 'em_preparo') ? telaPainel(v) : telaCartao(v);
  const f = { plaqueta:telaPlaqueta, operacao:telaOperacao, componentes:telaComponentes, localizacao:telaLocal, laudo:telaLaudo,
             visual:telaVisual, acessorios:telaAcessorios, ultrassom:telaUltrassom, boroscopia:telaBoroscopia, teste:telaTeste,
             fechamento:telaFechamento, previa:telaPrevia, afericao:telaAfericao }[telaAtual.nome];
  if (f) return f(v);
}

// ── estado das seções ──────────────────────────────────────────────────────
function fotosDe(v, secao, item){ return ((v.inspecao && v.inspecao.fotos) || []).filter(f => f.secao === secao && (item === undefined || f.item_ref === item)); }
const ativas = v => v.camaras.filter(c => c.ativo !== false);
const compsAtivos = v => v.componentes.filter(c => c.ativo !== false);
function estPlaqueta(v){
  const itens = [fotosDe(v, 'plaqueta').length > 0, !!(v.fabricante_id || v.fabricante), !!v.numero_serie, !!v.ano_fabricacao,
    !!(v.codigo_construcao || v.sem_codigo_construcao), ativas(v).length > 0 && ativas(v).every(c => c.pmta_plaqueta_mpa)];
  return est(itens);
}
function estOperacao(v){
  const cs = ativas(v);
  const itens = [!!v.posicao, cs.length > 0 && cs.every(c => c.fluido && c.classe_fluido),
    cs.length > 0 && cs.every(c => c.p_operacao_max_mpa != null), cs.length > 0 && cs.every(c => c.volume_m3 || c.volume_desconhecido)];
  return est(itens);
}
function estComp(v){ const cs = compsAtivos(v); return cs.length ? (cs.every(c => c.camara_id) ? 'ok' : 'inc') : 'vazia'; }
function estLocal(v){ return est([!!v.localizacao, v.latitude != null, fotosDe(v, 'localizacao').length > 0]); }
function estLaudo(v){
  const s = v.laudo_anterior && v.laudo_anterior.situacao;
  if (['em_conferencia','cliente_nao_tem','sem_laudo','conferido'].indexOf(s) >= 0) return 'ok';
  return fotosDe(v, 'laudo_anterior').length ? 'inc' : 'vazia';
}
function est(itens){ const n = itens.filter(Boolean).length; return n === 0 ? 'vazia' : n === itens.length ? 'ok' : 'inc'; }
const EST_ROT = { vazia:'vazia', inc:'incompleta', ok:'ok' };
function estados(v){ return [estPlaqueta(v), estOperacao(v), estComp(v), estLocal(v), estLaudo(v), estVisual(v), estAcess(v), estUltra(v), estBoro(v), estTeste(v), estFech(v)]; }
const N_SECOES = 11;
function secoesOk(v){ return estados(v).filter(x => x === 'ok').length; }
function alertas(v){
  const a = [];
  if (!fotosDe(v, 'plaqueta').length) a.push('Falta a foto da plaqueta.');
  ativas(v).forEach(c => {
    const nm = ativas(v).length > 1 ? ' (' + c.nome + ')' : '';
    if (!c.pmta_plaqueta_mpa) a.push('PMTA de plaqueta não informada' + nm + '.');
    if (!c.pmta_vigente_mpa && !(v.laudo_anterior && v.laudo_anterior.situacao === 'conferido')) a.push('PMTA vigente desconhecida' + nm + ': o laudo anterior ainda não foi conferido.');
    if (c.pressao_externa && !c.pmta_externa_plaqueta_mpa) a.push('Opera com vácuo, sem PMTA externa de plaqueta' + nm + '.');
  });
  if (v.latitude == null) a.push('Sem GPS do vaso.');
  return a;
}

// ── tela 0 · vasos da OS ───────────────────────────────────────────────────
let filtro = '';
function telaLista(){
  const os = E.os || {};
  titulo(/^OS/i.test(os.numero || '') ? os.numero : 'OS ' + (os.numero || ''), os.cliente || '');
  const com = E.vasos.filter(v => v.inspecao), sem = E.vasos.filter(v => !v.inspecao);
  const f = filtro.trim().toUpperCase();
  const casa = v => !f || String(v.tag || '').toUpperCase().indexOf(f) >= 0 || String(v.nome || '').toUpperCase().indexOf(f) >= 0;
  const linha = v => {
    const pend = pendDoVaso(v);
    const chips = [];
    if (v.inspecao){
      const sit = v.inspecao.situacao;
      chips.push(sit === 'em_campo' ? '<span class="chip ' + (secoesOk(v) === N_SECOES ? 'ok' : 'inc') + '">' + secoesOk(v) + ' de ' + N_SECOES + ' seções</span>'
        : v.inspecao.nao_inspecionado_motivo ? '<span class="chip inc">não inspecionado</span>'
        : sit === 'enviada' ? '<span class="chip ok">enviada</span>'
        : sit === 'em_preparo' ? '<span class="chip ok">preparado pelo escritório</span>'
        : '<span class="chip">' + esc(sit.replace('_', ' ')) + '</span>');
    }
    if (v.provisorio) chips.push('<span class="chip prov">provisório</span>');
    if (pend.length) chips.push('<span class="chip pend">' + pend.length + ' a enviar</span>');
    return '<button class="card vaso' + (v.inspecao ? '' : ' fora') + '" data-v="' + esc(v.id) + '"><div style="min-width:0">' +
      '<div class="tg">' + esc(v.tag) + '</div>' + (v.nome ? '<div class="nm">' + esc(v.nome) + '</div>' : '') +
      (chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + '</div><span class="dir">›</span></button>';
  };
  let h = '';
  if (E.vasos.length > 8) h += '<input class="t" id="busca" placeholder="Procurar pela TAG" value="' + esc(filtro) + '" style="margin-bottom:10px">';
  h += '<h2>Em inspeção nesta OS</h2>' + (com.filter(casa).map(linha).join('') || '<p class="muted" style="margin:0 2px 10px">Nenhum vaso começado ainda. Escolha um abaixo.</p>');
  h += '<h2>Vasos do cliente</h2>' + (sem.filter(casa).map(linha).join('') || '<p class="muted" style="margin:0 2px 10px">' + (f ? 'Nenhum vaso com essa TAG.' : 'Nenhum outro vaso cadastrado.') + '</p>');
  h += '<button class="btn sec" id="novoVaso">+ O vaso não está na lista</button>';
  h += '<p class="rodape">' + VERSAO + ' · pacote de ' + (E.baixado_em ? new Date(E.baixado_em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—') +
       (DEMO ? '' : ' · <a href="#" id="atual">atualizar</a>') + '</p>';
  $('tela').innerHTML = h;
  $('tela').querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => ir({ nome:'vaso', vaso:b.dataset.v })));
  $('novoVaso').addEventListener('click', novoVaso);
  const bu = $('busca'); if (bu) bu.addEventListener('input', () => { filtro = bu.value; const p = bu.selectionStart; telaLista(); const n = $('busca'); n.focus(); n.setSelectionRange(p, p); });
  const at = $('atual'); if (at) at.addEventListener('click', ev => { ev.preventDefault(); baixar(); });
}

function novoVaso(){
  janela('Vaso fora da lista',
    '<label class="f">TAG do vaso<small>Como está pintada no vaso ou na plaqueta.</small><input class="t" id="nvTag" autocapitalize="characters"></label>' +
    '<label class="f">Nome (opcional)<input class="t" id="nvNome" placeholder="Ex.: Reservatório de ar"></label>',
    [{ rotulo:'Cancelar' }, { rotulo:'Criar', classe:'pri', acao:() => {
      const tag = ($('nvTag').value || '').trim(), nome = ($('nvNome').value || '').trim();
      if (!tag){ U.toast('Informe a TAG.', 'err'); return false; }
      const ex = E.vasos.find(v => String(v.tag).trim().toUpperCase() === tag.toUpperCase());
      N.janela.fechar();
      if (ex){ U.toast('Esse vaso já está na lista.'); ir({ nome:'vaso', vaso:ex.id }); return; }
      const v = normVaso({ id:uid(), tag, nome:nome || null, provisorio:true, camaras:[], componentes:[], inspecao:null });
      E.vasos.push(v); salvar();
      // a mesma TAG criada por outro celular sem sinal: o banco devolve o vaso que existe e guarda o apelido
      enfileirar(v, 'prov-' + v.id, 'vaso provisório', { funcao:'tf_insp_vaso_provisorio',
        payload:{ p_cliente_id:E.os.cliente_id, p_tag:tag, p_nome:nome || null, p_id:v.id } }, null, true);
      comecar(v);
      ir({ nome:'vaso', vaso:v.id });
    } }]);
  setTimeout(() => { const i = $('nvTag'); if (i) i.focus(); }, 50);
}

// ── cartão do vaso (antes de começar) ──────────────────────────────────────
function linkMapa(v){ return v.latitude != null ? 'https://www.google.com/maps?q=' + v.latitude + ',' + v.longitude : null; }
function telaCartao(v){
  titulo(v.tag, v.nome || 'Vaso do cliente');
  const mapa = linkMapa(v);
  let h = '<div class="card">';
  h += '<div class="info"><b>' + esc(v.tag) + '</b>' + (v.nome ? ' · ' + esc(v.nome) : '') + '</div>';
  if (v.localizacao) h += '<p class="info" style="margin:8px 0 0">Local: ' + esc(v.localizacao) + '</p>';
  if (mapa) h += '<p style="margin:8px 0 0"><a href="' + mapa + '" target="_blank" rel="noopener">Como chegar (mapa)</a></p>';
  if (v.fabricante || v.numero_serie) h += '<p class="muted" style="margin:8px 0 0">' + esc([v.fabricante, v.numero_serie && 'nº ' + v.numero_serie, v.ano_fabricacao].filter(Boolean).join(' · ')) + '</p>';
  if (!v.localizacao && !mapa) h += '<p class="muted" style="margin:8px 0 0">Sem local nem GPS no cadastro ainda.</p>';
  h += '</div>';
  // S77 · o que o escritório deixou na preparação
  if (v.inspecao && v.inspecao.instrucoes_campo)
    h += '<div class="alerta" style="background:var(--accent-soft);color:var(--accent-ink)"><b>Instruções do escritório</b>' + esc(v.inspecao.instrucoes_campo) + '</div>';
  const la = v.laudo_anterior;
  if (la && la.situacao === 'conferido')
    h += '<div class="card"><b>Laudo anterior conferido</b><p class="info" style="margin:4px 0 0">' + esc([la.emissor, la.numero && 'nº ' + la.numero,
         la.data_laudo && la.data_laudo.split('-').reverse().join('/')].filter(Boolean).join(' · ')) + (la.pmta_mpa != null ? '<br>PMTA vigente: ' + fmt(la.pmta_mpa, 3) + ' MPa' : '') + '</p></div>';
  else if (la && la.situacao === 'pendente_cliente')
    h += '<div class="alerta"><b>Laudo anterior: pegar no cliente</b>Fotografe o laudo impresso na seção "Laudo anterior".</div>';
  h += '<button class="btn pri" id="comecar">Começar a inspeção deste vaso</button>';
  h += '<p class="muted" style="text-align:center;margin-top:8px">Funciona sem sinal. Tudo vai para o servidor quando houver conexão.</p>';
  $('tela').innerHTML = h;
  $('comecar').addEventListener('click', () => { comecar(v); pintar(); });
}

/** Abre a inspeção do vaso (id do celular) e monta o mínimo: a câmara única e
 *  costado + dois tampos. A ordem na fila é a de dependência. */
function comecar(v){
  if (v.inspecao && v.inspecao.situacao !== 'em_preparo') return;
  // S77: o vaso preparado pelo escritório já tem a inspeção (em preparo): o
  // celular usa o MESMO id, e o banco a passa para "em campo" com a equipe
  const iid = v.inspecao ? v.inspecao.id : uid();
  v.inspecao = Object.assign(v.inspecao || { fotos:[], tipo:'periodica' }, { id:iid, situacao:'em_campo', pode_editar:true });
  v.inspecao.fotos = v.inspecao.fotos || [];
  salvar();
  enfileirar(v, 'abrir-' + iid, 'abrir a inspeção', { funcao:'tf_insp_abrir',
    payload:{ p_os_id:E.os.id, p_equip:v.id, p_tipo:'periodica', p_os_item_id:null, p_id:iid, p_motivo_extraordinaria:null } }, null, true);
  if (!ativas(v).length){
    const c = { id:uid(), tipo:'unica', nome:'Única', ordem:1, ativo:true, volume_desconhecido:false, pressao_externa:false };
    v.camaras.push(c); gravarCamara(v, c);
  }
  if (!compsAtivos(v).length){
    const cam = ativas(v)[0].id, hz = v.posicao === 'horizontal';
    [['costado','Costado',null], ['eliptico', hz ? 'Tampo esquerdo' : 'Tampo superior', hz ? 'esquerdo' : 'superior'],
     ['eliptico', hz ? 'Tampo direito' : 'Tampo inferior', hz ? 'direito' : 'inferior']].forEach((x, i) => {
      const c = { id:uid(), tipo:x[0], nome:x[1], posicao:x[2], camara_id:cam, nao_medir:false, ordem:i + 1, ativo:true };
      v.componentes.push(c); gravarComp(v, c);
    });
  }
  salvar();
}

// ── tela 1 · painel do vaso ────────────────────────────────────────────────
function telaPainel(v){
  titulo(v.tag, (v.nome || '') + (v.provisorio ? ' · provisório' : ''));
  const ed = v.inspecao.pode_editar !== false && v.inspecao.situacao === 'em_campo';
  const al = alertas(v);
  let h = '';
  if (!ed) h += '<div class="alerta"><b>' + (v.inspecao.nao_inspecionado_motivo ? 'Vaso não inspecionado' : 'Inspeção ' + esc(String(v.inspecao.situacao).replace('_', ' '))) + '</b>' +
    (v.inspecao.nao_inspecionado_motivo ? esc(v.inspecao.nao_inspecionado_motivo) + '<br>' : '') + 'O campo não grava mais neste vaso.</div>';
  if (v.inspecao.instrucoes_campo) h += '<div class="alerta" style="background:var(--accent-soft);color:var(--accent-ink)"><b>Instruções do escritório</b>' + esc(v.inspecao.instrucoes_campo) + '</div>';
  if (al.length && ed) h += '<div class="alerta"><b>Atenção</b><ul>' + al.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  const sec = (k, nome, sub, e) => '<button class="card secao" data-s="' + k + '"' + (ed ? '' : ' disabled') + '><span class="sn">' + nome +
    (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span><span class="est ' + e + '">' + EST_ROT[e] + '</span></button>';
  const cs = ativas(v);
  h += sec('plaqueta', 'Plaqueta', 'Foto, fabricante, série, ano, código, PMTA e PTH', estPlaqueta(v));
  h += sec('operacao', 'Operação e câmaras', cs.length + (cs.length === 1 ? ' câmara' : ' câmaras') + ': fluido, classe, pressão, volume', estOperacao(v));
  h += sec('componentes', 'Componentes', compsAtivos(v).length + ' na lista', estComp(v));
  h += sec('localizacao', 'Localização', 'Local, GPS e fotos do vaso', estLocal(v));
  const la = v.laudo_anterior && v.laudo_anterior.situacao;
  h += sec('laudo', 'Laudo anterior', la === 'conferido' ? 'Já conferido pelo escritório' : la === 'cliente_nao_tem' ? 'O cliente não tem' :
    la === 'sem_laudo' ? 'O vaso nunca teve laudo' : la === 'em_conferencia' ? 'Coletado, aguardando a conferência' : 'Fotos do laudo impresso, PDF ou "o cliente não tem"', estLaudo(v));
  // S79 · R03a
  const vis = v.inspecao.visual || [], nc = vis.filter(x => x.conforme === false).length;
  h += sec('visual', 'Exame visual', nc ? nc + ' não conforme' + (nc > 1 ? 's' : '') : 'Costado, tampos, conexões, base e aterramento', estVisual(v));
  const acs = acessDe(v);
  h += sec('acessorios', 'Acessórios', acs.length ? acs.length + ' na lista' : 'Válvulas, manômetros e outros, com lacre e foto', estAcess(v));
  const nMed = compsAtivos(v).filter(c => !c.nao_medir).length, nLid = compsAtivos(v).filter(c => !c.nao_medir && leiturasDe(v, c.id).length).length;

// ── campos ─────────────────────────────────────────────────────────────────
function campoTexto(rot, id, valor, extra){
  return '<label class="f">' + rot + '<input class="t" id="' + id + '" value="' + esc(valor == null ? '' : valor) + '" ' + (extra || '') + '></label>';
}
function campoNum(rot, id, valor, ajuda, extra){
  return '<label class="f">' + rot + (ajuda ? '<small>' + ajuda + '</small>' : '') +
    '<input class="t" id="' + id + '" inputmode="decimal" value="' + esc(valor == null ? '' : fmt(valor)) + '" ' + (extra || '') + '></label>';
}
function ligar(id, fn, ev){ const el = $(id); if (el) el.addEventListener(ev || 'change', () => fn(el)); return el; }
function numOuAviso(el, min, max, rot){
  const v = num(el.value);
  if (Number.isNaN(v)){ U.toast(rot + ': número inválido.', 'err'); el.focus(); return undefined; }
  if (v != null && ((min != null && v < min) || (max != null && v > max))){ U.toast(rot + ': fora do esperado (' + min + ' a ' + max + ').', 'err'); el.focus(); return undefined; }
  return v;
}
function unidadeDe(v){ const c = ativas(v)[0]; return (c && c.unidade_campo) || v._unid || 'bar'; }
function campoPressao(rot, id, mpa, u, ajuda){
  const val = mpa == null ? '' : fmt(deMPa(mpa, u), 4);
  return '<label class="f">' + rot + ' (' + UNID_ROT[u] + ')' + (ajuda ? '<small>' + ajuda + '</small>' : '') +
    '<input class="t" id="' + id + '" inputmode="decimal" value="' + esc(val) + '"></label><div class="conv" id="' + id + '_c">' +
    (mpa != null && u !== 'MPa' ? '= ' + fmt(mpa, 4) + ' MPa' : '') + '</div>';
}
function ligarPressao(id, u, fn, max){
  const el = $(id); if (!el) return;
  el.addEventListener('input', () => { const x = num(el.value); $(id + '_c').textContent = (x != null && !Number.isNaN(x) && u !== 'MPa') ? '= ' + fmt(paraMPa(x, u), 4) + ' MPa' : ''; });
  el.addEventListener('change', () => {
    const x = num(el.value);
    if (Number.isNaN(x)){ U.toast('Pressão: número inválido.', 'err'); return; }
    const m = paraMPa(x, u);
    if (m != null && (m <= -0.1013 || m >= (max || 100))){ U.toast('Pressão fora do esperado: confira a unidade.', 'err'); return; }
    fn(m);
  });
}

// ── fotos ──────────────────────────────────────────────────────────────────
let alvoFoto = null;
function chaveAdd(secao, item){ return secao + (item != null ? '|' + item : ''); }
function gradeFotos(v, secao, max, rotulos, item){
  const fs = fotosDe(v, secao, item == null ? undefined : item).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const pend = new Set(pendDoVaso(v).filter(e => e.id.indexOf('foto~') === 0).map(e => e.id.slice(5)));
  let h = '<div class="fotos">';
  fs.forEach(f => {
    const src = MINI[f.id];
    h += '<div class="foto" data-f="' + esc(f.id) + '">' + (src ? '<img alt="" src="' + src + '">' : (/\.pdf$/i.test(f.storage_path || '') ? 'PDF' : 'foto enviada')) +
      (f.legenda ? '<span class="leg">' + esc(f.legenda) + '</span>' : '') +
      (pend.has(f.id) ? '<span class="pend">a enviar</span>' : '') +
      '<button class="x" data-rm="' + esc(f.id) + '" aria-label="Tirar a foto">×</button></div>';
  });
  if (!max || fs.length < max) h += '<div class="foto add" data-add="' + esc(chaveAdd(secao, item)) + '">+ foto' + (rotulos ? '' : '') + '</div>';
  return h + '</div>';
}
function ligarFotos(v, secao, legendaFn, item){
  const k = chaveAdd(secao, item);
  $('tela').querySelectorAll('[data-add]').forEach(b => { if (b.dataset.add === k) b.addEventListener('click', () => tirarFoto(v, secao, legendaFn ? legendaFn() : null, item)); });
  $('tela').querySelectorAll('[data-rm]').forEach(b => { if (b.dataset.lig) return; b.dataset.lig = '1'; b.addEventListener('click', ev => { ev.stopPropagation(); tirarFotoDaLista(v, b.dataset.rm); }); });
  carregarMinis(v);
}
function tirarFoto(v, secao, legenda, item){
  alvoFoto = { v:v.id, secao, legenda, item:item == null ? null : item };
  const a = $('arqFoto'); a.value = ''; a.click();
}
$('arqFoto').addEventListener('change', async () => {
  const arq = $('arqFoto').files && $('arqFoto').files[0];
  if (!arq || !alvoFoto) return;
  const v = vaso(alvoFoto.v); if (!v || !v.inspecao) return;
  try{
    const blob = await N.foto.reduzir(arq, { lado:1600, qualidade:0.85 });   // decisão 12
    const mini = await miniatura(blob);
    await registrarArquivo(v, alvoFoto.secao, alvoFoto.legenda, blob, 'jpg', 'image/jpeg', mini, alvoFoto.item);
  }catch(e){ U.toast(e.message || 'Não consegui usar a foto.', 'err'); }
  alvoFoto = null;
});
$('arqPdf').addEventListener('change', async () => {
  const arq = $('arqPdf').files && $('arqPdf').files[0];
  if (!arq || !alvoFoto) return;
  const v = vaso(alvoFoto.v); if (!v) return;
  if (arq.size > 5242880){ U.toast('PDF acima de 5 MB. Fotografe as páginas.', 'err'); return; }
  await registrarArquivo(v, 'laudo_anterior', 'PDF do laudo', arq, 'pdf', 'application/pdf', null);
  laudoColetado(v, 'pdf');
  alvoFoto = null; pintar();
});
function miniatura(blob){
  return new Promise(ok => {
    const img = new Image(), u = URL.createObjectURL(blob);
    img.onload = () => {
      const l = 220, r = Math.min(1, l / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(u); ok(null); };
    img.src = u;
  });
}
async function registrarArquivo(v, secao, legenda, blob, ext, tipo, mini, item){
  const fid = uid(), caminho = v.inspecao.id + '/' + fid + '.' + ext;
  const chave = await N.fila.guardarFoto(blob);
  const ordem = fotosDe(v, secao).length + 1;
  item = item == null ? null : String(item);
  v.inspecao.fotos.push({ id:fid, secao, legenda, ordem, storage_path:caminho, item_ref:item });
  if (mini){ MINI[fid] = mini; salvarMini(); }
  salvar();
  enfileirar(v, 'foto~' + fid, (secao === 'laudo_anterior' ? 'laudo anterior' : 'foto de ' + secao), {
    funcao:'tf_insp_foto_registrar',
    payload:{ p_id:fid, p_dados:{ inspecao_id:v.inspecao.id, storage_path:caminho, secao, legenda:legenda || null, ordem, bytes:blob.size, item_ref:item } }
  }, [{ chave, bucket:'inspecoes', caminho, tipo }], true);
  pintar();
}
function tirarFotoDaLista(v, fid){
  N.janela.confirmar('Tirar esta foto?', '<p>Ela sai da inspeção.</p>', 'Tirar', true).then(sim => {
    if (!sim) return;
    const ainda = N.fila.listar({ tipo:'insp', grupo:'insp|' + v.id }).find(e => e.id === 'foto~' + fid);
    if (ainda) N.fila.descartar(ainda.assinatura);       // nem chegou a subir
    else enfileirar(v, 'fotorem-' + fid, 'tirar foto', { funcao:'tf_insp_foto_remover', payload:{ p_id:fid } }, null, true);
    v.inspecao.fotos = v.inspecao.fotos.filter(f => f.id !== fid);
    delete MINI[fid]; salvarMini(); salvar(); pintar();
  });
}
/** Foto que já está no servidor e não tem miniatura aqui: baixa com o login. */
const carregando = {};
function carregarMinis(v){
  if (DEMO || navigator.onLine === false) return;
  const s = N.sessao();
  ((v.inspecao && v.inspecao.fotos) || []).forEach(f => {
    if (MINI[f.id] || carregando[f.id] || !f.storage_path || /\.pdf$/i.test(f.storage_path)) return;
    carregando[f.id] = true;
    fetch(SUPA_URL + '/storage/v1/object/authenticated/inspecoes/' + f.storage_path.split('/').map(encodeURIComponent).join('/'),
      { headers:{ apikey:SUPA_ANON, Authorization:'Bearer ' + s.token } })
      .then(r => r.ok ? r.blob() : null).then(b => b && miniatura(b)).then(m => {
        if (m){ MINI[f.id] = m; salvarMini(); const el = document.querySelector('[data-f="' + f.id + '"]');
          if (el && !el.querySelector('img')){ el.insertAdjacentHTML('afterbegin', '<img alt="" src="' + m + '">'); } }
      }).catch(() => {});
  });
}

// S80 · R03b · a geometria de cada componente. Em branco vale o padrão da
// memória de cálculo (pendência 2, a validar pelo Fernando):
//   R = circunferência ÷ 2π (raio EXTERNO: conservador) · torisférico L = D ·
//   hemisférico L = R · tampo plano d = D, C = 0,33 · janela C = 0,33 ·
//   E = 0,70 no costado e no cone, 1,0 nos tampos (o inspetor escolhe).
const GEO_CAMPOS = { costado:['R'], eliptico:['R'], conico:['R','alfaGraus'], torisferico:['L'], hemisferico:['L'], plano:['d','C'], janela:['d','C'] };
const GEO_COL = { R:'r_mm', L:'l_mm', d:'d_mm', C:'fator_c', alfaGraus:'alfa_graus', E:'eficiencia_junta' };
const GEO_ROT = { R:'R · raio (mm)', L:'L · raio da coroa (mm)', d:'d · diâmetro (mm)', C:'C · fator', alfaGraus:'α · semiângulo (°)' };
function geoPadrao(v, c){
  const rx = v.circunferencia_mm > 0 ? v.circunferencia_mm / (2 * Math.PI) : null;
  const p = { E: (c.tipo === 'costado' || c.tipo === 'conico') ? 0.7 : 1 };
  if (rx){
    if (['costado','eliptico','conico'].indexOf(c.tipo) >= 0) p.R = rx;
    if (c.tipo === 'torisferico') p.L = 2 * rx;
    if (c.tipo === 'hemisferico') p.L = rx;
    if (c.tipo === 'plano') p.d = 2 * rx;
  }
  if (c.tipo === 'plano' || c.tipo === 'janela') p.C = 0.33;
  return p;
}
/** A geometria que o motor usa: o informado ou o padrão. `padrao` lista o que veio do padrão. */
function geoDe(v, c){
  const p = geoPadrao(v, c), g = { tipo:c.tipo, nome:c.nome, id:c.id, aparafusada:c.aparafusada === true, padrao:[] };
  (GEO_CAMPOS[c.tipo] || []).concat(['E']).forEach(k => {
    const x = c[GEO_COL[k]];
    if (x != null && x !== '') g[k] = Number(x);
    else if (p[k] != null){ g[k] = p[k]; g.padrao.push(k); }
  });
  return g;
}
function campoGeo(v, c){
  const p = geoPadrao(v, c), id = esc(c.id);
  const e = c.eficiencia_junta;
  let h = '<div class="lin">';
  h += '<label class="f">E · eficiência da junta<select class="t" data-geo="' + id + '" data-g="E"><option value="">padrão (' + fmt(p.E, 2) + ')</option>' +
    [1, 0.85, 0.7].map(x => '<option value="' + x + '"' + (e != null && Number(e) === x ? ' selected' : '') + '>' + fmt(x, 2) + '</option>').join('') + '</select></label>';
  (GEO_CAMPOS[c.tipo] || []).forEach((k, n) => {
    if (n && n % 2 === 1) h += '</div><div class="lin">';
    const val = c[GEO_COL[k]];
    h += '<label class="f">' + GEO_ROT[k] + '<input class="t" inputmode="decimal" data-geo="' + id + '" data-g="' + k + '" value="' + esc(val == null ? '' : fmt(val, 3)) +
      '" placeholder="' + (p[k] != null ? 'padrão ' + fmt(p[k], k === 'C' ? 2 : 1) : (k === 'd' && c.tipo === 'janela' ? 'medir' : '—')) + '"></label>';
  });
  h += '</div>';
  if (c.tipo === 'janela') h += '<div class="chk"><input type="checkbox" id="ap_' + id + '"' + (c.aparafusada ? ' checked' : '') + '><label for="ap_' + id + '">Tampa aparafusada</label></div>';
  if (c.tipo === 'conico' && !(c.alfa_graus > 0)) h += '<div class="conv" style="color:var(--warn)">O cone precisa do semiângulo α (até 30°).</div>';
  return h;
}
function ligarGeo(v){
  const lim = { R:[1, 20000], L:[1, 40000], d:[1, 40000], C:[0.1, 1], alfaGraus:[0.1, 30] };
  $('tela').querySelectorAll('[data-geo]').forEach(el => el.addEventListener('change', () => {
    const c = v.componentes.find(x => x.id === el.dataset.geo); if (!c) return;
    const k = el.dataset.g;
    if (k === 'E'){ mudouComp(v, c, 'eficiencia_junta', el.value ? Number(el.value) : null); return; }
    const x = numOuAviso(el, lim[k][0], lim[k][1], GEO_ROT[k].split(' ·')[0]);
    if (x !== undefined) mudouComp(v, c, GEO_COL[k], x);
  }));
  compsAtivos(v).forEach(c => ligar('ap_' + c.id, el => mudouComp(v, c, 'aparafusada', el.checked)));
}

  $('tela').innerHTML = h;
  $('tela').querySelectorAll('[data-cp]').forEach(el => el.addEventListener('change', () => {

  titulo(vv ? 'Teste da válvula' : 'Aferição do manômetro', v.tag + ' · ' + nomeAc(a));
  const r = resultadoAf(v, a, af);
  let h = '<div class="card"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">' + (af.codigo ? esc(af.codigo) : 'Número ao enviar') + '</b>' + chipAf(r.resultado) + '</div>'
    + '<p class="muted" style="margin:4px 0 0">PR-ENG-001 · ' + (vv ? 'desmontada até onde a construção permite, inspecionada, limpa e testada' : '3 cargas e 3 descargas por ponto') + '</p></div>';
  h += '<div class="card"><label class="f">Manômetro padrão<select class="t" id="afPad"><option value="">—</option>' + (E.padroes || []).map(p => '<option value="' + esc(p.id) + '"' + (p.id === af.padrao_id ? ' selected' : '') + '>'
      + esc((p.descricao || 'Padrão') + (p.numero_serie ? ' · ' + p.numero_serie : '') + (p.validade ? ' · até ' + String(p.validade).slice(5, 7) + '/' + String(p.validade).slice(0, 4) : '')) + '</option>').join('') + '</select></label>'
    + ((E.padroes || []).length ? '' : '<p class="alerta">Nenhum padrão com certificado válido no pacote. O escritório cadastra em TapDoc › Instrumentos.</p>')
    + '<label class="f">Bancada<select class="t" id="afBan"><option value="">—</option>' + (E.bancadas || []).map(p => '<option value="' + esc(p.id) + '"' + (p.id === af.bancada_id ? ' selected' : '') + '>'
      + esc((p.descricao || 'Bancada') + (p.numero_serie ? ' · ' + p.numero_serie : '')) + '</option>').join('') + '</select></label>'
    + '<label class="f">Unidade<select class="t" id="afUn">' + UN_AF.map(u => '<option value="' + u + '"' + (u === un ? ' selected' : '') + '>' + UN_AF_ROT[u] + '</option>').join('') + '</select></label></div>';
  if (vv){
    const L = af.leituras || (af.leituras = { aberturas:[null, null, null], assentamento:null });
    h += '<div class="card">' + campoNum('Pressão de ajuste (' + UN_AF_ROT[un] + ')', 'afAj', af.ajuste, 'Da plaqueta da válvula ou do lacre anterior')
      + '<div class="lin">' + [0, 1, 2].map(k => campoNum('Abertura ' + (k + 1), 'afAb' + k, L.aberturas[k])).join('') + '</div>'
      + campoNum('Assentamento (' + UN_AF_ROT[un] + ')', 'afAs', L.assentamento) + '</div>';
  } else {
    const L = af.leituras || (af.leituras = { pontos:[] });
    h += '<div class="card"><div class="lin">' + campoNum('Faixa: início', 'afIni', af.faixa_ini) + campoNum('Faixa: fim', 'afFim', af.faixa_fim) + '</div>'
      + campoNum('Resolução de leitura (' + UN_AF_ROT[un] + ')', 'afRes', af.resolucao, 'O que dá para ler; por exemplo, meia divisão')
      + '<label class="f">Pontos (os números do mostrador)<small>Separe por espaço. Mínimo de 3 além do zero, um acima de 75% da faixa.</small><input class="t" id="afPts" value="' + esc(L.pontos.map(p => fmt(p.nominal)).join(' ')) + '"></label>'
      + '<button class="btn sec" id="afSug">Sugerir 5 pontos</button></div>';
    L.pontos.forEach((p, k) => {
      const rp = (r.pontos || []).find(x => x.nominal === Number(p.nominal));
      h += '<div class="card"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">Ponto ' + esc(fmt(p.nominal)) + ' ' + UN_AF_ROT[un] + '</b>'
        + (rp && rp.ok !== undefined ? (rp.ok ? '<span class="chip ok">ok</span>' : '<span class="chip pend">fora</span>') : '') + '</div>'
        + '<table class="comp" style="width:100%"><tr><th></th><th>Padrão</th><th>Indicado</th></tr>'
        + [0, 1, 2, 3, 4, 5].map(n => { const l = (p.leituras || [])[n] || {}; return '<tr><td>' + (n < 3 ? 'carga ' + (n + 1) : 'descarga ' + (n - 2)) + '</td>'
          + '<td><input class="t" inputmode="decimal" data-pp="' + k + '" data-n="' + n + '" data-c="padrao" value="' + esc(l.padrao == null ? fmt(p.nominal) : fmt(l.padrao)) + '"></td>'
          + '<td><input class="t" inputmode="decimal" data-pp="' + k + '" data-n="' + n + '" data-c="indicado" value="' + esc(l.indicado == null ? '' : fmt(l.indicado)) + '"></td></tr>'; }).join('')
        + '</table>' + (rp && rp.erroMedio !== undefined ? '<p class="muted" style="margin:6px 0 0">Erro médio ' + fmt(rp.erroMedio, 3) + ' · tolerância ±' + fmt(rp.tol, 3) + ' · U ' + fmt(rp.U, 3) + '</p>' : '') + '</div>';
    });
  }
  h += '<div class="card"><div class="lin">' + campoTexto('Lacre retirado', 'afLr', af.lacre_retirado, 'inputmode="numeric"') + campoTexto('Lacre colocado', 'afLc', af.lacre_colocado, 'inputmode="numeric"') + '</div>'
    + (vv ? '' : campoNum('Validade do relatório (meses)', 'afVal', af.validade_meses == null ? 24 : af.validade_meses, 'Padrão: 24 meses (2 anos)')) + '</div>';
  h += '<div class="card" id="afResultado"><b>Resultado</b>' + (r.faltas.length ? '<ul>' + r.faltas.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '')
    + (r.avisos.length ? '<div class="alerta" style="margin-top:6px"><ul>' + r.avisos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '')
    + (r.completo ? '<p class="info" style="margin:6px 0 0">' + (vv ? (r.aprovadaOk ? 'Aprovada.' : 'Reprovada.') : (r.aprovadaOk ? 'Aprovado.' : 'Reprovado: o acessório vai para "substituir".')) + '</p>' : '') + '</div>';
  $('tela').innerHTML = h;
  if (!pode){ $('tela').querySelectorAll('input,select,button').forEach(el => { el.disabled = true; }); return; }
  const mudou = (repinta) => {
    salvar(); adiarAf('af:' + af.id, v, af);
    const rr = resultadoAf(v, a, af);
    if (rr.resultado === 'reprovado' && (a.situacao || 'ok') === 'ok'){ a.situacao = 'substituir'; salvar(); gravarAcess(v, a); }
    if (repinta) pintar();
  };
  const n = x => { const y = num(x); return y == null || Number.isNaN(y) ? null : y; };
  ligar('afPad', el => { af.padrao_id = el.value || null; LS.set('tfdoc_af_pad', af.padrao_id); mudou(true); });
  ligar('afBan', el => { af.bancada_id = el.value || null; LS.set('tfdoc_af_ban', af.bancada_id); mudou(true); });
  ligar('afUn', el => { af.unidade = el.value; mudou(true); });
  ligar('afLr', el => { af.lacre_retirado = el.value.trim() || null; mudou(false); });
  ligar('afLc', el => { af.lacre_colocado = el.value.trim() || null; mudou(true); });
  ligar('afVal', el => { const x = n(el.value); if (x == null || x < 1 || x > 120){ U.toast('Validade de 1 a 120 meses.', 'err'); el.value = af.validade_meses; return; } af.validade_meses = Math.round(x); mudou(false); });
  if (vv){
    ligar('afAj', el => { af.ajuste = n(el.value); mudou(true); });
    [0, 1, 2].forEach(k => ligar('afAb' + k, el => { af.leituras.aberturas[k] = n(el.value); mudou(true); }));
    ligar('afAs', el => { af.leituras.assentamento = n(el.value); mudou(true); });
  } else {
    ligar('afIni', el => { af.faixa_ini = n(el.value); mudou(true); });
    ligar('afFim', el => { af.faixa_fim = n(el.value); mudou(true); });
    ligar('afRes', el => { af.resolucao = n(el.value); mudou(true); });
    const pts = lista => {
      const velhos = af.leituras.pontos || [];
      af.leituras.pontos = lista.map(x => velhos.find(p => Number(p.nominal) === x) || { nominal:x, leituras:[] });
      mudou(true);
    };
    ligar('afPts', el => { const l = el.value.split(/[\s;]+/).map(n).filter(x => x != null); pts([...new Set(l)].sort((p, q) => p - q)); });
    ligar('afSug', () => { if (!(af.faixa_fim > (af.faixa_ini || 0))){ U.toast('Informe a faixa primeiro.', 'err'); return; } pts(sugerirPontos(af.faixa_ini || 0, af.faixa_fim)); }, 'click');
    $('tela').querySelectorAll('[data-pp]').forEach(el => el.addEventListener('change', () => {
      const p = af.leituras.pontos[Number(el.dataset.pp)], k = Number(el.dataset.n);
      p.leituras = p.leituras || [];
      for (let j = 0; j < 6; j++) if (!p.leituras[j]) p.leituras[j] = { sentido:j < 3 ? 'carga' : 'descarga', padrao:Number(p.nominal), indicado:null };
      p.leituras[k][el.dataset.c] = n(el.value);
      mudou(true);
    }));
  }
}

function novoAcess(v, base){
  const a = Object.assign({ tipo:'valvula_seguranca', situacao:null, camara_id:ativas(v).length === 1 ? ativas(v)[0].id : null, unidade_campo:unidadeDe(v) }, base || {},
    { id:uid(), ordem:acessDe(v).length + 1 });
  v.inspecao.acessorios = acessDe(v).concat([a]); salvar(); gravarAcess(v, a);
  return a;
}
function telaAcessorios(v){
  titulo('Acessórios', v.tag);
  const i = v.inspecao, pode = ed(v), l = acessDe(v), cs = ativas(v);

  let h = '';

  if (av.length) h += '<div class="alerta"><b>Atenção</b><ul>' + av.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  if (pode && ant.length && !l.length)
    h += '<div class="card"><b>Da inspeção anterior</b><p class="muted" style="margin:2px 0 0">' + ant.length + ' acessório(s): ' +
      esc(ant.map(x => TIPOS_ACESS[x.tipo] + (x.lacre_num ? ' (lacre ' + x.lacre_num + ')' : '')).join(', ')) +
      '. Traga e confirme um por um.</p><button class="btn pri" id="acAnt">Trazer os da inspeção anterior</button></div>';
  l.forEach(a => {
    const u = a.unidade_campo || unidadeDe(v);
    h += '<div class="card" data-ac="' + esc(a.id) + '"><div style="display:flex;gap:8px;align-items:center"><b style="flex:1">' + esc(TIPOS_ACESS[a.tipo] || a.tipo) +
      (a.origem_id ? ' <span class="chip">da anterior</span>' : '') + '</b>' +
      (pode && !a.origem_id ? '<button class="btn peq perigo" data-acrm="' + esc(a.id) + '">Tirar</button>' : '') + '</div>';
    h += '<label class="f">Tipo<select class="t" data-k="tipo">' + Object.keys(TIPOS_ACESS).map(t => '<option value="' + t + '"' + (t === a.tipo ? ' selected' : '') + '>' + TIPOS_ACESS[t] + '</option>').join('') + '</select></label>';
    h += '<label class="f">Situação<div class="seg sit" data-sit>' + Object.keys(SIT_ACESS).map(s => '<button data-s="' + s + '" class="' + (a.situacao === s ? 'on' : '') + '">' + SIT_ACESS[s] + '</button>').join('') + '</div></label>';
    if (a.situacao !== 'retirado' && a.situacao !== 'ausente'){
      h += '<div class="lin">' + campoTexto('TAG', 'ac_tag_' + a.id, a.tag, 'data-k="tag"') + campoTexto('Lacre', 'ac_lac_' + a.id, a.lacre_num, 'data-k="lacre_num" inputmode="numeric"') + '</div>';
      h += '<div class="lin">' + campoTexto('Marca', 'ac_mar_' + a.id, a.marca, 'data-k="marca"') + campoTexto('Modelo', 'ac_mod_' + a.id, a.modelo, 'data-k="modelo"') + '</div>';
      h += '<label class="f">Conexão<select class="t" data-k="conexao"><option value="">—</option>' + BITOLAS.map(b => '<option' + (b === a.conexao ? ' selected' : '') + '>' + esc(b) + '</option>').join('') +
        (a.conexao && BITOLAS.indexOf(a.conexao) < 0 ? '<option selected>' + esc(a.conexao) + '</option>' : '') + '<option value="+">Outra…</option></select></label>';
      if (VALVULAS.includes(a.tipo)) h += campoPressao('Pressão de ajuste', 'ac_p_' + a.id, a.pressao_ajuste_mpa, u, 'Como está na válvula ou no certificado');
      if (MEDIDORES.includes(a.tipo)) h += campoTexto('Escala', 'ac_esc_' + a.id, a.escala, 'data-k="escala" placeholder="Ex.: 0 a 16 bar"');
      if (cs.length > 1) h += '<label class="f">Câmara<select class="t" data-k="camara_id"><option value="">—</option>' +
        cs.map(c => '<option value="' + esc(c.id) + '"' + (c.id === a.camara_id ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('') + '</select></label>';
      if (AFERIVEIS.includes(a.tipo)) h += blocoAfericao(v, a, pode);
      h += '<p style="margin:12px 0 0;font-size:13px;font-weight:600;color:var(--ink-2)">Foto do item</p>' + gradeFotos(v, 'acessorios', 3, null, a.id);
    }
    h += '</div>';
  });
  if (pode) h += '<button class="btn sec" id="acMais">+ acessório</button>';
  h += '<div class="card"><div class="chk" style="margin-top:0"><input type="checkbox" id="acConf"' + (i.acessorios_conferidos ? ' checked' : '') + (pode ? '' : ' disabled') +
    '><label for="acConf">Conferi: a lista está completa' + (l.length ? '' : ' (o vaso não tem acessório)') + '</label></div></div>';
  $('tela').innerHTML = h;
  l.forEach(a => ligarFotos(v, 'acessorios', () => TIPOS_ACESS[a.tipo] + (a.lacre_num ? ' · lacre ' + a.lacre_num : ''), a.id));
  if (!pode){ $('tela').querySelectorAll('input,select,button').forEach(el => { el.disabled = true; }); somenteLeitura(); return; }
  const mudou = (a, k, val) => { a[k] = val; salvar(); adiar2('acess:' + a.id, 'acess', v, a); };
  $('tela').querySelectorAll('[data-ac]').forEach(card => {
    const a = l.find(x => x.id === card.dataset.ac); if (!a) return;
    card.querySelectorAll('[data-k]').forEach(el => el.addEventListener('change', () => {
      const k = el.dataset.k;
      if (k === 'conexao' && el.value === '+'){
        janela('Conexão', '<label class="f">Bitola<input class="t" id="acBit"></label>', [{ rotulo:'Cancelar', acao:() => pintar() }, { rotulo:'Usar', classe:'pri', acao:() => {
          const b = ($('acBit').value || '').trim(); if (!b){ U.toast('Escreva a bitola.', 'err'); return false; } mudou(a, 'conexao', b); N.janela.fechar(); pintar(); } }]);
        return;
      }
      mudou(a, k, (el.value || '').trim() || null);
      if (k === 'tipo') pintar();
    }));
    const seg = card.querySelector('[data-sit]');
    seg.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => { mudou(a, 'situacao', b.dataset.s); pintar(); }));
    ligarPressao('ac_p_' + a.id, a.unidade_campo || unidadeDe(v), m => { mudou(a, 'pressao_ajuste_mpa', m); pintar(); });
  });
  ligarBlocoAfericao(v, l, mudou);
  $('tela').querySelectorAll('[data-acrm]').forEach(b => b.addEventListener('click', () => {
    const a = l.find(x => x.id === b.dataset.acrm);
    if (a.origem_id){ U.toast('Este veio da inspeção anterior: se saiu do vaso, marque "retirado" (o laudo registra).', 'err'); return; }
    N.janela.confirmar('Tirar este acessório?', '<p>Use só para o que foi lançado por engano.</p>', 'Tirar', true).then(s => {
      if (!s) return;
      i.acessorios = l.filter(x => x.id !== a.id); salvar();
      enfileirar(v, 'acessrm-' + a.id, 'tirar acessório', { funcao:'tf_insp_acessorio_remover', payload:{ p_acessorio:a.id } }, null, true);
      pintar();
    });
  }));
  ligar('acAnt', () => {
    ant.forEach(x => novoAcess(v, { tipo:x.tipo, tag:x.tag, marca:x.marca, modelo:x.modelo, conexao:x.conexao, escala:x.escala,
      pressao_ajuste_mpa:x.pressao_ajuste_mpa, lacre_num:x.lacre_num, camara_id:x.camara_id, unidade_campo:x.unidade_campo || unidadeDe(v), origem_id:x.id }));
    pintar();
  }, 'click');
  ligar('acMais', () => {
    janela('Novo acessório', '<div class="seg" id="naT" style="flex-direction:column">' +
      Object.keys(TIPOS_ACESS).map(t => '<button data-t="' + t + '">' + TIPOS_ACESS[t] + '</button>').join('') + '</div>', [{ rotulo:'Cancelar' }]);
    document.querySelectorAll('#naT [data-t]').forEach(x => x.addEventListener('click', () => { novoAcess(v, { tipo:x.dataset.t }); N.janela.fechar(); pintar(); }));
  }, 'click');
  ligar('acConf', el => {
    i.acessorios_conferidos = el.checked; salvar();
    enfileirar(v, 'acconf', 'acessórios conferidos', { funcao:'tf_insp_acessorios_conferidos', payload:{ p_id:i.id, p_ok:el.checked } });
    pintar();
  });
}

// ── boroscopia ─────────────────────────────────────────────────────────────
function telaBoroscopia(v){
  titulo('Boroscopia', v.tag);
  const i = v.inspecao, pode = ed(v);
  const b = i.boroscopia || (i.boroscopia = { realizada:null });
  const motOutro = b.motivo_nao && MOTIVOS_BORO.indexOf(b.motivo_nao) < 0;
  let h = '<div class="card"><b>Foi feita a inspeção interna por boroscopia?</b><div class="seg" id="bR"><button data-r="1" class="' + (b.realizada === true ? 'on' : '') + '">Sim</button>' +
    '<button data-r="0" class="' + (b.realizada === false ? 'on' : '') + '">Não</button></div>';
  if (b.realizada === true){
    h += '<label class="f">Resultado<div class="seg" id="bRes"><button data-x="sem_anomalia" class="' + (b.resultado === 'sem_anomalia' ? 'on' : '') + '">Sem anomalia</button>' +
      '<button data-x="com_anomalia" class="' + (b.resultado === 'com_anomalia' ? 'on' : '') + '">Com anomalia</button></div></label>';
    if (b.resultado === 'com_anomalia') h += '<label class="f">O que foi encontrado<textarea class="t" id="bAn">' + esc(b.anomalia || '') + '</textarea></label>';
    h += '<p style="margin:12px 0 0;font-size:13px;font-weight:600;color:var(--ink-2)">Fotos' + (b.resultado === 'com_anomalia' ? ' (obrigatória)' : '') + '</p>' + gradeFotos(v, 'boroscopia', 4);
  } else if (b.realizada === false){
    h += '<label class="f">Motivo<select class="t" id="bMot"><option value="">—</option>' + MOTIVOS_BORO.map(m => '<option' + (m === b.motivo_nao ? ' selected' : '') + '>' + esc(m) + '</option>').join('') +
      '<option value="+"' + (motOutro || b._outro ? ' selected' : '') + '>Outro…</option></select></label>';
    if (motOutro || b._outro) h += '<label class="f">Qual<textarea class="t" id="bMotTx">' + esc(motOutro ? b.motivo_nao : '') + '</textarea></label>';
  }
  h += '</div>';
  $('tela').innerHTML = h;
  ligarFotos(v, 'boroscopia', () => 'Boroscopia');
  if (!pode){ $('tela').querySelectorAll('input,select,button,textarea').forEach(el => { el.disabled = true; }); somenteLeitura(); return; }
  const mudou = () => { salvar(); adiar2('boro:' + v.id, 'boro', v); };
  $('bR').querySelectorAll('[data-r]').forEach(x => x.addEventListener('click', () => {
    b.realizada = x.dataset.r === '1'; b.resultado = null; b.anomalia = null; b.motivo_nao = null; b._outro = false; mudou(); pintar();
  }));
  const res = $('bRes'); if (res) res.querySelectorAll('[data-x]').forEach(x => x.addEventListener('click', () => { b.resultado = x.dataset.x; if (b.resultado !== 'com_anomalia') b.anomalia = null; mudou(); pintar(); }));
  ligar('bAn', el => { b.anomalia = el.value; mudou(); }, 'input');
  ligar('bMot', el => { if (el.value === '+'){ b._outro = true; b.motivo_nao = null; mudou(); pintar(); return; } b._outro = false; b.motivo_nao = el.value || null; mudou(); pintar(); });
  ligar('bMotTx', el => { b.motivo_nao = el.value.trim() || null; mudou(); }, 'input');
}

// ── teste de pressão (um por vaso, D3) ─────────────────────────────────────
function telaTeste(v){

  const i = v.inspecao, pode = ed(v), u = unidadeDe(v);
  const t = i.teste || (i.teste = { realizado:null });
  const pth = Math.max(0, ...ativas(v).map(c => c.pth_mpa || 0)) || null;
  let h = '<div class="card"><b>Foi feito o teste de pressão?</b><div class="seg" id="tR"><button data-r="1" class="' + (t.realizado === true ? 'on' : '') + '">Sim</button>' +
    '<button data-r="0" class="' + (t.realizado === false ? 'on' : '') + '">Não</button></div>';
  if (t.realizado === true){
    h += '<label class="f">Tipo<div class="seg" id="tTipo">' + [['hidrostatico','Hidrostático'],['pneumatico','Pneumático'],['hidropneumatico','Hidropneumático']]
      .map(x => '<button data-t="' + x[0] + '" class="' + (t.tipo === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div></label>';
    h += '<div class="lin"><div>' + campoPressao('Pressão do teste', 'tP', t.pressao_mpa, u, pth ? 'PTH da plaqueta: ' + fmt(deMPa(pth, u), 3) + ' ' + UNID_ROT[u] : null) + '</div><div>' +
      campoNum('Duração (min)', 'tD', t.duracao_min, null, 'inputmode="numeric"') + '</div></div>';

// S80 · R03b · ULTRASSOM, CSV DO MEDIDOR E A PRÉVIA DO CÁLCULO
// ════════════════════════════════════════════════════════════════════════════
const MOTIVOS_US = ['Sem acesso ao componente.', 'Isolamento térmico no componente.', 'Revestimento ou pintura impede a leitura.'];
const MAX_PONTOS = 60;
const leiturasDe = (v, cid) => ((v.inspecao && v.inspecao.leituras) || []).filter(l => l.componente_id === cid);
const semLeitura = v => (v.inspecao && v.inspecao.ultrassom_sem_leitura) || {};
const compsMedir = v => compsAtivos(v).filter(c => !c.nao_medir).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
function estUltra(v){
  const i = v.inspecao || {}, cs = compsMedir(v);
  const feitos = cs.filter(c => leiturasDe(v, c.id).length || (semLeitura(v)[c.id] || '').trim()).length;
  if (!i.medidor_id && !feitos) return 'vazia';
  return i.medidor_id && feitos === cs.length ? 'ok' : 'inc';
}
function minimaDe(v, cid){
  const l = leiturasDe(v, cid); if (!l.length) return null;
  try{ return MotorNR13.minimaLeituras(l.map(x => x.valor_mm)); }catch(e){ return null; }
}
function materialDe(v, c){
  const id = (c && c.material_id) || v.material_id;
  return id ? (E.materiais || []).find(m => m.id === id) || null : null;
}
const camaraDe = (v, c) => v.camaras.find(k => k.id === c.camara_id) || ativas(v)[0] || null;

/** Espessura mínima requerida (com o mínimo de 1,5 mm e a corrosão), ou o motivo de não dar. */
function eMinDe(v, c){
  const k = camaraDe(v, c), m = materialDe(v, c);
  if (!k || k.p_operacao_max_mpa == null) return { erro:'sem a pressão de operação' };
  if (k.pressao_externa || k.p_operacao_max_mpa <= 0) return { erro:'pressão externa: calculada no escritório' };
  if (!m || !(m.s_mpa > 0)) return { erro:'sem o material' };
  try{
    const g = geoDe(v, c);
    const e = MotorNR13.espessuraMinima(g, k.p_operacao_max_mpa, Number(m.s_mpa), g.E);
    return { valor: Math.max(e, 1.5) + (Number(v.corrosao_mm) || 0), padrao:g.padrao };
  }catch(e){ return { erro:e.message }; }
}

// ── gravar ─────────────────────────────────────────────────────────────────
function gravarLeituras(v, c){
  const l = leiturasDe(v, c.id);
  const origem = l.length && l.every(x => x.origem === 'csv') ? 'csv' : 'digitado';
  enfileirar(v, 'leit-' + c.id, 'espessuras ' + c.nome, { funcao:'tf_insp_leituras_gravar',
    payload:{ p_id:v.inspecao.id, p_componente:c.id, p_leituras:l.map(x => ({ ponto:x.ponto, leitura:x.leitura, valor:x.valor_mm })), p_origem:origem } });
}
function gravarUS(v){
  const i = v.inspecao;
  enfileirar(v, 'us', 'ultrassom', { funcao:'tf_insp_ultrassom_gravar',
    payload:{ p_id:i.id, p_dados:{ medidor_id:i.medidor_id || null, pasta:i.ultrassom_pasta || null, sem_leitura:Object.assign({}, semLeitura(v)) } } });
}
const adiar3 = debounce((tipo, v, x) => { if (tipo === 'leit') gravarLeituras(v, x); else gravarUS(v); }, 900);
function porLeitura(v, cid, ponto, leitura, valor){
  const i = v.inspecao;
  i.leituras = (i.leituras || []).filter(x => !(x.componente_id === cid && x.ponto === ponto && x.leitura === leitura));
  if (valor != null) i.leituras.push({ componente_id:cid, ponto, leitura, valor_mm:valor, origem:'digitado' });
  i.leituras.sort((a, b) => a.componente_id < b.componente_id ? -1 : a.componente_id > b.componente_id ? 1 : (a.ponto - b.ponto) || (a.leitura - b.leitura));
  salvar();
}

// ── o CSV do medidor (colunas Spot_No, Reading_No e Reading) ───────────────
function lerCsv(txt){
  const linhas = String(txt).replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  if (!linhas.length) throw new Error('Arquivo vazio.');
  const sep = [';', '\t', ','].find(c => linhas[0].indexOf(c) >= 0) || ',';
  const cab = linhas[0].split(sep).map(x => x.trim().replace(/^"|"$/g, '').toLowerCase());
  const iS = cab.indexOf('spot_no'), iN = cab.indexOf('reading_no'), iR = cab.indexOf('reading');
  if (iS < 0 || iR < 0) throw new Error('O arquivo não tem as colunas Spot_No e Reading.');
  const spots = [], por = {};
  linhas.slice(1).forEach((ln, n) => {
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const sp = c[iS], val = num(c[iR]);
    if (!sp) return;
    if (val == null || Number.isNaN(val) || val <= 0 || val > 300) throw new Error('Linha ' + (n + 2) + ': leitura inválida (' + (c[iR] || 'vazia') + ').');
    if (!por[sp]){ por[sp] = []; spots.push(sp); }
    por[sp].push({ n: iN >= 0 ? Number(c[iN]) || por[sp].length + 1 : por[sp].length + 1, val });
  });
  if (!spots.length) throw new Error('Nenhuma leitura no arquivo.');
  spots.forEach(sp => por[sp].sort((a, b) => a.n - b.n));
  return { spots, por };
}
function importarCsv(v){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try{ distribuirCsv(v, lerCsv(rd.result)); }catch(e){ U.toast(e.message, 'err'); } };
    rd.readAsText(f);
  });
  inp.click();
}
function distribuirCsv(v, d){
  const cs = compsMedir(v).filter(c => !(semLeitura(v)[c.id] || '').trim());
  const n = d.spots.length;
  // sugestão: divide os pontos do arquivo na ordem dos componentes, em partes iguais
  const passo = Math.max(1, Math.floor(n / Math.max(1, cs.length)));
  let h = '<p class="info" style="margin-top:0">O arquivo tem <b>' + n + ' ponto' + (n > 1 ? 's' : '') + '</b> (do ' + esc(d.spots[0]) + ' ao ' + esc(d.spots[n - 1]) +
    '). Diga quais pontos (pela ordem no arquivo, 1 a ' + n + ') vão para cada componente. Componente em branco fica como está.</p>';
  h += '<p class="muted">Substitui as leituras já digitadas do componente.</p>';
  cs.forEach((c, k) => {
    const de = k * passo + 1, ate = k === cs.length - 1 ? n : Math.min(n, (k + 1) * passo);
    h += '<div class="lin" style="align-items:flex-end"><div style="flex:2;font-weight:600;padding-bottom:12px">' + esc(c.nome) + '</div>' +
      '<label class="f">de<input class="t" inputmode="numeric" id="cd_' + esc(c.id) + '" value="' + (de <= n ? de : '') + '"></label>' +
      '<label class="f">até<input class="t" inputmode="numeric" id="ca_' + esc(c.id) + '" value="' + (de <= n ? ate : '') + '"></label></div>';
  });
  janela('Importar o CSV', h, [{ rotulo:'Cancelar' }, { rotulo:'Conferir', classe:'pri', acao:() => {
    const usados = new Set(), plano = [];
    for (const c of cs){
      const de = num($('cd_' + c.id).value), ate = num($('ca_' + c.id).value);
      if (de == null && ate == null) continue;
      if (!(de >= 1 && ate >= de && ate <= n && Number.isInteger(de) && Number.isInteger(ate))){ U.toast(c.nome + ': faixa inválida (1 a ' + n + ').', 'err'); return false; }
      if (ate - de + 1 > MAX_PONTOS){ U.toast(c.nome + ': no máximo ' + MAX_PONTOS + ' pontos.', 'err'); return false; }
      for (let p = de; p <= ate; p++){ if (usados.has(p)){ U.toast('O ponto ' + p + ' do arquivo está em dois componentes.', 'err'); return false; } usados.add(p); }
      plano.push({ c, de, ate });
    }
    if (!plano.length){ U.toast('Nenhuma faixa preenchida.', 'err'); return false; }
    setTimeout(() => conferirCsv(v, d, plano), 0);
  } }]);
}
function conferirCsv(v, d, plano){
  let corte = 0;
  const novo = plano.map(({ c, de, ate }) => {
    const l = [];
    for (let p = de; p <= ate; p++){
      const rs = d.por[d.spots[p - 1]];
      if (rs.length > 4) corte++;
      rs.slice(0, 4).forEach((r, k) => l.push({ componente_id:c.id, ponto:p - de + 1, leitura:k + 1, valor_mm:Math.round(r.val * 100) / 100, origem:'csv' }));
    }
    return { c, l };
  });
  const h = novo.map(({ c, l }) => {
    const mn = MotorNR13.minimaLeituras(l.map(x => x.valor_mm));
    return '<div class="fl"><b>' + esc(c.nome) + '</b>' + (l.length ? new Set(l.map(x => x.ponto)).size + ' pontos, ' + l.length + ' leituras · mínima ' + fmt(mn, 2) + ' mm' : '') + '</div>';
  }).join('') + (corte ? '<p class="alerta" style="margin-top:8px">' + corte + ' ponto(s) com mais de 4 leituras: ficaram as 4 primeiras.</p>' : '');
  janela('Conferir antes de gravar', h, [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:() => {
    const i = v.inspecao;
    novo.forEach(({ c, l }) => {
      i.leituras = (i.leituras || []).filter(x => x.componente_id !== c.id).concat(l);
      c._pontos = 0;
      gravarLeituras(v, c);
    });
    salvar(); U.toast('Leituras importadas.'); setTimeout(pintar, 0);
  } }]);
}

// ── a prévia do cálculo (motor no aparelho, sem sinal) ─────────────────────
const RISCO = { A:4, B:3, C:2, D:1 };
function previa(v){
  const r = { camaras:[], vaso:null, avisos:[], detalhes:[] };
  const cs = ativas(v), u = unidadeDe(v);
  const m = materialDe(v, null);
  if (!m) r.avisos.push('Prévia: sem o material do costado (Operação e câmaras), a PMTA não sai.');
  else {
    if (!m.conferido) r.avisos.push('O material ' + m.especificacao + ' é da lista provisória, ainda não conferida pelo Fernando: a prévia é indicativa.');
    cs.forEach(k => { if (m.t_max_c != null && k.t_operacao_c != null && Number(k.t_operacao_c) > Number(m.t_max_c))
      r.avisos.push('Temperatura de operação' + (cs.length > 1 ? ' (' + k.nome + ')' : '') + ' acima de ' + fmt(m.t_max_c, 0) + ' °C: o S do material não vale.'); });
  }
  const padrao = new Set();
  cs.forEach(k => {
    const ck = { cam:k, comps:[], governante:null, erro:null };
    const P = k.p_operacao_max_mpa;
    if (P == null) ck.erro = 'Sem a pressão de operação.';
    else if (k.pressao_externa || P <= 0) ck.erro = 'Pressão externa (vácuo): a PMTA externa é do escritório (PLH).';
    else if (!m) ck.erro = 'Sem o material.';
    compsMedir(v).filter(c => camaraDe(v, c) === k).forEach(c => {
      const t = minimaDe(v, c.id), x = { c, tMin:t, eMin:null, pmta:null, erro:null, abaixo:false };
      if (!ck.erro){
        try{
          const g = geoDe(v, c), mc = materialDe(v, c);
          const res = MotorNR13.calcularVaso({ pOperacaoMPa:P, S:Number(mc.s_mpa), corrosaoMm:Number(v.corrosao_mm) || 0,
            componentes:[Object.assign({}, g, { leituras:leiturasDe(v, c.id).map(y => y.valor_mm) })] });
          const rc = res.componentes[0];
          x.eMin = rc.eMin; x.pmta = rc.pmtaMPa; x.abaixo = rc.abaixoDaMinima;
          g.padrao.forEach(p => padrao.add(c.nome));
        }catch(e){ x.erro = e.message; }
      }
      ck.comps.push(x);
    });
    const ok = ck.comps.filter(x => x.pmta != null);
    if (ok.length) ck.governante = ok.reduce((a, b) => b.pmta < a.pmta ? b : a);
    const nm = cs.length > 1 ? ' (' + k.nome + ')' : '';
    if (ck.governante && ck.governante.pmta < P) r.avisos.push('PMTA calculada' + nm + ' de ' + fmt(deMPa(ck.governante.pmta, u), 2) + ' ' + UNID_ROT[u] + ', abaixo da pressão de operação (' + ck.governante.c.nome + ').');
    ck.comps.filter(x => x.abaixo).forEach(x => r.avisos.push(x.c.nome + ': espessura medida abaixo da mínima requerida.'));
    ck.comps.filter(x => x.erro).forEach(x => r.detalhes.push(x.c.nome + ': ' + x.erro));
    r.camaras.push(ck);
  });
  if (padrao.size) r.detalhes.push('Geometria padrão (a validar pelo Fernando) em: ' + [...padrao].join(', ') + '.');
  // a categoria do vaso pela conta única (pendência 20)
  try{
    if (!cs.length) throw new Error('Sem câmaras.');
    if (cs.some(k => k.p_operacao_max_mpa == null || !k.classe_fluido)) throw new Error('Falta a pressão de operação ou a classe do fluido.');
    if (cs.some(k => k.volume_desconhecido || !(k.volume_m3 > 0))) throw new Error('Volume desconhecido: o escritório informa o volume para a categoria.');
    const kP = cs.reduce((a, b) => Math.abs(b.p_operacao_max_mpa) > Math.abs(a.p_operacao_max_mpa) ? b : a);
    const V = cs.reduce((a, k) => a + Number(k.volume_m3), 0);
    const classe = cs.map(k => String(k.classe_fluido).toUpperCase()).reduce((a, b) => RISCO[b] > RISCO[a] ? b : a);
    const cat = MotorNR13.categoria(classe, kP.p_operacao_max_mpa, V);
    const pr = MotorNR13.prazos(cat.categoria, { semCodigoConstrucao:!!v.sem_codigo_construcao, temperaturaAbaixoDeZeroSemDeterioracao:!!v.abaixo_zero_sem_deterioracao });
    r.vaso = { P:kP.p_operacao_max_mpa, deCamara:kP, V, classe, pv:cat.pv, grupo:cat.grupo, categoria:cat.categoria, prazos:pr };
  }catch(e){ r.vaso = { erro:e.message }; }
  return r;
}
function telaPrevia(v){
  titulo('Prévia do cálculo', v.tag);
  const u = unidadeDe(v), pr = (x, c) => x == null ? '—' : fmt(deMPa(x, u), c == null ? 2 : c) + ' ' + UNID_ROT[u] + (u !== 'MPa' ? ' <span class="muted">(' + fmt(x, 3) + ' MPa)</span>' : '');
  let r;
  try{ r = previa(v); }catch(e){ $('tela').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; return; }
  const m = materialDe(v, null);
  let h = '<div class="alerta" style="background:var(--accent-soft);color:var(--accent-ink)"><b>Só informativa</b>O resultado oficial é calculado e gravado na revisão, no escritório.</div>';
  if (r.avisos.length) h += '<div class="alerta"><b>Avisos</b><ul>' + r.avisos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
  h += '<div class="card"><b>Material</b><p class="info" style="margin:4px 0 0">' + (m ? esc(m.especificacao + (m.forma ? ' (' + m.forma + ')' : '')) + ' · S = ' + fmt(m.s_mpa, 1) + ' MPa' +
    (m.conferido ? '' : ' · <span class="chip inc">provisório</span>') : 'não informado') + (Number(v.corrosao_mm) ? ' · corrosão ' + fmt(v.corrosao_mm, 2) + ' mm' : '') + '</p></div>';
  r.camaras.forEach(ck => {
    h += '<div class="card cam"><div class="ct"><span>' + esc(ck.cam.nome) + '</span></div><div class="classe">Pressão de operação: ' + pr(ck.cam.p_operacao_max_mpa) + '</div>';
    if (ck.erro) h += '<p class="muted" style="margin:6px 0 0">' + esc(ck.erro) + '</p>';
    ck.comps.forEach(x => {
      const gov = ck.governante && ck.governante.c.id === x.c.id;
      h += '<div class="fl"' + (x.abaixo ? ' style="color:var(--crit)"' : '') + '><b>' + esc(x.c.nome) + (gov ? ' · governante' : '') + '</b>' +
        (x.erro ? '<span class="mot">' + esc(x.erro) + '</span>' : x.tMin == null && (semLeitura(v)[x.c.id] || '').trim() ? '<span class="muted">sem leitura: ' + esc(semLeitura(v)[x.c.id]) + '</span>' :
          'medida ' + (x.tMin == null ? '—' : fmt(x.tMin, 2) + ' mm') + ' · requerida ' + (x.eMin == null ? '—' : fmt(x.eMin, 2) + ' mm') + ' · PMTA ' + pr(x.pmta)) + '</div>';
    });
    if (ck.governante) h += '<p style="margin:8px 0 0"><b>PMTA calculada: ' + pr(ck.governante.pmta) + '</b></p>';
    h += '</div>';
  });
  h += '<div class="card"><b>O vaso · categoria e prazos</b>';
  if (r.vaso.erro) h += '<p class="muted" style="margin:4px 0 0">' + esc(r.vaso.erro) + '</p>';
  else {
    const z = r.vaso;
    h += '<p class="info" style="margin:4px 0 0">P = ' + pr(z.P) + (ativas(v).length > 1 ? ' (de ' + esc(z.deCamara.nome) + ')' : '') + ' · V = ' + fmt(z.V, 3) + ' m³ · classe ' + z.classe + '</p>' +
      '<p class="info" style="margin:2px 0 0">P·V = ' + fmt(z.pv, 3) + ' · grupo ' + z.grupo + ' · <b>categoria ' + z.categoria + '</b></p>' +
      '<p class="info" style="margin:2px 0 0">Próximas: externa em ' + z.prazos.externo + ' ano' + (z.prazos.externo > 1 ? 's' : '') +
      ' · interna ' + (z.prazos.interno == null ? 'a critério do PLH' : 'em ' + z.prazos.interno + ' anos') + ' <span class="muted">· item ' + esc(z.prazos.regra) + ' da NR-13</span></p>';
    if (ativas(v).length > 1) h += '<p class="muted" style="margin:6px 0 0">Conta única: a maior pressão entre as câmaras, o volume total e o fluido de maior risco.</p>';
  }
  h += '</div>';
  if (r.detalhes.length) h += '<div class="card"><b>Observações do cálculo</b><ul style="margin:4px 0 0;padding-left:18px">' + r.detalhes.map(x => '<li class="info">' + esc(x) + '</li>').join('') + '</ul></div>';
  h += '<p class="rodape">Motor ' + esc(MotorNR13.versao || '') + '</p>';
  $('tela').innerHTML = h;
}
