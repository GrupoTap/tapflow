<!--
  TapDoc 4 · a coleta da inspeção no celular (R02a, R02b1, R03a e R03b)
  ─────────────────────────────────────────────────────────────────
  Mora em field/doc/ e é aberta pelo Field (botão "Abrir a inspeção" da
  T06 · Executar a inspeção). Usa o núcleo N2: a sessão, o PIN, a fila de envios
  sem sinal e as fotos.
  Banco: sql/400 (R02a), 401 (R02b1, preparação) e 402 (R03a: exame visual,
  acessórios, boroscopia, teste de pressão, fechamento e envio) e 403 (R03b:
  ultrassom, geometria dos componentes e a prévia do motor de cálculo).
  Desenhos: inspecao-nr13/rodadas/R02-field-coleta.md e R03-campo-final-desenho.md.
  Feito pelo chat central em 22/10/2026.

  COMO FUNCIONA SEM SINAL
   · Ao abrir com sinal, baixa o "pacote" da OS (tf_insp_pacote_os) e guarda
     no aparelho. Daí em diante tudo funciona sem sinal.
   · Cada gravação vira uma entrada da fila do núcleo (tipo 'insp', um grupo
     por vaso), com o id gerado AQUI. O banco aceita reenvio sem duplicar.
   · Vaso com envio pendente fica com a versão do aparelho; sem pendência,
     o pacote novo do servidor substitui.
  O endereço leva a OS depois do # (doc/#os=<id>&t=<id>): assim o service
  worker do Field acha a página guardada sem sinal.
-->
<style>
:root{
  --paper:#F1F3F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#14181B; --ink-2:#515252; --ink-3:#78838A;
  --rule:#DBE0E3; --rule-2:#EBEFF1;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);

button{cursor:pointer}
header{flex:0 0 auto;background:var(--mod,var(--accent));color:#fff;

header .tit b{display:block;font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tit small{display:block;font-size:12px;opacity:.8;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.92;flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5)}
.dot.ok{background:#7BE0A9}.dot.off{background:#FF9E86}
.aviso{flex:0 0 auto;padding:8px 14px;font-size:13px;font-weight:600}
.aviso.demo{background:var(--warn-soft);color:var(--warn)}
.aviso.fila{background:var(--crit-soft);color:var(--crit);display:flex;gap:8px;align-items:center}
.aviso.fila.so{background:var(--warn-soft);color:var(--warn)}
.aviso.fila button{background:var(--crit);color:#fff;border:0;border-radius:3px;padding:4px 10px;font-size:12px;font-weight:600}

.aviso.fila .esp{margin-left:auto}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 40px}
.wrap{max-width:720px;margin:0 auto}
h2{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin:18px 2px 8px}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px}
.vaso{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border-left:4px solid var(--accent)}
.vaso.fora{border-left-color:var(--rule)}
.vaso .tg{font-size:16px;font-weight:700;line-height:1.2}
.vaso .nm{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.vaso .dir{margin-left:auto;font-size:20px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.inc{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.pend{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.prov{background:#EEE7F7;color:#4B2E83;border-color:transparent}
.chip.mvf{background:var(--warn-soft);color:var(--warn);border-color:transparent}   /* TapDoc 32 · issue 221: faltam medidas do vaso */
.btn{display:block;width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:12px 14px;font-weight:600;font-size:15px;text-align:center;margin-top:10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sec{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.btn.perigo{color:var(--crit)}
.btn.peq{display:inline-block;width:auto;padding:7px 12px;font-size:13px;margin-top:6px}
.btn:disabled{opacity:.5}
.secao{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:14px}
.secao .sn{flex:1;font-weight:600}
.secao .sn small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.secao.cinza{opacity:.55;box-shadow:none;background:var(--surface-2)}
.est{font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;flex:0 0 auto}
.est.vazia{background:var(--surface-2);color:var(--ink-3)}
.est.inc{background:var(--warn-soft);color:var(--warn)}
.est.ok{background:var(--ok-soft);color:var(--ok)}
.alerta{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:9px 12px;font-size:13.5px;margin-bottom:10px}
.alerta b{display:block;margin-bottom:2px}
.alerta ul{margin:2px 0 0;padding-left:18px}
.info{font-size:13.5px;color:var(--ink-2)}
.muted{color:var(--ink-3);font-size:13px}
label.f{display:block;margin-top:12px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f:first-child{margin-top:0}
.f small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
input.t,select.t,textarea.t{display:block;width:100%;margin-top:4px;font-size:16px;padding:10px 11px;border:1px solid var(--rule);border-radius:5px;background:#fff}
textarea.t{min-height:72px;resize:vertical}
.lin{display:flex;gap:8px}
.lin > *{flex:1;min-width:0}
.conv{font-size:12.5px;color:var(--accent-ink);margin-top:3px;min-height:16px}
.seg{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;border:1px solid var(--rule);background:#fff;border-radius:5px;padding:9px 6px;font-size:14px;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.sit button{flex:1 1 28%;font-size:13.5px;padding:9px 4px}
.chk{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:14.5px}
.chk input{width:20px;height:20px;flex:0 0 auto}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.foto{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-3);text-align:center;padding:4px}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;z-index:2}
.foto .pend{position:absolute;left:4px;bottom:4px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;z-index:2}
.foto.add{border:1.5px dashed var(--accent);color:var(--accent-ink);font-weight:600;background:var(--accent-soft);cursor:pointer}
.foto .leg{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;padding:2px 4px;z-index:1}
.cam{border-left:4px solid var(--accent-soft)}
.cam .ct{display:flex;align-items:center;gap:8px;font-weight:700}
.cam .ct span{flex:1}
.classe{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.comp{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--rule-2);padding-top:10px;margin-top:10px}
.comp:first-of-type{border-top:0;margin-top:0;padding-top:0}
.passo{display:flex;gap:10px;align-items:center;border-top:1px solid var(--rule-2);padding:9px 0}
.passo:first-of-type{border-top:0}
.passo .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.passo .n.ok{background:var(--ok-soft);color:var(--ok)}
.passo .tx{flex:1;font-size:14px}
.vazio{text-align:center;color:var(--ink-3);padding:30px 10px}
.rodape{text-align:center;font-size:11px;color:var(--ink-3);margin-top:24px}
.fl{border-top:1px solid var(--rule-2);padding:9px 0;font-size:13.5px}
.fl:first-child{border-top:0}
.fl b{display:block}
.fl .mot{color:var(--crit);font-size:12.5px}
@media (min-width:900px){ main{padding:20px} .fotos{grid-template-columns:repeat(4,1fr)} }
.faixa{background:#FBF3DB;border:1px solid #EAD9A6;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-top:6px;color:#3D3416}
.faixa[hidden]{display:none}
/* S140 · itens 49, 51, 52, 53, 60 */
.foto .gir{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;z-index:2}   /* TapDoc 32 · issue 220: girar */
.foto .galb{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9.5px;font-weight:700;padding:1px 4px;border-radius:3px;z-index:2}
.foto.add.gal{background:var(--surface-2);border-color:var(--ink-3);color:var(--ink-2)}
.lugar{border-top:1px solid var(--rule-2);padding:10px 0 4px;margin-top:8px}
.lugar .lt{display:flex;gap:8px;align-items:center}.lugar .lt b{flex:1;font-size:14.5px}
.cardc{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--cor,var(--accent));border-radius:6px;box-shadow:var(--sh);margin-bottom:10px}
.cardc-cab{width:100%;display:flex;gap:10px;align-items:center;background:none;border:0;padding:11px 12px;text-align:left}
.cardc-cab .cn{flex:1;min-width:0}.cardc-cab .cn b{display:block;font-size:15.5px;line-height:1.25}.cardc-cab .cn small{display:block;font-size:12.5px;color:var(--ink-3)}
.cardc-cab .seta{font-size:18px;color:var(--ink-3);flex:0 0 auto}
.cardc-corpo{padding:0 12px 12px;border-top:1px solid var(--rule-2)}
.reg{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-2)}.reg b{flex:1;font-size:14px}
.usTit{position:sticky;top:-12px;z-index:3;background:var(--surface);padding:8px 0 6px;margin:0 0 4px;font-weight:700;font-size:14.5px;border-bottom:2px solid var(--cor,var(--accent))}
.usTit small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
#salvo{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--ok);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#salvo.on{opacity:.92}
#desfazer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:6px;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:70;font-size:14px}
#desfazer span{flex:1}#desfazer button{background:none;border:0;color:#9FD3FF;font-weight:700;font-size:14px}
/* S162 · issue 15: a parte com problema (o "Falta para enviar" leva até ela) · issue 23: a leitura suspeita da aferição */
.problema{outline:2px solid var(--crit) !important;outline-offset:2px;background:var(--crit-soft) !important;border-radius:5px}
.alerta.crit{background:var(--crit-soft);color:var(--crit)}
.chip.rec{background:var(--crit);color:#fff;border-color:transparent}
.fl button.ir{background:none;border:0;padding:0 0 0 4px;color:var(--crit);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
#barEspaco{background:var(--crit-soft);color:var(--crit);font-weight:600}
.alerta button.ir{background:none;border:0;padding:0 0 0 4px;color:var(--crit);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
input.t.suspeita{border-color:var(--crit);background:var(--crit-soft);color:var(--crit);font-weight:700}
.btn.bloq{opacity:.55}
</style>

<script>
'use strict';
const VERSAO = 'TapDoc 37';   // S235: o aviso do escopo com o gênero certo ("A válvula … não é pedida"); o envio do vaso só de aferição sem os avisos da inspeção (placa, PMTA, GPS, costado)
// const VERSAO = 'TapDoc 36';   // S234 · issue 255: no vaso "só aferição", o que o escritório deixou fora do escopo (válvula ou manômetro) não é cobrado no envio e aparece como "fora do escopo desta visita" (457)
// const VERSAO = 'TapDoc 35';   // S224 · issues 242 (parte 2) e 243: o vaso "só aferição" (o selo, o cartão sem a posição, só Acessórios e o envio; 454 e 455) e a bancada perguntada em cada aferição, com a última usada no mesmo tipo
// const VERSAO = 'TapDoc 34';   // S220 · issue 240: o assentamento maior que a abertura vira falta ("confira a digitação"), não reprova mais a válvula (motor R00.7, 451)
// const VERSAO = 'TapDoc 33';   // S210 · issue 216 (Rodada R19 da auditoria): o número de série da válvula (opcional), que vai para a revisão, o laudo e o certificado; "Trazer os da inspeção anterior" traz o número junto (450)
// const VERSAO = 'TapDoc 32';   // S208 · issues 220 e 221 (Rodada R18 da auditoria): "Girar" (↻) em cada foto, de 90 em 90 graus, pela fila (vale no laudo e nos documentos; 449); o Fechamento avisa em amarelo quando falta o comprimento do costado ou a altura de um tampo (com um link para cada campo; o envio continua liberado) e o cartão "Medidas do vaso" mostra "faltam N medidas"
// const VERSAO = 'TapDoc 31';   // S175 · issues 48, 49, 50, 51 e 53 (Revisão TapDoc · Rodada 4b): tocar no que já está marcado não apaga a resposta e trocar com texto escrito pergunta (visual, boroscopia, teste); a pressão volta como foi digitada (sem 10,0004) e "1.013" pergunta; mensagens da conta em português simples, avisos na unidade do inspetor, "pelo PLH"; acessórios: "Trazer os da anterior" fica e a pressão não redesenha a tela; ajustes pequenos (laudo sem páginas, janela, código "Outro", GPS, ordem das fotos, CSV); sem SQL
// const VERSAO = 'TapDoc 30';   // S174 · issues 38, 39, 52, 82 e 83 (Revisão TapDoc · Rodada 4a): o CSV do medidor com uma leitura inválida entra com as boas e diz quais ficaram de fora; o PDF do laudo anterior que não coube avisa; a miniatura renova o acesso antes de baixar; depois de a câmera fechar o app, volta para a mesma tela e avisa que a foto não chegou; PDF até 50 MB (441); o GPS do vaso volta no pacote da OS (441)
// const VERSAO = 'TapDoc 29';   // S173 · issues 43, 44, 45, 46 e 47 (Revisão TapDoc · Rodada 3): a aferição reprovada põe "substituir" só ao sair do campo e a situação volta quando o resultado deixa de ser reprovado (o banco não troca mais: 440); "Cancelar esta aferição" (com o motivo) e trocar o tipo do acessório pede para cancelá-la; sem a PMTA vigente, a válvula é conferida (aviso) contra a menor entre a PMTA da plaqueta e a da prévia; "Gerar os pontos" pergunta antes de apagar leituras; o prazo menor não grava a cada letra, só aparece com a categoria e a escolha pela metade fica guardada
// const VERSAO = 'TapDoc 28';   // S172 · issues 40, 42 e 55 (Revisão TapDoc · Rodada 2): a leitura do número com ponto de milhar — vírgula é a decimal; "1.250" sem vírgula pergunta "1250 ou 1,25?" e não grava até escolher; volume abaixo de 20 litros e circunferência abaixo de 300 mm avisam; a mesma regra do escritório (E41)
// const VERSAO = 'TapDoc 27';   // S171 · issues 35, 36, 37 e 41 (Revisão TapDoc · Rodada 1): sem espaço avisa em vermelho e as OS antigas sem nada pendente saem do aparelho; miniaturas no IndexedDB; o pacote que chega sozinho não troca o vaso em campo nem redesenha a tela; envio recusado depois do "Enviar" volta o vaso para "em campo" com o motivo; a correção toma o lugar do envio recusado; PMTA, PTH e PMTA externa maiores que zero
// const VERSAO = 'TapDoc 26';   // S163 · issues 12, 20 e 21 (433): todas as recomendações do laudo no Fechamento (as da norma, as das respostas — que dá para desmarcar — e as a mais; recomendacoes.js RC1); a justificativa do prazo menor numa lista (A1, A2, B, Outros)
// const VERSAO = 'TapDoc 25';   // S162 · issues 15, 19 e 23: o que falta para enviar leva até a parte com problema (marcada em vermelho, com o nome da tela); "substituir" × aferição conforme; a leitura suspeita da aferição em vermelho
// const VERSAO = 'TapDoc 24';   // S154 · issue 9 (430): a foto da medição de espessura na tela Ultrassom (uma por vaso; a foto ou o motivo, obrigatória para enviar)
// const VERSAO = 'TapDoc 23';   // S152 · issue 7, Parte 2 (429): a seção "Medidas do vaso" em Componentes — circunferência, comprimento do costado entre as soldas, altura de cada tampo e outras medidas (nome + valor), para o desenho do mapa dos pontos
// const VERSAO = 'TapDoc 22';   // S150 · item 81 (427): a aferição em 2 etapas (a 1ª reprovada encerra: NÃO CONFORME, sem leituras); manômetro pela ASME B40.100 Grau D; o teste da válvula pelas regras V1–V5 (abertura encontrada, aviso na hora acima da PMTA e abaixo da operação); "Danificado" vira a aferição reprovada na etapa 1; motor R00.6
// const VERSAO = 'TapDoc 21';   // S149 · itens 82, 83, 84, 88 e 92 (426): placa de TAG e placa de categoria; as 3 fotos da aferição; a boroscopia de volta (obrigatória para enviar); as recomendações prontas; a foto pergunta onde vai no laudo

/* S172 · issues 40, 42 e 55 (Revisão TapDoc · Rodada 2) — A LEITURA DO NÚMERO DIGITADO. É a MESMA regra no celular
 * (field/doc/index.html) e no escritório (doc/index.html): mudou num arquivo, mude no outro (o teste_s172.py confere os dois).
 *  · a vírgula é sempre a decimal: "1,25" = 1,25 · "0,8" = 0,8;
 *  · com vírgula, o ponto é o separador de milhar, em grupos de 3: "1.000,5" = 1000,5 · "12.345,67" = 12345,67;
 *  · sem vírgula, dois pontos ou mais em grupos de 3 também são milhar: "1.250.000" = 1250000;
 *  · sem vírgula, UM ponto seguido de exatamente 3 algarismos ("1.000", "1.250") é AMBÍGUO (mil… ou um vírgula…?):
 *    o campo pergunta ao lado ("1250 ou 1,25?") e NADA é gravado até a pessoa escolher (perguntarMilhar);
 *  · os outros pontos sozinhos são decimais, como antes: "1.5" = 1,5 · "0.250" = 0,25 (zero na frente não é milhar);
 *  · o resto (duas vírgulas, letra, ponto fora do lugar) é "número inválido".
 * num() continua lendo o ambíguo como decimal: as pressões (issue 49, Rodada 4) e o CSV do medidor (que usa ponto decimal)
 * não mudaram. Os campos de medida, volume e instrumento perguntam (celular: numOuAviso; escritório: numMedida). */
function lerNum(s){
  if (s == null) return { v:null };
  let t = String(s).trim().replace(/\s/g, '').replace(/^−/, '-');
  if (!t) return { v:null };
  let sinal = 1;
  if (t[0] === '-' || t[0] === '+'){ if (t[0] === '-') sinal = -1; t = t.slice(1); }
  const MIL = /^\d{1,3}(\.\d{3})+$/, mal = { v:NaN };
  if (!t) return mal;
  if (t.indexOf(',') >= 0){
    const p = t.split(',');
    if (p.length !== 2 || !/^\d*$/.test(p[1]) || (!p[0] && !p[1])) return mal;
    let i = p[0];
    if (i.indexOf('.') >= 0){ if (!MIL.test(i)) return mal; i = i.replace(/\./g, ''); }
    else if (!/^\d*$/.test(i)) return mal;
    return { v: sinal * Number((i || '0') + '.' + (p[1] || '0')) };
  }
  const pontos = (t.match(/\./g) || []).length;
  if (pontos > 1) return MIL.test(t) ? { v: sinal * Number(t.replace(/\./g, '')) } : mal;
  if (t === '.' || !/^\d*\.?\d*$/.test(t)) return mal;
  if (/^[1-9]\d{0,2}\.\d{3}$/.test(t)){
    const dec = sinal * Number(t), mil = sinal * Number(t.replace('.', ''));
    return { v: dec, ambiguo:true, milhar: mil, decimal: dec, texto: (sinal < 0 ? '-' : '') + t };
  }
  return { v: sinal * Number(t) };
}
function num(s){ return lerNum(s).v; }

const ADIADOS = [];
function debounce(fn, ms){
  const t = {}, args = {};
  const d = (k, ...a) => { clearTimeout(t[k]); args[k] = a; t[k] = setTimeout(() => { delete t[k]; const x = args[k]; delete args[k]; fn(...x); }, ms); };

function encadear(lista){
  const els = Array.from(lista).filter(el => !el.disabled);
  els.forEach((el, k) => {
    el.setAttribute('enterkeyhint', k === els.length - 1 ? 'done' : 'next');
    el.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      const prox = els[k + 1];
      if (prox && document.body.contains(prox)) prox.focus(); else el.blur();
    });
  });
}

function miniDB(modo, fn){

    let r; try{ r = indexedDB.open('tapdoc_mini', 1); }catch(e){ err(e); return; }
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('m')) r.result.createObjectStore('m'); };
    r.onerror = () => err(r.error || new Error('IndexedDB indisponível'));
    r.onsuccess = () => {
      const db = r.result;
      try{
        const t = db.transaction('m', modo), q = fn(t.objectStore('m'));
        t.oncomplete = () => { db.close(); ok(q ? q.result : undefined); };
        t.onerror = t.onabort = () => { db.close(); err(t.error || new Error('IndexedDB: transação abortada')); };
      }catch(e){ try{ db.close(); }catch(x){} err(e); }
    };
  });
}

    const rec = mesmos.find(e => e.recusado);

      + '</ul><p class="muted">Termine essas respostas antes, se puder.</p>', 'Atualizar mesmo assim', true))) return;
  }

  try{
    const t0 = Date.now(), tinha = !!E, eraFora = FORA_T06, vAntes = telaAtual.vaso ? vaso(telaAtual.vaso) : null;
    const p = await N.api.rpc('tf_insp_pacote_os', { p_os_id: OS });

    await baixarProntos();   // S146 · item 79
    await baixarGiro();   // TapDoc 32 · issue 220
    if (!silencioso) U.toast('Pacote da OS atualizado.');

    if (!silencioso || !tinha || eraFora || ['lista', 'vaso'].indexOf(telaAtual.nome) >= 0 || (telaAtual.vaso && vaso(telaAtual.vaso) !== vAntes)) pintar(); else { pintarSinal(); pintarFila(); }
  }catch(e){
    // S142 · item 40: o servidor disse que a pessoa não está na T06 — o aviso no lugar da tela, mesmo com a OS
    // guardada no aparelho (quem saiu da T06 não continua vendo nem editando; o guardado fica, sem aparecer)
    if (/fora da sua escala/.test(e.message || '')){ FORA_T06 = true; avisoForaT06(); }
    else if (!E){ $('tela').innerHTML = '<div class="card vazio">' + esc(e.message || 'Não consegui baixar a OS.') + '</div>'; }
    else if (!silencioso) U.toast(e.message || 'Não consegui atualizar.', 'err');

}

async function lerSoAfer(){
  const ids = ((E && E.vasos) || []).filter(v => v.inspecao && v.inspecao.id).map(v => v.inspecao.id);
  if (!ids.length) return;
  try{ const r = await N.api.rpc('tf_insp_so_afericao_ver', { p_ids: ids }); E.so_afer = Array.isArray(r) ? r : []; salvar(); }catch(e){}
  // TapDoc 36 · issue 255 (457): o que aferir em cada vaso só de aferição (banco sem a 457: os dois, como antes)
  try{ const r = await N.api.rpc('tf_insp_afericao_escopo_ver', { p_ids: ids }); const m = {}; (Array.isArray(r) ? r : []).forEach(x => { m[x.id] = { valvula: x.valvula !== false, manometro: x.manometro !== false }; }); E.afer_esc = m; salvar(); }catch(e){}
}
const soAferV = v => !!(v && v.inspecao && E && (E.so_afer || []).indexOf(v.inspecao.id) >= 0);
// TapDoc 36 · issue 255: o acessório fora do escopo da visita (o escritório desmarcou "Válvula" ou "Manômetro" na preparação). É a mesma conta da tf__insp_afer_no_escopo (457).
const escopoAfer = v => { const x = soAferV(v) && E.afer_esc && E.afer_esc[v.inspecao.id]; return { valvula: !x || x.valvula !== false, manometro: !x || x.manometro !== false }; };
const foraEscopo = (v, a) => !!(a && soAferV(v) && AFERIVEIS.includes(a.tipo) && !escopoAfer(v)[/^mano/.test(a.tipo) ? 'manometro' : 'valvula']);

function fotosDe(v, secao, item){ return ((v.inspecao && v.inspecao.fotos) || []).filter(f => f.secao === secao && (item === undefined || (item === '__solta' ? !f.item_ref : f.item_ref === item))); }
// S140 · item 49 (416): os lugares de foto do vaso — a mesma lista do servidor (tf__insp_lugares), mesma ordem e texto.
// Os tampos seguem a posição do vaso; sem posição vale horizontal (como no servidor).
function lugaresDe(v){
  const vt = v.posicao === 'vertical';
  return [{ lugar:'placa_fabricacao', secao:'plaqueta', rotulo:'Placa de fabricação' },
    { lugar:'placa_tag', secao:'plaqueta', rotulo:'Placa de TAG' },
    { lugar:'placa_categoria', secao:'plaqueta', rotulo:'Placa de categoria' },   // S149 · item 82 (a foto antiga "TAG e categoria" vale como a de TAG)
    { lugar:vt ? 'tampo_superior' : 'tampo_direito', secao:'geral', rotulo:vt ? 'Tampo superior' : 'Tampo direito' },
    { lugar:vt ? 'tampo_inferior' : 'tampo_esquerdo', secao:'geral', rotulo:vt ? 'Tampo inferior' : 'Tampo esquerdo' },
    { lugar:'conexoes', secao:'geral', rotulo:'Conexões' },
    { lugar:'base', secao:'geral', rotulo:'Base de sustentação / aterramento' }]
    // S154 · issue 9 (430): a foto da medição de espessura (tela Ultrassom); a inspeção enviada antes da 430 não pede
    // (a marca vem do pacote; a inspeção guardada no aparelho antes do TapDoc 24 não tem a marca: o servidor decide no envio)
    .concat(v.inspecao && v.inspecao.pede_foto_medicao === true ? [{ lugar:'medicao_espessura', secao:'componentes', rotulo:'Medição de espessura' }] : []);
}
const semAcessoDe = v => (v.inspecao && v.inspecao.fotos_sem_acesso) || {};
/** O lugar está resolvido: tem a foto ou o motivo de não ter. A foto da plaqueta sem lugar (antes do TapDoc 14) vale como a placa de fabricação. */
function lugarOk(v, l){
  const fs = (v.inspecao && v.inspecao.fotos) || [];
  if (String(semAcessoDe(v)[l.lugar] || '') === MESMA_FOTO) return lugarOk(v, lugaresDe(v).find(x => x.lugar === 'placa_tag'));
  return fs.some(f => f.item_ref === itemDoLugar(l)) || (l.lugar === 'placa_fabricacao' && fs.some(f => f.secao === 'plaqueta' && !f.item_ref))
    || !!String(semAcessoDe(v)[l.lugar] || '').trim();
}
const MOTIVOS_LUGAR = ['Sem acesso a esta parte do vaso.', 'O vaso não tem esta placa.', 'Isolamento ou proteção cobre esta parte.'];
// S154 · issue 9: os motivos de não ter a foto da medição de espessura
const MOTIVOS_MEDICAO = ['Não foi feita a medição de espessura neste vaso.', 'Isolamento ou proteção cobre os pontos de medição.', 'Não foi possível fotografar durante a medição.'];
// S149 · item 82: a placa de categoria pode estar na mesma foto da placa de TAG (decisão B do Bruno, 11/11)
const MESMA_FOTO = 'Mesma foto da placa de TAG (as duas placas aparecem nela).';
// S149 · item 83: o lugar pode ser de uma foto da aferição (l.item = 'afer:<acessório>:<lugar>'); senão é 'lugar:<chave>'
const itemDoLugar = l => l.item || 'lugar:' + l.lugar;

    + (l.lugar === 'placa_categoria' ? ' <button class="btn peq" data-lmesma="' + l.lugar + '">A foto da placa de TAG mostra as duas</button>' : ''));
  return h + '</div>';
}
function gravarSemAcesso(v, lugar, motivo){
  const s = Object.assign({}, semAcessoDe(v)); if (motivo) s[lugar] = motivo; else delete s[lugar];
  v.inspecao.fotos_sem_acesso = s; salvar();
  enfileirar(v, 'semac-' + lugar, 'foto sem acesso', { funcao:'tf_insp_foto_sem_acesso', payload:{ p_id:v.inspecao.id, p_lugar:lugar, p_motivo:motivo || null } });
  pintar();
}
function ligarLugares(v, lista){
  lista.forEach(l => ligarFotos(v, l.secao, () => l.rotulo, itemDoLugar(l)));
  $('tela').querySelectorAll('[data-lmesma]').forEach(b => b.addEventListener('click', () => gravarSemAcesso(v, b.dataset.lmesma, MESMA_FOTO)));   // S149 · item 82
  $('tela').querySelectorAll('[data-lsem]').forEach(b => b.addEventListener('click', () => {
    const l = lista.find(x => x.lugar === b.dataset.lsem); if (!l) return;

      (l.lugar === 'medicao_espessura' ? MOTIVOS_MEDICAO : MOTIVOS_LUGAR).map(m => '<option>' + esc(m) + '</option>').join('') + '<option value="+">Outro…</option></select></label>' +
      '<label class="f">Detalhe<small>Obrigatório em "Outro". Sai no laudo no lugar da foto.</small><textarea class="t" id="lsTx"></textarea></label>',
      [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:() => {

const ativas = v => v.camaras.filter(c => c.ativo !== false);
const compsAtivos = v => v.componentes.filter(c => c.ativo !== false);
function estPlaqueta(v){
  const itens = [lugaresDe(v).filter(l => l.secao === 'plaqueta').every(l => lugarOk(v, l)), !!(v.fabricante_id || v.fabricante), !!v.numero_serie, !!v.ano_fabricacao,
    !!(v.codigo_construcao || v.sem_codigo_construcao), ativas(v).length > 0 && ativas(v).every(c => c.pmta_plaqueta_mpa)];
  return est(itens);
}
function estOperacao(v){
  const cs = ativas(v);
  const itens = [!!v.posicao, cs.length > 0 && cs.every(c => c.fluido && c.classe_fluido),
    cs.length > 0 && cs.every(c => c.p_operacao_max_mpa != null), cs.length > 0 && cs.every(c => c.volume_m3 || c.volume_desconhecido)];
  return est(itens);
}
function estComp(v){ const cs = compsAtivos(v); return cs.length ? (cs.every(c => c.camara_id) ? 'ok' : 'inc') : 'vazia'; }
function estLocal(v){ return est([!!v.localizacao, v.latitude != null, fotosDe(v, 'localizacao').length > 0, !!(v.inspecao && v.inspecao.ambiente)]); }
function estLaudo(v){
  const s = v.laudo_anterior && v.laudo_anterior.situacao;
  if (['em_conferencia','cliente_nao_tem','sem_laudo','conferido'].indexOf(s) >= 0) return 'ok';
  return fotosDe(v, 'laudo_anterior').length ? 'inc' : 'vazia';
}
function est(itens){ const n = itens.filter(Boolean).length; return n === 0 ? 'vazia' : n === itens.length ? 'ok' : 'inc'; }
const EST_ROT = { vazia:'vazia', inc:'incompleta', ok:'ok' };
function estados(v){ return [estPlaqueta(v), estOperacao(v), estComp(v), estLocal(v), estLaudo(v), estVisual(v), estAcess(v), estUltra(v), estBoro(v), estTeste(v), estFech(v)]; }   // S149 · item 84: com a boroscopia
const N_SECOES = 11;
function secoesOk(v){ return estados(v).filter(x => x === 'ok').length; }
function alertas(v){
  const a = [];
  if (!lugarOk(v, lugaresDe(v)[0])) a.push('Falta a foto da placa de fabricação.');
  const laSit = v.laudo_anterior && v.laudo_anterior.situacao;
  ativas(v).forEach(c => {
    const nm = ativas(v).length > 1 ? ' (' + c.nome + ')' : '';
    if (!c.pmta_plaqueta_mpa) a.push('PMTA de plaqueta não informada' + nm + '.');
    // S140 · item 33: vaso sem laudo anterior não tem "laudo a conferir" (decisão do Bruno, 10/11: trocar o texto)
    if (!c.pmta_vigente_mpa && laSit !== 'conferido') a.push(laSit === 'sem_laudo' ? 'Vaso sem laudo anterior' + nm + ': a PMTA sai da plaqueta e do cálculo.'
      : laSit === 'cliente_nao_tem' ? 'Sem o laudo anterior (o cliente não tem)' + nm + ': a PMTA sai da plaqueta e do cálculo.'
      : 'PMTA vigente desconhecida' + nm + ': o laudo anterior ainda não foi conferido.');
    if (c.pressao_externa && !c.pmta_externa_plaqueta_mpa) a.push('Opera com vácuo, sem PMTA externa de plaqueta' + nm + '.');
  });
  if (v.latitude == null) a.push('Sem GPS do vaso.');

// ── tela 0 · vasos da OS ───────────────────────────────────────────────────
let filtro = '';
function telaLista(){
  const os = E.os || {};

  const com = E.vasos.filter(v => v.inspecao), sem = E.vasos.filter(v => !v.inspecao);

    return '<button class="card vaso' + (v.inspecao ? '' : ' fora') + '" data-v="' + esc(v.id) + '"><div style="min-width:0">' +

/** C10: muda a posição do vaso e renomeia os tampos que ainda têm o nome padrão (superior/inferior ↔ esquerdo/direito). */
const NOME_TAMPO = { superior:'Tampo superior', inferior:'Tampo inferior', esquerdo:'Tampo esquerdo', direito:'Tampo direito' };
// S140 · itens 51 e 52 (decisões do Bruno, 10/11): o costado é UM componente, dividido em regiões de medição.
// Cada região é uma linha de vaso_componentes (tipo costado) da mesma câmara: as leituras ficam por região e a
// conta usa a menor leitura de todas (o resultado é o mesmo da conta por região: mesma geometria e material).
// Horizontal: Frontal (CF), Traseiro (CT), Superior (CS), Inferior (CI). Vertical: CF, CT, Lateral direita (CLD), Lateral esquerda (CLE).
const REGIOES = { frontal:['CF','Frontal'], traseiro:['CT','Traseiro'], superior:['CS','Superior'], inferior:['CI','Inferior'], direito:['CLD','Lateral direita'], esquerdo:['CLE','Lateral esquerda'] };
const REG_ORDEM = ['frontal','traseiro','superior','inferior','direito','esquerdo'];
const REG_PADRAO = { horizontal:['frontal','traseiro','superior','inferior'], vertical:['frontal','traseiro','direito','esquerdo'] };
const TIPO_CURTO = { eliptico:'elíptico', torisferico:'torisférico', hemisferico:'hemisférico', conico:'cônico', plano:'plano', janela:'janela de visita', costado:'cilíndrico' };
// S144 · item 78: o nome manda (no piloto, "CS" veio com a posição "inferior", gravada antes do TapDoc 14); sem sigla no nome, a posição
function siglaReg(c){
  const m = String(c.nome || '').match(/\b(CF|CT|CS|CI|CLD|CLE)\s*$/i);
  if (m) return m[1].toUpperCase();
  return REGIOES[c.posicao] ? REGIOES[c.posicao][0] : null;
}
function nomeReg(c){
  const sg = siglaReg(c), k = Object.keys(REGIOES).find(x => REGIOES[x][0] === sg);
  return k ? REGIOES[k][1] + ' (' + sg + ')' : (String(c.nome || '').replace(/^costado\s*/i, '').trim() || 'Costado inteiro');
}
const camIdDe = (v, c) => (camaraDe(v, c) || {}).id || null;
const ordReg = c => { const k = REG_ORDEM.indexOf(c.posicao); return k < 0 ? 50 + (c.ordem || 0) : k; };
const regioesDe = (v, camId) => compsAtivos(v).filter(c => c.tipo === 'costado' && camIdDe(v, c) === camId).sort((a, b) => ordReg(a) - ordReg(b));
const tampo = t => ['eliptico','torisferico','hemisferico','conico','plano'].indexOf(t) >= 0;
/** O nome sai sozinho do tipo e da posição (item 52: ninguém digita o nome). */
function nomeAuto(v, c){
  let n = c.tipo === 'costado' ? (siglaReg(c) ? 'Costado ' + siglaReg(c) : 'Costado')
    : c.tipo === 'janela' ? 'Janela de visita' + (c.posicao ? ' ' + c.posicao : '')
    : NOME_TAMPO[c.posicao] || ('Tampo' + (c.posicao ? ' ' + c.posicao : ''));
  const outros = compsAtivos(v).filter(x => x.id !== c.id).map(x => x.nome);
  if (outros.indexOf(n) >= 0){ let k = 2; while (outros.indexOf(n + ' (' + k + ')') >= 0) k++; n += ' (' + k + ')'; }
  return n;
}
/** O costado da câmara ganha as regiões padrão (vaso novo ou o costado único da preparação, ainda sem leitura). */
function garantirRegioes(v){
  const pos = v.posicao === 'vertical' ? 'vertical' : 'horizontal';
  ativas(v).forEach(k => {
    const rs = regioesDe(v, k.id);
    if (rs.length !== 1 || rs[0].posicao || siglaReg(rs[0]) || leiturasDe(v, rs[0].id).length) return;
    const base = rs[0], geo = pegar(base, ['r_mm','eficiencia_junta','material_id','camara_id']);
    REG_PADRAO[pos].forEach((p, n) => {
      const c = n === 0 ? base : Object.assign({ id:uid(), tipo:'costado', nao_medir:false, ativo:true, ordem:(base.ordem || 1) }, geo);
      c.posicao = p; c.nome = 'Costado ' + REGIOES[p][0];
      if (n > 0) v.componentes.push(c);
      gravarComp(v, c);
    });
  });
}
function aplicarPosicao(v, p){
  mudouVaso(v, 'posicao', p);
  const mapa = p === 'horizontal' ? { superior:'esquerdo', inferior:'direito' } : { esquerdo:'superior', direito:'inferior' };
  // a região do costado acompanha: horizontal CS/CI ↔ vertical CLD/CLE
  const mapaReg = p === 'horizontal' ? { direito:'superior', esquerdo:'inferior' } : { superior:'direito', inferior:'esquerdo' };
  compsAtivos(v).forEach(c => {
    const alvo = c.tipo === 'costado' ? mapaReg[c.posicao] : mapa[c.posicao];
    if (!alvo) return;
    if (tampo(c.tipo) && c.nome === NOME_TAMPO[c.posicao]){ mudouComp(v, c, 'posicao', alvo); mudouComp(v, c, 'nome', NOME_TAMPO[alvo]); }
    else if (c.tipo === 'costado' && c.nome === 'Costado ' + REGIOES[c.posicao][0] && !regioesDe(v, camIdDe(v, c)).some(x => x.posicao === alvo)){
      mudouComp(v, c, 'posicao', alvo); mudouComp(v, c, 'nome', 'Costado ' + REGIOES[alvo][0]);
    }
  });
}
/** Abre a inspeção do vaso (id do celular) e monta o mínimo: a câmara única e
 *  costado + dois tampos. A ordem na fila é a de dependência. */
function comecar(v){
  if (v.inspecao && v.inspecao.situacao !== 'em_preparo') return;
  // S77: o vaso preparado pelo escritório já tem a inspeção (em preparo): o
  // celular usa o MESMO id, e o banco a passa para "em campo" com a equipe
  const iid = v.inspecao ? v.inspecao.id : uid();
  v.inspecao = Object.assign(v.inspecao || { fotos:[], tipo:'periodica' }, { id:iid, situacao:'em_campo', pode_editar:true, pede_foto_medicao:true });   // S154: a inspeção que começa agora pede a foto da medição (430)
  v.inspecao.fotos = v.inspecao.fotos || [];
  salvar();
  enfileirar(v, 'abrir-' + iid, 'abrir a inspeção', { funcao:'tf_insp_abrir',
    payload:{ p_os_id:E.os.id, p_equip:v.id, p_tipo:'periodica', p_os_item_id:null, p_id:iid, p_motivo_extraordinaria:null } }, null, true);
  if (soAferV(v)){ salvar(); return; }   // TapDoc 35 · issue 242: só aferição — sem câmara, componentes e regiões novos (não há exames)
  if (!ativas(v).length){
    const c = { id:uid(), tipo:'unica', nome:'Única', ordem:1, ativo:true, volume_desconhecido:false, pressao_externa:false };
    v.camaras.push(c); gravarCamara(v, c);
  }
  if (!compsAtivos(v).length){
    const cam = ativas(v)[0].id, hz = v.posicao === 'horizontal';
    [['costado','Costado',null], ['eliptico', hz ? 'Tampo esquerdo' : 'Tampo superior', hz ? 'esquerdo' : 'superior'],
     ['eliptico', hz ? 'Tampo direito' : 'Tampo inferior', hz ? 'direito' : 'inferior']].forEach((x, i) => {
      const c = { id:uid(), tipo:x[0], nome:x[1], posicao:x[2], camara_id:cam, nao_medir:false, ordem:i + 1, ativo:true };
      v.componentes.push(c);
      if (x[0] !== 'costado') gravarComp(v, c);
    });
  }
  garantirRegioes(v);   // S140 · item 51: o costado com as 4 regiões de medição
  salvar();
}

// ── campos ─────────────────────────────────────────────────────────────────
function campoTexto(rot, id, valor, extra){
  return '<label class="f">' + rot + '<input class="t" id="' + id + '" value="' + esc(valor == null ? '' : valor) + '"' + SEM_AUTO + ' ' + (extra || '') + '></label>';
}
function campoNum(rot, id, valor, ajuda, extra){
  return '<label class="f">' + rot + (ajuda ? '<small>' + ajuda + '</small>' : '') +
    '<input class="t" id="' + id + '" inputmode="decimal" value="' + esc(valor == null ? '' : fmt(valor)) + '"' + SEM_AUTO + ' ' + (extra || '') + '></label>';
}
function ligar(id, fn, ev){ const el = $(id); if (el) el.addEventListener(ev || 'change', () => fn(el)); return el; }
/** S172 · issues 40 e 42: o número ambíguo ("1.250") pergunta e não grava (lerNum); `fora` = o motivo, quando passa da faixa
 *  (sem ele: "fora do esperado (mín a máx)"). undefined = não grava; o que valia continua. */
function numOuAviso(el, min, max, rot, fora){
  const r = lerNum(el.value), v = r.v;
  if (!r.ambiguo) tirarPergunta(el);
  if (Number.isNaN(v)){ U.toast(rot + ': número inválido. Use a vírgula para os decimais (ex.: 1,25) e, se quiser, o ponto para o milhar (ex.: 1.250,5). Não foi gravado.', 'err'); el.focus(); return undefined; }
  if (r.ambiguo){ perguntarMilhar(el, r, rot); return undefined; }
  if (v != null && ((min != null && v < min) || (max != null && v > max))){
    U.toast(rot + ': ' + (fora || 'fora do esperado (' + String(min).replace('.', ',') + ' a ' + Number(max).toLocaleString('pt-BR') + ')') + '. Não foi gravado.', 'err'); el.focus(); return undefined; }
  return v;
}
/** S172 · issue 42: circunferência pequena demais para um vaso de pressão (abaixo de 300 mm = Ø menor que ~95 mm): só avisa, grava. */
const CIRC_MIN_AVISO = 300, VOL_MIN_AVISO = 20;
function avisarCirc(x){ if (x != null && x > 0 && x < CIRC_MIN_AVISO) U.toast('Confira: circunferência de ' + fmt(x, 1) + ' mm dá um vaso de Ø ' + fmt(x / Math.PI, 0) + ' mm, pequeno demais para um vaso de pressão. A medida é em mm, com a trena por fora do costado (mil e duzentos = 1200).'); }
function unidadeDe(v){ const c = ativas(v)[0]; return (c && c.unidade_campo) || v._unid || 'bar'; }
// S174b · issue 49: a pressão é guardada em MPa com 4 casas; mostrada de volta com 4 casas na unidade da pessoa, aparecia o
// arredondamento (10 kgf/cm² voltava 10,0004; 150 psi, 149,998). As casas abaixo são as que a conversão sustenta em cada unidade
// (4 casas em MPa = 0,001 bar ou kgf/cm², 0,1 psi): o número volta como foi digitado. O guardado e o laudo não mudam.
const CASAS_UNID = { 'bar':3, 'kgf/cm2':3, 'MPa':4, 'psi':1 };
function fmtP(mpa, u){ return mpa == null ? '' : fmt(deMPa(mpa, u), CASAS_UNID[u] == null ? 4 : CASAS_UNID[u]); }
function campoPressao(rot, id, mpa, u, ajuda){
  const val = fmtP(mpa, u);
  return '<label class="f">' + rot + ' (' + UNID_ROT[u] + ')' + (ajuda ? '<small>' + ajuda + '</small>' : '') +
    '<input class="t" id="' + id + '" inputmode="decimal" value="' + esc(val) + '" data-mpa="' + (mpa == null ? '' : esc(String(mpa))) + '"' + SEM_AUTO + '></label><div class="conv" id="' + id + '_c">' +
    (mpa != null && u !== 'MPa' ? '= ' + fmt(mpa, 4) + ' MPa' : '') + '</div>';
}
/** S171 · issue 41: `o.positivo` = o banco só aceita maior que zero (PMTA, PTH, PMTA externa); `o.rot` = o nome do campo na mensagem.
 *  O que o banco recusaria fica marcado em vermelho, com o motivo embaixo, e NÃO é gravado (o que valia continua). */
function ligarPressao(id, u, fn, max, o){
  const el = $(id); if (!el) return;
  o = o || {};
  const rot = o.rot || 'Pressão', cv = () => $(id + '_c');
  el.addEventListener('input', () => { const x = num(el.value), c = cv(); c.style.color = ''; c.textContent = (x != null && !Number.isNaN(x) && u !== 'MPa') ? '= ' + fmt(paraMPa(x, u), 4) + ' MPa' : ''; });
  el.addEventListener('change', () => {
    const x = num(el.value), c = cv();
    const erro = t => { el.classList.add('problema'); if (c){ c.textContent = t; c.style.color = 'var(--crit)'; } U.toast(t, 'err'); };
    el.classList.remove('problema'); if (c) c.style.color = '';
    if (Number.isNaN(x)) return erro(rot + ': número inválido. Não foi gravado.');
    // S174b · issue 49: a pressão segue a regra do número da S172 — "1.013" sem vírgula pergunta "1013 ou 1,013?" e não grava
    const lido = lerNum(el.value);
    if (lido.ambiguo){ perguntarMilhar(el, lido, rot); return; }
    tirarPergunta(el);
    const m = paraMPa(x, u);

async function dataDaFoto(arq){

        if (m === 0xFFE1 && d.getUint32(o + 4) === 0x45786966){

          const ascii = x => { let z = ''; const p = x.cont > 4 ? t + x.val : x.pos; for (let k = 0; k < x.cont - 1; k++) z += String.fromCharCode(d.getUint8(p + k)); return z; };
          const i0 = ifd(u32(t + 4), [0x8769, 0x0132]);
          let tx = null;
          if (i0[0x8769]){ const ex = ifd(i0[0x8769].val, [0x9003, 0x9004]); tx = ex[0x9003] ? ascii(ex[0x9003]) : ex[0x9004] ? ascii(ex[0x9004]) : null; }

          const mm = tx && tx.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
          if (mm) return new Date(+mm[1], +mm[2] - 1, +mm[3], +mm[4], +mm[5], +mm[6]);
          break;
        }
        if ((m & 0xFF00) !== 0xFF00) break;
        o += 2 + len;

}

async function lerArmazem(path){

  // o campo fica em branco até escrever. O "(outro)" de um aparelho antigo (nunca foi enviado) vira a mesma marca local.
  if (v.codigo_construcao === '(outro)'){ v.codigo_construcao = null; v._codOutro = true; salvar(); }
  const codOutro = (v.codigo_construcao && CODIGOS.indexOf(v.codigo_construcao) < 0) || !!v._codOutro;
  // S140 · item 49: uma foto por lugar, com o nome que vai no laudo
  const lugP = lugaresDe(v).filter(l => l.secao === 'plaqueta'), soltas = fotosDe(v, 'plaqueta', '__solta');
  let h = '<div class="card"><b>Fotos da plaqueta</b><p class="muted" style="margin:2px 0 0">Primeiro as fotos: o escritório confere por elas. Cada uma vai no laudo com este nome.</p>' +
    lugP.map(l => blocoLugar(v, l)).join('') +
    (soltas.length ? '<div class="lugar"><div class="lt"><b>Outras fotos da plaqueta</b></div>' + gradeFotos(v, 'plaqueta', soltas.length, null, '__solta') + '</div>' : '') + '</div>';
  h += '<div class="card">';
  h += '<label class="f">Fabricante<select class="t" id="pFab"><option value="">—</option>' +
    fabs.map(f => '<option value="' + esc(f.id) + '"' + (f.id === v.fabricante_id ? ' selected' : '') + '>' + esc(f.nome) + '</option>').join('') +
    (v.fabricante && !fabs.some(f => f.id === v.fabricante_id) ? '<option value="__" selected>' + esc(v.fabricante) + '</option>' : '') +
    '<option value="+">Outro (escrever)…</option></select></label>';
  // S144 · item 78: o que o vaso é (sai no laudo: "funciona como …") e o vaso sem placa (sai no laudo e vira recomendação)
  h += '<label class="f">Função do vaso<select class="t" id="pFunc"><option value="">—</option>' + FUNCOES_VASO.map(f => '<option' + (f === v.funcao ? ' selected' : '') + '>' + esc(f) + '</option>').join('') +
    (v.funcao && FUNCOES_VASO.indexOf(v.funcao) < 0 ? '<option selected>' + esc(v.funcao) + '</option>' : '') + '<option value="+">Outra (escrever)…</option></select></label>';
  // S148 · item 91: a placa com três respostas (NR-13, 13.5.1.3: placa indelével, em local visível). As respostas 2 e 3 dispensam os dados que não dão para ler
  const plv = v.placa_situacao || (v.sem_placa ? 'sem' : 'indelevel');
  h += '<label class="f">Placa de identificação<select class="t" id="pPlaca">' + [['indelevel','Com placa indelével'], ['ilegivel','Placa ilegível ou não indelével'], ['sem','Sem placa']]
    .map(([k, r]) => '<option value="' + k + '"' + (k === plv ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></label>'
    + (plv !== 'indelevel' ? '<p class="muted" style="margin:-4px 0 8px">Preencha só o que dá para ler. O laudo recomenda ' + (plv === 'sem' ? 'providenciar' : 'substituir por') + ' a placa de identificação indelével.</p>' : '');
  h += campoTexto('Nº de série', 'pSerie', v.numero_serie);
  h += '<div class="lin">' + campoTexto('Modelo', 'pModelo', v.modelo) + campoNum('Ano de fabricação', 'pAno', v.ano_fabricacao, null, 'inputmode="numeric"') + '</div>';
  h += '<div class="chk"><input type="checkbox" id="pSemCod"' + (v.sem_codigo_construcao ? ' checked' : '') + '><label for="pSemCod">Sem código de construção (não consta)</label></div>';
  if (!v.sem_codigo_construcao){
    h += '<label class="f">Código de construção<select class="t" id="pCod"><option value="">—</option>' +
      CODIGOS.map(c => '<option' + (c === v.codigo_construcao ? ' selected' : '') + '>' + esc(c) + '</option>').join('') +
      '<option value="+"' + (codOutro ? ' selected' : '') + '>Outro…</option></select></label>';
    if (codOutro) h += campoTexto('Qual código', 'pCodOutro', v.codigo_construcao);
    h += campoTexto('Edição / ano do código', 'pEd', v.codigo_edicao, 'placeholder="Ex.: 2010"');
  }
  h += '</div><div class="card"><b>Pressões da plaqueta</b>';
  h += '<label class="f">Unidade como está na plaqueta<div class="seg" id="pUn">' +
    Object.keys(UNID).map(k => '<button data-u="' + k + '" class="' + (k === u ? 'on' : '') + '">' + UNID_ROT[k] + '</button>').join('') + '</div></label>';
  cs.forEach(c => {
    if (cs.length > 1) h += '<p style="margin:14px 0 0;font-weight:700">' + esc(c.nome) + '</p>';
    h += '<div class="lin"><div>' + campoPressao('PMTA', 'pPm_' + c.id, c.pmta_plaqueta_mpa, u) + '</div><div>' +
         campoPressao('PTH (teste)', 'pPt_' + c.id, c.pth_mpa, u) + '</div></div>';
  });
  h += '<p class="muted" style="margin-top:8px">Vaso com casco e tubos? Crie as câmaras em "Operação e câmaras": aqui aparece um par por câmara.</p></div>';
  $('tela').innerHTML = h;
  ligarLugares(v, lugP);
  ligar('pFab', el => {
    if (el.value === '+'){
      janela('Fabricante', '<label class="f">Nome como está na plaqueta<input class="t" id="nfNome"></label>', [{ rotulo:'Cancelar', acao:() => pintar() }, { rotulo:'Usar', classe:'pri', acao:() => {
        const nm = ($('nfNome').value || '').trim(); if (!nm){ U.toast('Escreva o nome.', 'err'); return false; }
        const ex = fabs.find(f => f.nome.trim().toUpperCase() === nm.toUpperCase());
        N.janela.fechar();
        if (ex){ mudouVaso(v, 'fabricante_id', ex.id); v.fabricante = ex.nome; }
        else { v.fabricante = nm; v.fabricante_id = null; delete v._pv.fabricante_id; salvar();
          enfileirar(v, 'fab', 'fabricante', { funcao:'tf_insp_vaso_fabricante', payload:{ p_equip:v.id, p_nome:nm } }); }
        pintar();
      } }]);
      return;
    }
    if (el.value === '__') return;
    const f = fabs.find(x => x.id === el.value);
    v.fabricante = f ? f.nome : null;
    mudouVaso(v, 'fabricante_id', el.value || null);
  });
  ligar('pSerie', el => mudouVaso(v, 'numero_serie', el.value.trim() || null));
  ligar('pFunc', el => {
    if (el.value === '+'){
      janela('Função do vaso', '<label class="f">O que o vaso é<input class="t" id="pfNome" placeholder="Ex.: reservatório de nitrogênio"></label>', [{ rotulo:'Cancelar', acao:() => pintar() }, { rotulo:'Usar', classe:'pri', acao:() => {
        const nm = ($('pfNome').value || '').trim(); if (!nm){ U.toast('Escreva a função.', 'err'); return false; }
        mudouVaso(v, 'funcao', nm); N.janela.fechar(); pintar(); } }]);
      return;
    }
    mudouVaso(v, 'funcao', el.value || null);
  });
  ligar('pPlaca', el => { v.sem_placa = el.value === 'sem'; mudouVaso(v, 'placa_situacao', el.value); pintar(); });   // S148 · item 91
  ligar('pModelo', el => mudouVaso(v, 'modelo', el.value.trim() || null));
  ligar('pAno', el => { const a = numOuAviso(el, 1900, new Date().getFullYear() + 1, 'Ano'); if (a !== undefined) mudouVaso(v, 'ano_fabricacao', a == null ? null : Math.round(a)); });
  ligar('pSemCod', el => { mudouVaso(v, 'sem_codigo_construcao', el.checked); if (el.checked){ mudouVaso(v, 'codigo_construcao', null); } pintar(); });
  ligar('pCod', el => { if (el.value === '+'){ v._codOutro = true; salvar(); pintar(); const o = $('pCodOutro'); if (o){ o.value = ''; o.focus(); } return; } v._codOutro = false; mudouVaso(v, 'codigo_construcao', el.value || null); pintar(); });
  ligar('pCodOutro', el => mudouVaso(v, 'codigo_construcao', el.value.trim() || null));
  ligar('pEd', el => mudouVaso(v, 'codigo_edicao', el.value.trim() || null));
  $('pUn').querySelectorAll('[data-u]').forEach(b => b.addEventListener('click', () => {
    v._unid = b.dataset.u; ativas(v).forEach(c => mudouCam(v, c, 'unidade_campo', b.dataset.u)); salvar(); pintar();
  }));
  cs.forEach(c => {
    ligarPressao('pPm_' + c.id, u, m => mudouCam(v, c, 'pmta_plaqueta_mpa', m), 100, { positivo:true, rot:'PMTA da plaqueta' });   // S171 · issue 41
    ligarPressao('pPt_' + c.id, u, m => mudouCam(v, c, 'pth_mpa', m), 150, { positivo:true, rot:'PTH' });
  });
}

// ── tela 3 · operação e câmaras ────────────────────────────────────────────
function telaOperacao(v){
  titulo('Operação e câmaras', v.tag);
  const u = unidadeDe(v), cs = ativas(v), mats = E.materiais || [];
  let h = '<div class="card"><b>O vaso</b>';
  h += '<label class="f">Posição<div class="seg" id="oPos">' + ['vertical','horizontal'].map(p => '<button data-p="' + p + '" class="' + (v.posicao === p ? 'on' : '') + '">' + p + '</button>').join('') + '</div></label>';
  h += campoNum('Circunferência medida (mm)', 'oCirc', v.circunferencia_mm, 'Com a trena, por fora do costado.');
  h += '<label class="f">Material do costado<select class="t" id="oMat"><option value="">não sei / ver no laudo</option>' +
    mats.map(m => '<option value="' + esc(m.id) + '"' + (m.id === v.material_id ? ' selected' : '') + '>' + esc(m.especificacao + (m.forma ? ' (' + m.forma + ')' : '')) + '</option>').join('') + '</select></label>';
  if (v._matEsc === undefined) v._matEsc = v.material_id || null;   // pacote antigo (antes do TapDoc 7)
  const mSel = mats.find(m => m.id === v.material_id), lf = linhaFaixa(mSel), mEsc = mats.find(m => m.id === v._matEsc);
  h += '<div class="faixa" id="oFaixa"' + (lf ? '' : ' hidden') + '>' + esc(lf) + '</div>';
  h += '<p class="muted" id="oMatEsc" style="margin:6px 0 0">' + (mEsc ? 'Definido pelo escritório: <b>' + esc(mEsc.especificacao + (mEsc.forma ? ' (' + mEsc.forma + ')' : '')) + '</b>'
    : 'O escritório não definiu o material: escolha pela plaqueta ou pelo laudo.') + '</p>';
  if (v._matEsc && v.material_id !== v._matEsc) h += '<p class="alerta" id="oMatCampo" style="margin:6px 0 0">Alterado em campo' + (v._matMotivo ? ': ' + esc(v._matMotivo) : '') + '. O escritório confere.</p>';
  h += '<p class="muted" style="margin-top:10px">A categoria é calculada (veja a prévia do cálculo no painel do vaso). Ninguém escolhe a categoria.</p></div>';
  cs.forEach(c => {
    const conhecido = FLUIDOS.some(f => f[0] === c.fluido);
    h += '<div class="card cam"><div class="ct"><span>' + esc(c.nome) + '</span>';
    if (cs.length > 1) h += '<button class="btn peq perigo" data-rmcam="' + esc(c.id) + '">Tirar</button>';
    h += '</div>';
    if (cs.length > 1 || c.tipo !== 'unica') h += '<label class="f">Tipo<select class="t" data-cam="' + esc(c.id) + '" data-k="tipo">' +
      Object.keys(TIPOS_CAM).map(t => '<option value="' + t + '"' + (t === c.tipo ? ' selected' : '') + '>' + TIPOS_CAM[t] + '</option>').join('') + '</select></label>';
    h += '<label class="f">Fluido<select class="t" data-cam="' + esc(c.id) + '" data-k="fluido_sel"><option value="">—</option>' +
      FLUIDOS.map(f => '<option' + (f[0] === c.fluido ? ' selected' : '') + '>' + esc(f[0]) + '</option>').join('') +
      '<option value="+"' + (c.fluido && !conhecido ? ' selected' : '') + '>Outro…</option></select></label>';
    if (c.fluido && !conhecido || c._outro) h += campoTexto('Qual fluido', 'fl_' + c.id, c.fluido && !conhecido ? c.fluido : '');
    h += '<label class="f">Classe do fluido<div class="seg" data-cls="' + esc(c.id) + '">' + ['A','B','C','D'].map(k => '<button data-c="' + k + '" class="' + (c.classe_fluido === k ? 'on' : '') + '">' + k + '</button>').join('') + '</div></label>';
    h += '<div class="classe">' + (c.classe_fluido ? esc(CLASSES[c.classe_fluido]) : 'Escolha o fluido: a classe é sugerida, você confirma.') + '</div>';
    h += campoPressao('Pressão máx. de operação', 'oP_' + c.id, c.p_operacao_max_mpa, u, 'Manométrica');
    // S140 · item 50 (decisão do Bruno, 10/11): a temperatura só aparece para o vaso que opera acima de 200 °C
    const quente = !!c._quente || Number(c.t_operacao_c) > 200;
    h += '<div class="chk"><input type="checkbox" id="oQ_' + esc(c.id) + '"' + (quente ? ' checked' : '') + '><label for="oQ_' + esc(c.id) + '">Opera acima de 200 °C</label></div>';
    if (quente) h += campoNum('Temperatura de operação (°C)', 'oT_' + c.id, Number(c.t_operacao_c) > 200 ? c.t_operacao_c : null, 'Acima de 200 °C a resistência do aço cai: o engenheiro confere o cálculo no escritório.');
    // S140 · item 44 (decisão do Bruno, 10/11): o volume é sempre em litros no campo; o banco guarda em m³
    if (!c.volume_desconhecido) h += campoNum('Volume (litros)', 'oV_' + c.id, c.volume_m3 != null ? Number(c.volume_m3) * 1000 : null, 'Da plaqueta ou do laudo, em litros. Ex.: 500 litros.') +
      '<div class="conv" id="oV_' + esc(c.id) + '_c">' + (c.volume_m3 != null ? '= ' + fmt(c.volume_m3, 4) + ' m³' : '') + '</div>';
    h += '<div class="chk"><input type="checkbox" id="oVd_' + esc(c.id) + '"' + (c.volume_desconhecido ? ' checked' : '') + '><label for="oVd_' + esc(c.id) + '">Volume desconhecido</label></div>';
    h += '<div class="chk"><input type="checkbox" id="oEx_' + esc(c.id) + '"' + (c.pressao_externa ? ' checked' : '') + '><label for="oEx_' + esc(c.id) + '">Opera com vácuo / pressão externa</label></div>';
    if (c.pressao_externa) h += campoPressao('PMTA externa de plaqueta', 'oPe_' + c.id, c.pmta_externa_plaqueta_mpa, u, 'Se a plaqueta trouxer');
    h += '</div>';
  });
  h += '<button class="btn sec" id="maisCam">+ câmara (casco, tubos ou camisa)</button>';
  $('tela').innerHTML = h;

  $('oPos').querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => { aplicarPosicao(v, b.dataset.p); pintar(); }));
  ligar('oCirc', el => { const x = numOuAviso(el, 1, 100000, 'Circunferência'); if (x !== undefined){ avisarCirc(x); mudouVaso(v, 'circunferencia_mm', x); } });
  ligar('oMat', el => {
    const novo = el.value || null;
    const aplica = motivo => {
      if (motivo){ v._pv.material_motivo = motivo; v._matMotivo = motivo; } else { delete v._pv.material_motivo; v._matMotivo = null; }
      mudouVaso(v, 'material_id', novo); pintar();
    };
    // 406: trocar o material do escritório pede o motivo; voltar a ele (ou vaso sem material) não
    if (!v._matEsc || novo === v._matEsc){ aplica(null); return; }
    janela('Trocar o material do escritório?',
      '<p>O escritório definiu <b>' + esc((mats.find(m => m.id === v._matEsc) || {}).especificacao || 'outro material') + '</b>. Diga por que é diferente em campo.</p>'
      + '<label class="f">Motivo<textarea class="t" id="matMot" placeholder="Ex.: plaqueta indica SA-285 Gr. C">' + esc(v._matMotivo || '') + '</textarea></label>'
      + '<p class="muted">Fotografe a plaqueta (Identificação). O escritório confere a troca.</p>',
      [{ rotulo:'Cancelar', acao:() => { el.value = v.material_id || ''; } },
       { rotulo:'Trocar', classe:'pri', acao:() => { const m = ($('matMot').value || '').trim();
           if (m.length < 5){ U.toast('Escreva o motivo (pelo menos 5 letras).', 'err'); return false; } aplica(m); } }]);
  });
  $('tela').querySelectorAll('[data-cam]').forEach(el => el.addEventListener('change', () => {
    const c = v.camaras.find(x => x.id === el.dataset.cam); if (!c) return;
    if (el.dataset.k === 'tipo'){ mudouCam(v, c, 'tipo', el.value); if (/^(Única|Casco|Tubos|Camisa)$/.test(c.nome)) mudouCam(v, c, 'nome', TIPOS_CAM[el.value]); pintar(); return; }
    if (el.value === '+'){ c._outro = true; pintar(); const o = $('fl_' + c.id); if (o) o.focus(); return; }
    c._outro = false;
    mudouCam(v, c, 'fluido', el.value || null);
    const f = FLUIDOS.find(x => x[0] === el.value);
    if (f) mudouCam(v, c, 'classe_fluido', f[1]);
    pintar();
  }));
  cs.forEach(c => {
    ligar('fl_' + c.id, el => mudouCam(v, c, 'fluido', el.value.trim() || null));
    const seg = document.querySelector('[data-cls="' + c.id + '"]');
    if (seg) seg.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { mudouCam(v, c, 'classe_fluido', b.dataset.c); pintar(); }));
    ligarPressao('oP_' + c.id, u, m => mudouCam(v, c, 'p_operacao_max_mpa', m), 100, { rot:'Pressão máxima de operação' });
    ligar('oQ_' + c.id, el => { c._quente = el.checked; if (!el.checked && c.t_operacao_c != null) mudouCam(v, c, 't_operacao_c', null); else salvar(); pintar(); });
    ligar('oT_' + c.id, el => { const x = numOuAviso(el, 200.1, 1499, 'Temperatura'); if (x !== undefined) mudouCam(v, c, 't_operacao_c', x); });
    const vl = $('oV_' + c.id);
    if (vl) vl.addEventListener('input', () => {   // S172 · issue 40: a linha de conferência diz a dúvida e o volume pequeno
      const r = lerNum(vl.value), x = r.v, cv = $('oV_' + c.id + '_c');
      cv.style.color = r.ambiguo || (x > 0 && x < VOL_MIN_AVISO) ? 'var(--warn)' : '';
      cv.textContent = r.ambiguo ? '“' + r.texto + '”: ' + r.milhar + ' litros ou ' + String(r.decimal).replace('.', ',') + ' litro? Ao sair do campo, escolha.'
        : x != null && !Number.isNaN(x) && x > 0 ? '= ' + fmt(x / 1000, 4) + ' m³' + (x < VOL_MIN_AVISO ? ' · muito pouco para um vaso de pressão: confira' : '') : '';
    });
    ligar('oV_' + c.id, el => {
      const x = numOuAviso(el, 1, 100000000, 'Volume (litros)', 'abaixo de 1 litro não é volume de vaso; o volume é em litros (mil litros = 1000)'); if (x === undefined) return;
      if (x != null && x > 50000) U.toast('Confira: ' + Math.round(x).toLocaleString('pt-BR') + ' litros (' + fmt(x / 1000, 1) + ' m³) é um vaso muito grande. O volume é em litros.');
      if (x != null && x < VOL_MIN_AVISO) U.toast('Confira: ' + fmt(x, 1) + ' litro' + (x >= 2 ? 's' : '') + ' é muito pouco para um vaso de pressão. O volume é em litros (mil litros = 1000).');   // S172 · issue 40
      mudouCam(v, c, 'volume_m3', x == null ? null : Math.round(x * 10) / 10000);
    });
    ligar('oVd_' + c.id, el => { mudouCam(v, c, 'volume_desconhecido', el.checked); if (el.checked) c.volume_m3 = null; pintar(); });
    ligar('oEx_' + c.id, el => { mudouCam(v, c, 'pressao_externa', el.checked); if (!el.checked) c.pmta_externa_plaqueta_mpa = null; pintar(); });
    ligarPressao('oPe_' + c.id, u, m => mudouCam(v, c, 'pmta_externa_plaqueta_mpa', m), 100, { positivo:true, rot:'PMTA externa' });   // S171 · issue 41
  });
  $('tela').querySelectorAll('[data-rmcam]').forEach(b => b.addEventListener('click', () => {
    const c = v.camaras.find(x => x.id === b.dataset.rmcam);
    if (compsAtivos(v).some(x => x.camara_id === c.id)){ U.toast('Esta câmara tem componentes. Mude-os de câmara antes (em Componentes).', 'err'); return; }
    N.janela.confirmar('Tirar a câmara ' + c.nome + '?', '', 'Tirar', true).then(s => { if (s){ mudouCam(v, c, 'ativo', false); pintar(); } });
  }));
  $('maisCam').addEventListener('click', () => {
    janela('Nova câmara', '<p class="muted">Trocador de calor: casco e tubos. Vaso encamisado: a câmara interna e a camisa.</p><div class="seg" id="ncT">' +
      ['casco','tubo','camisa'].map(t => '<button data-t="' + t + '">' + TIPOS_CAM[t] + '</button>').join('') + '</div>', [{ rotulo:'Cancelar' }]);
    document.querySelectorAll('#ncT [data-t]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.t;
      // trocador: a câmara "única" vira o casco (os tampos dela continuam com ela)
      const un = ativas(v).find(x => x.tipo === 'unica');
      if (un && t === 'tubo'){ mudouCam(v, un, 'tipo', 'casco'); mudouCam(v, un, 'nome', 'Casco'); }
      const c = { id:uid(), tipo:t, nome:TIPOS_CAM[t], ordem:v.camaras.length + 1, ativo:true, volume_desconhecido:false, pressao_externa:false, unidade_campo:unidadeDe(v) };
      v.camaras.push(c); salvar(); gravarCamara(v, c);
      N.janela.fechar(); pintar();
    }));
  });
}

// ── tela 4 · componentes ───────────────────────────────────────────────────
// S80 · R03b · a geometria de cada componente. Em branco vale o padrão da
// memória de cálculo (pendência 2, a validar pelo Fernando):
//   R = circunferência ÷ 2π (raio EXTERNO: conservador) · torisférico L = D ·
//   hemisférico L = R · tampo plano d = D, C = 0,33 · janela C = 0,33 ·
//   E = 0,70 no costado e no cone, 1,0 nos tampos (o inspetor escolhe).
const GEO_CAMPOS = { costado:['R'], eliptico:['R'], conico:['R','alfaGraus'], torisferico:['L'], hemisferico:['L'], plano:['d','C'], janela:['d','C'] };
const GEO_COL = { R:'r_mm', L:'l_mm', d:'d_mm', C:'fator_c', alfaGraus:'alfa_graus', E:'eficiencia_junta' };
const GEO_ROT = { R:'R · raio (mm)', L:'L · raio da coroa (mm)', d:'d · diâmetro (mm)', C:'C · fator', alfaGraus:'α · semiângulo (°)' };
function geoPadrao(v, c){
  const rx = v.circunferencia_mm > 0 ? v.circunferencia_mm / (2 * Math.PI) : null;
  const p = { E: (c.tipo === 'costado' || c.tipo === 'conico') ? 0.7 : 1 };
  if (rx){
    if (['costado','eliptico','conico'].indexOf(c.tipo) >= 0) p.R = rx;
    if (c.tipo === 'torisferico') p.L = 2 * rx;
    if (c.tipo === 'hemisferico') p.L = rx;
    if (c.tipo === 'plano') p.d = 2 * rx;
  }
  if (c.tipo === 'plano' || c.tipo === 'janela') p.C = 0.33;
  return p;
}
/** A geometria que o motor usa: o informado ou o padrão. `padrao` lista o que veio do padrão. */
function geoDe(v, c){
  const p = geoPadrao(v, c), g = { tipo:c.tipo, nome:c.nome, id:c.id, aparafusada:c.aparafusada === true, padrao:[] };
  (GEO_CAMPOS[c.tipo] || []).concat(['E']).forEach(k => {
    const x = c[GEO_COL[k]];
    // S112 · C1: o raio R sai SEMPRE da circunferência (ninguém o digita em campo); a eficiência E vem do escritório
    if (k !== 'R' && x != null && x !== '') g[k] = Number(x);
    else if (p[k] != null){ g[k] = p[k]; g.padrao.push(k); }
    else if (k === 'R' && x != null && x !== '') g[k] = Number(x);   // sem circunferência: o que já estava gravado
  });
  return g;
}
function campoGeo(v, c){
  const p = geoPadrao(v, c), id = esc(c.id);
  // S112 · C1: E (eficiência da junta) e R (raio) saem da tela de campo
  const campos = (GEO_CAMPOS[c.tipo] || []).filter(k => k !== 'R');
  let h = campos.length ? '<div class="lin">' : '';
  campos.forEach((k, n) => {
    if (n && n % 2 === 1) h += '</div><div class="lin">';
    const val = c[GEO_COL[k]];
    h += '<label class="f">' + GEO_ROT[k] + '<input class="t" inputmode="decimal" data-geo="' + id + '" data-g="' + k + '" value="' + esc(val == null ? '' : fmt(val, 3)) +
      '" placeholder="' + (p[k] != null ? 'padrão ' + fmt(p[k], k === 'C' ? 2 : 1) : (k === 'd' && c.tipo === 'janela' ? 'medir' : '—')) + '"></label>';
  });
  if (campos.length) h += '</div>';
  if (c.tipo === 'janela') h += '<div class="chk"><input type="checkbox" id="ap_' + id + '"' + (c.aparafusada ? ' checked' : '') + '><label for="ap_' + id + '">Tampa aparafusada</label></div>';
  if (c.tipo === 'conico' && !(c.alfa_graus > 0)) h += '<div class="conv" style="color:var(--warn)">O cone precisa do semiângulo α (até 30°).</div>';
  return h;
}
function ligarGeo(v){
  const lim = { R:[1, 20000], L:[1, 40000], d:[1, 40000], C:[0.1, 1], alfaGraus:[0.1, 30] };
  $('tela').querySelectorAll('[data-geo]').forEach(el => el.addEventListener('change', () => {
    const c = v.componentes.find(x => x.id === el.dataset.geo); if (!c) return;
    const k = el.dataset.g;
    if (k === 'E'){ mudouComp(v, c, 'eficiencia_junta', el.value ? Number(el.value) : null); return; }
    const x = numOuAviso(el, lim[k][0], lim[k][1], GEO_ROT[k].split(' ·')[0]);
    if (x !== undefined) mudouComp(v, c, GEO_COL[k], x);
  }));
  compsAtivos(v).forEach(c => ligar('ap_' + c.id, el => mudouComp(v, c, 'aparafusada', el.checked)));
}

    '<ellipse cx="20" cy="47" rx="12" ry="7" fill="' + cor('inferior') + '"/><rect x="8" y="13" width="24" height="34" fill="' + cor('costado') + '"/><circle cx="20" cy="30" r="4" fill="' + jan + '"/></svg>';

const COR_COMP = c => c.tipo === 'costado' ? '#1B6FA9' : c.tipo === 'janela' ? '#78838A' : c.tipo === 'conico' ? '#8A5A12' : '#1E7A42';

function cartoesComp(v){
  const fora = v._tirando || {}, cs = ativas(v), out = [];
  const comps = compsAtivos(v).filter(c => !fora[c.id]).sort(ordemMedicao(v));   // S148 · item 85: a ordem do medidor
  cs.forEach(k => {
    const regs = comps.filter(c => c.tipo === 'costado' && camIdDe(v, c) === k.id);
    if (regs.length) out.push({ chave:'costado:' + k.id, cam:k, c:regs[0], regs });
    comps.filter(c => c.tipo !== 'costado' && camIdDe(v, c) === k.id).forEach(c => out.push({ chave:c.id, cam:k, c }));
  });
  comps.filter(c => !camIdDe(v, c)).forEach(c => out.push({ chave:c.id, cam:null, c, regs:c.tipo === 'costado' ? [c] : null }));

// S152 · issue 7 (decisão 8): "Medidas do vaso" — tudo o que o inspetor mede com a trena, num lugar só. Nada aqui é obrigatório

    .forEach(c => r.push({ rot:'a altura do ' + String(c.nome || 'tampo').toLowerCase(), sel:'#mvAlt_' + c.id }));
  return r;

/** TapDoc 32 · issue 221: o selo "faltam N medidas" acompanha o que se digita (sem redesenhar a tela). */

function novaRegiao(v, camId, pos, nome){
  const regs = regioesDe(v, camId), base = regs[0];
  // o costado único ainda sem região e sem leitura vira a primeira região escolhida
  if (regs.length === 1 && !base.posicao && !siglaReg(base) && !leiturasDe(v, base.id).length){
    mudouComp(v, base, 'posicao', pos); mudouComp(v, base, 'nome', nome || 'Costado ' + REGIOES[pos][0]); pintar(); return;
  }
  const c = Object.assign({ id:uid(), tipo:'costado', posicao:pos, nome:nome || 'Costado ' + REGIOES[pos][0], nao_medir:false, ordem:(base ? base.ordem : 1) || 1, ativo:true },
    base ? pegar(base, ['r_mm','eficiencia_junta','material_id']) : {}, { camara_id:camId || (ativas(v)[0] || {}).id });
  if (base && base.nao_medir) c.nao_medir = true;

/** Tira o componente de vez: primeiro as leituras e o motivo (o banco só aceita leitura de componente ativo), depois as fotos e o componente. */
function apagarComp(v, c){
  const i = v.inspecao;
  if (leiturasDe(v, c.id).length){ i.leituras = i.leituras.filter(x => x.componente_id !== c.id); gravarLeituras(v, c); }
  if (semLeitura(v)[c.id] !== undefined){ const s2 = Object.assign({}, semLeitura(v)); delete s2[c.id]; i.ultrassom_sem_leitura = s2; gravarUS(v); }
  (i.fotos || []).filter(f => f.item_ref === c.id).forEach(f => {
    const ainda = N.fila.listar({ tipo:'insp', grupo:'insp|' + v.id }).find(e => e.id === 'foto~' + f.id);
    if (ainda) N.fila.descartar(ainda.assinatura); else enfileirar(v, 'fotorem-' + f.id, 'tirar foto', { funcao:'tf_insp_foto_remover', payload:{ p_id:f.id } }, null, true);

    const aqui = () => telaAtual.nome === 'localizacao' && telaAtual.vaso === v.id;
    navigator.geolocation.getCurrentPosition(async p => {
      const prec = p.coords.accuracy != null ? Math.round(p.coords.accuracy * 10) / 10 : null;

      if (v.latitude != null && v.gps_precisao_m != null && prec != null && prec > v.gps_precisao_m

        if (aqui()) pintar(); return;
      }
      v.latitude = Math.round(p.coords.latitude * 1e6) / 1e6; v.longitude = Math.round(p.coords.longitude * 1e6) / 1e6;
      v.gps_precisao_m = prec; salvar();
      enfileirar(v, 'gps', 'GPS', { funcao:'tf_insp_gps_gravar', payload:{ p_equip:v.id, p_lat:v.latitude, p_lon:v.longitude, p_precisao:v.gps_precisao_m } });

      if (aqui()) pintar(); else U.toast('GPS do ' + v.tag + ' guardado.');
    }, e => {
      if (!aqui()) return;
      const b = $('lGps'); if (b){ b.disabled = false; b.textContent = 'Capturar o GPS'; }
      U.toast(e && e.code === 1 ? 'O GPS foi negado. Libere a localização para o navegador.' : 'Não consegui o GPS agora. Tente ao ar livre.', 'err');
    }, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
  });
}

  ligar('afPad', el => { af.padrao_id = el.value || null; LS.set('tfdoc_af_pad', af.padrao_id); mudou(true); });
  ligar('afBan', el => { af.bancada_id = el.value || null; if (af.bancada_id) LS.set(chaveBan(af.tipo), af.bancada_id); mudou(true); });   // TapDoc 35 · issue 243
  ligar('afUn', el => { af.unidade = el.value; mudou(true); });
  aoDigitar('afLc', el => { af.lacre_colocado = el.value.trim() || null; mudou(false); });   // item 59: o resultado vê o lacre na hora
  if (vv){
    ligar('afReaj', el => { af.leituras.reajustada = el.checked; if (!el.checked) af.leituras.encontrada = null; mudou(true); });   // S150 · V2
    aoDigitar('afEnc', el => { af.leituras.encontrada = n(el.value); mudou(false); });
    aoDigitar('afMotAc', el => { af.leituras.motivo_acima = el.value.trim() || null; mudou(false); });
    aoDigitar('afMotAb', el => { af.leituras.motivo_abaixo = el.value.trim() || null; mudou(false); });
    [0, 1, 2].forEach(k => aoDigitar('afAb' + k, el => { af.leituras.aberturas[k] = n(el.value); mudou(false); }));
    [0, 1, 2].forEach(k => aoDigitar('afAs' + k, el => { af.leituras.assentamentos[k] = n(el.value); mudou(false); }));
    encadear(['afEnc', 'afAb0', 'afAs0', 'afAb1', 'afAs1', 'afAb2', 'afAs2', 'afLc'].map($).filter(Boolean));   // item 54
  } else {
    const es = af.leituras.escala || (af.leituras.escala = {});
    aoDigitar('afIni', el => { af.faixa_ini = n(el.value); mudou(false); });
    aoDigitar('afFim', el => { af.faixa_fim = n(el.value); mudou(false); });
    aoDigitar('afRes', el => { af.resolucao = n(el.value); mudou(false); });
    aoDigitar('afGr', el => { es.graduacoes = n(el.value); mudou(false); });
    aoDigitar('afUi', el => { es.uti_ini = n(el.value); mudou(false); });
    aoDigitar('afUf', el => { es.uti_fim = n(el.value); mudou(false); });
    // item 54: o "Próximo" vai de "Indicado" em "Indicado", na ordem do ensaio (a coluna "Padrão" fica fora; toca-se nela para mudar)
    encadear(Array.from($('tela').querySelectorAll('[data-c="indicado"]')).concat([$('afLc')]).filter(Boolean));
    // S173 · issue 46: os pontos que saem levam as leituras deles: com leitura, pergunta antes ("Gerar mesmo assim?")
    const pts = async lista => {
      const velhos = af.leituras.pontos || [];
      const saem = velhos.filter(p => lista.indexOf(Number(p.nominal)) < 0 && (p.leituras || []).some(l => l && l.indicado != null));
      if (saem.length && !(await N.janela.confirmar('Gerar os pontos de novo?', '<p>Isso apaga as leituras de <b>' + saem.length + ' ponto' + (saem.length > 1 ? 's' : '')
          + '</b> (' + esc(saem.map(p => fmt(p.nominal)).join(' · ')) + ' ' + esc(UN_AF_ROT[af.unidade || 'bar']) + '). Gerar mesmo assim?</p>', 'Gerar e apagar', true))) return;
      const novos = lista.map(x => velhos.find(p => Number(p.nominal) === x) || { nominal:x, leituras:[] });
      // as leituras conferidas ("Está certa", issue 23) usam a posição do ponto: acompanham o ponto que fica
      const conf = af.leituras.conferidas;
      if (conf && conf.length) af.leituras.conferidas = conf.map(ch => { const [k, ...r] = String(ch).split(':'), p = velhos[Number(k)], n = p ? novos.indexOf(p) : -1;
        return n >= 0 ? [n].concat(r).join(':') : null; }).filter(Boolean);
      af.leituras.pontos = novos;
      mudou(true);
    };
    // C4: "Gerar os pontos da aferição" — a quantidade de graduações divide a escala de utilização (início + k × passo, k = 1..graduações)
    ligar('afGerar', () => {
      const ui = es.uti_ini == null ? af.faixa_ini : es.uti_ini, uf = es.uti_fim == null ? af.faixa_fim : es.uti_fim, g = es.graduacoes;
      if (ui == null || uf == null || !(uf > ui)){ U.toast('Informe a escala de utilização (início e fim).', 'err'); return; }
      if (g == null || !Number.isInteger(g) || g < 1 || g > 20){ U.toast('A quantidade de graduações deve ser um número inteiro de 1 a 20.', 'err'); return; }
      es.uti_ini = ui; es.uti_fim = uf;
      const passo = (uf - ui) / g, lista = [];
      for (let k = 1; k <= g; k++) lista.push(Number((ui + k * passo).toFixed(6)));
      pts(lista);
    }, 'click');
    // itens 55 e 59: gravar sem redesenhar — o campo em que se digita não some nem muda de lugar
    pintarSuspeitas(af, () => { salvar(); adiarAf('af:' + af.id, v, a, af); });   // S162 · issue 23: ao abrir a tela
    $('tela').querySelectorAll('[data-pp]').forEach(el => el.addEventListener('input', () => {
      const p = af.leituras.pontos[Number(el.dataset.pp)], k = Number(el.dataset.n);
      p.leituras = p.leituras || [];
      for (let j = 0; j < 6; j++) if (!p.leituras[j]) p.leituras[j] = { sentido:j < 3 ? 'carga' : 'descarga', padrao:Number(p.nominal), indicado:null };
      p.leituras[k][el.dataset.c] = n(el.value);
      // S162 · issue 23: mudou a leitura, a confirmação dela não vale mais
      if (af.leituras.conferidas) af.leituras.conferidas = af.leituras.conferidas.filter(y => y !== el.dataset.pp + ':' + k && y !== el.dataset.pp + ':' + k + ':p');
      mudou(false);
    }));
  }
}

    document.querySelectorAll('#naT [data-t]').forEach(x => x.addEventListener('click', () => { novoAcess(v, { tipo:x.dataset.t }); N.janela.fechar(); pintar(); }));
