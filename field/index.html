// ════════════════════════════════════════════════════════════════════════════
// S31 · (Manager S61) CONCLUIR O "AGENDAR SERVIÇO" PELO CELULAR
// ----------------------------------------------------------------------------
// A etapa com `requisitos.agenda` (a T03 da inspeção) só conclui com a
// execução agendada: quem executa, o dia, a hora e o tempo (em horas e
// minutos), com a prévia dos dias que ela ocupa — a conta é do banco
// (`tf_agenda_distribuir`), a mesma do Manager. Grava e conclui de uma vez
// (`tf_concluir_agendamento`). Sem sinal, NÃO grava (e diz).
// ════════════════════════════════════════════════════════════════════════════
const pedeAgenda = t => !!(t && t.requisitos && t.requisitos.agenda && t.requisitos.agenda.tarefa);
const AG_SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const agDiaTxt = iso => { const d = new Date(iso + 'T12:00'); return AG_SEM[d.getDay()] + ' ' + dataBR(iso).slice(0, 5); };

async function telaAgendar(t){
  const { os, tarefas } = atual;
  const spec = t.requisitos.agenda;
  const a = (tarefas || []).find(x => x.tarefa_id === spec.tarefa) || {};
  let pessoas = [];
  if (!DEMO){
    try{ pessoas = await rpc('tf_pessoas_para_tarefa', { p_os_id: os.os_id, p_tarefa_id: spec.tarefa }) || []; }
    catch(e){ toast(semRede(e) ? 'Sem sinal — o agendamento precisa de internet.' : e.message, 'err'); return; }
  }
  await carregarNomes();
  const min = Number(a.tempo_estimado_min || 0);
  const ov = document.createElement('div');
  ov.className = 'agSheet';
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = '<div class="agSheetC">'
    + '<div class="agSheetH"><b>Agendar e concluir</b><button type="button" class="agX" aria-label="Voltar">✕</button></div>'
    + '<p class="agNota">Marque <b>' + esc(spec.rotulo || a.nome || 'a execução') + '</b> na agenda de quem vai: '
    +   'dia, hora e quanto tempo. A ART e o TapDoc saem com essa data.</p>'
    + '<div class="campo"><label for="agU">Quem executa</label><select id="agU"><option value="">— escolha —</option>'
    +   pessoas.map(u => '<option value="' + esc(u.usuario_id) + '"'
          + (String(u.usuario_id) === String(a.usuario_designado || meuId() || '') ? ' selected' : '') + '>'
          + esc(u.nome) + '</option>').join('') + '</select></div>'
    + '<div class="agDupla"><div class="campo"><label for="agD">Dia de início</label><input id="agD" type="date" value="' + esc(a.data_prevista || '') + '"></div>'
    +   '<div class="campo"><label for="agH">Hora</label><input id="agH" type="time" step="300" value="' + esc(String(a.hora_inicio || '').slice(0, 5)) + '"></div></div>'
    + '<div class="campo"><label for="agTh">Tempo</label><div class="agT">'
    +   '<input id="agTh" type="number" min="0" max="1000" inputmode="numeric" aria-label="horas" value="' + (min ? Math.floor(min / 60) : '') + '"><span>h</span>'
    +   '<input id="agTm" type="number" min="0" step="5" inputmode="numeric" aria-label="minutos" value="' + (min ? min % 60 : '') + '"><span>min</span>'
    +   '<span class="agTot" id="agTt"></span></div></div>'
    + '<label class="check"><input type="checkbox" id="agF"' + (a.usa_fds ? ' checked' : '') + '> usar fim de semana e feriado</label>'
    + '<div class="agPrev" id="agP" aria-live="polite"></div>'
    + '<details class="agAp"><summary>Quem vai junto <small>(opcional)</small></summary>'
    +   Object.keys(NOMES).sort((x, y) => NOMES[x].localeCompare(NOMES[y])).map(id => '<label class="check" data-u="' + esc(id) + '">'
          + '<input type="checkbox" class="agApC" value="' + esc(id) + '"' + ((a.apoios || []).map(String).indexOf(String(id)) >= 0 ? ' checked' : '') + '> '
          + esc(NOMES[id]) + '</label>').join('') + '</details>'
    + '<div class="campo"><label for="agO">Observação <small>(opcional)</small></label><textarea id="agO" rows="2"></textarea></div>'
    + '<div class="agMsg" id="agMsg" role="alert"></div>'
    + '<button type="button" class="btn pri" id="agOk">Agendar e concluir</button>'
    + '<button type="button" class="btn" id="agVolta">Voltar</button>'
    + '</div>';
  document.body.appendChild(ov);
  const $ = id => ov.querySelector('#' + id);
  const fechar = () => ov.remove();
  ov.querySelector('.agX').addEventListener('click', fechar);
  $('agVolta').addEventListener('click', fechar);
  const ler = () => {
    const tot = Math.round(Number($('agTh').value || 0) * 60 + Number($('agTm').value || 0));
    return { quem: $('agU').value || null, dia: $('agD').value || null, hora: $('agH').value || null,
             minutos: tot > 0 ? tot : null, fds: $('agF').checked };
  };
  let seq = 0, tmr = null;
  const prev = async () => {
    const v = ler(), box = $('agP');
    $('agTt').textContent = v.minutos ? '= ' + v.minutos.toLocaleString('pt-BR') + ' min' : '';
    const n = ++seq;
    if (!v.dia || !v.minutos){ box.innerHTML = '<span class="agNota">Escolha o dia e o tempo para ver os dias que ocupa.</span>'; return; }
    if (DEMO){ box.innerHTML = '<span class="agNota">Modo demonstração: os dias vêm do banco.</span>'; return; }
    try{
      const r = await rpc('tf_agenda_distribuir', { p_dia: v.dia, p_hora: v.hora, p_minutos: v.minutos, p_fds: v.fds });
      if (n !== seq) return;
      const ds = (r && r.dias) || [], pul = (r && r.pulados) || [];
      const ls = ds.map(d => ({ dia: d.dia, h: '<li><b>' + esc(agDiaTxt(d.dia)) + '</b>'
          + (v.hora ? ' ' + esc(d.hora_ini) + '–' + esc(d.hora_fim) : '') + '<span>' + esc(minHora(d.minutos)) + '</span></li>' }))
        .concat(pul.map(x => ({ dia: x.dia, h: '<li class="pul">' + esc(agDiaTxt(x.dia)) + ' — ' + esc(x.motivo) + '</li>' })))
        .sort((p, q) => p.dia < q.dia ? -1 : 1);
      box.innerHTML = '<div>' + (ds.length > 1 ? 'Ocupa <b>' + ds.length + ' dias</b> · termina <b>' + esc(agDiaTxt(r.fim_dia))
          + (v.hora ? ' às ' + esc(r.fim_hora) : '') + '</b>' : '<b>Um dia</b>' + (v.hora ? ' · termina às <b>' + esc(r.fim_hora) + '</b>' : '')) + '</div>'
        + '<ul>' + ls.map(x => x.h).join('') + '</ul>';
    }catch(e){ if (n === seq) box.textContent = semRede(e) ? 'Sem sinal — a prévia volta quando conectar.' : e.message; }
  };
  ['agD','agH','agTh','agTm','agF'].forEach(id => ['input','change'].forEach(ev =>
    $(id).addEventListener(ev, () => { $('agMsg').textContent = ''; clearTimeout(tmr); tmr = setTimeout(prev, 300); })));
  $('agU').addEventListener('change', () => { $('agMsg').textContent = ''; });
  $('agTm').addEventListener('blur', () => {
    const m = Number($('agTm').value || 0);
    if (m >= 60){ $('agTh').value = Number($('agTh').value || 0) + Math.floor(m / 60); $('agTm').value = m % 60; prev(); }
  });
  const esconde = () => ov.querySelectorAll('.agAp label').forEach(l => {
    const dono = l.dataset.u === $('agU').value; l.hidden = dono;
    if (dono) l.querySelector('input').checked = false;
  });
  $('agU').addEventListener('change', esconde); esconde();
  prev();
  $('agOk').addEventListener('click', async () => {
    const v = ler(), msg = $('agMsg');
    const falta = [!v.quem && 'quem executa', !v.dia && 'o dia', !v.hora && 'a hora', !v.minutos && 'o tempo'].filter(Boolean);
    if (falta.length){ msg.textContent = 'Falta ' + falta.join(', ') + '.'; return; }
    const apoios = [...ov.querySelectorAll('.agApC:checked')].map(c => c.value).filter(x => x !== v.quem);
    $('agOk').disabled = true;
    try{
      if (DEMO){ fechar(); demoAgir(os.os_id, t.tarefa_id, 'concluir'); toast('Modo demonstração: agendamento não é gravado.', 'ok'); abrirOS(os); return; }
      const r = await rpc('tf_concluir_agendamento', { p_os_id: os.os_id, p_tarefa_id: t.tarefa_id,
        p_dia: v.dia, p_hora: v.hora, p_minutos: v.minutos, p_usuario: v.quem, p_apoios: apoios, p_fds: v.fds,
        p_observacao: ($('agO').value || '').trim() || null });
      fechar();
      const ag = (r && r.agenda) || {};
      await carregar(true);
      toast('Agendado: ' + agDiaTxt(v.dia) + ' às ' + v.hora + (ag.ate && ag.ate !== v.dia ? ' até ' + agDiaTxt(ag.ate) : '')
        + ' com ' + (ag.usuario || 'o inspetor') + '.', 'ok');
      const novo = listaOS.find(x => x.os_id === os.os_id);
      if (novo) abrirOS(novo); else pintarLista();
    }catch(e){
      msg.textContent = semRede(e) ? 'Sem sinal — o agendamento NÃO foi gravado. Tente de novo quando conectar.' : e.message;
      $('agOk').disabled = false;
    }
  });
  setTimeout(() => $('agU').focus(), 50);
}

/** As marcas do "Hoje": a hora (quando a tarefa tem hora) e "dia N de M". */
function chipsQuando(t){
  const c = [];
  if (t.hora && t.origem !== 'visita') c.push('<span class="chip">' + esc(t.hora) + (t.hora_fim ? '–' + esc(t.hora_fim) : '') + '</span>');
  if (Number(t.dias_total) > 1) c.push('<span class="chip eu">dia ' + Number(t.dia_n) + ' de ' + Number(t.dias_total) + '</span>');
  return c;
}

// ════════════════════════════════════════════════════════════════════════════
// S15 · ITEM 1 DO S41 — "ASSUMIR" NO APP DE CAMPO
// ----------------------------------------------------------------------------
// O S38 pôs o "assumir" no Manager (lista de tarefas da OS e Agenda) e deixou o
// Field de fora — e é justamente no Field que o Filipe está quando o Gabriel
// liga dizendo que não vai. O banco já aceitava (tf_assumir_tarefa, 58_):
//   · pendente / em andamento → a tarefa passa para quem assumiu, com a
//     fechadura de 8 h;
//   · bloqueada → SÓ o nome muda; ela continua esperando a etapa anterior.
// "Substitui, não soma": quem estava sai (o apoio que assume troca de papel
// com o dono, regra do S36). A troca vai para o histórico da OS.
// ════════════════════════════════════════════════════════════════════════════
let NOMES = {};
async function carregarNomes(){
  if (DEMO || Object.keys(NOMES).length) return;
  try{ (await get('usuarios?select=id,nome') || []).forEach(u => { NOMES[u.id] = u.nome; }); }
  catch(e){ /* sem nome, a tela diz "outra pessoa" */ }
}
function meuId(){
  try{
    const p = String(sessao.token || '').split('.')[1] || '';
    return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/'))).sub || null;
  }catch(e){ return null; }
}
const nomeDe = id => (id && NOMES[id]) || (id ? 'outra pessoa' : null);
const lockVivo = t => !!t.lock_por && (!t.lock_expira || new Date(t.lock_expira) > new Date());
/** A MESMA conta do banco: não resolvida, não é minha, e o meu perfil está em
 *  "quem faz" (ou a tarefa não nomeia perfil, ou sou admin). */
function possoAssumir(t){
  if (!t || DEMO) return false;
  if (t.status === 'completo' || t.status === 'dispensado') return false;
  if (t.usuario_designado && String(t.usuario_designado) === String(meuId())) return false;
  if (sessao.admin) return true;
  const ps = t.perfis_responsaveis || [];
  return !ps.length || ps.includes(sessao.perfil);
}
/** Confirma (o celular não tem hover: o nome de quem sai vai no texto) e assume.
 *  `forcar`: tomar o lugar de quem está com a fechadura — o "combinamos por
 *  telefone". O banco aceita de quem está em "quem faz". */
async function assumirNoCampo(t, botao, osId){
  osId = osId || (atual && atual.os && atual.os.os_id);
  const dono = t.usuario_designado && String(t.usuario_designado) !== String(meuId()) ? nomeDe(t.usuario_designado) : null;
  const bloq = !(t.status === 'pendente' || t.status === 'em_andamento');
  const souApoio = (t.apoios || []).some(a => String(a) === String(meuId()));
  const txt = (dono ? '"' + t.nome + '" está com ' + dono + '.\n\nAo assumir, você passa a ser o responsável'
                      + (souApoio ? ' e ' + dono + ' vira o apoio (vocês trocam de papel).' : ' e ' + dono + ' sai da tarefa.')
                    : 'Assumir "' + t.nome + '"?')
    + (bloq ? '\n\nEla continua bloqueada até a etapa anterior fechar — só o seu nome entra nela.' : '')
    + '\n\nA troca fica no histórico da OS.';
  if (!confirm(txt)) return;
  if (botao) botao.disabled = true;
  try{
    const r = await rpc('tf_assumir_tarefa', { p_os_id: osId, p_tarefa_id: t.tarefa_id, p_forcar: true });
    if (r && r.status === 'recusado')
      throw new Error(r.motivo === 'perfil_nao_autorizado'
        ? 'Esta etapa é de ' + ((r.perfis||[]).join(' ou ') || 'outro perfil') + '.'
        : 'O servidor recusou (' + (r.motivo || '?') + (r.status_atual ? ', a tarefa está ' + r.status_atual : '') + ').');
    toast(r && r.so_designacao ? 'Assumida — o seu nome já está nela; ela abre quando a etapa anterior fechar.'
                               : 'Assumida — agora a tarefa é sua.', 'ok');
    await carregar(true);
    if (tela === 'os' && atual && atual.os){
      const novo = listaOS.find(x => x.os_id === atual.os.os_id) || atual.os;
      abrirOS(novo);
    }
  }catch(e){ toast(e.message, 'err'); if (botao) botao.disabled = false; }
}

/* S15 · as tarefas do MEU perfil que o escritório escalou para um COLEGA,
   de 3 dias atrás a 14 dias à frente — em qualquer OS, inclusive as que ainda
   estão no escritório (e por isso não aparecem na lista do campo) e as
   BLOQUEADAS. É daqui que o Filipe pega a inspeção do Gabriel sem abrir a
   Gestão. Vem de v_agenda_itens (a mesma fonte da Agenda do Manager), só a
   linha do DONO. Começa fechado: é exceção, não rotina. */
let ESCALADAS = [];
async function carregarEscaladas(){
  if (DEMO || !sessao.perfil){ ESCALADAS = []; return; }
  const eu = meuId();
  const hoje = isoHojeF();
  const d = n => { const x = new Date(Date.now() + n*864e5);
    return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
  try{
    const r = await get('v_agenda_itens?select=os_id,os_numero,cliente,tarefa_id,tarefa,status,dia,usuario_id,usuario,'
      + 'perfis_responsaveis,apoios,fase_rotulo&origem=eq.os&papel=eq.principal'
      + '&perfis_responsaveis=cs.%7B' + encodeURIComponent(sessao.perfil) + '%7D'
      + (eu ? '&usuario_id=neq.' + eu : '') + '&dia=gte.' + d(-3) + '&dia=lte.' + d(14) + '&order=dia,os_numero');
    ESCALADAS = (r || []).filter(x => !(x.apoios || []).some(a => String(a) === String(eu)));
  }catch(e){ ESCALADAS = []; }
}
function painelEscaladas(){
  if (!ESCALADAS.length) return null;
  const det = document.createElement('details');
  det.className = 'painel';
  det.innerHTML = '<summary style="cursor:pointer;font-weight:600;font-size:14.5px">Do seu perfil, com colegas · '
    + ESCALADAS.length + '</summary>'
    + '<p style="font-size:13px;color:var(--ink-3);margin:8px 0 4px">Tarefas que o seu perfil faz e que o escritório '
    + 'marcou para outra pessoa. Se combinaram de você ir no lugar, assuma aqui.</p>';
  ESCALADAS.forEach(x => {
    const d = document.createElement('div');
    d.className = 'etapa';
    d.innerHTML = '<b></b><small></small>';
    d.querySelector('b').textContent = x.tarefa;
    d.querySelector('small').textContent = [x.os_numero, x.cliente].filter(Boolean).join(' · ')
      + ' · ' + dataBR(x.dia) + ' · com ' + (x.usuario || 'outra pessoa')
      + ((x.status === 'bloqueado' || x.status === 'condicional') ? ' · ainda não liberada' : '');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn sm';
    b.textContent = 'Assumir no lugar de ' + (x.usuario || 'outra pessoa');
    b.addEventListener('click', () => assumirNoCampo({ tarefa_id:x.tarefa_id, nome:x.tarefa, status:x.status,
      usuario_designado:x.usuario_id, apoios:x.apoios || [] }, b, x.os_id));
    d.appendChild(b);
    det.appendChild(d);
  });
  return det;
}
/** As etapas desta OS que o MEU perfil faz, com quem está cada uma e o botão
 *  de assumir — inclusive as bloqueadas (a troca é hoje, a inspeção amanhã). */
function painelEtapas(){
  const { os, tarefas } = atual;
  // Bloqueada SEM responsável fica de fora: ninguém escalou ninguém, e uma
  // fila de "Assumir" em etapas que nem abriram vira ruído (a OS de inspeção
  // tem seis do inspetor). O caso do pedido é a escalada de um colega.
  const minhas = (tarefas || []).filter(t => t.tarefa_id !== os.tarefa_atual_id
    && t.status !== 'completo' && t.status !== 'dispensado'
    && (t.usuario_designado || t.status === 'pendente' || t.status === 'em_andamento')
    && (sessao.admin || !(t.perfis_responsaveis || []).length || (t.perfis_responsaveis || []).includes(sessao.perfil)));
  if (!minhas.length) return null;
  const p = document.createElement('div');
  p.className = 'painel';
  p.innerHTML = '<div class="et">Outras etapas do seu perfil nesta OS</div>'
    + '<p style="font-size:13px;color:var(--ink-3);margin:4px 0 6px">Se combinaram de você ir no lugar de alguém, '
    + 'assuma aqui — não precisa esperar o escritório.</p>';
  minhas.forEach(t => {
    const d = document.createElement('div');
    d.className = 'etapa';
    const eu = t.usuario_designado && String(t.usuario_designado) === String(meuId());
    const quem = eu ? 'com você' : (t.usuario_designado ? 'com ' + nomeDe(t.usuario_designado) : 'sem responsável');
    const est = (t.status === 'bloqueado' || t.status === 'condicional') ? 'ainda não liberada'
              : t.status === 'em_andamento' ? 'em andamento' : 'liberada';
    d.innerHTML = '<b></b><small></small>';
    d.querySelector('b').textContent = t.nome;
    d.querySelector('small').textContent = est + ' · ' + quem
      + (t.data_prevista ? ' · ' + dataBR(t.data_prevista) + (t.hora_inicio ? ' ' + String(t.hora_inicio).slice(0, 5) : '') : '');
    if (possoAssumir(t)){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn sm';
      b.textContent = t.usuario_designado ? 'Assumir no lugar de ' + nomeDe(t.usuario_designado) : 'Assumir';
      b.addEventListener('click', () => assumirNoCampo(t, b));
      d.appendChild(b);
    }
    // S19 · S45 item 2: a etapa LIBERADA em paralelo se conclui daqui — até o
    // S18 só a etapa atual tinha "Concluir", e o mapa de espessura ficaria
    // liberado sem botão enquanto a Revisão I não fechasse.
    if (possoConcluirParalela(t)){
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'btn sm pri';
      c.textContent = 'Concluir etapa';
      c.addEventListener('click', () => {
        if (!confirm('Concluir "' + t.nome + '"?\n\nEla está liberada em paralelo com a etapa atual da OS. '
            + 'A OS continua na etapa em que está.')) return;
        agir('concluir', t);
      });
      d.appendChild(c);
    }
    p.appendChild(d);
  });
  return p;
}
/** S19 · S45 item 2: liberada, não é a atual, manual, sem foto/checklist
 *  obrigatório (esses têm a tela da etapa), não fecha fase nem OS, e do meu
 *  perfil — a mesma conta do Manager (`possoConcluirParalela`). */
function possoConcluirParalela(t, os){
  // S21 · item 4 do S50: a OS pode vir de fora (aviso de atrasadas, sem OS
  // aberta). Sem OS de verdade não há como saber qual é a tarefa atual — e
  // aí a resposta é NÃO, nunca "talvez".
  os = os || (atual && atual.os);
  if (!t || !os || !os.tarefa_atual_id || t.tarefa_id === os.tarefa_atual_id) return false;
  if (t.status !== 'pendente' && t.status !== 'em_andamento') return false;
  const r = t.requisitos || {};
  if (t.tipo !== 'manual' || t.acao_terminal
      || (r.fotos || []).some(f => (f.min || 0) > 0) || (r.checklist || []).some(q => q.obrigatoria)
      || r.agenda) return false;   // S31 · o "Agendar serviço" tem a tela dele
  if (sessao.admin) return true;
  const ps = t.perfis_responsaveis || [];
  return !ps.length || ps.includes(sessao.perfil);
}

function pintarOS(){
  pintarOSBase();
  // S15: as outras etapas vêm por último, depois da etapa atual. Não entram
  // quando o levantamento está na fila (a tela inteira é o aviso da fila).
  try{
    if (tela !== 'os' || !atual || document.getElementById('bFl')) return;
    const pe = painelEtapas();
    if (pe) document.getElementById('main').appendChild(pe);
  }catch(e){ console.error('[etapas]', e); }
}

function pintarOSBase(){
  const { os, tarefas } = atual;
  const t = tarefas.find(x => x.tarefa_id === os.tarefa_atual_id);
  const m = document.getElementById('main');
  m.innerHTML = '';
  // S39 · os extras vêm PRIMEIRO na inspeção: é o que o inspetor tem na mão
  // enquanto anda pela planta, e não pode depender de em que etapa a OS está.
  if (ehInspecao(os)) m.appendChild(painelExtras());
  // S19 · S45 item 2: o que está liberado para mim em paralelo aparece logo
  // em cima — quem veio pelo "Hoje" veio por causa dela, não da etapa atual.
  const par = (tarefas || []).filter(x => possoConcluirParalela(x));
  if (par.length){
    const pa = document.createElement('div');
    pa.className = 'painel';
    pa.style.cssText = 'background:var(--accent-soft);border-color:transparent';
    pa.innerHTML = '<div class="et">Liberada para você agora</div><p style="margin:0"></p>';
    pa.querySelector('p').textContent = par.map(x => x.nome).join(' · ')
      + ' — em paralelo com a etapa atual. O botão "Concluir etapa" está em "Outras etapas", no fim da tela.';
    m.appendChild(pa);
  }

  const naFila = filaLer().find(e => e.osId === os.os_id && e.tipo === 'levantamento');
  if (naFila){
    m.innerHTML = '<div class="painel"><div class="et">Aguardando envio</div>' +
      '<h2>O levantamento está na fila</h2>' +
      '<p>Ele foi salvo no aparelho e vai subir sozinho quando o sinal voltar. ' +
      'Não precisa lançar de novo — se lançar, o sistema recusa o duplicado.</p>' +
      '<button class="btn pri" id="bFl">Tentar enviar agora</button></div>';
    document.getElementById('bFl').addEventListener('click', () => {
      setConn('sync','enviando…');
      flushFila().then(()=>carregar(true)).then(()=>pintarLista()).catch(()=>{});
    });
    return;
  }

  // ── o que a equipe já lançou nesta OS ──
  // Sem isto, o segundo técnico não sabe o que o primeiro fez e o risco é
  // lançar o mesmo acessório duas vezes na mão.
  const cs = (atual.coletas || []).filter(c => c.fase === 1);
  if (cs.length){
    const tot = cs.reduce((s2,c) => s2 + (c.total_itens||0), 0);
    const quem = [...new Set(cs.map(c => c.inspetor))].join(', ');
    const r = document.createElement('div');
    r.className = 'painel';
    r.style.cssText = 'background:var(--accent-soft);border-color:transparent';
    r.innerHTML = '<div class="et">Já lançado nesta OS</div>' +
      '<h2 style="font-size:17px" class="rt"></h2><p class="rq" style="margin:0"></p>';
    r.querySelector('.rt').textContent = tot + ' item(ns) em ' + cs.length + ' envio(s)';
    r.querySelector('.rq').textContent = 'Por: ' + quem + '. Confira antes de lançar para não repetir.';
    m.appendChild(r);
  }

  // ── a coleta continua disponível enquanto a OS estiver no campo ──
  // A T02 fecha no primeiro envio, mas isso não pode impedir o colega de
  // lançar a parte dele da planta.
  const coletaAberta = tarefas.some(x => String(x.tipo||'').startsWith('auto:levantamento')
    && (x.status === 'completo') ) && tarefas.some(x => x.status !== 'completo' && x.status !== 'dispensado'
    && (x.fase === 'Em campo' || x.fase === 'Concluída em campo' || x.fase === 'Aberta'));
  if (coletaAberta && (!t || !String(t.tipo||'').startsWith('auto:levantamento'))){
    const extra = document.createElement('div');
    extra.className = 'painel';
    extra.innerHTML = '<div class="et">Coleta em equipe</div>' +
      '<h2 style="font-size:17px">Lançar mais itens</h2>' +
      '<p>Se você ficou com outra parte da planta, lance aqui. Vai como um envio ' +
      'separado e os itens somam na OS.</p><button class="btn" id="bMais">Lançar mais itens</button>';
    m.appendChild(extra);
    document.getElementById('bMais').addEventListener('click', () => abrirColeta(1));
  }

  if (!t){
    if (!coletaAberta)   // S39: acrescenta, não substitui — o painel de extras fica
      m.insertAdjacentHTML('beforeend', '<div class="vazio"><b>Nada pendente aqui</b><p>Esta OS não tem tarefa aberta para o campo.</p></div>');
    return;
  }

  const meu = !t.perfis_responsaveis || !t.perfis_responsaveis.length
    || t.perfis_responsaveis.includes(sessao.perfil) || sessao.admin;

  const p = document.createElement('div');
  p.className = 'painel';
  p.innerHTML = '<div class="et">' + (os.coluna_rotulo || os.coluna) + '</div><h2></h2><p class="ds"></p>';
  p.querySelector('h2').textContent = t.nome;
  p.querySelector('.ds').textContent = t.descricao || '';
  m.appendChild(p);

  if (!meu){
    const a = document.createElement('p');
    a.style.cssText = 'font-size:14px;color:var(--ink-3);line-height:1.5';
    a.textContent = 'Esta etapa é de ' + t.perfis_responsaveis.join(' ou ')
      + '. Aparece aqui para você saber em que pé está a OS.';
    p.appendChild(a);
    return;
  }

  if (t.status === 'bloqueado' || t.status === 'condicional'){
    const a = document.createElement('p');
    a.style.cssText = 'font-size:14px;color:var(--ink-3)';
    a.textContent = 'Ainda não liberada — abre sozinha quando a etapa anterior fechar.'
      + (t.usuario_designado ? ' Está com ' + (String(t.usuario_designado) === String(meuId()) ? 'você' : nomeDe(t.usuario_designado)) + '.' : '');
    p.appendChild(a);
    // S15 · item 1 do S41: assumir também a bloqueada (só o nome muda)
    if (possoAssumir(t)){
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = t.usuario_designado ? 'Assumir no lugar de ' + nomeDe(t.usuario_designado) : 'Assumir esta etapa';
      b.addEventListener('click', () => assumirNoCampo(t, b));
      p.appendChild(b);
    }
    return;
  }

  // ── tarefa de coleta ──
  if (String(t.tipo||'').startsWith('auto:levantamento')){
    const fase = t.tipo.indexOf('_f2') >= 0 ? 2 : 1;
    const b = document.createElement('button');
    b.className = 'btn pri';
    b.textContent = fase === 2 ? 'Registrar instalação' : 'Lançar acessórios';
    // Fase 1 é lista em branco: o inspetor descobre a planta.
    // Fase 2 é lista fechada: ele executa o que foi aprovado. São telas
    // diferentes de propósito — na volta, escopo novo é problema, não recurso.
    b.addEventListener('click', () => fase === 2 ? abrirExecucao() : abrirColeta(fase));
    p.appendChild(b);
    if (fase === 2){
      const n = document.createElement('p');
      n.style.cssText = 'font-size:13px;color:var(--ink-3);margin:11px 0 0;line-height:1.45';
      n.textContent = 'Você registra peça por peça o que foi feito, com o número do '
        + 'certificado e do lacre. A OS só fecha com todos os itens registrados.';
      p.appendChild(n);
      const fq = filaLer().filter(e => e.tipo === 'execucao' && e.osId === os.os_id).length;
      if (fq){
        const w = document.createElement('p');
        w.style.cssText='font-size:13.5px;color:var(--warn);margin:9px 0 0;font-weight:600';
        w.textContent = fq + ' registro(s) salvos no aparelho, ainda não enviados.';
        p.appendChild(w);
      }
      return;
    }
    const d = LS.get(K_DRAFT + os.os_id, null);
    if (d && d.itens && d.itens.length){
      const n = document.createElement('p');
      n.style.cssText='font-size:13.5px;color:var(--warn);margin:10px 0 0;font-weight:600';
      n.textContent = 'Você tem ' + d.itens.length + ' item(ns) salvos no aparelho, ainda não enviados.';
      p.appendChild(n);
    }
    return;
  }

  // ── tarefa com checklist (fechar com o cliente) ──
  const req = t.requisitos || {};
  if ((req.checklist||[]).length || (req.fotos||[]).length){
    const box = document.createElement('div'); box.className = 'painel';
    const resp = { checklist:{}, fotos:{} };
    const guardadas = {};   // slot -> dataURL, só sobe na hora de concluir

    (req.checklist||[]).forEach(q => {
      const l = document.createElement('label'); l.className = 'check';
      const i = document.createElement('input'); i.type = 'checkbox';
      i.addEventListener('change', () => { resp.checklist[q.id] = i.checked ? 'sim' : ''; });
      l.appendChild(i);
      const sp = document.createElement('span'); sp.textContent = q.pergunta;
      l.appendChild(sp); box.appendChild(l);
    });

    (req.fotos||[]).forEach(f => {
      const d = document.createElement('div'); d.className = 'campo';
      d.innerHTML = '<label></label><button class="btn" type="button" style="margin:0"></button>'
        + '<p style="font-size:12px;color:var(--ink-3);margin:6px 0 0"></p>';
      d.querySelector('label').textContent = f.rotulo + (f.min ? ' · obrigatória' : '');
      const bt = d.querySelector('button'), tx = d.querySelector('p');
      const pinta = () => {
        bt.textContent = guardadas[f.id] ? 'Trocar foto' : 'Tirar foto';
        tx.textContent = guardadas[f.id] ? 'Foto pronta — sobe ao concluir a etapa.'
          : (driveLigado() ? '' : 'O Drive ainda não foi configurado.');
        bt.disabled = !driveLigado();
      };
      pinta();
      bt.addEventListener('click', async () => {
        const img = await tirarFoto(); if (!img) return;
        guardadas[f.id] = img; pinta();
      });
      box.appendChild(d);
    });

    const b = document.createElement('button');
    b.className = 'btn pri'; b.style.marginTop = '10px';
    b.textContent = 'Concluir etapa';
    b.addEventListener('click', async () => {
      // requisito que falta é barrado aqui e também no banco — a tela só
      // adianta a mensagem, quem manda é o servidor
      const faltando = (req.fotos||[]).find(f => (f.min||0) > 0 && !guardadas[f.id]);
      if (faltando){ toast('Falta a foto: ' + faltando.rotulo, 'err'); return; }
      const faltaCk = (req.checklist||[]).find(q => q.obrigatoria && !resp.checklist[q.id]);
      if (faltaCk){ toast('Responda: ' + faltaCk.pergunta, 'err'); return; }

      const slots = Object.keys(guardadas);
      if (slots.length && !DEMO && (navigator.onLine === false || !conectado)){
        toast('Fechar com o cliente precisa de sinal para guardar o aceite. '
            + 'Lance os itens agora e feche quando pegar rede.', 'err');
        return;
      }

      document.querySelectorAll('#main .btn').forEach(x => x.disabled = true);
      try{
        for (const slot of slots){
          setConn('sync','enviando foto…');
          const r = await subirArquivo(guardadas[slot], {
            os_id: atual.os.os_id, cliente: atual.os.cliente, os_numero: atual.os.numero,
            categoria: slot === 'assinatura' ? 'assinatura' : 'foto_tarefa',
            nome: slot + '-' + atual.os.numero + '.jpg', tarefa_id: t.tarefa_id, slot,
            client_uid: 'anx-' + atual.os.os_id + '-' + t.tarefa_id + '-' + slot
          });
          resp.fotos[slot] = [ r.drive_url ];
        }
        setConn('ok','conectado');
        await agir('concluir', t, resp);
      }catch(e){
        setConn('ok','conectado');
        toast(e.message, 'err');
        document.querySelectorAll('#main .btn').forEach(x => x.disabled = false);
      }
    });
    box.appendChild(b);
    m.appendChild(box);
    return;
  }

  // ── tarefa manual simples ──
  // S15: até o S14 o "Assumir" só existia em `pendente` sem fechadura. Com a
  // tarefa já assumida por outra pessoa (o caso do Gabriel que não pode ir),
  // o Filipe via só "Concluir etapa" — era o que o Bruno viu em 26/09.
  const outroDono = t.usuario_designado && String(t.usuario_designado) !== String(meuId());
  const lockDeOutro = lockVivo(t) && String(t.lock_por) !== String(meuId());
  if (lockDeOutro || (outroDono && possoAssumir(t))){
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = 'Assumir no lugar de ' + nomeDe(lockDeOutro ? t.lock_por : t.usuario_designado);
    b.addEventListener('click', () => assumirNoCampo(t, b));
    p.appendChild(b);
  } else if (t.status === 'pendente' && !t.lock_por){
    const b = document.createElement('button');
    b.className = 'btn pri'; b.textContent = 'Assumir esta OS';
    b.addEventListener('click', () => agir('assumir', t));
    p.appendChild(b);
  }
  const c = document.createElement('button');
  // S15: com a etapa nas mãos de OUTRA pessoa, o botão cheio é o de assumir
  c.className = 'btn' + (t.status === 'em_andamento' && !lockDeOutro ? ' pri' : '');
  c.textContent = pedeAgenda(t) ? 'Agendar e concluir' : 'Concluir etapa';   // S31
  c.addEventListener('click', () => pedeAgenda(t) ? telaAgendar(t) : agir('concluir', t));
  p.appendChild(c);
}

async function agir(acao, t, respostas){
  const { os } = atual;
  document.querySelectorAll('#main .btn').forEach(b => b.disabled = true);
  try{
    if (DEMO) demoAgir(os.os_id, t.tarefa_id, acao);
    else if (acao === 'assumir'){
      // `tf_assumir_tarefa` recusa DEVOLVENDO {status:'recusado'|'locked'} — não
      // levantando erro. Ignorar o retorno fazia o app dizer "OS assumida" com o
      // servidor tendo negado. É o mesmo "o verde nunca mente" que vale para o
      // envio da coleta: sem resposta boa, não se pinta de verde.
      const r = await rpc('tf_assumir_tarefa', { p_os_id: os.os_id, p_tarefa_id: t.tarefa_id });
      if (r && r.status === 'recusado')
        throw Object.assign(new Error(r.motivo === 'perfil_nao_autorizado'
          ? 'Esta etapa é de ' + ((r.perfis||[]).join(' ou ') || 'outro perfil') + '.'
          : 'O servidor recusou (' + (r.motivo || '?') + ').'), { negocio:true });
      if (r && r.status === 'locked')
        throw Object.assign(new Error('Outra pessoa assumiu esta OS agora há pouco.'),
                            { negocio:true });
    }
    else
      await rpc('tf_concluir_tarefa', { p_os_id: os.os_id, p_tarefa_id: t.tarefa_id,
                                        p_respostas: respostas || {} });
    await carregar(true);
    const novo = listaOS.find(x => x.os_id === os.os_id);
    if (!novo){ toast('Etapa concluída — a OS saiu do campo.', 'ok'); pintarLista(); return; }
    toast(acao === 'assumir' ? 'OS assumida.' : 'Etapa concluída.', 'ok');
    abrirOS(novo);
  }catch(e){
    toast(e.message, 'err');
    document.querySelectorAll('#main .btn').forEach(b => b.disabled = false);
  }
}

async function sincronizarCatalogo(){
  if (DEMO){ CAT = demoCatalogo(); return; }
  try{
    const h = await rpc('tf_catalogo_hash', {});
    if (h && h === CAT.hash && CAT.itens.length) return;   // nada mudou

    const [itens, familias] = await Promise.all([
      // tem_foto e foto_versao são baratos e viajam com a lista; a IMAGEM não.
      // 300 miniaturas dentro do catálogo estouram o localStorage (~5 MB) e o
      // app fica sem catálogo nenhum em campo — que é o pior resultado possível.
      get('v_catalogo?select=id,codigo,familia_id,familia,familia_ordem,descricao,marca,modelo,'
        + 'unidade,requer_calibracao,requer_lacre,especificacoes,tem_foto,foto_versao'
        + '&ativo=is.true&order=familia_ordem,codigo'),
      get('catalogo_familias?select=id,nome_plural,ordem,icone&ativo=is.true&order=ordem')
    ]);
    CAT = { hash: h, itens: itens || [], familias: familias || [] };
    if (!LS.set(K_CAT, CAT))
      toast('Catálogo carregado, mas não coube no aparelho — vai precisar de sinal.', 'err');
    // Em segundo plano, e sem await: a lista de peças nunca espera por foto.
    sincronizarFotos().catch(()=>{});
  }catch(e){
    // sem rede: segue com o que estava guardado. Não é erro que mereça alarme.
  }
}

const catalogoPronto = () => CAT.itens && CAT.itens.length > 0;

/* ── FOTOS DAS PEÇAS ────────────────────────────────────────────────────────
   A foto ajuda a reconhecer a FAMÍLIA de olho — purgador, tipo de conexão,
   mostrador do manômetro. Quem decide continua sendo a medida e o código:
   válvula 1" e 1½" são a mesma foto.

   As miniaturas moram no IndexedDB, onde as fotos do levantamento já moram, e
   NÃO no localStorage junto do catálogo — lá elas estourariam os ~5 MB e o app
   ficaria sem catálogo em campo.

   Regra que vale mais que o código: item sem foto mostra espaço vazio. Nunca
   herda a foto do vizinho de família — foto de outro modelo faz escolher errado
   com confiança, que é pior do que escolher errado na dúvida. */
const FOTO_MEM = {};                 // item_id → data URI já lida do IndexedDB
const kFoto = id => 'catfoto:' + id;

/** Lê a miniatura do aparelho. Sem rede, sem espera: ou tem, ou não tem. */
async function fotoPeca(id){
  if (FOTO_MEM[id] !== undefined) return FOTO_MEM[id];
  try{
    const r = await IDB.get(kFoto(id));
    FOTO_MEM[id] = (r && r.thumb) || null;
  }catch(e){ FOTO_MEM[id] = null; }
  return FOTO_MEM[id];
}

/** Busca as miniaturas que faltam, em lotes pequenos, sem travar nada.
 *  Um lote por vez e com pausa: numa planta com meia barra de sinal, 300
 *  imagens de uma vez derrubam a conexão que o envio do levantamento precisa. */
async function sincronizarFotos(){
  if (DEMO) return;
  const comFoto = (CAT.itens || []).filter(i => i.tem_foto);
  const faltam = [];
  for (const i of comFoto){
    let g = null;
    try{ g = await IDB.get(kFoto(i.id)); }catch(e){}
    if (!g || g.versao !== i.foto_versao) faltam.push(i);
  }
  // Item que perdeu a foto no servidor (trocou de modelo) some do aparelho também.
  for (const i of (CAT.itens || [])){
    if (i.tem_foto) continue;
    try{ if (await IDB.get(kFoto(i.id))) { await IDB.del(kFoto(i.id)); delete FOTO_MEM[i.id]; } }catch(e){}
  }
  const LOTE = 20;
  for (let k = 0; k < faltam.length; k += LOTE){
    const lote = faltam.slice(k, k + LOTE);
    let linhas;
    try{
      linhas = await get('catalogo_fotos?select=item_id,thumb&item_id=in.('
                         + lote.map(x => x.id).join(',') + ')');
    }catch(e){ return; }          // sem rede: fica para a próxima sincronização
    const ver = {}; lote.forEach(x => ver[x.id] = x.foto_versao);
    for (const l of (linhas || [])){
      try{
        await IDB.put(kFoto(l.item_id), { thumb: l.thumb, versao: ver[l.item_id] || '' });
        FOTO_MEM[l.item_id] = l.thumb;
      }catch(e){
        // Aparelho cheio: para de tentar — mas AVISA uma vez. Antes, o técnico
        // via quadrados vazios para sempre sem jeito de saber por quê, e o app
        // já sabe avisar disso em outros pontos.
        if (!sincronizarFotos._avisou){
          sincronizarFotos._avisou = true;
          toast('Sem espaço no aparelho para as fotos das peças. A lista funciona sem elas.', 'err');
        }
        return;
      }
    }
    await new Promise(r => setTimeout(r, 120));
  }
}

// ── o seletor ───────────────────────────────────────────────────────────────
// Uma tela inteira, não um <select>: em campo, com luva e sol na tela, lista
// grande com busca é o que funciona.
function abrirSeletorCatalogo(aoEscolher){
  const m = document.getElementById('main');
  m.innerHTML = '';
  const box = document.createElement('div'); box.className = 'painel';
  box.innerHTML =
    '<div class="campo"><label for="cB">Buscar no catálogo</label>' +
      '<input id="cB" type="search" inputmode="search" autocomplete="off" ' +
      'placeholder="manômetro, 1/2, Wika, MAN-0001…"></div>' +
    '<div class="tog" id="cF" style="margin-bottom:10px"></div>' +
    '<div id="cL"></div>' +
    '<button class="btn" id="cCa" style="margin-top:12px">Voltar</button>';
  m.appendChild(box);

  let fam = null;
  const tg = document.getElementById('cF');
  [{id:null,nome_plural:'Todos'}].concat(CAT.familias).forEach(f => {
    const b = document.createElement('button'); b.type = 'button';
    b.textContent = (f.icone ? f.icone + ' ' : '') + f.nome_plural;
    b.className = (fam === f.id ? 'on' : '');
    b.addEventListener('click', () => {
      fam = f.id;
      [...tg.children].forEach(c => c.classList.toggle('on', c === b));
      lista();
    });
    tg.appendChild(b);
  });
  tg.firstChild.classList.add('on');

  function lista(){
    const t = norm(document.getElementById('cB').value).trim();
    const el = document.getElementById('cL');
    // cada palavra digitada tem que aparecer em algum lugar do item: "valv 1/2"
    // acha a válvula de 1/2 sem depender da ordem em que foi escrito
    const termos = t ? t.split(/\s+/) : [];
    const achados = CAT.itens.filter(i => {
      if (fam && i.familia_id !== fam) return false;
      if (!termos.length) return true;
      const alvo = norm([i.descricao, i.marca, i.modelo, i.codigo, i.familia,
        Object.values(i.especificacoes||{}).join(' ')].join(' '));
      return termos.every(w => alvo.includes(w));
    });

    el.innerHTML = '';
    if (!achados.length){
      el.innerHTML = '<p style="font-size:13px;color:var(--ink-3);padding:8px 0">'
        + (t ? 'Nada encontrado. Use “Item fora do catálogo” para lançar mesmo assim.'
             : 'O catálogo está vazio.') + '</p>';
      return;
    }
    achados.slice(0, 80).forEach(i => {
      const d = document.createElement('button');
      d.type = 'button'; d.className = 'itemCat' + (i.tem_foto ? ' comFoto' : '');
      d.innerHTML = (i.tem_foto ? '<span class="fotoP"></span>' : '')
                  + '<span class="txtP"><b></b><small></small></span>';
      d.querySelector('b').textContent = i.descricao;
      const p = [i.codigo];
      if (i.marca || i.modelo) p.push([i.marca,i.modelo].filter(Boolean).join(' '));
      const e = i.especificacoes || {};
      Object.keys(e).slice(0,3).forEach(k => p.push(String(e[k])));
      d.querySelector('small').textContent = p.join(' · ');
      if (i.tem_foto){
        const cx = d.querySelector('.fotoP');
        fotoPeca(i.id).then(src => {
          if (!src || !cx.isConnected) return;
          const im = document.createElement('img');
          im.src = src; im.alt = 'Foto de ' + (i.descricao || 'peça');
          cx.appendChild(im);
          // Tocar no QUADRADO amplia; tocar no resto da linha escolhe a peça.
          // Sem o stopPropagation, olhar a foto de perto lançaria o item.
          cx.setAttribute('role','button');
          cx.setAttribute('aria-label','Ampliar a foto');
          cx.addEventListener('click', ev => { ev.stopPropagation(); ampliarFoto(src, i.descricao); });
        }).catch(()=>{});
      }
      d.addEventListener('click', () => aoEscolher(i));
      el.appendChild(d);
    });
    if (achados.length > 80){
      const p = document.createElement('p');
      p.style.cssText = 'font-size:12px;color:var(--ink-3);padding:8px 0';
      p.textContent = achados.length + ' itens encontrados. Mostrando os 80 primeiros — refine a busca.';
      el.appendChild(p);
    }
  }

  document.getElementById('cB').addEventListener('input', lista);
  document.getElementById('cCa').addEventListener('click', pintarColeta);
  lista();
  setTimeout(() => document.getElementById('cB').focus(), 60);
}

async function enviarExtras(){
  const { os } = atual;
  if (!coleta.itens.length) return;
  const itens = coleta.itens.slice();
  const payload = {
    p_os_origem: os.os_id,
    p_client_uid: coleta.client_uid,
    p_itens: itens.map(i => ({
      descricao: i.descricao, tipo_acessorio: i.tipo_acessorio, quantidade: i.quantidade,
      catalogo_item_id: i.catalogo_item_id || null,
      equipamento_id: i.equipamento_id || null,
      requer_calibracao: !!i.requer_calibracao, requer_lacre: !!i.requer_lacre,
      impede_operar: !!i.impede_operar,
      observacao: i.observacao || null,
      dados: i.equipamento_id ? {} : { tag: i.tagTexto || '' }
    }))
  };
  const assinatura = 'ext|' + os.os_id + '|' + coleta.client_uid;
  const fotos = itens.map((i, indice) => !i.fotoKey ? null : ({
    indice, idbKey: i.fotoKey,
    meta: { os_id: os.os_id, cliente: os.cliente, os_numero: os.numero,
            categoria: 'foto_item', nome: 'extra-' + (indice+1) + '.jpg',
            client_uid: 'anx-' + coleta.client_uid + '-' + indice }
  })).filter(Boolean);
  const entrada = { tipo:'extras', funcao:'tf_lancar_extras', payload, assinatura,
                    osId: os.os_id, rotulo: os.numero, fotos, draftKey: K_EXTRA + os.os_id };

  document.querySelectorAll('#main .btn').forEach(b => b.disabled = true);

  if (!DEMO && (navigator.onLine === false || !conectado)){
    filaAdd(entrada);
    toast('Sem sinal — os extras ficaram na fila' + (fotos.length ? ', com as fotos' : '')
          + '. Sobem sozinhos quando conectar.', 'err');
    voltarParaOS(); return;
  }

  setConn('sync','enviando…');
  try{
    const resp = DEMO ? { os_id:'demo', numero:'OS-DEMO', nova:true } : await rpc('tf_lancar_extras', payload);
    LS.del(K_EXTRA + os.os_id);           // só depois do OK do servidor
    coleta = null;
    setConn('ok','conectado');
    await enfileirarFotosDoEnvio(entrada, resp);
    toast((resp && resp.nova ? 'Enviado ao comercial — virou a venda adicional ' : 'Enviado — somou na venda adicional ')
          + ((resp && resp.numero) || '') + '.', 'ok');
    await abrirOS(atual.os);
  }catch(e){
    if (e.negocio){
      setConn('ok','conectado');
      toast('Recusado: ' + e.message, 'err');
      document.querySelectorAll('#main .btn').forEach(b => b.disabled = false);
    } else {
      filaAdd(entrada);
      toast('Não deu para enviar agora — ficou na fila, nada se perdeu.', 'err');
      voltarParaOS();
    }
  }
}

  m.innerHTML = '';

  if (!coleta.itens.length){
    const v = document.createElement('div'); v.className = 'vazio';
    v.innerHTML = ext
      ? '<b>Nenhum extra ainda</b><p>Toque em “Adicionar extra”: escolha o vaso, o item do '
        + 'catálogo e tire a foto do que achou.<br>Fica salvo no aparelho mesmo sem sinal.</p>'
      : '<b>Nenhum item ainda</b><p>Toque em “Adicionar item” para começar.<br>' +
        'O que você lançar fica salvo no aparelho mesmo sem sinal.</p>';
    m.appendChild(v);
  } else {
    coleta.itens.forEach((it, i) => m.appendChild(itemEl(it, i)));
  }

  const barra = document.createElement('div'); barra.className = 'barra';
  const total = coleta.itens.reduce((s,i) => s + (Number(i.quantidade)||0), 0);
  barra.innerHTML =
    '<div class="resumo">' + coleta.itens.length + ' tipo(s) · ' + total + ' peça(s)</div>' +
    '<button class="btn" id="bAdd">' + (ext ? 'Adicionar extra' : 'Adicionar item') + '</button>' +
    '<button class="btn pri" id="bEnv">' + (ext ? 'Enviar ao comercial' : 'Enviar levantamento') + '</button>';
  if (ext){
    const n = document.createElement('p'); n.className = 'exNota';
    n.textContent = 'Pode enviar agora, vaso por vaso, ou tudo no fim. O que você mandar depois soma '
      + 'na mesma venda adicional enquanto a proposta não sair — é assim que o comercial começa '
      + 'antes de você deixar o cliente.';
    m.appendChild(n);
  }
  m.appendChild(barra);

  document.getElementById('bAdd').addEventListener('click', () => formItem(null));
  const be = document.getElementById('bEnv');
  be.disabled = !coleta.itens.length;
  be.addEventListener('click', ext ? enviarExtras : enviar);
}

function itemEl(it, i){
  const d = document.createElement('div'); d.className = 'itemRow';
  const flags = [];
  if (it.requer_calibracao) flags.push('calibração');
  if (it.requer_lacre) flags.push('lacre');
  if (it.impede_operar) flags.unshift('⚠ impede operar');
  if (it.tag || it.tagTexto) flags.unshift(it.tag || ('TAG ' + it.tagTexto));
  if (it.fotoKey) flags.push('com foto');
  d.innerHTML = '<div class="q"></div><div class="d"><b></b><small></small></div>' +
                '<button class="x" aria-label="Remover">×</button>';
  d.querySelector('.q').textContent = it.quantidade;
  d.querySelector('b').textContent = it.descricao;
  d.querySelector('small').textContent = flags.join(' · ') || (it.tipo_rotulo || '');
  d.querySelector('.x').addEventListener('click', () => {
    if (!confirm('Remover "' + it.descricao + '"?')) return;
    coleta.itens.splice(i,1); salvarDraft(); pintarColeta();
  });
  d.querySelector('.d').addEventListener('click', () => formItem(i));
  return d;
}

function formItem(idx, preenchido){
  const it = preenchido ? preenchido : (idx == null
    ? { tipo_acessorio:'manometro', descricao:'', quantidade:1, equipamento_id:'', tag:'',
        requer_calibracao:false, requer_lacre:false }
    : Object.assign({}, coleta.itens[idx]));

  const m = document.getElementById('main');
  m.innerHTML = '';
  const box = document.createElement('div'); box.className = 'painel';

  // S39 · no extra o vaso é OBRIGATÓRIO: é por ele que a proposta, a compra e
  // a instalação se orientam. Vaso sem cadastro entra digitando a TAG.
  const ext = coleta && coleta.modo === 'extra';
  const eqOpts = [ext ? '<option value="">— escolha o vaso —</option>'
                      : '<option value="">— sem equipamento —</option>'].concat(
    atual.equipamentos.map(e => '<option value="'+e.id+'">'+ esc(e.tag) +
      (e.localizacao ? ' · ' + esc(e.localizacao) : '') + '</option>'))
    .concat(ext ? ['<option value="__outro">Outro — digitar a TAG</option>'] : []);

  // A origem do item aparece no topo: escolhido do catálogo ou digitado.
  // Sem isso o inspetor não sabe se o escritório vai receber a peça certa.
  const origem = it.catalogo_item_id
    ? '<div class="doCatalogo">✓ <b>' + esc(it.catalogo_codigo||'do catálogo') + '</b>'
      + '<button type="button" class="lnk" id="fTrocar">trocar</button>'
      + '<button type="button" class="lnk" id="fSoltar">digitar à mão</button></div>'
    : (catalogoPronto()
        ? '<button class="btn" type="button" id="fCat" style="margin:0 0 14px">'
          + '🔎 Escolher do catálogo</button>'
        : '');

  box.innerHTML = origem +
    '<div class="campo"><label>Tipo</label><div class="tog" id="tg"></div></div>' +
    '<div class="campo"><label for="fD">Descrição</label>' +
      '<input id="fD" type="text" placeholder="ex.: Manômetro 63mm 0-14 kgf/cm² · 1/4&quot; NPT"></div>' +
    '<div class="campo"><label for="fQ">Quantidade</label>' +
      '<input id="fQ" type="number" inputmode="numeric" min="1" step="1"></div>' +
    '<div class="campo"><label for="fE">' + (ext ? 'Vaso / equipamento' : 'Equipamento') + '</label>' +
      '<select id="fE">' + eqOpts.join('') + '</select></div>' +
    (ext ? '<div class="campo" id="fTagC" hidden><label for="fTag">TAG do vaso</label>'
         + '<input id="fTag" type="text" autocomplete="off" placeholder="ex.: VP-07"></div>' : '') +
    '<label class="check"><input type="checkbox" id="fC"><span>Exige calibração</span></label>' +
    '<label class="check"><input type="checkbox" id="fL"><span>Exige lacre</span></label>' +
    // S39 · "Instalado agora, em campo" SAIU. Ele tirava o item do orçamento
    // (elegivel = false) — peça instalada sem proposta e sem aprovação, que é
    // exatamente como a cobrança se perdia. Tudo passa pelo comercial.
    (ext ? '<label class="check"><input type="checkbox" id="fImp"><span>Impede o equipamento de operar</span></label>'
         + '<div class="campo"><label for="fObs">Observação (opcional)</label>'
         + '<input id="fObs" type="text" autocomplete="off" placeholder="ex.: visor quebrado, vazando pela rosca"></div>' : '') +
    '<div class="campo"><label>' + (ext ? 'Foto do achado (recomendada)' : 'Foto do ponto (opcional)') + '</label>' +
      '<button class="btn" id="fFoto" type="button" style="margin:0"></button>' +
      '<p class="dicaFoto" id="fFotoTxt" style="font-size:12px;color:var(--ink-3);margin:6px 0 0"></p></div>' +
    '<button class="btn pri" id="fOk">' + (idx==null ? 'Adicionar' : 'Salvar') + '</button>' +
    '<button class="btn" id="fCa">Cancelar</button>';
  m.appendChild(box);

  const tg = document.getElementById('tg');
  TIPOS.forEach(([v,l]) => {
    const b = document.createElement('button'); b.type='button'; b.textContent = l;
    b.className = (v === it.tipo_acessorio ? 'on' : '');
    b.addEventListener('click', () => {
      it.tipo_acessorio = v;
      [...tg.children].forEach(c => c.classList.toggle('on', c === b));
      const dd = document.getElementById('fD');
      if (!dd.value.trim()) dd.value = l + ' ';
      dd.focus();
    });
    tg.appendChild(b);
  });

  document.getElementById('fD').value = it.descricao;
  document.getElementById('fQ').value = it.quantidade;
  document.getElementById('fE').value = it.equipamento_id || '';
  document.getElementById('fC').checked = !!it.requer_calibracao;
  document.getElementById('fL').checked = !!it.requer_lacre;
  if (ext){
    const sel = document.getElementById('fE'), tc = document.getElementById('fTagC');
    if (!it.equipamento_id && it.tagTexto) sel.value = '__outro';
    const mostra = () => { tc.hidden = sel.value !== '__outro'; };
    sel.addEventListener('change', mostra); mostra();
    document.getElementById('fTag').value = it.tagTexto || '';
    document.getElementById('fImp').checked = !!it.impede_operar;
    document.getElementById('fObs').value = it.observacao || '';
  }

  // ── catálogo ──
  // Escolher preenche descrição, tipo, calibração e lacre — e guarda o vínculo,
  // que é o que faz o custo e o preço de referência chegarem no orçamento.
  // O que for digitado depois continua valendo: o catálogo é o padrão, não a
  // camisa de força.
  const escolher = (i) => {
    Object.assign(it, {
      catalogo_item_id: i.id,
      catalogo_codigo: i.codigo,
      descricao: i.descricao,
      tipo_acessorio: i.familia_id,
      requer_calibracao: !!i.requer_calibracao,
      requer_lacre: !!i.requer_lacre
    });
    formItem(idx, it);
  };
  const bCat = document.getElementById('fCat');
  if (bCat) bCat.addEventListener('click', () => abrirSeletorCatalogo(escolher));
  const bTro = document.getElementById('fTrocar');
  if (bTro) bTro.addEventListener('click', () => abrirSeletorCatalogo(escolher));
  const bSol = document.getElementById('fSoltar');
  if (bSol) bSol.addEventListener('click', () => {
    delete it.catalogo_item_id; delete it.catalogo_codigo;
    formItem(idx, it);
  });

  // ── foto do ponto ──
  const btF = document.getElementById('fFoto'), txF = document.getElementById('fFotoTxt');
  const pintaFoto = () => {
    btF.textContent = it.fotoKey ? 'Trocar foto' : 'Tirar foto';
    txF.textContent = it.fotoKey
      ? 'Foto guardada no aparelho — sobe junto com o envio.'
      : (driveLigado() ? 'Ajuda o escritório a entender o ponto na hora de cotar.'
                       : 'O Drive ainda não foi configurado — sem fotos por enquanto.');
    btF.disabled = !driveLigado();
  };
  pintaFoto();
  btF.addEventListener('click', async () => {
    const d = await tirarFoto(); if (!d) return;
    const k = 'f_' + uid();
    try{ await IDB.put(k, d); if (it.fotoKey) await IDB.del(it.fotoKey).catch(()=>{});
         it.fotoKey = k; pintaFoto(); toast('Foto guardada.','ok'); }
    catch(e){ toast('Não consegui guardar a foto no aparelho.','err'); }
  });

  document.getElementById('fCa').addEventListener('click', pintarColeta);
  document.getElementById('fOk').addEventListener('click', () => {
    const desc = document.getElementById('fD').value.trim();
    const q = parseInt(document.getElementById('fQ').value, 10);
    if (!desc){ toast('Escreva a descrição do item.','err'); return; }
    if (!q || q < 1){ toast('Quantidade tem que ser 1 ou mais.','err'); return; }
    const sel = document.getElementById('fE');
    const outro = sel.value === '__outro';
    const tagTexto = ext && outro ? document.getElementById('fTag').value.trim() : '';
    if (ext && !sel.value){ toast('Escolha em qual vaso está o que você achou.','err'); return; }
    if (ext && outro && !tagTexto){ toast('Digite a TAG do vaso.','err'); return; }
    Object.assign(it, {
      descricao: desc, quantidade: q,
      equipamento_id: (sel.value && !outro) ? sel.value : '',
      tag: (sel.value && !outro) ? sel.options[sel.selectedIndex].text.split(' · ')[0] : '',
      tagTexto,
      tipo_rotulo: (TIPOS.find(t => t[0] === it.tipo_acessorio)||[])[1] || '',
      requer_calibracao: document.getElementById('fC').checked,
      requer_lacre: document.getElementById('fL').checked
    });
    if (ext){
      it.impede_operar = document.getElementById('fImp').checked;
      it.observacao = document.getElementById('fObs').value.trim();
    }
    delete it.instalado_imediatamente;
    if (idx == null) coleta.itens.push(it); else coleta.itens[idx] = it;
    salvarDraft(); pintarColeta();
  });
}

async function enviar(){
  const { os } = atual;
  if (!coleta.itens.length) return;
  const payload = {
    p_os_id: os.os_id,
    p_client_uid: coleta.client_uid,
    p_fase: coleta.fase,
    p_itens: coleta.itens.map(i => ({
      descricao: i.descricao, tipo_acessorio: i.tipo_acessorio, quantidade: i.quantidade,
      catalogo_item_id: i.catalogo_item_id || null,
      equipamento_id: i.equipamento_id || null,
      requer_calibracao: !!i.requer_calibracao, requer_lacre: !!i.requer_lacre,
      instalado_imediatamente: false,   // S39: nada é instalado antes do sim do cliente
      dados: {}
    }))
  };
  const assinatura = 'lev|' + os.os_id + '|' + coleta.client_uid;

  // as fotos viajam à parte: primeiro o levantamento (que devolve os ids dos
  // itens), depois cada imagem ligada ao seu item
  const fotos = coleta.itens.map((i, indice) => !i.fotoKey ? null : ({
    indice, idbKey: i.fotoKey,
    meta: { os_id: os.os_id, cliente: os.cliente, os_numero: os.numero,
            categoria: 'foto_item', nome: 'item-' + (indice+1) + '.jpg',
            client_uid: 'anx-' + coleta.client_uid + '-' + indice }
  })).filter(Boolean);

  document.querySelectorAll('#main .btn').forEach(b => b.disabled = true);

  // Sem rede? nem tenta: enfileira e diz a verdade.
  if (!DEMO && (navigator.onLine === false || !conectado)){
    filaAdd({ tipo:'levantamento', funcao:'tf_enviar_levantamento', payload, assinatura,
              osId: os.os_id, rotulo: os.numero, fotos });
    toast('Sem sinal — salvo e na fila' + (fotos.length ? ', com as fotos' : '') +
          '. Sobe sozinho quando conectar.', 'err');
    await carregar(true); pintarLista(); return;
  }

  setConn('sync','enviando…');
  try{
    let resp = null;
    if (DEMO) demoEnviar(os.os_id);
    else resp = await rpc('tf_enviar_levantamento', payload);
    LS.del(K_DRAFT + os.os_id);            // só depois do OK do servidor
    setConn('ok','conectado');
    await enfileirarFotosDoEnvio({ osId: os.os_id, rotulo: os.numero, fotos }, resp);
    toast('Levantamento enviado — ' + coleta.itens.length + ' item(ns)' +
          (fotos.length ? ' e ' + fotos.length + ' foto(s)' : '') + '.', 'ok');
    await carregar(true);
    pintarLista();
  }catch(e){
    if (e.negocio){
      setConn('ok','conectado');
      toast('Recusado: ' + e.message, 'err');
      document.querySelectorAll('#main .btn').forEach(b => b.disabled = false);
    } else {
      filaAdd({ tipo:'levantamento', funcao:'tf_enviar_levantamento', payload, assinatura,
                osId: os.os_id, rotulo: os.numero, fotos });
      toast('Não deu para enviar agora — ficou na fila, nada se perdeu.', 'err');
      await carregar(true); pintarLista();
    }
  }
}

// ════════════════════════════════════════════════════════════════════════════
// TELA: EXECUÇÃO — a volta ao cliente
// ----------------------------------------------------------------------------
// Aqui NÃO se lança item novo. Os itens já foram levantados, cotados e
// aprovados; o que o inspetor faz na volta é dizer, peça por peça, o que
// aconteceu — e informar o número do certificado e do lacre, que é o papel que
// o cliente guarda para a fiscalização.
//
// Por isso esta tela é uma lista FECHADA e não um formulário em branco: o campo
// não redefine o escopo na hora da instalação, só executa o que foi aprovado.
// Item que não deu para instalar não trava a OS — vira "não executado" com o
// motivo escrito, que é o que o escritório precisa para decidir.
//
// O botão de fechar só acende com 100% dos itens registrados. É a mesma trava
// do TapControl: OS fechada pela metade vira retrabalho no escritório com o
// inspetor já fora da planta.
// ════════════════════════════════════════════════════════════════════════════
const ACOES = [
  ['instalado',           'Instalado'],
  ['instalado_calibrado', 'Instalado e calibrado'],
  ['entregue',            'Entregue ao cliente'],
  ['substituido',         'Substituído'],
  ['nao_executado',       'Não executado']
];
const rotuloAcao = a => (ACOES.find(x => x[0] === a) || [null, a || ''])[1];
const hojeISO = () => { const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

async function abrirExecucao(){
  const { os } = atual;
  tela = 'exec'; execForm = null;
  document.getElementById('hTit').textContent = 'Instalação';
  document.getElementById('hSub').textContent = os.numero + ' · ' + os.cliente;
  const m = document.getElementById('main');
  m.innerHTML = '<div class="vazio"><p>Carregando os itens aprovados…</p></div>';
  try{
    const itens = DEMO ? demoExecItens(os.os_id)
      : await get('v_itens_execucao?select=*&os_id=eq.' + os.os_id);
    exec = { osId: os.os_id, itens: itens || [] };
    pintarExecucao();
  }catch(e){
    m.innerHTML = '<div class="vazio"><b>Não deu para carregar os itens</b><p></p></div>';
    m.querySelector('p').textContent = e.message;
  }
}

/**
 * O progresso é contado aqui, no aparelho, e não lido do servidor — porque o
 * inspetor precisa ver a barra andar mesmo sem sinal. O servidor recalcula por
 * conta própria na hora de fechar; esta conta só decide se o botão acende.
 */
function progExec(){
  const its = exec.itens;
  const naFila = filaLer().filter(e => e.tipo === 'execucao' && e.osId === exec.osId).length;
  const feitos = its.filter(i => i.acao_executada).length;
  return { total: its.length, feitos, naFila,
           pode: its.length > 0 && feitos === its.length && naFila === 0 };
}

function pintarExecucao(){
  const { os } = atual;
  execForm = null;
  document.getElementById('hTit').textContent = 'Instalação';
  document.getElementById('hSub').textContent = os.numero + ' · ' + os.cliente;
  const m = document.getElementById('main');
  m.innerHTML = '';
  const p = progExec();

  const topo = document.createElement('div');
  topo.className = 'painel';
  topo.innerHTML = '<div class="et">Retorno para instalação</div>' +
    '<h2 class="pgT"></h2>' +
    '<div class="prog"><i></i></div>' +
    '<p class="pgS" style="margin:10px 0 0"></p>';
  topo.querySelector('.pgT').textContent = p.feitos + ' de ' + p.total + ' itens registrados';
  topo.querySelector('.prog i').style.width = (p.total ? (p.feitos/p.total*100) : 0) + '%';
  topo.querySelector('.pgS').textContent = p.total === 0
    ? 'Esta OS não tem itens aprovados. Fale com o escritório antes de fechar.'
    : (p.feitos === p.total
        ? 'Tudo registrado. Confira e feche com o cliente.'
        : 'Toque em cada peça e diga o que foi feito. Dá para registrar sem sinal.');
  m.appendChild(topo);

  if (p.naFila){
    const av = document.createElement('div');
    av.className = 'painel';
    av.style.cssText = 'background:var(--crit-soft);border-color:transparent';
    av.innerHTML = '<h2 style="font-size:17px" class="ft"></h2>' +
      '<p style="margin:0">Sobe sozinho quando o sinal voltar. O fechamento só ' +
      'libera depois que o servidor receber tudo.</p>';
    av.querySelector('.ft').textContent = p.naFila +
      (p.naFila === 1 ? ' registro ainda no aparelho' : ' registros ainda no aparelho');
    m.appendChild(av);
  }

  // agrupado por equipamento: é assim que o inspetor anda pela planta —
  // termina um vaso, passa para o próximo, e não pula de um lado para o outro.
  const grupos = new Map();
  exec.itens.forEach(i => {
    const g = i.equipamento || 'Sem equipamento';
    if (!grupos.has(g)) grupos.set(g, []);
    grupos.get(g).push(i);
  });
  grupos.forEach((its, nome) => {
    const h = document.createElement('div');
    h.className = 'grupoTit';
    h.textContent = nome + ' · ' + its.filter(i=>i.acao_executada).length + '/' + its.length;
    m.appendChild(h);
    its.forEach(i => m.appendChild(linhaExec(i)));
  });

  const barra = document.createElement('div');
  barra.className = 'barra';
  barra.innerHTML = '<div class="resumo" id="xRes"></div>' +
    '<button class="btn pri" id="xFim">Finalizar e fechar</button>';
  m.appendChild(barra);
  document.getElementById('xRes').textContent = p.pode
    ? 'Pronto para fechar'
    : (p.naFila ? 'Aguardando o envio dos registros'
                : 'Faltam ' + (p.total - p.feitos) + ' item(ns)');
  const bf = document.getElementById('xFim');
  bf.disabled = !p.pode;
  bf.addEventListener('click', telaFechamento);
}

function linhaExec(i){
  // item não executado NÃO ganha o certo verde: ele conta como registrado, mas
  // é uma pendência que o escritório vai ter de resolver. Marcar de verde
  // esconderia justamente o que precisa aparecer.
  const nao = i.acao_executada === 'nao_executado';
  const d = document.createElement('div');
  d.className = 'itemRow' + (nao ? ' naoexec' : (i.acao_executada ? ' feito' : ''));
  d.innerHTML = '<div class="q"></div><div class="d"><b></b><small></small></div>' +
                '<div class="cv">›</div>';
  const q = d.querySelector('.q');
  q.textContent = nao ? '!' : (i.acao_executada ? '✓' : i.quantidade);
  if (i.acao_executada) q.className = 'q ' + (nao ? 'naoexec' : 'feito');
  d.querySelector('b').textContent = i.descricao;

  const notas = [];
  if (i.acao_executada){
    notas.push(rotuloAcao(i.acao_executada));
    if (nao && i.obs_execucao) notas.push(i.obs_execucao);
    if (i.certificado_num) notas.push('cert. ' + i.certificado_num);
    if (i.lacre_num) notas.push('lacre ' + i.lacre_num);
    if (i._fila) notas.push('no aparelho');
  } else {
    if (i.exige) notas.push(i.exige);
    else notas.push('toque para registrar');
    if (i.origem) notas.push(i.origem);
  }
  d.querySelector('small').textContent = notas.join(' · ');
  d.addEventListener('click', () => formExecucao(i));
  return d;
}

function formExecucao(i){
  execForm = i;
  const m = document.getElementById('main');
  m.innerHTML = '';
  document.getElementById('hTit').textContent = 'Registrar item';

  const est = {
    acao: i.acao_executada || (i.requer_calibracao ? 'instalado_calibrado' : 'instalado'),
    data: i.instalado_em || hojeISO(),
    cert: i.certificado_num || '',
    lacre: i.lacre_num || '',
    obs: i.obs_execucao || ''
  };

  const box = document.createElement('div');
  box.className = 'painel';
  box.innerHTML =
    '<div class="et"></div><h2 style="font-size:18px" class="xd"></h2>' +
    '<p class="xq" style="margin:0 0 14px"></p>' +
    '<div class="campo"><label>O que foi feito</label><div class="tog" id="xTg"></div></div>' +

  m.appendChild(box);

  box.querySelector('.et').textContent = i.equipamento || 'Sem equipamento';
  box.querySelector('.xd').textContent = i.descricao;
  const exig = [];
  if (i.requer_calibracao) exig.push('exige certificado de calibração');
  if (i.requer_lacre) exig.push('exige número de lacre');
  box.querySelector('.xq').textContent =
    'Quantidade: ' + i.quantidade + (exig.length ? ' · ' + exig.join(' e ') : '');

  const tg = document.getElementById('xTg');
  const pinta = () => {
    [...tg.children].forEach(b => b.classList.toggle('on', b.dataset.v === est.acao));
    const naoExec = est.acao === 'nao_executado';
    // certificado e lacre só aparecem quando fazem sentido — item não executado
    // não tem o que certificar, e pedir número em branco é convite a inventar
    document.getElementById('cCert').hidden  = naoExec || !i.requer_calibracao;
    document.getElementById('cLacre').hidden = naoExec || !i.requer_lacre;
    document.getElementById('cData').hidden  = naoExec;
    document.getElementById('lObs').textContent = naoExec
      ? 'Por que não deu para executar (obrigatório)' : 'Observação';
    document.getElementById('xObs').placeholder = naoExec
      ? 'ex.: ponto inacessível, linha pressurizada' : 'opcional';
  };

    b.type = 'button'; b.textContent = l; b.dataset.v = v;
    b.addEventListener('click', () => { est.acao = v; pinta(); });

  document.getElementById('xData').value = est.data;
  document.getElementById('xCert').value = est.cert;
  document.getElementById('xLacre').value = est.lacre;
  // número que já veio do escritório aparece preenchido, com a origem dita em
  // voz alta. Redigitar um número certo é a melhor forma de errá-lo.
  document.getElementById('xCertV').hidden  = !(i.certificado_num && !i.acao_executada);
  document.getElementById('xLacreV').hidden = !(i.lacre_num && !i.acao_executada);
  document.getElementById('xObs').value = est.obs;
  pinta();

  document.getElementById('xCa').addEventListener('click', pintarExecucao);

    // as mesmas travas do servidor, checadas aqui — para que o registro feito
    // sem sinal não vá para a fila só para ser recusado horas depois
    if (est.acao !== 'nao_executado'){
      if (i.requer_calibracao && !cert){ toast('Este item exige calibração — informe o número do certificado.','err'); return; }
      if (i.requer_lacre && !lacre){ toast('Este item exige lacre — informe o número.','err'); return; }
    }
    if (est.acao === 'nao_executado' && !obs){
      toast('Escreva por que não deu para executar.','err'); return; }
    salvarExecucao(i, { acao: est.acao, data: document.getElementById('xData').value || hojeISO(),
                        cert, lacre, obs });
  });
}

async function salvarExecucao(i, v){
  const { os } = atual;
  const payload = {
    p_os_item_id: i.id,
    p_acao: v.acao,
    p_data: v.acao === 'nao_executado' ? null : v.data,
    p_certificado: v.cert || null,
    p_lacre: v.lacre || null,
    p_observacao: v.obs || null
  };
  const assinatura = 'exec|' + i.id;
  const local = () => {
    i.acao_executada = v.acao;
    i.instalado_em = v.acao === 'nao_executado' ? null : v.data;
    if (v.cert) i.certificado_num = v.cert;
    if (v.lacre) i.lacre_num = v.lacre;
    i.obs_execucao = v.obs || null;
    i.exige = null;
  };

  document.querySelectorAll('#main .btn').forEach(b => b.disabled = true);

  if (DEMO){ local(); pintarExecucao(); toast('Registrado.','ok'); return; }

  if (navigator.onLine === false || !conectado){
    filaAdd({ tipo:'execucao', funcao:'tf_registrar_execucao', payload, assinatura,
              osId: os.os_id, rotulo: os.numero });
    local(); i._fila = true;
    pintarExecucao();
    toast('Sem sinal — registro salvo no aparelho. Sobe sozinho quando conectar.','err');
    return;
  }

  setConn('sync','enviando…');
  try{
    await rpc('tf_registrar_execucao', payload);
    setConn('ok','conectado');
    local(); delete i._fila;
    filaRemover(assinatura);          // se havia versão antiga na fila, esta manda
    pintarExecucao();
    toast('Registrado: ' + rotuloAcao(v.acao) + '.','ok');
  }catch(e){
    if (e.negocio){
      setConn('ok','conectado');
      toast('Recusado: ' + e.message,'err');
      document.querySelectorAll('#main .btn').forEach(b => b.disabled = false);
    } else {
      filaAdd({ tipo:'execucao', funcao:'tf_registrar_execucao', payload, assinatura,
                osId: os.os_id, rotulo: os.numero });
      local(); i._fila = true;
      pintarExecucao();
      toast('Não deu para enviar agora — ficou na fila, nada se perdeu.','err');
    }
  }
}

/**

  document.getElementById('fCaF').addEventListener('click', pintarExecucao);

    if (DEMO){ demoFecharExec(os.os_id); toast('Instalação fechada.','ok');
               await carregar(true); pintarLista(); return; }
    if (navigator.onLine === false || !conectado){
      toast('O fechamento precisa de sinal. Os registros já estão salvos — tente quando conectar.','err');
      document.querySelectorAll('#main .btn').forEach(b => b.disabled = false);
      return;
    }
    setConn('sync','enviando…');
    try{
      const r = await rpc('tf_fechar_execucao', { p_os_id: os.os_id, p_observacao: obs || null });
      setConn('ok','conectado');
      toast('Instalação fechada — ' + (r && r.itens ? r.itens : p.feitos) + ' item(ns).','ok');
      exec = null;
      await carregar(true);
      pintarLista();
    }catch(e){
      if (e.negocio){ setConn('ok','conectado'); toast('Recusado: ' + e.message,'err'); }
      else toast('Não deu para fechar agora — tente de novo com sinal.','err');
      document.querySelectorAll('#main .btn').forEach(b => b.disabled = false);
    }
  });
}

/* S21 · item 1 do S50 — a mensagem não cobre botão nenhum da barra do rodapé.
   S23 · item E do S52 — e também não EMPURRA a tela: ela flutua sobre o
   conteúdo, logo abaixo do cabeçalho e das faixas (o CSS explica).
   · O `top` é medido na hora: a borda de cima do `main` (= o pé do cabeçalho
     e das faixas que estiverem visíveis) + 8 px. Com o teclado aberto o
     cabeçalho pode sair da tela: aí vale o topo da parte VISÍVEL.
   · Tocar nela só a dispensa — ela captura o toque, nada atravessa.
   · Erro e recusa pedem uma ação do inspetor: ficam 8 s (ou até o toque).
     Sucesso continua em ~4,6 s.
   · Leitor de tela: `status` no sucesso, `alert` no erro. */
let toastT = null;
function toastFechar(){
  const el = document.getElementById('toast');
  clearTimeout(toastT); toastT = null;
  if (!el || !el.classList.contains('on')) return;
  el.className = 'toast'; el.style.top = '';
}
function toast(msg, tipo){
  const el = document.getElementById('toast');
  if (!el) return;
  toastFechar();
  el.setAttribute('role', tipo === 'err' ? 'alert' : 'status');
  el.setAttribute('aria-live', tipo === 'err' ? 'assertive' : 'polite');
  el.textContent = msg;
  el.className = 'toast on' + (tipo ? ' ' + tipo : '');
  // Teclado aberto: o cabeçalho pode estar fora da parte visível da tela.
  const vv = window.visualViewport;
  const teclado = !!vv && (vv.offsetTop > 4 || vv.height < window.innerHeight - 120);
  let top = 64;
  if (teclado){
    el.classList.add('flut');
    top = Math.round(vv.offsetTop + 8);
  } else {
    const m = document.getElementById('main');
    if (m) top = Math.round(m.getBoundingClientRect().top + 8);
  }
  el.style.top = top + 'px';
  toastT = setTimeout(toastFechar, tipo === 'err' ? 8000 : 4600);
}
document.getElementById('toast').addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); toastFechar(); });

async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method:'POST', headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password: senha }), signal: sinal(true)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'E-mail ou senha inválidos');
  sessao.token = j.access_token;
  sessao.refresh = j.refresh_token || null;
  // O servidor diz quem é a pessoa e o que ela abre — ver sql/26_acesso.sql.
  const a = await rpc('tf_meu_acesso', {});
  if (!a || !a.perfil) throw new Error('Login criado, mas você ainda não tem perfil no sistema. Fale com o Fernando.');
  if (!a.usa_campo){
    // S16 · de escritório com ficha de RH entra só para a Minha Segurança
    let temFicha = false; try{ temFicha = !!(await rpc('tf_rh_tenho_ficha', {})); }catch(e){}
    if (!temFicha) throw new Error('Seu perfil (' + (a.perfil_nome || a.perfil) + ') não trabalha em campo. Entre pela Gestão.');
  }
  Object.assign(sessao, { nome:a.nome, perfil:a.perfil, perfil_nome:a.perfil_nome,
    admin:!!a.admin, modulos:a.modulos || [], executa_em:a.executa_em });
  LS.set(K_SESSAO, sessao);
}

/* ── Olho de ver a senha (S12) ───────────────────────────────────────────────
   Senha digitada às cegas erra fácil, e o erro só aparece como "credenciais
   inválidas" — que é a mesma mensagem de senha errada de verdade. O botão só
   troca o `type` do campo: nada da senha é guardado, lido ou enviado a lugar
   nenhum, e ele volta a ficar oculto toda vez que a tela de login aparece.
   `tabindex="-1"` no botão de propósito: Tab vai do e-mail à senha e da senha
   ao Entrar, sem parar no olho. */
function olhoSenha(mostrar){
  const b = document.getElementById('lgOlho'), c = document.getElementById('lgS');
  if (!b || !c) return;
  c.type = mostrar ? 'text' : 'password';
  b.classList.toggle('ver', mostrar);
  const rot = mostrar ? 'Ocultar senha' : 'Mostrar senha';
  b.setAttribute('aria-label', rot);
  b.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
  b.title = rot;
}
try{
  document.getElementById('lgOlho').addEventListener('click', () => {
    const c = document.getElementById('lgS');
    olhoSenha(c.type === 'password');
    c.focus();
  });
}catch(e){}
