<!-- ── app instalável (PWA) ──────────────────────────────────────────────────
     Instalado, o app abre sem a barra do navegador, sobrevive a fechar a aba e
     ABRE SEM SINAL — que é o caso normal dentro de planta industrial. O
     service worker guarda só a casca; dado nenhum. -->
<link rel="manifest" href="manifest.webmanifest">
<!-- ── favicon ────────────────────────────────────────────────────────────────────────
     O "E" da Engetap DENTRO do arquivo, como data-URI. Por que embutido e não
     apontando para icons/: o ícone por caminho só aparece se a pasta icons/ for
     junto e se o nível de pasta bater — e o Hub apontava para field/icons/, que
     existe no PUBLICAR e não existe em app/hub/. Embutido, a aba mostra o ícone
     no GitHub Pages, no duplo clique e em qualquer pasta. É SVG: fica nítido em
     tela retina. Os PNG de icons/ continuam existindo — o app instalado (PWA)
     precisa de arquivo de verdade e usa aqueles. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Crect width=%22512%22 height=%22512%22 rx=%22104%22 fill=%22%231B6FA9%22/%3E%3Cg transform=%22translate(0,512) scale(1,-1) translate(256,256.5) scale(1.3) translate(-256,-256.5)%22 fill=%22%23fff%22 stroke=%22%23fff%22 stroke-width=%2222%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M117 414 l-1 0 0 -121 0 -120 19 0 19 0 0 -37 0 -38 121 0 121 0 -45 45 -44 45 -69 0 -69 0 0 12 0 11 90 0 89 0 0 1 0 1 -44 44 -45 44 -45 0 -45 0 0 12 0 11 99 0 99 0 0 1 0 0 -45 45 -44 45 -81 0 -80 0 0 -1z m184 -44 l30 -29 0 -1 0 -1 -88 0 -89 0 0 -75 0 -76 -11 0 -12 0 0 105 0 106 1 0 0 1 70 0 69 0 30 -30z m-19 -113 l30 -29 0 -1 0 -1 -67 0 -67 0 0 30 0 30 1 0 0 1 37 0 36 0 30 -30z m47 -114 l30 -29 0 -1 0 0 -95 0 -95 0 0 30 0 30 65 0 66 0 29 -30z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- ═══════════════════════════════════════════════════════════════════════════
     TAPFLOW FIELD — TFF_S5
     Engetap Engenharia · o app do inspetor

     S5 acrescenta: o app vira INSTALÁVEL (abre sem o navegador e sem sinal) e
     a sessão vencida deixa de virar quadro vazio — vai para o login dizendo o
     que houve.
     S4 trouxe a tela da fase 2: registro item a item da instalação, com
     certificado e lacre, e o fechamento que só libera com 100%.
     S2 trouxe: fotos (do ponto e do aceite) gravadas no Google Drive, coleta
     em EQUIPE (dois técnicos na mesma OS) e a fila offline cuidando também
     das imagens.

     ARQUIVO ÚNICO. Sem SUPABASE_URL preenchido, roda em MODO DEMO.

     ── O QUE ESTE APP PRECISA ACERTAR ─────────────────────────────────────────
     Ele roda dentro de planta industrial, com sinal ruim. Três regras vieram
     direto do que o TapControl errou (achados DAT-01, DAT-02 e DAT-05):

     1. O client_uid é gerado UMA VEZ por coleta e reusado em todo reenvio.
        É ele que faz o banco recusar o envio duplicado em vez de criar uma
        segunda OS de material.
     2. O verde NUNCA mente. "Enviado" só aparece depois de resposta de verdade
        do servidor. Sem resposta, o levantamento fica visível "na fila".
     3. Nada é apagado sem confirmação do servidor. O rascunho só some depois
        que o envio volta OK.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
/* A cor sai da logomarca da Engetap, e ela é AZUL: o monograma é um gradiente
   de #1D4E80 a #2596D5, o texto é #515252, o subtítulo é #0087CC. Até o S5 este
   app era verde — escolha minha, sem base na marca. Corrigido no S6. */
:root{
  --paper:#F1F3F4; --surface:#FFFFFF; --surface-2:#F7F9FA;
  --ink:#14181B; --ink-2:#515252; --ink-3:#78838A;
  --rule:#DBE0E3; --rule-2:#EBEFF1;
  --accent:#1B6FA9; --accent-soft:#E3EEF7; --accent-ink:#164C77; --accent-alt:#0087CC;
  --crit:#A62D18; --crit-soft:#F8E5E0;
  --warn:#8A5A12; --warn-soft:#F8EEDC;
  --ok:#1E7A42; --ok-soft:#DFF0E6;
  --sh:0 1px 2px rgba(15,23,25,.06), 0 6px 16px -10px rgba(15,23,25,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

/* ── topo ─────────────────────────────────────── */
header{
  flex:0 0 auto;background:var(--accent);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
header .back{
  background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;
  border-radius:4px;font-size:19px;line-height:1;flex:0 0 auto;
}
header .tit{flex:1;min-width:0}
header .tit b{display:block;font-size:16px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tit small{display:block;font-size:12px;opacity:.8;line-height:1.3}
header .st{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.92;flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5)}
.dot.ok{background:#7BE0A9}.dot.off{background:#FF9E86}
.dot.sync{background:#FFD98A;animation:pl 1.1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}

.aviso{flex:0 0 auto;padding:8px 14px;font-size:13px;font-weight:600}
.aviso.demo{background:var(--warn-soft);color:var(--warn)}
.aviso.fila{background:var(--crit-soft);color:var(--crit);display:flex;gap:8px;align-items:center}
.aviso.fila button{background:var(--crit);color:#fff;border:0;border-radius:3px;padding:4px 10px;font-size:12px;font-weight:600;margin-left:auto}
.aviso.inst{background:var(--accent-soft);color:var(--accent-ink);display:flex;gap:8px;align-items:center}
.aviso.inst button{background:var(--accent);color:#fff;border:0;border-radius:3px;
  padding:5px 12px;font-size:12px;font-weight:600;margin-left:auto;flex:0 0 auto}
.aviso.inst button.nao{background:none;color:var(--accent-ink);margin-left:0;padding:5px 4px;font-size:15px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px;
  display:flex;flex-direction:column}

/* ── cartões de OS ────────────────────────────── */
.osCard{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);
  border-left:4px solid var(--accent);border-radius:5px;padding:13px 14px;
  box-shadow:var(--sh);margin-bottom:10px;display:block;
}
.osCard.outro{border-left-color:var(--rule)}
/* O cartão do roteiro se distingue por ÊNFASE, não por outra cor de marca:
   inventar uma terceira cor faria o inspetor decorar mais um código. */
.osCard.doDia{border-left-width:6px}
.osCard.atrasadaDia{border-left-color:var(--crit)}
.osCard[disabled]{opacity:.55}
/* Mesmas duas cores do Manager para os mesmos dois fatos: atraso é vermelho,
   risco é âmbar. O mesmo time olha as duas telas. */
.chip.urg{background:var(--crit-soft);color:var(--crit)}
.chip.atr{background:var(--crit-soft);color:var(--crit)}
/* S15 · a marca de reagendada (Manager S41 · item 7): discreta, a mesma cor */
.chip.reag{background:#EEE7F7;color:#4B2E83;border-color:transparent}
/* S15 · o aviso de atrasadas no topo da lista */
.atrasadas{border-left:4px solid #D0201A}
.atrasadas .al{border-top:1px solid var(--rule-2);padding:11px 0 2px}
.atrasadas .al:first-of-type{border-top:0}
.atrasadas .al b{display:block;font-size:15px;line-height:1.3}
.atrasadas .al small{display:block;font-size:12.5px;color:var(--ink-3);margin:2px 0 8px;line-height:1.4}
.atrasadas .al .quando{color:#9E1B14;font-weight:700}
.atrasadas input[type=date]{width:100%;font-size:16px;padding:10px;border:1px solid var(--rule);border-radius:5px;margin:0 0 8px}
/* S15 · as etapas da OS que o meu perfil faz */
.etapa{border-top:1px solid var(--rule-2);padding:10px 0}
.etapa:first-of-type{border-top:0}
.etapa b{display:block;font-size:14.5px;line-height:1.3}
.etapa small{display:block;font-size:12.5px;color:var(--ink-3);margin:2px 0 7px;line-height:1.4}
.chip.alt{background:var(--warn-soft);color:var(--warn)}
.chip.risc{background:var(--warn-soft);color:var(--warn)}
.osCard.sitAtr{border-left-color:var(--crit)}
.osCard.sitRis{border-left-color:var(--warn)}
.semAbrir{font-size:12px;color:var(--ink-3);margin-top:7px;padding-top:7px;
  border-top:1px dashed var(--rule)}
.fotoZoom{position:fixed;inset:0;background:rgba(10,20,30,.82);z-index:90;display:flex;
  align-items:center;justify-content:center;padding:18px}
.fotoZoom .fzBox{background:var(--surface);border-radius:10px;padding:14px;max-width:420px;width:100%}
.fotoZoom img{width:100%;height:auto;border-radius:6px;display:block;
  image-rendering:auto;background:var(--surface-2)}
.fotoZoom p{font-size:13.5px;margin:10px 0;line-height:1.35}
.fotoZoom .btn{width:100%}
.itemCat .fotoP{cursor:zoom-in}
.osCard .n{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.osCard .c{font-size:17px;font-weight:600;line-height:1.25;margin:3px 0 7px}
.osCard .t{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.osCard .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2)}
.chip.eu{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
/* S13: `.eu` também é o botão "…" do topo (20px, mais abaixo) e vencia o
   tamanho do chip — "você começou" saía com letra de título. Duas classes
   ganham de uma: o chip volta aos 11px. */
.chip.eu{font-size:11px;line-height:normal;padding:3px 8px}
.chip.fila{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.outro{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.sec{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 9px}
.sec:first-child{margin-top:2px}

.vazio{text-align:center;padding:44px 20px;color:var(--ink-3)}
.vazio b{display:block;font-size:17px;color:var(--ink-2);margin-bottom:6px}
.vazio p{font-size:14px;margin:0;line-height:1.5}

/* ── painel da tarefa ─────────────────────────── */
.painel{background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:15px;box-shadow:var(--sh);margin-bottom:12px}
.painel .et{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.painel h2{font-size:19px;font-weight:600;margin:5px 0 6px;line-height:1.25}
.painel p{font-size:14px;color:var(--ink-2);margin:0 0 13px;line-height:1.5}
.painel p:last-child{margin-bottom:0}

.btn{display:block;width:100%;padding:14px;border-radius:5px;border:1px solid var(--rule);
  background:var(--surface);font-size:16px;font-weight:600;text-align:center;margin-bottom:9px}
.btn:last-child{margin-bottom:0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--surface);border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.45}
.btn.sm{padding:10px;font-size:14px}
.linha{display:flex;gap:8px}
.linha .btn{margin-bottom:0}

/* ── coleta ───────────────────────────────────── */
.itemRow{background:var(--surface);border:1px solid var(--rule);border-radius:5px;
  padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.itemRow .q{flex:0 0 auto;background:var(--accent-soft);color:var(--accent-ink);
  font-weight:700;font-size:14px;border-radius:4px;padding:5px 9px;min-width:38px;text-align:center}
.itemRow .d{flex:1;min-width:0}
.itemRow .d b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.itemRow .d small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.itemRow .x{flex:0 0 auto;background:none;border:0;color:var(--ink-3);font-size:20px;padding:2px 4px}
.itemRow .cv{flex:0 0 auto;color:var(--ink-3);font-size:19px;line-height:1}
.itemRow.feito{border-left:3px solid var(--ok)}
.itemRow .q.feito{background:var(--ok-soft);color:var(--ok)}
.itemRow.naoexec{border-left:3px solid var(--warn)}
.itemRow .q.naoexec{background:var(--warn-soft);color:var(--warn)}
.prog{height:7px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.grupoTit{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:17px 0 7px}

.campo{margin-bottom:13px}
.campo label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.campo input,.campo select,.campo textarea{
  width:100%;padding:12px;border:1px solid var(--rule);border-radius:5px;
  background:var(--surface);font-size:16px}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:2px solid var(--accent);outline-offset:-1px}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.tog button{flex:1;min-width:88px;padding:11px 8px;border:1px solid var(--rule);
  border-radius:5px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.tog button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--rule);
  border-radius:5px;background:var(--surface);margin-bottom:8px;font-size:15px}
.check input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--accent)}

.itemCat{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;padding:13px 14px;margin-bottom:7px}
.itemCat:active{background:var(--accent-soft);border-color:var(--accent)}
.itemCat b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.itemCat small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
/* A foto entra ao lado, e a linha NÃO muda de altura quando ela chega: o
   quadrado já está reservado. Lista que pula enquanto carrega faz o dedo
   errar o item — e em campo o dedo já erra o suficiente com luva. */
.itemCat.comFoto{display:flex;gap:12px;align-items:center}
.itemCat .fotoP{width:56px;height:56px;flex:0 0 auto;border-radius:5px;
  border:1px solid var(--rule);background:var(--surface-2);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.itemCat .fotoP img{width:100%;height:100%;object-fit:cover;display:block}
.itemCat .txtP{flex:1;min-width:0}
.doCatalogo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--accent-soft);
  border-radius:5px;padding:11px 13px;margin-bottom:14px;font-size:13.5px;color:var(--accent)}
.doCatalogo b{font-weight:700}
.veio{font-size:12px;color:var(--accent-ink);margin:6px 0 0;line-height:1.4}
.lnk{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;
  text-decoration:underline;padding:2px 0}

.barra{
  position:sticky;bottom:0;margin:14px -12px -28px;margin-top:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--rule);
}
.resumo{font-size:13px;color:var(--ink-3);margin-bottom:9px;text-align:center}

.toast{position:fixed;left:12px;right:12px;bottom:16px;background:var(--ink);color:#fff;
  padding:13px 15px;border-radius:5px;font-size:14.5px;opacity:0;pointer-events:none;
  transition:all .2s;transform:translateY(10px);z-index:20;line-height:1.4}
.toast.on{opacity:1;transform:none}
.toast.err{background:var(--crit)}.toast.ok{background:var(--ok)}

/* ── conta ────────────────────────────────────── */
.eu{background:none;border:0;color:inherit;font-size:20px;line-height:1;padding:4px 8px;
  border-radius:5px;cursor:pointer;opacity:.75}
.eu:active{background:rgba(255,255,255,.15)}
.euPan{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:80;display:flex;
  align-items:flex-end;justify-content:center;padding:16px}
.euPan .cx{background:var(--surface);border-radius:10px;padding:18px;width:100%;max-width:380px;
  display:flex;flex-direction:column;gap:9px}
.euPan b{font-size:16px}
.euPan small{color:var(--ink-3);font-size:12.5px;margin-top:-6px;margin-bottom:6px}
.euPan button{padding:13px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);
  font:600 15px inherit;cursor:pointer}
.euPan button.perigo{color:var(--crit);border-color:#E9C4BA}
.euPan button.fraco{color:var(--ink-3);border:0}

/* ── login ────────────────────────────────────── */
.login{position:fixed;inset:0;background:var(--accent);display:flex;align-items:center;
  justify-content:center;padding:22px;z-index:30}
.login .box{background:var(--surface);border-radius:7px;padding:26px;width:100%;max-width:360px}
.login h1{margin:0 0 2px;font-size:26px;letter-spacing:-.02em}
.login h1 span{color:var(--accent)}
.login .sub{font-size:13.5px;color:var(--ink-3);margin:0 0 20px}
.login .erro{color:var(--crit);font-size:13px;margin:0 0 10px;min-height:18px;line-height:1.4}
/* Olho de ver a senha (S12). Alvo de 46px — é dedo de inspetor com luva, no
   sol, e o campo do Field já usa fonte 16px para o iPhone não dar zoom. */
.cxSenha{position:relative}
.cxSenha input{padding-right:48px}
.cxSenha .olho{position:absolute;top:0;right:0;bottom:0;width:46px;display:flex;
  align-items:center;justify-content:center;padding:0;margin:0;border:0;border-radius:0;
  background:none;color:var(--ink-3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cxSenha .olho svg{width:21px;height:21px;display:block}
.cxSenha .olho .fechado{display:none}
.cxSenha .olho.ver .aberto{display:none}
.cxSenha .olho.ver .fechado{display:block}
/* ── S39 · extras encontrados na inspeção ─────── */
.painel.extras{border-left:4px solid var(--warn)}
.exLista{margin:10px 0 4px;display:flex;flex-direction:column;gap:6px}
.exLinha{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35;
  padding:8px 0;border-top:1px solid var(--rule)}
.exLinha .q{flex:0 0 auto;min-width:26px;font-weight:700;text-align:center}
.exLinha .d{flex:1;min-width:0}
.exLinha .d small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.chip.okc{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.imp{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.exNota{font-size:12.5px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}
.exPend{font-size:13.5px;color:var(--warn);font-weight:600;margin:8px 0 0}
/* ── S16 · Minha Segurança (RH, fase R1) ───────── */
.abasTopo{display:flex;gap:6px;margin:0 0 12px;background:var(--surface);border:1px solid var(--rule);
  border-radius:7px;padding:4px}
.abasTopo button{flex:1;padding:10px 6px;border:0;border-radius:5px;background:none;font-size:14.5px;
  font-weight:600;color:var(--ink-2)}
.abasTopo button.on{background:var(--accent);color:#fff}
.abasTopo .bolha{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--crit);
  color:#fff;font-size:12px;line-height:20px;margin-left:4px}

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
// CONFIGURAÇÃO — Supabase → Settings → API. Vazio = modo demo.
// ════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL      = 'https://ewthwgkgwzgutvxkwqfd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_W987XKBK3Oo2aQ7FJyq9_w_qWrSg_E4';   // a "Publishable key" (sb_publishable_...)

const APP_VERSION = 'S18';

const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;
// o crachá lê a constante, nunca o contrário: já houve app dizendo uma versão e
// rodando outra, e é o número que eu peço quando algo dá errado
try{ document.getElementById('lgVer').textContent = APP_VERSION; }catch(e){}

// Chave ÚNICA para os três arquivos (hub, Manager e Field). Até o S6 este app
// guardava a sessão em 'tff_sessao' e o Manager em 'tapflow_sessao', o que
// obrigava o inspetor a logar duas vezes. O GitHub Pages serve os dois do mesmo
// endereço, então nunca precisou ser assim. A 'tff_sessao' segue sendo adotada
// para ninguém ser expulso no dia da virada.
const K_SESSAO = 'tf_sessao';
const K_SESSAO_VELHA = 'tff_sessao';
const K_FILA   = 'tff_fila';
const K_DRAFT  = 'tff_draft_';
// S39 · os EXTRAS de uma inspeção têm rascunho próprio: a coleta de acessórios
// de uma OS de fornecimento e os achados de uma inspeção nunca se misturam.
const K_EXTRA  = 'tff_extra_';
const K_PARAM  = 'tff_param';
const K_CAT    = 'tff_catalogo';

// ── armazenamento tolerante a falha ─────────────────────────────────────────
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,10));

// ════════════════════════════════════════════════════════════════════════════
// REDE — mesmo endurecimento do TFM
// ════════════════════════════════════════════════════════════════════════════
// O login mora no hub; aqui só se vai para lá quando isto está sendo SERVIDO.
// Aberto do disco (file://) não existe ../ para onde ir.
const NO_SERVIDOR = location.protocol === 'http:' || location.protocol === 'https:';
function irParaHub(recado){
  try{ sessionStorage.setItem('tf_recado', recado || ''); }catch(e){}
  location.href = '../?para=field';
}

let sessao = (function(){
  const VAZIA = { token:null, refresh:null, nome:null, perfil:null, perfil_nome:null,
                  admin:false, modulos:[], executa_em:null };
  let s = LS.get(K_SESSAO, null);
  if (!s){
    const v = LS.get(K_SESSAO_VELHA, null);   // adoção da chave antiga
    if (v && v.token){ s = v; LS.set(K_SESSAO, v); LS.del(K_SESSAO_VELHA); }
  }
  return Object.assign({}, VAZIA, s || {});
})();

// ── RENOVAÇÃO DO TOKEN ──────────────────────────────────────────────────────
// O token do Supabase vale ~1 hora. Em campo isso é pior que no escritório: o
// inspetor está no meio da planta, com meia barra de sinal, e o app manda
// "JWT expired" no momento de enviar o levantamento. O refresh_token troca o
// token vencido por um novo sem pedir senha.
let renovando = null;

async function renovarToken(){
  if (!sessao.refresh) return false;
  if (renovando) return renovando;
  renovando = (async () => {
    try{
      const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST',
        headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: sessao.refresh }),
        signal: sinal(true)
      });
      const j = await r.json().catch(()=>null);
      if (!r.ok || !j || !j.access_token) return false;
      sessao.token = j.access_token;
      if (j.refresh_token) sessao.refresh = j.refresh_token;
      LS.set(K_SESSAO, sessao);
      return true;
    }catch(e){ return false; }
    finally{ setTimeout(() => { renovando = null; }, 0); }
  })();
  return renovando;
}

const tokenVencido = e =>
  e && (e.status === 401 || /jwt expired|invalid jwt|token.*expired|not authenticated/i.test(e.message||''));

// Sem renovação possível: volta para o login. O RASCUNHO E A FILA FICAM —
// nunca se apaga o que o inspetor lançou porque a sessão venceu.
function sessaoExpirou(){
  sessao = { token:null, refresh:null, nome:null, perfil:null, perfil_nome:null,
             admin:false, modulos:[], executa_em:null };
  LS.del(K_SESSAO); LS.del(K_SESSAO_VELHA);
  pararRecon();
  setConn('off','entre de novo');
  // A FILA E O RASCUNHO FICAM (chaves diferentes, e ninguém as toca aqui).
  if (NO_SERVIDOR){
    irParaHub('Sua sessão expirou. Entre de novo — o que você lançou está guardado.');
    return;
  }
  const lg = document.getElementById('login');
  if (lg){
    lg.hidden = false;
    const er = document.getElementById('lgErr');
    if (er) er.textContent = 'Sua sessão expirou. Entre de novo — o que você lançou está guardado.';
  }
}
let conectado = false, reconT = null, reconP = 0;
const BACKOFF = [5000,10000,20000,40000,60000];

function setConn(e, t){
  document.getElementById('dot').className = 'dot' + (e ? ' '+e : '');
  document.getElementById('stTxt').textContent = t || '';
  conectado = (e === 'ok');
}
function sinal(w){ try{ if (AbortSignal.timeout) return AbortSignal.timeout(w ? 45000 : 30000); }catch(e){} }
const ehTO = e => !!e && (e.name==='TimeoutError'||e.name==='AbortError'||/timeout|aborted/i.test(e.message||''));

function pararRecon(){ if(reconT){clearTimeout(reconT);reconT=null;} reconP=0; }
function agendarRecon(){
  if (reconT || DEMO) return;
  const t = BACKOFF[Math.min(reconP, BACKOFF.length-1)]; reconP++;
  setConn('off','sem sinal');
  reconT = setTimeout(() => { reconT = null; flushFila().then(()=>carregar(true)).catch(()=>{}); }, t);
}

async function req(caminho, opts={}, tentativas=2){
  const escrita = (opts.method||'GET').toUpperCase() !== 'GET';
  let ultimo;
  let jaRenovou = false;
  for (let i=0;i<=tentativas;i++){
    try{
      const r = await fetch(SUPABASE_URL + caminho, Object.assign({}, opts, {
        signal: sinal(escrita),
        // A chave vai SEMPRE no `apikey`. O `Authorization` só entra quando
        // existe sessão — as chaves novas (sb_publishable_...) não são JWT.
        headers: Object.assign(
          { apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
          sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {},
          opts.headers||{})
      }));
      const txt = await r.text();
      if (txt.trim().startsWith('<')) throw new Error('O servidor devolveu HTML — confira a URL');
      let corpo = null;
      if (txt){ try{ corpo = JSON.parse(txt); }catch(e){ throw new Error('Resposta inválida do servidor'); } }
      if (!r.ok){
        const msg = (corpo && (corpo.message||corpo.error_description||corpo.error||corpo.hint)) || ('HTTP '+r.status);
        const err = new Error(msg); err.negocio = (r.status>=400 && r.status<500); err.status = r.status;

        // sessão velha: renova UMA vez e repete. Vale também para o item na
        // fila offline — ele volta a subir sozinho em vez de virar erro.
        // Sessão vencida. A ordem importa: tenta renovar UMA vez; se não der —
        // ou se nem existe refresh_token guardado (sessão antiga, de antes da
        // renovação automática) — manda para o login com recado claro. Antes,
        // este caso caía direto no `throw` e a pessoa ficava com o quadro vazio
        // e um "JWT expired" vermelho na tela: parece perda de dados, e não é.
        if (tokenVencido(err)){
          if (!jaRenovou && sessao.refresh){
            jaRenovou = true;
            if (await renovarToken()){ i--; continue; }
          }
          sessaoExpirou();
          throw Object.assign(new Error('Sua sessão expirou. Entre de novo — nada se perdeu.'),
                              { negocio:true, sessaoMorta:true });
        }
        throw err;
      }
      return corpo;
    }catch(e){
      ultimo = ehTO(e)
        ? Object.assign(new Error('O servidor não respondeu' + (escrita ? ' — pode NÃO ter sido enviado.' : '.')), {rede:true})
        : e;
      const transitorio = !e.negocio && (ehTO(e) || /Failed to fetch|NetworkError|Load failed/i.test(e.message)
        || /devolveu HTML/.test(e.message) || /^HTTP 5\d\d$/.test(e.message));
      ultimo.rede = transitorio;
      if (!transitorio || i === tentativas){ if (transitorio) agendarRecon(); throw ultimo; }
      await new Promise(r => setTimeout(r, 600*(i+1)));
    }
  }
  throw ultimo;
}
const get = q => req('/rest/v1/' + q);
const rpc = (f,p) => req('/rest/v1/rpc/' + f, { method:'POST', body: JSON.stringify(p||{}) });

window.addEventListener('online',  () => { pararRecon(); flushFila().then(()=>carregar(true)).catch(()=>{}); });
window.addEventListener('offline', () => { setConn('off','sem sinal'); agendarRecon(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ flushFila().then(()=>carregar(true)).catch(()=>{}); }
});
// batimento: tenta esvaziar a fila mesmo com o indicador verde
setInterval(() => { if (!DEMO && filaLer().length) flushFila().catch(()=>{}); }, 90000);

// ════════════════════════════════════════════════════════════════════════════
// FOTOS
// ----------------------------------------------------------------------------
// O localStorage tem ~5 MB e guarda o índice da fila. Foto NÃO cabe lá: uma
// única imagem de 300 KB em base64 já ocupa 400 KB e estoura a cota com meia
// dúzia. Então: localStorage indexa, IndexedDB guarda o conteúdo. É a mesma
// separação que o PCF do ProperCare precisou fazer.
// ════════════════════════════════════════════════════════════════════════════
const IDB = {
  _p: null,
  abrir(){
    if (this._p) return this._p;
    this._p = new Promise((ok, err) => {
      const r = indexedDB.open('tapflow_field', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('fotos'))
        r.result.createObjectStore('fotos'); };
      r.onsuccess = () => ok(r.result);
      r.onerror   = () => err(r.error || new Error('IndexedDB indisponível'));
    });
    return this._p;
  },
  async _tx(modo, fn){
    const db = await this.abrir();
    return new Promise((ok, err) => {
      const t = db.transaction('fotos', modo);
      const p = fn(t.objectStore('fotos'));
      t.oncomplete = () => ok(p && p.result !== undefined ? p.result : undefined);
      t.onerror    = () => err(t.error);
    });
  },
  put(k, v){ return this._tx('readwrite', st => st.put(v, k)); },
  get(k){    return this._tx('readonly',  st => st.get(k)); },
  del(k){    return this._tx('readwrite', st => st.delete(k)); }
};

/** Reduz para caber na rede da planta: 1600px no maior lado, JPEG 0.72. */
function reduzirFoto(file, maxDim, q){
  maxDim = maxDim || 1600; q = q || 0.72;
  return new Promise((ok, err) => {
    const fr = new FileReader();
    fr.onerror = () => err(new Error('Não consegui ler a imagem.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => err(new Error('Arquivo não parece ser uma imagem.'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){ const r = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        ok(c.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** Abre a câmera / galeria e devolve o dataURL já reduzido. */
function tirarFoto(){
  return new Promise(ok => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture','environment');
    i.style.display = 'none';
    i.addEventListener('change', async () => {
      const f = i.files && i.files[0];
      document.body.removeChild(i);
      if (!f) return ok(null);
      try { ok(await reduzirFoto(f)); }
      catch(e){ toast(e.message,'err'); ok(null); }
    });
    document.body.appendChild(i); i.click();
  });
}

// ── parâmetros do serviço de arquivos ───────────────────────────────────────
let PARAM = LS.get(K_PARAM, { drive_url:'', drive_chave:'' });
async function carregarParametros(){
  if (DEMO) return;
  try{
    const r = await get('parametros?select=chave,valor');
    const m = {}; (r||[]).forEach(x => m[x.chave] = x.valor);
    PARAM = { drive_url: m.drive_url || '', drive_chave: m.drive_chave || '' };
    LS.set(K_PARAM, PARAM);
  }catch(e){ /* usa o que estava salvo */ }
}
const driveLigado = () => DEMO || !!(PARAM.drive_url && PARAM.drive_chave);

/**
 * Sobe o arquivo para o Drive e registra o anexo no banco.
 * Sem cabeçalho customizado de propósito: assim o navegador não dispara o
 * preflight OPTIONS, que o Apps Script não responde.
 */
async function subirArquivo(dataUrl, meta){
  if (DEMO) return { drive_url:'https://drive.google.com/demo', file_id:'demo' };
  if (!driveLigado()) throw Object.assign(new Error('O Drive ainda não foi configurado.'), {negocio:true});

  const r = await fetch(PARAM.drive_url, {
    method:'POST', redirect:'follow', signal: sinal(true),
    body: JSON.stringify({
      chave: PARAM.drive_chave, token: sessao.token,
      client_uid: meta.client_uid, cliente: meta.cliente, os_numero: meta.os_numero,
      categoria: meta.categoria, nome: meta.nome, mime:'image/jpeg', base64: dataUrl
    })
  });
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('O serviço de arquivos não respondeu como esperado.');
  if (j.status !== 'ok') throw Object.assign(new Error(j.mensagem || 'Falha ao gravar no Drive'),
                                             { negocio: j.codigo === 'CHAVE' || j.codigo === 'TOKEN' });

  await rpc('tf_registrar_anexo', {
    p_os_id: meta.os_id, p_categoria: meta.categoria, p_nome: meta.nome,
    p_client_uid: meta.client_uid, p_drive_file_id: j.file_id, p_drive_url: j.url,
    p_os_item_id: meta.os_item_id || null, p_levantamento_id: meta.levantamento_id || null,
    p_tarefa_id: meta.tarefa_id || null, p_slot: meta.slot || null,
    p_mime: 'image/jpeg', p_bytes: j.bytes || null
  });
  return { drive_url: j.url, file_id: j.file_id };
}

// ════════════════════════════════════════════════════════════════════════════
// FILA OFFLINE
// ----------------------------------------------------------------------------
// A assinatura inclui o client_uid: dois envios diferentes nunca colidem, e o
// mesmo envio reenviado SUBSTITUI o da fila em vez de virar dois.
// Nada é descartado em silêncio — o que não sai fica visível na barra vermelha.
// ════════════════════════════════════════════════════════════════════════════
const filaLer = () => LS.get(K_FILA, []);
const filaGravar = f => LS.set(K_FILA, f);

function filaAdd(entrada){
  const f = filaLer().filter(e => e.assinatura !== entrada.assinatura);
  f.push(Object.assign({ tentativas:0, em: new Date().toISOString() }, entrada));
  filaGravar(f); pintarFila();
}
function filaRemover(assinatura){
  filaGravar(filaLer().filter(e => e.assinatura !== assinatura)); pintarFila();
}

let flushEmVoo = false;
async function flushFila(){
  if (DEMO || flushEmVoo) return;
  const f = filaLer(); if (!f.length) return;
  flushEmVoo = true;
  try{
    for (const e of f){
      try{
        if (e.tipo === 'anexo'){
          const dataUrl = await IDB.get(e.idbKey);
          if (!dataUrl){ filaRemover(e.assinatura); continue; }   // já subiu ou sumiu
          await subirArquivo(dataUrl, e.meta);
          await IDB.del(e.idbKey);
          filaRemover(e.assinatura);
        } else if (e.tipo === 'execucao'){
          // registro da volta ao cliente: não tem rascunho nem foto atrelada
          await rpc(e.funcao, e.payload);
          filaRemover(e.assinatura);
          // se a tela da execução está aberta, o item deixa de ser "no aparelho"
          if (exec && exec.osId === e.osId){
            const it = exec.itens.find(x => x.id === e.payload.p_os_item_id);
            if (it) delete it._fila;
          }
          toast('Registro da ' + e.rotulo + ' enviado.', 'ok');
        } else {
          const r = await rpc(e.funcao, e.payload);
          filaRemover(e.assinatura);
          LS.del(e.draftKey || (K_DRAFT + e.osId));
          await enfileirarFotosDoEnvio(e, r);
          toast(e.tipo === 'extras'
            ? 'Extras da ' + e.rotulo + ' enviados ao comercial' + (r && r.numero ? ' (' + r.numero + ')' : '') + '.'
            : 'Levantamento da ' + e.rotulo + ' enviado.', 'ok');
        }
      }catch(err){
        if (err.negocio){
          // o servidor RECUSOU por regra — reenviar não resolve. Sai da fila e avisa.
          filaRemover(e.assinatura);
          toast('A ' + e.rotulo + ' foi recusada: ' + err.message, 'err');
        } else {
          e.tentativas = (e.tentativas||0) + 1;
          filaGravar(filaLer().map(x => x.assinatura === e.assinatura ? e : x));
          break;   // sem rede: para de tentar os próximos
        }
      }
    }
  } finally {
    flushEmVoo = false; pintarFila();
    // a tela da execução conta a fila para decidir se o fechar acende — quando
    // a fila esvazia, ela precisa saber disso sem o inspetor sair e voltar
    if (tela === 'exec' && exec && !execForm) pintarExecucao();
  }
}

/**
 * Depois que o levantamento sobe, o servidor devolve os ids dos itens criados —
 * na mesma ordem em que foram enviados. É com eles que cada foto encontra o
 * seu item. Sem isso, a foto do manômetro ficaria solta na OS.
 */
async function enfileirarFotosDoEnvio(entrada, resposta){
  const fotos = entrada.fotos || [];
  if (!fotos.length) return;
  const ids = (resposta && resposta.itens_ids) || [];
  for (const f of fotos){
    const meta = Object.assign({}, f.meta, { os_item_id: ids[f.indice] || null });
    // S39 · o extra lançado na inspeção vira item de OUTRA OS (a da venda
    // adicional). A foto vai para onde o item está — é lá que o comercial a
    // procura para mandar ao cliente.
    if (resposta && resposta.os_id && entrada.tipo === 'extras'){
      meta.os_id = resposta.os_id; meta.os_numero = resposta.numero || meta.os_numero;
    }
    filaAdd({ tipo:'anexo', assinatura:'anx|'+meta.client_uid, osId: entrada.osId,
              rotulo: entrada.rotulo, idbKey: f.idbKey, meta });
  }
  flushFila().catch(()=>{});
}

function pintarFila(){
  const f = filaLer();
  const bar = document.getElementById('barFila');
  bar.hidden = !f.length;
  if (f.length){
    const soLev = f.every(e => e.tipo === 'levantamento' || e.tipo === 'anexo');
    const rot = soLev ? ['levantamento aguardando envio','levantamentos aguardando envio']
                      : ['registro aguardando envio','registros aguardando envio'];
    document.getElementById('filaTxt').textContent =
      f.length + ' ' + (f.length === 1 ? rot[0] : rot[1]);
  }
}

let falhaCarga = null;   // motivo do último erro de carga, para a tela vazia não mentir

async function carregar(silencioso){
  if (DEMO){ listaOS = demoLista(); MEU_DIA = demoMeuDia(); setConn('ok','demo');
             if(tela==='lista') pintarLista(); return; }
  if (!silencioso) setConn('sync','carregando…');
  try{
    // As duas juntas: a lista de OS do campo e o ROTEIRO de hoje desta pessoa.
    // O roteiro não substitui a lista — ele diz por onde começar.
    const [lst, dia, atr, reag, seg, apo] = await Promise.all([
      get('v_os_campo?select=*&order=coluna_ordem,numero'),
      get('v_meu_dia?select=*').catch(() => []),   // sem roteiro, o app segue igual
      // S15 · item 7 do S41 — sem o 61 no banco, as duas voltam vazias e o
      // app segue como no S14 (sem aviso e sem marca), sem erro na tela
      rpc('tf_minhas_atrasadas', {}).catch(() => []),
      get('v_reagendamentos_resumo?select=os_id,tarefa_id,compromisso_id,vezes,original').catch(() => []),
      // S16 · RH (Minha Segurança) e S9 (atrasadas em que sou apoio). Sem o 62
      // no banco, as duas voltam vazias e o app segue como no S15.
      rpc('tf_rh_meu_resumo', {}).catch(() => null),
      rpc('tf_atrasadas_como_apoio', {}).catch(() => [])
    ]);
    SEG = seg || null;
    APOIO_ATR = apo || [];
    listaOS = lst || [];
    MEU_DIA = dia || [];
    ATRASADAS = atr || [];
    await carregarEscaladas();   // S15
    REAG = new Map((reag || []).map(x => [chaveReag(x.os_id, x.tarefa_id, x.compromisso_id), x]));
    falhaCarga = null;
    pararRecon(); setConn('ok','conectado');
    if (tela === 'lista') pintarLista();
    else if (tela === 'seg' && !silencioso) pintarSeg();
  }catch(e){
    // guarda O MOTIVO da falha: lista vazia por erro não pode ser desenhada
    // como "nada para fazer hoje" — foi assim que o "JWT expired" virou susto
    falhaCarga = e.message || 'não deu para carregar';
    if (e.negocio && !e.sessaoMorta){ setConn('off','erro'); toast(e.message,'err'); }
    if (tela === 'lista') pintarLista();
  }
}

function pintarLista(){
  // S16 · quem é de escritório só usa o Field para a Minha Segurança
  if (soSeg() && SEG && SEG.tem_ficha) return pintarSeg();
  tela = 'lista'; atual = null; coleta = null;
  document.getElementById('btnBack').hidden = true;
  document.getElementById('hTit').textContent = 'Minhas ordens';
  document.getElementById('hSub').textContent =
    (sessao.nome || '') + (listaOS.length ? ' · ' + listaOS.length + ' no campo' : '');

  const m = document.getElementById('main');
  m.innerHTML = '';
  // S13: o "Hoje" pode ter coisa mesmo sem OS no campo — uma VISITA de negócio
  // (não é OS) ou uma etapa de escritório no seu nome. Até o S12 a lista vazia
  // saía cedo com "Nada no campo agora" e escondia o roteiro do dia.
  if (!listaOS.length && !(MEU_DIA || []).length && !(ATRASADAS || []).length && !(ESCALADAS || []).length
      && !(APOIO_ATR || []).length && !(SEG && SEG.tem_ficha)){
    if (falhaCarga){
      const v = document.createElement('div'); v.className = 'vazio';
      v.innerHTML = '<b>Não deu para carregar suas ordens</b><p class="mt"></p>' +
        '<button class="btn" id="bTent" style="max-width:260px;margin:18px auto 0">Tentar de novo</button>';
      v.querySelector('.mt').textContent = falhaCarga +
        ' — isto NÃO quer dizer que não há OS para você.';
      m.appendChild(v);
      document.getElementById('bTent').addEventListener('click',
        () => carregar().then(pintarLista).catch(()=>pintarLista()));
      return;
    }
    m.innerHTML = '<div class="vazio"><b>Nada no campo agora</b>' +
      '<p>Quando o escritório abrir uma OS para você, ela aparece aqui.</p></div>';
    return;
  }

  // O roteiro vem primeiro e leva as OS dele para fora dos outros blocos: a
  // mesma OS aparecendo em "Hoje" e em "Para você" faz a pessoa achar que são
  // duas coisas diferentes.
  let noDia = new Set();
  try{ noDia = new Set((MEU_DIA || []).map(t => t.os_id)); }catch(e){ noDia = new Set(); }
  const minhas = listaOS.filter(o => o.minha  && !noDia.has(o.os_id));
  const outras = listaOS.filter(o => !o.minha && !noDia.has(o.os_id));

  const bloco = (titulo, arr, outro) => {
    if (!arr.length) return;
    const h = document.createElement('div'); h.className = 'sec'; h.textContent = titulo;
    m.appendChild(h);
    arr.forEach(o => m.appendChild(cardOS(o, outro)));
  };

  // O roteiro é um ACRÉSCIMO: se ele quebrar, a lista de OS ainda tem que
  // aparecer. Sem esta trava, um erro dentro do roteiro deixava a tela com o
  // título "Hoje" e mais nada — e o `.catch(()=>pintarLista())` do boot
  // engolia o erro, então nem no console aparecia. Foi assim que um dataBR
  // que faltava virou tela em branco no teste.
  // S15 · o aviso das atrasadas vem ANTES de tudo: é a única coisa da tela
  // que pede uma decisão (qual dia novo), e ela não se resolve sozinha.
  try{ const pa = painelAtrasadas(); if (pa) m.insertBefore(pa, m.firstChild); }
  catch(e){ console.error('[atrasadas]', e); }
  // S16 · a entrega de EPI para confirmar vem antes de tudo (item 17)
  try{ const pe = painelEpiPendente(); if (pe) m.insertBefore(pe, m.firstChild); }catch(e){ console.error('[epi]', e); }
  try{ pintarMeuDia(m); }
  catch(e){
    console.error('[roteiro]', e);
    const av = document.createElement('div');
    av.className = 'sec'; av.textContent = 'Roteiro de hoje indisponível';
    m.appendChild(av);
  }
  bloco('Para você', minhas, false);
  bloco('Da equipe', outras, true);
  try{ const pe = painelEscaladas(); if (pe) m.appendChild(pe); }catch(e){ console.error('[escaladas]', e); }
  if (!listaOS.length && !(MEU_DIA || []).length && !(ESCALADAS || []).length){
    const v = document.createElement('div'); v.className = 'vazio';
    v.innerHTML = '<b>Nada no campo agora</b><p>Quando o escritório abrir uma OS para você, ela aparece aqui.</p>';
    m.appendChild(v);
  }
  abasTopo(m, 'lista');
}

/* ── S15 · ITEM 7 DO S41: AS MINHAS ATRASADAS ───────────────────────────────
   Tarefa no MEU nome, com dia que já passou e ainda não concluída. O roteiro
   já a mostrava ("era 24/09") — o que faltava era o que FAZER com ela. Dois
   botões, e nada muda sozinho: enquanto a pessoa não escolher, a tarefa fica
   no dia original e este aviso continua aqui. Reagendar deixa a marca
   "reagendada Nx — original: DD/MM", que todos veem. */
let ATRASADAS = [];
let REAG = new Map();
const chaveReag = (osId, tarefaId, compId) => compId ? 'av|' + compId : 'os|' + osId + '|' + tarefaId;
function chipReag(osId, tarefaId, compId){
  const r = REAG.get(chaveReag(osId, tarefaId, compId));
  return r && r.vezes ? '<span class="chip reag">reagendada ' + r.vezes + 'x — original: '
    + esc(dataBR(r.original).slice(0,5)) + '</span>' : '';
}
const isoHojeF = () => { const x = new Date();
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
function painelAtrasadas(){
  if (!(ATRASADAS || []).length && !(APOIO_ATR || []).length) return null;
  const p = document.createElement('div');
  p.className = 'painel atrasadas';
  p.innerHTML = (ATRASADAS.length ? '<div class="et" style="color:#9E1B14">' + ATRASADAS.length
    + (ATRASADAS.length === 1 ? ' tarefa atrasada' : ' tarefas atrasadas') + '</div>'
    + '<p style="font-size:13px;color:var(--ink-3);margin:4px 0 4px">Marcadas para um dia que já passou. '
    + 'Escolha o dia novo — nada muda sozinho.</p>' : '<div class="et" style="color:#9E1B14">Atrasadas em que você é apoio</div>');
  // S16 · resposta S9: o APOIO vê a atrasada, só para saber — quem escolhe o
  // dia é o responsável, e a linha diz quem é. Sem botões.
  setTimeout(() => {
    (APOIO_ATR || []).forEach(a => {
      const d = document.createElement('div'); d.className = 'al apoio';
      d.innerHTML = '<b></b><small></small>';
      d.querySelector('b').textContent = a.tarefa;
      d.querySelector('small').innerHTML = esc([a.os_numero, a.cliente].filter(Boolean).join(' · ')) + '<br>'
        + '<span class="quando">atrasada desde ' + esc(dataBR(a.data_prevista).slice(0,5)) + '</span> ('
        + a.dias_atraso + (a.dias_atraso === 1 ? ' dia' : ' dias') + ') · responsável: <b style="display:inline;font-size:inherit">'
        + esc(a.dono_nome || '?') + '</b> — quem escolhe o dia é ele(a)';
      p.appendChild(d);
    });
  }, 0);
  ATRASADAS.forEach(a => {
    const d = document.createElement('div');
    d.className = 'al';
    d.innerHTML = '<b></b><small></small>'
      + '<div class="linha"><button type="button" class="btn sm pri" data-a="hoje">Mover pra hoje</button>'
      + '<button type="button" class="btn sm" data-a="outro">Outro dia</button></div>'
      + '<div class="outro" hidden style="margin-top:8px"><input type="date" aria-label="Novo dia" min="' + isoHojeF() + '">'
      + '<button type="button" class="btn sm pri" data-a="ok">Gravar este dia</button></div>';
    d.querySelector('b').textContent = a.tarefa + (a.origem === 'avulso' ? ' (compromisso)' : '');
    d.querySelector('small').innerHTML = esc([a.os_numero, a.cliente].filter(Boolean).join(' · '))
      + (a.os_numero || a.cliente ? '<br>' : '')
      + '<span class="quando">atrasada desde ' + esc(dataBR(a.data_prevista).slice(0,5)) + '</span> ('
      + a.dias_atraso + (a.dias_atraso === 1 ? ' dia' : ' dias') + ')'
      + (a.reag_vezes ? ' · reagendada ' + a.reag_vezes + 'x — original: ' + esc(dataBR(a.reag_original).slice(0,5)) : '');
    const gravar = async (dia, via, b) => {
      d.querySelectorAll('button').forEach(x => x.disabled = true);
      try{
        const r = await rpc('tf_reagendar_atrasada', { p_os_id: a.os_id || null, p_tarefa_id: a.tarefa_id || null,
          p_compromisso_id: a.compromisso_id || null, p_data: dia, p_via: via });
        toast('Foi para ' + (dia === isoHojeF() ? 'hoje' : dataBR(dia)) + (r && r.vezes ? ' · reagendada ' + r.vezes + 'x' : '') + '.', 'ok');
        await carregar(true);
      }catch(e){ toast(e.message, 'err'); d.querySelectorAll('button').forEach(x => x.disabled = false); }
    };
    d.querySelector('[data-a="hoje"]').addEventListener('click', e => gravar(isoHojeF(), 'hoje', e.target));
    d.querySelector('[data-a="outro"]').addEventListener('click', () => {
      const o = d.querySelector('.outro'); o.hidden = false;
      const i = o.querySelector('input'); if (!i.value){ const t = new Date(Date.now() + 864e5);
        i.value = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
      i.focus();
    });
    d.querySelector('[data-a="ok"]').addEventListener('click', e => {
      const v = d.querySelector('.outro input').value;
      if (!v){ toast('Escolha o dia.', 'err'); return; }
      if (v < isoHojeF()){ toast('Escolha hoje ou um dia à frente.', 'err'); return; }
      gravar(v, 'outro_dia', e.target);
    });
    p.appendChild(d);
  });
  return p;
}

/* ── O ROTEIRO DE HOJE ──────────────────────────────────────────────────────
   O que o escritório marcou para esta pessoa, para hoje ou para antes.
   Tarefa de ontem não resolvida CONTINUA aqui: roteiro que se limpa sozinho à
   meia-noite esconde justamente o que atrasou.

   A ordem: o que já foi começado primeiro (termine antes de pegar outra), depois
   o que ficou de trás, depois quem vence antes, e a prioridade só desempata. */
let MEU_DIA = [];

/** 90 → "1h30min". A MESMA função do Manager: o mesmo número tinha duas caras
 *  ("1h30" lá, "1.5h" aqui), e é o mesmo time olhando as duas telas. */
function minHora(m){
  m = Number(m || 0);
  if (!m) return '—';
  const h = Math.floor(m / 60), r = m % 60;
  // S13: "1h20min", como o Manager S36 — o minuto não perde o sufixo
  return h ? (h + 'h' + (r ? String(r).padStart(2,'0') + 'min' : '')) : (r + 'min');
}

/* Data pura (YYYY-MM-DD) ganha T12:00 antes de virar Date. Sem isso,
   `new Date('2026-09-06')` é meia-noite UTC, que em Brasília ainda é dia 5 — e
   o roteiro mostraria "era 05/09" para uma tarefa marcada no dia 6. O Manager
   já tinha essa função; o Field não, e o teste de tela pegou. */
const dataBR = d => {
  if (!d) return new Date().toLocaleDateString('pt-BR');
  const t = String(d);
  return new Date(/^\d{4}-\d{2}-\d{2}$/.test(t) ? t + 'T12:00' : t).toLocaleDateString('pt-BR');
};

function ordemDoDia(a, b){
  const ca = a.ja_comecou ? 1 : 0, cb = b.ja_comecou ? 1 : 0;
  if (ca !== cb) return cb - ca;
  const aa = a.atrasada_no_roteiro ? 1 : 0, ab = b.atrasada_no_roteiro ? 1 : 0;
  if (aa !== ab) return ab - aa;
  const da = a.dias_restantes == null ?  9999 : Number(a.dias_restantes);
  const db = b.dias_restantes == null ?  9999 : Number(b.dias_restantes);
  if (da !== db) return da - db;
  return Number(b.prioridade_rank || 1) - Number(a.prioridade_rank || 1);
}

function pintarMeuDia(m){
  const itens = (MEU_DIA || []).slice().sort(ordemDoDia);
  if (!itens.length) return;

  const total = itens.reduce((s,t) => s + Number(t.tempo_estimado_min || 0), 0);
  const semEst = itens.filter(t => !t.tempo_estimado_min).length;

  const h = document.createElement('div');
  h.className = 'sec';
  h.textContent = 'Hoje · ' + itens.length + (itens.length > 1 ? ' tarefas' : ' tarefa')
    + (total ? ' · ' + minHora(total) : '')
    + (semEst ? ' (+' + semEst + ' sem estimativa)' : '');
  m.appendChild(h);

  itens.forEach(t => {
    const os = listaOS.find(o => o.os_id === t.os_id);
    const b = document.createElement('button');
    b.className = 'osCard doDia' + (t.atrasada_no_roteiro ? ' atrasadaDia' : '');
    b.type = 'button';

    const chips = [];
    if (t.ja_comecou) chips.push('<span class="chip eu">você começou</span>');
    if (t.atrasada_no_roteiro)
      chips.push('<span class="chip atr">era ' + dataBR(t.data_prevista) + '</span>');
    if (t.origem !== 'visita') { const cr = chipReag(t.os_id, t.tarefa_id, null); if (cr) chips.push(cr); }   // S15
    if (Number(t.prioridade_rank) >= 3) chips.push('<span class="chip urg">🔴 urgente</span>');
    if (t.dias_restantes != null){
      const d = Number(t.dias_restantes);
      chips.push('<span class="chip' + (d < 0 ? ' atr' : '') + '">'
        + (d < 0 ? Math.abs(d) + 'd de atraso' : d === 0 ? 'vence hoje' : 'faltam ' + d + 'd')
        + '</span>');
    }
    if (t.tempo_estimado_min)
      chips.push('<span class="chip">' + minHora(t.tempo_estimado_min) + '</span>');
    // S13 (Manager S36 · item 7): o "Hoje" mostra também a tarefa em que você
    // vai de APOIO (serviço em dupla) e a VISITA do dia em que te marcaram
    if (t.papel === 'apoio')
      chips.push('<span class="chip eu">apoio de ' + esc(t.principal || '?') + '</span>');
    if (t.origem === 'visita')
      chips.push('<span class="chip eu">visita' + (t.hora ? ' · ' + esc(t.hora) : '') + '</span>'
        + (t.principal ? '<span class="chip">com ' + esc(t.principal) + '</span>' : ''));

    b.innerHTML = '<div class="n mono"></div><div class="c"></div>' +
      '<div class="t"><span>›</span><span class="tn"></span></div>' +
      '<div class="chips">' + chips.join('') + '</div>';
    b.querySelector('.n').textContent  = t.os_numero || '';
    b.querySelector('.c').textContent  = t.cliente || '';
    b.querySelector('.tn').textContent = t.tarefa || '—';
    // Sem a OS na lista do campo (tarefa administrativa, por exemplo) o cartão
    // ainda aparece — só não abre. Sumir seria pior: a pessoa fica sem saber.
    if (os) b.addEventListener('click', () => abrirOS(os));
    else {
      // `disabled` + `title` num app de celular = cartão cinza sem explicação:
      // celular não tem hover e elemento desabilitado não recebe foco.
      b.disabled = true;
      const av = document.createElement('div');
      av.className = 'semAbrir';
      av.textContent = t.origem === 'visita'
        ? 'Visita' + (t.os_descricao ? ' em ' + t.os_descricao : '') + ' — os detalhes estão no negócio, na Gestão.'
        : 'Etapa do escritório — não abre aqui.';
      b.appendChild(av);
    }
    m.appendChild(b);
  });
}

function cardOS(o, outro){
  const b = document.createElement('button');
  b.className = 'osCard' + (outro ? ' outro' : '')
    + (o.situacao === 'atrasada' ? ' sitAtr' : o.situacao === 'risco' ? ' sitRis' : '');
  b.type = 'button';
  const naFila = filaLer().some(e => e.osId === o.os_id);
  const chips = [];
  if (naFila) chips.push('<span class="chip fila">na fila de envio</span>');
  // A urgência e o prazo estavam SÓ no roteiro. Uma OS urgente ainda não
  // agendada — justamente a que o escritório precisa que alguém pegue — chegava
  // ao campo idêntica a qualquer outra.
  if (Number(o.prioridade_rank) >= 3) chips.push('<span class="chip urg">🔴 urgente</span>');
  else if (Number(o.prioridade_rank) === 2) chips.push('<span class="chip alt">alta</span>');
  if (o.dias_restantes != null){
    const d = Number(o.dias_restantes);
    if (d < 0)       chips.push('<span class="chip atr">' + Math.abs(d) + 'd de atraso</span>');
    else if (d === 0) chips.push('<span class="chip atr">vence hoje</span>');
    else if (d <= 2)  chips.push('<span class="chip risc">faltam ' + d + 'd</span>');
  }
  if (o.tarefa_atual_lock) chips.push('<span class="chip eu">assumida</span>');
  chips.push('<span class="chip">' + (o.coluna_rotulo || o.coluna) + '</span>');
  if (o.dias_na_coluna != null) chips.push('<span class="chip">' + o.dias_na_coluna + 'd</span>');

  b.innerHTML = '<div class="n mono"></div><div class="c"></div>' +
    '<div class="t"><span>›</span><span class="tn"></span></div>' +
    '<div class="chips">' + chips.join('') + '</div>';
  b.querySelector('.n').textContent = o.numero;
  b.querySelector('.c').textContent = o.cliente;
  b.querySelector('.tn').textContent = o.tarefa_atual || '—';
  b.addEventListener('click', () => abrirOS(o));
  return b;
}

async function abrirOS(o){
  tela = 'os';
  document.getElementById('btnBack').hidden = false;
  document.getElementById('hTit').textContent = o.cliente;
  document.getElementById('hSub').textContent = o.numero + ' · ' + (o.coluna_rotulo || o.coluna);
  const m = document.getElementById('main');
  m.innerHTML = '<div class="vazio"><p>Carregando…</p></div>';

  try{
    const [tarefas, equipamentos, coletas] = DEMO
      ? [demoTarefas(o.os_id), demoEquip(), demoColeta(o.os_id)]
      : await Promise.all([
          get('pipeline_tarefas?select=tarefa_id,nome,descricao,tipo,fase,status,perfis_responsaveis,lock_por,requisitos,'
              + 'lock_expira,usuario_designado,apoios,data_prevista'
              + '&os_id=eq.' + o.os_id + '&ativo=eq.SIM&order=camada,fase_ordem,ordem'),
          get('equipamentos?select=id,tag,tipo,localizacao&cliente_id=eq.' + o.cliente_id + '&ativo=eq.true&order=tag'),
          get('v_os_coleta?select=inspetor,total_itens,enviado_em,fase&os_id=eq.' + o.os_id + '&order=enviado_em')
        ]);
    atual = { os:o, tarefas, equipamentos, coletas: coletas || [], extras: [] };
    await carregarNomes();   // S15: para dizer COM QUEM a tarefa está
    // S39 · na inspeção, o que o campo já lançou de extra e em que pé está.
    // Falhar aqui não impede de abrir a OS: o painel diz que não conseguiu ler.
    if (ehInspecao(o)){
      try{
        atual.extras = DEMO ? [] : await get('v_extras_campo?select=*&origem_os_id=eq.' + o.os_id
                                             + '&order=created_at,ordem');
      }catch(e){ atual.extras = null; }
    }
    pintarOS();
  }catch(e){
    m.innerHTML = '<div class="vazio"><b>Não deu para abrir</b><p></p></div>';
    m.querySelector('p').textContent = e.message;
  }
}
