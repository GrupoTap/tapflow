// ════════════════════════════════════════════════════════════════════════════
// S16 · MINHA SEGURANÇA (RH, fase R1 — documento de 26/09, item 17)
// ----------------------------------------------------------------------------
// O que o funcionário vê de si: as entregas de EPI para CONFIRMAR (com o PIN,
// no celular dele — é a assinatura da ficha), os EPIs que estão com ele, os
// tamanhos (ele muda; o RH é avisado), a receita de óculos e a própria ficha
// de EPI em PDF — SEM as rubricas (resposta R11: a imagem da assinatura nunca
// sai do servidor para o celular). Nada de colega, estoque ou custo.
//
// Quem é de escritório (perfil que não trabalha em campo) também confirma EPI
// aqui: o hub abre o Field direto nesta aba para quem tem ficha de RH.
// ════════════════════════════════════════════════════════════════════════════
let SEG = null;            // tf_rh_meu_resumo(); null = banco sem o 62 ou falha
let APOIO_ATR = [];        // S9 · atrasadas em que sou apoio (só leitura)
const soSeg = () => sessao.executa_em === 'adm';
/** Escrita do RH NÃO se repete sozinha: um PIN reenviado depois de um
 *  "não respondeu" contaria como tentativa errada. */
const rpc1 = (f, p) => req('/rest/v1/rpc/' + f, { method:'POST', body: JSON.stringify(p || {}) }, 0);
const rhDTf = t => t ? new Date(t).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit',
  month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).replace(',', '') : '—';
const rhMesF = d => d ? String(d).slice(5,7) + '/' + String(d).slice(0,4) : '—';
const RH_MOT_F = { primeira:'primeira entrega', entrega_inicial:'entrega inicial', vistoria:'reprovado em vistoria',
  danificado:'danificado em serviço', extravio:'extravio', limite_fabricante:'limite do fabricante',
  troca_tamanho:'troca de tamanho', reposicao:'reposição' };

/* S20 · abasTopo foi para o bloco das Diárias/Documentos (agora são até quatro abas). */
/** Na lista de OS, a pendência de EPI vem no topo (item 17: "pendências dele no topo"). */
function painelEpiPendente(){
  const n = SEG && SEG.tem_ficha ? (SEG.pendentes || []).length : 0;
  const np = SEG && SEG.tem_ficha ? (SEG.presencas || []).filter(x => x.data <= isoHojeF()).length : 0;   // S17
  const nd = SEG && SEG.tem_ficha ? (SEG.devolucoes || []).length : 0;   // S18 · R4
  if (!n && !np && !nd) return null;
  const p = document.createElement('div'); p.className = 'painel epiPend';
  p.innerHTML = '<div class="et" style="color:var(--warn)">' + (n ? 'EPI para confirmar' : nd ? 'Devolução para confirmar' : 'Presença para confirmar') + '</div>'
    + '<p style="margin:4px 0 10px">' + [n ? n + (n === 1 ? ' entrega de EPI espera' : ' entregas de EPI esperam') + ' a sua confirmação.' : '',
        nd ? 'A devolução dos seus EPIs espera a sua confirmação.' : '',
        np ? np + (np === 1 ? ' lista de treinamento espera' : ' listas de treinamento esperam') + ' a sua presença.' : ''].filter(Boolean).join(' ')
    + '</p><button class="btn pri sm" type="button">Conferir e confirmar</button>';
  p.querySelector('button').addEventListener('click', pintarSeg);
  return p;
}

async function recarregarSeg(){
  try{ SEG = await rpc('tf_rh_meu_resumo', {}); }catch(e){ toast(e.message, 'err'); }
  pintarSeg();
}

function pintarSeg(){
  tela = 'seg'; atual = null;
  document.getElementById('btnBack').hidden = true;
  document.getElementById('hTit').textContent = 'Minha Segurança';
  document.getElementById('hSub').textContent = (sessao.nome || '') + (SEG && SEG.funcao ? ' · ' + SEG.funcao : '');
  const m = document.getElementById('main');
  m.innerHTML = '';
  if (!SEG || !SEG.tem_ficha){
    m.innerHTML = '<div class="vazio"><b>Sua ficha de segurança ainda não foi aberta</b>'
      + '<p>Quando o Bruno abrir a sua ficha de RH, as entregas de EPI aparecem aqui para você confirmar.</p></div>';
    abasTopo(m, 'seg');
    return;
  }
  const temPin = SEG.pin && SEG.pin.ativo;
  const bloq = SEG.pin && SEG.pin.bloqueado_ate && new Date(SEG.pin.bloqueado_ate) > new Date();
  try{ const pd = painelDocsPendente(); if (pd) m.appendChild(pd); }catch(e){}   // S20

  // 1 · PIN (sem ele não se confirma nada)
  if (!temPin){
    const p = document.createElement('div'); p.className = 'painel pinNovo';
    p.innerHTML = '<div class="et">Crie o seu PIN</div>'
      + '<p style="margin:6px 0 10px">Seis números que <b>só você</b> sabe. É com ele que você confirma cada entrega de EPI — '
      + 'vale como a sua assinatura na ficha. Não use sequência (123456) nem número repetido (111111).</p>'
      + '<div class="campo"><label for="pn1">Novo PIN</label><input id="pn1" type="password" inputmode="numeric" maxlength="6" autocomplete="off" pattern="[0-9]*"></div>'
      + '<div class="campo"><label for="pn2">Repita o PIN</label><input id="pn2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" pattern="[0-9]*"></div>'
      + '<button class="btn pri" type="button" id="pnOk">Criar PIN</button>';
    m.appendChild(p);
    const b = p.querySelector('#pnOk');
    b.addEventListener('click', async () => {
      const a = p.querySelector('#pn1').value, c = p.querySelector('#pn2').value;
      if (!/^\d{6}$/.test(a)){ toast('O PIN tem 6 números.', 'err'); return; }
      if (a !== c){ toast('Os dois PINs não batem.', 'err'); return; }
      b.disabled = true;
      try{ const r = await rpc1('tf_rh_meu_pin_definir', { p_pin_novo: a, p_pin_atual: null });
           if (r && r.status !== 'ok') throw new Error('Não deu para criar o PIN.');
           toast('PIN criado.', 'ok'); await recarregarSeg(); }
      catch(e){ toast(e.message, 'err'); b.disabled = false; }
    });
  } else if (bloq){
    const p = document.createElement('div'); p.className = 'painel';
    p.style.borderLeft = '4px solid var(--crit)';
    p.innerHTML = '<div class="et" style="color:var(--crit)">PIN travado</div><p style="margin:6px 0 0">Cinco tentativas erradas. '
      + 'Tente de novo depois de ' + esc(rhDTf(SEG.pin.bloqueado_ate).slice(11)) + '. Esqueceu? Peça ao Bruno para liberar um novo PIN.</p>';
    m.appendChild(p);
  }

  // 2 · entregas para confirmar, agrupadas pelo lançamento
  const pend = SEG.pendentes || [];
  const lotes = {};
  pend.forEach(e => { (lotes[e.lote] = lotes[e.lote] || []).push(e); });
  Object.keys(lotes).forEach(k => m.appendChild(painelLote(lotes[k], temPin && !bloq)));
  // S18 · R4 — a devolução dos EPIs, com o PIN (ou "não concordo")
  (SEG.devolucoes || []).forEach(dv => m.appendChild(painelDevolucao(dv, temPin && !bloq)));
  // S17 · presença em treinamento, com o PIN
  (SEG.presencas || []).forEach(s => m.appendChild(painelPresenca(s, temPin && !bloq)));

  // 3 · meus EPIs
  const h1 = document.createElement('div'); h1.className = 'sec'; h1.textContent = 'Meus EPIs'; m.appendChild(h1);
  const me = SEG.meus_epis || [];
  const cx = document.createElement('div'); cx.className = 'painel';
  cx.innerHTML = me.length ? me.map(e => {
      const lim = e.limite_em ? (e.limite_em <= isoHojeF() ? '<span class="chip atr">limite do fabricante vencido</span>'
        : '<span class="chip">' + 'vence em ' + esc(rhMesF(e.limite_em)) + '</span>') : '';
      return '<div class="epiLin"><b>' + esc(e.epi_nome) + (e.tamanho ? ' (' + esc(e.tamanho) + ')' : '') + '</b>'
        + '<small>CA ' + esc(e.ca) + ' · recebido em ' + esc(dataBR(e.data_entrega)) + (e.quantidade > 1 ? ' · ' + e.quantidade + ' un.' : '') + '</small>'
        + (lim ? '<div class="chips" style="margin-top:4px">' + lim + '</div>' : '') + '</div>';
    }).join('') : '<p style="margin:0">Nenhum EPI confirmado ainda.</p>';
  m.appendChild(cx);
  // S17 · pedir EPI (R2) e meus documentos (R5)
  m.appendChild(painelPedidos());

let _jspdfF = null;
function carregarJsPDFf(){
  if (_jspdfF) return _jspdfF;
  _jspdfF = new Promise((ok, err) => {
    if (window.jspdf && window.jspdf.jsPDF) return ok(window.jspdf.jsPDF);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => (window.jspdf && window.jspdf.jsPDF) ? ok(window.jspdf.jsPDF) : err(new Error('A biblioteca de PDF não inicializou.'));
    s.onerror = () => { _jspdfF = null; err(new Error('Sem internet para gerar o PDF agora. Tente com sinal.')); };
    document.head.appendChild(s);
  });
  return _jspdfF;
}
/** A ficha no celular: a MESMA da versão cliente, sem as rubricas (R11). */
async function minhaFichaPDF(){
  const jsPDF = await carregarJsPDFf();
  const ficha = await rpc('tf_rh_minha_ficha', {});
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const M = 12, W = 210 - 2 * M, F = ficha.funcionario;
  const col = [ { t:'Equipamento', w:62 }, { t:'CA', w:18 }, { t:'Entrega', w:20 }, { t:'Devolução', w:20 }, { t:'Confirmação', w:66 } ];
  let y, pag = 1;
  const cab = () => {
    try{ doc.addImage(LOGO_ENGETAP_F, 'JPEG', M, 10, 44, 10.7); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('FICHA DE CONTROLE DE ENTREGA DE EPI', 210 - M, 14, { align:'right' });
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text('Cópia do funcionário (sem as rubricas)', 210 - M, 18.5, { align:'right' });
    doc.setDrawColor(170); doc.line(M, 23, 210 - M, 23); doc.setFontSize(8.5);
    const d = (k, v, x, yy) => { doc.setFont('helvetica','bold'); doc.text(k, x, yy); const kw = doc.getTextWidth(k) + 1.5;
      doc.setFont('helvetica','normal'); doc.text(String(v || '—'), x + kw, yy); };
    d('Empresa:', ficha.empresa, M, 28); d('Nome:', F.nome, M, 33); d('Setor:', F.setor, 120, 33);
    d('Função:', F.funcao, M, 38); d('Admissão:', F.admissao ? dataBR(F.admissao) : '—', 120, 38);
    y = 43;
    if (pag === 1){ doc.setFontSize(7.6); const tx = doc.splitTextToSize(ficha.texto || '', W);
      doc.text(tx, M, y + 1.5, { lineHeightFactor:1.15 }); y += tx.length * 7.6 * 0.405 + 4; }
    doc.setFillColor(227, 238, 247); doc.rect(M, y, W, 7, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    let x = M; col.forEach(c => { doc.text(c.t, x + 1.2, y + 4.6); x += c.w; }); y += 7;
  };
  const rod = () => { doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(90);
    doc.text('Ficha gerada em ' + rhDTf(ficha.gerada_em).replace(' ', ' às ') + ', contendo entregas confirmadas até esta data.', M, 284);
    doc.text(doc.splitTextToSize(ficha.rodape || '', W - 20), M, 288);
    doc.text('pág. ' + pag, 210 - M, 288, { align:'right' }); doc.setTextColor(0); };
  cab();
  const L = ficha.linhas || [];
  if (!L.length){ doc.setFontSize(9); doc.text('Nenhuma entrega confirmada até esta data.', M + 2, y + 8); }
  L.forEach(l => {
    if (y + 12 > 278){ rod(); doc.addPage(); pag++; cab(); }
    doc.setDrawColor(215); doc.rect(M, y, W, 12);
    let x = M; doc.setFontSize(7.6); doc.setFont('helvetica','bold');
    doc.text(doc.splitTextToSize(l.epi_nome + ' ×' + l.quantidade + (l.tamanho ? ' (' + l.tamanho + ')' : ''), col[0].w - 2.4).slice(0,2), x + 1.2, y + 4);
    doc.setFont('helvetica','normal'); x += col[0].w;
    doc.text(String(l.ca), x + 1.2, y + 5); x += col[1].w;
    doc.text(dataBR(l.data_entrega), x + 1.2, y + 5); x += col[2].w;
    // S18 · R4: a devolução que vale (confirmada ou registrada sem a confirmação)
    const dv = l.devolucao && (l.devolucao.status === 'confirmada' || l.devolucao.status === 'sem_confirmacao') ? l.devolucao : null;
    if (dv){ doc.text(dataBR(dv.data), x + 1.2, y + 5); doc.setFontSize(5.8);
             doc.text({ reuso:'reuso', descarte:'descarte', nao_devolvido:'não devolvido' }[dv.destino] || '', x + 1.2, y + 8.4); doc.setFontSize(7.6); }
    else doc.text('—', x + 1.2, y + 5);
    x += col[3].w;
    doc.setFontSize(6.8);
    doc.text(doc.splitTextToSize('Confirmado no celular do funcionário em ' + rhDTf(l.confirmado_em)
      + (l.confirmado_metodo === 'pin' ? ' (PIN)' : '') + ' · lançado por ' + (l.lancado_por_nome || '?'), col[4].w - 2.4), x + 1.2, y + 4);
    y += 12;
  });
  rod();
  const nome = 'Minha ficha de EPI - ' + isoHojeF() + '.pdf';
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}

// S17 · MINHA SEGURANÇA — o que chegou com o S43 (R2, R5 e R6)
// ----------------------------------------------------------------------------
// Presença em treinamento (com o PIN), pedir EPI, meus documentos (ASO e
// treinamentos, com o PDF do próprio ASO), os vídeos da Integração e as
// dúvidas frequentes. Tudo só do PRÓPRIO funcionário — quem decide é o banco.

const RH_MOT_PED_F = { danificado:'Estragou', extravio:'Perdi', troca_tamanho:'Trocar o tamanho',
  limite_fabricante:'Venceu o limite do fabricante', reposicao:'Reposição', primeira:'Ainda não tenho' };
const RH_TIPO_ASO_F = { admissional:'admissional', periodico:'periódico', retorno:'retorno ao trabalho',
  mudanca_risco:'mudança de risco', demissional:'demissional' };
const diasAteF = iso => iso ? Math.round((new Date(iso + 'T12:00:00') - new Date(isoHojeF() + 'T12:00:00')) / 86400000) : null;
function chipValidade(iso){
  if (!iso) return '<span class="chip">sem validade</span>';
  const d = diasAteF(iso);
  if (d < 0) return '<span class="chip atr">venceu em ' + esc(dataBR(iso)) + '</span>';
  if (d <= 30) return '<span class="chip alt">vence em ' + d + (d === 1 ? ' dia' : ' dias') + ' (' + esc(dataBR(iso)) + ')</span>';
  return '<span class="chip">válido até ' + esc(dataBR(iso)) + '</span>';
}

  if (!(SEG && SEG.tem_ficha)) return 0;

       + (SEG.devolucoes || []).length;   // S18 · R4
}

  const bc = p.querySelector('[data-conf]');
  if (bc) bc.addEventListener('click', async () => {
    const pin = p.querySelector('.pinC').value;
    if (!/^\d{6}$/.test(pin)){ toast('Digite os 6 números do seu PIN.', 'err'); return; }
    bc.disabled = true;
    try{
      const r = await rpc1('tf_rh_confirmar_presenca', { p_sessao: s.sessao_id, p_pin: pin });
      if (r.status === 'ok'){ toast('Presença confirmada.', 'ok'); await recarregarSeg(); return; }
      if (r.status === 'pin_errado') toast('PIN errado. Restam ' + r.restantes + ' tentativa(s) antes de travar 15 minutos.', 'err');
      else if (r.status === 'bloqueado'){ toast('PIN travado por 15 minutos.', 'err'); await recarregarSeg(); return; }
      else if (r.status === 'sem_pin'){ toast('Crie o seu PIN antes.', 'err'); await recarregarSeg(); return; }
      p.querySelector('.pinC').value = '';

  return p;
}

// ── o player (YouTube IFrame API, grátis) ───────────────────────────────────
// "Assistido até o fim" = o tempo REALMENTE tocado chega a 90% da duração.
// O evento de fim sozinho não serve: ele dispara também quando a pessoa
// arrasta a barra até o final. A conta soma só os passos de até 2,5 s entre
// uma leitura e a outra (um salto maior é a barra sendo arrastada).
let _ytApi = null, _ytPlayer = null, _ytTimer = null;
function carregarYT(){
  if (_ytApi) return _ytApi;
  _ytApi = new Promise((ok, err) => {
    if (window.YT && window.YT.Player) return ok(window.YT);
    window.onYouTubeIframeAPIReady = () => ok(window.YT);
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { _ytApi = null; err(new Error('Sem internet para abrir o vídeo agora.')); };
    document.head.appendChild(s);
  });
  return _ytApi;
}
function pararVideo(){
  if (_ytTimer){ clearInterval(_ytTimer); _ytTimer = null; }
  if (_ytPlayer){ try{ _ytPlayer.destroy(); }catch(e){} _ytPlayer = null; }
}
async function pintarVideo(v){
  if (!v) return;
  pararVideo();
  tela = 'video'; atual = null;
  document.getElementById('btnBack').hidden = false;
  document.getElementById('hTit').textContent = 'Integração';
  document.getElementById('hSub').textContent = v.titulo;
  const m = document.getElementById('main');
  m.innerHTML = '<div class="painel"><div class="vidCx"><div id="ytP"></div></div>'
    + '<h2 style="margin-top:10px">' + esc(v.titulo) + '</h2>'
    + '<p id="vidSt" style="font-size:13px">' + (v.visto ? '✓ Você já assistiu este vídeo. Pode rever quando quiser.'
      : 'Assista até o fim, sem pular: só assim ele conta na sua lista de treinamento.') + '</p></div>'
    + '<div class="sec">Dúvidas sobre este vídeo</div><div id="vidFaq"><p style="font-size:13px;color:var(--ink-3)">Carregando…</p></div>';
  pintarFaqDoVideo(v.id);
  let YT;
  try{ YT = await carregarYT(); }catch(e){ document.getElementById('vidSt').textContent = e.message; return; }
  if (tela !== 'video') return;
  let tocado = 0, ultimo = null, contou = false;
  _ytPlayer = new YT.Player('ytP', { videoId: v.youtube_id, width: '100%', height: '100%',
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
    events: { onStateChange: async ev => {
      if (ev.data === YT.PlayerState.PLAYING){ ultimo = _ytPlayer.getCurrentTime(); }
      if (ev.data === YT.PlayerState.ENDED && !contou){
        const dur = _ytPlayer.getDuration();
        // o último trecho, entre a última leitura e o fim (se não foi salto)
        if (ultimo != null && dur > ultimo && dur - ultimo <= 2.5) tocado += dur - ultimo;
        ultimo = null;
        const st = document.getElementById('vidSt');
        try{
          const r = await rpc1('tf_rh_video_assistido', { p_video: v.id, p_segundos: Math.round(tocado), p_duracao: Math.round(dur) });
          if (r.status === 'ok'){ contou = true; if (st) st.textContent = '✓ Contou: vídeo assistido até o fim.'; toast('Vídeo assistido.', 'ok');
            try{ SEG = await rpc('tf_rh_meu_resumo', {}); }catch(e){} }
          else if (st) st.textContent = r.msg || 'Não contou: assista sem pular.';
        }catch(e){ if (st) st.textContent = e.message; }
      }
    } } });
  _ytTimer = setInterval(() => {
    if (!_ytPlayer || typeof _ytPlayer.getPlayerState !== 'function') return;
    if (_ytPlayer.getPlayerState() !== 1){ ultimo = null; return; }
    const t = _ytPlayer.getCurrentTime();
    if (ultimo != null && t > ultimo && t - ultimo <= 2.5) tocado += t - ultimo;
    ultimo = t;
  }, 1000);
}

// ════════════════════════════════════════════════════════════════════════════
// S20 (prompt S49) · DIÁRIAS e DOCUMENTOS (espelho de ponto e recibo)
// ----------------------------------------------------------------------------
// Diárias: cada um lança as PRÓPRIAS refeições na rua (café, almoço, jantar),
// do dia de hoje ou de um dia anterior, enquanto o mês estiver aberto. Tocar
// de novo desfaz (o banco anula, não apaga). A OS é opcional e vem sugerida
// pela agenda do dia.
// Documentos: a folha de ponto e o recibo que o escritório liberou para você.
// Duas ações, e só elas: Assinar (PIN) e "Não é minha folha / meu recibo".
// Cada abertura e cada download ficam registrados (`tf_rhdoc_abrir`).
// ════════════════════════════════════════════════════════════════════════════
let DIAR = null;            // tf_diarias_minhas() do mês/dia na tela
let DIAR_DIA = null;        // o dia escolhido (ISO); null = hoje
let DOCS = null;            // tf_rhdoc_meus(); null = banco sem o 104 ou falha
const DIA_ROT_F = { cafe:'Café da manhã', almoco:'Almoço', jantar:'Jantar' };
const BRLf = v => (Number(v) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const MES_F = iso => ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][Number(String(iso).slice(5,7)) - 1]
  + '/' + String(iso).slice(0,4);
const somaDiaF = (iso, n) => { const d = new Date(String(iso).slice(0,10) + 'T12:00'); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const DIA_SEM_F = iso => ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][new Date(String(iso).slice(0,10) + 'T12:00').getDay()];

/** As abas do topo: Ordens · Diárias · Documentos · Segurança. Diárias é de
 *  todo mundo que abre o Field; Documentos e Segurança, de quem tem ficha de RH. */
function abasTopo(m, qual){
  const temSeg = !!(SEG && SEG.tem_ficha), temDocs = !!(DOCS && DOCS.tem_ficha);
  const abas = [];
  if (!soSeg()) abas.push(['lista', 'Ordens', 0]);
  if (DIAR || !DEMO) abas.push(['dia', 'Diárias', 0]);
  // S25 · Férias (ou Recesso, no estágio) — quem tem ficha com vínculo
  if (FER && (FER.tipo === 'ferias' || FER.tipo === 'recesso')) abas.push(['fer', FER.tipo === 'recesso' ? 'Folga/Recesso' : 'Folga/Férias', 0]);   // S27: a folga no nome
  if (temDocs) abas.push(['docs', 'Documentos', nPendDocs()]);
  if (temSeg) abas.push(['seg', abas.length >= 3 ? 'Segurança' : 'Minha Segurança', nPendSeg()]);
  if (abas.length < 2) return;
  const d = document.createElement('div'); d.className = 'abasTopo';
  d.innerHTML = abas.map(([k, r, n]) => '<button type="button" data-t="' + k + '" class="' + (qual === k ? 'on' : '') + '">' + r

            + '<div class="campo"><label for="ferF">Último dia</label><input id="ferF" type="date" min="' + esc(minIni) + '"></div></div>')

         : t === 'recesso' ? 'Recesso do estágio: 30 dias por ano de estágio.'
         : 'Folga do banco de horas: só marca o dia (ou as horas); o saldo de horas continua no ponto.')
      + ' O pedido fica "aguardando" até o escritório decidir — e já segura a data.</p>';
  }
  m.appendChild(pp);
  pp.querySelectorAll('[data-tp]').forEach(b => b.addEventListener('click', () => {
    FER_F.tipo = b.dataset.tp; FER_F.conf = null; FER_F.longaOk = false;
    if (FER_F.tipo !== 'folga') FER_F.parte = false;
    desenharFeriasF();
  }));
  pp.querySelectorAll('[data-pt]').forEach(b => b.addEventListener('click', () => {
    FER_F.parte = b.dataset.pt === 'true'; FER_F.conf = null;
    if (FER_F.parte) FER_F.fim = FER_F.ini;
    desenharFeriasF();
  }));
  if (t) ligarPedirF(pp, F, t, ehFer, parte, ddd);
  // ── 1b · as férias da equipe (S28): para cada um se programar
  try{ const pe = painelFeriasEquipe(hoje); if (pe) m.appendChild(pe); }catch(e){ console.error('[ferias equipe]', e); }
  // ── 2 · os pedidos e as ausências
  const L = (F.ausencias || []).filter(a => a.tipo !== 'atestado');

    const pl = document.createElement('div'); pl.className = 'painel';

        + '<small>' + [Number(a.dias_vendidos) ? 'vendendo ' + a.dias_vendidos + ' dia(s)' : '',
                        a.status === 'recusada' && a.recusa_motivo ? 'motivo: ' + esc(a.recusa_motivo) : '',
                        a.decidido_por ? (a.status === 'aprovada' ? 'aprovada' : 'decidida') + ' por ' + esc(a.decidido_por) : '']

  // ── 3 · o saldo (depois: quem só quer uma folga não precisa passar por ele)

/** O formulário do pedido, já com o tipo escolhido: confere no banco enquanto
 *  a pessoa escolhe, sugere "é uma folga?" nas férias curtas ou em cima da
 *  hora, e pergunta antes de mandar uma folga com mais de 7 dias (S27). */
function ligarPedirF(pp, F, t, ehFer, parte, ddd){
  const eI = pp.querySelector('#ferI'), eF = pp.querySelector('#ferF'), eV = pp.querySelector('#ferV'), eO = pp.querySelector('#ferO');
  const eHI = pp.querySelector('#ferHI'), eHF = pp.querySelector('#ferHF');
  eI.value = FER_F.ini; if (eF) eF.value = FER_F.fim; if (eV) eV.value = FER_F.vender || 0; eO.value = FER_F.obs;
  const fimDe = () => parte ? eI.value : (eF.value || eI.value);
  const nDias = () => { const i = eI.value, f = fimDe(); return i && f >= i ? Math.round((new Date(f + 'T12:00') - new Date(i + 'T12:00')) / 864e5) + 1 : 0; };
  let tm = null, seq = 0;
  const sug = html => { const b = pp.querySelector('#ferSug'); if (b) b.innerHTML = html || ''; };
  const sugFolga = r => {
    // nas férias: data perto (antecedência) ou poucos dias → "é uma folga?"
    if (!ehFer || !r) return sug('');
    const curto = Number(r.dias) > 0 && Number(r.dias) < 5;
    const perto = (r.erros || []).some(e => /antecedência/.test(e));
    if (!curto && !perto) return sug('');
    sug('<div class="ferConf aviso ferSugF">É uma folga? <button type="button" class="btn sm" id="ferVirarF">Pedir como folga</button></div>');
    pp.querySelector('#ferVirarF').addEventListener('click', () => {
      FER_F.tipo = 'folga'; FER_F.parte = false; FER_F.vender = 0; FER_F.conf = null; desenharFeriasF();
    });
  };
  const mostra = r => {
    const box = pp.querySelector('#ferConf'), env = pp.querySelector('#ferEnv');
    if (!box) return;
    if (!r){ box.innerHTML = ''; env.disabled = true; sug(''); return; }
    const er = (r.erros || []).filter(e => !/^Choca com/.test(e)), ch = r.choques || [], av = r.avisos || [];
    const p = r.periodo, min = Number(r.minutos) || 0;
    box.innerHTML = (er.length || ch.length ? '<div class="ferConf erro">' + er.map(e => '<div>' + esc(e) + '</div>').join('')
          + ch.map(c => '<div><b>' + esc(c.texto) + '</b></div>').join('')
          + (ch.length ? '<div>Converse com o colega e escolha outras datas.</div>' : '') + '</div>'
        : '<div class="ferConf ok">' + (min ? minHora(min) + ' em ' + esc(dataBR(eI.value).slice(0,5)) + ', das ' + esc(eHI.value) + ' às ' + esc(eHF.value)
              : r.dias + (r.dias === 1 ? ' dia' : ' dias')) + (Number(r.vender) ? ' + ' + r.vender + ' vendidos' : '')
          + (p ? ' · do período ' + esc(String(p.aq_ini).slice(0,4)) + '/' + esc(String(p.aq_fim).slice(2,4)) + (r.restantes_depois != null ? ' · sobram ' + r.restantes_depois : '')
              + (p.tipo === 'ferias' && p.conc_fim ? ' · limite de gozo ' + esc(ddd(p.conc_fim)) : '') : '')
          + ' · pode enviar.</div>')
      + (av.length ? '<div class="ferConf aviso">' + av.map(a => '<div>' + esc(a) + '</div>').join('') + '</div>' : '');
    env.disabled = !r.ok;
    sugFolga(r);
  };
  const confere = async () => {
    FER_F.ini = eI.value; FER_F.fim = fimDe(); FER_F.vender = eV ? Number(eV.value) || 0 : 0; FER_F.obs = eO.value;
    if (eHI){ FER_F.hi = eHI.value; FER_F.hf = eHF.value; }
    FER_F.longaOk = false;
    const i = eI.value, f = fimDe();
    if (!i || (parte && (!eHI.value || !eHF.value))){ mostra(null); return; }
    if (DEMO){ mostra(demoFerSimular(t, i, f, FER_F.vender, parte ? eHI.value : null, parte ? eHF.value : null)); return; }
    const meu = ++seq;
    try{
      const arg = { p_tipo: t, p_inicio: i, p_fim: f, p_vender: FER_F.vender };
      if (parte){ arg.p_hora_inicio = eHI.value; arg.p_hora_fim = eHF.value; }
      const r = await rpc('tf_ferias_simular', arg);
      if (meu === seq && tela === 'fer') { FER_F.conf = r; mostra(r); }
    }catch(e){ if (meu === seq) { const box = pp.querySelector('#ferConf'); if (box){ box.innerHTML = '<div class="ferConf erro"></div>'; box.firstChild.textContent = e.message; } } }
  };
  const agenda = () => { clearTimeout(tm); tm = setTimeout(confere, 300); };
  eI.addEventListener('change', () => { if (eF && (!eF.value || eF.value < eI.value)) eF.value = eI.value; agenda(); });
  if (eF) eF.addEventListener('change', agenda);
  if (eV) eV.addEventListener('input', agenda);
  if (eHI){ eHI.addEventListener('change', () => { if (eHF.value && eHF.value <= eHI.value) eHF.value = ''; agenda(); }); eHF.addEventListener('change', agenda); }
  eO.addEventListener('input', () => { FER_F.obs = eO.value; });
  if (FER_F.ini) agenda();
  const envia = async b => {
    if (DEMO){ toast('Modo demonstração: nada é gravado.', 'err'); return; }
    b.disabled = true;
    try{
      const arg = { p_tipo: t, p_inicio: eI.value, p_fim: fimDe(),
                    p_vender: eV ? Number(eV.value) || 0 : 0, p_observacao: eO.value.trim() || null };
      if (parte){ arg.p_hora_inicio = eHI.value; arg.p_hora_fim = eHF.value; }
      await rpc1('tf_ferias_pedir', arg);
      toast('Pedido enviado. Agora é com o escritório.', 'ok');
      FER_F = { tipo: null, ini: '', fim: '', vender: 0, obs: '', conf: null, parte: false, hi: '', hf: '', longaOk: false };
      pintarFeriasF();
    }catch(e){ toast(e.message, 'err'); b.disabled = false; }
  };
  pp.querySelector('#ferEnv').addEventListener('click', ev => {
    const b = ev.currentTarget;
    // folga com mais de 7 dias corridos: pergunta antes (Bruno, 15/10)
    const n = nDias();
    if (t === 'folga' && n > 7 && !FER_F.longaOk){
      sug('<div class="ferConf aviso"><div><b>Folga de ' + n + ' dias?</b> Pedidos longos costumam ser férias.</div>'
        + '<div class="ferSugBtns"><button type="button" class="btn sm" id="ferLongaOk">Enviar como folga</button>'
        + '<button type="button" class="btn sm" id="ferLongaFer">Trocar para ' + (FER && FER.tipo === 'recesso' ? 'recesso' : 'férias') + '</button></div></div>');
      pp.querySelector('#ferLongaOk').addEventListener('click', () => { FER_F.longaOk = true; sug(''); envia(b); });
      pp.querySelector('#ferLongaFer').addEventListener('click', () => {
        FER_F.tipo = (FER && FER.tipo) || 'ferias'; FER_F.parte = false; FER_F.conf = null; desenharFeriasF(); });
      return;
    }
    envia(b);
  });
}

/** No modo demonstração, uma conferência de mentira (a de verdade é do banco). */
function demoFerSimular(t, i, f, v, hi, hf){
  const dias = Math.round((new Date(f + 'T12:00') - new Date(i + 'T12:00')) / 864e5) + 1;
  const mm = x => Number(x.slice(0,2)) * 60 + Number(x.slice(3,5));
  const erros = [];
  if (t === 'ferias' && dias < 5) erros.push('Cada parte das férias tem no mínimo 5 dias.');
  if (t === 'ferias' && i < somaDiaF(isoHojeF(), 30)) erros.push('Férias se pedem com pelo menos 30 dias de antecedência (a partir de ' + dataBR(somaDiaF(isoHojeF(), 30)) + ').');
  if (hi && hf && mm(hf) <= mm(hi)) erros.push('A hora de fim vem antes da hora de início.');
  const dow = new Date(i + 'T12:00').getDay();
  if (t === 'ferias' && (dow === 5 || dow === 6 || dow === 0)) erros.push('Férias começam de segunda a quinta (não nos 2 dias antes do descanso de domingo).');
  if (t === 'folga') return { ok: !erros.length, erros, avisos: [], choques: [], dias, vender: 0,
                              minutos: hi && hf && mm(hf) > mm(hi) ? mm(hf) - mm(hi) : null };
  return { ok: !erros.length, erros, avisos: [], choques: [], dias, vender: v, restantes_depois: 30 - dias - v,
           periodo: (FER.periodos || [])[0] };
}

/** Abre no próprio app (PDF pelo pdf.js, foto como imagem), com Baixar. */
async function verDocPessoalF(d){
  const w = document.createElement('div'); w.className = 'docView';
  w.innerHTML = '<div class="dvTopo"><b></b><button type="button" class="dvX" aria-label="Fechar">✕</button></div>'
    + '<div class="dvPag"><p class="dvMsg">Abrindo…</p></div>'
    + '<div class="dvBar"><button type="button" class="btn sm" data-z>Ampliar</button><button type="button" class="btn sm" data-b disabled>Baixar</button></div>';
  w.querySelector('.dvTopo b').textContent = d.rotulo + (d.descricao ? ' — ' + d.descricao : '');
  document.body.appendChild(w);
  const urls = [];
  const fecha = () => { w.remove(); urls.forEach(u => URL.revokeObjectURL(u)); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') fecha(); };
  document.addEventListener('keydown', esc_);
  w.querySelector('.dvX').addEventListener('click', fecha);
  const pag = w.querySelector('.dvPag');
  let zoom = 1;
  w.querySelector('[data-z]').addEventListener('click', ev => {
    zoom = zoom === 1 ? 2.2 : 1; ev.currentTarget.textContent = zoom === 1 ? 'Ampliar' : 'Reduzir';
    pag.querySelectorAll('canvas,img').forEach(x => { x.style.width = (zoom * 100) + '%'; });
  });
  try{
    const a = await rpc1('tf_rh_doc_func_abrir', { p_id: d.id });
    let blob;
    if (a.conteudo) blob = await (await fetch(a.conteudo)).blob();
    else {
      const url = SUPABASE_URL + '/storage/v1/object/rh-docs/' + String(a.storage_path).split('/').map(encodeURIComponent).join('/');
      const vai = () => fetch(url, { headers: Object.assign({ apikey: SUPABASE_ANON_KEY }, sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {}) });
      let r = await vai();
      if ((r.status === 401 || r.status === 403) && sessao.refresh && await renovarToken()) r = await vai();
      if (!r.ok) throw new Error('Não consegui abrir o arquivo (HTTP ' + r.status + '). Tente de novo com internet.');
      blob = await r.blob();
    }
    blob = new Blob([blob], { type: a.mime || blob.type });
    const obj = URL.createObjectURL(blob); urls.push(obj);
    const bb = w.querySelector('[data-b]'); bb.disabled = false;
    bb.addEventListener('click', () => {
      const l = document.createElement('a'); l.href = obj; l.download = a.nome || (d.rotulo + (a.mime === 'application/pdf' ? '.pdf' : '.jpg'));
      document.body.appendChild(l); l.click(); l.remove();
    });
    if (a.mime !== 'application/pdf'){
      pag.innerHTML = ''; const im = document.createElement('img'); im.src = obj; im.alt = d.rotulo; im.style.width = '100%'; pag.appendChild(im); return;
    }
    let lib = null;
    try{ lib = await carregarPdfJsF(); }catch(e){}
    if (!lib){ pag.innerHTML = '<p class="dvMsg"><a href="' + obj + '" target="_blank" rel="noopener">Abrir o PDF</a></p>'; return; }
    const doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    pag.innerHTML = '';
    for (let n = 1; n <= doc.numPages; n++){
      const pg = await doc.getPage(n);
      const vp1 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: Math.min(4, (Math.max(window.innerWidth, 360) * 2.2) / vp1.width) });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.style.width = '100%';
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      await pg.render({ canvasContext: cx, viewport: vp }).promise;
      pag.appendChild(cv);
    }
  }catch(e){ pag.innerHTML = '<p class="dvMsg" style="color:var(--crit)"></p>'; pag.firstChild.textContent = e.message; }
}
function painelDocF(d, podeAssinar){
  const p = document.createElement('div'); p.className = 'painel docPend' + (d.vencido ? ' venc' : '');
  const meu = d.tipo === 'ponto' ? 'minha folha' : 'meu recibo';
  p.innerHTML = '<div class="et" style="color:var(--warn)">' + (d.tipo === 'ponto' ? 'Folha de ponto' : 'Recibo de pagamento') + ' — assinar</div>'
    + '<h2>' + esc(tituloDocF(d)) + '</h2>'
    + '<p style="margin:0 0 10px;font-size:13px">' + (d.prazo ? 'Assine até ' + esc(dataBR(d.prazo)) + (d.vencido ? ' — <b style="color:var(--crit)">o prazo já passou</b>' : '') + '.' : '')
    + (d.versao > 1 ? ' Esta é a versão ' + d.versao + ' (substitui a anterior).' : '') + '</p>'
    + '<button class="btn sm" type="button" data-abrir>Abrir ' + (d.tipo === 'ponto' ? 'a folha' : 'o recibo') + '</button>'
    + '<p class="docDica">' + (d.tipo === 'ponto' ? 'Se tiver dúvida sobre esta folha, fale com o Bruno antes de assinar.'
        : 'Se tiver dúvida sobre os valores, fale com o administrativo antes de assinar.') + '</p>'
    + (podeAssinar ? '<div class="campo" style="margin-top:10px"><label>Seu PIN</label><input class="pinC" type="password" inputmode="numeric" maxlength="6" autocomplete="off" pattern="[0-9]*"></div>'
        + '<button class="btn pri" type="button" data-ass>Assinar</button>' : '')
    + '<button class="btn danger sm" type="button" data-nao>Não é ' + meu + '</button>';
  p.querySelector('[data-abrir]').addEventListener('click', () => verDocF(d));
  const ba = p.querySelector('[data-ass]');
  if (ba) ba.addEventListener('click', async () => {
    const pin = p.querySelector('.pinC').value;
    if (!/^\d{6}$/.test(pin)){ toast('Digite os 6 números do seu PIN.', 'err'); return; }
    ba.disabled = true;
    try{
      const r = await rpc1('tf_rhdoc_assinar', { p_id: d.id, p_pin: pin });
      if (r.status === 'ok'){ toast('Assinado. Obrigado!', 'ok'); await recarregarDocs(); pintarDocsF(); return; }
      if (r.status === 'pin_errado') toast('PIN errado. Restam ' + r.restantes + ' tentativa(s) antes de travar 15 minutos.', 'err');
      else if (r.status === 'bloqueado'){ toast('PIN travado por 15 minutos.', 'err'); await recarregarDocs(); pintarDocsF(); return; }
      else if (r.status === 'sem_pin'){ toast('Crie o seu PIN antes (Minha Segurança).', 'err'); return; }
      p.querySelector('.pinC').value = '';
    }catch(e){ toast(e.message, 'err'); await recarregarDocs(); pintarDocsF(); return; }
    ba.disabled = false;
  });
  p.querySelector('[data-nao]').addEventListener('click', async ev => {
    if (!confirm('"Não é ' + meu + '": o documento sai do seu celular agora e o escritório é avisado de que ele chegou à pessoa errada.\n\n'
      + 'Use só se o nome no documento NÃO for o seu. Dúvida sobre ' + (d.tipo === 'ponto' ? 'as horas' : 'os valores') + ' se resolve conversando, não por aqui.\n\nContinuar?')) return;
    const b = ev.currentTarget; b.disabled = true;
    try{ await rpc1('tf_rhdoc_nao_e_meu', { p_id: d.id }); toast('Devolvido. O escritório vai conferir e mandar o certo.', 'ok'); await recarregarDocs(); pintarDocsF(); }
    catch(e){ toast(e.message, 'err'); b.disabled = false; }
  });
  return p;
}

/** O leitor de PDF dentro do app (pdf.js): abre e amplia sem sair do Field —
 *  no Android, abrir um PDF "solto" vira download e some na pasta. */
let _pdfjsF = null;
function carregarPdfJsF(){
  if (_pdfjsF) return _pdfjsF;
  _pdfjsF = new Promise((ok, err) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); }
      catch(e){ err(new Error('O leitor de PDF não inicializou.')); } };
    s.onerror = () => { _pdfjsF = null; err(new Error('Sem internet para abrir o leitor de PDF.')); };
    document.head.appendChild(s);
  });
  return _pdfjsF;
}

// Substitui o grupo de WhatsApp das compras no cartão. Tem de ser tão rápido
// quanto o WhatsApp: o botão flutuante 📷 (todas as telas, menos dentro do
// levantamento e da execução — lá a câmera é do equipamento) já abre a câmera;
// depois da foto, o valor (teclado numérico, a vírgula entra sozinha) e Enviar.
// A frase é opcional, com as últimas da pessoa em um toque.
// No Android há mais dois caminhos: segurar o ícone do app → "Canhoto do
// cartão" (`shortcuts` do manifesto, abre ?canhoto=1) e "Compartilhar →
// TapFlow" a partir da câmera ou da galeria (`share_target`: o sw.js guarda a
// foto e abre ?canhoto=compartilhado). No iPhone, só o botão — o Safari não
// tem nenhum dos dois.
// Sem sinal: a foto vai para o IndexedDB (a mesma loja das fotos do
// levantamento) e o índice para o localStorage; sobe sozinha quando voltar.
// O id do canhoto nasce aqui: o reenvio da fila não duplica no banco (113).
// ════════════════════════════════════════════════════════════════════════════

/** Abre a câmera; com a foto, o formulário. Sem foto (cancelou), o formulário
 *  com "Tirar foto" e a lista dos meus canhotos — é o caminho para ela. */
function canNovo(pre){
  CAN.pre = pre || null;
  if (tela !== 'canhoto') CAN.voltar = canVoltarPara();
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment'); i.style.display = 'none';
  let respondeu = false;
  i.addEventListener('change', async () => {
    respondeu = true;
    const f = i.files && i.files[0]; i.remove();
    if (!f){ canFormulario(); return; }
    try{ CAN.foto = await reduzirFoto(f, 1600, 0.72); }catch(e){ toast(e.message, 'err'); CAN.foto = null; }
    canFormulario();
  });
  // o "cancelar" da câmera não dispara change em todo aparelho: ao voltar o foco, abre o formulário
  window.addEventListener('focus', function vf(){ window.removeEventListener('focus', vf);
    setTimeout(() => { if (!respondeu && tela !== 'canhoto'){ i.remove(); canFormulario(); } }, 900); });
  document.body.appendChild(i); i.click();
}

  p.querySelectorAll('[data-fr]').forEach(b => b.addEventListener('click', () => { document.getElementById('canF').value = b.dataset.fr; }));
  const tirar = () => canNovo(Object.assign({}, CAN.pre || {}, { valor: carNumF(v.value) || (CAN.pre && CAN.pre.valor), frase: document.getElementById('canF').value }));
  const bt = document.getElementById('canTirar'); if (bt) bt.addEventListener('click', tirar);
  const bo = document.getElementById('canOutra'); if (bo) bo.addEventListener('click', tirar);
  const im = p.querySelector('.canFoto img'); if (im) im.addEventListener('click', () => im.classList.toggle('zoom'));
  document.getElementById('canEnv').addEventListener('click', canEnviar);
  if (CAN.foto && !pre.valor) setTimeout(() => v.focus(), 80);
}
const carNumF = t => { const s = String(t || '').replace(/\./g, '').replace(',', '.').replace(/[^\d.]/g, ''); const n = Number(s); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; };

async function canEnviar(){
  if (CAN.enviando) return;
  const valor = carNumF(document.getElementById('canV').value);
  const frase = document.getElementById('canF').value.trim();
  const data = document.getElementById('canD').value || canHoje();
  if (!CAN.foto){ toast('Tire a foto do canhoto primeiro.', 'err'); return; }
  if (!(valor > 0)){ toast('Digite o valor do canhoto.', 'err'); document.getElementById('canV').focus(); return; }
  if (valor > 2000 && !confirm('R$ ' + canValTxt(valor) + ' — é isso mesmo?')) return;
  // o mesmo canhoto duas vezes é o erro mais comum do grupo: avisa
  const igual = canFila().concat(((CAN.meus && CAN.meus.comprovantes) || []).filter(c => c.situacao !== 'cancelado'))
    .find(c => Math.abs(Number(c.valor) - valor) < 0.005 && (c.data || c.data_compra) === data);
  if (igual && !confirm('Você já mandou um canhoto de R$ ' + canValTxt(valor) + ' ' + (data === canHoje() ? 'hoje' : 'nesse dia') + '. Enviar mesmo assim?')) return;
  CAN.enviando = true;
  const id = canNovoId();
  try{
    await IDB.put('canhoto:' + id, CAN.foto);
    const L = canFila(); L.push({ id, valor, frase, data, linha_id: (CAN.pre && CAN.pre.linha_id) || null, criado: new Date().toISOString() }); canFilaSet(L);
  }catch(e){ CAN.enviando = false; toast('Não consegui guardar a foto no aparelho: ' + e.message, 'err'); return; }
  CAN.enviando = false;
  const r = await canFlush();
  if (r.enviados.indexOf(id) >= 0) toast('Enviado · ' + canBRL(valor) + (frase ? ' · ' + frase : ''), 'ok');
  else if (r.recusados.indexOf(id) < 0) toast('Guardado no aparelho · sobe sozinho quando tiver sinal.', 'ok');
  canVoltar();
}

/** Sobe o que está na fila, um por um. Rede caiu: para e tenta depois. */
let _canFlushando = null;
function canFlush(){
  if (_canFlushando) return _canFlushando;
  _canFlushando = (async () => {
    const out = { enviados: [], recusados: [] };
    const uid = canUid();
    for (const it of canFila()){
      if (DEMO){ CAN.demo.unshift({ id: it.id, valor: it.valor, frase: it.frase, data_compra: it.data, situacao: 'enviado', enviado_em: new Date().toISOString() });
        out.enviados.push(it.id); canFilaSet(canFila().filter(x => x.id !== it.id)); IDB.del('canhoto:' + it.id).catch(() => {}); continue; }
      if (!uid || navigator.onLine === false) break;
      const foto = await IDB.get('canhoto:' + it.id).catch(() => null);
      if (!foto){ canFilaSet(canFila().filter(x => x.id !== it.id)); out.recusados.push(it.id);
        toast('O canhoto de ' + canBRL(it.valor) + ' perdeu a foto no aparelho. Tire de novo.', 'err'); continue; }
      const path = 'comprovantes/' + uid + '/' + it.id + '.jpg';
      try{
        const blob = await (await fetch(foto)).blob();
        const url = SUPABASE_URL + '/storage/v1/object/cartoes/' + path.split('/').map(encodeURIComponent).join('/');
        const vai = () => fetch(url, { method: 'POST', body: blob, headers: Object.assign({ apikey: SUPABASE_ANON_KEY, 'Content-Type': 'image/jpeg' },
          sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {}) });
        let r = await vai();
        if ((r.status === 401 || r.status === 403) && sessao.refresh && await renovarToken()) r = await vai();
        // 400/409 "já existe": é o reenvio de uma foto que subiu antes da queda — segue
        if (!r.ok){
          const j = await r.json().catch(() => ({}));
          if (!(r.status === 409 || /exist|duplicate/i.test(String(j.message || j.error || '')))) throw Object.assign(new Error('O armazenamento recusou a foto (HTTP ' + r.status + ').'), { rede: r.status >= 500 });
        }
        await rpc('tf_cartao_comprovante_enviar', { p_id: it.id, p_valor: it.valor, p_frase: it.frase || null, p_data: it.data,
          p_foto_path: path, p_foto_bytes: blob.size, p_linha_id: it.linha_id || null });
        canFilaSet(canFila().filter(x => x.id !== it.id)); IDB.del('canhoto:' + it.id).catch(() => {});
        out.enviados.push(it.id);
      }catch(e){
        if (e.rede || /Failed to fetch|NetworkError|Load failed|não respondeu/i.test(e.message || '')) break;
        if (e.sessaoMorta) break;
        // recusa de negócio (pedido já atendido, data, valor): não adianta insistir
        canFilaSet(canFila().filter(x => x.id !== it.id)); IDB.del('canhoto:' + it.id).catch(() => {});
        out.recusados.push(it.id);
        toast('O canhoto de ' + canBRL(it.valor) + ' não foi aceito: ' + e.message, 'err');
      }
    }
    if (out.enviados.length) canAtualizar().catch(() => {});
    canAtualizarFab();
    return out;
  })().finally(() => { _canFlushando = null; });
  return _canFlushando;
}
async function canAtualizar(){
  if (DEMO){ CAN.meus = { comprovantes: CAN.demo, frases: ['Abastecimento Saveiro 02', 'Hotel', 'Pedágio'], pedidos: [] }; canAtualizarFab(); return CAN.meus; }
  if (!sessao.token) return null;
  try{ CAN.meus = await rpc('tf_cartao_meus_comprovantes', {}); }catch(e){ return CAN.meus; }   // banco sem o 113: silencioso
  canAtualizarFab();
  return CAN.meus;
}
const CAN_SIT = { enviado: ['', 'enviado — o escritório vai lançar'], lancado: ['ok', 'lançado'], devolvido: ['atr', 'devolvido'], cancelado: ['', 'cancelado'] };
function canDesenharLista(){
  const el = document.getElementById('canLista'); if (!el) return;
  const F = canFila(), M = (CAN.meus && CAN.meus.comprovantes) || [], P = (CAN.meus && CAN.meus.pedidos) || [];
  el.innerHTML = (P.length ? '<div class="grupoTit">O escritório pediu o canhoto</div>' + P.map(x => '<div class="epiLin"><b>' + esc(x.estabelecimento) + ' · ' + esc(canBRL(x.valor)) + '</b>'
        + '<small>' + esc(dataBR(x.data) + (x.cartao ? ' · cartão ' + x.cartao : '')) + '</small><div class="linha" style="margin-top:6px">'
        + '<button class="btn sm pri" type="button" data-ped="' + esc(x.linha_id) + '">Enviar este</button></div></div>').join('') : '')
    + (F.length ? '<div class="grupoTit">No aparelho, esperando sinal</div>' + F.map(x => '<div class="epiLin"><b>' + esc(canBRL(x.valor)) + (x.frase ? ' · ' + esc(x.frase) : '') + '</b>'
        + '<small>' + esc(dataBR(x.data)) + ' · sobe sozinho quando tiver sinal</small></div>').join('') : '')
    + (M.length ? M.slice(0, 40).map(c => { const [cls, rot] = CAN_SIT[c.situacao] || ['', c.situacao];
        return '<div class="epiLin' + (c.situacao === 'cancelado' ? ' riscado' : '') + '"><b>' + esc(canBRL(c.valor)) + (c.frase ? ' · ' + esc(c.frase) : '') + '</b>'
          + '<small>' + esc(dataBR(c.data_compra)) + '</small><div class="chips" style="margin-top:4px"><span class="chip ' + cls + '">'
          + esc(c.na_fatura && c.situacao === 'lancado' ? 'conferido na fatura' : rot) + '</span></div>'
          + (c.situacao === 'devolvido' && c.devolvido_motivo ? '<small class="canMot">Motivo: ' + esc(c.devolvido_motivo) + '</small>' : '')
          + '<div class="linha" style="margin-top:6px">' + (c.foto_path ? '<button class="btn sm" type="button" data-verf="' + esc(c.foto_path) + '">Ver foto</button>' : '')
          + (c.situacao === 'devolvido' ? '<button class="btn sm pri" type="button" data-denovo="' + esc(c.id) + '">Mandar de novo</button>' : '')
          + (c.situacao === 'enviado' ? '<button class="btn sm" type="button" data-canc="' + esc(c.id) + '">Cancelar</button>' : '') + '</div></div>'; }).join('')
      : (F.length || P.length ? '' : '<p style="margin:0;font-size:13.5px">Nenhum canhoto ainda. Os que você mandar aparecem aqui, com o que o escritório fez com cada um.</p>'));
  el.querySelectorAll('[data-ped]').forEach(b => b.addEventListener('click', () => {
    const x = P.find(y => y.linha_id === b.dataset.ped);
    canNovo({ linha_id: x.linha_id, valor: Number(x.valor), data: x.data, estabelecimento: x.estabelecimento });
  }));
  el.querySelectorAll('[data-denovo]').forEach(b => b.addEventListener('click', () => {
    const c = M.find(y => y.id === b.dataset.denovo); canNovo({ valor: Number(c.valor), frase: c.frase || '', data: c.data_compra });
  }));
  el.querySelectorAll('[data-canc]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Cancelar este canhoto? O escritório deixa de vê-lo.')) return;
    try{ await rpc('tf_cartao_comprovante_cancelar', { p_id: b.dataset.canc }); toast('Cancelado.', 'ok'); await canAtualizar(); canDesenharLista(); }
    catch(e){ toast(e.message, 'err'); }
  }));
  el.querySelectorAll('[data-verf]').forEach(b => b.addEventListener('click', () => canVerFoto(b.dataset.verf)));
}
async function canVerFoto(path){
  const w = document.createElement('div'); w.className = 'docView';
  w.innerHTML = '<div class="dvTopo"><b>Canhoto</b><button type="button" class="dvX" aria-label="Fechar">✕</button></div><div class="dvPag"><p class="dvMsg">Abrindo…</p></div>';
  document.body.appendChild(w); canAtualizarFab();
  w.querySelector('.dvX').addEventListener('click', () => { w.remove(); canAtualizarFab(); });
  try{
    const url = SUPABASE_URL + '/storage/v1/object/cartoes/' + String(path).split('/').map(encodeURIComponent).join('/');
    const vai = () => fetch(url, { headers: Object.assign({ apikey: SUPABASE_ANON_KEY }, sessao.token ? { Authorization: 'Bearer ' + sessao.token } : {}) });
    let r = await vai(); if ((r.status === 401 || r.status === 403) && sessao.refresh && await renovarToken()) r = await vai();
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const u = URL.createObjectURL(await r.blob());
    const pag = w.querySelector('.dvPag'); pag.innerHTML = ''; const im = document.createElement('img'); im.src = u; im.alt = 'Canhoto'; im.style.width = '100%'; pag.appendChild(im);
  }catch(e){ w.querySelector('.dvMsg').textContent = 'Não consegui abrir a foto (' + e.message + '). Tente com internet.'; }
}

/** Atalho do ícone (?canhoto=1) e "Compartilhar → TapFlow" (?canhoto=compartilhado). */
async function canDoEndereco(){
  let q; try{ q = new URLSearchParams(location.search).get('canhoto'); }catch(e){ return; }
  if (!q) return;
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  CAN.voltar = pintarLista;
  if (q === 'compartilhado'){
    try{
      const c = await caches.open('tapflow-compartilhado');
      const r = await c.match('foto');
      if (r){ const b = await r.blob(); await c.delete('foto');
        CAN.foto = await reduzirFoto(new File([b], 'canhoto.jpg', { type: b.type || 'image/jpeg' }), 1600, 0.72); }
    }catch(e){ toast('Não consegui pegar a foto compartilhada: ' + e.message, 'err'); }
  }
  canFormulario();
}
window.addEventListener('online', () => { canFlush().catch(() => {}); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') canFlush().catch(() => {}); });
setInterval(() => { if (canFila().length) canFlush().catch(() => {}); }, 60000);

function iniciar(){
  pintarFila();
  carregarParametros().finally(() => {
    // S60 · depois da lista: o atalho/compartilhar do canhoto, a fila dele e "Meus canhotos"
    carregar().then(pintarLista).catch(()=>pintarLista())
      .finally(() => { canDoEndereco().catch(() => {}); canAtualizar().catch(() => {}); canFlush().catch(() => {}); });
    flushFila().catch(()=>{});
    // o catálogo vem por último: se falhar, o app funciona igual, só sem a lista
    sincronizarCatalogo().catch(()=>{});
  });
}

// APP INSTALÁVEL
// ----------------------------------------------------------------------------
// O service worker só entra em http(s): em file:// o navegador recusa, e o app
// continua tendo que abrir com duplo clique para eu testar.
//
// Sobre o convite de instalar: sem ele, ninguém acha "Adicionar à tela inicial"
// no menu de três pontinhos. Com ele, é um toque. Quem dispensar não vê de
// novo — o app não fica insistindo com quem já disse não.

const K_INST = 'tff_inst_nao';

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

let promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  promptInstalar = e;
  if (LS.get(K_INST, false)) return;
  const b = document.getElementById('barInst');
  if (b) b.hidden = false;
});
window.addEventListener('appinstalled', () => {
  const b = document.getElementById('barInst'); if (b) b.hidden = true;
  promptInstalar = null;
});
document.getElementById('btnInst').addEventListener('click', async () => {
  const b = document.getElementById('barInst');
  if (!promptInstalar){ b.hidden = true; return; }
  b.hidden = true;
  try{ promptInstalar.prompt(); await promptInstalar.userChoice; }catch(e){}
  promptInstalar = null;
});
document.getElementById('btnInstNao').addEventListener('click', () => {
  LS.set(K_INST, true);
  document.getElementById('barInst').hidden = true;
});

   A FILA E OS RASCUNHOS NÃO SÃO APAGADOS AQUI — chaves diferentes, de

  if (NO_SERVIDOR){ irParaHub(''); return; }
  document.getElementById('login').hidden = false;
})();
