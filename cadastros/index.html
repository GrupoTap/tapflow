function reduzirParaMiniatura(file){
  return new Promise((ok, err) => {
    const fr = new FileReader();
    fr.onerror = () => err(new Error('Não consegui ler a imagem.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => err(new Error('Arquivo não parece uma imagem.'));
      img.onload = () => {
        const max = 160;
        const esc_ = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * esc_));
        const h = Math.max(1, Math.round(img.height * esc_));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = '';
        try{ out = cv.toDataURL('image/webp', 0.8); }catch(e){}
        // Safari antigo devolve PNG quando não sabe webp — e PNG de foto é
        // enorme. Se não veio webp, força jpeg em vez de aceitar o que veio.
        if (!out || out.indexOf('data:image/webp') !== 0) out = cv.toDataURL('image/jpeg', 0.7);
        ok(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function subirFotoCheia(item, file){
  try{
    const ext  = (file.type.split('/')[1] || 'jpg').replace('jpeg','jpg');
    const path = item.id + '.' + ext;
    const url  = SUPABASE_URL + '/storage/v1/object/catalogo/' + encodeURIComponent(path)
               + '?upsert=true';
    const envia = () => fetch(url, {
      method:'POST',
      headers: Object.assign({ apikey: SUPABASE_ANON_KEY, 'Content-Type': file.type,
                               'x-upsert':'true' },
        sessao.token ? { Authorization:'Bearer ' + sessao.token } : {}),
      body: file
    });
    let r = await envia();
    if (r.status === 401 && sessao.refresh && await renovarToken()) r = await envia();
    return r.ok ? path : null;
  }catch(e){ return null; }
}

async function verFotoCheia(path, titulo){
  try{
    const url = SUPABASE_URL + '/storage/v1/object/catalogo/' + encodeURIComponent(path);
    const r = await fetch(url, { headers: Object.assign({ apikey: SUPABASE_ANON_KEY },
      sessao.token ? { Authorization:'Bearer ' + sessao.token } : {}) });
    if (!r.ok) throw new Error('A foto cheia não está mais no bucket (HTTP ' + r.status + ').');
    const b = URL.createObjectURL(await r.blob());
    abrirModal(titulo || 'Foto',
      '<img src="' + b + '" alt="' + esc(titulo || '') + '" '
      + 'style="width:100%;height:auto;border-radius:5px;display:block">',
      [{ label:'Fechar', pri:true, onClick: () => { URL.revokeObjectURL(b); fecharModal(); } }]);
  }catch(e){ toast(e.message,'err'); }
}

function montarFoto(item){
  const box = document.getElementById('fFotoBox');
  const inp = document.getElementById('fFotoIn');
  const del = document.getElementById('fFotoDel');
  if (!box || !inp) return;

  const desenhar = (src, caminho) => {
    box.innerHTML = '';
    if (src){
      const im = document.createElement('img');
      im.className = 'fotoCat'; im.style.width = '84px'; im.style.height = '84px';
      im.src = src; im.alt = 'Foto de ' + (item.descricao || '');
      if (caminho){
        im.style.cursor = 'zoom-in';
        im.title = 'Ver a foto em tamanho real';
        im.addEventListener('click', () => verFotoCheia(caminho, item.descricao));
      }
      box.appendChild(im);
      if (caminho){
        const lk = document.createElement('button');
        lk.type = 'button'; lk.className = 'btn mini';
        lk.style.cssText = 'display:block;margin:6px 0 0';
        lk.textContent = 'ver em tamanho real';
        lk.addEventListener('click', () => verFotoCheia(caminho, item.descricao));
        box.appendChild(lk);
      }
    } else {
      const v = document.createElement('div');
      v.className = 'fotoVazia'; v.style.width = '84px'; v.style.height = '84px';
      v.textContent = 'sem foto';
      box.appendChild(v);
    }
    if (del) del.hidden = !src;
  };
  desenhar(null);
  // Busca miniatura e caminho juntos: a foto cheia só existe se alguém subiu.
  (async () => {
    try{
      const r = DEMO ? [] : await get('catalogo_fotos?select=thumb,path&item_id=eq.' + item.id + '&limit=1');
      const f = (r && r[0]) || null;
      FOTO_CACHE[item.id] = { thumb: f ? f.thumb : null, versao: item.foto_versao || '' };
      desenhar(f ? f.thumb : null, f ? f.path : null);
    }catch(e){
      box.innerHTML = '';
      const v = document.createElement('div');
      v.className = 'fotoVazia'; v.style.width = '84px'; v.style.height = '84px';
      v.textContent = 'não carregou';
      box.appendChild(v);
    }
  })();

  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)){ toast('Escolha uma imagem.','err'); inp.value=''; return; }
    try{
      const thumb = await reduzirParaMiniatura(f);
      if (thumb.length > 61440)
        throw new Error('Mesmo reduzida a imagem ficou grande demais. Tente uma foto mais simples.');
      if (DEMO) throw new Error('Modo demonstração: a foto não é gravada.');
      // A CHEIA vai para o bucket privado; a miniatura, para a tabela. Quem
      // escolhe peça numa lista não precisa de 2 MB — mas quem confere um
      // detalhe no escritório precisa, e é para isso que ela existe.
      const caminho = await subirFotoCheia(item, f);
      await rpc('tf_salvar_foto_item',
        { p_item_id:item.id, p_thumb:thumb, p_path:caminho, p_bytes:f.size });
      FOTO_CACHE[item.id] = { thumb, versao:'' };
      desenhar(thumb, caminho);
      toast(caminho ? 'Foto gravada.' : 'Miniatura gravada — a foto cheia não subiu.',
            caminho ? 'ok' : 'err');
      listarCatalogo();
    }catch(e){ toast(e.message,'err'); }
    finally{ inp.value = ''; }
  });

  if (del) del.addEventListener('click', async () => {
    // A miniatura só existe no banco: apagada, alguém tem que ir tirar outra.
    if (!confirm('Remover a foto de ' + (item.codigo || 'este item') + '? '
               + 'Não dá para desfazer — vai ser preciso tirar outra.')) return;
    try{
      if (DEMO) throw new Error('Modo demonstração: a foto não é alterada.');
      await rpc('tf_remover_foto_item', { p_item_id:item.id });
      FOTO_CACHE[item.id] = { thumb:null, versao:'' }; desenhar(null);
      toast('Foto removida.','ok'); listarCatalogo();
    }catch(e){ toast(e.message,'err'); }
  });
}

async function listarCatalogo(){
  const el = document.getElementById('catLista');
  if (!el) return;
  const termo = BUSCA.cat || '';

  // A família filtra no servidor; o texto filtra aqui. O catálogo tem centenas
  // de itens, não milhões — e filtrar aqui deixa a busca igual à do celular,
  // sem acento e por palavra solta.
  let itens = [];
  try{
    if (DEMO) itens = demoCatalogo(catFamSel, '');
    else {
      let q = 'v_catalogo?select=*&order=familia_ordem,codigo';
      if (catFamSel) q += '&familia_id=eq.' + catFamSel;
      itens = await get(q);
    }
  }catch(e){ toast(e.message,'err'); return; }

  const antes = itens.length;
  if (termo) itens = itens.filter(i => casa(
    [i.descricao, i.marca, i.modelo, i.codigo, i.familia,
     Object.values(i.especificacoes||{}).join(' ')].join(' '), termo));

  el.innerHTML = '';
  if (!itens.length){
    el.innerHTML = '<p style="font-size:13px;color:var(--ink-3)">'
      + (termo ? 'Nada encontrado para “' + esc(termo) + '” entre os ' + antes
                 + ' itens desta família.'
               : 'Nenhum item nesta família ainda.')
      + '</p>';
    return;
  }
  itens.forEach(i => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (catEdit && catEdit.id === i.id ? ' on' : '') + (i.ativo ? '' : ' off');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = (i.ativo ? '' : '📦 ') + i.descricao;
    const partes = [i.codigo];
    if (i.marca || i.modelo) partes.push([i.marca, i.modelo].filter(Boolean).join(' '));
    if (i.preco_referencia) partes.push(BRL(i.preco_referencia));
    if (i.vezes_usado) partes.push(i.vezes_usado + '× usado');
    if (!i.ativo) partes.push('arquivado');
    b.querySelector('small').textContent = partes.join(' · ');
    if (i.tem_foto){
      const im = document.createElement('img');
      im.className = 'fotoCat'; im.alt = ''; im.loading = 'lazy';
      // A lista NUNCA espera pela foto: ela é buscada depois, item a item, e
      // encaixa quando chega. Foto que atrasa lista é foto que atrapalha.
      fotoDoItem(i.id, i.foto_versao).then(src => { if (src) im.src = src; })
        .catch(() => { im.alt = 'foto não carregou'; });
      b.insertBefore(im, b.firstChild);
      b.style.display = 'flex'; b.style.gap = '10px'; b.style.alignItems = 'center';
    }
    b.addEventListener('click', () => formCatalogo(i));
    el.appendChild(b);
  });
}

function formCatalogo(item){
  catEdit = item;
  const d = document.getElementById('catDet');
  if (!d) return;
  // S101 · gravar no catálogo é do escritório (RLS `tf_pode_escritorio()`):
  // quem é de campo vê o item escolhido, sem botões; sem item, só o aviso.
  d.classList.toggle('soLeitura', !podeEscritorio());
  if (!podeEscritorio() && !item){
    d.innerHTML = '<div class="aviso" style="margin-bottom:12px">Só leitura: o catálogo é '
      + 'mantido pelo escritório. Seu perfil executa em campo — o banco não aceitaria a gravação.</div>'
      + '<p class="nota">Escolha um item à esquerda para ver os dados dele.</p>';
    return;
  }

  const famId = item ? item.familia_id : (catFamSel || (CAT_FAM[0]||{}).id);
  const fam = CAT_FAM.find(f => f.id === famId) || { campos: [] };
  const espec = (item && item.especificacoes) || {};

  let h = '<h3>' + (item ? esc(item.codigo) + ' · editar' : 'Novo item de catálogo') + '</h3>';

  if (!item){
    h += '<div class="campo"><label for="fFam">Família</label><select id="fFam">'
      + CAT_FAM.map(f => '<option value="' + f.id + '"' + (f.id===famId?' selected':'') + '>'
          + esc(f.nome) + '</option>').join('') + '</select></div>';
  }

  // ── ITEM 6 (S34): O CÓDIGO PASSA A SER EDITÁVEL ─────────────────────────
  // Até o S33 o código era só um texto no título: o banco gerava e ninguém
  // mexia. O Bruno pretende usá-lo para dimensionar serviço por contrato, e
  // para isso precisa escolher o valor. Duas defesas e nenhuma camisa de
  // força: repetido NÃO SALVA (o código é chave do catálogo inteiro), fora do
  // padrão da família só AVISA — ninguém sabe ainda que forma o uso futuro
  // vai pedir, e travar agora seria decidir por quem ainda não decidiu.
  h += '<div class="campo"><label for="fCod">Código</label>'
    +  '<input id="fCod" type="text" autocomplete="off" name="fcod_nofill" '
    +    'data-lpignore="true" data-1p-ignore spellcheck="false" '
    +    'style="font-family:var(--mono, monospace);text-transform:uppercase" value="'
    +    esc(item ? item.codigo : '') + '"'
    +    (item ? '' : ' placeholder="carregando a sugestão…"') + '></div>'
    +  '<div class="dica" id="fCodDica">' + (item
        ? 'Dá para trocar. O código é único no catálogo inteiro, não só nesta família.'
        : 'Já vem com a próxima sugestão da família. Só mexa se quiser outro.') + '</div>';

  if (!item){
    // O campo não some sem explicação: a foto precisa de um item para pertencer,
    // e sumir calado faz a pessoa procurar num lugar que não existe.
    h += '<div class="campo"><label>Foto</label>'
      +  '<div style="display:flex;gap:10px;align-items:center">'
      +    '<div class="fotoVazia" style="width:84px;height:84px">sem foto</div>'
      +    '<p style="flex:1;font-size:12px;color:var(--ink-3);margin:0;line-height:1.45">'
      +      'A foto entra <b>depois de adicionar o item</b> — ela pertence a um '
      +      'modelo, e o modelo precisa existir primeiro. Ao salvar, o item abre '
      +      'para edição já com o campo de foto.</p>'
      +  '</div></div>';
  }

  if (item){
    h += '<div class="campo"><label>Foto</label>'
      +  '<div style="display:flex;gap:10px;align-items:flex-start">'
      +    '<div id="fFotoBox"></div>'
      +    '<div style="flex:1">'
      +      '<input id="fFotoIn" type="file" accept="image/*" style="font-size:12px">'
      +      '<p style="font-size:11.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.45">'
      +        'A foto é <b>deste modelo</b>, não do tipo de peça. Se você trocar a marca '
      +        'ou o modelo, ela cai sozinha — foto de outro modelo na lista do técnico '
      +        'é pior que nenhuma, porque parece certa.<br>'
      +        'A imagem é reduzida aqui no navegador antes de subir.</p>'
      +      '<button class="btn mini" id="fFotoDel" type="button" style="margin-top:8px;margin-left:0">Remover foto</button>'
      +    '</div></div></div>';
  }

  h += '<div class="campo"><label for="fDesc">Descrição</label>'
    +  '<input id="fDesc" type="text" value="' + esc(item ? item.descricao : '') + '"></div>'
    +  '<div class="dupla">'
    +    '<div class="campo"><label for="fMarca">Marca</label><input id="fMarca" type="text" value="'
    +      esc(item ? (item.marca||'') : '') + '"></div>'
    +    '<div class="campo"><label for="fModelo">Modelo</label><input id="fModelo" type="text" value="'
    +      esc(item ? (item.modelo||'') : '') + '"></div></div>';

  // os campos técnicos da família
  if (fam.campos && fam.campos.length){
    h += '<div class="secTit">Detalhes técnicos</div><div class="grelha">';
    fam.campos.forEach(c => {
      const v = espec[c.chave];
      const id = 'esp_' + c.chave;
      h += '<div class="campo"><label for="' + id + '">' + esc(c.rotulo) + '</label>';
      if (c.tipo === 'lista'){
        h += '<select id="' + id + '" data-esp="' + esc(c.chave) + '"><option value=""></option>'
          + (c.opcoes||[]).map(o => '<option' + (v===o?' selected':'') + '>' + esc(o) + '</option>').join('')
          + '</select>';
      } else if (c.tipo === 'booleano'){
        h += '<label class="chk"><input type="checkbox" id="' + id + '" data-esp="' + esc(c.chave) + '"'
          + (v ? ' checked' : '') + '> sim</label>';
      } else {
        h += '<input id="' + id + '" data-esp="' + esc(c.chave) + '" data-tipo="' + esc(c.tipo||'texto')
          + '" type="' + (c.tipo==='numero'?'number':'text') + '" step="any" value="'
          + esc(v==null?'':v) + '">';
      }
      h += '</div>';
    });
    h += '</div>';
  }

  h += '<div class="secTit">Campo e orçamento</div>'
    +  '<div class="dupla">'
    +   '<label class="chk"><input type="checkbox" id="fCalib"'
    +     (item && item.requer_calibracao ? ' checked':'') + '> Requer calibração</label>'
    +   '<label class="chk"><input type="checkbox" id="fLacre"'
    +     (item && item.requer_lacre ? ' checked':'') + '> Requer lacre</label></div>'
    +  '<div class="campo"><label for="fForn">Fornecedor padrão</label><input id="fForn" type="text" value="'
    +    esc(item ? (item.fornecedor_padrao||'') : '') + '"></div>'
    // ── ITEM 5 (S34): CUSTO E PREÇO SÃO DINHEIRO, E AGORA PARECEM ────────
    // Eram `type="number"` crus: 1190 na tela, sem "R$" e sem ponto de
    // milhar, num formulário em que o preço já aparece formatado em todo o
    // resto do sistema. O par BRL/_numBR já existia e já era usado no desconto
    // da proposta — aqui só passou a ser usado também.
    // O "R$" é PREFIXO visual (o mesmo desenho do "− R$" do desconto), não
    // texto dentro do campo: dentro, ele atrapalharia a digitação e teria que
    // ser limpo na leitura.
    +  '<div class="dupla">'
    +   campoDinheiro('fCusto', 'Custo de referência', item && item.custo_referencia)
    +   campoDinheiro('fPreco', 'Preço de referência', item && item.preco_referencia)
    +  '</div>'
    +  '<p class="nota">Estes valores entram preenchidos quando o item é lançado em campo — '
    +  'para o orçamento começar de algum lugar. Continuam editáveis em cada OS.</p>'
    +  '<div class="campo"><label for="fObs">Observações</label><input id="fObs" type="text" value="'
    +    esc(item ? (item.observacoes||'') : '') + '"></div>'
    // ── S39 · SUGERIR NA VENDA ADICIONAL ──────────────────────────────────
    // Quem sugere o quê é DADO do item, não regra no código: calibração de
    // manômetro "por tipo = manômetro", instalação "uma por peça", frete e
    // deslocamento "sempre". A aba Itens da OS mostra e o escritório marca.
    +  '<div class="secTit">Sugerir na venda adicional</div>'
    +  '<div class="campo"><label for="fSug">Quando sugerir este item</label><select id="fSug">'
    +    [['','Não sugerir'],['sempre','Sempre (1 por venda — ex.: frete, deslocamento)'],
          ['por_peca','Uma por peça lançada (ex.: instalação)'],
          ['por_tipo','Uma por peça de certos tipos (ex.: calibração de manômetro)']]
         .map(([v,r]) => '<option value="' + v + '"' + ((item && (item.sugestao_modo||'')) === v ? ' selected' : '')
           + '>' + r + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo" id="fSugTiposC"><label>Tipos de peça</label><div class="dupla" id="fSugTipos">'
    +    CAT_FAM.filter(f => f.id !== 'servico').map(f => '<label class="chk" style="margin:0"><input type="checkbox" value="'
           + esc(f.id) + '"' + (item && (item.sugestao_tipos||[]).includes(f.id) ? ' checked' : '') + '> '
           + esc(f.nome) + '</label>').join('')
    +  '</div></div>';

  h += '<div class="linhaBtns">'
    +  '<button class="btn pri" id="fSalvar">' + (item ? 'Salvar alterações' : 'Adicionar ao catálogo') + '</button>';
  if (item){
    h += '<button class="btn" id="fNovo">Novo item</button>'
      +  '<button class="btn" id="fArquivar">' + (item.ativo ? 'Arquivar' : 'Reativar') + '</button>'
      +  '<button class="btn perigo" id="fExcluir">Excluir</button>';
  }
  h += '</div>';

  if (item && item.vezes_usado){
    h += '<p class="nota">Já lançado em <b>' + item.vezes_usado + '</b> item(ns) de OS. '
      +  'Por isso não pode ser excluído — arquivar tira ele da lista do campo e mantém as OS antigas certas.</p>';
  }

  d.innerHTML = h;

  const fs = document.getElementById('fFam');
  if (fs) fs.addEventListener('change', () => { catFamSel = fs.value; formCatalogo(null); });

  ligarCampoDinheiro('fCusto');
  ligarCampoDinheiro('fPreco');
  ligarCampoCatalogo(item, fam);

  document.getElementById('fSalvar').addEventListener('click', salvarCatalogo);
  const fSug = document.getElementById('fSug');
  const sugTipos = () => { document.getElementById('fSugTiposC').hidden = fSug.value !== 'por_tipo'; };
  fSug.addEventListener('change', sugTipos); sugTipos();
  if (item) montarFoto(item);
  const bn = document.getElementById('fNovo');
  if (bn) bn.addEventListener('click', () => formCatalogo(null));
  const ba = document.getElementById('fArquivar');
  if (ba) ba.addEventListener('click', () => arquivarCatalogo(item));
  const bx = document.getElementById('fExcluir');
  if (bx) bx.addEventListener('click', () => excluirCatalogo(item));
}

let _catCodFora = false;

function ligarCampoCatalogo(item, fam){
  const el = document.getElementById('fCod');
  const dica = document.getElementById('fCodDica');
  if (!el) return;
  _catCodFora = false;

  el.addEventListener('input', () => { el.value = el.value.toUpperCase(); });

  if (!item){
    // a sugestão vem de `tf_proximo_codigo_catalogo`, que é quem sabe contar —
    // reimplementar a contagem aqui é como as duas pontas passam a discordar
    (async () => {
      let sug = '';
      try{
        sug = DEMO ? demoProximoCodigo(fam) : await rpc('tf_proximo_codigo_catalogo', { p_familia: fam.id });
      }catch(e){ sug = ''; }
      if (document.getElementById('fCod') !== el) return;   // trocou de família
      el.placeholder = sug || 'ex.: ' + ((fam && fam.prefixo) || 'SRV') + '-0001';
      if (!el.value) el.value = sug || '';
    })();
  }

  const conferir = async () => {
    const cod = el.value.trim().toUpperCase();
    dica.className = 'dica';
    if (!cod){
      dica.textContent = 'Vazio: o TapHub numera sozinho, como sempre fez.';
      _catCodFora = false; return;
    }
    if (/\s/.test(cod)){
      dica.className = 'dica erro';
      dica.textContent = 'O código não pode ter espaço.'; return;
    }
    // fora do padrão da família — aviso, nunca trava
    const pref = (fam && fam.prefixo) || '';
    _catCodFora = !!pref && !new RegExp('^' + pref + '-\\d{4}$').test(cod);

    let dono = null;
    if (!DEMO){
      try{
        const r = await get('v_catalogo?select=codigo,descricao,familia&codigo=eq.'
                            + encodeURIComponent(cod) + '&limit=1');
        if (r && r[0] && (!item || r[0].codigo !== item.codigo)) dono = r[0];
      }catch(e){ /* sem rede: o banco recusa no salvar, com mensagem */ }
    } else {
      const r = (D_CAT||[]).find(x => x.codigo === cod && (!item || x.id !== item.id));
      if (r) dono = { familia:r.familia, descricao:r.descricao };
    }
    if (dono){
      dica.className = 'dica erro';
      dica.textContent = 'Este código já é de outro item: ' + dono.familia + ' · ' + dono.descricao
                       + '. Códigos não se repetem — escolha outro.';
      return;
    }
    if (_catCodFora){
      dica.className = 'dica aviso';
      dica.textContent = 'Fora do padrão ' + pref + '-0000 desta família. Dá para salvar assim — '
                       + 'só confirme na hora de gravar.';
      return;
    }
    dica.textContent = 'Código livre.';
  };
  el.addEventListener('blur', conferir);
}

const demoProximoCodigo = fam => {
  const pref = (fam && fam.prefixo) || 'SRV';
  const n = (D_CAT||[]).filter(x => x.familia_id === (fam||{}).id)
    .map(x => parseInt(String(x.codigo||'').replace(/^[A-Z]+-/, ''), 10) || 0);
  return pref + '-' + String((n.length ? Math.max.apply(null, n) : 0) + 1).padStart(4, '0');
};

function lerEspecificacoes(){
  const o = {};
  document.querySelectorAll('[data-esp]').forEach(el => {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.dataset.tipo === 'numero') v = el.value === '' ? null : Number(el.value);
    else v = el.value.trim() || null;
    if (v !== null && v !== '' && v !== false) o[el.dataset.esp] = v;
  });
  return o;
}

async function salvarCatalogo(e){
  const desc = document.getElementById('fDesc').value.trim();
  if (!desc){ toast('A descrição é obrigatória.','err'); return; }

  // S34 · item 5: o valor é lido pelo `_numBR`, e valor impossível PARA aqui.
  // `Number('mil')` é NaN, e NaN no JSON vira `null` — o preço sumiria sem
  // uma linha de erro em lugar nenhum.
  let custo, preco;
  try{
    custo = lerCampoDinheiro('fCusto', 'Custo de referência');
    preco = lerCampoDinheiro('fPreco', 'Preço de referência');
  }catch(err){ toast(err.message,'err'); return; }

  // S34 · item 6: fora do padrão avisa e deixa passar — mas com um "sim" no
  // meio, que é a diferença entre escolher e escapar sem perceber
  const cod = (document.getElementById('fCod')||{}).value;
  const codigo = (cod || '').trim().toUpperCase() || null;
  if (codigo && _catCodFora){
    const fam = CAT_FAM.find(f => f.id === (catEdit ? catEdit.familia_id
                                                    : document.getElementById('fFam').value)) || {};
    const ok = await confirmar('Código fora do padrão',
      '<p style="margin-top:0">O código <b>' + esc(codigo) + '</b> não segue o padrão '
      + '<b>' + esc((fam.prefixo||'') + '-0000') + '</b> desta família.</p>'
      + '<p class="nota">Isso é permitido — a numeração automática dos próximos itens '
      + 'ignora o que não bate com o padrão, então a sequência da família não quebra. '
      + 'Só confirme que é mesmo o que você quer.</p>', 'Usar assim mesmo');
    if (!ok) return;
  }

  e.target.disabled = true;
  const p = {
    p_id: catEdit ? catEdit.id : null,
    p_familia_id: catEdit ? catEdit.familia_id : document.getElementById('fFam').value,
    p_descricao: desc,
    p_marca:  document.getElementById('fMarca').value.trim()  || null,
    p_modelo: document.getElementById('fModelo').value.trim() || null,
    p_especificacoes: lerEspecificacoes(),
    p_requer_calibracao: document.getElementById('fCalib').checked,
    p_requer_lacre:      document.getElementById('fLacre').checked,
    p_fornecedor_padrao: document.getElementById('fForn').value.trim() || null,
    p_custo_referencia: custo,
    p_preco_referencia: preco,
    p_observacoes: document.getElementById('fObs').value.trim() || null,
    p_codigo: codigo
  };
  try{
    const r = DEMO ? demoSalvarCat(p) : await rpc('tf_salvar_item_catalogo', p);
    const criou = !catEdit;
    // S39 · a sugestão grava à parte (a função do item não mudou de assinatura)
    const fSug = document.getElementById('fSug');
    const idItem = (catEdit && catEdit.id) || (r && r.id);
    if (!DEMO && fSug && idItem){
      const modo = fSug.value || null;
      const tipos = [...document.querySelectorAll('#fSugTipos input:checked')].map(x => x.value);
      const antes = catEdit ? (catEdit.sugestao_modo || null) : null;
      const tiposAntes = catEdit ? (catEdit.sugestao_tipos || []).slice().sort().join(',') : '';
      if (modo !== antes || (modo === 'por_tipo' && tipos.slice().sort().join(',') !== tiposAntes)){
        try{ await rpc('tf_salvar_sugestao_catalogo', { p_id: idItem, p_modo: modo, p_tipos: tipos }); }
        catch(err){ toast('Item salvo, mas a sugestão não: ' + err.message, 'err'); }
      }
    }
    toast(catEdit ? 'Item atualizado.' : 'Item ' + (r.codigo||'') + ' adicionado.', 'ok');
    catEdit = null;
    await listarCatalogo();
    // Item novo volta ABERTO, não para um formulário em branco: é onde está o
    // campo de foto, e mandar a pessoa achar o item na lista sem avisar era o
    // caminho morto que a revisão pegou.
    if (criou && r && r.id){
      const novo = await get('v_catalogo?select=*&id=eq.' + r.id + '&limit=1').catch(() => []);
      if (novo && novo[0]) return formCatalogo(novo[0]);
    }
    formCatalogo(null);
  }catch(err){ toast(err.message,'err'); e.target.disabled = false; }
}

async function arquivarCatalogo(item){
  try{
    if (DEMO) demoArquivarCat(item); 
    else await rpc('tf_arquivar', { p_tabela:'catalogo_itens', p_id:item.id, p_ativo: !item.ativo });
    toast(item.ativo ? 'Item arquivado — sai da lista do campo.' : 'Item reativado.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function excluirCatalogo(item){
  if (!confirm('Excluir "' + item.descricao + '" do catálogo?\n\nIsso é definitivo. '
      + 'Se o item já foi usado em alguma OS, o sistema vai recusar e sugerir arquivar.')) return;
  try{
    const r = DEMO ? demoExcluirCat(item) : await rpc('tf_excluir_item_catalogo', { p_id: item.id });
    if (r && r.status === 'recusado'){ toast(r.mensagem, 'err'); return; }
    toast('Item excluído.', 'ok');
    catEdit = null; await listarCatalogo(); formCatalogo(null);
  }catch(err){ toast(err.message,'err'); }
}

async function pintarDuplicados(){
  visao = 'dup';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="painel" style="max-width:1040px">'
    + '<h3>Cadastros repetidos <span class="conta" id="dupConta"></span></h3>'
    + '<div id="vaziosCx"></div>'
    + '<div id="dupCorpo"><p class="nota">Procurando…</p></div></div>';

  if (DEMO){
    document.getElementById('dupCorpo').innerHTML =
      '<p class="nota">A revisão de duplicados lê o banco. No modo de '
      + 'demonstração não há base de clientes para varrer.</p>';
    return;
  }

  // A lista dos vazios é INDEPENDENTE da dos repetidos: um cadastro vazio com
  // nome único não entra em grupo nenhum e mesmo assim é lixo. Se uma falhar, a
  // outra continua desenhando.
  get('v_clientes_vazios?select=*&order=created_at&limit=500')
    .then(v => { VAZIOS = v || []; desenharVazios(); })
    .catch(e => { VAZIOS = null; desenharVazios(e.message); });

  try{
    DUPS = await get('v_clientes_duplicados?select=*&order=registros.desc,chave');
  }catch(e){
    // Lista vazia por erro nunca pode ser desenhada como "está tudo limpo":
    // seria a tela dizendo que a faxina acabou quando ela nem começou.
    document.getElementById('dupCorpo').innerHTML =
      '<div class="aviso"><b>Não deu para varrer o cadastro.</b><p class="mt"></p></div>'
      + '<button class="btn" id="dupRetry">Tentar de novo</button>';
    document.querySelector('#dupCorpo .mt').textContent =
      e.message + ' — isto NÃO quer dizer que não há repetidos.';
    document.getElementById('dupRetry').addEventListener('click', pintarDuplicados);
    return;
  }
  // a busca da tela filtra as DUAS listas — a dos vazios e a dos grupos
  REPINTA.dup = () => { desenharVazios(); desenharDuplicados(); };
  desenharDuplicados();
}

function desenharVazios(erro){

  if (erro){
    cx.innerHTML = '<div class="aviso" style="margin-bottom:14px"><b>Não deu para '
      + 'listar os cadastros vazios.</b><p class="mtv"></p></div>';
    cx.querySelector('.mtv').textContent = erro + ' — isto NÃO quer dizer que não há.';
    return;
  }
  if (!VAZIOS || !VAZIOS.length){
    cx.innerHTML = '';
    contador('nVaz', '');
    return;
  }
  contador('nVaz', VAZIOS.length);

  if (!vaziosAberto){
    cx.innerHTML = '<div class="aviso" style="margin-bottom:14px">'
      + '<b>' + VAZIOS.length + ' cadastro(s) sem nada dentro.</b> '
      + 'Sem CNPJ, endereço, contato, equipamento, negócio ou OS — o rastro de '
      + 'um "Adicionar cliente" que não foi concluído.'
      + '<div style="margin-top:10px"><button class="btn" type="button" id="vzAbrir">'
      + 'Ver a lista</button></div></div>';
    document.getElementById('vzAbrir').addEventListener('click', () => {
      vaziosAberto = true; desenharVazios();
    });
    return;
  }

  const q = BUSCA.dup || '';
  const lista = !q ? VAZIOS : VAZIOS.filter(v => casa(v.razao_social + ' ' + (v.nome_fantasia||'') + ' ' + (v.cidade||''), q));
  const marcados = VAZIOS.filter(v => VAZIOS_MARCADOS.has(v.id)).length;
  // S101 · excluir em lote é do admin (`tf_is_admin()` na função): para os
  // outros a lista é só de leitura — sem caixinha e sem botão que o banco recusa.
  if (!(DEMO || sessao.admin)){
    cx.innerHTML =
        '<div class="dupGrupo" style="margin-bottom:16px">'
      + '<h4>Cadastros vazios <span class="selo seguro">' + VAZIOS.length + '</span></h4>'
      + '<p class="sub">Só leitura: a exclusão destes cadastros é do administrador.</p>'
      + '<div style="max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:6px">'
      + '<table class="dupTab"><thead><tr><th>Cadastro</th>'
      +   '<th>Cidade</th><th class="num">Criado há</th></tr></thead><tbody>'
      + lista.map(v => '<tr><td>' + esc(nomeCliente(v)) + '</td><td>' + esc(v.cidade || '—') + '</td>'
        + '<td class="num">' + (v.dias != null ? v.dias + ' d' : '—') + '</td></tr>').join('')
      + '</tbody></table></div>'
      + '<div class="dupAcoes"><button class="btn" type="button" id="vzFechar">Fechar a lista</button></div></div>';
    document.getElementById('vzFechar').addEventListener('click', () => {
      vaziosAberto = false; desenharVazios();
    });
    return;
  }

  cx.innerHTML =
      '<div class="dupGrupo" style="margin-bottom:16px">'
    + '<h4>Cadastros vazios <span class="selo seguro">' + VAZIOS.length + '</span></h4>'
    + '<p class="sub">Marque o que pode sair. A exclusão confere cada um no banco '
    + 'de novo — quem tiver ganhado histórico desde que esta lista foi montada é '
    + 'recusado, não apagado.</p>'
    + '<div style="max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:6px">'
    + '<table class="dupTab"><thead><tr><th style="width:34px"></th><th>Cadastro</th>'
    +   '<th>Cidade</th><th class="num">Criado há</th></tr></thead><tbody>'
    + lista.map(v =>
        '<tr><td><input type="checkbox" data-vz="' + esc(v.id) + '"'
      + (VAZIOS_MARCADOS.has(v.id) ? ' checked' : '') + '></td>'
      + '<td>' + esc(nomeCliente(v)) + '</td><td>' + esc(v.cidade || '—') + '</td>'
      + '<td class="num">' + (v.dias != null ? v.dias + ' d' : '—') + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="dupAcoes">'
    +   '<button class="btn" type="button" id="vzTodos">Marcar os ' + lista.length + ' da lista</button>'
    +   '<button class="btn" type="button" id="vzNenhum">Desmarcar</button>'
    +   '<button class="btn' + (marcados ? ' pri' : '') + '" type="button" id="vzExcluir"'
    +     (marcados ? '' : ' disabled') + '>Excluir os ' + marcados + ' marcados</button>'
    +   '<button class="btn" type="button" id="vzFechar">Fechar a lista</button>'
    + '</div></div>';

  cx.querySelectorAll('[data-vz]').forEach(b => b.addEventListener('change', () => {
    if (b.checked) VAZIOS_MARCADOS.add(b.dataset.vz); else VAZIOS_MARCADOS.delete(b.dataset.vz);
    desenharVazios();
  }));
  document.getElementById('vzTodos').addEventListener('click', () => {
    lista.forEach(v => VAZIOS_MARCADOS.add(v.id)); desenharVazios();
  });
  document.getElementById('vzNenhum').addEventListener('click', () => {
    VAZIOS_MARCADOS.clear(); desenharVazios();
  });
  document.getElementById('vzFechar').addEventListener('click', () => {
    vaziosAberto = false; desenharVazios();
  });
  const bx = document.getElementById('vzExcluir');
  if (bx && marcados) bx.addEventListener('click', () => excluirVazios());

function excluirVazios(){
  const ids = VAZIOS.filter(v => VAZIOS_MARCADOS.has(v.id)).map(v => v.id);
  if (!ids.length) return;
  const nomes = VAZIOS.filter(v => VAZIOS_MARCADOS.has(v.id)).slice(0, 8).map(v => v.razao_social);

  abrirModal('Excluir ' + ids.length + ' cadastro(s)?',
      '<p class="nota" style="margin-top:0">Isto apaga de vez. Cada exclusão fica '
    + 'registrada no livro (quem, quando, o que havia dentro) — mas o cadastro '
    + 'não volta.</p>'
    + '<div class="opcoes" style="max-height:180px;overflow:auto">'
    + nomes.map(n => '<div class="linhaOpc"><span>' + esc(n) + '</span></div>').join('')
    + (ids.length > nomes.length
       ? '<div class="linhaOpc"><span>… e mais ' + (ids.length - nomes.length) + '</span></div>' : '')
    + '</div>',
    [ { label:'Excluir', pri:true, onClick: async function(){
          const b = this;
          try{
            if (DEMO) throw new Error('Modo demonstração: nada é excluído.');
            let ok = 0, nao = [];
            // ⚠ Em lotes de 200, que é o teto da função. Em série, e não em
            //    paralelo: se o terceiro lote falhar, os dois primeiros já
            //    saíram e a tela precisa mostrar o que sobrou.
            for (let i = 0; i < ids.length; i += 200){
              const r = await rpc('tf_excluir_clientes_vazios',
                { p_ids: ids.slice(i, i + 200), p_motivo: 'faxina de cadastros vazios' });
              ok += Number(r.excluidos || 0);
              nao = nao.concat(r.detalhe || []);
            }
            fecharModal();
            VAZIOS_MARCADOS.clear();
            toast(ok + ' cadastro(s) excluído(s)'
              + (nao.length ? ' · ' + nao.length + ' recusado(s)' : '') + '.',
              nao.length ? 'err' : 'ok');
            if (nao.length) console.warn('[faxina] recusados:', nao);
            pintarDuplicados();
          }catch(e){ toast(e.message,'err'); if (b) b.disabled = false; }
        } },
      { label:'Cancelar', onClick: () => fecharModal() } ]);
}

const dupPendente = g => !g.dispensado && g.classe !== 'filial';

let dupArqAberto = false;

const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);

function desenharDuplicados(){
  const corpo = document.getElementById('dupCorpo');
  if (!corpo) return;                      // trocou de tela durante a carga
  const q = BUSCA.dup || '';
  const casaG = g => casa(
    (g.registros_json || []).map(r => r.razao_social + ' ' + (r.nome_fantasia || '') + ' ' + (r.cnpj || '')).join(' '), q);
  const pend = DUPS.filter(dupPendente), arq = DUPS.filter(g => !dupPendente(g));
  const pendL = q ? pend.filter(casaG) : pend, arqL = q ? arq.filter(casaG) : arq;

  contador('nDup', pend.length);
  const cab = document.getElementById('dupConta');
  if (cab) cab.textContent = q
    ? pendL.length + ' de ' + plural(pend.length, 'pendente', 'pendentes') + ' · '
      + arqL.length + ' de ' + plural(arq.length, 'arquivado', 'arquivados')
    : plural(pend.length, 'pendente', 'pendentes') + ' · ' + plural(arq.length, 'arquivado', 'arquivados');

  if (!DUPS.length){
    corpo.innerHTML = '<p class="nota">Nenhum nome repetido no cadastro. '
      + 'O aviso na hora de cadastrar é o que mantém assim.</p>';
    return;
  }

  // O resumo por classe fica no topo porque é ele que diz onde começar: os
  // grupos `seguro` são a faxina de meia hora, o resto é decisão. S101: conta
  // só os PENDENTES — o que já foi decidido não é "onde começar".
  const conta = c => pend.filter(g => g.classe === c).length;
  const resumo = ['seguro','raizes_divergentes','doc_nao_confiavel']
    .filter(c => conta(c))
    .map(c => '<div class="parecidoLinha" style="cursor:default">'
         + '<span class="selo ' + DUP_CLASSE[c].selo + '">' + conta(c) + ' · '
         + esc(DUP_CLASSE[c].rot) + '</span>'
         + '<span class="pd" style="flex:1">' + esc(DUP_CLASSE[c].txt) + '</span></div>')
    .join('');

  const abrirArq = q ? arqL.length > 0 : dupArqAberto;
  corpo.innerHTML =
      (!pend.length
        ? '<p class="nota" id="dupNenhum">Nenhum duplicado pendente.</p>'
        : !pendL.length
          ? '<p class="nota" id="dupNenhum">Nenhum pendente casa com essa busca.</p>'
          : '<div class="parecidos" style="margin-bottom:14px">' + resumo + '</div>')
    + '<div id="dupGrupos"></div>'
    + (!arq.length ? ''
        : '<details class="dupArq" id="dupArq"' + (abrirArq ? ' open' : '') + '>'
          + '<summary>Já revisados (' + (q ? arqL.length + ' de ' + arq.length : arq.length) + ')</summary>'
          + '<p class="sub">Os grupos marcados como “não é duplicado” e as filiais da mesma '
          + 'empresa (estabelecimentos distintos, que não se mesclam). Ficam aqui para consulta; '
          + '“Voltar a revisar” devolve um grupo marcado aos pendentes.</p>'
          + '<div id="dupArqGrupos">' + (q && !arqL.length
              ? '<p class="nota">Nenhum revisado casa com essa busca.</p>' : '') + '</div>'
          + '</details>');

  const alvo = document.getElementById('dupGrupos');
  pendL.forEach(g => alvo.appendChild(cartaoDuplicado(g)));
  const alvoArq = document.getElementById('dupArqGrupos');
  if (alvoArq) arqL.forEach(g => alvoArq.appendChild(cartaoDuplicado(g)));
  const det = document.getElementById('dupArq');
  if (det) det.addEventListener('toggle', () => { if (!(BUSCA.dup || '')) dupArqAberto = det.open; });
}

function cartaoDuplicado(g){
  const meta = DUP_CLASSE[g.classe] || { selo:'risco', rot:g.classe, txt:'' };
  const regs = g.registros_json || [];
  const el = document.createElement('div');
  el.className = 'dupGrupo';

  const linha = r =>
      '<tr' + (r.vazio ? ' class="vazio"' : '') + '>'
    + '<td><b>' + esc(r.razao_social) + '</b>'
    +   (r.nome_fantasia ? ' <small style="color:var(--ink-3)">(' + esc(r.nome_fantasia) + ')</small>' : '')
    +   (r.vazio ? ' <span class="chip">cadastro vazio</span>' : '')
    +   (r.doc_suspeito ? ' <span class="selo grave">CNPJ suspeito</span>' : '') + '</td>'
    + '<td class="num">' + esc(r.cnpj || '—') + '</td>'
    + '<td>' + esc(r.cidade || '—') + '</td>'
    + '<td class="num">' + r.contatos + '</td>'
    + '<td class="num">' + r.equipamentos + '</td>'
    + '<td class="num">' + (r.negocios + r.oss + r.propostas) + '</td>'
    + '<td><button class="btn mini" data-abrir="' + esc(r.id) + '" '
    +     'data-nome="' + esc(r.razao_social) + '" type="button">Abrir</button></td>'
    + '</tr>';

  el.innerHTML =
      '<h4>' + esc(regs.length ? regs[0].razao_social : g.chave)
    +   ' <span class="selo ' + meta.selo + '">' + esc(meta.rot) + '</span>'
    +   (g.dispensado ? ' <span class="chip">já revisado</span>' : '') + '</h4>'
    + '<p class="sub">' + g.registros + ' cadastros · ' + esc(meta.txt) + '</p>'
    + (g.dispensado && g.dispensado_motivo
        ? '<p class="dupMotivo">Motivo da revisão: ' + esc(g.dispensado_motivo) + '</p>' : '')
    + '<div style="overflow-x:auto"><table class="dupTab"><thead><tr>'
    +   '<th>Cadastro</th><th>CNPJ</th><th>Cidade</th>'
    +   '<th>Cont.</th><th>Equip.</th><th>Histórico</th><th></th>'
    + '</tr></thead><tbody>' + regs.map(linha).join('') + '</tbody></table></div>'
    // S101 · mesclar, "Não é duplicado" e "Voltar a revisar" são do escritório
    // (`tf_pode_escritorio()` nas três funções): quem é de campo não vê os
    // botões. "Voltar a revisar" vale também na filial revisada (Bruno, 27/10);
    // a filial que ninguém marcou continua sem botão.
    + (!podeEscritorio() ? ''
      : '<div class="dupAcoes">'
      +   (g.classe === 'filial' ? ''
          : '<button class="btn' + (g.classe === 'seguro' && !g.dispensado ? ' pri' : '') + '" '
            + 'data-mesclar="1" type="button">Mesclar…</button>')
      +   (g.dispensado
          ? '<button class="btn" data-reabrir="1" type="button">Voltar a revisar</button>'
          : g.classe === 'filial' ? ''
          : '<button class="btn" data-dispensar="1" type="button">Não é duplicado</button>')
      + '</div>');

  el.querySelectorAll('[data-abrir]').forEach(b =>
    b.addEventListener('click', async () => {
      cadSel = b.dataset.abrir;
      await irPara('cad');
      const cx = document.getElementById('tbBusca');
      if (cx){ BUSCA.cad = b.dataset.nome; cx.value = b.dataset.nome;
               if (REPINTA.cad) REPINTA.cad(); }
      const l = document.querySelector('[data-cli="' + b.dataset.abrir + '"]');
      if (l) l.click();
    }));

  const bM = el.querySelector('[data-mesclar]');
  if (bM) bM.addEventListener('click', () => modalMesclar(g));

  const bD = el.querySelector('[data-dispensar]');
  if (bD) bD.addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const motivo = prompt('Por que este grupo não é duplicado?\n'
        + '(fica registrado, para ninguém revisar de novo)') || '';
      try{
        await rpc('tf_marcar_nao_duplicado', { p_chave: g.chave, p_motivo: motivo });
        toast('Grupo marcado como revisado.','ok');
        pintarDuplicados();
      }catch(e){ toast(e.message,'err'); }
    });
  });

  const bR = el.querySelector('[data-reabrir]');
  if (bR) bR.addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      try{
        await rpc('tf_desmarcar_nao_duplicado', { p_chave: g.chave });
        pintarDuplicados();
      }catch(e){ toast(e.message,'err'); }
    });
  });

  return el;
}

function modalMesclar(g){
  const regs = g.registros_json || [];
  const seguro = g.classe === 'seguro';
  const opc = regs.map((r,i) =>
      '<label class="linhaOpc"><input type="radio" name="mSobrev" value="' + esc(r.id) + '"'
    + (seguro && i === 0 ? ' checked' : '') + '> '
    + '<span><b>' + esc(r.razao_social) + '</b> — ' + esc(r.cnpj || 'sem CNPJ')
    + (r.cidade ? ' · ' + esc(r.cidade) : '')
    + '<br><small style="color:var(--ink-3)">' + r.contatos + ' contato(s) · '
    + r.equipamentos + ' equipamento(s) · '
    + (r.negocios + r.oss + r.propostas) + ' no histórico'
    + (r.doc_suspeito ? ' · ⚠ CNPJ que aparece sob outro nome' : '')
    + '</small></span></label>').join('');

  abrirModal('Qual cadastro fica?',
      '<p class="nota" style="margin-top:0">Os outros viram sombra: saem das listas, '
    + 'entregam contatos, equipamentos, negócios e OS ao escolhido, e continuam '
    + 'existindo com a seta apontando para cá. Nada é apagado.</p>'
    + (seguro ? '' :
       '<div class="aviso" style="margin-bottom:10px"><b>' + esc(DUP_CLASSE[g.classe].rot)
       + '.</b> ' + esc(DUP_CLASSE[g.classe].txt)
       + ' Confira o CNPJ do escolhido na ficha depois de mesclar.</div>')
    + '<div class="opcoes">' + opc + '</div>',
    [ { label:'Mesclar', pri:true, onClick: async () => {
          const sel = document.querySelector('input[name="mSobrev"]:checked');
          if (!sel){ toast('Escolha qual cadastro fica.','err'); return; }
          const fica = sel.value;
          const saem = regs.filter(r => r.id !== fica);
          try{
            // Um a um, e em série: se o terceiro falhar, os dois primeiros já
            // migraram e a tela mostra o que sobrou — melhor que um lote que
            // volta atrás pela metade sem ninguém saber quais foram.
            for (const r of saem){
              await rpc('tf_mesclar_cliente',
                { p_sobrevivente: fica, p_perdedor: r.id, p_motivo: 'cadastro repetido' });
            }
            fecharModal();
            toast(saem.length + ' cadastro(s) mesclado(s).','ok');
            pintarDuplicados();
          }catch(e){ toast(e.message,'err'); }
        } },
      { label:'Cancelar', onClick: () => fecharModal() } ]);
}

async function criarCliente(nome, cnpj, botao, fantasia){
  try{
    // passa por tf_salvar_cliente e não por um POST: é a mesma função que a
    // ficha usa, com a mesma checagem de CNPJ repetido. Dois caminhos de
    // gravação para o mesmo registro é como duas telas passam a discordar.
    let novo = null;
    if (DEMO) demoAddCliente(nome, cnpj);
    else novo = await rpc('tf_salvar_cliente', { p_id:null, p_razao_social:nome, p_cnpj:cnpj,
                                                 p_nome_fantasia: fantasia || null });
    toast('Cliente cadastrado. Complete o endereço ao lado.','ok');
    if (novo && novo.id) cadSel = novo.id;
    pintarCadastros();
  }catch(err){
    toast(/duplicate|unique|ux_clientes/i.test(err.message)
      ? 'Já existe um cliente com esse CNPJ.' : err.message, 'err');
    if (botao) botao.disabled = false;
  }
}

function avisarParecidos(nome, cnpj, lista, fantasia){
  const rot = { mesmo:'mesmo cliente', muito_parecido:'muito parecido', parecido:'parecido' };
  const linhas = lista.map(c =>
      '<button class="btn parecidoLinha" data-id="' + esc(c.id) + '" '
    +   'data-nome="' + esc(c.razao_social) + '" type="button">'
    +   '<span class="pn">' + esc(nomeCliente(c)) + '</span>'
    +   '<span class="pd">' + esc(c.cnpj || 'sem CNPJ')
    +     (c.cidade ? ' · ' + esc(c.cidade) : '') + '</span>'
    +   '<span class="chip">' + esc(rot[c.forca] || c.forca)
    +     (c.parece_filial ? ' · outra filial' : '') + '</span>'
    + '</button>').join('');

  abrirModal('Já existe cliente parecido',
      '<p class="nota" style="margin-top:0">Antes de criar <b>' + esc(nome) + '</b>, '
    + 'confira se não é um destes. Reaproveitar o cadastro mantém contatos, '
    + 'equipamentos e histórico no mesmo lugar.</p>'
    + '<div class="parecidos">' + linhas + '</div>'
    + '<p class="nota">Se for outra empresa — ou outra filial, que tem CNPJ, '
    + 'endereço e vasos próprios —, cadastrar de novo é o certo.</p>',
    [ { label:'Cadastrar mesmo assim', onClick: () => {
          fecharModal(); criarCliente(nome, cnpj, document.getElementById('cAdd'), fantasia); } },
      { label:'Cancelar', pri:true, onClick: () => fecharModal() } ]);

  document.querySelectorAll('.parecidoLinha').forEach(b => {
    b.addEventListener('click', async () => {
      fecharModal();
      cadSel = b.dataset.id;
      await pintarCadastros();
      // Com 516 clientes a lista corta em 120: o escolhido pode não estar
      // desenhado. Buscar pelo nome primeiro é o que garante que ele apareça.
      const cx = document.getElementById('tbBusca');
      if (cx){ BUSCA.cad = b.dataset.nome || ''; cx.value = BUSCA.cad;
               if (REPINTA.cad) REPINTA.cad(); }
      const alvo = document.querySelector('[data-cli="' + b.dataset.id + '"]');
      if (alvo) alvo.click();
      else toast('Cliente aberto na lista — use a busca para achá-lo.','ok');
    });
  });
}

async function pintarCadastros(){
  visao = 'cad';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="cadWrap">'
    + '<div class="painel"><h3>Clientes <span class="conta" id="cadConta"></span></h3>'
    +   '<div id="cadForm"></div><div class="lista" id="cadLista"></div></div>'
    + '<div class="painel" id="cadDet"><p style="color:var(--ink-3);font-size:13.5px;margin:0">'
    + 'Escolha um cliente à esquerda para ver contatos e equipamentos.</p></div></div>';

  document.getElementById('cadForm').innerHTML =
    '<div class="campo"><label for="cN">Razão social</label><input id="cN" type="text" autocomplete="off" name="cn_nofill"></div>' +
    '<div class="dupla"><div class="campo"><label for="cF">Nome fantasia</label><input id="cF" type="text" placeholder="opcional" autocomplete="off" name="cf_nofill"></div>' +
    '<div class="campo"><label for="cC">CNPJ</label><input id="cC" type="text" placeholder="opcional" autocomplete="off" name="cc_nofill"></div></div>' +
    '<button class="btn pri" id="cAdd" style="width:100%;padding:9px;margin-bottom:10px">Adicionar cliente</button>' +
    // ITEM 2 (S32): sem esta caixinha, arquivar seria porta de mão única — a
    // lista pede `ativo=eq.true` e o cliente arquivado sumiria com a ficha
    // junto, sem caminho de volta para o "Reativar".
    '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="cArq"' +
    (_cadArquivados ? ' checked' : '') + '> mostrar os arquivados</label>';

  // S101 · CADASTROS abre para todos; gravar cliente continua do escritório
  // (RLS `tf_pode_escritorio()`). Para quem é de campo, no lugar do formulário
  // de novo cliente, o aviso — e a caixinha dos arquivados, que só filtra.
  if (!podeEscritorio()){
    const f = document.getElementById('cadForm');
    f.innerHTML = '<div class="aviso" style="margin-bottom:12px">Só leitura: o cadastro de '
      + 'clientes é do escritório. Seu perfil executa em campo — o banco não aceitaria a gravação.</div>'
      + '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="cArq"'
      + (_cadArquivados ? ' checked' : '') + '> mostrar os arquivados</label>';
  }
  const cAdd = document.getElementById('cAdd');
  if (cAdd) cAdd.addEventListener('click', async (e) => {
    const nome = document.getElementById('cN').value.trim();
    if (!nome){ toast('Informe a razão social do cliente.','err'); return; }
    const cnpj = document.getElementById('cC').value.trim() || null;
    const fantasia = document.getElementById('cF').value.trim() || null;
    e.target.disabled = true;

    // ── o aviso de parecido, ANTES de gravar ──────────────────────────────
    // É o que impede o cadastro repetido de nascer, e por isso ele NUNCA
    // bloqueia: mostra quem já existe, oferece abrir a ficha, e deixa cadastrar
    // assim mesmo — porque às vezes é mesmo outra empresa ou outra filial.
    // Falha na consulta não pode travar o cadastro: quem não conseguiu avisar
    // segue em frente em silêncio, e a pessoa cadastra como cadastrava antes.
    let parecidos = [];
    if (!DEMO){
      try{ parecidos = await rpc('tf_clientes_semelhantes',
             { p_razao_social: nome, p_cnpj: cnpj, p_excluir: null }) || []; }
      catch(err){ parecidos = []; }
      // o apelido também é conferido: "Ergolife" já pode estar na base com a
      // razão social da Adequar
      if (!parecidos.length && fantasia){
        try{ parecidos = await rpc('tf_clientes_semelhantes',
               { p_razao_social: fantasia, p_cnpj: cnpj, p_excluir: null }) || []; }
        catch(err){ parecidos = []; }
      }
    }
    if (parecidos.length){
      e.target.disabled = false;
      return avisarParecidos(nome, cnpj, parecidos, fantasia);
    }
    criarCliente(nome, cnpj, e.target, fantasia);
  });

  const cArq = document.getElementById('cArq');
  if (cArq) cArq.addEventListener('change', () => {
    _cadArquivados = cArq.checked; cadSel = null; pintarCadastros();
  });

  let todos = [];
  try{ todos = DEMO ? demoClientes()
      : await get('clientes?select=id,razao_social,nome_fantasia,cnpj,cidade,endereco,localizacao,tem_logo,observacoes,ativo,'
                  + 'contatos(count),equipamentos(count)'
                  + (_cadArquivados ? '' : '&ativo=eq.true')
                  + '&order=razao_social&limit=2000'); }
  catch(e){
    // sem `return`, seguia com a lista vazia e escrevia "Nenhum cliente ainda"
    // em cima de uma falha de rede — com 516 clientes cadastrados
    const l = document.getElementById('cadLista');
    if (l){ l.innerHTML = '<div class="vazio2" style="padding:22px 8px;text-align:left">'
      + '<b>Não deu para carregar os clientes</b><p class="mt"></p>'
      + '<button class="btn" id="cadRetry" style="margin-top:12px">Tentar de novo</button></div>';
      l.querySelector('.mt').textContent = e.message;
      document.getElementById('cadRetry').addEventListener('click', pintarCadastros);
    }
    toast(e.message,'err');
    return;
  }

  // Com 516 clientes importados, listar todos era rolar por dois minutos até
  // achar um. A busca é o caminho normal aqui, não o atalho.
  REPINTA.cad = () => desenharClientes(todos);
  desenharClientes(todos);
}

function desenharClientes(todos){
  const lista = document.getElementById('cadLista');
  if (!lista) return;              // trocou de tela durante o carregamento
  const q = BUSCA.cad || '';
  const cli = !q ? todos : todos.filter(c => casa(
    [c.razao_social, c.nome_fantasia, c.cnpj, c.cidade, c.observacoes].join(' '), q));

  lista.innerHTML = '';
  const cab = document.getElementById('cadConta');
  if (cab) cab.textContent = q
    ? cli.length + ' de ' + todos.length + ' clientes'
    : todos.length + ' cliente(s)';

  if (!cli.length){
    lista.innerHTML = q
      ? '<div class="vazio2" style="padding:24px 10px"><b>Nada com essa busca</b>'
        + '<p>Nenhum dos ' + todos.length + ' clientes casa com o que você digitou.</p></div>'
      : '<p style="font-size:13px;color:var(--ink-3)">Nenhum cliente ainda.</p>';
    return;
  }

  // O corte é declarado, não escondido: dizer "há mais" é o que faz a pessoa
  // buscar em vez de concluir que o cliente sumiu.
  const CORTE = 120;
  const mostrar = cli.slice(0, CORTE);
  mostrar.forEach(c => {
    const b = document.createElement('button');
    b.className = 'linhaCli' + (cadSel === c.id ? ' on' : '') + (c.ativo === false ? ' off' : '');
    b.dataset.cli = c.id;      // o aviso de parecido e a tela de Duplicados
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = c.razao_social
      + (c.ativo === false ? '  (arquivado)' : '');
    const nc = (c.contatos && c.contatos[0] ? c.contatos[0].count : (c._contatos||0));
    const ne = (c.equipamentos && c.equipamentos[0] ? c.equipamentos[0].count : (c._equip||0));
    // "sem endereço" aparece na lista de propósito: dado que falta e não
    // aparece em lugar nenhum é dado que nunca vai ser preenchido.
    b.querySelector('small').textContent =
      (c.nome_fantasia ? c.nome_fantasia + ' · ' : '')
      + (c.cnpj ? c.cnpj + ' · ' : '') + nc + ' contato(s) · ' + ne + ' equipamento(s)'
      + (c.endereco ? '' : ' · sem endereço');
    if (c.observacoes && /incompleto/i.test(c.observacoes)) b.classList.add('incompleto');
    if (!c.endereco) b.classList.add('incompleto');
    b.addEventListener('click', () => { cadSel = c.id; pintarCadastros(); detalheCliente(c); });
    lista.appendChild(b);
  });
  if (cli.length > CORTE){
    const p2 = document.createElement('p');
    p2.style.cssText = 'font-size:12px;color:var(--ink-3);padding:9px 2px;margin:0';
    p2.textContent = 'Mostrando os ' + CORTE + ' primeiros de ' + cli.length
      + '. Use a busca do topo para achar o resto.';
    lista.appendChild(p2);
  }
  const sel = cli.find(c => c.id === cadSel);
  if (sel) detalheCliente(sel);
}

async function detalheCliente(c){
  const d = document.getElementById('cadDet');
  d.innerHTML = '<h3></h3><p style="color:var(--ink-3);font-size:13px">Carregando…</p>';
  d.querySelector('h3').textContent = c.razao_social;

  let cli = c, contatos = [], equips = [];
  try{
    if (DEMO){ contatos = demoContatos(c.id); equips = demoEquips(c.id); }
    else {
      const [f, ct, eq] = await Promise.all([
        get('clientes?select=*&id=eq.' + c.id),
        get('contatos?select=id,nome,email,telefone,cargo,papeis&cliente_id=eq.' + c.id
            + '&ativo=eq.true&order=nome'),
        get('equipamentos?select=id,tag,tipo,localizacao,pmta,nome,venc_insp_interna,'
            + 'venc_insp_externa,venc_calib_manometro,venc_calib_valvula,tapweb_em,'
            + 'tapweb_desativado_em&cliente_id=eq.' + c.id + '&ativo=eq.true&order=tag')
      ]);
      cli = (f && f[0]) || c; contatos = ct; equips = eq;
    }
  }catch(e){
    d.innerHTML = '<h3></h3><div class="aviso"><b>Não deu para carregar este cliente.</b><br>'
      + esc(e.message) + '</div><button class="btn" id="clRetry">Tentar de novo</button>';
    d.querySelector('h3').textContent = c.razao_social;
    document.getElementById('clRetry').addEventListener('click', () => detalheCliente(c));
    return;
  }

  const cp = (id, rot, val, ph, tipo) =>
    '<div class="campo"><label for="' + id + '">' + rot + '</label>'
    + '<input id="' + id + '" type="' + (tipo||'text') + '" value="' + esc(val||'') + '"'
    + ' autocomplete="off" name="' + id + '_nofill"'
    + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>';

  d.innerHTML =
      '<div class="fichaTopo">'
    +   '<div class="lado">' + logoHTML(cli.id, cli.razao_social, 'logoFicha')
    +     '<input type="file" id="clLogoF" accept="image/png,image/jpeg,image/webp" hidden>'
    +     '<button class="btn mini" type="button" id="clLogoB">'
    +       (cli.tem_logo ? 'Trocar' : 'Logomarca') + '</button>'
    +     (cli.tem_logo ? '<button class="btn mini" type="button" id="clLogoX">Tirar</button>' : '')
    +   '</div>'
    +   '<div class="campos">'
    +     cp('clNome','Razão social', cli.razao_social)
    // ── ITEM 8 (S31): BUSCAR DADOS DO CNPJ ──────────────────────────────
    // Não é busca automática: o botão é o ato. Digitar o CNPJ e ver a ficha
    // se reescrever sozinha assusta — e às vezes o que está na tela é mais
    // novo que o que está na Receita.
    +     '<div class="dupla">' + cp('clFant','Nome fantasia', cli.nome_fantasia, 'como é conhecido — opcional')
    +     '<div class="cnpjLinha">' + cp('clCnpj','CNPJ', cli.cnpj, 'opcional')
    +       '<button class="btn" type="button" id="clCnpjB" '
    +       'title="Consulta os dados públicos deste CNPJ e preenche o formulário">'
    +       'Buscar dados do CNPJ</button></div></div>'
    +     '<div id="clCnpjMsg"></div>'
    +   '</div>'
    + '</div>'
    + '<div class="secTit" style="margin-top:0">Onde fica</div>'
    + cp('clEnd','Endereço', cli.endereco, 'Rua e complemento — o que vai no documento')
    + '<div class="tripla">' + cp('clNum','Número', cli.numero) + cp('clBai','Bairro', cli.bairro)
    +   cp('clCompl','Complemento', cli.complemento, 'sala, galpão, bloco') + '</div>'
    + '<div class="tripla">' + cp('clCid','Cidade', cli.cidade) + cp('clUf','UF', cli.uf)

        ? '<p class="nota">Consultado pelo CNPJ em '
          + esc(new Date(cli.dados_cnpj_em).toLocaleDateString('pt-BR'))

        : '')
    + '<div class="campo"><label for="clObs">Observações</label>'
    + '<textarea id="clObs" rows="2">' + esc(cli.observacoes||'') + '</textarea></div>'

    + '<div id="clContatos"></div><div id="clEquips"></div><div id="clRhExig"></div>'
    // ── ITEM 2 (S32): ARQUIVAR E EXCLUIR ──────────────────────────────────
    // O documento pediu só o "Excluir cliente". Entregar só ele deixaria a
    // tela num beco: `tf_excluir_cliente` RECUSA quem tem OS, negócio ou
    // proposta, e a mensagem da recusa (que vem do banco) manda ARQUIVAR o
    // cliente — um botão que não existia em lugar nenhum. É o mesmo defeito

    + '<hr class="reguaPerigo">'
    + '<div class="linhaBtns">'
    +   (podeEscritorio()
        ? '<button class="btn" type="button" id="clArquivar">'

        // S144 · item 78: ramo de atividade e grau de risco (laudo do TapDoc)

function modalExcluirCliente(cli, contatos, equips){
  const nC = (contatos || []).length, nE = (equips || []).length;
  const junto = [];
  if (nC) junto.push(nC + (nC > 1 ? ' contatos' : ' contato'));
  if (nE) junto.push(nE + (nE > 1 ? ' equipamentos' : ' equipamento'));

  abrirModal('Excluir "' + (cli.razao_social || '') + '"?',
      '<div class="aviso"><b>Isto apaga o cadastro de vez</b>'
    + (junto.length ? ', e leva junto <b>' + esc(junto.join(' e ')) + '</b>' : '')
    + '. Não tem como desfazer.</div>'
    + '<p class="nota">Se o cliente tiver OS, negócio ou proposta, o TapHub vai recusar — '
    + 'nesse caso o caminho é <b>Arquivar</b>, que tira ele das listas e mantém o histórico.</p>'
    + '<div class="campo"><label for="xcMot">Por que está excluindo?</label>'
    + '<input id="xcMot" type="text" autocomplete="off" name="xc_nofill" '
    + 'placeholder="ex.: cadastro repetido, criado por engano"></div>'
    + '<div class="dica" id="xcMsg" style="color:var(--crit)"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Excluir cliente', pri:true, onClick: async () => {
        const msg = document.getElementById('xcMsg');
        const mot = (document.getElementById('xcMot').value || '').trim();
        if (mot.length < 4){ msg.textContent = 'Escreva o motivo — ele fica no livro das exclusões.'; return; }
        try{
          if (DEMO) throw new Error('Modo demonstração: nada é excluído.');
          const r = await rpc('tf_excluir_cliente', { p_id: cli.id, p_motivo: mot });
          if (r && r.status === 'recusado'){
            // a recusa vem explicada pelo banco, e ela manda ARQUIVAR —
            // então o botão de arquivar aparece aqui mesmo, não duas telas atrás
            msg.innerHTML = '';
            const cx = document.createElement('div');
            cx.className = 'aviso';
            cx.textContent = r.mensagem || 'O TapHub recusou a exclusão.';
            const b = document.createElement('button');
            b.className = 'btn'; b.type = 'button';
            b.style.cssText = 'margin-top:10px';
            b.textContent = 'Arquivar em vez de excluir';
            b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
              try{
                await rpc('tf_arquivar', { p_tabela:'clientes', p_id: cli.id, p_ativo: false });
                fecharModal();
                toast('Cliente arquivado — saiu das listas, o histórico ficou.','ok');
                cadSel = null; await pintarCadastros();
              }catch(e){ msg.textContent = e.message; }
            }));
            cx.appendChild(document.createElement('br'));
            cx.appendChild(b);
            msg.appendChild(cx);
            return;
          }
          fecharModal();
          toast('Cliente excluído. O motivo ficou no livro das exclusões.','ok');
          cadSel = null;
          await pintarCadastros();
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

const _CNPJ_URL = 'https://brasilapi.com.br/api/cnpj/v1/';

let _cnpjConsultado = null;

const _soDigitos = v => String(v || '').replace(/\D/g, '');

function _cnpjMapear(j){
  const rua = [j.descricao_tipo_de_logradouro, j.logradouro]
    .filter(x => x && String(x).trim()).join(' ').trim();
  return {
    razao_social: j.razao_social,
    nome_fantasia: j.nome_fantasia,
    endereco: rua || null,
    numero: j.numero,
    complemento: j.complemento,
    bairro: j.bairro,
    cidade: j.municipio,
    uf: j.uf,
    cep: _soDigitos(j.cep).replace(/^(\d{5})(\d{3})$/, '$1-$2') || null,
    situacao_cadastral: j.descricao_situacao_cadastral,
    cnae: j.cnae_fiscal ? String(j.cnae_fiscal) : null,
    cnae_descricao: j.cnae_fiscal_descricao,
    natureza_juridica: j.natureza_juridica,
    data_abertura: j.data_inicio_atividade || null,
    _telefone: j.ddd_telefone_1 || null,
    _email: j.email || null
  };
}

async function buscarDadosCnpj(botao){
  const inp = document.getElementById('clCnpj');
  const msg = document.getElementById('clCnpjMsg');
  const doc = _soDigitos(inp && inp.value);
  const dizer = (html, erro) => {
    if (!msg) return;
    msg.innerHTML = '<div class="cnpjCx' + (erro ? ' erro' : '') + '">' + html + '</div>';
  };
  if (doc.length !== 14){
    dizer('Digite o CNPJ completo (14 números) antes de buscar.', true); return;
  }
  botao.disabled = true;
  const rot = botao.textContent;
  botao.textContent = 'Buscando…';
  dizer('Consultando a Receita…');
  try{
    const r = await fetch(_CNPJ_URL + doc, { headers: { 'Accept': 'application/json' } });
    if (r.status === 404) throw new Error('A Receita não tem esse CNPJ. Confira os números.');
    if (r.status === 429) throw new Error('O serviço de consulta pediu para esperar um pouco. Tente de novo em um minuto.');
    if (!r.ok) throw new Error('O serviço de consulta respondeu ' + r.status + '.');
    const j = await r.json();
    const d = _cnpjMapear(j);

    // preenche o que veio; o que não veio fica como está
    const por = { clNome:'razao_social', clFant:'nome_fantasia', clEnd:'endereco',
                  clNum:'numero', clBai:'bairro', clCompl:'complemento',
                  clCid:'cidade', clUf:'uf', clCep:'cep', clSit:'situacao_cadastral',
                  clCnae:'cnae', clCnaeD:'cnae_descricao', clNat:'natureza_juridica',
                  clAber:'data_abertura' };
    let n = 0;
    Object.keys(por).forEach(id => {
      const v = d[por[id]];
      const el = document.getElementById(id);
      if (el && v != null && String(v).trim() !== ''){ el.value = String(v).trim(); n++; }
    });
    // o CNPJ volta formatado, como no cartão
    if (inp) inp.value = doc.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    _cnpjConsultado = new Date().toISOString();

    const alerta = d.situacao_cadastral && !/ativa/i.test(d.situacao_cadastral)
      ? '<br><b style="color:var(--crit)">Atenção: a situação cadastral é '
        + esc(d.situacao_cadastral) + '.</b> Vale confirmar antes de emitir proposta ou nota.'
      : '';
    const contato = (d._telefone || d._email)
      ? '<br>Veio também ' + [d._telefone ? '<b>' + esc(d._telefone) + '</b>' : null,
                             d._email ? '<b>' + esc(d._email) + '</b>' : null]
          .filter(Boolean).join(' e ')
        + '. Telefone e e-mail moram em <b>Contatos</b>, aqui embaixo, porque pertencem a uma '
        + '<i>pessoa</i> — copie para lá se forem de alguém.'
      : '';
    dizer(n + ' campo(s) preenchido(s) pela consulta. <b>Confira e clique em Salvar cliente</b> — '
      + 'nada foi gravado ainda, e tudo continua editável.' + alerta + contato);
  }catch(e){
    dizer('Não deu para consultar: ' + esc(e.message)
      + '<br>Dá para preencher à mão normalmente — a consulta é um atalho, não um caminho obrigatório.', true);
  }finally{
    botao.disabled = false; botao.textContent = rot;
  }
}

};
