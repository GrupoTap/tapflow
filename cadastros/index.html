const _twNorm = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function _twSerialParaISO(n){
  const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
  if (!isFinite(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

function _twData(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' || /^\d+([.,]\d+)?$/.test(String(v).trim())){
    const n = Number(String(v).replace(',', '.'));
    // 20000 ≈ 1954, 80000 ≈ 2119: fora disso não é data, é outra coisa
    if (n >= 20000 && n <= 80000) return _twSerialParaISO(n);
    return undefined;
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m){
    const a = m[3].length === 2 ? '20' + m[3] : m[3];
    return a + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
  }
  return undefined;
}

const _xmlTexto = t => String(t == null ? '' : t)
  .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
  .replace(/&#(\d+);/g,          (_, d) => String.fromCodePoint(parseInt(d, 10)))
  .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
  .replace(/&amp;/g, '&');

async function _lerXLSX(file){
  const JSZipLib = await carregarJSZip();
  const zip = await JSZipLib.loadAsync(file);

  const textoDe = async nome => {
    const f = zip.file(nome);
    return f ? f.async('string') : null;
  };
  // os textos compartilhados: o .xlsx guarda cada string uma vez e referencia
  const ssXml = await textoDe('xl/sharedStrings.xml');
  const compart = [];
  if (ssXml){
    (ssXml.match(/<si>[\s\S]*?<\/si>/g) || []).forEach(si => {
      compart.push(_xmlTexto((si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [])
        .map(t => t.replace(/<[^>]+>/g, '')).join('')));
    });
  }

  // a PRIMEIRA planilha, pela ordem das relações do workbook — não por
  // "sheet1.xml", que nem sempre é a primeira aba
  const wbXml  = await textoDe('xl/workbook.xml');
  const relXml = await textoDe('xl/_rels/workbook.xml.rels');
  let alvo = 'xl/worksheets/sheet1.xml';
  if (wbXml && relXml){
    const rid = (wbXml.match(/<sheet[^>]*r:id="([^"]+)"/) || [])[1];
    if (rid){
      const re = new RegExp('<Relationship[^>]*Id="' + rid + '"[^>]*Target="([^"]+)"');
      const alvoRel = (relXml.match(re) || [])[1];
      if (alvoRel) alvo = 'xl/' + alvoRel.replace(/^\/?xl\//, '').replace(/^\//, '');
    }
  }
  const wsXml = await textoDe(alvo) || await textoDe('xl/worksheets/sheet1.xml');
  if (!wsXml) throw new Error('Não achei nenhuma planilha dentro do arquivo.');

  const colDe = ref => {
    let n = 0;
    for (const ch of String(ref).replace(/\d+/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };
  const linhas = [];
  (wsXml.match(/<row[\s\S]*?<\/row>|<row[^>]*\/>/g) || []).forEach(row => {
    const cels = [];
    (row.match(/<c[\s\S]*?<\/c>|<c[^>]*\/>/g) || []).forEach(c => {
      const ref = (c.match(/ r="([A-Z]+\d+)"/) || [])[1];
      const tipo = (c.match(/ t="([^"]+)"/) || [])[1];
      let v = null;
      if (tipo === 'inlineStr'){
        v = _xmlTexto((c.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1] || '');
      } else {
        const bruto = (c.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
        if (bruto == null) v = null;
        else if (tipo === 's') v = compart[Number(bruto)] != null ? compart[Number(bruto)] : '';
        else v = /^-?\d+(\.\d+)?$/.test(bruto) ? Number(bruto) : bruto;
      }
      cels[ref ? colDe(ref) : cels.length] = v;
    });
    linhas.push(cels);
  });
  return linhas;
}

function _lerCSV(texto){
  const t = texto.replace(/^﻿/, '');
  // S40: as 10 primeiras linhas, não só a 1ª — planilha com título em cima
  // ("Controle da dívida Proper") não tem separador nenhum na linha 1, e o
  // arquivo inteiro era lido com vírgula
  const prim = t.split(/\r?\n/).slice(0, 10).join('\n');
  const sep = (prim.split(';').length > prim.split(',').length) ? ';' : ',';
  const linhas = [];
  let campo = '', linha = [], aspas = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (aspas){
      if (ch === '"' && t[i+1] === '"'){ campo += '"'; i++; }
      else if (ch === '"') aspas = false;
      else campo += ch;
    } else if (ch === '"') aspas = true;
    else if (ch === sep){ linha.push(campo); campo = ''; }
    else if (ch === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if (ch !== '\r') campo += ch;
  }
  if (campo !== '' || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas;
}

async function lerPlanilhaTapWeb(file){
  const nome = (file.name || '').toLowerCase();
  let linhas;
  if (nome.endsWith('.csv') || nome.endsWith('.txt')){
    linhas = _lerCSV(await file.text());
  } else if (nome.endsWith('.xlsx')){
    linhas = await _lerXLSX(file);
  } else {
    throw new Error('Use o arquivo como o TapWeb exporta: .xlsx ou .csv. '
                  + '(.xls antigo não abre aqui — salve como .xlsx no Excel.)');
  }

  // o cabeçalho pode não estar na primeira linha: o relatório do TapWeb às
  // vezes sai com título e uma linha em branco antes
  let iCab = -1, mapa = null;
  for (let i = 0; i < Math.min(linhas.length, 12); i++){
    const m = {};
    (linhas[i] || []).forEach((cel, j) => {
      const n = _twNorm(cel);
      if (!n) return;
      for (const chave of Object.keys(TW_COLUNAS)){
        if (m[chave] == null && TW_COLUNAS[chave].includes(n)) m[chave] = j;
      }
    });
    if (m.tag != null){ iCab = i; mapa = m; break; }
  }
  if (iCab < 0){
    throw new Error('Não achei a coluna "Tag" na planilha. É ela que casa cada linha '
                  + 'com o equipamento do cadastro — sem ela não dá para importar.');
  }
  const faltando = ['interna','externa','manometro','valvula']
    .filter(k => mapa[k] == null)
    .map(k => ({ interna:'Inspeção Interna', externa:'Inspeção Externa',
                 manometro:'Calibração Manômetro', valvula:'Calibração Válvula' })[k]);
  if (faltando.length === 4){
    throw new Error('A planilha tem a Tag, mas nenhuma das quatro colunas de vencimento '
                  + '(Inspeção Interna, Inspeção Externa, Calibração Manômetro, '
                  + 'Calibração Válvula). É outro relatório do TapWeb?');
  }

  const itens = [], problemas = [];
  for (let i = iCab + 1; i < linhas.length; i++){
    const l = linhas[i] || [];
    const tag = String(l[mapa.tag] == null ? '' : l[mapa.tag]).trim();
    if (!tag) continue;
    const it = { tag };
    if (mapa.nome != null){
      const nm = String(l[mapa.nome] == null ? '' : l[mapa.nome]).trim();
      if (nm) it.nome = nm;
    }
    TW_DATAS.forEach(k => {
      if (mapa[k] == null) return;
      const d = _twData(l[mapa[k]]);
      if (d === undefined){
        problemas.push('Linha ' + (i + 1) + ' (' + tag + '): não entendi a data "'
                     + l[mapa[k]] + '".');
      } else if (d) it[k] = d;
    });
    itens.push(it);
  }
  if (!itens.length){
    throw new Error('A planilha foi lida, mas nenhuma linha tem TAG preenchida.');
  }
  return { itens, problemas, faltando };
}

async function importarTapWeb(cli, file, botao){
  let lido;
  try{ lido = await lerPlanilhaTapWeb(file); }
  catch(e){ toast(e.message, 'err'); return; }

  let p;
  try{ p = await rpc('tf_importar_equipamentos_tapweb',
         { p_cliente_id: cli.id, p_itens: lido.itens, p_confirmado: false }); }
  catch(e){ toast(e.message, 'err'); return; }

  // ── quando pedir uma segunda confirmação, mais explícita ─────────────────
  // O documento pede "em upload que muda uma fração grande do cadastro" e não
  // define a fração. Duas situações, e a segunda é a que importa mais:
  //   · zera as datas de mais de um terço do que o cliente tem cadastrado;
  //   · NENHUMA TAG da planilha bate com o cadastro e o cliente já tem 3 ou
  //     mais equipamentos — o sinal clássico de planilha da empresa errada.
  const jaTem = Number(p.ja_cadastrados) || 0;
  const forte = (Number(p.zerados) > jaTem / 3 && jaTem >= 3)
             || (Number(p.atualizados) === 0 && jaTem >= 3);

  const lista = (p.sem_planilha || []).map(x =>
    '<div class="lin"><span>' + esc(x.tag) + (x.nome ? ' · ' + esc(x.nome) : '') + '</span></div>').join('');

  const corpo =
      '<p style="margin-top:0">Planilha lida para <b>' + esc(p.cliente) + '</b>.</p>'
    + (forte
        ? '<div class="aviso"><b>Confira o cliente antes de continuar.</b> '
          + (Number(p.atualizados) === 0
              ? 'Nenhuma das TAGs desta planilha existe no cadastro de <b>' + esc(p.cliente)
                + '</b>, que já tem ' + jaTem + ' equipamento(s). Isso costuma ser planilha '
                + 'de outra empresa.'
              : 'Este upload zera as datas de <b>' + p.zerados + '</b> dos ' + jaTem
                + ' equipamentos cadastrados.')
          + '</div>'
        : '')
    + '<div class="blocoLocal">'
    +   '<div class="lin"><span class="rot">Linhas na planilha</span><span>' + p.linhas + '</span></div>'
    +   '<div class="lin"><span class="rot">Equipamentos novos</span><span>' + p.novos + '</span></div>'
    +   '<div class="lin"><span class="rot">Já existem, vão ser atualizados</span><span>' + p.atualizados + '</span></div>'
    +   '<div class="lin"><span class="rot">Desativados no TapWeb</span><span>' + p.desativados + '</span></div>'
    +   '<div class="lin"><span class="rot">Somem da planilha e perdem as datas</span><span>' + p.zerados + '</span></div>'
    + '</div>'
    + (lista
        ? '<div class="secTit">Não vieram nesta planilha</div>'
          + '<p class="nota">Estes perdem as quatro datas e <b>deixam de aparecer como '
          + 'pendência</b> na montagem da proposta. O registro continua ativo, com todo o '
          + 'histórico — o importador não arquiva nem exclui ninguém. Arquivar continua '
          + 'sendo decisão sua, aqui na ficha.</p>'
          + '<div class="listaItens">' + lista + '</div>'
        : '')
    + (lido.faltando && lido.faltando.length
        ? '<p class="dica aviso">A planilha não traz a(s) coluna(s): '
          + esc(lido.faltando.join(', ')) + '. Esse(s) vencimento(s) ficam em branco.</p>'
        : '')
    + (lido.problemas.length
        ? '<div class="secTit">Datas que não entendi</div>'
          + '<p class="nota">Estas ficam em branco; o resto da linha entra normalmente.</p>'
          + '<div class="listaItens">' + lido.problemas.slice(0, 20).map(t =>
              '<div class="lin"><span>' + esc(t) + '</span></div>').join('') + '</div>'
        : '')
    + '<p class="nota">A coluna <b>Status</b> (Vencido/Em dia) da planilha é ignorada: '
    + 'ela existe no TapWeb para o cliente ver. Aqui vencido e em dia saem das datas.</p>'
    + (forte
        ? '<div class="campo"><label for="twOk">Para continuar, digite <b>CONFIRMO</b></label>'
          + '<input id="twOk" type="text" autocomplete="off" placeholder="CONFIRMO"></div>'
        : '');

  const r = await confirmar('Importar do TapWeb', corpo,
              'Atualizar ' + p.linhas + ' equipamento(s)', forte, forte ? 'twOk' : null);
  if (!r) return;
  if (forte && _twNorm(r.texto) !== 'confirmo'){
    toast('Não importei: a confirmação não foi digitada.', 'err'); return;
  }

  try{
    const g = await rpc('tf_importar_equipamentos_tapweb',
      { p_cliente_id: cli.id, p_itens: lido.itens, p_confirmado: true });
    toast(g.novos + ' novo(s), ' + g.atualizados + ' atualizado(s), '
        + g.zerados + ' sem data.', 'ok');
    detalheCliente(cli);
  }catch(e){ toast(e.message, 'err'); }
}

function pintarEquipamentos(cli, equips){
  const el = document.getElementById('clEquips');
  if (!el) return;
  const comTapWeb = equips.filter(x => x.tapweb_em).length;
  let h = '<div class="secTit">Equipamentos</div>';
  if (!equips.length){
    h += '<p class="nota">Nenhum equipamento. Sem TAG cadastrada, o inspetor lança o item '
      +  'sem vínculo com o vaso.</p>';
  }
  equips.forEach(x => {
    const venc = SERVICOS_NR13.filter(sv => x[sv.campo]);
    h += '<div class="linhaCt"><div><b>' + esc(x.tag) + '</b>'
      + (x.nome ? ' <span class="nota">' + esc(x.nome) + '</span>' : '')
      + '<small style="display:block;color:var(--ink-3);font-size:12px">'
      + esc([x.tipo, x.localizacao, x.pmta ? 'PMTA ' + x.pmta : ''].filter(Boolean).join(' · '))
      + '</small>'
      + (x.tapweb_desativado_em
          ? '<small style="display:block;font-size:12px;color:var(--warn)">Desativado no TapWeb em '
            + esc(dataBR(x.tapweb_desativado_em)) + '</small>'
          : venc.length
            ? '<small style="display:block;font-size:12px">'
              + venc.map(sv => '<span class="chip' + (vencido(x[sv.campo]) ? ' crit' : '') + '">'
                  + esc(sv.curto) + ' ' + esc(dataBR(x[sv.campo])) + '</span>').join(' ')
              + '</small>'
            : '')
      + (x.tapweb_em
          ? '<small style="display:block;color:var(--ink-3);font-size:11.5px">'
            + 'TapWeb · ' + esc(dataBR(x.tapweb_em)) + '</small>'
          : '')
      + '</div></div>';
  });

  // ── ITEM 2 (S34): a porta do importador ─────────────────────────────────
  // Fica DENTRO da ficha de um cliente, nunca numa tela solta de importação:
  // a planilha do TapWeb não tem coluna que diga de quem ela é, e é o fluxo
  // que impede subir a do cliente errado.
  h += '<div class="secTit">Vencimentos (TapWeb)</div>'
    +  '<p class="nota">Suba aqui o relatório de equipamentos que o TapWeb gera para '
    +  '<b>' + esc(nomeCliente(cli)) + '</b>. Ele atualiza o nome e as quatro datas de '
    +  'vencimento — o resto (categoria, local, fluido, volume, PMTA) continua só no '
    +  'TapWeb, que é a fonte de verdade dos vasos. Nada é gravado antes de uma prévia.</p>'
    +  (comTapWeb
        ? '<p class="nota"><b>' + comTapWeb + '</b> de ' + equips.length
          + ' equipamento(s) já vieram de uma planilha do TapWeb.</p>' : '')
    +  '<input id="eqTW" type="file" accept=".xlsx,.csv,text/csv" style="font-size:12px">'
    +  '<p class="dica">Aceita <b>.xlsx</b> e <b>.csv</b>. Se o seu arquivo for .xls antigo, '
    +  'abra no Excel e salve como .xlsx.</p>';

  // ⚠ O campo "Nome" é digitável aqui, e não só importado, por uma razão
  // concreta: a planilha de referência do TapWeb NÃO TEM coluna de nome
  // (Tag, Status, Data Desativação, as quatro datas, Setor, Calibração
  // Válvula, Local, Categoria, Tipo Fluido, Volume, Unidade Medida, PMTA,
  // Unidade Medida PMTA, Observação). O item 2 pede o campo; o importador já
  // sabe lê-lo se um dia ele aparecer no relatório, e até lá quem preenche é
  // quem está aqui. Campo que só se preenche por um caminho que ainda não
  // existe é campo que nasce vazio para sempre.
  h += '<div class="secTit">Acrescentar um equipamento</div>'
    +  '<div class="campo"><label for="eqN">Nome (opcional)</label>'
    +  '<input id="eqN" type="text" placeholder="Ex.: Pulmão da linha 2"></div>'
    +  '<div class="dupla"><div class="campo"><label for="eqT">TAG</label>'
    +  '<input id="eqT" type="text" placeholder="VP-01"></div>'
    +  '<div class="campo"><label for="eqK">Tipo</label><select id="eqK">'
    +  '<option value="vaso">Vaso de pressão</option><option value="caldeira">Caldeira</option>'
    +  '<option value="tanque">Tanque</option><option value="tubulacao">Tubulação</option>'
    +  '<option value="outro">Outro</option></select></div></div>'
    +  '<div class="dupla"><div class="campo"><label for="eqL">Local</label>'
    +  '<input id="eqL" type="text"></div>'
    +  '<div class="campo"><label for="eqP">PMTA</label>'
    +  '<input id="eqP" type="number" step="0.01" inputmode="decimal"></div></div>'
    +  '<button class="btn" id="eqAdd" style="width:100%;padding:9px">Adicionar equipamento</button>';
  el.innerHTML = h;

  const tw = document.getElementById('eqTW');
  if (tw) tw.addEventListener('change', async () => {
    const f = tw.files && tw.files[0];
    tw.value = '';
    if (f) await importarTapWeb(cli, f, tw);
  });

  document.getElementById('eqAdd').addEventListener('click', function(){
    _semDuploEnvio_(this, async () => {
      const tag = document.getElementById('eqT').value.trim();
      if (!tag){ toast('Informe a TAG.','err'); return; }
      const obj = { cliente_id: cli.id, tag, tipo: document.getElementById('eqK').value,
        nome: document.getElementById('eqN').value.trim() || null,
        localizacao: document.getElementById('eqL').value.trim() || null,
        pmta: parseFloat(document.getElementById('eqP').value) || null };
      try{
        if (DEMO) demoAddEquip(obj); else await post('equipamentos', obj);
        toast('Equipamento cadastrado.','ok'); detalheCliente(cli);
      }catch(err){
        toast(/duplicate|unique|ux_equip/i.test(err.message)
          ? 'Este cliente já tem um equipamento com essa TAG.' : err.message, 'err');
      }
    });
  });
}

/** O único caminho para trocar de tela. */
function irPara(v){
  if (v === 'sair'){ sairDaConta(); return; }
  if (v === 'hub'){ location.href = NO_SERVIDOR ? '../' : '#'; return; }
  if (v === 'volta'){ location.href = (CAD_VOLTA[CAD_AREA] || ['', '../'])[1]; return; }
  if (!ROTULO[v]) v = 'cad';
  if (v === 'cfg' && !sessao.admin) v = 'cad';
  visao = v;
  document.querySelectorAll('.nav-item').forEach(b => {
    const ativo = b.dataset.v === v;
    b.classList.toggle('on', ativo);
    if (ativo) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  document.getElementById('crumbGrupo').textContent = v === 'cfg' ? 'Sistema' : 'Cadastros';
  document.getElementById('crumbAtual').textContent = ROTULO[v];
  document.body.classList.remove('navAberta');

  // a busca é POR TELA: o texto de uma não pode vazar para a outra
  const bu = document.getElementById('tbBusca');
  if (bu.value !== (BUSCA[v] || '')) bu.value = BUSCA[v] || '';
  bu.placeholder = PLACEHOLDER_BUSCA[v] || 'Buscar nesta tela…';
  bu.disabled = !PLACEHOLDER_BUSCA[v];
  bu.style.visibility = PLACEHOLDER_BUSCA[v] ? '' : 'hidden';

  document.getElementById('board').classList.add('livre');
  document.querySelector('main').classList.add('rolaY');
  document.body.classList.remove('emQuadro');
  if (v === 'dup') return pintarDuplicados();
  if (v === 'cat') return pintarCatalogo();
  if (v === 'cfg') return pintarConfig();
  return pintarCadastros();
}

function casa(texto, q){
  if (!q) return true;
  const t = norm(texto);
  return norm(q).split(/\s+/).filter(Boolean).every(p => t.includes(p));
}

let _buscaT = null;

function ligarBusca(){
  const el = document.getElementById('tbBusca');
  el.addEventListener('input', () => {
    BUSCA[visao] = el.value;
    clearTimeout(_buscaT);
    _buscaT = setTimeout(() => {
      const foco = document.activeElement === el;
      const pos = el.selectionStart;
      // repinta sem ir à rede quando a tela sabe filtrar sozinha
      if (REPINTA[visao]) REPINTA[visao]();
      else irPara(visao);
      if (foco){ requestAnimationFrame(() => {
        const n = document.getElementById('tbBusca');
        if (n && document.activeElement !== n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} }
      }); }
    }, 140);
  });
  // Esc limpa a busca sem tirar a mão do teclado
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape' && el.value){ e.stopPropagation(); el.value = ''; BUSCA[visao] = ''; irPara(visao); }
  });
}

      + esc(x.nome) + ' <span class="chip' + (x.tipo === 'normal' ? '' : x.tipo === 'feriado' ? ' atr' : ' ok') + '">' + esc(FTIPO[x.tipo || 'feriado'] || x.tipo) + '</span>'
      + (x.tipo === 'dispensa' && x.dispensa_min ? ' <span class="chip ok">' + esc(String(Math.floor(x.dispensa_min / 60)) + 'h' + (x.dispensa_min % 60 ? String(x.dispensa_min % 60).padStart(2, '0') : '')) + ' dispensadas</span>' : '')
      + (x.opcional ? ' <span class="chip">opcional</span>' : '') + '<small>' + esc(ABR[x.abrangencia] || x.abrangencia) + (x.repete ? ' · repete todo ano' : ' · só em ' + String(x.data).slice(0,4))
      + (x.por ? ' · por ' + esc(x.por) : '') + '</small></span><span class="a"><button class="btn mini" type="button" data-fe="' + esc(x.id) + '">Editar</button>'
      + '<button class="btn mini perigo" type="button" data-fx="' + esc(x.id) + '">Excluir</button></span></div>').join('')
      : '<p class="nota" style="padding:10px">Nenhum feriado em ' + FER_ANO + '.</p>') + '</div></div>';
  document.getElementById('feA').addEventListener('click', () => { FER_ANO--; cfgFeriados(); });
  document.getElementById('feP').addEventListener('click', () => { FER_ANO++; cfgFeriados(); });
  document.getElementById('feNovo').addEventListener('click', () => feForm(null));
  c.querySelectorAll('[data-fe]').forEach(b => b.addEventListener('click', () => feForm(L.find(x => x.id === b.dataset.fe))));
  c.querySelectorAll('[data-fx]').forEach(b => b.addEventListener('click', async () => {
    const x = L.find(y => y.id === b.dataset.fx);
    if (!await confirmar('Excluir "' + x.nome + '"?', '<p style="margin-top:0">' + (x.repete ? 'Ele deixa de valer em todos os anos.' : 'Só neste ano.')
      + ' Prazos em aberto passam a contar este dia como útil.</p>', 'Excluir', true)) return;
    try{ await rpc('tf_feriado_excluir', { p_id: x.id }); toast('Feriado excluído.', 'ok'); cfgFeriados(); }catch(e){ toast(e.message, 'err'); }
  }));
}

function feForm(x){
  const data = x ? (x.repete ? FER_ANO + String(x.data).slice(4) : x.data) : isoHoje();
  abrirModal(x ? 'Editar feriado' : 'Inserir feriado',
    '<div class="dupla"><div class="campo"><label for="ffD">Data</label><input id="ffD" type="date" value="' + esc(data) + '"></div>'
    + '<div class="campo"><label for="ffA">Abrangência</label><select id="ffA">' + ['nacional','estadual','municipal'].map(k =>
      '<option value="' + k + '"' + ((x ? x.abrangencia : 'municipal') === k ? ' selected' : '') + '>' + k.charAt(0).toUpperCase() + k.slice(1) + '</option>').join('') + '</select></div></div>'
    + '<div class="campo"><label for="ffN">Nome</label><input id="ffN" type="text" maxlength="80" autocomplete="off" name="ffn_nofill" value="' + esc(x ? x.nome : '') + '"></div>'
    + '<div class="campo"><label for="ffT">Tipo para o ponto</label><select id="ffT">' + [['feriado','Feriado (quem trabalha recebe 100% ou folga compensatória)'],
        ['dispensa','Dispensa dada pela Engetap (folga sem desconto)'], ['folga_banco','Folga a negociar pelo banco (cada um escolhe no celular)'],
        ['normal','Dia normal (ponto facultativo que a Engetap não dá)']].map(([k, r]) =>
      '<option value="' + k + '"' + ((x ? (x.tipo || 'feriado') : 'feriado') === k ? ' selected' : '') + '>' + r + '</option>').join('') + '</select></div>'
    + '<div class="campo" id="ffHC"><label for="ffH">Horas dispensadas (vazio = o dia todo)</label><input id="ffH" type="text" inputmode="numeric" maxlength="5" placeholder="ex.: 4:00" value="'
      + esc(x && x.dispensa_min ? Math.floor(x.dispensa_min / 60) + ':' + String(x.dispensa_min % 60).padStart(2, '0') : '') + '">'
      + '<div class="dica">Ex.: 24/12 com 4h: trabalha meio dia; quem quiser o dia todo tira as outras horas do banco. Quem trabalha na parte dispensada ganha as horas 1:1.</div></div>'
    + '<label class="chk"><input type="checkbox" id="ffO"' + (x && x.opcional ? ' checked' : '') + '> Ponto facultativo da Prefeitura (opcional: escolher o tipo a cada ano)</label>'
    + '<label class="chk"><input type="checkbox" id="ffR"' + (x && x.repete ? ' checked' : '') + '> Repete todo ano na mesma data</label>'
    + '<p class="nota">Data móvel (Carnaval, Paixão, Corpus Christi) se cadastra ano a ano, sem "repete".</p>'
    + '<p class="nota" id="ffMsg" style="color:var(--crit)"></p>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Gravar', pri:true, onClick: async () => {
        try{ const r = await rpc('tf_feriado_salvar', { p_id: x ? x.id : null, p_data: document.getElementById('ffD').value,
               p_nome: document.getElementById('ffN').value, p_abrangencia: document.getElementById('ffA').value,
               p_repete: document.getElementById('ffR').checked });
             // S127 · o tipo e o "opcional" (606); banco sem a 606: grava como antes e avisa
             const tp = document.getElementById('ffT').value, op = document.getElementById('ffO').checked;
             if (r && r.id && (tp !== ((x && x.tipo) || 'feriado') || op !== !!(x && x.opcional))){
               try{ await rpc('tf_feriado_tipo', { p_id: r.id, p_tipo: tp, p_opcional: op }); }
               catch(e2){ fecharModal(); toast('Data gravada, mas o tipo não (falta rodar a 606 no Supabase?): ' + e2.message, 'err'); cfgFeriados(); return; }
             }
             // S131 · as horas dispensadas (613): só na dispensa; vazio = o dia todo
             const ht = (document.getElementById('ffH') || {}).value || '', hm = /^(\d{1,2})(?::(\d{2}))?$/.exec(ht.trim());
             const hmin = tp === 'dispensa' && hm ? Number(hm[1]) * 60 + Number(hm[2] || 0) : null;
             if (tp === 'dispensa' && ht.trim() && !hm){ document.getElementById('ffMsg').textContent = 'Horas no formato 4:00.'; return; }
             if (r && r.id && (hmin || null) !== ((x && x.tipo === 'dispensa' && x.dispensa_min) || null)){
               try{ await rpc('tf_feriado_dispensa_min', { p_id: r.id, p_min: hmin }); }
               catch(e3){ fecharModal(); toast('Data gravada, mas as horas não (falta rodar a 613 no Supabase?): ' + e3.message, 'err'); cfgFeriados(); return; }
             }
             fecharModal(); toast('Feriado gravado.', 'ok'); cfgFeriados(); }
        catch(e){ document.getElementById('ffMsg').textContent = e.message; }
     }}]);
  const ffT = document.getElementById('ffT'), ffHC = document.getElementById('ffHC');
  const ffAc = () => { ffHC.hidden = ffT.value !== 'dispensa'; };
  ffT.addEventListener('change', ffAc); ffAc();
}

/** `?ir=cat&item=<id>` (vindo do TapFlow): abre o item na família dele. */
async function abrirItemNoCatalogo(id){
  try{
    const r = await get('v_catalogo?select=*&id=eq.' + encodeURIComponent(id));
    if (!r || !r[0]){ toast('Item de catálogo não encontrado.', 'err'); return; }
    catFamSel = r[0].familia_id;
    await irPara('cat');
    setTimeout(() => { try{ formCatalogo(r[0]); }catch(e){} }, 400);
  }catch(e){ toast(e.message, 'err'); }
}


function rhFichaClienteExig(cli){
  const cx = document.getElementById('clRhExig'); if (!cx) return;
  cx.innerHTML = '<div class="secTit">Entrada de inspetores (RH)</div><p class="nota" style="margin-top:0">Documentos que este cliente exige para '
    + 'liberar a entrada — vale para o kit (TapSeg › Segurança do Trabalho › Kit do cliente).</p>'
    + '<div class="linhaBtns" style="margin-top:6px"><button class="btn" type="button" id="clRhExigB">Exigências para entrada</button>'
    + '<button class="btn" type="button" id="clRhKitB">Montar kit</button></div>';
  // S116 · as duas abrem no TapSeg, já neste cliente
  document.getElementById('clRhExigB').addEventListener('click', () => irParaSeg('cli=' + encodeURIComponent(cli.id) + '&acao=exig'));
  document.getElementById('clRhKitB').addEventListener('click', () => irParaSeg('cli=' + encodeURIComponent(cli.id) + '&acao=kit'));
}

async function iniciar(){
  await carregarRH();     // a ficha do cliente mostra as exigências de entrada para quem é do RH
  await carregarFin();
  montarNav();
  pintarCracha();
  await carregarParametros();
  await carregarEquipe();
  // links de fora: `?ir=cad|cat|dup|cfg` · `&cli=<cliente>` (abre a ficha) · `&item=<item do catálogo>` · `&aba=<aba de Configurações>`
  let ir = null, cli = null, item = null;
  try{
    const sp = new URLSearchParams(location.search);
    ir = sp.get('ir'); cli = sp.get('cli'); item = sp.get('item');
    if (sp.get('aba')) abaCfg = sp.get('aba');
    if (location.search) history.replaceState(null, '', location.pathname + (CAD_AREA !== 'cadastros' ? '?area=' + CAD_AREA : ''));
  }catch(e){}
  if (cli) cadSel = cli;
  if (!conectado && !DEMO) setConn('ok', 'Conectado');
  if (DEMO) setConn('', 'Demonstração');
  await irPara(ROTULO[ir] ? ir : 'cad');
  if (item && visao === 'cat') abrirItemNoCatalogo(item);
  atualizarDupMenu();
}
