<!-- ═══════════════════════════════════════════════════════════════════════════
     TAPFLOW MANAGER — TFM_S3
     Engetap Engenharia · quadros, cadastros, abertura de OS e itens da OS

     S2 acrescentou: cadastros, abertura de OS, aba de ITENS e registro da
     proposta externa.
     S3 acrescenta: upload do PDF da proposta para o Google Drive, geração de
     PDF (levantamento e resumo da OS) e a aba ARQUIVOS.

     ARQUIVO ÚNICO, SEM BUILD. Abre com duplo clique ou hospeda no GitHub Pages.

     ── COMO LIGAR NO SUPABASE ─────────────────────────────────────────────────
     Enquanto SUPABASE_URL estiver vazio, o app roda em MODO DEMO com dados de
     mentira — dá para ver os quadros funcionando sem instalar nada.
     Para ligar de verdade, preencha as duas constantes logo abaixo com o que
     está em Supabase → Settings → API.

     ── O QUE ESTE APP NÃO FAZ, DE PROPÓSITO ───────────────────────────────────
     Não existe arrastar o card. A coluna é a fase da primeira tarefa não
     resolvida, calculada pelo banco na view v_os_kanban. O card se move quando
     uma tarefa fecha — e só assim. O banco recusa UPDATE direto em
     pipeline_tarefas, então nem um bug daqui conseguiria burlar isso.
     ═══════════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="../nucleo/telas.css?v=T1">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   TOKENS — a cor sai da logomarca da Engetap, não de escolha minha.
   O monograma é um gradiente de #1D4E80 a #2596D5, o texto é #515252 e o
   subtítulo é #0087CC. Até o S9 o app era verde, que eu tinha inventado.
   ════════════════════════════════════════════════════════════════════════════ */

/* ── foco visível em todo lugar ────────────────────────────────────────────
   O PCM tem UM :focus-visible no arquivo inteiro. Quem navega por teclado —
   ou quem tem o mouse ruim — fica sem saber onde está. Aqui é global. */

/* ════════════════════════════════════════════════════════════════════════════
   SHELL — barra lateral fixa + header + conteúdo
   ════════════════════════════════════════════════════════════════════════════ */
.nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);background:var(--sidebar-bg);
  color:var(--sidebar-fg);display:flex;flex-direction:column;padding:14px 0 10px;z-index:60;
  border-right:1px solid rgba(255,255,255,.05)}
.nav-brand b span{color:var(--accent-alt)}
/* S44 · Bruno pediu pra recolher por completo (28/09/2026): antes o grupo
   fechado escondia tudo MENOS o item ativo, pra não perder a própria posição
   — só que isso deixava o grupo aberto sempre "vazando" uma linha e os outros
   fechados de verdade, inconsistente. A posição atual já aparece no caminho
   (breadcrumb) lá em cima, então agora fechado é fechado mesmo. */

.nav-item.on{background:var(--sidebar-active);color:var(--sidebar-fg-active);border-left-color:var(--accent-alt)}
/* Duas linhas em vez de reticências. "Equipe Técnico A…" não identifica quadro
   nenhum, e identificar o quadro é a única coisa que este item precisa fazer.
   O ícone e o contador ficam alinhados ao topo para a linha não dançar. */

.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:40}

/* A regra base vem ANTES da media query: declarada depois, ela vencia por
   ordem de cascata e o botão do menu ficava invisível também no celular. */

@media (max-width:900px){
  :root{--nav-w:0px}
  .nav{transform:translateX(-100%);transition:transform .2s;width:220px;box-shadow:var(--sh-lift)}
  body.navAberta .nav{transform:none}
  body.navAberta .navScrim{display:block}
  .navScrim{display:none;position:fixed;inset:0;background:rgba(16,26,28,.4);z-index:55}
  .navBurger{display:flex}
  .app{margin-left:0}
  .tbBusca{width:auto;flex:1;min-width:90px}
  .topbar{gap:8px;padding:0 10px}
  .crumb{display:none}
  .who{display:none}
  #btnRefresh{display:none}          /* puxar para recarregar já existe no navegador */
  #connTxt{display:none}             /* o ponto continua: é o sinal, o texto é enfeite */
  #btnNovaOS{padding:6px 9px;font-size:12px}
  .tela{padding-bottom:24px}
  main{padding:12px 10px}
}

*{box-sizing:border-box}
/* `hidden` tem que vencer o display dos elementos abaixo — sem isto o overlay
   de login continua na frente do app mesmo com o atributo hidden. */
[hidden]{display:none !important}
/* A gaveta fechada fica em translateX(100%): a caixa continua existindo fora da
   tela e esticava a largura rolável em 390px. Cortar aqui é mais barato do que
   animar `right`, que dispara layout a cada quadro. */

/* ── topo ─────────────────────────────────────────── */
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* S45 · item 4: o botão que ainda não vale — branco, letra cinza, não grava.
   NÃO é `disabled`: botão desabilitado não recebe o toque, e no celular (sem
   "passar o mouse") é o toque que mostra o porquê. */
.btn.esmaecido,.btn.esmaecido:hover{background:var(--surface);border-color:var(--rule);color:var(--ink-3);
  cursor:not-allowed;filter:none;font-weight:500}
/* S56 · fila item 3: a barra do topo numa janela de 1000–1440 px (menu lateral
   à mostra, barra com ~780 px). Antes, "+ Nova OS" quebrava em 3 linhas, o
   crachá vazava da barra e, logado, "Atualizar" saía da tela. Regra: nada
   quebra linha; quem encolhe é a busca (até um mínimo) e o caminho do topo;
   os botões ficam inteiros. Na faixa estreita sobram só o essencial:
   o ponto da conexão (texto no balão), o primeiro nome (o resto no balão),
   o ícone de "Trocar de app" e "+ OS". */
.topbar>*{flex-shrink:0;white-space:nowrap}
.topbar .crumb{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1 1 0;min-width:0}
.crachaEu{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tbIco{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;vertical-align:-2px;display:none}
#btnHub:not([hidden]){display:inline-flex;align-items:center;gap:6px}
@media (min-width:901px){
  .topbar .tbBusca{flex:0 1 250px;width:250px;min-width:120px}
}
/* até 1439 px (inclui o celular, onde o nome já some): ícone e ponto */
@media (max-width:1439px){
  #connTxt{display:none}
  .whoResto{display:none}
  #btnHub .tbTxt{display:none}
  #btnHub .tbIco{display:inline}
  #btnHub{padding:6px 9px}
}
@media (min-width:901px) and (max-width:1439px){
  .topbar{gap:9px;padding:0 14px}
  #crumbGrupo,#crumbGrupo+span{display:none}
}
@media (min-width:901px) and (max-width:1099px){

  #btnNovaOS{padding:6px 10px}
}
/* S32 · item 3: a tela "Meu perfil". Painel único e estreito de propósito —
   são quatro linhas de leitura e um botão; espalhar isso na largura da tela
   faria a pessoa procurar onde está o conteúdo. */
/* S40 · Conta corrente Proper. Lista em LINHAS, não tabela: no celular a
   coluna "Estornar" nasceria fora da tela (regra "campo que só aparece
   rolando para o lado é campo que não existe", §7). */
.ccWrap{max-width:980px;padding-bottom:40px}
.ccTopo{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:0 0 14px}
.ccSaldo{flex:1 1 260px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.ccSaldo .rot{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.ccSaldo .v{font:600 26px/1.2 'JetBrains Mono',monospace;margin:4px 0 2px}
.ccSaldo .q{font-size:12.5px;color:var(--ink-2)}
.ccAcoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ccSec{font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ccSec .nota{font-weight:400;margin:0}
.ccLista{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.ccLin{display:grid;grid-template-columns:86px minmax(0,1fr) 120px 120px 92px;gap:10px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:13px}
.ccLin:last-child{border-bottom:0}
/* F14 · o aviso da medição da OS comum no Painel */
.ccLin.omdLin{grid-template-columns:86px minmax(0,1fr) minmax(0,1.6fr) 110px}
@media (max-width:640px){ .ccLin.omdLin{grid-template-columns:auto 1fr} .ccLin.omdLin .ccNome{text-align:right} .ccLin.omdLin .ccDesc{grid-column:1/-1} .ccLin.omdLin .n{grid-column:1/-1} }
/* F15 · Categorias: a coluna do tipo de custo (519) */
.ccLin.catLin{grid-template-columns:minmax(0,1fr) 210px 120px 236px}
.ccLin.catOff>span:first-child{color:var(--ink-3);text-decoration:line-through}
.ccLin.catOff>span:first-child .chip{text-decoration:none;display:inline-block}
.ccLin.catLin.rec{grid-template-columns:minmax(0,1fr) 78px}
.catCusto{width:100%;padding:4px 6px;font-size:13px}
.catCusto.catSemTipo{border-color:var(--warn,#b7791f);background:var(--warn-soft,#fff8e6)}
.catAviso{margin:0 0 14px;padding:10px 12px;border-radius:8px;background:var(--warn-soft,#fff8e6);border:1px solid var(--warn,#b7791f);font-size:13px}
@media (max-width:640px){ .ccLin.catLin{grid-template-columns:minmax(0,1fr) auto} .ccLin.catLin.cab{display:none} .ccLin.catLin .catC{grid-column:1/-1} .ccLin.catLin .n{grid-column:1} }
.ccLin.cab{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;background:var(--surface-2)}
.ccLin .t small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.ccLin .n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap}
.ccLin.riscada .ccData,.ccLin.riscada .ccDesc,.ccLin.riscada .ccNome,.ccLin.riscada .n.v{text-decoration:line-through;color:var(--ink-3)}
/* S46 · As listas de Contas a Receber, Contas a Pagar e Recorrentes têm SEIS
   pedaços por linha (data · nome · descrição · valor · chips · botões), e o
   .ccLin base só declara cinco colunas. O sexto — os botões — caía numa linha
   de grade nova, sozinho na 1ª coluna (86px), e cada botão ficava numa linha:
   visto no inspector em 29/09 (grid-template-rows 19.5px 78px). A classe é
   própria em vez de mexer no .ccLin, porque ele serve a várias telas com 3, 4
   e 5 colunas que hoje estão certas. Os botões são um grupo flex: quebram
   JUNTOS se faltar espaço, nunca um por linha. */
.ccLin.fin6{grid-template-columns:86px minmax(0,1fr) minmax(0,1.4fr) 112px minmax(0,.9fr) var(--acoes,280px)}
/* Cada linha é uma grade própria: coluna de botões com largura "do conteúdo"
   desalinhava a lista (linha com 4 botões empurrava a descrição para a
   esquerda). Largura FIXA por lista, do tamanho da linha mais cheia dela. */
.ccLin.fin6 .a{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.finAnul{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;vertical-align:middle}
.finAnul input{width:auto;margin:0}
/* ════════════════════════════════════════════════════════════════════════════
   S48 · LISTAS DO FINANCEIRO (Contas a Pagar, Contas a Receber, Recorrentes)
   Tudo aqui é .finLista / .fin6.finL: o .ccLin base serve a outras telas de
   3, 4 e 5 colunas que estão certas e não mudam.
   ════════════════════════════════════════════════════════════════════════════ */
.finTopo{margin-bottom:10px}
.finBarra{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.finFiltros{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.finSel{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.finSel select,.finPerBtn{height:30px;padding:0 8px;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;
  border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink);font-family:inherit;max-width:240px}
.finPerBtn{display:inline-flex;align-items:center;white-space:nowrap;cursor:pointer}
.finPerBtn:hover,.finSel select:hover{border-color:var(--accent)}
.finFiltrosBtn{display:none}
.finHistNota{color:var(--ink-3)}
.finHistNota button{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.finTags{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.finTags.on{display:flex}
.finResumo{font-size:12.5px;color:var(--ink-2);margin:0 0 6px;min-height:18px}
.finResumo b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* A lista vira um cartão branco SEM o padding do .lista: assim o cabeçalho
   gruda no topo exato da área que rola, sem fresta por onde as linhas
   apareceriam (item 1). A altura desconta a barra de filtros e o resumo. */
.lista.finLista{max-height:calc(100vh - 300px);margin:0;padding:0;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px}
.finLista .ccLin.fin6.cab{position:sticky;top:0;z-index:3;background:var(--surface-2);
  border-bottom:1px solid var(--rule);box-shadow:0 1px 0 var(--rule)}
.finOrd{border:0;background:none;padding:2px 3px;margin:-2px -3px;font:inherit;color:inherit;letter-spacing:inherit;
  text-transform:inherit;cursor:pointer;border-radius:3px;display:inline-flex;gap:4px;align-items:center}
.finOrd:hover{background:var(--accent-soft);color:var(--accent-ink)}
.finOrd.on{color:var(--accent-ink);font-weight:700}
.finOrd i{font-style:normal;font-size:9px;min-width:8px;margin-left:1px}
/* o título do mês gruda logo abaixo do cabeçalho das colunas (--cabH vem do JS) */
.finMes{position:sticky;top:var(--cabH,30px);z-index:2;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  padding:6px 12px;background:var(--accent-soft);color:var(--accent-ink);border-bottom:1px solid var(--rule);font-size:12px}
.finMes b{font-size:12.5px}
.finMes span{color:var(--ink-2);font-family:var(--mono);font-size:11.5px}

/* item 3: listras, destaque ao passar o mouse, separador visível, altura
   mínima e a faixa de cor da situação (reforço — o chip é quem informa) */
.finLista .ccLin.fin6.finL{background:var(--surface);border-bottom:1px solid var(--rule);min-height:44px}
.finLista .ccLin.fin6.finL.par{background:var(--paper)}
.finLista .ccLin.fin6.finL:hover{background:var(--accent-soft)}
.finLista .ccLin.fin6.finL:last-child{border-bottom:0}
/* F31 (S209): a conta aberta pelo "Precisa de ação" do Painel (188); o "pago em" (99); a caixa de marcar (105) */
.finLista .ccLin.fin6.finL.finAlvo{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.finPagoEm{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.finChk{display:inline-flex;align-items:center;margin-right:6px;vertical-align:middle}
.finChk input{width:16px;height:16px;margin:0;cursor:pointer}
.finMarcadas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 8px;padding:8px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft)}
.finMarcadas[hidden]{display:none}
.ccLin.finL.st-venc{box-shadow:inset 4px 0 0 var(--crit)}
.ccLin.finL.st-breve{box-shadow:inset 4px 0 0 #C99A06}
.ccLin.finL.st-paga{box-shadow:inset 4px 0 0 var(--ok)}
.ccLin.finL.st-anul{box-shadow:inset 4px 0 0 #AEB7BD}
.chip.fCrit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.fAtn{background:#FBF1CF;color:#7A5A00;border-color:transparent}
.chip.fOk{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.finApoio{color:var(--ink-3);font-style:italic}
.finSaldo{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-3);font-weight:400}
/* item 3.6: só dois controles por linha — a coluna de ações encolhe e a sobra
   vai para fornecedor/descrição */
/* "VENCIMENTO ▲" não cabia nos 86px da 1ª coluna e invadia a do nome */
.finLista .ccLin.fin6{grid-template-columns:98px minmax(0,1fr) minmax(0,1.4fr) 116px minmax(0,.9fr) var(--acoes,280px)}
@media (max-width:1100px) and (min-width:701px){
  .finLista .ccLin.fin6{grid-template-columns:96px minmax(0,1fr) minmax(0,1.3fr) 108px var(--acoes,280px)}
}
.finPri{padding:3px 10px;font-size:12px}
.finMais{padding:2px 9px;font-size:15px;line-height:1;min-width:32px;letter-spacing:1px}
.finMenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--sh-lift);min-width:150px;padding:4px 0;display:flex;flex-direction:column}
.finMenu button{border:0;background:none;text-align:left;padding:8px 14px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.finMenu button:hover,.finMenu button:focus{background:var(--accent-soft);outline:none}
.finMenu button.perigo{color:var(--crit)}
.finTrava{display:block;margin-top:3px;font-size:11.5px;color:var(--warn);line-height:1.35}
.campo input:disabled,.campo select:disabled{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.finHist{margin-top:10px;border-top:1px solid var(--rule-2);padding-top:8px;font-size:12.5px}
.finHist summary{cursor:pointer;color:var(--accent-ink);font-weight:600}
.finHistLin{display:flex;flex-direction:column;padding:5px 0;border-bottom:1px solid var(--rule-2)}
.finHistLin .q{font-size:11px;color:var(--ink-3)}
.relPerBtn{font-size:12.5px;padding:5px 10px}
.ccLin.finPul{grid-template-columns:86px minmax(0,1fr) 110px}
.ccLin.finPul.finAtr{cursor:pointer;grid-template-columns:124px minmax(0,1fr) 110px}
.finAtrMes{margin-bottom:10px}
.finFornNovo{display:flex;justify-content:flex-end;margin:-2px 0 4px}
.finFornNovo .finFornNovoF{flex:1;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper)}
/* S59 · Prazos de Recebimento: cliente · prazo · quem alterou · botão */
.ccLin.prz{grid-template-columns:minmax(0,1.6fr) 90px minmax(0,1fr) 90px}
.ccLin.prz .t b{font-weight:600}
.przDias{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.przDias input{width:90px}
.przDias .btn{padding:4px 10px;font-size:12.5px}
.przFil{margin:6px 0 0;padding:8px 10px;background:var(--surface-2);border:1px solid var(--rule-2);border-radius:4px;font-size:12.5px;max-height:180px;overflow:auto}
.przFil div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.przFil small{color:var(--ink-3)}
.przVenc{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.przVenc a{cursor:pointer;text-decoration:underline}
@media (max-width:700px){ .ccLin.prz{grid-template-columns:minmax(0,1fr) auto auto;row-gap:2px} .ccLin.prz.cab{display:none}
  .ccLin.prz .quem{order:5;grid-column:1 / -1;font-size:12px;color:var(--ink-3)} }
@media (max-width:700px){ .ccLin.finPul{grid-template-columns:78px minmax(0,1fr) auto} .ccLin.finPul.cab{display:none} }
.finSelSolto{height:30px;padding:0 8px;font-size:12.5px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);font-family:inherit;max-width:260px}

@media (max-width:700px){
  /* no celular a barra recolhe num botão "Filtros" e não toma a tela */
  .finFiltrosBtn{display:inline-flex}
  .finFiltros{display:none;width:100%}
  .finBarra.aberta .finFiltros{display:flex}
  .finSel{flex:1 1 140px}
  .finSel select,.finPerBtn{max-width:none;width:100%;height:36px}
  .lista.finLista{max-height:none!important}
  /* a grade de 6 colunas da janela larga (98px…) é mais específica que a do
     celular do S46 — sem repetir aqui, nome e valor se sobrepunham */
  .finLista .ccLin.fin6{grid-template-columns:82px minmax(0,1fr) auto}
  .finMes{top:0}
  .finMais{min-width:40px;min-height:36px}
  .finPri{min-height:36px}
  .ccLin.fin6.finL .a{justify-content:flex-end}
}
/* Janela média: os botões continuam numa fila só (max-content) e são os
   chips que descem para baixo do nome/descrição — espremer a coluna dos
   botões trazia de volta o "um embaixo do outro" que o item 3 veio tirar. */
@media (max-width:1100px) and (min-width:701px){
  .ccLin.fin6{grid-template-columns:80px minmax(0,1fr) minmax(0,1.3fr) 104px var(--acoes,280px);row-gap:4px}
  .ccLin.fin6 > span:nth-child(5){grid-column:2 / 5;grid-row:2}
  .ccLin.fin6 .a{grid-column:5;grid-row:1 / span 2}
  .ccLin.fin6.cab > span:nth-child(5){display:none}
}
.ccTipo{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;
  background:var(--surface-2);color:var(--ink-2);margin-right:6px;text-transform:uppercase;letter-spacing:.3px}
.ccTipo.abatimento{background:var(--ok-soft);color:var(--ok)}
.ccTipo.estorno{background:var(--warn-soft);color:var(--warn)}
.ccPed{display:grid;grid-template-columns:minmax(0,1.3fr) 110px 110px 110px 190px;gap:10px;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--rule-2);font-size:13px}
.ccPed:last-child{border-bottom:0}
.ccPed.cab{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;background:var(--surface-2)}
.ccPed .n{text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px}
.ccPed select{width:100%}
.ccPrev{max-height:260px;overflow:auto;border:1px solid var(--rule);border-radius:4px;margin:8px 0}
.ccPrev .ccLin{grid-template-columns:86px minmax(0,1fr) 110px}
.ccPrev .ruim{background:var(--crit-soft)}
@media (max-width:700px){
  .ccLin{grid-template-columns:78px minmax(0,1fr) auto;row-gap:2px}
  .ccLin .s{grid-column:2;text-align:left;font-size:11.5px;color:var(--ink-3)}
  .ccLin .s::before{content:'saldo '}
  .ccLin .a{grid-column:3}
  .ccLin.cab{display:none}
  /* S46 · no celular a linha de seis vira quatro faixas: data · nome · valor
     em cima; descrição; chips; e os botões em fila, de ponta a ponta. */
  .ccLin.fin6{grid-template-columns:78px minmax(0,1fr) auto}
  .ccLin.fin6 .n.v{grid-column:3;grid-row:1}

/* S32 · item 3: o crachá virou o atalho para "Meu perfil". Ele continua
   parecendo texto — só o hover e o foco dizem que é clicável. Botão desenhado
   como botão aqui competiria com "Nova OS" e "Atualizar", que são as ações da
   barra; este é um caminho, não uma ação. */
.crachaEu:hover b{color:var(--accent-ink)}

/* ── quadro ───────────────────────────────────────── */
/* O quadro kanban rola na horizontal; as telas de lista rolam na vertical.
   Por isso a altura é calculada, não 100%: com `height:100%` numa página que
   agora rola, o quadro ficava com a altura da janela e as colunas cortadas. */
main{flex:1;overflow-x:auto;padding:16px 18px;min-height:calc(100vh - var(--header-h))}
main.rolaY{overflow-y:auto}
.board{display:flex;gap:10px;align-items:stretch;min-width:min-content;
  height:calc(100vh - var(--header-h) - 32px)}
.board.livre{display:block;height:auto;min-width:0}

/* ── S25: nos QUADROS a página não rola; quem rola é o <main>, e só de lado ──
   Até o S24 a altura do quadro era a conta `100vh − 54 − 32`. A conta fechava
   exata — e mesmo assim sobrava: a barra de rolagem HORIZONTAL do <main> (15 a
   17 px no Windows) é somada POR FORA dela. A página ganhava 15 px de rolagem
   vertical e a barra ficava logo abaixo da borda da janela: para rolar para o
   lado, era preciso primeiro rolar para baixo (item 1). E a roda do mouse
   subia a página inteira esses 15 px, levando o cabeçalho das colunas junto
   (item 2) — os cards já rolavam dentro da coluna, era a página que se mexia.
   Nos quatro quadros, Comercial incluído.
   ⚠ Não dá para ver no Chromium automático: ele esconde as barras. O parecer
   de 09/09 mediu assim e concluiu que cabia. Medir com as barras VISÍVEIS.
   Agora, em modo quadro (`body.emQuadro`, posto pelo irPara): o app tem a
   altura exata da janela, o <main> ocupa o que sobra DEPOIS do topo (e da
   faixa de demo, se houver) e a barra horizontal mora dentro dele — sempre
   no pé da janela, sempre visível. `flex:1 1 0` com a altura do pai definida
   é o que torna a altura do <main> "definida" para o `height:100%` do quadro;
   com o `min-height:100vh` antigo no .app ela não era, e o quadro caía para
   a altura do conteúdo. As telas de lista não entram aqui. */
body.emQuadro main{flex:1 1 0;min-height:0;overflow-x:auto;overflow-y:hidden}
body.emQuadro .board:not(.livre){height:100%}
.col{
  flex:0 0 264px; display:flex; flex-direction:column; height:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:4px;
}
.col.vazia{opacity:.62}
.col.campo{border-top:3px solid var(--campo)}
.col.gestao{border-top:3px solid var(--gestao)}
.col.forn{border-top:3px solid var(--forn)}

/* ── aviso de cliente parecido / revisão de duplicados ───────────────── */
.parecidos{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.parecidoLinha{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 10px;flex-wrap:wrap}
.parecidoLinha .pn{font-weight:600;font-size:13.5px}
.parecidoLinha .pd{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-3)}
.parecidoLinha .chip{margin-left:auto}
.opcoes{display:flex;flex-direction:column;gap:2px}
.selo{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;white-space:nowrap}
.selo.risco{background:var(--warn-soft);color:var(--warn)}
.selo.grave{background:var(--crit-soft);color:var(--crit)}
/* S29 itens 5 e 7 */
.selo.aprov{background:var(--accent-soft);color:var(--accent-ink)}
.planosTbl td.pd{font-size:12px;color:var(--ink-2);min-width:180px}
.selo.naoaprov{background:var(--crit-soft);color:var(--crit)}

/* ── card ─────────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;
  border-left:3px solid var(--rule); text-align:left; width:100%; display:block;
}
.card:hover{box-shadow:var(--sh-lift);border-left-color:var(--accent)}
.card.travada{border-left-color:var(--crit)}
.card.atrasada{border-left-color:var(--warn)}
.chip{
  font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:2px;
  background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2);white-space:nowrap;
}
.chip.prog{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.travada{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* Atraso é vermelho, risco é âmbar. Eram idênticos, e no card "5d de atraso"
   ficava com a mesma cor de "faltam 2d" — dois fatos diferentes, um só sinal.
   O Field usa as mesmas duas cores para os mesmos dois fatos. */
.chip.atras{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.lock{background:var(--gestao-soft);color:var(--gestao);border-color:transparent}
.chip.urg{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.altaP{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.risco{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* S34: serviço do NR-13 já vencido. A mesma cor de atraso, pelo mesmo motivo:
   é prazo que passou, não risco de passar. */
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* A borda esquerda diz a SITUAÇÃO (o pior dos dois relógios). A urgência é
   chip, não borda: se as duas coisas usassem a mesma cor, uma OS urgente no
   prazo ficaria igual a uma OS normal atrasada — e são problemas diferentes. */
.card.sit-atrasada{border-left-color:var(--crit)}
.card.sit-risco{border-left-color:var(--warn)}
/* ⚠ Estas DUAS últimas vêm depois de propósito: `travada` e `atrasada` são
   estados mais graves que "risco de prazo", e como a especificidade é a mesma
   quem estiver por último no arquivo vence. Antes, uma OS TRAVADA com prazo a
   dois dias ficava âmbar — a borda mentia. */
.card.atrasada{border-left-color:var(--warn)}
.card.travada{border-left-color:var(--crit)}
.card.urgente{box-shadow:inset 3px 0 0 -1px var(--crit), var(--shadow)}

/* ── faixa de prazo e prioridade na gaveta ─────────────────────────────── */

/* ── agenda da equipe ──────────────────────────────────────────────────── */

/* ── S42 · RECURSOS HUMANOS ─────────────────────────────────────────────────

/* ── configurações ────────────────────────────────── */
/* formulário de cadastro de pessoa: fica aberto, não escondido atrás de botão */
.aviso.ok .btn.mini{margin-left:8px;vertical-align:baseline}
.mini{font-size:13px;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;
  background:var(--surface);max-width:190px}
button.mini{padding:6px 12px;font-weight:600}
.aviso.ok{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:7px 9px;border-bottom:1px solid var(--rule)}
.tab td{padding:8px 9px;border-bottom:1px solid var(--rule-2)}

/* ── comercial ────────────────────────────────────── */
/* S50 · item 3 (Bruno, 07/10): a barra também diz "em dia" e "lead esquecido".
   · verde — 0 a 5 dias sem interação, a mesma faixa do selo. O selo verde é
     fundo claro (#D9F2E1) com texto #135C2E; a 4 px o tom claro some na
     borda do card, então a barra usa o verde do sistema (--ok), entre os dois.
   · fúcsia — lead no alerta "Lead sem contato" (o MESMO conjunto do número do
     menu e do filtro rápido). Distinto do vermelho #D0201A, do amarelo
     #F2B400, do verde e do roxo da venda adicional #7A5AB8. Branco sobre
     #B3166F: 6,1:1 (AA). */
/* S41 · item 8: a observação curta do negócio, logo abaixo da logomarca.
   Uma linha, cortada com reticências — o texto inteiro vai no title e na aba
   Cliente. Menor e mais clara que o nome do cliente: complementa, não compete. */
/* S41 · item 5: o total da coluna, SEMPRE na segunda linha do cabeçalho —
   mesma altura em todas as colunas, com valor grande ou pequeno. */
/* S41 · e a descrição da coluna passa a reservar TRÊS linhas: com duas, as
   colunas de texto mais longo ("Em conferência", "Entrega / Pós venda")
   empurravam os cards 8 px para baixo, e o topo dos cards não alinhava. */
/* ⚠ a coluna é flex vertical com altura fixa: sem `flex:0 0 auto` o navegador
   ENCOLHE o cabeçalho quando a coluna tem muitos cards (medido: o total
   caía de 18 para 14 px e cortava o texto). Quem rola é só o corpo. */
/* S41 · item 7: a marca de reagendamento e o aviso de atrasadas */
.mini.reag,.chip.reag{background:#EEE7F7;color:#4B2E83}
.chip.atrasoDia{background:var(--crit-soft);color:var(--crit);border-color:transparent}
/* S42 · S9: só leitura */
/* O quadrado da logo: com imagem ou com as iniciais, o tamanho é o mesmo —
   é o que mantém o card do mesmo tamanho antes e depois de a foto chegar. */
.logoCli{display:grid;place-items:center;overflow:hidden;border-radius:3px;flex:0 0 auto;
  background:hsl(var(--h,210) 38% 93%);color:hsl(var(--h,210) 42% 30%)}
.logoCli i{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.02em}
.card .cli{display:flex;align-items:center;gap:7px}

/* ── ITEM 1 (S32): A LOGOMARCA COMO FAIXA NO TOPO DO CARD ────────────────────
   O pedido: a logo é o jeito mais rápido de reconhecer o cliente, e ela estava
   pequena demais (22px) ao lado do número para cumprir esse papel. Vira faixa
   na largura do card, com número e nome embaixo.

   ⚠ A MEDIDA É A ALTURA, EM PIXELS, E NUNCA EM PORCENTAGEM. Dentro de um
   grid com `place-items:center` a altura percentual NÃO RESOLVE: nem
   `height:100%` nem `max-height:100%`. A imagem volta ao tamanho natural, e
   uma logo quadrada de 128px vazava a faixa e saía CORTADA pelo
   `overflow:hidden` — metade da marca some, e o card fica pior do que estava
   antes deste item. Medido no navegador, não deduzido: com `max-height:100%`,
   uma imagem de 128×128 renderizava 128×128 dentro de uma caixa de 218×52.
   Por isso a altura mora em `--faixaH` e vai para os dois lugares em px.

   Com `max-height` em px e `width:auto`, a logo encolhe para caber na altura
   da faixa e NUNCA é ampliada. A miniatura que o quadro carrega tem 128px no
   maior lado (`enviarLogoCliente`) — é o que mantém a carga leve com dezenas
   de clientes de uma vez. Com a logo do print (NANSEN, ~2:1) ela vira 104×52:
   ainda uma REDUÇÃO, nítida. Esticar na LARGURA do card (~300px), como a
   palavra "faixa" do pedido sugeria, seria ampliar 2,3× uma imagem de 128px —
   e logo borrada identifica pior que logo pequena, que é justamente o defeito
   que este item veio corrigir.

   A partir do S32 a miniatura nova sai com 256px, que é o que deixa a faixa
   nítida também em tela retina; quem já tem logo cadastrada continua com a de
   128 até alguém reenviar pelo "Trocar" na ficha — e continua legível, só
   menos fina. */
/* Com imagem, o fundo da faixa é BRANCO — a miniatura é JPEG de fundo branco
   (PNG transparente virando JPEG ganha fundo preto, por isso ela é assim
   desde o S17). Deixar o fundo azulado atrás dela punha um retângulo branco
   dentro de uma faixa colorida, que é o efeito de adesivo que o print do
   Trello não tem. Sem imagem, as iniciais mantêm a cor do cliente. */
/* Sem logo, as iniciais ocupam a mesma faixa — o card não muda de altura

/* A rede é do núcleo; o ponto verde/vermelho da barra é daqui. Erro de negócio
   (o banco recusou) não derruba o verde — igual ao Manager. */
const _conn = p => p.then(r => { if (!conectado) setConn('ok', 'Conectado'); return r; },
                          e => { if (!e || !e.negocio) setConn('off', 'Sem conexão'); throw e; });
const req = (c, o) => _conn(Nucleo.api.req(c, o));
const get = q      => _conn(Nucleo.api.get(q));
const rpc = (f, p) => _conn(Nucleo.api.rpc(f, p));

/* A sessão é a do núcleo (localStorage tf_sessao), lida a cada uso: quem
   renova o token é o Nucleo.api, e aqui nunca fica uma cópia velha. */

  const s = (window.Nucleo && typeof Nucleo.sessao === 'function') ? (Nucleo.sessao() || {}) : {};
  return DEMO ? ({ nome:'Modo demo', perfil:'admin', admin:true })[k] : s[k];

function setConn(estado, texto){

let EQUIPE = [];

const NOMES = {};

let TURNO = { capacidade_min: 540, dias_uteis: [1,2,3,4,5] };

async function carregarEquipe(){
  if (DEMO){
    EQUIPE = [{ id:'u1', nome:'Escritório 1', executa_em:'adm' },
              { id:'u2', nome:'Escritório 2', executa_em:'adm' },
              { id:'u3', nome:'Inspetor 1', executa_em:'campo' },
              { id:'u4', nome:'Inspetor 2', executa_em:'campo' }];
    EQUIPE.forEach(u => NOMES[u.id] = u.nome);
    return;
  }
  try{
    const [us, tn, td] = await Promise.all([
      get('usuarios?select=id,nome,perfil_id,perfis(executa_em)&ativo=is.true&order=nome'),
      get('parametros_turno?select=*&id=eq.GLOBAL').catch(() => []),
      // S29: o turno é POR DIA DA SEMANA. Sem a tabela (SQL 51 não rodou), a
      // tela cai no turno único de antes em vez de ficar sem capacidade.
      get('turno_dias?select=*&order=dia_semana').catch(() => null)
    ]);
    EQUIPE = (us || []).map(u => ({
      id:u.id, nome:u.nome, perfil:u.perfil_id,
      executa_em: (u.perfis && u.perfis.executa_em) || 'adm'
    }));
    EQUIPE.forEach(u => NOMES[u.id] = u.nome);
    if (tn && tn.length){
      const t = tn[0];
      const min = (h) => { const p = String(h||'').split(':'); return (+p[0]||0)*60 + (+p[1]||0); };
      TURNO = {
        capacidade_min: Math.max(0, min(t.turno_fim) - min(t.turno_inicio) - (t.intervalo_min||0)),
        dias_uteis: t.dias_uteis || [1,2,3,4,5],
        turno_inicio: t.turno_inicio, turno_fim: t.turno_fim, intervalo_min: t.intervalo_min
      };
    }
    if (td && td.length) aplicarTurnoDias(td);
  }catch(e){ console.warn('[equipe]', e.message); }
}

const _minDe = h => { const p = String(h||'').split(':'); return (+p[0]||0)*60 + (+p[1]||0); };

function aplicarTurnoDias(td){
  const dias = {};
  td.forEach(d => {
    const cap = Math.max(0, _minDe(d.fim) - _minDe(d.inicio) - (Number(d.intervalo_min) || 0));
    dias[Number(d.dia_semana)] = { ativo: !!d.ativo, cap: d.ativo ? cap : 0,
      inicio: d.inicio, fim: d.fim, intervalo_min: Number(d.intervalo_min) || 0 };
  });
  const uteis = Object.keys(dias).map(Number).filter(k => dias[k].ativo).sort((a,b) => a-b);
  const freq = {};
  uteis.forEach(k => { freq[dias[k].cap] = (freq[dias[k].cap] || 0) + 1; });
  const tipico = Object.keys(freq).map(Number)
    .sort((a,b) => (freq[b] - freq[a]) || (b - a))[0];
  TURNO = Object.assign({}, TURNO, { dias, dias_uteis: uteis.length ? uteis : [1,2,3,4,5],
                                     capacidade_min: tipico || TURNO.capacidade_min || 480,
                                     porDia: true });
}

let _jszip = null;

function carregarJSZip(){
  if (_jszip) return _jszip;
  _jszip = new Promise((ok, err) => {
    if (window.JSZip) return ok(window.JSZip);
    const s2 = document.createElement('script');
    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s2.onload  = () => window.JSZip ? ok(window.JSZip)
      : err(new Error('A biblioteca de .docx carregou, mas não inicializou.'));
    s2.onerror = () => err(new Error('Não consegui baixar a biblioteca de .docx. Sem internet?'));
    document.head.appendChild(s2);
  });
  return _jszip;
}

async function ccTrocarAcerto(p, sel){
  const novo = sel.value;
  const txt = novo === 'abater_divida'
    ? 'O pedido <b>' + esc(p.numero) + '</b> passa a <b>abater da dívida</b>. '
      + (Number(p.valor_recebido) ? 'O que já chegou (' + esc(BRL(p.valor_recebido)) + ') entra no extrato agora; ' : '')
      + 'o resto entra quando chegar.'
    : 'O pedido <b>' + esc(p.numero) + '</b> passa a <b>Engetap paga</b>. '
      + (Number(p.abatido) ? 'O que já foi abatido (' + esc(BRL(p.abatido)) + ') é estornado no extrato.' : '');
  const ok = await confirmar('Trocar o acerto do pedido', '<p>' + txt + '</p>', 'Trocar');
  if (!ok){ sel.value = p.acerto; return; }
  try{
    if (!DEMO) await rpc('tf_cc_definir_acerto', { p_documento_id: p.id, p_acerto: novo });
    toast('Acerto do pedido ' + p.numero + ' trocado.', 'ok');
    pintarContaCorrente();
  }catch(e){ sel.value = p.acerto; toast(e.message, 'err'); }
}

function ccNovoLancamento(){
  abrirModal('Novo lançamento',
      '<div class="campo"><label for="ccTp">O que aconteceu</label><select id="ccTp">'
    +   '<option value="historico">Valor antigo (histórico)</option>'
    +   '<option value="aumento">A dívida da Proper aumentou</option>'
    +   '<option value="pagamento">A Proper pagou</option>'
    +   '<option value="ajuste">Ajuste (ex.: diferença da nota)</option></select></div>'
    + '<div class="campo" id="ccSentCx"><label>Sentido</label>'
    +   '<label class="chk" style="margin:0 0 4px"><input type="radio" name="ccSent" value="1" checked> Aumenta a dívida da Proper</label>'
    +   '<label class="chk" style="margin:0"><input type="radio" name="ccSent" value="-1"> Diminui a dívida da Proper</label></div>'
    + '<div class="campo"><label for="ccDt">Data</label><input id="ccDt" type="date" value="' + isoHoje() + '" max="' + isoHoje() + '"></div>'
    + '<div class="campo"><label for="ccVl">Valor (R$)</label><input id="ccVl" type="text" inputmode="decimal" placeholder="ex.: 1.250,00" data-valor="moeda"></div>'
    + '<div class="campo"><label for="ccDs">Descrição</label><input id="ccDs" type="text" maxlength="300" placeholder="ex.: PIX recebido da Proper"></div>'
    + '<p class="nota" id="ccMsg" style="color:var(--crit)"></p>',
    [ { label:'Cancelar', onClick: fecharModal },
      { label:'Lançar', pri:true, onClick: async () => {
          const tp = document.getElementById('ccTp').value;
          const msg = document.getElementById('ccMsg'); msg.style.color = '';
          const vlTxt = document.getElementById('ccVl').value;
          let v = ccValor(vlTxt);
          if (!vlTxt.trim()){ msg.textContent = 'Informe o valor.'; return; }
          if (!isFinite(v) || !v){ msg.textContent = 'O valor não é um número: use vírgula nos centavos (ex.: 1.250,00).'; return; }
          v = Math.abs(v);
          if (tp === 'pagamento') v = -v;
          else if (tp !== 'aumento'){
            const sent = (document.querySelector('input[name=ccSent]:checked') || {}).value;
            v = v * Number(sent || 1);
          }
          const dt = document.getElementById('ccDt').value;
          const ds = document.getElementById('ccDs').value.trim();
          if (!dt){ msg.textContent = 'Informe a data.'; return; }
          if (!ds){ msg.textContent = 'Descreva o lançamento.'; return; }
          // F25 (issue 189): o valor por extenso antes de gravar; o 2º toque em "Lançar" confirma
          const assin = [tp, v, dt, ds].join('|');
          if (ccNovoLancamento._conf !== assin){
            ccNovoLancamento._conf = assin;
            msg.style.color = 'var(--ink)';
            msg.textContent = 'Lançar ' + ccSinal(v) + ' em ' + dataBR(dt) + '? Toque em «Lançar» de novo para confirmar.';
            return;
          }
          ccNovoLancamento._conf = null;
          try{
            if (!DEMO) await rpc('tf_cc_lancar', { p_data: dt, p_tipo: tp, p_valor: v, p_descricao: ds });
            fecharModal(); toast('Lançado: ' + ccSinal(v) + '.', 'ok'); pintarContaCorrente();
          }catch(e){ msg.style.color = ''; msg.textContent = e.message; }
      } } ]);
  ccNovoLancamento._conf = null;
  const tp = document.getElementById('ccTp');
  const acerta = () => { document.getElementById('ccSentCx').hidden = tp.value === 'aumento' || tp.value === 'pagamento'; };
  tp.addEventListener('change', acerta); acerta();
  // mudou qualquer campo: a confirmação volta a ser pedida (F25 · issue 189)
  ['ccTp','ccDt','ccVl','ccDs'].forEach(id => document.getElementById(id).addEventListener('input', () => {
    ccNovoLancamento._conf = null; const m = document.getElementById('ccMsg'); m.style.color = ''; m.textContent = ''; }));
  document.querySelectorAll('input[name=ccSent]').forEach(r => r.addEventListener('change', () => { ccNovoLancamento._conf = null; document.getElementById('ccMsg').textContent = ''; }));
}

function ccEstornar(l){

async function ccLerPlanilha(file){
  const nome = (file.name || '').toLowerCase();
  let linhas;
  if (nome.endsWith('.csv') || nome.endsWith('.txt')) linhas = _lerCSV(await file.text());
  else if (nome.endsWith('.xlsx')) linhas = await _lerXLSX(file);
  else throw new Error('Use .xlsx ou .csv. (.xls antigo: abra no Excel e salve como .xlsx.)');

  let iCab = -1, m = null;
  for (let i = 0; i < Math.min(linhas.length, 30); i++){   // F25: 30 (as linhas vazias agora contam)
    const c = {};
    (linhas[i] || []).forEach((cel, j) => {
      const n = _twNorm(cel);
      if (!n) return;
      if (c.data == null && /^data\b/.test(n)) c.data = j;
      else if (c.desc == null && /(descri|historico|motivo|lancamento)/.test(n)) c.desc = j;
      else if (c.valor == null && /^valor/.test(n)) c.valor = j;
    });
    if (c.data != null && c.desc != null && c.valor != null){ iCab = i; m = c; break; }
  }
  if (iCab < 0) throw new Error('Não achei as colunas Data, Descrição e Valor na planilha. '
    + 'Renomeie o cabeçalho para esses três nomes e tente de novo.');

  const itens = [];
  for (let i = iCab + 1; i < linhas.length; i++){
    const r = linhas[i] || [];
    const vazio = [r[m.data], r[m.desc], r[m.valor]].every(x => x == null || String(x).trim() === '');
    if (vazio) continue;
    const data = _twData(r[m.data]);
    const valor = ccValor(r[m.valor]);
    const descricao = String(r[m.desc] == null ? '' : r[m.desc]).trim();
    // F25 (issue 189): valor escrito como texto, sem vírgula e com ponto ("1.250" ou "12.5"): destacar como foi lido
    const vDet = typeof r[m.valor] === 'string' ? Nucleo.util.lerValorDetalhe(r[m.valor]) : {};
    const confira = (vDet.milharSemVirgula || vDet.pontoDecimal) ? 'veio "' + String(r[m.valor]).trim() + '" sem vírgula: lido como ' + BRL(valor) + ' — confira' : '';
    const prob = [];
    if (!data) prob.push('data ilegível');
    else if (data > isoHoje()) prob.push('data no futuro');
    if (!isFinite(valor) || !valor) prob.push('valor ilegível ou zero');
    if (!descricao) prob.push('sem descrição');
    itens.push({ linha: i + 1, data, valor: isFinite(valor) ? Math.round(valor * 100) / 100 : null, descricao, prob, confira });
  }
  return itens;
}

const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const _twNorm = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function _twSerialParaISO(n){
  const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
  if (!isFinite(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

function _twData(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' || /^\d+([.,]\d+)?$/.test(String(v).trim())){
    const n = Number(String(v).replace(',', '.'));
    // 20000 ≈ 1954, 80000 ≈ 2119: fora disso não é data, é outra coisa
    if (n >= 20000 && n <= 80000) return _twSerialParaISO(n);
    return undefined;
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m){
    const a = m[3].length === 2 ? '20' + m[3] : m[3];
    return a + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[1]).padStart(2,'0');
  }
  return undefined;
}

/** F25 (issue 146): o leitor de .xlsx é o do núcleo (a célula vazia formatada não leva mais o valor da vizinha). */
async function _lerXLSX(file){

function _lerCSV(texto){
  const t = texto.replace(/^﻿/, '');
  // S40: as 10 primeiras linhas, não só a 1ª — planilha com título em cima
  // ("Controle da dívida Proper") não tem separador nenhum na linha 1, e o
  // arquivo inteiro era lido com vírgula
  const prim = t.split(/\r?\n/).slice(0, 10).join('\n');
  const sep = (prim.split(';').length > prim.split(',').length) ? ';' : ',';
  const linhas = [];
  let campo = '', linha = [], aspas = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (aspas){
      if (ch === '"' && t[i+1] === '"'){ campo += '"'; i++; }
      else if (ch === '"') aspas = false;
      else campo += ch;
    } else if (ch === '"') aspas = true;
    else if (ch === sep){ linha.push(campo); campo = ''; }
    else if (ch === '\n'){ linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else if (ch !== '\r') campo += ch;
  }
  if (campo !== '' || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas;
}

const finLinkCad = ir => '../cadastros/?ir=' + encodeURIComponent(ir) + '&area=tapfin';

function irPara(v, sit){
  if (v === 'sair'){ sairDaConta(); return; }
  if (sit && /^[a-z_]{2,20}$/.test(sit)) FIN_SIT_ENTRADA = { tela: v, sit: sit };   // F31 · 188: o botão do Painel escolhe a situação
  const lk = NAV.reduce((a, g) => a.concat(g.itens || []), []).find(i => i.v === v && i.link);
  if (lk){ location.href = finLinkCad(lk.link); return; }
  if (v === 'hub'){ location.href = NO_SERVIDOR ? '../' : '#'; return; }
  // tela que a pessoa não abre (ou endereço colado): cai na primeira que ela abre
  const visiveis = navVisivel().reduce((a,g) => a.concat(g.itens), []).filter(i => i.v !== 'hub' && i.v !== 'sair');
  if (!visiveis.some(i => i.v === v)){
    if (!visiveis.length){ semAcesso(); return; }
    v = visiveis[0].v;
  }
  visao = v;
  document.querySelectorAll('.nav-item').forEach(b => {
    const ativo = b.dataset.v === v;
    b.classList.toggle('on', ativo);
    if (ativo) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const g = GRUPO_DE[v];
  document.getElementById('crumbGrupo').textContent =
    g ? g.charAt(0) + g.slice(1).toLowerCase() : 'Financeiro';
  document.getElementById('crumbAtual').textContent = ROTULO[v] || v;
  document.body.classList.remove('navAberta');

  const bu = document.getElementById('tbBusca');
  if (bu.value !== (BUSCA[v] || '')) bu.value = BUSCA[v] || '';   // F13 · não mexe no que está sendo digitado
  bu.placeholder = PLACEHOLDER_BUSCA[v] || 'Buscar nesta tela…';
  bu.disabled = !PLACEHOLDER_BUSCA[v];
  bu.style.visibility = PLACEHOLDER_BUSCA[v] ? '' : 'hidden';

  // o Financeiro é todo de lista: rola na vertical
  document.getElementById('board').classList.add('livre');
  document.querySelector('main').classList.add('rolaY');
  document.body.classList.remove('emQuadro');

  if (v === 'ccp') return pintarContaCorrente();
  if (v === 'ffor') return pintarFornecedores();
  if (v === 'finb') return pintarContasBancarias();
  if (v === 'finrsv') return pintarReservas();
  if (v === 'fincat') return pintarCategorias();
  if (v === 'findes') return pintarDeslocamento();
  if (v === 'finre') return pintarContasReceber();
  if (v === 'finpg') return pintarContasPagar();
  if (v === 'finrec') return pintarRecorrentes();
  if (v === 'finprz') return pintarPrazosFin();
  if (v === 'fincar') return pintarCartoes();
  if (v === 'finp') return pintarPainelFin();
  if (v === 'fincr') return pintarProjecoes();
  if (v === 'finrl') return pintarRelatoriosFin();
  return pintarPainelFin();
}

function casa(texto, q){
  if (!q) return true;
  const t = norm(texto);
  return norm(q).split(/\s+/).filter(Boolean).every(p => t.includes(p));
}

let _buscaT = null;

function ligarBusca(){
  const el = document.getElementById('tbBusca');
  el.addEventListener('input', () => {
    BUSCA[visao] = el.value;
    clearTimeout(_buscaT);
    _buscaT = setTimeout(() => {
      const foco = document.activeElement === el;
      // repinta sem ir à rede quando a tela sabe filtrar sozinha
      if (REPINTA[visao]) REPINTA[visao]();
      else irPara(visao);
      // F13 · só devolve o foco se o redesenho o tirou, e com o cursor no fim do que está escrito AGORA
      // (guardar a posição antes e devolvê-la depois embaralha as letras de quem digita rápido)
      if (foco){ const n = document.getElementById('tbBusca');
        if (n && document.activeElement !== n){ const pos = n.value.length; n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
    }, 140);
  });
  // Esc limpa a busca sem tirar a mão do teclado
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape' && el.value){ e.stopPropagation(); el.value = ''; BUSCA[visao] = ''; irPara(visao); }
  });
}

document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
  const el = document.getElementById('tbBusca');
  if (el && !el.disabled){ e.preventDefault(); el.focus(); el.select(); }
});

const FIN_MES_CURTO = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const finR2 = v => Math.round((Number(v) || 0) * 100) / 100;
function finSintesePlanilha(d, ini, fim){
  const det = d.detalhe || [];
  const linhasDe = tp => det.filter(x => x.tipo === tp).map(x => [x.grupo_nome || '—', x.subcategoria_nome || '(sem subcategoria)', finR2(x.total)]);
  return { titulo: 'Sintese', periodo: dataBR(ini) + ' a ' + dataBR(fim), blocos: [
    { titulo: 'Resumo', colunas: ['Período', 'Receitas', 'Despesas', 'Resultado'],
      linhas: [[dataBR(ini) + ' a ' + dataBR(fim), finR2(d.receita_total), finR2(d.despesa_total), finR2(d.resultado)]], moedaSemTotal: [1, 2, 3] },
    { titulo: 'Receitas', colunas: ['Grupo', 'Subcategoria', 'Total'], linhas: linhasDe('r'), moeda: [2] },
    { titulo: 'Despesas', colunas: ['Grupo', 'Subcategoria', 'Total'], linhas: linhasDe('p'), moeda: [2] }] };
}
function finDrePlanilha(u){
  const cols = ['Grupo', 'Subcategoria'].concat(FIN_MES_CURTO, ['Total do ano']);
  const din = Array.from({ length: 13 }, (_, i) => i + 2);
  const blocos = [];
  if (u.c){
    const lin = tp => (u.c.linhas || []).filter(l => l.tipo === tp).map(l => [l.grupo, l.sub || '(sem subcategoria)'].concat((l.meses || []).map(finR2), [finR2(l.total)]));
    blocos.push({ titulo: 'Receitas', colunas: cols, linhas: lin('r'), moeda: din });
    blocos.push({ titulo: 'Despesas', colunas: cols, linhas: lin('p'), moeda: din });
  }
  blocos.push({ titulo: 'Resultado', colunas: ['Mês', 'Receitas', 'Despesas', 'Resultado'],
    linhas: (u.d.meses || []).map(m => [FIN_MES_CURTO[m.mes - 1] + '/' + u.ano, finR2(m.receitas), finR2(m.despesas), finR2(Number(m.receitas) - Number(m.despesas))]),
    moeda: [1, 2, 3] });
  return { titulo: 'Resultado por categoria', periodo: String(u.ano), blocos };
}
/* O ano por grupo e subcategoria: linha = categoria, coluna = mês, total do ano; pelo caixa (a data da baixa), como o DRE.
   Rola para o lado dentro do quadro (as 14 colunas não cabem no celular); o nome da categoria fica preso à esquerda. */
function finDreCategoriasHtml(c){
  const L = c.linhas || [];
  const cab = '<tr><th>Categoria</th>' + FIN_MES_CURTO.map(m => '<th class="n">' + m + '</th>').join('') + '<th class="n">Total</th></tr>';
  const lin = l => '<tr><td>' + esc(l.grupo) + (l.sub ? ' / ' + esc(l.sub) : ' <small style="color:var(--ink-3)">(sem subcategoria)</small>') + '</td>'
    + (l.meses || []).map(v => '<td class="n">' + (Number(v) ? esc(BRL(v)) : '<span style="color:var(--ink-3)">—</span>') + '</td>').join('')
    + '<td class="n"><b>' + esc(BRL(l.total)) + '</b></td></tr>';
  const soma = (arr) => '<td class="n"><b>' + esc(BRL((arr || []).reduce((s, v) => s + (Number(v) || 0), 0))) + '</b></td>';
  const tot = (rot, arr) => '<tr class="tot"><td><b>' + rot + '</b></td>' + (arr || []).map(v => '<td class="n"><b>' + esc(BRL(v)) + '</b></td>').join('') + soma(arr) + '</tr>';
  const res = (c.receitas || []).map((v, i) => finR2(Number(v) - Number((c.despesas || [])[i])));
  const bloco = (tp, rot, arr) => { const x = L.filter(l => l.tipo === tp);

// S188 · o Painel e as Projeções (pintarPainelFin, pintarProjecoes, fpm*, fpj*, fcr*) moram em nucleo/fin-painel.js (FP1)
function finpAnel(pct, cor){
  const pctDesenho = Math.max(0, Math.min(100, pct));
  const r = 42, c = 2 * Math.PI * r;
  const dash = (pctDesenho / 100) * c;
  return '<svg viewBox="0 0 100 100" style="width:112px;height:112px;flex:none">'
    + '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--rule)" stroke-width="10"></circle>'
    + '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + cor + '" stroke-width="10" stroke-linecap="round" '
    +   'stroke-dasharray="' + dash.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 50 50)"></circle>'
    + '<text x="50" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="' + cor + '">' + Math.round(pct) + '%</text>'
    + '<text x="50" y="61" text-anchor="middle" font-size="7.5" fill="var(--ink-3)">do previsto</text>'
    + '</svg>';
}

function finpCompLinha(c, cor){
  const atual = Number(c.atual) || 0, anterior = Number(c.anterior) || 0;
  const semNada = !atual && !anterior;
  const maxV = Math.max(atual, anterior, 1);
  const pctAtual = Math.min(100, (atual / maxV) * 100);
  const pctAnterior = Math.min(100, (anterior / maxV) * 100);
  const subiu = atual >= anterior;
  const variacao = anterior > 0 ? Math.abs((atual - anterior) / anterior * 100) : (atual > 0 ? 100 : 0);
  const rotuloVar = semNada ? 'sem lançamento' : (variacao.toFixed(0) + '% ' + (subiu ? '↑' : '↓'));
  return '<div style="margin-bottom:9px">'
    + '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'
    +   '<span>' + esc(c.rotulo) + '</span>'
    +   '<span style="color:var(--ink-3)">' + esc(rotuloVar) + '</span>'
    + '</div>'
    + '<div style="height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden;margin-bottom:2px">'
    +   '<div style="width:' + pctAtual.toFixed(1) + '%;height:100%;background:' + cor + '"></div></div>'
    + '<div style="height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden">'
    +   '<div style="width:' + pctAnterior.toFixed(1) + '%;height:100%;background:var(--ink-3);opacity:.45"></div></div>'
    + '</div>';
}

function finpCardMes(titulo, cor, realizado, previsto, comparativos){
  const pct = previsto > 0 ? (realizado / previsto * 100) : (realizado > 0 ? 100 : 0);
  const diferenca = previsto - realizado;
  const estourou = titulo === 'Despesas' && diferenca < 0;
  // S72 · sem orçamento (Categorias) não há "% do previsto" nem "acima": o anel fica vazio e a nota explica
  if (!(previsto > 0)) return '<div class="painel" style="padding:14px"><h3 style="margin-top:0">' + esc(titulo) + ' do mês</h3>'
    + '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px">' + finpAnel(0, cor).replace('0%', '—').replace('do previsto', 'sem previsto')
    + '<div><div style="font-size:21px;font-weight:700;color:' + cor + '">' + esc(BRL(realizado)) + '</div>'
    + '<div style="font-size:12.5px;color:var(--ink-3);margin-top:5px">' + (titulo === 'Despesas' ? 'Sem orçamento nas subcategorias: defina em <button class="fpmLk" type="button" data-ir="fincat">Categorias</button> para comparar.' : 'Nada com vencimento no mês.') + '</div></div></div>'
    + (!comparativos.length ? '' : '<p class="nota" style="margin:10px 0 6px;font-weight:600;color:var(--ink-2)">Mês anterior × atual</p>' + comparativos.map(c => finpCompLinha(c, cor)).join('')) + '</div>';
  const corDif = estourou ? 'var(--crit)' : cor;
  return '<div class="painel" style="padding:14px">'
    + '<h3 style="margin-top:0">' + esc(titulo) + ' do mês</h3>'
    + '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px">'
    +   finpAnel(pct, cor)
    +   '<div>'
    +     '<div style="font-size:21px;font-weight:700;color:' + cor + '">' + esc(BRL(realizado)) + '</div>'
    +     '<div style="font-size:12.5px;color:var(--ink-3);margin-top:5px">Previsto: <b style="color:var(--ink-2)">' + esc(BRL(previsto)) + '</b></div>'
    +     '<div style="font-size:12.5px;color:var(--ink-3)">Diferença: <b style="color:' + corDif + '">' + esc(BRL(Math.abs(diferenca))) + (estourou ? ' acima' : '') + '</b></div>'
    +   '</div>'
    + '</div>'
    + (!comparativos.length ? ''
        : '<p class="nota" style="margin:10px 0 6px;font-weight:600;color:var(--ink-2)">Mês anterior × atual</p>'
          + comparativos.map(c => finpCompLinha(c, cor)).join(''))
    + '</div>';
}

function finExtratoLinha(m, saldo){

        + '<span class="n menos">' + esc(ccSinal(Number(i.valor))) + '</span><span class="n finSx"></span></div>').join('') + '</details>';

    + (m.tipo === 'transf_conta' ? (m.estornado ? ' <small style="color:var(--ink-3)">· estornada</small>' : ' <button class="btn sm" type="button" data-estornatc="' + esc(m.id) + '">Estornar</button>') : '')   // S70
    + '</span>' + val + sx + '</div>';

/* F32 (issue 100): o saldo depois de cada lançamento, a partir do saldo inicial da conta (o que havia na data de corte),
   na ordem em que aconteceram (o servidor manda do mais novo para o mais velho). O estornado não muda o saldo (linha sem saldo).
   O filtro de período só esconde linhas: o saldo de cada uma continua o de verdade. `difere` avisa se a soma não chegou ao
   saldo atual que o banco calcula (não deveria acontecer). */
function finExtratoSaldos(r){
  const mv = r.movimentos || [];
  const saldos = new Array(mv.length);
  let s = Number(r.saldo_inicial) || 0;
  for (let i = mv.length - 1; i >= 0; i--){
    if (!mv[i].estornado) s = Math.round((s + (Number(mv[i].valor) || 0)) * 100) / 100;
    saldos[i] = mv[i].estornado ? null : s;
  }
  return { saldos, final: s, difere: Math.abs(s - (Number(r.saldo_atual) || 0)) > 0.005 };
}

/* O miolo do extrato, igual em Relatórios › Extrato Bancário e em Contas Bancárias › Ver extrato. P = { de, ate } ou null. */
function finExtratoHtml(r, P){
  const S = finExtratoSaldos(r);
  const todos = (r.movimentos || []).map((m, i) => ({ m, saldo: S.saldos[i] }));
  const dentro = x => !P || (String(x.m.data).slice(0, 10) >= P.de && String(x.m.data).slice(0, 10) <= P.ate);
  const mv = todos.filter(dentro);
  const vivos = mv.filter(x => !x.m.estornado);
  const entrou = vivos.reduce((s, x) => s + Math.max(0, Number(x.m.valor) || 0), 0);
  const saiu = vivos.reduce((s, x) => s + Math.max(0, -(Number(x.m.valor) || 0)), 0);
  return '<p class="nota" style="margin-top:0">Saldo atual: <b>' + esc(BRL(r.saldo_atual)) + '</b>'
    + (P ? ' · no período: entrou <b>' + esc(BRL(entrou)) + '</b>, saiu <b>' + esc(BRL(saiu)) + '</b>' : '') + '</p>'
    + finCorteNota(r)
    + (S.difere ? '<p class="nota" style="color:var(--crit)">A soma das linhas (' + esc(BRL(S.final)) + ') não chegou ao saldo atual. Confira com o extrato do banco e avise o administrador.</p>' : '')
    + (mv.length
        ? '<div class="ccLin finExt cab"><span>Data</span><span>Descrição</span><span class="n">Valor</span><span class="n finSx">Saldo</span></div>'
          + mv.map(x => finExtratoLinha(x.m, x.saldo)).join('')
        : '<p class="nota">' + (P && (r.movimentos || []).length ? 'Nenhuma movimentação neste período.' : 'Nenhuma movimentação lançada ainda.') + '</p>');
}

/* F32 (issue 92): o "Estornar" da transferência entre contas funciona nas duas telas (antes só na janela "Ver extrato").
   Dois cliques (sem a janela do navegador); depois, `depois()` redesenha. */
function finExtratoLigar(raiz, depois){
  raiz.querySelectorAll('[data-estornatc]').forEach(b => b.addEventListener('click', async () => {

    b.disabled = true;

  }));
}

/* F32 (issues 100 e 104): a primeira exportação do TapFin, pela regra da moeda (modulos/geral/front-end.md §7):
   no Excel, dinheiro é NÚMERO com o formato R$ (#.##0,00; soma no Excel), "DD/MM/AAAA" vira data, cabeçalho em negrito e
   fixo, e o total por FÓRMULA no fim de cada aba (só nas colunas `moeda`; `moedaSemTotal` = R$ sem total, como o saldo);
   no CSV, número com vírgula decimal, sem "R$", e ";" como separador. O .xlsx sai sem biblioteca nova: o JSZip que o
   TapFin já usa (o mesmo molde da relXLSX do TapFlow, que não é cópia: esta tem o `moedaSemTotal` e o nome do TapFin).
   m = { titulo, periodo, blocos: [{ titulo, colunas, linhas, numericas, moeda, moedaSemTotal }] } */
function finNomeArq(m, ext){
  const t = String((m.titulo || 'TapFin') + (m.periodo ? ' ' + m.periodo : '')).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80);
  return 'TapFin_' + (t || 'relatorio') + '.' + ext;
}
function finBaixarArq(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function finCSV(m){
  const blocos = (m.blocos || []).filter(b => b.linhas.length);
  if (!blocos.length){ toast('Nada para exportar.', 'err'); return; }
  const cel = v => { const t = String(v ?? ''); return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const num = v => (Math.round(Number(v) * 100) / 100).toFixed(2).replace('.', ',');
  const ehDin = (b, ci) => (b.moeda || []).includes(ci) || (b.moedaSemTotal || []).includes(ci);
  const out = [];
  blocos.forEach((b, bi) => {
    if (blocos.length > 1){ if (bi) out.push(''); out.push(cel(b.titulo)); }
    out.push(b.colunas.map(cel).join(';'));
    b.linhas.forEach(l => out.push(l.map((v, ci) => (typeof v === 'number' && isFinite(v))
      ? (ehDin(b, ci) ? num(v) : String(v).replace('.', ',')) : cel(v)).join(';')));
  });
  finBaixarArq(new Blob(['﻿' + out.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' }), finNomeArq(m, 'csv'));
}
async function finXLSX(m){
  const abas = (m.blocos || []).filter(b => b.linhas.length);
  if (!abas.length){ toast('Nada para exportar.', 'err'); return; }
  let JSZipLib;
  try{ JSZipLib = await carregarJSZip(); }
  catch(e){ toast('Não consegui preparar a planilha (sem internet?). O CSV funciona sem ela.', 'err'); return; }
  const zip = new JSZipLib();
  const esc_ = t => String(t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const col = n => { let t = ''; n++; while (n > 0){ const r = (n-1) % 26; t = String.fromCharCode(65+r) + t; n = Math.floor((n-1)/26); } return t; };
  const dataXL = v => {
    const x = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v ?? '').trim());
    if (!x) return null;
    const t = Date.UTC(+x[3], +x[2] - 1, +x[1]), d = new Date(t);
    if (isNaN(t) || d.getUTCDate() !== +x[1] || d.getUTCMonth() !== +x[2] - 1) return null;
    return Math.round((t - Date.UTC(1899, 11, 30)) / 864e5);
  };
  const ehNum = v => typeof v === 'number' && isFinite(v);
  const moedaTxt = v => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nomes = [];
  abas.forEach((b, i) => { let n = String(b.titulo || ('Aba ' + (i + 1))).replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 28) || ('Aba ' + (i + 1));
    while (nomes.includes(n)) n = n.slice(0, 25) + ' ' + (i + 1); nomes.push(n); });
  zip.file('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + abas.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i+1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + '</Types>');
  zip.folder('_rels').file('.rels',
    '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  const xl = zip.folder('xl');
  xl.file('workbook.xml',
    '<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
    + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + nomes.map((n, i) => '<sheet name="' + esc_(n) + '" sheetId="' + (i+1) + '" r:id="rId' + (i+1) + '"/>').join('')
    + '</sheets></workbook>');
  xl.folder('_rels').file('workbook.xml.rels',
    '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + abas.map((_, i) => '<Relationship Id="rId' + (i+1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i+1) + '.xml"/>').join('')
    + '<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  // estilos: 0 normal · 1 negrito · 2 R$ · 3 data · 4 (livre) · 5 R$ em negrito (o total)
  xl.file('styles.xml',
    '<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;R$ &quot;#,##0.00;\\-&quot;R$ &quot;#,##0.00"/>'
    + '<numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts>'
    + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
    + '<borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs>'
    + '<cellXfs count="6"><xf xfId="0"/><xf xfId="0" fontId="1" applyFont="1"/>'
    + '<xf xfId="0" numFmtId="164" applyNumberFormat="1"/><xf xfId="0" numFmtId="165" applyNumberFormat="1"/><xf xfId="0"/>'
    + '<xf xfId="0" numFmtId="164" fontId="1" applyFont="1" applyNumberFormat="1"/></cellXfs></styleSheet>');
  const ws = xl.folder('worksheets');
  abas.forEach((a, i) => {
    const moeda = a.moeda || [], semTot = a.moedaSemTotal || [], numericas = a.numericas || [];
    const larg = a.colunas.map(c => String(c).length);
    const mede = (ci, t) => { larg[ci] = Math.max(larg[ci], String(t).length); };
    const celula = (ref, v, ci) => {
      if ((moeda.includes(ci) || semTot.includes(ci)) && ehNum(v)){ mede(ci, moedaTxt(v)); return '<c r="' + ref + '" s="2"><v>' + v + '</v></c>'; }
      if (numericas.includes(ci) && ehNum(v)){ const n = Math.round(v * 10000) / 10000; mede(ci, String(n)); return '<c r="' + ref + '"><v>' + n + '</v></c>'; }
      const d = dataXL(v);
      if (d != null){ mede(ci, '00/00/0000'); return '<c r="' + ref + '" s="3"><v>' + d + '</v></c>'; }
      if (v === '' || v == null) return '';
      mede(ci, v);
      return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + esc_(v) + '</t></is></c>';
    };
    let xml = '<row r="1">' + a.colunas.map((c, ci) =>
      '<c r="' + col(ci) + '1" t="inlineStr" s="1"><is><t xml:space="preserve">' + esc_(c) + '</t></is></c>').join('') + '</row>';
    a.linhas.forEach((l, li) => { const r = li + 2; xml += '<row r="' + r + '">' + l.map((v, ci) => celula(col(ci) + r, v, ci)).join('') + '</row>'; });
    if (moeda.length){
      const r = a.linhas.length + 2, ult = r - 1;
      let t = '';
      a.colunas.forEach((_, ci) => {
        const ref = col(ci) + r;
        if (moeda.includes(ci)){
          const soma = a.linhas.reduce((x, l) => x + (ehNum(l[ci]) ? l[ci] : 0), 0);
          t += '<c r="' + ref + '" s="5"><f>SUM(' + col(ci) + '2:' + col(ci) + ult + ')</f><v>' + (Math.round(soma * 100) / 100) + '</v></c>';
        } else if (ci === 0) t += '<c r="' + ref + '" t="inlineStr" s="1"><is><t>Total</t></is></c>';
      });
      xml += '<row r="' + r + '">' + t + '</row>';
    }
    const cols = '<cols>' + larg.map((w, ci) => '<col min="' + (ci+1) + '" max="' + (ci+1) + '" width="' + Math.min(Math.max(w + 2, 8), 60) + '" customWidth="1"/>').join('') + '</cols>';
    ws.file('sheet' + (i+1) + '.xml',
      '<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      + cols + '<sheetData>' + xml + '</sheetData></worksheet>');
  });
  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  finBaixarArq(blob, finNomeArq(m, 'xlsx'));
}

/* F32 (issue 100): exportar o extrato (Excel ou CSV), para conferir com o do banco. A regra da moeda (front-end §7): no
   Excel o valor é número com o formato R$ e o total por fórmula; no CSV, vírgula decimal, sem "R$" e ";". As linhas do
   período, da mais velha para a mais nova (como o banco), com o saldo depois de cada uma; o estornado não sai (o banco não o tem). */
function finExtratoPlanilha(r, P){
  const S = finExtratoSaldos(r);
  const L = (r.movimentos || []).map((m, i) => ({ m, saldo: S.saldos[i] }))
    .filter(x => !x.m.estornado)   // o estornado não existe no extrato do banco: fica só na tela, riscado
    .filter(x => !P || (String(x.m.data).slice(0, 10) >= P.de && String(x.m.data).slice(0, 10) <= P.ate)).reverse();
  const linhas = L.map(x => [dataBR(x.m.data), String(x.m.descricao || ''), x.m.quem || '',
    Math.round((Number(x.m.valor) || 0) * 100) / 100, x.saldo]);
  const per = P ? dataBR(P.de) + ' a ' + dataBR(P.ate) : 'todo o período';
  return { titulo: 'Extrato ' + (r.nome || ''), periodo: per,
    blocos: [{ titulo: 'Extrato', colunas: ['Data', 'Descrição', 'De/para', 'Valor', 'Saldo depois'], linhas,
               numericas: [3, 4], moeda: [3], moedaSemTotal: [4] }] };
}

/* F32 (issue 100): a janela tem o mesmo filtro de período (os mesmos períodos do relatório, dentro da própria janela, para
   ela não fechar) e exporta. P guarda o período escolhido entre as recargas (o estorno redesenha a janela). */
const FIN_EXT_PER = ['todos', 'mes', 'mes_passado', 'ult30', 'ult90', 'ano', 'personalizado'];
async function modalExtratoConta(id, P){
  abrirModal('Extrato', '<p class="nota">Carregando…</p>', [{ label:'Fechar', pri:true, onClick: fecharModal }]);
  let r;
  try{ r = await rpc('tf_fin_conta_extrato', { p_conta_id: id }); }
  catch(e){ document.getElementById('mBody').innerHTML = '<p class="nota">' + esc(e.message) + '</p>'; return; }
  document.getElementById('mTit').textContent = 'Extrato — ' + r.nome;
  let per = P || null;
  const corpo = document.getElementById('mBody');
  corpo.innerHTML = '<div class="finExtBarra"><label for="mxPer" class="nota" style="margin:0">Período</label><select id="mxPer">'
    + FIN_PERIODOS.filter(([k]) => FIN_EXT_PER.includes(k)).map(([k, rot]) => '<option value="' + k + '"' + ((per ? per.chave : 'todos') === k ? ' selected' : '') + '>' + esc(rot) + '</option>').join('')
    + '</select><span id="mxPersonal" hidden><input id="mxDe" type="date" aria-label="De"> a <input id="mxAte" type="date" aria-label="Até"></span>'
    + '<span class="finRelAcoes"><button class="btn sm" type="button" id="mxXls">Exportar Excel</button> <button class="btn sm" type="button" id="mxCsv">Exportar CSV</button></span></div>'
    + '<div id="mxCorpo"></div>';
  const alvo = document.getElementById('mxCorpo');
  const pintar = () => { alvo.innerHTML = finExtratoHtml(r, per); finExtratoLigar(alvo, async () => { await modalExtratoConta(id, per); finbCarregar(); }); };
  const sel = document.getElementById('mxPer'), pe = document.getElementById('mxPersonal'), iDe = document.getElementById('mxDe'), iAte = document.getElementById('mxAte');
  if (per && per.chave === 'personalizado'){ pe.hidden = false; iDe.value = per.de; iAte.value = per.ate; }
  const aplicar = () => {
    const k = sel.value;
    pe.hidden = k !== 'personalizado';
    if (k === 'todos') per = null;
    else if (k === 'personalizado'){
      if (!iDe.value || !iAte.value){ return; }
      if (iDe.value > iAte.value){ toast('A data “De” é depois da “Até” — ajuste o período.', 'err'); return; }
      per = { campo: 'm', chave: k, de: iDe.value, ate: iAte.value };
    } else { const it = finPerIntervalo(k, false, true); per = { campo: 'm', chave: k, de: it.de, ate: it.ate }; }
    pintar();
  };
  sel.addEventListener('change', aplicar); iDe.addEventListener('change', aplicar); iAte.addEventListener('change', aplicar);
  document.getElementById('mxXls').addEventListener('click', e => _semDuploEnvio_(e.currentTarget, () => finXLSX(finExtratoPlanilha(r, per))));
  document.getElementById('mxCsv').addEventListener('click', e => _semDuploEnvio_(e.currentTarget, () => finCSV(finExtratoPlanilha(r, per))));
  pintar();
}

/* F31 (S209, issue 94): a tela das caixinhas. "+ Nova caixinha" (tf_fin_envelope_criar); em cada caixinha, "Ver movimentos"
   (tf_fin_envelope_movimentos: as reservas, os resgates e os pagamentos que saíram dela, com data, conta e quem lançou) e
