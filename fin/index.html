// ════════════════════════════════════════════════════════════════════════════
// F14 · A MEDIÇÃO DA OS COMUM NO TAPFIN (306 do TapFlow + 518; desenho
// processos/medicao-os-desenho.md). A equipe fecha a medição no celular; a 518
// faz dela o "aprovado" da OS. Aqui:
//  · Painel: as medições que pedem um olhar (`tf_osmed_avisos`): valor diferente
//    da proposta, algo a mais, aguardando assinatura há mais de 5 dias. Só aviso.
//  · Painel da OS (fin/?os=): "Medição fechada" no lugar de "Proposta aprovada",
//    com a assinatura; medição ainda em aberto = o aprovado continua a proposta.
// Sem a 306 no banco, nada aparece (as chamadas caem no catch).
// ════════════════════════════════════════════════════════════════════════════
const OSMED_AV = { valor_diferente: 'valor diferente da proposta', algo_a_mais: 'algo a mais que a proposta', assinatura_atrasada: 'aguardando assinatura há mais de 5 dias' };
function osmedAvisosPainel(){
  const l = Array.isArray(FINPM.osmed) ? FINPM.osmed : [];
  if (!l.length) return '';
  return '<div class="painel" style="margin-bottom:14px;padding:14px" id="fpmOsmed"><h3 style="margin-top:0">Medições das OS '
    + '<span class="chip" style="background:var(--warn-soft);color:var(--warn)">' + l.length + '</span></h3>'
    + '<p class="nota" style="margin-top:0">Fechadas em campo com diferença da proposta, com algo a mais, ou esperando a assinatura do encarregado. Só aviso: o faturamento não espera.</p>'
    + l.map(a => '<div class="ccLin omdLin" role="button" tabindex="0" data-osmed="' + esc(a.os_id) + '" style="cursor:pointer;border-left:3px solid '
        + ((a.avisos || []).includes('assinatura_atrasada') ? 'var(--crit)' : 'var(--warn)') + ';padding-left:8px">'
      + '<span class="ccData">' + esc(a.os_numero || '') + '</span>'
      + '<span class="ccNome">' + esc(a.cliente || '—') + '</span>'
      + '<span class="ccDesc">' + (a.avisos || []).map(x => esc(OSMED_AV[x] || x)).join(' · ')
      +   ' <small style="color:var(--ink-3)">· proposta ' + esc(BRL(a.valor_proposta)) + '</small></span>'
      + '<span class="n v">' + esc(BRL(a.valor)) + '</span></div>').join('') + '</div>';
}
function osmedLigarPainel(el){
  el.querySelectorAll('[data-osmed]').forEach(l => {
    const vai = () => { location.href = '?os=' + encodeURIComponent(l.dataset.osmed); };
    l.addEventListener('click', vai);
    l.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); vai(); } });
  });
}
/** O painel da OS: a medição da OS comum (null = OS sem medição ou sem a 306). */
function osmedLinhaOs(m){
  if (!m) return '';
  if (m.situacao !== 'fechada')
    // F21 · issue 90 (S184): a T16 abre com a OS; o aviso fica em destaque, sem travar a nota
    return '<p class="nota" id="osMedOs" style="margin:2px 0 6px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:600">'
      + 'A medição ainda não foi fechada: a nota vai sair pelo valor da proposta. Se a medição fechar com valor maior, a tarefa da nota reabre para a diferença; com valor menor, cancele a nota e emita de novo.</p>';
  const ass = m.assinatura === 'assinada' ? '<span class="chip">assinada' + (m.assinante_nome ? ' por ' + esc(m.assinante_nome) : '') + '</span>'
            : m.assinatura === 'aguardando' ? '<span class="chip" style="background:var(--warn-soft);color:var(--warn)">aguardando assinatura</span>'
            : '<span class="chip">sem assinatura exigida</span>';
  const prop = Number((m.resumo || {}).total_proposta) || 0, dif = Number(m.valor) - prop;
  return '<p class="nota" id="osMedOs" style="margin:2px 0 6px">Medição fechada em ' + esc(dataBR(String(m.fechada_em || '').slice(0, 10)))
    + ' ' + ass + ' · proposta ' + esc(BRL(prop)) + (Math.abs(dif) >= 0.01 ? ' (' + (dif < 0 ? '−' : '+') + esc(BRL(Math.abs(dif))) + ')' : '')
    + '. O valor da nota é o da medição.</p>';
}

const FINOS = { id: null, t: null, ver: null, ids: null, erro: null, sitPosta: false, med: null };

/** Lê o ?os= da entrada (chamada pelo iniciar, antes do primeiro desenho). */
function osDaEntrada(params){
  const id = (params.get('os') || '').trim();
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) return false;
  FINOS.id = id.toLowerCase(); FINOS.t = (params.get('t') || '').trim().toUpperCase() || null;
  FINOS.ver = null; FINOS.ids = null; FINOS.erro = null; FINOS.sitPosta = false;
  BUSCA.finre = '';
  return true;
}

async function osCarregar(){
  if (!FINOS.id) return;
  try{
    FINOS.ver = await rpc('tf_fin_os_faturar_ver', { p_os_id: FINOS.id });
    FINOS.med = await rpc('tf_osmed_ver', { p_os: FINOS.id }).catch(() => null);   // F14 · sem a 306 ou sem medição: null
    FINOS.ids = (FINOS.ver.contas || []).map(c => c.id); FINOS.erro = null;
  }catch(e){
    FINOS.ver = null; FINOS.ids = []; FINOS.erro = e.message;
  }
  // a OS mostra todas as contas dela (recebidas também), não só as em aberto
  if (!FINOS.sitPosta && FINF.finre){ FINF.finre.sit = 'todas'; FINOS.sitPosta = true; }
}

function osSair(){
  FINOS.med = null;
  FINOS.id = null; FINOS.ver = null; FINOS.ids = null; FINOS.erro = null; FINOS.t = null;
  if (FINF.finre) FINF.finre.sit = FIN_CFG.finre.sitPadrao || 'todas';
  osDesenhar();
  if (typeof finDesenhar === 'function') finDesenhar('finre');
}

const osRot = () => (FINOS.ver && FINOS.ver.os && FINOS.ver.os.numero) || 'OS';

function osDesenhar(){
  const el = document.getElementById('finreOs'); if (!el) return;
  if (!FINOS.id){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const sair = '<button class="btn" type="button" id="osSair" title="Voltar a todas as contas a receber">Ver todas as contas</button>';
  if (FINOS.erro || !FINOS.ver){
    el.innerHTML = '<div class="nfBloco osPainel"><b>OS</b><div class="nfErros" style="margin:6px 0">'
      + esc(FINOS.erro || 'Não consegui abrir a OS.') + '</div>' + sair + '</div>';
    document.getElementById('osSair').addEventListener('click', osSair);
    return;
  }
  const v = FINOS.ver, o = v.os || {}, c = v.cliente || {};
  const aprov = Number(v.aprovado) || 0, ja = Number(v.ja_tem) || 0, falta = Number(v.falta) || 0;
  const nC = (v.contas || []).length;
  const props = (v.propostas || []).map(p => esc(p.rotulo)).join(', ');
  const podeCriar = v.pode_criar && (aprov <= 0 || falta > 0.009);
  const situ = o.status === 'cancelada' ? ' <span class="chip fCrit">cancelada</span>'
             : o.status === 'concluida' ? ' <span class="chip">concluída</span>' : '';
  let msg;
  if (o.status === 'cancelada') msg = 'A OS está cancelada: não se cria conta para ela.';
  else if (aprov <= 0) msg = nC ? 'A OS não tem proposta aprovada. Já tem ' + (nC === 1 ? 'uma conta' : nC + ' contas') + ' ligada' + (nC === 1 ? '' : 's') + ' (abaixo).'
                              : 'A OS não tem proposta aprovada. Dá para criar a conta confirmando o valor.';
  else if (falta <= 0.009) msg = 'Esta OS já tem conta a receber de todo o valor aprovado: confira abaixo e use “Emitir nota” e “Emitir boleto” na linha.';
  else if (nC) msg = 'Já tem conta de ' + BRL(ja) + '; falta ' + BRL(falta) + '.';
  else msg = 'Esta OS ainda não tem conta a receber.';
  const ctr = v.contrato || null;   // F13 · OS de contrato: fatura pela medição
  const omed = !ctr && FINOS.med && FINOS.med.situacao === 'fechada';   // F14 · OS comum com a medição fechada
  if (ctr) msg = medMsgOs(v);
  const citam = (v.citam || []);
  el.innerHTML = '<div class="nfBloco osPainel">'
    + '<div style="display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap">'
    +   '<div><div class="osTit" style="font-weight:700;font-size:15px;color:var(--ink)">' + esc(o.numero || 'OS') + ' · ' + esc(c.nome || '—') + situ + '</div>'
    +     (FINOS.t === 'T16' ? '<div class="nota" style="margin:2px 0 0">Vindo da tarefa T16 · Emitir boleto / nota fiscal</div>' : '') + '</div>'
    +   sair + '</div>'
    + '<div class="osNums" style="display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 4px">'
    +   '<span>' + (ctr || omed ? 'Medição fechada: ' : 'Proposta aprovada: ') + '<span id="osAprov" style="font-weight:700">' + esc(BRL(aprov)) + '</span>' + (props ? ' <small style="color:var(--ink-3)">(' + ((v.propostas || []).length > 1 ? 'propostas ' : 'proposta ') + props + ')</small>' : '') + '</span>'
    +   '<span>Já tem conta: <span id="osJa" style="font-weight:700">' + esc(BRL(ja)) + '</span>' + (nC ? ' <small style="color:var(--ink-3)">(' + (nC === 1 ? '1 conta' : nC + ' contas') + ')</small>' : '') + '</span>'
    +   '<span>Falta: <span id="osFalta" style="font-weight:700">' + esc(BRL(falta)) + '</span></span></div>'
    + (ctr ? '' : osmedLinhaOs(FINOS.med))   // F14
    + '<p class="nota" id="osMsg" style="margin:4px 0 8px">' + esc(msg) + '</p>'
    + (podeCriar ? '<button class="btn pri" type="button" id="osCriar">Criar conta a receber desta OS</button>' : '')
    + (ctr && ctr.medicao && !ctr.tem_titulo ? '<button class="btn pri" type="button" id="osMedLancar">Lançar título da medição</button>' : '')
    + (citam.length
        ? '<div style="margin-top:10px"><div class="nota" style="margin:0 0 4px">Estas contas citam a OS, mas não estão ligadas a ela:</div><ul class="nfAvisos" id="osCitam">'
          + citam.map(x => '<li>' + esc(x.descricao || '—') + ' · ' + esc(BRL(x.valor))
              + (x.ligada_a ? ' · <small>ligada à ' + esc(x.ligada_a) + '</small>' : '')
              + (x.mesmo_cliente
                  ? ' <button class="btn mini" type="button" data-osligar="' + esc(x.id) + '">Ligar a esta OS</button>'
                  : ' · <small>outro cliente</small>') + '</li>').join('') + '</ul></div>'
        : '')
    + '</div>';
  document.getElementById('osSair').addEventListener('click', osSair);
  const bc = document.getElementById('osCriar'); if (bc) bc.addEventListener('click', modalCriarContaOs);
  const bm = document.getElementById('osMedLancar'); if (bm) bm.addEventListener('click', () => modalLancarMedicao(ctr.medicao.medicao_id));
  el.querySelectorAll('[data-osligar]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try{ await rpc('tf_fin_os_ligar_conta', { p_titulo_id: b.dataset.osligar, p_os_id: FINOS.id }); toast('Conta ligada à ' + osRot() + '.', 'ok'); await finreCarregar(); }
    catch(e){ b.disabled = false; toast(e.message, 'err'); }
  }));
}

async function modalCriarContaOs(rasc){
  if (rasc instanceof Event) rasc = null;
  const v = FINOS.ver; if (!v) return;
  // F20 · item 30: a condição sugerida vem do cliente (Prazos de Recebimento)
  let condCli = null;
  if (!(rasc && rasc.cond != null) && v.cliente && v.cliente.id){
    try{ const pz = await rpc('tf_fin_prazo_ver', { p_cliente_id: v.cliente.id }); condCli = pz && pz.condicao; }catch(e){ condCli = null; }
  }
  const aprov = Number(v.aprovado) || 0, falta = Number(v.falta) || 0;
  const c = v.cliente || {}, o = v.os || {};
  const props = (v.propostas || []).map(p => p.rotulo).join(', ');
  const d = Object.assign({
    desc: o.numero + (props ? ((v.propostas || []).length > 1 ? ' · Propostas ' : ' · Proposta ') + props : ''),
    valor: aprov > 0 ? falta.toFixed(2) : '',
    cond: condCli || String(Number(c.prazo_dias) || 30), comp: isoHoje().slice(0, 7), forma: '', conf: false, vencMao: false,
    uid: (crypto.randomUUID && crypto.randomUUID()) || ('os-' + Date.now() + '-' + Math.random().toString(16).slice(2))
  }, rasc || {});
  if (!d.venc) d.venc = finSomaDias(isoHoje(), ((condDias(d.cond) || [])[0] ?? (Number(c.prazo_dias) || 30)));
  abrirModal('Criar conta a receber — ' + (o.numero || 'OS'),
      '<div class="campo"><label>Cliente (da OS)</label><input type="text" value="' + esc(c.razao_social || c.nome || '—') + '" disabled></div>'
    + (aprov > 0
        ? '<p class="nota" style="margin:-4px 0 10px">Aprovado ' + esc(BRL(aprov)) + ' · já tem conta ' + esc(BRL(Number(v.ja_tem) || 0)) + ' · falta <b>' + esc(BRL(falta)) + '</b>.</p>'
        : '<div class="nfAvisos" style="padding:8px 10px;margin-bottom:10px">A OS não tem proposta aprovada. Confira o valor com a OS antes de criar.'
          + '<label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="osConf"' + (d.conf ? ' checked' : '') + '> Confirmo o valor sem proposta aprovada</label></div>')
    + '<div class="campo"><label for="osDesc">Descrição</label><input id="osDesc" type="text" maxlength="300" value="' + esc(d.desc) + '" autocomplete="off"></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="osValor">Valor</label><input id="osValor" type="number" step="0.01" min="0.01" value="' + esc(d.valor) + '"></div>'
    +  '<div class="campo"><label for="osCond">Condição de pagamento (dias depois da nota)</label>'
    +    '<input id="osCond" type="text" inputmode="numeric" autocomplete="off" placeholder="30/60" value="' + esc(d.cond) + '"></div></div>'
    + condBotoes('osCond')

  let vencMao = !!d.vencMao;

// TAPFIN · BOLETO COM PIX PELO BANCO INTER
// ----------------------------------------------------------------------------
// Desenho: processos/tapfin-boleto-inter-desenho.md. Banco: 508_tapfin_boleto.sql.
// Servidor: supabase/functions/fin-boleto (o certificado e o Secret do Inter nunca
// passam por aqui). A tela só pede "emita/consulte/cancele o boleto do título X";
// os valores saem do banco (tf_fin_boleto_preparar).
// O pagamento dá baixa SOZINHO (webhook do Inter ou a conferência diária).
// O TapFin NUNCA cancela boleto sozinho: cancelar é sempre um clique, com motivo.
// Sem o 508 no banco, nada disto aparece.
// ════════════════════════════════════════════════════════════════════════════
const FINBO = { ativo: false, sit: {}, cfg: null, pend: null, avisos: null };
/** 182: liga um ouvinte ao CONTEÚDO da janela que acabou de abrir. O #mBody é o mesmo a cada abertura (o núcleo só
 *  troca o innerHTML): ligado nele, o ouvinte de cada abertura ficava e o clique passava a valer 2, 3… vezes. Ligado
 *  no invólucro .mbOuvinte, ele some junto com o conteúdo. */
const mbCorpo = html => '<div class="mbOuvinte">' + html + '</div>';
function mbOuvir(tipo, fn){ const w = document.querySelector('#mBody > .mbOuvinte'); if (w) w.addEventListener(tipo, fn); }
const BO_SIT = { emitindo: 'Emitindo boleto…', a_receber: 'Boleto', atrasado: 'Boleto vencido', recebido: 'Recebido',
                 marcado_recebido: 'Marcado como recebido no app', cancelado: 'Boleto cancelado', expirado: 'Boleto encerrado pelo banco', falha: 'Boleto recusado' };

async function boCarregar(){
  try{
    const [sit, cfg] = await Promise.all([rpc('tf_fin_boleto_situacoes', {}), rpc('tf_fin_boleto_config', {})]);
    FINBO.sit = sit || {}; FINBO.cfg = cfg; FINBO.ativo = true;
  }catch(e){ FINBO.ativo = false; FINBO.sit = {}; }   // banco sem o 508: o boleto não aparece
  // F27 · issue 183 (525): os avisos de boleto que pedem alguém (sem a 525, nada)
  FINBO.avisos = null;
  if (FINBO.ativo){ try{ FINBO.avisos = await rpc('tf_fin_boleto_avisos', {}); }catch(e){ FINBO.avisos = null; } }
}
/** O último boleto do título, se houver. */
const boDe = t => (FINBO.ativo && t && FINBO.sit[t.id]) || null;
/** Boleto que ainda vale no banco (o cliente pode pagar). */
const boVivo = t => { const b = boDe(t); return !!(b && ['emitindo', 'a_receber', 'atrasado'].includes(b.situacao)); };
const boFaixaTeste = amb => amb === 'sandbox'
  ? '<div class="nfTeste">TESTE (sandbox do Inter): boleto sem valor</div>' : '';

function boChip(t){
  const b = boDe(t); if (!b) return '';
  const teste = b.ambiente === 'sandbox' ? ' (teste)' : '';
  let cls = '', txt = BO_SIT[b.situacao] || b.situacao;
  if (b.situacao === 'a_receber') txt = 'Boleto · vence ' + dataBR(b.vencimento).slice(0, 5) + teste;
  else if (b.situacao === 'atrasado'){ cls = ' fCrit'; txt = 'Boleto vencido' + teste; }
  else if (b.situacao === 'recebido'){ cls = ' fOk'; txt = 'Recebido · ' + (b.recebido_origem === 'PIX' ? 'Pix' : 'boleto') + ' em ' + dataBR(b.recebido_em).slice(0, 5) + teste; }
  else if (b.situacao === 'emitindo'){ cls = ' fAtn'; }
  else if (b.situacao === 'falha' || b.situacao === 'marcado_recebido'){ cls = ' fAtn'; }
  else return '';                                     // cancelado/encerrado: só no quadro "Boletos"
  if (b.aviso === 'titulo_ja_baixado'){ cls = ' fAtn'; txt = 'Boleto pago — conferir: título já estava baixado'; }
  const vivo = ['a_receber', 'atrasado'].includes(b.situacao);
  return ' <span class="chip' + cls + '" title="' + esc(b.motivo || txt) + '">' + esc(txt) + '</span>'
    + (vivo && b.linha_digitavel ? ' <a href="#" data-bocopia="linha" data-id="' + esc(t.id) + '" style="font-size:11px">Linha</a>' : '')
    + (vivo && b.pix_copia_cola ? ' <a href="#" data-bocopia="pix" data-id="' + esc(t.id) + '" style="font-size:11px">Pix</a>' : '')
    + (vivo || b.situacao === 'recebido' ? ' <a href="#" data-bopdf="' + esc(b.id) + '" style="font-size:11px">PDF boleto</a>' : '');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-bocopia]'), p = e.target.closest('[data-bopdf]');
  if (c){ e.preventDefault(); const b = FINBO.sit[c.dataset.id]; if (!b) return;
    if (c.dataset.bocopia === 'pix') copiar(b.pix_copia_cola, 'Pix copia-e-cola copiado.'); else copiar(b.linha_digitavel, 'Linha digitável copiada.'); }
  if (p){ e.preventDefault(); boAbrirPdf(p.dataset.bopdf); }
});

/** O PDF do boleto, do compartimento privado (com o token de quem clicou). Sem PDF guardado, pede ao Inter. */
async function boAbrirPdf(boletoId, caminho){
  const janela = window.open('', '_blank');   // F27 · 184 (item 3): com o bloqueador de pop-up ligado, vem null
  try{
    if (!caminho){ const b = Object.values(FINBO.sit).find(x => x.id === boletoId); caminho = b && b.pdf_path; }
    if (!caminho){ const j = await boFuncao({ acao: 'pdf', boleto_id: boletoId }); caminho = j.pdf_path; }
    const r = await rhfdFetch(SUPABASE_URL + '/storage/v1/object/fin-boleto/' + String(caminho).split('/').map(encodeURIComponent).join('/'), {});
    if (!r.ok) throw new Error('o arquivo não abriu (código ' + r.status + ')');
    const url = URL.createObjectURL(await r.blob());
    if (janela) janela.location.href = url;
    else {
      const a = document.createElement('a'); a.href = url; a.download = String(caminho).split('/').pop() || 'boleto.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      toast('O navegador bloqueou a aba nova: o PDF do boleto foi baixado. Para abrir direto, libere os pop-ups para o TapHub.', 'ok');
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ if (janela) janela.close(); toast('Não abriu o PDF do boleto: ' + e.message, 'err'); }
}

/** Chama a função do servidor. Token vencido: renova uma vez pelo núcleo e repete. */
async function boFuncao(corpo){
  const vai = () => fetch(SUPABASE_URL + '/functions/v1/fin-boleto', { method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + sessao.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo), signal: AbortSignal.timeout ? AbortSignal.timeout(90000) : undefined });
  let r;
  try{ r = await vai(); }
  catch(e){ throw new Error('O servidor não respondeu. Antes de tentar de novo, use "Atualizar boleto" (o botão da conta) ou "Atualizar" no quadro Boletos: ele pode ter saído.'); }
  if (r.status === 401 && sessao.refresh){
    try{ await Nucleo.api.rpc('tf_fin_autorizado', {}); }catch(e){}
    r = await vai();
  }
  let j = null; try{ j = await r.json(); }catch(e){}
  if (!r.ok || !j || !j.ok){
    const m = (j && j.erro) || ('Erro ' + r.status + ' no boleto.');
    // 514/F10: o Inter limitando chamadas (429) vira a frase clara, venha de onde vier
    throw new Error(r.status === 429 || /HTTP 429|\b429\b/.test(m) ? 'O Inter pediu para esperar. Tente de novo em 1 minuto.' : m);
  }
  return j;
}
/** F27 · 184 (item 4): aviso que não pode passar em 4 segundos ("ficou emitindo", "ainda sendo emitida"): numa janela com "Entendi". */
function finAvisoJanela(titulo, msg){
  abrirModal(titulo, '<p style="margin-top:0" class="finAvisoTxt">' + esc(msg) + '</p>'
    + '<p class="nota">O TapFin também confere sozinho as notas e os boletos em andamento quando Contas a Receber abre.</p>',
    [{ label: 'Entendi', pri: true, onClick: fecharModal }]);
}
async function boExecutar(fn, rotulo, depois){
  abrirModal(rotulo, '<p style="margin:6px 0">' + esc(rotulo) + ' Isso leva alguns segundos; não feche a página.</p>', []);
  let j = null;
  try{ j = await fn(); }
  catch(e){ fecharModal(); toast(e.message, 'err'); await finreCarregar(); return null; }
  fecharModal(); await finreCarregar();
  if (j.aviso) finAvisoJanela('Boleto: atenção', j.aviso);
  else if (depois) depois(j);
  return j;
}
function boResultado(j){
  const teste = j.ambiente === 'sandbox' ? ' (TESTE)' : '';
  if (j.situacao === 'a_receber' || j.situacao === 'atrasado'){
    abrirModal('Boleto emitido' + teste,
      boFaixaTeste(j.ambiente)
      + '<p style="margin-top:0">Boleto de <b>' + esc(BRL(j.valor)) + '</b>, vence em <b>' + esc(dataBR(j.vencimento)) + '</b>. O cliente paga pelo boleto ou pelo Pix; a baixa sai sozinha.</p>'
      + '<div class="nfChave">Linha digitável <code>' + esc(j.linha_digitavel || '—') + '</code></div>',
      [{ label: 'Copiar linha', onClick: () => copiar(j.linha_digitavel, 'Linha digitável copiada.') },
       { label: 'Copiar Pix', onClick: () => copiar(j.pix_copia_cola, 'Pix copia-e-cola copiado.') },
       { label: 'PDF', onClick: () => boAbrirPdf(j.boleto_id, j.pdf_path) },
       { label: 'Fechar', pri: true, onClick: fecharModal }]);
  } else if (j.situacao === 'falha'){
    abrirModal('Boleto não emitido', '<p style="margin-top:0">O Inter recusou:</p><p class="nfRecusa">' + esc(j.motivo || 'sem detalhe') + '</p>'
      + '<p class="nota">Corrija o que a mensagem pede (no título ou no cadastro do cliente) e emita de novo.</p>',
      [{ label: 'Fechar', pri: true, onClick: fecharModal }]);
  } else if (j.situacao === 'cancelado') toast('Boleto cancelado no Inter. O título continua em aberto.', 'ok');
  else if (j.situacao === 'recebido') toast('Boleto pago' + (j.recebido_em ? ' em ' + dataBR(j.recebido_em) : '') + '. A baixa foi lançada.', 'ok');
  else toast('Boleto atualizado.', 'ok');
}

    + '<div class="campo"><label for="boL1">Mensagem no boleto (linha 1)</label><input id="boL1" type="text" maxlength="78" value="' + esc((r.mensagem && r.mensagem.linha1) || '') + '"></div>'

    mbCorpo(L.length ? L.map(linha).join('') : '<p class="nota">Nenhum boleto para este título.</p>'),
    [{ label: 'Fechar', pri: true, onClick: fecharModal }]);
  mbOuvir('click', e => {   // 182: um ouvinte por abertura
    const c = e.target.closest('[data-bocop]'), p = e.target.closest('[data-bopdfx]'), a = e.target.closest('[data-boatual]'), x = e.target.closest('[data-bocanc]');

    if (p) boAbrirPdf(p.dataset.bopdfx, p.dataset.path || null);
    if (a) boExecutar(() => boFuncao({ acao: 'consultar', boleto_id: a.dataset.boatual }), 'Consultando o boleto no Inter…', boResultado);

/** Cancelar: só com o clique, com motivo e confirmação (o TapFin nunca cancela sozinho). */
function modalCancelarBoleto(t, b){
  if (!b) return;
  abrirModal('Cancelar o boleto ' + (b.seu_numero || ''),
      boFaixaTeste(b.ambiente)
    + '<p style="margin-top:0">O boleto é cancelado no Inter e o cliente <b>não consegue mais pagá-lo</b> (nem pelo Pix). O título continua em aberto.</p>'
    + '<div class="campo"><label for="boMotivo">Motivo (de 5 a 50 letras, vai para o Inter)</label>'
    + '<input id="boMotivo" type="text" maxlength="50" placeholder="Ex.: Cliente pagou por TED"></div>',
    [{ label: 'Voltar', onClick: fecharModal },
     { label: 'Cancelar boleto', cls: 'perigo', onClick: async () => {
        const motivo = document.getElementById('boMotivo').value.trim();
        if (motivo.length < 5){ toast('O motivo precisa ter pelo menos 5 letras.', 'err'); return; }
        const ok = await confirmar('Cancelar o boleto ' + (b.seu_numero || '') + '?', boFaixaTeste(b.ambiente)
          + '<p style="margin-top:0">O cancelamento vai ao Inter, <b>sem volta</b>.</p><p class="nota">Motivo: ' + esc(motivo) + '</p>', 'Cancelar o boleto', true);
        if (!ok){ modalCancelarBoleto(t, b); return; }
        await boExecutar(() => boFuncao({ acao: 'cancelar', boleto_id: b.id, motivo }), 'Cancelando o boleto…', boResultado);
     }}]);
}

/** "Trazer os boletos do Inter": liga os emitidos pelo app aos títulos (o escritório confirma cada um). */
async function modalTrazerInter(){
  let j;
  abrirModal('Trazer os boletos do Inter', '<p style="margin:6px 0">Buscando os boletos em aberto no Inter…</p>', []);
  try{ j = await boFuncao({ acao: 'listar_inter' }); }catch(e){ fecharModal(); toast(e.message, 'err'); return; }
  const L = j.cobrancas || [];
  const linha = (c, i) => {
    const opts = (c.candidatos || []).map(x => '<option value="' + esc(x.titulo_id) + '"' + (c.sugestao && c.sugestao.titulo_id === x.titulo_id ? ' selected' : '') + '>'
      + esc((x.cliente || '') + ' · ' + (x.descricao || '') + ' · ' + BRL(x.valor) + ' · ' + dataBR(x.vencimento)) + '</option>').join('');
    return '<div class="nfLin"><div><b>' + esc(c.seu_numero || '—') + '</b> · ' + esc(c.pagador || '') + ' · ' + esc(BRL(c.valor)) + ' · vence ' + esc(dataBR(c.vencimento))
      + (c.situacao === 'ATRASADO' ? ' <span class="chip fCrit">vencido</span>' : '')
      + '<div class="campo" style="margin:6px 0 0"><select data-boi="' + i + '"><option value="">' + (opts ? '— escolha o título —' : 'Nenhum título combina') + '</option>' + opts + '</select></div>'
      + (c.sugestao ? '<div class="nota" style="margin:2px 0 0">Sugerido pelo cód. de controle, valor e vencimento.</div>' : '')
      // 182: o código do boleto vai no próprio botão (não a posição na lista)
      + '</div><div class="nfBot"><button class="btn mini" type="button" data-boligar="' + i + '" data-bocod="' + esc(c.codigo_solicitacao || '') + '" data-boseu="' + esc(c.seu_numero || '') + '"' + (opts ? '' : ' disabled') + '>Ligar</button></div></div>';
  };
  abrirModal('Trazer os boletos do Inter',
    boFaixaTeste(j.ambiente)
    + '<p class="nota" style="margin-top:0">' + esc(String(j.total_inter)) + ' boleto(s) em aberto no Inter; ' + esc(String(L.length)) + ' ainda sem título no TapFin. '
    + 'Ligado, o título mostra o boleto, não oferece outro, e o pagamento dá baixa sozinho.</p>'
    + mbCorpo(L.length ? L.map(linha).join('') : '<p class="nota">Nada a ligar: todos os boletos do Inter já estão nos títulos.</p>'),
    [{ label: 'Fechar', pri: true, onClick: () => { fecharModal(); finreCarregar(); } }]);
  mbOuvir('click', async e => {   // 182: um ouvinte por abertura; um pedido por clique
    const b = e.target.closest('[data-boligar]'); if (!b || b.disabled || !b.dataset.bocod) return;
    const sel = b.closest('.nfLin') && b.closest('.nfLin').querySelector('select[data-boi]');
    if (!sel || !sel.value){ toast('Escolha o título.', 'err'); return; }
    b.disabled = true;
    try{ await boFuncao({ acao: 'vincular', titulo_id: sel.value, codigo_solicitacao: b.dataset.bocod });
         b.textContent = 'Ligado ✓'; sel.disabled = true; toast('Boleto ' + (b.dataset.boseu || '') + ' ligado ao título.', 'ok'); }
    catch(err){ b.disabled = false; toast(err.message, 'err'); }
  });
}

    + '<div class="nfBloco"><b>Pendências</b>'
    +   ((p.clientes_sem_endereco || []).length ? '<div class="nota" style="margin:2px 0 0">Clientes com título em aberto sem endereço completo (o boleto não sai):</div><ul class="nfAvisos">'
         + p.clientes_sem_endereco.map(x => '<li>' + esc(x.cliente) + ' — falta ' + esc(x.falta) + '</li>').join('') + '</ul>' : '<div class="nota" style="margin:2px 0 0">Nenhum cliente com endereço incompleto.</div>')
    +   ((p.orfaos || []).length ? '<div class="nota" style="margin:4px 0 0">Avisos do Inter de boletos sem título no TapFin:</div><ul class="nfAvisos">'
         + p.orfaos.map(x => '<li>' + esc(x.seu_numero || '—') + ' · ' + esc(x.pagador || '') + ' · ' + esc(BRL(x.valor)) + ' · ' + esc(x.situacao || '') + '</li>').join('') + '</ul>' : '')
    + '</div>',

          fecharModal(); await boExecutar(() => boFuncao({ acao: 'webhook' }), 'Cadastrando o webhook no Inter…', () => toast('Webhook cadastrado: o Inter passa a avisar os pagamentos.', 'ok')); } }] : [])
      .concat([{ label: 'Cancelar', onClick: fecharModal },
       { label: 'Gravar', pri: true, onClick: async () => {
          // 512: tudo é lido AQUI, antes da confirmação (ela fecha esta janela)
          const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
          // F27 · 184 (item 9): campo apagado não grava zero (fica o que estava); texto que não é número não grava
          const g = { mensagem: v('boMsg'), mensagem_l4: v('boMsg4') };
          const nums = [['boMulta', 'multa_pct', 'Multa'], ['boJuros', 'juros_mes_pct', 'Juros ao mês'], ['boDesc', 'desconto_pct', 'Desconto'], ['boDias', 'dias_agenda', 'Pagável até']];
          for (const [id, k, rot] of nums){
            const x = v(id); if (x === '') continue;
            const n = Nucleo.util.lerValor(x);
            if (n == null || !isFinite(n) || n < 0){ Nucleo.janela.erro(rot + ': digite um número (ou deixe como estava).', document.getElementById(id)); return; }
            g[k] = k === 'dias_agenda' ? Math.round(n) : n;
          }
          if (adm){
            const amb = v('boAmb'), conta = v('boConta'), cert = v('boCert');
            g.ambiente = amb || c.ambiente; if (conta) g.conta_id = conta; if (cert) g.cert_vence_em = cert;
            if (g.ambiente !== c.ambiente){
              const nome = a => a === 'producao' ? 'produção' : 'teste (sandbox)';
              const ok = await confirmar('Trocar o ambiente do boleto?', '<p>De <b>' + esc(nome(c.ambiente)) + '</b> para <b>' + esc(nome(g.ambiente)) + '</b>. Em produção, o boleto é de verdade.</p>', 'Trocar');
              if (!ok){ toast('Nada foi gravado.'); return modalConfigBoleto(g); }
            }
          }
          try{ await rpc('tf_fin_boleto_config_gravar', { p: g }); fecharModal(); toast('Configuração do boleto gravada.', 'ok'); await finreCarregar(); }
          catch(e){ toast(e.message, 'err'); }
       }}]));
}

/** As faixas de aviso no topo de Contas a Receber: certificado e conferência atrasada. */
function boFaixas(){
  const el = document.getElementById('boFaixas'); if (!el) return;
  const c = FINBO.cfg; let h = '';
  if (FINBO.ativo && c){
    if (c.cert_dias != null && c.cert_dias < 0) h += '<div class="nfErros" style="padding:8px 10px">O certificado do Inter <b>venceu</b> em ' + esc(dataBR(c.cert_vence_em)) + '. O boleto está parado: gere outro certificado no Inter Empresas e avise o administrador para trocar no sistema.</div>';
    else if (c.cert_dias != null && c.cert_dias <= 60) h += '<div class="nfAvisos" style="padding:8px 10px">O certificado do Inter vence em ' + esc(dataBR(c.cert_vence_em)) + ' (' + esc(String(c.cert_dias)) + ' dias). Gere outro no Inter Empresas e avise o administrador para trocar no sistema antes do vencimento.</div>';
    if (c.pode_admin && c.conferencia_atrasada && c.conferido_em) h += '<div class="nfAvisos" style="padding:8px 10px">A conferência dos boletos não roda desde ' + esc(dataBR(c.conferido_em)) + '. Veja "Boleto ⚙".</div>';
  }
  // F27 · issue 183 (525): os avisos de boleto que pedem alguém (pago em dobro, pago sem conta, marcado no app, sem título)
  const av = FINBO.ativo && FINBO.avisos ? Number(FINBO.avisos.total) || 0 : 0;
  if (av) h += '<div class="nfErros" id="boAvisosFaixa" style="padding:8px 10px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap">'
    + '<span style="flex:1 1 240px"><b>' + av + (av === 1 ? ' aviso de boleto' : ' avisos de boleto') + '</b> pedem alguém: pagamento em dobro, pago sem a conta escolhida ou sem conta no TapFin.</span>'
    + '<button class="btn" type="button" id="boAvisosAbrir" style="margin:0">Ver os avisos</button></div>';
  // F27 · 184 (item 2): a virada do mês sem o % do Simples (em produção a nota não sai sem ele)
  const nc = FINNF.ativo && FINNF.cfg, mes = _diaDe(Date.now()).slice(0, 7);
  if (nc && nc.ambiente === 'producao' && !(Number(nc.pct_simples) > 0 && nc.pct_simples_mes === mes))
    h += '<div class="nfAvisos" id="nfPctFaixa" style="padding:8px 10px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap">'
      + '<span style="flex:1 1 240px"><b>Falta o % do Simples de ' + esc(mes.slice(5) + '/' + mes.slice(0, 4)) + '.</b> Sem ele, a nota deste mês não sai.</span>'
      + '<button class="btn" type="button" id="nfPctAbrir" style="margin:0">Nota fiscal ⚙</button></div>';
  el.innerHTML = h; el.hidden = !h;
  const ba = document.getElementById('boAvisosAbrir'); if (ba) ba.addEventListener('click', () => modalAvisosBoleto());
  const bp = document.getElementById('nfPctAbrir'); if (bp) bp.addEventListener('click', () => modalConfigNota());
}

/** F27 · issue 183 (525): a lista dos avisos de boleto. Nada some sozinho: cada um sai com o clique de quem resolveu. */
const BO_AVISO_TXT = {
  titulo_ja_baixado: 'Pago no banco, mas a conta já estava baixada: confira se o cliente pagou duas vezes (devolver ou abater). Resolvido, clique em “Já resolvi”.',
  sem_conta: 'Pago no banco sem a conta do Inter escolhida em “Boleto ⚙”: a baixa NÃO saiu. Com a conta escolhida, “Lançar a baixa agora” lança a mesma baixa do automático.',
  marcado_recebido: 'Marcado como recebido à mão no app do Inter: a baixa não é automática. Dê a baixa na conta (Baixar) e clique em “Já resolvi”.',
};
async function modalAvisosBoleto(){
  let A;
  try{ A = await rpc('tf_fin_boleto_avisos', {}); }catch(e){ toast(e.message, 'err'); return; }
  FINBO.avisos = A;
  const avisos = A.avisos || [], orfaos = A.orfaos || [];
  const lin = x => '<div class="nfLin" data-boav="' + esc(x.boleto_id) + '"><div><b>' + esc(x.seu_numero || '—') + '</b> · ' + esc(x.cliente || '') + ' · ' + esc(x.titulo_descricao || '')
      + (x.ambiente === 'sandbox' ? ' <span class="chip fAtn">teste</span>' : '')
      + '<div class="nota" style="margin:2px 0 0">' + (x.recebido_em ? 'Pago em ' + esc(dataBR(x.recebido_em)) + ' · ' + esc(BRL(x.recebido_valor)) + (x.recebido_origem === 'PIX' ? ' (Pix)' : '') : 'Boleto de ' + esc(BRL(x.valor)))
      +   ' · a conta tem ' + esc(BRL(x.titulo_saldo)) + ' em aberto</div>'
      + '<div class="' + (x.aviso === 'marcado_recebido' ? 'nfAvisos' : 'nfRecusa') + '" style="padding:6px 9px;margin-top:4px">' + esc(BO_AVISO_TXT[x.aviso] || x.aviso) + '</div></div>'
      + '<div class="nfBot">' + (x.aviso === 'sem_conta'
          ? (A.tem_conta ? '<button class="btn mini pri" type="button" data-boavbaixa="' + esc(x.boleto_id) + '">Lançar a baixa agora</button>'
                         : '<small class="nota">Escolha a conta em “Boleto ⚙” (administrador).</small>')
          : '<button class="btn mini" type="button" data-boavok="' + esc(x.boleto_id) + '">Já resolvi</button>') + '</div></div>';
  const linO = o => '<div class="nfLin" data-boorf="' + esc(o.codigo) + '"><div><b>' + esc(o.seu_numero || '—') + '</b> · ' + esc(o.pagador || '') + ' · ' + esc(BRL(o.pago ? (o.recebido_valor || o.valor) : o.valor))
      + (o.ambiente === 'sandbox' ? ' <span class="chip fAtn">teste</span>' : '')
      + '<div class="nota" style="margin:2px 0 0">' + (o.pago ? 'Pago' + (o.recebido_em ? ' em ' + esc(dataBR(o.recebido_em)) : '') : 'Situação no Inter: ' + esc(o.situacao || '—'))
      +   (o.vencimento ? ' · vencimento ' + esc(dataBR(o.vencimento)) : '') + '</div>'
      + '<div class="nfAvisos" style="padding:6px 9px;margin-top:4px">' + (o.pago
          ? 'Boleto emitido no app do Inter e pago, sem conta no TapFin: a baixa não sai sozinha. Dê a baixa à mão na conta certa (data e valor acima) e clique em “Já resolvi”.'
          : 'Boleto emitido no app do Inter sem conta no TapFin. “Ligar a um título” abre “Trazer os boletos do Inter”.') + '</div></div>'
      + '<div class="nfBot">' + (o.pago ? '' : '<button class="btn mini" type="button" data-boorfligar="1">Ligar a um título</button>')
      + '<button class="btn mini" type="button" data-boorfok="' + esc(o.codigo) + '">Já resolvi</button></div></div>';
  abrirModal('Avisos de boleto',
    mbCorpo((avisos.length ? '<div class="secTit">Boletos do TapFin</div>' + avisos.map(lin).join('') : '')
      + (orfaos.length ? '<div class="secTit">Boletos sem conta no TapFin</div>' + orfaos.map(linO).join('') : '')
      + (!avisos.length && !orfaos.length ? '<p class="nota">Nenhum aviso de boleto. Tudo certo.</p>' : '')),
    [{ label: 'Fechar', pri: true, onClick: () => { fecharModal(); finreCarregar(); } }]);
  mbOuvir('click', async e => {
    const ok = e.target.closest('[data-boavok]'), bx = e.target.closest('[data-boavbaixa]'), of = e.target.closest('[data-boorfok]'), lg = e.target.closest('[data-boorfligar]');
    if (lg){ fecharModal(); modalTrazerInter(); return; }
    const b = ok || bx || of; if (!b || b.disabled) return;
    if (bx && !await confirmar('Lançar a baixa deste boleto?', '<p style="margin-top:0">A mesma baixa do automático: na conta do Inter escolhida em “Boleto ⚙”, na data e no valor que o Inter confirmou.</p>', 'Lançar a baixa')){ modalAvisosBoleto(); return; }
    b.disabled = true;
    try{
      if (of) await rpc('tf_fin_boleto_orfao_dispensar', { p_codigo: of.dataset.boorfok });
      else {
        const r = await rpc('tf_fin_boleto_aviso_resolver', { p_boleto_id: (ok || bx).dataset[ok ? 'boavok' : 'boavbaixa'], p_acao: ok ? 'resolvido' : 'baixar' });
        if (bx && r && r.aviso === 'titulo_ja_baixado') toast('A conta já estava baixada: o aviso virou “pago em dobro”. Confira com o cliente.', 'err');
        else if (bx) toast('Baixa lançada.', 'ok');
      }
      if (!bx) toast('Aviso resolvido.', 'ok');
      if (bx) await modalAvisosBoleto();
      else { const l = b.closest('.nfLin'); if (l) l.remove(); }
    }catch(err){ b.disabled = false; toast(err.message, 'err'); if (bx) modalAvisosBoleto(); }
  });
}

/** F27 · 184 (item 1): nota "Emitindo…"/"Cancelando…" e boleto "Emitindo…" mudavam só no "Atualizar" (e o título ficava
 *  travado). Ao abrir Contas a Receber, o TapFin consulta sozinho até 5 de cada, uma vez por abertura da página, sem
 *  janela; se algum mudou, a lista se atualiza. O "Atualizar" continua. */
const FIN_AND_BUSCADOS = new Set();
async function finAndamentoBuscar(){
  if (typeof DEMO !== 'undefined' && DEMO) return;
  const notas = FINNF.ativo ? Object.entries(FINNF.sit || {}).filter(([, n]) => n && n.id && (n.situacao === 'emitindo' || n.situacao === 'cancelando') && !FIN_AND_BUSCADOS.has(n.id)).slice(0, 5) : [];
  const bols = FINBO.ativo ? Object.values(FINBO.sit || {}).filter(b => b && b.id && b.situacao === 'emitindo' && !FIN_AND_BUSCADOS.has(b.id)).slice(0, 5) : [];
  if (!notas.length && !bols.length) return;
  notas.forEach(([, n]) => FIN_AND_BUSCADOS.add(n.id)); bols.forEach(b => FIN_AND_BUSCADOS.add(b.id));
  let mudou = false;
  for (const [tid, n] of notas){ try{ const j = await nfFuncao({ acao: 'consultar', titulo_id: tid, nfse_id: n.id }); if (j && j.situacao !== n.situacao) mudou = true; }catch(e){ /* fica para o "Atualizar" */ } }
  for (const b of bols){ try{ const j = await boFuncao({ acao: 'consultar', boleto_id: b.id }); if (j && j.situacao !== b.situacao) mudou = true; }catch(e){ /* idem */ } }
  if (mudou && visao === 'finre' && document.getElementById('finreLista')) await finreCarregar();
}

/** O número da nota escrito na descrição (o mesmo critério do banco: tf__fin_nf_ref). */
function jfRef(t){
  const m = /(^|[^\p{L}\p{N}])NF\s*(?:n?[º°o.:]?\s*)?0*([0-9]{1,6})(\s*[-/]\s*([0-9]{1,2}))?(?![0-9])/iu.exec((t && t.descricao) || '');
  return m ? { numero: Number(m[2]), parcela: m[4] ? Number(m[4]) : null } : null;
}
/** Conta "A faturar" com NF na descrição: o botão principal vira "Já tem nota". */

    FINJF.notas = j.notas_carregadas || 0; FINJF.notasAte = j.notas_ate || null;
  }catch(e){ FINJF.ativo = false; FINJF.itens = []; FINJF.marcados = new Set(); }

}

// TAPFIN 3 · EMISSÃO DE NFS-e PELO TAPFIN (Notaas)
// ----------------------------------------------------------------------------
// Desenho: processos/tapfin-nfse-desenho.md. Banco: 504_tapfin_nfse.sql.
// Servidor: supabase/functions/fin-nfse (a chave do Notaas e o certificado
// nunca passam por aqui). A tela só pede "emita/consulte/cancele a nota do
// título X"; os valores saem do banco (tf_fin_nfse_preparar).
// Sem o 504 no banco, nada disto aparece e Contas a Receber fica como no F2.
// ════════════════════════════════════════════════════════════════════════════
const FINNF = { ativo: false, sit: {}, cfg: null };

const NF_SIT = { emitindo: 'Emitindo…', autorizada: 'Nota emitida', rejeitada: 'Nota recusada',
                 cancelando: 'Cancelando…', cancelada: 'Nota cancelada' };

async function nfCarregar(){
  try{
    const [sit, cfg] = await Promise.all([rpc('tf_fin_nfse_situacoes', {}), FINNF.cfg ? FINNF.cfg : rpc('tf_fin_nfse_config', {})]);
    FINNF.sit = sit || {}; FINNF.cfg = cfg; FINNF.ativo = true;
  }catch(e){ FINNF.ativo = false; FINNF.sit = {}; }   // banco sem o 504: a emissão não aparece
  nfBuscarAtrasados();
}

/** 512: nota autorizada sem o PDF (ou o XML) — o Notaas às vezes só o tem minutos depois da emissão.
 *  Busca em segundo plano, uma vez por nota a cada abertura da página (até 5 por vez, dos últimos
 *  30 dias), sem janela nem aviso; se algum chegar, a lista se atualiza. "Atualizar" continua valendo. */
const NF_BUSCADOS = new Set();
function nfBuscarAtrasados(){
  if (!FINNF.ativo) return;
  const limite = Date.now() - 30 * 86400000;
  const falta = Object.entries(FINNF.sit || {}).filter(([, n]) => n && n.id && n.situacao === 'autorizada' && (!n.pdf || !n.xml)
      && !NF_BUSCADOS.has(n.id) && (!n.criado_em || new Date(n.criado_em).getTime() >= limite)).slice(0, 5);
  nfBuscarComprovantes();   // F12 · 517
  if (!falta.length) return;
  falta.forEach(([, n]) => NF_BUSCADOS.add(n.id));
  (async () => {
    let chegou = false;
    for (const [tid, n] of falta){
      try{ const j = await nfFuncao({ acao: 'consultar', titulo_id: tid, nfse_id: n.id }); if (j && ((j.pdf && !n.pdf) || (j.xml && !n.xml))) chegou = true; }
      catch(e){ /* fica para a próxima abertura, ou para o "Atualizar" */ }
    }
    if (!chegou) return;
    try{ FINNF.sit = (await rpc('tf_fin_nfse_situacoes', {})) || FINNF.sit; }catch(e){ return; }
    if (typeof REPINTA !== 'undefined' && REPINTA.finre && document.getElementById('finreLista')) REPINTA.finre();
  })();
}

/** F12 · 517: o XML do cancelamento que o Notaas ainda não tinha (inclui as canceladas antes do F12).
 *  Até 5 por abertura, a mais nova primeiro, uma vez por nota, sem janela nem aviso. Sem o 517, nada. */
async function nfBuscarComprovantes(){
  let L;
  try{ L = await rpc('tf_fin_nfse_sem_comprovante', {}); }catch(e){ return; }
  const falta = (L || []).filter(x => x && x.nfse_id && !NF_BUSCADOS.has(x.nfse_id));
  if (!falta.length) return;
  falta.forEach(x => NF_BUSCADOS.add(x.nfse_id));
  for (const x of falta){
    try{ await nfFuncao({ acao: 'consultar', titulo_id: x.titulo_id, nfse_id: x.nfse_id }); }
    catch(e){ /* fica para a próxima abertura, ou para o "Buscar comprovante" */ }
  }
  let depois;
  try{ depois = await rpc('tf_fin_nfse_sem_comprovante', {}); }catch(e){ return; }
  const ainda = new Set((depois || []).map(x => x.nfse_id));
  if (!falta.some(x => !ainda.has(x.nfse_id))) return;   // nenhum chegou
  try{ FINNF.sit = (await rpc('tf_fin_nfse_situacoes', {})) || FINNF.sit; }catch(e){ return; }
  if (typeof REPINTA !== 'undefined' && REPINTA.finre && document.getElementById('finreLista')) REPINTA.finre();
}

/** A nota (a última) do título, se houver. */
const nfDe = t => (FINNF.ativo && t && FINNF.sit[t.id]) || null;
/** F5: nota que ainda vale (ou está a caminho): o título não pode ser anulado. */
const nfViva = t => { const n = nfDe(t); return !!(n && ['emitindo', 'autorizada', 'cancelando'].includes(n.situacao)); };
/** F5: a chave de acesso (50 dígitos) e o número curto da NFS-e. O Notaas devolve o Id do XML
 *  ("NFS" + chave); o número de verdade está na chave, nas posições 24 a 36. O banco (505) já grava
 *  o curto; isto aqui só protege a tela de uma nota antiga. */
const nfChave = n => { const c = String((n && n.chave) || '').replace(/\D/g, ''); if (c.length === 50) return c;
  const m = /^(?:NFS)?(\d{50})$/.exec(String((n && n.numero) || '')); return m ? m[1] : ''; };
const nfNumero = n => { const c = nfChave(n); if (c) return String(Number(c.slice(23, 36)));
  return (n && n.numero) ? String(n.numero) : ''; };

function nfChip(t){
  const n = nfDe(t); if (!n) return '';
  const teste = n.ambiente === 'teste' ? ' (teste)' : '';
  let cls = '', txt = NF_SIT[n.situacao] || n.situacao;
  if (n.situacao === 'autorizada'){ cls = ' fOk'; txt = 'NFS-e ' + nfNumero(n) + teste; }
  else if (n.situacao === 'rejeitada'){ cls = ' fCrit'; }
  else if (n.situacao === 'emitindo' || n.situacao === 'cancelando'){ cls = ' fAtn'; }
  return ' <span class="chip' + cls + '" title="' + esc((n.motivo || n.cancel_resposta || txt)) + '">' + esc(txt) + '</span>'
    + (n.situacao === 'autorizada' && n.pdf ? ' <a href="#" data-nfdoc="pdf" data-nfpath="' + esc(n.pdf_path) + '" style="font-size:11px">PDF</a>' : '')
    + (n.situacao === 'autorizada' && n.xml ? ' <a href="#" data-nfdoc="xml" data-nfpath="' + esc(n.xml_path) + '" style="font-size:11px">XML</a>' : '')
    // F12 · 517: o comprovante do cancelamento é o XML do evento (o Notaas não fornece PDF dele)
    + (n.situacao === 'cancelada' && n.xml_cancel && n.xml_cancel_path ? ' <a href="#" data-nfdoc="xml" data-nfpath="' + esc(n.xml_cancel_path)
         + '" style="font-size:11px;white-space:nowrap" title="O comprovante do cancelamento (XML do evento). O PDF com a situação Cancelada fica no portal nacional.">Cancelamento (XML)</a>' : '');
}

/** Abre o PDF / baixa o XML do compartimento privado (com o token de quem clicou). */
async function nfAbrirDoc(caminho, tipo){
  const janela = tipo === 'pdf' ? window.open('', '_blank') : null;
  try{
    const r = await rhfdFetch(SUPABASE_URL + '/storage/v1/object/fin-nfse/' + String(caminho).split('/').map(encodeURIComponent).join('/'), {});
    if (!r.ok) throw new Error('o arquivo não abriu (código ' + r.status + ')');
    const url = URL.createObjectURL(await r.blob());
    if (janela) janela.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = String(caminho).split('/').pop(); document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ if (janela) janela.close(); toast('Não abriu o arquivo da nota: ' + e.message, 'err'); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-nfdoc]'); if (!a) return;
  e.preventDefault(); nfAbrirDoc(a.dataset.nfpath, a.dataset.nfdoc);
});

/** Chama a função do servidor. Token vencido: renova uma vez pelo núcleo e repete. */
async function nfFuncao(corpo){
  const vai = () => fetch(SUPABASE_URL + '/functions/v1/fin-nfse', { method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + sessao.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo), signal: AbortSignal.timeout ? AbortSignal.timeout(60000) : undefined });
  let r;
  try{ r = await vai(); }
  catch(e){ throw new Error('O servidor não respondeu. Use "Atualizar" na nota antes de tentar de novo — ela pode ter saído.'); }
  if (r.status === 401 && sessao.refresh){
    try{ await Nucleo.api.rpc('tf_fin_autorizado', {}); }catch(e){}
    r = await vai();
  }
  let j = null; try{ j = await r.json(); }catch(e){}
  if (!r.ok || !j || !j.ok) throw new Error((j && j.erro) || ('Erro ' + r.status + ' na emissão.'));
  return j;
}

function nfResultado(j, verbo){
  const teste = j.ambiente === 'teste' ? ' (TESTE, sem valor fiscal)' : '';
  if (j.situacao === 'autorizada' && verbo === 'emitir') toast('NFS-e ' + nfNumero(j) + ' emitida' + teste + '. O título foi faturado.', 'ok');
  else if (j.situacao === 'cancelada') toast('NFS-e ' + nfNumero(j) + ' cancelada. O título voltou para "A faturar".', 'ok');
  else if (j.situacao === 'rejeitada') nfAvisoRecusa(j.motivo);
  else if (j.situacao === 'autorizada' && j.cancel_resposta) nfAvisoRecusa('Cancelamento recusado: ' + j.cancel_resposta);
  else if (j.aviso) finAvisoJanela('Nota fiscal: atenção', j.aviso);
  else if (j.situacao === 'emitindo') finAvisoJanela('A nota ainda está sendo emitida', 'A nota ainda está sendo emitida. Daqui a pouco, use "Atualizar nota" (o botão da conta) ou "Atualizar" no quadro Notas fiscais.');
  else if (j.situacao === 'cancelando') finAvisoJanela('O cancelamento está em andamento', 'O cancelamento da nota está em andamento. Mais tarde, use "Atualizar nota" (o botão da conta) ou "Atualizar" no quadro Notas fiscais.');
  else toast('Nota atualizada.', 'ok');
}

 *  com a cidade e o local do padrão, sem aviso. O e-mail e o pedido só são gravados depois do "Emitir" confirmado. */
/* F32 (sobra da R14, achado do portão do S207): a janela que "se repintava e devolvia a cidade do cliente" — duas aberturas
   seguidas (dois cliques em "Emitir nota", ou abrir de novo enquanto a 1ª ainda buscava a conferência no servidor) pintavam
   a janela duas vezes, e a 2ª, mais lenta, chegava DEPOIS de a pessoa digitar a cidade. Agora só a abertura mais nova pinta. */
let _nfEmitirSeq = 0;
async function modalEmitirNota(t, rasc){

  try{ sugs = await rpc('tf_fin_nfse_descricoes', {}); }catch(e){ sugs = []; }   // sem o 511, sem sugestões
  if (meu !== _nfEmitirSeq) return;   // outra abertura começou depois desta: ela é que pinta
  const r = prep.resumo, infoAuto = r.info_complementar || '';

      nfFaixaTeste(prep.ambiente)
    + jfAvisoEmitir(t) + condLinhaNota(t, R.cond, r.valor)   // F34 · 238 (M1): a condição, com "trocar"

    +   '<input id="nfEmail" type="email" autocomplete="off" value="' + esc(R.email) + '" placeholder="financeiro@cliente.com.br"></div>'
    + '<div class="campo"><label for="nfDesc">Descrição do serviço (sai na nota)</label>'

         + sugs.map(x => '<option value="' + esc(x) + '">' + esc(x.length > 90 ? x.slice(0, 88) + '…' : x) + '</option>').join('') + '</select>' : '')

    +     '<span id="nfDescN">' + descIni.length + '/2000</span></small>'
    +   '<div class="nota" style="margin:2px 0 0">Código 14.01.01 · Simples Nacional: ISS pelo DAS · sem retenções · competência ' + esc(dataBR(r.competencia)) + '</div></div>'

    +  '<div class="campo"><label>Valor</label><input type="text" value="' + esc(BRL(r.valor)) + '" readonly></div>'

        + '<option value="050103"' + (R.indop === '050103' ? ' selected' : '') + '>Feito todo no cliente (05.01.03) — imposto para a cidade do serviço</option>'

    [{ label: 'Cancelar', onClick: fecharModal },
     { label: 'Emitir nota', pri: true, onClick: async () => {
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const desc = v('nfDesc');
        if (!desc){ toast('Escreva a descrição do serviço (é o texto que sai na nota).', 'err'); return; }
        if (!prep.pode_emitir && !soDesc){ toast((prep.erros || []).join(' '), 'err'); return; }
        // 181: tudo lido AQUI, antes da confirmação (ela fecha esta janela); o e-mail e o pedido só gravam depois do "Emitir"
        const email = v('nfEmail'), pedido = v('nfPedido'), cid = v('nfCid'), uf = v('nfUf').toUpperCase();
        const indop = document.getElementById('nfIndOp') ? v('nfIndOp') : '';
        const cond = condLidaNota(t), cEl = document.getElementById('ncCond');   // F34 · 238 (M1)
        const novo = { desc, email, pedido, cid, uf, indop, info: v('nfInfo'), infoMexeu, cond: cEl ? cEl.value.trim() : undefined };
        if (cond === null){ Nucleo.janela.erro('Condição de pagamento: escreva os dias separados por barra, crescendo (15/30/45/60; 0 = no ato).', cEl); return; }

        const opcoes = { info_complementar: novo.info, local_cidade: cid, local_uf: uf, descricao: desc };
        if (indop) opcoes.ind_op = indop;
        const rotOp = { '050101': 'nas dependências da Engetap (05.01.01) — imposto para Divinópolis', '050103': 'feito todo no cliente (05.01.03) — imposto para a cidade do serviço' };
        const ok = await confirmar('Emitir a nota?',

        try{

        }catch(e){ toast(e.message, 'err'); modalEmitirNota(t, novo); return; }

     }}]);
  const bEmitir = [...document.querySelectorAll('#mFoot .btn')].pop(), dEl = document.getElementById('nfDesc');

               : [p ? 'ORDEM DE COMPRA Nº ' + p : '', r.proposta ? 'PROPOSTA ' + r.proposta : ''].filter(Boolean).join(' // ');
  });
}

/** Roda uma ação no servidor com a janela "trabalhando", e recarrega a lista. */
async function nfExecutar(fn, verbo, rotulo){
  abrirModal(rotulo, '<p style="margin:6px 0">' + esc(rotulo) + ' Isso leva alguns segundos; não feche a página.</p>', []);
  let j = null;
  try{ j = await fn(); }
  catch(e){ fecharModal(); toast(e.message, 'err'); await finreCarregar(); return; }
  fecharModal();
  await finreCarregar();
  nfResultado(j, verbo);
}

/** F12 · 517: pede à fin-nfse o XML do cancelamento ("consultar" busca e guarda) e reabre o histórico. */
async function nfBuscarComprovante(t, nfseId){
  abrirModal('Buscar comprovante', '<p style="margin:6px 0">Buscando o comprovante do cancelamento no Notaas… Isso leva alguns segundos.</p>', []);
  let tem = false;
  try{
    await nfFuncao({ acao: 'consultar', titulo_id: t.id, nfse_id: nfseId });
    const L = await rpc('tf_fin_nfse_listar', { p_titulo_id: t.id });
    tem = !!((L || []).find(x => x.id === nfseId) || {}).xml_cancel_path;
  }catch(e){ fecharModal(); toast(e.message, 'err'); return; }
  fecharModal();
  toast(tem ? 'Comprovante do cancelamento guardado: "Cancelamento (XML)".'
            : 'O Notaas ainda não tem o comprovante. O TapFin tenta de novo na próxima abertura; o "Ver no portal nacional" continua valendo.', tem ? 'ok' : 'err');
  await finreCarregar();
  modalNotasTitulo(t);
}

/** CNPJ/CPF com pontuação, só para ler. */
function finDocFmt(d){
  d = String(d || '').replace(/\D/g, '');
  if (d.length === 14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
  if (d.length === 11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  return d || '—';
}

function finChipCartao(t){
  const c = t.cartao; if (!c) return '';
  if (!c.conciliado) return ' <span class="chip risco" title="Lançada por um canhoto. O vencimento é estimado; a fatura do cartão confirma.">Cartão · a conciliar</span>';
  return ' <span class="chip' + (c.fatura_situacao === 'paga' ? ' fOk' : ' prog') + '" title="Entrou na fatura deste cartão — paga com a fatura">Fatura '
    + esc(c.cartao_nome || '') + ' ' + esc(dataBR(c.fatura_vencimento).slice(0, 5)) + '</span>';
}

function finpgPrimaria(t){
  if (t.cartao && Number(t.saldo) > 0) return { acao:'cartoes', rot:'Cartões' };   // S60 · corrigir e pagar é pela fatura
  if (!(Number(t.valor) > 0)) return { acao:'editar', rot:'Editar' };      // R$ 0,00: primeiro o valor real
  if (Number(t.saldo) > 0) return { acao:'baixar', rot:'Baixar' };
  return { acao:'baixas', rot:'Baixas' };
}

function finpgMenu(t){
  const p = finpgPrimaria(t).acao;
  const M = [];
  // S60 · conta de cartão: sem Editar/Anular soltos (a soma da fatura depende dela)
  if (t.cartao) return p === 'baixas' ? [{ acao:'cartoes', rot:'Abrir no Cartões' }] : [{ acao:'baixas', rot:'Baixas' }];
  if (p !== 'editar') M.push({ acao:'editar', rot:'Editar' });
  if (p !== 'baixas') M.push({ acao:'baixas', rot:'Baixas' });
  M.push({ acao:'anular', rot:'Anular', perigo:true });
  return M;
}

function finpgAcao(a, t){
  if (a === 'cartoes'){ CAR.aba = t.cartao && t.cartao.fatura_id ? 'faturas' : 'canhotos'; CAR.faturaId = (t.cartao && t.cartao.fatura_id) || null;
    CAR.fatura = null; return irPara('fincar'); }   // S60
  if (a === 'editar') return modalTituloPagar(t);
  if (a === 'baixar') return modalBaixarTitulo(t, finpgCarregar);
  if (a === 'baixas') return modalVerBaixas(t, finpgCarregar);
  if (a === 'anular') return modalAnularTituloPagar(t);
}

/* F31 (S209, issue 105): baixar várias contas a pagar de uma vez. A caixa de marcar aparece em cada conta em aberto que dá para
   quitar assim (não a do cartão, que se paga pela fatura, nem a com "valor a confirmar"); a faixa de cima soma as marcadas.
   Uma janela só com data, conta bancária e forma; cada conta é quitada pelo saldo dela, tudo ou nada (tf_fin_baixar_varios, 527). */
const finpgMarcavel = t => !t.anulado && Number(t.valor) > 0 && Number(t.saldo) > 0 && !t.cartao && !finConfirmar(t);
const finpgMarcadas = () => (FINPG.lista || []).filter(t => FINPG.marcadas.has(String(t.id)) && finpgMarcavel(t));

function finpgFaixaMarcadas(){
  const f = document.getElementById('finpgMarcadas'); if (!f) return;
  const M = finpgMarcadas();
  FINPG.marcadas = new Set(M.map(t => String(t.id)));   // a que foi paga ou anulada por fora sai da conta
  const vis = [...document.querySelectorAll('#finpgLista [data-marca]')];
  const nVis = vis.filter(c => !c.checked).length;
  if (!M.length){
    f.hidden = !nVis;
    f.innerHTML = nVis ? '<span>Marque as contas para baixar várias de uma vez.</span>'
      + ' <button class="btn" type="button" data-marcavis="1">Marcar as ' + nVis + ' em aberto da lista</button>' : '';
  } else {
    const tot = M.reduce((s, t) => s + (Number(t.saldo) || 0), 0);
    f.hidden = false;
    f.innerHTML = '<b>' + finPlural(M.length, 'conta marcada', 'contas marcadas') + ' · ' + esc(BRL(tot)) + '</b>'
      + ' <button class="btn pri" type="button" data-baixarmarc="1">Baixar as marcadas (' + M.length + ' · ' + esc(BRL(tot)) + ')</button>'
      + (nVis ? ' <button class="btn" type="button" data-marcavis="1">Marcar as ' + nVis + ' que faltam da lista</button>' : '')
      + ' <button class="btn" type="button" data-desmarc="1">Desmarcar</button>';
  }
}

function finpgLigarMarcas(){
  const el = document.getElementById('finpgLista'), f = document.getElementById('finpgMarcadas');
  if (!el || !f) return;
  el.addEventListener('change', e => {
    const c = e.target.closest('[data-marca]'); if (!c) return;
    if (c.checked) FINPG.marcadas.add(c.dataset.marca); else FINPG.marcadas.delete(c.dataset.marca);
    finpgFaixaMarcadas();
  });
  f.addEventListener('click', e => {
    if (e.target.closest('[data-desmarc]')){ FINPG.marcadas.clear(); finpgDesenhar(); return; }
    if (e.target.closest('[data-marcavis]')){
      document.querySelectorAll('#finpgLista [data-marca]').forEach(c => FINPG.marcadas.add(c.dataset.marca));
      finpgDesenhar(); return;
    }
    if (e.target.closest('[data-baixarmarc]')) modalBaixarVarias();
  });
}

    return;

  if (a === 'pausar'){

/* F32 (issue 95): "Gerar títulos do mês" só gerava o mês em que se clicava: o mês esquecido nunca nascia. Agora, depois do
   mês corrente, a janela mostra os meses anteriores sem conta (até 3, desde o início e até o mês final de cada recorrência;
   fora a de cartão, a pausada e a de valor fixo R$ 0) e pergunta "Gerar também os de outubro?". Cada linha se marca; só os
   marcados nascem (tudo ou nada, tf_fin_gerar_titulos_atrasados), com a competência e o vencimento do próprio mês. */
function finrecAtrasadas(A, n, P){
  const porMes = {};
  A.forEach(x => { const k = String(x.mes).slice(0, 7); (porMes[k] = porMes[k] || []).push(x); });
  const meses = Object.keys(porMes).sort();
  const nomeMes = k => FIN_MESES_LONGO[Number(k.slice(5, 7)) - 1].toLowerCase() + (k.slice(0, 4) === isoHoje().slice(0, 4) ? '' : '/' + k.slice(0, 4));
  const lista = meses.map(nomeMes);
  const pergunta = 'Gerar também ' + (lista.length === 1 ? 'os de ' + lista[0] : 'os de ' + lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1]) + '?';
  abrirModal('Títulos do mês',
      '<p style="margin-top:0">' + (n > 0 ? '<b>' + n + ' título(s) gerado(s)</b> em Contas a Pagar, deste mês.' : 'Nenhum título novo deste mês.')
    + (P.length ? ' ' + finPlural(P.length, 'recorrência ficou', 'recorrências ficaram') + ' de fora porque já tinha(m) conta vencendo neste mês.' : '') + '</p>'
    + '<p class="nota">Estas recorrências <b>ficaram sem conta</b> em meses anteriores (ninguém clicou em “Gerar títulos do mês” naquele mês). '
    + 'Confira cada uma: se foi paga de outro jeito ou não devia existir, desmarque.</p>'
    + '<p><b>' + esc(pergunta) + '</b></p>'
    + meses.map(k => '<div class="finAtrMes"><div class="ccLin cab finPul"><span>' + esc(FIN_MESES_LONGO[Number(k.slice(5, 7)) - 1] + '/' + k.slice(0, 4)) + '</span><span>Fornecedor</span><span class="n">Valor</span></div>'
        + porMes[k].map((x, i) => '<label class="ccLin finPul finAtr"><span class="ccData"><input type="checkbox" checked data-atr="' + esc(x.recorrencia_id) + '|' + esc(String(x.mes).slice(0, 10)) + '"> '
          + esc(dataBR(x.vencimento)) + '</span><span>' + esc(x.fornecedor_nome || '—') + (finDescOk(x.descricao) ? ' <small style="color:var(--ink-3)">· ' + esc(x.descricao) + '</small>' : '')
          + (x.variavel ? ' <small style="color:var(--ink-3)">· valor a confirmar</small>' : '') + '</span>'
          + '<span class="n">' + esc(BRL(x.valor)) + '</span></label>').join('') + '</div>').join(''),
    [{ label:'Não gerar', onClick: fecharModal },
     { label:'Gerar os marcados', pri:true, onClick: async () => {
        const itens = [...document.querySelectorAll('#mBody [data-atr]')].filter(c => c.checked)
          .map(c => { const [id, mes] = c.dataset.atr.split('|'); return { recorrencia_id: id, mes }; });
        if (!itens.length){ Nucleo.janela.erro('Marque ao menos um mês, ou use “Não gerar”.'); return; }
        let g;
        try{ g = await rpc('tf_fin_gerar_titulos_atrasados', { p_itens: itens }); }
        catch(e){ Nucleo.janela.erro(e.message); return; }
        fecharModal();
        toast(g + ' título(s) de meses anteriores gerado(s) em Contas a Pagar.', 'ok');
        await finrecCarregar();
     }}]);
}

  d.setUTCDate(d.getUTCDate() + Number(n || 0));
  return d.toISOString().slice(0, 10);

function finDiasEntre(a, b){
  const x = new Date(String(a).slice(0, 10) + 'T12:00:00Z'), y = new Date(String(b).slice(0, 10) + 'T12:00:00Z');
  return Math.round((y - x) / 86400000);
}

const CAR = { aba: 'canhotos', painel: null, grupos: [], fatura: null, faturaId: null, fotos: new Map(), resolvidasAbertas: false };

const CAR_DIA_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

const carDiaTxt = iso => iso ? dataBR(iso).slice(0, 5) + ' (' + CAR_DIA_SEM[new Date(String(iso).slice(0, 10) + 'T12:00').getDay()] + ')' : '';

const carNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/** F25 (issue 189): pelo leitor único do núcleo: "1.250" = 1.250,00 (antes R$ 1,25). NaN quando vazio ou inválido. */
function carNum(txt){
  const n = Nucleo.util.lerValor(txt);
  return n == null || !isFinite(n) ? NaN : Math.round(n * 100) / 100;
}

const carValTxt = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function carOpcoesCat(sel){

    + (g.subcategorias || []).filter(s => s.ativa !== false || (g.id + '|' + s.id) === sel).map(s => { const v = g.id + '|' + s.id;   // F32 (issue 103)
        return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(s.nome) + (s.ativa === false ? ' (desativada)' : '') + '</option>'; }).join('')
    + '<option value="' + esc(g.id + '|') + '"' + ((g.id + '|') === sel ? ' selected' : '') + '>' + esc(g.nome) + ' (sem subcategoria)</option>'
    + '</optgroup>').join('');
}

const carCatVal = (g, s) => g ? g + '|' + (s || '') : '';

function carCatNome(g, s){
  const G = (CAR.grupos || []).find(x => x.id === g); if (!G) return '';
  const S = (G.subcategorias || []).find(x => x.id === s);
  return S ? S.nome : G.nome;
}

const CAR_REGRAS = [
  [/abastec|combust|gasolin|diesel|etanol|\bposto\b|auto posto/, ['combust']],
  [/hotel|hosped|pousada/, ['hosped']],
  [/pedag|veloe|sem parar|conectcar/, ['pedag']],
  [/supermerc|mercado|cafe|acucar|limpeza|padaria/, ['limpeza', 'insumo']],
  [/papelaria|livrar|escritorio|impress|grafic/, ['material de escrit', 'servicos graf']],
  [/ferrament|parafus|material|peca|eletric|hidraul|construc/, ['insumo', 'manutencao de equip']],
  [/estacion|lavagem|borrach|oficina|pneu/, ['despesas veic', 'manutencao de veic']],
  [/curso|treinament|ensino/, ['curso']],
  [/frete|correio|sedex|transportad/, ['frete']],
  [/\biof\b|anuidade|tarifa|juros|encargo/, ['taxa']]
];

function carSugerir(texto){
  const t = carNorm(texto);
  for (const [re, alvos] of CAR_REGRAS){
    if (!re.test(t)) continue;
    for (const a of alvos){
      for (const g of (CAR.grupos || []).filter(x => x.tipo === 'p')){
        const s = (g.subcategorias || []).find(x => x.ativa !== false && carNorm(x.nome).indexOf(a) >= 0);
        if (s) return g.id + '|' + s.id;
      }
    }
  }
  return '';
}

const carUrl = path => SUPABASE_URL + '/storage/v1/object/cartoes/' + String(path).split('/').map(encodeURIComponent).join('/');

async function carFoto(path){
  if (!path) return '';
  if (CAR.fotos.has(path)) return CAR.fotos.get(path);
  const p = (async () => {
    const r = await rhfdFetch(carUrl(path), {});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return URL.createObjectURL(await r.blob());
  })();
  CAR.fotos.set(path, p);
  try{ return await p; }catch(e){ CAR.fotos.delete(path); return ''; }
}

  if (!el || el.tagName === 'BUTTON') return _semDuploEnvio_(el, fn);
  if (el.dataset.enviando === '1') return;
  el.dataset.enviando = '1'; const d = el.disabled; el.disabled = true; el.classList.add('ocupado');
  try{ return await fn(); } finally{ el.disabled = d; el.classList.remove('ocupado'); delete el.dataset.enviando; }
}

/** F28 · issue 185 (item 3): depois de lançar uma linha, a tela é redesenhada — e o que a pessoa já tinha escolhido nas
 *  OUTRAS linhas (categoria, descrição, valor, data) voltava ao sugerido. Agora o que foi mexido (marcado no "input" e
 *  no "change") é guardado antes e devolvido depois, linha por linha (canhoto: data-c; linha da fatura: data-l). */
const carCampoChave = (ln, i) => i.dataset.campo || i.getAttribute('aria-label') || String([...ln.querySelectorAll('input,select,textarea')].indexOf(i));
function carGuardarEscolhas(el){
  const m = {};
  (el || document).querySelectorAll('.carLin[data-c], .carLin[data-l]').forEach(ln => {
    const k = ln.dataset.c ? 'c:' + ln.dataset.c : 'l:' + ln.dataset.l, v = {};
    ln.querySelectorAll('input,select,textarea').forEach(i => { if (i.dataset.mexido === '1' && i.type !== 'file')
      v[carCampoChave(ln, i)] = i.type === 'checkbox' ? (i.checked ? '1' : '') : i.value; });
    if (Object.keys(v).length) m[k] = v;
  });
  return m;
}
function carDevolverEscolhas(el, m){
  if (!m || !Object.keys(m).length) return;
  (el || document).querySelectorAll('.carLin[data-c], .carLin[data-l]').forEach(ln => {
    const v = m[ln.dataset.c ? 'c:' + ln.dataset.c : 'l:' + ln.dataset.l]; if (!v) return;
    ln.querySelectorAll('input,select,textarea').forEach(i => {
      const k = carCampoChave(ln, i); if (!(k in v)) return;
      if (i.type === 'checkbox') i.checked = v[k] === '1'; else i.value = v[k];
      i.dataset.mexido = '1';
    });
  });
}
['input', 'change'].forEach(ev => document.addEventListener(ev, e => {
  const i = e.target; if (i && i.closest && i.closest('#carCorpo .carLin')) i.dataset.mexido = '1';
}, true));

function carLigarLinhaCanhoto(ln){
  const c = (CAR.painel.comprovantes || []).find(x => x.id === ln.dataset.c); if (!c) return;
  const bl = ln.querySelector('[data-lancar]'), bd = ln.querySelector('[data-dev]');
  const lancar = () => _semDuploEnvio_(bl, async () => {
    const valor = carNum(ln.querySelector('.carValor input').value);
    const [g, s] = (ln.querySelector('.carCat select').value || '').split('|');
    const desc = ln.querySelector('.carDesc input').value;
    const di = ln.querySelector('.carDataC input'), data = (di && di.value) || c.data_compra;
    if (!(valor > 0)){ toast('Confira o valor do canhoto.', 'err'); ln.querySelector('.carValor input').focus(); return; }
    if (!g){ toast('Escolha a categoria.', 'err'); ln.querySelector('.carCat select').focus(); return; }
    if (!data || data > isoHoje()){ toast('Confira a data da compra (não pode ser depois de hoje).', 'err'); if (di) di.focus(); return; }
    // F28 · 185 (item 4): a confirmação é de CADA valor diferente (antes, confirmado um, o seguinte passava direto)
    if (valor !== Number(c.valor) && ln.dataset.okValor !== String(valor)){
      ln.dataset.okValor = String(valor);
      toast('O valor mudou de ' + BRL(c.valor) + ' para ' + BRL(valor) + '. Clique de novo para confirmar.', 'err'); return;
    }
    try{
      await rpc('tf_cartao_lancar', { p_id: c.id, p_grupo_id: g, p_subcategoria_id: s || null, p_descricao: desc,
        p_valor: valor, p_data: data, p_os_codigo: null });
      ln.classList.add('feito');
      const prox = ln.nextElementSibling || (ln.closest('.carDia') && ln.closest('.carDia').nextElementSibling && ln.closest('.carDia').nextElementSibling.querySelector('.carLin'));
      toast((c.situacao === 'lancado' ? 'Corrigido: ' : 'Lançado: ') + BRL(valor) + ' · ' + (desc || c.frase || '')
        + (data !== c.data_compra ? ' · data da compra ' + dataBR(data) + ' (no histórico da conta)' : ''), 'ok');
      const foco = prox && prox.dataset && prox.dataset.c;
      await carCarregar();
      if (foco){ const s2 = document.querySelector('.carLin[data-c="' + foco + '"] .carCat select'); if (s2) s2.focus(); }
    }catch(e){ toast(e.message, 'err'); }
  });
  bl.addEventListener('click', lancar);
  // Enter em qualquer campo da linha lança (o escritório vai de linha em linha no teclado)
  ln.querySelectorAll('input,select').forEach(i => i.addEventListener('keydown', ev => {

function carCsvLinhas(txt){
  // F28 · 186 (item 3): o separador pelas 10 primeiras linhas (como o leitor da Conta corrente), não só pela 1ª — o
  // CSV com um título em cima era lido com o separador errado. Cada linha guarda o número dela NO ARQUIVO (_n).
  const prim = txt.split(/\r?\n/).slice(0, 10).join('\n');
  const sep = (prim.match(/;/g) || []).length > (prim.match(/,/g) || []).length ? ';' : ',';
  const L = []; let lin = [], cel = '', aspas = false, nArq = 1, nIni = 1;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (aspas){ if (ch === '"'){ if (txt[i + 1] === '"'){ cel += '"'; i++; } else aspas = false; } else { if (ch === '\n') nArq++; cel += ch; } continue; }
    if (ch === '"') aspas = true;
    else if (ch === sep){ lin.push(cel); cel = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i + 1] === '\n') i++; lin.push(cel); lin._n = nIni; L.push(lin); lin = []; cel = ''; nArq++; nIni = nArq; }
    else cel += ch;
  }
  if (cel || lin.length){ lin.push(cel); lin._n = nIni; L.push(lin); }
  return L.filter(l => l.some(c => String(c).trim()));
}

const carDataBR = s => { const m = String(s || '').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : null; };

function carLerCsv(txt){
  const L = carCsvLinhas(txt.replace(/^﻿/, ''));
  const cab = L.findIndex(l => l.map(c => carNorm(c).trim()).indexOf('data') >= 0 && l.map(c => carNorm(c).trim()).indexOf('valor') >= 0);
  const cabNu = L.findIndex(l => ['date', 'title', 'amount'].every(k => l.map(c => carNorm(c).trim()).indexOf(k) >= 0));
  const out = { banco: null, linhas: [], vencDDMM: null, avisos: [], pulos: [] };
  const tipoDe = (estab, tipoTxt, valorAPagar) => {
    const pm = String(tipoTxt || '').match(/parcela\s*(\d+)\s*(?:\/|de)\s*(\d+)/i) || String(estab).match(/parcela\s*(\d+)\s*(?:\/|de)\s*(\d+)/i);
    if (/pagamento/i.test(estab) && valorAPagar < 0) return { tipo: 'pagamento' };
    if (valorAPagar < 0) return { tipo: 'estorno' };
    if (pm) return { tipo: 'parcela', k: Number(pm[1]), n: Number(pm[2]) };
    if (/\biof\b|anuidade|tarifa|juros|encargo|multa/i.test(estab)) return { tipo: 'tarifa' };
    return { tipo: 'compra' };
  };
  if (cab >= 0){
    out.banco = 'inter';
    const H = L[cab].map(c => carNorm(c).trim());
    const ix = k => H.findIndex(h => h === k || h.startsWith(k));
    const iD = ix('data'), iC = ix('cartao'), iL = ix('lancamento'), iCat = ix('categoria'), iT = ix('tipo'), iV = ix('valor');
    L.slice(0, cab).forEach(l => { if (carNorm(l[0]).trim() === 'vencimento' && /^\d{2}\/\d{2}/.test(String(l[1]).trim())) out.vencDDMM = String(l[1]).trim().slice(0, 5); });
    L.slice(cab + 1).forEach(l => {
      const data = carDataBR(l[iD]);
      if (!data){                                                      // "Total", linhas vazias — e a data fora do formato
        // F28 · 186 (item 3): linha com valor e sem data dd/mm/aaaa não some calada (só aparecia como diferença no total)
        if (String(l[iV] || '').trim() && !/^total|^saldo/i.test(carNorm(l[iD] || l[iL] || '').trim())) out.pulos.push('linha ' + l._n + ': data "' + String(l[iD] || '').trim() + '" não está no formato dd/mm/aaaa');
        return;
      }
      const v = carNum(l[iV]); if (!isFinite(v)) { out.pulos.push('linha ' + l._n + ': valor "' + l[iV] + '" não lido'); return; }
      // "Lançamento" é de largura fixa: nome em 22, cidade em 13, país em 3
      // ("PIRATININGA FERRAMENTA DIVINOPOLIS   BRA" não tem dois espaços entre
      // o nome e a cidade). Fora desse formato, separa por 2+ espaços.
      const bruto = String(l[iL] || '').replace(/\u00a0/g, ' ').replace(/\s+$/, '');
      let estab, cidade;
      if (bruto.length >= 30 && /\s[A-Z]{3}$/.test(bruto) && bruto.charAt(22) === ' '){
        estab = bruto.slice(0, 22).trim(); cidade = bruto.slice(23, bruto.length - 3).trim();
      } else {
        const partes = bruto.trim().split(/\s{2,}/);
        estab = (partes[0] || '').trim();
        cidade = partes.length > 2 ? partes[1].trim() : (partes.length === 2 && !/^[A-Z]{3}$/.test(partes[1].trim()) ? partes[1].trim() : '');
      }
      const dig = String(l[iC] || '').replace(/\D/g, '');
      const aPagar = -v;                                               // compra vem negativa
      const t = tipoDe(estab, l[iT], aPagar);
      out.linhas.push({ data, estabelecimento: estab, cidade, categoria: iCat >= 0 ? String(l[iCat] || '').trim() : '',
        final: dig.length >= 4 && t.tipo !== 'pagamento' ? dig.slice(-4) : '', tipo: t.tipo, parcela_k: t.k || null, parcela_n: t.n || null, valor: Math.round(aPagar * 100) / 100 });
    });
  } else if (cabNu >= 0){
    out.banco = 'nubank'; out.avisos.push('Leitor do Nubank provisório (date, title, amount): confira as linhas antes de importar.');
    const H = L[cabNu].map(c => carNorm(c).trim());
    const iD = H.indexOf('date'), iT = H.indexOf('title'), iV = H.indexOf('amount');
    L.slice(cabNu + 1).forEach(l => {
      const data = /^\d{4}-\d{2}-\d{2}/.test(String(l[iD]).trim()) ? String(l[iD]).trim().slice(0, 10) : carDataBR(l[iD]);
      if (!data){ if (String(l[iV] || '').trim()) out.pulos.push('linha ' + l._n + ': data "' + String(l[iD] || '').trim() + '" não lida'); return; }
      const v = Number(String(l[iV]).replace(',', '.')); if (!isFinite(v)){ out.pulos.push('linha ' + l._n + ': valor "' + l[iV] + '" não lido'); return; }
      const estab = String(l[iT] || '').trim(); const t = tipoDe(estab, '', v);
      out.linhas.push({ data, estabelecimento: estab.replace(/\s*-\s*parcela\s*\d+\/\d+\s*$/i, ''), cidade: '', categoria: '', final: '',
        tipo: t.tipo, parcela_k: t.k || null, parcela_n: t.n || null, valor: Math.round(v * 100) / 100 });
    });
  }
  if (out.pulos.length) out.avisos.push(finPlural(out.pulos.length, 'linha ficou de fora', 'linhas ficaram de fora') + ' (confira no arquivo): '
    + out.pulos.slice(0, 8).join('; ') + (out.pulos.length > 8 ? '; e mais ' + (out.pulos.length - 8) : '') + '.');
  return out;
}

function carVencDoCsv(ddmm, linhas){
  if (!ddmm) return null;
  const maior = linhas.map(l => l.data).sort().pop() || isoHoje();
  let a = Number(maior.slice(0, 4)); let v = a + '-' + ddmm.slice(3, 5) + '-' + ddmm.slice(0, 2);
  if (v < maior) v = (a + 1) + v.slice(4);
  return v;
}

async function carLerPdf(file){
  const lib = await carregarPdfJs();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  let txt = '';
  for (let i = 1; i <= Math.min(doc.numPages, 12); i++){
    const pg = await doc.getPage(i); const c = await pg.getTextContent();
    txt += ' ' + c.items.map(x => x.str).join(' ');
  }
  txt = txt.replace(/\s+/g, ' ');
  const num = s => carNum(s);
  const cont = {};
  const soma = (v, peso) => { if (v > 0) cont[v] = (cont[v] || 0) + peso; };
  let m; const reRod = /\d{4}\*{4}\d{4}\s+(\d{2}\/\d{2}\/\d{4})\s+R\$\s*([\d.]+,\d{2})/g; let venc = null;
  while ((m = reRod.exec(txt))){ soma(num(m[2]), 2); venc = venc || carDataBR(m[1]); }
  [/Total da sua fatura\s*R\$\s*([\d.]+,\d{2})/i, /Fatura atual\s*R\$\s*([\d.]+,\d{2})/i, /Total (?:da fatura|a pagar)[^R$]{0,40}R\$\s*([\d.]+,\d{2})/i]
    .forEach(re => { const x = txt.match(re); if (x) soma(num(x[1]), 1); });
  const total = Object.keys(cont).sort((a, b) => cont[b] - cont[a])[0];
  const v2 = txt.match(/(?:Data de )?Vencimento:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  const ct = txt.match(/Data de corte:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  return { total: total != null ? Number(total) : null, vencimento: venc || (v2 && carDataBR(v2[1])), proximo_corte: ct && carDataBR(ct[1]) };
}

async function carLerTexto(file){
  const buf = await file.arrayBuffer();
  const u = new TextDecoder('utf-8').decode(buf);
  return u.indexOf('�') >= 0 ? new TextDecoder('windows-1252').decode(buf) : u;
}

async function carImportarEnviar(I){

  if (!venc){ toast('Informe o vencimento da fatura.', 'err'); return; }
  const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
  const base = 'faturas/' + cart + '/' + venc + '_' + id.slice(0, 8);
  const subidos = [];
  const subir = async (file, ext, mime) => {
    const path = base + '.' + ext;
    const r = await rhfdFetch(carUrl(path), { method: 'POST', headers: { 'Content-Type': mime }, body: file });
    if (!r.ok){ const j = await r.json().catch(() => null); throw new Error('O armazenamento recusou o ' + ext.toUpperCase() + (j && (j.message || j.error) ? ': ' + (j.message || j.error) : ' (código ' + r.status + ')')); }
    subidos.push(path); return path;

  try{

      + (r.primeira && r.recorrencia_anulados ? ' · ' + finPlural(r.recorrencia_anulados, 'título da recorrência anulado', 'títulos da recorrência anulados') : ''), 'ok');
