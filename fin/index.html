          ['🧾', achou.length, 'achou o canhoto'], ['≈', quase.length, 'quase bateu'], ['⚠', sem.length, 'sem canhoto'],
          ['↩', est.length + res.filter(l => ['estornada', 'desconto'].indexOf(l.situacao) >= 0).length, 'estornos'],
          ['❓', (F.sem_linha || []).length, 'canhoto sem linha']].map(([i, n, r]) => '<span class="' + (n ? '' : 'z') + '"><b>' + i + ' ' + n + '</b> ' + r + '</span>').join('') + '</div></div>'
    + (F.total != null && !F.soma_bate ? '<div class="aviso">As linhas do CSV somam <b>' + esc(BRL(F.soma_linhas)) + '</b> e o total da fatura é <b>' + esc(BRL(F.total))
        + '</b>. Confira se o CSV é desta fatura' + (conf ? ' — ou corrija o total: <button class="btn mini" type="button" id="carTot">Digitar o total</button>' : '') + '.</div>'
      : (F.total == null && conf ? '<div class="aviso"><button class="btn mini" type="button" id="carTot">Digitar o total</button> O total impresso na fatura confere a soma das linhas.</div>' : ''))
    + '<div class="carBarra">'
      + (conf ? '<button class="btn pri" type="button" id="carFechar"' + (F.pode_fechar ? '' : ' disabled title="Só com a diferença em R$ 0,00 e nada pendente"') + '>Fechar fatura</button>' : '')
      + (F.situacao === 'fechada' ? '<button class="btn pri" type="button" id="carPagar">Pagar fatura…</button><button class="btn" type="button" id="carReabrir">Reabrir</button>' : '')
      + (F.situacao === 'paga' ? '<button class="btn" type="button" id="carEstPag">Estornar o pagamento…</button>' : '')
      + (conf ? '<button class="btn" type="button" id="carDescartar">Descartar importação…</button>' : '') + '</div>'
    + (finaisSem.length && conf ? '<div class="carSec2"><div class="secTit">De quem é cada final?</div><p class="nota" style="margin-top:0">Dito uma vez, fica guardado: '
        + 'nas próximas faturas o canhoto da pessoa é procurado primeiro nas linhas do final dela.</p><div class="carFinais">'
        + finaisSem.map(x => '<label class="carCampo"><span>Final ' + esc(x.final) + ' · ' + finPlural(x.linhas, 'linha', 'linhas') + ' · ' + esc(BRL(x.valor)) + '</span>'
          + '<select data-final="' + esc(x.final) + '">' + optPes(null) + '</select></label>').join('') + '</div></div>' : '')
    + (achou.length ? carSecao('🧾 Achou o canhoto — falta lançar', 'O canhoto bateu com a linha, mas ainda não foi lançado. Escolha a categoria e lance: a conta já nasce na fatura.',
        achou.map(l => '<div class="carLin carLinF" data-l="' + esc(l.id) + '">' + carThumb(l.comprovante.foto_path, l.comprovante.usuario_nome)
          + '<div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small><small class="f">Canhoto: ' + carCompTxt(l.comprovante) + '</small></div>'
          + '<span class="carV">' + esc(BRL(l.valor)) + '</span>'
          + '<label class="carCampo carCat"><span>Categoria</span><select>' + carOpcoesCat(carSugestaoComp(l.comprovante) || carSugLinha(l)) + '</select></label>'
          + '<label class="carCampo carDesc"><span>Descrição</span><input type="text" maxlength="200" value="' + esc(l.comprovante.frase || '') + '"></label>'
          + '<div class="carA"><button class="btn pri" type="button" data-lancomp>Lançar</button><button class="btn" type="button" data-desf>Não é este</button></div></div>').join('')) : '')
    + (quase.length ? carSecao('≈ Quase bateu', 'Mesmo período, valor próximo ou com os números trocados (ex.: 139,72 × 139,27). Confirmando, a conta fica com o valor da fatura.',
        quase.map(l => '<div class="carLin carLinF" data-l="' + esc(l.id) + '"><span class="carFoto vazio"></span><div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small></div>'
          + '<span class="carV">' + esc(BRL(l.valor)) + '</span><div class="carQuase">'
          + l.quase.map(c => '<div class="carQ" role="button" tabindex="0" data-par="' + esc(c.id) + '">' + carThumb(c.foto_path, c.usuario_nome) + '<span>' + carCompTxt(c)
            + (Math.abs(Number(c.valor) - Number(l.valor)) >= 0.005 ? ' <b class="dif">(' + esc(BRL(Number(c.valor) - Number(l.valor))) + ')</b>' : '') + '</span><em>Usar este</em></div>').join('')
          + '<button type="button" class="lnk" data-semc>Nenhum destes — lançar sem canhoto</button></div></div>').join('')) : '')
    + (sem.length ? carSecao('⚠ Na fatura, sem canhoto', 'Escolha a categoria e lance. "Não exige canhoto" faz o TapHub lançar sozinho nas próximas faturas (ex.: VELOE). '
        + '"Cobrar canhoto" lança e pede a foto a quem fez a compra, pelo Field.',
        sem.map(l => carLinhaSem(l, optPes)).join('')) : '')
    + (est.length ? carSecao('↩ Estornos', 'Estorno de compra de fatura anterior entra como DESCONTO na categoria da compra original, no pagamento desta fatura (não vira receita).',
        est.map(l => '<div class="carLin carLinF" data-l="' + esc(l.id) + '"><span class="carFoto vazio"></span><div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small></div>'
          + '<span class="carV mais">' + esc(BRL(l.valor)) + '</span><label class="carCampo carCat"><span>Categoria da compra original</span><select>' + carOpcoesCat(carSugLinha(l)) + '</select></label>'
          + '<div class="carA"><button class="btn pri" type="button" data-desc>Confirmar desconto</button></div></div>').join('')) : '')
    + ((F.sem_linha || []).length ? '<details class="carSec"><summary><b>❓ Canhotos sem linha nesta fatura</b> · ' + F.sem_linha.length + '</summary>'
        + '<p class="nota">Lançados (ou enviados) e que nenhuma linha pegou. Ficam abertos e são procurados de novo na próxima fatura de qualquer cartão. '
        + 'Se um deles é de uma linha acima, use "Quase bateu" ou "Desfazer" na linha.</p><div class="ccLista">'
        + F.sem_linha.map(c => '<div class="rhLin"><span class="t">' + carCompTxt(c) + '<small>' + esc(c.situacao === 'lancado' ? 'lançado' : 'ainda não lançado') + '</small></span>'
          + '<span class="a">' + carThumb(c.foto_path, c.usuario_nome)
          + '<button class="btn mini" type="button" data-devsl="' + esc(c.id) + '" title="Repetido, ou não é do cartão: devolve ao funcionário e anula a conta">Devolver…</button></span></div>').join('') + '</div></details>' : '')
    + (res.length ? '<details class="carSec"' + (CAR.resolvidasAbertas || res.some(l => l.cobrar_resposta) ? ' open' : '') + ' id="carRes"><summary><b>Resolvidas</b> · ' + res.length
        + (res.some(l => l.cobrar_resposta) ? ' · <span class="chip risco">canhoto: resposta do funcionário</span>' : '') + '</summary><div class="ccLista">'
        + res.map(l => carLinhaResolvida(l, conf, optPes)).join('') + '</div></details>' : '');
  carLigarFotos(el);
  carLigarFatura(el, F, conf);
  carDevolverEscolhas(el, escolhas);
}

const carSecao = (tit, nota, html) => '<div class="carSec2"><div class="secTit">' + tit + '</div><p class="nota" style="margin-top:0">' + nota + '</p><div class="ccLista">' + html + '</div></div>';

function carLinhaSem(l, optPes){
  return '<div class="carLin carLinF" data-l="' + esc(l.id) + '"><span class="carFoto vazio"></span><div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small>'
    + carPedidoHtml(l) + '</div>'
    + '<span class="carV">' + esc(BRL(l.valor)) + '</span>'
    + '<label class="carCampo carCat"><span>Categoria' + (l.memoria && l.memoria.grupo_id ? ' <em>(da última vez)</em>' : '') + '</span><select>' + carOpcoesCat(carSugLinha(l)) + '</select></label>'
    + '<div class="carA"><button class="btn pri" type="button" data-lanl>Lançar</button>'
    + '<details class="carMais"><summary class="btn">Mais…</summary><div class="carMaisC">'
    + '<label class="chk"><input type="checkbox" data-semcanh' + (l.memoria && l.memoria.exige_canhoto === false ? ' checked' : '') + '> Não exige canhoto (lembrar)</label>'
    + '<label class="carCampo"><span>Cobrar canhoto de</span><select data-cobrar>' + optPes(l.dono_final && l.dono_final.usuario_id) + '</select></label>'
    + '<button class="btn" type="button" data-cob>Lançar e cobrar</button>'
    + '<label class="carCampo"><span>Contestar (cobrança indevida)</span><input type="text" data-motivo maxlength="200" placeholder="motivo, ex.: não reconheço — pedido ao banco"></label>'
    + '<button class="btn perigo" type="button" data-cont>Lançar como contestada</button></div></details></div></div>';
}

const CAR_RES = { conciliada: ['fOk', 'casou com o canhoto'], lancada: ['fOk', 'lançada'], contestada: ['risco', 'contestada'],
  estornada: ['', 'estornada'], desconto: ['prog', 'desconto'], ignorada: ['', 'fora da conta'] };

/** F28 · issues 186 (item 2) e 187 (item 5): o canhoto pedido a alguém — de quem, a resposta "não tenho" (com o
 *  motivo), e as saídas: trocar a pessoa ou cancelar o pedido (o pedido some do celular dela). */
function carPedidoHtml(l, optPes){
  if (!l.cobrar_usuario_id || l.comprovante) return '';
  const pes = optPes || (sel => '<option value="">— de quem? —</option>' + ((CAR.painel && CAR.painel.pessoas) || [])
    .map(p => '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.nome) + '</option>').join(''));
  return '<span class="carPedido" data-ped="' + esc(l.id) + '"><small class="f">canhoto pedido a ' + esc(l.cobrar_nome || '—')
    + (l.cobrar_resposta ? '</small><small class="carResp">Resposta' + (l.cobrar_respondido_em ? ' (' + esc(rhDT(l.cobrar_respondido_em)) + ')' : '')
        + ': não tem o canhoto — ' + esc(l.cobrar_resposta) + '</small>' : ' · esperando</small>')
    + '<span class="carPedA"><select data-pedtroca aria-label="Pedir o canhoto a outra pessoa">' + pes(null).replace('— de quem? —', 'Trocar: pedir a…') + '</select>'
    + '<button class="btn mini" type="button" data-pedcanc>Cancelar pedido</button></span></span>';
}
function carLinhaResolvida(l, conf, optPes){
  const [cls, rot] = CAR_RES[l.situacao] || ['', l.situacao];
  const t = l.titulo, c = l.comprovante;
  return '<div class="rhLin' + (l.situacao === 'ignorada' || l.situacao === 'estornada' ? ' riscada' : '') + '" data-lr="' + esc(l.id) + '"><span class="t">' + carLinhaRot(l) + ' · <b>' + esc(BRL(l.valor)) + '</b>'
    + '<small>' + carLinhaSub(l) + ' · <span class="chip ' + cls + '">' + esc(rot) + '</span>'
    + (t ? ' ' + esc([t.descricao, [t.grupo_nome, t.subcategoria_nome].filter(Boolean).join(' › ')].filter(Boolean).join(' · ')) : '')
    + (c ? ' · canhoto de ' + esc(c.usuario_nome) : '') + (l.motivo ? ' · ' + esc(l.motivo) : '') + '</small>'
    + carPedidoHtml(l, optPes) + '</span>'
    + '<span class="a">' + (c ? carThumb(c.foto_path, c.usuario_nome) : '')
    + (conf && l.situacao !== 'ignorada' ? '<button class="btn mini" type="button" data-desf="' + esc(l.id) + '">Desfazer</button>' : '') + '</span></div>';
}

function carLigarFatura(el, F, conf){
  const fid = F.id;
  document.getElementById('carVolta').addEventListener('click', () => { CAR.faturaId = null; CAR.fatura = null; carCarregar(); });
  el.querySelectorAll('[data-arq]').forEach(b => b.addEventListener('click', async () => {
    const w = window.open('', '_blank'); if (!w){ toast('Libere pop-ups para o TapHub.', 'err'); return; }
    try{ const r = await rhfdFetch(carUrl(b.dataset.arq), {}); if (!r.ok) throw new Error(r.status === 404 ? 'o arquivo não foi encontrado' : 'o servidor deu erro (código ' + r.status + '); tente de novo');
         w.location.href = URL.createObjectURL(await r.blob()); }catch(e){ try{ w.close(); }catch(_){} toast('Não consegui abrir: ' + e.message, 'err'); }
  }));
  const linha = b => (F.linhas || []).find(l => l.id === b.closest('[data-l]').dataset.l);
  // F28 · 186 (item 2): o pedido do canhoto — trocar a pessoa, cancelar (dois toques)
  el.querySelectorAll('[data-ped]').forEach(sp => {
    const lid = sp.dataset.ped, tro = sp.querySelector('[data-pedtroca]'), can = sp.querySelector('[data-pedcanc]');
    if (tro) tro.addEventListener('change', () => { if (!tro.value) return;
      carAcao(tro, 'tf_cartao_linha_cobrar', { p_linha_id: lid, p_usuario: tro.value }, 'Pedido trocado: aparece no TapField da pessoa nova.'); });
    if (can) can.addEventListener('click', () => {
      if (can.dataset.ok !== '1'){ can.dataset.ok = '1'; can.textContent = 'Cancelar mesmo?'; can.classList.add('perigo');
        setTimeout(() => { if (document.body.contains(can)){ can.dataset.ok = ''; can.textContent = 'Cancelar pedido'; can.classList.remove('perigo'); } }, 5000); return; }
      CAR.resolvidasAbertas = !!document.getElementById('carRes') && document.getElementById('carRes').open;
      carAcao(can, 'tf_cartao_linha_cobrar', { p_linha_id: lid, p_usuario: null }, 'Pedido cancelado: sai do TapField da pessoa.');
    });
  });
  const cat = b => (b.closest('.carLin').querySelector('.carCat select').value || '').split('|');
  el.querySelectorAll('[data-lancomp]').forEach(b => b.addEventListener('click', () => {
    const l = linha(b), [g, s] = cat(b), desc = b.closest('.carLin').querySelector('.carDesc input').value;
    if (!g){ toast('Escolha a categoria.', 'err'); return; }
    _semDuploEnvio_(b, async () => {
      try{ await rpc('tf_cartao_lancar', { p_id: l.comprovante.id, p_grupo_id: g, p_subcategoria_id: s || null, p_descricao: desc || l.estabelecimento,
             p_valor: Number(l.comprovante.valor), p_data: l.comprovante.data_compra, p_os_codigo: null });
           await carAbrirFatura(fid); toast('Lançado e casado com a linha.', 'ok'); }
      catch(e){ toast(e.message, 'err'); }
    });
  }));
  el.querySelectorAll('[data-par]').forEach(b => {
    const usar = () => carAcao(b, 'tf_cartao_linha_conciliar', { p_linha_id: linha(b).id, p_comprovante_id: b.dataset.par }, 'Casado. A conta ficou com o valor da fatura.');
    b.addEventListener('click', ev => { if (!ev.target.closest('.carFoto')) usar(); });
    b.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); usar(); } });
  });
  el.querySelectorAll('[data-semc]').forEach(b => b.addEventListener('click', () => {
    const l = linha(b); const ln = b.closest('.carLin'); const d = document.createElement('div');
    d.innerHTML = carLinhaSem(Object.assign({}, l, { quase: [] }), sel => '<option value="">— de quem? —</option>'
      + ((CAR.painel && CAR.painel.pessoas) || []).map(p => '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.nome) + '</option>').join(''));
    ln.replaceWith(d.firstElementChild); carLigarFatura(el, F, conf);
  }));
  const lancarLinha = (b, extra, msg) => {
    const l = linha(b), [g, s] = cat(b); const ln = b.closest('.carLin');
    if (!g){ toast('Escolha a categoria.', 'err'); ln.querySelector('.carCat select').focus(); return; }
    const semc = ln.querySelector('[data-semcanh]');
    carAcao(b, 'tf_cartao_linha_lancar', Object.assign({ p_linha_id: l.id, p_grupo_id: g, p_subcategoria_id: s || null, p_descricao: null,
      p_lembrar: true, p_exige_canhoto: semc ? !semc.checked : null, p_cobrar_usuario: null, p_contestar_motivo: null }, extra), msg);
  };
  el.querySelectorAll('[data-lanl]').forEach(b => b.addEventListener('click', () => lancarLinha(b, {}, 'Lançada.')));
  el.querySelectorAll('[data-cob]').forEach(b => b.addEventListener('click', () => {
    const u = b.closest('.carLin').querySelector('[data-cobrar]').value;
    if (!u){ toast('Escolha de quem cobrar o canhoto.', 'err'); return; }
    lancarLinha(b, { p_cobrar_usuario: u }, 'Lançada. O pedido do canhoto aparece no Field da pessoa.');
  }));
  el.querySelectorAll('[data-cont]').forEach(b => b.addEventListener('click', () => {
    const m = b.closest('.carLin').querySelector('[data-motivo]').value;
    if (String(m).trim().length < 5){ toast('Escreva o motivo da contestação.', 'err'); return; }
    lancarLinha(b, { p_contestar_motivo: m, p_lembrar: false }, 'Lançada como contestada: entra na conta da fatura e fica marcada.');
  }));
  el.querySelectorAll('[data-desc]').forEach(b => b.addEventListener('click', () => {
    const [g, s] = cat(b); if (!g){ toast('Escolha a categoria da compra original.', 'err'); return; }
    carAcao(b, 'tf_cartao_linha_desconto', { p_linha_id: linha(b).id, p_grupo_id: g, p_subcategoria_id: s || null }, 'Desconto confirmado.');
  }));
  el.querySelectorAll('[data-desf]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.desf || linha(b).id;
    if (b.dataset.ok !== '1'){ b.dataset.ok = '1'; const t0 = b.textContent; b.textContent = 'Desfazer mesmo?'; b.classList.add('perigo');
      setTimeout(() => { if (document.body.contains(b)){ b.dataset.ok = ''; b.textContent = t0; b.classList.remove('perigo'); } }, 5000); return; }
    CAR.resolvidasAbertas = !!document.getElementById('carRes') && document.getElementById('carRes').open;
    carAcao(b, 'tf_cartao_linha_desfazer', { p_linha_id: id }, 'Desfeito — a linha voltou para resolver.');
  }));
  el.querySelectorAll('[data-devsl]').forEach(b => b.addEventListener('click', () => carDevolver((F.sem_linha || []).find(x => x.id === b.dataset.devsl))));
  el.querySelectorAll('[data-final]').forEach(s => s.addEventListener('change', () => carSoTrava(s, async () => {
    if (!s.value) return;
    try{ await rpc('tf_cartao_final_gravar', { p_cartao_id: F.cartao_id, p_final: s.dataset.final, p_usuario_id: s.value, p_apelido: null });
         toast('Final ' + s.dataset.final + ' guardado.', 'ok'); await carAbrirFatura(fid); }catch(e){ toast(e.message, 'err'); }
  })));
  const bt = document.getElementById('carTot');
  if (bt) bt.addEventListener('click', () => {
    abrirModal('Total da fatura', '<div class="campo"><label for="carTotV">Total impresso na fatura</label><input id="carTotV" type="text" inputmode="decimal" data-valor="moeda" value="'
      + esc(F.total != null ? carValTxt(F.total) : '') + '"></div>', [{ label: 'Cancelar', onClick: fecharModal },
      { label: 'Gravar', pri: true, onClick: async () => { const v = carNum(document.getElementById('carTotV').value);
          if (!(v >= 0)){ toast('Digite o total.', 'err'); return; }
          try{ CAR.fatura = await rpc('tf_cartao_fatura_total', { p_id: fid, p_total: v }); fecharModal(); carFaturaDesenhar(); }catch(e){ toast(e.message, 'err'); } } }]);
  });
  const bf = document.getElementById('carFechar');
  if (bf) bf.addEventListener('click', () => carAcao(bf, 'tf_cartao_fatura_fechar', { p_id: fid }, 'Fatura fechada. Agora é pagar.'));
  const br = document.getElementById('carReabrir');
  if (br) br.addEventListener('click', () => carAcao(br, 'tf_cartao_fatura_reabrir', { p_id: fid }, 'Reaberta para conferência.'));
  const bp = document.getElementById('carPagar');
  if (bp) bp.addEventListener('click', () => carPagar(F));
  const be = document.getElementById('carEstPag');
  if (be) be.addEventListener('click', () => {
    abrirModal('Estornar o pagamento da fatura', '<p class="nota" style="margin-top:0">Todas as baixas desta fatura são estornadas de uma vez (nada se apaga: '
      + 'ficam riscadas no extrato). A fatura volta para "fechada".</p><div class="campo"><label for="carEstM">Motivo</label><input id="carEstM" type="text" maxlength="200"></div>',
      [{ label: 'Cancelar', onClick: fecharModal }, { label: 'Estornar', cls: 'perigo', onClick: async () => {
        try{ CAR.fatura = await rpc('tf_cartao_fatura_estornar_pagamento', { p_id: fid, p_motivo: document.getElementById('carEstM').value });
             fecharModal(); toast('Pagamento estornado.', 'ok'); carFaturaDesenhar(); }catch(e){ toast(e.message, 'err'); } } }]);
  });
  const bd = document.getElementById('carDescartar');
  if (bd) bd.addEventListener('click', async () => {
    if (!await confirmar('Descartar esta importação?', '<p>As linhas desta fatura e o que foi resolvido nelas são desfeitos (as contas criadas aqui ficam ANULADAS, '
      + 'com motivo). Os canhotos voltam para a fila. Se era a primeira fatura do cartão, a recorrência «Fatura de Cartão» volta a valer.</p><p>Use quando o arquivo estava errado.</p>', 'Descartar', true)) return;
    try{
      const r = await rpc('tf_cartao_fatura_descartar', { p_id: fid });
      [r.csv_path, r.pdf_path].filter(Boolean).forEach(p => rhfdFetch(carUrl(p), { method: 'DELETE' }).catch(() => {}));
      toast('Importação descartada.', 'ok'); CAR.faturaId = null; CAR.fatura = null; await carCarregar();
    }catch(e){ toast(e.message, 'err'); }
  });
}

async function carPagar(F){
  let contas = [];
  try{ contas = (await rpc('tf_fin_contas_listar', {})).filter(c => c.papel !== 'reserva'); }catch(e){}
  const nC = (F.linhas || []).filter(l => l.titulo && !l.titulo.anulado).length;
  const desc = (F.linhas || []).filter(l => l.situacao === 'desconto').reduce((s, l) => s - Number(l.valor), 0);
  abrirModal('Pagar a fatura ' + F.cartao_nome + ' · ' + dataBR(F.vencimento),
      '<div class="aviso ok" style="margin-top:0"><b>' + esc(BRL(F.total)) + '</b> — baixa ' + finPlural(nC, 'conta', 'contas') + ' de uma vez'

async function modalTituloReceber(t){

    : (editando && t.etapa === 'a_faturar' && !t.anulado && !t.medicao_id && t.condicao

  abrirModal(editando ? 'Editar — ' + (finDescOk(t.descricao) ? t.descricao : (t.cliente_nome || 'conta a receber')) : 'Nova conta a receber',
      (editando
        ? '<div class="campo"><label>Cliente</label><input type="text" value="' + esc(t.cliente_nome || '') + '" disabled>'

        : '<div class="campo"><label for="trCliBusca">Cliente</label>'
          + '<input id="trCliBusca" type="text" placeholder="Buscar por nome ou CNPJ…" autocomplete="off">'
          + '<input id="trCliId" type="hidden">'
          + '<div id="trCliLista"></div></div>')
    + (subcats.length
        ? '<div class="campo"><label for="trSub">Subcategoria (Recebimentos, opcional)</label><select id="trSub">'
          + '<option value="">—</option>'
          + finSubOpcoes(recebimentos, editando ? t.subcategoria_id : null)
          + '</select></div>'
        : '')
    + '<div class="campo"><label for="trDesc">Descrição</label><input id="trDesc" type="text" value="' + esc(val('descricao', '')) + '" autocomplete="off">'
    +   '<small class="finTrava" id="trDescAviso" hidden>A nota fiscal já foi emitida com o texto anterior; alterar aqui não muda a nota.</small></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="trValor">Valor</label><input id="trValor" type="text" inputmode="decimal" data-valor="moeda" placeholder="ex.: 1.250,00" value="' + (editando ? esc(finValorCampo(t.valor)) : '') + '"' + trava + '>' + porque + '</div>'
    +  '<div class="campo"><label for="trForma">Forma prevista (opcional)</label><select id="trForma">'
    +    '<option value="">—</option>'
    +    FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + (editando && t.forma_prevista === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('')
    +  '</select></div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="trComp">Competência (mês do serviço)</label><input id="trComp" type="month" value="' + (editando ? esc(String(t.competencia || '').slice(0, 7)) : finMesHoje()) + '"' + trava + '>' + porque + '</div>'
    +  '<div class="campo"><label for="trVenc">Vencimento' + (editando && t.etapa !== 'a_faturar' ? '' : ' (estimativa)') + '</label><input id="trVenc" type="date" value="' + (editando ? esc(t.vencimento) : '') + '"' + trava + '>' + porque
    +    (editando && !finTemBaixa(t) && t.etapa === 'faturado' && !t.anulado ? '<small class="nota">O cliente pediu mais prazo? No ⋯ da conta: “Mudar o vencimento”.</small>' : '') + '</div></div>'
    + trCondHtml
    + '<div class="campo"><label for="trOs">OS (opcional)</label><input id="trOs" type="text" placeholder="Ex.: OS-26043" value="' + esc(val('os_codigo', '')) + '" autocomplete="off"></div>'
    + (editando ? finHistHtml() : ''),
    [{ label:'Cancelar', onClick: fecharModal },
     { label: editando ? 'Salvar' : 'Lançar', pri:true, onClick: async () => {
        // "trSub" só existe na tela quando já há subcategoria cadastrada em
        // Recebimentos — por isso não dá para supor que todo campo existe.
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const desc = v('trDesc');
        if (!desc){ toast('A descrição é obrigatória.', 'err'); return; }
        // S48 · item 4: 3 letras ou números — na edição, só se mudou o texto
        if ((!editando || desc !== String(t.descricao || '').trim()) && !finDescOk(desc)){ toast(FIN_DESC_MSG, 'err'); return; }
        const valor = motivo ? Number(t.valor) : finValorLido('trValor');
        if (!(valor > 0)){ toast(isNaN(valor) && v('trValor') ? 'O valor não é um número: escreva como 1.250,00.' : 'Informe um valor maior que zero.', 'err'); return; }
        // F32 (issue 97): a lista das subcategorias não carregou — a edição mantém a que a conta já tem (antes, salvar apagava)
        const subId = (!subsOk && editando) ? (t.subcategoria_id || null) : (v('trSub') || null);
        const comp = motivo ? String(t.competencia).slice(0, 7) : v('trComp');
        if (!comp){ toast('Informe a competência.', 'err'); return; }
        const venc = motivo ? t.vencimento : v('trVenc');
        if (!venc){ toast('Informe o vencimento.', 'err'); return; }
        // F34 · 238 (M2): a condição lida antes de gravar; vazio = a do cliente
        const condTxt = v('trCond'), condNova = condTxt ? condCanon(condTxt) : '';
        if (condCampo && condTxt && condDias(condTxt) === null){
          Nucleo.janela.erro('Condição de pagamento: escreva os dias separados por barra, crescendo (15/30/45/60; 0 = no ato).', document.getElementById('trCond')); return; }
        const condMuda = condCampo && (editando ? condNova !== condCanon(t.condicao || '') : !!condNova);
        const condGravar = async id => {

          catch(e){ return ' A condição não foi gravada: ' + e.message; }
        };
        try{
          if (editando){
            await rpc('tf_fin_titulo_receber_editar', {
              p_titulo_id: t.id, p_descricao: desc, p_valor: valor,
              p_competencia: comp + '-01', p_vencimento: venc,
              p_subcategoria_id: subId, p_forma_prevista: v('trForma') || null,
              p_os_codigo: v('trOs') || null });
            const cm = await condGravar(t.id);
            fecharModal(); toast('Conta a receber atualizada.' + cm, /não foi gravada/.test(cm) ? 'err' : 'ok'); await finreCarregar();
            return;
          }
          const clienteId = v('trCliId');
          if (!clienteId){ toast('Busque e selecione o cliente.', 'err'); return; }
          const novoId = await rpc('tf_fin_titulo_receber_criar', {

            p_subcategoria_id: v('trSub') || null, p_forma_prevista: v('trForma') || null,
            p_os_codigo: v('trOs') || null });
          const cm = novoId ? await condGravar(novoId) : '';
          fecharModal(); toast('Conta a receber lançada.' + cm, /não foi gravada/.test(cm) ? 'err' : 'ok'); await finreCarregar();
        }catch(e){ toast(e.message, 'err'); }
     }}]);

  // F34 · 238 (M2): a prévia da condição
  const tcEl = document.getElementById('trCond');
  const tcPrev = () => {
    const p = document.getElementById('trCondPrev'); if (!p || !tcEl) return;

  };
  if (tcEl){ tcEl.addEventListener('input', tcPrev); tcPrev(); }
  if (editando){

function lerXmlNFSe(texto){
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.querySelector('parsererror'))
    throw new Error('Não consegui ler esse arquivo como XML — confere se é o certo.');
  const pegar = tag => { const el = doc.getElementsByTagName(tag)[0]; return el ? el.textContent.trim() : ''; };
  const numero = pegar('nNFSe');
  const dhEmi = pegar('dhProc') || pegar('dhEmi');
  const data = dhEmi ? dhEmi.slice(0, 10) : '';
  const valorTxt = pegar('vServ') || pegar('vLiq');   // F27 · 184 (item 7): o valor da nota é o bruto (vServ); o líquido só se não houver
  if (!numero || !data || !valorTxt)
    throw new Error('Não achei número, data ou valor nesse XML — confere se é o arquivo certo, ou preenche à mão.');
  return { numero, data, valor: Number(valorTxt) };
}

async function subirArquivoDrive(dataUrl, meta){
  if (DEMO) return { url: 'https://drive.google.com/demo', file_id: 'demo' };
  if (!driveLigado())
    throw Object.assign(new Error('O Google Drive ainda não foi configurado. Avise o administrador.'),
                        { negocio: true });
  const r = await fetch(PARAM.drive_url, {
    method: 'POST', redirect: 'follow', signal: sinal(true),
    body: JSON.stringify({
      chave: PARAM.drive_chave, token: sessao.token,
      client_uid: meta.client_uid, cliente: meta.cliente, os_numero: meta.os_numero,
      categoria: meta.categoria, nome: meta.nome,
      mime: meta.mime || 'application/octet-stream', base64: dataUrl
    })
  });
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('O serviço de arquivos não respondeu como esperado.');
  if (j.status !== 'ok')
    throw Object.assign(new Error(j.mensagem || 'Falha ao gravar no Drive'),
                        { negocio: j.codigo === 'CHAVE' || j.codigo === 'TOKEN' });
  return j;
}

/* F32 (issue 101): o fornecedor se acha DIGITANDO (Nucleo.busca.digitando, N16: nome ou CNPJ, sem acento), no lugar da caixa
   comprida, e o fornecedor que não existe se cadastra ali mesmo ("+ Cadastrar fornecedor novo"), sem cancelar o lançamento.
   A lista vem uma vez da tf_fin_fornecedores_listar e a busca filtra nela. `desligado` (conta com baixa) mostra só o nome. */
function finFornCampo(alvoId, fornecedores, inicialId, desligado){
  const alvo = document.getElementById(alvoId); if (!alvo) return { valor: () => inicialId || null };
  const L = (fornecedores || []).slice();
  const ini = L.find(f => f.id === inicialId) || null;
  if (desligado){
    alvo.innerHTML = '<input id="' + alvoId + 'In" type="text" value="' + esc(ini ? ini.nome : '') + '" disabled>';
    return { valor: () => inicialId || null };
  }
  const so = x => String(x || '').replace(/\D/g, '');
  const detalhe = f => [f.cnpj_cpf ? 'CNPJ/CPF ' + f.cnpj_cpf : 'sem CNPJ', f.cidade ? f.cidade + (f.uf ? '/' + f.uf : '') : ''].filter(Boolean).join(' · ');
  const b = Nucleo.busca.digitando(alvo, { id: alvoId + 'In', inicial: ini, placeholder: 'digite parte do nome ou do CNPJ',
    rotuloAria: 'Fornecedor', rotulo: f => f.nome, detalhe,
    vazio: 'Nenhum fornecedor com esse nome ou CNPJ. Para cadastrar, use “+ Cadastrar fornecedor novo”, acima.',
    buscar: t => { const k = norm(t), d = so(t);
      return L.filter(f => norm(f.nome).includes(k) || (d.length >= 3 && so(f.cnpj_cpf).includes(d)))
        .sort((x, y) => FIN_COL.compare(x.nome, y.nome)).slice(0, 12); } });
  // a caixa fica ACIMA do campo: a lista da busca abre para baixo e cobriria o botão
  const caixa = document.createElement('div'); caixa.className = 'finFornNovo'; alvo.before(caixa);
  const fechado = () => { caixa.innerHTML = '<button class="btn sm" type="button" data-fnovo>+ Cadastrar fornecedor novo</button>';
    caixa.querySelector('[data-fnovo]').addEventListener('click', aberto); };
  function aberto(){
    const digitado = b && b.entrada && !b.item() ? b.entrada.value.trim() : '';
    caixa.innerHTML = '<div class="finFornNovoF"><div class="dupla">'
      + '<div class="campo"><label for="' + alvoId + 'NN">Nome do fornecedor novo</label><input id="' + alvoId + 'NN" type="text" maxlength="200" autocomplete="off"></div>'
      + '<div class="campo"><label for="' + alvoId + 'ND">CNPJ ou CPF (opcional)</label><input id="' + alvoId + 'ND" type="text" maxlength="20" autocomplete="off"></div></div>'
      + '<p class="nota" style="margin:0 0 6px">Cidade, UF e contato se completam depois em Fornecedores.</p>'
      + '<button class="btn sm pri" type="button" data-fgrava>Cadastrar e usar</button> <button class="btn sm" type="button" data-fcanc>Cancelar</button></div>';
    const nn = document.getElementById(alvoId + 'NN'), nd = document.getElementById(alvoId + 'ND');
    nn.value = digitado; nn.focus();
    caixa.querySelector('[data-fcanc]').addEventListener('click', fechado);
    const gr = caixa.querySelector('[data-fgrava]');
    gr.addEventListener('click', () => _semDuploEnvio_(gr, async () => {
      const nome = nn.value.trim(), doc = nd.value.trim();
      if (nome.length < 2){ Nucleo.janela.erro('Escreva o nome do fornecedor novo.'); nn.focus(); return; }
      // o mesmo nome (ou o mesmo CNPJ) já cadastrado: usa o que existe, em vez de duplicar
      const igual = L.find(f => norm(f.nome) === norm(nome) || (so(doc).length >= 11 && so(f.cnpj_cpf) === so(doc)));
      if (igual){ b.escolher(igual); fechado(); toast('Esse fornecedor já estava cadastrado: escolhido.', 'ok'); return; }
      let id;
      try{ id = await rpc('tf_fin_fornecedor_gravar', { p_id: null, p_nome: nome, p_cnpj_cpf: doc || null, p_cidade: null, p_uf: null, p_contato: null }); }
      catch(e){ Nucleo.janela.erro(e.message); return; }
      const f = { id, nome, cnpj_cpf: doc || null };
      L.push(f); b.escolher(f); fechado();
      FFOR.lista = null;   // a tela Fornecedores lê de novo na próxima vez
      toast('Fornecedor cadastrado: ' + nome + '.', 'ok');
    }));
  }
  fechado();
  return { valor: () => b.valor(), busca: b };
}

/* F35 (S218, issue 115, CO-D, 1ª parte): a tela Deslocamento. Os veículos da Engetap (placa, nome, % do combustível e do pedágio
   que é da Engetap), o R$/km de cada um por mês (digitado; a importação do extrato do Infleet é a 2ª parte, depois de dezembro)
   e a tabela de cidades (km e pedágio de ida e volta a partir de Divinópolis). A OS calcula o deslocamento de cada dia de campo:
   (km × R$/km + pedágio) × % Engetap. */
const FDES = { dados: null };
const finNumBR = (v, c) => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
async function pintarDeslocamento(){
  visao = 'findes';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="tela"><div class="telaCab"><h2>Deslocamento</h2>'
    + '<p>O custo de ir a campo, calculado em cada OS: (km de ida e volta × R$/km do veículo + pedágio da cidade) × o % da Engetap. '
    + 'O combustível e o pedágio continuam como despesa da empresa (a nota do posto e a fatura da tag).</p></div>'
    + '<div id="desCorpo"><p class="nota">Carregando…</p></div></div>';
  await desCarregar();
}
async function desCarregar(){
  const el = document.getElementById('desCorpo'); if (!el) return;
  try{ FDES.dados = DEMO ? { veiculos: [], cidades: [], mes_atual: finMesHoje() + '-01' } : await rpc('tf_fin_deslocamento_ver', {}); }
  catch(e){
    el.innerHTML = '<div class="vazio2"><b>Não consegui abrir o deslocamento</b><p></p><button class="btn" type="button" id="desDeNovo">Tentar de novo</button></div>';
    el.querySelector('p').textContent = /tf_fin_deslocamento_ver|function|does not exist/i.test(e.message || '') ? 'Falta uma atualização do sistema: avise o administrador.' : e.message;
    document.getElementById('desDeNovo').addEventListener('click', desCarregar); return;
  }
  desDesenhar();
}
function desDesenhar(){
  const el = document.getElementById('desCorpo'); if (!el) return;
  const D = FDES.dados || {}, V = D.veiculos || [], C = D.cidades || [];
  const mes = String(D.mes_atual || finMesHoje()).slice(0, 7);
  el.innerHTML = '<div class="painel" style="padding:14px;margin-bottom:14px"><h3 style="margin-top:0">Veículos</h3>'
    + '<p class="nota" style="margin-top:0">O R$/km de cada mês vale para os dias de campo daquele mês; sem ele, vale o do último mês informado.</p>'
    + '<div style="overflow-x:auto"><table class="tbl" id="desVeic"><thead><tr><th>Placa</th><th>Veículo</th><th class="num">% Engetap</th>'
    + '<th class="num">R$/km em vigor</th><th>R$/km do mês</th><th></th></tr></thead><tbody>'
    + (V.length ? V.map(v => '<tr data-v="' + esc(v.id) + '"' + (v.ativo ? '' : ' class="desOff"') + '><td class="mono">' + esc(v.placa) + '</td><td>' + esc(v.nome)
        + (v.ativo ? '' : ' <small class="chip">Fora de uso</small>') + '</td><td class="num">' + esc(finNumBR(v.pct_engetap, 0)) + '%</td>'
        + '<td class="num">' + (v.rs_km_atual != null ? esc(finNumBR(v.rs_km_atual, 2)) : '<span class="nota">—</span>') + '</td>'
        + '<td><span class="desMes"><input type="month" class="desMesIn" value="' + esc(mes) + '" aria-label="Mês do R$/km de ' + esc(v.placa) + '">'
        + '<input type="text" inputmode="decimal" data-valor="num" class="desRs" placeholder="0,43" aria-label="R$/km de ' + esc(v.placa) + '" value="'
        + esc(finNumBR(((v.meses || []).find(m => String(m.mes).slice(0, 7) === mes) || {}).rs_km, 2)) + '">'
        + '<button class="btn sm" type="button" data-rs>Gravar</button></span></td>'
        + '<td><button class="btn sm" type="button" data-ev>Editar</button></td></tr>').join('')
      : '<tr><td colspan="6" class="nota">Nenhum veículo.</td></tr>')
    + '</tbody></table></div><button class="btn" type="button" id="desNovoV" style="margin-top:8px">+ Novo veículo</button></div>'
    + '<div class="painel" style="padding:14px"><h3 style="margin-top:0">Cidades (a partir de Divinópolis)</h3>'
    + '<p class="nota" style="margin-top:0">A OS acha a cidade pela do cadastro do cliente. Confira o pedágio de vez em quando com o extrato do Veloe.</p>'
    + '<div style="overflow-x:auto"><table class="tbl" id="desCid"><thead><tr><th>Cidade</th><th class="num">Km ida e volta</th><th class="num">Pedágio ida e volta</th><th>Observação</th><th></th></tr></thead><tbody>'
    + (C.length ? C.map(c => '<tr data-c="' + esc(c.id) + '"><td>' + esc(c.cidade + '/' + c.uf) + '</td><td class="num">' + esc(finNumBR(c.km_ida_volta, 0)) + '</td>'
        + '<td class="num">' + esc(BRL(c.pedagio_ida_volta)) + '</td><td>' + esc(c.observacao || '') + '</td>'
        + '<td><button class="btn sm" type="button" data-ec>Editar</button> <button class="btn sm" type="button" data-xc>Excluir</button></td></tr>').join('')
      : '<tr><td colspan="5" class="nota">Nenhuma cidade ainda.</td></tr>')
    + '</tbody></table></div><button class="btn" type="button" id="desNovaC" style="margin-top:8px">+ Nova cidade</button></div>';

  document.getElementById('desNovaC').addEventListener('click', () => desModalCidade(null));
  el.querySelectorAll('#desVeic tr[data-v]').forEach(tr => {
    const v = V.find(x => x.id === tr.dataset.v);
    tr.querySelector('[data-ev]').addEventListener('click', () => desModalVeiculo(v));
    const mi = tr.querySelector('.desMesIn'), ri = tr.querySelector('.desRs');
    mi.addEventListener('change', () => { ri.value = finNumBR(((v.meses || []).find(m => String(m.mes).slice(0, 7) === mi.value) || {}).rs_km, 2); });
    const g = tr.querySelector('[data-rs]');
    g.addEventListener('click', () => _semDuploEnvio_(g, async () => {
      const bruto = ri.value.trim(), n = bruto ? Nucleo.util.lerValor(bruto) : null;
      if (!mi.value){ toast('Escolha o mês.', 'err'); return; }
      if (bruto && !(n > 0)){ toast('R$/km: escreva como 0,43.', 'err'); ri.focus(); return; }
      try{ await rpc('tf_fin_veiculo_rskm_gravar', { p_veiculo_id: v.id, p_mes: mi.value + '-01', p_rs_km: n });
           toast(n ? 'R$/km de ' + v.placa + ' gravado.' : 'R$/km do mês apagado.', 'ok'); await desCarregar(); }
      catch(e){ toast(e.message, 'err'); }
    }));
  });
  el.querySelectorAll('#desCid tr[data-c]').forEach(tr => {
    const c = C.find(x => x.id === tr.dataset.c);
    tr.querySelector('[data-ec]').addEventListener('click', () => desModalCidade(c));
    const x = tr.querySelector('[data-xc]');
    x.addEventListener('click', () => _semDuploEnvio_(x, async () => {
      if (!(await confirmar('Excluir a cidade', '<p style="margin-top:0">Tirar <b>' + esc(c.cidade + '/' + c.uf) + '</b> da tabela? As OS dessa cidade ficam sem o deslocamento calculado.</p>', 'Excluir', true))) return;
      try{ await rpc('tf_fin_cidade_excluir', { p_id: c.id }); toast('Cidade excluída.', 'ok'); await desCarregar(); }
      catch(e){ toast(e.message, 'err'); }
    }));
  });
}

          } else {
            const campos = {
              p_fornecedor_id: fornecedorId, p_grupo_id: grupoId, p_descricao: desc, p_valor: valor,
              p_competencia: comp + '-01', p_vencimento: venc,
              p_subcategoria_id: v('tpSub') || null, p_forma_prevista: v('tpForma') || null,
              p_os_codigo: osCodigo, p_nf_numero: v('tpNf') || null
            };
            const novoId = await rpc('tf_fin_titulo_pagar_criar', campos);
            const avOs = novoId ? await gravarOs(novoId) : '';
            fecharModal(); toast('Conta a pagar lançada.' + avOs, avOs ? 'err' : 'ok'); await finpgCarregar(); finSemOsContar();
          }
        }catch(e){ toast(e.message, 'err'); }
     }}]);

  const fornCampo = finFornCampo('tpForn', fornecedores, editando ? t.fornecedor_id : null, travado);   // F32 (issue 101)
  // F35 (S218, issue 115, CO1): a busca da OS e o que está gravado; sem a 530 no banco, a pergunta não aparece
  let osBusca = null, osAntes = null, osPergunta = true;
  if (editando){
    try{ osAntes = await rpc('tf_fin_titulo_os_ver', { p_titulo_id: t.id }); }
    catch(e){ osPergunta = false; }
  }
  const osBloco = document.getElementById('tpOsBloco'), osCx = document.getElementById('tpOsBusca');
  if (!osPergunta){ osBloco.hidden = true; }
  else {
    osBusca = Nucleo.busca.digitando(osCx, { id: 'tpOsIn', placeholder: 'número da OS ou nome do cliente', rotuloAria: 'OS da conta',
      inicial: osAntes && osAntes.os_id ? { id: osAntes.os_id, numero: osAntes.numero, cliente: osAntes.cliente, status: osAntes.status } : null,
      rotulo: o => o.numero, detalhe: o => [o.cliente, o.status === 'concluida' ? 'concluída' : ''].filter(Boolean).join(' · '),
      vazio: 'Nenhuma OS com esse número ou cliente.',
      buscar: q => DEMO ? [] : rpc('tf_fin_os_buscar', { p_termo: q }) });
    const marcar = r => { const x = document.querySelector('input[name=tpOsR][value="' + r + '"]'); if (x) x.checked = true; osCx.hidden = r !== 'sim'; };
    if (osAntes && osAntes.resposta) marcar(osAntes.resposta);
    else if (editando && osAntes && osAntes.os_codigo){
      const an = document.getElementById('tpOsAntigo'); an.hidden = false;
      an.textContent = 'Escrito antes no campo OS: “' + osAntes.os_codigo + '” (texto). Marque Sim e escolha a OS para ligar de verdade.';
    }
    document.querySelectorAll('input[name=tpOsR]').forEach(x => x.addEventListener('change', () => {
      osCx.hidden = (document.querySelector('input[name=tpOsR]:checked') || {}).value !== 'sim';
      if (!osCx.hidden) osBusca.focar();
    }));
  }
  // Subcategoria depende da categoria escolhida — repopula ao trocar de grupo (F32, issue 103: sem as desativadas)
  const selGrupo = document.getElementById('tpGrupo');
  const selSub = document.getElementById('tpSub');
  const repopularSub = (grupoId, subSelecionada) => {
    const g = grupos.find(x => x.id === grupoId);
    selSub.innerHTML = '<option value="">—</option>' + finSubOpcoes(g, subSelecionada);
  };
  selGrupo.addEventListener('change', () => repopularSub(selGrupo.value, null));
  if (grupoAtualId) repopularSub(grupoAtualId, editando ? t.subcategoria_id : null);

  const repetirChk = document.getElementById('tpRepetir');
  if (repetirChk) repetirChk.addEventListener('change', () => {
    document.getElementById('tpRepetirCampos').style.display = repetirChk.checked ? '' : 'none';
    if (osPergunta) osBloco.hidden = repetirChk.checked;   // F35 · 115: a recorrente nasce "Não" (CO1.3)
    sugerirDiaRec();
  });

  // S46 · o dia da recorrência vem do Vencimento já digitado (29/10/2026 →
  // 29), em vez de nascer fixo em 5. Continua editável; depois que a pessoa
  // digita outro dia, a sugestão para de sobrescrever — o mesmo cuidado do
  // prazo de aviso dos documentos (S45).
  const vencEl = document.getElementById('tpVenc');
  const diaEl = document.getElementById('tpRecDia');
  let diaDigitado = false;
  function sugerirDiaRec(){
    if (!vencEl || !diaEl || diaDigitado) return;
    const m = /^\d{4}-\d{2}-(\d{2})$/.exec(vencEl.value || '');
    if (m) diaEl.value = String(Number(m[1]));
  }
  if (diaEl) diaEl.addEventListener('input', () => { diaDigitado = true; });
  if (vencEl && diaEl){
    vencEl.addEventListener('change', sugerirDiaRec);
    vencEl.addEventListener('input', sugerirDiaRec);
  }
  // S48 · mudar o valor de um "a confirmar" já é conferir
  const confEl = document.getElementById('tpConferido'), valEl = document.getElementById('tpValor');
  if (confEl && valEl) valEl.addEventListener('input', () => {
    if (finValorLido('tpValor') !== Number(t.valor)) confEl.checked = true; });
  if (editando) finHistLigar(t.id);
}

/* F31 (S209, issue 96): a janela Baixar refaz a conta sozinha. "Valor" é o que entrou ou saiu no BANCO: ao digitar desconto ou
   juros, ele vira saldo − desconto + juros (até a pessoa digitar o Valor à mão), e a linha de baixo diz quanto a baixa quita.
   Data antes do início da conta bancária (a baixa não mexe no saldo nem no extrato) e data no futuro pedem confirmação.
   Os valores pelo leitor do núcleo (N12). rasc = o que estava digitado, quando a confirmação é cancelada (a janela volta igual). */
const finNumTxt = n => (Number(n) || 0).toFixed(2).replace('.', ',');
const finLer0 = txt => { const n = Nucleo.util.lerValor(txt); return n === null ? 0 : n; };

async function modalBaixarTitulo(t, recarregar, rasc){
  let contas = [];
  try{ contas = await rpc('tf_fin_contas_listar', {}); }
  catch(e){ toast('Não consegui carregar as contas bancárias: ' + e.message, 'err'); return; }
  if (!contas.length){ toast('Nenhuma conta bancária cadastrada — confira a tela Contas Bancárias.', 'err'); return; }

  const hoje = isoHoje();
  const saldoAberto = Number(t.saldo != null ? t.saldo : t.valor);
  const R = rasc || {};
  const ehReceber = t.tipo ? t.tipo === 'r' : ('etapa' in t);   // a lista a receber traz a etapa; a de pagar, não
  const saiuEntrou = ehReceber ? 'entrou' : 'saiu';
  let envelopes = null; // só busca se a conta escolhida for de reserva
  let valorMexido = !!R.valorMexido;

  abrirModal('Baixar — ' + finTituloRot(t),
      '<p class="nota" style="margin-top:0">Em aberto nesta conta: <b>' + esc(BRL(saldoAberto)) + '</b>.</p>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="bxData">Data</label><input id="bxData" type="date" value="' + esc(R.data || hoje) + '"></div>'
    +  '<div class="campo"><label for="bxConta">Conta bancária</label><select id="bxConta">'
    +    '<option value="">Selecione…</option>'
    +    contas.map(c => '<option value="' + esc(c.id) + '"' + (R.conta === c.id ? ' selected' : '') + '>' + esc(c.nome) + (c.papel === 'reserva' ? ' (reserva)' : '') + '</option>').join('')
    +  '</select></div></div>'
    + '<div class="dica" id="bxDataAviso" style="display:none;color:var(--warn);margin:-4px 0 8px"></div>'
    + '<div class="campo" id="bxEnvelopeCampo" style="display:none"><label for="bxEnvelope">Sai de qual caixinha?</label><select id="bxEnvelope"><option value="">Selecione…</option></select></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="bxDesc">Desconto concedido (opcional)</label><input id="bxDesc" type="text" inputmode="decimal" data-valor="moeda" value="' + esc(R.desc || '0,00') + '"></div>'
    +  '<div class="campo"><label for="bxJuros">Juros/multa (opcional)</label><input id="bxJuros" type="text" inputmode="decimal" data-valor="moeda" value="' + esc(R.juros || '0,00') + '"></div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="bxValor">Valor que ' + saiuEntrou + ' no banco</label><input id="bxValor" type="text" inputmode="decimal" data-valor="moeda" value="' + esc(R.valor || finNumTxt(saldoAberto)) + '"></div>'
    +  '<div class="campo"><label for="bxForma">Forma de pagamento (opcional)</label><select id="bxForma">'
    +    '<option value="">—</option>'
    +    FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + ((R.forma != null ? R.forma : t.forma_prevista) === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('')
    +  '</select></div></div>'
    + '<p class="nota" id="bxResumo" style="margin:2px 0 0"></p>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Registrar baixa', pri:true, onClick: async () => {
        // tudo lido ANTES de qualquer pergunta (a confirmação ocupa a janela)
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const lido = { data: v('bxData'), conta: v('bxConta'), envelope: v('bxEnvelope'), forma: v('bxForma'),
                       desc: v('bxDesc'), juros: v('bxJuros'), valor: v('bxValor'), valorMexido };
        const erro = msg => { Nucleo.janela.erro(msg); toast(msg, 'err'); };
        if (!lido.conta) return erro('Selecione a conta bancária.');
        if (!lido.data) return erro('Informe a data.');
        const valor = Nucleo.util.lerValor(lido.valor), desc = finLer0(lido.desc), juros = finLer0(lido.juros);
        if (Number.isNaN(valor) || Number.isNaN(desc) || Number.isNaN(juros)) return erro('Algum valor não é número: confira Valor, Desconto e Juros.');
        if (!valor || valor <= 0) return erro('Informe um valor maior que zero.');
        if (desc < 0 || juros < 0) return erro('Desconto e juros/multa não podem ser negativos.');
        const abate = Math.round((valor - juros + desc) * 100) / 100;
        if (abate > saldoAberto + 0.005) return erro('A baixa quita ' + BRL(abate) + ' e a conta tem ' + BRL(saldoAberto) + ' em aberto: confira o valor, o desconto e os juros.');
        const conta = contas.find(c => c.id === lido.conta);
        if (conta && conta.papel === 'reserva' && !lido.envelope) return erro('Selecione de qual caixinha o valor sai ou entra.');
        const perguntas = [];
        if (conta && conta.data_corte && lido.data < conta.data_corte)
          perguntas.push('A conta <b>' + esc(conta.nome) + '</b> começa em <b>' + esc(dataBR(conta.data_corte)) + '</b>: uma baixa em ' + esc(dataBR(lido.data)) + ' <b>não mexe no saldo nem no extrato</b> dela (fica só nos relatórios).');
        if (lido.data > hoje) perguntas.push('A data <b>' + esc(dataBR(lido.data)) + '</b> é no futuro.');
        if (perguntas.length){
          const ok = await confirmar('Conferir a data', perguntas.map(p => '<p>' + p + '</p>').join('') + '<p>Registrar a baixa assim mesmo?</p>', 'Registrar assim mesmo');
          if (!ok){ modalBaixarTitulo(t, recarregar, lido); return; }
        }
        try{
          await rpc('tf_fin_baixar_titulo', {
            p_titulo_id: t.id, p_data: lido.data, p_conta_id: lido.conta, p_valor: valor,
            p_forma_pagamento: lido.forma || null, p_desconto: desc, p_juros_multa: juros,
            p_envelope_id: lido.envelope || null
          });
          Nucleo.janela.mexida(false); fecharModal(); toast('Baixa registrada.', 'ok'); await recarregar();
        }catch(e){
          if (perguntas.length){ await modalBaixarTitulo(t, recarregar, lido); }
          toast(e.message, 'err');
        }
     }}]);

  const $ = id => document.getElementById(id);
  const refazer = () => {
    const desc = finLer0($('bxDesc').value), juros = finLer0($('bxJuros').value);
    if (!valorMexido && !Number.isNaN(desc) && !Number.isNaN(juros)) $('bxValor').value = finNumTxt(Math.max(0, saldoAberto - desc + juros));
    const valor = Nucleo.util.lerValor($('bxValor').value);
    const r = $('bxResumo');
    if (valor === null || Number.isNaN(valor) || Number.isNaN(desc) || Number.isNaN(juros)){ r.textContent = ''; return; }
    const abate = Math.round((valor - juros + desc) * 100) / 100, falta = Math.round((saldoAberto - abate) * 100) / 100;
    r.innerHTML = 'Valor = o que ' + saiuEntrou + ' no banco. Esta baixa quita <b>' + esc(BRL(abate)) + '</b> da conta'
      + (desc ? ' (com ' + esc(BRL(desc)) + ' de desconto)' : '') + (juros ? ' (' + esc(BRL(juros)) + ' de juros/multa não abatem)' : '')
      + (falta > 0.005 ? '; ficam faltando <b>' + esc(BRL(falta)) + '</b>.' : falta < -0.005 ? '. <b style="color:var(--crit)">Passa do que está em aberto (' + esc(BRL(saldoAberto)) + ').</b>' : ': a conta fica paga.');
  };
  const avisoData = () => {
    const c = contas.find(x => x.id === $('bxConta').value), d = $('bxData').value, a = $('bxDataAviso');
    const txt = c && c.data_corte && d && d < c.data_corte ? 'Esta conta começa em ' + dataBR(c.data_corte) + ': a baixa não vai mexer no saldo.'
      : d && d > hoje ? 'A data é no futuro.' : '';
    a.textContent = txt; a.style.display = txt ? '' : 'none';
  };
  $('bxDesc').addEventListener('input', refazer);
  $('bxJuros').addEventListener('input', refazer);
  $('bxValor').addEventListener('input', () => { valorMexido = true; refazer(); });
  $('bxData').addEventListener('input', avisoData);
  $('bxData').addEventListener('change', avisoData);
  const mostrarEnvelope = async () => {
    const conta = contas.find(c => c.id === $('bxConta').value);
    const campo = $('bxEnvelopeCampo');
    avisoData();
    if (!conta || conta.papel !== 'reserva'){ campo.style.display = 'none'; return; }
    campo.style.display = '';
    if (!envelopes){
      try{ envelopes = await rpc('tf_fin_envelopes_listar', {}); }
      catch(e){ toast('Não consegui carregar as caixinhas: ' + e.message, 'err'); envelopes = []; }
      const sel = $('bxEnvelope'); if (!sel) return;
      sel.innerHTML = '<option value="">Selecione…</option>' + envelopes.map(en =>
        '<option value="' + esc(en.id) + '"' + (R.envelope === en.id ? ' selected' : '') + '>' + esc(en.nome) + '</option>').join('');
    }
  };
  $('bxConta').addEventListener('change', mostrarEnvelope);
  if (R.conta) await mostrarEnvelope();
  refazer();
  avisoData();
}

    fecharModal(); CAR.aba = 'faturas'; CAR.faturaId = b.dataset.abrirfat; CAR.fatura = null; irPara('fincar'); }));

  document.querySelectorAll('[data-estornar]').forEach(b => b.addEventListener('click', () => {
    const baixa = baixas.find(x => x.id === b.dataset.estornar);

    +    FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + (editando && r.forma === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="reInicio">Mês de início</label><input id="reInicio" type="month" value="' + (editando ? String(r.inicio).slice(0, 7) : finMesHoje()) + '"></div></div>'
    // F32 (issue 102): o mês final (opcional). Passado esse mês, ela para sozinha e aparece "Encerrada"; as Projeções deixam de contar.
    + (tem528 ? '<div class="campo"><label for="reFim">Até quando (mês final, opcional)</label><input id="reFim" type="month" value="' + (editando && r.fim ? esc(String(r.fim).slice(0, 7)) : '') + '">'
        + '<p class="nota" style="margin:2px 0 0">Ex.: parcelamento ou contrato de 12 meses. Vazio = sem fim. Passado o mês final, ela não gera mais conta e aparece como “Encerrada”.</p></div>' : '')
    + '<div class="campo"><label style="display:flex;align-items:center;gap:6px;font-weight:normal">'
    +   '<input id="reVariavel" type="checkbox" style="width:auto"' + (editando && r.variavel ? ' checked' : '') + '> O valor muda todo mês (ex.: energia elétrica)</label>'
    +   '<p class="nota" style="margin:2px 0 0">Marcado, o Valor acima vale como estimativa (a média do mês): cada título nasce com ele e marcado “(valor a confirmar)”, e você acerta o valor real no próprio título.</p></div>'
    + (editando ? '' : '<p class="nota">Se o mês de início já começou, o título deste mês é lançado automaticamente ao salvar.</p>'),
    [{ label:'Cancelar', onClick: fecharModal },
     { label: editando ? 'Salvar' : 'Criar', pri:true, onClick: async () => {
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const fornecedorId = fornCampo.valor();
        if (!fornecedorId){ toast('Escolha o fornecedor (digite parte do nome) ou cadastre um novo.', 'err'); return; }
        const grupoId = v('reGrupo');
        if (!grupoId){ toast('Selecione a categoria.', 'err'); return; }
        // S48 · item 4: cada título herda esta descrição, todo mês — "."
        // não serve. Na edição, só se a pessoa mexeu no texto.
        const descRec = v('reDesc');
        if ((!editando || descRec !== String(r.descricao || '').trim()) && !finDescOk(descRec)){ toast(FIN_DESC_MSG, 'err'); return; }
        const dia = Number(v('reDia'));
        if (!dia || dia < 1 || dia > 31){ toast('Informe o dia do vencimento (1 a 31).', 'err'); return; }
        const inicio = v('reInicio');
        if (!inicio){ toast('Informe o mês de início.', 'err'); return; }
        // F32 (issue 95): valor fixo só com valor maior que zero (o banco também recusa); o variável pode ficar sem estimativa
        const variavel = !!(document.getElementById('reVariavel') || {}).checked;
        const valorRec = v('reValor') ? finValorLido('reValor') : 0;
        if (isNaN(valorRec)){ toast('O valor não é um número: escreva como 1.250,00.', 'err'); return; }
        if (!variavel && !(valorRec > 0)){ toast('Recorrência de valor fixo precisa de valor maior que zero. Se o valor muda todo mês, marque “O valor muda todo mês”.', 'err'); return; }
        // F32 (issue 102): o mês final não pode ser antes do início; na nova, também não antes deste mês (ela gera o mês atual ao criar)
        const fim = tem528 ? v('reFim') : '';
        if (fim && fim < inicio){ toast('O mês final não pode ser antes do mês de início.', 'err'); return; }
        if (fim && !editando && fim < finMesHoje()){ toast('Numa recorrência nova, o mês final não pode ser antes deste mês.', 'err'); return; }
        const fimAntes = editando && r.fim ? String(r.fim).slice(0, 7) : '';
        const campos = {
          p_id: editando ? r.id : null,
          p_fornecedor_id: fornecedorId, p_grupo_id: grupoId, p_subcategoria_id: v('reSub') || null,
          p_descricao: descRec || null, p_valor: valorRec || 0,
          p_variavel: variavel,
          p_dia_vencimento: dia, p_forma: v('reForma') || null,
          p_inicio: inicio + '-01'
        };
        let id;
        try{ id = await rpc('tf_fin_recorrencia_gravar', campos); }
        catch(e){ toast(e.message, 'err'); return; }
        let avisoFim = '';
        if (tem528 && fim !== fimAntes){
          try{ await rpc('tf_fin_recorrencia_fim', { p_id: id || r.id, p_fim: fim ? fim + '-01' : null }); }
          catch(e){ avisoFim = ' Mas o mês final não foi gravado: ' + e.message; }
        }
        fecharModal();
        toast((editando ? 'Recorrência atualizada.' : 'Recorrência criada — se já começou, o título deste mês já foi lançado.') + avisoFim, avisoFim ? 'err' : 'ok');
        await finrecCarregar();
     }}]);
  const fornCampo = finFornCampo('reForn', fornecedores, editando ? r.fornecedor_id : null, false);   // F32 (issue 101)

  // Subcategoria depende da categoria escolhida — repopula ao trocar de grupo.
  const selGrupo = document.getElementById('reGrupo');
  const selSub = document.getElementById('reSub');
  const repopularSub = (grupoId, subSelecionada) => {
    const g = grupos.find(x => x.id === grupoId);
    selSub.innerHTML = '<option value="">—</option>' + finSubOpcoes(g, subSelecionada);   // F32 (issue 103)
  };
  selGrupo.addEventListener('change', () => repopularSub(selGrupo.value, null));
  if (grupoAtualId) repopularSub(grupoAtualId, editando ? r.subcategoria_id : null);
}

let _pdfjs = null;

function carregarPdfJs(){
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((ok, err) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); }
      catch(e){ err(new Error('A leitura de PDF não inicializou.')); } };
    s.onerror = () => { _pdfjs = null; err(new Error('Não consegui baixar o leitor de PDF. Sem internet? Envie uma FOTO do termo.')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}

async function iniciar(){
  // S215 (issue 231): as consultas da abertura vão juntas (antes uma esperava a outra; cada uma trata o próprio erro)
  const fundo = Promise.all([carregarParametros(), carregarEquipe()]);
  await Promise.all([carregarCC(), carregarFin()]);
  montarNav();
  pintarCracha();
  await fundo;
  // o hub (ou um link) abre uma tela daqui com `?ir=`
  try{
    const prm = new URLSearchParams(location.search);
    const ir = prm.get('ir');
    if (ir){
      if (NAV.some(g => (g.itens || []).some(i => i.v === ir && !i.link))){
        visao = ir;
        const sit = prm.get('sit');
        if (sit && /^[a-z_]{2,20}$/.test(sit)) FIN_SIT_ENTRADA = { tela: ir, sit: sit };
        // F31 (issue 188): o "Precisa de ação" da Reunião do TapGestão abre fin/?ir=finpg&titulo=<id>
        const tit = prm.get('titulo');
        if (tit && /^[0-9a-f-]{36}$/i.test(tit) && (ir === 'finpg' || ir === 'finre')){
          FIN_TITULO_ENTRADA = { tela: ir, id: tit }; FIN_SIT_ENTRADA = { tela: ir, sit: 'todas' };
        }
      }
      history.replaceState(null, '', location.pathname);
    }
    // F11 · o card da T16 abre fin/?os=<id>(&t=T16): Contas a Receber com o painel da OS
    if (prm.get('os')){
      if (osDaEntrada(prm)) visao = 'finre';
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
  if (!conectado && !DEMO) setConn('ok', 'Conectado');
  if (DEMO) setConn('', 'Demonstração');
  irPara(visao);
  contarCartoes().catch(() => {});
}
