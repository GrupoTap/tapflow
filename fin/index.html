const CAR = { aba: 'canhotos', painel: null, grupos: [], fatura: null, faturaId: null, fotos: new Map(), resolvidasAbertas: false };

const CAR_DIA_SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

const carDiaTxt = iso => iso ? dataBR(iso).slice(0, 5) + ' (' + CAR_DIA_SEM[new Date(String(iso).slice(0, 10) + 'T12:00').getDay()] + ')' : '';

const carNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function carNum(txt){
  let s = String(txt == null ? '' : txt).replace(/[R$\s ]/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s); return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}

const carValTxt = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function carOpcoesCat(sel){
  const G = (CAR.grupos || []).filter(g => g.tipo === 'p').sort((a, b) => FIN_COL.compare(a.nome, b.nome));
  return '<option value="">— categoria —</option>' + G.map(g => '<optgroup label="' + esc(g.nome) + '">'
    + (g.subcategorias || []).map(s => { const v = g.id + '|' + s.id;
        return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(s.nome) + '</option>'; }).join('')
    + '<option value="' + esc(g.id + '|') + '"' + ((g.id + '|') === sel ? ' selected' : '') + '>' + esc(g.nome) + ' (sem subcategoria)</option>'
    + '</optgroup>').join('');
}

const carCatVal = (g, s) => g ? g + '|' + (s || '') : '';

function carCatNome(g, s){
  const G = (CAR.grupos || []).find(x => x.id === g); if (!G) return '';
  const S = (G.subcategorias || []).find(x => x.id === s);
  return S ? S.nome : G.nome;
}

const CAR_REGRAS = [
  [/abastec|combust|gasolin|diesel|etanol|\bposto\b|auto posto/, ['combust']],
  [/hotel|hosped|pousada/, ['hosped']],
  [/pedag|veloe|sem parar|conectcar/, ['pedag']],
  [/supermerc|mercado|cafe|acucar|limpeza|padaria/, ['limpeza', 'insumo']],
  [/papelaria|livrar|escritorio|impress|grafic/, ['material de escrit', 'servicos graf']],
  [/ferrament|parafus|material|peca|eletric|hidraul|construc/, ['insumo', 'manutencao de equip']],
  [/estacion|lavagem|borrach|oficina|pneu/, ['despesas veic', 'manutencao de veic']],
  [/curso|treinament|ensino/, ['curso']],
  [/frete|correio|sedex|transportad/, ['frete']],
  [/\biof\b|anuidade|tarifa|juros|encargo/, ['taxa']]
];

function carSugerir(texto){
  const t = carNorm(texto);
  for (const [re, alvos] of CAR_REGRAS){
    if (!re.test(t)) continue;
    for (const a of alvos){
      for (const g of (CAR.grupos || []).filter(x => x.tipo === 'p')){
        const s = (g.subcategorias || []).find(x => carNorm(x.nome).indexOf(a) >= 0);
        if (s) return g.id + '|' + s.id;
      }
    }
  }
  return '';
}

const CAR_CAT_BANCO = { TRANSPORTE: 'posto', HOSPEDAGEM: 'hotel', CONSTRUCAO: 'ferramenta', LIVRARIAS: 'papelaria', ENSINO: 'curso' };

const carUrl = path => SUPABASE_URL + '/storage/v1/object/cartoes/' + String(path).split('/').map(encodeURIComponent).join('/');

async function carFoto(path){
  if (!path) return '';
  if (CAR.fotos.has(path)) return CAR.fotos.get(path);
  const p = (async () => {
    const r = await rhfdFetch(carUrl(path), {});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return URL.createObjectURL(await r.blob());
  })();
  CAR.fotos.set(path, p);
  try{ return await p; }catch(e){ CAR.fotos.delete(path); return ''; }
}

const carThumb = (path, rot) => path ? '<button type="button" class="carFoto" data-foto="' + esc(path) + '" title="Ver o canhoto" aria-label="Ver o canhoto'
  + (rot ? ' de ' + esc(rot) : '') + '"><img alt=""></button>' : '<span class="carFoto vazio" aria-hidden="true"></span>';

function carLigarFotos(el){
  el.querySelectorAll('.carFoto[data-foto]').forEach(b => {
    const img = b.querySelector('img');
    carFoto(b.dataset.foto).then(u => { if (u && img) img.src = u; else b.classList.add('falhou'); });
    b.addEventListener('click', ev => { ev.preventDefault(); carVerFoto(b.dataset.foto, b.getAttribute('aria-label') || 'Canhoto'); });
  });
}

async function carVerFoto(path, titulo){
  abrirModal(titulo, '<div class="carFotoGrande"><p class="nota">Carregando a foto…</p></div>', [{ label: 'Fechar', pri: true, onClick: fecharModal }]);
  document.getElementById('modal').classList.add('largo');
  const u = await carFoto(path);
  const cx = document.querySelector('#mBody .carFotoGrande'); if (!cx) return;
  if (!u){ cx.innerHTML = '<p class="nota">Não consegui abrir a foto.</p>'; return; }
  cx.innerHTML = '<img alt="Foto do canhoto" src="' + esc(u) + '"><p class="nota">Toque na foto para ampliar.</p>';
  const im = cx.querySelector('img'); im.addEventListener('click', () => im.classList.toggle('zoom'));
}

async function carSoTrava(el, fn){
  if (!el || el.tagName === 'BUTTON') return _semDuploEnvio_(el, fn);
  if (el.dataset.enviando === '1') return;
  el.dataset.enviando = '1'; const d = el.disabled; el.disabled = true; el.classList.add('ocupado');
  try{ return await fn(); } finally{ el.disabled = d; el.classList.remove('ocupado'); delete el.dataset.enviando; }
}

function carSugestaoComp(c){
  if (c.titulo && c.titulo.grupo_id) return carCatVal(c.titulo.grupo_id, c.titulo.subcategoria_id);
  if (c.sugestao && c.sugestao.grupo_id) return carCatVal(c.sugestao.grupo_id, c.sugestao.subcategoria_id);
  return carSugerir(c.frase);
}

        + lan.map(c => carLinhaLancado(c)).join('') + '</div><p class="nota">A conta já está em Contas a Pagar, com vencimento estimado. '
        + 'A fatura confirma o cartão, o vencimento e o estabelecimento.</p></details>' : '')
    + (dev.length ? '<details class="carSec"><summary><b>Devolvidos ao funcionário</b> · ' + dev.length + ' (30 dias)</summary><div class="ccLista">'
        + dev.map(c => '<div class="rhLin"><span class="t"><b>' + esc(c.usuario_nome) + '</b> · ' + esc(BRL(c.valor)) + ' · ' + esc(carDiaTxt(c.data_compra))
          + '<small>' + esc(c.frase || 'sem frase') + ' · motivo: ' + esc(c.devolvido_motivo || '') + '</small></span>'

function carLigarLinhaCanhoto(ln){
  const c = (CAR.painel.comprovantes || []).find(x => x.id === ln.dataset.c); if (!c) return;
  const bl = ln.querySelector('[data-lancar]'), bd = ln.querySelector('[data-dev]');
  const lancar = () => _semDuploEnvio_(bl, async () => {
    const valor = carNum(ln.querySelector('.carValor input').value);
    const [g, s] = (ln.querySelector('.carCat select').value || '').split('|');
    const desc = ln.querySelector('.carDesc input').value;
    if (!(valor > 0)){ toast('Confira o valor do canhoto.', 'err'); ln.querySelector('.carValor input').focus(); return; }
    if (!g){ toast('Escolha a categoria.', 'err'); ln.querySelector('.carCat select').focus(); return; }
    if (valor !== Number(c.valor) && !ln.dataset.okValor){
      ln.dataset.okValor = '1';
      toast('O valor mudou de ' + BRL(c.valor) + ' para ' + BRL(valor) + '. Clique de novo para confirmar.', 'err'); return;
    }
    try{
      await rpc('tf_cartao_lancar', { p_id: c.id, p_grupo_id: g, p_subcategoria_id: s || null, p_descricao: desc,
        p_valor: valor, p_data: c.data_compra, p_os_codigo: null });
      ln.classList.add('feito');
      const prox = ln.nextElementSibling || (ln.closest('.carDia') && ln.closest('.carDia').nextElementSibling && ln.closest('.carDia').nextElementSibling.querySelector('.carLin'));
      toast((c.situacao === 'lancado' ? 'Corrigido: ' : 'Lançado: ') + BRL(valor) + ' · ' + (desc || c.frase || ''), 'ok');
      const foco = prox && prox.dataset && prox.dataset.c;
      await carCarregar();
      if (foco){ const s2 = document.querySelector('.carLin[data-c="' + foco + '"] .carCat select'); if (s2) s2.focus(); }
    }catch(e){ toast(e.message, 'err'); }
  });

function carCsvLinhas(txt){
  const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const L = []; let lin = [], cel = '', aspas = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (aspas){ if (ch === '"'){ if (txt[i + 1] === '"'){ cel += '"'; i++; } else aspas = false; } else cel += ch; continue; }
    if (ch === '"') aspas = true;
    else if (ch === sep){ lin.push(cel); cel = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && txt[i + 1] === '\n') i++; lin.push(cel); L.push(lin); lin = []; cel = ''; }
    else cel += ch;
  }
  if (cel || lin.length){ lin.push(cel); L.push(lin); }
  return L.filter(l => l.some(c => String(c).trim()));
}

const carDataBR = s => { const m = String(s || '').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : null; };

function carLerCsv(txt){
  const L = carCsvLinhas(txt.replace(/^﻿/, ''));
  const cab = L.findIndex(l => l.map(c => carNorm(c).trim()).indexOf('data') >= 0 && l.map(c => carNorm(c).trim()).indexOf('valor') >= 0);
  const cabNu = L.findIndex(l => ['date', 'title', 'amount'].every(k => l.map(c => carNorm(c).trim()).indexOf(k) >= 0));
  const out = { banco: null, linhas: [], vencDDMM: null, avisos: [] };
  const tipoDe = (estab, tipoTxt, valorAPagar) => {
    const pm = String(tipoTxt || '').match(/parcela\s*(\d+)\s*(?:\/|de)\s*(\d+)/i) || String(estab).match(/parcela\s*(\d+)\s*(?:\/|de)\s*(\d+)/i);
    if (/pagamento/i.test(estab) && valorAPagar < 0) return { tipo: 'pagamento' };
    if (valorAPagar < 0) return { tipo: 'estorno' };
    if (pm) return { tipo: 'parcela', k: Number(pm[1]), n: Number(pm[2]) };
    if (/\biof\b|anuidade|tarifa|juros|encargo|multa/i.test(estab)) return { tipo: 'tarifa' };
    return { tipo: 'compra' };
  };
  if (cab >= 0){
    out.banco = 'inter';
    const H = L[cab].map(c => carNorm(c).trim());
    const ix = k => H.findIndex(h => h === k || h.startsWith(k));
    const iD = ix('data'), iC = ix('cartao'), iL = ix('lancamento'), iCat = ix('categoria'), iT = ix('tipo'), iV = ix('valor');
    L.slice(0, cab).forEach(l => { if (carNorm(l[0]).trim() === 'vencimento' && /^\d{2}\/\d{2}/.test(String(l[1]).trim())) out.vencDDMM = String(l[1]).trim().slice(0, 5); });
    L.slice(cab + 1).forEach((l, n) => {
      const data = carDataBR(l[iD]); if (!data) return;                 // "Total", linhas vazias
      const v = carNum(l[iV]); if (!isFinite(v)) { out.avisos.push('linha ' + (n + 1) + ': valor "' + l[iV] + '" não lido'); return; }
      // "Lançamento" é de largura fixa: nome em 22, cidade em 13, país em 3
      // ("PIRATININGA FERRAMENTA DIVINOPOLIS   BRA" não tem dois espaços entre
      // o nome e a cidade). Fora desse formato, separa por 2+ espaços.
      const bruto = String(l[iL] || '').replace(/\u00a0/g, ' ').replace(/\s+$/, '');
      let estab, cidade;
      if (bruto.length >= 30 && /\s[A-Z]{3}$/.test(bruto) && bruto.charAt(22) === ' '){
        estab = bruto.slice(0, 22).trim(); cidade = bruto.slice(23, bruto.length - 3).trim();
      } else {
        const partes = bruto.trim().split(/\s{2,}/);
        estab = (partes[0] || '').trim();
        cidade = partes.length > 2 ? partes[1].trim() : (partes.length === 2 && !/^[A-Z]{3}$/.test(partes[1].trim()) ? partes[1].trim() : '');
      }
      const dig = String(l[iC] || '').replace(/\D/g, '');
      const aPagar = -v;                                               // compra vem negativa
      const t = tipoDe(estab, l[iT], aPagar);
      out.linhas.push({ data, estabelecimento: estab, cidade, categoria: iCat >= 0 ? String(l[iCat] || '').trim() : '',
        final: dig.length >= 4 && t.tipo !== 'pagamento' ? dig.slice(-4) : '', tipo: t.tipo, parcela_k: t.k || null, parcela_n: t.n || null, valor: Math.round(aPagar * 100) / 100 });
    });
  } else if (cabNu >= 0){
    out.banco = 'nubank'; out.avisos.push('Leitor do Nubank provisório (date, title, amount): confira as linhas antes de importar.');
    const H = L[cabNu].map(c => carNorm(c).trim());
    const iD = H.indexOf('date'), iT = H.indexOf('title'), iV = H.indexOf('amount');
    L.slice(cabNu + 1).forEach(l => {
      const data = /^\d{4}-\d{2}-\d{2}/.test(String(l[iD]).trim()) ? String(l[iD]).trim().slice(0, 10) : carDataBR(l[iD]); if (!data) return;
      const v = Number(String(l[iV]).replace(',', '.')); if (!isFinite(v)) return;
      const estab = String(l[iT] || '').trim(); const t = tipoDe(estab, '', v);
      out.linhas.push({ data, estabelecimento: estab.replace(/\s*-\s*parcela\s*\d+\/\d+\s*$/i, ''), cidade: '', categoria: '', final: '',
        tipo: t.tipo, parcela_k: t.k || null, parcela_n: t.n || null, valor: Math.round(v * 100) / 100 });
    });
  }
  return out;
}

function carVencDoCsv(ddmm, linhas){
  if (!ddmm) return null;
  const maior = linhas.map(l => l.data).sort().pop() || isoHoje();
  let a = Number(maior.slice(0, 4)); let v = a + '-' + ddmm.slice(3, 5) + '-' + ddmm.slice(0, 2);
  if (v < maior) v = (a + 1) + v.slice(4);
  return v;
}

async function carLerPdf(file){
  const lib = await carregarPdfJs();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  let txt = '';
  for (let i = 1; i <= Math.min(doc.numPages, 12); i++){
    const pg = await doc.getPage(i); const c = await pg.getTextContent();
    txt += ' ' + c.items.map(x => x.str).join(' ');
  }
  txt = txt.replace(/\s+/g, ' ');
  const num = s => carNum(s);
  const cont = {};
  const soma = (v, peso) => { if (v > 0) cont[v] = (cont[v] || 0) + peso; };
  let m; const reRod = /\d{4}\*{4}\d{4}\s+(\d{2}\/\d{2}\/\d{4})\s+R\$\s*([\d.]+,\d{2})/g; let venc = null;
  while ((m = reRod.exec(txt))){ soma(num(m[2]), 2); venc = venc || carDataBR(m[1]); }
  [/Total da sua fatura\s*R\$\s*([\d.]+,\d{2})/i, /Fatura atual\s*R\$\s*([\d.]+,\d{2})/i, /Total (?:da fatura|a pagar)[^R$]{0,40}R\$\s*([\d.]+,\d{2})/i]
    .forEach(re => { const x = txt.match(re); if (x) soma(num(x[1]), 1); });
  const total = Object.keys(cont).sort((a, b) => cont[b] - cont[a])[0];
  const v2 = txt.match(/(?:Data de )?Vencimento:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  const ct = txt.match(/Data de corte:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  return { total: total != null ? Number(total) : null, vencimento: venc || (v2 && carDataBR(v2[1])), proximo_corte: ct && carDataBR(ct[1]) };
}

async function carLerTexto(file){
  const buf = await file.arrayBuffer();
  const u = new TextDecoder('utf-8').decode(buf);
  return u.indexOf('�') >= 0 ? new TextDecoder('windows-1252').decode(buf) : u;
}

async function carImportarEnviar(I){
  const cart = document.getElementById('ciCart').value, venc = document.getElementById('ciVenc').value;
  const tot = carNum(document.getElementById('ciTot').value);
  if (!I.lido || !I.lido.linhas.length){ toast('Escolha o CSV da fatura.', 'err'); return; }
  if (!venc){ toast('Informe o vencimento da fatura.', 'err'); return; }
  const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
  const base = 'faturas/' + cart + '/' + venc + '_' + id.slice(0, 8);
  const subidos = [];
  const subir = async (file, ext, mime) => {
    const path = base + '.' + ext;
    const r = await rhfdFetch(carUrl(path), { method: 'POST', headers: { 'Content-Type': mime }, body: file });
    if (!r.ok){ const j = await r.json().catch(() => null); throw new Error('O armazenamento recusou o ' + ext.toUpperCase() + (j && (j.message || j.error) ? ': ' + (j.message || j.error) : ' (HTTP ' + r.status + ')')); }
    subidos.push(path); return path;
  };
  try{
    toast('Enviando a fatura…', 'ok');
    const csvP = await subir(I.csv, 'csv', 'text/csv');
    const pdfP = I.pdf ? await subir(I.pdf, 'pdf', 'application/pdf') : null;
    const r = await rpc('tf_cartao_fatura_importar', { p_cartao_id: cart, p_vencimento: venc, p_total: isFinite(tot) ? tot : null,
      p_total_origem: isFinite(tot) ? (I.pdfLido && I.pdfLido.total === tot ? 'pdf' : 'digitado') : null,
      p_proximo_corte: (I.pdfLido && I.pdfLido.proximo_corte) || null, p_csv_path: csvP, p_pdf_path: pdfP, p_linhas: I.lido.linhas });
    fecharModal();
    toast(finPlural((r.linhas || []).length, 'linha importada', 'linhas importadas') + ' · ' + (r.casadas || 0) + ' resolvidas sozinhas'
      + (r.primeira && r.recorrencia_anulados ? ' · ' + finPlural(r.recorrencia_anulados, 'título da recorrência anulado', 'títulos da recorrência anulados') : ''), 'ok');
    CAR.aba = 'faturas'; CAR.fatura = r; CAR.faturaId = r.id;
    await carCarregar();
  }catch(e){
    subidos.forEach(p => rhfdFetch(carUrl(p), { method: 'DELETE' }).catch(() => {}));
    toast(e.message, 'err');
  }
}

  const finaisSem = (F.finais || []).filter(x => !x.usuario_id);
  const pessoas = (CAR.painel && CAR.painel.pessoas) || [];
  const optPes = sel => '<option value="">— de quem? —</option>' + pessoas.map(p => '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.nome) + '</option>').join('');
  el.innerHTML = '<div class="carFatCab"><button class="btn mini" type="button" id="carVolta">‹ Faturas</button>'
    + '<h3>Fatura ' + esc(F.cartao_nome) + ' · vence ' + esc(dataBR(F.vencimento)) + '</h3>'
    + '<span class="carLinks">' + (F.pdf_path ? '<button class="lnk" type="button" data-arq="' + esc(F.pdf_path) + '">PDF</button>' : '')
      + (F.csv_path ? ' <button class="lnk" type="button" data-arq="' + esc(F.csv_path) + '">CSV</button>' : '') + '</span></div>'
    + '<ol class="carPassos"><li class="ok">Importada <small>' + esc(rhDT(F.importada_em)) + '</small></li>'
      + '<li class="' + (passo === 2 ? 'on' : 'ok') + '">Conferir</li><li class="' + (F.situacao === 'paga' ? 'ok' : passo === 3 ? 'on' : '') + '">Pagar'
      + (F.situacao === 'paga' ? ' <small>' + esc(dataBR(F.paga_em)) + ' · ' + esc(F.paga_conta_nome || '') + '</small>' : '') + '</li></ol>'
    + '<div class="carDif ' + (F.situacao === 'paga' ? 'paga' : (conf ? (F.pode_fechar ? 'zero' : 'falta') : 'zero')) + '">'
      + (F.situacao === 'paga' ? '<b>Paga</b><span>' + esc(BRL(F.total)) + ' em ' + esc(dataBR(F.paga_em)) + ' — no extrato aparece uma linha só.</span>'
        : F.situacao === 'fechada' ? '<b>R$ 0,00</b><span>Conferida e fechada. Falta pagar ' + esc(BRL(F.total)) + '.</span>'
        : F.total == null ? '<b>Falta o total</b><span>Digite o total impresso na fatura para conferir.</span>'
        : F.pode_fechar ? '<b>R$ 0,00</b><span>Tudo conferido — pode fechar a fatura.</span>'
        : '<b>Faltam ' + esc(BRL(F.faltando)) + '</b><span>' + finPlural(F.pendentes, 'linha sem conta', 'linhas sem conta') + ' · fatura de ' + esc(BRL(F.total)) + '</span>')
      + '<div class="carCont">' + [['✅', res.filter(l => ['conciliada', 'lancada'].indexOf(l.situacao) >= 0).length, 'resolvidas'],
          ['🧾', achou.length, 'achou o canhoto'], ['≈', quase.length, 'quase bateu'], ['⚠', sem.length, 'sem canhoto'],
          ['↩', est.length + res.filter(l => ['estornada', 'desconto'].indexOf(l.situacao) >= 0).length, 'estornos'],
          ['❓', (F.sem_linha || []).length, 'canhoto sem linha']].map(([i, n, r]) => '<span class="' + (n ? '' : 'z') + '"><b>' + i + ' ' + n + '</b> ' + r + '</span>').join('') + '</div></div>'
    + (F.total != null && !F.soma_bate ? '<div class="aviso">As linhas do CSV somam <b>' + esc(BRL(F.soma_linhas)) + '</b> e o total da fatura é <b>' + esc(BRL(F.total))
        + '</b>. Confira se o CSV é desta fatura' + (conf ? ' — ou corrija o total: <button class="btn mini" type="button" id="carTot">Digitar o total</button>' : '') + '.</div>'
      : (F.total == null && conf ? '<div class="aviso"><button class="btn mini" type="button" id="carTot">Digitar o total</button> O total impresso na fatura confere a soma das linhas.</div>' : ''))
    + '<div class="carBarra">'
      + (conf ? '<button class="btn pri" type="button" id="carFechar"' + (F.pode_fechar ? '' : ' disabled title="Só com a diferença em R$ 0,00 e nada pendente"') + '>Fechar fatura</button>' : '')
      + (F.situacao === 'fechada' ? '<button class="btn pri" type="button" id="carPagar">Pagar fatura…</button><button class="btn" type="button" id="carReabrir">Reabrir</button>' : '')
      + (F.situacao === 'paga' ? '<button class="btn" type="button" id="carEstPag">Estornar o pagamento…</button>' : '')
      + (conf ? '<button class="btn" type="button" id="carDescartar">Descartar importação…</button>' : '') + '</div>'
    + (finaisSem.length && conf ? '<div class="carSec2"><div class="secTit">De quem é cada final?</div><p class="nota" style="margin-top:0">Dito uma vez, fica guardado: '
        + 'nas próximas faturas o canhoto da pessoa é procurado primeiro nas linhas do final dela.</p><div class="carFinais">'
        + finaisSem.map(x => '<label class="carCampo"><span>Final ' + esc(x.final) + ' · ' + finPlural(x.linhas, 'linha', 'linhas') + ' · ' + esc(BRL(x.valor)) + '</span>'
          + '<select data-final="' + esc(x.final) + '">' + optPes(null) + '</select></label>').join('') + '</div></div>' : '')
    + (achou.length ? carSecao('🧾 Achou o canhoto — falta lançar', 'O canhoto bateu com a linha, mas ainda não foi lançado. Escolha a categoria e lance: a conta já nasce na fatura.',
        achou.map(l => '<div class="carLin carLinF" data-l="' + esc(l.id) + '">' + carThumb(l.comprovante.foto_path, l.comprovante.usuario_nome)
          + '<div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small><small class="f">Canhoto: ' + carCompTxt(l.comprovante) + '</small></div>'
          + '<span class="carV">' + esc(BRL(l.valor)) + '</span>'
          + '<label class="carCampo carCat"><span>Categoria</span><select>' + carOpcoesCat(carSugestaoComp(l.comprovante) || carSugLinha(l)) + '</select></label>'
          + '<label class="carCampo carDesc"><span>Descrição</span><input type="text" maxlength="200" value="' + esc(l.comprovante.frase || '') + '"></label>'
          + '<div class="carA"><button class="btn pri" type="button" data-lancomp>Lançar</button><button class="btn" type="button" data-desf>Não é este</button></div></div>').join('')) : '')
    + (quase.length ? carSecao('≈ Quase bateu', 'Mesmo período, valor próximo ou com os números trocados (ex.: 139,72 × 139,27). Confirmando, a conta fica com o valor da fatura.',
        quase.map(l => '<div class="carLin carLinF" data-l="' + esc(l.id) + '"><span class="carFoto vazio"></span><div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small></div>'
          + '<span class="carV">' + esc(BRL(l.valor)) + '</span><div class="carQuase">'
          + l.quase.map(c => '<div class="carQ" role="button" tabindex="0" data-par="' + esc(c.id) + '">' + carThumb(c.foto_path, c.usuario_nome) + '<span>' + carCompTxt(c)
            + (Math.abs(Number(c.valor) - Number(l.valor)) >= 0.005 ? ' <b class="dif">(' + esc(BRL(Number(c.valor) - Number(l.valor))) + ')</b>' : '') + '</span><em>Usar este</em></div>').join('')
          + '<button type="button" class="lnk" data-semc>Nenhum destes — lançar sem canhoto</button></div></div>').join('')) : '')
    + (sem.length ? carSecao('⚠ Na fatura, sem canhoto', 'Escolha a categoria e lance. "Não exige canhoto" faz o TapFlow lançar sozinho nas próximas faturas (ex.: VELOE). '
        + '"Cobrar canhoto" lança e pede a foto a quem fez a compra, pelo Field.',
        sem.map(l => carLinhaSem(l, optPes)).join('')) : '')
    + (est.length ? carSecao('↩ Estornos', 'Estorno de compra de fatura anterior entra como DESCONTO na categoria da compra original, no pagamento desta fatura (não vira receita).',
        est.map(l => '<div class="carLin carLinF" data-l="' + esc(l.id) + '"><span class="carFoto vazio"></span><div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small></div>'
          + '<span class="carV mais">' + esc(BRL(l.valor)) + '</span><label class="carCampo carCat"><span>Categoria da compra original</span><select>' + carOpcoesCat(carSugLinha(l)) + '</select></label>'
          + '<div class="carA"><button class="btn pri" type="button" data-desc>Confirmar desconto</button></div></div>').join('')) : '')
    + ((F.sem_linha || []).length ? '<details class="carSec"><summary><b>❓ Canhotos sem linha nesta fatura</b> · ' + F.sem_linha.length + '</summary>'
        + '<p class="nota">Lançados (ou enviados) e que nenhuma linha pegou. Ficam abertos e são procurados de novo na próxima fatura de qualquer cartão. '
        + 'Se um deles é de uma linha acima, use "Quase bateu" ou "Desfazer" na linha.</p><div class="ccLista">'
        + F.sem_linha.map(c => '<div class="rhLin"><span class="t">' + carCompTxt(c) + '<small>' + esc(c.situacao === 'lancado' ? 'lançado' : 'ainda não lançado') + '</small></span>'
          + '<span class="a">' + carThumb(c.foto_path, c.usuario_nome)
          + '<button class="btn mini" type="button" data-devsl="' + esc(c.id) + '" title="Repetido, ou não é do cartão: devolve ao funcionário e anula a conta">Devolver…</button></span></div>').join('') + '</div></details>' : '')
    + (res.length ? '<details class="carSec"' + (CAR.resolvidasAbertas ? ' open' : '') + ' id="carRes"><summary><b>Resolvidas</b> · ' + res.length + '</summary><div class="ccLista">'
        + res.map(l => carLinhaResolvida(l, conf)).join('') + '</div></details>' : '');
  carLigarFotos(el);
  carLigarFatura(el, F, conf);
}

const carSecao = (tit, nota, html) => '<div class="carSec2"><div class="secTit">' + tit + '</div><p class="nota" style="margin-top:0">' + nota + '</p><div class="ccLista">' + html + '</div></div>';

function carLinhaSem(l, optPes){
  return '<div class="carLin carLinF" data-l="' + esc(l.id) + '"><span class="carFoto vazio"></span><div class="carInfo">' + carLinhaRot(l) + '<small>' + carLinhaSub(l) + '</small>'
    + (l.cobrar_nome ? '<small class="f">canhoto pedido a ' + esc(l.cobrar_nome) + '</small>' : '') + '</div>'
    + '<span class="carV">' + esc(BRL(l.valor)) + '</span>'
    + '<label class="carCampo carCat"><span>Categoria' + (l.memoria && l.memoria.grupo_id ? ' <em>(da última vez)</em>' : '') + '</span><select>' + carOpcoesCat(carSugLinha(l)) + '</select></label>'
    + '<div class="carA"><button class="btn pri" type="button" data-lanl>Lançar</button>'
    + '<details class="carMais"><summary class="btn">Mais…</summary><div class="carMaisC">'
    + '<label class="chk"><input type="checkbox" data-semcanh' + (l.memoria && l.memoria.exige_canhoto === false ? ' checked' : '') + '> Não exige canhoto (lembrar)</label>'
    + '<label class="carCampo"><span>Cobrar canhoto de</span><select data-cobrar>' + optPes(l.dono_final && l.dono_final.usuario_id) + '</select></label>'
    + '<button class="btn" type="button" data-cob>Lançar e cobrar</button>'
    + '<label class="carCampo"><span>Contestar (cobrança indevida)</span><input type="text" data-motivo maxlength="200" placeholder="motivo, ex.: não reconheço — pedido ao banco"></label>'
    + '<button class="btn perigo" type="button" data-cont>Lançar como contestada</button></div></details></div></div>';
}

const CAR_RES = { conciliada: ['fOk', 'casou com o canhoto'], lancada: ['fOk', 'lançada'], contestada: ['risco', 'contestada'],
  estornada: ['', 'estornada'], desconto: ['prog', 'desconto'], ignorada: ['', 'fora da conta'] };

function carLinhaResolvida(l, conf){
  const [cls, rot] = CAR_RES[l.situacao] || ['', l.situacao];
  const t = l.titulo, c = l.comprovante;
  return '<div class="rhLin' + (l.situacao === 'ignorada' || l.situacao === 'estornada' ? ' riscada' : '') + '"><span class="t">' + carLinhaRot(l) + ' · <b>' + esc(BRL(l.valor)) + '</b>'
    + '<small>' + carLinhaSub(l) + ' · <span class="chip ' + cls + '">' + esc(rot) + '</span>'
    + (t ? ' ' + esc([t.descricao, [t.grupo_nome, t.subcategoria_nome].filter(Boolean).join(' › ')].filter(Boolean).join(' · ')) : '')
    + (c ? ' · canhoto de ' + esc(c.usuario_nome) : '') + (l.motivo ? ' · ' + esc(l.motivo) : '') + '</small></span>'
    + '<span class="a">' + (c ? carThumb(c.foto_path, c.usuario_nome) : '')
    + (conf && l.situacao !== 'ignorada' ? '<button class="btn mini" type="button" data-desf="' + esc(l.id) + '">Desfazer</button>' : '') + '</span></div>';
}

function carLigarFatura(el, F, conf){
  const fid = F.id;
  document.getElementById('carVolta').addEventListener('click', () => { CAR.faturaId = null; CAR.fatura = null; carCarregar(); });
  el.querySelectorAll('[data-arq]').forEach(b => b.addEventListener('click', async () => {
    const w = window.open('', '_blank'); if (!w){ toast('Libere pop-ups para o TapFlow.', 'err'); return; }
    try{ const r = await rhfdFetch(carUrl(b.dataset.arq), {}); if (!r.ok) throw new Error('HTTP ' + r.status);
         w.location.href = URL.createObjectURL(await r.blob()); }catch(e){ try{ w.close(); }catch(_){} toast('Não consegui abrir: ' + e.message, 'err'); }
  }));
  const linha = b => (F.linhas || []).find(l => l.id === b.closest('[data-l]').dataset.l);
  const cat = b => (b.closest('.carLin').querySelector('.carCat select').value || '').split('|');
  el.querySelectorAll('[data-lancomp]').forEach(b => b.addEventListener('click', () => {
    const l = linha(b), [g, s] = cat(b), desc = b.closest('.carLin').querySelector('.carDesc input').value;
    if (!g){ toast('Escolha a categoria.', 'err'); return; }
    _semDuploEnvio_(b, async () => {
      try{ await rpc('tf_cartao_lancar', { p_id: l.comprovante.id, p_grupo_id: g, p_subcategoria_id: s || null, p_descricao: desc || l.estabelecimento,
             p_valor: Number(l.comprovante.valor), p_data: l.comprovante.data_compra, p_os_codigo: null });
           await carAbrirFatura(fid); toast('Lançado e casado com a linha.', 'ok'); }
      catch(e){ toast(e.message, 'err'); }
    });
  }));
  el.querySelectorAll('[data-par]').forEach(b => {
    const usar = () => carAcao(b, 'tf_cartao_linha_conciliar', { p_linha_id: linha(b).id, p_comprovante_id: b.dataset.par }, 'Casado. A conta ficou com o valor da fatura.');
    b.addEventListener('click', ev => { if (!ev.target.closest('.carFoto')) usar(); });
    b.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); usar(); } });
  });
  el.querySelectorAll('[data-semc]').forEach(b => b.addEventListener('click', () => {
    const l = linha(b); const ln = b.closest('.carLin'); const d = document.createElement('div');
    d.innerHTML = carLinhaSem(Object.assign({}, l, { quase: [] }), sel => '<option value="">— de quem? —</option>'
      + ((CAR.painel && CAR.painel.pessoas) || []).map(p => '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.nome) + '</option>').join(''));
    ln.replaceWith(d.firstElementChild); carLigarFatura(el, F, conf);
  }));
  const lancarLinha = (b, extra, msg) => {
    const l = linha(b), [g, s] = cat(b); const ln = b.closest('.carLin');
    if (!g){ toast('Escolha a categoria.', 'err'); ln.querySelector('.carCat select').focus(); return; }
    const semc = ln.querySelector('[data-semcanh]');
    carAcao(b, 'tf_cartao_linha_lancar', Object.assign({ p_linha_id: l.id, p_grupo_id: g, p_subcategoria_id: s || null, p_descricao: null,
      p_lembrar: true, p_exige_canhoto: semc ? !semc.checked : null, p_cobrar_usuario: null, p_contestar_motivo: null }, extra), msg);
  };
  el.querySelectorAll('[data-lanl]').forEach(b => b.addEventListener('click', () => lancarLinha(b, {}, 'Lançada.')));
  el.querySelectorAll('[data-cob]').forEach(b => b.addEventListener('click', () => {
    const u = b.closest('.carLin').querySelector('[data-cobrar]').value;
    if (!u){ toast('Escolha de quem cobrar o canhoto.', 'err'); return; }
    lancarLinha(b, { p_cobrar_usuario: u }, 'Lançada. O pedido do canhoto aparece no Field da pessoa.');
  }));
  el.querySelectorAll('[data-cont]').forEach(b => b.addEventListener('click', () => {
    const m = b.closest('.carLin').querySelector('[data-motivo]').value;
    if (String(m).trim().length < 5){ toast('Escreva o motivo da contestação.', 'err'); return; }
    lancarLinha(b, { p_contestar_motivo: m, p_lembrar: false }, 'Lançada como contestada: entra na conta da fatura e fica marcada.');
  }));
  el.querySelectorAll('[data-desc]').forEach(b => b.addEventListener('click', () => {
    const [g, s] = cat(b); if (!g){ toast('Escolha a categoria da compra original.', 'err'); return; }
    carAcao(b, 'tf_cartao_linha_desconto', { p_linha_id: linha(b).id, p_grupo_id: g, p_subcategoria_id: s || null }, 'Desconto confirmado.');
  }));
  el.querySelectorAll('[data-desf]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.desf || linha(b).id;
    if (b.dataset.ok !== '1'){ b.dataset.ok = '1'; const t0 = b.textContent; b.textContent = 'Desfazer mesmo?'; b.classList.add('perigo');
      setTimeout(() => { if (document.body.contains(b)){ b.dataset.ok = ''; b.textContent = t0; b.classList.remove('perigo'); } }, 5000); return; }
    CAR.resolvidasAbertas = !!document.getElementById('carRes') && document.getElementById('carRes').open;
    carAcao(b, 'tf_cartao_linha_desfazer', { p_linha_id: id }, 'Desfeito — a linha voltou para resolver.');
  }));
  el.querySelectorAll('[data-devsl]').forEach(b => b.addEventListener('click', () => carDevolver((F.sem_linha || []).find(x => x.id === b.dataset.devsl))));
  el.querySelectorAll('[data-final]').forEach(s => s.addEventListener('change', () => carSoTrava(s, async () => {
    if (!s.value) return;
    try{ await rpc('tf_cartao_final_gravar', { p_cartao_id: F.cartao_id, p_final: s.dataset.final, p_usuario_id: s.value, p_apelido: null });
         toast('Final ' + s.dataset.final + ' guardado.', 'ok'); await carAbrirFatura(fid); }catch(e){ toast(e.message, 'err'); }
  })));
  const bt = document.getElementById('carTot');
  if (bt) bt.addEventListener('click', () => {
    abrirModal('Total da fatura', '<div class="campo"><label for="carTotV">Total impresso na fatura</label><input id="carTotV" type="text" inputmode="decimal" value="'
      + esc(F.total != null ? carValTxt(F.total) : '') + '"></div>', [{ label: 'Cancelar', onClick: fecharModal },
      { label: 'Gravar', pri: true, onClick: async () => { const v = carNum(document.getElementById('carTotV').value);
          if (!(v >= 0)){ toast('Digite o total.', 'err'); return; }
          try{ CAR.fatura = await rpc('tf_cartao_fatura_total', { p_id: fid, p_total: v }); fecharModal(); carFaturaDesenhar(); }catch(e){ toast(e.message, 'err'); } } }]);
  });
  const bf = document.getElementById('carFechar');
  if (bf) bf.addEventListener('click', () => carAcao(bf, 'tf_cartao_fatura_fechar', { p_id: fid }, 'Fatura fechada. Agora é pagar.'));
  const br = document.getElementById('carReabrir');
  if (br) br.addEventListener('click', () => carAcao(br, 'tf_cartao_fatura_reabrir', { p_id: fid }, 'Reaberta para conferência.'));
  const bp = document.getElementById('carPagar');
  if (bp) bp.addEventListener('click', () => carPagar(F));
  const be = document.getElementById('carEstPag');
  if (be) be.addEventListener('click', () => {
    abrirModal('Estornar o pagamento da fatura', '<p class="nota" style="margin-top:0">Todas as baixas desta fatura são estornadas de uma vez (nada se apaga: '
      + 'ficam riscadas no extrato). A fatura volta para "fechada".</p><div class="campo"><label for="carEstM">Motivo</label><input id="carEstM" type="text" maxlength="200"></div>',
      [{ label: 'Cancelar', onClick: fecharModal }, { label: 'Estornar', cls: 'perigo', onClick: async () => {
        try{ CAR.fatura = await rpc('tf_cartao_fatura_estornar_pagamento', { p_id: fid, p_motivo: document.getElementById('carEstM').value });
             fecharModal(); toast('Pagamento estornado.', 'ok'); carFaturaDesenhar(); }catch(e){ toast(e.message, 'err'); } } }]);
  });
  const bd = document.getElementById('carDescartar');
  if (bd) bd.addEventListener('click', async () => {
    if (!await confirmar('Descartar esta importação?', '<p>As linhas desta fatura e o que foi resolvido nelas são desfeitos (as contas criadas aqui ficam ANULADAS, '
      + 'com motivo). Os canhotos voltam para a fila. Se era a primeira fatura do cartão, a recorrência «Fatura de Cartão» volta a valer.</p><p>Use quando o arquivo estava errado.</p>', 'Descartar', true)) return;
    try{
      const r = await rpc('tf_cartao_fatura_descartar', { p_id: fid });
      [r.csv_path, r.pdf_path].filter(Boolean).forEach(p => rhfdFetch(carUrl(p), { method: 'DELETE' }).catch(() => {}));
      toast('Importação descartada.', 'ok'); CAR.faturaId = null; CAR.fatura = null; await carCarregar();
    }catch(e){ toast(e.message, 'err'); }
  });
}

async function carPagar(F){
  let contas = [];
  try{ contas = (await rpc('tf_fin_contas_listar', {})).filter(c => c.papel !== 'reserva'); }catch(e){}
  const nC = (F.linhas || []).filter(l => l.titulo && !l.titulo.anulado).length;
  const desc = (F.linhas || []).filter(l => l.situacao === 'desconto').reduce((s, l) => s - Number(l.valor), 0);
  abrirModal('Pagar a fatura ' + F.cartao_nome + ' · ' + dataBR(F.vencimento),
      '<div class="aviso ok" style="margin-top:0"><b>' + esc(BRL(F.total)) + '</b> — baixa ' + finPlural(nC, 'conta', 'contas') + ' de uma vez'
      + (desc > 0 ? ', com ' + esc(BRL(desc)) + ' de estorno como desconto na categoria de origem' : '') + '. No extrato aparece uma linha: '
      + '«Fatura ' + esc(F.cartao_nome) + ' ' + esc(dataBR(F.vencimento).slice(0, 5)) + '».</div>'
      + '<div class="dupla"><div class="campo"><label for="carPgD">Data do pagamento</label><input id="carPgD" type="date" value="' + esc(isoHoje()) + '"></div>'

  });

function lerXmlNFSe(texto){
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.querySelector('parsererror'))
    throw new Error('Não consegui ler esse arquivo como XML — confere se é o certo.');
  const pegar = tag => { const el = doc.getElementsByTagName(tag)[0]; return el ? el.textContent.trim() : ''; };
  const numero = pegar('nNFSe');
  const dhEmi = pegar('dhProc') || pegar('dhEmi');
  const data = dhEmi ? dhEmi.slice(0, 10) : '';
  const valorTxt = pegar('vLiq') || pegar('vServ');
  if (!numero || !data || !valorTxt)
    throw new Error('Não achei número, data ou valor nesse XML — confere se é o arquivo certo, ou preenche à mão.');
  return { numero, data, valor: Number(valorTxt) };
}

async function subirArquivoDrive(dataUrl, meta){
  if (DEMO) return { url: 'https://drive.google.com/demo', file_id: 'demo' };
  if (!driveLigado())
    throw Object.assign(new Error('O Google Drive ainda não foi configurado — veja o Passo 8 do guia.'),
                        { negocio: true });
  const r = await fetch(PARAM.drive_url, {
    method: 'POST', redirect: 'follow', signal: sinal(true),
    body: JSON.stringify({
      chave: PARAM.drive_chave, token: sessao.token,
      client_uid: meta.client_uid, cliente: meta.cliente, os_numero: meta.os_numero,
      categoria: meta.categoria, nome: meta.nome,
      mime: meta.mime || 'application/octet-stream', base64: dataUrl
    })
  });
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('O serviço de arquivos não respondeu como esperado.');
  if (j.status !== 'ok')
    throw Object.assign(new Error(j.mensagem || 'Falha ao gravar no Drive'),
                        { negocio: j.codigo === 'CHAVE' || j.codigo === 'TOKEN' });
  return j;
}

    [{ label:'Cancelar', onClick: fecharModal },

        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const numero = v('tfNum');
        if (!numero){ toast('Informe o número da nota.', 'err'); return; }
        if (!v('tfData')){ toast('Informe a data da nota.', 'err'); return; }
        const venc = v('tfVenc');
        if (vencMao && !venc){ toast('Informe o vencimento (ou volte ao prazo do cliente).', 'err'); return; }
        if (vencMao && venc < v('tfData')){ toast('O vencimento não pode ser antes da data da nota.', 'err'); return; }
        try{
          await rpc('tf_fin_faturar_titulo', { p_titulo_id: t.id, p_nf_numero: numero,
            p_nf_data: v('tfData'), p_nf_valor: v('tfValor') ? Number(v('tfValor')) : null,
            p_nf_xml_url: xmlUrl, p_nf_pdf_url: pdfUrl,
            // só manda quando foi corrigido; sem ele o banco faz nota + prazo
            p_vencimento: vencMao && venc !== finSomaDias(v('tfData'), prazo) ? venc : null });
          fecharModal(); toast('Título faturado.', 'ok'); await finreCarregar();
        }catch(e){ toast(e.message, 'err'); }
     }}]);

  const dEl = document.getElementById('tfData'), vEl = document.getElementById('tfVenc'), nEl = document.getElementById('tfVencNota');
  function vencAtualizar(){
    if (!document.body.contains(vEl)) return;
    const data = dEl.value;
    if (!vencMao) vEl.value = data ? finSomaDias(data, prazo) : '';
    const rotPrazo = prazo === 30 ? 'prazo padrão de 30 dias' : 'prazo do cliente, ' + prazo + ' dias';
    if (!data){ nEl.textContent = 'Informe a data da nota.'; return; }
    if (!vencMao){ nEl.textContent = 'Vence em ' + dataBR(vEl.value) + ' — ' + rotPrazo + '. Se esta nota tiver outro vencimento, corrija a data aqui.'; return; }
    const n = vEl.value ? finDiasEntre(data, vEl.value) : null;
    nEl.innerHTML = (n == null ? 'Sem vencimento.' : 'Corrigido só para esta nota: ' + n + ' dia' + (Math.abs(n) === 1 ? '' : 's') + ' depois da nota. Pelo '
        + esc(rotPrazo) + ', seria ' + esc(dataBR(finSomaDias(data, prazo))) + '.')
      + ' <a id="tfVencVolta">Voltar ao prazo</a>';
    document.getElementById('tfVencVolta').addEventListener('click', () => { vencMao = false; vencAtualizar(); });
  }
  dEl.addEventListener('input', vencAtualizar);
  dEl.addEventListener('change', vencAtualizar);
  vEl.addEventListener('input', () => { vencMao = true; vencAtualizar(); });
  vencAtualizar();
  finPrazoCliente(t.cliente_id).then(p => { prazo = p; vencAtualizar(); });

  document.getElementById('tfXml').addEventListener('change', async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const nomeEl = document.getElementById('tfXmlNome');
    nomeEl.textContent = 'Lendo ' + f.name + '…';
    try{
      const texto = await f.text();
      const lido = lerXmlNFSe(texto);
      document.getElementById('tfNum').value = lido.numero;
      document.getElementById('tfData').value = lido.data;
      document.getElementById('tfValor').value = lido.valor;
      vencAtualizar();
      nomeEl.textContent = 'Enviando ' + f.name + '…';
      const dataUrl = await arquivoParaBase64(f);
      const up = await subirArquivoDrive(dataUrl, {
        client_uid: 'nfxml-' + t.id + '-' + Date.now(), cliente: t.cliente_nome || '',
        os_numero: t.os_codigo || '', categoria: 'nfse_xml', nome: f.name, mime: 'text/xml' });
      xmlUrl = up.url;
      nomeEl.textContent = 'Lido e salvo: ' + f.name;
      toast('XML lido — confira os campos antes de faturar.', 'ok');
    }catch(e){ nomeEl.textContent = ''; toast(e.message, 'err'); }
  });

  document.getElementById('tfPdf').addEventListener('change', async ev => {
    const f = ev.target.files[0]; if (!f) return;
    const nomeEl = document.getElementById('tfPdfNome');
    nomeEl.textContent = 'Enviando ' + f.name + '…';
    try{
      const dataUrl = await arquivoParaBase64(f);
      const up = await subirArquivoDrive(dataUrl, {
        client_uid: 'nfpdf-' + t.id + '-' + Date.now(), cliente: t.cliente_nome || '',
        os_numero: t.os_codigo || '', categoria: 'nfse_pdf', nome: f.name, mime: 'application/pdf' });
      pdfUrl = up.url;
      nomeEl.textContent = 'Salvo: ' + f.name;
      toast('PDF salvo.', 'ok');
    }catch(e){ nomeEl.textContent = ''; toast(e.message, 'err'); }
  });
}

    +  '<div class="campo"><label for="tpForma">Forma prevista (opcional)</label><select id="tpForma">'
    +    '<option value="">—</option>'
    +    FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + (editando && t.forma_prevista === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('')
    +  '</select></div></div>'
    + (aConfirmar
        ? '<div class="campo"><label style="display:flex;align-items:center;gap:6px;font-weight:normal">'
          + '<input id="tpConferido" type="checkbox" style="width:auto"> Valor conferido — tira o “valor a confirmar”</label>'
          + '<small class="finTrava" style="color:var(--ink-3)">O valor é a estimativa da recorrência. Mudar o valor já marca como conferido.</small></div>'
        : '')
    + '<div class="dupla">'
    +  '<div class="campo"><label for="tpComp">Competência (mês da despesa)</label><input id="tpComp" type="month" value="' + (editando ? String(t.competencia).slice(0, 7) : '') + '"' + trava + '>' + porque + '</div>'
    +  '<div class="campo"><label for="tpVenc">Vencimento</label><input id="tpVenc" type="date" value="' + (editando ? t.vencimento : '') + '"' + trava + '>' + porque + '</div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="tpNf">Nº da nota fiscal (opcional)</label><input id="tpNf" type="text" value="' + (editando ? esc(t.nf_numero || '') : '') + '" autocomplete="off"' + trava + '>' + porque + '</div>'
    +  '<div class="campo"><label for="tpOs">OS (opcional)</label><input id="tpOs" type="text" placeholder="Ex.: OS-26043" value="' + (editando ? esc(t.os_codigo || '') : '') + '" autocomplete="off"></div></div>'
    + (editando ? '' :
        '<div class="campo"><label style="display:flex;align-items:center;gap:6px;font-weight:normal">'
      +   '<input id="tpRepetir" type="checkbox" style="width:auto"> Repetir todo mês (cria como conta recorrente)</label></div>'
      + '<div id="tpRepetirCampos" style="display:none">'
      +   '<div class="dupla">'
      +     '<div class="campo"><label for="tpRecDia">Dia do vencimento (1 a 31)</label><input id="tpRecDia" type="number" min="1" max="31" value="5"></div>'
      +     '<div class="campo"><label style="display:flex;align-items:center;gap:6px;font-weight:normal;margin-top:22px">'
      +       '<input id="tpRecVariavel" type="checkbox" style="width:auto"> O valor muda todo mês</label></div>'
      +   '</div>'
      +   '<p class="nota" style="margin-top:0">Este lançamento vira o 1º título, com o vencimento acima. Os dos meses seguintes vencem no dia escolhido e são lançados pelo botão “Gerar títulos do mês”, em Recorrentes. '
      +   'Se o valor muda todo mês, o Valor acima vale como estimativa: cada título nasce com ele e marcado “(valor a confirmar)”.</p>'
      + '</div>')
    + (editando ? finHistHtml() : ''),
    [{ label:'Cancelar', onClick: fecharModal },
     { label: editando ? 'Salvar' : 'Lançar', pri:true, onClick: async () => {
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        // com baixa, os campos travados vão com o valor que o título TEM — o
        // banco recusa se alguém mudou o título por baixo
        const fornecedorId = travado ? t.fornecedor_id : v('tpForn');
        if (!fornecedorId){ toast('Selecione o fornecedor.', 'err'); return; }
        const grupoId = v('tpGrupo');
        if (!grupoId){ toast('Selecione a categoria.', 'err'); return; }
        const valor = travado ? Number(t.valor) : Number(v('tpValor'));
        if (!valor || valor <= 0){ toast('Informe um valor maior que zero.', 'err'); return; }
        const desc = v('tpDesc');
        if (!desc){ toast('A descrição é obrigatória.', 'err'); return; }
        // S48 · item 4: 3 letras ou números — na edição, só se mudou o texto
        if ((!editando || desc !== String(t.descricao || '').trim()) && !finDescOk(desc)){ toast(FIN_DESC_MSG, 'err'); return; }
        const comp = travado ? String(t.competencia).slice(0, 7) : v('tpComp');
        if (!comp){ toast('Informe a competência.', 'err'); return; }
        const venc = travado ? t.vencimento : v('tpVenc');
        if (!venc){ toast('Informe o vencimento.', 'err'); return; }
        const repetirEl = document.getElementById('tpRepetir');
        const repetir = !editando && repetirEl && repetirEl.checked;
        try{
          if (editando){
            const campos = {
              p_fornecedor_id: fornecedorId, p_grupo_id: grupoId, p_descricao: desc, p_valor: valor,
              p_competencia: comp + '-01', p_vencimento: venc,
              p_subcategoria_id: v('tpSub') || null, p_forma_prevista: v('tpForma') || null,
              p_os_codigo: v('tpOs') || null, p_nf_numero: (travado ? t.nf_numero : v('tpNf')) || null
            };
            const confEl = document.getElementById('tpConferido');
            if (confEl && confEl.checked) campos.p_valor_conferido = true;
            await rpc('tf_fin_titulo_pagar_editar', Object.assign({ p_titulo_id: t.id }, campos));
            fecharModal(); toast('Conta a pagar atualizada.', 'ok'); await finpgCarregar();
          } else if (repetir){
            const dia = Number(v('tpRecDia'));
            if (!dia || dia < 1 || dia > 31){ toast('Informe o dia do vencimento (1 a 31).', 'err'); return; }
            await rpc('tf_fin_recorrencia_gravar', {
              p_id: null, p_fornecedor_id: fornecedorId, p_grupo_id: grupoId,
              p_subcategoria_id: v('tpSub') || null, p_descricao: desc, p_valor: valor,
              p_variavel: !!(document.getElementById('tpRecVariavel') || {}).checked,
              p_dia_vencimento: dia, p_forma: v('tpForma') || null, p_inicio: null,
              // S47 · o que a pessoa digitou vira o 1º título (vencimento e
              // competência dela) e a recorrência começa no mês desse
              // vencimento. Até o S46 o vencimento era jogado fora e o 1º título
              // nascia no mês corrente — ou nem nascia, com competência futura.
              p_primeiro_vencimento: venc, p_primeira_competencia: comp + '-01'
            });
            fecharModal();
            toast('Conta recorrente criada — este lançamento é o 1º título (vence ' + dataBR(venc) + '); os próximos vencem todo dia ' + dia + '.', 'ok');
            await finpgCarregar();
          } else {
            const campos = {
              p_fornecedor_id: fornecedorId, p_grupo_id: grupoId, p_descricao: desc, p_valor: valor,
              p_competencia: comp + '-01', p_vencimento: venc,
              p_subcategoria_id: v('tpSub') || null, p_forma_prevista: v('tpForma') || null,
              p_os_codigo: v('tpOs') || null, p_nf_numero: v('tpNf') || null
            };
            await rpc('tf_fin_titulo_pagar_criar', campos);
            fecharModal(); toast('Conta a pagar lançada.', 'ok'); await finpgCarregar();
          }
        }catch(e){ toast(e.message, 'err'); }
     }}]);

  // Subcategoria depende da categoria escolhida — repopula ao trocar de grupo.
  const selGrupo = document.getElementById('tpGrupo');
  const selSub = document.getElementById('tpSub');
  const repopularSub = (grupoId, subSelecionada) => {
    const g = grupos.find(x => x.id === grupoId);
    const subs = (g && g.subcategorias) || [];
    selSub.innerHTML = '<option value="">—</option>' + subs.map(s =>
      '<option value="' + esc(s.id) + '"' + (s.id === subSelecionada ? ' selected' : '') + '>' + esc(s.nome) + '</option>').join('');
  };
  selGrupo.addEventListener('change', () => repopularSub(selGrupo.value, null));
  if (grupoAtualId) repopularSub(grupoAtualId, editando ? t.subcategoria_id : null);

  const repetirChk = document.getElementById('tpRepetir');
  if (repetirChk) repetirChk.addEventListener('change', () => {
    document.getElementById('tpRepetirCampos').style.display = repetirChk.checked ? '' : 'none';
    sugerirDiaRec();
  });

  // S46 · o dia da recorrência vem do Vencimento já digitado (29/10/2026 →
  // 29), em vez de nascer fixo em 5. Continua editável; depois que a pessoa
  // digita outro dia, a sugestão para de sobrescrever — o mesmo cuidado do
  // prazo de aviso dos documentos (S45).
  const vencEl = document.getElementById('tpVenc');
  const diaEl = document.getElementById('tpRecDia');
  let diaDigitado = false;
  function sugerirDiaRec(){
    if (!vencEl || !diaEl || diaDigitado) return;
    const m = /^\d{4}-\d{2}-(\d{2})$/.exec(vencEl.value || '');
    if (m) diaEl.value = String(Number(m[1]));
  }
  if (diaEl) diaEl.addEventListener('input', () => { diaDigitado = true; });
  if (vencEl && diaEl){
    vencEl.addEventListener('change', sugerirDiaRec);
    vencEl.addEventListener('input', sugerirDiaRec);
  }
  // S48 · mudar o valor de um "a confirmar" já é conferir
  const confEl = document.getElementById('tpConferido'), valEl = document.getElementById('tpValor');
  if (confEl && valEl) valEl.addEventListener('input', () => {
    if (Number(valEl.value) !== Number(t.valor)) confEl.checked = true; });
  if (editando) finHistLigar(t.id);
}

            p_juros_multa: v('bxJuros') ? Number(v('bxJuros')) : 0,
            p_envelope_id: envelopeId || null
          });
          fecharModal(); toast('Baixa registrada.', 'ok'); await recarregar();
        }catch(e){ toast(e.message, 'err'); }
     }}]);

  document.getElementById('bxConta').addEventListener('change', async () => {
    const contaId = document.getElementById('bxConta').value;
    const conta = contas.find(c => c.id === contaId);
    const campo = document.getElementById('bxEnvelopeCampo');
    if (!conta || conta.papel !== 'reserva'){ campo.style.display = 'none'; return; }

      catch(e){ toast('Não consegui carregar as reservas: ' + e.message, 'err'); envelopes = []; }

      sel.innerHTML = '<option value="">Selecione…</option>' + envelopes.map(en =>
        '<option value="' + esc(en.id) + '">' + esc(en.nome) + '</option>').join('');

  });

function modalEstornarBaixa(baixa, recarregar){

  catch(e){ toast('Não consegui carregar as categorias: ' + e.message, 'err'); return; }
  if (!grupos.length){ toast('Nenhuma categoria de despesa cadastrada — confira a tela Categorias.', 'err'); return; }

  let fornecedores = [];
  try{ fornecedores = await rpc('tf_fin_fornecedores_listar', {}); }catch(e){ /* segue vazio, aviso abaixo */ }

  const grupoAtualId = editando ? r.grupo_id : '';

  abrirModal(editando ? 'Editar recorrência — ' + (r.descricao || r.fornecedor_nome) : 'Nova recorrência',
      '<div class="campo"><label for="reForn">Fornecedor</label><select id="reForn">'

    +   fornecedores.map(f => '<option value="' + esc(f.id) + '"' + (editando && f.id === r.fornecedor_id ? ' selected' : '') + '>' + esc(f.nome) + '</option>').join('')
    + '</select>'
    + (fornecedores.length ? '' : '<p class="nota">Nenhum fornecedor cadastrado ainda — cadastre em Fornecedores.</p>')
    + '</div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="reGrupo">Categoria</label><select id="reGrupo">'
    +    '<option value="">Selecione…</option>'
    +    grupos.map(g => '<option value="' + esc(g.id) + '"' + (g.id === grupoAtualId ? ' selected' : '') + '>' + esc(g.nome) + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="reSub">Subcategoria (opcional)</label><select id="reSub"><option value="">—</option></select></div>'
    + '</div>'
    + '<div class="campo"><label for="reDesc">Descrição</label><input id="reDesc" type="text" value="' + (editando ? esc(r.descricao || '') : '') + '" autocomplete="off"></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="reValor">Valor</label><input id="reValor" type="number" step="0.01" value="' + (editando ? Number(r.valor) : 0) + '"></div>'
    +  '<div class="campo"><label for="reDia">Dia do vencimento (1 a 31)</label><input id="reDia" type="number" min="1" max="31" value="' + (editando ? r.dia_vencimento : 5) + '"></div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="reForma">Forma de pagamento (opcional)</label><select id="reForma">'
    +    '<option value="">—</option>'
    +    FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + (editando && r.forma === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="reInicio">Mês de início</label><input id="reInicio" type="month" value="' + (editando ? String(r.inicio).slice(0, 7) : '') + '"></div></div>'
    + '<div class="campo"><label style="display:flex;align-items:center;gap:6px;font-weight:normal">'
    +   '<input id="reVariavel" type="checkbox" style="width:auto"' + (editando && r.variavel ? ' checked' : '') + '> O valor muda todo mês (ex.: energia elétrica)</label>'
    +   '<p class="nota" style="margin:2px 0 0">Marcado, o Valor acima vale como estimativa (a média do mês): cada título nasce com ele e marcado “(valor a confirmar)”, e você acerta o valor real no próprio título.</p></div>'
    + (editando ? '' : '<p class="nota">Se o mês de início já começou, o título deste mês é lançado automaticamente ao salvar.</p>'),
    [{ label:'Cancelar', onClick: fecharModal },
     { label: editando ? 'Salvar' : 'Criar', pri:true, onClick: async () => {
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const fornecedorId = v('reForn');
        if (!fornecedorId){ toast('Selecione o fornecedor.', 'err'); return; }
        const grupoId = v('reGrupo');
        if (!grupoId){ toast('Selecione a categoria.', 'err'); return; }
        // S48 · item 4: cada título herda esta descrição, todo mês — "."
        // não serve. Na edição, só se a pessoa mexeu no texto.
        const descRec = v('reDesc');
        if ((!editando || descRec !== String(r.descricao || '').trim()) && !finDescOk(descRec)){ toast(FIN_DESC_MSG, 'err'); return; }
        const dia = Number(v('reDia'));
        if (!dia || dia < 1 || dia > 31){ toast('Informe o dia do vencimento (1 a 31).', 'err'); return; }
        const inicio = v('reInicio');
        if (!inicio){ toast('Informe o mês de início.', 'err'); return; }
        const campos = {
          p_id: editando ? r.id : null,
          p_fornecedor_id: fornecedorId, p_grupo_id: grupoId, p_subcategoria_id: v('reSub') || null,
          p_descricao: descRec || null, p_valor: Number(v('reValor')) || 0,
          p_variavel: !!(document.getElementById('reVariavel') || {}).checked,
          p_dia_vencimento: dia, p_forma: v('reForma') || null,
          p_inicio: inicio + '-01'
        };
        try{
          await rpc('tf_fin_recorrencia_gravar', campos);
          fecharModal();
          toast(editando ? 'Recorrência atualizada.' : 'Recorrência criada — se já começou, o título deste mês já foi lançado.', 'ok');
          await finrecCarregar();
        }catch(e){ toast(e.message, 'err'); }
     }}]);

  // Subcategoria depende da categoria escolhida — repopula ao trocar de grupo.
  const selGrupo = document.getElementById('reGrupo');
  const selSub = document.getElementById('reSub');
  const repopularSub = (grupoId, subSelecionada) => {
    const g = grupos.find(x => x.id === grupoId);
    const subs = (g && g.subcategorias) || [];
    selSub.innerHTML = '<option value="">—</option>' + subs.map(s =>
      '<option value="' + esc(s.id) + '"' + (s.id === subSelecionada ? ' selected' : '') + '>' + esc(s.nome) + '</option>').join('');
  };
  selGrupo.addEventListener('change', () => repopularSub(selGrupo.value, null));
  if (grupoAtualId) repopularSub(grupoAtualId, editando ? r.subcategoria_id : null);
}

let _pdfjs = null;

function carregarPdfJs(){
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((ok, err) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); }
      catch(e){ err(new Error('A leitura de PDF não inicializou.')); } };
    s.onerror = () => { _pdfjs = null; err(new Error('Não consegui baixar o leitor de PDF. Sem internet? Envie uma FOTO do termo.')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}

async function iniciar(){
  await carregarCC();
  await carregarFin();
  montarNav();
  pintarCracha();
  await carregarParametros();
  await carregarEquipe();
  // o hub (ou um link) abre uma tela daqui com `?ir=`
  try{
    const prm = new URLSearchParams(location.search);
    const ir = prm.get('ir');
    if (ir){
      if (NAV.some(g => (g.itens || []).some(i => i.v === ir && !i.link))) visao = ir;
      history.replaceState(null, '', location.pathname);
    }
    // F11 · o card da T16 abre fin/?os=<id>(&t=T16): Contas a Receber com o painel da OS
    if (prm.get('os')){
      if (osDaEntrada(prm)) visao = 'finre';
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
  if (!conectado && !DEMO) setConn('ok', 'Conectado');
  if (DEMO) setConn('', 'Demonstração');
  irPara(visao);
  contarCartoes().catch(() => {});
}
