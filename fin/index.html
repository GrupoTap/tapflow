const finOrdValor = o => o && o.col ? o.col + ':' + o.dir : '';

function finOrdOpcoes(cfg){
  const ops = cfg.ordPadrao.col ? [] : [['', cfg.ordPadraoRot || 'Padrão']];
  cfg.colunas.filter(c => c.ord).forEach(c => {
    const [a, z] = c.tipo === 'txt' ? ['A–Z', 'Z–A'] : c.tipo === 'num' || c.tipo === 'int' ? ['▲ menor', '▼ maior'] : ['▲ mais antigo', '▼ mais distante'];
    ops.push([c.k + ':1', c.rot + ' ' + a], [c.k + ':-1', c.rot + ' ' + z]);
  });
  return ops;
}

function finLigar(tela){
  const cfg = FIN_CFG[tela], st = FINF[tela];
  const $ = s => document.getElementById(tela + s);
  const mudou = () => finDesenhar(tela);
  $('Sit').addEventListener('change', e => { st.sit = e.target.value; mudou(); });
  $('Grupo').addEventListener('change', e => { st.grupo = e.target.value; mudou(); });
  $('Pessoa').addEventListener('change', e => { st.pessoa = e.target.value; mudou(); });
  if ($('Tipo')) $('Tipo').addEventListener('change', e => { st.tipo = e.target.value; mudou(); });
  if ($('Hist')) $('Hist').addEventListener('change', e => { st.hist = e.target.value; mudou(); });
  $('Ord').addEventListener('change', e => {
    const [c, d] = String(e.target.value).split(':');
    st.ord = c ? { col: c, dir: Number(d) || 1 } : Object.assign({}, cfg.ordPadrao);
    mudou();
  });
  if ($('Per')) $('Per').addEventListener('click', () => finPeriodoAbrir({
    campos: cfg.campos, per: st.per, aplicar: per => { st.per = per; mudou(); } }));
  $('FiltrosBtn').addEventListener('click', () => {
    st.aberto = !st.aberto;
    $('Barra').classList.toggle('aberta', st.aberto);
    $('FiltrosBtn').setAttribute('aria-expanded', String(st.aberto));
  });
  $('Tags').addEventListener('click', e => {
    const b = e.target.closest('[data-tira]'); if (!b) return;
    const k = b.dataset.tira;
    if ((k === 'os' || k === 'tudo') && tela === 'finre' && FINOS.id){ osSair(); if (k === 'os') return; }
    if (k === 'tudo') finLimpar(tela);
    else if (k === 'busca'){ BUSCA[tela] = ''; const tb = document.getElementById('tbBusca'); if (tb) tb.value = ''; }
    else if (k === 'per') st.per = null;
    else st[k] = '';
    if (k === 'sit') st.sit = 'todas';
    mudou();
  });
  const el = document.getElementById(cfg.elId);
  el.addEventListener('click', e => {
    const o = e.target.closest('[data-col]');
    if (o){
      const c = o.dataset.col;
      st.ord = (st.ord.col === c) ? { col: c, dir: -st.ord.dir } : { col: c, dir: 1 };
      return mudou();
    }
    if (e.target.closest('[data-limpar]')){ finLimpar(tela); return mudou(); }
    const m = e.target.closest('.finMais');
    if (m){
      if (_finMenu && _finMenu._botao === m){ finMenuFechar(false); return; }
      const t = (cfg.lista() || []).find(x => String(x.id) === m.dataset.id);
      if (t) finMenuAbrir(m, cfg.menu(t), it => cfg.acao(it.acao, t));
      return;
    }
    const a = e.target.closest('[data-acao]');
    if (a){
      const t = (cfg.lista() || []).find(x => String(x.id) === a.dataset.id);
      if (t) cfg.acao(a.dataset.acao, t);
    }
  });
  el.addEventListener('scroll', () => finMenuFechar(false), { passive:true });
}

function finLimpar(tela){
  const st = FINF[tela];
  st.sit = 'todas'; st.per = null; st.grupo = ''; st.pessoa = ''; st.tipo = ''; st.hist = '';
  BUSCA[tela] = '';
  const tb = document.getElementById('tbBusca'); if (tb) tb.value = '';
}

function finOpcoes(tela){
  const cfg = FIN_CFG[tela], st = FINF[tela];
  const L = cfg.lista() || [];
  const grupos = new Map();
  L.forEach(t => {
    if (!t.grupo_id && !t.subcategoria_id) return;
    const g = grupos.get(t.grupo_id) || { nome: t.grupo_nome || '—', subs: new Map() };
    if (t.subcategoria_id) g.subs.set(t.subcategoria_id, t.subcategoria_nome || '—');
    grupos.set(t.grupo_id, g);
  });
  const opsG = [['', 'Todas']];
  [...grupos.entries()].sort((a, b) => FIN_COL.compare(a[1].nome, b[1].nome)).forEach(([gid, g]) => {
    opsG.push(['g:' + gid, g.nome]);
    [...g.subs.entries()].sort((a, b) => FIN_COL.compare(a[1], b[1])).forEach(([sid, sn]) => opsG.push(['s:' + sid, '   ' + g.nome + ' / ' + sn]));
  });
  const pessoas = new Map();
  L.forEach(t => { if (t[cfg.pessoaK]) pessoas.set(t[cfg.pessoaK], t[cfg.pessoaNome] || '—'); });
  const opsP = [['', 'Todos']].concat([...pessoas.entries()].sort((a, b) => FIN_COL.compare(a[1], b[1])));
  // um filtro que aponta para quem sumiu da lista deixa de valer
  if (st.grupo && !opsG.some(o => o[0] === st.grupo)) st.grupo = '';
  if (st.pessoa && !opsP.some(o => o[0] === st.pessoa)) st.pessoa = '';
  const pinta = (id, ops, v) => {
    const s = document.getElementById(id); if (!s) return;
    s.innerHTML = ops.map(([k, r]) => '<option value="' + esc(k) + '">' + esc(r) + '</option>').join('');
    s.value = v;
  };
  pinta(tela + 'Grupo', opsG, st.grupo);
  pinta(tela + 'Pessoa', opsP, st.pessoa);
}

function finCasaBase(cfg, st, t, q){
  if (cfg === FIN_CFG.finre && FINOS.id && FINOS.ids && !FINOS.ids.includes(t.id)) return false;   // F11 · só as contas da OS
  if (cfg.hist && !finHistCasa(t, st.hist)) return false;
  if (q && !casa(cfg.busca(t), q)) return false;
  if (st.per){
    const v = st.per.campo === 'comp' ? String(t.competencia || '').slice(0, 7)
            : st.per.campo === 'nf'   ? String(t.nf_data || '').slice(0, 10)
            : String(t.vencimento || '').slice(0, 10);
    if (!v || v < st.per.de || v > st.per.ate) return false;
  }
  if (st.grupo){
    const [k, id] = st.grupo.split(':');
    if (k === 'g' && String(t.grupo_id) !== id) return false;
    if (k === 's' && String(t.subcategoria_id) !== id) return false;
  }
  if (st.pessoa && String(t[cfg.pessoaK]) !== st.pessoa) return false;
  if (st.tipo === 'fixo' && t.variavel) return false;
  if (st.tipo === 'variavel' && !t.variavel) return false;
  return true;
}

const finHistCasa = (t, h) => h === 'so' ? t.origem === 'sige' : (h === 'com' || t.origem !== 'sige');

function finOrdenar(cfg, L, ord){
  if (!ord || !ord.col) return L.slice();
  const pos = new Map(L.map((t, i) => [t, i]));
  const cmpCol = (c, a, b) => {
    const va = c.val(a), vb = c.val(b);
    if (c.tipo === 'num' || c.tipo === 'int') return (Number(va) || 0) - (Number(vb) || 0);
    if (c.tipo === 'data') return String(va || '') < String(vb || '') ? -1 : String(va || '') > String(vb || '') ? 1 : 0;
    return FIN_COL.compare(String(va || ''), String(vb || ''));
  };
  const col = cfg.colunas.find(c => c.k === ord.col);
  const desempate = cfg.desempate.map(k => cfg.colunas.find(c => c.k === k)).filter(Boolean);
  return L.slice().sort((a, b) => {
    const r = col ? cmpCol(col, a, b) * ord.dir : 0;
    if (r) return r;
    // empate: vencimento e depois o nome, sempre no mesmo sentido — a lista
    // não "pula" de lugar a cada clique
    for (const c of desempate){ const x = cmpCol(c, a, b); if (x) return x; }
    return pos.get(a) - pos.get(b);
  });
}

function finTotais(L){
  const vivos = L.filter(t => !t.anulado);
  return {
    n: L.length, anul: L.length - vivos.length,
    valor: vivos.reduce((s, t) => s + (Number(t.valor) || 0), 0),
    aberto: vivos.reduce((s, t) => s + Math.max(0, Number(t.saldo) || 0), 0)
  };
}

const finPlural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);

function finDesenhar(tela){
  const cfg = FIN_CFG[tela], st = FINF[tela];
  const el = document.getElementById(cfg.elId); if (!el || !st) return;
  const T = cfg.lista();
  if (!T) return;
  finMenuFechar(false);
  const hoje = isoHoje();
  const q = BUSCA[tela] || '';
  const base = T.filter(t => finCasaBase(cfg, st, t, q));
  const L = base.filter(t => finSitCasa(t, st.sit, hoje));

  // "Anuladas (N)" conta as anuladas que casam com os OUTROS filtros (S46)
  const nAnul = base.filter(t => t.anulado).length;
  const optA = document.querySelector('#' + tela + 'Sit option[value="anuladas"]');
  if (optA) optA.textContent = 'Anuladas (' + nAnul + ')';
  const perBtn = document.getElementById(tela + 'Per');
  if (perBtn) perBtn.textContent = (st.per ? finPerTexto(st.per, cfg.campos).replace(/^[^:]+: /, '') : 'Todos') + ' ▾';
  const ordSel = document.getElementById(tela + 'Ord'); if (ordSel) ordSel.value = finOrdValor(st.ord);
  const sitSel = document.getElementById(tela + 'Sit'); if (sitSel) sitSel.value = st.sit;
  const histSel = document.getElementById(tela + 'Hist'); if (histSel) histSel.value = st.hist;

  // etiquetas: ninguém pode achar que a lista está vazia por um filtro esquecido
  const tags = [];
  const rotSel = (id) => { const s = document.getElementById(id); return s && s.selectedIndex >= 0 ? s.options[s.selectedIndex].textContent.trim() : ''; };
  if (tela === 'finre' && FINOS.id) tags.push(['os', 'OS: ' + osRot()]);
  if (q) tags.push(['busca', 'Busca: “' + q + '”']);
  if (st.sit !== 'todas') tags.push(['sit', 'Situação: ' + rotSel(tela + 'Sit').replace(/\s*\(\d+\)$/, '')]);
  if (st.per) tags.push(['per', finPerTexto(st.per, cfg.campos)]);
  if (st.tipo) tags.push(['tipo', 'Valor: ' + rotSel(tela + 'Tipo')]);
  if (st.hist) tags.push(['hist', st.hist === 'so' ? 'Só o histórico do SIGE' : 'Com o histórico do SIGE']);
  if (st.grupo) tags.push(['grupo', 'Categoria: ' + rotSel(tela + 'Grupo')]);
  if (st.pessoa) tags.push(['pessoa', cfg.pessoaRot + ': ' + rotSel(tela + 'Pessoa')]);
  const tagsEl = document.getElementById(tela + 'Tags');
  tagsEl.innerHTML = tags.map(([k, txt]) => '<span class="tfChip">' + esc(txt)
      + '<button type="button" data-tira="' + k + '" aria-label="Tirar este filtro">×</button></span>').join('')
    + (tags.length ? '<button type="button" class="tfLimpa" data-tira="tudo">Limpar filtros</button>' : '');
  tagsEl.classList.toggle('on', tags.length > 0);
  const fb = document.getElementById(tela + 'FiltrosBtn');
  if (fb) fb.textContent = 'Filtros' + (tags.filter(t => t[0] !== 'busca').length ? ' (' + tags.filter(t => t[0] !== 'busca').length + ')' : '') + (st.aberto ? ' ▴' : ' ▾');

  // S59: só conta o histórico que apareceria com os OUTROS filtros (em "Em aberto",
  // o histórico, todo pago, não apareceria — e o aviso confundiria)
  const nHist = cfg.hist && !st.hist ? T.filter(t => t.origem === 'sige' && finCasaBase(cfg, Object.assign({}, st, { hist: 'so' }), t, q) && finSitCasa(t, st.sit, hoje)).length : 0;
  document.getElementById(tela + 'Resumo').innerHTML = cfg.resumo(L, st)
    + (nHist ? ' <span class="finHistNota">· ' + finPlural(nHist, 'título', 'títulos') + ' do histórico do SIGE (fev a set/2026) fora da lista — <button type="button" id="' + tela + 'HistVer">mostrar</button></span>' : '');
  const hv = document.getElementById(tela + 'HistVer');
  if (hv) hv.addEventListener('click', () => { st.hist = 'com'; finDesenhar(tela); });

  if (!L.length){
    el.innerHTML = '<div class="vazio2">' + (T.length
      ? '<b>Nada com esses filtros</b><p>' + (st.sit === 'todas' && nAnul && base.length === nAnul
          ? 'Só há ' + finPlural(nAnul, 'anulada', 'anuladas') + ' — escolha “Anuladas” em Situação para ver. '
          : finPlural(T.length, cfg.unidade[0], cfg.unidade[1]) + ' ficaram de fora por causa dos filtros. ')
        + '<button type="button" class="tfLimpa" data-limpar="1">Limpar filtros</button></p>'
      : '<b>' + esc(cfg.vazio) + '</b><p>Use o botão acima para lançar.</p>') + '</div>';
    return;
  }

  const O = finOrdenar(cfg, L, st.ord);
  const cab = '<div class="ccLin fin6 cab finCab">' + cfg.colunas.map(c => {
      if (!c.ord) return '<span' + (c.n ? ' class="n"' : '') + '>' + esc(c.rot || '') + '</span>';
      const ativo = st.ord.col === c.k;
      const seta = ativo ? (st.ord.dir > 0 ? '▲' : '▼') : '';
      return '<span' + (c.n ? ' class="n"' : '') + ' aria-sort="' + (ativo ? (st.ord.dir > 0 ? 'ascending' : 'descending') : 'none') + '">'
        + '<button type="button" class="finOrd' + (ativo ? ' on' : '') + '" data-col="' + c.k + '" title="Ordenar por ' + esc(c.rot.toLowerCase()) + '">'
        + esc(c.rot) + '<i aria-hidden="true">' + seta + '</i></button></span>';
    }).join('') + '</div>';

  // grupos por mês: só enquanto a ordem é por vencimento (item 3, ponto 5)
  const agrupa = cfg.agrupa && st.ord.col === 'venc';
  let h = '', mesAtual = null, i = 0;
  const grupos = agrupa ? (() => {
    const m = new Map();
    O.forEach(t => { const k = String(t.vencimento).slice(0, 7); (m.get(k) || m.set(k, []).get(k)).push(t); });
    return m;
  })() : null;
  O.forEach(t => {
    if (agrupa){
      const k = String(t.vencimento).slice(0, 7);
      if (k !== mesAtual){
        mesAtual = k; i = 0;
        const tt = finTotais(grupos.get(k));
        h += '<div class="finMes"><b>' + esc(FIN_MESES_LONGO[Number(k.slice(5, 7)) - 1] + '/' + k.slice(0, 4)) + '</b>'
          + '<span>' + (st.sit === 'anuladas'
              ? finPlural(tt.n, 'anulado', 'anulados')
              : finPlural(tt.n - tt.anul, cfg.unidade[0], cfg.unidade[1]) + ' · valor ' + esc(BRL(tt.valor)) + ' · em aberto ' + esc(BRL(tt.aberto))
                + (tt.anul ? ' · ' + finPlural(tt.anul, 'anulado', 'anulados') : ''))
          + '</span></div>';
      }
    }
    h += cfg.linha(t, hoje, (i++ % 2) ? ' par' : '');
  });
  el.innerHTML = cab + h;
  // o título do mês gruda logo abaixo do cabeçalho das colunas
  const c = el.querySelector('.finCab');
  el.style.setProperty('--cabH', (c && c.offsetHeight ? c.offsetHeight : 0) + 'px');
  finAjustarAltura(el);
}

function finAjustarAltura(el){
  if (!el || window.innerWidth <= 700){ if (el) el.style.maxHeight = ''; return; }
  // topo da lista na PÁGINA (não na janela), menos o pé da .tela (34) e do <main> (16)
  const topo = el.getBoundingClientRect().top + (window.scrollY || 0);
  el.style.maxHeight = Math.max(240, Math.floor(window.innerHeight - topo - 52)) + 'px';
}

window.addEventListener('resize', () => {
  ['finpgLista', 'finreLista', 'finrecLista'].forEach(id => finAjustarAltura(document.getElementById(id)));
});

function finAcoesHtml(t, pri, rotulo){
  return '<span class="a">'
    + (pri ? '<button class="btn finPri" type="button" data-acao="' + pri.acao + '" data-id="' + esc(t.id) + '">' + esc(pri.rot) + '</button>' : '')
    + '<button class="btn finMais" type="button" aria-haspopup="menu" aria-expanded="false" data-id="' + esc(t.id) + '"'
    + ' aria-label="Mais ações — ' + esc(rotulo) + '" title="Mais ações">⋯</button></span>';
}

let _finMenu = null;

function finMenuFechar(devolverFoco){
  if (!_finMenu) return;
  const b = _finMenu._botao;
  _finMenu.remove(); _finMenu = null;
  if (b){ b.setAttribute('aria-expanded', 'false'); if (devolverFoco) try{ b.focus(); }catch(e){} }
}

function finMenuAbrir(botao, itens, escolher){
  finMenuFechar(false);
  if (!itens.length) return;
  const m = document.createElement('div');
  m.className = 'finMenu'; m.setAttribute('role', 'menu');
  // F5: {sep:true} desenha um traço; {off:'motivo'} é item travado (fica à vista, explica e não executa)
  m.innerHTML = itens.map((it, i) => it.sep ? '<hr role="separator">'
    : '<button type="button" role="menuitem" tabindex="-1" data-i="' + i + '"'
      + ' class="' + [it.perigo ? 'perigo' : '', it.off ? 'off' : '', it.cls || ''].filter(Boolean).join(' ') + '"'
      + (it.off ? ' aria-disabled="true" title="' + esc(it.off) + '"' : '') + '>' + esc(it.rot)
      + (it.off ? '<small>' + esc(it.off) + '</small>' : '') + '</button>').join('');
  document.body.appendChild(m);
  _finMenu = m; m._botao = botao;
  botao.setAttribute('aria-expanded', 'true');
  const r = botao.getBoundingClientRect();
  const larg = m.offsetWidth, alt = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - larg, window.innerWidth - larg - 8)) + 'px';
  let topo = r.bottom + 4;
  if (topo + alt > window.innerHeight - 8) topo = Math.max(8, r.top - alt - 4);
  m.style.top = topo + 'px';
  const bts = [...m.querySelectorAll('[role=menuitem]')];
  bts[0].focus();
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const it = itens[Number(b.dataset.i)];
    finMenuFechar(false);
    if (it.off){ toast(it.off, 'err'); return; }
    escolher(it);
  });
  m.addEventListener('keydown', e => {
    const i = bts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); bts[(i + 1) % bts.length].focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); bts[(i - 1 + bts.length) % bts.length].focus(); }
    else if (e.key === 'Home'){ e.preventDefault(); bts[0].focus(); }
    else if (e.key === 'End'){ e.preventDefault(); bts[bts.length - 1].focus(); }
    else if (e.key === 'Tab'){ finMenuFechar(false); }
  });
}

function finrePrimaria(t){
  const n = nfDe(t);   // TapFin 3: nota em andamento pede "Atualizar"; a faturar, "Emitir nota"
  if (n && (n.situacao === 'emitindo' || n.situacao === 'cancelando')) return { acao:'nfatualizar', rot:'Atualizar nota' };
  if (jfTemNota(t)) return { acao:'jafaturada', rot:'Já tem nota' };   // TapFin 7: a nota foi emitida fora
  const bo = boDe(t);   // boleto: emitindo pede "Atualizar"; faturado, com saldo, previsto em boleto e sem boleto valendo: "Emitir boleto"
  if (bo && bo.situacao === 'emitindo') return { acao:'boatualizar', rot:'Atualizar boleto' };
  if (t.etapa === 'a_faturar') return FINNF.ativo ? { acao:'emitir', rot:'Emitir nota' } : { acao:'faturar', rot:'Preparar nota' };
  if (FINBO.ativo && Number(t.saldo) >= 2.5 && !boVivo(t) && t.forma_prevista === 'Boleto') return { acao:'boemitir', rot:'Emitir boleto' };
  if (Number(t.saldo) > 0) return { acao:'baixar', rot:'Baixar' };
  return { acao:'baixas', rot:'Baixas' };
}

function finreMenu(t){
  const p = finrePrimaria(t).acao;
  const n = nfDe(t), viva = nfViva(t), bo = boDe(t), bv = boVivo(t);
  const M = [];
  // o boleto valendo se cancela pelo topo do menu, em vermelho (só com o clique: o TapFin nunca cancela sozinho)
  if (bv && bo.codigo) M.push({ acao:'bocancelar', rot:'Cancelar boleto', perigo:true, cls:'topo' }, { sep:true });
  // F5: a nota emitida se cancela pelo topo do menu, em vermelho, longe do "Anular"
  if (n && n.situacao === 'autorizada') M.push({ acao:'nfcancelar', rot:'Cancelar nota fiscal', perigo:true, cls:'topo' }, { sep:true });
  M.push({ acao:'editar', rot:'Editar' });
  if (p !== 'baixar' && Number(t.saldo) > 0) M.push({ acao:'baixar', rot:'Baixar' });
  if (p !== 'baixas') M.push({ acao:'baixas', rot:'Baixas' });
  if (FINJF.ativo && !t.anulado){   // TapFin 7
    if (t.etapa === 'a_faturar' && p !== 'jafaturada') M.push({ acao:'jafaturada', rot:'Já tem nota: marcar como faturada' });
    if (p === 'jafaturada') M.push(FINNF.ativo ? { acao:'emitir', rot:'Emitir nota (nova)' } : { acao:'faturar', rot:'Preparar nota' });
    if (FINJF.marcados.has(t.id)) M.push({ acao:'jadesfazer', rot:'Desfazer: voltar para A faturar' });
  }
  if (FINNF.ativo){
    if (t.etapa === 'a_faturar' && p !== 'faturar') M.push({ acao:'faturar', rot:'Preparar nota (manual, no portal)' });
    M.push({ acao:'pedido', rot:'Pedido de compra' });
    if (n) M.push({ acao:'notas', rot:'Notas fiscais' });
  }
  if (FINBO.ativo){
    if (p !== 'boemitir' && !bv && Number(t.saldo) >= 2.5) M.push({ acao:'boemitir', rot:'Emitir boleto' });
    if (bv && bo.linha_digitavel) M.push({ acao:'bolinha', rot:'Copiar linha digitável' }, { acao:'bopix', rot:'Copiar Pix copia-e-cola' });
    if (bo) M.push({ acao:'boletos', rot:'Boletos' });
  }
  M.push({ sep:true });
  // F5: título com nota viva não se anula (o banco também recusa: 505)
  M.push(viva ? { acao:'anular', rot:'Anular', off:'Cancele a nota primeiro' }
       : bv ? { acao:'anular', rot:'Anular', off:'Cancele o boleto primeiro' } : { acao:'anular', rot:'Anular', perigo:true });
  return M;
}

function finreAcao(a, t){
  if (a === 'jafaturada') return modalJaFaturada(t);
  if (a === 'jadesfazer') return jfDesfazer(t);
  if (a === 'emitir') return modalEmitirNota(t);
  if (a === 'notas') return modalNotasTitulo(t);
  if (a === 'nfcancelar'){ const n = nfDe(t); if (n && n.situacao === 'autorizada') return modalCancelarNota(t, n); return; }
  if (a === 'pedido') return modalPedidoCompra(t);
  if (a === 'nfatualizar'){ const n = nfDe(t); if (n) return nfExecutar(() => nfFuncao({ acao: 'consultar', titulo_id: t.id, nfse_id: n.id }), 'consultar', 'Consultando a nota…'); return; }
  if (a === 'faturar') return modalPrepararNota(t);
  if (a === 'boemitir') return modalEmitirBoleto(t);
  if (a === 'boletos') return modalBoletosTitulo(t);
  if (a === 'bocancelar'){ const b = boDe(t); if (b) return modalCancelarBoleto(t, b); return; }
  if (a === 'boatualizar'){ const b = boDe(t); if (b) return boExecutar(() => boFuncao({ acao: 'consultar', boleto_id: b.id }), 'Consultando o boleto no Inter…', boResultado); return; }
  if (a === 'bolinha'){ const b = boDe(t); if (b) copiar(b.linha_digitavel, 'Linha digitável copiada.'); return; }
  if (a === 'bopix'){ const b = boDe(t); if (b) copiar(b.pix_copia_cola, 'Pix copia-e-cola copiado.'); return; }
  if (a === 'baixar'){ if (boVivo(t)) return boAntesDaBaixa(t).then(ok => ok && modalBaixarTitulo(t, finreCarregar)); return modalBaixarTitulo(t, finreCarregar); }
  if (a === 'baixas') return modalVerBaixas(t, finreCarregar);
  if (a === 'anular') return modalAnularTitulo(t);
  if (a === 'editar') return modalTituloReceber(t);
}

        + '<button class="btn pri mini" type="button" data-medlancar="' + esc(m.medicao_id) + '">Lançar título</button></li>').join('')
    + '</ul></div>';
  el.querySelectorAll('[data-medlancar]').forEach(b => b.addEventListener('click', () => modalLancarMedicao(b.dataset.medlancar)));
}

/** Na linha do título: o chip "Medição" e o PDF do boletim. */
function medChip(t){
  if (!t || !t.medicao_id) return '';
  return ' <span class="chip" title="Título da medição (OS de contrato)">Medição</span>'
    + (medPdfOk(t.medicao_pdf) ? ' <a href="' + esc(t.medicao_pdf) + '" target="_blank" rel="noopener" style="font-size:11px;white-space:nowrap">Medição (PDF)</a>' : '');
}

/** "Lançar título" de uma medição: o formulário preenchido (o banco confere tudo de novo). */
async function modalLancarMedicao(medicaoId, rasc){
  if (rasc instanceof Event) rasc = null;
  let v;
  try{ v = await rpc('tf_fin_medicao_ver', { p_medicao_id: medicaoId }); }
  catch(e){ toast(e.message, 'err'); return; }
  const s = v.sugestao || {};
  const d = Object.assign({ desc: s.descricao || '', comp: String(s.competencia || isoHoje()).slice(0, 7), venc: s.vencimento || isoHoje(), forma: '',
    uid: (crypto.randomUUID && crypto.randomUUID()) || ('med-' + Date.now() + '-' + Math.random().toString(16).slice(2)) }, rasc || {});
  const itens = v.itens_juntos || [];
  const tab = itens.length
    ? '<div class="fpmRolar" style="max-height:170px;overflow:auto"><table class="fpmTabela" style="font-size:12px"><tr><th>Código</th><th>Item</th><th>Qtd</th><th>Valor</th></tr>'
      + itens.map(i => '<tr><td>' + esc(i.codigo) + '</td><td style="white-space:normal">' + esc(i.descricao || '—') + '</td><td>'
          + esc(String(i.quantidade).replace('.', ',')) + (i.unidade ? ' ' + esc(i.unidade) : '') + '</td><td>' + esc(BRL(Number(i.valor) || 0)) + '</td></tr>').join('')
      + '</table></div><p class="nota" style="margin:2px 0 8px">' + (itens.length === 1 ? '1 item' : itens.length + ' itens') + ', juntados por código (é assim que saem na nota).</p>'
    : '<p class="nota">A medição não trouxe itens.</p>';
  const pronta = !!v.pronta && !v.titulo;
  abrirModal('Lançar título — ' + (v.os_numero || 'medição'),
      (v.titulo ? '<div class="nfAvisos" style="padding:8px 10px;margin-bottom:10px">Esta medição já tem título no TapFin: “' + esc(v.titulo.descricao || '') + '”.</div>' : '')
    + (!v.pronta ? '<div class="nfErros" style="padding:8px 10px;margin-bottom:10px">A medição ainda não está pronta para faturar: ela precisa estar fechada e com a K03 (boletim aprovado e pedido do cliente) concluída.</div>' : '')
    + '<div class="dupla">'
    +  '<div class="campo"><label>Cliente (da OS)</label><input type="text" value="' + esc(v.cliente || '—') + '" disabled></div>'
    +  '<div class="campo"><label>OS</label><input type="text" value="' + esc(v.os_numero || '—') + '" disabled></div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label>Valor (da medição)</label><input id="medValor" type="text" value="' + esc(BRL(Number(v.valor) || 0)) + '" disabled></div>'
    +  '<div class="campo"><label>Pedido/Contrato do cliente (K03)</label><input type="text" value="' + esc(s.pedido || (v.usa_pedido === false ? 'o cliente não usa pedido' : '—')) + '" disabled></div></div>'
    + tab
    + (medPdfOk(v.pdf) ? '<p class="nota" style="margin:0 0 8px"><a href="' + esc(v.pdf) + '" target="_blank" rel="noopener">Abrir o PDF da medição</a> (o boletim que foi ao cliente).</p>' : '')
    + '<div class="campo"><label for="medDesc">Descrição</label><input id="medDesc" type="text" maxlength="300" value="' + esc(d.desc) + '" autocomplete="off"></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="medComp">Competência (mês do serviço)</label><input id="medComp" type="month" value="' + esc(d.comp) + '"></div>'
    +  '<div class="campo"><label for="medVenc">Vencimento (estimativa)</label><input id="medVenc" type="date" value="' + esc(d.venc) + '"></div></div>'
    + '<div class="campo"><label for="medForma">Forma prevista (opcional)</label><select id="medForma"><option value="">—</option>'
    +   FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + (d.forma === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('') + '</select></div>'
    + '<p class="nota">O título nasce “A faturar”, ligado à ' + esc(v.os_numero || 'OS') + ' e à medição. Depois, na linha dele: “Emitir nota” e “Emitir boleto”. '
    + 'O pedido corrigido na K03 depois de lançar não muda o título: edite-o no “Emitir nota”.</p>',
    pronta
      ? [{ label: 'Cancelar', onClick: fecharModal },
         { label: 'Lançar título', pri: true, onClick: async () => {
            const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
            const r = { desc: val('medDesc'), comp: val('medComp'), venc: val('medVenc'), forma: val('medForma'), uid: d.uid };
            if (!r.desc){ toast('A descrição é obrigatória.', 'err'); return; }
            if (!r.comp || !r.venc){ toast('Informe a competência e o vencimento.', 'err'); return; }
            const b = [...document.querySelectorAll('#mFoot .btn')].pop(); if (b) b.disabled = true;
            try{
              await rpc('tf_fin_medicao_criar_conta', { p_medicao_id: medicaoId, p_descricao: r.desc, p_competencia: r.comp + '-01',
                p_vencimento: r.venc, p_forma_prevista: r.forma || null, p_subcategoria_id: null, p_client_uid: r.uid });
              fecharModal();
              toast('Título lançado para a ' + (v.os_numero || 'OS') + '.', 'ok');
              await finreCarregar();
            }catch(e){
              toast(e.message, 'err');
              modalLancarMedicao(medicaoId, r);   // volta com o que foi escrito (a mesma chave: não grava em dobro)
            }
         }}]
      : [{ label: 'Fechar', pri: true, onClick: fecharModal }]);
}

/** O painel da OS de contrato: o que dizer. */
function medMsgOs(v){
  const c = v.contrato || {}, val = c.valor || {};
  if (c.medicao && c.tem_titulo) return 'O título da medição já foi lançado: confira abaixo e use “Emitir nota” e “Emitir boleto” na linha.';
  if (c.medicao) return 'A medição está fechada e com a K03 concluída: lance o título da medição.';
  if (val.tipo === 'fechada') return 'A medição está fechada, mas a K03 (boletim aprovado e pedido do cliente) ainda não foi concluída no TapFlow.';
  if (val.tipo === 'estimada') return 'A medição ainda não foi fechada (estimativa: ' + BRL(Number(val.valor) || 0) + '). O título sai dela depois da K03.';
  return 'OS de contrato: o título sai da medição, depois que ela for fechada e a K03 concluída no TapFlow.';
}

/** O texto da nota acompanha o pedido digitado (só a parte "Pedido/Contrato: …"). */
function medInfoComPedido(txt, p){
  const partes = String(txt || '').split(' // ').filter(x => !/^Pedido\/Contrato: /.test(x));
  if (p) partes.splice(Math.min(1, partes.length), 0, 'Pedido/Contrato: ' + p);
  return partes.join(' // ');
}

/** A dica embaixo das informações complementares do título da medição. */
function medNotaInfo(t, info){
  const resumo = /conforme medição anexa/.test(info || '');
  return '<small class="nota">Montado com a medição: o contrato e a mobilização, o pedido/contrato do cliente e os itens juntados por código. Pode editar.</small>'
    + (resumo
        ? '<div class="nfAvisos" style="padding:8px 10px;margin:6px 0 0"><b>Os itens não cabem na nota</b> (2.000 caracteres): ela sai com o resumo “conforme medição anexa”. '
          + 'Mande o PDF da medição junto com a nota para o cliente.'
          + (medPdfOk(t.medicao_pdf) ? ' <a href="' + esc(t.medicao_pdf) + '" target="_blank" rel="noopener">Abrir o PDF da medição</a>' : ' (o PDF não veio da medição: peça ao escritório)')
          + '</div>'
        : '');
}

/** Painel: as medições sem título e os títulos que citam o contrato sem a mobilização. */
function medAvisosPainel(){
  const n = (FINPM.med && Array.isArray(FINPM.med)) ? FINPM.med.length : 0;
  const s = (FINPM.proj && FINPM.proj.contrato_sem_mob) || {}, k = Number(s.n) || 0;
  let h = '';
  if (n) h += '<div class="ccLin" style="border-left:3px solid var(--warn);padding-left:8px" id="fpmMedAviso"><span class="ccDesc"><b>'
    + (n === 1 ? '1 medição fechada sem título' : n + ' medições fechadas sem título') + '</b> (OS de contrato, K03 concluída). '
    + '<button class="fpmLk" type="button" data-ir="finre">Lançar em Contas a Receber</button></span></div>';
  if (k) h += '<div class="ccLin" style="border-left:3px solid var(--warn);padding-left:8px" id="fpmSemMob"><span class="ccDesc"><b>'
    + (k === 1 ? '1 título cita' : k + ' títulos citam') + ' o contrato sem dizer a mobilização</b> ('
    + (s.titulos || []).slice(0, 3).map(x => esc(x.descricao || x.os_codigo || '—')).join('; ') + (k > 3 ? '…' : '')
    + '). Escreva o código com o sufixo (OS-2026003-M10) no campo OS, ou ele não abate nenhuma OS.</span></div>';
  return h;
}

const FINOS = { id: null, t: null, ver: null, ids: null, erro: null, sitPosta: false };

/** Lê o ?os= da entrada (chamada pelo iniciar, antes do primeiro desenho). */
function osDaEntrada(params){
  const id = (params.get('os') || '').trim();
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) return false;
  FINOS.id = id.toLowerCase(); FINOS.t = (params.get('t') || '').trim().toUpperCase() || null;
  FINOS.ver = null; FINOS.ids = null; FINOS.erro = null; FINOS.sitPosta = false;
  BUSCA.finre = '';
  return true;
}

async function osCarregar(){
  if (!FINOS.id) return;
  try{
    FINOS.ver = await rpc('tf_fin_os_faturar_ver', { p_os_id: FINOS.id });
    FINOS.ids = (FINOS.ver.contas || []).map(c => c.id); FINOS.erro = null;
  }catch(e){
    FINOS.ver = null; FINOS.ids = []; FINOS.erro = e.message;
  }
  // a OS mostra todas as contas dela (recebidas também), não só as em aberto
  if (!FINOS.sitPosta && FINF.finre){ FINF.finre.sit = 'todas'; FINOS.sitPosta = true; }
}

function osSair(){
  FINOS.id = null; FINOS.ver = null; FINOS.ids = null; FINOS.erro = null; FINOS.t = null;
  if (FINF.finre) FINF.finre.sit = FIN_CFG.finre.sitPadrao || 'todas';
  osDesenhar();
  if (typeof finDesenhar === 'function') finDesenhar('finre');
}

const osRot = () => (FINOS.ver && FINOS.ver.os && FINOS.ver.os.numero) || 'OS';

function osDesenhar(){
  const el = document.getElementById('finreOs'); if (!el) return;
  if (!FINOS.id){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const sair = '<button class="btn" type="button" id="osSair" title="Voltar a todas as contas a receber">Ver todas as contas</button>';
  if (FINOS.erro || !FINOS.ver){
    el.innerHTML = '<div class="nfBloco osPainel"><b>OS</b><div class="nfErros" style="margin:6px 0">'
      + esc(FINOS.erro || 'Não consegui abrir a OS.') + '</div>' + sair + '</div>';
    document.getElementById('osSair').addEventListener('click', osSair);
    return;
  }
  const v = FINOS.ver, o = v.os || {}, c = v.cliente || {};
  const aprov = Number(v.aprovado) || 0, ja = Number(v.ja_tem) || 0, falta = Number(v.falta) || 0;
  const nC = (v.contas || []).length;
  const props = (v.propostas || []).map(p => esc(p.rotulo)).join(', ');
  const podeCriar = v.pode_criar && (aprov <= 0 || falta > 0.009);
  const situ = o.status === 'cancelada' ? ' <span class="chip fCrit">cancelada</span>'
             : o.status === 'concluida' ? ' <span class="chip">concluída</span>' : '';
  let msg;
  if (o.status === 'cancelada') msg = 'A OS está cancelada: não se cria conta para ela.';
  else if (aprov <= 0) msg = nC ? 'A OS não tem proposta aprovada. Já tem ' + (nC === 1 ? 'uma conta' : nC + ' contas') + ' ligada' + (nC === 1 ? '' : 's') + ' (abaixo).'
                              : 'A OS não tem proposta aprovada. Dá para criar a conta confirmando o valor.';
  else if (falta <= 0.009) msg = 'Esta OS já tem conta a receber de todo o valor aprovado: confira abaixo e use “Emitir nota” e “Emitir boleto” na linha.';
  else if (nC) msg = 'Já tem conta de ' + BRL(ja) + '; falta ' + BRL(falta) + '.';
  else msg = 'Esta OS ainda não tem conta a receber.';
  const ctr = v.contrato || null;   // F13 · OS de contrato: fatura pela medição
  if (ctr) msg = medMsgOs(v);
  const citam = (v.citam || []);
  el.innerHTML = '<div class="nfBloco osPainel">'
    + '<div style="display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap">'
    +   '<div><div class="osTit" style="font-weight:700;font-size:15px;color:var(--ink)">' + esc(o.numero || 'OS') + ' · ' + esc(c.nome || '—') + situ + '</div>'
    +     (FINOS.t === 'T16' ? '<div class="nota" style="margin:2px 0 0">Vindo da tarefa T16 · Emitir boleto / nota fiscal</div>' : '') + '</div>'
    +   sair + '</div>'
    + '<div class="osNums" style="display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 4px">'
    +   '<span>' + (ctr ? 'Medição fechada: ' : 'Proposta aprovada: ') + '<span id="osAprov" style="font-weight:700">' + esc(BRL(aprov)) + '</span>' + (props ? ' <small style="color:var(--ink-3)">(' + ((v.propostas || []).length > 1 ? 'propostas ' : 'proposta ') + props + ')</small>' : '') + '</span>'
    +   '<span>Já tem conta: <span id="osJa" style="font-weight:700">' + esc(BRL(ja)) + '</span>' + (nC ? ' <small style="color:var(--ink-3)">(' + (nC === 1 ? '1 conta' : nC + ' contas') + ')</small>' : '') + '</span>'
    +   '<span>Falta: <span id="osFalta" style="font-weight:700">' + esc(BRL(falta)) + '</span></span></div>'
    + '<p class="nota" id="osMsg" style="margin:4px 0 8px">' + esc(msg) + '</p>'
    + (podeCriar ? '<button class="btn pri" type="button" id="osCriar">Criar conta a receber desta OS</button>' : '')
    + (ctr && ctr.medicao && !ctr.tem_titulo ? '<button class="btn pri" type="button" id="osMedLancar">Lançar título da medição</button>' : '')
    + (citam.length
        ? '<div style="margin-top:10px"><div class="nota" style="margin:0 0 4px">Estas contas citam a OS, mas não estão ligadas a ela:</div><ul class="nfAvisos" id="osCitam">'
          + citam.map(x => '<li>' + esc(x.descricao || '—') + ' · ' + esc(BRL(x.valor))
              + (x.ligada_a ? ' · <small>ligada à ' + esc(x.ligada_a) + '</small>' : '')
              + (x.mesmo_cliente
                  ? ' <button class="btn mini" type="button" data-osligar="' + esc(x.id) + '">Ligar a esta OS</button>'
                  : ' · <small>outro cliente</small>') + '</li>').join('') + '</ul></div>'
        : '')
    + '</div>';
  document.getElementById('osSair').addEventListener('click', osSair);
  const bc = document.getElementById('osCriar'); if (bc) bc.addEventListener('click', modalCriarContaOs);
  const bm = document.getElementById('osMedLancar'); if (bm) bm.addEventListener('click', () => modalLancarMedicao(ctr.medicao.medicao_id));
  el.querySelectorAll('[data-osligar]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try{ await rpc('tf_fin_os_ligar_conta', { p_titulo_id: b.dataset.osligar, p_os_id: FINOS.id }); toast('Conta ligada à ' + osRot() + '.', 'ok'); await finreCarregar(); }
    catch(e){ b.disabled = false; toast(e.message, 'err'); }
  }));
}

function modalCriarContaOs(rasc){
  if (rasc instanceof Event) rasc = null;
  const v = FINOS.ver; if (!v) return;
  const aprov = Number(v.aprovado) || 0, falta = Number(v.falta) || 0;
  const c = v.cliente || {}, o = v.os || {};
  const props = (v.propostas || []).map(p => p.rotulo).join(', ');
  const d = Object.assign({
    desc: o.numero + (props ? ((v.propostas || []).length > 1 ? ' · Propostas ' : ' · Proposta ') + props : ''),
    valor: aprov > 0 ? falta.toFixed(2) : '',
    parc: '1', comp: isoHoje().slice(0, 7), venc: finSomaDias(isoHoje(), Number(c.prazo_dias) || 30), forma: '', conf: false,
    uid: (crypto.randomUUID && crypto.randomUUID()) || ('os-' + Date.now() + '-' + Math.random().toString(16).slice(2))
  }, rasc || {});
  abrirModal('Criar conta a receber — ' + (o.numero || 'OS'),
      '<div class="campo"><label>Cliente (da OS)</label><input type="text" value="' + esc(c.razao_social || c.nome || '—') + '" disabled></div>'
    + (aprov > 0
        ? '<p class="nota" style="margin:-4px 0 10px">Aprovado ' + esc(BRL(aprov)) + ' · já tem conta ' + esc(BRL(Number(v.ja_tem) || 0)) + ' · falta <b>' + esc(BRL(falta)) + '</b>.</p>'
        : '<div class="nfAvisos" style="padding:8px 10px;margin-bottom:10px">A OS não tem proposta aprovada. Confira o valor com a OS antes de criar.'
          + '<label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="osConf"' + (d.conf ? ' checked' : '') + '> Confirmo o valor sem proposta aprovada</label></div>')
    + '<div class="campo"><label for="osDesc">Descrição</label><input id="osDesc" type="text" maxlength="300" value="' + esc(d.desc) + '" autocomplete="off"></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="osValor">Valor</label><input id="osValor" type="number" step="0.01" min="0.01" value="' + esc(d.valor) + '"></div>'
    +  '<div class="campo"><label for="osParc">Parcelas</label><select id="osParc">'
    +    Array.from({ length: 12 }, (_, i) => '<option value="' + (i + 1) + '"' + (String(i + 1) === String(d.parc) ? ' selected' : '') + '>' + (i + 1) + (i ? ' (uma por mês)' : '') + '</option>').join('')
    +  '</select></div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="osComp">Competência (mês do serviço)</label><input id="osComp" type="month" value="' + esc(d.comp) + '"></div>'
    +  '<div class="campo"><label for="osVenc">Vencimento (estimativa, 1ª parcela)</label><input id="osVenc" type="date" value="' + esc(d.venc) + '"></div></div>'
    + '<div class="campo"><label for="osForma">Forma prevista (opcional)</label><select id="osForma"><option value="">—</option>'
    +   FORMA_PREVISTA_FIN.map(f => '<option value="' + esc(f) + '"' + (d.forma === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('') + '</select></div>'
    + '<p class="nota">A conta nasce “A faturar”, ligada à ' + esc(o.numero || 'OS') + '. Depois, na linha dela: “Emitir nota” e “Emitir boleto”.</p>',
    [{ label: 'Cancelar', onClick: fecharModal },
     { label: 'Criar', pri: true, onClick: async () => {
        // tudo lido aqui, antes de qualquer outra janela
        const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const r = { desc: val('osDesc'), valor: val('osValor'), parc: val('osParc') || '1', comp: val('osComp'), venc: val('osVenc'),
                    forma: val('osForma'), conf: !!(document.getElementById('osConf') || {}).checked, uid: d.uid };
        const valor = Number(r.valor);
        if (!r.desc){ toast('A descrição é obrigatória.', 'err'); return; }
        if (!(valor > 0)){ toast('Informe um valor maior que zero.', 'err'); return; }
        if (aprov > 0 && valor > falta + 0.009){ toast('Passa do que falta da OS (' + BRL(falta) + ').', 'err'); return; }
        if (aprov <= 0 && !r.conf){ toast('Marque a confirmação: a OS não tem proposta aprovada.', 'err'); return; }
        if (!r.comp || !r.venc){ toast('Informe a competência e o vencimento.', 'err'); return; }
        const b = [...document.querySelectorAll('#mFoot .btn')].pop(); if (b) b.disabled = true;
        try{
          const res = await rpc('tf_fin_os_criar_conta', {
            p_os_id: FINOS.id, p_valor: valor, p_parcelas: Number(r.parc), p_descricao: r.desc,
            p_competencia: r.comp + '-01', p_vencimento: r.venc, p_forma_prevista: r.forma || null,
            p_subcategoria_id: null, p_confirmar_sem_aprovado: aprov <= 0 && r.conf, p_client_uid: r.uid });
          fecharModal();
          const n = (res && res.titulos ? res.titulos.length : 1);
          toast(n > 1 ? n + ' parcelas criadas para a ' + osRot() + '.' : 'Conta a receber criada para a ' + osRot() + '.', 'ok');
          await finreCarregar();
        }catch(e){
          toast(e.message, 'err');
          modalCriarContaOs(r);   // volta com o que foi escrito (a mesma chave: não cria em dobro)
        }
     }}]);
}

// Sem o 508 no banco, nada disto aparece.
// ════════════════════════════════════════════════════════════════════════════
const FINBO = { ativo: false, sit: {}, cfg: null, pend: null };
const BO_SIT = { emitindo: 'Emitindo boleto…', a_receber: 'Boleto', atrasado: 'Boleto vencido', recebido: 'Recebido',
                 marcado_recebido: 'Marcado como recebido no app', cancelado: 'Boleto cancelado', expirado: 'Boleto encerrado pelo banco', falha: 'Boleto recusado' };

async function boCarregar(){
  try{
    const [sit, cfg] = await Promise.all([rpc('tf_fin_boleto_situacoes', {}), rpc('tf_fin_boleto_config', {})]);
    FINBO.sit = sit || {}; FINBO.cfg = cfg; FINBO.ativo = true;
  }catch(e){ FINBO.ativo = false; FINBO.sit = {}; }   // banco sem o 508: o boleto não aparece
}
/** O último boleto do título, se houver. */
const boDe = t => (FINBO.ativo && t && FINBO.sit[t.id]) || null;
/** Boleto que ainda vale no banco (o cliente pode pagar). */
const boVivo = t => { const b = boDe(t); return !!(b && ['emitindo', 'a_receber', 'atrasado'].includes(b.situacao)); };
const boFaixaTeste = amb => amb === 'sandbox'
  ? '<div class="nfTeste">TESTE (sandbox do Inter): boleto sem valor</div>' : '';

function boChip(t){
  const b = boDe(t); if (!b) return '';
  const teste = b.ambiente === 'sandbox' ? ' (teste)' : '';
  let cls = '', txt = BO_SIT[b.situacao] || b.situacao;
  if (b.situacao === 'a_receber') txt = 'Boleto · vence ' + dataBR(b.vencimento).slice(0, 5) + teste;
  else if (b.situacao === 'atrasado'){ cls = ' fCrit'; txt = 'Boleto vencido' + teste; }
  else if (b.situacao === 'recebido'){ cls = ' fOk'; txt = 'Recebido · ' + (b.recebido_origem === 'PIX' ? 'Pix' : 'boleto') + ' em ' + dataBR(b.recebido_em).slice(0, 5) + teste; }
  else if (b.situacao === 'emitindo'){ cls = ' fAtn'; }
  else if (b.situacao === 'falha' || b.situacao === 'marcado_recebido'){ cls = ' fAtn'; }
  else return '';                                     // cancelado/encerrado: só no quadro "Boletos"
  if (b.aviso === 'titulo_ja_baixado'){ cls = ' fAtn'; txt = 'Boleto pago — conferir: título já estava baixado'; }
  const vivo = ['a_receber', 'atrasado'].includes(b.situacao);
  return ' <span class="chip' + cls + '" title="' + esc(b.motivo || txt) + '">' + esc(txt) + '</span>'
    + (vivo && b.linha_digitavel ? ' <a href="#" data-bocopia="linha" data-id="' + esc(t.id) + '" style="font-size:11px">Linha</a>' : '')
    + (vivo && b.pix_copia_cola ? ' <a href="#" data-bocopia="pix" data-id="' + esc(t.id) + '" style="font-size:11px">Pix</a>' : '')
    + (vivo || b.situacao === 'recebido' ? ' <a href="#" data-bopdf="' + esc(b.id) + '" style="font-size:11px">PDF boleto</a>' : '');
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-bocopia]'), p = e.target.closest('[data-bopdf]');
  if (c){ e.preventDefault(); const b = FINBO.sit[c.dataset.id]; if (!b) return;
    if (c.dataset.bocopia === 'pix') copiar(b.pix_copia_cola, 'Pix copia-e-cola copiado.'); else copiar(b.linha_digitavel, 'Linha digitável copiada.'); }
  if (p){ e.preventDefault(); boAbrirPdf(p.dataset.bopdf); }
});

/** O PDF do boleto, do compartimento privado (com o token de quem clicou). Sem PDF guardado, pede ao Inter. */
async function boAbrirPdf(boletoId, caminho){
  const janela = window.open('', '_blank');
  try{
    if (!caminho){ const b = Object.values(FINBO.sit).find(x => x.id === boletoId); caminho = b && b.pdf_path; }
    if (!caminho){ const j = await boFuncao({ acao: 'pdf', boleto_id: boletoId }); caminho = j.pdf_path; }
    const r = await rhfdFetch(SUPABASE_URL + '/storage/v1/object/fin-boleto/' + String(caminho).split('/').map(encodeURIComponent).join('/'), {});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    janela.location.href = url; setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ if (janela) janela.close(); toast('Não abriu o PDF do boleto: ' + e.message, 'err'); }
}

/** Chama a função do servidor. Token vencido: renova uma vez pelo núcleo e repete. */
async function boFuncao(corpo){
  const vai = () => fetch(SUPABASE_URL + '/functions/v1/fin-boleto', { method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + sessao.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo), signal: AbortSignal.timeout ? AbortSignal.timeout(90000) : undefined });
  let r;
  try{ r = await vai(); }
  catch(e){ throw new Error('O servidor não respondeu. Use "Atualizar boleto" antes de tentar de novo — ele pode ter saído.'); }
  if (r.status === 401 && sessao.refresh){
    try{ await Nucleo.api.rpc('tf_fin_autorizado', {}); }catch(e){}
    r = await vai();
  }
  let j = null; try{ j = await r.json(); }catch(e){}
  if (!r.ok || !j || !j.ok){
    const m = (j && j.erro) || ('Erro ' + r.status + ' no boleto.');
    // 514/F10: o Inter limitando chamadas (429) vira a frase clara, venha de onde vier
    throw new Error(r.status === 429 || /HTTP 429|\b429\b/.test(m) ? 'O Inter pediu para esperar. Tente de novo em 1 minuto.' : m);
  }
  return j;
}
async function boExecutar(fn, rotulo, depois){
  abrirModal(rotulo, '<p style="margin:6px 0">' + esc(rotulo) + ' Isso leva alguns segundos; não feche a página.</p>', []);
  let j = null;
  try{ j = await fn(); }
  catch(e){ fecharModal(); toast(e.message, 'err'); await finreCarregar(); return null; }
  fecharModal(); await finreCarregar();
  if (j.aviso) toast(j.aviso, 'err');
  else if (depois) depois(j);
  return j;
}
function boResultado(j){
  const teste = j.ambiente === 'sandbox' ? ' (TESTE)' : '';
  if (j.situacao === 'a_receber' || j.situacao === 'atrasado'){
    abrirModal('Boleto emitido' + teste,
      boFaixaTeste(j.ambiente)
      + '<p style="margin-top:0">Boleto de <b>' + esc(BRL(j.valor)) + '</b>, vence em <b>' + esc(dataBR(j.vencimento)) + '</b>. O cliente paga pelo boleto ou pelo Pix; a baixa sai sozinha.</p>'
      + '<div class="nfChave">Linha digitável <code>' + esc(j.linha_digitavel || '—') + '</code></div>',
      [{ label: 'Copiar linha', onClick: () => copiar(j.linha_digitavel, 'Linha digitável copiada.') },
       { label: 'Copiar Pix', onClick: () => copiar(j.pix_copia_cola, 'Pix copia-e-cola copiado.') },
       { label: 'PDF', onClick: () => boAbrirPdf(j.boleto_id, j.pdf_path) },
       { label: 'Fechar', pri: true, onClick: fecharModal }]);
  } else if (j.situacao === 'falha'){
    abrirModal('Boleto não emitido', '<p style="margin-top:0">O Inter recusou:</p><p class="nfRecusa">' + esc(j.motivo || 'sem detalhe') + '</p>'
      + '<p class="nota">Corrija o que a mensagem pede (no título ou no cadastro do cliente) e emita de novo.</p>',
      [{ label: 'Fechar', pri: true, onClick: fecharModal }]);
  } else if (j.situacao === 'cancelado') toast('Boleto cancelado no Inter. O título continua em aberto.', 'ok');
  else if (j.situacao === 'recebido') toast('Boleto pago' + (j.recebido_em ? ' em ' + dataBR(j.recebido_em) : '') + '. A baixa foi lançada.', 'ok');
  else toast('Boleto atualizado.', 'ok');
}

/** A conferência do boleto, antes de emitir. */
async function modalEmitirBoleto(t, opcoes){
  let prep;
  try{ prep = await rpc('tf_fin_boleto_preparar', { p_titulo_id: t.id, p_opcoes: opcoes || {} }); }
  catch(e){ toast(e.message, 'err'); return; }
  const r = prep.resumo;
  const lista = (L, cls) => (L && L.length) ? '<ul class="' + cls + '">' + L.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';
  const vencido = (prep.erros || []).some(x => /já passou/.test(x));
  abrirModal('Emitir boleto — ' + finTituloRot(t),
      boFaixaTeste(prep.ambiente)
    + lista(prep.erros, 'nfErros')
    + ((prep.erros || []).some(x => /Cadastros/.test(x)) && NO_SERVIDOR
       ? '<p class="nota" style="margin:-4px 0 10px"><a href="../manager/?ir=cad&area=tapfin" target="_blank" rel="noopener">Abrir Cadastros › Clientes</a> (em outra aba).</p>' : '')
    + lista(prep.avisos, 'nfAvisos')
    + '<div class="nfBloco"><b>Pagador</b>'
    +   '<div>' + esc(r.cliente || '—') + ' · ' + esc(finDocFmt(r.doc)) + '</div>'
    +   '<div class="nota" style="margin:2px 0 0">' + esc(r.endereco || 'Endereço não cadastrado') + '</div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label>Valor (o saldo do título)</label><input type="text" value="' + esc(BRL(r.valor)) + '" readonly></div>'
    +  '<div class="campo"><label for="boVenc">Vencimento</label><input id="boVenc" type="date" value="' + esc(String(r.vencimento || '').slice(0, 10)) + '"></div></div>'
    + '<div class="nota" style="margin:0 0 10px">Cód. de controle <b>' + esc(r.seu_numero) + '</b> · multa ' + esc(String(r.multa_pct)) + '% · juros ' + esc(String(r.juros_mes_pct)) + '% ao mês'
    +   (Number(r.desconto_pct) > 0 ? ' · desconto ' + esc(String(r.desconto_pct)) + '%' : '') + ' · pagável até ' + esc(String(r.dias_agenda)) + ' dias depois do vencimento · boleto + Pix · entra na conta ' + esc(r.conta || '—') + '</div>'
    + '<div class="campo"><label for="boL1">Mensagem no boleto (linha 1)</label><input id="boL1" type="text" maxlength="78" value="' + esc((r.mensagem && r.mensagem.linha1) || '') + '"></div>'
    + '<div class="campo"><label for="boL2">Linha 2</label><input id="boL2" type="text" maxlength="78" value="' + esc((r.mensagem && r.mensagem.linha2) || '') + '"></div>'
    // 513: as linhas fixas (de "Boleto ⚙"), para ver o boleto inteiro antes de emitir
    + ((r.mensagem && (r.mensagem.linha3 || r.mensagem.linha4))
       ? '<div class="nfBloco" id="boFixas"><b>Linhas 3 e 4 (fixas, vão em todo boleto)</b>'
         + (r.mensagem.linha3 ? '<div>' + esc(r.mensagem.linha3) + '</div>' : '')
         + (r.mensagem.linha4 ? '<div>' + esc(r.mensagem.linha4) + '</div>' : '')
         + '<div class="nota" style="margin:2px 0 0">Já saem no boleto: não repita nas linhas 1 e 2. Para mudar, "Boleto ⚙".</div></div>'
       : ''),
    [{ label: 'Cancelar', onClick: fecharModal },
     { label: vencido ? 'Conferir com a data nova' : 'Emitir boleto', pri: true, onClick: async () => {
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        const op = { vencimento: v('boVenc'), linha1: v('boL1'), linha2: v('boL2') };
        if (vencido || op.vencimento !== String(r.vencimento || '').slice(0, 10)){ modalEmitirBoleto(t, op); return; }
        if (!prep.pode_emitir){ toast((prep.erros || []).join(' '), 'err'); return; }
        const ok = await confirmar('Emitir o boleto?', boFaixaTeste(prep.ambiente)
          + '<p style="margin-top:0">Boleto de <b>' + esc(BRL(r.valor)) + '</b> para <b>' + esc(r.cliente) + '</b>, vencendo em <b>' + esc(dataBR(op.vencimento)) + '</b>.</p>'
          + '<div class="nfBloco" id="boMsgConf"><b>Mensagem no boleto</b>'
          +   [op.linha1 || (r.mensagem && r.mensagem.linha1), op.linha2 || (r.mensagem && r.mensagem.linha2), r.mensagem && r.mensagem.linha3, r.mensagem && r.mensagem.linha4]
                .filter(Boolean).map(x => '<div>' + esc(x) + '</div>').join('') + '</div>'
          + '<p class="nota">Depois de emitido, o boleto só se desfaz por cancelamento (no ⋯).</p>', 'Emitir');
        if (!ok){ modalEmitirBoleto(t, op); return; }
        await boExecutar(() => boFuncao({ acao: 'emitir', titulo_id: t.id, opcoes: op }), 'Emitindo o boleto…', boResultado);
     }}]);
  if (!prep.pode_emitir && !vencido){
    const b = [...document.querySelectorAll('#mFoot .btn')].pop(); if (b){ b.disabled = true; b.title = 'Corrija o que está em vermelho'; }
  }
}

    +   (b.aviso === 'marcado_recebido' ? '<div class="nfAvisos" style="padding:6px 9px">Marcado como recebido à mão no app do Inter: a baixa não é automática.</div>' : '')
    + '</div><div class="nfBot">'
    +   (['a_receber', 'atrasado'].includes(b.situacao) ? '<button class="btn mini" type="button" data-bocop="' + esc(b.linha_digitavel || '') + '" data-rot="Linha digitável">Copiar linha</button>'
         + '<button class="btn mini" type="button" data-bocop="' + esc(b.pix_copia_cola || '') + '" data-rot="Pix copia-e-cola">Copiar Pix</button>' : '')
    +   (['a_receber', 'atrasado', 'recebido'].includes(b.situacao) ? '<button class="btn mini" type="button" data-bopdfx="' + esc(b.id) + '" data-path="' + esc(b.pdf_path || '') + '">PDF</button>' : '')
    +   (['emitindo', 'a_receber', 'atrasado'].includes(b.situacao) ? '<button class="btn mini" type="button" data-boatual="' + esc(b.id) + '">Atualizar</button>' : '')
    +   (['a_receber', 'atrasado'].includes(b.situacao) && b.codigo ? '<button class="btn mini perigo" type="button" data-bocanc="' + esc(b.id) + '">Cancelar boleto</button>' : '')

    (L.length ? L.map(linha).join('') : '<p class="nota">Nenhum boleto para este título.</p>'),

  document.getElementById('mBody').addEventListener('click', e => {
    const c = e.target.closest('[data-bocop]'), p = e.target.closest('[data-bopdfx]'), a = e.target.closest('[data-boatual]'), x = e.target.closest('[data-bocanc]');

    if (x) modalCancelarBoleto(t, L.find(b => b.id === x.dataset.bocanc));
  });
}

/** Cancelar: só com o clique, com motivo e confirmação (o TapFin nunca cancela sozinho). */
function modalCancelarBoleto(t, b){
  if (!b) return;
  abrirModal('Cancelar o boleto ' + (b.seu_numero || ''),
      boFaixaTeste(b.ambiente)
    + '<p style="margin-top:0">O boleto é cancelado no Inter e o cliente <b>não consegue mais pagá-lo</b> (nem pelo Pix). O título continua em aberto.</p>'
    + '<div class="campo"><label for="boMotivo">Motivo (de 5 a 50 letras, vai para o Inter)</label>'
    + '<input id="boMotivo" type="text" maxlength="50" placeholder="Ex.: Cliente pagou por TED"></div>',
    [{ label: 'Voltar', onClick: fecharModal },
     { label: 'Cancelar boleto', cls: 'perigo', onClick: async () => {
        const motivo = document.getElementById('boMotivo').value.trim();
        if (motivo.length < 5){ toast('O motivo precisa ter pelo menos 5 letras.', 'err'); return; }
        const ok = await confirmar('Cancelar o boleto ' + (b.seu_numero || '') + '?', boFaixaTeste(b.ambiente)
          + '<p style="margin-top:0">O cancelamento vai ao Inter, <b>sem volta</b>.</p><p class="nota">Motivo: ' + esc(motivo) + '</p>', 'Cancelar o boleto', true);
        if (!ok){ modalCancelarBoleto(t, b); return; }
        await boExecutar(() => boFuncao({ acao: 'cancelar', boleto_id: b.id, motivo }), 'Cancelando o boleto…', boResultado);
     }}]);
}

/** Baixa manual com boleto valendo: avisa antes (o cliente ainda pode pagar o boleto). */
async function boAntesDaBaixa(t){
  const b = boDe(t);
  return await new Promise(ok => abrirModal('Este título tem boleto valendo',
    '<p style="margin-top:0">O boleto <b>' + esc(b.seu_numero || '') + '</b> continua valendo no banco: o cliente ainda pode pagá-lo. Se o pagamento chegou por outro meio, cancele o boleto também.</p>',
    [{ label: 'Voltar', onClick: () => { fecharModal(); ok(false); } },
     { label: 'Cancelar o boleto primeiro', onClick: () => { fecharModal(); ok(false); modalCancelarBoleto(t, { ...b, id: b.id }); } },
     { label: 'Seguir para a baixa', pri: true, onClick: () => { fecharModal(); ok(true); } }]));
}

/** "Trazer os boletos do Inter": liga os emitidos pelo app aos títulos (o Vinícius confirma cada um). */
async function modalTrazerInter(){
  let j;
  abrirModal('Trazer os boletos do Inter', '<p style="margin:6px 0">Buscando os boletos em aberto no Inter…</p>', []);
  try{ j = await boFuncao({ acao: 'listar_inter' }); }catch(e){ fecharModal(); toast(e.message, 'err'); return; }
  const L = j.cobrancas || [];
  const linha = (c, i) => {
    const opts = (c.candidatos || []).map(x => '<option value="' + esc(x.titulo_id) + '"' + (c.sugestao && c.sugestao.titulo_id === x.titulo_id ? ' selected' : '') + '>'
      + esc((x.cliente || '') + ' · ' + (x.descricao || '') + ' · ' + BRL(x.valor) + ' · ' + dataBR(x.vencimento)) + '</option>').join('');
    return '<div class="nfLin"><div><b>' + esc(c.seu_numero || '—') + '</b> · ' + esc(c.pagador || '') + ' · ' + esc(BRL(c.valor)) + ' · vence ' + esc(dataBR(c.vencimento))
      + (c.situacao === 'ATRASADO' ? ' <span class="chip fCrit">vencido</span>' : '')
      + '<div class="campo" style="margin:6px 0 0"><select data-boi="' + i + '"><option value="">' + (opts ? '— escolha o título —' : 'Nenhum título combina') + '</option>' + opts + '</select></div>'
      + (c.sugestao ? '<div class="nota" style="margin:2px 0 0">Sugerido pelo cód. de controle, valor e vencimento.</div>' : '')
      + '</div><div class="nfBot"><button class="btn mini" type="button" data-boligar="' + i + '"' + (opts ? '' : ' disabled') + '>Ligar</button></div></div>';
  };
  abrirModal('Trazer os boletos do Inter',
    boFaixaTeste(j.ambiente)
    + '<p class="nota" style="margin-top:0">' + esc(String(j.total_inter)) + ' boleto(s) em aberto no Inter; ' + esc(String(L.length)) + ' ainda sem título no TapFin. '
    + 'Ligado, o título mostra o boleto, não oferece outro, e o pagamento dá baixa sozinho.</p>'
    + (L.length ? L.map(linha).join('') : '<p class="nota">Nada a ligar: todos os boletos do Inter já estão nos títulos.</p>'),
    [{ label: 'Fechar', pri: true, onClick: () => { fecharModal(); finreCarregar(); } }]);
  document.getElementById('mBody').addEventListener('click', async e => {
    const b = e.target.closest('[data-boligar]'); if (!b) return;
    const i = Number(b.dataset.boligar), sel = document.querySelector('[data-boi="' + i + '"]');
    if (!sel || !sel.value){ toast('Escolha o título.', 'err'); return; }
    b.disabled = true;
    try{ await boFuncao({ acao: 'vincular', titulo_id: sel.value, codigo_solicitacao: L[i].codigo_solicitacao });
         b.textContent = 'Ligado ✓'; sel.disabled = true; toast('Boleto ' + (L[i].seu_numero || '') + ' ligado ao título.', 'ok'); }
    catch(err){ b.disabled = false; toast(err.message, 'err'); }
  });
}

/** "Boleto ⚙": padrões, conta e ambiente (admin), certificado, webhook, conferência e pendências. */
async function modalConfigBoleto(rasc){   // 512: rasc = o que foi escrito, quando a confirmação é cancelada
  let c, p;
  try{ [c, p] = await Promise.all([rpc('tf_fin_boleto_config', {}), rpc('tf_fin_boleto_pendencias', {})]); }catch(e){ toast(e.message, 'err'); return; }

const FINJF = { ativo: false, itens: [], marcados: new Set(), notas: 0, notasAte: null };

/** O número da nota escrito na descrição (o mesmo critério do banco: tf__fin_nf_ref). */
function jfRef(t){
  const m = /(^|[^\p{L}\p{N}])NF\s*(?:n?[º°o.:]?\s*)?0*([0-9]{1,6})(\s*[-/]\s*([0-9]{1,2}))?(?![0-9])/iu.exec((t && t.descricao) || '');
  return m ? { numero: Number(m[2]), parcela: m[4] ? Number(m[4]) : null } : null;
}
/** Conta "A faturar" com NF na descrição: o botão principal vira "Já tem nota". */
const jfTemNota = t => FINJF.ativo && !t.anulado && t.etapa === 'a_faturar' && !!jfRef(t);

async function jfCarregar(){
  try{
    const j = await rpc('tf_fin_ja_faturados', {});
    FINJF.ativo = true; FINJF.itens = j.itens || []; FINJF.marcados = new Set(j.marcados || []);
    FINJF.notas = j.notas_carregadas || 0; FINJF.notasAte = j.notas_ate || null;
  }catch(e){ FINJF.ativo = false; FINJF.itens = []; FINJF.marcados = new Set(); }
  jfFaixa();
}

/** A faixa em Contas a Receber: quantas contas "A faturar" já têm o número da nota. */

  const topo = document.querySelector('.finTopo');

  if (!topo || visao !== 'finre'){ if (el) el.remove(); return; }

    + '<span style="flex:1 1 260px"><b>' + n + (n === 1 ? ' conta “A faturar” já tem' : ' contas “A faturar” já têm') + ' o número da nota na descrição.</b> '
    + 'Marque como faturadas antes de emitir notas pelo TapFin, para não sair nota em dobro.</span>'
    + '<button class="btn pri" type="button" id="jfAbrir" style="margin:0">Conferir e marcar</button></div>';
  const b = document.getElementById('jfAbrir'); if (b) b.addEventListener('click', modalJaFaturados);

};

      + '<div class="dupla" style="margin:0">'
      +   '<div class="campo" style="margin:0"><label for="jfN' + k + '">Nº da nota</label><input id="jfN' + k + '" type="number" min="1" inputmode="numeric" value="' + esc(s.numero != null ? String(s.numero) : '') + '"></div>'
      +   '<div class="campo" style="margin:0"><label for="jfD' + k + '">Data da nota</label><input id="jfD' + k + '" type="date" value="' + esc(s.data || '') + '"></div></div>'

  };
  const conta = () => document.querySelectorAll('[data-jfc]:checked').length;
  abrirModal('Contas que já têm nota',

    + 'As que conferem já vêm marcadas; as outras, confira antes. Engano depois? No ⋯ da conta, “Desfazer: voltar para A faturar”.</p>'
    + '<p class="nota">Notas lidas da contabilidade: ' + esc(String(FINJF.notas)) + (FINJF.notasAte ? ' (até ' + esc(dataBR(FINJF.notasAte)) + ')' : '') + '.</p>'
    + L.map(linha).join(''),
    [{ label: 'Cancelar', onClick: fecharModal },

        const itens = [];
        for (const c of document.querySelectorAll('[data-jfc]:checked')){
          const k = c.dataset.jfc, num = document.getElementById('jfN' + k).value.trim(), dia = document.getElementById('jfD' + k).value;
          if (!num || !dia){ toast('Falta o número ou a data da nota em “' + (L[k].descricao || '') + '”.', 'err'); return; }
          itens.push({ titulo_id: L[k].titulo_id, numero: Number(num), data: dia });
        }

        try{

          fecharModal(); toast(r.marcados + (r.marcados === 1 ? ' conta marcada' : ' contas marcadas') + ' como faturada' + (r.marcados === 1 ? '' : 's') + '.', 'ok');
          finreCarregar();
        }catch(e){ toast(e.message, 'err'); }
     }}]);
  const rot = () => { const b = [...document.querySelectorAll('#mFoot .btn')].pop(); if (b){ const n = conta(); b.textContent = n ? 'Marcar ' + n + ' como faturada' + (n === 1 ? '' : 's') : 'Marcar como faturadas'; b.disabled = !n; } };
  document.getElementById('mBody').addEventListener('change', e => { if (e.target.matches('[data-jfc]')) rot(); });

// TAPFIN 3 · EMISSÃO DE NFS-e PELO TAPFIN (Notaas)
// ----------------------------------------------------------------------------
// Desenho: processos/tapfin-nfse-desenho.md. Banco: 504_tapfin_nfse.sql.
// Servidor: supabase/functions/fin-nfse (a chave do Notaas e o certificado
// nunca passam por aqui). A tela só pede "emita/consulte/cancele a nota do
// título X"; os valores saem do banco (tf_fin_nfse_preparar).
// Sem o 504 no banco, nada disto aparece e Contas a Receber fica como no F2.
// ════════════════════════════════════════════════════════════════════════════
const FINNF = { ativo: false, sit: {}, cfg: null };

const NF_SIT = { emitindo: 'Emitindo…', autorizada: 'Nota emitida', rejeitada: 'Nota recusada',
                 cancelando: 'Cancelando…', cancelada: 'Nota cancelada' };

async function nfCarregar(){
  try{
    const [sit, cfg] = await Promise.all([rpc('tf_fin_nfse_situacoes', {}), FINNF.cfg ? FINNF.cfg : rpc('tf_fin_nfse_config', {})]);
    FINNF.sit = sit || {}; FINNF.cfg = cfg; FINNF.ativo = true;
  }catch(e){ FINNF.ativo = false; FINNF.sit = {}; }   // banco sem o 504: a emissão não aparece
  nfBuscarAtrasados();
}

/** 512: nota autorizada sem o PDF (ou o XML) — o Notaas às vezes só o tem minutos depois da emissão.
 *  Busca em segundo plano, uma vez por nota a cada abertura da página (até 5 por vez, dos últimos
 *  30 dias), sem janela nem aviso; se algum chegar, a lista se atualiza. "Atualizar" continua valendo. */
const NF_BUSCADOS = new Set();
function nfBuscarAtrasados(){
  if (!FINNF.ativo) return;
  const limite = Date.now() - 30 * 86400000;
  const falta = Object.entries(FINNF.sit || {}).filter(([, n]) => n && n.id && n.situacao === 'autorizada' && (!n.pdf || !n.xml)
      && !NF_BUSCADOS.has(n.id) && (!n.criado_em || new Date(n.criado_em).getTime() >= limite)).slice(0, 5);
  nfBuscarComprovantes();   // F12 · 517
  if (!falta.length) return;
  falta.forEach(([, n]) => NF_BUSCADOS.add(n.id));
  (async () => {
    let chegou = false;
    for (const [tid, n] of falta){
      try{ const j = await nfFuncao({ acao: 'consultar', titulo_id: tid, nfse_id: n.id }); if (j && ((j.pdf && !n.pdf) || (j.xml && !n.xml))) chegou = true; }
      catch(e){ /* fica para a próxima abertura, ou para o "Atualizar" */ }
    }
    if (!chegou) return;
    try{ FINNF.sit = (await rpc('tf_fin_nfse_situacoes', {})) || FINNF.sit; }catch(e){ return; }
    if (typeof REPINTA !== 'undefined' && REPINTA.finre && document.getElementById('finreLista')) REPINTA.finre();
  })();
}

/** F12 · 517: o XML do cancelamento que o Notaas ainda não tinha (inclui as canceladas antes do F12).
 *  Até 5 por abertura, a mais nova primeiro, uma vez por nota, sem janela nem aviso. Sem o 517, nada. */
async function nfBuscarComprovantes(){
  let L;
  try{ L = await rpc('tf_fin_nfse_sem_comprovante', {}); }catch(e){ return; }
  const falta = (L || []).filter(x => x && x.nfse_id && !NF_BUSCADOS.has(x.nfse_id));
  if (!falta.length) return;
  falta.forEach(x => NF_BUSCADOS.add(x.nfse_id));
  for (const x of falta){
    try{ await nfFuncao({ acao: 'consultar', titulo_id: x.titulo_id, nfse_id: x.nfse_id }); }
    catch(e){ /* fica para a próxima abertura, ou para o "Buscar comprovante" */ }
  }
  let depois;
  try{ depois = await rpc('tf_fin_nfse_sem_comprovante', {}); }catch(e){ return; }
  const ainda = new Set((depois || []).map(x => x.nfse_id));
  if (!falta.some(x => !ainda.has(x.nfse_id))) return;   // nenhum chegou
  try{ FINNF.sit = (await rpc('tf_fin_nfse_situacoes', {})) || FINNF.sit; }catch(e){ return; }
  if (typeof REPINTA !== 'undefined' && REPINTA.finre && document.getElementById('finreLista')) REPINTA.finre();
}

/** A nota (a última) do título, se houver. */
const nfDe = t => (FINNF.ativo && t && FINNF.sit[t.id]) || null;
/** F5: nota que ainda vale (ou está a caminho): o título não pode ser anulado. */
const nfViva = t => { const n = nfDe(t); return !!(n && ['emitindo', 'autorizada', 'cancelando'].includes(n.situacao)); };
/** F5: a chave de acesso (50 dígitos) e o número curto da NFS-e. O Notaas devolve o Id do XML
 *  ("NFS" + chave); o número de verdade está na chave, nas posições 24 a 36. O banco (505) já grava
 *  o curto; isto aqui só protege a tela de uma nota antiga. */
const nfChave = n => { const c = String((n && n.chave) || '').replace(/\D/g, ''); if (c.length === 50) return c;
  const m = /^(?:NFS)?(\d{50})$/.exec(String((n && n.numero) || '')); return m ? m[1] : ''; };
const nfNumero = n => { const c = nfChave(n); if (c) return String(Number(c.slice(23, 36)));
  return (n && n.numero) ? String(n.numero) : ''; };

function nfChip(t){
  const n = nfDe(t); if (!n) return '';
  const teste = n.ambiente === 'teste' ? ' (teste)' : '';
  let cls = '', txt = NF_SIT[n.situacao] || n.situacao;
  if (n.situacao === 'autorizada'){ cls = ' fOk'; txt = 'NFS-e ' + nfNumero(n) + teste; }
  else if (n.situacao === 'rejeitada'){ cls = ' fCrit'; }
  else if (n.situacao === 'emitindo' || n.situacao === 'cancelando'){ cls = ' fAtn'; }
  return ' <span class="chip' + cls + '" title="' + esc((n.motivo || n.cancel_resposta || txt)) + '">' + esc(txt) + '</span>'
    + (n.situacao === 'autorizada' && n.pdf ? ' <a href="#" data-nfdoc="pdf" data-nfpath="' + esc(n.pdf_path) + '" style="font-size:11px">PDF</a>' : '')
    + (n.situacao === 'autorizada' && n.xml ? ' <a href="#" data-nfdoc="xml" data-nfpath="' + esc(n.xml_path) + '" style="font-size:11px">XML</a>' : '')
    // F12 · 517: o comprovante do cancelamento é o XML do evento (o Notaas não fornece PDF dele)
    + (n.situacao === 'cancelada' && n.xml_cancel && n.xml_cancel_path ? ' <a href="#" data-nfdoc="xml" data-nfpath="' + esc(n.xml_cancel_path)
         + '" style="font-size:11px;white-space:nowrap" title="O comprovante do cancelamento (XML do evento). O PDF com a situação Cancelada fica no portal nacional.">Cancelamento (XML)</a>' : '');
}

/** Abre o PDF / baixa o XML do compartimento privado (com o token de quem clicou). */
async function nfAbrirDoc(caminho, tipo){
  const janela = tipo === 'pdf' ? window.open('', '_blank') : null;
  try{
    const r = await rhfdFetch(SUPABASE_URL + '/storage/v1/object/fin-nfse/' + String(caminho).split('/').map(encodeURIComponent).join('/'), {});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    if (janela) janela.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = String(caminho).split('/').pop(); document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ if (janela) janela.close(); toast('Não abriu o arquivo da nota: ' + e.message, 'err'); }
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-nfdoc]'); if (!a) return;
  e.preventDefault(); nfAbrirDoc(a.dataset.nfpath, a.dataset.nfdoc);
});

/** Chama a função do servidor. Token vencido: renova uma vez pelo núcleo e repete. */
async function nfFuncao(corpo){
  const vai = () => fetch(SUPABASE_URL + '/functions/v1/fin-nfse', { method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + sessao.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo), signal: AbortSignal.timeout ? AbortSignal.timeout(60000) : undefined });
  let r;
  try{ r = await vai(); }
  catch(e){ throw new Error('O servidor não respondeu. Use "Atualizar" na nota antes de tentar de novo — ela pode ter saído.'); }
  if (r.status === 401 && sessao.refresh){
    try{ await Nucleo.api.rpc('tf_fin_autorizado', {}); }catch(e){}
    r = await vai();
  }
  let j = null; try{ j = await r.json(); }catch(e){}
  if (!r.ok || !j || !j.ok) throw new Error((j && j.erro) || ('Erro ' + r.status + ' na emissão.'));
  return j;
}

function nfResultado(j, verbo){
  const teste = j.ambiente === 'teste' ? ' (TESTE, sem valor fiscal)' : '';
  if (j.situacao === 'autorizada' && verbo === 'emitir') toast('NFS-e ' + nfNumero(j) + ' emitida' + teste + '. O título foi faturado.', 'ok');
  else if (j.situacao === 'cancelada') toast('NFS-e ' + nfNumero(j) + ' cancelada. O título voltou para "A faturar".', 'ok');
  else if (j.situacao === 'rejeitada') nfAvisoRecusa(j.motivo);
  else if (j.situacao === 'autorizada' && j.cancel_resposta) nfAvisoRecusa('Cancelamento recusado: ' + j.cancel_resposta);
  else if (j.aviso) toast(j.aviso, 'err');
  else if (j.situacao === 'emitindo') toast('A nota ainda está sendo emitida. Use "Atualizar nota" daqui a pouco.', 'err');
  else if (j.situacao === 'cancelando') toast('O cancelamento está em andamento. Use "Atualizar nota" mais tarde.', 'err');
  else toast('Nota atualizada.', 'ok');
}

/** Roda uma ação no servidor com a janela "trabalhando", e recarrega a lista. */

/** F12 · 517: pede à fin-nfse o XML do cancelamento ("consultar" busca e guarda) e reabre o histórico. */
async function nfBuscarComprovante(t, nfseId){
  abrirModal('Buscar comprovante', '<p style="margin:6px 0">Buscando o comprovante do cancelamento no Notaas… Isso leva alguns segundos.</p>', []);
  let tem = false;
  try{
    await nfFuncao({ acao: 'consultar', titulo_id: t.id, nfse_id: nfseId });
    const L = await rpc('tf_fin_nfse_listar', { p_titulo_id: t.id });
    tem = !!((L || []).find(x => x.id === nfseId) || {}).xml_cancel_path;
  }catch(e){ fecharModal(); toast(e.message, 'err'); return; }
  fecharModal();
  toast(tem ? 'Comprovante do cancelamento guardado: "Cancelamento (XML)".'

/** CNPJ/CPF com pontuação, só para ler. */
function finDocFmt(d){
  d = String(d || '').replace(/\D/g, '');
  if (d.length === 14) return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
  if (d.length === 11) return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  return d || '—';
}

  // S46 · título de R$ 0,00 (recorrência variável sem estimativa) tem saldo 0

function finChipCartao(t){
  const c = t.cartao; if (!c) return '';
  if (!c.conciliado) return ' <span class="chip risco" title="Lançada por um canhoto. O vencimento é estimado; a fatura do cartão confirma.">Cartão · a conciliar</span>';
  return ' <span class="chip' + (c.fatura_situacao === 'paga' ? ' fOk' : ' prog') + '" title="Entrou na fatura deste cartão — paga com a fatura">Fatura '
    + esc(c.cartao_nome || '') + ' ' + esc(dataBR(c.fatura_vencimento).slice(0, 5)) + '</span>';
}

function finpgPrimaria(t){
  if (t.cartao && Number(t.saldo) > 0) return { acao:'cartoes', rot:'Cartões' };   // S60 · corrigir e pagar é pela fatura
  if (!(Number(t.valor) > 0)) return { acao:'editar', rot:'Editar' };      // R$ 0,00: primeiro o valor real
  if (Number(t.saldo) > 0) return { acao:'baixar', rot:'Baixar' };
  return { acao:'baixas', rot:'Baixas' };
}

function finpgMenu(t){
  const p = finpgPrimaria(t).acao;
  const M = [];
  // S60 · conta de cartão: sem Editar/Anular soltos (a soma da fatura depende dela)
  if (t.cartao) return p === 'baixas' ? [{ acao:'cartoes', rot:'Abrir no Cartões' }] : [{ acao:'baixas', rot:'Baixas' }];
  if (p !== 'editar') M.push({ acao:'editar', rot:'Editar' });
  if (p !== 'baixas') M.push({ acao:'baixas', rot:'Baixas' });
  M.push({ acao:'anular', rot:'Anular', perigo:true });
  return M;
}

function finpgAcao(a, t){
  if (a === 'cartoes'){ CAR.aba = t.cartao && t.cartao.fatura_id ? 'faturas' : 'canhotos'; CAR.faturaId = (t.cartao && t.cartao.fatura_id) || null;
    CAR.fatura = null; return irPara('fincar'); }   // S60
  if (a === 'editar') return modalTituloPagar(t);
  if (a === 'baixar') return modalBaixarTitulo(t, finpgCarregar);
  if (a === 'baixas') return modalVerBaixas(t, finpgCarregar);
  if (a === 'anular') return modalAnularTituloPagar(t);
}

function finSomaDias(iso, n){
  const d = new Date(String(iso).slice(0, 10) + 'T12:00:00Z');
  if (isNaN(d)) return '';
  d.setUTCDate(d.getUTCDate() + Number(n || 0));
  return d.toISOString().slice(0, 10);
}

function finDiasEntre(a, b){
  const x = new Date(String(a).slice(0, 10) + 'T12:00:00Z'), y = new Date(String(b).slice(0, 10) + 'T12:00:00Z');
  return Math.round((y - x) / 86400000);
}
