async function finrsvCarregar(){
  const el = document.getElementById('finrsvLista'); if (!el) return;
  try{ FINRSV.envelopes = await rpc('tf_fin_envelopes_listar', {}); }
  catch(e){
    el.innerHTML = '<div class="vazio2"><b>Não consegui abrir as reservas</b><p></p>'
      + '<button class="btn" type="button" id="finrsvDeNovo">Tentar de novo</button></div>';
    el.querySelector('p').textContent = e.message;
    document.getElementById('finrsvDeNovo').addEventListener('click', finrsvCarregar);
    return;
  }
  finrsvDesenhar();
}

// a 527 manda 'movimentos' em cada caixinha: é por ela que a tela sabe que o banco já tem o estorno e a caixinha nova
const finrsv527 = () => (FINRSV.envelopes || []).some(e => e.movimentos != null);

function finrsvDesenhar(){
  const el = document.getElementById('finrsvLista'); if (!el) return;
  const L = FINRSV.envelopes || [];
  const nova = document.getElementById('finrsvNovaCx');
  if (nova) nova.hidden = !(finrsv527() || !L.length);
  if (!L.length){
    el.innerHTML = '<p class="nota" style="padding:12px">Nenhuma caixinha ainda: use “+ Nova caixinha”.</p>';
    return;
  }
  // S70 · valor mensal (vai no dia 30) e o que já foi guardado no mês
  const nm = FPM_NOMES[new Date().getMonth()], tot = k => L.reduce((s, e) => s + (Number(e[k]) || 0), 0);
  const falta = e => Math.max(0, (Number(e.valor_mensal) || 0) - (Number(e.guardado_mes) || 0));
  const b = (dado, id, rot) => '<button class="btn" type="button" style="padding:3px 8px;font-size:12px" data-' + dado + '="' + esc(id) + '">' + rot + '</button>';
  el.innerHTML = '<div class="fpmRolar"><table class="fpmTabela finrsvTab"><tr><th>Caixinha</th><th>Por mês</th><th>Guardado em ' + esc(nm) + '</th><th>Saldo atual</th><th></th></tr>'
    + L.map(e => '<tr><td>' + esc(e.nome) + '</td>'
      + '<td>' + (Number(e.valor_mensal) ? esc(BRL(e.valor_mensal)) : '<span style="color:var(--ink-3)">—</span>') + '</td>'
      + '<td>' + esc(BRL(e.guardado_mes || 0)) + (falta(e) > 0.009 ? ' <small style="color:var(--warn)">falta ' + esc(BRL(falta(e))) + '</small>' : '') + '</td>'
      + '<td>' + esc(BRL(e.saldo_atual)) + '</td>'
      + '<td style="white-space:nowrap">' + (e.movimentos != null ? b('movenv', e.id, 'Ver movimentos' + (Number(e.movimentos) ? ' (' + Number(e.movimentos) + ')' : '')) + ' ' : '')
      +   b('editarenv', e.id, 'Editar') + '</td></tr>').join('')
    + '<tr class="sel"><td>Total</td><td>' + esc(BRL(tot('valor_mensal'))) + '</td><td>' + esc(BRL(tot('guardado_mes'))) + '</td><td>' + esc(BRL(tot('saldo_atual'))) + '</td><td></td></tr>'
    + '</table></div>'
    + (tot('valor_mensal') ? '' : '<p class="nota" style="margin-top:8px">Ponha em cada caixinha (Editar) quanto vai nela todo dia 30. Enquanto estiver vazio, as Projeções usam a recorrência de provisão.</p>');
  el.querySelectorAll('[data-editarenv]').forEach(x => x.addEventListener('click', () => {
    const env = (FINRSV.envelopes || []).find(y => y.id === x.dataset.editarenv);
    if (env) modalEnvelope(env);
  }));
  el.querySelectorAll('[data-movenv]').forEach(x => x.addEventListener('click', () => modalMovimentosEnvelope(x.dataset.movenv)));
}

REPINTA.finrsv = finrsvDesenhar;

// env = null: caixinha nova (527)
function modalEnvelope(env, rasc){
  const R = rasc || {};
  const nova = !env;
  abrirModal(nova ? 'Nova caixinha' : 'Editar caixinha',
      '<div class="campo"><label for="feN">Nome</label><input id="feN" type="text" maxlength="60" value="'
    +   esc(R.nome != null ? R.nome : env ? env.nome : '') + '" autocomplete="off" placeholder="Ex.: 13º salário"></div>'
    + '<div class="dupla"><div class="campo"><label for="feS">Saldo inicial</label><input id="feS" type="text" inputmode="decimal" data-valor="moeda" value="'
    +   esc(R.saldo != null ? R.saldo : finNumTxt(env && env.saldo_inicial != null ? env.saldo_inicial : 0)) + '"></div>'
    + '<div class="campo"><label for="feM">Valor por mês (dia 30)</label><input id="feM" type="text" inputmode="decimal" data-valor="moeda" value="'
    +   esc(R.mensal != null ? R.mensal : finNumTxt(env ? env.valor_mensal : 0)) + '"></div></div>'
    + '<p class="nota" style="margin:2px 0 0">' + (nova ? 'O saldo inicial é o que já está guardado nela hoje (0 se ela começa vazia). O que entrar depois se lança em “+ Nova transferência”.'
        : 'O saldo inicial é o que havia antes do primeiro movimento. Para corrigir um movimento lançado errado, use “Ver movimentos” › Estornar.') + '</p>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label: nova ? 'Criar caixinha' : 'Salvar', pri:true, onClick: async () => {
        const nome = (document.getElementById('feN') || {}).value.trim();
        if (!nome){ Nucleo.janela.erro('O nome da caixinha é obrigatório.'); return; }
        const saldo = Nucleo.util.lerValor((document.getElementById('feS') || {}).value);
        const mensal = Nucleo.util.lerValor((document.getElementById('feM') || {}).value);
        if (Number.isNaN(saldo) || Number.isNaN(mensal)){ Nucleo.janela.erro('Saldo inicial e valor por mês precisam ser números.'); return; }
        if ((mensal || 0) < 0){ Nucleo.janela.erro('O valor por mês não pode ser negativo.'); return; }
        if (nova && (saldo || 0) < 0){ Nucleo.janela.erro('O saldo inicial não pode ser negativo.'); return; }
        try{
          if (nova) await rpc('tf_fin_envelope_criar', { p_nome: nome, p_saldo_inicial: saldo || 0, p_valor_mensal: mensal || 0 });
          else await rpc('tf_fin_envelope_gravar', { p_id: env.id, p_nome: nome, p_saldo_inicial: saldo || 0, p_valor_mensal: mensal || 0 });
          Nucleo.janela.mexida(false); fecharModal(); toast(nova ? 'Caixinha criada.' : 'Caixinha salva.', 'ok'); await finrsvCarregar();
        }catch(e){ Nucleo.janela.erro(e.message); toast(e.message, 'err'); }
     }}]);
}

async function modalMovimentosEnvelope(id){
  let M;
  try{ M = await rpc('tf_fin_envelope_movimentos', { p_envelope_id: id }); }
  catch(e){ toast('Não consegui abrir os movimentos: ' + e.message, 'err'); return; }
  const L = M.movimentos || [];
  const rot = m => m.tipo === 'reserva' ? 'Reserva' : m.tipo === 'resgate' ? 'Resgate' : (Number(m.valor) < 0 ? 'Pagamento' : 'Recebimento');
  const corpo = '<p class="nota" style="margin-top:0">Saldo atual: <b>' + esc(BRL(M.saldo_atual)) + '</b>'
      + (Number(M.saldo_inicial) ? ' (começou com ' + esc(BRL(M.saldo_inicial)) + ')' : '') + '. Riscado = estornado (não conta).</p>'
    + (!L.length ? '<p class="nota">Nenhum movimento ainda.</p>'
      : '<div class="ccLin cab"><span>Data</span><span>O quê</span><span class="n">Valor</span><span></span></div>'
        + L.map(m => '<div class="ccLin' + (m.estornado ? ' riscada' : '') + '">'
          + '<span class="ccData">' + esc(dataBR(m.data)) + '</span>'
          + '<span class="ccNome">' + esc(rot(m)) + ' · ' + esc(m.conta || '—')
            + (m.descricao ? ' <small style="color:var(--ink-3)">· ' + esc(m.descricao) + '</small>' : '')
            + (m.por ? ' <small style="color:var(--ink-3)">· lançado por ' + esc(m.por) + '</small>' : '')
            + (m.estornado ? ' <small style="color:var(--ink-3)">— estornado' + (m.estornado_por ? ' por ' + esc(m.estornado_por) : '') + (m.estornado_motivo ? ': ' + esc(m.estornado_motivo) : '') + '</small>' : '') + '</span>'
          + '<span class="n v">' + esc(BRL(m.valor)) + '</span>'
          + '<span class="a">' + (m.estornado ? '' : m.tipo === 'baixa'
              ? '<small style="color:var(--ink-3)" title="O pagamento se estorna na própria conta: Contas a Pagar › ⋯ › Baixas">na conta</small>'
              : '<button class="btn" type="button" style="padding:3px 8px;font-size:12px" data-estornartr="' + esc(m.id) + '">Estornar</button>') + '</span>'
          + '</div>').join(''));
  abrirModal('Movimentos — ' + (M.nome || 'caixinha'), corpo, [{ label:'Fechar', pri:true, onClick: fecharModal }]);
  document.querySelectorAll('#mBody [data-estornartr]').forEach(b => b.addEventListener('click', () => {
    const m = L.find(x => x.id === b.dataset.estornartr);
    if (m) estornarTransferencia(m, M);
  }));
}

async function estornarTransferencia(m, M){
  const r = await confirmar('Estornar a transferência',
    '<p>' + esc(m.tipo === 'reserva' ? 'Reserva' : 'Resgate') + ' de <b>' + esc(BRL(Math.abs(Number(m.valor) || 0))) + '</b> em ' + esc(dataBR(m.data))
      + ' (' + esc(m.conta || '—') + ' ⇄ ' + esc(M.nome || 'caixinha') + '). Ela fica riscada e deixa de contar no saldo da conta e no da caixinha.</p>'
      + '<div class="campo"><label for="trEstMot">Motivo</label><input id="trEstMot" type="text" autocomplete="off" placeholder="Ex.: caixinha errada"></div>',
    'Estornar', true, { campo: 'trEstMot', obrigatorio: 'Escreva o motivo do estorno.', minimo: 3 });
  if (!r){ modalMovimentosEnvelope(M.id); return; }
  try{
    await rpc('tf_fin_transferencia_estornar', { p_id: m.id, p_motivo: r.texto });
    toast('Transferência estornada.', 'ok');
    await finrsvCarregar();
  }catch(e){ toast(e.message, 'err'); }
  modalMovimentosEnvelope(M.id);
}

async function modalTransferencia(){
  const envs = FINRSV.envelopes || [];
  if (!envs.length){ toast('Crie uma caixinha antes de lançar uma transferência (“+ Nova caixinha”).', 'err'); return; }
  let contas;
  try{ contas = await rpc('tf_fin_contas_listar', {}); }
  catch(e){ toast(e.message, 'err'); return; }
  const contasOp = (contas || []).filter(c => c.papel === 'operacional');
  if (!contasOp.length){ toast('Cadastre uma conta operacional em Contas Bancárias antes de lançar uma transferência.', 'err'); return; }
  const hoje = isoHoje();
  abrirModal('Nova transferência',
      '<div class="campo"><label for="ftT">Tipo</label><select id="ftT">'
    +   '<option value="reserva">Reserva mensal (conta → caixinha)</option>'
    +   '<option value="resgate">Resgate (caixinha → conta)</option>'
    + '</select></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="ftC">Conta operacional</label><select id="ftC">'
    +    contasOp.map(c => '<option value="' + esc(c.id) + '">' + esc(c.nome) + '</option>').join('')
    +  '</select></div>'
    +  '<div class="campo"><label for="ftE">Caixinha</label><select id="ftE">'
    +    envs.map(e => '<option value="' + esc(e.id) + '">' + esc(e.nome) + '</option>').join('')
    +  '</select></div></div>'
    + '<div class="dupla">'
    +  '<div class="campo"><label for="ftV">Valor</label><input id="ftV" type="text" inputmode="decimal" data-valor="moeda" placeholder="ex.: 1.250,00"></div>'
    +  '<div class="campo"><label for="ftD">Data</label><input id="ftD" type="date" value="' + hoje + '"></div></div>'
    + '<div class="campo"><label for="ftDesc">Descrição (opcional)</label><input id="ftDesc" type="text" autocomplete="off"></div>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Lançar', pri:true, onClick: async () => {
        const v = id => (document.getElementById(id) || {}).value.trim();
        const valor = Nucleo.util.lerValor(v('ftV'));
        if (!valor || Number.isNaN(valor) || valor <= 0){ Nucleo.janela.erro('Informe um valor maior que zero.'); return; }
        if (!v('ftD')){ Nucleo.janela.erro('Informe a data.'); return; }
        try{
          await rpc('tf_fin_transferencia_criar', { p_conta_id: v('ftC'), p_envelope_id: v('ftE'),
            p_tipo: v('ftT'), p_valor: valor, p_data: v('ftD'), p_descricao: v('ftDesc') || null });
          Nucleo.janela.mexida(false); fecharModal(); toast('Transferência lançada.', 'ok'); await finrsvCarregar();
        }catch(e){ Nucleo.janela.erro(e.message); toast(e.message, 'err'); }
     }}]);
}

async function pintarCategorias(){
  visao = 'fincat';
  const board = document.getElementById('board');
  board.innerHTML = '<div class="tela"><div class="telaCab"><h2>Categorias e Orçamento</h2>'
    + '<p>As subcategorias começam vazias — vá criando conforme for lançando contas. '
    +   'O orçamento mensal é o previsto para comparar com o realizado.</p>'
    + '<p><b>Tipo de custo</b> (para a margem de contribuição do TapGestão): <b>variável</b> = cresce com o volume de serviço '
    +   '(combustível, hospedagem, terceiros, imposto sobre a nota) e entra na margem; <b>fixo</b> = é pago mesmo sem serviço '
    +   '(aluguel, salários, cursos) e fica de fora; <b>fora dos custos</b> = nem é gasto (empréstimo).</p></div>'
    + '<div id="catCorpo"><p class="nota">Carregando…</p></div></div>';
  await catCarregar();
}

async function catCarregar(){
  const el = document.getElementById('catCorpo'); if (!el) return;
  try{ [FINCAT.lista, FINCAT.soInf] = await Promise.all([rpc('tf_fin_grupos_listar', {}),
         // F35 (S218, issue 115, CO12): as marcadas "Peças / material"; sem a 530, a marca não aparece
         rpc('tf_fin_subcategorias_so_informa', {}).then(x => new Set((x || []).map(String))).catch(() => null)]); }
  catch(e){
    el.innerHTML = '<div class="vazio2"><b>Não consegui abrir as categorias</b><p></p>'
      + '<button class="btn" type="button" id="catDeNovo">Tentar de novo</button></div>';
    el.querySelector('p').textContent = e.message;
    document.getElementById('catDeNovo').addEventListener('click', catCarregar);
    return;
  }
  catDesenhar();
}

function catDesenhar(){
  const el = document.getElementById('catCorpo'); if (!el) return;
  const G = FINCAT.lista || [];
  if (!G.length){
    el.innerHTML = '<p class="nota" style="padding:12px">Nenhuma categoria encontrada: falta uma atualização do sistema. Avise o administrador.</p>';
    return;
  }
  // F15 · sem a 519 no banco a lista não traz "custo_tipo": a tela fica como no F14
  const comCusto = G.some(g => (g.subcategorias || []).some(s => Object.prototype.hasOwnProperty.call(s, 'custo_tipo')));
  const semTipo = comCusto ? G.filter(g => g.tipo !== 'r')
    .reduce((n, g) => n + (g.subcategorias || []).filter(s => !s.custo_tipo).length, 0) : 0;
  el.innerHTML = (semTipo
      ? '<div class="catAviso"><b>' + semTipo + (semTipo === 1 ? ' subcategoria de despesa ainda sem' : ' subcategorias de despesa ainda sem')
        + ' tipo de custo.</b> Enquanto ficar assim, o que for lançado nelas não entra na margem do TapGestão '
        + '(ele avisa quanto ficou sem classificar).</div>'
      : '')
    + G.map(g => {
    const subs = g.subcategorias || [];
    const despesa = g.tipo !== 'r'; // banco guarda 'p' (despesa) / 'r' (receita)
    const custo = despesa && comCusto;
    return '<div class="painel" style="margin-bottom:14px;padding:14px">'
      + '<h3 style="margin-top:0">' + esc(g.nome)
      +   ' <small style="color:var(--ink-3);font-weight:normal">(' + (despesa ? 'despesa' : 'receita') + ')</small></h3>'
      + (subs.length
          ? '<div class="ccLin cab' + (custo ? ' catLin' : '') + '"><span>Subcategoria</span>'
            + (custo ? '<span>Tipo de custo</span>' : '')
            + '<span class="n">' + (despesa ? 'Orçamento/mês' : '') + '</span><span></span></div>'
            + subs.map(s => '<div class="ccLin' + (custo ? ' catLin' : '') + (s.ativa === false ? ' catOff' : '') + '"><span>' + esc(s.nome)
              + (s.ativa === false ? ' <small class="chip">Desativada</small>' : '') + '</span>'
              + (custo ? '<span class="catC">' + catCustoSelect(s) + catSoInfCaixa(s) + '</span>' : '')
              + '<span class="n">' + (despesa
                  ? '<input type="number" step="0.01" class="catOrc" data-sub="' + esc(s.id)
                    + '" value="' + (s.orcamento_mensal != null ? Number(s.orcamento_mensal) : '')
                    + '" placeholder="—" style="width:110px;text-align:right">'
                  : '') + '</span>'
              + '<span class="a"><button class="btn" type="button" style="padding:3px 8px;font-size:12px" data-editarsub="'
                + esc(s.id) + '" data-grupo="' + esc(g.id) + '">Editar</button>'
                // F32 (issue 103): desativar (some das listas de escolha; as contas antigas e os relatórios continuam) e, a nunca usada, excluir
                + (s.ativa == null ? '' : ' <button class="btn" type="button" style="padding:3px 8px;font-size:12px" data-ativasub="' + esc(s.id) + '" data-ativa="' + (s.ativa === false ? '1' : '0') + '">'
                  + (s.ativa === false ? 'Reativar' : 'Desativar') + '</button>'
                  + (s.usada === false ? ' <button class="btn" type="button" style="padding:3px 8px;font-size:12px;color:var(--crit)" data-excluisub="' + esc(s.id) + '">Excluir</button>' : ''))
                + '</span></div>').join('')
          : '<p class="nota" style="padding:6px 0">Nenhuma subcategoria ainda.</p>')
      + '<div style="display:flex;gap:8px;margin-top:10px">'
      +   '<input type="text" placeholder="Nova subcategoria…" class="catNovoNome" data-grupo="' + esc(g.id) + '" style="flex:1">'
      +   '<button class="btn" type="button" data-add="' + esc(g.id) + '">Adicionar</button>'
      + '</div></div>';
  }).join('');

  el.querySelectorAll('.catOrc').forEach(inp => inp.addEventListener('change', async () => {
    try{
      await rpc('tf_fin_subcategoria_gravar', { p_id: inp.dataset.sub, p_grupo_id: null, p_nome: null,
        p_orcamento_mensal: inp.value === '' ? null : Number(inp.value) });
      toast('Orçamento salvo.', 'ok');
    }catch(e){ toast(e.message, 'err'); catCarregar(); }
  }));

  el.querySelectorAll('.catCusto').forEach(sel => sel.addEventListener('change', async () => {
    sel.disabled = true;
    try{
      await rpc('tf_fin_subcategoria_custo', { p_id: sel.dataset.sub, p_custo_tipo: sel.value || null });
      toast('Tipo de custo salvo: ' + (CAT_CUSTO_ROT[sel.value] || 'não classificado') + '.', 'ok');
      await catCarregar();
    }catch(e){ toast(e.message, 'err'); catCarregar(); }
  }));

  el.querySelectorAll('.catSoInf').forEach(c => c.addEventListener('change', async () => {
    c.disabled = true;
    try{
      await rpc('tf_fin_subcategoria_so_informa', { p_id: c.dataset.sub, p_valor: c.checked });
      if (FINCAT.soInf){ if (c.checked) FINCAT.soInf.add(c.dataset.sub); else FINCAT.soInf.delete(c.dataset.sub); }
      toast(c.checked ? 'Marcada: na aba Custos da OS esta conta só informa (o custo das peças é o da aba Itens).' : 'Desmarcada: esta conta volta a somar no custo da OS.', 'ok');
    }catch(e){ c.checked = !c.checked; toast(e.message, 'err'); }
    c.disabled = false;
  }));

  el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
    const inp = el.querySelector('.catNovoNome[data-grupo="' + b.dataset.add + '"]');
    const nome = inp.value.trim();
    if (!nome){ toast('Digite o nome da subcategoria.', 'err'); return; }
    try{
      await rpc('tf_fin_subcategoria_gravar', { p_id: null, p_grupo_id: b.dataset.add, p_nome: nome, p_orcamento_mensal: null });
      toast('Subcategoria adicionada.', 'ok'); await catCarregar();
    }catch(e){ toast(e.message, 'err'); }
  })));

  el.querySelectorAll('[data-ativasub]').forEach(b => b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
    const ativa = b.dataset.ativa === '1';
    const s = G.flatMap(g => g.subcategorias || []).find(x => x.id === b.dataset.ativasub);
    if (!ativa && !(await confirmar('Desativar a subcategoria',
        '<p style="margin-top:0"><b>' + esc(s ? s.nome : '') + '</b> some das listas para escolher (conta nova, recorrência, cartão). '
        + 'As contas que já têm esta subcategoria continuam com ela, e ela continua nos relatórios. Dá para reativar depois.</p>', 'Desativar'))) return;
    try{ await rpc('tf_fin_subcategoria_ativar', { p_id: b.dataset.ativasub, p_ativa: ativa }); toast(ativa ? 'Subcategoria reativada.' : 'Subcategoria desativada.', 'ok'); }
    catch(e){ toast(e.message, 'err'); }
    await catCarregar();
  })));
  el.querySelectorAll('[data-excluisub]').forEach(b => b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
    const s = G.flatMap(g => g.subcategorias || []).find(x => x.id === b.dataset.excluisub);
    if (!(await confirmar('Excluir a subcategoria', '<p style="margin-top:0">Excluir <b>' + esc(s ? s.nome : '') + '</b>? Ela nunca foi usada; some de vez.</p>', 'Excluir', true))) return;
    try{ await rpc('tf_fin_subcategoria_excluir', { p_id: b.dataset.excluisub }); toast('Subcategoria excluída.', 'ok'); }
    catch(e){ toast(e.message, 'err'); }
    await catCarregar();
  })));

  el.querySelectorAll('[data-editarsub]').forEach(b => b.addEventListener('click', () => {
    const g = G.find(x => x.id === b.dataset.grupo);
    const s = g && (g.subcategorias || []).find(x => x.id === b.dataset.editarsub);
    if (s) modalSubcategoria(g, s);
  }));
}

// F15 · o tipo de custo da subcategoria (519). Vazio = não classificado (não entra na margem).
const CAT_CUSTO_ROT = { variavel:'variável', fixo:'fixo', fora:'fora dos custos' };
function catCustoSelect(s){
  const v = s.custo_tipo || '';

const FIN_MESES_LONGO = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function finIsoMais(iso, dias){
  const p = String(iso).split('-').map(Number);
  return isoHoje(new Date(p[0], p[1] - 1, p[2] + dias));
}

const FIN_PERIODOS = [
  ['todos','Todos'], ['personalizado','Personalizado'],
  ['hoje','Hoje'], ['ontem','Ontem'], ['amanha','Amanhã'],
  ['semana','Esta semana'], ['semana_passada','Semana passada'],
  ['prox7','Próximos 7 dias'], ['ult30','Últimos 30 dias'], ['prox30','Próximos 30 dias'], ['ult90','Últimos 90 dias'],
  ['mes','Este mês'], ['mes_passado','Último mês'], ['prox_mes','Próximo mês'], ['ano','Este ano']
];

const FIN_PER_MENSAL = ['todos','personalizado','mes','mes_passado','prox_mes','ano'];

function finPerIntervalo(chave, mensal, ateHoje){
  const h = isoHoje();
  const [y, m, d] = h.split('-').map(Number);
  if (mensal){
    const ym = (yy, mi) => isoHoje(new Date(yy, mi, 1)).slice(0, 7);   // mi = mês 0-11, normaliza
    if (chave === 'mes') return { de: ym(y, m - 1), ate: ym(y, m - 1) };
    if (chave === 'mes_passado') return { de: ym(y, m - 2), ate: ym(y, m - 2) };
    if (chave === 'prox_mes') return { de: ym(y, m), ate: ym(y, m) };
    if (chave === 'ano') return { de: y + '-01', ate: ateHoje ? ym(y, m - 1) : y + '-12' };
    return null;
  }
  const dd = n => finIsoMais(h, n);
  const dow = new Date(y, m - 1, d).getDay();   // 0 = domingo
  switch (chave){
    case 'hoje':   return { de: h, ate: h };
    case 'ontem':  return { de: dd(-1), ate: dd(-1) };
    case 'amanha': return { de: dd(1), ate: dd(1) };
    case 'semana': { const dom = dd(-dow); return { de: dom, ate: ateHoje ? h : finIsoMais(dom, 6) }; }
    case 'semana_passada': { const dom = dd(-dow - 7); return { de: dom, ate: finIsoMais(dom, 6) }; }
    case 'prox7':  return { de: h, ate: dd(6) };
    case 'ult30':  return { de: dd(-29), ate: h };
    case 'prox30': return { de: h, ate: dd(29) };
    case 'ult90':  return { de: dd(-89), ate: h };
    case 'mes':    return { de: h.slice(0, 8) + '01', ate: ateHoje ? h : isoHoje(new Date(y, m, 0)) };
    case 'mes_passado': return { de: isoHoje(new Date(y, m - 2, 1)), ate: isoHoje(new Date(y, m - 1, 0)) };
    case 'prox_mes':    return { de: isoHoje(new Date(y, m, 1)), ate: isoHoje(new Date(y, m + 1, 0)) };
    case 'ano':    return { de: y + '-01-01', ate: ateHoje ? h : y + '-12-31' };
  }
  return null;
}

const finFmtPer = (v, mensal) => mensal ? (String(v).slice(5, 7) + '/' + String(v).slice(0, 4)) : dataBR(v);

function finPerTexto(per, campos){
  const c = campos.find(x => x.k === per.campo) || campos[0];
  const a = finFmtPer(per.de, c.mensal), b = finFmtPer(per.ate, c.mensal);
  const rot = (FIN_PERIODOS.find(p => p[0] === per.chave) || [null, ''])[1];
  return c.rot + ': ' + (a === b ? a : a + ' a ' + b) + (per.chave !== 'personalizado' && rot ? ' (' + rot + ')' : '');
}

function finPeriodoAbrir(cfg){
  const campos = cfg.campos;
  let campo = (cfg.per && cfg.per.campo) || campos[0].k;
  const atual = () => campos.find(c => c.k === campo) || campos[0];
  const permitidas = () => FIN_PERIODOS.filter(([k]) =>
    (!cfg.permitidos || cfg.permitidos.includes(k)) && (!atual().mensal || FIN_PER_MENSAL.includes(k)));
  abrirModal(atual().titulo || atual().rot,
      (campos.length > 1
        ? '<div class="campo"><label for="perCampo">Filtrar por</label><select id="perCampo">'
          + campos.map(c => '<option value="' + esc(c.k) + '"' + (c.k === campo ? ' selected' : '') + '>' + esc(c.rot) + '</option>').join('')
          + '</select></div>'
        : '')
    + '<div class="campo"><label for="perChave">Período</label><select id="perChave"></select></div>'
    + '<div class="dupla">'
    +   '<div class="campo"><label for="perDe">De</label><input id="perDe" type="date"></div>'
    +   '<div class="campo"><label for="perAte">Até</label><input id="perAte" type="date"></div>'
    + '</div>'
    + '<p class="nota" id="perNota" style="margin:0"></p>',
    [{ label:'Cancelar', onClick: fecharModal },
     { label:'Aplicar', pri:true, onClick: () => {
        const chave = document.getElementById('perChave').value;
        if (chave === 'todos'){ fecharModal(); cfg.aplicar(null); return; }
        const de = document.getElementById('perDe').value, ate = document.getElementById('perAte').value;
        if (!de || !ate){ toast('Informe as duas datas, De e Até.', 'err'); return; }
        if (de > ate){ toast('A data “De” é depois da “Até” — ajuste o período.', 'err'); return; }
        fecharModal();
        cfg.aplicar({ campo, chave, de, ate });
     }}]);
  const selC = document.getElementById('perChave');
  const iDe = document.getElementById('perDe'), iAte = document.getElementById('perAte');
  const nota = document.getElementById('perNota');
  const pintarChaves = (escolher) => {
    const ops = permitidas();
    selC.innerHTML = ops.map(([k, r]) => '<option value="' + k + '">' + esc(r) + '</option>').join('');
    selC.value = ops.some(([k]) => k === escolher) ? escolher : (ops.some(([k]) => k === 'todos') ? 'todos' : 'personalizado');
  };
  const pintarTipo = () => {
    const t = atual().mensal ? 'month' : 'date';
    iDe.type = t; iAte.type = t;
    nota.textContent = atual().mensal ? 'Competência é um mês: escolha o mês inicial e o final.' : '';
    document.getElementById('mTit').textContent = atual().titulo || atual().rot;
  };
  const preencher = (chave) => {
    if (chave === 'todos'){ iDe.value = ''; iAte.value = ''; return; }
    if (chave === 'personalizado') return;
    const p = finPerIntervalo(chave, atual().mensal, cfg.ateHoje);
    if (p){ iDe.value = p.de; iAte.value = p.ate; }
  };
  pintarTipo();
  if (cfg.per){ pintarChaves(cfg.per.chave); iDe.value = cfg.per.de || ''; iAte.value = cfg.per.ate || ''; }
  else { pintarChaves('todos'); preencher(selC.value); }
  selC.addEventListener('change', () => preencher(selC.value));
  // mexer numa data é período próprio
  [iDe, iAte].forEach(i => i.addEventListener('input', () => {
    if (selC.querySelector('option[value="personalizado"]')) selC.value = 'personalizado';
  }));
  const selCampo = document.getElementById('perCampo');
  if (selCampo) selCampo.addEventListener('change', () => {
    const eraMensal = atual().mensal;
    campo = selCampo.value;
    const chave = selC.value;
    // dia ↔ mês: converte o que já estava escolhido em vez de apagar
    if (atual().mensal && !eraMensal){ iDe.type = 'month'; iAte.type = 'month';
      iDe.value = String(iDe.value || '').slice(0, 7); iAte.value = String(iAte.value || '').slice(0, 7); }
    if (!atual().mensal && eraMensal){
      const de = iDe.value, ate = iAte.value;
      iDe.type = 'date'; iAte.type = 'date';
      iDe.value = de ? de + '-01' : '';
      iAte.value = ate ? isoHoje(new Date(Number(ate.slice(0, 4)), Number(ate.slice(5, 7)), 0)) : '';
    }
    pintarTipo();
    pintarChaves(chave);
    if (selC.value !== chave || chave !== 'personalizado') preencher(selC.value);
  });
}

const finPago     = t => !t.anulado && Number(t.valor) > 0 && Number(t.saldo) <= 0;

const finAberto   = t => !t.anulado && !finPago(t);

const finParcial  = t => !t.anulado && Number(t.saldo) > 0 && Number(t.saldo) < Number(t.valor);

const finVencida  = (t, hoje) => finAberto(t) && String(t.vencimento) < hoje;

const finConfirmar = t => !t.anulado && !finPago(t) && (!!t.valor_a_confirmar || !(Number(t.valor) > 0));

const finTemBaixa = t => t.tem_baixa != null ? !!t.tem_baixa : Number(t.saldo) !== Number(t.valor);

function finSitCasa(t, sit, hoje){
  switch (sit){
    case 'todas':     return !t.anulado;
    case 'aberto':    return finAberto(t);
    case 'vencidas':  return finVencida(t, hoje);
    case 'parcial':   return finParcial(t);
    case 'pagas': case 'recebidas': return finPago(t);
    case 'confirmar': return finConfirmar(t);
    case 'a_faturar': return !t.anulado && t.etapa === 'a_faturar';
    case 'faturadas': return !t.anulado && t.etapa !== 'a_faturar';
    case 'anuladas':  return !!t.anulado;
    case 'ativas':    return !!t.ativa && !t.encerrada;
    case 'pausadas':  return !t.ativa;
    case 'encerradas': return !!t.encerrada;   // F32 (issue 102)
  }
  return true;
}

function finFaixa(t, hoje){
  if (t.anulado) return 'st-anul';
  if (finPago(t)) return 'st-paga';
  if (String(t.vencimento) < hoje) return 'st-venc';
  if (String(t.vencimento) <= finIsoMais(hoje, 7)) return 'st-breve';
  return '';
}

function finChipPrazo(t, hoje){
  if (!finAberto(t)) return '';
  const v = String(t.vencimento);
  if (v < hoje) return '<span class="chip fCrit">Vencida</span>';
  if (v === hoje) return '<span class="chip fAtn">Vence hoje</span>';
  if (v <= finIsoMais(hoje, 7)){
    const n = Math.round((new Date(v + 'T12:00') - new Date(hoje + 'T12:00')) / 864e5);
    return '<span class="chip fAtn">Vence em ' + n + ' dia' + (n === 1 ? '' : 's') + '</span>';
  }
  return '';
}

const finOrdValor = o => o && o.col ? o.col + ':' + o.dir : '';

function finOrdOpcoes(cfg){
  const ops = cfg.ordPadrao.col ? [] : [['', cfg.ordPadraoRot || 'Padrão']];
  cfg.colunas.filter(c => c.ord).forEach(c => {
    const [a, z] = c.tipo === 'txt' ? ['A–Z', 'Z–A'] : c.tipo === 'num' || c.tipo === 'int' ? ['▲ menor', '▼ maior'] : ['▲ mais antigo', '▼ mais distante'];
    ops.push([c.k + ':1', c.rot + ' ' + a], [c.k + ':-1', c.rot + ' ' + z]);
  });
  return ops;
}

function finLigar(tela){
  const cfg = FIN_CFG[tela], st = FINF[tela];
  const $ = s => document.getElementById(tela + s);
  const mudou = () => finDesenhar(tela);
  $('Sit').addEventListener('change', e => { st.sit = e.target.value; mudou(); });
  $('Grupo').addEventListener('change', e => { st.grupo = e.target.value; mudou(); });
  $('Pessoa').addEventListener('change', e => { st.pessoa = e.target.value; mudou(); });
  if ($('Tipo')) $('Tipo').addEventListener('change', e => { st.tipo = e.target.value; mudou(); });
  if ($('Hist')) $('Hist').addEventListener('change', e => { st.hist = e.target.value; mudou(); });
  $('Ord').addEventListener('change', e => {
    const [c, d] = String(e.target.value).split(':');
    st.ord = c ? { col: c, dir: Number(d) || 1 } : Object.assign({}, cfg.ordPadrao);
    mudou();
  });
  if ($('Per')) $('Per').addEventListener('click', () => finPeriodoAbrir({
    campos: cfg.campos, per: st.per, aplicar: per => { st.per = per; mudou(); } }));
  $('FiltrosBtn').addEventListener('click', () => {
    st.aberto = !st.aberto;
    $('Barra').classList.toggle('aberta', st.aberto);
    $('FiltrosBtn').setAttribute('aria-expanded', String(st.aberto));
  });
  $('Tags').addEventListener('click', e => {
    const b = e.target.closest('[data-tira]'); if (!b) return;
    const k = b.dataset.tira;
    if ((k === 'os' || k === 'tudo') && tela === 'finre' && FINOS.id){ osSair(); if (k === 'os') return; }
    if (k === 'tudo') finLimpar(tela);
    else if (k === 'busca'){ BUSCA[tela] = ''; const tb = document.getElementById('tbBusca'); if (tb) tb.value = ''; }
    else if (k === 'per') st.per = null;
    else st[k] = '';
    if (k === 'sit') st.sit = 'todas';
    mudou();
  });
  const el = document.getElementById(cfg.elId);
  el.addEventListener('click', e => {
    const o = e.target.closest('[data-col]');
    if (o){
      const c = o.dataset.col;
      st.ord = (st.ord.col === c) ? { col: c, dir: -st.ord.dir } : { col: c, dir: 1 };
      return mudou();
    }
    if (e.target.closest('[data-limpar]')){ finLimpar(tela); return mudou(); }
    const m = e.target.closest('.finMais');
    if (m){
      if (_finMenu && _finMenu._botao === m){ finMenuFechar(false); return; }
      const t = (cfg.lista() || []).find(x => String(x.id) === m.dataset.id);
      if (t) finMenuAbrir(m, cfg.menu(t), it => cfg.acao(it.acao, t));
      return;
    }
    const a = e.target.closest('[data-acao]');
    if (a){
      const t = (cfg.lista() || []).find(x => String(x.id) === a.dataset.id);
      if (t) cfg.acao(a.dataset.acao, t);
    }
  });
  el.addEventListener('scroll', () => finMenuFechar(false), { passive:true });
}

function finLimpar(tela){
  const st = FINF[tela];
  st.sit = 'todas'; st.per = null; st.grupo = ''; st.pessoa = ''; st.tipo = ''; st.hist = '';
  BUSCA[tela] = '';
  const tb = document.getElementById('tbBusca'); if (tb) tb.value = '';
}

function finOpcoes(tela){
  const cfg = FIN_CFG[tela], st = FINF[tela];
  const L = cfg.lista() || [];
  const grupos = new Map();
  L.forEach(t => {
    if (!t.grupo_id && !t.subcategoria_id) return;
    const g = grupos.get(t.grupo_id) || { nome: t.grupo_nome || '—', subs: new Map() };
    if (t.subcategoria_id) g.subs.set(t.subcategoria_id, t.subcategoria_nome || '—');
    grupos.set(t.grupo_id, g);
  });
  const opsG = [['', 'Todas']];
  [...grupos.entries()].sort((a, b) => FIN_COL.compare(a[1].nome, b[1].nome)).forEach(([gid, g]) => {
    opsG.push(['g:' + gid, g.nome]);
    [...g.subs.entries()].sort((a, b) => FIN_COL.compare(a[1], b[1])).forEach(([sid, sn]) => opsG.push(['s:' + sid, '   ' + g.nome + ' / ' + sn]));
  });
  const pessoas = new Map();
  L.forEach(t => { if (t[cfg.pessoaK]) pessoas.set(t[cfg.pessoaK], t[cfg.pessoaNome] || '—'); });
  const opsP = [['', 'Todos']].concat([...pessoas.entries()].sort((a, b) => FIN_COL.compare(a[1], b[1])));
  // um filtro que aponta para quem sumiu da lista deixa de valer
  if (st.grupo && !opsG.some(o => o[0] === st.grupo)) st.grupo = '';
  if (st.pessoa && !opsP.some(o => o[0] === st.pessoa)) st.pessoa = '';
  const pinta = (id, ops, v) => {
    const s = document.getElementById(id); if (!s) return;
    s.innerHTML = ops.map(([k, r]) => '<option value="' + esc(k) + '">' + esc(r) + '</option>').join('');
    s.value = v;
  };
  pinta(tela + 'Grupo', opsG, st.grupo);
  pinta(tela + 'Pessoa', opsP, st.pessoa);
}

function finCasaBase(cfg, st, t, q){
  if (cfg === FIN_CFG.finre && FINOS.id && FINOS.ids && !FINOS.ids.includes(t.id)) return false;   // F11 · só as contas da OS
  if (cfg.hist && !finHistCasa(t, st.hist)) return false;
  if (q && !casa(cfg.busca(t), q)) return false;
  if (st.per){
    if (st.per.campo === 'pag'){ if (!finBaixasNoPer(t, st.per).length) return false; }   // F31 · 99: alguma baixa no período
    else {
    const v = st.per.campo === 'comp' ? String(t.competencia || '').slice(0, 7)
            : st.per.campo === 'nf'   ? String(t.nf_data || '').slice(0, 10)
            : String(t.vencimento || '').slice(0, 10);
    if (!v || v < st.per.de || v > st.per.ate) return false;
    }
  }
  if (st.grupo){
    const [k, id] = st.grupo.split(':');
    if (k === 'g' && String(t.grupo_id) !== id) return false;
    if (k === 's' && String(t.subcategoria_id) !== id) return false;
  }
  if (st.pessoa && String(t[cfg.pessoaK]) !== st.pessoa) return false;
  if (st.tipo === 'fixo' && t.variavel) return false;
  if (st.tipo === 'variavel' && !t.variavel) return false;
  return true;
}

const finHistCasa = (t, h) => h === 'so' ? t.origem === 'sige' : (h === 'com' || t.origem !== 'sige');

function finOrdenar(cfg, L, ord){
  if (!ord || !ord.col) return L.slice();
  const pos = new Map(L.map((t, i) => [t, i]));
  const cmpCol = (c, a, b) => {
    const va = c.val(a), vb = c.val(b);
    if (c.tipo === 'num' || c.tipo === 'int') return (Number(va) || 0) - (Number(vb) || 0);
    if (c.tipo === 'data') return String(va || '') < String(vb || '') ? -1 : String(va || '') > String(vb || '') ? 1 : 0;
    return FIN_COL.compare(String(va || ''), String(vb || ''));
  };
  const col = cfg.colunas.find(c => c.k === ord.col);
  const desempate = cfg.desempate.map(k => cfg.colunas.find(c => c.k === k)).filter(Boolean);
  return L.slice().sort((a, b) => {
    const r = col ? cmpCol(col, a, b) * ord.dir : 0;
    if (r) return r;
    // empate: vencimento e depois o nome, sempre no mesmo sentido — a lista
    // não "pula" de lugar a cada clique
    for (const c of desempate){ const x = cmpCol(c, a, b); if (x) return x; }
    return pos.get(a) - pos.get(b);
  });
}

function finTotais(L){
  const vivos = L.filter(t => !t.anulado);
  return {
    n: L.length, anul: L.length - vivos.length,
    valor: vivos.reduce((s, t) => s + (Number(t.valor) || 0), 0),
    aberto: vivos.reduce((s, t) => s + Math.max(0, Number(t.saldo) || 0), 0)
  };
}

const finPlural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);

function finDesenhar(tela){
  const cfg = FIN_CFG[tela], st = FINF[tela];
  const el = document.getElementById(cfg.elId); if (!el || !st) return;
  const T = cfg.lista();
  if (!T) return;
  finMenuFechar(false);
  const hoje = isoHoje();
  const q = BUSCA[tela] || '';
  const base = T.filter(t => finCasaBase(cfg, st, t, q));
  const L = base.filter(t => finSitCasa(t, st.sit, hoje));

  // "Anuladas (N)" conta as anuladas que casam com os OUTROS filtros (S46)
  const nAnul = base.filter(t => t.anulado).length;
  const optA = document.querySelector('#' + tela + 'Sit option[value="anuladas"]');
  if (optA) optA.textContent = 'Anuladas (' + nAnul + ')';
  const perBtn = document.getElementById(tela + 'Per');
  if (perBtn) perBtn.textContent = (st.per ? finPerTexto(st.per, cfg.campos).replace(/^[^:]+: /, '') : 'Todos') + ' ▾';
  const ordSel = document.getElementById(tela + 'Ord'); if (ordSel) ordSel.value = finOrdValor(st.ord);
  const sitSel = document.getElementById(tela + 'Sit'); if (sitSel) sitSel.value = st.sit;
  const histSel = document.getElementById(tela + 'Hist'); if (histSel) histSel.value = st.hist;

  // etiquetas: ninguém pode achar que a lista está vazia por um filtro esquecido
  const tags = [];
  const rotSel = (id) => { const s = document.getElementById(id); return s && s.selectedIndex >= 0 ? s.options[s.selectedIndex].textContent.trim() : ''; };
  if (tela === 'finre' && FINOS.id) tags.push(['os', 'OS: ' + osRot()]);
  if (q) tags.push(['busca', 'Busca: “' + q + '”']);
  if (st.sit !== 'todas') tags.push(['sit', 'Situação: ' + rotSel(tela + 'Sit').replace(/\s*\(\d+\)$/, '')]);
  if (st.per) tags.push(['per', finPerTexto(st.per, cfg.campos)]);
  if (st.tipo) tags.push(['tipo', 'Valor: ' + rotSel(tela + 'Tipo')]);
  if (st.hist) tags.push(['hist', st.hist === 'so' ? 'Só o histórico do SIGE' : 'Com o histórico do SIGE']);
  if (st.grupo) tags.push(['grupo', 'Categoria: ' + rotSel(tela + 'Grupo')]);
  if (st.pessoa) tags.push(['pessoa', cfg.pessoaRot + ': ' + rotSel(tela + 'Pessoa')]);
  const tagsEl = document.getElementById(tela + 'Tags');
  tagsEl.innerHTML = tags.map(([k, txt]) => '<span class="tfChip">' + esc(txt)
      + '<button type="button" data-tira="' + k + '" aria-label="Tirar este filtro">×</button></span>').join('')
    + (tags.length ? '<button type="button" class="tfLimpa" data-tira="tudo">Limpar filtros</button>' : '');
  tagsEl.classList.toggle('on', tags.length > 0);
  const fb = document.getElementById(tela + 'FiltrosBtn');
  if (fb) fb.textContent = 'Filtros' + (tags.filter(t => t[0] !== 'busca').length ? ' (' + tags.filter(t => t[0] !== 'busca').length + ')' : '') + (st.aberto ? ' ▴' : ' ▾');

  // S59: só conta o histórico que apareceria com os OUTROS filtros (em "Em aberto",
  // o histórico, todo pago, não apareceria — e o aviso confundiria)
  const nHist = cfg.hist && !st.hist ? T.filter(t => t.origem === 'sige' && finCasaBase(cfg, Object.assign({}, st, { hist: 'so' }), t, q) && finSitCasa(t, st.sit, hoje)).length : 0;
  document.getElementById(tela + 'Resumo').innerHTML = cfg.resumo(L, st)
    + (nHist ? ' <span class="finHistNota">· ' + finPlural(nHist, 'título', 'títulos') + ' do histórico do SIGE (fev a set/2026) fora da lista — <button type="button" id="' + tela + 'HistVer">mostrar</button></span>' : '');
  const hv = document.getElementById(tela + 'HistVer');
  if (hv) hv.addEventListener('click', () => { st.hist = 'com'; finDesenhar(tela); });

  if (!L.length){
    el.innerHTML = '<div class="vazio2">' + (T.length
      ? '<b>Nada com esses filtros</b><p>' + (st.sit === 'todas' && nAnul && base.length === nAnul
          ? 'Só há ' + finPlural(nAnul, 'anulada', 'anuladas') + ' — escolha “Anuladas” em Situação para ver. '
          : finPlural(T.length, cfg.unidade[0], cfg.unidade[1]) + ' ficaram de fora por causa dos filtros. ')
        + '<button type="button" class="tfLimpa" data-limpar="1">Limpar filtros</button></p>'
      : '<b>' + esc(cfg.vazio) + '</b><p>Use o botão acima para lançar.</p>') + '</div>';
    return;
  }

  const O = finOrdenar(cfg, L, st.ord);
  const cab = '<div class="ccLin fin6 cab finCab">' + cfg.colunas.map(c => {
      if (!c.ord) return '<span' + (c.n ? ' class="n"' : '') + '>' + esc(c.rot || '') + '</span>';
      const ativo = st.ord.col === c.k;
      const seta = ativo ? (st.ord.dir > 0 ? '▲' : '▼') : '';
      return '<span' + (c.n ? ' class="n"' : '') + ' aria-sort="' + (ativo ? (st.ord.dir > 0 ? 'ascending' : 'descending') : 'none') + '">'
        + '<button type="button" class="finOrd' + (ativo ? ' on' : '') + '" data-col="' + c.k + '" title="Ordenar por ' + esc(c.rot.toLowerCase()) + '">'
        + esc(c.rot) + '<i aria-hidden="true">' + seta + '</i></button></span>';
    }).join('') + '</div>';

  // grupos por mês: só enquanto a ordem é por vencimento (item 3, ponto 5)
  const agrupa = cfg.agrupa && st.ord.col === 'venc';
  let h = '', mesAtual = null, i = 0;
  const grupos = agrupa ? (() => {
    const m = new Map();
    O.forEach(t => { const k = String(t.vencimento).slice(0, 7); (m.get(k) || m.set(k, []).get(k)).push(t); });
    return m;
  })() : null;
  O.forEach(t => {
    if (agrupa){
      const k = String(t.vencimento).slice(0, 7);
      if (k !== mesAtual){
        mesAtual = k; i = 0;
        const tt = finTotais(grupos.get(k));
        h += '<div class="finMes"><b>' + esc(FIN_MESES_LONGO[Number(k.slice(5, 7)) - 1] + '/' + k.slice(0, 4)) + '</b>'
          + '<span>' + (st.sit === 'anuladas'
              ? finPlural(tt.n, 'anulado', 'anulados')
              : finPlural(tt.n - tt.anul, cfg.unidade[0], cfg.unidade[1]) + ' · valor ' + esc(BRL(tt.valor)) + ' · em aberto ' + esc(BRL(tt.aberto))
                + (tt.anul ? ' · ' + finPlural(tt.anul, 'anulado', 'anulados') : ''))
          + '</span></div>';
      }
    }
    h += cfg.linha(t, hoje, (i++ % 2) ? ' par' : '');
  });
  el.innerHTML = cab + h;
  // o título do mês gruda logo abaixo do cabeçalho das colunas
  const c = el.querySelector('.finCab');
  el.style.setProperty('--cabH', (c && c.offsetHeight ? c.offsetHeight : 0) + 'px');
  finAjustarAltura(el);
}

function finAjustarAltura(el){
  if (!el || window.innerWidth <= 700){ if (el) el.style.maxHeight = ''; return; }
  // topo da lista na PÁGINA (não na janela), menos o pé da .tela (34) e do <main> (16)
  const topo = el.getBoundingClientRect().top + (window.scrollY || 0);
  el.style.maxHeight = Math.max(240, Math.floor(window.innerHeight - topo - 52)) + 'px';
}

let _finMenu = null;

function finMenuFechar(devolverFoco){
  if (!_finMenu) return;
  const b = _finMenu._botao;
  _finMenu.remove(); _finMenu = null;
  if (b){ b.setAttribute('aria-expanded', 'false'); if (devolverFoco) try{ b.focus(); }catch(e){} }
}

function finMenuAbrir(botao, itens, escolher){
  finMenuFechar(false);
  if (!itens.length) return;
  const m = document.createElement('div');
  m.className = 'finMenu'; m.setAttribute('role', 'menu');
  // F5: {sep:true} desenha um traço; {off:'motivo'} é item travado (fica à vista, explica e não executa)
  m.innerHTML = itens.map((it, i) => it.sep ? '<hr role="separator">'
    : '<button type="button" role="menuitem" tabindex="-1" data-i="' + i + '"'
      + ' class="' + [it.perigo ? 'perigo' : '', it.off ? 'off' : '', it.cls || ''].filter(Boolean).join(' ') + '"'
      + (it.off ? ' aria-disabled="true" title="' + esc(it.off) + '"' : '') + '>' + esc(it.rot)
      + (it.off ? '<small>' + esc(it.off) + '</small>' : '') + '</button>').join('');
  document.body.appendChild(m);
  _finMenu = m; m._botao = botao;
  botao.setAttribute('aria-expanded', 'true');
  const r = botao.getBoundingClientRect();
  const larg = m.offsetWidth, alt = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - larg, window.innerWidth - larg - 8)) + 'px';
  let topo = r.bottom + 4;
  if (topo + alt > window.innerHeight - 8) topo = Math.max(8, r.top - alt - 4);
  m.style.top = topo + 'px';
  const bts = [...m.querySelectorAll('[role=menuitem]')];
  bts[0].focus();
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const it = itens[Number(b.dataset.i)];
    finMenuFechar(false);
    if (it.off){ toast(it.off, 'err'); return; }
    escolher(it);
  });
  m.addEventListener('keydown', e => {
    const i = bts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); bts[(i + 1) % bts.length].focus(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); bts[(i - 1 + bts.length) % bts.length].focus(); }
    else if (e.key === 'Home'){ e.preventDefault(); bts[0].focus(); }
    else if (e.key === 'End'){ e.preventDefault(); bts[bts.length - 1].focus(); }
    else if (e.key === 'Tab'){ finMenuFechar(false); }
  });
}

document.addEventListener('click', e => {
  if (_finMenu && !_finMenu.contains(e.target) && !(e.target.closest && e.target.closest('.finMais'))) finMenuFechar(false);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && _finMenu){ e.stopPropagation(); e.preventDefault(); finMenuFechar(true); }
}, true);

window.addEventListener('resize', () => finMenuFechar(false));

  }
};

function finrePrimaria(t){
  const n = nfDe(t);   // TapFin 3: nota em andamento pede "Atualizar"; a faturar, "Emitir nota"
  if (n && (n.situacao === 'emitindo' || n.situacao === 'cancelando')) return { acao:'nfatualizar', rot:'Atualizar nota' };
  if (jfTemNota(t)) return { acao:'jafaturada', rot:'Já tem nota' };   // TapFin 7: a nota foi emitida fora
  const bo = boDe(t);   // boleto: emitindo pede "Atualizar"; faturado, com saldo, previsto em boleto e sem boleto valendo: "Emitir boleto"
  if (bo && bo.situacao === 'emitindo') return { acao:'boatualizar', rot:'Atualizar boleto' };
  if (t.etapa === 'a_faturar') return FINNF.ativo ? { acao:'emitir', rot:'Emitir nota' } : { acao:'faturar', rot:'Preparar nota' };
  if (FINBO.ativo && Number(t.saldo) >= 2.5 && !boVivo(t) && t.forma_prevista === 'Boleto') return { acao:'boemitir', rot:'Emitir boleto' };
  if (Number(t.saldo) > 0) return { acao:'baixar', rot:'Baixar' };
  return { acao:'baixas', rot:'Baixas' };
}

function finreMenu(t){
  const p = finrePrimaria(t).acao;
  const n = nfDe(t), viva = nfViva(t), bo = boDe(t), bv = boVivo(t);
  const M = [];
  // o boleto valendo se cancela pelo topo do menu, em vermelho (só com o clique: o TapFin nunca cancela sozinho)
  if (bv && bo.codigo) M.push({ acao:'bocancelar', rot:'Cancelar boleto', perigo:true, cls:'topo' }, { sep:true });
  // F5: a nota emitida se cancela pelo topo do menu, em vermelho, longe do "Anular"
  if (n && n.situacao === 'autorizada') M.push({ acao:'nfcancelar', rot:'Cancelar nota fiscal', perigo:true, cls:'topo' }, { sep:true });
  M.push({ acao:'editar', rot:'Editar' });
  // F19 · item 29 (522): a conta que já tem nota vira parcelas, cada uma com o seu boleto
  if (t.etapa === 'faturado' && !t.anulado && !finEhParcela(t) && !finTemBaixa(t) && !t.tem_parcelas)
    M.push(bv ? { acao:'dividir', rot:'Dividir em parcelas', off:'Cancele o boleto primeiro' } : { acao:'dividir', rot:'Dividir em parcelas' });
  // F20 · item 30 (523): as parcelas da mesma nota (ajustar e "Emitir todos os boletos")
  if (t.etapa === 'faturado' && !t.anulado && (t.tem_parcelas || t.dividido_de)) M.push({ acao:'parcelas', rot:'Parcelas da nota' });
  // F27 · issue 98 (525): a conta com nota muda o vencimento (prorrogação), sem baixa e sem boleto valendo
  if (t.etapa === 'faturado' && !t.anulado && !finTemBaixa(t) && Number(t.saldo) > 0)
    M.push(bv ? { acao:'vencimento', rot:'Mudar o vencimento', off:'Cancele o boleto primeiro' } : { acao:'vencimento', rot:'Mudar o vencimento' });
  if (p !== 'baixar' && Number(t.saldo) > 0) M.push({ acao:'baixar', rot:'Baixar' });
  if (p !== 'baixas') M.push({ acao:'baixas', rot:'Baixas' });
  if (FINJF.ativo && !t.anulado){   // TapFin 7
    if (t.etapa === 'a_faturar' && p !== 'jafaturada') M.push({ acao:'jafaturada', rot:'Já tem nota: marcar como faturada' });
    if (p === 'jafaturada') M.push(FINNF.ativo ? { acao:'emitir', rot:'Emitir nota (nova)' } : { acao:'faturar', rot:'Preparar nota' });
    if (FINJF.marcados.has(t.id)) M.push({ acao:'jadesfazer', rot:'Desfazer: voltar para A faturar' });
  }
  if (FINNF.ativo){
    if (t.etapa === 'a_faturar' && p !== 'faturar') M.push({ acao:'faturar', rot:'Preparar nota (manual, no portal)' });
    M.push({ acao:'pedido', rot:'Pedido de compra' });
    if (n) M.push({ acao:'notas', rot:'Notas fiscais' });
  }
  if (FINBO.ativo){
    if (p !== 'boemitir' && !bv && Number(t.saldo) >= 2.5) M.push({ acao:'boemitir', rot:'Emitir boleto' });
    if (bv && bo.linha_digitavel) M.push({ acao:'bolinha', rot:'Copiar linha digitável' }, { acao:'bopix', rot:'Copiar Pix copia-e-cola' });
    if (bo) M.push({ acao:'boletos', rot:'Boletos' });
  }
  M.push({ sep:true });
  // F5: título com nota viva não se anula (o banco também recusa: 505)
  M.push(viva ? { acao:'anular', rot:'Anular', off:'Cancele a nota primeiro' }
       : bv ? { acao:'anular', rot:'Anular', off:'Cancele o boleto primeiro' } : { acao:'anular', rot:'Anular', perigo:true });
  return M;
}

function finreAcao(a, t){
  if (a === 'jafaturada') return modalJaFaturada(t);
  if (a === 'jadesfazer') return jfDesfazer(t);
  if (a === 'emitir') return modalEmitirNota(t);
  if (a === 'notas') return modalNotasTitulo(t);
  if (a === 'nfcancelar'){ const n = nfDe(t); if (n && n.situacao === 'autorizada') return modalCancelarNota(t, n); return; }
  if (a === 'pedido') return modalPedidoCompra(t);
  if (a === 'nfatualizar'){ const n = nfDe(t); if (n) return nfExecutar(() => nfFuncao({ acao: 'consultar', titulo_id: t.id, nfse_id: n.id }), 'consultar', 'Consultando a nota…'); return; }
  if (a === 'faturar') return modalPrepararNota(t);
  if (a === 'boemitir') return modalEmitirBoleto(t);
  if (a === 'boletos') return modalBoletosTitulo(t);
  if (a === 'bocancelar'){ const b = boDe(t); if (b) return modalCancelarBoleto(t, b); return; }
  if (a === 'boatualizar'){ const b = boDe(t); if (b) return boExecutar(() => boFuncao({ acao: 'consultar', boleto_id: b.id }), 'Consultando o boleto no Inter…', boResultado); return; }
  if (a === 'bolinha'){ const b = boDe(t); if (b) copiar(b.linha_digitavel, 'Linha digitável copiada.'); return; }
  if (a === 'bopix'){ const b = boDe(t); if (b) copiar(b.pix_copia_cola, 'Pix copia-e-cola copiado.'); return; }
  if (a === 'baixar'){ if (boVivo(t)) return boAntesDaBaixa(t).then(ok => ok && modalBaixarTitulo(t, finreCarregar)); return modalBaixarTitulo(t, finreCarregar); }
  if (a === 'baixas') return modalVerBaixas(t, finreCarregar);
  if (a === 'anular') return modalAnularTitulo(t);
  if (a === 'editar') return modalTituloReceber(t);
  if (a === 'dividir') return modalDividirTitulo(t);
  if (a === 'parcelas') return modalParcelasNota(t);
  if (a === 'vencimento') return modalMudarVencimento(t);
}

/** F27 · issue 98 (525): "Mudar o vencimento" da conta que já tem nota (o cliente pediu mais prazo). Valor e competência

    +  '<div class="campo"><label>Vencimento de hoje</label><input type="text" value="' + esc(dataBR(t.vencimento)) + '" readonly></div>'
    +  '<div class="campo"><label for="mvData">Nova data</label><input id="mvData" type="date" min="' + esc(_diaDe(Date.now())) + '" value="' + esc(R.data || '') + '"></div></div>'
    + '<div class="campo"><label for="mvMot">Motivo (vai ao histórico)</label><input id="mvMot" type="text" maxlength="300" autocomplete="off" placeholder="Ex.: Cliente pediu mais 15 dias" value="' + esc(R.motivo || '') + '"></div>'
    + (t.dividido_de || t.tem_parcelas ? '<p class="nota">Esta conta é uma parcela da nota: muda só esta parcela. Para mexer em todas de uma vez, “Parcelas da nota”.</p>' : ''),

// ════════════════════════════════════════════════════════════════════════════
// F20 · ITEM 30 DA LISTA: CONDIÇÃO DE PAGAMENTO (523)
// ----------------------------------------------------------------------------
// Regra do Bruno (10/11): sempre UMA nota do total e um boleto por parcela. A conta da OS
// nasce com a condição (30/60, 0/30/60; 0 = no ato), sugerida pelo cliente (Prazos de
// Recebimento). Quando a nota sai (Emitir nota, Já tem nota), o banco divide sozinho
// (gatilho fin_titulos_zz_condicao): partes iguais, a última leva o centavo, vencimento =
// data da nota + os dias. "Parcelas da nota" ajusta valor e data (sem boleto nem baixa, B5)
// e "Emitir todos os boletos" emite um por vez, sempre com clique (B7).
// ════════════════════════════════════════════════════════════════════════════
const CONDICOES_SUG = ['30', '45', '60', '30/60', '0/30', '0/30/60', '28/56/84', '15/30/45/60', '0/15/30'];   // F34 · 238 (M3): +15/30/45/60 e 0/15/30
/** Os dias da condição ([] = vazia; null = escrita errada). A mesma regra do banco (tf__fin_condicao_dias). */
function condDias(c){
  const s = String(c == null ? '' : c).trim().replace(/\s*(dias|dia|d)\s*$/i, '');
  if (!s) return [];
  const a = s.split(/\s*[\/,;]\s*|\s+/).filter(Boolean);
  if (!a.length || a.some(x => !/^\d{1,3}$/.test(x))) return null;
  const d = a.map(Number);
  if (d.length > 12 || d.some(x => x > 365) || d.some((x, i) => i && x <= d[i - 1])) return null;
  return d;
}
const condTexto = d => d.map(x => x === 0 ? 'no ato' : x + ' dias').join(', ');
// ── F34 · issue 238 (529): a condição na janela da nota (M1), no "Editar" e na conta criada fora da OS (M2)
// e o chip em toda conta "A faturar" (M4). Trocar grava pela tf_fin_titulo_condicao_gravar (histórico da conta);
// só antes da nota, sem baixa e sem boleto; a conta de medição de contrato fica fora (B6).
const COND_CLI = { ok: false, mapa: {} };   // cliente → condição (só os que não estão no padrão de 30 dias)
async function condCarregar(){
  try{
    const L = await rpc('tf_fin_prazos_listar', {});
    COND_CLI.mapa = {}; (L || []).forEach(c => { COND_CLI.mapa[c.id] = String(c.condicao || c.prazo || '30'); });
    COND_CLI.ok = true;
  }catch(e){ COND_CLI.ok = false; }   // sem a lista, o chip mostra só a condição gravada na conta
}
const condCanon = c => { const d = condDias(c); return d && d.length ? d.join('/') : ''; };
const condCliente = t => (t && COND_CLI.mapa[t.cliente_id]) || '30';
/** Pode trocar a condição desta conta? (o banco confere de novo) */
const FINCOND = { ativo: true };   // false quando o banco ainda não tem a 529 (a tela cai no jeito de antes)
const condPodeTrocar = t => FINCOND.ativo && !!t && !t.anulado && t.etapa === 'a_faturar' && !t.medicao_id && !finTemBaixa(t) && !boVivo(t);
/** A condição que vale hoje: a da conta ou, sem ela, a do cliente. */
const condAtual = t => t && t.condicao ? { cond: condCanon(t.condicao) || t.condicao, de: 'da conta' } : { cond: condCanon(condCliente(t)) || '30', de: 'do cliente' };
const condRot = c => { const d = condDias(c) || []; return d.length === 1 ? (d[0] ? d[0] + ' dias' : 'no ato') : c; };
function condChip(t){
  if (!t || t.anulado || t.etapa !== 'a_faturar' || t.medicao_id) return '';
  if (!t.condicao && !COND_CLI.ok) return '';
  const a = condAtual(t), d = condDias(a.cond) || [];
  return ' <span class="chip" title="Condição de pagamento (' + esc(a.de) + '): ' + esc(condTexto(d)) + ' depois da nota. Quando a nota sair, '
    + (d.length > 1 ? 'a conta se divide em ' + d.length + ' parcelas' : 'o vencimento sai pela condição') + '.">Cond. ' + esc(condRot(a.cond)) + '</span>';
}
/** M1: a linha "Condição: … · trocar" das janelas da nota. ini = o que a janela reabriu com (rascunho). */
function condLinhaNota(t, ini, valorNota){
  if (!t || t.medicao_id || t.etapa !== 'a_faturar') return '';
  const a = condAtual(t), v = ini != null ? ini : a.cond, mudou = ini != null && condCanon(ini) !== condCanon(a.cond);
  const pode = condPodeTrocar(t);
  return '<div class="campo" id="ncBloco" data-ini="' + esc(a.cond) + '">'
    + '<div class="nota" style="margin:0 0 4px">Condição de pagamento: <b id="ncAtual">' + esc(condRot(mudou ? condCanon(ini) : a.cond)) + '</b> '
    +   '<span id="ncDe">(' + esc(mudou ? 'trocada aqui' : a.de) + ')</span>'
    +   (pode ? ' · <a href="#" id="ncTrocar">trocar</a>' : (finTemBaixa(t) ? ' <small>(com baixa: não muda)</small>' : boVivo(t) ? ' <small>(com boleto: não muda)</small>' : '')) + '</div>'
    + (pode ? '<div id="ncEdita"' + (mudou ? '' : ' hidden') + '>'
        + '<input id="ncCond" type="text" inputmode="numeric" autocomplete="off" placeholder="15/30/45/60" value="' + esc(v) + '">'
        + condBotoes('ncCond') + '</div>' : '')
    + '<p class="nota" id="ncPrev" style="margin:6px 0 0">' + condPrevia(mudou ? ini : a.cond, valorNota) + '</p>'
    + '</div>';
}
/** Liga o "trocar" e a prévia (depois de abrir a janela). aoMudar(dias) avisa a janela (o vencimento do Preparar). */
function condLigarNota(t, valorNota, aoMudar){
  const tr = document.getElementById('ncTrocar'), ed = document.getElementById('ncEdita'), el = document.getElementById('ncCond');
  if (!el){ if (aoMudar && document.getElementById('ncBloco')) aoMudar(condDias(condAtual(t).cond)); return; }
  const prev = () => {
    const p = document.getElementById('ncPrev'); if (p) p.innerHTML = condPrevia(el.value, valorNota);
    const d = condDias(el.value), at = document.getElementById('ncAtual'), de = document.getElementById('ncDe');
    const ini = document.getElementById('ncBloco').dataset.ini;
    if (at && d && d.length) at.textContent = condRot(d.join('/'));
    if (de && d && d.length) de.textContent = '(' + (d.join('/') === condCanon(ini) ? condAtual(t).de : 'trocada aqui') + ')';
    if (aoMudar) aoMudar(d);
  };
  if (tr) tr.addEventListener('click', e => { e.preventDefault(); ed.hidden = false; el.focus(); prev(); });
  el.addEventListener('input', prev);
  prev();
}
/** Lê o campo da janela: undefined = nada a gravar; null = escrita errada; texto = a condição a gravar ('' volta à do cliente). */
function condLidaNota(t){
  const el = document.getElementById('ncCond'); if (!el) return condAuto(t);
  const v = el.value.trim();
  if (!v) return t.condicao ? '' : undefined;
  if (condDias(v) === null) return null;
  const c = condCanon(v);
  if (c === condCanon(t.condicao || '')) return undefined;
  if (!t.condicao && c === condCanon(condCliente(t)) && (condDias(c) || []).length < 2) return undefined;   // a do cliente, de um prazo só: o banco já usa
  return c;
}
/** Sem mexer: a conta sem condição de um cliente que paga em parcelas recebe a do cliente (senão a nota não dividiria). */
function condAuto(t){
  if (!t || t.condicao || t.medicao_id || !condPodeTrocar(t)) return undefined;
  const c = condCanon(condCliente(t));
  return (condDias(c) || []).length > 1 ? c : undefined;
}
/** Grava a condição lida (antes da nota). Devolve false se não deu (o motivo já foi mostrado). */
async function condGravarAntes(t, c, auto){
  if (c === undefined) return true;
  try{
    const r = await rpc('tf_fin_titulo_condicao_gravar', { p_titulo_id: t.id, p_condicao: c });
    t.condicao = (r && r.condicao) || null;
    return true;
  }catch(e){
    const falta = /does not exist|não existe|PGRST202|Could not find the function/i.test(e.message || '');
    if (falta) FINCOND.ativo = false;
    if (falta && auto) return true;   // sem a 529, a nota segue como antes (sem a troca automática)
    toast((falta ? 'Trocar a condição aqui precisa de uma atualização do sistema: avise o administrador.' : e.message) + ' A nota não saiu.', 'err');
    return false;
  }
}
// (F34: o antigo condAvisoNota virou a linha "Condição … · trocar" das janelas da nota, condLinhaNota)
function condPrevia(c, valor){
  const d = condDias(c);
  if (d === null) return '<small class="finTrava">Escreva os dias separados por barra, crescendo: 30/60, 0/30/60 (0 = no ato).</small>';
  if (!d.length) return '';
  const tot = Math.round((Number(valor) || 0) * 100), n = d.length, base = Math.floor(tot / n), resto = tot - base * n;
  if (n === 1) return 'Uma parcela: vence ' + (d[0] ? d[0] + ' dias depois da nota' : 'no dia da nota') + '.';
  return esc(n + ' parcelas' + (tot ? ' de ' + BRL(base / 100) + (resto ? ' (a última ' + BRL((base + resto) / 100) + ')' : '') : '')
    + ': ' + condTexto(d) + ' depois da nota.') + ' <b>Uma nota só, do total; um boleto por parcela.</b>';
}

/** As parcelas da mesma nota: ajustar valor e data (B5) e emitir todos os boletos (B7). */
async function modalParcelasNota(t){
  let P;
  try{ P = await rpc('tf_fin_parcelas_ver', { p_titulo_id: t.id }); }catch(e){ toast(e.message, 'err'); return; }
  const L = P.parcelas || [];
  const travada = L.some(x => x.tem_baixa || x.boleto_vivo);
  const semBoleto = L.filter(x => !x.boleto_vivo && !x.tem_baixa && Number(x.saldo) >= 2.5);
  const totalC = L.reduce((a, x) => a + Math.round(Number(x.valor) * 100), 0);
  const nf = P.nf_numero ? 'NF ' + nfNumero({ numero: P.nf_numero }) : 'a nota';
  const btns = [{ label: 'Fechar', onClick: fecharModal }];
  if (!travada) btns.push({ label: 'Gravar ajustes', onClick: async () => {
    const itens = L.map((x, i) => ({ id: x.id, valor: Number((document.getElementById('pnV' + i) || {}).value),
                                    vencimento: ((document.getElementById('pnD' + i) || {}).value || '').trim() }));
    if (itens.some(x => !(x.valor > 0))){ toast('Informe o valor de cada parcela.', 'err'); return; }
    if (itens.some(x => !x.vencimento)){ toast('Informe o vencimento de cada parcela.', 'err'); return; }
    const somaC = itens.reduce((a, x) => a + Math.round(x.valor * 100), 0);
    if (somaC !== totalC){ toast('A soma das parcelas (' + BRL(somaC / 100) + ') tem de continuar ' + BRL(totalC / 100) + '.', 'err'); return; }
    try{
      const res = await rpc('tf_fin_parcelas_ajustar', { p_titulo_id: t.id, p_parcelas: itens });
      fecharModal(); toast(Number(res && res.alteradas) ? 'Parcelas ajustadas.' : 'Nada mudou.', 'ok'); await finreCarregar();
    }catch(e){ toast(e.message, 'err'); }
  }});
  if (FINBO.ativo && semBoleto.length) btns.push({ label: 'Emitir todos os boletos (' + semBoleto.length + ')', pri: true, onClick: () => { fecharModal(); boEmitirTodos(P); } });
  abrirModal('Parcelas da nota — ' + finTituloRot(t),
      '<p class="nota" style="margin:0 0 10px">' + esc(nf) + (P.nf_data ? ' de ' + esc(dataBR(P.nf_data)) : '') + ' · total ' + esc(BRL(totalC / 100))
    + (P.condicao ? ' · condição ' + esc(P.condicao) : '') + '. Uma nota só; um boleto por parcela.</p>'
    + L.map((x, i) => '<div class="dupla">'
        + '<div class="campo"><label for="pnV' + i + '">Parcela ' + (i + 1) + ' · valor' + (x.boleto_vivo ? ' (com boleto)' : x.tem_baixa ? ' (com baixa)' : '') + '</label>'
        +   '<input id="pnV' + i + '" type="number" step="0.01" min="0.01" value="' + esc(Number(x.valor).toFixed(2)) + '"' + (travada ? ' disabled' : '') + '></div>'
        + '<div class="campo"><label for="pnD' + i + '">Vencimento</label>'
        +   '<input id="pnD' + i + '" type="date" value="' + esc(String(x.vencimento || '').slice(0, 10)) + '"' + (travada ? ' disabled' : '') + '></div></div>').join('')
    + '<p class="nota" id="pnSoma" style="margin:4px 0 0"></p>'
    + (travada ? '<small class="finTrava">Valor e data não se ajustam mais: há parcela com boleto valendo ou com baixa.</small>'
               : '<p class="nota" style="margin:4px 0 0">Mudou valor ou data? “Gravar ajustes” antes de emitir os boletos.</p>'),
    btns);
  const somar = () => {
    const el = document.getElementById('pnSoma'); if (!el) return;
    const c = L.reduce((a, x, i) => a + Math.round(Number((document.getElementById('pnV' + i) || {}).value || 0) * 100), 0);
    el.innerHTML = 'Soma ' + esc(BRL(c / 100)) + (c === totalC ? ' ✓' : ' · <b>tem de dar ' + esc(BRL(totalC / 100)) + '</b>');
  };
  L.forEach((x, i) => { const el = document.getElementById('pnV' + i); if (el) el.addEventListener('input', somar); });
  somar();
}

/** B7: um boleto por parcela, um por vez (o Inter limita as chamadas), sempre depois do clique. */
async function boEmitirTodos(P){
  const L = (P.parcelas || []).filter(x => !x.boleto_vivo && !x.tem_baixa && Number(x.saldo) >= 2.5);
  if (!L.length){ toast('Todas as parcelas já têm boleto.', 'ok'); return; }
  const ok = await confirmar('Emitir ' + L.length + ' boleto' + (L.length > 1 ? 's' : '') + '?',
      '<p style="margin-top:0">Um boleto por parcela, com o valor e o vencimento de cada uma (mensagem padrão de “Boleto ⚙”):</p>'
    + '<ul class="nfAvisos">' + L.map(x => '<li>' + esc(BRL(x.saldo)) + ' · vence ' + esc(dataBR(x.vencimento)) + '</li>').join('') + '</ul>'
    + '<p class="nota">Saem um por vez, no Inter. Depois de emitido, cada boleto só se desfaz por cancelamento (no ⋯ da parcela).</p>', 'Emitir');
  if (!ok) return;
  const res = [];
  abrirModal('Emitindo os boletos…', '<p id="boTodosMsg" style="margin:6px 0">Começando… não feche a página.</p>', []);
  for (let i = 0; i < L.length; i++){
    const x = L[i], el = document.getElementById('boTodosMsg');
    if (el) el.textContent = 'Boleto ' + (i + 1) + ' de ' + L.length + ' (' + BRL(x.saldo) + ', vence ' + dataBR(x.vencimento) + ')… não feche a página.';
    try{
      const prep = await rpc('tf_fin_boleto_preparar', { p_titulo_id: x.id, p_opcoes: {} });
      if (!prep.pode_emitir){ res.push({ x, ok: false, msg: (prep.erros || []).join(' ') || 'não pode ser emitido' }); continue; }
      const j = await boFuncao({ acao: 'emitir', titulo_id: x.id, opcoes: {} });
      const emitido = j.situacao === 'a_receber' || j.situacao === 'atrasado';
      res.push({ x, ok: emitido, msg: j.situacao === 'falha' ? 'o Inter recusou: ' + (j.motivo || 'sem detalhe') : (j.aviso || BO_SIT[j.situacao] || j.situacao) });
    }catch(e){
      res.push({ x, ok: false, msg: e.message });
      if (/esperar/i.test(e.message)) break;   // o Inter pediu para esperar (429): para aqui
    }
  }
  fecharModal(); await finreCarregar();
  const feitos = res.filter(r => r.ok).length, faltam = L.length - res.length;
  abrirModal('Boletos: ' + feitos + ' de ' + L.length + ' emitido' + (feitos === 1 ? '' : 's'),
      '<ul class="' + (feitos === L.length ? 'nfAvisos' : 'nfErros') + '">' + res.map(r => '<li>' + esc(BRL(r.x.saldo)) + ' · vence '
        + esc(dataBR(r.x.vencimento)) + ': ' + (r.ok ? 'emitido' : esc(r.msg)) + '</li>').join('') + '</ul>'
    + (faltam ? '<p class="nota">' + faltam + ' ficaram para depois (o Inter pediu para esperar). Em 1 minuto, abra “Parcelas da nota” de novo e emita os que faltam.</p>' : '')
    + '<p class="nota">Linha digitável, Pix e PDF de cada boleto: na linha de cada parcela.</p>',
    [{ label: 'Fechar', pri: true, onClick: fecharModal }]);
}

// F19 · ITEM 29 DA LISTA: DIVIDIR EM PARCELAS A CONTA QUE JÁ TEM NOTA (522)
// ----------------------------------------------------------------------------
// O cliente paga em 30/60 dias por boleto, mas a conta nasceu com 1 parcela e a nota
// saiu do total. A parcela 1 é a própria conta (fica com a nota); as outras nascem com a
// mesma nota. Cada uma tem o seu "Emitir boleto" (código NF154-01, NF154-02…).
// O banco confere tudo de novo (tf_fin_titulo_dividir): soma, datas, baixa e boleto.
// ════════════════════════════════════════════════════════════════════════════
const finEhParcela = t => /parcela\s+\d{1,2}\s*\/\s*\d{1,2}\s*$/i.test(String((t && t.descricao) || ''));

function modalDividirTitulo(t, rasc){
  const totalC = Math.round(Number(t.valor) * 100);
  const sugerir = n => {
    const base = Math.floor(totalC / n);
    return Array.from({ length: n }, (_, i) => ({
      valor: ((base + (i === n - 1 ? totalC - base * n : 0)) / 100).toFixed(2),
      venc: finSomaDias(t.vencimento, 30 * i) }));
  };
  const d = Object.assign({ n: 2, linhas: null,
    uid: (crypto.randomUUID && crypto.randomUUID()) || ('dv-' + Date.now() + '-' + Math.random().toString(16).slice(2)) }, rasc || {});
  if (!d.linhas || d.linhas.length !== d.n) d.linhas = sugerir(d.n);
  const nf = t.nf_numero ? 'NF ' + nfNumero({ numero: t.nf_numero }) : 'a nota';
  const linhasHtml = L => L.map((l, i) => '<div class="dupla">'
      + '<div class="campo"><label for="dvV' + i + '">Parcela ' + (i + 1) + ' · valor</label><input id="dvV' + i + '" type="number" step="0.01" min="0.01" value="' + esc(l.valor) + '"></div>'
      + '<div class="campo"><label for="dvD' + i + '">Vencimento</label><input id="dvD' + i + '" type="date" value="' + esc(l.venc) + '"></div></div>').join('');
  abrirModal('Dividir em parcelas — ' + finTituloRot(t),
      '<p class="nota" style="margin:0 0 10px">Valor da conta <b>' + esc(BRL(t.valor)) + '</b> · ' + esc(nf) + '. '
    + 'A parcela 1 continua sendo esta conta (fica com a nota); as outras nascem com a mesma nota. '
    + 'Depois, em cada parcela: <b>Emitir boleto</b>.</p>'
    + '<div class="campo"><label for="dvN">Quantas parcelas</label><select id="dvN">'
    +   Array.from({ length: 11 }, (_, i) => '<option value="' + (i + 2) + '"' + (i + 2 === d.n ? ' selected' : '') + '>' + (i + 2) + '</option>').join('')
    + '</select><div class="dica">Sugestão: partes iguais, a cada 30 dias a partir do vencimento de hoje. Pode mudar valor e data.</div></div>'
    + mbCorpo('<div id="dvLinhas">' + linhasHtml(d.linhas) + '</div>'
    + '<p class="nota" id="dvSoma" style="margin:4px 0 0"></p>'),
    [{ label: 'Cancelar', onClick: fecharModal },
     { label: 'Dividir', pri: true, onClick: async () => {
        // tudo lido aqui, antes de qualquer outra janela
        const r = ler();
        const somaC = r.linhas.reduce((a, l) => a + Math.round(Number(l.valor) * 100), 0);
        if (r.linhas.some(l => !(Number(l.valor) > 0))){ toast('Informe o valor de cada parcela.', 'err'); return; }
        if (r.linhas.some(l => !l.venc)){ toast('Informe o vencimento de cada parcela.', 'err'); return; }
        if (somaC !== totalC){ toast('A soma das parcelas (' + BRL(somaC / 100) + ') tem de dar ' + BRL(t.valor) + '.', 'err'); return; }
        const b = [...document.querySelectorAll('#mFoot .btn')].pop(); if (b) b.disabled = true;
        try{
          const res = await rpc('tf_fin_titulo_dividir', { p_titulo_id: t.id, p_client_uid: r.uid,
            p_parcelas: r.linhas.map(l => ({ valor: Number(l.valor), vencimento: l.venc })) });
          fecharModal();
          toast('Conta dividida em ' + ((res && res.titulos && res.titulos.length) || r.n) + ' parcelas. Agora, "Emitir boleto" em cada uma.', 'ok');
          await finreCarregar();
        }catch(e){
          toast(e.message, 'err');
          modalDividirTitulo(t, r);   // volta com o que foi escrito (a mesma chave: não divide em dobro)
        }
     }}]);
  function ler(){
    const n = Number((document.getElementById('dvN') || {}).value) || d.n;
    const linhas = Array.from({ length: n }, (_, i) => ({
      valor: ((document.getElementById('dvV' + i) || {}).value || '').trim(),
      venc: ((document.getElementById('dvD' + i) || {}).value || '').trim() }));
    return { n, linhas, uid: d.uid };
  }
  function somar(){
    const el = document.getElementById('dvSoma'); if (!el) return;
    const somaC = ler().linhas.reduce((a, l) => a + Math.round((Number(l.valor) || 0) * 100), 0);
    const dif = totalC - somaC;
    el.innerHTML = 'Soma das parcelas: <b>' + esc(BRL(somaC / 100)) + '</b>'
      + (dif === 0 ? ' · confere com a conta' : ' · <span style="color:var(--crit,#b42318)">' + (dif > 0 ? 'faltam ' : 'passou ') + esc(BRL(Math.abs(dif) / 100)) + '</span>');
  }
  document.getElementById('dvN').addEventListener('change', e => {
    document.getElementById('dvLinhas').innerHTML = linhasHtml(sugerir(Number(e.target.value) || 2)); somar();
  });
  mbOuvir('input', e => { if (e.target.id && /^dv[VD]\d/.test(e.target.id)) somar(); });   // 182: um ouvinte por abertura
  somar();
}

  const s = v.sugestao || {};
  const d = Object.assign({ desc: s.descricao || '', comp: String(s.competencia || isoHoje()).slice(0, 7), venc: s.vencimento || isoHoje(), forma: '',
    uid: (crypto.randomUUID && crypto.randomUUID()) || ('med-' + Date.now() + '-' + Math.random().toString(16).slice(2)) }, rasc || {});
  const itens = v.itens_juntos || [];
  const tab = itens.length

    +  '<div class="campo"><label>Pedido/Contrato do cliente (K03)</label><input type="text" value="' + esc(s.pedido || (v.usa_pedido === false ? 'o cliente não usa pedido' : '—')) + '" disabled></div></div>'

/** O painel da OS de contrato: o que dizer. */
function medMsgOs(v){
  const c = v.contrato || {}, val = c.valor || {};
  if (c.medicao && c.tem_titulo) return 'O título da medição já foi lançado: confira abaixo e use “Emitir nota” e “Emitir boleto” na linha.';
  if (c.medicao) return 'A medição está fechada e com a K03 concluída: lance o título da medição.';
  if (val.tipo === 'fechada') return 'A medição está fechada, mas a K03 (boletim aprovado e pedido do cliente) ainda não foi concluída no TapHub.';
  if (val.tipo === 'estimada') return 'A medição ainda não foi fechada (estimativa: ' + BRL(Number(val.valor) || 0) + '). O título sai dela depois da K03.';
  return 'OS de contrato: o título sai da medição, depois que ela for fechada e a K03 concluída no TapHub.';
}

/** O texto da nota acompanha o pedido digitado (só a parte "Pedido/Contrato: …"). */
function medInfoComPedido(txt, p){
  const partes = String(txt || '').split(' // ').filter(x => !/^Pedido\/Contrato: /.test(x));
  if (p) partes.splice(Math.min(1, partes.length), 0, 'Pedido/Contrato: ' + p);
  return partes.join(' // ');
}
