    }
  }catch(e){
    return rhFalha(corpo, /tf_ausencias_lista|tf_ferias_painel/.test(e.message)
      ? 'O banco ainda não tem esta versão das ausências: falta rodar o 108_s54.sql no Supabase. (' + e.message + ')' : e.message, pintarAusencias);
  }
  if (visao !== 'rhaus') return;
  contador('nAus', Number(AUS.dados.pedidos_n) || '');
  ausDesenhar();
  ausGuarda();
}

  const D = AUS.dados || {}, hoje = D.hoje || isoHoje();

  const todos = (D.itens || []).concat(AUS.proxAno || []).filter(x => casa([x.usuario, AUS_ROT[x.tipo], x.observacao].join(' '), q));
  const pedidos = todos.filter(x => x.status === 'pedida').sort((a, b) => a.inicio.localeCompare(b.inicio));
  const resto = todos.filter(x => x.status !== 'pedida');
  const nFora = resto.filter(x => x.status === 'cancelada' || x.status === 'recusada').length;
  const vis = resto.filter(x => AUS.canc || x.status === 'aprovada');
  const asc = (a, b) => a.inicio.localeCompare(b.inicio) || String(a.usuario).localeCompare(String(b.usuario));
  const agora = vis.filter(x => x.inicio <= hoje && x.fim >= hoje).sort(asc);
  const prox  = vis.filter(x => x.inicio > hoje).sort(asc);
  const ant   = vis.filter(x => x.fim < hoje).sort((a, b) => asc(b, a));

  corpo.innerHTML = '';
  ausBarra(corpo, '<label class="finAnul"><input type="checkbox" id="ausCanc"' + (AUS.canc ? ' checked' : '')
    + '> Mostrar canceladas e recusadas (' + nFora + ')</label>');

  const lin = x => {
    const fora = x.status === 'cancelada' || x.status === 'recusada', ped = x.status === 'pedida';
    const n = ausNDias(x.inicio, x.fim);
    const chq = (x.choques || []).length;
    return '<div class="ausLin' + (fora ? ' canc' : '') + (ped ? ' ped' : '') + '" data-id="' + esc(x.id) + '">'
      + '<span><b>' + esc(x.usuario || '?') + '</b>'
      +   (x.observacao ? '<small>' + esc(x.observacao) + '</small>' : '')
      +   (x.status === 'cancelada' ? '<small>Cancelada por ' + esc(x.cancelado_por || '—') + ': ' + esc(x.cancelado_motivo || '') + '</small>'
           : x.status === 'recusada' ? '<small>Recusada por ' + esc(x.decidido_por || '—') + (x.decidido_em ? ' em ' + esc(rhDT(x.decidido_em)) : '')
               + ': ' + esc(x.recusa_motivo || '') + '</small>'
           : x.alterado_por ? '<small>Corrigida por ' + esc(x.alterado_por) + (x.alterado_em ? ' em ' + esc(rhDT(x.alterado_em)) : '') + '</small>'
           : x.decidido_por ? '<small>Pedida pelo funcionário · aprovada por ' + esc(x.decidido_por) + (x.decidido_em ? ' em ' + esc(rhDT(x.decidido_em)) : '') + '</small>' : '')
      +   (ped ? '<small>Pedido em ' + esc(rhDT(x.pedido_em)) + '</small>' + ausConfHTML(x.conferencia) : '')
      +   (x.tipo === 'atestado' && (x.anexos || []).length ? '<small><button class="lnk" type="button" data-a="ax">📎 atestado anexado (' + x.anexos.length + ')</button></small>' : '')
      +   (x.choque_motivo ? '<small class="ausAviso">Com choque de cobertura: ' + esc(x.choque_motivo) + '</small>'
           : chq && !ped ? '<small class="ausErro">⚠ ' + esc(x.choques[0].texto) + '</small>' : '')
      + '</span>'
      + '<span>' + ausChip(x) + (ped ? ' <span class="chip ausPed">aguardando</span>' : '') + '</span>'
      + '<span class="ausPer">' + esc(ausPer(x)) + '<small>' + esc(ausDur(x))
      +   (Number(x.dias_vendidos) ? ' · vende ' + x.dias_vendidos : '') + '</small></span>'
      + '<span class="ausBtns">'
      +   (ped ? '<button class="btn mini pri" type="button" data-a="ap">Aprovar</button>'
                + '<button class="btn mini" type="button" data-a="rc">Recusar</button>' : '')
      +   (x.status === 'aprovada' ? '<button class="btn mini" type="button" data-a="ed">Corrigir</button>'
                     + '<button class="btn mini" type="button" data-a="ca">Cancelar</button>' : '')
      +   '<button class="btn mini" type="button" data-a="rg" title="Quem pediu, lançou, decidiu, corrigiu ou cancelou">Registro</button>'
      + '</span></div>';
  };
  const secao = (tit, lista, vazio) => '<div class="secTit">' + tit + '</div>'
    + (lista.length ? '<div class="ausLista">' + lista.map(lin).join('') + '</div>'
                    : '<p class="nota" style="margin:0 0 14px">' + vazio + '</p>');
  corpo.insertAdjacentHTML('beforeend',
      (pedidos.length ? secao('Pedidos esperando decisão (' + pedidos.length + ')', pedidos, '') : '')
    + secao('Fora hoje', agora, q ? 'Ninguém com essa busca.' : 'Ninguém fora hoje.')
    + secao('Próximas' + ((AUS.proxAno || []).length ? ' (inclui ' + esc(String(Number(D.ano || AUS.ano) + 1)) + ')' : ''), prox, 'Nada aprovado daqui para frente' + (q ? ' com essa busca' : '') + '.')
    + secao('Anteriores em ' + esc(String(D.ano || AUS.ano)), ant, 'Nada antes de hoje' + (q ? ' com essa busca' : '') + '.'));

  document.getElementById('ausCanc').addEventListener('change', ev => { AUS.canc = ev.target.checked; ausDesenhar(); });
  corpo.querySelectorAll('.ausLin [data-a]').forEach(b => b.addEventListener('click', () => {
    const x = (D.itens || []).concat(AUS.proxAno || []).find(i => String(i.id) === b.closest('.ausLin').dataset.id);
    if (!x) return;
    const a = b.dataset.a;
    if (a === 'ed') return ausModal(x);
    if (a === 'ca') return ausCancelar(x);
    if (a === 'ap') return ausDecidir(x, true);
    if (a === 'rc') return ausDecidir(x, false);
    if (a === 'ax') return ausAnxVer(x);
    ausRegistro(x);
  }));
}

function ausDecidir(x, aprovar){
  const c = x.conferencia || {};
  const chq = (c.choques || []).length > 0, err = (c.erros || []).filter(e => !/^Choca com/.test(e)).length > 0;
  const pedeMotivo = !aprovar || chq;
  abrirModal((aprovar ? 'Aprovar ' : 'Recusar ') + (AUS_ROT[x.tipo] || '').toLowerCase() + ' · ' + (x.usuario || ''),
      '<p style="margin-top:0">' + ausChip(x) + ' ' + esc(ausPer(x)) + ' · ' + esc(ausDur(x))
    + (Number(x.dias_vendidos) ? ' · vende ' + x.dias_vendidos + ' dia(s)' : '') + '</p>'
    + (x.observacao ? '<p class="nota">“' + esc(x.observacao) + '”</p>' : '')
    + (aprovar && (err || chq || (c.avisos || []).length) ? '<div class="aviso">' + ausConfHTML(c) + '</div>' : '')
    + (aprovar && err ? '<p class="nota">O banco confere tudo de novo ao aprovar: com erro de período ou de saldo, a aprovação é recusada — '
        + 'corrija as datas com o funcionário (ele pede de novo).</p>' : '')
    + (pedeMotivo ? '<div class="campo"><label for="auDM">' + (aprovar ? 'Motivo para aprovar com o choque' : 'Motivo da recusa (o funcionário vê)')
        + '</label><input id="auDM" type="text" maxlength="200" autocomplete="off" name="audm_nofill"></div>' : '')
    + '<p class="nota" id="auDMsg" style="color:var(--crit)"></p>',
    [{ label:'Voltar', onClick: fecharModal },
     { label: aprovar ? 'Aprovar' : 'Recusar', pri: aprovar, cls: aprovar ? '' : 'perigo', onClick: async () => {
        const msg = document.getElementById('auDMsg'); msg.textContent = '';
        const m = pedeMotivo ? document.getElementById('auDM').value.trim() : null;
        if (pedeMotivo && m.length < 3){ msg.textContent = 'Diga o motivo.'; return; }
        if (DEMO){ msg.textContent = 'Modo demonstração: nada é gravado.'; return; }
        try{
          const r = await rpc('tf_ausencia_decidir', { p_id: x.id, p_aprovar: aprovar, p_motivo: m });
          AGENDA.chave = null; contarAusPedidos();
          const av = (r && r.avisos) || {};
          if (aprovar && Number(av.n_agenda || 0) + Number(av.diarias || 0) > 0) ausAvisoDepois(r, x.inicio, x.fim);
          else { fecharModal(); toast(aprovar ? 'Aprovado — já aparece na Agenda.' : 'Recusado. O funcionário vê o motivo no Field.', 'ok'); }
          pintarAusencias();
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

function ausMapa(){
  const corpo = document.getElementById('ausCorpo'); if (!corpo) return;
  const D = AUS.dados || {}, P = AUS.painel || { pessoas: [] };
  const ano = D.ano || AUS.ano, ini = ano + '-01-01', fim = ano + '-12-31';
  const total = ausNDias(ini, fim);
  const pc = d => (Math.max(0, Math.min(total, ausNDias(ini, d) - 1)) / total * 100).toFixed(3) + '%';
  const q = (BUSCA.rhaus || '').trim();
  const vivos = (D.itens || []).filter(x => (x.status === 'aprovada' || x.status === 'pedida') && x.inicio <= fim && x.fim >= ini);
  const pessoas = new Map();
  (D.pessoas || []).filter(p => p.vinculo === 'clt' || p.vinculo === 'estagio').forEach(p => pessoas.set(String(p.id), p.nome));
  vivos.forEach(x => { if (!pessoas.has(String(x.usuario_id))) pessoas.set(String(x.usuario_id), x.usuario); });
  const linhas = [...pessoas.entries()].filter(([, n]) => casa(n, q)).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  const limite = id => {
    const p = (P.pessoas || []).find(z => String(z.id) === id);
    const per = p && (p.periodos || []).find(z => z.restantes > 0 && z.tipo === 'ferias');
    return per && per.conc_fim >= ini && per.conc_fim <= fim ? per : null;
  };
  const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const mesesHTML = MESES.map((m, i) => '<div class="ausMes" style="left:' + pc(ano + '-' + String(i + 1).padStart(2, '0') + '-01') + '"></div>').join('');
  const hoje = D.hoje || isoHoje();
  corpo.innerHTML = '';
  ausBarra(corpo);
  corpo.insertAdjacentHTML('beforeend',
      '<div class="ausLeg"><span><i class="aus-ferias"></i>férias</span><span><i class="aus-folga"></i>folga</span>'
    + '<span><i class="aus-recesso"></i>recesso</span><span><i class="aus-atestado"></i>atestado</span>'
    + '<span><i class="ausLegPed"></i>pedido aguardando</span><span><i class="ausLegChq"></i>quebra “não sai junto”</span>'
    + '<span><i class="ausLegVenc"></i>limite para tirar (depois, dobro)</span></div>'
    + '<div class="ausGrade"><table class="ausMapaT"><colgroup><col style="width:170px"><col></colgroup>'
    + '<thead><tr><th class="nome">Pessoa</th><th class="trilho">' + mesesHTML
    + MESES.map((m, i) => '<span class="ausMesR" style="left:' + pc(ano + '-' + String(i + 1).padStart(2, '0') + '-01') + '">' + m + '</span>').join('')
    + '</th></tr></thead><tbody>'
    + (linhas.length ? linhas.map(([id, nome]) => {
        const bs = vivos.filter(x => String(x.usuario_id) === id);
        const lm = limite(id);
        return '<tr><td class="nome">' + esc(nome) + '</td><td class="trilho">' + mesesHTML
          + (hoje >= ini && hoje <= fim ? '<div class="ausHoje" style="left:' + pc(hoje) + '"></div>' : '')
          + bs.map(x => {
              const a = x.inicio < ini ? ini : x.inicio, b = x.fim > fim ? fim : x.fim;
              const chq = (x.choques || []).length || ((x.conferencia || {}).choques || []).length;
              return '<button type="button" class="ausBar aus-' + esc(x.tipo) + (x.status === 'pedida' ? ' ped' : '') + (chq ? ' chq' : '')
                + '" data-id="' + esc(x.id) + '" style="left:' + pc(a) + ';width:calc(' + ((ausNDias(a, b)) / total * 100).toFixed(3) + '% - 1px)" title="'
                + esc((AUS_ROT[x.tipo] || '') + (x.status === 'pedida' ? ' (pedido)' : '') + ' · ' + ausPer(x)
                  + (chq ? ' · ⚠ ' + ((x.choques || [])[0] || ((x.conferencia || {}).choques || [])[0] || {}).texto : '')) + '">'
                + esc(ausNDias(x.inicio, x.fim) >= 6 ? (AUS_ROT[x.tipo] || '').split('/')[0] : '') + '</button>';
            }).join('')
          + (lm ? '<div class="ausVenc" style="left:' + pc(lm.conc_fim) + '" title="Limite para tirar o período '
              + esc(dataBR(lm.aq_ini) + ' a ' + dataBR(lm.aq_fim)) + ' (sobram ' + lm.restantes + ')"></div>' : '')
          + '</td></tr>';
      }).join('') : '<tr><td colspan="2" class="nota" style="padding:12px">Ninguém com essa busca.</td></tr>')
    + '</tbody></table></div>'
    + '<p class="nota">Toque numa barra para ver o registro, corrigir ou cancelar. A conta de “não sai junto” olha férias e recesso, aprovados e pedidos; folga e atestado ficam fora.</p>');
  corpo.querySelectorAll('.ausBar').forEach(b => b.addEventListener('click', () => {
    const x = (D.itens || []).find(i => String(i.id) === b.dataset.id);
    if (!x) return;
    ausRegistro(x);   // S57: o registro já traz Aprovar/Recusar ou Corrigir/Cancelar
  }));
}

const AUS_VINC = { clt:'CLT', estagio:'Estágio', socio:'Sócio' };

function ausSaldos(){
  const corpo = document.getElementById('ausCorpo'); if (!corpo) return;
  const P = AUS.painel || { pessoas: [] }, hoje = P.hoje || isoHoje();
  const q = (BUSCA.rhaus || '').trim();
  corpo.innerHTML = '';
  ausBarra(corpo);
  const pessoas = (P.pessoas || []).filter(p => casa(p.nome + ' ' + (p.funcao || ''), q));
  const perLin = (p, z) => {
    const dias = Math.round((agData(z.conc_fim) - agData(hoje)) / 864e5);
    const st = !z.completo ? '<span class="chip">em formação até ' + esc(dataBR(z.aq_fim)) + '</span>'
      : z.vencido ? '<span class="chip ausVencChip">vencido em ' + esc(dataBR(z.conc_fim)) + '</span>'
      : z.restantes > 0 && z.tipo === 'ferias' && dias <= 90 ? '<span class="chip ausAvisoChip">vence em ' + dias + ' dias</span>' : '';
    return '<div class="ausPerL"><span><b>' + esc(dataBR(z.aq_ini) + ' a ' + dataBR(z.aq_fim)) + '</b>'
      // S55 · o período em formação diz a partir de quando dá direito; os de férias, o limite de gozo
      + '<small>' + (!z.completo ? 'dá direito a partir de ' + esc(dataBR(agSoma(z.aq_fim, 1))) + (z.tipo === 'ferias' ? ' · ' : '') : '')
      + (z.tipo === 'ferias' ? 'limite de gozo ' + esc(dataBR(z.conc_fim)) : z.completo ? 'recesso do estágio' : '') + '</small></span>'
      + '<span class="n">' + z.direito + '</span><span class="n">' + z.gozados + '</span><span class="n">' + z.pedidos + '</span>'
      + '<span class="n">' + z.vendidos + '</span><span class="n"><b>' + z.restantes + '</b></span><span>' + st + (z.base ? ' <span class="chip">saldo inicial</span>' : '') + '</span></div>';
  };
  corpo.insertAdjacentHTML('beforeend', pessoas.length ? pessoas.map(p => '<div class="ausSaldo" data-id="' + esc(p.id) + '">'
      + '<div class="ausSaldoH"><b>' + esc(p.nome) + '</b> <span class="chip">' + esc(AUS_VINC[p.vinculo] || 'sem vínculo') + '</span>'
      + '<small>' + esc(p.funcao || '') + (p.admissao ? ' · admissão ' + esc(dataBR(p.admissao)) : ' · sem admissão na ficha')
      + (p.saldo_inicial && p.saldo_inicial.definido_por ? ' · saldo inicial por ' + esc(p.saldo_inicial.definido_por)
          + (p.saldo_inicial.definido_em ? ' em ' + esc(rhDT(p.saldo_inicial.definido_em)) : '') : '') + '</small>'
      + '<button class="btn mini" type="button" data-aj="1">Ajustar</button></div>'
      + ((p.periodos || []).length
          ? '<div class="ausPerL cab"><span>Período aquisitivo</span><span class="n">Direito</span><span class="n">Tirados</span>'
            + '<span class="n">Pedidos</span><span class="n">Vendidos</span><span class="n">Sobram</span><span></span></div>'
            // S55 · só até o período em formação de AGORA (o do ano que vem não serve para nada ainda)
            + p.periodos.filter(z => z.aq_ini <= hoje).map(z => perLin(p, z)).join('')
          : '<p class="nota" style="margin:6px 0 0">' + (p.vinculo === 'socio' ? 'Sócio: fora do controle de férias.'
              : !p.admissao ? 'Sem a data de admissão na ficha (Recursos Humanos › Funcionários).' : 'Sem período.') + '</p>')
      + '</div>').join('')
    : '<p class="nota">Ninguém com ficha de RH ativa' + (q ? ' com essa busca' : '') + '.</p>');
  corpo.insertAdjacentHTML('beforeend', '<p class="nota">“Saldo inicial” é o ponto de partida do sistema: a partir daquele período, os anteriores '
    + 'contam como quitados. Faltas não descontam (vão para o banco de horas).</p>');
  corpo.querySelectorAll('[data-aj]').forEach(b => b.addEventListener('click', () => {
    const p = (P.pessoas || []).find(z => String(z.id) === b.closest('.ausSaldo').dataset.id);
    if (p) ausAjustar(p);
  }));
}

function ausAjustar(p){
  const hoje = (AUS.painel || {}).hoje || isoHoje();
  const anivs = [];
  if (p.admissao){
    for (let k = 0; k < 40; k++){
      const d = String(Number(p.admissao.slice(0,4)) + k) + p.admissao.slice(4);
      if (d > hoje) break;
      anivs.push(d);
    }
  }
  const si = p.saldo_inicial || {};
  abrirModal('Ajustar · ' + p.nome,
      '<div class="campo"><label for="ajV">Vínculo</label><select id="ajV">'
    + Object.keys(AUS_VINC).map(k => '<option value="' + k + '"' + (p.vinculo === k ? ' selected' : '') + '>' + AUS_VINC[k] + '</option>').join('')
    + '</select></div>'
    + (anivs.length ? '<div class="dupla"><div class="campo"><label for="ajP">Saldo inicial: a partir do período que começa em</label><select id="ajP">'
        + '<option value="">— contar desde a admissão —</option>'
        + anivs.map(d => '<option value="' + d + '"' + (si.periodo_inicio === d ? ' selected' : '') + '>' + esc(dataBR(d)) + '</option>').join('')
        + '</select></div><div class="campo"><label for="ajD">Dias que sobram nele</label>'
        + '<input id="ajD" type="number" min="0" max="30" value="' + esc(String(si.dias_restantes != null ? si.dias_restantes : 30)) + '"></div></div>'
      : '<p class="nota">Sem data de admissão na ficha: o saldo inicial se define depois de preencher a admissão (Recursos Humanos › Funcionários).</p>')
    + '<p class="nota">Os períodos ANTES do escolhido contam como quitados. Use quando alguém já tirou parte das férias fora do sistema '
    + '(ex.: 10 dias do 1º período).</p><p class="nota" id="ajMsg" style="color:var(--crit)"></p>',
    [{ label:'Voltar', onClick: fecharModal },
     { label:'Gravar', pri:true, onClick: async () => {
        const msg = document.getElementById('ajMsg'); msg.textContent = '';
        const per = (document.getElementById('ajP') || {}).value || null;
        const dias = per ? Number(document.getElementById('ajD').value) : null;
        if (per && !(dias >= 0 && dias <= 30)){ msg.textContent = 'Dias de 0 a 30.'; return; }
        if (DEMO){ msg.textContent = 'Modo demonstração: nada é gravado.'; return; }
        try{
          await rpc('tf_ferias_pessoa_salvar', { p_usuario: p.id, p_vinculo: document.getElementById('ajV').value,
                                                 p_periodo_inicio: per, p_dias_restantes: dias });
          fecharModal(); toast('Gravado.', 'ok'); AUS.painel = null; pintarAusencias();
        }catch(e){ msg.textContent = e.message; }
     }}]);
}

const ausRegraTxt = r => (r.grupo || []).length === 1 && Number(r.minimo) === 1
  ? '<b>' + esc(r.quem) + '</b> e <b>' + esc((r.grupo_nomes || [])[0] || '?') + '</b> não saem juntos'
  : 'Quando <b>' + esc(r.quem) + '</b> sai, pelo menos <b>' + esc(String(r.minimo)) + '</b> de '
    + (r.grupo_nomes || []).map(n => '<b>' + esc(n) + '</b>').join(', ') + ' fica' + (Number(r.minimo) > 1 ? 'm' : '');

function ausRegras(){
  const corpo = document.getElementById('ausCorpo'); if (!corpo) return;
  const P = AUS.painel || { regras: [] };
  corpo.innerHTML = '';
  ausBarra(corpo, '<button class="btn" type="button" id="ausRegraNova">+ Nova regra</button>');
  corpo.insertAdjacentHTML('beforeend', '<p class="nota" style="margin-top:0">Vale só entre férias e recesso: o funcionário não consegue pedir '
    + 'se a regra quebra (e vê com quem e quando); o escritório lança ou aprova assim mesmo só com motivo. Folga e atestado ficam fora: '
    + 'não são barrados e não contam como ausência para os outros. O par vale nos dois sentidos.</p>'
    + ((P.regras || []).length ? '<div class="ausLista">' + P.regras.map(r => '<div class="ausLin ausRegra" data-id="' + esc(r.id) + '">'
        + '<span>' + ausRegraTxt(r) + '</span><span class="ausBtns"><button class="btn mini" type="button" data-ed="1">Corrigir</button>'
        + '<button class="btn mini" type="button" data-ex="1">Excluir</button></span></div>').join('') + '</div>'
      : '<p class="nota">Nenhuma regra: ninguém é barrado por cobertura.</p>'));
  document.getElementById('ausRegraNova').addEventListener('click', () => ausRegraModal(null));
  corpo.querySelectorAll('.ausRegra [data-ed], .ausRegra [data-ex]').forEach(b => b.addEventListener('click', async () => {
    const r = (P.regras || []).find(z => String(z.id) === b.closest('.ausRegra').dataset.id);
    if (!r) return;
    if (b.dataset.ed) return ausRegraModal(r);
    if (!await confirmar('Excluir a regra?', '<p>' + ausRegraTxt(r) + '</p>', 'Excluir', true)) return;
    if (DEMO) return toast('Modo demonstração: nada é gravado.', 'err');
    try{ await rpc('tf_ferias_regra_excluir', { p_id: r.id }); toast('Regra excluída.', 'ok'); AUS.painel = null; pintarAusencias(); }
    catch(e){ toast(e.message, 'err'); }
  }));
}

function ausRegraModal(r){
  const pessoas = ((AUS.dados || {}).pessoas || []).filter(p => p.vinculo !== 'socio');
  const g = (r && r.grupo || []).map(String);
  abrirModal(r ? 'Corrigir regra' : 'Nova regra',
      '<div class="campo"><label for="rgQ">Quando sai</label><select id="rgQ"><option value="">—</option>'

  eI.addEventListener('change', () => { if (!eF.value || eF.value < eI.value) eF.value = eI.value; conta(); });
  eF.addEventListener('change', conta); eV.addEventListener('input', agenda);

/* ── RH13 · item 38 (616): o atestado anexado à ausência ─────────────────────
 * Foto (reduzida a 1600 px), PDF (até 2 MB) ou print colado com Ctrl+V; até 3 por atestado. Vai para o bucket
 * privado `ponto` em <pessoa>/atestados/<id>; o pedido de atestado do celular, aprovado, já traz as fotos.
 * Dado de saúde (LGPD art. 11): só a caixa Ausências e o próprio funcionário veem; 5 anos a contar da data do atestado. */
const AUS_ANX = { manter: [], novos: [], apagado: null };
const pontoUrl = c => SUPABASE_URL + '/storage/v1/object/ponto/' + String(c).split('/').map(encodeURIComponent).join('/');
const ausAnxRot = c => (/\.pdf$/i.test(c) ? 'PDF' : 'foto') + (/\/pedidos\//.test(c) ? ' · enviada pelo celular' : ' · anexada pelo escritório');
function ausAnxDesenhar(){
  const L = document.getElementById('auAnxL'); if (!L) return;
  const n = AUS_ANX.manter.length + AUS_ANX.novos.length;
  L.innerHTML = (AUS_ANX.apagado ? '<p class="nota" style="margin:0">O atestado desta ausência passou do prazo de guarda (5 anos) e foi apagado.</p>' : '')
    + AUS_ANX.manter.map((c, i) => '<div class="ausAnxI"><span>📎 Arquivo ' + (i + 1) + ' (' + esc(ausAnxRot(c)) + ')</span>'
      + '<button type="button" class="ab" data-ab="' + esc(c) + '">abrir</button><button type="button" class="x" data-xm="' + i + '" title="Tirar este arquivo" aria-label="Tirar o arquivo ' + (i + 1) + '">×</button></div>').join('')
    + AUS_ANX.novos.map((f, i) => '<div class="ausAnxI"><span>➕ ' + esc(f.name || 'print colado') + ' <small>(vai ao gravar)</small></span>'
      + '<button type="button" class="x" data-xn="' + i + '" title="Tirar este arquivo" aria-label="Tirar ' + esc(f.name || 'o print') + '">×</button></div>').join('')
    + (!n && !AUS_ANX.apagado ? '<p class="nota" style="margin:0">Nenhum arquivo anexado.</p>' : '');
  const f = document.getElementById('auAnxF'); if (f) f.disabled = n >= 3 || !!AUS_ANX.apagado;
}
function ausAnxJuntar(lista){
  const ok = lista.filter(f => f && (/^image\//.test(f.type) || f.type === 'application/pdf'));
  if (lista.length && !ok.length){ toast('Use foto (JPG/PNG) ou PDF.', 'err'); return false; }
  const cabe = 3 - AUS_ANX.manter.length - AUS_ANX.novos.length;
  AUS_ANX.novos = AUS_ANX.novos.concat(ok.slice(0, Math.max(cabe, 0)));
  if (ok.length > cabe) toast('No máximo 3 arquivos por atestado.', 'err');
  ausAnxDesenhar();
  return ok.length > 0;
}
// colar (Ctrl+V) com a janela de ausência aberta e o tipo atestado
document.addEventListener('paste', ev => {
  const c = document.getElementById('auAnxC'); if (!c || c.hidden || AUS_ANX.apagado) return;
  const fs = Array.from((ev.clipboardData && ev.clipboardData.items) || []).filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (fs.length && ausAnxJuntar(fs)) ev.preventDefault();
});
function novoIdRH(){
  return (crypto.randomUUID && crypto.randomUUID()) || ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}
async function ausAnxGravar(ausId, usuarioId, manter, novos){
  const caminhos = manter.slice();
  for (const f of novos){
    let blob, ext;
    if (f.type === 'application/pdf'){
      if (f.size > RHFD_MAX) throw new Error('PDF grande demais (máx. 2 MB): escaneie com resolução menor.');
      blob = f; ext = 'pdf';
    } else {
      const r = await reduzirImagem(f, 1600, 0.82, true, true);
      blob = new Blob([await (await fetch(r.dados)).blob()], { type: 'image/jpeg' }); ext = 'jpg';
    }
    const c = usuarioId + '/atestados/' + novoIdRH() + '.' + ext;
    const r = await Nucleo.storage.enviar('ponto', c, blob);
    if (r !== 'ok' && r !== 'ja_existia') throw new Error('o armazenamento recusou o arquivo.');
    caminhos.push(c);
  }
  const g = await rpc('tf_ausencia_anexos', { p_id: ausId, p_anexos: caminhos });
  if ((g.removidos || []).length)     // o que o escritório tirou some do armazenamento também
    rhfdFetch(SUPABASE_URL + '/storage/v1/object/ponto', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: g.removidos }) }).catch(() => {});
  return g;
}
async function ausAnxAbrir(caminho){
  const w = window.open('', '_blank');
  if (!w){ toast('O navegador bloqueou a janela nova — libere pop-ups para o TapHub.', 'err'); return; }
  try{
    const r = await rhfdFetch(pontoUrl(caminho), {});
    if (!r.ok) throw new Error('O arquivo não está no armazenamento (HTTP ' + r.status + ').');
    const bl = await r.blob();
    w.location.href = URL.createObjectURL(new Blob([bl], { type: /\.pdf$/i.test(caminho) ? 'application/pdf' : 'image/jpeg' }));
  }catch(e){ try{ w.close(); }catch(_){} toast(e.message, 'err'); }
}
/** A janela com os arquivos de um atestado (da lista de Ausências e de Documentos do Funcionário). */

/** O prazo de guarda (616): vencidos os 5 anos, apaga no armazenamento e depois no banco. Uma vez por sessão, ao abrir Ausências. */
let ausGuardou = false;
async function ausGuarda(){
  if (ausGuardou || DEMO || !podeVerEstrito('ausencias')) return; ausGuardou = true;
  try{
    const L = await rpc('tf_ausencia_guarda_lista', {});

      if (!r.ok){ ausGuardou = false; return; }
    }
    await rpc('tf_ausencia_guarda_apagar', { p_ids: L.map(x => x.id) });
  }catch(e){ ausGuardou = false; }

function ausAvisoDepois(r, i, f){
  const av = r.avisos || {}, ag = av.agenda || [];
  const tipoItem = a => a.origem === 'avulso' ? 'compromisso' : a.origem === 'visita' ? 'visita' : 'tarefa';
  const primeiro = ag.length ? ag[0].dia : i;
  abrirModal('Gravado — confira a agenda',
      '<p style="margin-top:0">Já estava marcado para <b>' + esc(r.usuario || 'a pessoa') + '</b> nesse período. '
    + '<b>Nada foi mudado</b>: decida cada um na Agenda (passar para outra pessoa, mudar o dia ou deixar).</p>'
    + (ag.length ? '<ul style="margin:0 0 8px;padding-left:18px">' + ag.map(a => '<li>' + esc(dataBR(a.dia).slice(0,5)) + ' · '
        + esc(tipoItem(a)) + (a.os_numero ? ' ' + esc(a.os_numero) : '') + ' · ' + esc(a.tarefa || '')

function diaDetalhe(l, fechado){
  const box = document.createElement('div'); box.className = 's49Det';
  const porDia = {};
  // S50 · item 2: desligada, só o que conta; dia sem nada válido não aparece
  (l.detalhe || []).filter(x => DIA.anul || !x.anulado_em)
    .forEach(x => { (porDia[x.data] = porDia[x.data] || []).push(x); });
  if (!Object.keys(porDia).length){
    box.innerHTML = '<p class="nota" style="margin:4px 0">Nenhum lançamento válido no mês'
      + (diaContaAnul(l).n ? ' — só anulados. Ligue "Mostrar anulados" para ver.' : '.') + '</p>';
    return box;
  }
  // Ligada: as desmarcações automáticas do próprio funcionário viram UMA linha
  // por refeição, no lugar da primeira delas (a ordem da lista não muda).
  const linhaGrupo = g => {
    const ts = g.map(x => x.anulado_em).sort();
    const a = ts[0], b = ts[ts.length - 1];
    const quando = diaDM(a) === diaDM(b)
      ? diaDM(a) + ', ' + diaHM(a) + (diaHM(a) !== diaHM(b) ? ' a ' + diaHM(b) : '')
      : diaDM(a) + ' ' + diaHM(a) + ' a ' + diaDM(b) + ' ' + diaHM(b);
    return '<div class="s49Ref anul grupo"><span class="r">' + esc(DIA_ROT[g[0].tipo]) + ' · ' + esc(BRL(g[0].valor)) + '</span>'
      + '<small><b>' + g.length + (g.length === 1 ? ' marcação desfeita' : ' marcações desfeitas')
      + ' pelo próprio funcionário</b> (' + esc(quando) + ')</small></div>';
  };
  const agrupar = arr => {
    if (!DIA.anul) return arr;
    const grupos = {}, out = [];
    arr.forEach(x => {
      if (diaAnulProprioAuto(x, l)){
        if (!grupos[x.tipo]){ grupos[x.tipo] = []; out.push({ grupo: grupos[x.tipo] }); }
        grupos[x.tipo].push(x);
      } else out.push(x);
    });
    return out;
  };
  box.innerHTML = Object.keys(porDia).sort().map(d => '<div class="s49Dia"><b>' + esc(dataBR(d).slice(0,5)) + ' ' + S49_DIA_SEM(d) + '</b><div>'
    + agrupar(porDia[d]).map(x => x.grupo ? linhaGrupo(x.grupo) : '<div class="s49Ref' + (x.anulado_em ? ' anul' : '') + '"><span class="r">' + esc(DIA_ROT[x.tipo]) + ' · '
      + esc(BRL(x.valor)) + (x.os_numero ? ' · <span class="mono">' + esc(x.os_numero) + '</span>' : '') + '</span>'
      + '<small>lançado ' + (x.por_outro ? 'por <b>' + esc(x.lancado_por) + '</b> (' + esc(x.motivo || '') + ')' : 'pelo próprio')
      + ' em ' + esc(rhDT(x.lancado_em))
      + (x.anulado_em ? ' · <b>anulado</b> por ' + esc(x.anulado_por || '') + ' em ' + esc(rhDT(x.anulado_em)) + ': ' + esc(x.anulado_motivo || '') : '')
      + '</small>'
      + (!x.anulado_em && !fechado ? '<button class="btn mini" type="button" data-anul="' + esc(x.id) + '">anular</button>' : '')
      + '</div>').join('') + '</div></div>').join('');
  box.querySelectorAll('[data-anul]').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    const x = (l.detalhe || []).find(y => y.id === b.dataset.anul);
    abrirModal('Anular ' + DIA_ROT[x.tipo] + ' de ' + dataBR(x.data),
      '<p style="margin-top:0">De <b>' + esc(l.nome) + '</b>. O lançamento não é apagado: fica riscado, fora da soma, com o motivo.</p>'
      + '<div class="campo"><label for="daM">Motivo</label><input id="daM" type="text" maxlength="200" autocomplete="off" name="dam_nofill"></div>'
      + '<p class="nota" id="daMsg" style="color:var(--crit)"></p>',
      [{ label:'Voltar', onClick: fecharModal },
       { label:'Anular', pri:true, onClick: async () => {
          try{ await rpc('tf_diarias_marcar', { p_data: x.data, p_tipo: x.tipo, p_marcar: false, p_os_id: null,
                 p_usuario: l.usuario_id, p_motivo: document.getElementById('daM').value });
               fecharModal(); toast('Anulado.', 'ok'); pintarDiarias(); }
          catch(e){ document.getElementById('daMsg').textContent = e.message; }
       }}]);
  }));
  return box;
}

function diaModelo(){
  const D = DIA.dados;
  const L = D.linhas || [];
  const tot = L.reduce((s, l) => s + Number(l.total || 0), 0);
  const det = [], anul = [];
  L.forEach(l => (l.detalhe || []).forEach(x => {
    const lin = [l.nome, dataBR(x.data), DIA_ROT[x.tipo], Number(x.valor), x.os_numero || '',
                 x.por_outro ? x.lancado_por + ' (' + (x.motivo || '') + ')' : 'o próprio', rhDT(x.lancado_em)];
    if (x.anulado_em) anul.push(lin.concat([rhDT(x.anulado_em) + ' · ' + (x.anulado_por || '') + ': ' + (x.anulado_motivo || '')]));
    else det.push(lin);
  }));
  return {
    titulo: 'Diárias — ' + S49_MES(D.mes),
    subtitulo: 'Refeições na rua · ' + (D.situacao === 'fechado' ? 'mês FECHADO em ' + rhDT(D.fechado_em) + ' por ' + (D.fechado_por || '') : 'mês ABERTO (pode mudar)'),
    arquivo: 'TapFlow_Diarias_' + String(D.mes).slice(0,7),
    kpis: [ { val: BRL(tot), rot: 'Total do mês' }, { val: L.length, rot: 'Pessoas' },
            { val: L.reduce((s, l) => s + l.cafe + l.almoco + l.jantar, 0), rot: 'Refeições' } ],
    blocos: [
      { titulo: 'Por funcionário', colunas: ['Funcionário','Café','Almoço','Jantar','Total (R$)'],
        linhas: L.map(l => [l.nome, l.cafe, l.almoco, l.jantar, Number(l.total)]).concat([['TOTAL',
          L.reduce((s,l)=>s+l.cafe,0), L.reduce((s,l)=>s+l.almoco,0), L.reduce((s,l)=>s+l.jantar,0), tot]]),
        numericas: [1,2,3,4], moeda: [4] },
      { titulo: 'Dia a dia', colunas: ['Funcionário','Data','Refeição','Valor (R$)','OS','Lançado por','Lançado em'],
        linhas: det, numericas: [3], moeda: [3] },
      { titulo: 'Anulados (fora da soma)', colunas: ['Funcionário','Data','Refeição','Valor (R$)','OS','Lançado por','Lançado em','Anulação'],
        linhas: anul, numericas: [3], moeda: [3] } ]
  };
}

async function pintarRHDocs(tipo){
  const C = DOC_CFG[tipo], S = DOC[tipo];
  visao = C.v;
  const board = document.getElementById('board');
  if (DEMO) return rhDemo(board, C.titulo);
  if (!S.mes) S.mes = S49_MES_SOMA(isoHoje(), -1);   // o normal é postar o mês que acabou
  board.innerHTML = '<div class="tela rhTela"><div class="telaCab"><h2>' + C.titulo + '</h2><p>' + C.desc + '</p></div>'
    + '<div id="docCorpo"><p class="nota">Carregando…</p></div></div>';
  const corpo = document.getElementById('docCorpo');
  try{
    [S.dados, S.rasc] = await Promise.all([
      rpc('tf_rhdoc_painel', { p_tipo: tipo, p_mes: S.mes }),
      rpc('tf_rhdoc_rascunhos', { p_tipo: tipo, p_competencia: S.mes }) ]);
  }catch(e){ return rhFalha(corpo, e.message, () => pintarRHDocs(tipo)); }

function docDesenhar(tipo){
  const C = DOC_CFG[tipo], S = DOC[tipo], P = S.dados, R = S.rasc || { rascunhos:[], funcionarios:[] };
  const corpo = document.getElementById('docCorpo'); if (!corpo) return;
  const q = (BUSCA[C.v] || '').trim();
  corpo.innerHTML = '';
  // ── alertas de todos os meses: o que pede alguém agora ────────────────────
  const al = P.alertas || [];
  if (al.length) corpo.insertAdjacentHTML('beforeend', '<div class="s49Alerta"><b>Pede atenção (' + al.length + ')</b>'
    + al.map(d => '<div class="rhLin"><span class="t"><b>' + esc(d.nome || '—') + '</b> · ' + esc(d.rotulo)
      + '<small>' + (d.situacao === 'devolvido'
          ? 'tocou em "não é ' + (tipo === 'ponto' ? 'minha folha' : 'meu recibo') + '" em ' + esc(rhDT(d.encerrado_em))
            + ' — chegou à pessoa errada. Ninguém assina esta versão: confira e solte a certa.'
          : 'prazo ' + esc(dataBR(d.prazo)) + ' vencido, sem a assinatura do funcionário. Nada muda sozinho — fale com ele.')
      + '</small></span><span class="a"><button class="btn mini" type="button" data-det="' + esc(d.id) + '">Ver</button></span></div>').join('')
    + '</div>');
  // ── para a empresa assinar (ponto) ────────────────────────────────────────
  if (tipo === 'ponto' && (P.para_empresa || []).length){
    const pe = P.para_empresa;
    corpo.insertAdjacentHTML('beforeend', '<div class="aviso ok">' + pe.length + ' folha(s) assinada(s) pelo funcionário esperando a assinatura da empresa ('
      + esc(P.signatario_nome || 'o Fernando') + ').'
      + (P.sou_signatario ? ' <button class="btn mini pri" type="button" id="docEmp">Assinar como empresa…</button>' : '') + '</div>');
  }
  // ── barra do mês ─────────────────────────────────────────────────────────
  const barra = document.createElement('div'); barra.className = 'rhBarra';

async function docLinhasTexto(pg){
  const tc = await pg.getTextContent();
  const itens = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width }));
  itens.sort((a, b) => b.y - a.y || a.x - b.x);
  const linhas = [];
  itens.forEach(i => {
    const l = linhas.find(l => Math.abs(l.y - i.y) < 2.5);
    if (l) l.itens.push(i); else linhas.push({ y: i.y, itens: [i] });
  });
  linhas.forEach(l => { l.itens.sort((a, b) => a.x - b.x); l.txt = l.itens.map(i => i.s.trim()).join('  '); });
  return { linhas, itens };
}

const docNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

function docLerPonto(L){
  const tudo = L.linhas.map(l => l.txt);
  const achar = (re) => { for (const t of tudo){ const m = t.match(re); if (m) return m; } return null; };
  const n = achar(/Nome\s*:\s*(.+?)(?:\s{2,}|$)/i);
  const m = achar(/Matr[ií]cula\s*:\s*(\d{1,7})/i);
  const p = achar(/Per[ií]odo\s*:\s*(\d{2}\/\d{2}\/\d{4})\s*(?:a|até|-)\s*(\d{2}\/\d{2}\/\d{4})/i);
  return { nome: n ? n[1].trim() : '', matricula: m ? String(Number(m[1])) : '', periodo: p ? p[1] + ' a ' + p[2] : '' };
}

function docLerRecibo(L){
  const alto = L.linhas.filter(l => l.y > 841.92 / 2 - 20);   // a via de cima (origem embaixo)
  const meses = 'JANEIRO|FEVEREIRO|MARCO|ABRIL|MAIO|JUNHO|JULHO|AGOSTO|SETEMBRO|OUTUBRO|NOVEMBRO|DEZEMBRO';
  let comp = '';
  for (const l of alto){
    for (const it of l.itens){
      const t = docNorm(it.s).trim();
      if (new RegExp('^(' + meses + ')\\s*/\\s*\\d{4}$').test(t) || /^FERIAS\s+\d{2}\/\d{2}\/\d{4}/.test(t) || /^13\D{0,3}\s*SALARIO/.test(t)){ comp = it.s.trim(); break; }
    }
    if (comp) break;
  }
  if (!comp){
    const t = alto.map(l => l.txt).find(t => /(F[ÉE]RIAS\s+\d{2}\/\d{2}\/\d{4}|13\D{0,3}\s*SAL[ÁA]RIO\s*\d{4})/i.test(t)
      || new RegExp('(' + meses + ')\\s*/\\s*\\d{4}').test(docNorm(t)));
    if (t){ const m = t.match(/(F[ÉE]RIAS\s+\d{2}\/\d{2}\/\d{4}\s*a\s*\d{2}\/\d{2}\/\d{4}|13\D{0,3}\s*SAL[ÁA]RIO\s*\d{4}|[A-ZÇ]+\s*\/\s*\d{4})/i); if (m) comp = m[1]; }
  }
  let numero = '', nome = '';
  const iCab = alto.findIndex(l => /Nome do Funcion/i.test(l.txt));
  const cand = iCab >= 0 ? alto.slice(iCab + 1, iCab + 3) : alto;
  for (const l of cand){
    const i0 = l.itens.findIndex(it => /^\d{3,6}$/.test(it.s.trim()));
    if (i0 >= 0){
      numero = String(Number(l.itens[i0].s.trim()));
      const prox = l.itens[i0 + 1];
      if (prox) nome = prox.s.trim().replace(/\s{2,}.*$/, '');
      break;
    }
    const m = l.txt.match(/^(\d{3,6})\s+([A-ZÀ-Ú][A-ZÀ-Ú .'-]{3,}?)(?:\s{2,}|\s+\d{4}-\d|$)/);
    if (m){ numero = String(Number(m[1])); nome = m[2].trim(); break; }
  }
  return { nome, matricula: numero, competencia_lida: comp };
}

const docTipoLido = comp => {
  const t = docNorm(comp);
  if (/FERIAS/.test(t)) return 'ferias';
  if (/13\D{0,3}\s*SALARIO/.test(t)) return 'decimo';
  if (/^[A-Z]+\s*\/\s*\d{4}$/.test(t.trim())) return 'mensal';
  return comp ? 'outro' : 'mensal';
};

const bytesParaDataUrl = (u8, mime) => new Promise((ok, er) => {
  const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => er(new Error('Não deu para converter o PDF.'));
  fr.readAsDataURL(new Blob([u8], { type: mime || 'application/pdf' }));
});

const dataUrlParaBytes = (url) => { const b = atob(String(url).split(',')[1]); const u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

async function docSubir(tipo, files){
  const S = DOC[tipo];
  const prog = document.getElementById('docProg');
  const diz = t => { if (prog) prog.textContent = t; };
  let lib, pdfjs;
  try{ [lib, pdfjs] = await Promise.all([carregarPdfLib(), carregarPdfJs()]); }
  catch(e){ toast(e.message + ' Nada foi enviado.', 'err'); return; }
  const paginas = [];
  try{
    for (const f of files){
      if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) throw new Error('"' + f.name + '" não é PDF.');
      if (f.size > 40 * 1024 * 1024) throw new Error('"' + f.name + '" é grande demais (máx. 40 MB).');
      const bytes = new Uint8Array(await f.arrayBuffer());
      const leitor = await pdfjs.getDocument({ data: bytes.slice() }).promise;
      const orig = await lib.PDFDocument.load(bytes, { ignoreEncryption: true });
      for (let i = 0; i < leitor.numPages; i++){
        diz('Lendo ' + f.name + (leitor.numPages > 1 ? ' — página ' + (i + 1) + ' de ' + leitor.numPages : '') + '…');
        const pg = await leitor.getPage(i + 1);
        const L = await docLinhasTexto(pg);
        const lido = tipo === 'ponto' ? docLerPonto(L) : docLerRecibo(L);
        // a miniatura: pequena, só para quem confere reconhecer a folha
        const vp1 = pg.getViewport({ scale: 1 });
        const vp = pg.getViewport({ scale: 360 / vp1.width });
        const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        await pg.render({ canvasContext: cx, viewport: vp }).promise;
        const mini = cv.toDataURL('image/jpeg', 0.72);
        // a página separada vira um PDF só dela — é ESTE que vai ao funcionário
        let pdfUrl;
        if (leitor.numPages === 1) pdfUrl = await bytesParaDataUrl(bytes);
        else {
          const novo = await lib.PDFDocument.create();
          const [cp] = await novo.copyPages(orig, [i]); novo.addPage(cp);
          pdfUrl = await bytesParaDataUrl(await novo.save());
        }
        paginas.push(Object.assign({ arquivo_nome: f.name + (leitor.numPages > 1 ? ' (pág. ' + (i + 1) + ')' : ''),
          pdf: pdfUrl, miniatura: mini }, lido,
          tipo === 'recibo' ? { subtipo: docTipoLido(lido.competencia_lida) } : {}));
      }
    }
    // em lotes: um PDF de página tem ~100–300 KB
    for (let k = 0; k < paginas.length; k += 6){
      diz('Enviando ' + Math.min(k + 6, paginas.length) + ' de ' + paginas.length + '…');
      await rpc('tf_rhdoc_preparar', { p_tipo: tipo, p_competencia: S.mes, p_itens: paginas.slice(k, k + 6) });
    }
    diz('');
    toast(paginas.length + ' página(s) subida(s). Confira e libere.', 'ok');
  }catch(e){ diz(''); toast(e.message, 'err'); }
  pintarRHDocs(tipo);
}

function docConferencia(tipo){
  const C = DOC_CFG[tipo], S = DOC[tipo], R = S.rasc;
  const ras = R.rascunhos || [];
  const ok = ras.filter(r => (r.casamento === 'ok' || r.casamento === 'manual') && !r.bloqueio
    && !(r.conflito && ['assinado_func','concluido'].includes(r.conflito.situacao)) && !r.repetido);
  const funcs = R.funcionarios || [];
  const ativos = funcs.length, semDoc = funcs.filter(f => !f.tem);
  const donos = {}; ras.forEach(r => { if (r.usuario_id) donos[r.usuario_id] = (donos[r.usuario_id] || 0) + 1; });
  const box = document.createElement('div'); box.className = 's49Conf';
  const alertas = [];
  if (tipo === 'ponto' && ras.length !== ativos) alertas.push(ras.length + ' página(s) para ' + ativos + ' funcionário(s) ativo(s) com ficha de RH.');
  if (semDoc.length) alertas.push('Ativo(s) sem ' + (tipo === 'ponto' ? 'folha' : 'recibo mensal') + ' neste mês: ' + semDoc.map(f => f.nome).join(', ') + '.');
  const sem = ras.filter(r => !r.usuario_id).length;
  if (sem) alertas.push(sem + ' página(s) sem dono confirmado.');
  if (ras.some(r => r.repetido)) alertas.push('Há pessoa com duas páginas do mesmo documento — descarte a que sobra.');
  box.innerHTML = '<div class="rhSecT">Conferir antes de liberar <span class="nota">' + ras.length + ' página(s) subida(s) · '
    + ok.length + ' pronta(s). O funcionário não vê nada até você clicar "Liberar".</span></div>'
    + (alertas.length ? '<div class="aviso">' + alertas.map(esc).join('<br>') + '</div>' : '')
    + '<div class="s49ConfL"></div>'
    + '<div class="linhaBtns"><button class="btn pri" type="button" id="cfLib"' + (ok.length ? '' : ' disabled') + '>Liberar os '
    + ok.length + ' conferido(s)</button><button class="btn" type="button" id="cfDesc">Descartar todas</button></div>';
  const L = box.querySelector('.s49ConfL');
  ras.forEach(r => {
    const pronto = ok.includes(r);

const DOC_POS_PONTO = { func: { x0: 410, x1: 539, y: 65 }, emp: { x0: 410, x1: 539, y: 43 } };

const DOC_POS_RECIBO = [ { ass: { x0: 249, x1: 520, y: 462 }, data: { x0: 102, x1: 232, y: 462 }, rot: 449 },
                         { ass: { x0: 249, x1: 520, y: 95 },  data: { x0: 102, x1: 232, y: 95 },  rot: 82 } ];

const docSelo = (em, metodo) => 'Confirmado por ' + (metodo === 'passkey' ? 'digital' : 'PIN') + ' em ' + rhDT(em);

async function docPosicoes(tipo, bytes){
  const pdfjs = await carregarPdfJs();
  const d = await pdfjs.getDocument({ data: bytes.slice() }).promise;
  const L = await docLinhasTexto(await d.getPage(1));
  const linhaDe = re => L.linhas.find(l => re.test(l.txt));
  const sublinhado = (l) => { const it = l && l.itens.find(i => /_{6,}/.test(i.s) && i.x > 300);
    return it ? { x0: it.x + (it.s.indexOf('_') > 0 ? it.w * it.s.indexOf('_') / it.s.length : 0), x1: it.x + it.w } : null; };
  if (tipo === 'ponto'){
    const f = linhaDe(/Como Funcion/i), e = linhaDe(/Como Empregador/i);
    const pos = JSON.parse(JSON.stringify(DOC_POS_PONTO));
    if (f){ pos.func.y = f.y; const s = sublinhado(f); if (s){ pos.func.x0 = s.x0; pos.func.x1 = s.x1; } }
    if (e){ pos.emp.y = e.y;  const s = sublinhado(e); if (s){ pos.emp.x0 = s.x0; pos.emp.x1 = s.x1; } }
    return { pos, achou: !!(f && e) };
  }
  const rot = L.itens.filter(i => /Assinatura do Funcion/i.test(i.s)).sort((a, b) => b.y - a.y);
  const datas = L.itens.filter(i => /^Data$/i.test(i.s.trim())).sort((a, b) => b.y - a.y);
  const pos = JSON.parse(JSON.stringify(DOC_POS_RECIBO));
  if (rot.length === 2){
    rot.forEach((r, k) => {
      pos[k].rot = r.y;
      // a linha de assinatura e a da data ficam ~12–13 pt acima dos rótulos
      const lin = L.itens.filter(i => /_{6,}/.test(i.s) && i.y > r.y + 4 && i.y < r.y + 22);
      const la = lin.find(i => i.x > 200), ld = lin.find(i => i.x < 200);
      pos[k].ass.y = la ? la.y : r.y + 12.5; pos[k].data.y = ld ? ld.y : r.y + 12.5;
      if (la){ pos[k].ass.x0 = la.x; pos[k].ass.x1 = la.x + la.w; }
      if (ld){ pos[k].data.x0 = ld.x; pos[k].data.x1 = ld.x + ld.w; pos[k].data.s = ld.s; }
      const dt = datas[k]; if (dt) pos[k].dataRot = dt.y;
    });
  }
  return { pos, achou: rot.length === 2 };
}

function docTrechosData(s, x0, x1){
  const larg = c => c === '_' ? 556 : c === '/' ? 278 : 500;
  const total = [...s].reduce((a, c) => a + larg(c), 0) || 1, k = (x1 - x0) / total;
  const out = []; let pos = 0, ini = null;
  [...s].forEach(c => {
    if (c === '_' && ini === null) ini = pos;
    if (c !== '_' && ini !== null){ out.push({ x0: x0 + ini * k, x1: x0 + pos * k }); ini = null; }
    pos += larg(c);
  });
  if (ini !== null) out.push({ x0: x0 + ini * k, x1: x0 + pos * k });
  return out;
}

async function docCarimbarUm(lib, x){
  const bytes = dataUrlParaBytes(x.pdf);
  const { pos } = await docPosicoes(x.tipo, bytes);
  const pdf = await lib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const pg = pdf.getPages()[0];
  const font = await pdf.embedFont(lib.StandardFonts.Helvetica);
  const cinza = lib.rgb(0.15, 0.25, 0.45);
  const rubrica = async (dataUrl, x0, x1, yLinha, alt) => {
    if (!dataUrl) return 0;
    const img = dataUrl.startsWith('data:image/png') ? await pdf.embedPng(dataUrlParaBytes(dataUrl)) : await pdf.embedJpg(dataUrlParaBytes(dataUrl));
    let h = alt, w = img.width * h / img.height;
    const maxW = Math.min(110, x1 - x0); if (w > maxW){ w = maxW; h = img.height * w / img.width; }
    pg.drawImage(img, { x: x0 + (x1 - x0 - w) / 2, y: yLinha + 1, width: w, height: h });
    return w;
  };
  const texto = (t, xx, yy, tam) => pg.drawText(t, { x: xx, y: yy, size: tam, font, color: cinza });
  if (x.tipo === 'ponto'){
    await rubrica(x.func.rubrica, pos.func.x0, pos.func.x1, pos.func.y, 15);
    texto(docSelo(x.func.em, x.func.metodo), pos.func.x0, pos.func.y - 5.5, 4.6);
    if (x.etapa === 'final' && x.emp){
      await rubrica(x.emp.rubrica, pos.emp.x0, pos.emp.x1, pos.emp.y, 13);
      texto(docSelo(x.emp.em, x.emp.metodo), pos.emp.x0, pos.emp.y - 5.5, 4.6);
    }
    texto('Assinaturas reproduzidas eletronicamente. Autenticidade comprovada pelo registro de confirmação individual.', 18, 22, 5.2);
    texto('TapHub · verificação do original ' + String(x.pdf_hash).slice(0, 24) + '…', 18, 15.5, 4.6);
  } else {
    const dia = rhDT(x.func.em).slice(0, 10);
    for (const v of pos){
      await rubrica(x.func.rubrica, v.ass.x0, v.ass.x1, v.ass.y, 18);
      // o selo logo ABAIXO da linha, encostado à direita: entre a linha e o
      // rótulo "Assinatura do Funcionário" (centralizado) há ~12 pt — no 1º
      // teste ele ia para baixo do rótulo e cruzava a borda do quadro.
      const selo = docSelo(x.func.em, x.func.metodo);
      texto(selo, v.ass.x1 - font.widthOfTextAtSize(selo, 4.6), v.ass.y - 5.5, 4.6);
      // a linha da data é "____/____/____": dia, mês e ano, cada um no seu
      // trecho. Centralizar a data inteira punha as barras do papel em cima
      // dos números (visto no 1º teste com o recibo real).
      const partes = dia.split('/');
      const trechos = docTrechosData(v.data.s || '__________/___________/_______________', v.data.x0, v.data.x1);
      if (trechos.length === 3) trechos.forEach((t, i) => {
        const w = font.widthOfTextAtSize(partes[i], 8); texto(partes[i], t.x0 + (t.x1 - t.x0 - w) / 2, v.data.y + 2, 8); });
      else { const w = font.widthOfTextAtSize(dia, 8); texto(dia, v.data.x0 + (v.data.x1 - v.data.x0 - w) / 2, v.data.y + 2, 8); }
    }
    const yRod = Math.max(8, (pos[1].rot || 82) - 22);
    texto('Assinatura reproduzida eletronicamente. Autenticidade comprovada pelo registro de confirmação individual.', 60, yRod, 5.2);
    texto('TapHub · verificação do original ' + String(x.pdf_hash).slice(0, 24) + '…', 60, yRod - 6.5, 4.6);
  }
  pdf.setProducer('TapHub · Engetap');
  return bytesParaDataUrl(await pdf.save());
}

async function docCarimbar(tipo, ids){
  if (DOC.carimbando) return;
  DOC.carimbando = true;
  const prog = document.getElementById('docProg');
  try{
    const lista = await rpc('tf_rhdoc_para_carimbar', { p_tipo: tipo, p_ids: ids || null });
    if (!lista.length) return;
    const lib = await carregarPdfLib();
    let n = 0;
    for (const x of lista){
      if (prog) prog.textContent = 'Gerando o PDF assinado ' + (++n) + ' de ' + lista.length + ' (' + x.nome + ')…';
      try{
        const url = await docCarimbarUm(lib, x);
        await rpc('tf_rhdoc_gravar_carimbado', { p_id: x.id, p_etapa: x.etapa, p_pdf: url, p_hash_original: x.pdf_hash });
      }catch(e){ console.warn('[carimbo]', x.id, e); toast('Não consegui gerar o PDF assinado de ' + x.nome + ': ' + e.message, 'err'); }
    }
    if (prog) prog.textContent = '';
    if (visao === DOC_CFG[tipo].v && !ids) pintarRHDocs(tipo);
  }catch(e){ if (prog) prog.textContent = ''; }
  finally{ DOC.carimbando = false; }
}

async function rhImprimirTermoPonto(f){
  let textos = RH.textos;
  try{ if (!textos || !textos.termo_ponto_recibo) textos = RH.textos = await rpc('tf_rh_textos', {}); }catch(e){ toast(e.message,'err'); return; }
  const t = textos.termo_ponto_recibo;
  if (!t){ toast('Falta rodar o 104_s49.sql (o texto do termo não existe).', 'err'); return; }
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const nome = f.usuario.nome, funcao = (f.ficha && f.ficha.funcao) || '______________________';
  const empresa = (textos.empresa || {}).texto || 'Engetap';
  const corpo = String(t.texto).replace(/\{NOME\}/g, nome).replace(/\{FUNCAO\}/g, funcao).replace(/\{EMPRESA\}/g, empresa);
  try{ doc.addImage(LOGO_ENGETAP, 'JPEG', 15, 12, 52, 12.6); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(11.5);
  doc.text(doc.splitTextToSize(t.titulo.toUpperCase(), 120), 195, 15, { align:'right' });
  doc.setDrawColor(190); doc.line(15, 29, 195, 29);
  doc.setFont('helvetica','normal');
  let fs = 10.2, linhas;
  for (; fs >= 7.5; fs -= 0.2){
    doc.setFontSize(fs); linhas = [];
    corpo.split('\n').forEach(p => { if (!p.trim()) { linhas.push(''); return; } doc.splitTextToSize(p, 180).forEach(l => linhas.push(l)); });
    if (36 + linhas.length * fs * 0.42 < 250) break;
  }
  doc.setFontSize(fs); doc.text(linhas, 15, 37, { lineHeightFactor: 1.2 });
  doc.setFontSize(10);
  doc.text('Divinópolis/MG, _____ de ____________________ de ________', 15, 262);
  doc.line(105, 278, 195, 278);
  doc.setFont('helvetica','bold'); doc.text(nome, 150, 283, { align:'center' });
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Assinatura do(a) funcionário(a) · ' + funcao, 150, 287.5, { align:'center' });
  doc.setFontSize(7); doc.setTextColor(130);
  doc.text(empresa + ' · TapHub · termo gerado em ' + rhDT(new Date().toISOString()) + ' · texto versão ' + (t.versao || 1), 105, 293, { align:'center' });
  doc.save('Termo do ponto e do recibo - ' + nome + '.pdf');
}

async function rhLerArquivo(file, lado){
  if (file.type === 'application/pdf'){
    if (file.size > 5 * 1024 * 1024) throw new Error('PDF grande demais (máx. 5 MB). Escaneie com resolução menor.');
    const dados = await new Promise((ok, er) => { const fr = new FileReader(); fr.onload = () => ok(fr.result);
      fr.onerror = () => er(new Error('Não deu para ler o arquivo.')); fr.readAsDataURL(file); });
    return { mime:'application/pdf', dados };
  }
  if (!/^image\//.test(file.type)) throw new Error('Use foto (JPG/PNG) ou PDF.');
  const r = await reduzirImagem(file, lado || 1800, 0.85, true, true);
  return { mime:'image/jpeg', dados: r.dados };
}

let _pdfjs = null;

function carregarPdfJs(){
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((ok, err) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); }
      catch(e){ err(new Error('A leitura de PDF não inicializou.')); } };
    s.onerror = () => { _pdfjs = null; err(new Error('Não consegui baixar o leitor de PDF. Sem internet? Envie uma FOTO do termo.')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}

function rhDiasTxt(d){
  if (d == null || d === '') return '';
  d = Number(d);
  if (d < 0) return 'venceu há ' + (-d) + (d === -1 ? ' dia' : ' dias');
  if (d === 0) return 'vence hoje';
  return 'vence em ' + d + (d === 1 ? ' dia' : ' dias');

async function rhLerArquivoGrande(file){
  if (file.type === 'application/pdf'){
    if (file.size > 15 * 1024 * 1024) throw new Error('PDF grande demais (máx. 15 MB). Reduza o arquivo (ex.: "Imprimir como PDF" com qualidade menor).');
    const dados = await new Promise((ok, er) => { const fr = new FileReader(); fr.onload = () => ok(fr.result);
      fr.onerror = () => er(new Error('Não deu para ler o arquivo.')); fr.readAsDataURL(file); });
    return { mime:'application/pdf', dados };
  }
  return rhLerArquivo(file, 2200);
}

async function rhArqDoInput(inp, grande){
  const f = inp && inp.files && inp.files[0];
  if (!f) return null;
  const a = grande ? await rhLerArquivoGrande(f) : await rhLerArquivo(f, 2200);
  return { nome: f.name, mime: a.mime, conteudo: a.dados };
}

function rhBaixarBlob(blob, nome){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

let _pdflib = null;

function carregarPdfLib(){
  if (_pdflib) return _pdflib;
  _pdflib = new Promise((ok, err) => {
    if (window.PDFLib) return ok(window.PDFLib);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    s.onload = () => window.PDFLib ? ok(window.PDFLib) : err(new Error('A biblioteca de juntar PDF não inicializou.'));
    s.onerror = () => { _pdflib = null; err(new Error('Não consegui baixar a biblioteca de juntar PDF. Sem internet? Gere em ZIP.')); };
    document.head.appendChild(s);
  });
  return _pdflib;
}

function rhContarPainel(p){
  const velhas = (p.aguardando || []).filter(e => Number(e.dias_aguardando) > 2).length;
  const vencidos = (p.docs_vencendo || []).filter(x => Number(x.dias) < 0).length;
  // S44: as separadas (falta o "entreguei"), a devolução contestada e o que espera avaliação
  const contest = (p.devolucoes_pendentes || []).filter(x => x.status === 'contestada').length;
  return velhas + (p.nao_recebidas || []).length + (p.avisos || []).length + (p.pedidos || []).length
       + (p.duvidas_abertas || []).length + vencidos
       + (p.separadas || []).length + contest + (p.aguardando_avaliacao || []).length;
}

async function rhDesligamento(uid, depois){

  const lotes = {}; devP.forEach(d => { (lotes[d.lote] = lotes[d.lote] || []).push(d); });

    h += Object.keys(lotes).map(k => { const L = lotes[k], c = L[0].status === 'contestada';
      return '<div class="rhLin' + (c ? ' velha' : '') + '"><span class="t">' + esc(L.map(d => d.epi_nome + ' (' + RH_DESTINO_CURTO[d.destino] + ')').join(', '))

        + '<span class="a">' + (!c && f.ficha.celular ? '<a class="btn mini" target="_blank" rel="noopener" href="' + esc(rhWhatsDev(f.ficha.celular, f.usuario.nome,
            L.map(d => d.epi_nome).join(', '))) + '">WhatsApp</a>' : '')
        + '<button class="btn mini" type="button" data-sem="' + esc(k) + '">Sem a confirmação dele</button>'
        + '<button class="btn mini" type="button" data-dcanc="' + esc(k) + '">Cancelar e refazer</button></span></div>'; }).join('');
  }
  if (posse.length) h += '<div class="rhLin"><span class="t">' + posse.length + ' item(ns) com a pessoa sem devolução registrada<small>'
      + esc(posse.map(x => x.epi_nome).join(', ')) + '</small></span><span class="a"><button class="btn mini pri" type="button" id="dsReg">Registrar a devolução…</button></span></div>';
  if (p2) h += '<p class="nota" style="margin:0">' + ((f.devolucoes || []).some(d => d.status !== 'cancelada') ? 'Devolução registrada e resolvida.' : 'Nada com a pessoa.') + '</p>';
  h += '<div class="secTit">' + ((p1 && p2) ? '' : falta) + '3 · Desligar</div>'
    + '<div class="dupla"><div class="campo"><label for="dD">Data do desligamento</label><input id="dD" type="date" value="' + isoHoje() + '"></div>'
    + '<div class="campo"><label for="dM">Motivo (opcional)</label><input id="dM" type="text" maxlength="200"></div></div>'
    + ((p1 && p2) ? '' : '<p class="nota">Libera depois dos passos 1 e 2.</p>')
    + '<p class="nota" id="rhMsg" style="color:var(--crit)"></p>';
  abrirModal('Desligar ' + f.usuario.nome, h,
    [ { label:'Fechar', onClick: () => { fecharModal(); depois && depois(); } },
      { label:'Desligar', pri:true, onClick: async () => {
          if (!(p1 && p2)){ document.getElementById('rhMsg').textContent = 'Faça antes os passos 1 e 2.'; return; }

               depois && depois(); }

  const m = document.getElementById('modal');
  m.querySelectorAll('[data-canc]').forEach(b => b.addEventListener('click', () => { fecharModal(); rhCancelar(b.dataset.canc, () => rhDesligamento(uid, depois)); }));
  m.querySelectorAll('[data-sem]').forEach(b => b.addEventListener('click', () => { fecharModal(); rhDevSemConfirmacao(b.dataset.sem, () => rhDesligamento(uid, depois)); }));
  m.querySelectorAll('[data-dcanc]').forEach(b => b.addEventListener('click', () => { fecharModal(); rhDevCancelar(b.dataset.dcanc, () => rhDesligamento(uid, depois)); }));
  const br = document.getElementById('dsReg');
  if (br) br.addEventListener('click', () => { fecharModal(); rhRegistrarDevolucao(uid, 'desligamento', () => rhDesligamento(uid, depois)); });
}

  }
  if (visao !== 'rhpt') return;
  if (PT.aba === 'escalas') return ptEscalas(corpo);
  if (PT.aba === 'importar') return ptImportar(corpo);
  if (PT.aba === 'parametros') return ptParametros(corpo);
  if (PT.aba === 'fechamento') return ptFechamento(corpo);
  if (PT.aba === 'saude') return ptSaude(corpo);
  if (PT.aba === 'hoje'){ ptContarPedidos(); return ptHoje(corpo); }
  if (PT.aba === 'pedidos') return ptPedidos(corpo);
  return ptEspelhos(corpo);
}

// ── ESPELHOS (consulta) ─────────────────────────────────────────────────────
async function ptEspelhos(corpo){
  const pessoas = (PT.pessoas || []).filter(p => p.vinculo === 'clt' || p.matricula);
  if (!PT.sel && pessoas.length) PT.sel = pessoas[0].usuario_id;
  const hojeMes = isoHoje().slice(0, 7) + '-01';
  try{ PT.meses = PT.sel ? await rpc('tf_ponto_meses', { p_usuario: PT.sel }) : []; }catch(e){ PT.meses = []; }
  const meses = Array.from(new Set([hojeMes].concat(PT.meses || []))).sort().reverse();
  if (!PT.mes || !meses.includes(PT.mes)) PT.mes = (PT.meses && PT.meses[0]) || hojeMes;
  corpo.innerHTML = '';
  const barra = document.createElement('div'); barra.className = 'rhBarra';
  barra.innerHTML = '<label class="ptCampo">Funcionário <select id="ptSel">'
    + pessoas.map(p => '<option value="' + esc(p.usuario_id) + '"' + (p.usuario_id === PT.sel ? ' selected' : '') + '>'
        + esc(p.nome) + (p.funcao ? ' · ' + esc(p.funcao) : '') + (p.situacao !== 'ativo' ? ' (desligado)' : '') + '</option>').join('')
    + '</select></label><label class="ptCampo">Mês <select id="ptMes">'
    + meses.map(m => '<option value="' + m + '"' + (m === PT.mes ? ' selected' : '') + '>' + esc(ptMesRot(m)) + '</option>').join('')
    + '</select></label><label class="chk ptChk"><input type="checkbox" id="ptDesc"' + (PT.desc ? ' checked' : '') + '> Mostrar desconsideradas e repetidas</label>';
  corpo.appendChild(barra);
  barra.querySelector('#ptSel').addEventListener('change', e => { PT.sel = e.target.value; PT.mes = ''; ptEspelhos(corpo); });
  barra.querySelector('#ptMes').addEventListener('change', e => { PT.mes = e.target.value; ptEspelhoCarregar(); });
  barra.querySelector('#ptDesc').addEventListener('change', e => { PT.desc = e.target.checked; ptEspelhoDesenhar(); });
  const area = document.createElement('div'); area.id = 'ptEsp'; corpo.appendChild(area);
  if (!pessoas.length){
    area.innerHTML = '<div class="vazio2"><b>Ninguém no ponto ainda</b><p>Quem é CLT na ficha do RH aparece aqui. '
      + 'Para trazer o histórico, use a aba “Importar EzPoint”.</p></div>';
    return;
  }
  ptEspelhoCarregar();
}

async function ptEspelhoCarregar(){
  const area = document.getElementById('ptEsp'); if (!area) return;
  area.innerHTML = '<p class="nota">Carregando…</p>';
  try{
    [PT.esp, PT.espPed, PT.espPdf] = await Promise.all([rpc('tf_ponto_espelho', { p_usuario: PT.sel, p_mes: PT.mes }),
      rpc('tf_ponto_espelho_pedidos', { p_usuario: PT.sel, p_mes: PT.mes }), rpc('tf_ponto_espelhos_pdf', { p_usuario: PT.sel })]);
  }catch(e){ area.innerHTML = ''; return rhFalha(area, e.message, ptEspelhoCarregar); }
  ptEspelhoDesenhar();
}

const PT_PTIPO = { esqueci: 'Esqueci de bater', justificar: 'Justificativa', atestado: 'Atestado' };

const PT_TDIA = { feriado: 'feriado', dispensa: 'dispensa dada pela Engetap', folga_banco: 'folga a negociar', domingo: 'domingo' };
const PT_ALERTA = { mais_10h: 'mais de 10h', mais_2h_extra: 'mais de 2h a mais (art. 59)', almoco_curto: 'almoço menor que 1h',
  almoco_quase: 'almoço quase 1h (55 a 59 min)', almoco_longo: 'almoço maior que 2h', sem_intervalo_6h: 'mais de 6h seguidas sem intervalo',
  descanso_11h: 'menos de 11h de descanso (art. 66)', batida_faltando: 'batida faltando', falta: 'falta', trabalhou_na_folga: 'trabalhou no dia em que escolheu folgar' };
/** RH9 · item #7 da lista: a célula "Banco" do dia — o acumulado depois do dia (615), e as linhas
 *  "venceu" (lote com mais de 6 meses, pago com 50%) e "pago na folha" (no último dia do mês). */
function ptBancoDia(d){
  if (d.banco_min === null || d.banco_min === undefined){
    if (d.futuro || d.hoje || d.saldo_min === null || d.saldo_min === undefined) return '';
    return d.banco === 'banco' ? '' : '<small class="ptSemAc">sem acordo</small>';
  }
  const v = Number(d.banco_min);
  let h = '<span class="' + (v > 0 ? 'ptMais' : v < 0 ? 'ptMenos' : '') + '">' + ptSaldo(v) + '</span>';
  if (Number(d.banco_vencido_min)) h += '<small class="ptBancoEv">venceu ' + ptHm(d.banco_vencido_min) + ', vai pago com 50%</small>';
  if (Number(d.banco_pago_min)) h += '<small class="ptBancoEv">pago na folha −' + ptHm(d.banco_pago_min) + '</small>';
  return h;
}
/** O banco do mês: o acordo, o lote antigo e o que vence nos próximos dias (P3, P13). */
function ptBancoResumo(E){
  const B = (E.totais || {}).banco; if (!B) return '';
  if (!B.acordo){
    const M = B.mes || {};
    return '<div class="ptBanco aviso"><b>Sem acordo de banco assinado.</b> Neste mês: ' + ptHm(M.sem_acordo_mais || 0) + ' a mais (hora extra de 50%) e '
      + ptHm(M.sem_acordo_menos || 0) + ' a menos (o escritório decide, P19). Informe a data do acordo em Escalas e regras.</div>';
  }
  const L0 = B.lote_antigo || {}, M = B.mes || {}, av = B.a_vencer || [];
  return '<div class="ptBanco"><b>Banco de horas</b> · acordo assinado em ' + esc(dataBR(B.acordo))
    + (L0.criado ? ' · lote antigo ' + ptSaldo(L0.total_min) + ' (EzPoint ' + ptSaldo(L0.ez_min) + ' + até a véspera do acordo ' + ptSaldo(L0.antes_acordo_min) + ')'
                 : ' · lote antigo em formação: ' + ptSaldo(L0.total_min))
    + '<br>No mês: crédito ' + ptHm(M.credito || 0) + ' · débito ' + ptHm(M.debito || 0)
    + (Number(M.vencido) ? ' · <b>vencido ' + ptHm(M.vencido) + ' (pago com 50% no fechamento)</b>' : '')
    + (av.length ? '<br><span class="ptSem">Vence em breve: ' + av.map(x => ptHm(x.restante) + ' em ' + esc(dataBR(x.vence_em))).join(' · ') + '</span>' : '')
    + '</div>';
}

/** Baixa um arquivo do bucket ponto (só quem aprova, ou o dono). */
async function ptBaixarArq(caminho, nome){
  const cfg = window.TF_CONFIG || {};
  try{
    const r = await fetch(cfg.SUPABASE_URL + '/storage/v1/object/authenticated/ponto/' + caminho.split('/').map(encodeURIComponent).join('/'),
                          { headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + sessao.token } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const bl = await r.blob(), a = document.createElement('a');
    a.href = URL.createObjectURL(bl); a.download = nome || caminho.split('/').pop(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }catch(e){ toast('Não consegui baixar: ' + e.message, 'err'); }
}

function ptPdfLib(){
  if (window.pdfMake && window.pdfMake.vfs) return Promise.resolve(window.pdfMake);
  const carrega = src => new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => err(new Error(src)); document.head.appendChild(s); });
  return carrega('../doc/vendor/pdfmake.min.js').then(() => carrega('../doc/vendor/vfs_fonts.js')).then(() => window.pdfMake);
}

    if (!L.length){ el.innerHTML = '<p class="nota">Nenhuma batida do TapField neste dia.</p>'; return; }

        + (b.sem_localizacao ? '<span class="ptSem">sem localização</span>' : !b.lat ? '<small>localização apagada (prazo de guarda, P27)</small>'

      + '<p class="nota">Fotos guardadas por 5 anos (P27), só para mostrar quem bateu: sem reconhecimento facial.</p>';
    const cfg = window.TF_CONFIG || {}, tok = sessao.token;

  }catch(e){ const el = document.getElementById('ptFD'); if (el) el.textContent = e.message; }
}

// RH7 · OS DOCUMENTOS DO GOV.BR (612) — o acordo de banco de horas e o termo de adesão que cada CLT assina no
// gov.br e envia pelo TapField. Aceitar grava a data no acordo ou na orientação do almoço (Bruno, 04/11: D1–D6).
// Nada se apaga: o envio recusado e o aceito ficam guardados para sempre (D4).
const PT_GOV_ROT = { acordo: 'Acordo de banco de horas', adesao: 'Termo de adesão' };
function ptGovCel(p, tipo){
  const s = p[tipo] || {};
  const t = { para_assinar: '<span class="ptSem">não enviou</span>', recusado: '<span class="ptSit crit">recusado</span> <small>' + esc(s.motivo_recusa || '') + '</small>',
              enviado: '<span class="ptSit aviso">enviado em ' + esc(ptDHBR(s.enviado_em).slice(0, 10)) + '</span>',
              aceito: '<span class="ptSit ok">aceito · assinado em ' + esc(dataBR(s.data_valida)) + '</span>' }[s.situacao] || '—';
  const bt = [];
  if (s.pdf_path) bt.push('<button class="btn mini" type="button" data-gvver="' + esc(s.pdf_path) + '" data-gvnome="' + esc(PT_GOV_ROT[tipo] + ' - ' + p.nome + '.pdf') + '">Ver</button>');
  if (s.situacao === 'enviado') bt.push('<button class="btn mini pri" type="button" data-gvconf="' + esc(s.id) + '" data-gvtipo="' + tipo + '" data-gvp="' + esc(p.usuario_id) + '">Conferir…</button>');
  if (s.situacao === 'aceito') bt.push(s.empresa_pdf_path
    ? '<button class="btn mini" type="button" data-gvver="' + esc(s.empresa_pdf_path) + '" data-gvnome="' + esc(PT_GOV_ROT[tipo] + ' - ' + p.nome + ' (assinado pela Engetap).pdf') + '">Com a Engetap</button>'
    : '<label class="btn mini" title="O PDF que você assinou no gov.br por cima do que o funcionário enviou">Enviar com a assinatura da Engetap<input type="file" accept="application/pdf,.pdf" hidden data-gvemp="' + esc(s.id) + '" data-gvp="' + esc(p.usuario_id) + '" data-gvtipo="' + tipo + '"></label>');
  return t + (bt.length ? '<br>' + bt.join(' ') : '');
}
function ptGovSecao(GV){
  const ok = t => GV.filter(p => (p[t] || {}).situacao === 'aceito').length;
  return '<h3 class="ptH3">Documentos do gov.br</h3>'
    + '<p class="nota">Cada CLT baixa no TapField o acordo de banco de horas e o termo de adesão já preenchidos, assina no gov.br e envia de volta. '
    + 'Confira e aceite: a data da assinatura entra sozinha em "Acordo de banco" e em "Orientação do almoço". Prazo: 30/11. '
    + 'Acordos aceitos: <b>' + ok('acordo') + ' de ' + GV.length + '</b> · termos de adesão aceitos: <b>' + ok('adesao') + ' de ' + GV.length + '</b>.</p>'
    + '<div class="rhfdWrap"><table class="tbl ptTab"><thead><tr><th>Pessoa</th><th>Acordo de banco de horas</th><th>Termo de adesão</th></tr></thead><tbody>'
    + GV.map(p => '<tr><td><b>' + esc(p.nome) + '</b></td><td>' + ptGovCel(p, 'acordo') + '</td><td>' + ptGovCel(p, 'adesao') + '</td></tr>').join('')
    + '</tbody></table></div>';
}
function ptGovLigar(corpo, GV){
  corpo.querySelectorAll('[data-gvver]').forEach(b => b.addEventListener('click', () => ptBaixarArq(b.dataset.gvver, b.dataset.gvnome)));
  corpo.querySelectorAll('[data-gvconf]').forEach(b => b.addEventListener('click', () => {
    const p = GV.find(x => x.usuario_id === b.dataset.gvp), s = p[b.dataset.gvtipo];
    ptGovConferir(p, b.dataset.gvtipo, s); }));
  corpo.querySelectorAll('[data-gvemp]').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    try{
      if (f.size > 5 * 1024 * 1024) throw new Error('o arquivo passa de 5 MB');
      const buf = await f.arrayBuffer(), h = await ptSha256(buf);
      const caminho = 'espelhos/' + inp.dataset.gvp + '/gov-' + inp.dataset.gvtipo + '-' + h.slice(0, 12) + '.pdf';
      const r = await Nucleo.storage.enviar('ponto', caminho, new Blob([buf], { type: 'application/pdf' }));
      if (r !== 'ok' && r !== 'ja_existia') throw new Error('o armazenamento recusou');
      await rpc('tf_ponto_gov_empresa_pdf', { p_id: inp.dataset.gvemp, p_path: caminho, p_hash: h });
      toast('Versão com a assinatura da Engetap guardada.'); pintarPonto();
    }catch(e){ toast('Não consegui guardar: ' + e.message, 'err'); }
  }));
}
function ptGovConferir(p, tipo, s){
  abrirModal(PT_GOV_ROT[tipo] + ' · ' + p.nome,
    '<p class="nota">Abra o PDF enviado e confira: é o documento certo, com o nome da pessoa e a assinatura dela pelo gov.br. '
    + 'Para validar a assinatura, use <b>validar.iti.gov.br</b>. Ao aceitar, a data abaixo vai para "' + (tipo === 'acordo' ? 'Acordo de banco' : 'Orientação do almoço') + '".</p>'
    + '<p><button class="btn" type="button" id="ptGvVer">Abrir o PDF enviado</button></p>'

const PT_FST = { em_andamento: ['mês em andamento', ''], aberto: ['aguardando o lançamento', 'aviso'], para_assinar: ['liberado · falta assinar', 'aviso'],
  assinado: ['assinado', 'ok'], fechado_sem_assinatura: ['fechou sem a assinatura', 'crit'], contestado: ['fechou contestado', 'crit'] };
const PT_INT = { banco: 'tudo no banco', limite_ir: 'em dinheiro até o limite do IR', horas: 'em dinheiro: ' };
const ptDataBR = iso => iso ? String(iso).slice(8, 10) + '/' + String(iso).slice(5, 7) : '—';
function ptMesesFech(inicio){
  const L = [], hoje = isoHoje(), d = new Date(Number(hoje.slice(0, 4)), Number(hoje.slice(5, 7)) - 2, 1), ini = String(inicio || '2026-11-01').slice(0, 7) + '-01';
  for (let i = 0; i < 12; i++){ const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
    if (iso < ini) break; L.push(iso); d.setMonth(d.getMonth() - 1); }
  return L;
}

    (p.contestacoes || []).forEach(c => {

  h += '</tbody></table></div><div id="ptFolgasEsc"></div>';

const PT_RES_COL = [['nome', 'Funcionário'], ['matricula', 'Matrícula'], ['situacao', 'Situação'], ['trabalhadas_min', 'Trabalhadas'], ['carga_min', 'Carga'],

  ['he50_sem_acordo_min', 'HE 50% · sem acordo'], ['almoco_50_min', 'Almoço a pagar (50%)'], ['he100_min', 'HE 100% (domingo/feriado)'],

  ['faltas_sem_acordo_min', 'A menos sem acordo (decidir)'], ['faltas_dias', 'Faltas (dias)']];
async function ptResumoContador(tipo){
  let R; try{ R = await rpc('tf_ponto_resumo_contador', { p_mes: PT.fmes }); }catch(e){ toast(e.message, 'err'); return; }
  const val = (p, k) => k === 'intencao' ? (p.acordo ? (p.intencao ? PT_INT[p.intencao] + (p.intencao === 'horas' ? ptHm(p.intencao_min) : '') : 'banco') : 'sem acordo')
    : k === 'situacao' ? (PT_FST[p.situacao] || [p.situacao])[0] : /_min$/.test(k) ? (p[k] === null || p[k] === undefined ? '' : ptHm(p[k])) : (p[k] ?? '');
  const mes = PT.fmes.slice(0, 7), nome = 'Resumo do ponto para o contador ' + mes;
  if (tipo === 'csv'){
    const linhas = [PT_RES_COL.map(c => c[1])].concat((R.pessoas || []).map(p => PT_RES_COL.map(c => val(p, c[0]))));
    const csv = '﻿' + linhas.map(l => l.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nome + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return;
  }
  try{
    const pm = await ptPdfLib();
    const body = [PT_RES_COL.map(c => ({ text: c[1], bold: true, fontSize: 6.5 }))].concat((R.pessoas || []).map(p => PT_RES_COL.map(c => ({ text: String(val(p, c[0])), fontSize: 7 }))));
    const doc = { pageSize: 'A4', pageOrientation: 'landscape', pageMargins: [20, 24, 20, 24], content: [

/** O fim do PDF (manifestação, ciência, base): igual no T1 e no T2. */

/** 611 (T2/A2): o corpo do PDF em texto formal. */
function ptTermoFormalPdf(X, T, p, adv){
  const L = [
    { text: String(X.titulo || '').toUpperCase() + ' Nº ' + (X.numero || T.numero), bold: true, fontSize: 13, alignment: 'center', color: PT_AZUL },
    { text: X.assunto || '', bold: true, fontSize: 10, alignment: 'center', margin: [0, 2, 0, 10] },
    { table: { widths: [70, '*'], body: (X.partes || []).map(r => [{ text: r[0], bold: true, fontSize: 9 }, { text: r[1], fontSize: 9 }]) }, layout: 'lightHorizontalLines', margin: [0, 0, 0, 8] }];
  (X.secoes || []).forEach(s => {
    L.push(p(s.t, { bold: true, margin: [0, 6, 0, 3] }));
    (s.p || []).forEach(t => L.push(p(t, { alignment: 'justify' })));
    if (s.tabela) L.push({ table: { headerRows: 1, widths: ['*', '*', '*', '*'], body: [['Dia', 'Saída', 'Volta', 'Intervalo'].map(t => ({ text: t, bold: true, fontSize: 8.5 }))]
        .concat((X.dias || []).map(d => [ptDia(d.dia), d.saida || '—', d.volta || '—', d.min + ' min'].map(t => ({ text: String(t), fontSize: 8.5 })))) }, layout: 'lightHorizontalLines', margin: [0, 2, 0, 4] },
      p('Total: ' + (X.total || '') + ' não usufruídas.', { fontSize: 8.5 }));
    if (s.nota) L.push(p(s.nota, { fontSize: 8, color: '#5B6770' }));
    (s.itens || []).forEach(i => L.push(p('• ' + i, { margin: [10, 0, 0, 2] })));
  });
  L.push(p(X.local || '', { margin: [0, 10, 0, 0] }));
  return L;
}
/** PDF do termo ou da advertência, com o texto gravado e o registro da ciência; fica guardado no sistema. */
async function ptTermoPdf(T){
  try{
    const [pm, cfgE] = await Promise.all([ptPdfLib(), rpc('tf_ponto_config_ver', {})]);
    const X = T.texto || {}, adv = T.tipo === 'advertencia';
    const p = (t, o) => Object.assign({ text: t, fontSize: 9, lineHeight: 1.3, margin: [0, 0, 0, 5] }, o || {});
    const content = X.formal ? ptTermoFormalPdf(X, T, p, adv).concat(ptTermoRodapePdf(X, T, p, adv)) : [
      { text: (cfgE.empresa_nome || 'Engetap') + ' · ' + (X.titulo || '') + ' · Nº ' + T.numero, bold: true, fontSize: 12, color: PT_AZUL },
      { text: T.nome + ' · ' + ptMesRot(T.competencia) + ' · gerado em ' + ptDHBR(T.criado_em).slice(0, 10), fontSize: 8.5, margin: [0, 2, 0, 10] },
      p(X.abertura || '', { bold: true, fontSize: 10.5 }), p(X.resumo || ''),
      { table: { widths: ['*', '*', '*', '*', '*'], body: [((T.dias || []).map(d => ({ text: ptDia(d.dia) + ' · ' + d.min + ' min', fontSize: 8.5, alignment: 'center' }))
          .concat(Array(5).fill({ text: '' }))).slice(0, Math.max(5, (T.dias || []).length))] }, layout: 'lightHorizontalLines', margin: [0, 0, 0, 6] },
      X.nota ? p(X.nota, { fontSize: 8, color: '#5B6770' }) : '' ]
      .concat(X.saude ? [p(X.saude_tit, { bold: true, margin: [0, 6, 0, 3] })].concat(X.saude.map(s => p([{ text: s.t + ' ', bold: true }, s.d], { margin: [8, 0, 0, 3] }))) : [])
      .concat([p(X.empresa_tit || '', { bold: true, margin: [0, 6, 0, 3] }), p((X.empresa || '') + (X.nao_punicao ? ' ' + X.nao_punicao : '')),
        p(X.lei_tit || '', { bold: true, margin: [0, 6, 0, 3] })].concat((X.lei || []).map(l => p(l, { fontSize: 8.5 }))))
      .concat(ptTermoRodapePdf(X, T, p, adv));
    const blob = await new Promise(ok => pm.createPdf({ pageSize: 'A4', pageMargins: [36, 32, 36, 32], content: content.filter(Boolean) }).getBlob(ok));
    const hash = await ptSha256(await blob.arrayBuffer());
    const caminho = 'espelhos/' + T.usuario_id + '/' + String(T.competencia).slice(0, 7) + '-' + (adv ? 'advertencia' : 'termo') + '-' + T.numero + '-' + hash.slice(0, 8) + '.pdf';
    const r = await Nucleo.storage.enviar('ponto', caminho, new Blob([blob], { type: 'application/pdf' }));
    if (r !== 'ok' && r !== 'ja_existia') throw new Error('o armazenamento recusou');
    await rpc('tf_ponto_termo_pdf_gravar', { p_id: T.id, p_path: caminho, p_hash: hash });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = String(T.competencia).slice(5, 7) + ' - ' + (adv ? 'Advertência' : 'Termo de ciência') + ' ' + T.numero + ' - ' + String(T.nome).replace(/[\\/:*?"<>|]/g, '') + '.pdf';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('PDF guardado.');
  }catch(e){ toast('Não consegui gerar o PDF: ' + e.message, 'err'); }
}

/** P13: recalcula um mês do EzPoint com as regras de hoje e compara, dia a dia, com o banco que o EzPoint lançou. */
async function ptEzComparar(){
  const el = document.getElementById('ptEzCmp'); if (!el) return;

  if (!M.length){ el.innerHTML = ''; return; }
  const mesAtual = isoHoje().slice(0, 7) + '-01', pad = M.find(m => m < mesAtual) || M[0];
  el.innerHTML = '<h3 class="ptH3">Comparar com o EzPoint (P13)</h3><p class="nota">Recalcula o mês com as regras do ponto próprio (tolerância de 10 min por dia, '
    + 'domingo e feriado a 100% fora do banco) e compara, dia a dia, com o que o EzPoint lançou no banco. Só compara: o saldo antigo continua o do EzPoint (lote antigo). '
