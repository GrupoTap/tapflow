    + '<button class="btn" type="button" id="ptEzCsv" hidden>Planilha das diferenças</button></div><div id="ptEzOut"></div>';
  const out = document.getElementById('ptEzOut'); let ult = null;
  const csvBtn = document.getElementById('ptEzCsv');
  document.getElementById('ptEzC').addEventListener('click', ev => _semDuploEnvio_(ev.currentTarget, async () => {
    out.innerHTML = '<p class="nota">Calculando…</p>';
    try{ ult = [await rpc('tf_ponto_ez_comparar', { p_mes: document.getElementById('ptEzM').value })]; out.innerHTML = ptEzCmpMes(ult[0]); csvBtn.hidden = false; }
    catch(e){ out.innerHTML = '<p class="nota" style="color:var(--crit)">' + esc(e.message) + '</p>'; }
  }));
  document.getElementById('ptEzT').addEventListener('click', ev => _semDuploEnvio_(ev.currentTarget, async () => {

      out.innerHTML = '<p class="nota">Calculando ' + esc(ptMesRot(M[i])) + ' (' + (i + 1) + ' de ' + M.length + ')…</p>';

    }
    ult = R; out.innerHTML = ptEzCmpTodos(R); csvBtn.hidden = false;
  }));
  csvBtn.addEventListener('click', () => {

      L.push([ptMesRot(r.competencia), p.nome, ptDia(d.dia), (d.batidas || []).join(' '), d.nosso, d.ez, d.dif, d.causa]))));
    const txt = '﻿' + L.map(l => l.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');

    a.download = 'Comparação EzPoint × ponto próprio.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);

function ptEzCmpMes(r){

  return '<p class="nota"><b>' + r.dias_comparados + '</b> dias com batidas comparados · <b>' + r.dias_diferentes + '</b> com diferença.</p>'
    + '<div class="rhfdWrap"><table class="tbl ptTab"><thead><tr><th>Pessoa</th><th class="num">Aqui</th><th class="num">EzPoint</th><th class="num">Diferença</th><th class="num">Dias iguais</th><th class="num">Dias diferentes</th></tr></thead><tbody>'

          + p.dias.map(d => '<tr><td style="width:70px"><b>' + esc(ptDia(d.dia)) + '</b>' + (d.nome_dia ? '<br><small>' + esc(d.nome_dia) + '</small>' : '') + '</td>'

function ptEzCmpTodos(R){

         ['Saldo negativo: desconto até 1 mês de remuneração', ptSaldo(B.negativo_min), 'art. 477 §5º; cláusula 13ª']]
      : [['Sem acordo de banco: a mais no período aberto (50%)', ptHm(A.sem_acordo_mais_min), 'art. 59'], ['A menos no período aberto', ptHm(A.sem_acordo_menos_min), 'o escritório decide']])
      .concat([['Almoço que faltou (50%)', ptHm(A.almoco_pagar_min), 'art. 71 §4º'], ['Domingo e feriado trabalhados (100%)', ptHm(A.extra100_min), 'Lei 605/49; Súmula 146 TST'],
        ['Folgas compensatórias não tiradas (100%)', ptHm(R.folgas_pendentes_min), 'Lei 605/49 art. 9º'],
        ['Adicional noturno (relógio · reduzidas)', ptHm(A.noturno_min) + ' · ' + ptHm(A.noturno_reduzido_min), 'art. 73'], ['Faltas no período aberto', String(A.faltas || 0), '']]);
    const content = [{ text: (cfgE.empresa_nome || 'Engetap') + ' · Ponto na rescisão', bold: true, fontSize: 12, color: PT_AZUL },
      { text: R.nome + (R.funcao ? ' · ' + R.funcao : '') + ' · admissão ' + dataBR(R.admissao) + ' · último dia ' + dataBR(R.data)
          + ' · período aberto desde ' + dataBR(R.aberto_desde), fontSize: 8.5, margin: [0, 2, 0, 10] },
      { table: { headerRows: 1, widths: ['*', 80, 150], body: L.map((l, i) => l.map(t => ({ text: String(t), fontSize: 8.5, bold: i === 0 }))) }, layout: 'lightHorizontalLines' },
      { ul: (R.regras || []).map(t => ({ text: t, fontSize: 7.5 })), margin: [0, 10, 0, 0] },
      { text: 'Gerado pelo ponto próprio (TapRH) em ' + ptDHBR(new Date().toISOString()) + '. Só horas: os valores e o limite do desconto são calculados pela contabilidade.', fontSize: 6.5, color: '#6B7780', margin: [0, 12, 0, 0] }];
    const blob = await new Promise(ok => pm.createPdf({ pageSize: 'A4', pageMargins: [36, 32, 36, 32], content }).getBlob(ok));
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'Ponto na rescisão - ' + String(R.nome).replace(/[\\/:*?"<>|]/g, '') + ' - ' + dataBR(R.data).replace(/\//g, '-') + '.pdf';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }catch(e){ toast('Não consegui gerar o PDF: ' + e.message, 'err'); }
}

/** P27: fotos e localizações vencidas. As fotos saem do armazenamento; a localização, do banco. A batida fica. */
async function ptGuarda(div){
  let G; try{ G = await rpc('tf_ponto_guarda_resumo', {}); }catch(e){ div.innerHTML = /tf_ponto_guarda_resumo/.test(e.message) ? '<p class="nota">Falta rodar a 609 no Supabase.</p>' : '<p class="nota">' + esc(e.message) + '</p>'; return; }
  div.innerHTML = '<p class="nota">Foto e localização da batida ficam <b>5 anos depois do mês</b>; de quem saiu, <b>pelo menos 2 anos depois da saída</b> (vale o que acabar por último). '
    + 'Depois disso são apagadas; a batida, o comprovante e o espelho ficam (P27; LGPD art. 16). Guardadas hoje: ' + G.fotos + ' fotos e ' + G.locais + ' localizações'
    + (G.apagadas ? '; já apagadas: ' + G.apagadas : '') + '.</p>'
    + (G.n_vencidas ? '<div class="rhBarra"><button class="btn pri" type="button" id="ptGdA">Apagar ' + G.n_vencidas + ' vencida' + (G.n_vencidas > 1 ? 's' : '') + '</button>'
        + '<span class="nota">' + (G.n_vencidas > 500 ? 'Vai de 500 em 500.' : '') + '</span></div>'
      : '<p class="nota">Nada vencido. ' + (G.proximo ? 'O próximo vence em ' + esc(dataBR(G.proximo)) + '.' : '') + '</p>');
  const b = document.getElementById('ptGdA');
  if (b) b.addEventListener('click', () => _semDuploEnvio_(b, async () => {
    try{
      const V = G.vencidas || [], fotos = V.filter(x => x.foto).map(x => x.foto);
      if (fotos.length){
        const r = await rhfdFetch(SUPABASE_URL + '/storage/v1/object/ponto', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: fotos }) });
        if (!r.ok) throw new Error('o armazenamento recusou (HTTP ' + r.status + ')');
      }
      const n = await rpc('tf_ponto_guarda_apagar', { p_ids: V.map(x => x.id) });
      toast(n + ' batida' + (n === 1 ? '' : 's') + ' sem foto e sem localização agora (a batida fica).'); ptGuarda(div);
    }catch(e){ toast('Não apaguei: ' + e.message, 'err'); }
  }));
}

async function ptSha256(buf){
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/** AEJ (Portaria 671): registros separados por "|". Devolve o que vai ao banco, sem tocar em nada. */
function ptLerAEJ(txt){
  const L = txt.split(/\r?\n/).map(l => l.split('|'));
  const cab = L.find(p => p[0] === '01');
  if (!cab) throw new Error('não parece um AEJ (falta o registro 01).');
  const vinc = {}, mats = {}, marc = [], movs = [], vistos = {};
  L.forEach(p => { if (p[0] === '03') vinc[p[1]] = { cpf: (p[2] || '').replace(/\D/g, '').padStart(11, '0'), nome: (p[3] || '').trim() };
                   if (p[0] === '06') mats[p[1]] = (p[2] || '').trim(); });
  L.forEach(p => {
    if (p[0] === '05'){
      const v = vinc[p[1]]; if (!v) throw new Error('marcação de um vínculo que não está no arquivo (' + p[1] + ').');
      marc.push({ cpf: v.cpf, momento: p[2], rep: p[3] || '', tp: p[4] || '', seq: p[5] || '', fonte: p[6] || 'O', motivo: (p[8] || '').trim() });
    } else if (p[0] === '07'){
      const v = vinc[p[1]]; if (!v) throw new Error('movimento de um vínculo que não está no arquivo (' + p[1] + ').');
      const m = { cpf: v.cpf, tipo: p[2], data: p[3], minutos: p[4] || '', mov: p[5] || '' };
      const k = [m.cpf, m.data, m.tipo, m.mov, m.minutos].join('|'); vistos[k] = (vistos[k] || 0) + 1; m.ordem = vistos[k];
      movs.push(m);
    }
  });
  const tr = L.find(p => p[0] === '99') || [];
  return { cnpj: (cab[2] || '').replace(/\D/g, ''), periodo_ini: cab[6], periodo_fim: cab[7],
    vinculos: Object.keys(vinc).map(k => Object.assign({ matricula: mats[k] || '' }, vinc[k])), marc, movs,
    lidos: { vinculos: Object.keys(vinc).length, marcacoes: marc.length, movimentos: movs.length, trailer: tr.slice(1).join('|') } };
}

/** AFD (Portaria 671, REP-P): registro tipo 7, 137 posições. */
function ptLerAFD(txt){
  const marc = [];
  txt.split(/\r?\n/).forEach(l => {
    if (l.length < 137 || l[9] !== '7') return;
    marc.push({ nsr: Number(l.slice(0, 9)), momento: l.slice(10, 34), cpf: l.slice(34, 46).replace(/\D/g, '').padStart(11, '0'),
      gravado: l.slice(46, 70).trim(), coletor: l.slice(70, 72).trim(), offline: l[72] === '1', hash: l.slice(73, 137).trim().toLowerCase() });
  });
  if (!marc.length) throw new Error('não parece um AFD (nenhum registro tipo 7).');
  const ds = marc.map(m => m.momento.slice(0, 10)).sort();
  return { marc, periodo_ini: ds[0], periodo_fim: ds[ds.length - 1], lidos: { marcacoes: marc.length } };
}

async function ptImportarArquivos(arqs){
  if (!arqs.length) return;
  const st = document.getElementById('ptImpSt'), log = document.getElementById('ptImpLog');
  const linha = t => { const p = document.createElement('p'); p.className = 'nota'; p.textContent = t; log.appendChild(p); return p; };
  log.innerHTML = ''; PT.importando = true;
  const inp = document.getElementById('ptArq'); if (inp) inp.disabled = true;
  try{
    // lê tudo antes de gravar: AEJ primeiro (o AFD confere as marcações que o AEJ trouxe)
    const lidos = [];
    for (const f of arqs){
      if (!/\.txt$/i.test(f.name)){ linha('· ' + f.name + ': pulado (só os .txt).'); continue; }
      const buf = await f.arrayBuffer(), txt = new TextDecoder('utf-8').decode(buf);
      const hash = await ptSha256(buf);
      const tipo = /^01\|/.test(txt) ? 'AEJ' : 'AFD';
      lidos.push({ f, tipo, hash, d: tipo === 'AEJ' ? ptLerAEJ(txt) : ptLerAFD(txt) });
    }
    lidos.sort((a, b) => (a.tipo === 'AEJ' ? 0 : 1) - (b.tipo === 'AEJ' ? 0 : 1));
    const LOTE = 400;
    for (const x of lidos){
      const p = linha('· ' + x.tipo + ' ' + x.f.name + ': abrindo…');
      const ab = await rpc('tf_ponto_ez_abrir', { p_tipo: x.tipo, p_arquivo: x.f.name, p_hash: x.hash,
        p_info: { cnpj: x.d.cnpj || '', periodo_ini: x.d.periodo_ini || '', periodo_fim: x.d.periodo_fim || '' } });
      if (ab.fechado_em){ p.textContent = '· ' + x.tipo + ' ' + x.f.name + ': já tinha sido importado (nada a fazer).'; continue; }
      if (x.tipo === 'AEJ'){
        await rpc('tf_ponto_ez_vinculos', { p_importacao: ab.id, p_vinculos: x.d.vinculos });
        let novas = 0;
        for (let i = 0; i < x.d.marc.length; i += LOTE){
          novas += Number(await rpc('tf_ponto_ez_marcacoes', { p_importacao: ab.id, p_lote: x.d.marc.slice(i, i + LOTE) })) || 0;
          p.textContent = '· AEJ ' + x.f.name + ': marcações ' + Math.min(i + LOTE, x.d.marc.length) + ' de ' + x.d.marc.length + '…';
        }
        for (let i = 0; i < x.d.movs.length; i += LOTE)
          await rpc('tf_ponto_ez_movimentos', { p_importacao: ab.id, p_lote: x.d.movs.slice(i, i + LOTE) });
        const c = await rpc('tf_ponto_ez_fechar', { p_importacao: ab.id, p_lidos: x.d.lidos });
        p.textContent = '✓ AEJ ' + x.f.name + ': ' + x.d.vinculos.length + ' pessoas, ' + x.d.marc.length + ' marcações lidas ('
          + novas + ' novas), ' + x.d.movs.length + ' movimentos. No banco: ' + c.originais + ' originais, ' + c.incluidas
          + ' incluídas à mão, ' + c.desconsideradas + ' desconsideradas.';
      } else {
        let ok = 0, sem = 0;
        for (let i = 0; i < x.d.marc.length; i += LOTE){
          const r = await rpc('tf_ponto_ez_afd', { p_importacao: ab.id, p_lote: x.d.marc.slice(i, i + LOTE) });
          ok += Number(r.conferidas) || 0; sem += Number(r.sem_par) || 0;
          p.textContent = '· AFD ' + x.f.name + ': ' + Math.min(i + LOTE, x.d.marc.length) + ' de ' + x.d.marc.length + '…';
        }
        const c = await rpc('tf_ponto_ez_fechar', { p_importacao: ab.id, p_lidos: x.d.lidos });
        p.textContent = '✓ AFD ' + x.f.name + ': ' + x.d.marc.length + ' batidas originais lidas; ' + c.conferidas + ' conferidas com o AEJ, '
          + c.offline + ' off-line, ' + c.sem_par + ' sem par no AEJ.';
      }
    }
    st.textContent = 'Pronto.';
  }catch(e){
    linha('✕ ' + e.message + ' — nada se perde: mande os mesmos arquivos de novo para continuar.');
    st.textContent = '';
  }finally{
    PT.importando = false; if (inp){ inp.disabled = false; inp.value = ''; }
  }
  try{ PT.ez = await rpc('tf_ponto_ez_resumo', {}); PT.pessoas = await rpc('tf_ponto_pessoas', {}); }catch(e){}
  ptEzResumo();
}
