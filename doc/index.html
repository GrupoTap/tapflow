<!--
  TapDoc (escritório) · R02b1 — preparar a inspeção
  ─────────────────────────────────────────────────
  A T05 "Preparar a inspeção": marcar os vasos da OS, registrar e conferir o
  laudo anterior de cada um, deixar as instruções para o campo e concluir.
  Banco: sql/401_tapdoc_r02b1.sql. Desenho: inspecao-nr13/rodadas/R02b-preparacao-desenho.md.
  Abre pelo hub (card TapDoc) ou direto numa OS: doc/#os=<id>. Um vaso: doc/#os=<id>&v=<vaso>.
  Feito pelo chat central em 22/10/2026.

<style>

/* a tabela de vasos vira um bloco por vaso no celular (o botão não pode sair da tela) */
@media (max-width:700px){
  table.tv tr:first-child{display:none}

}
.faixa{background:#FBF3DB;border:1px solid #EAD9A6;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5;margin-top:6px;color:#3D3416}

.revitem:hover{background:var(--surface-2)} .revitem.minha{border-color:var(--accent)}
table.conf td{padding:6px 8px} .cf{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.cf.ok{background:var(--ok)} .cf.am{background:var(--warn)} .cf.vm{background:var(--crit)}
.okrev{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px;color:var(--accent-ink)}
.g2rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fotosrev{display:flex;flex-wrap:wrap;gap:6px} .fotorev{border:1px solid var(--rule);background:var(--surface-2);border-radius:4px;padding:3px 8px;font-size:12px}

.acoesrev{gap:10px;flex-wrap:wrap;align-items:center}

<header>
  <button class="back" id="voltar" aria-label="Voltar">‹</button>
  <div class="tit"><b id="tTit">TapDoc</b><small id="tSub">Preparação da inspeção</small></div>
  <span class="ver" id="ver"></span>
  <button class="troca" id="trocar" type="button">Trocar de módulo</button>
</header>
<div class="aviso" id="barDemo" hidden>Modo demonstração: abra pelo app publicado para gravar.</div>

<input type="file" id="arqPdf" accept="application/pdf,image/*" hidden>

<script>
'use strict';
const VERSAO = 'TapDoc E10';   // E10 (S107 · 412): o CSV do medidor anexado na revisão (Espessuras do medidor); a revisão exige as espessuras ·   // E9 (S94 · 410, R06a): o laudo em PDF (aba Laudos), a ART na preparação, o ambiente, o PDF do certificado dos instrumentos e as datas do PLH na aprovação ·   // E8 (S93 · 409, R05a): a revisão (A revisar: Revisão 1, Revisão 2 e a aprovação do PLH) ·   // E7 (S92 · 408, Acessos P3): entra quem tem o TapDoc; conferir e decidir é do PLH ·   // E = escritório · E6 (S86 · 407, R04a): padrão com U/k, numeração M/V e as aferições da inspeção (E5: material de campo; E4: faixa)
// 405: a faixa de resistência (norma do material) e o S esperado pelo ASME (fator 3,5; 2/3 do escoamento; costura × 0,85)
function faixaTxt(m){
  if (!m || m.resist_min_mpa == null) return 'faixa de resistência não cadastrada';
  return (m.resist_max_mpa != null ? fmt(m.resist_min_mpa, 0) + ' a ' + fmt(m.resist_max_mpa, 0) + ' MPa' : 'mínimo ' + fmt(m.resist_min_mpa, 0) + ' MPa (a norma não dá máximo)');
}
function sEsperado(rmin, esc, forma){
  if (!(rmin > 0)) return null;
  let s = rmin / 3.5; if (esc > 0) s = Math.min(s, esc * 2 / 3);
  return /com costura/i.test(forma || '') ? s * 0.85 : s;
}
// a conta do S pela faixa, para o Túlio e o PLH conferirem (tolerância de 2%: o ASME arredonda em ksi)
function contaS(rmin, resc, forma, s){
  const e = sEsperado(rmin, resc, forma);
  if (e == null) return '<p class="sAviso">Sem a resistência mínima: o sistema não confere o S.</p>';
  const conta = fmt(rmin, 0) + ' ÷ 3,5' + (resc > 0 && resc * 2 / 3 < rmin / 3.5 ? ' (ou 2/3 do escoamento)' : '') + (/com costura/i.test(forma || '') ? ' × 0,85 (costura)' : '') + ' = ' + fmt(e, 1) + ' MPa';
  if (!(s > 0)) return '<p class="sAviso">' + conta + '</p>';
  const ok = Math.abs(s - e) <= e * 0.02;
  return '<p class="sAviso ' + (ok ? 'ok' : 'ruim') + '">' + (ok ? '✓ Confere: ' : '⚠ Não confere: ') + conta + (ok ? '' : ' (cadastrado: ' + fmt(s, 1) + ' MPa)') + '</p>';
}
// 406: a troca de material feita em campo e a decisão do escritório
function quadroMaterialCampo(ins){
  const mc = ins && ins.material_campo; if (!mc) return '';
  const quando = mc.em ? new Date(mc.em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
  let h = '<div class="card" id="cxMatCampo" style="border-left:4px solid #B42318"><h3 style="margin-top:0">Material alterado em campo</h3>'
    + '<p>De <b>' + esc(mc.de || '—') + '</b> (escritório) para <b>' + esc(mc.para || 'nenhum') + '</b> (campo).</p>'
    + '<p class="muted">Motivo: ' + esc(mc.motivo || '') + (mc.por ? ' · ' + esc(mc.por) : '') + (quando ? ' · ' + quando : '') + '</p>';
  if (mc.decisao) h += '<p><span class="chip s-pronto">' + (mc.decisao === 'aceito' ? 'aceito: fica o de campo' : 'revertido: voltou o do escritório') + '</span>' + (mc.decidido_por ? ' <span class="muted">' + esc(mc.decidido_por) + '</span>' : '') + '</p>';
  else if (!PLH) h += '<p class="muted">O cálculo oficial espera esta decisão. Quem decide é o PLH.</p>';
  else h += '<p class="muted">O cálculo oficial espera esta decisão.</p><div class="linha"><button class="btn pri" data-matdec="1">Aceitar o de campo</button><button class="btn" data-matdec="0">Voltar ao do escritório</button></div>';
  return h + '</div>';
}
function ligarMaterialCampo(ins){
  document.querySelectorAll('[data-matdec]').forEach(b => b.addEventListener('click', async () => {
    const aceitar = b.dataset.matdec === '1';
    try{ await rpc('tf_insp_material_campo_decidir', { p_id: ins.id, p_aceitar: aceitar });
      U.toast(aceitar ? 'Aceito: fica o material de campo.' : 'Voltou o material do escritório.', 'ok'); PREP = null; pintar(); }
    catch(e){ erro(e); }
  }));
}
function quadroFaixa(m){
  if (!m) return '';
  return '<div class="faixa">Resistência <b>' + esc(faixaTxt(m)) + '</b>' + (m.escoamento_min_mpa != null ? '<br>Escoamento mín. ' + fmt(m.escoamento_min_mpa, 0) + ' MPa' : '')
    + '<br>S do ASME: <b>' + fmt(m.s_mpa, 1) + ' MPa</b>' + (m.t_max_c != null ? ' até ' + fmt(m.t_max_c, 0) + ' °C' : '') + ' <span class="muted">(teto do cálculo)</span></div>';
}
// H10: a moldura (cabeçalho e barra da janela) na cor do card do TapDoc, e o menu de troca
if (window.TapModulos){ TapModulos.aplicar('tapdoc'); TapModulos.trocador(document.getElementById('trocar'), 'tapdoc'); }
else document.getElementById('trocar').addEventListener('click', () => { location.href = '../'; });
const CFG = window.TF_CONFIG || {};
const SUPA_URL = CFG.SUPABASE_URL || '', SUPA_ANON = CFG.SUPABASE_ANON_KEY || '';
const DEMO = !SUPA_URL || !SUPA_ANON;
const N = window.Nucleo, M = window.MotorNR13;
const $ = id => document.getElementById(id);
$('ver').textContent = VERSAO;
if (!N){ $('tela').innerHTML = '<div class="card vazio">Sem o núcleo do TapFlow. Recarregue com sinal.</div>'; throw new Error('sem núcleo'); }
const U = N.util, esc = U.esc;
const rpc = (f, p) => N.api.rpc(f, p || {});
// E7 (P3): quem tem o poder PLH ("Pessoas e acessos"). O banco é quem trava; aqui só esconde os botões.
let PLH = false;

// ── utilitários ────────────────────────────────────────────────────────────
function uid(){ try{ if (crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }); }
function num(s){ if (s == null) return null; let t = String(s).trim().replace(/\s/g, ''); if (!t) return null;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.'); const v = Number(t); return isFinite(v) ? v : NaN; }
function fmt(v, c){ if (v == null || v === '' || !isFinite(Number(v))) return ''; return String(Number(Number(v).toFixed(c == null ? 4 : c))).replace('.', ','); }
const dataBR = d => d ? String(d).slice(8,10) + '/' + String(d).slice(5,7) + '/' + String(d).slice(0,4) : '—';
const UNID = { 'bar':0.1, 'kgf/cm2':0.0980665, 'MPa':1, 'psi':0.00689476 };
const UNID_ROT = { 'bar':'bar', 'kgf/cm2':'kgf/cm²', 'MPa':'MPa', 'psi':'psi' };
let UN = 'bar';
try{ UN = localStorage.getItem('tfdoc_un') || 'bar'; }catch(e){}
const paraMPa = v => v == null ? null : Math.round(v * UNID[UN] * 1e4) / 1e4;
const deMPa = v => v == null || v === '' ? null : Number(v) / UNID[UN];
const SIT = {
  pronto:['Pronto','✅'], precisa_laudo:['Precisa do laudo anterior','📄'], em_conferencia:['Em conferência','🟡'],
  pegar_cliente:['Pegar no cliente','🟠'], grave:['Divergência grave','⚠'], sem_laudo:['Sem laudo anterior','➖'],
  provisorio:['Provisório','🆕']
};
const chipSit = s => '<span class="chip s-' + esc(s) + '">' + (SIT[s] ? SIT[s][1] + ' ' + SIT[s][0] : esc(s)) + '</span>';
const FLUIDOS = [['Ar comprimido','C'],['Vapor d’água','C'],['Água','D'],['Nitrogênio','C'],['CO₂','C'],['Óleo térmico','B'],['GLP','A'],['Gás natural','A'],['Hidrogênio','A'],['Amônia','A']];
const TIPOS_COMP = { costado:'Costado', eliptico:'Elíptico', torisferico:'Torisférico', hemisferico:'Hemisférico', conico:'Cônico', plano:'Plano', janela:'Janela' };

/** janela do núcleo: botões {rotulo, classe:'pri', acao}; acao que devolve false mantém aberta */
function janela(tit, html, bts){
  N.janela.abrir(tit, html, (bts || []).map(b => ({ label:b.rotulo, pri:b.classe === 'pri',
    onClick:async () => { const r = b.acao ? await b.acao() : undefined; if (r !== false) N.janela.fechar(); } })));
}
function erro(e){ U.toast(e && e.message ? e.message : String(e), 'err'); }

// ── rotas: #os=<id>&v=<vaso>&aba=<a> ───────────────────────────────────────
function rota(){ const h = new URLSearchParams(location.hash.replace(/^#/, '')); return { os:h.get('os'), v:h.get('v'), rev:h.get('rev'), laudo:h.get('laudo'), aba:h.get('aba') || 'os' }; }
function ir(r){ const p = new URLSearchParams(); if (r.os) p.set('os', r.os); if (r.v) p.set('v', r.v); if (r.aba && !r.os) p.set('aba', r.aba);
  location.hash = p.toString(); }
window.addEventListener('hashchange', pintar);
$('voltar').addEventListener('click', () => {
  const r = rota();
  if (r.rev){ location.hash = 'aba=rev'; return; }   // E8
  if (r.laudo){ location.hash = 'aba=laudos'; return; }   // E9
  if (r.v) ir({ os:r.os }); else if (r.os) ir({}); else location.href = '../';
});
function titulo(t, s){ $('tTit').textContent = t; $('tSub').textContent = s || ''; }

async function pintar(){
  const r = rota();
  try{
    if (r.rev) return await telaRevisao(r.rev);   // E8 · R05a
    if (r.laudo) return await telaLaudo(r.laudo);   // E9 · R06a
    if (r.os && r.v) return await telaVaso(r.os, r.v);
    if (r.os) return await telaOS(r.os);
    return await telaListas(r.aba);
  }catch(e){
    $('tela').innerHTML = '<div class="card vazio"></div>';
    $('tela').querySelector('.vazio').textContent = e.message || 'Não deu para carregar.';
  }
}

// ── 1 · as listas (entrada pelo hub) ───────────────────────────────────────
let LISTAS = null;
async function telaListas(aba){
  titulo('TapDoc', 'Preparação da inspeção · escritório');
  $('tela').innerHTML = '<p class="muted">Carregando…</p>';
  LISTAS = await rpc('tf_insp_preparacao_lista');

function editarInstrumento(x){
  x = x || { tipo:'medidor_espessura' };

    + c('laboratorio', 'Laboratório') + c('calibrado_em', 'Calibrado em', 'date') + c('validade', 'Validade', 'date')

    + '<div class="g3"><label class="f">U (incerteza expandida)<input class="t" id="in_u" inputmode="decimal" value="' + esc(fmt(x.u_expandida, 5)) + '"></label>'
    + '<label class="f">k<input class="t" id="in_k" inputmode="decimal" value="' + esc(fmt(x.k == null ? 2 : x.k, 2)) + '"></label>'
    + '<label class="f">Unidade<select class="t" id="in_un">' + ['kgf/cm2','bar','MPa','psi','kPa'].map(u => '<option value="' + u + '"' + ((x.unidade || 'kgf/cm2') === u ? ' selected' : '') + '>' + u.replace('cm2', 'cm²') + '</option>').join('') + '</select></label></div>'
    + '<div class="g3"><label class="f">Faixa máxima<input class="t" id="in_fx" inputmode="decimal" value="' + esc(fmt(x.faixa_max, 4)) + '"></label>'
    + '<label class="f">Resolução<input class="t" id="in_res" inputmode="decimal" value="' + esc(fmt(x.resolucao, 5)) + '"></label></div></fieldset>'
    // E9 (R06a): o PDF do certificado; o laudo anexa o do medidor escolhido em campo
    + '<label class="f">PDF do certificado <small>' + (x.certificado_path ? '(já anexado; escolha outro para trocar)' : '(o laudo anexa o do medidor de espessura)') + '</small>'
    + '<input class="t" id="in_cert" type="file" accept="application/pdf,image/*"></label>',
    (x.id ? [{ rotulo:'Desativar', acao:async () => { try{ await rpc('tf_insp_instrumento_gravar', { p_dados:{ id:x.id, ativo:false } }); U.toast('Desativado.', 'ok'); pintar(); }catch(e){ erro(e); return false; } } }] : [])
    .concat([{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {
      const d = {}; ['descricao','marca','modelo','numero_serie','certificado_num','laboratorio','calibrado_em','validade'].forEach(k => { d[k] = ($('in_' + k).value || '').trim() || null; });
      if (!d.descricao){ U.toast('Escreva a descrição.', 'err'); return false; }
      if (x.id) d.id = x.id; else d.tipo = $('in_tipo').value;
      if ((x.id ? x.tipo : d.tipo) === 'manometro_padrao'){
        const nn = id => { const v = num($(id).value); return v == null || Number.isNaN(v) ? null : v; };
        d.u_expandida = nn('in_u'); d.k = nn('in_k') || 2; d.unidade = $('in_un').value; d.faixa_max = nn('in_fx'); d.resolucao = nn('in_res');
        if (d.u_expandida == null){ U.toast('O padrão precisa da U do certificado.', 'err'); return false; }
      }
      const arq = $('in_cert').files && $('in_cert').files[0];
      if (arq && arq.size > 5242880){ U.toast('O certificado passa de 5 MB.', 'err'); return false; }
      try{
        const id = await rpc('tf_insp_instrumento_gravar', { p_dados:d });

          const pdf = /pdf/i.test(arq.type) || /\.pdf$/i.test(arq.name);
          const blob = pdf ? new Blob([arq], { type:'application/pdf' }) : await N.foto.reduzir(arq, { lado:2000, qualidade:0.9 });
          const caminho = 'instrumentos/' + (id || x.id) + '/' + uid() + (pdf ? '.pdf' : '.jpg');
          await N.storage.enviar('inspecoes', caminho, blob);
          await rpc('tf_insp_instrumento_gravar', { p_dados:{ id: id || x.id, certificado_path: caminho } });
        }
        U.toast('Gravado.', 'ok'); pintar();
      }catch(e){ erro(e); return false; }
    } }]));

// E9 (R06a): gravar a ART da OS (número e PDF, pasta art/<OS>/)

/** PMTA recalculada com os dados do próprio laudo (motor da R00): a menor entre
 *  os componentes completos. null quando falta dado. */
function pmtaRecalc(d){
  if (!M || !d.s_mpa || !(d.componentes || []).length) return null;
  let menor = null;
  d.componentes.forEach(c => {
    if (!c.t_min_mm || !c.eficiencia_junta) return;
    const g = { tipo: c.tipo, R: c.r_mm, L: c.l_mm, d: c.d_mm, C: c.fator_c, alfaGraus: c.alfa_graus };
    try{ const p = M.pmta(g, c.t_min_mm, d.s_mpa, c.eficiencia_junta); if (p > 0 && (menor == null || p < menor)) menor = p; }catch(e){}
  });
  return menor == null ? null : Math.round(menor * 1e4) / 1e4;
}

// O cálculo é o MESMO da prévia do celular (field/doc, TapDoc 8), copiado

const CALC = (() => {
  let E = { materiais:[] };
  function fmt(v, casas){
    if (v == null || v === '' || !isFinite(Number(v))) return '';
    const c = casas == null ? 4 : casas;
    return String(Number(Number(v).toFixed(c))).replace('.', ',');
  }
const UNID = { 'bar':0.1, 'kgf/cm2':0.0980665, 'MPa':1, 'psi':0.00689476 };
const UNID_ROT = { 'bar':'bar', 'kgf/cm2':'kgf/cm²', 'MPa':'MPa', 'psi':'psi' };
const paraMPa = (v, u) => v == null ? null : Math.round(v * UNID[u] * 1e4) / 1e4;
const deMPa = (v, u) => v == null ? null : v / UNID[u];

const ativas = v => v.camaras.filter(c => c.ativo !== false);
const compsAtivos = v => v.componentes.filter(c => c.ativo !== false);

function unidadeDe(v){ const c = ativas(v)[0]; return (c && c.unidade_campo) || v._unid || 'bar'; }

const GEO_CAMPOS = { costado:['R'], eliptico:['R'], conico:['R','alfaGraus'], torisferico:['L'], hemisferico:['L'], plano:['d','C'], janela:['d','C'] };
const GEO_COL = { R:'r_mm', L:'l_mm', d:'d_mm', C:'fator_c', alfaGraus:'alfa_graus', E:'eficiencia_junta' };
const GEO_ROT = { R:'R · raio (mm)', L:'L · raio da coroa (mm)', d:'d · diâmetro (mm)', C:'C · fator', alfaGraus:'α · semiângulo (°)' };
function geoPadrao(v, c){
  const rx = v.circunferencia_mm > 0 ? v.circunferencia_mm / (2 * Math.PI) : null;
  const p = { E: (c.tipo === 'costado' || c.tipo === 'conico') ? 0.7 : 1 };
  if (rx){
    if (['costado','eliptico','conico'].indexOf(c.tipo) >= 0) p.R = rx;
    if (c.tipo === 'torisferico') p.L = 2 * rx;
    if (c.tipo === 'hemisferico') p.L = rx;
    if (c.tipo === 'plano') p.d = 2 * rx;
  }
  if (c.tipo === 'plano' || c.tipo === 'janela') p.C = 0.33;
  return p;
}
/** A geometria que o motor usa: o informado ou o padrão. `padrao` lista o que veio do padrão. */
function geoDe(v, c){
  const p = geoPadrao(v, c), g = { tipo:c.tipo, nome:c.nome, id:c.id, aparafusada:c.aparafusada === true, padrao:[] };
  (GEO_CAMPOS[c.tipo] || []).concat(['E']).forEach(k => {
    const x = c[GEO_COL[k]];
    if (x != null && x !== '') g[k] = Number(x);
    else if (p[k] != null){ g[k] = p[k]; g.padrao.push(k); }
  });
  return g;
}

const leiturasDe = (v, cid) => ((v.inspecao && v.inspecao.leituras) || []).filter(l => l.componente_id === cid);
const semLeitura = v => (v.inspecao && v.inspecao.ultrassom_sem_leitura) || {};
const compsMedir = v => compsAtivos(v).filter(c => !c.nao_medir).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
function estUltra(v){
  const i = v.inspecao || {}, cs = compsMedir(v);
  const feitos = cs.filter(c => leiturasDe(v, c.id).length || (semLeitura(v)[c.id] || '').trim()).length;
  if (!i.medidor_id && !feitos) return 'vazia';
  return i.medidor_id && feitos === cs.length ? 'ok' : 'inc';
}
function minimaDe(v, cid){
  const l = leiturasDe(v, cid); if (!l.length) return null;
  try{ return MotorNR13.minimaLeituras(l.map(x => x.valor_mm)); }catch(e){ return null; }
}
function materialDe(v, c){
  const id = (c && c.material_id) || v.material_id;
  return id ? (E.materiais || []).find(m => m.id === id) || null : null;
}
const camaraDe = (v, c) => v.camaras.find(k => k.id === c.camara_id) || ativas(v)[0] || null;

/** Espessura mínima requerida (com o mínimo de 1,5 mm e a corrosão), ou o motivo de não dar. */
function eMinDe(v, c){
  const k = camaraDe(v, c), m = materialDe(v, c);
  if (!k || k.p_operacao_max_mpa == null) return { erro:'sem a pressão de operação' };
  if (k.pressao_externa || k.p_operacao_max_mpa <= 0) return { erro:'pressão externa: calculada no escritório' };
  if (!m || !(m.s_mpa > 0)) return { erro:'sem o material' };
  try{
    const g = geoDe(v, c);
    const e = MotorNR13.espessuraMinima(g, k.p_operacao_max_mpa, Number(m.s_mpa), g.E);
    return { valor: Math.max(e, 1.5) + (Number(v.corrosao_mm) || 0), padrao:g.padrao };
  }catch(e){ return { erro:e.message }; }
}


const RISCO = { A:4, B:3, C:2, D:1 };
function previa(v){
  const r = { camaras:[], vaso:null, avisos:[], detalhes:[] };
  const cs = ativas(v), u = unidadeDe(v);
  const m = materialDe(v, null);
  if (!m) r.avisos.push('Prévia: sem o material do costado (Operação e câmaras), a PMTA não sai.');
  else {
    if (!m.conferido) r.avisos.push('O material ' + m.especificacao + ' é da lista provisória, ainda não conferida pelo Fernando: a prévia é indicativa.');
    cs.forEach(k => { if (m.t_max_c != null && k.t_operacao_c != null && Number(k.t_operacao_c) > Number(m.t_max_c))
      r.avisos.push('Temperatura de operação' + (cs.length > 1 ? ' (' + k.nome + ')' : '') + ' acima de ' + fmt(m.t_max_c, 0) + ' °C: o S do material não vale.'); });
  }
  const padrao = new Set();
  cs.forEach(k => {
    const ck = { cam:k, comps:[], governante:null, erro:null };
    const P = k.p_operacao_max_mpa;
    if (P == null) ck.erro = 'Sem a pressão de operação.';
    else if (k.pressao_externa || P <= 0) ck.erro = 'Pressão externa (vácuo): a PMTA externa é do escritório (PLH).';
    else if (!m) ck.erro = 'Sem o material.';
    compsMedir(v).filter(c => camaraDe(v, c) === k).forEach(c => {
      const t = minimaDe(v, c.id), x = { c, tMin:t, eMin:null, pmta:null, erro:null, abaixo:false };
      if (!ck.erro){
        try{
          const g = geoDe(v, c), mc = materialDe(v, c);
          const res = MotorNR13.calcularVaso({ pOperacaoMPa:P, S:Number(mc.s_mpa), corrosaoMm:Number(v.corrosao_mm) || 0,
            componentes:[Object.assign({}, g, { leituras:leiturasDe(v, c.id).map(y => y.valor_mm) })] });
          const rc = res.componentes[0];
          x.eMin = rc.eMin; x.pmta = rc.pmtaMPa; x.abaixo = rc.abaixoDaMinima;
          g.padrao.forEach(p => padrao.add(c.nome));
        }catch(e){ x.erro = e.message; }
      }
      ck.comps.push(x);
    });
    const ok = ck.comps.filter(x => x.pmta != null);
    if (ok.length) ck.governante = ok.reduce((a, b) => b.pmta < a.pmta ? b : a);
    const nm = cs.length > 1 ? ' (' + k.nome + ')' : '';
    if (ck.governante && ck.governante.pmta < P) r.avisos.push('PMTA calculada' + nm + ' de ' + fmt(deMPa(ck.governante.pmta, u), 2) + ' ' + UNID_ROT[u] + ', abaixo da pressão de operação (' + ck.governante.c.nome + ').');
    ck.comps.filter(x => x.abaixo).forEach(x => r.avisos.push(x.c.nome + ': espessura medida abaixo da mínima requerida.'));
    ck.comps.filter(x => x.erro).forEach(x => r.detalhes.push(x.c.nome + ': ' + x.erro));
    r.camaras.push(ck);
  });
  if (padrao.size) r.detalhes.push('Geometria padrão (a validar pelo Fernando) em: ' + [...padrao].join(', ') + '.');
  // a categoria do vaso pela conta única (pendência 20)
  try{
    if (!cs.length) throw new Error('Sem câmaras.');
    if (cs.some(k => k.p_operacao_max_mpa == null || !k.classe_fluido)) throw new Error('Falta a pressão de operação ou a classe do fluido.');
    if (cs.some(k => k.volume_desconhecido || !(k.volume_m3 > 0))) throw new Error('Volume desconhecido: o escritório informa o volume para a categoria.');
    const kP = cs.reduce((a, b) => Math.abs(b.p_operacao_max_mpa) > Math.abs(a.p_operacao_max_mpa) ? b : a);
    const V = cs.reduce((a, k) => a + Number(k.volume_m3), 0);
    const classe = cs.map(k => String(k.classe_fluido).toUpperCase()).reduce((a, b) => RISCO[b] > RISCO[a] ? b : a);
    const cat = MotorNR13.categoria(classe, kP.p_operacao_max_mpa, V);
    const pr = MotorNR13.prazos(cat.categoria, { semCodigoConstrucao:!!v.sem_codigo_construcao, temperaturaAbaixoDeZeroSemDeterioracao:!!v.abaixo_zero_sem_deterioracao });
    r.vaso = { P:kP.p_operacao_max_mpa, deCamara:kP, V, classe, pv:cat.pv, grupo:cat.grupo, categoria:cat.categoria, prazos:pr };
  }catch(e){ r.vaso = { erro:e.message }; }
  return r;
}
  return { usar:p => { E = p || { materiais:[] }; }, previa, minimaDe, eMinDe, compsMedir, ativas, materialDe, unidadeDe, deMPa, UNID_ROT };
})();

// a regra sugerida: mantém a anterior quando ela cabe na calculada; senão, a calculada
function revRegra(ck){

  if (calc == null) return { regra:'plh', valor:null };

// espessuras: taxa, vida remanescente e a cor (decisão de 20/10)
function revVidas(){
  const { R, v, prev } = REV, ants = R.espessuras_anteriores || [];
  REV.fonteAnt = ants.length ? ants[0].fonte + (ants[0].data_ant ? ' de ' + dataBR(ants[0].data_ant) : '') : null;
  const dataAtual = dataSP(R.inspecao.termino || R.inspecao.inicio);
  const prazo = prev.vaso && prev.vaso.prazos ? (prev.vaso.prazos.interno != null ? prev.vaso.prazos.interno : prev.vaso.prazos.externo) : null;
  const resol = 0.01;   // resolução do medidor de espessura (mm) para "sem perda mensurável"
  const out = [];

    const a = ants.find(y => y.componente_id === x.c.id);
    const o = { nome:x.c.nome, atual:x.tMin, req:x.eMin, ant:a ? Number(a.t_ant) : null, dataAnt:a ? a.data_ant : null, perda:null, taxa:null, vida:null, vidaTxt:'—', cor:null, semPerda:false };
    if (o.ant != null && o.atual != null && o.dataAnt && dataAtual){
      const anos = (new Date(dataAtual) - new Date(o.dataAnt)) / (365.25 * 864e5);
      o.perda = o.ant - o.atual;

    if (adot == null || !(adot > 0)) throw new Error(k.nome + ': informe a PMTA adotada.');

function espLerCsv(txt){
  const linhas = String(txt).replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  if (!linhas.length) throw new Error('Arquivo vazio.');
  const sep = [';', '\t', ','].find(c => linhas[0].indexOf(c) >= 0) || ',';
  const cab = linhas[0].split(sep).map(x => x.trim().replace(/^"|"$/g, '').toLowerCase());
  const iS = cab.indexOf('spot_no'), iN = cab.indexOf('reading_no'), iR = cab.indexOf('reading');
  if (iS < 0 || iR < 0) throw new Error('O arquivo não tem as colunas Spot_No e Reading (o padrão do medidor).');
  const spots = [], por = {};
  linhas.slice(1).forEach((ln, n) => {
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const sp = c[iS], val = num(c[iR]);
    if (!sp) return;
    if (val == null || Number.isNaN(val) || val <= 0 || val > 300) throw new Error('Linha ' + (n + 2) + ': leitura inválida (' + (c[iR] || 'vazia') + ').');
    if (!por[sp]){ por[sp] = []; spots.push(sp); }
    por[sp].push({ n: iN >= 0 ? Number(c[iN]) || por[sp].length + 1 : por[sp].length + 1, val });
  });
  if (!spots.length) throw new Error('Nenhuma leitura no arquivo.');
  spots.forEach(sp => por[sp].sort((a, b) => a.n - b.n));
  return { spots, por };
}
function espDistribuir(d, nome, recarregar){

    + '). Diga quais pontos (pela ordem no arquivo, 1 a ' + n + ') são de cada componente. Componente em branco fica como está.</p>'
    + '<p class="muted">Substitui as leituras que o componente já tinha.</p><table><tr><th>Componente</th><th>de</th><th>até</th></tr>';
  cs.forEach((c, k) => {

    h += '<tr><td><b>' + esc(c.nome) + '</b>' + (espLeit(v, c.id).length ? '<div class="muted">já tem ' + espLeit(v, c.id).length + ' leitura(s)</div>' : '') + '</td>'

  janela('Anexar o CSV do medidor', h, [{ rotulo:'Cancelar' }, { rotulo:'Conferir', classe:'pri', acao:() => {

  janela('Conferir antes de gravar', h, [{ rotulo:'Voltar', acao:() => { setTimeout(() => espDistribuir(d, nome, recarregar), 0); } }, { rotulo:'Gravar', classe:'pri', acao:async () => {

      U.toast(r.gravadas + ' leitura(s) gravada(s)' + (r.faltam && r.faltam.length ? '. Ainda faltam: ' + r.faltam.join(', ') : '.'), 'ok');

// Desenho: inspecao-nr13/rodadas/R06-laudo-desenho.md. O gerador é o

// (pdfmake), juntar os anexos (pdf-lib), gravar e anexar o assinado.
// Ciclo: rascunho → Emitir (PLH, reserva o número) → PDF assinado com o token
// (a inspeção vai para "assinada") → reabrir gera a Rev. seguinte.
// Durante o piloto (emissão oficial desligada pelo admin) só sai o rascunho.
// ════════════════════════════════════════════════════════════════════════════
let LIBS = null, LD = null;
function carregarScript(src){
  return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => falha(new Error('Não carregou ' + src.split('?')[0] + '. Confira o sinal e tente de novo.')); document.head.appendChild(s); });
}
/** As bibliotecas do PDF, sob demanda e ANTES do ato que gasta número (regra do CLAUDE.md §7). */
function libsLaudo(){
  if (!LIBS) LIBS = (async () => {
    if (!window.pdfMake) await carregarScript('vendor/pdfmake.min.js?v=0.2.20');
    if (!window.pdfMake.vfs || !Object.keys(window.pdfMake.vfs).length) await carregarScript('vendor/vfs_fonts.js?v=0.2.20');
    if (!window.PDFLib) await carregarScript('vendor/pdf-lib.min.js?v=1.17.1');
    if (!window.LaudoPDF) await carregarScript('laudo-pdf.js?v=R06a');
    return true;
  })().catch(e => { LIBS = null; throw e; });
  return LIBS;
}
async function baixar(path){
  const s = N.sessao();
  const r = await fetch(SUPA_URL + '/storage/v1/object/authenticated/inspecoes/' + path.split('/').map(encodeURIComponent).join('/'),
    { headers:{ apikey:SUPA_ANON, Authorization:'Bearer ' + s.token } });
  if (!r.ok) throw new Error('Não abriu o arquivo ' + path.split('/').pop() + ' (HTTP ' + r.status + ').');
  return new Uint8Array(await r.arrayBuffer());
}
const ehPdf = b => b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46;
function dataURLDe(b){   // o tipo pelo conteúdo (o Storage pode devolver octet-stream)
  const tipo = b[0] === 0x89 && b[1] === 0x50 ? 'image/png' : 'image/jpeg';
  let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return 'data:' + tipo + ';base64,' + btoa(s);
}
const hexDe = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
/** Monta o PDF inteiro (laudo + anexos). opc vai para o LaudoPDF.montar. */
async function gerarLaudo(d, opc, aviso){
  aviso = aviso || (() => {});
  await libsLaudo();
  aviso('Baixando as fotos…');
  const imagens = {}, semFoto = [];
  for (const p of LaudoPDF.fotosDoLaudo(d)){ try{ imagens[p] = dataURLDe(await baixar(p)); }catch(e){ semFoto.push(p); } }
  aviso('Montando o PDF…');
  const def = LaudoPDF.montar(d, Object.assign({ imagens }, opc));
  const base = await new Promise((ok, falha) => { try{ pdfMake.createPdf(def).getBuffer(b => ok(b)); }catch(e){ falha(e); } });
  aviso('Juntando os anexos…');
  const out = await PDFLib.PDFDocument.load(base);
  const anexos = [['o certificado do medidor', d.medidor && d.medidor.certificado_path], ['a ART', d.art && d.art.path]];
  const semAnexo = [];
  for (const [nome, path] of anexos){
    if (!path){ semAnexo.push(nome); continue; }
    let b; try{ b = await baixar(path); }catch(e){ if (opc.exigirAnexos) throw new Error('Não abriu ' + nome + ': ' + e.message); semAnexo.push(nome); continue; }
    if (ehPdf(b)){ const src = await PDFLib.PDFDocument.load(b, { ignoreEncryption:true }); (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg)); }
    else {
      const im = b[0] === 0x89 ? await out.embedPng(b) : await out.embedJpg(b), pg = out.addPage([595.28, 841.89]);
      const k = Math.min(515 / im.width, 760 / im.height, 1);
      pg.drawImage(im, { x:(595.28 - im.width * k) / 2, y:(841.89 - im.height * k) / 2, width:im.width * k, height:im.height * k });
    }
  }
  if (opc.exigirAnexos && semAnexo.length) throw new Error('Falta ' + semAnexo.join(' e ') + ' para emitir.');
  out.setTitle(def.info.title); out.setAuthor(def.info.author); out.setCreator(def.info.creator); out.setProducer(def.info.producer); out.setSubject(def.info.subject);
  const bytes = await out.save();
  return { bytes, paginas: out.getPageCount(), sha: hexDe(await crypto.subtle.digest('SHA-256', bytes)), semFoto, semAnexo };
}

  $('tela').innerHTML = h;
  ligarAbas();
  $('tela').querySelectorAll('[data-ld]').forEach(t => t.addEventListener('click', () => { location.hash = 'laudo=' + t.dataset.ld; }));
  const bc = $('ldCfg'); if (bc) bc.addEventListener('click', () => {
    janela('Emissão do laudo', '<label class="okrev"><input type="checkbox" id="cfgOf"' + (cfg.oficial ? ' checked' : '') + '> o TapFlow emite os laudos oficiais (fim do piloto)</label>'
      + '<label class="f">Próximo número R de ' + String(cfg.mes).padStart(2, '0') + '/' + cfg.ano + ' <small>(o último do TapDoc antigo + 1)</small><input class="t" id="cfgProx" inputmode="numeric" value="' + esc(cfg.proximo || '') + '" placeholder="ex.: 22"></label>'
      + '<p class="muted">A numeração recomeça a cada mês (R + mês + ano − sequência, ex.: R1026-001). Número usado não volta.</p>',
      [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {
        const px = ($('cfgProx').value || '').trim(), n = px ? parseInt(px, 10) : null;
        if (px && !(n >= 1 && n <= 999)){ U.toast('O número vai de 1 a 999.', 'err'); return false; }
        try{ await rpc('tf_laudo_config', { p_oficial: $('cfgOf').checked, p_proximo: n }); U.toast('Gravado.', 'ok'); pintar(); }catch(e){ erro(e); return false; }
      } }]);
  });
}

// ── a tela do laudo de uma inspeção ────────────────────────────────────────
async function telaLaudo(id){
  titulo('Laudo', 'carregando…');
  $('tela').innerHTML = '<p class="muted">Carregando…</p>';
  LD = { id, d: await rpc('tf_laudo_dados', { p_id:id }) };
  pintarLaudo();
}
function laudoAtual(d){ return (d.laudos || []).filter(l => l.situacao !== 'substituido').pop() || null; }
function pintarLaudo(){
  const d = LD.d, I = d.inspecao, eu = d.eu || {}, cfg = d.config || {}, atual = laudoAtual(d), fal = d.faltas || [];
  const reaberta = atual && d.reabertura && new Date(d.reabertura.em) > new Date(atual.emitido_em);
  titulo('Laudo · ' + (d.vaso.tag || ''), (d.empresa.nome_fantasia || d.empresa.razao_social || '') + ' · OS ' + ((d.os || {}).numero || '—'));
  let h = '<div class="card"><div class="linha" style="justify-content:space-between"><div><b style="font-size:17px">' + esc(d.vaso.tag || '') + '</b> ' + esc(d.vaso.nome || '')
    + '<div class="muted">' + esc(d.empresa.razao_social || '') + ' · OS ' + esc((d.os || {}).numero || '—') + ' · inspeção de ' + dataBR(dataSP(I.termino || I.inicio))
    + (I.aprovado && I.aprovado.nome ? ' · aprovada por ' + esc(I.aprovado.nome) + ' (' + quandoBR(I.aprovado.em) + ')' : '') + '</div></div>'
    + '<span class="chip ' + (I.situacao === 'assinada' ? 's-pronto' : 's-em_conferencia') + '">' + esc(I.situacao) + '</span></div></div>';
  if (!cfg.oficial) h += '<div class="alerta falta"><b>Piloto:</b> o TapFlow ainda não emite o laudo oficial. Gere o rascunho e compare com o PDF do TapDoc antigo. Quem liga a emissão é o admin (aba Laudos › Configurar).</div>';
  if (fal.length){
    h += '<div class="alerta crit"><b>Antes de emitir:</b><ul>' + fal.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>';
    if (!I.ambiente && I.situacao === 'liberada') h += '<div class="linha" style="margin-top:6px">O vaso fica em <select id="ldAmb" class="t" style="width:auto;margin:0"><option value="">—</option><option value="fechado">local fechado</option><option value="aberto">céu aberto</option></select>'
      + '<button class="btn mini" id="ldAmbGravar">Gravar</button><span class="muted">(confirmado com a equipe que esteve no local)</span></div>';
    h += '</div>';
  }
  // as ações
  h += '<div class="card linha acoesrev"><button class="btn" id="ldRascunho"' + (d.resultado ? '' : ' disabled') + '>Gerar o rascunho (PDF)</button>';
  if (eu.plh && cfg.oficial){
    if (atual && atual.situacao === 'emitindo') h += '<button class="btn pri" id="ldRefazer">Gerar e gravar o PDF do ' + esc(atual.numero) + (atual.revisao ? ' Rev. ' + atual.revisao : '') + '</button>';
    else if (I.situacao === 'liberada' && (!atual || reaberta)) h += '<button class="btn pri" id="ldEmitir"' + (fal.length ? ' disabled title="Resolva as pendências"' : '') + '>' + (atual ? 'Emitir a revisão (Rev. ' + (atual.revisao + 1) + ')' : 'Emitir o laudo') + '</button>';
    if (atual && atual.situacao === 'emitido' && !reaberta && I.situacao === 'liberada') h += '<button class="btn pri" id="ldAssinado">Anexar o PDF assinado</button><input type="file" id="ldArqAss" accept="application/pdf" hidden>';
  }
  if (['liberada','assinada'].indexOf(I.situacao) >= 0 && (eu.plh || !atual)) h += '<button class="btn" id="ldReabrir">Reabrir a inspeção</button>';
  h += '<span class="muted" id="ldAviso"></span></div>';
  // como o PLH assina
  if (eu.plh) h += '<div class="card"><b>Você assina como:</b> ' + (d.plh ? esc(d.plh.nome) + (d.plh.titulo ? ' — ' + esc(d.plh.titulo) : '') + ' · ' + esc(d.plh.registro) : '<span style="color:var(--crit)">não cadastrado (nome e registro no CREA)</span>')
    + ' <button class="btn mini" id="ldPlh">' + (d.plh ? 'Editar' : 'Cadastrar') + '</button></div>';
  // os laudos desta inspeção
  if ((d.laudos || []).length) h += '<h2>Laudos desta inspeção</h2><div class="card"><table><tr><th>Número</th><th>Situação</th><th>Emitido</th><th>PDF</th><th>Assinado</th></tr>'
    + d.laudos.map(l => '<tr><td><b>' + esc(l.numero) + (l.revisao ? ' Rev. ' + l.revisao : '') + '</b>' + (l.motivo_rev ? '<div class="muted">' + esc(l.motivo_rev) + '</div>' : '') + '</td><td><span class="chip ' + (SIT_LAUDO[l.situacao] || ['', ''])[1] + '">'
      + esc((SIT_LAUDO[l.situacao] || [l.situacao])[0]) + '</span></td><td>' + esc(l.emitido_por_nome || '') + '<div class="muted">' + quandoBR(l.emitido_em) + '</div></td><td>'
      + (l.pdf_path ? '<button class="btn mini" data-ldpdf="' + esc(l.pdf_path) + '" data-ldnome="' + esc(nomeLaudo(d, l.numero + (l.revisao ? ' Rev ' + l.revisao : ''))) + '">Abrir</button><div class="muted">' + l.paginas + ' pág.</div>' : '—') + '</td><td>'
      + (l.assinado_path ? '<button class="btn mini" data-ldpdf="' + esc(l.assinado_path) + '" data-ldnome="' + esc(nomeLaudo(d, l.numero + ' assinado')) + '">Abrir</button><div class="muted">' + esc(l.assinado_por_nome || '') + ' · ' + quandoBR(l.assinado_em) + '</div>' : '—')
      + '</td></tr>').join('') + '</table></div>';
  h += '<div id="ldVisor"></div>';
  $('tela').innerHTML = h;
  ligarLaudo();
}
function ligarLaudo(){
  const d = LD.d, T = $('tela'), aviso = t => { const a = $('ldAviso'); if (a) a.textContent = t || ''; };
  const recarregar = async () => { const y = window.scrollY; await telaLaudo(LD.id); window.scrollTo(0, y); };
  const ba = $('ldAmbGravar'); if (ba) ba.addEventListener('click', () => U.semDuploEnvio(ba, async () => {
    if (!$('ldAmb').value){ U.toast('Escolha o ambiente.', 'err'); return; }
    try{ await rpc('tf_insp_ambiente_gravar', { p_id: LD.id, p_ambiente: $('ldAmb').value }); U.toast('Ambiente gravado.', 'ok'); recarregar(); }catch(e){ erro(e); }
  }));
  const br = $('ldRascunho'); if (br) br.addEventListener('click', () => U.semDuploEnvio(br, async () => {
    try{
      const oficial = (d.config || {}).oficial;
      const g = await gerarLaudo(d, { marca: oficial ? 'RASCUNHO' : 'PILOTO — NÃO VALE COMO LAUDO' }, aviso);
      aviso(g.semFoto.length || g.semAnexo.length ? 'Rascunho pronto. ' + [g.semFoto.length ? g.semFoto.length + ' foto(s) não abriram' : '', g.semAnexo.length ? 'sem ' + g.semAnexo.join(' e ') : ''].filter(Boolean).join('; ') + '.' : 'Rascunho pronto (' + g.paginas + ' páginas).');
      mostrarPdf(g.bytes, nomeLaudo(d, oficial ? 'rascunho' : 'piloto'));
    }catch(e){ aviso(''); erro(e); }
  }));
  // emitir: reserva o número (ou retoma) e grava o PDF feito da fotografia
  const gravarPdf = async (laudoId) => {
    const L = await rpc('tf_laudo_ver', { p_laudo: laudoId }), dd = L.dados;
    const g = await gerarLaudo(dd, { numero: L.numero, revisao: L.revisao, emitidoEm: dd.emitido_em, motivoRev: L.motivo_rev, plh: dd.plh, exigirAnexos: true }, aviso);
    aviso('Gravando o PDF…');
    const caminho = L.inspecao_id + '/laudo-' + L.numero + (L.revisao ? '-rev' + L.revisao : '') + '-' + uid().slice(0, 8) + '.pdf';
    await N.storage.enviar('inspecoes', caminho, new Blob([g.bytes], { type:'application/pdf' }));
    await rpc('tf_laudo_pdf_gravar', { p_laudo: laudoId, p_path: caminho, p_sha: g.sha, p_paginas: g.paginas });
    aviso('');
    U.toast('Laudo ' + L.numero + (L.revisao ? ' Rev. ' + L.revisao : '') + ' emitido (' + g.paginas + ' páginas). Assine com o token e anexe.', 'ok');
    await recarregar();
    mostrarPdf(g.bytes, nomeLaudo(dd, L.numero + (L.revisao ? ' Rev ' + L.revisao : '')));
  };
  const be = $('ldEmitir'); if (be) be.addEventListener('click', () => U.semDuploEnvio(be, async () => {
    const atual = laudoAtual(d);
    if (!await N.janela.confirmar(atual ? 'Emitir a revisão' : 'Emitir o laudo', '<p>' + (atual ? 'Sai a <b>Rev. ' + (atual.revisao + 1) + '</b> do ' + esc(atual.numero) + ', com o motivo da reabertura. O anterior fica como substituído.'
        : 'Reserva o próximo número do mês e grava o PDF.') + '</p><p class="muted">Depois de emitido, o laudo não muda: para corrigir, só reabrindo a inspeção (sai uma revisão).</p>', 'Emitir')) return;
    try{ aviso('Carregando o gerador…'); await libsLaudo(); const r = await rpc('tf_laudo_emitir', { p_id: LD.id }); await gravarPdf(r.id); }
    catch(e){ aviso(''); erro(e); recarregar(); }
  }));
  const bf = $('ldRefazer'); if (bf) bf.addEventListener('click', () => U.semDuploEnvio(bf, async () => {
    try{ aviso('Carregando o gerador…'); await libsLaudo(); const r = await rpc('tf_laudo_emitir', { p_id: LD.id }); await gravarPdf(r.id); }
    catch(e){ aviso(''); erro(e); }
  }));
  // o PDF assinado com o token
  const bs = $('ldAssinado'); if (bs) bs.addEventListener('click', () => { $('ldArqAss').value = ''; $('ldArqAss').click(); });
  const fa = $('ldArqAss'); if (fa) fa.addEventListener('change', async () => {
    const f = fa.files && fa.files[0]; if (!f) return;
    const atual = laudoAtual(d);
    try{
      aviso('Conferindo o PDF…'); await libsLaudo();
      const b = new Uint8Array(await f.arrayBuffer());
      if (!ehPdf(b)) throw new Error('O arquivo não é um PDF.');
      let pags; try{ pags = (await PDFLib.PDFDocument.load(b, { ignoreEncryption:true, updateMetadata:false })).getPageCount(); }catch(e){ throw new Error('Não consegui ler o PDF assinado.'); }
      const t = new TextDecoder('latin1').decode(b);
      const assin = /\/ByteRange\s*\[/.test(t) && /\/Type\s*\/Sig\b|\/FT\s*\/Sig\b|adbe\.pkcs7|ETSI\.CAdES/.test(t);
      if (!assin) throw new Error('Este PDF não tem assinatura digital. Assine com o token (certificado A3) e anexe o arquivo assinado.');
      if (pags !== atual.paginas) throw new Error('O PDF assinado tem ' + pags + ' página(s); o emitido tem ' + atual.paginas + '. Confira se é o mesmo laudo.');
      aviso('Enviando…');
      const caminho = atual.inspecao_id + '/laudo-' + atual.numero + (atual.revisao ? '-rev' + atual.revisao : '') + '-assinado-' + uid().slice(0, 8) + '.pdf';
      await N.storage.enviar('inspecoes', caminho, new Blob([b], { type:'application/pdf' }));
      await rpc('tf_laudo_assinado', { p_laudo: atual.id, p_path: caminho, p_paginas: pags, p_assinatura: assin });
      aviso(''); U.toast('Laudo assinado. A inspeção está concluída.', 'ok'); recarregar();
    }catch(e){ aviso(''); erro(e); }
  });
  const bp = $('ldPlh'); if (bp) bp.addEventListener('click', () => {
    const p = d.plh || { nome: (d.eu || {}).nome || '' };
    janela('Como você assina o laudo', '<label class="f">Nome no laudo<input class="t" id="plNome" value="' + esc(p.nome || '') + '"></label>'
      + '<label class="f">Título <small>(opcional)</small><input class="t" id="plTit" value="' + esc(p.titulo || '') + '" placeholder="ex.: Engenheiro Industrial Mecânico"></label>'
      + '<label class="f">Registro no conselho<input class="t" id="plReg" value="' + esc(p.registro || '') + '" placeholder="ex.: CREA-MG 000000/D"></label>'
      + '<p class="muted">Sai na seção 14 e no rodapé do laudo (NR-13, 13.5.4.11 "m").</p>',
      [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {
        try{ await rpc('tf_laudo_plh_assinatura', { p_nome: $('plNome').value, p_titulo: $('plTit').value, p_registro: $('plReg').value }); U.toast('Gravado.', 'ok'); recarregar(); }
        catch(e){ erro(e); return false; } } }]);
  });
  const bre = $('ldReabrir'); if (bre) bre.addEventListener('click', () => {
    janela('Reabrir a inspeção', '<label class="f">Para onde<select class="t" id="rbPara"><option value="em_revisao">Aprovação do PLH (o cálculo, a PMTA e as datas)</option>'
      + '<option value="em_campo">O campo (a equipe corrige a coleta; a revisão recomeça)</option></select></label>'
      + '<label class="f">Motivo <small>(vai na revisão do laudo)</small><textarea class="t" id="rbMot" rows="3"></textarea></label>'
      + (laudoAtual(d) ? '<p class="muted">Esta inspeção já tem laudo: a próxima emissão sai como revisão, com o mesmo número.</p>' : ''),
      [{ rotulo:'Cancelar' }, { rotulo:'Reabrir', classe:'pri', acao:async () => {
        try{ await rpc('tf_insp_reabrir', { p_id: LD.id, p_para: $('rbPara').value, p_motivo: $('rbMot').value }); U.toast('Reaberta.', 'ok');
          location.hash = $('rbPara').value === 'em_revisao' ? 'rev=' + LD.id : 'aba=laudos'; }
        catch(e){ erro(e); return false; } } }]);
  });
  T.querySelectorAll('[data-ldpdf]').forEach(b => b.addEventListener('click', () => U.semDuploEnvio(b, async () => {
    try{ mostrarPdf(await baixar(b.dataset.ldpdf), b.dataset.ldnome); $('ldVisor').scrollIntoView({ behavior:'smooth' }); }catch(e){ erro(e); }
  })));
}

// a foto (ou o PDF) num quadro: o mesmo jeito do laudo anterior
async function mostrarArquivoEm(vis, a){
  if (!vis || !a) return;
  vis.innerHTML = '<p class="muted">Abrindo…</p>';
  if (DEMO){ vis.innerHTML = '<p class="muted">Demonstração: sem o arquivo.</p>'; return; }
  try{
    if (!blobs[a.storage_path]){
      const s = N.sessao();
      const r = await fetch(SUPA_URL + '/storage/v1/object/authenticated/inspecoes/' + a.storage_path.split('/').map(encodeURIComponent).join('/'),
        { headers:{ apikey:SUPA_ANON, Authorization:'Bearer ' + s.token } });
      if (!r.ok) throw new Error('A foto não abriu (HTTP ' + r.status + ').');
      blobs[a.storage_path] = URL.createObjectURL(await r.blob());
    }
    vis.innerHTML = /\.pdf$/i.test(a.storage_path) ? '<iframe title="Arquivo"></iframe>' : '<img alt="">';
    vis.firstChild.src = blobs[a.storage_path];
  }catch(e){ vis.innerHTML = '<p class="alerta crit"></p>'; vis.firstChild.textContent = e.message; }
}

(function boot(){
  $('barDemo').hidden = !DEMO;
  if (DEMO){ N.porteiro({ app:'doc', demo:true }); $('tela').innerHTML = '<div class="card vazio">Demonstração: o TapDoc do escritório só funciona no app publicado.</div>'; return; }
  const s = N.sessao();
  if (!s.token){ try{ sessionStorage.setItem('tf_recado', 'Entre para abrir o TapDoc.'); }catch(e){} location.href = '../'; return; }
  const g = N.porteiro({ app:'doc', demo:false, url:SUPA_URL, anon:SUPA_ANON });
  if (g === 'hub'){ location.href = '../'; return; }
  // o Esc fecha a janela do núcleo (a página não traz o próprio #modal)
  // E7: o poder PLH antes da primeira pintura (sem sinal ou erro: sem os botões do PLH)
  rpc('tf_tem_poder', { p_poder:'plh' }).then(v => { PLH = !!v; }, () => { PLH = false; }).then(pintar);
})();
