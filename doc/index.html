<!--
  TapDoc (escritório) · R02b1 — preparar a inspeção
  ─────────────────────────────────────────────────
  A T05 "Preparar a inspeção": marcar os vasos da OS, registrar e conferir o
  laudo anterior de cada um, deixar as instruções para o campo e concluir.
  Banco: sql/401_tapdoc_r02b1.sql. Desenho: inspecao-nr13/rodadas/R02b-preparacao-desenho.md.
  Abre pelo hub (card TapDoc) ou direto numa OS: doc/#os=<id>. Um vaso: doc/#os=<id>&v=<vaso>.

.txlado{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}

.txmud{margin-top:10px}
@media (max-width:760px){.txlado{grid-template-columns:1fr}}
/* S148 · item 89: o realce curto na linha que acabou de mudar */
@keyframes realce{ from{ background:var(--warn-soft, #fcefd8); } to{ background:transparent; } }
.realce{ animation:realce 1.2s ease-out; }
/* E33 · issue 13: a conferência marcada fica fechada (só o título); um clique no título abre */
.card.fechado > :not(.cfcab){display:none}
.card.fechado .cfcab{cursor:pointer}
.card.fechado .cfcab h3::before{content:'▸ ';color:var(--ink-3)}
/* E33 · issue 15: a parte com problema, marcada em vermelho pelo aviso que bloqueia (some quando a parte é corrigida) */
.problema{outline:2px solid var(--crit) !important;outline-offset:2px;background:var(--crit-soft) !important;border-radius:4px}
.btn.bloq{opacity:.55}
/* E31 · issue 31: no celular, os quadros da aba Laudos e da tela do laudo viram uma lista de cartões (nada mais largo que a tela) */
@media (max-width:700px){
  table.cartoes,table.cartoes tbody{display:block}

  table.cartoes tr{display:block;padding:10px 2px;border-bottom:1px solid var(--rule-2)}

  table.cartoes .chip{white-space:normal}
  .acoesrev .btn{flex:1 1 auto}
}

.acoesrev.rodando>.btn{display:none}
.andamento{flex:1 1 100%;min-width:0}
.andamento .barra{height:10px;border-radius:5px;background:var(--rule-2);overflow:hidden}
.andamento .barra i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.andamento .txt{font-size:13.5px;font-weight:600;color:var(--accent-ink);margin-top:6px;overflow-wrap:anywhere}
.andamento.travou .barra i{background:var(--warn)}
.andamento.travou .txt{color:var(--warn)}
</style>

function faixaTxt(m){
  if (!m || m.resist_min_mpa == null) return 'faixa de resistência não cadastrada';
  return (m.resist_max_mpa != null ? fmt(m.resist_min_mpa, 0) + ' a ' + fmt(m.resist_max_mpa, 0) + ' MPa' : 'mínimo ' + fmt(m.resist_min_mpa, 0) + ' MPa (a norma não dá máximo)');
}
function sEsperado(rmin, esc, forma){
  if (!(rmin > 0)) return null;
  let s = rmin / 3.5; if (esc > 0) s = Math.min(s, esc * 2 / 3);
  return /com costura/i.test(forma || '') ? s * 0.85 : s;
}
// a conta do S pela faixa, para o escritório e o PLH conferirem (tolerância de 2%: o ASME arredonda em ksi)
function contaS(rmin, resc, forma, s){
  const e = sEsperado(rmin, resc, forma);
  if (e == null) return '<p class="sAviso">Sem a resistência mínima: o sistema não confere o S.</p>';
  const conta = fmt(rmin, 0) + ' ÷ 3,5' + (resc > 0 && resc * 2 / 3 < rmin / 3.5 ? ' (ou 2/3 do escoamento)' : '') + (/com costura/i.test(forma || '') ? ' × 0,85 (costura)' : '') + ' = ' + fmt(e, 1) + ' MPa';
  if (!(s > 0)) return '<p class="sAviso">' + conta + '</p>';
  const ok = Math.abs(s - e) <= e * 0.02;
  return '<p class="sAviso ' + (ok ? 'ok' : 'ruim') + '">' + (ok ? '✓ Confere: ' : '⚠ Não confere: ') + conta + (ok ? '' : ' (cadastrado: ' + fmt(s, 1) + ' MPa)') + '</p>';
}

/** antes e depois, palavra por palavra: o que sai riscado em vermelho, o que entra sublinhado em verde */
function difPalavras(a, b){
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 400000) return ['<del>' + esc(a) + '</del>', '<ins>' + esc(b) + '</ins>'];
  const L = Array.from({ length:n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, ha = '', hb = '';
  while (i < n && j < m){
    if (A[i] === B[j]){ ha += esc(A[i]); hb += esc(B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]){ ha += /^\s+$/.test(A[i]) ? esc(A[i]) : '<del>' + esc(A[i]) + '</del>'; i++; }
    else { hb += /^\s+$/.test(B[j]) ? esc(B[j]) : '<ins>' + esc(B[j]) + '</ins>'; j++; }
  }
  while (i < n){ ha += /^\s+$/.test(A[i]) ? esc(A[i]) : '<del>' + esc(A[i]) + '</del>'; i++; }
  while (j < m){ hb += /^\s+$/.test(B[j]) ? esc(B[j]) : '<ins>' + esc(B[j]) + '</ins>'; j++; }
  return [ha, hb];
}

function editarMaterial(x){

  }, 0);
  janela(x.id ? 'Editar ' + x.especificacao : 'Novo material',
    '<label class="f">Especificação<input class="t" id="mt_esp" value="' + esc(x.especificacao || '') + '" placeholder="Ex.: SA-516 Gr. 70"></label>'
    + '<label class="f">Forma<input class="t" id="mt_forma" value="' + esc(x.forma || '') + '" placeholder="chapa, tubo sem costura…"></label>'
    + '<div class="g3"><label class="f">Resistência mín. (MPa)<input class="t" id="mt_rmin" inputmode="decimal" value="' + esc(fmt(x.resist_min_mpa, 0)) + '"></label>'
    + '<label class="f">Resistência máx. (MPa)<input class="t" id="mt_rmax" inputmode="decimal" value="' + esc(fmt(x.resist_max_mpa, 0)) + '" placeholder="vazio se a norma não dá"></label>'
    + '<label class="f">Escoamento mín. (MPa)<input class="t" id="mt_esc" inputmode="decimal" value="' + esc(fmt(x.escoamento_min_mpa, 0)) + '"></label></div>'
    + '<label class="f">S (MPa)<input class="t" id="mt_s" inputmode="decimal" value="' + esc(fmt(x.s_mpa, 2)) + '"></label><div id="mt_conta"></div>'
    + '<label class="f">Vale até (°C)<input class="t" id="mt_t" inputmode="decimal" value="' + esc(fmt(x.t_max_c, 0) || '200') + '"></label>'
    + '<label class="f">Fonte<input class="t" id="mt_f" value="' + esc(x.fonte || 'ASME II-D, Tabela 1A') + '"></label>'
    + '<p class="muted">Mudar o S ou a faixa apaga a conferência: o número novo ainda não foi visto pelo PLH.</p>',
    (x.id ? [{ rotulo:'Desativar', acao:async () => { try{ await rpc('tf_insp_material_gravar', { p_dados:{ id:x.id, ativo:false } }); pintar(); }catch(e){ erro(e); return false; } } }] : [])
    .concat([{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {
      const s = num($('mt_s').value), t = num($('mt_t').value);
      if (!$('mt_esp').value.trim() || !(s > 0)){ U.toast('Especificação e S são obrigatórios.', 'err'); return false; }

      if (rmin != null && rmax != null && rmax < rmin){ U.toast('A faixa está invertida: o máximo é menor que o mínimo.', 'err'); return false; }
      const d = { especificacao:$('mt_esp').value.trim(), forma:$('mt_forma').value.trim() || null, s_mpa:s, t_max_c:t || 200, fonte:$('mt_f').value.trim() || null, tabela_asme:'UCS-23',
                  resist_min_mpa:rmin, resist_max_mpa:rmax, escoamento_min_mpa:resc };
      if (x.id) d.id = x.id;

    } }]));

// ── 2b · E28 (S155 · issue 8): as placas de identificação da OS ─────────────
// A arte sai em PDF de 12 × 10 cm, do jeito que a gráfica pediu: letras em curvas, cores em CMYK e sem margem de corte.
// Quem monta o PDF é o placa-pdf.js (puro); os dados vêm de tf_placa_dados (só a inspeção liberada traz os dados da placa).
let LIBS_PLACA = null;
function libsPlaca(){
  if (!LIBS_PLACA) LIBS_PLACA = (async () => {
    if (!window.PlacaLetras) await carregarScript('vendor/placa-letras.js?v=1');
    if (!window.qrcode) await carregarScript('vendor/qrcode.js?v=2.0.4');
    if (!window.PlacaPDF) await carregarScript('placa-pdf.js?v=P1');
    return true;
  })().catch(e => { LIBS_PLACA = null; throw e; });
  return LIBS_PLACA;
}
function baixarBytes(nome, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function quadroPlacas(os){
  const cx = $('cxPlacas'); if (!cx) return;
  let D;
  try{ D = await rpc('tf_placa_dados', { p_os: os }); await libsPlaca(); }
  catch(e){ cx.innerHTML = '<p class="muted" style="color:var(--crit)">Não deu para carregar as placas: ' + esc(e && e.message ? e.message : String(e)) + '</p>'; return; }
  if (!$('cxPlacas')) return;                              // a tela mudou enquanto carregava
  const ctx = { emissora: D.emissora || {}, cliente: D.cliente || '' };
  const linhas = (D.vasos || []).map(v => {
    const falt = v.liberada ? PlacaPDF.faltas(v) : [], pronta = v.liberada && !falt.length;
    return { v, falt, pronta, avisos: pronta ? PlacaPDF.campos(v, ctx).avisos : [] };
  });
  const prontas = linhas.filter(l => l.pronta);
  let h = '<div class="linha" style="justify-content:space-between;margin-bottom:8px"><div><b>' + prontas.length + ' de ' + linhas.length + '</b> placa(s) pronta(s) para a gráfica'
    + '<div class="muted">PDF de 12 × 10 cm, com as letras em curvas, as cores em CMYK e sem margem de corte. A placa sai quando o resultado do vaso é liberado.</div></div>'
    + '<button class="btn pri" id="plTodas"' + (prontas.length ? '' : ' disabled') + '>' + (prontas.length > 1 ? 'Baixar as ' + prontas.length + ' placas (.zip)' : 'Baixar a placa') + '</button></div>';
  h += '<table class="tv" id="plTab"><tr><th>Vaso</th><th>Placa</th><th>Link da ficha no TapWeb (o QR code)</th><th></th></tr>' + linhas.map(l => {
    const v = l.v;
    return '<tr data-pl="' + esc(v.equipamento_id) + '"><td><b>' + esc(v.tag) + '</b>' + (v.numero_tap ? '<div class="muted">Nº TAP ' + esc(v.numero_tap) + '</div>' : '') + '</td>'
      + '<td>' + (!v.liberada ? '<span class="chip s-fora">espera o resultado liberado</span>'
          : l.pronta ? '<span class="chip s-pronto">pronta</span>' + (PlacaPDF.modelo(v).modelo === '2pmta' ? ' <span class="muted">modelo de 2 PMTA</span>' : '')
          : '<span class="chip s-grave">falta</span>')
        + (l.falt.length ? '<div class="muted" style="color:var(--crit)">' + l.falt.map(esc).join('<br>') + '</div>' : '')
        + (l.avisos.length ? '<div class="muted" style="color:var(--warn)">' + l.avisos.map(esc).join('<br>') + '</div>' : '') + '</td>'
      + '<td class="h-ins"><div class="linha" style="flex-wrap:nowrap"><input class="t" data-pllink="' + esc(v.equipamento_id) + '" style="margin:0;min-width:180px" placeholder="https://…" value="' + esc(v.tapweb_link || '') + '">'
        + '<button class="btn mini sec" data-plgrava="' + esc(v.equipamento_id) + '">Gravar</button></div></td>'
      + '<td class="acoes" style="text-align:right;white-space:nowrap">' + (l.pronta ? '<button class="btn mini" data-plbaixa="' + esc(v.inspecao_id) + '">Baixar a placa</button>' : '') + '</td></tr>';
  }).join('') + '</table>';
  cx.innerHTML = h;
  const gerar = (l) => { const r = PlacaPDF.gerar(l.v, ctx); return { nome: r.nome, bytes: r.bytes }; };
  cx.querySelectorAll('[data-plgrava]').forEach(b => b.addEventListener('click', () => U.semDuploEnvio(b, async () => {
    const link = (b.closest('tr').querySelector('[data-pllink]').value || '').trim();   // o campo da própria linha (o mesmo vaso pode ter duas inspeções na OS)
    if (link && !/^https:\/\/\S+$/i.test(link)){ U.toast('O link precisa começar com https:// e não pode ter espaço.', 'err'); return; }
    try{ await rpc('tf_placa_link_gravar', { p_equip: b.dataset.plgrava, p_link: link });
      U.toast(link ? (/tapweb/i.test(link) ? 'Link gravado.' : 'Link gravado. Confira: ele não parece ser do TapWeb.') : 'Link apagado.', 'ok'); await quadroPlacas(os); }
    catch(e){ erro(e); }
  })));
  cx.querySelectorAll('[data-plbaixa]').forEach(b => b.addEventListener('click', () => {
    try{ const a = gerar(linhas.find(l => l.v.inspecao_id === b.dataset.plbaixa)); baixarBytes(a.nome, new Blob([a.bytes], { type:'application/pdf' })); }
    catch(e){ erro(e); }
  }));
  $('plTodas').addEventListener('click', () => {
    try{
      const arqs = prontas.map(gerar), nomes = {};
      arqs.forEach(a => { if (nomes[a.nome]){ nomes[a.nome]++; a.nome = a.nome.replace(/\.pdf$/, ' (' + nomes[a.nome] + ').pdf'); } else nomes[a.nome] = 1; });   // duas inspeções do mesmo vaso na OS
      if (arqs.length === 1) baixarBytes(arqs[0].nome, new Blob([arqs[0].bytes], { type:'application/pdf' }));
      else baixarBytes('Placas ' + String(D.os && D.os.numero || 'OS').replace(/[\\/:*?"<>|]+/g, '-') + '.zip', zipar(arqs));
      U.toast(arqs.length + ' placa(s) baixada(s).', 'ok');
    }catch(e){ erro(e); }
  });
}

const RISCO = { A:4, B:3, C:2, D:1 };
function previa(v){
  const r = { camaras:[], vaso:null, avisos:[], detalhes:[] };

  if (!m) r.avisos.push('Prévia: sem o material do costado (Operação e câmaras), a PMTA não sai.');
  else {
    if (!m.conferido) r.avisos.push('O material ' + m.especificacao + ' é da lista provisória, ainda não conferida pelo Fernando: a prévia é indicativa.');

            componentes:[Object.assign({}, g, { leituras:leiturasDe(v, c.id).map(y => y.valor_mm) })] });

    ck.comps.filter(x => x.abaixo).forEach(x => r.avisos.push(x.c.nome + ': espessura medida abaixo da mínima requerida.'));
    ck.comps.filter(x => x.erro).forEach(x => r.detalhes.push(x.c.nome + ': ' + x.erro));
    r.camaras.push(ck);

    if (!cs.length) throw new Error('Sem câmaras.');

    if (cs.some(k => k.volume_desconhecido || !(k.volume_m3 > 0))) throw new Error('Volume desconhecido: o escritório informa o volume para a categoria.');
    const kP = cs.reduce((a, b) => Math.abs(b.p_operacao_max_mpa) > Math.abs(a.p_operacao_max_mpa) ? b : a);

    const cat = MotorNR13.categoria(classe, kP.p_operacao_max_mpa, V);
    const pr = MotorNR13.prazos(cat.categoria, { semCodigoConstrucao:!!v.sem_codigo_construcao, temperaturaAbaixoDeZeroSemDeterioracao:!!v.abaixo_zero_sem_deterioracao });
    r.vaso = { P:kP.p_operacao_max_mpa, deCamara:kP, V, classe, pv:cat.pv, grupo:cat.grupo, categoria:cat.categoria, prazos:pr };
  }catch(e){ r.vaso = { erro:e.message }; }

}
  return { usar:p => { E = p || { materiais:[] }; }, previa, minimaDe, eMinDe, compsMedir, ativas, materialDe, unidadeDe, deMPa, UNID_ROT, geoDe };

  const T = $('tela'), tag = el.matches('tr') ? 'tr' : el.matches('h2') ? 'h2' : el.matches('h3') ? 'h3' : el.matches('.card') ? '.card' : el.matches('label.f') ? 'label.f' : 'p.alerta';
  return { sel:tag, idx:Array.prototype.indexOf.call(T.querySelectorAll(tag), el), txt:(el.textContent || '').trim().slice(0, 60) };
}
function acharEl(k){
  if (!k) return null;
  const L = Array.from($('tela').querySelectorAll(k.sel)), mesmos = L.map((x, i) => [x, i]).filter(([x]) => (x.textContent || '').trim().slice(0, 60) === k.txt);
  if (mesmos.length) return mesmos.sort((a, b) => Math.abs(a[1] - k.idx) - Math.abs(b[1] - k.idx))[0][0];
  return L[Math.min(k.idx, L.length - 1)] || null;
}
function guardarLugar(){
  let melhor = null;
  $('tela').querySelectorAll(LUGAR_SEL).forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.height || r.bottom <= 0) return;
    if (r.top <= 60 && (!melhor || r.top >= melhor.top)) melhor = { el, top:r.top };
  });
  if (!melhor){ const el = Array.from($('tela').querySelectorAll(LUGAR_SEL)).find(x => x.getBoundingClientRect().top > 0); if (el) melhor = { el, top:el.getBoundingClientRect().top }; }
  return melhor ? { k:chaveEl(melhor.el), dy:melhor.top } : null;
}
// quem rola é o <main> (o corpo da página não rola): por isso o window.scrollY de antes não voltava
const rolador = () => document.querySelector('main') || document.scrollingElement;
function voltarAoLugar(g){
  if (!g) return;
  const el = acharEl(g.k); if (!el) return;
  rolador().scrollTop += el.getBoundingClientRect().top - g.dy;
}
let REV_ULTIMO = null;   // a linha (ou o quadro) do último clique na revisão
async function manterLugar(fazer){
  const g = guardarLugar(), alvo = REV_ULTIMO;
  await fazer();
  voltarAoLugar(g);
  // as fotos e os quadros que carregam depois mudam a altura: volta de novo, a menos que a pessoa já tenha rolado
  let mexeu = false; const parar = () => { mexeu = true; };
  ['wheel','touchmove','keydown','mousedown'].forEach(ev => window.addEventListener(ev, parar, { once:true, passive:true }));
  $('tela').querySelectorAll('img').forEach(im => { if (!im.complete) im.addEventListener('load', () => { if (!mexeu) voltarAoLugar(g); }, { once:true }); });
  setTimeout(() => { if (!mexeu) voltarAoLugar(g); }, 400);
  setTimeout(() => ['wheel','touchmove','keydown','mousedown'].forEach(ev => window.removeEventListener(ev, parar)), 1600);
  const r = acharEl(alvo); if (r){ r.classList.remove('realce'); void r.offsetWidth; r.classList.add('realce'); setTimeout(() => r.classList.remove('realce'), 1300); }
}
// E33 · issue 14: o nome de cada acessório na revisão ("Manômetro", ou "Manômetro 1" e "Manômetro 2" quando há dois do mesmo tipo)
function nomesAcess(lista){
  const n = {}, seq = {}, out = {};
  (lista || []).forEach(a => { n[a.tipo] = (n[a.tipo] || 0) + 1; });
  (lista || []).forEach(a => { seq[a.tipo] = (seq[a.tipo] || 0) + 1; out[a.id] = (ROT_ACESS[a.tipo] || a.tipo) + (n[a.tipo] > 1 ? ' ' + seq[a.tipo] : ''); });
  return out;
}
// E33 · issue 19: a situação marcada no campo e o resultado da aferição dizem coisas contrárias (o sistema não escolhe: alguém decide)
function contradicaoAc(a, nome){
  const r = a.afericao && a.afericao.resultado;
  if (a.situacao === 'substituir' && r === 'aprovado') return nome + ': a situação diz "substituir" e a aferição deu CONFORME. Decida qual vale: corrija a situação ou reveja a aferição.';
  if (a.situacao === 'ok' && r === 'reprovado') return nome + ': a situação diz "ok" e a aferição deu NÃO CONFORME. Decida qual vale: corrija a situação ou reveja a aferição.';
  return null;
}
// E33 · issue 23: o ponto da aferição do manômetro com a incerteza (U) maior que a tolerância (a aprovação continua pela média; o PLH decide)
function pontosEspalhados(){

// a regra sugerida: mantém a anterior quando ela cabe na calculada; senão, a calculada
// S141 · item 43 (decisão do Bruno, 10/11: A): a sugestão é a menor entre a calculada, a de plaqueta e a anterior (nenhuma acima da calculada)
function revRegra(ck){
  const calc = ck.governante ? ck.governante.pmta : null, ant = ck.cam.pmta_vigente_mpa, placa = ck.cam.pmta_plaqueta_mpa;
  if (calc == null) return { regra:'outro', valor:null };
  const cand = [{ regra:'calculada', valor:calc }];
  if (placa != null && Number(placa) <= calc + 1e-4) cand.push({ regra:'plaqueta', valor:Number(placa) });
  if (ant != null && Number(ant) <= calc + 1e-4) cand.push({ regra:'mantida_anterior', valor:Number(ant) });
  return cand.reduce((a, b) => b.valor < a.valor - 1e-6 ? b : a);
}
function revAdotada(ck, e){
  const k = ck.cam, calc = ck.governante ? ck.governante.pmta : null;
  return e.regra === 'calculada' ? calc : e.regra === 'mantida_anterior' ? (k.pmta_vigente_mpa != null ? Number(k.pmta_vigente_mpa) : null)
    : e.regra === 'plaqueta' ? (k.pmta_plaqueta_mpa != null ? Number(k.pmta_plaqueta_mpa) : null) : e.valor;
}

  const resol = 0.01;   // resolução do medidor de espessura (mm) para "sem perda mensurável"
  const out = [];
  prev.camaras.forEach(ck => { const nReg = ck.comps.filter(y => y.c.tipo === 'costado').length; let resumo = null; ck.comps.forEach(x => {
    const a = ants.find(y => y.componente_id === x.c.id);

    if (x.c.tipo === 'costado' && nReg > 1 && !resumo){ resumo = { nome:'Costado', resumo:true, atual:null, req:x.eMin, ant:null, dataAnt:null, perda:null, taxa:null, vida:null, vidaTxt:'—', cor:null, semPerda:false, regs:[] }; out.push(resumo); }

function espLerCsv(txt){
  const linhas = String(txt).replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  if (!linhas.length) throw new Error('Arquivo vazio.');
  const sep = [';', '\t', ','].find(c => linhas[0].indexOf(c) >= 0) || ',';
  const cab = linhas[0].split(sep).map(x => x.trim().replace(/^"|"$/g, '').toLowerCase());
  const iS = cab.indexOf('spot_no'), iN = cab.indexOf('reading_no'), iR = cab.indexOf('reading');
  if (iS < 0 || iR < 0) throw new Error('O arquivo não tem as colunas Spot_No e Reading (o padrão do medidor).');
  const spots = [], por = {};
  linhas.slice(1).forEach((ln, n) => {
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const sp = c[iS], val = num(c[iR]);
    if (!sp) return;
    if (val == null || Number.isNaN(val) || val <= 0 || val > 300) throw new Error('Linha ' + (n + 2) + ': leitura inválida (' + (c[iR] || 'vazia') + ').');
    if (!por[sp]){ por[sp] = []; spots.push(sp); }
    por[sp].push({ n: iN >= 0 ? Number(c[iN]) || por[sp].length + 1 : por[sp].length + 1, val });
  });
  if (!spots.length) throw new Error('Nenhuma leitura no arquivo.');
  spots.forEach(sp => por[sp].sort((a, b) => a.n - b.n));
  return { spots, por };
}

// mais uma vez. A renovação passa por uma chamada ao banco (o núcleo renova no 401 e tenta de novo).
function vencimentoDoLogin(){
  try{ const p = String(N.sessao().token || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return (JSON.parse(atob(p)).exp || 0) * 1000; }catch(e){ return 0; }
}
async function renovarLogin(forcar){
  if (!forcar && vencimentoDoLogin() - Date.now() > 60000) return;
  try{ await rpc('tf_tem_poder', { p_poder:'plh' }); }catch(e){}
}
async function lerArmazem(path){
  const url = SUPA_URL + '/storage/v1/object/authenticated/inspecoes/' + String(path).split('/').map(encodeURIComponent).join('/');
  const pedir = () => fetch(url, { headers:{ apikey:SUPA_ANON, Authorization:'Bearer ' + N.sessao().token } });
  await renovarLogin(false);
  let r = await pedir();
  if (!r.ok && [400, 401, 403].indexOf(r.status) >= 0){ await renovarLogin(true); r = await pedir(); }
  return r;
}
async function baixar(path){

}

function dataURLDe(b){   // o tipo pelo conteúdo (o Storage pode devolver octet-stream)

        const tw = fonte.widthOfTextAtSize(texto, tam);

function reduzirDesenho(f){
  return new Promise((ok, falha) => {
    const im = new Image(), url = URL.createObjectURL(f);
    im.onload = () => {
      const k = Math.min(1, 900 / im.width, 320 / im.height), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let d = cv.toDataURL('image/png');
      if (d.length > 1400000){ const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const x = c2.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0); d = c2.toDataURL('image/jpeg', 0.85); }
      ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Não consegui abrir a imagem.')); };
    im.src = url;
  });
}

// Cada passo: { rot, de, ate (em %), ch: { fase: [início, fim] dentro do passo }, espera (a pessoa age: não conta para "travou") }.
// As fases vêm de quem trabalha: aviso(texto, fase, fração) — gerarLaudo ('fotos', 'montar', 'anexos'), mapaLaudo ('mapa').
const PASSOS_RASCUNHO = [
  { rot:'carregando o gerador', de:0, ate:8, ch:{ gerador:[0, 1] } },
  { rot:'conferindo o desenho do mapa', de:8, ate:15, ch:{ mapa:[0, 1] } },

  { rot:'aguardando a sua digital', de:10, ate:15, ch:{ digital:[0, 1] }, espera:true },
  { rot:'montando o PDF', de:15, ate:80, ch:{ fotos:[0, 0.7], montar:[0.7, 0.85], anexos:[0.85, 1] } },
  { rot:'enviando', de:80, ate:100, ch:{ enviar:[0, 1] } }];
let VEZ_LD = 0;   // cada andamento ganha um número; "Tentar de novo" pula para o seguinte
const TRAVOU_MS = 120000;   // 2 minutos sem andar = "Parece que travou" (o teste encurta por window.TF_TRAVOU_MS)
/** Liga o andamento no quadro das ações. Devolve A(texto, fase, fração) e A.fim(). Um "Tentar de novo" invalida a rodada antiga (A lança { refeito }). */
function andamento(passos, refazer){
  const card = $('ldAcoes'), box = $('ldAnd'), vez = ++VEZ_LD;
  let ult = Date.now(), parado = false, pct = 0, travou = false;
  const pintarA = txt => { box.innerHTML = '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div><div class="txt" id="ldAndTxt">' + esc(txt) + '</div>'; };
  if (card){ card.classList.add('rodando'); box.hidden = false; box.classList.remove('travou'); pintarA('Começando… · 0%'); }
  const relogio = setInterval(() => {
    if (VEZ_LD !== vez || !box || !document.body.contains(box)){ clearInterval(relogio); return; }
    if (parado || travou || Date.now() - ult <= (window.TF_TRAVOU_MS || TRAVOU_MS)) return;
    travou = true; box.classList.add('travou');
    box.innerHTML = '<div class="barra"><i style="width:' + pct + '%"></i></div><div class="txt" id="ldAndTxt">Parece que travou. Tente de novo.</div>'
      + '<button class="btn pri" id="ldDeNovo" style="margin-top:8px">Tentar de novo</button>';
    $('ldDeNovo').addEventListener('click', () => { VEZ_LD++; clearInterval(relogio); refazer(); });
  }, 1000);
  const A = (t, fase, frac) => {
    if (VEZ_LD !== vez) throw Object.assign(new Error('Refeito.'), { refeito:true });   // a rodada que travou não continua
    if (!fase || !card) return;
    const i = passos.findIndex(x => x.ch[fase]); if (i < 0) return;
    const P = passos[i], [a, b] = P.ch[fase], f = Math.max(0, Math.min(1, Number(frac) || 0));
    pct = Math.max(pct, Math.min(100, Math.round(P.de + (P.ate - P.de) * (a + (b - a) * f))));
    parado = !!P.espera; ult = Date.now();
    if (travou){ travou = false; box.classList.remove('travou'); }
    pintarA('Passo ' + (i + 1) + ' de ' + passos.length + ' · ' + P.rot + (t ? ' · ' + t : '') + ' · ' + pct + '%');
  };
  A.fim = () => { clearInterval(relogio); if (VEZ_LD === vez && card){ card.classList.remove('rodando'); box.hidden = true; box.innerHTML = ''; } };
  return A;
}

    A('', 'fotos', 0);
    const L = await rpc('tf_laudo_ver', { p_laudo: laudoId }), dd = L.dados;
    const carimbo = await rpc('tf_laudo_carimbo', { p_laudo: laudoId });   // S145 · A2/A7.3: só o PLH que aprovou, com a digital
    const g = await gerarLaudo(dd, { numero: L.numero, revisao: L.revisao, emitidoEm: dd.emitido_em, motivoRev: L.motivo_rev, plh: dd.plh, exigirAnexos: true, carimbo }, A);
    A('', 'enviar', 0.1);
    const caminho = L.inspecao_id + '/laudo-' + L.numero + (L.revisao ? '-rev' + L.revisao : '') + '-' + uid().slice(0, 8) + '.pdf';
    await enviarArq(caminho, new Blob([g.bytes], { type:'application/pdf' }), 'O laudo');
    A('', 'enviar', 0.8);
    await rpc('tf_laudo_pdf_gravar', { p_laudo: laudoId, p_path: caminho, p_sha: g.sha, p_paginas: g.paginas });
    A('', 'enviar', 1); A.fim(); aviso('');
    U.toast('Laudo ' + L.numero + (L.revisao ? ' Rev. ' + L.revisao : '') + ' aprovado e gravado (' + g.paginas + ' páginas). Assine com o token (aba Laudos › Para assinar).', 'ok');
    await recarregar();
    mostrarPdf(g.bytes, nomeLaudo(dd, L.numero + (L.revisao ? ' Rev ' + L.revisao : '')));
  };
  const be = $('ldEmitir'); if (be) be.addEventListener('click', () => U.semDuploEnvio(be, async () => {
    if ((d.faltas || []).length){ marcarProblema($('ldFaltas'), 'Falta para emitir: ' + d.faltas.length + ' item(ns) em "Antes de emitir" (Laudo).'); return; }   // E33 · issue 15
    const atual = laudoAtual(d);
    // E31 · issue 29: sem digital neste aparelho, avisa ANTES (sem abrir o PIN, que depois seria recusado)
    if (!await temDigitalAqui()){ avisoSemDigital(); return; }
    if (!await N.janela.confirmar(atual ? 'Aprovar e emitir a revisão' : 'Aprovar e emitir o laudo', '<p>' + (atual ? 'Sai a <b>Rev. ' + (atual.revisao + 1) + '</b> do ' + esc(atual.numero) + ', com o motivo da reabertura. O anterior fica como substituído.'
        : 'Reserva o próximo número do mês e grava o PDF.') + '</p><p>Você aprova com a <b>sua digital</b> (o PIN não vale). Cada página sai com o desenho da sua assinatura e "Aprovado eletronicamente por …".</p>'
        + '<p class="muted">Depois de aprovado, o laudo não muda: para corrigir, só reabrindo a inspeção (sai uma revisão). Depois, assine o PDF com o token.</p>', 'Aprovar com a digital')) return;
    const A = andamento(PASSOS_EMITIR, () => refazerLaudo('ldRefazer', 'ldEmitir'));
    try{ A('', 'gerador', 0); await libsLaudo(); A('', 'gerador', 1); await mapaLaudo(d, A, true);   // S151 · issue 7: a imagem entra na fotografia do laudo
      const r = await emitirComDigital(A); if (r) await gravarPdf(r.id, A); else { A.fim(); aviso(''); } }
    catch(e){ if (e && e.refeito) return; A.fim(); aviso(''); erro(e); recarregar(); }
  }));
  // S145 · A7.1: a aprovação é a digital do PLH (finalidade laudo_aprovar); retomar o PDF que falhou não pede de novo
  // E31 · issue 29: soDigital — a tela não mostra o PIN; sem digital, o aviso no lugar do teclado
  const emitirComDigital = async (A) => {
    A('', 'digital', 0);
    const c = await N.confirmarPessoa({ modo:'servidor', finalidade:'laudo_aprovar', referencia:'laudo ' + LD.id, titulo:'Aprovar o laudo', sub:(d.vaso.tag || '') + ' · com a sua digital', soDigital:true });
    if (c && c.semDigital){ avisoSemDigital(); return null; }
    if (!c || !c.ok){ if (c && c.semSinal) U.toast('Sem sinal: a aprovação precisa de internet.', 'err'); return null; }
    if (c.metodo !== 'digital'){ U.toast('A aprovação do laudo é só com a digital (o PIN não vale). Cadastre a digital neste aparelho ou aprove pelo celular.', 'err'); return null; }
    A('', 'digital', 1);
    return rpc('tf_laudo_emitir', { p_id: LD.id, p_confirmacao: c.confirmacao });
  };
  const bf = $('ldRefazer'); if (bf) bf.addEventListener('click', () => U.semDuploEnvio(bf, async () => {
    const A = andamento(PASSOS_EMITIR, () => refazerLaudo('ldRefazer', 'ldEmitir'));
    try{ A('', 'gerador', 0); await libsLaudo(); A('', 'gerador', 1); await mapaLaudo(d, A, true);
      let r; try{ r = await rpc('tf_laudo_emitir', { p_id: LD.id }); }
      catch(e){ if (!/digital/i.test(e.message || '')) throw e;
        if (!await temDigitalAqui()){ A.fim(); aviso(''); avisoSemDigital(); return; }
        r = await emitirComDigital(A); }
      if (r) await gravarPdf(r.id, A); else { A.fim(); aviso(''); } }
    catch(e){ if (e && e.refeito) return; A.fim(); aviso(''); erro(e); }
  }));
  // o PDF assinado com o token
  const bs = $('ldAssinado'); if (bs) bs.addEventListener('click', () => { $('ldArqAss').value = ''; $('ldArqAss').click(); });
  const fa = $('ldArqAss'); if (fa) fa.addEventListener('change', async () => {
    const f = fa.files && fa.files[0]; if (!f) return;
    const atual = laudoAtual(d);
    try{
      aviso('Conferindo o PDF…');
      await devolverAssinado(atual, new Uint8Array(await f.arrayBuffer()), aviso);
      aviso(''); U.toast('Laudo assinado e conferido. A inspeção está concluída.', 'ok'); recarregar();
    }catch(e){ aviso(''); erro(e); }
  });
  const bp = $('ldPlh'); if (bp) bp.addEventListener('click', () => {
    const p = d.plh || { nome: (d.eu || {}).nome || '' };
    janela('Como você assina o laudo', '<label class="f">Nome no laudo<input class="t" id="plNome" value="' + esc(p.nome || '') + '"></label>'
      + '<label class="f">Título <small>(opcional)</small><input class="t" id="plTit" value="' + esc(p.titulo || '') + '" placeholder="ex.: Engenheiro Industrial Mecânico"></label>'
      + '<label class="f">Registro no conselho<input class="t" id="plReg" value="' + esc(p.registro || '') + '" placeholder="ex.: CREA-MG 000000/D"></label>'
      + '<p class="muted">Sai na seção 14 e no rodapé do laudo (NR-13, 13.5.4.11 "m").</p>',
      [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {
        try{ await rpc('tf_laudo_plh_assinatura', { p_nome: $('plNome').value, p_titulo: $('plTit').value, p_registro: $('plReg').value }); U.toast('Gravado.', 'ok'); recarregar(); }
        catch(e){ erro(e); return false; } } }]);
  });
  const bre = $('ldReabrir'); if (bre) bre.addEventListener('click', () => {
    janela('Reabrir a inspeção', '<label class="f">Para onde<select class="t" id="rbPara"><option value="em_revisao">Aprovação do PLH (o cálculo, a PMTA e as datas)</option>'
      + '<option value="em_campo">O campo (a equipe corrige a coleta; a revisão recomeça)</option></select></label>'
      + '<label class="f">Motivo <small>(vai na revisão do laudo)</small><textarea class="t" id="rbMot" rows="3"></textarea></label>'
      + (laudoAtual(d) ? '<p class="muted">Esta inspeção já tem laudo: a próxima emissão sai como revisão, com o mesmo número.</p>' : ''),
      [{ rotulo:'Cancelar' }, { rotulo:'Reabrir', classe:'pri', acao:async () => {
        try{ await rpc('tf_insp_reabrir', { p_id: LD.id, p_para: $('rbPara').value, p_motivo: $('rbMot').value }); U.toast('Reaberta.', 'ok');
          location.hash = $('rbPara').value === 'em_revisao' ? 'rev=' + LD.id : 'aba=laudos'; }
        catch(e){ erro(e); return false; } } }]);
  });
  T.querySelectorAll('[data-ldpdf]').forEach(b => b.addEventListener('click', () => U.semDuploEnvio(b, async () => {
    try{ mostrarPdf(await baixar(b.dataset.ldpdf), b.dataset.ldnome); $('ldVisor').scrollIntoView({ behavior:'smooth' }); }catch(e){ erro(e); }
  })));
}

// a foto (ou o PDF) num quadro: o mesmo jeito do laudo anterior
async function mostrarArquivoEm(vis, a){
  if (!vis || !a) return;
  vis.innerHTML = '<p class="muted">Abrindo…</p>';
  if (DEMO){ vis.innerHTML = '<p class="muted">Demonstração: sem o arquivo.</p>'; return; }
  try{
    if (!blobs[a.storage_path]){
      const r = await lerArmazem(a.storage_path);   // S148 · item 80
      if (!r.ok) throw new Error('A foto não abriu (HTTP ' + r.status + ').');
      blobs[a.storage_path] = URL.createObjectURL(await r.blob());
    }
    vis.innerHTML = /\.pdf$/i.test(a.storage_path) ? '<iframe title="Arquivo"></iframe>' : '<img alt="">';
    vis.firstChild.src = blobs[a.storage_path];
  }catch(e){ vis.innerHTML = '<p class="alerta crit"></p>'; vis.firstChild.textContent = e.message; }
}

// ── início ─────────────────────────────────────────────────────────────────
(function boot(){
  $('barDemo').hidden = !DEMO;
  if (DEMO){ N.porteiro({ app:'doc', demo:true }); $('tela').innerHTML = '<div class="card vazio">Demonstração: o TapDoc do escritório só funciona no app publicado.</div>'; return; }
  const s = N.sessao();
  if (!s.token){ try{ sessionStorage.setItem('tf_recado', 'Entre para abrir o TapDoc.'); }catch(e){} location.href = '../'; return; }
  const g = N.porteiro({ app:'doc', demo:false, url:SUPA_URL, anon:SUPA_ANON });
  if (g === 'hub'){ location.href = '../'; return; }
  // o Esc fecha a janela do núcleo (a página não traz o próprio #modal)
  // E7: o poder PLH antes da primeira pintura (sem sinal ou erro: sem os botões do PLH)
  rpc('tf_tem_poder', { p_poder:'plh' }).then(v => { PLH = !!v; }, () => { PLH = false; }).then(pintar);
})();
</script>
