.cfcab{cursor:pointer} .card:not(.fechado) > .cfcab h3::before{content:'▾ ';color:var(--ink-3)}

.espleit{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:2px 0 4px} .espleit .espmin{color:var(--accent-ink);background:var(--warn-soft);padding:0 3px;border-radius:3px}

.boromini{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px} .boromini figure{margin:0;width:150px} .boromini .mini{width:150px;height:112px;border:1px solid var(--rule);border-radius:4px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:0}

@media (max-width:700px){
  table.cartoes,table.cartoes tbody{display:block}

<script>
'use strict';

// const VERSAO = 'TapDoc E56';   // E56 (S220 · issue 240): as abas presas ao rolar; "Textos do laudo" texto por texto (Aprovar/Recusar em cada texto, o PIN para aprovar), com o nome de cada texto em português e o antes e depois aberto; as explicações das propostas em tópicos (451)

// 405: a faixa de resistência (norma do material) e o S esperado pelo ASME (fator 3,5; 2/3 do escoamento; costura × 0,85)
function faixaTxt(m){
  if (!m || m.resist_min_mpa == null) return 'faixa de resistência não cadastrada';
  return (m.resist_max_mpa != null ? fmt(m.resist_min_mpa, 0) + ' a ' + fmt(m.resist_max_mpa, 0) + ' MPa' : 'mínimo ' + fmt(m.resist_min_mpa, 0) + ' MPa (a norma não dá máximo)');
}
function sEsperado(rmin, esc, forma){
  if (!(rmin > 0)) return null;
  let s = rmin / 3.5; if (esc > 0) s = Math.min(s, esc * 2 / 3);
  return /com costura/i.test(forma || '') ? s * 0.85 : s;
}
// a conta do S pela faixa, para o escritório e o PLH conferirem (tolerância de 2%: o ASME arredonda em ksi)
function contaS(rmin, resc, forma, s){
  const e = sEsperado(rmin, resc, forma);
  if (e == null) return '<p class="sAviso">Sem a resistência mínima: o sistema não confere o S.</p>';
  const conta = fmt(rmin, 0) + ' ÷ 3,5' + (resc > 0 && resc * 2 / 3 < rmin / 3.5 ? ' (ou 2/3 do escoamento)' : '') + (/com costura/i.test(forma || '') ? ' × 0,85 (costura)' : '') + ' = ' + fmt(e, 1) + ' MPa';
  if (!(s > 0)) return '<p class="sAviso">' + conta + '</p>';
  const ok = Math.abs(s - e) <= e * 0.02;
  return '<p class="sAviso ' + (ok ? 'ok' : 'ruim') + '">' + (ok ? '✓ Confere: ' : '⚠ Não confere: ') + conta + (ok ? '' : ' (cadastrado: ' + fmt(s, 1) + ' MPa)') + '</p>';
}

function quadroMaterialCampo(ins){

  const quando = mc.em ? new Date(mc.em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
  let h = '<div class="card" id="cxMatCampo" style="border-left:4px solid #B42318"><h3 style="margin-top:0">Material alterado em campo</h3>'
    + '<p>De <b>' + esc(mc.de || '—') + '</b> (escritório) para <b>' + esc(mc.para || 'nenhum') + '</b> (campo).</p>'
    + '<p class="muted">Motivo: ' + esc(mc.motivo || '') + (mc.por ? ' · ' + esc(mc.por) : '') + (quando ? ' · ' + quando : '') + '</p>';
  if (mc.decisao) h += '<p><span class="chip s-pronto">' + (mc.decisao === 'aceito' ? 'aceito: fica o de campo' : 'revertido: voltou o do escritório') + '</span>' + (mc.decidido_por ? ' <span class="muted">' + esc(mc.decidido_por) + '</span>' : '') + '</p>';

}

/* S172 · issues 40, 42 e 55 (Revisão TapDoc · Rodada 2) — A LEITURA DO NÚMERO DIGITADO. É a MESMA regra no celular
 * (field/doc/index.html) e no escritório (doc/index.html): mudou num arquivo, mude no outro (o teste_s172.py confere os dois).
 *  · a vírgula é sempre a decimal: "1,25" = 1,25 · "0,8" = 0,8;
 *  · com vírgula, o ponto é o separador de milhar, em grupos de 3: "1.000,5" = 1000,5 · "12.345,67" = 12345,67;
 *  · sem vírgula, dois pontos ou mais em grupos de 3 também são milhar: "1.250.000" = 1250000;
 *  · sem vírgula, UM ponto seguido de exatamente 3 algarismos ("1.000", "1.250") é AMBÍGUO (mil… ou um vírgula…?):
 *    o campo pergunta ao lado ("1250 ou 1,25?") e NADA é gravado até a pessoa escolher (perguntarMilhar);
 *  · os outros pontos sozinhos são decimais, como antes: "1.5" = 1,5 · "0.250" = 0,25 (zero na frente não é milhar);
 *  · o resto (duas vírgulas, letra, ponto fora do lugar) é "número inválido".
 * num() continua lendo o ambíguo como decimal: as pressões (issue 49, Rodada 4) e o CSV do medidor (que usa ponto decimal)
 * não mudaram. Os campos de medida, volume e instrumento perguntam (celular: numOuAviso; escritório: numMedida). */
function lerNum(s){
  if (s == null) return { v:null };
  let t = String(s).trim().replace(/\s/g, '').replace(/^−/, '-');
  if (!t) return { v:null };
  let sinal = 1;
  if (t[0] === '-' || t[0] === '+'){ if (t[0] === '-') sinal = -1; t = t.slice(1); }
  const MIL = /^\d{1,3}(\.\d{3})+$/, mal = { v:NaN };
  if (!t) return mal;
  if (t.indexOf(',') >= 0){
    const p = t.split(',');
    if (p.length !== 2 || !/^\d*$/.test(p[1]) || (!p[0] && !p[1])) return mal;
    let i = p[0];
    if (i.indexOf('.') >= 0){ if (!MIL.test(i)) return mal; i = i.replace(/\./g, ''); }
    else if (!/^\d*$/.test(i)) return mal;
    return { v: sinal * Number((i || '0') + '.' + (p[1] || '0')) };
  }
  const pontos = (t.match(/\./g) || []).length;
  if (pontos > 1) return MIL.test(t) ? { v: sinal * Number(t.replace(/\./g, '')) } : mal;
  if (t === '.' || !/^\d*\.?\d*$/.test(t)) return mal;
  if (/^[1-9]\d{0,2}\.\d{3}$/.test(t)){
    const dec = sinal * Number(t), mil = sinal * Number(t.replace('.', ''));
    return { v: dec, ambiguo:true, milhar: mil, decimal: dec, texto: (sinal < 0 ? '-' : '') + t };
  }
  return { v: sinal * Number(t) };
}
function num(s){ return lerNum(s).v; }
/** O número ambíguo: a pergunta fica logo abaixo do campo, com os dois botões; escolher reescreve o campo sem a dúvida

/** antes e depois, palavra por palavra: o que sai riscado em vermelho, o que entra sublinhado em verde */
function difPalavras(a, b){
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 400000) return ['<del>' + esc(a) + '</del>', '<ins>' + esc(b) + '</ins>'];
  const L = Array.from({ length:n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, ha = '', hb = '';
  while (i < n && j < m){
    if (A[i] === B[j]){ ha += esc(A[i]); hb += esc(B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]){ ha += /^\s+$/.test(A[i]) ? esc(A[i]) : '<del>' + esc(A[i]) + '</del>'; i++; }
    else { hb += /^\s+$/.test(B[j]) ? esc(B[j]) : '<ins>' + esc(B[j]) + '</ins>'; j++; }
  }
  while (i < n){ ha += /^\s+$/.test(A[i]) ? esc(A[i]) : '<del>' + esc(A[i]) + '</del>'; i++; }
  while (j < m){ hb += /^\s+$/.test(B[j]) ? esc(B[j]) : '<ins>' + esc(B[j]) + '</ins>'; j++; }
  return [ha, hb];
}

    [{ rotulo:'Cancelar' }, { rotulo:ap.length ? 'Continuar' : 'Recusar', classe:'pri', acao:() => {
      const m = ($('txRec').value || '').trim(); if (m.length < 5){ U.toast('Diga por que recusar.', 'err'); return false; }

/** E52 · issue 74, item 7: o PDF tem o dicionário de criptografia (/Encrypt no trailer): protegido por senha ou com bloqueio de cópia. */
function pdfProtegido(b){
  if (!b || !b.length) return false;
  const pedaco = (de, ate) => { let t = ''; for (let i = de; i < ate; i++) t += String.fromCharCode(b[i]); return t; };
  const n = b.length, fim = pedaco(Math.max(0, n - 65536), n), ini = pedaco(0, Math.min(n, 65536));   // o trailer fica no fim (ou no começo, no PDF "linearizado")
  return /\/Encrypt\s*\d+\s+\d+\s+R|\/Encrypt\s*<</.test(fim + ' ' + ini);
}

/** E54 · issue 215: o QR code guardado ("0" e "1", n × n) desenhado num canvas pequeno, para conferir. */
function qrPrevia(t, px){
  const n = Math.round(Math.sqrt((t || '').length)); if (!n) return '';
  const c = document.createElement('canvas'), m = Math.max(1, Math.floor((px || 120) / (n + 4))); c.width = c.height = (n + 4) * m;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (t[r * n + k] === '1') x.fillRect((k + 2) * m, (r + 2) * m, m, m);
  return c.toDataURL('image/png');
}

async function lerImagemQR(arq){

    const im = await new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => falha(new Error('Não consegui abrir a imagem (use PNG ou JPG).')); i.src = url; });
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));

  } finally { URL.revokeObjectURL(url); }
}

  return e.regra === 'calculada' ? calc : e.regra === 'mantida_anterior' ? (k.pmta_vigente_mpa != null ? Number(k.pmta_vigente_mpa) : null)
    : e.regra === 'plaqueta' ? (k.pmta_plaqueta_mpa != null ? Number(k.pmta_plaqueta_mpa) : null) : e.valor;
}

function revVidas(){
  const { R, v, prev } = REV, ants = R.espessuras_anteriores || [];

  const dataAtual = dataSP(R.inspecao.termino || R.inspecao.inicio);

    const a = ants.find(y => y.componente_id === x.c.id);

    if (x.c.tipo === 'costado' && nReg > 1 && !resumo){ resumo = { nome:'Costado', resumo:true, atual:null, req:x.eMin, ant:null, dataAnt:null, perda:null, taxa:null, vida:null, vidaTxt:'—', cor:null, semPerda:false, regs:[] }; out.push(resumo); }
    const o = { nome:x.c.tipo === 'costado' && nReg > 1 ? nomeReg(x.c) : x.c.nome, sub:x.c.tipo === 'costado' && nReg > 1, atual:x.tMin, req:x.eMin, ant:a ? Number(a.t_ant) : null, dataAnt:a ? a.data_ant : null, perda:null, taxa:null, vida:null, vidaTxt:'—', cor:null, semPerda:false };
    if (o.ant != null && o.atual != null && o.dataAnt && dataAtual){
      const anos = (new Date(dataAtual) - new Date(o.dataAnt)) / (365.25 * 864e5);
      o.perda = o.ant - o.atual;
      if (anos > 0){
        if (o.perda < resol){ o.semPerda = true; o.taxa = resol / anos;
          if (o.req != null){ o.vida = (o.atual - o.req) / o.taxa; o.vidaTxt = o.vida > 0 ? 'maior que ' + fmt(o.vida, 0) + ' anos' : 'abaixo da requerida'; } }
        else { o.taxa = o.perda / anos;
          if (o.req != null){ o.vida = (o.atual - o.req) / o.taxa; o.vidaTxt = o.vida > 0 ? fmt(o.vida, 1) + ' anos' : 'abaixo da requerida'; } }

        if (o.vida != null && o.vida <= 0) o.cor = 'vermelho';

    out.push(o);
    if (o.sub && resumo){
      resumo.regs.push(o);
      if (o.atual != null && (resumo.atual == null || o.atual < resumo.atual)){ resumo.atual = o.atual; resumo.nome = 'Costado (menor leitura no ' + (siglaReg(x.c) || nomeReg(x.c)) + ')'; }

      if (o.vida != null && (resumo.vida == null || o.vida < resumo.vida)){ resumo.vida = o.vida; resumo.vidaTxt = o.vidaTxt; }

function espLerCsv(txt){
  const linhas = String(txt).replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim());
  if (!linhas.length) throw new Error('Arquivo vazio.');
  const sep = [';', '\t', ','].find(c => linhas[0].indexOf(c) >= 0) || ',';
  const cab = linhas[0].split(sep).map(x => x.trim().replace(/^"|"$/g, '').toLowerCase());
  const iS = cab.indexOf('spot_no'), iN = cab.indexOf('reading_no'), iR = cab.indexOf('reading');
  if (iS < 0 || iR < 0) throw new Error('O arquivo não tem as colunas Spot_No e Reading (o padrão do medidor).');
  // S174 · issue 38 (E43): a leitura inválida (zero ou vazia: o medidor perdeu o acoplamento) fica de fora e as outras entram.
  // O ponto continua na lista mesmo sem leitura boa, para a ordem do arquivo (1 a n) não mudar; `fora` diz o que saiu.
  const spots = [], por = {}, fora = [];
  linhas.slice(1).forEach((ln, n) => {
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const sp = c[iS], val = num(c[iR]);
    if (!sp) return;
    if (!por[sp]){ por[sp] = []; spots.push(sp); }
    if (val == null || Number.isNaN(val) || val <= 0 || val > 300){ fora.push({ linha:n + 2, ponto:sp, txt:c[iR] || 'vazia' }); return; }
    por[sp].push({ n: iN >= 0 ? Number(c[iN]) || por[sp].length + 1 : por[sp].length + 1, val });
  });
  if (!spots.length) throw new Error('Nenhuma leitura no arquivo.');
  if (!spots.some(sp => por[sp].length)) throw new Error('Nenhuma leitura válida no arquivo (todas zero, vazias ou acima de 300 mm).');
  spots.forEach(sp => por[sp].sort((a, b) => a.n - b.n));
  return { spots, por, fora };
}

async function lerArmazem(path){

const GIRO_INSP = {};
const ehUuid = x => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x || ''));

  if (!ehUuid(insp)) return (GIRO_INSP[insp] = GIRO_INSP[insp] || {});
  if (!forcar && GIRO_INSP[insp]) return GIRO_INSP[insp];
  try{ GIRO_INSP[insp] = (await rpc('tf_insp_fotos_giro', { p_inspecoes:[insp] })) || {}; }catch(e){ GIRO_INSP[insp] = GIRO_INSP[insp] || {}; }   // banco sem a 449: nada gira

function girarCanvas(img, g){
  const c = document.createElement('canvas'), deitar = g === 90 || g === 270;

async function urlFoto(path, g){

  if (!vis || !a) return;
  vis.innerHTML = '<p class="muted">Abrindo…</p>';
  if (DEMO){ vis.innerHTML = '<p class="muted">Demonstração: sem o arquivo.</p>'; return; }
  try{
    // E53 · issue 220: a foto girada aparece girada (a do PDF não gira)
    const g = /\.pdf$/i.test(a.storage_path) ? 0 : (a.girar || 0), u = await urlFoto(a.storage_path, g);
    vis.innerHTML = /\.pdf$/i.test(a.storage_path) ? '<iframe title="Arquivo"></iframe>' : '<img alt="">';
    vis.firstChild.src = u;
  }catch(e){ vis.innerHTML = '<p class="alerta crit"></p>'; vis.firstChild.textContent = e.message; }
}

// ── início ─────────────────────────────────────────────────────────────────
(function boot(){
  $('barDemo').hidden = !DEMO;
  if (DEMO){ N.porteiro({ app:'doc', demo:true }); $('tela').innerHTML = '<div class="card vazio">Demonstração: o TapDoc do escritório só funciona no app publicado.</div>'; return; }
  const s = N.sessao();
  if (!s.token){ try{ sessionStorage.setItem('tf_recado', 'Entre para abrir o TapDoc.'); }catch(e){} location.href = '../'; return; }
  const g = N.porteiro({ app:'doc', demo:false, url:SUPA_URL, anon:SUPA_ANON });
  if (g === 'hub'){ location.href = '../'; return; }
  // o Esc fecha a janela do núcleo (a página não traz o próprio #modal)
  // E7: o poder PLH antes da primeira pintura (sem sinal ou erro: sem os botões do PLH)
  rpc('tf_tem_poder', { p_poder:'plh' }).then(v => { PLH = !!v; }, () => { PLH = false; }).then(pintar);
})();
</script>
