<script>
'use strict';
const VERSAO = 'TapDoc E21';   // E21 (S148 · 425): itens 80 (foto e arquivo com o login renovado), 85 (um ponto do CSV por componente, na ordem do medidor), 89 (a revisão não volta ao topo), 90 (o certificado do padrão nos anexos), 91 (placa com três respostas) e 93 (boroscopia: imagem × resultado)
// const VERSAO = 'TapDoc E20';   // E20 (S147 · 423): item 86 — o laudo assinado (e qualquer arquivo da inspeção) até 50 MB; mensagem do tamanho em português
// const VERSAO = 'TapDoc E19';   // E19 (S146 · 422): item 79 — os textos prontos do laudo: o quadro "Textos prontos" na revisão (o escritório troca o caso escolhido em campo), o texto pronto do prazo menor (P1) e a aba "Textos do laudo" (propor; o PLH aprova com a digital; versões); laudo-pdf.js S146
// const VERSAO = 'TapDoc E18';   // E18 (S145 · 421): rodada E — a assinatura do laudo: o desenho do PLH (aceito com a digital), aprovar e emitir com a digital, o carimbo em todas as páginas, o pacote para o token (Assinador SERPRO) e a conferência do PDF assinado (assinatura-pdf.js), a participação dos técnicos
// const VERSAO = 'TapDoc E17';   // E17 (S144 · 420 e 211): rodada D2 — itens 63, 69, 70, 71, 72, 75, 77 e 78 da lista (Número TAP, função e "sem placa" na revisão; prazo menor que o da norma; anexos com miniaturas; tampos com E diferente; sugestões de recomendação; cadastro do padrão; laudo-pdf.js S144)
// const VERSAO = 'TapDoc E16';   // E16 (S143 · 419): rodada D1 — texto e cara do laudo (itens 62 a 69, 73 a 76 e 78 da lista; só o laudo-pdf.js S143)
// const VERSAO = 'TapDoc E15';   // E15 (S141 · 417): rodada B da lista — itens 31, 32, 34, 35, 41, 42, 43, 45, 46, 47, 48, 58 e 61 (Em campo, retomar a coleta, PMTA escolhida na revisão, câmaras corrigidas na revisão, imagens da boroscopia, lacre da aferição, nomes por extenso, laudo com o tipo do teste)
// const VERSAO = 'TapDoc E14';   // E14 (S140 · 416): itens 44, 49, 50, 51, 53 e 56 da lista — volume em m³ e litros com aviso, as fotos com lugar (mudar de lugar, "sem foto"), a foto da galeria marcada, aviso acima de 200 °C, o costado com regiões e o lembrete interno da aferição
// const VERSAO = 'TapDoc E13';   // E13 (S135): item 27 da lista: nomes e e-mails do modo demonstração trocados por fictícios
// const VERSAO = 'TapDoc E12';   // E12 (S132): o sistema se chama TapHub nas telas (item #10 da lista) e "Relatar problema ou sugerir" no menu (núcleo N6, modulos M2)
// const VERSAO = 'TapDoc E11';   // E11 (S113 · 414): tirar o vaso da OS (mesmo em campo, com motivo) · reabrir para o campo na revisão · a boroscopia lançada no escritório ·   // E10 (S107 · 412): o CSV do medidor anexado na revisão (Espessuras do medidor); a revisão exige as espessuras ·   // E9 (S94 · 410, R06a): o laudo em PDF (aba Laudos), a ART na preparação, o ambiente, o PDF do certificado dos instrumentos e as datas do PLH na aprovação ·   // E8 (S93 · 409, R05a): a revisão (A revisar: Revisão 1, Revisão 2 e a aprovação do PLH) ·   // E7 (S92 · 408, Acessos P3): entra quem tem o TapDoc; conferir e decidir é do PLH ·   // E = escritório · E6 (S86 · 407, R04a): padrão com U/k, numeração M/V e as aferições da inspeção (E5: material de campo; E4: faixa)
// 405: a faixa de resistência (norma do material) e o S esperado pelo ASME (fator 3,5; 2/3 do escoamento; costura × 0,85)
function faixaTxt(m){
  if (!m || m.resist_min_mpa == null) return 'faixa de resistência não cadastrada';
  return (m.resist_max_mpa != null ? fmt(m.resist_min_mpa, 0) + ' a ' + fmt(m.resist_max_mpa, 0) + ' MPa' : 'mínimo ' + fmt(m.resist_min_mpa, 0) + ' MPa (a norma não dá máximo)');
}
function sEsperado(rmin, esc, forma){
  if (!(rmin > 0)) return null;
  let s = rmin / 3.5; if (esc > 0) s = Math.min(s, esc * 2 / 3);
  return /com costura/i.test(forma || '') ? s * 0.85 : s;
}
// a conta do S pela faixa, para o escritório e o PLH conferirem (tolerância de 2%: o ASME arredonda em ksi)
function contaS(rmin, resc, forma, s){
  const e = sEsperado(rmin, resc, forma);
  if (e == null) return '<p class="sAviso">Sem a resistência mínima: o sistema não confere o S.</p>';
  const conta = fmt(rmin, 0) + ' ÷ 3,5' + (resc > 0 && resc * 2 / 3 < rmin / 3.5 ? ' (ou 2/3 do escoamento)' : '') + (/com costura/i.test(forma || '') ? ' × 0,85 (costura)' : '') + ' = ' + fmt(e, 1) + ' MPa';
  if (!(s > 0)) return '<p class="sAviso">' + conta + '</p>';
  const ok = Math.abs(s - e) <= e * 0.02;
  return '<p class="sAviso ' + (ok ? 'ok' : 'ruim') + '">' + (ok ? '✓ Confere: ' : '⚠ Não confere: ') + conta + (ok ? '' : ' (cadastrado: ' + fmt(s, 1) + ' MPa)') + '</p>';
}
// 406: a troca de material feita em campo e a decisão do escritório
function quadroMaterialCampo(ins){
  const mc = ins && ins.material_campo; if (!mc) return '';
  const quando = mc.em ? new Date(mc.em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
  let h = '<div class="card" id="cxMatCampo" style="border-left:4px solid #B42318"><h3 style="margin-top:0">Material alterado em campo</h3>'
    + '<p>De <b>' + esc(mc.de || '—') + '</b> (escritório) para <b>' + esc(mc.para || 'nenhum') + '</b> (campo).</p>'
    + '<p class="muted">Motivo: ' + esc(mc.motivo || '') + (mc.por ? ' · ' + esc(mc.por) : '') + (quando ? ' · ' + quando : '') + '</p>';
  if (mc.decisao) h += '<p><span class="chip s-pronto">' + (mc.decisao === 'aceito' ? 'aceito: fica o de campo' : 'revertido: voltou o do escritório') + '</span>' + (mc.decidido_por ? ' <span class="muted">' + esc(mc.decidido_por) + '</span>' : '') + '</p>';
  else if (!PLH) h += '<p class="muted">O cálculo oficial espera esta decisão. Quem decide é o PLH.</p>';
  else h += '<p class="muted">O cálculo oficial espera esta decisão.</p><div class="linha"><button class="btn pri" data-matdec="1">Aceitar o de campo</button><button class="btn" data-matdec="0">Voltar ao do escritório</button></div>';
  return h + '</div>';
}
function ligarMaterialCampo(ins){
  document.querySelectorAll('[data-matdec]').forEach(b => b.addEventListener('click', async () => {
    const aceitar = b.dataset.matdec === '1';
    try{ await rpc('tf_insp_material_campo_decidir', { p_id: ins.id, p_aceitar: aceitar });
      U.toast(aceitar ? 'Aceito: fica o material de campo.' : 'Voltou o material do escritório.', 'ok'); PREP = null; pintar(); }
    catch(e){ erro(e); }
  }));
}
function quadroFaixa(m){
  if (!m) return '';
  return '<div class="faixa">Resistência <b>' + esc(faixaTxt(m)) + '</b>' + (m.escoamento_min_mpa != null ? '<br>Escoamento mín. ' + fmt(m.escoamento_min_mpa, 0) + ' MPa' : '')
    + '<br>S do ASME: <b>' + fmt(m.s_mpa, 1) + ' MPa</b>' + (m.t_max_c != null ? ' até ' + fmt(m.t_max_c, 0) + ' °C' : '') + ' <span class="muted">(teto do cálculo)</span></div>';
}
// H10: a moldura (cabeçalho e barra da janela) na cor do card do TapDoc, e o menu de troca
if (window.TapModulos){ TapModulos.aplicar('tapdoc'); TapModulos.trocador(document.getElementById('trocar'), 'tapdoc'); }
else document.getElementById('trocar').addEventListener('click', () => { location.href = '../'; });
const CFG = window.TF_CONFIG || {};
const SUPA_URL = CFG.SUPABASE_URL || '', SUPA_ANON = CFG.SUPABASE_ANON_KEY || '';
const DEMO = !SUPA_URL || !SUPA_ANON;
const N = window.Nucleo, M = window.MotorNR13;
const $ = id => document.getElementById(id);
$('ver').textContent = VERSAO;
if (!N){ $('tela').innerHTML = '<div class="card vazio">Sem o núcleo do TapHub. Recarregue com sinal.</div>'; throw new Error('sem núcleo'); }
const U = N.util, esc = U.esc;
const rpc = (f, p) => N.api.rpc(f, p || {});
// E7 (P3): quem tem o poder PLH ("Pessoas e acessos"). O banco é quem trava; aqui só esconde os botões.
let PLH = false;

// ── utilitários ────────────────────────────────────────────────────────────
function uid(){ try{ if (crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }); }
function num(s){ if (s == null) return null; let t = String(s).trim().replace(/\s/g, ''); if (!t) return null;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.'); const v = Number(t); return isFinite(v) ? v : NaN; }
function fmt(v, c){ if (v == null || v === '' || !isFinite(Number(v))) return ''; return String(Number(Number(v).toFixed(c == null ? 4 : c))).replace('.', ','); }
// S147 · item 86: o armazenamento das inspeções aceita até 50 MB por arquivo (423; antes, 5 MB). Passou disso, a
// mensagem diz o tamanho, em português, e não fala em "foto" quando o arquivo é o laudo ou um PDF.
const ARQ_MAX_MB = 50;
const mbDe = b => fmt((b && b.size || 0) / 1048576, 1);
async function enviarArq(caminho, blob, oQue){
  oQue = oQue || 'O arquivo';
  if ((blob && blob.size || 0) > ARQ_MAX_MB * 1048576) throw new Error(oQue + ' tem ' + mbDe(blob) + ' MB; o máximo é ' + ARQ_MAX_MB + ' MB.');
  try{ await N.storage.enviar('inspecoes', caminho, blob); }
  catch(e){
    if (e && (e.status === 413 || /maximum allowed size|exceeded|too large/i.test(e.message || '')))
      throw new Error(oQue + ' tem ' + mbDe(blob) + ' MB e o armazenamento recusou pelo tamanho (o limite do servidor ainda não foi aumentado para ' + ARQ_MAX_MB + ' MB: avise o escritório).');
    throw e;
  }
}

/** antes e depois, palavra por palavra: o que sai riscado em vermelho, o que entra sublinhado em verde */
function difPalavras(a, b){
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 400000) return ['<del>' + esc(a) + '</del>', '<ins>' + esc(b) + '</ins>'];
  const L = Array.from({ length:n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, ha = '', hb = '';
  while (i < n && j < m){
    if (A[i] === B[j]){ ha += esc(A[i]); hb += esc(B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]){ ha += /^\s+$/.test(A[i]) ? esc(A[i]) : '<del>' + esc(A[i]) + '</del>'; i++; }
    else { hb += /^\s+$/.test(B[j]) ? esc(B[j]) : '<ins>' + esc(B[j]) + '</ins>'; j++; }
  }
  while (i < n){ ha += /^\s+$/.test(A[i]) ? esc(A[i]) : '<del>' + esc(A[i]) + '</del>'; i++; }
  while (j < m){ hb += /^\s+$/.test(B[j]) ? esc(B[j]) : '<ins>' + esc(B[j]) + '</ins>'; j++; }
  return [ha, hb];
}

    + '<label class="f">PDF do certificado <small>' + (x.certificado_path ? '(já anexado; escolha outro para trocar)' : '(o laudo anexa o do medidor de espessura)') + '</small>'

    .concat([{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {

      if (!d.descricao){ U.toast('Escreva a descrição.', 'err'); return false; }

      if (d.certificado_num && ((cod && d.certificado_num.toUpperCase() === cod) || (d.numero_serie && d.certificado_num === d.numero_serie))){
        U.toast('O nº do certificado está igual ao ' + (cod && d.certificado_num.toUpperCase() === cod ? 'código interno' : 'nº de série') + '. Use o número que o laboratório escreveu no certificado.', 'err'); return false; }

/** PMTA recalculada com os dados do próprio laudo (motor da R00): a menor entre
 *  os componentes completos. null quando falta dado. */
function pmtaRecalc(d){
  if (!M || !d.s_mpa || !(d.componentes || []).length) return null;
  let menor = null;
  d.componentes.forEach(c => {
    if (!c.t_min_mm || !c.eficiencia_junta) return;
    const g = { tipo: c.tipo, R: c.r_mm, L: c.l_mm, d: c.d_mm, C: c.fator_c, alfaGraus: c.alfa_graus };
    try{ const p = M.pmta(g, c.t_min_mm, d.s_mpa, c.eficiencia_junta); if (p > 0 && (menor == null || p < menor)) menor = p; }catch(e){}
  });
  return menor == null ? null : Math.round(menor * 1e4) / 1e4;
}

const LUGAR_SEL = 'h2, h3, tr, .card, label.f, p.alerta';
function chaveEl(el){
  const T = $('tela'), tag = el.matches('tr') ? 'tr' : el.matches('h2') ? 'h2' : el.matches('h3') ? 'h3' : el.matches('.card') ? '.card' : el.matches('label.f') ? 'label.f' : 'p.alerta';
  return { sel:tag, idx:Array.prototype.indexOf.call(T.querySelectorAll(tag), el), txt:(el.textContent || '').trim().slice(0, 60) };
}
function acharEl(k){
  if (!k) return null;
  const L = Array.from($('tela').querySelectorAll(k.sel)), mesmos = L.map((x, i) => [x, i]).filter(([x]) => (x.textContent || '').trim().slice(0, 60) === k.txt);
  if (mesmos.length) return mesmos.sort((a, b) => Math.abs(a[1] - k.idx) - Math.abs(b[1] - k.idx))[0][0];
  return L[Math.min(k.idx, L.length - 1)] || null;
}
function guardarLugar(){
  let melhor = null;
  $('tela').querySelectorAll(LUGAR_SEL).forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.height || r.bottom <= 0) return;
    if (r.top <= 60 && (!melhor || r.top >= melhor.top)) melhor = { el, top:r.top };
  });
  if (!melhor){ const el = Array.from($('tela').querySelectorAll(LUGAR_SEL)).find(x => x.getBoundingClientRect().top > 0); if (el) melhor = { el, top:el.getBoundingClientRect().top }; }
  return melhor ? { k:chaveEl(melhor.el), dy:melhor.top } : null;
}
// quem rola é o <main> (o corpo da página não rola): por isso o window.scrollY de antes não voltava
const rolador = () => document.querySelector('main') || document.scrollingElement;
function voltarAoLugar(g){
  if (!g) return;
  const el = acharEl(g.k); if (!el) return;
  rolador().scrollTop += el.getBoundingClientRect().top - g.dy;
}
let REV_ULTIMO = null;   // a linha (ou o quadro) do último clique na revisão
async function manterLugar(fazer){
  const g = guardarLugar(), alvo = REV_ULTIMO;

  let mexeu = false; const parar = () => { mexeu = true; };
  ['wheel','touchmove','keydown','mousedown'].forEach(ev => window.addEventListener(ev, parar, { once:true, passive:true }));
  $('tela').querySelectorAll('img').forEach(im => { if (!im.complete) im.addEventListener('load', () => { if (!mexeu) voltarAoLugar(g); }, { once:true }); });
  setTimeout(() => { if (!mexeu) voltarAoLugar(g); }, 400);
  setTimeout(() => ['wheel','touchmove','keydown','mousedown'].forEach(ev => window.removeEventListener(ev, parar)), 1600);
  const r = acharEl(alvo); if (r){ r.classList.remove('realce'); void r.offsetWidth; r.classList.add('realce'); setTimeout(() => r.classList.remove('realce'), 1300); }
}

// abaixo de 0 °C o interno é a critério dele, então as datas são obrigatórias.
function revDatasHtml(prz){
  const base = dataSP(REV.R.inspecao.termino || REV.R.inspecao.inicio); if (!base) return '';
  const nExt = somaAnos(base, prz.externo), nInt = prz.interno == null ? null : somaAnos(base, prz.interno), obrig = prz.interno == null;
  const PR = REV.R.inspecao.prazo_red;   // S144 · item 70: o prazo reduzido vira as datas (o PLH vê e pode mudar)
  const D = REV.datas = REV.datas || (PR ? { ativo:true, ext:PR.externo != null && PR.externo < prz.externo ? somaAnos(base, PR.externo) : nExt,
      int:PR.interno != null && (prz.interno == null || PR.interno < prz.interno) ? somaAnos(base, PR.interno) : nInt, just:PR.just || '', red:true }
    : { ativo: obrig, ext: nExt, int: nInt, just: '' });
  if (obrig) D.ativo = true;
  return '<div style="margin-top:10px;border-top:1px solid var(--rule-2);padding-top:8px"><b>Próximas inspeções</b>'
    + '<div class="muted">Pela NR-13: externa até <b>' + dataBR(nExt) + '</b>, interna ' + (nInt ? 'até <b>' + dataBR(nInt) + '</b>' : '<b>a critério do PLH</b> (abaixo de 0 °C)') + '.</div>'
    + '<label class="okrev" style="margin-top:6px"><input type="checkbox" id="revDatas"' + (D.ativo ? ' checked' : '') + (obrig ? ' disabled' : '') + '> o PLH reduz os prazos (datas mais curtas, com o motivo)</label>'
    + '<div id="revDatasCx"' + (D.ativo ? '' : ' hidden') + '><div class="g3"><label class="f">Próxima externa<input class="t" type="date" id="revExt" value="' + esc(D.ext || '') + '" max="' + nExt + '"></label>'
    + '<label class="f">Próxima interna<input class="t" type="date" id="revInt" value="' + esc(D.int || '') + '"' + (nInt ? ' max="' + nInt + '"' : '') + '></label>'
    + '<label class="f">Motivo<input class="t" id="revJust" value="' + esc(D.just || '') + '" placeholder="ex.: vaso horizontal em atmosfera agressiva"></label></div></div></div>';
}
// ── S144 · item 78: recomendações sugeridas pelas condições do vaso (o revisor escolhe; nada é marcado sozinho) ──
function revSugestoes(){
  const { R, v } = REV, out = [];
  const fluidos = CALC.ativas(v).map(k => String(k.fluido || '').toLowerCase()).join(' ');
  const amb = R.inspecao.ambiente || (v.inspecao && v.inspecao.ambiente) || v.ambiente;
  const vis = R.visual || [];
  out.push({ tipo:'conservacao', texto:'Que se faça a limpeza periódica do vaso e dos acessórios.' });
  if (/ar comprimido/.test(fluidos)) out.push({ tipo:'conservacao', texto:'Que se faça a drenagem (purga) periódica do condensado ou se instale purga automática, para evitar acúmulo de umidade no interior do vaso.' });
  if (amb === 'aberto') out.push({ tipo:'conservacao', texto:'Que seja providenciada uma cobertura, para evitar que o vaso fique exposto às intempéries.' });
  if (vis.some(x => x.conforme === false && /corros|pintur|ferrugem|oxida/i.test((x.anomalia || '') + ' ' + x.item))) out.push({ tipo:'conservacao', texto:'Que se providencie a pintura do vaso, para desacelerar a corrosão.' });
  if (vis.some(x => /aterr/i.test(x.item) && x.conforme === false)) out.push({ tipo:'seguranca', texto:'Instalar ou reparar o aterramento do vaso e medir a continuidade.' });
  // S148 · item 91: placa ilegível ou não indelével → substituir; sem placa → providenciar (NR-13, 13.5.1.3; o PLH confere a citação)
  const pl = placaDe(R.vaso || {});
  if (pl === 'ilegivel') out.push({ tipo:'seguranca', texto:PLACA_REC.ilegivel });
  if (pl === 'sem') out.push({ tipo:'seguranca', texto:PLACA_REC.sem });
  return out;
}
// S148 · item 91: a placa de identificação com três respostas (decisão B do Bruno, 11/11)
const PLACA_ROT = { indelevel:'com placa indelével', ilegivel:'placa ilegível ou não indelével', sem:'sem placa' };
const PLACA_REC = { ilegivel:'Que a placa de identificação do vaso seja substituída por placa de identificação indelével, conforme o item 13.5.1.3 da NR-13.',
                    sem:'Que seja providenciada a placa de identificação indelével do vaso, conforme o item 13.5.1.3 da NR-13.' };
const placaDe = V => V.placa_situacao || (V.sem_placa ? 'sem' : 'indelevel');
function revPlacaAlerta(recs){
  const pl = placaDe(REV.R.vaso || {});
  if (pl === 'indelevel' || recs.some(r => /placa/i.test(r.texto || ''))) return '';
  return '<p class="alerta crit" style="margin:8px 0 0">Vaso ' + esc(PLACA_ROT[pl]) + ': o laudo cita a recomendação da placa na seção 11. Use a sugestão abaixo (Recomendar).</p>';
}
function revSugestoesHtml(recs, pode){
  const norm = x => String(x || '').toLowerCase().replace(/[^a-zà-ú]/g, '').slice(0, 40);
  const L = revSugestoes().filter(x => !recs.some(r => norm(r.texto) === norm(x.texto)));
  if (!L.length) return '';
  return '<h3 style="margin-top:14px">Sugestões pelas condições do vaso</h3><p class="muted" style="margin:0 0 4px">O sistema não marca nenhuma: escolha as que valem para este vaso.</p><table>'

  const iS = cab.indexOf('spot_no'), iN = cab.indexOf('reading_no'), iR = cab.indexOf('reading');

  const spots = [], por = {};
  linhas.slice(1).forEach((ln, n) => {
    const c = ln.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
    const sp = c[iS], val = num(c[iR]);
    if (!sp) return;
    if (val == null || Number.isNaN(val) || val <= 0 || val > 300) throw new Error('Linha ' + (n + 2) + ': leitura inválida (' + (c[iR] || 'vazia') + ').');
    if (!por[sp]){ por[sp] = []; spots.push(sp); }
    por[sp].push({ n: iN >= 0 ? Number(c[iN]) || por[sp].length + 1 : por[sp].length + 1, val });
  });

// S148 · item 80: o login vale 1 hora; o armazenamento recusa o vencido com 400 (e não 401), então o núcleo
// não renovava sozinho. Antes de ler, renova se falta menos de 1 minuto; se o armazenamento recusar, renova e tenta
// mais uma vez. A renovação passa por uma chamada ao banco (o núcleo renova no 401 e tenta de novo).
function vencimentoDoLogin(){
  try{ const p = String(N.sessao().token || '').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return (JSON.parse(atob(p)).exp || 0) * 1000; }catch(e){ return 0; }
}
async function renovarLogin(forcar){
  if (!forcar && vencimentoDoLogin() - Date.now() > 60000) return;
  try{ await rpc('tf_tem_poder', { p_poder:'plh' }); }catch(e){}
}
async function lerArmazem(path){
  const url = SUPA_URL + '/storage/v1/object/authenticated/inspecoes/' + String(path).split('/').map(encodeURIComponent).join('/');
  const pedir = () => fetch(url, { headers:{ apikey:SUPA_ANON, Authorization:'Bearer ' + N.sessao().token } });
  await renovarLogin(false);
  let r = await pedir();
  if (!r.ok && [400, 401, 403].indexOf(r.status) >= 0){ await renovarLogin(true); r = await pedir(); }
  return r;
}
async function baixar(path){
  const r = await lerArmazem(path);
  if (!r.ok) throw new Error('Não abriu o arquivo ' + path.split('/').pop() + ' (HTTP ' + r.status + ').');
  return new Uint8Array(await r.arrayBuffer());
}
const ehPdf = b => b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46;
function dataURLDe(b){   // o tipo pelo conteúdo (o Storage pode devolver octet-stream)
  const tipo = b[0] === 0x89 && b[1] === 0x50 ? 'image/png' : 'image/jpeg';
  let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return 'data:' + tipo + ';base64,' + btoa(s);
}

/** Monta o PDF inteiro (laudo + anexos). opc vai para o LaudoPDF.montar. */
async function gerarLaudo(d, opc, aviso){
  aviso = aviso || (() => {});
  await libsLaudo();
  aviso('Baixando as fotos…');
  const imagens = {}, semFoto = [];
  for (const p of LaudoPDF.fotosDoLaudo(d)){ try{ imagens[p] = dataURLDe(await baixar(p)); }catch(e){ semFoto.push(p); } }
  aviso('Montando o PDF…');
  const def = LaudoPDF.montar(d, Object.assign({ imagens }, opc));
  const base = await new Promise((ok, falha) => { try{ pdfMake.createPdf(def).getBuffer(b => ok(b)); }catch(e){ falha(e); } });
  aviso('Juntando os anexos…');
  const out = await PDFLib.PDFDocument.load(base);
  // S148 · item 90: medidor, cada manômetro padrão usado, ART (a mesma ordem da lista do item 15 do laudo)
  const anexos = [['o certificado do medidor', d.medidor && d.medidor.certificado_path]]
    .concat((d.padroes || []).map(p => ['o certificado do manômetro padrão' + (p.descricao ? ' ' + p.descricao : ''), p.certificado_path]))
    .concat([['a ART', d.art && d.art.path]]);
  const semAnexo = [];
  for (const [nome, path] of anexos){
    if (!path){ semAnexo.push(nome); continue; }
    let b; try{ b = await baixar(path); }catch(e){ if (opc.exigirAnexos) throw new Error('Não abriu ' + nome + ': ' + e.message); semAnexo.push(nome); continue; }
    if (ehPdf(b)){ const src = await PDFLib.PDFDocument.load(b, { ignoreEncryption:true }); (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg)); }
    else {
      const im = b[0] === 0x89 ? await out.embedPng(b) : await out.embedJpg(b), pg = out.addPage([595.28, 841.89]);
      const k = Math.min(515 / im.width, 760 / im.height, 1);
      pg.drawImage(im, { x:(595.28 - im.width * k) / 2, y:(841.89 - im.height * k) / 2, width:im.width * k, height:im.height * k });
    }
  }
  if (opc.exigirAnexos && semAnexo.length) throw new Error('Falta ' + semAnexo.join(' e ') + ' para emitir.');
  // S145 · A2: o carimbo também nas páginas dos anexos (o desenho e, logo abaixo, o texto da aprovação)
  if (opc.numero && opc.carimbo && opc.carimbo.imagem){
    const m = /^data:image\/(png|jpe?g);base64,(.*)$/i.exec(opc.carimbo.imagem);
    if (m){
      const bin = Uint8Array.from(atob(m[2]), ch => ch.charCodeAt(0));
      const im = /png/i.test(m[1]) ? await out.embedPng(bin) : await out.embedJpg(bin);
      const fonte = await out.embedFont(PDFLib.StandardFonts.Helvetica), cinza = PDFLib.rgb(0.35, 0.39, 0.42), tam = 5.5;
      const texto = String(opc.carimbo.texto || '').replace(/[^\x20-\xff·]/g, ' ');
      const nBase = (await PDFLib.PDFDocument.load(base)).getPageCount();
      out.getPages().slice(nBase).forEach(pg => {
        const { width: W } = pg.getSize(), k = Math.min(110 / im.width, 24 / im.height, 1), w = im.width * k, h = im.height * k;
        const tw = fonte.widthOfTextAtSize(texto, tam);
        pg.drawRectangle({ x: W - 45 - Math.max(w, tw) - 4, y: 8, width: Math.max(w, tw) + 8, height: h + 14, color: PDFLib.rgb(1, 1, 1), opacity: 0.85 });
        pg.drawImage(im, { x: W - 45 - w, y: 18, width: w, height: h });
        pg.drawText(texto, { x: W - 45 - tw, y: 11, size: tam, font: fonte, color: cinza });
      });
    }
  }
  out.setTitle(def.info.title); out.setAuthor(def.info.author); out.setCreator(def.info.creator); out.setProducer(def.info.producer); out.setSubject(def.info.subject);
  const bytes = await out.save();
  return { bytes, paginas: out.getPageCount(), sha: hexDe(await crypto.subtle.digest('SHA-256', bytes)), semFoto, semAnexo };
}

function zipar(arqs){
  const T = zipar.T || (zipar.T = Array.from({ length:256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; }));
  const crc = b => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  const enc = new TextEncoder(), partes = [], centrais = []; let pos = 0;
  const u16 = (v, n) => v.setUint16(n, 0, true);
  for (const a of arqs){
    const nome = enc.encode(a.nome), k = crc(a.bytes), L = new DataView(new ArrayBuffer(30));
    L.setUint32(0, 0x04034b50, true); L.setUint16(4, 20, true); L.setUint16(6, 0x0800, true); u16(L, 8); u16(L, 10); L.setUint16(12, 0x21, true);
    L.setUint32(14, k, true); L.setUint32(18, a.bytes.length, true); L.setUint32(22, a.bytes.length, true); L.setUint16(26, nome.length, true); u16(L, 28);
    const C = new DataView(new ArrayBuffer(46));
    C.setUint32(0, 0x02014b50, true); C.setUint16(4, 20, true); C.setUint16(6, 20, true); C.setUint16(8, 0x0800, true); u16(C, 10); u16(C, 12); C.setUint16(14, 0x21, true);
    C.setUint32(16, k, true); C.setUint32(20, a.bytes.length, true); C.setUint32(24, a.bytes.length, true); C.setUint16(28, nome.length, true); C.setUint32(42, pos, true);
    partes.push(new Uint8Array(L.buffer), nome, a.bytes); centrais.push(new Uint8Array(C.buffer), nome);
    pos += 30 + nome.length + a.bytes.length;
  }
  const tamC = centrais.reduce((s, x) => s + x.length, 0), F = new DataView(new ArrayBuffer(22));
  F.setUint32(0, 0x06054b50, true); F.setUint16(8, arqs.length, true); F.setUint16(10, arqs.length, true); F.setUint32(12, tamC, true); F.setUint32(16, pos, true);
  return new Blob(partes.concat(centrais, [new Uint8Array(F.buffer)]), { type:'application/zip' });
}

function reduzirDesenho(f){
  return new Promise((ok, falha) => {
    const im = new Image(), url = URL.createObjectURL(f);
    im.onload = () => {
      const k = Math.min(1, 900 / im.width, 320 / im.height), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let d = cv.toDataURL('image/png');
      if (d.length > 1400000){ const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const x = c2.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0); d = c2.toDataURL('image/jpeg', 0.85); }
      ok(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); falha(new Error('Não consegui abrir a imagem.')); };
    im.src = url;
  });
}

function ligarPacote(P){
  const bb = $('pacBaixar'); if (!bb) return;
  const aviso = t => { $('pacAviso').textContent = t || ''; };
  const nomeArq = x => ('Laudo ' + x.numero + (x.revisao ? ' Rev' + x.revisao : '') + ' ' + (x.tag || '')).replace(/[\\/:*?"<>|]+/g, '-').trim() + '.pdf';
  bb.addEventListener('click', () => U.semDuploEnvio(bb, async () => {
    try{
      const arqs = [];
      for (const x of P){ aviso('Baixando ' + (arqs.length + 1) + ' de ' + P.length + '…'); arqs.push({ nome: nomeArq(x), bytes: await baixar(x.pdf_path) }); }
      const a = document.createElement('a'); a.href = URL.createObjectURL(zipar(arqs)); a.download = 'Laudos para assinar ' + new Date().toLocaleDateString('pt-BR').replace(/\//g, '-') + '.zip';
      document.body.appendChild(a); a.click(); a.remove(); aviso('');
    }catch(e){ aviso(''); erro(e); }
  }));
  const ar = $('pacArqs');
  $('pacDevolver').addEventListener('click', () => { ar.value = ''; ar.click(); });
  ar.addEventListener('change', async () => {
    const fs = Array.from(ar.files || []); if (!fs.length) return;
    const res = []; let ok = 0;
    try{ await libsLaudo(); }catch(e){ erro(e); return; }
    for (const f of fs){
      aviso('Conferindo ' + f.name + '…');
      try{
        const b = new Uint8Array(await f.arrayBuffer());
        const shas = (await AssinaturaPDF.prefixos(b)).map(p => p.sha);
        const l = P.find(x => shas.indexOf(x.pdf_sha256) >= 0);
        if (!l) throw new Error('não é nenhum dos laudos do pacote (ou foi mudado antes de assinar).');
        await devolverAssinado(l, b);
        ok++; res.push('<li>✅ ' + esc(f.name) + ': ' + esc(l.numero + (l.revisao ? ' Rev. ' + l.revisao : '')) + ' assinado e conferido.</li>');
      }catch(e){ res.push('<li style="color:var(--crit)">✗ ' + esc(f.name) + ': ' + esc(e.message || String(e)) + '</li>'); }
    }
    aviso('');
    $('pacRes').innerHTML = '<ul style="margin:8px 0 0">' + res.join('') + '</ul>';
    if (ok){ U.toast(ok + ' laudo(s) assinado(s).', 'ok'); setTimeout(() => { const r = $('pacRes').innerHTML; pintar().then(() => { const x = $('pacRes'); if (x) x.innerHTML = r; else U.toast(ok + ' laudo(s) assinado(s); nada mais para assinar.', 'ok'); }); }, 600); }
  });
}

      catch(e){ if (!/digital/i.test(e.message || '')) throw e; r = await emitirComDigital(); }
      if (r) await gravarPdf(r.id); else aviso(''); }
    catch(e){ aviso(''); erro(e); }
  }));
  // o PDF assinado com o token
  const bs = $('ldAssinado'); if (bs) bs.addEventListener('click', () => { $('ldArqAss').value = ''; $('ldArqAss').click(); });
  const fa = $('ldArqAss'); if (fa) fa.addEventListener('change', async () => {
    const f = fa.files && fa.files[0]; if (!f) return;
    const atual = laudoAtual(d);
    try{
      aviso('Conferindo o PDF…');
      await devolverAssinado(atual, new Uint8Array(await f.arrayBuffer()), aviso);
      aviso(''); U.toast('Laudo assinado e conferido. A inspeção está concluída.', 'ok'); recarregar();
    }catch(e){ aviso(''); erro(e); }
  });
  const bp = $('ldPlh'); if (bp) bp.addEventListener('click', () => {
    const p = d.plh || { nome: (d.eu || {}).nome || '' };
    janela('Como você assina o laudo', '<label class="f">Nome no laudo<input class="t" id="plNome" value="' + esc(p.nome || '') + '"></label>'
      + '<label class="f">Título <small>(opcional)</small><input class="t" id="plTit" value="' + esc(p.titulo || '') + '" placeholder="ex.: Engenheiro Industrial Mecânico"></label>'
      + '<label class="f">Registro no conselho<input class="t" id="plReg" value="' + esc(p.registro || '') + '" placeholder="ex.: CREA-MG 000000/D"></label>'
      + '<p class="muted">Sai na seção 14 e no rodapé do laudo (NR-13, 13.5.4.11 "m").</p>',
      [{ rotulo:'Cancelar' }, { rotulo:'Gravar', classe:'pri', acao:async () => {
        try{ await rpc('tf_laudo_plh_assinatura', { p_nome: $('plNome').value, p_titulo: $('plTit').value, p_registro: $('plReg').value }); U.toast('Gravado.', 'ok'); recarregar(); }
        catch(e){ erro(e); return false; } } }]);
  });
  const bre = $('ldReabrir'); if (bre) bre.addEventListener('click', () => {
    janela('Reabrir a inspeção', '<label class="f">Para onde<select class="t" id="rbPara"><option value="em_revisao">Aprovação do PLH (o cálculo, a PMTA e as datas)</option>'
      + '<option value="em_campo">O campo (a equipe corrige a coleta; a revisão recomeça)</option></select></label>'
      + '<label class="f">Motivo <small>(vai na revisão do laudo)</small><textarea class="t" id="rbMot" rows="3"></textarea></label>'
      + (laudoAtual(d) ? '<p class="muted">Esta inspeção já tem laudo: a próxima emissão sai como revisão, com o mesmo número.</p>' : ''),
      [{ rotulo:'Cancelar' }, { rotulo:'Reabrir', classe:'pri', acao:async () => {
        try{ await rpc('tf_insp_reabrir', { p_id: LD.id, p_para: $('rbPara').value, p_motivo: $('rbMot').value }); U.toast('Reaberta.', 'ok');
          location.hash = $('rbPara').value === 'em_revisao' ? 'rev=' + LD.id : 'aba=laudos'; }
        catch(e){ erro(e); return false; } } }]);
  });
  T.querySelectorAll('[data-ldpdf]').forEach(b => b.addEventListener('click', () => U.semDuploEnvio(b, async () => {
    try{ mostrarPdf(await baixar(b.dataset.ldpdf), b.dataset.ldnome); $('ldVisor').scrollIntoView({ behavior:'smooth' }); }catch(e){ erro(e); }
  })));
}

// a foto (ou o PDF) num quadro: o mesmo jeito do laudo anterior
async function mostrarArquivoEm(vis, a){
  if (!vis || !a) return;
  vis.innerHTML = '<p class="muted">Abrindo…</p>';
  if (DEMO){ vis.innerHTML = '<p class="muted">Demonstração: sem o arquivo.</p>'; return; }
  try{
    if (!blobs[a.storage_path]){
      const r = await lerArmazem(a.storage_path);   // S148 · item 80
      if (!r.ok) throw new Error('A foto não abriu (HTTP ' + r.status + ').');
      blobs[a.storage_path] = URL.createObjectURL(await r.blob());
    }
    vis.innerHTML = /\.pdf$/i.test(a.storage_path) ? '<iframe title="Arquivo"></iframe>' : '<img alt="">';
    vis.firstChild.src = blobs[a.storage_path];
  }catch(e){ vis.innerHTML = '<p class="alerta crit"></p>'; vis.firstChild.textContent = e.message; }
}

(function boot(){
  $('barDemo').hidden = !DEMO;
  if (DEMO){ N.porteiro({ app:'doc', demo:true }); $('tela').innerHTML = '<div class="card vazio">Demonstração: o TapDoc do escritório só funciona no app publicado.</div>'; return; }
  const s = N.sessao();
  if (!s.token){ try{ sessionStorage.setItem('tf_recado', 'Entre para abrir o TapDoc.'); }catch(e){} location.href = '../'; return; }
  const g = N.porteiro({ app:'doc', demo:false, url:SUPA_URL, anon:SUPA_ANON });
  if (g === 'hub'){ location.href = '../'; return; }
  // o Esc fecha a janela do núcleo (a página não traz o próprio #modal)
  // E7: o poder PLH antes da primeira pintura (sem sinal ou erro: sem os botões do PLH)
  rpc('tf_tem_poder', { p_poder:'plh' }).then(v => { PLH = !!v; }, () => { PLH = false; }).then(pintar);
})();
