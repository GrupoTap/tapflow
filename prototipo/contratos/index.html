function novaVisita(c){
  const aberta = osDoContrato(c).find(o => !o.execEncerrada);
  const L = c.vasos.filter(v => !v.removido).sort((a, b) => (a.proxima || '9') < (b.proxima || '9') ? -1 : 1);
  let h = (aberta ? '<div class="alerta aviso">A <b>' + esc(aberta.numero) + '</b> ainda está aberta: os dias de campo podem entrar nela até alguém encerrar a execução. Criar uma mobilização nova é para o mês seguinte.</div>' : '')
    + '<p style="margin-top:0">Nasce a <b class="mono">OS-' + esc(c.numero) + '-M' + dd2(c.prox.medicao) + '</b>. Marque os vasos (os que vencem primeiro estão no alto). Os serviços vêm sugeridos e podem ser ajustados.</p>'
    + '<table><tr><th></th><th>Vaso</th><th class="n">Volume</th><th>Próxima</th><th>Serviços</th></tr>';
  L.forEach(v => {
    const sug = new Date(v.proxima || '2099-01-01') - new Date(HOJE) < 60 * 864e5;
    h += '<tr><td><input type="checkbox" data-vv="' + v.id + '"' + (sug ? ' checked' : '') + '></td><td><b>' + esc(v.tag) + '</b> <span class="muted">' + esc(v.nome) + '</span></td><td class="n">' + (v.volume == null ? '<span style="color:var(--crit)">sem volume</span>' : nf(v.volume, 3) + ' m³') + '</td><td>' + dBR(v.proxima) + '</td><td class="peq">'
      + ['inspecao_vaso','teste_hidrostatico','calib_valvula'].map(s => '<label style="margin-right:8px;white-space:nowrap"><input type="checkbox" data-vs="' + v.id + '|' + s + '"' + (v.servicos.indexOf(s) >= 0 ? ' checked' : '') + '> ' + SERV[s].replace(' (externa e/ou interna)', '').replace(' de segurança', '') + '</label>').join('') + '</td></tr>';
  });
  h += '</table><h3 style="font-size:14px;margin:16px 0 8px">O primeiro dia de campo</h3>' + formDia(null);
  janela('Nova visita · ' + c.cliente, h, [{ rotulo:'Cancelar' }, { rotulo:'Criar e agendar', classe:'pri', acao:() => {
    const vs = [...document.querySelectorAll('[data-vv]:checked')].map(x => x.dataset.vv);
    if (!vs.length){ toast('Marque ao menos um vaso.', 'err'); return false; }
    const d = lerDia(); if (!d) return false;
    const serv = {}; document.querySelectorAll('[data-vs]:checked').forEach(x => { const [v, s] = x.dataset.vs.split('|'); (serv[v] = serv[v] || []).push(s); });
    const o = { id:'o' + uid(), contrato:c.id, mob:c.prox.medicao, numero:'OS-' + c.numero + '-M' + dd2(c.prox.medicao), vasos:vs, servicos:serv, quant:{ manometros:vs.length }, execEncerrada:false, dias:[d], medicao:null, tarefas:{}, criadaPor:quem() };
    c.prox.medicao++; S.oss.push(o); hist(c, 'Nova visita: ' + o.numero + ' com ' + vs.length + ' vaso(s); primeiro dia em ' + dBR(d.data) + '.'); salvar();
    toast(o.numero + ' criada. A "Agendar serviço" concluiu com o primeiro dia.', 'ok'); ir({ os:o.id });
  } }], true);
}
function formDia(d){
  d = d || { data:'', hora:'08:00', tempo:8, dono:'p1', apoios:[] };
  return '<div class="g3"><label class="f">Dia<input class="t" type="date" id="dData" value="' + esc(d.data) + '"></label><label class="f">Hora<input class="t" type="time" id="dHora" value="' + esc(d.hora) + '"></label><label class="f">Tempo (horas)<input class="t" id="dTempo" inputmode="decimal" value="' + nf(d.tempo) + '"></label></div>'

// 4 · A OS DA MOBILIZAÇÃO (dias de campo, RDOs, medição, tarefas)
// ════════════════════════════════════════════════════════════════════════════
function tarefasDe(o){
  const c = C(o.contrato), m = o.medicao, dv = o.dias.filter(d => d.situacao !== 'desmarcado');
  const k01 = o.execEncerrada && dv.every(d => d.rdo);
  const k02 = !!(m && m.situacao === 'fechada'), k03 = k02 && (m.pedido || m.semPedido);
  const st = (ok, dep) => ok ? 'completo' : dep ? 'pendente' : 'bloqueado';
  return [
    ['T03', 'Agendar serviço', 'completo', 'concluiu ao marcar o primeiro dia'],
    ['T05', 'Preparar a inspeção', 'dispensado', 'todos os vasos já estavam preparados no TapDoc'],
    ['T06', 'Executar a inspeção', o.execEncerrada ? 'completo' : 'pendente', o.execEncerrada ? 'execução encerrada' : 'pelos dias de campo'],
    ['T07…T14', 'CSV, TapDoc, revisões, assinatura, TapWeb, impressão', o.execEncerrada ? 'pendente' : 'bloqueado', 'como na inspeção de hoje'],
    ['K01', 'Criar RDOs', st(k01, o.execEncerrada), k01 ? 'todos os dias com RDO' : 'conclui sozinha com o RDO de todo dia'],
    ['K02', 'Criar Consolidado/Medição', st(k02, k01), k02 ? 'medição nº ' + dd2(m.numero) + ' fechada' : 'conclui pelo "Fechar a medição"'],
    ['K03', 'Boletim aprovado e pedido do cliente', st(k03, k02), k03 ? (m.pedido ? 'pedido ' + m.pedido : 'sem pedido') : 'número do pedido do cliente'],
    ['T16', 'Emitir boleto / nota fiscal', st(!!o.faturada, k03), o.faturada ? 'concluída pelo TapFin · ' + o.faturada.nf : 'depende só da K03 (não espera o TapWeb)'],
    ['T17', 'Entregar/despachar documentação', st(!!o.entregue, !!o.faturada), o.entregue ? 'OS fechada' : 'fecha a OS']
  ];
}
function telaOS(o){
  const c = C(o.contrato), aba = ROTA.aba || 'dias';
  trilha(['Contratos', '<a href="#c=' + c.id + '&aba=mob">' + esc(c.numero) + '</a>', esc(o.numero)]);
  const tk = tarefasDe(o);
  let h = '<div class="linha"><div><h1>Contrato ' + esc(c.cliente) + ' ' + esc(c.numero) + ' – Mobilização ' + dd2(o.mob) + ' (' + mesesTxt(o) + ')</h1>'
    + '<p class="sub"><span class="mono">' + esc(o.numero) + '</span> · ' + o.vasos.length + ' vaso(s): ' + o.vasos.map(id => esc((c.vasos.find(v => v.id === id) || {}).tag)).join(', ')
    + ' · <a href="#c=' + c.id + '">ver o contrato</a></p></div></div>'

function faixaItem(c, servico, vol){
  const L = c.itens.filter(it => it.servico === servico);
  if (!L.length) return { erro:'sem item no contrato' };
  if (L.every(it => it.min == null && it.max == null)) return { it:L[0] };
  if (vol == null) return { erro:'volume' };
  const it = L.find(it => (it.min == null || vol > it.min + 1e-9 || (it.min === 0 && vol > 0)) && (it.max == null || vol <= it.max + 1e-9));
  return it ? { it } : { erro:'sem preço no contrato (acima de ' + nf(Math.max(...L.map(x => x.max || 0))) + ' m³)' };
}

    h += '<tr class="' + (!l.marcado ? 'desl' : prob ? 'crit' : '') + '"><td>' + (pode ? '<input type="checkbox" data-mk="' + l.id + '"' + (l.marcado ? ' checked' : '') + '>' : l.marcado ? '✓' : '') + '</td>'
      + '<td class="mono">' + esc(l.cod || '—') + '</td><td>' + esc(l.desc) + (prob ? '<div style="color:var(--crit);font-weight:600" class="peq">' + esc(prob) + (l.problema === 'volume' && pode ? ' <button class="btn mini" data-mvol="' + l.vaso + '">Informar aqui</button>' : '') + (l.problema && l.problema !== 'volume' && pode ? ' <button class="btn mini" data-mitem="' + l.id + '">Escolher o item</button>' : '') + '</div>' : '') + '</td>'
      + '<td>' + (pode ? '<input class="t" data-tx="' + l.id + '" value="' + esc(l.texto) + '">' : esc(l.texto)) + '</td><td class="n">' + R$(l.preco) + '</td>'
      + '<td class="n">' + (pode ? '<input class="q" data-qt="' + l.id + '" value="' + nf(l.qtd) + '" inputmode="decimal">' : nf(l.qtd)) + (quebrada ? '<div class="peq" style="color:var(--warn)">quantidade quebrada</div>' : '') + '</td>'
      + '<td class="n"><b>' + (l.marcado ? R$(totLinha(l)) : '—') + '</b></td><td class="peq muted">' + ({ tapdoc:'TapDoc', rdo:'RDOs', vasos_atendidos:'vasos atendidos', mao:'à mão' }[l.origem] || l.origem) + (pode && l.origem === 'mao' && l.manual ? ' <button class="btn mini perigo" data-rmlin="' + l.id + '">tirar</button>' : '') + '</td></tr>';
  });
  h += '<tr><td colspan="6" class="n"><b>Total da medição</b></td><td class="n tot" id="mTot">' + R$(totalMedicao(m)) + '</td><td></td></tr></table></div>'
    + '<p class="muted peq">O total de cada linha é arredondado ao centavo (22,7272 × R$ 44,00 = R$ 1.000,00). Quantidade com até 4 casas. Fechar dá o número da medição do ano, gera o boletim em Excel e em PDF e conclui a K02.</p>';
  return h;
}
function ligarMedicao(o, c){
  const m = o.medicao, recalc = () => { const t = $('mTot'); if (t) t.textContent = R$(totalMedicao(m)); };
  document.querySelectorAll('[data-mk]').forEach(i => i.addEventListener('change', () => { m.linhas.find(l => l.id === i.dataset.mk).marcado = i.checked; salvar(); pintar(); }));
  document.querySelectorAll('[data-tx]').forEach(i => i.addEventListener('change', () => { m.linhas.find(l => l.id === i.dataset.tx).texto = i.value; salvar(); }));
  document.querySelectorAll('[data-qt]').forEach(i => i.addEventListener('change', () => {
    const v = num(i.value), l = m.linhas.find(x => x.id === i.dataset.qt);
    if (v == null || Number.isNaN(v) || v < 0){ toast('Quantidade inválida.', 'err'); i.value = nf(l.qtd); return; }
    l.qtd = Math.round(v * 1e4) / 1e4; salvar(); pintar();
  }));
  document.querySelectorAll('[data-mvol]').forEach(b => b.addEventListener('click', () => volumeVaso(c, b.dataset.mvol, () => { o.medicao = montarMedicao(S, o); salvar(); pintar(); })));
  document.querySelectorAll('[data-mitem]').forEach(b => b.addEventListener('click', () => {
    const l = m.linhas.find(x => x.id === b.dataset.mitem);
    janela('Escolher o item · ' + l.desc, '<label class="f">Item do contrato<select class="t" id="miIt">' + c.itens.map(it => '<option value="' + it.id + '">' + esc(it.cod + ' · ' + it.desc + ' · ' + R$(precoDe(it))) + '</option>').join('') + '</select></label><p class="muted peq">Ou o escritório lança um aditivo com a faixa que falta.</p>',
      [{ rotulo:'Cancelar' }, { rotulo:'Usar', classe:'pri', acao:() => { const it = c.itens.find(x => x.id === $('miIt').value); Object.assign(l, { item:it.id, cod:it.cod, desc:it.desc, un:it.un, preco:precoDe(it, dataMob(o)), problema:null, origem:'mao', texto:l.texto || l.desc }); salvar(); pintar(); } }]);
  }));
  document.querySelectorAll('[data-rmlin]').forEach(b => b.addEventListener('click', () => { m.linhas = m.linhas.filter(l => l.id !== b.dataset.rmlin); salvar(); pintar(); }));
  const lg = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  lg('btRemontar', () => janela('Montar de novo', '<p>Refaz as linhas a partir do TapDoc, dos RDOs e dos vasos. As linhas à mão ficam.</p>', [{ rotulo:'Cancelar' }, { rotulo:'Montar', classe:'pri', acao:() => { const mao = m.linhas.filter(l => l.manual); o.medicao = montarMedicao(S, o); o.medicao.linhas = o.medicao.linhas.concat(mao); salvar(); pintar(); } }]));
  lg('btMao', () => janela('+ Linha à mão', '<label class="f">Item do contrato<select class="t" id="lmIt">' + c.itens.map(it => '<option value="' + it.id + '">' + esc(it.cod + ' · ' + it.desc + ' · ' + R$(precoDe(it))) + '</option>').join('') + '</select></label>'
    + '<div class="g2"><label class="f">Quantidade (até 4 casas)<input class="t" id="lmQ" inputmode="decimal" placeholder="ex.: 22,7272"></label><label class="f">Serviço executado<input class="t" id="lmT" placeholder="ex.: Venda de 2 manômetros 0–16 bar"></label></div>'
    + '<p class="muted peq">Para o que não tem código próprio: placas, venda de material (com a quantidade quebrada para dar o valor), caldeira.</p>',
    [{ rotulo:'Cancelar' }, { rotulo:'Incluir', classe:'pri', acao:() => {
      const q = num($('lmQ').value), it = c.itens.find(x => x.id === $('lmIt').value);
      if (!(q > 0)){ toast('Quantidade inválida.', 'err'); return false; }
      m.linhas.push({ id:uid(), item:it.id, cod:it.cod, desc:it.desc, un:it.un, preco:precoDe(it, dataMob(o)), qtd:Math.round(q * 1e4) / 1e4, marcado:true, texto:$('lmT').value.trim() || it.desc, origem:'mao', manual:true, servico:it.servico }); salvar(); pintar();
    } }]));
  lg('btFechar', () => {
    const f = [], dv = o.dias.filter(d => d.situacao !== 'desmarcado');
    if (!o.execEncerrada) f.push('encerrar a execução (aba Dias de campo)');
    const sr = dv.filter(d => !d.rdo); if (sr.length) f.push('o RDO de ' + sr.map(d => dBR(d.data)).join(', '));
    const pr = m.linhas.filter(l => l.marcado && (l.problema || l.preco == null)); if (pr.length) f.push(pr.length + ' linha(s) sem preço ou sem volume');
    if (!m.linhas.some(l => l.marcado)) f.push('ao menos uma linha marcada');
    if (f.length){ janela('Ainda não dá para fechar', '<p>Falta:</p><ul>' + f.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); return; }
    janela('Fechar a medição', '<p>Fecha como <b>medição nº ' + dd2(o.mob) + '</b> de ' + c.ano + ', no valor de <b>' + R$(totalMedicao(m)) + '</b>. Congela as quantidades e os preços, gera o boletim em Excel e em PDF e conclui a K02.</p>',
      [{ rotulo:'Cancelar' }, { rotulo:'Fechar a medição', classe:'pri', acao:() => {
        Object.assign(m, { situacao:'fechada', numero:o.mob, fechadaEm:HOJE, fechadaPor:quem(), total:totalMedicao(m), linhas:m.linhas.filter(l => l.marcado) });
        hist(c, o.numero + ': medição nº ' + dd2(o.mob) + ' fechada em ' + R$(m.total) + '.'); salvar(); pintar(); setTimeout(() => boletim(o, c), 50);
      } }]);
  });
  lg('btBoletim', () => boletim(o, c));
  lg('btReabrirMed', () => janela('Reabrir a medição', '<label class="f">Motivo<input class="t" id="rmM"></label><p class="muted peq">Só o admin, e só sem título vivo no TapFin. Com nota emitida: cancelar a nota e o boleto, anular o título e só então reabrir.</p>',
    [{ rotulo:'Cancelar' }, { rotulo:'Reabrir', classe:'pri', acao:() => { const x = $('rmM').value.trim(); if (x.length < 5){ toast('Diga o motivo.', 'err'); return false; } m.situacao = 'rascunho'; delete m.pedido; delete m.semPedido; hist(c, o.numero + ': medição reaberta: ' + x); salvar(); pintar(); } }]));
}
function acumulado(c, o, itemId){ return osDoContrato(c).filter(x => x.mob <= o.mob && x.medicao && x.medicao.situacao === 'fechada').reduce((a, x) => a + x.medicao.linhas.filter(l => l.item === itemId).reduce((b, l) => b + Number(l.qtd), 0), 0); }
function boletim(o, c){
  const m = o.medicao, dias = o.dias.filter(d => d.situacao !== 'desmarcado').map(d => d.data).sort();
  const medAno = osDoContrato(c).filter(x => x.mob <= o.mob && x.medicao && x.medicao.situacao === 'fechada').reduce((a, x) => a + x.medicao.total, 0);
  const rdos = o.dias.filter(d => d.rdo).map(d => d.rdo.numero).sort((a, b) => a - b);
  const faixaRdo = rdos.length ? 'RDO ' + String(rdos[0]).padStart(3, '0') + (rdos.length > 1 ? ' a ' + String(rdos[rdos.length - 1]).padStart(3, '0') : '') : '—';
  let h = '<div class="abas naoimp"><button class="on" data-fl="1">Boletim de Medição</button><button data-fl="2">Serviço Executado</button></div>'
    + '<div id="fl1"><div class="bolcab"><div>Objeto: <b>Inspeção NR-13 de vasos de pressão</b></div><div>Contrato: <b>' + esc(c.numCliente) + '</b></div><div>Área: <b>' + esc(c.area) + '</b></div>'
    + '<div>Fiscal: <b>' + esc(c.fiscal) + '</b></div><div>Data: <b>' + dBR(m.fechadaEm) + '</b></div><div><b>Medição nº ' + dd2(m.numero) + '</b></div><div style="grid-column:1/-1">Mobilização: ' + dias.map(dCurta).join(', ') + '</div></div>'
    + '<div class="cx"><table class="bol"><tr><th>Código</th><th>Texto breve</th><th>Un.</th><th class="n">Preço</th><th class="n">Qtd. mês</th><th class="n">Qtd. acum.</th><th class="n">Valor mês</th></tr>'
    + m.linhas.map(l => '<tr><td>' + esc(l.cod) + '</td><td>' + esc(l.desc) + '</td><td>' + esc(l.un) + '</td><td class="n">' + R$(l.preco) + '</td><td class="n">' + nf(l.qtd) + '</td><td class="n">' + nf(acumulado(c, o, l.item)) + '</td><td class="n">' + R$(totLinha(l)) + '</td></tr>').join('')
    + '<tr><td colspan="6" class="n"><b>Total</b></td><td class="n"><b>' + R$(m.total) + '</b></td></tr></table></div>'
    + '<table class="bol" style="margin-top:8px;max-width:520px"><tr><th colspan="2">Controle do contrato</th></tr><tr><td>Valor previsto</td><td class="n">' + R$(c.previsto) + '</td></tr><tr><td>Medido no ano (até esta)</td><td class="n">' + R$(medAno) + '</td></tr>'
    + '<tr><td>Saldo</td><td class="n">' + (c.previsto != null ? R$(c.previsto - medAno) : '—') + '</td></tr><tr><td>% executado</td><td class="n">' + (c.previsto ? nf(medAno / c.previsto * 100, 1) + '%' : '—') + '</td></tr></table>'
    + '<div class="g2" style="margin-top:26px;text-align:center;gap:20px 30px">' + ['Fiscal do cliente', 'Gestor do cliente', 'Engetap (inspetor)', 'Engetap (gestor)'].map(x => '<div style="border-top:1px solid #333;padding-top:4px" class="peq">' + x + '</div>').join('') + '</div></div>'
    + '<div id="fl2" hidden><div class="cx"><table class="bol"><tr><th>Item</th><th>Código</th><th>Texto breve</th><th>Serviço executado</th><th>RDO</th><th>Data</th><th>Equipe</th></tr>'
    + m.linhas.map((l, k) => '<tr><td>' + (k + 1) + '</td><td>' + esc(l.cod) + '</td><td>' + esc(l.desc) + '</td><td>' + esc(l.texto) + '</td><td>' + faixaRdo + '</td><td>' + (dias.length ? dCurta(dias[0]) + (dias.length > 1 ? ' a ' + dCurta(dias[dias.length - 1]) : '') : '') + '</td><td>' + esc([...new Set(o.dias.flatMap(d => [d.dono].concat(d.apoios)).map(p => pessoa(p).nome.split(' ')[0]))].join(', ')) + '</td></tr>').join('')
    + '</table></div><p class="muted peq">Quando o serviço teve vários RDOs, mostra a faixa ("RDO 027 a 030") no lugar do "NA" da planilha de hoje.</p></div>';
  janela('Medição nº ' + dd2(m.numero) + ' · ' + c.cliente, h, [{ rotulo:'Baixar Excel', acao:() => { baixarExcel(o, c); return false; } }, { rotulo:'Imprimir / PDF', acao:() => { window.print(); return false; } }, { rotulo:'Fechar' }], true);
  document.querySelectorAll('[data-fl]').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('[data-fl]').forEach(x => x.classList.toggle('on', x === b)); $('fl1').hidden = b.dataset.fl !== '1'; $('fl2').hidden = b.dataset.fl !== '2'; }));
}
function baixarExcel(o, c){
  const faz = () => {
    const m = o.medicao, X = window.XLSX;
    const f1 = [['BOLETIM DE MEDIÇÃO (protótipo · dados fictícios)'], ['Contrato', c.numCliente, 'Área', c.area], ['Fiscal', c.fiscal, 'Medição nº', dd2(m.numero)], [],
      ['Código', 'Texto breve', 'Un.', 'Preço', 'Qtd. mês', 'Qtd. acumulada', 'Valor mês']].concat(m.linhas.map(l => [l.cod, l.desc, l.un, l.preco, Number(l.qtd), acumulado(c, o, l.item), totLinha(l)])).concat([[], ['', '', '', '', '', 'Total', m.total]]);
    const f2 = [['SERVIÇO EXECUTADO (protótipo · dados fictícios)'], [], ['Item', 'Código', 'Texto breve', 'Serviço executado']].concat(m.linhas.map((l, k) => [k + 1, l.cod, l.desc, l.texto]));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(f1), 'Boletim de Medição'); X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(f2), 'Serviço Executado');
    X.writeFile(wb, 'Medicao_' + dd2(m.numero) + '_' + c.numero + '_PROTOTIPO.xlsx');
  };
  if (window.XLSX) return faz();
  const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = faz; s.onerror = () => toast('Não consegui carregar o gerador de Excel (sem internet?).', 'err'); document.head.appendChild(s);
}

// ── pedido do cliente (K03) e faturamento (T16) ────────────────────────────
function abaFat(o, c){
  const m = o.medicao;
  if (!m || m.situacao !== 'fechada') return '<div class="card muted">Primeiro feche a medição (aba Medição). O pedido do cliente (K03) vem depois do boletim aprovado.</div>';
  let h = '<div class="card"><b>K03 · Boletim aprovado e pedido do cliente</b><p class="muted peq" style="margin:2px 0 10px">O boletim em Excel vai ao fiscal; ele aprova e gera o pedido de compra. ' + (c.usaPedido ? 'Este contrato usa pedido de compra.' : 'Este contrato <b>não usa</b> pedido: a K03 conclui só com a aprovação.') + '</p>';
  if (m.pedido || m.semPedido) h += '<div class="alerta ok">Concluída: ' + (m.pedido ? 'pedido <b class="mono">' + esc(m.pedido) + '</b>' : 'sem pedido (' + esc(m.semPedido) + ')') + (m.aprovadaEm ? ' · aprovado em ' + dBR(m.aprovadaEm) : '') + '.</div>';
  else if (PODE.pedido()) h += '<div class="g3"><label class="f">Número do pedido do cliente<input class="t" id="kPed" placeholder="' + (c.usaPedido ? 'ex.: 4500123456' : 'não usa') + '"' + (c.usaPedido ? '' : ' disabled') + '></label><label class="f">Aprovado em<input class="t" type="date" id="kApr" value="' + HOJE + '"></label>'
    + '<label class="f">' + (c.usaPedido ? 'Ou: sem pedido nesta medição (motivo)' : 'Observação') + '<input class="t" id="kSem"></label></div><button class="btn pri" id="btK03">Concluir a K03</button>';
  else h += '<p class="muted">Quem informa o pedido é o escritório.</p>';
  h += '</div><div class="card"><b>T16 · Emitir boleto / nota fiscal</b><p class="muted peq" style="margin:2px 0 10px">No contrato, a nota depende só da K03 (não espera o TapWeb). O título leva <span class="mono">' + esc(o.numero) + '</span> no campo OS e na descrição.</p>';
  if (o.faturada) h += '<div class="alerta ok">Concluída pelo TapFin · ' + esc(o.faturada.nf) + ' em ' + dBR(o.faturada.em) + '.</div>' + (!o.entregue && PODE.equipe() ? '<button class="btn" id="btT17">T17 · Entregar a documentação (fecha a OS)</button>' : o.entregue ? '<div class="alerta ok">T17 concluída: OS fechada.</div>' : '');
  else if (m.pedido || m.semPedido) h += PODE.faturar() ? '<button class="btn pri" id="btFat">Faturar no TapFin</button>' : '<p class="muted">Quem fatura é o financeiro.</p>';
  else h += '<p class="muted">Espera a K03.</p>';
  return h + '</div>';
}
function ligarFat(o, c){
  const m = o.medicao, lg = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
  lg('btK03', () => {
    const p = ($('kPed') || {}).value ? $('kPed').value.trim() : '', s = $('kSem').value.trim();
    if (c.usaPedido && !p && s.length < 5){ toast('Informe o número do pedido, ou o motivo de não ter pedido.', 'err'); return; }
    if (p) m.pedido = p; else m.semPedido = c.usaPedido ? s : 'o contrato não usa pedido';
    m.aprovadaEm = $('kApr').value; hist(c, o.numero + ': K03 concluída (' + (p ? 'pedido ' + p : 'sem pedido') + ').'); salvar(); pintar();
  });
  lg('btFat', () => janela('Faturar no TapFin', '<p>No sistema de verdade, este botão abre o <b>TapFin</b> com o título já preenchido:</p><ul><li>OS: <b class="mono">' + esc(o.numero) + '</b> (também na descrição)</li><li>Cliente: ' + esc(c.cliente) + '</li><li>Valor: <b>' + R$(m.total) + '</b></li>'
    + '<li>Pedido do cliente: ' + esc(m.pedido || 'sem pedido') + '</li><li>Na nota: o contrato, a mobilização, o pedido e os itens com o código do cliente (acima de 2.000 caracteres, o resumo com o PDF do boletim)</li></ul>'
    + '<p class="muted">Quando a nota sai, a T16 conclui sozinha (como hoje, pela 516). Aqui o protótipo só simula.</p>',
    [{ rotulo:'Cancelar' }, { rotulo:'Simular a nota emitida', classe:'pri', acao:() => { o.faturada = { nf:'NF ' + (100 + o.mob) + ' (simulada)', em:HOJE }; hist(c, o.numero + ': faturada no TapFin (simulado).'); salvar(); pintar(); } }]));
  lg('btT17', () => { o.entregue = true; hist(c, o.numero + ': documentação entregue, OS fechada.'); salvar(); pintar(); });
}

// ── como usar ──────────────────────────────────────────────────────────────
function comoUsar(){
  janela('Como usar o protótipo', '<p style="margin-top:0">É a tela de <b>Contratos</b> como deve ficar no TapFlow (desenho de 27/10). <b>Nada aqui vai para o sistema</b>: os dados são fictícios e o que você lança fica guardado só neste navegador, neste aparelho.</p>'
    + '<ol><li>Abra o contrato <b>2026901</b> (Indústria Exemplo) e passe pelas abas: Resumo, Itens e preços, Vasos, Mobilizações.</li>'
    + '<li>Na aba Mobilizações, abra a <b>OS-2026901-M10</b> (setembro e outubro): preencha os RDOs que faltam, encerre a execução e feche a medição.</li>'
    + '<li>Veja o <b>boletim</b> (as duas folhas) e baixe o Excel. Depois, informe o pedido do cliente (K03) e simule o faturamento.</li>'
    + '<li>Teste a <b>Nova visita</b> (cria a M11), o <b>aditivo</b> de preço, o vaso sem volume (VP-104) e o vaso de 12 m³ (VP-105, sem preço de teste hidrostático).</li>'
    + '<li>Use <b>"Ver como"</b>, no alto, para ver o que o inspetor e o escritório enxergam: cada um só vê os botões que pode usar.</li></ol>'
    + '<p>Anote o que estranhar e mande para o Bruno. <b>"Recomeçar do zero"</b> volta tudo ao início.</p>');
}

// ── início ─────────────────────────────────────────────────────────────────
(function boot(){
  const s = (window.Nucleo && typeof Nucleo.sessao === 'function' && Nucleo.sessao()) || {};
  const NO_SERVIDOR = /^https?:$/.test(location.protocol), LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  if (!s.token && NO_SERVIDOR && !(LOCAL && /semlogin/.test(location.search))){
    $('tela').innerHTML = '<div class="card"><h1>Entre no TapFlow primeiro</h1><p>O protótipo usa o seu login do TapFlow. <a href="../../">Ir para o início</a> e voltar a este endereço depois de entrar.</p></div>';
    try{ sessionStorage.setItem('tf_volta_prototipo', location.href); }catch(e){}
    return;
  }
  $('quem').textContent = (s.nome || s.email || '') ;
  try{ COMO = localStorage.getItem(CHAVE + '_como') || 'admin'; }catch(e){}
  $('como').value = COMO;
  $('como').addEventListener('change', () => { COMO = $('como').value; try{ localStorage.setItem(CHAVE + '_como', COMO); }catch(e){} pintar(); });
  S = carregar();
  $('btZerar').addEventListener('click', () => janela('Recomeçar do zero', '<p>Apaga o que você lançou neste navegador e volta aos dados de exemplo.</p>', [{ rotulo:'Cancelar' }, { rotulo:'Recomeçar', classe:'pri', acao:() => { try{ localStorage.removeItem(CHAVE); }catch(e){} S = inicial(); salvar(); ir({}); pintar(); toast('Tudo de volta ao início.', 'ok'); } }]));
  $('btComo').addEventListener('click', comoUsar);
  $('menuBt').addEventListener('click', () => $('nav').classList.toggle('aberto'));
  $('navCtr').addEventListener('click', () => ir({}));
  document.querySelectorAll('[data-x]').forEach(b => b.addEventListener('click', () => toast('No protótipo só a tela de Contratos funciona.')));
  pintar();
  try{ if (!localStorage.getItem(CHAVE + '_visto')){ localStorage.setItem(CHAVE + '_visto', '1'); comoUsar(); } }catch(e){}
})();
