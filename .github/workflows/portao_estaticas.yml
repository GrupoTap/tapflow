# Portão do TapHub, parte rápida (P1) — CÓPIA IGUAL da fonte no brunoengetap/tapflow-privado
# (portao/publico/portao_estaticas.yml). Roda o código DO Pull request (aviso em ~1 min): a conferência do código
# (conferir_codigo.mjs: sintaxe de cada página, nome que não existe, chave repetida, onclick para função que não
# existe, e-mail de verdade). NÃO é o sinal obrigatório: o obrigatório é "portão" (portao.yml), que confere o mesmo
# e mais, com a versão do privado. Sem segredo nenhum.
name: portao-rapido

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: portao-rapido-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  estaticas:
    name: conferência do código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Conferência do código (sintaxe, nomes, onclick, e-mail)
        run: |
          cd .github/portao && npm ci --ignore-scripts --no-audit --no-fund --silent && cd ../..
          node .github/portao/conferir_codigo.mjs .
